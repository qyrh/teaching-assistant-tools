:absolute;top:-13px;left:12px;background:var(--p);color:#fff;font-size:14px;font-weight:800;border-radius:8px;padding:2px 10px;box-shadow:0 2px 4px rgba(0,0,0,.15)}.eqCard.isDerived .eqLabel{background:#8a4fd3}.eqCard .eqBody{font-size:20px;font-weight:700;letter-spacing:.5px;line-height:1.7}.eqCard.dim{opacity:.42}.eqCard.hot{border-color:var(--p);box-shadow:0 0 0 3px var(--pl)}.eqCard.pulse{animation:pulse .7s ease 2}.eqCard .multBadge{position:absolute;top:-13px;right:10px;background:#ff9800;color:#fff;font-size:15px;font-weight:900;border-radius:9px;padding:2px 10px;box-shadow:0 2px 4px rgba(0,0,0,.18)}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05);border-color:var(--ok)}}.wobble{animation:wob .5s ease}@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-3.5deg)}75%{transform:rotate(3.5deg)}}.sx{color:#d8432f}.sy{color:#1f66c9}.sz{color:#5a4fd3}.sk{color:#c07a00}.sm{color:#8a4fd3}.sn{color:#c23c9d}.sa{color:#0e9f6e}.sb{color:#b06210}.sc2{color:#6a7076}#workspace{background:var(--card);border:2.5px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 14px rgba(40,70,110,.08);min-height:280px}.stepHead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.stepHead .stepNo{background:var(--p);color:#fff;border-radius:9px;font-weight:800;font-size:15px;padding:3px 11px;white-space:nowrap}.stepHead .stepName{font-size:19px;font-weight:800;color:var(--pd)}.stepHead .stepTip{font-size:14.5px;color:var(--sub);width:100%;line-height:1.6}.tray{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}.trayLabel{font-size:15px;color:var(--sub);font-weight:700}.chip{display:inline-block;background:linear-gradient(180deg,#fff,var(--pl));border:2.5px solid var(--p);border-radius:12px;color:var(--pd);font-size:19px;font-weight:900;padding:8px 16px;box-shadow:0 3px 0 var(--pd);cursor:grab;touch-action:none;transition:transform .12s}.chip:hover{transform:translateY(-2px)}.chip.opChip{background: tion:absolute;top:50%;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--p) 70%);border:3px solid #fff;box-shadow:0 3px 8px rgba(20,60,110,.4);transform:translate(-50%,-50%);cursor:grab;touch-action:none}#knob.locked{background:radial-gradient(circle at 35% 30%,#d7ffe9,var(--ok) 70%);cursor:default}#knobBubble{position:absolute;bottom:46px;left:50%;transform:translateX(-50%);background:var(--pd);color:#fff;font-size:17px;font-weight:900;border-radius:9px;padding:3px 10px;white-space:nowrap}#knobBubble::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--pd)}.tick{position:absolute;top:100%;width:1.5px;height:6px;background:#b6c6d6}.tick.big{height:10px;background:#7f93a6}.tickLab{position:absolute;top:calc(100% + 12px);transform:translateX(-50%);font-size:13px;color:#7f93a6}#lockFlash{text-align:center;font-size:18px;font-weight:900;color:var(--ok);min-height:26px}.slotDot{position:absolute;top:-24px;left:50%;transform:translateX(-50%);width:30px;height:30px;border-radius:50%;border:2.5px dashed var(--p);background:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:var(--p)}.slotDot.hoverOn{background:var(--pl)}.slotDot.filled{border-style:solid;background:var(--p);color:#fff}.termSpan{position:relative;display:inline-block;padding:0 3px}.noteBox{background:linear-gradient(160deg,#f2fbf6,#e6f7ee);border:2.5px solid var(--ok);border-radius:14px;padding:18px;font-size:18px;line-height:2;font-weight:700}.bigBtn{display:inline-block;background:var(--p);color:#fff;font-size:19px;font-weight:900;border-radius:12px;padding:10px 30px;margin-top:14px;box-shadow:0 3px 0 var(--pd)}.bigBtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--pd)}.starRow{display:flex;gap:10px;justify-content:center;margin:10px 0 4px}.starRow svg{width:52px;height:52px}#hintbar{background:#fffbe8;border:2px solid #f2dc94; <header id="topbar">

    <div id="paletteDots">本局工坊涂装：<b id="paletteName">湖水蓝</b>（每局随机换装）</div>
    <div id="diffRow"></div>
    <div id="homeFoot">
      三个难度 · 每局随机抽 3 关 · 题目出自《初中计算全解 · 第四章 二元一次方程组 · 过关检测》<br>
      消元台：配倍率、选加减，让未知数消失 ｜ 天平台：拖旋钮调平，解出未知数 ｜ 代入台：拖解卡片，方程当场变身

  </section>

  <!-- ======================= 游戏页 ======================= -->
  <section id="screenGame" class="hidden">
    <aside id="missionBox">

<div id="modalMask" class="hidden"><div id="modalBox"></div></div>

</div>

<script>"use strict";function gcdInt(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t}return a||1}function R(n,d){if(!d){d=1}if(d<0){n=-n;d=-d}var g=gcdInt(n,d);return{n:n/g,d:d/g}}function rAdd(a,b){return R(a.n*b.d+b.n*a.d,a.d*b.d)}function rSub(a,b){return R(a.n*b.d-b.n*a.d,a.d*b.d)}function rMul(a,b){return R(a.n*b.n,a.d*b.d)}function rIsZero(a){return a.n===0}function rEq(a,b){return a.n===b.n&&a.d===b.d}function rNum(a){return a.n/a.d}function rStr(a){if(a.d===1){return String(a.n)}return a.n+"/"+a.d}function lcmInt(a,b){return Math.abs(a/gcdInt(a,b)*b)}function shuffleArr(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}function clamp(v,lo,hi){return v<lo?lo:v>hi?hi:v}function el(id){return document.getElementById(id)}var SYM_CLASS={x:"sx",y:"sy",z:"sz",k:"sk",m:"sm",n:"sn",a:"sa",b:"sb",c:"sc2"};function paintMath(s){return s.replace(/[xyzkmnabc]/g,function(ch){return'<b class="'+SYM_CLASS[ch]+'">'+ch+"</b>"})}function termStr(coef,sym){if(coef.n===coef.d){return sym}if(coef.n===-coef.d){return"−"+sym}var s=rStr(coef);if(s.charAt(0)==="-"){return"−"+s.slice(1)+sym}return s+sym}var SYM_ORDER=["x","y","z","k","m","n","a","b","c"];function coeffsToStr(coeffs,rhs){var parts=[],first=true;for(var i=0;i<SYM_ORDER.length;i++){var s=SYM_ORDER[i];if(!coeffs[s]||rIsZero(coeffs[s])){continue}var c=coeffs[s];if(first){parts.push(termStr(c,s));first=false}else{if(c.n<0){parts.push(" − "+termStr(rMul(c,R(-1)),s))}else{parts.push(" + "+termStr(c,s))}}}var left=parts.length?parts.join(""):"0";var r=rStr(rhs);if(r.charAt(0)==="-"){r="−"+r.slice(1)}return left+" = "+r}function canonicalize(coeffs,rhs){var syms=[],den=1,i;for(i=0;i<SYM_ORDER.length;i++){var s=SYM_ORDER[i];if(coeffs[s]&&!rIsZero(coeffs[s])){syms.push(s);den=lcmInt(den,coeffs[s].d)}}den=lcmInt(den,rhs.d);var nums={};var all=[];for(i=0;i<syms.length;i++){var c=rMul(coeffs[syms[i]],R(den));nums[syms[i]]=c.n;all.push(Math.abs(c.n))}var rr=rMul(rhs,R(den));all.push(Math.abs(rr.n));var g=all[0]||1;for(i=1;i<all.length;i++){g=gcdInt(g,all[i])}if(g===0){g=1}var out={},negFirst=false;for(i=0;i<syms.length;i++){out[syms[i]]=R(nums[syms[i]]/g,1);if(i===0&&nums[syms[i]]<0){negFirst=true}}var outRhs=R(rr.n/g,1);if(negFirst){for(i=0;i<syms.length;i++){out[syms[i]]=rMul(out[syms[i]],R(-1))}outRhs=rMul(outRhs,R(-1))}return{coeffs:out,rhs:outRhs}}function combineEq(A,p,B,q,op){var syms={},i,s;for(i=0;i<SYM_ORDER.length;i++){s=SYM_ORDER[i];if(A.coeffs[s]&&!rIsZero(A.coeffs[s])||B.coeffs[s]&&!rIsZero(B.coeffs[s])){syms[s]=true}}var coeffs={};for(s in syms){var ca=A.coeffs[s]||R(0),cb=B.coeffs[s]||R(0);var v=rAdd(rMul(p,ca),rMul(R(op),rMul(q,cb)));if(!rIsZero(v)){coeffs[s]=v}}var rhs=rAdd(rMul(p,A.rhs),rMul(R(op),rMul(q,B.rhs)));return canonicalize(coeffs,rhs)}var LEVELS={S1:{title:"倍率配对 · 消元初体验",diff:1,mission:"解方程组：<span class='meq'>5x + 6y = 16</span> 与 <span class='meq'>3x − 2y = 4</span>。",cards:[{label:"式一",display:"5x + 6y = 16",coeffs:{x:R(5),y:R(6)},rhs:R(16)},{label:"式二",display:"3x − 2y = 4",coeffs:{x:R(3),y:R(-2)},rhs:R(4)}],steps:[{t:"elim",a:0,b:1,goal:"y"},{t:"balance",sym:"x",A:R(14),B:R(0),C:R(28),show:"14x = 28",note:"y 消失了，先解出 x"},{t:"balance",sym:"y",A:R(6),B:R(10),C:R(16),show:"把 x = 2 代入式一：10 + 6y = 16",note:"回代求 y"}],finish:"所以方程组的解是 x = 2，y = 1。",point:"加减消元法：把两个方程适当放大再相加/相减，让一个未知数的系数先变成 0。",reveal:"式一 5x + 6y = 16，式二 3x − 2y = 4。\n式二 × 3 得 9x − 6y = 12；\n式一 + 式二×3 得 14x = 28，解得 x = 2。\n把 x = 2 代入式一：10 + 6y = 16，解得 y = 1。\n所以方程组的解是 x = 2，y = 1。"},S2:{title:"双倍放大 · 消元进阶",diff:1,mission:"解方程组：<span class='meq'>2x − 7y = 40</span> 与 <span class='meq'>3x − 8y = 50</span>。",cards:[{label:"式一",display:"2x − 7y = 40",coeffs:{x:R(2),y:R(-7)},rhs:R(40)},{label:"式二",display:"3x − 8y = 50",coeffs:{x:R(3),y:R(-8)},rhs:R(50)}],steps:[{t:"elim",a:0,b:1,goal:"x"},{t:"balance",sym:"y",A:R(5),B:R(0),C:R(-20),show:"5y = −20",note:"x 消失了，先解出 y"},{t:"balance",sym:"x",A:R(2),B:R(28),C:R(40),show:"把 y = −4 代入式一：2x + 28 = 40",note:"回代求 x"}],finish:"所以方程组的解是 x = 6，y = −4。",point:"两个式子都要放大：式一×3、式二×2 再相减，x 的系数就都变成 6 啦。",reveal:"式一 × 3 得 6x − 21y = 120；式二 × 2 得 6x − 16y = 100；\n两式相减得 −5y = 20，即 5y = −20，解得 y = −4。\n把 y = −4 代入式一：2x + 28 = 40，解得 x = 6。\n所以方程组的解是 x = 6，y = −4。"},S3:{title:"负数迷宫 · 细心消元",diff:2,mission:"解方程组：<span class='meq'>2x − 3y = 1</span> 与 <span class='meq'>4x − 3y = −5</span>（答案可能是分数哦）。",cards:[{label:"式一",display:"2x − 3y = 1",coeffs:{x:R(2),y:R(-3)},rhs:R(1)},{label:"式二",display:"4x − 3y = −5",coeffs:{x:R(4),y:R(-3)},rhs:R(-5)}],steps:[{t:"elim",a:0,b:1,goal:"y"},{t:"balance",sym:"x",A:R(2),B:R(0),C:R(-6),show:"2x = −6",note:"y 消失了，先解出 x"},{t:"balance",sym:"y",A:R(-3),B:R(-6),C:R(1),show:"把 x = −3 代入式一：−6 − 3y = 1",note:"回代求 y，天平刻度会以分数显示"}],finish:"所以方程组的解是 x = −3，y = −7/3。",point:"y 的系数本来就相同，直接相减就能消去 y；分数解照样能用天平调出来。",reveal:"式二 − 式一 得 2x = −6，解得 x = −3。\n把 x = −3 代入式一：−6 − 3y = 1，即 −3y = 7，解得 y = −7/3。\n所以方程组的解是 x = −3，y = −7/3。"},S4:{title:"连比密码 · 设参妙解",diff:3,mission:"解方程组（连比型）：<span class='meq'>x/2 = y/3 = z/4</span>，并且 <span class='meq'>4x − 3y + z = 6</span>。把三张比值卡拖进方程里试试！",cards:[{label:"式一",display:"x/2 = y/3 = z/4",coeffs:null,rhs:null},{label:"式二",display:"4x − 3y + z = 6",coeffs:{x:R(4),y:R(-3),z:R(1)},rhs:R(6)}],steps:[{t:"plugSlots",eq:1,slots:[{sym:"x",chip:"cx",turn:"4×(2k) = 8k"},{sym:"y",chip:"cy",turn:"−3×(3k) = −9k"},{sym:"z",chip:"cz",turn:"1×(4k) = 4k"}],chips:[{id:"cx",label:"x = 2k"},{id:"cy",label:"y = 3k"},{id:"cz",label:"z = 4k"}],note:"设 x/2 = y/3 = z/4 = k，则 x = 2k、y = 3k、z = 4k，把这三张卡片拖到对应位置"},{t:"balance",sym:"k",A:R(3),B:R(0),C:R(6),show:"8k − 9k + 4k = 3k，得 3k = 6",note:"合并同类项后调平天平，解出 k"}],finish:"k = 2，所以 x = 4，y = 6，z = 8，即方程组的解是 x = 4，y = 6，z = 8。",point:"连比问题设参数 k：三个未知数一起用 k 表示，三元立刻变一元。",reveal:"设 x/2 = y/3 = z/4 = k，则 x = 2k，y = 3k，z = 4k。\n代入 4x − 3y + z = 6：8k − 9k + 4k = 6，即 3k = 6，解得 k = 2。\n所以 x = 4，y = 6，z = 8。"},P1:{title:"解的身份证 · 代入定参",diff:2,mission:"已知 x = −1，y = 2 是方程组 <span class='meq'>x + a·y = 3</span> 与 <span class='meq'>b·x − y = 1</span> 的解，求 a + b 的值。",cards:[{label:"式一",display:"x + a·y = 3",coeffs:null,rhs:null},{label:"式二",display:"b·x − y = 1",coeffs:null,rhs:null}],steps:[{t:"plug",chips:[{id:"sol",label:"解 (−1, 2)"}],drops:[{chip:"sol",eq:0,derive:{label:"式一 · 代入解",display:"−1 + 2a = 3"},balance:{sym:"a",A:R(2),B:R(-1),C:R(3),show:"−1 + 2a = 3"}},{chip:"sol",eq:1,derive:{label:"式二 · 代入解",display:"−b − 2 = 1"},balance:{sym:"b",A:R(-1),B:R(-2),C:R(1),show:"−b − 2 = 1"}}],wrongHint:"把解卡片拖到还没代入的式子上，两个式子都要代入哦"}],finish:"解得 a = 2，b = −3，所以 a + b = 2 + (−3) = −1。",point:"已知方程组的解，就把解代回方程组 —— 未知数瞬间变成参数方程。",reveal:"把 x = −1，y = 2 代入式一：−1 + 2a = 3，解得 a = 2；\n代入式二：−b − 2 = 1，解得 b = −3。\n所以 a + b = 2 + (−3) = −1。"},P2:{title:"双参配对 · 各自归位",diff:2,mission:"已知 x = 3，y = 1 是方程组 <span class='meq'>a·x + y = 7</span> 与 <span class='meq'>x + b·y = 5</span> 的解，求 a、b 的值。",cards:[{label:"式一",display:"a·x + y = 7",coeffs:null,rhs:null},{label:"式二",display:"x + b·y = 5",coeffs:null,rhs:null}],steps:[{t:"plug",chips:[{id:"sol",label:"解 (3, 1)"}],drops:[{chip:"sol",eq:0,derive:{label:"式一 · 代入解",display:"3a + 1 = 7"},balance:{sym:"a",A:R(3),B:R(1),C:R(7),show:"3a + 1 = 7"}},{chip:"sol",eq:1,derive:{label:"式二 · 代入解",display:"3 + b = 5"},balance:{sym:"b",A:R(1),B:R(3),C:R(5),show:"3 + b = 5"}}],wrongHint:"两个式子都要代入这张解卡片"}],finish:"解得 a = 2，b = 2。",point:"解是两个方程公共的「身份证」，每个方程代入后都能独立解出一个参数。",reveal:"把 x = 3，y = 1 代入式一：3a + 1 = 7，解得 a = 2；\n代入式二：3 + b = 5，解得 b = 2。"},P3:{title:"数字变身 · m、n 现形",diff:1,mission:"已知 x = 1，y = 2 是方程组 <span class='meq'>2x + m·y = 8</span> 与 <span class='meq'>n·x − y = 1</span> 的解，求 m、n 的值。",cards:[{label:"式一",display:"2x + m·y = 8",coeffs:null,rhs:null},{label:"式二",display:"n·x − y = 1",coeffs:null,rhs:null}],steps:[{t:"plug",chips:[{id:"sol",label:"解 (1, 2)"}],drops:[{chip:"sol",eq:0,derive:{label:"式一 · 代入解",display:"2 + 2m = 8"},balance:{sym:"m",A:R(2),B:R(2),C:R(8),show:"2 + 2m = 8"}},{chip:"sol",eq:1,derive:{label:"式二 · 代入解",display:"n − 2 = 1"},balan
