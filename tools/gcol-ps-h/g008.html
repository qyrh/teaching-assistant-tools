<style>*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}body{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;background:var(--pbg);color:var(--ptxt);--p1:#0e7490;--p2:#f59e0b;--pbg:#f0f9ff;--ptxt:#0f172a;transition:background .4s}#hd{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--p1);color:#fff;padding:10px 16px;box-shadow:0 3px 10px rgba(0,0,0,.18)}#hd .logo{font-size:22px;font-weight:800;letter-spacing:1px}#hd .sub{font-size:14px;opacity:.9}#hd .hud{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.hud .chip{background:rgba(255,255,255,.18);border-radius:999px;padding:6px 14px;font-size:16px;font-weight:700;white-space:nowrap}.hud .stars{color:#ffd93b;text-shadow:0 0 6px rgba(255,217,59,.8);letter-spacing:2px}.hud button{border:2px solid #fff;background:transparent;color:#fff;font-size:15px;font-weight:700;border-radius:999px;padding:6px 14px;cursor:pointer}.hud button:hover{background:rgba(255,255,255,.22)}main{max-width:980px;margin:0 auto;padding:16px 14px 60px}.hero{text-align:center;padding:34px 10px 20px}.hero h1{font-size:34px;color:var(--p1);text-shadow:1px 2px 0 rgba(0,0,0,.06)}.hero p{font-size:18px;margin-top:10px;line-height:1.7}.diffs{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:26px}.diffcard{flex:1 1 260px;max-width:300px;background:#fff;border-radius:18px;padding:22px 18px;cursor:pointer;border:4px solid var(--p1);box-shadow:0 6px 16px rgba(0,0,0,.10);transition:transform .15s,box-shadow .15s}.diffcard:hover{transform:translateY(-6px);box-shadow:0 12px 22px rgba(0,0,0,.16)}.diffcard h3{font-size:24px;color:var(--p1)}.diffcard .en{font-size:14px;color:#888;margin:4px 0 10px}.diffcard p{font-size:15px;line-height:1.65;text-align:left}.diffcard .lv{margin-top:10px;font-size:14px;color:var(--p2);font-weight:700}.level{background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 14px rgba(0,0,0,.08)}.lvhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}.tag{background:var(--p1);color:#fff;border-radius:999px;padding:5px 14px;font-size:15px;font-weight:700}.tag.b{background:var(--p2)}.lvhead h2{font-size:23px;color:var(--p1)}.story{background:var(--pbg);border:2px dashed var(--p1);border-radius:12px;padding:12px 16px;font-size:19px;line-height:1.8;max-height:210px;overflow:auto;margin-bottom:12px}.goal{background:#fff7ed;border:3px solid var(--p2);border-radius:12px;padding:10px 16px;font-size:18px;font-weight:700;margin-bottom:12px}.board{border:2px solid var(--p1);border-radius:14px;overflow:hidden;background:#fff;margin-bottom:12px}.board canvas{display:block;width:100%;height:auto;touch-action:none;cursor:default}.ctrls{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;margin-bottom:12px}.ctrl{display:flex;flex-direction:column;gap:6px;min-width:230px;flex:1}.ctrl label{font-size:16px;font-weight:700}.ctrl input[type=range]{width:100%;height:34px;cursor:pointer;accent-color:var(--p1)}.ctrl .val{font-size:17px;color:var(--p1);font-weight:800}.reads{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}.read{background:var(--pbg);border:2px solid var(--p1);border-radius:10px;padding:8px 14px;font-size:16px}.read b{display:block;font-size:20px;color:var(--p1)}.read.hit{background:#dcfce7;border-color:#16a34a}.read.hit b{color:#16a34a}.lvbtns{display:flex;flex-wrap:wrap;gap:10px}.btn{border:none;border-radius:12px;padding:12px 22px;font-size:17px;font-weight:800;cursor:pointer;background:var(--p1);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.15)}.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(2px);box-shadow:none}.btn.o{background:var(--p2)}.btn.g{background:#16a34a}.btn.w{background:#64748b}#overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;z-index:100;align-items:center;justify-content:center;padding:16px}#overlay.show{display:flex}#box{background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:26px}#box h3{font-size:24px;color:var(--p1);margin-bottom:14px}#box .body{font-size:18px;line-height:1.9}#box .body .ans{color:#16a34a;font-weight:800;font-size:20px}#box .btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;justify-content:flex-end}#fx{position:fixed;inset:0;pointer-events:none;z-index:200}.winban{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:210;text-align:center;pointer-events:none;animation:pop .6s ease-out}.winban .t1{font-size:40px;font-weight:900;color:#16a34a;text-shadow:2px 3px 0 #fff,0 0 24px #ffd93b}.winban .t2{font-size:20px;font-weight:700;margin-top:6px;color:#0f172a;background:#ffffffcc;border-radius:999px;padding:6px 18px;display:inline-block}@keyframes pop{0%{transform:translateX(-50%) scale(.2);opacity:0}70%{transform:translateX(-50%) scale(1.15)}100%{transform:translateX(-50%) scale(1);opacity:1}}.bigstar{position:fixed;top:22%;left:50%;transform:translateX(-50%);z-index:205;font-size:110px;pointer-events:none;color:#ffd93b;text-shadow:0 0 30px #ffb703;animation:spin 1.2s ease-out}@keyframes spin{0%{transform:translateX(-50%) rotate(0) scale(0)}100%{transform:translateX(-50%) rotate(360deg) scale(1)}}@media(max-width:640px){#hd .logo{font-size:18px}.story{font-size:17px}.goal{font-size:16px}.lvhead h2{font-size:19px}.btn{padding:10px 16px;font-size:15px}}

<body>

  <span class="logo">行程探险队·杯赛真题岛</span>

<script>function $(s){return document.querySelector(s)}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1}function fmtFrac(n,d){const g=gcd(n,d);return n/g+"/"+d/g}const G={diff:null,pool:[],levels:[],idx:0,stars:0,steps:0,t0:0,timer:null,cur:null,palette:0};const PALETTES=[{p1:"#0e7490",p2:"#f59e0b",pbg:"#f0f9ff"},{p1:"#15803d",p2:"#ea580c",pbg:"#f0fdf4"},{p1:"#c2410c",p2:"#0284c7",pbg:"#fff7ed"},{p1:"#6d28d9",p2:"#db2777",pbg:"#f5f3ff"},{p1:"#0f766e",p2:"#ca8a04",pbg:"#f0fdfa"},{p1:"#be123c",p2:"#2563eb",pbg:"#fff1f2"}];function applyPalette(){const p=PALETTES[G.palette];document.body.style.setProperty("--p1",p.p1);document.body.style.setProperty("--p2",p.p2);document.body.style.setProperty("--pbg",p.pbg)}function countStep(){G.steps++;$("#hStep").textContent=G.steps}function startTimer(){G.t0=Date.now();clearInterval(G.timer);G.timer=setInterval(()=>{const s=Math.floor((Date.now()-G.t0)/1e3);$("#hTime").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")},1e3)}function showModal(title,bodyHTML,btns){const ov=$("#overlay"),box=$("#box");box.innerHTML="<h3>"+title+"</h3><div class='body'>"+bodyHTML+"</div><div class='btnrow' id='mbtns'></div>";(btns||[{t:"知道了",c:"btn",f:closeModal}]).forEach(b=>{const el=document.createElement("button");el.className=b.c||"btn";el.textContent=b.t;el.onclick=b.f;$("#mbtns").appendChild(el)});ov.classList.add("show")}function closeModal(){$("#overlay").classList.remove("show")}const fx=$("#fx"),fctx=fx.getContext("2d");let fxParts=[],fxRun=false;function fxResize(){fx.width=innerWidth;fx.height=innerHeight}addEventListener("resize",fxResize);fxResize();function confetti(n){const cols=["#f59e0b","#16a34a","#2563eb","#db2777","#ffd93b","#0e7490"];for(let i=0;i<n;i++){fxParts.push({x:Math.random()*fx.width,y:-20-Math.random()*fx.height*.3,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:5+Math.random()*7,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6.28,va:(Math.random()-.5)*.3})}if(!fxRun){fxRun=true;requestAnimationFrame(fxTick)}}function fxTick(){fctx.clearRect(0,0,fx.width,fx.height);fxParts=fxParts.filter(p=>p.y<fx.height+30);fxParts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;p.vy+=.05;fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.a);fctx.fillStyle=p.c;fctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);fctx.restore()});if(fxParts.length){requestAnimationFrame(fxTick)}else{fxRun=false;fctx.clearRect(0,0,fx.width,fx.height)}}function bigStar(){const s=document.createElement("div");s.className="bigstar";s.textContent="★";document.body.appendChild(s);setTimeout(()=>s.remove(),1400)}function winBanner(t1,t2,ms){const d=document.createElement("div");d.className="winban";d.innerHTML="<div class='t1'>"+t1+"</div><div class='t2'>"+t2+"</div>";document.body.appendChild(d);setTimeout(()=>d.remove(),ms||2400)}function makeCanvas(host,hgt){const cv=document.createElement("canvas");cv.style.aspectRatio="920/"+hgt;host.appendChild(cv);const ctx=cv.getContext("2d");function fit(){const w=cv.clientWidth||920,dpr=Math.min(devicePixelRatio||1,2);cv.width=Math.round(w*dpr);cv.height=Math.round(w*hgt/920*dpr);ctx.setTransform(cv.width/920,0,0,cv.width/920,0,0)}fit();addEventListener("resize",fit);function toX(e){const r=cv.getBoundingClientRect();return(e.clientX-r.left)*920/r.width}function toY(e){const r=cv.getBoundingClientRect();return(e.clientY-r.top)*hgt/r.height}return{cv,ctx,fit,toX,toY,H:hgt}}function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}function tx(c,s,x,y,size,col,align,bold){c.fillStyle=col||"#0f172a";c.font=(bold?"800 ":"600 ")+size+"px 'Microsoft YaHei',system-ui";c.textAlign=align||"center";c.textBaseline="middle";c.fillText(s,x,y)}function animHost(dur,onFrame,onEnd){let st=null,stop=false;function tick(ts){if(stop)return;if(st===null)st=ts;const p=Math.min(1,(ts-st)/dur);onFrame(p);if(p<1)requestAnimationFrame(tick);else if(onEnd)onEnd()}requestAnimationFrame(tick);return{stop(){stop=true}}}const LEVELS=[{key:"p_r1",diff:"P",type:"river",tag:"真题·练习1",name:"快艇返航调度",story:"快艇从A码头出发，沿河顺流而下，途经B码头后继续顺流驶向C码头，到达C码头后立即反向行驶回到B码头，共用10小时。若A、B两码头相距20千米，快艇在静水中航行的速度是40千米/时，河水的流速是10千米/时，求B、C两码头间的距离。",goal:'拖动沙盘里的 C 码头，让快艇"A→B→C→B"的往返总时间恰好等于 10 小时。',ans:"B、C两码头间的距离是 180 千米。",ana:"顺流速度 40+10=50（千米/时），A到B用时 20÷50=0.4（小时）；逆流速度 40-10=30（千米/时）。B、C间往返共用 10-0.4=9.6（小时），同一段路顺流与逆流的时间比 = 30:50 = 3:5，所以顺流用时 9.6×3÷8=3.6（小时），B、C间距离 = 3.6×50=180（千米）。",params:{AB:20,vs:40,vf:10,total:10,maxD:320,init:90}},{key:"p_e1",diff:"P",type:"esc",tag:"真题·练习8",name:"扶梯级数探秘",story:"小丁在商场搭一座电动扶梯下楼。如果他向下走14阶，则需用时30秒即可由电动扶梯顶部到达底部；如果他向下走28阶，则需用时18秒即可由电动扶梯顶部到达底部。请问这座电动扶梯静止时有多少级台阶露在外面?",goal:'调节扶梯的运行速度，让"方案一"和"方案二"数出的台阶总数一致——这个共同的总数就是扶梯的级数。',ans:"这座电动扶梯静止时有 49 级台阶露在外面。",ana:"设扶梯静止时有 x 级。第一种情况：走14阶用30秒，扶梯自己转了 (x-14) 级；第二种情况：走28阶用18秒，扶梯转了 (x-28) 级。扶梯速度不变：(x-14)÷30=(x-28)÷18，解得 x=49，即扶梯有49级。",params:{mode:"down2",a:14,t1:30,b:28,t2:18}},{key:"p_d1",diff:"P",type:"disT",tag:"真题·练习3",name:"电车发车间隔",story:"某人从甲地走往乙地。甲、乙两地之间有定时的电车往返，而且两地发车的间隔时间都相等。他发现每隔6分钟看到开过来一辆去甲地的电车，每隔12分钟看到开过去一辆去乙地的电车。问：电车每隔多少分钟从各自的始发站发车?",goal:'调节电车速度（行人速度记为1）。当"由迎面6分钟推算"与"由追及12分钟推算"的发车间隔重合时，就找到了真实发车间隔。',ans:"电车每隔 8 分钟从各自的始发站发车。",ana:"相邻两车间距离相等：6×(v电+v人)=12×(v电-v人)，解得 v电=3×v人。发车间隔 = 6×(3+1)÷3=8（分钟）。",params:{a:6,b:12}},{key:"p_r2",diff:"P",type:"river",tag:"变式·同题型",name:"快艇返航调度·再启航",story:"快艇从A码头出发，沿河顺流而下，途经B码头后继续顺流驶向C码头，到达C码头后立即反向行驶回到B码头，共用5.5小时。若A、B两码头相距30千米，快艇在静水中航行的速度是50千米/时，河水的流速是10千米/时，求B、C两码头间的距离。",goal:"拖动 C 码头，让往返总时间恰好等于 5.5 小时。",ans:"B、C两码头间的距离是 120 千米。",ana:"顺流速度 50+10=60（千米/时），A到B用时 30÷60=0.5（小时）；逆流速度 50-10=40（千米/时）。B、C间往返共用 5 小时，时间比 = 40:60 = 2:3，顺流用时 5×2÷5=2（小时），距离 = 60×2=120（千米）。",params:{AB:30,vs:50,vf:10,total:5.5,maxD:260,init:80}},{key:"p_e2",diff:"P",type:"esc",tag:"变式·同题型",name:"扶梯级数探秘·新商场",story:"小丁在商场搭一座电动扶梯下楼。如果他向下走15阶，则需用时36秒即可由扶梯顶部到达底部；如果他向下走27阶，则需用时24秒即可由扶梯顶部到达底部。请问这座电动扶梯静止时有多少级台阶露在外面?",goal:"调节扶梯速度，让两种走法数出的台阶总数一致。",ans:"这座电动扶梯静止时有 51 级台阶露在外面。",ana:"设扶梯有 x 级：(x-15)÷36=(x-27)÷24，即 24x-360=36x-972，解得 12x=612，x=51（级）。",params:{mode:"down2",a:15,t1:36,b:27,t2:24}},{key:"p_d2",diff:"P",type:"disT",tag:"变式·同题型",name:"电车发车间隔·新线路",story:"某人从甲地走往乙地，两地之间有定时的电车往返，发车间隔都相等。他发现每隔6分钟有一辆电车迎面驶来，每隔18分钟有一辆电车从后面追上他。问：电车每隔多少分钟发车一辆?",goal:"调节电车速度（行人速度记为1），让两个方向推算出的发车间隔重合。",ans:"电车每隔 9 分钟发车一辆。",ana:"6×(v电+v人)=18×(v电-v人)，解得 v电=2×v人；发车间隔 = 6×(2+1)÷2=9（分钟）。",params:{a:6,b:18}},{key:"m_s1",diff:"M",type:"shuttle",tag:"真题·练习6",name:"两班接送大调度",story:"甲、乙两班学生到离校65千米的植物园参观，但只有一辆汽车，一次只能乘坐一个班的学生。为了尽快到达植物园，两个班商定，由甲班先坐车，乙班先步行，同时出发，甲班学生在途中某地下车后步行去植物园，汽车则从某地立即返回去接在途中步行的乙班学生，然后载着乙班学生直接到植物园。如果甲、乙两班学生步行速度相同，汽车速度是他们步行速度的10倍，那么汽车应在距植物园多少千米处返回接乙班学生，才能使两班同时到达植物园?<br><small>（沙盘演示速度：步行5千米/时、汽车50千米/时，恰好10倍；结论只与倍数有关）</small>",goal:'拖动红色"下车点"小旗，让甲、乙两班的到达时刻完全相同（时间差为0）。',ans:"汽车应在距植物园 10 千米处返回接乙班学生。",ana:"两班同时出发、同时到达，乘车路程与步行路程分别相同，所以图中甲班步行段 = 乙班步行段（AB=CD）。乙班走完AB时，汽车走了A→C→B，是AB的10倍，所以BC=(10-1)÷2=4.5（倍AB），全程 = 6.5×AB = 65（千米），AB=CD=10（千米），即距植物园10千米处返回。",params:{S:65,vw:5,vc:50,label:"植物园"}},{key:"m_m1",diff:"M",type:"meetR",tag:"真题·练习5",name:"同一地点两次相遇",story:"甲、乙两车同时从A地出发，不停地往返行驶于A、B两地之间。已知甲车的速度比乙车快，并且两车出发后第一次和第二次迎面相遇都在途中C地。甲车的速度是乙车速度的多少倍?",goal:"调节甲、乙的速度比：红色点是第一次相遇点，蓝色点是第二次相遇点。让两个点重合在同一地点C，就找到了速度倍数。",ans:"甲车的速度是乙车速度的 2 倍。",ana:"第一次相遇两车合走2个全程，其中乙车走了AC段；第二次相遇两车又合走2个全程，乙车走了C地→B地→C地，即2个BC段。两次总行程相等，所以每次乙车走的路程相等：AC=2×BC。第一次到第二次相遇之间甲车走2个AC、乙车走2个BC，速度比 = 2AC:2BC = 2:1。",params:{}},{key:"m_p1",diff:"M",type:"speed",tag:"真题·练习4",name:"提速准时到达",story:"小周开车前往某会议中心，出发20分钟后，因为交通堵塞，中途延误了20分钟，为了按时到达会议中心，小周将车速提高了25%，小周从出发时算起到达会议中心共用了多少分钟?",goal:'拖动"原计划用时"滑块：绿色旗是计划到达时刻，橙色旗是实际到达时刻（堵车+提速后）。让两面旗重合，就能读出总用时。',ans:"小周从出发时算起到达会议中心共用了 120 分钟。",ana:"提速前后速度比 = 1:(1+25%)=4:5，则同一段路用时比 = 5:4。省出的时间正好是堵车的20分钟（1份），所以这段路原计划用时 20÷(5-4)×5=100（分钟），总用时 = 20+100=120（分钟）。",params:{t1:20,stall:20,pct:25,num:4,den:5,Tmin:60,Tmax:200}},{key:"m_d3",diff:"M",type:"disT",tag:"真题·练习9",name:"公交车发车间隔",story:"某人以匀速行走在一条公路上，公路的前后两端每隔相同的时间发一辆公共汽车。他发现每隔15分钟有一辆公共汽车追上他；每隔10分钟有一辆公共汽车迎面驶来擦身而过。问：公共汽车每隔多少分钟发车一辆?",goal:'调节公交车速度（行人速度记为1），让"由迎面10分钟"与"由追及15分钟"推算的发车间隔重合。',ans:"公共汽车每隔 12 分钟发车一辆。",ana:"设相邻两车相距s：s=(v人+v车)×10=(v车-v人)×15，解得 v车=5×v人。发车间隔 = s÷v车 = 10×6v人÷5v人 = 12（分钟）。",params:{a:10,b:15}},{key:"m_p2",diff:"M",type:"speed",tag:"变式·同题型",name:"提速准时到达·新行程",story:"小李开车前往会展中心，出发30分钟后，因为道路施工，中途延误了15分钟，为了按时到达会展中心，小李将车速提高了50%，小李从出发时算起到达会展中心共用了多少分钟?",goal:'拖动"原计划用时"滑块，让计划到达旗与实际到达旗重合。',ans:"小李从出发时算起到达会展中心共用了 75 分钟。",ana:"提速前后速度比 = 1:(1+50%)=2:3，用时比 = 3:2。省出的15分钟是1份，这段路原计划用时 15÷(3-2)×3=45（分钟），总用时 = 30+45=75（分钟）。",params:{t1:30,stall:15,pct:50,num:2,den:3,Tmin:40,Tmax:160}},{key:"m_s2",diff:"M",type:"shuttle",tag:"变式·同题型",name:"两班接送大调度·科技馆",story:"甲、乙两班学生到离校64千米的科技馆参观，只有一辆汽车（一次只能乘坐一个班）。甲班先坐车、乙班先步行，同时出发；甲班在途中某地下车后步行去科技馆，汽车立即返回接乙班，再载着乙班直达科技馆。两班学生步行速度都是4千米/时，汽车速度是52千米/时。汽车应在距科技馆多少千米处返回接乙班，才能使两班同时到达?",goal:'拖动红色"下车点"小旗，让甲、乙两班的到达时刻完全相同。',ans:"汽车应在距科技馆 8 千米处返回接乙班。",ana:"车速:步速 = 52:4 = 13:1。两班乘车段、步行段分别相同：BC=(13-1)÷2=6（倍AB），全程 = AB+6AB+AB = 8×AB = 64（千米），AB=CD=8（千米）。",params:{S:64,vw:4,vc:52,label:"科技馆"}},{key:"a_s3",diff:"A",type:"shuttle",tag:"真题·练习10",name:"两队拉练接送",story:"甲、乙两个中队同时从同一营地出发前往一个目的地进行野外拉练，甲中队有汽车可以装载正好一个中队的人员。为了让两个中队的队员同时尽快到达目的地，甲中队队员坐车出发一定时间后下车，让汽车回去接乙中队的队员，然后直接开往目的地，两个中队的队员恰好同时到达目的地。已知营地与目的地之间的距离为40千米，队员徒步速度为10千米/时，汽车行驶速度为50千米/时，则两个中队队员到达目的地一共要多少时间?",goal:'拖动红色"下车点"小旗，让甲、乙两队的到达时刻完全相同；通关后将显示总用时。',ans:"两个中队队员到达目的地一共要 1小时36分钟（汽车在距目的地10千米处折返）。",ana:"汽车速度是徒步的5倍。汽车折回接乙队时，乙队遇到汽车前走的路程为x，则总路程40千米相当于4x，x=10（千米）；汽车总行程 = (3+2+3)×10=80（千米），用时 80÷50=1.6（小时）= 1小时36分钟，这也是两队到达目的地所用的时间。",params:{S:40,vw:10,vc:50,label:"目的地"}},{key:"a_m2",diff:"A",type:"meetS",tag:"真题·练习12",name:"全程究竟多长",story:"甲、乙两车同时从A、B两地相对开出。第一次相遇后两车继续行驶，各自到达对方出发点后立即返回。第二次相遇时离B地的距离是A、B全程的1/5。已知甲车在第一次相遇时行了120千米。A、B两地相距多少千米?",goal:'拖动 B 地位置改变全程长：红点是第一次相遇点（甲行了120千米处），蓝点是第二次相遇点。让蓝点恰好落在"距B为全程1/5"的金色目标带内边界上（即蓝点与目标线重合）。',ans:"A、B两地相距 300 千米。",ana:"到第二次相遇，两车共行3个全程，甲车共行 120×3=360（千米），恰好 = 一个全程 + 离B的1/5全程。设全程为S：S + S/5 = 360，解得 S=300（千米）。检验：360-300=60=300×1/5，正确。",params:{d1:120,fn:1,fd:5,Smin:200,Smax:360}},{key:"a_rg",diff:"A",type:"ring",tag:"真题·练习11",name:"环形跑道变速赛",story:"环形跑道的长为2013米，A、B是直径的两端。甲、乙顺时针、丙逆时针同时从A点出发，甲每经过B点一次，速度就变为原来的2倍。已知乙、丙第一次相遇时，甲恰好第一次回到A点；乙第一次回到A点时，甲恰好第二次回到A点。那么，当甲和丙第一次相遇时，丙走了多少米?",goal:'调节乙、丙的速度（以甲的原速为单位）。点亮两盏条件灯后，按"运行"观看比赛，甲、丙第一次相遇时丙走的米数就是答案。',ans:"当甲和丙第一次相遇时，丙走了 549 米。",ana:"若甲不变速：乙、丙第一次相遇时甲走了3/4圈，所以 (v乙+v丙)=4/3×v甲；乙第一次回到A时甲走了9/8圈，所以 v乙=8/9×v甲；从而 v丙=4/3-8/9=4/9×v甲。据此推算，甲、丙第一次相遇时丙走了3/11圈：2013×3/11=549（米）。",params:{}},{key:"a_e3",diff:"A",type:"esc",tag:"真题·练习2",name:"逆行扶梯之谜",story:"小淘气乘正在下降的自动扶梯下楼，如果他一级一级地走下去，从扶梯的上端走到下端需要走36级台阶。如果小淘气沿原自动扶梯从下端走到上端（很危险哦，不要效仿！），需要用下楼时5倍的速度走60级台阶才能走到上端。请问这个自动扶梯在静止不动时有多少级台阶?",goal:"调节扶梯速度r（以下楼速度为单位）：下楼时扶梯同向送人（级数变多），上楼时扶梯逆向（级数变少）。让两种方向数出的级数一致。",ans:"这个自动扶梯在静止不动时有 54 级台阶。",ana:"上楼走60级的时间，下楼只能走 60÷5=12（级）；而下楼走了36级，所以下楼时间是上楼的 36÷12=3（倍）。设上楼期间扶梯走了x级，则下楼期间扶梯走了3x级：36+3x=60-x，解得 x=6，扶梯级数 = 60-6=54（级）。",params:{mode:"updown",down:36,up:60,k:5}},{key:"a_d4",diff:"A",type:"disR",tag:"真题·练习13",name:"起点站电车对开",story:"A、B两地是电车的两个起点站，每隔12分钟发一辆车，电车每小时行25千米。请问：(1)如果小明从A地坐电车去B地，那么他每隔多长时间会看见一辆电车迎面开来? (2)如果小明从B地步行走向A地，每小时行5千米，那么他每隔多长时间会看见一辆电车迎面开来? 每隔多长时间会有一辆电车从后面超过他?",goal:'调节小明的步行速度，让"迎面驶来间隔"=10分钟 且 "从后面超过间隔"=15分钟（对应第(2)问）；通关后可看第(1)问答案。',ans:"(1) 坐电车时每隔 6 分钟看见一辆迎面电车；(2) 步行时迎面每隔 10 分钟一辆、从后面每隔 15 分钟超过一辆。",ana:"相邻两车间距离 = 25×12/60 = 5（千米）。(1)坐车时相对速度 25+25=50（千米/时），间隔 = 5÷50×60=6（分钟）；(2)步行迎面：相对速度 25+5=30，间隔 = 5÷30×60=10（分钟）；从后面超过：相对速度 25-5=20，间隔 = 5÷20×60=15（分钟）。",params:{}},{key:"a_b1",diff:"A",type:"boat",tag:"真题·练习7",name:"轮船顺逆水往返",story:"一只轮船从甲港顺水而下到乙港，马上又从乙港逆水行回甲港，共用了8小时。已知顺水每小时比逆水每小时多行20千米，又知前4小时比后4小时多行60千米。那么，甲、乙两港相距多少千米?",goal:'调节顺水速度：观察"前4小时比后4小时多行的路程"，让它恰好等于60千米，此时全程距离就是答案。',ans:"甲、乙两港相距 150 千米。",ana:"前4小时比后4小时多行60千米，而顺水每小时比逆水多行20千米，所以前4小时中顺水用了 60÷20=3（小时），逆水用了 8-3=5（小时）。顺、逆速度比 = 5:3（同一段路用时反比），每份 = 20÷(5-3)=10（千米/时），顺水速度 = 50（千米/时），距离 = 50×3=150（千米）。",params:{diff:20,total:8,targetX:60,vmin:30,vmax:70,step:5}},{key:"a_m3",diff:"A",type:"meetS",tag:"变式·同题型",name:"全程究竟多长·新数据",story:"甲、乙两车同时从A、B两地相对开出。第一次相遇后两车继续行驶，各自到达对方出发点后立即返回。第二次相遇时离B地的距离是A、B全程的1/4。已知甲车在第一次相遇时行了100千米。A、B两地相距多少千米?",goal:'拖动 B 地位置，让第二次相遇点（蓝点）与"距B为全程1/4"的目标线重合。',ans:"A、B两地相距 240 千米。",ana:"到第二次相遇甲车共行 100×3=300（千米）= 全程 + 全程的1/4。设全程S：S+S/4=300，S=240（千米）。检验：300-240=60=240×1/4，正确。",params:{d1:100,fn:1,fd:4,Smin:180,Smax:300}},{key:"a_b2",diff:"A",type:"boat",tag:"变式·同题型",name:"轮船顺逆水往返·新水情",story:"一只轮船从甲港顺水而下到乙港，马上又从乙港逆水行回甲港，共用了8小时。已知顺水每小时比逆水每小时多行25千米，又知前4小时比后4小时多行50千米。那么，甲、乙两港相距多少千米?",goal:'调节顺水速度，让"前4小时比后4小时多行的路程"恰好等于50千米。',ans:"甲、乙两港相距 75 千米。",ana:"顺水时间 = 50÷25=2（小时），逆水 8-2=6（小时），速度比 = 6:2=3:1，每份 = 25÷(3-1)=12.5（千米/时），顺水速度 = 37.5（千米/时），距离 = 37.5×2=75（千米）。",params:{diff:25,total:8,targetX:50,vmin:25,vmax:60,step:2.5}}];function buildLevel(host,lvl,api){const els={};host.innerHTML="";const lv=document.createElement("div");lv.className="level";lv.innerHTML="<div class='lvhead'><span class='tag'>"+lvl.tag+"</span><span class='tag b'>"+lvl.name+"</span></div><div class='story'>"+lvl.story+"</div><div class='goal'>★ 目标："+lvl.goal+"</div>";const board=document.createElement("div");board.className="board";lv.appendChild(board);const ctr=document.createElement("div");ctr.className="ctrls";lv.appendChild(ctr);const rds=document.createElement("div");rds.className="reads";lv.appendChild(rds);const btns=document.createElement("div");btns.className="lvbtns";btns.innerHTML="<button class='btn w' id='lvBack'>返回难度选择</button>";lv.appendChild(btns);host.appendChild(lv);$("#lvBack").onclick=()=>{countStep();showDiff()};function chip(label,valFn){const d=document.createElement("div");d.className="read";d.innerHTML="<span>"+label+"</span><b>—</b>";rds.appendChild(d);return{d,b:d.querySelector("b"),set(v,hit){this.b.textContent=v;d.classList.toggle("hit",!!hit)}}}function slider(label,min,max,step,fmt,oninput,val){const w=document.createElement("div");w.className="ctrl";w.innerHTML="<label>"+label+"</label><input type='range'><div class='val'></div>"
