<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>概率探险岛 · 摸球转盘大闯关（第20讲下：概率初识）</title>
<style>
/* ===================== 基础与色板变量 ===================== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
  background:linear-gradient(160deg,var(--bgA) 0%,var(--bgB) 100%);
  color:#16213a;overflow-x:hidden;
}
:root{
  --p1:#1976d2; --p2:#42a5f5; --acc:#fb8c00; --bgA:#e3f2fd; --bgB:#f7fbff; --ink:#16213a;
}
#stage{max-width:1180px;margin:0 auto;padding:6px 14px 110px}
/* ===================== 顶部信息栏 ===================== */
#hud{position:sticky;top:0;z-index:60;display:flex;justify-content:space-between;align-items:center;
  background:var(--p1);color:#fff;padding:10px 16px;border-radius:0 0 18px 18px;
  box-shadow:0 4px 14px rgba(0,0,0,.20);gap:10px;flex-wrap:wrap}
#hudTitle{font-size:24px;font-weight:900;letter-spacing:1px}
#hudLevel{font-size:17px;font-weight:700;background:rgba(255,255,255,.22);padding:4px 12px;border-radius:999px}
.hud-right{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.92);color:var(--ink);font-weight:800;font-size:17px;
  padding:6px 14px;border-radius:999px;border:2px solid rgba(0,0,0,.08)}
.stat b{color:var(--p1);font-size:19px}
/* ===================== 底部按钮坞 ===================== */
#dock{position:fixed;bottom:0;left:0;right:0;z-index:60;display:flex;gap:10px;justify-content:center;
  background:rgba(255,255,255,.97);border-top:4px solid var(--p1);padding:10px 8px;flex-wrap:wrap}
.btn{font-size:18px;font-weight:800;padding:10px 20px;border:none;border-radius:14px;
  background:var(--acc);color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:.12s}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.ghost{background:#fff;color:var(--p1);border:3px solid var(--p1)}
.btn.big{font-size:24px;padding:16px 34px}
.btn.green{background:#2e7d32}
/* ===================== 主菜单 ===================== */
.menu-hero{text-align:center;padding:26px 8px 10px}
.menu-hero h1{font-size:44px;color:var(--p1);text-shadow:0 3px 0 rgba(0,0,0,.08)}
.menu-hero p{font-size:18px;color:#456;margin-top:8px;line-height:1.6}
.palette-tag{display:inline-block;margin-top:10px;background:#fff;border:3px dashed var(--p2);
  border-radius:999px;padding:6px 16px;font-weight:800;font-size:16px;color:var(--p1)}
.diff-wrap{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.diff-card{background:#fff;border-radius:22px;padding:22px 20px;width:300px;text-align:left;
  box-shadow:0 8px 20px rgba(20,40,90,.14);border-top:10px solid var(--p1)}
.diff-card h2{font-size:26px;color:var(--p1)}
.diff-card .d-sub{font-size:15px;color:#789;font-weight:700;margin:2px 0 10px}
.diff-card ul{list-style:none;font-size:16px;line-height:1.9;color:#345;margin:8px 0 14px}
.diff-card ul li::before{content:"◆ ";color:var(--acc)}
.menu-foot{text-align:center;color:#678;font-size:15px;margin-top:24px;line-height:1.8}
/* ===================== 任务面板 ===================== */
.mission{background:#fff;border-radius:20px;padding:18px;margin-top:16px;box-shadow:0 6px 18px rgba(20,40,90,.12)}
.m-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
  border-bottom:3px solid var(--bgA);padding-bottom:10px}
.m-head .t{font-size:23px;font-weight:900;color:var(--p1)}
.stars{font-size:24px;letter-spacing:3px;color:#cfd8dc}
.stars .on{color:#f9a825;text-shadow:0 0 6px rgba(249,168,37,.6)}
.m-story{font-size:20px;line-height:1.75;background:var(--bgA);border-left:8px solid var(--acc);
  padding:12px 16px;border-radius:10px;margin:12px 0}
.m-tip{font-size:16.5px;color:#546e7a;margin:6px 2px 10px;font-weight:700}
.m-body{margin-top:6px}
/* 目标牌与实时读数 */
.tgt{display:inline-flex;align-items:center;gap:10px;background:#fff;border:4px dashed var(--p1);
  padding:8px 16px;border-radius:16px;font-size:21px;font-weight:900;color:var(--p1);margin:6px 8px 6px 0}
.livebox{background:var(--bgA);border-radius:16px;padding:12px 16px;font-size:20px;font-weight:800;margin-top:10px;line-height:1.9}
.readout{font-size:21px;font-weight:900}
.ok-green{color:#2e7d32}
.bar{height:26px;background:#eceff1;border-radius:999px;overflow:hidden;border:2px solid #b0bec5;margin-top:6px}
.bar i{display:block;height:100%;background:var(--p1);transition:width .25s}
/* 分数显示（上下结构） */
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;
  font-weight:900;line-height:1.08;margin:0 5px;font-size:1.05em}
.frac b:first-child{border-bottom:3px solid currentColor;padding:0 7px}
.fv{font-size:1.15em;margin:0 2px}
/* 球 */
.ball{width:46px;height:46px;border-radius:50%;display:inline-block;border:3px solid rgba(0,0,0,.28);
  box-shadow:inset -5px -7px 9px rgba(0,0,0,.20),0 3px 6px rgba(0,0,0,.22);cursor:grab;touch-action:none;flex:none}
.ball.mini{width:27px;height:27px;border-width:2px;cursor:pointer;box-shadow:inset -3px -4px 5px rgba(0,0,0,.18)}
.ball.w{background:#fff !important}
.ball.dragging{opacity:.4}
.shelfrow{display:flex;align-items:center;gap:12px;background:#f5f8fb;border:2px solid #dbe6f0;
  border-radius:14px;padding:8px 12px;margin:6px 0;flex-wrap:wrap}
.cnt{font-size:18px;font-weight:900;color:#456;background:#fff;border:2px solid #cfd8dc;border-radius:999px;padding:2px 12px}
.bag{background:#fdfefe;border:4px solid var(--p2);border-radius:22px;padding:12px;min-height:110px;
  display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;justify-content:center}
.bagcap{font-size:17px;font-weight:800;color:#456;margin-top:6px;text-align:center}
/* 拖放区 */
.zone{border:4px dashed var(--p2);border-radius:16px;transition:.15s;padding:8px}
.zone.hot{border-color:var(--acc);background:rgba(251,140,0,.12)}
.zonelab{font-size:16px;font-weight:900;color:var(--p1);text-align:center;margin-bottom:6px}
.ghost{position:fixed;z-index:999;pointer-events:none;opacity:.92;
  transform:translate(-50%,-50%) scale(1.18);filter:drop-shadow(0 10px 12px rgba(0,0,0,.35))}
/* 布局工具 */
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.col{flex:1;min-width:270px}
.mf-pick{display:flex;align-items:center;gap:10px;cursor:grab}
/* 转盘 */
.wheelbox{text-align:center}
.wheelbox svg{max-width:260px;width:100%;height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.sector{cursor:pointer;stroke:#fff;stroke-width:3;transition:fill .15s}
.sector:hover{opacity:.85}
.tally{font-size:17px;font-weight:800;margin-top:6px;color:#456}
/* 表格列举 */
.gtable{display:grid;gap:6px;justify-content:center;margin:12px auto}
.ghead{font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;
  background:#eef3f8;border-radius:10px;padding:4px;min-height:46px;text-align:center;line-height:1.3}
.ghead .dot{width:18px;height:18px;border-radius:50%;display:inline-block;border:2px solid rgba(0,0,0,.3);margin-right:4px;vertical-align:-3px}
.gcell{width:66px;height:56px;border-radius:12px;border:3px solid #b0bec5;background:#fafcff;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;cursor:pointer;user-select:none;touch-action:manipulation}
.gcell.on{background:#ffd54f;border-color:#f9a825;box-shadow:0 0 0 4px rgba(249,168,37,.28)}
.gcell.hint{animation:pulse .7s infinite alternate}
.gcell.dis{background:#37474f;opacity:.6;cursor:not-allowed;color:#cfd8dc;font-size:13px}
@keyframes pulse{from{box-shadow:0 0 0 3px rgba(46,204,113,.4)}to{box-shadow:0 0 0 9px rgba(46,204,113,.85)}}
/* 线段拼三角 */
.seg{height:40px;border-radius:20px;background:linear-gradient(180deg,#00897b,#4db6ac);
  border:3px solid rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:900;font-size:18px;cursor:grab;touch-action:none;flex:none;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.slotrow{display:flex;flex-direction:column;gap:10px}
.slot{border:4px dashed var(--p2);border-radius:12px;min-height:52px;display:flex;
  align-items:center;justify-content:center;min-width:200px;padding:4px 10px}
.found-chip{display:inline-block;background:#e8f5e9;border:3px solid #66bb6a;color:#2e7d32;
  border-radius:999px;padding:4px 14px;font-weight:900;font-size:17px;margin:4px 6px 0 0}
#triCv{background:#fbfdff;border:2px solid #dbe6f0;border-radius:14px;display:block;margin:10px auto;max-width:100%}
/* 传话树 */
.treecol{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;margin:8px 0}
.node{background:#eef3f8;border:3px solid var(--p2);border-radius:14px;padding:10px 14px;
  font-weight:900;font-size:17px;color:var(--p1);text-align:center;line-height:1.4}
.chip{background:#fff;border:4px solid var(--p1);border-radius:16px;padding:10px 16px;text-align:center;
  font-weight:900;cursor:grab;touch-action:none;box-shadow:0 4px 8px rgba(0,0,0,.12);min-width:150px}
.chip .pth{font-size:19px;color:var(--p1)}
.chip .val{font-size:16px;color:#789;margin-top:2px}
.tray{min-height:120px}
.tray .sum{font-size:18px;font-weight:900;margin-top:6px;text-align:center}
.tray.good{border-color:#66bb6a;background:rgba(102,187,106,.10)}
.tray.bad{border-color:#ffb300;background:rgba(255,179,0,.10)}
/* 模态框与提示 */
#overlay{position:fixed;inset:0;background:rgba(10,20,40,.58);display:none;align-items:center;
  justify-content:center;z-index:200;padding:16px}
#overlay.show{display:flex}
.modal{background:#fff;border-radius:22px;max-width:760px;width:100%;max-height:86vh;overflow:auto;
  padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.35);border-top:12px solid var(--p1)}
.modal h2{font-size:28px;color:var(--p1);margin-bottom:12px}
.modal .mbody{font-size:19px;line-height:1.85}
.modal .mbtns{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.modal ul{margin:8px 0 8px 22px;line-height:1.9}
#toast{position:fixed;top:78px;left:50%;transform:translateX(-50%) translateY(-16px);z-index:400;
  background:rgba(22,33,58,.94);color:#fff;font-size:17px;font-weight:800;padding:10px 20px;
  border-radius:999px;opacity:0;pointer-events:none;transition:.25s;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* 动效 */
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .3s 2}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.pop{animation:pop .35s}
#fx{position:fixed;inset:0;z-index:300;pointer-events:none;display:none}
.small{font-size:16px;color:#678;font-weight:700}
.winbig{font-size:26px;font-weight:900;color:#2e7d32;text-align:center;margin-bottom:8px}
</style>
</head>
<body>
<div id="stage">
  <!-- 顶部信息栏：标题 / 关卡 / 用时 / 步数 -->
  <header id="hud">
    <div class="hud-left" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span id="hudTitle">概率探险岛</span>
      <span id="hudLevel">尚未出发</span>
    </div>
    <div class="hud-right">
      <div class="stat">用时 <b id="timer">00:00</b></div>
      <div class="stat">操作步数 <b id="steps">0</b></div>
    </div>
  </header>
  <main id="screen"></main>
</div>
<!-- 底部按钮坞 -->
<footer id="dock">
  <button class="btn ghost" id="btnRules">玩法说明</button>
  <button class="btn" id="btnReveal">揭示答案</button>
  <button class="btn ghost" id="btnRestart">重新开始本关</button>
  <button class="btn ghost" id="btnHome">返回难度选择</button>
</footer>
<div id="overlay"><div class="modal" id="modalBox"></div></div>
<div id="toast"></div>
<canvas id="fx"></canvas>

<script>
"use strict";
/* =====================================================================
   概率探险岛 —— 互动概率实验游戏
   改编自《第20讲（下）：概率初识》：古典概型（摸球/转盘/骰子/列举法）、
   加法原理、乘法原理、有/无放回、树状图、反向考虑。
   核心理念：学生通过“装袋、涂色、拼装、分类、列举”等操作构造概率，
   操作过程即思考过程，而不是先算好答案再提交。
   ===================================================================== */

/* ---------------- 基础工具 ---------------- */
function $(s){return document.querySelector(s);}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a||1;}
function simp(n,d){const g=gcd(n,d);return [n/g,d/g];}
function fracEq(n1,d1,n2,d2){const a=simp(n1,d1),b=simp(n2,d2);return a[0]===b[0]&&a[1]===b[1];}
function fracHTML(n,d){const s=simp(n,d);if(s[1]===1)return '<b class="fv">'+s[0]+'</b>';
  return '<span class="frac"><b>'+s[0]+'</b><b>'+s[1]+'</b></span>';}
function fracText(n,d){const s=simp(n,d);return s[1]===1?String(s[0]):(s[0]+'/'+s[1]);}
function fmtTime(sec){const m=Math.floor(sec/60),s=sec%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html)e.innerHTML=html;return e;}

/* ---------------- 色板（每局随机换装） ---------------- */
const PALETTES=[
 {name:'海洋蓝',p1:'#1565c0',p2:'#42a5f5',acc:'#fb8c00',bgA:'#e3f2fd',bgB:'#f8fbff'},
 {name:'草地绿',p1:'#2e7d32',p2:'#66bb6a',acc:'#f4511e',bgA:'#e8f5e9',bgB:'#fbfff8'},
 {name:'蜜桃橙',p1:'#e65100',p2:'#ffb74d',acc:'#5e35b1',bgA:'#fff3e0',bgB:'#fffdfa'},
 {name:'葡萄紫',p1:'#6a1b9a',p2:'#ab47bc',acc:'#00897b',bgA:'#f3e5f5',bgB:'#fdf7ff'},
 {name:'樱花粉',p1:'#ad1457',p2:'#f06292',acc:'#00838f',bgA:'#fce4ec',bgB:'#fffafd'},
 {name:'石墨青',p1:'#00695c',p2:'#26a69a',acc:'#ef6c00',bgA:'#e0f2f1',bgB:'#f6fffd'}
];
function applyPalette(){
  const pal=pick(PALETTES);
  const r=document.documentElement.style;
  r.setProperty('--p1',pal.p1);r.setProperty('--p2',pal.p2);r.setProperty('--acc',pal.acc);
  r.setProperty('--bgA',pal.bgA);r.setProperty('--bgB',pal.bgB);
  S.paletteName=pal.name;
  const tag=$('.palette-tag');if(tag)tag.textContent='本局主题色：'+pal.name;
}

/* ---------------- 全局状态 ---------------- */
const S={diff:0,missions:[],idx:0,steps:0,sec:0,timerH:null,started:false,locked:false,paletteName:'',revealed:0};

/* ---------------- 计时与步数 ---------------- */
function startTimer(){stopTimer();S.timerH=setInterval(function(){S.sec++;$('#timer').textContent=fmtTime(S.sec);},1000);}
function stopTimer(){if(S.timerH){clearInterval(S.timerH);S.timerH=null;}}
function addStep(){S.steps++;$('#steps').textContent=S.steps;}

/* ---------------- 提示气泡 ---------------- */
let toastH=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');
  if(toastH)clearTimeout(toastH);toastH=setTimeout(function(){t.classList.remove('show');},2200);}

/* ---------------- 模态框 ---------------- */
function showModal(html,buttons){
  const box=$('#modalBox');box.innerHTML=html;
  const btnrow=el('div','mbtns');
  (buttons||[]).forEach(function(b){
    const bt=el('button','btn '+(b.cls||''),b.label);
    bt.addEventListener('click',function(){closeModal();if(b.cb)b.cb();});
    btnrow.appendChild(bt);
  });
  if(buttons&&buttons.length)box.appendChild(btnrow);
  $('#overlay').classList.add('show');
}
function closeModal(){$('#overlay').classList.remove('show');}

/* ---------------- 通用指针拖拽系统（支持触摸） ---------------- */
const ZONES=[];
function clearZones(){ZONES.length=0;}
function addZone(zel,def){zel.classList.add('zone');def.el=zel;ZONES.push(def);}
function enableDrag(elm,getData){
  elm.style.touchAction='none';
  elm.addEventListener('pointerdown',function(ev){
    if(S.locked)return;
    const data=getData();
    if(!data)return;
    ev.preventDefault();
    // 生成跟随指针的“幽灵”元素
    const ghost=elm.cloneNode(true);
    ghost.classList.add('ghost');ghost.classList.remove('mini');
    document.body.appendChild(ghost);
    const hotList=[];
    ZONES.forEach(function(z){if(!z.accepts||z.accepts(data)){z.el.classList.add('hot');hotList.push(z.el);}});
    function move(e){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';}
    move(ev);
    function finish(e){
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',finish);
      window.removeEventListener('pointercancel',cancel);
      hotList.forEach(function(z){z.classList.remove('hot');});
      ghost.remove();
      if(e&&e.type==='pointerup'){
        const under=document.elementFromPoint(e.clientX,e.clientY);
        if(under){
          const zl=under.closest('.zone');
          if(zl){
            const z=ZONES.find(function(zz){return zz.el===zl;});
            if(z&&(!z.accepts||z.accepts(data))){addStep();z.onDrop(data,e);return;}
          }
        }
        if(data.onMiss)data.onMiss();
      }
    }
    function cancel(){finish(null);}
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',finish);
    window.addEventListener('pointercancel',cancel);
  });
}

/* ---------------- 庆祝彩带（Canvas） ---------------- */
function launchConfetti(ms){
  const cv=$('#fx');cv.style.display='block';
  cv.width=window.innerWidth;cv.height=window.innerHeight;
  const ctx=cv.getContext('2d');
  const cs=getComputedStyle(document.documentElement);
  const cols=[cs.getPropertyValue('--p1').trim(),cs.getPropertyValue('--acc').trim(),'#f9a825','#e53935','#43a047','#7e57c2'];
  const parts=[];
  for(let i=0;i<160;i++){
    parts.push({x:Math.random()*cv.width,y:-30-Math.random()*cv.height*0.5,
      vx:(Math.random()-0.5)*2.4,vy:2+Math.random()*3.2,s:7+Math.random()*9,
      c:cols[i%cols.length],r:Math.random()*Math.PI,vr:(Math.random()-0.5)*0.25,
      star:Math.random()<0.3});
  }
  const t0=Date.now();
  (function frame(){
    ctx.clearRect(0,0,cv.width,cv.height);
    parts.forEach(function(p){
      p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      if(p.y>cv.height+30){p.y=-20;p.x=Math.random()*cv.width;}
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;
      if(p.star){ctx.font=p.s*2+'px serif';ctx.fillText('★',-p.s,-p.s*0.3);}
      else{ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*0.66);}
      ctx.restore();
    });
    if(Date.now()-t0<ms){requestAnimationFrame(frame);}
    else{ctx.clearRect(0,0,cv.width,cv.height);cv.style.display='none';}
  })();
}

/* ---------------- 球的配色 ---------------- */
const BCOLORS={
  red:{c:'#e53935',name:'红球'},
  white:{c:'#ffffff',name:'白球',w:true},
  yellow:{c:'#fdd835',name:'黄球'},
  black:{c:'#455a64',name:'黑球'}
};
function ballEl(color,mini){
  const b=el('div','ball'+(mini?' mini':'')+(BCOLORS[color].w?' w':''));
  b.style.background=BCOLORS[color].c;
  b.dataset.color=color;
  return b;
}
function ballDotHTML(color){return '<span class="dot" style="display:inline-block;width:17px;height:17px;border-radius:50%;border:2px solid rgba(0,0,0,.3);background:'+BCOLORS[color].c+';vertical-align:-3px;margin-right:3px"></span>';}

/* =====================================================================
   任务一：装袋配概率（拖球入袋，构造目标概率）
   对应教参：练习10（a 只红球 b 只白球 → P红=a/(a+b)）的逆向构造
   ===================================================================== */
function mBagFill(level){
  const twoColor=(level===0);
  const caps=twoColor?{red:8,white:8}:{red:8,white:8,yellow:6};
  const shelf={red:caps.red||0,white:caps.white||0,yellow:caps.yellow||0};
  const bag={red:0,white:0,yellow:0};
  const t=twoColor?pick([[1,2],[1,3],[2,3],[1,4],[3,4],[2,5],[3,5]])
                  :pick([[3,5],[2,5],[4,5],[3,8],[5,8],[2,7],[4,7],[5,7]]);
  // 预先找一组可行解（供“揭示答案”用）
  let sol=null;
  for(let n=2;n<=16&&!sol;n++){
    if((t[0]*n)%t[1]===0){
      const x=t[0]*n/t[1];
      if(x<=caps.red&&(n-x)<=(caps.white+(caps.yellow||0))){sol=[x,n-x];}
    }
  }
  const m={
    id:'bagFill',
    title:'装袋配概率',
    tip:'把货架上的球拖进袋子里（点一下袋里的球可放回货架），让“摸到红球的可能性”恰好等于目标值。',
    story:'丁丁有一个空的魔法袋。货架上有红球 '+caps.red+' 个、白球 '+caps.white+' 个'+
      (twoColor?'':'、黄球 '+caps.yellow+' 个')+
      '，它们除颜色外大小、形状完全相同。请往袋里拖入一些球，使得“从袋中任意摸出一球，恰好是红球”的可能性 = '+
      fracHTML(t[0],t[1])+'。'+(twoColor?'':'（小心：黄球会撑大总数哦）'),
    mount:function(body){
      body.innerHTML=
       '<div class="row">'+
         '<div class="col"><div class="zonelab">道具货架</div><div id="mfShelf"></div></div>'+
         '<div class="col"><div class="zonelab">魔法袋（拖到这里）</div><div class="bag zone" id="mfBag"></div>'+
           '<div class="bagcap" id="mfCap">袋里现在：空空如也</div></div>'+
         '<div class="col">'+
           '<div class="tgt">目标：P(红球) = '+fracHTML(t[0],t[1])+'</div>'+
           '<div class="livebox" id="mfLive"></div>'+
         '</div>'+
       '</div>';
      const shelfBox=body.querySelector('#mfShelf');
      const bagEl=body.querySelector('#mfBag');
      Object.keys(caps).forEach(function(color){
        const row=el('div','shelfrow');
        const pickBall=ballEl(color);
        enableDrag(pickBall,function(){return shelf[color]>0?{kind:'ball',color:color}:null;});
        row.appendChild(pickBall);
        const lab=el('span','cnt',BCOLORS[color].name+' × <b data-c="'+color+'">'+shelf[color]+'</b>');
        row.appendChild(lab);
        shelfBox.appendChild(row);
      });
      addZone(bagEl,{accepts:function(d){return d.kind==='ball';},onDrop:function(d){
        if(shelf[d.color]<=0){toast('这种球已经用完啦');return;}
        shelf[d.color]--;bag[d.color]++;
        bagEl.appendChild(ballEl(d.color,true));
        refresh();
      }});
      function refresh(){
        Object.keys(caps).forEach(function(color){
          shelfBox.querySelector('b[data-c="'+color+'"]').textContent=shelf[color];
        });
        const total=bag.red+bag.white+bag.yellow;
        let list=[];Object.keys(caps).forEach(function(c){if(bag[c]>0)list.push(BCOLORS[c].name+' '+bag[c]+' 个');});
        body.querySelector('#mfCap').textContent='袋里现在：'+(total?list.join('，'):'空空如也')+'（共 '+total+' 个）';
        const lv=body.querySelector('#mfLive');
        if(total===0){
          lv.innerHTML='袋里还没有球。<br>红球 0 个 / 总数 0 个 → P(红球) = ？';
        }else{
          const p=bag.red/total;
          lv.innerHTML='红球 '+bag.red+' 个 / 总数 '+total+' 个<br>P(红球) = '+
            bag.red+' ÷ '+total+' = '+fracHTML(bag.red,total)+
            '<div class="bar"><i style="width:'+(p*100).toFixed(1)+'%;background:#e53935"></i></div>';
        }
        if(total>0&&fracEq(bag.red,total,t[0],t[1])){
          finishMission('<div class="winbig">装对啦，可能性正好是 '+fracText(t[0],t[1])+'！</div>'+
            '<p><b>古典概型</b>：袋里共 '+total+' 个球，每个球被摸到的机会完全相同，其中红球 '+bag.red+
            ' 个，所以 P(红球) = '+bag.red+'/'+total+' = '+fracText(bag.red,total)+
            '。只要红球数与总数的比值等于目标值，就完成任务。</p>');
        }
      }
      // 点袋中的球 → 放回货架
      bagEl.addEventListener('click',function(ev){
        if(S.locked)return;
        const b=ev.target.closest('.ball');
        if(!b)return;
        const c=b.dataset.color;
        if(bag[c]>0){bag[c]--;shelf[c]++;b.remove();addStep();refresh();}
      });
      refresh();
    },
    reveal:function(){
      if(!sol)return '正在计算参考方案……请稍后再试。';
      return '<p>参考方案：放入 <b>'+sol[0]+' 个红球</b> 和 <b>'+sol[1]+' 个白球</b>（不放黄球），'+
        '则 P(红) = '+sol[0]+'/'+(sol[0]+sol[1])+' = '+fracText(t[0],t[1])+'。</p>'+
        '<p class="small">凡是“红球数 ÷ 总数”等于 '+fracText(t[0],t[1])+' 的装法都是正确的。</p>';
    }
  };
  return m;
}

/* =====================================================================
   任务二：先摸后摸有玄机（不放回 · 条件概率的操作化）
   对应教参：例4（3 红 3 白，不放回，牛牛先摸，阿普再摸）
   ===================================================================== */
function mCondDraw(){
  const pairs=[[3,3],[3,3],[4,2],[2,3],[5,3],[4,5]];
  const pr=pick(pairs);const R=pr[0],W=pr[1];
  const takeRed=Math.random()<0.5;             // 本局牛牛应该摸走的颜色
  const remR=takeRed?R-1:R;const den=R+W-1;
  const tgt=simp(remR,den);
  const m={
    id:'condDraw',
    title:'先摸后摸有玄机',
    tip:'把袋里的一个球拖到牛牛手中（可以点牛牛手里的球放回袋子换一个），让阿普摸到红球的可能性恰好等于目标值。',
    story:'阿普和牛牛玩摸球游戏。袋中有大小和形状完全相同的 <b>'+R+' 个红球</b> 和 <b>'+W+
      ' 个白球</b>，两人先后从袋子里<b>不放回地</b>各摸出 1 个球（牛牛先摸，摸走的球不会再回到袋里）。'+
      '请拖一个球到牛牛手中，使得这时<b>阿普摸出红球</b>的可能性 = '+fracHTML(tgt[0],tgt[1])+'。',
    mount:function(body){
      body.innerHTML=
       '<div class="row">'+
        '<div class="col"><div class="zonelab">袋子（不放回）</div><div class="bag zone" id="cdBag"></div>'+
          '<div class="bagcap">拖走一个球试试看</div></div>'+
        '<div class="col"><div class="zonelab">牛牛的手（拖到这里）</div>'+
          '<div class="zone" id="cdHand" style="min-height:110px;display:flex;align-items:center;justify-content:center"></div>'+
          '<button class="btn ghost" id="cdTest" style="margin-top:10px">试摸 20 次看看频率</button>'+
          '<div class="tally" id="cdTally"></div></div>'+
        '<div class="col">'+
          '<div class="tgt">目标：P(阿普摸到红球) = '+fracHTML(tgt[0],tgt[1])+'</div>'+
          '<div class="livebox" id="cdLive">袋里：红 '+R+' 个 · 白 '+W+' 个 · 共 '+(R+W)+' 个</div>'+
        '</div>'+
       '</div>';
      const bagEl=body.querySelector('#cdBag');
      const hand=body.querySelector('#cdHand');
      let inHand=null;    // 记录牛牛手里球的颜色
      for(let i=0;i<R;i++)bagEl.appendChild(ballEl('red'));
      for(let i=0;i<W;i++)bagEl.appendChild(ballEl('white'));
      Array.prototype.forEach.call(bagEl.children,function(b){
        enableDrag(b,function(){return b.parentNode===bagEl?{kind:'ball',color:b.dataset.color,src:b}:null;});
      });
      addZone(hand,{accepts:function(d){return d.kind==='ball';},onDrop:function(d){
        // 手里已有球 → 先放回袋子
        if(inHand){toast('牛牛手里已经有球啦，先点它放回去');return;}
        if(d.src&&d.src.parentNode===bagEl){
          inHand=d.color;d.src.remove();
          const hb=ballEl(d.color);hb.classList.add('pop');hand.appendChild(hb);
          refresh();
        }
      }});
      hand.addEventListener('click',function(ev){
        if(S.locked)return;
        const b=ev.target.closest('.ball');
        if(!b)return;
        bagEl.appendChild(b);b.classList.remove('pop');
        inHand=null;addStep();refresh();
      });
      body.querySelector('#cdTest').addEventListener('click',function(){
        if(!inHand){toast('先让牛牛摸走一个球，再做实验');return;}
        const rr=remRNow(),tt=rr[0]+rr[1];
        let hits=0;
        for(let i=0;i<20;i++){if(Math.random()*tt<rr[0])hits++;}
        body.querySelector('#cdTally').innerHTML='20 次试摸中摸到红球 <b>'+hits+
          '</b> 次，频率 = '+hits+'/20 = '+fracText(hits,20)+'（试的次数越多，越接近 '+fracText(rr[0],tt)+'）';
      });
      function remRNow(){
        const rLeft=bagEl.querySelectorAll('.ball[data-color="red"]').length;
        const wLeft=bagEl.querySelectorAll('.ball[data-color="white"]').length;
        return [rLeft,wLeft];
      }
      function refresh(){
        const lv=body.querySelector('#cdLive');
        if(!inHand){lv.innerHTML='袋里：红 '+R+' 个 · 白 '+W+' 个 · 共 '+(R+W)+' 个<br>先把一个球拖到牛牛手里！';return;}
        const rw=remRNow();
        lv.innerHTML='牛牛摸走了 1 个'+BCOLORS[inHand].name.replace('球','')+'球（不放回）<br>'+
          '袋里还剩：红 '+rw[0]+' 个 · 白 '+rw[1]+' 个 · 共 '+(rw[0]+rw[1])+' 个<br>'+
          'P(阿普摸到红球) = '+rw[0]+' ÷ '+(rw[0]+rw[1])+' = '+fracHTML(rw[0],rw[0]+rw[1]);
        if(fracEq(rw[0],rw[0]+rw[1],tgt[0],tgt[1])){
          finishMission('<div class="winbig">正是这一种摸法！</div>'+
            '<p><b>“不放回”会改变袋中的球数</b>：牛牛摸走'+BCOLORS[inHand].name.replace('球','')+
            '球后，袋里还剩 '+(rw[0]+rw[1])+' 个球，其中红球 '+rw[0]+' 个，所以 P = '+
            rw[0]+'/'+(rw[0]+rw[1])+' = '+fracText(tgt[0],tgt[1])+'。</p>'+
            '<p>这正是例4 的两种情况：先摸走红球 → P(红) = '+fracText(R-1,den)+
            '；先摸走白球 → P(红) = '+fracText(R,den)+'。如果不知道牛牛摸的颜色，用乘法原理把两类相加：'+
            fracText(W,R+W)+'×'+fracText(R,den)+' + '+fracText(R,R+W)+'×'+fracText(R-1,den)+
            ' = '+fracText(R,R+W)+'——又变回原来的比例，说明先摸后摸对每个人都是公平的。</p>');
        }
      }
      refresh();
    },
    reveal:function(){
      const rr=takeRed?R-1:R;
      return '<p>牛牛应该摸走的是<b>'+(takeRed?'红球':'白球')+'</b>：摸走后袋里还剩 '+
        (takeRed?(R-1):R)+' 个红球、'+(takeRed?W:(W-1))+' 个白球，共 '+den+' 个，'+
        'P(阿普摸到红球) = '+rr+'/'+den+' = '+fracText(tgt[0],tgt[1])+'。</p>'+
        '<p class="small">对照：如果牛牛摸走的是'+(takeRed?'白球':'红球')+
        '，P 会变成 '+fracText(takeRed?R:R-1,den)+'，不等于目标。</p>';
    }
  };
  return m;
}

/* =====================================================================
   任务三：转盘涂色师（点击涂色构造概率 + 转盘实验）
   对应教参：练习17（转盘概率）、初级/中级两档
   ===================================================================== */
function mSpinner(level){
  const N=pick([6,8,10,12]);
  let kr,kb=null;
  const reds={6:[1,2,3,4],8:[2,3,4,5,6],10:[2,4,5,6,8],12:[3,4,6,8,9]}[N];
  kr=pick(reds);
  if(level===1){
    // 双目标：红、蓝各自的可能性都要达标，且红格数+蓝格数不能超过总格数
    const cands=reds.filter(function(v){return v!==kr&&kr+v<=N;});
    kb=cands.length?pick(cands):null;
  }
  const paint=new Array(N).fill(0);   // 0 未涂 / 1 红 / 2 蓝
  const m={
    id:'spinner',
    title:'转盘涂色师',
    tip:'点击转盘的扇形涂色：灰 → 红 → 蓝 → 还原。让“指针停在红色区域”的可能性恰好等于目标值；再点“转一转”做实验验证。',
    story:'探险队发现了一个平均分成 <b>'+N+' 格</b>的转盘（每格完全相等，指针停在每一格的机会都相同）。'+
      '请给扇形涂色，使得转动一次时“指针停在<b>红色</b>区域”的可能性 = '+fracHTML(kr,N)+
      (kb?('，并且“指针停在<b>蓝色</b>区域”的可能性 = '+fracHTML(kb,N)):'')+
      '。（涂灰的格子不算红也不算蓝）',
    mount:function(body){
      body.innerHTML=
       '<div class="row">'+
        '<div class="col wheelbox">'+
          '<svg viewBox="0 0 230 230" id="spSvg"></svg>'+
          '<div><button class="btn ghost" id="spSpin">转一转（做实验）</button></div>'+
          '<div class="tally" id="spTally">还没有转过。转到红色 0 次 · 蓝色 0 次</div>'+
        '</div>'+
        '<div class="col">'+
          '<div class="tgt">目标：P(红) = '+fracHTML(kr,N)+(kb?('　P(蓝) = '+fracHTML(kb,N)):'')+'</div>'+
          '<div class="livebox" id="spLive"></div>'+
          '<p class="small">转的次数越多，红格出现的频率会越来越接近它的可能性大小。</p>'+
        '</div>'+
       '</div>';
      const svg=body.querySelector('#spSvg');
      const NSVG='http://www.w3.org/2000/svg';
      const g=document.createElementNS(NSVG,'g');
      g.setAttribute('style','transform-origin:115px 115px;transition:transform 2.6s cubic-bezier(.15,.85,.25,1)');
      svg.appendChild(g);
      const cx=115,cy=115,r=98,step=Math.PI*2/N;
      const paths=[];
      for(let i=0;i<N;i++){
        const p=document.createElementNS(NSVG,'path');
        p.setAttribute('class','sector');
        p.setAttribute('d',arcPath(cx,cy,r,-Math.PI/2+i*step,-Math.PI/2+(i+1)*step));
        g.appendChild(p);paths.push(p);
      }
      // 固定指针（不随转盘转动）
      const ptr=document.createElementNS(NSVG,'polygon');
      ptr.setAttribute('points','115,2 104,30 126,30');
      ptr.setAttribute('style','fill:#16213a;stroke:#fff;stroke-width:3');
      svg.appendChild(ptr);
      let rot=0,totR=0,totB=0;
      function fillOf(v){return v===1?'#e53935':(v===2?'#1e88e5':'#cfd8dc');}
      function redraw(){
        paths.forEach(function(p,i){p.setAttribute('fill',fillOf(paint[i]));});
        const cr=paint.filter(function(v){return v===1;}).length;
        const cb=paint.filter(function(v){return v===2;}).length;
        body.querySelector('#spLive').innerHTML=
          '已涂：<b style="color:#e53935">红 '+cr+' 格</b> · <b style="color:#1e88e5">蓝 '+cb+' 格</b> · 未涂 '+(N-cr-cb)+' 格<br>'+
          'P(红) = '+cr+' ÷ '+N+' = '+fracHTML(cr,N)+
          (kb?('　P(蓝) = '+cb+' ÷ '+N+' = '+fracHTML(cb,N)):'');
        if(fracEq(cr,N,kr,N)&&(!kb||fracEq(cb,N,kb,N))){
          finishMission('<div class="winbig">转盘调整完毕！</div>'+
            '<p>转盘平均分成 '+N+' 格，每格机会均等：红格 '+cr+' 个，所以 P(红) = '+cr+'/'+N+' = '+fracText(kr,N)+
            (kb?('；蓝格 '+cb+' 个，P(蓝) = '+cb+'/'+N+' = '+fracText(kb,N)):'')+
            '。<b>古典概型</b>就是把“所有等可能的结果”数清楚，再数出符合条件的有几种。</p>');
        }
      }
      paths.forEach(function(p,i){
        p.addEventListener('click',function(){
          if(S.locked)return;
          paint[i]=(paint[i]+1)%3;addStep();redraw();
        });
      });
      body.querySelector('#spSpin').addEventListener('click',function(){
        if(S.locked)return;
        rot+=360*4+Math.random()*360;
        g.style.transform='rotate('+rot+'deg)';
        setTimeout(function(){
          const norm=(((-rot)%360)+360)%360;
          const idx=Math.floor(norm/(360/N))%N;
          if(paint[idx]===1)totR++;if(paint[idx]===2)totB++;
          const s=totR+totB;
          body.querySelector('#spTally').innerHTML=(s?('已转 '+s+' 次：'):'还没有转到彩色。')+
            '转到红色 <b>'+totR+'</b> 次 · 蓝色 <b>'+totB+'</b> 次'+
            (totR?('（红频率 '+fracText(totR,s)+'）'):'');
        },2700);
      });
      redraw();
    },
    reveal:function(){
      return '<p>给其中 <b>'+kr+' 个</b>扇形涂红色'+(kb?('、<b>'+kb+' 个</b>扇形涂蓝色'):'')+
        '，其余留灰：P(红) = '+kr+'/'+N+' = '+fracText(kr,N)+(kb?('，P(蓝) = '+kb+'/'+N+' = '+fracText(kb,N)):'')+'。</p>'+
        '<p class="small">涂哪几格都可以，只数格子数量，与位置无关。</p>';
    }
  };
  return m;
}
/* 计算扇形路径（极坐标转直角坐标） */
function arcPath(cx,cy,r,a0,a1){
  const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0);
  const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
  const large=(a1-a0)>Math.PI?1:0;
  return 'M '+cx+' '+cy+' L '+x0.toFixed(2)+' '+y0.toFixed(2)+
    ' A '+r+' '+r+' 0 '+large+' 1 '+x1.toFixed(2)+' '+y1.toFixed(2)+' Z';
}

/* =====================================================================
   任务四：配紫色双转盘（乘法原理 + 加法原理）
   对应教参：练习18（两个转盘配紫色）
   ===================================================================== */
function mPurple(){
  const cfgs=[
    {n1:4,n2:4,t:[1,2]},{n1:4,n2:4,t:[3,8]},{n1:2,n2:3,t:[1,2]},{n1:4,n2:6,t:[1,2]}
  ];
  const cfg=pick(cfgs);
  const N1=cfg.n1,N2=cfg.n2,T=cfg.t;
  const p1=new Array(N1).fill(0),p2=new Array(N2).fill(0);
  // 预先找一组参考解（优先让两个转盘都同时有红有蓝，方案更自然）
  let sol=null;
  for(let pass=1;pass<=2&&!sol;pass++){
    const lo=pass===1?1:0;   // 第一轮要求每种颜色至少 1 格
    for(let a=lo;a<=N1&&!sol;a++)for(let b=lo;b<=N1-a&&!sol;b++)
      for(let c=lo;c<=N2&&!sol;c++)for(let d=lo;d<=N2-c&&!sol;d++){
        if(fracEq(a*d+b*c,N1*N2,T[0],T[1]))sol=[a,b,c,d];
      }
  }
  const m={
    id:'purple',
    title:'配紫色双转盘',
    tip:'分别点击两个转盘的扇形涂红色或蓝色（灰 → 红 → 蓝 → 还原），让“一红一蓝配成紫色”的可能性恰好等于目标值。',
    story:'用两个可以自由转动的转盘做<b>“配紫色”</b>游戏：第一个转盘平均分成 '+N1+
      ' 格，第二个平均分成 '+N2+' 格（每格机会均等）。分别旋转两个转盘，若<b>其中一个转出红色、另一个转出蓝色</b>，即可配成紫色。'+
      '请给两个转盘涂上红色和蓝色，使得配成紫色的可能性 = '+fracHTML(T[0],T[1])+'。',
    mount:function(body){
      body.innerHTML=
       '<div class="row">'+
        '<div class="col wheelbox"><div class="zonelab">转盘甲（'+N1+' 格）</div><svg viewBox="0 0 230 230" id="pv1"></svg></div>'+
        '<div class="col wheelbox"><div class="zonelab">转盘乙（'+N2+' 格）</div><svg viewBox="0 0 230 230" id="pv2"></svg></div>'+
       '</div>'+
       '<div style="text-align:center;margin:8px 0"><button class="btn ghost" id="pvSpin">两个转盘各转一次（做实验）</button>'+
       '<div class="tally" id="pvTally">配成紫色 0 次 / 共 0 次</div></div>'+
       '<div class="tgt">目标：P(配成紫色) = '+fracHTML(T[0],T[1])+'</div>'+
       '<div class="livebox" id="pvLive"></div>';
      function buildWheel(svgId,N,arr){
        const svg=body.querySelector(svgId);
        const NSVG='http://www.w3.org/2000/svg';
        const g=document.createElementNS(NSVG,'g');
        g.setAttribute('style','transform-origin:115px 115px;transition:transform 2.4s cubic-bezier(.15,.85,.25,1)');
        svg.appendChild(g);
        const step=Math.PI*2/N,paths=[];
        for(let i=0;i<N;i++){
          const p=document.createElementNS(NSVG,'path');
          p.setAttribute('class','sector');
          p.setAttribute('d',arcPath(115,115,98,-Math.PI/2+i*step,-Math.PI/2+(i+1)*step));
          g.appendChild(p);paths.push(p);
          p.addEventListener('click',function(){
            if(S.locked)return;
            arr[i]=(arr[i]+1)%3;addStep();redraw();
          });
        }
        const ptr=document.createElementNS(NSVG,'polygon');
        ptr.setAttribute('points','115,2 104,30 126,30');
        ptr.setAttribute('style','fill:#16213a;stroke:#fff;stroke-width:3');
        svg.appendChild(ptr);
        return {g:g,paths:paths,rot:0};
      }
      const w1=buildWheel('#pv1',N1,p1);
      const w2=buildWheel('#pv2',N2,p2);
      let succ=0,total=0;
      function fillOf(v){return v===1?'#e53935':(v===2?'#1e88e5':'#cfd8dc');}
      function redraw(){
        w1.paths.forEach(function(p,i){p.setAttribute('fill',fillOf(p1[i]));});
        w2.paths.forEach(function(p,i){p.setAttribute('fill',fillOf(p2[i]));});
        const r1=p1.filter(function(v){return v===1;}).length,b1=p1.filter(function(v){return v===2;}).length;
        const r2=p2.filter(function(v){return v===1;}).length,b2=p2.filter(function(v){return v===2;}).length;
        const num=r1*b2+b1*r2;
        body.querySelector('#pvLive').innerHTML=
          '转盘甲：红 '+r1+' 格、蓝 '+b1+' 格 → P(甲红)='+fracHTML(r1,N1)+'，P(甲蓝)='+fracHTML(b1,N1)+'<br>'+
          '转盘乙：红 '+r2+' 格、蓝 '+b2+' 格 → P(乙红)='+fracHTML(r2,N2)+'，P(乙蓝)='+fracHTML(b2,N2)+'<br>'+
          '<b>乘法原理 + 加法原理</b>：P(配紫) = '+fracHTML(r1,N1)+'×'+fracHTML(b2,N2)+' + '+
          fracHTML(b1,N1)+'×'+fracHTML(r2,N2)+' = '+fracHTML(num,N1*N2);
        if(num>0&&fracEq(num,N1*N2,T[0],T[1])){
          finishMission('<div class="winbig">紫色配方成功！</div>'+
            '<p>两个转盘互不影响（独立事件），用<b>乘法原理</b>分别算“甲红乙蓝”“甲蓝乙红”两条路，再用<b>加法原理</b>相加：<br>P = '+
            fracText(r1,N1)+'×'+fracText(b2,N2)+' + '+fracText(b1,N1)+'×'+fracText(r2,N2)+
            ' = '+fracText(num,N1*N2)+' = '+fracText(T[0],T[1])+'。</p>'+
            '<p class="small">把第二个转盘的蓝格等分成几份逐一列举，也能数出同样的结果（列举法）。</p>');
        }
      }
      body.querySelector('#pvSpin').addEventListener('click',function(){
        if(S.locked)return;
        w1.rot+=360*3+Math.random()*360;w2.rot+=360*3+Math.random()*360;
        w1.g.style.transform='rotate('+w1.rot+'deg)';
        w2.g.style.transform='rotate('+w2.rot+'deg)';
        setTimeout(function(){
          const i1=Math.floor(((((-w1.rot)%360)+360)%360)/(360/N1))%N1;
          const i2=Math.floor(((((-w2.rot)%360)+360)%360)/(360/N2))%N2;
          total++;
          if((p1[i1]===1&&p2[i2]===2)||(p1[i1]===2&&p2[i2]===1))succ++;
          body.querySelector('#pvTally').innerHTML='配成紫色 <b>'+succ+'</b> 次 / 共 '+total+
            ' 次'+(succ?('（频率 '+fracText(succ,total)+'）'):'');
        },2500);
      });
      redraw();
    },
    reveal:function(){
      if(!sol)return '正在计算参考方案……';
      return '<p>参考方案：转盘甲涂 <b>'+sol[0]+' 红、'+sol[1]+' 蓝</b>，转盘乙涂 <b>'+sol[2]+' 红、'+sol[3]+
        ' 蓝</b>（其余留灰），则 P = '+fracText(sol[0]*sol[3]+sol[1]*sol[2],N1*N2)+' = '+fracText(T[0],T[1])+'。</p>'+
        '<p class="small">涂色方案不唯一，只要满足 P(甲红)×P(乙蓝)+P(甲蓝)×P(乙红) = '+fracText(T[0],T[1])+' 即可。</p>';
    }
  };
  return m;
}

/* =====================================================================
   任务五：线段拼装大挑战（拖 3 条线段试拼三角形，找全所有组合）
   对应教参：练习12（1,3,5,7,9 任取 3 条构成三角形的概率）
   ===================================================================== */
function mTriangle(level){
  const fams=level===2?{lens:[3,4,5,7,9]}:pick([{lens:[1,3,5,7,9]},{lens:[1,2,3,4,5]},{lens:[2,4,6,8,10]}]);
  const lens=fams.lens;
  // 枚举全部 C(5,3)=10 种组合并判定
  const all=[],valid=[];
  for(let i=0;i<5;i++)for(let j=i+1;j<5;j++)for(let k=j+1;k<5;k++){
    const trip=[lens[i],lens[j],lens[k]].sort(function(a,b){return a-b;});
    all.push(trip);
    if(trip[0]+trip[1]>trip[2])valid.push(trip);
  }
  const found=new Set();
  const m={
    id:'triangle',
    title:'线段拼装大挑战',
    tip:'把 3 条线段拖到拼装台的三个卡槽里，画布会自动试拼。找出所有能拼成三角形的组合，全部点亮即可通关。',
    story:'第四关里有 <b>5 条线段</b>，长度分别为 '+lens.join(',')+'（单位：厘米）。从中任取 3 条，'+
      '有的能拼成三角形，有的不能。从这 5 条里任取 3 条共有 <b>10 种</b>等可能的取法，其中能拼成三角形的有 <b>'+
      valid.length+' 种</b>。请把 3 条线段拖到拼装台上试一试，把 '+valid.length+' 种能拼成三角形的组合全部找出来！'+
      '<span class="small">（判定秘密：两条较短边的和必须大于最长边）</span>',
    mount:function(body){
      body.innerHTML=
       '<div class="row">'+
        '<div class="col"><div class="zonelab">线段仓库</div><div id="tgShelf" style="display:flex;flex-direction:column;gap:10px;align-items:flex-start"></div>'+
          '<div class="livebox" id="tgFound" style="margin-top:10px"></div></div>'+
        '<div class="col"><div class="zonelab">拼装台（三个卡槽都要放满）</div>'+
          '<div class="slotrow" id="tgSlots"></div></div>'+
       '</div>'+
       '<canvas id="triCv" width="470" height="250"></canvas>'+
       '<div class="tally" id="tgMsg" style="text-align:center">把线段拖上去试试吧！</div>';
      const shelf=body.querySelector('#tgShelf');
      const slotsBox=body.querySelector('#tgSlots');
      const msg=body.querySelector('#tgMsg');
      const slotEls=[];
      for(let s=0;s<3;s++){
        const sl=el('div','slot','<span class="small">卡槽 '+(s+1)+'</span>');
        slotsBox.appendChild(sl);slotEls.push(sl);
        addZone(sl,{accepts:function(d){return d.kind==='seg'&&!sl.querySelector('.seg');},onDrop:function(d){
          if(d.el.parentNode&&d.el.classList.contains('seg')){placeSeg(sl,d.el);}
        }});
      }
      lens.slice().sort(function(a,b){return a-b;}).forEach(function(L){
        const sg=el('div','seg',L+' 厘米');
        sg.style.width=Math.max(90,L*30)+'px';
        shelf.appendChild(sg);
        enableDrag(sg,function(){return sg.parentNode===shelf?{kind:'seg',el:sg}:null;});
      });
      function placeSeg(slot,segEl){
        shelf.removeChild(segEl);slot.innerHTML='';slot.appendChild(segEl);
        msg.textContent='已放 '+filled()+' / 3 条';
        if(filled()===3)setTimeout(evaluate,350);
      }
      function filled(){return slotEls.filter(function(sl){return sl.querySelector('.seg');}).length;}
      function backToShelf(){
        slotEls.forEach(function(sl){
          const sg=sl.querySelector('.seg');
          if(sg){sl.innerHTML='<span class="small">卡槽</span>';shelf.appendChild(sg);}
        });
      }
      slotEls.forEach(function(sl){
        sl.addEventListener('click',function(ev){
          if(S.locked)return;
          const sg=ev.target.closest('.seg');
          if(!sg)return;
          sl.innerHTML='<span class="small">卡槽</span>';shelf.appendChild(sg);addStep();
          msg.textContent='已放 '+filled()+' / 3 条';
        });
      });
      function evaluate(){
        const chosen=slotEls.map(function(sl){return parseInt(sl.querySelector('.seg').textContent,10);});
        chosen.sort(function(a,b){return a-b;});
        const a=chosen[0],b=chosen[1],c=chosen[2];
        const key=a+'+'+b+'+'+c;
        const ok=a+b>c;
        drawTri(a,b,c,ok);
        if(ok){
          if(found.has(key)){msg.textContent='这个组合已经点亮过啦，换一个试试！';backToShelf();return;}
          found.add(key);
          const chip=el('span','found-chip pop',a+'、'+b+'、'+c);
          body.querySelector('#tgFound').appendChild(chip);
          msg.textContent='拼成啦！'+a+' + '+b+' = '+(a+b)+' > '+c+'，两边之和大于第三边';
          backToShelf();
          body.querySelector('#tgFound').querySelectorAll('.cntline').forEach(function(x){x.remove();});
          body.querySelector('#tgFound').appendChild(el('div','cntline','已点亮 '+found.size+' / '+valid.length+' 种'));
          if(found.size===valid.length){
            finishMission('<div class="winbig">'+valid.length+' 种组合全部点亮！</div>'+
              '<p><b>三角形三边关系</b>：任意两边之和必须大于第三边。10 种等可能取法里恰有 '+valid.length+
              ' 种满足：'+valid.map(function(v){return v.join('、');}).join('；')+'。</p>'+
              '<p>所以从这 5 条线段中任取 3 条，能构成三角形的可能性 P = '+valid.length+'/10 = '+fracText(valid.length,10)+'。</p>');
          }
        }else{
          msg.textContent='拼不成：'+a+' + '+b+' = '+(a+b)+' ≤ '+c+'，两条短边够不着，合不拢！';
          body.querySelector('#triCv').classList.add('shake');
          setTimeout(function(){body.querySelector('#triCv').classList.remove('shake');backToShelf();},900);
        }
      }
      function drawTri(a,b,c,ok){
        const cv=body.querySelector('#triCv');
        const ctx=cv.getContext('2d');
        ctx.clearRect(0,0,cv.width,cv.height);
        const scale=Math.min(340/c,26);
        const x0=65,y0=215;
        const x1=x0+c*scale;
        ctx.lineWidth=7;ctx.lineCap='round';
        ctx.strokeStyle=ok?'#2e7d32':'#37474f';
        ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y0);ctx.stroke();
        ctx.fillStyle='#16213a';ctx.font='bold 17px sans-serif';
        ctx.fillText(c+'（最长边）',(x0+x1)/2-45,y0+26);
        if(ok){
          const mx=(a*a+c*c-b*b)/(2*c);
          const h=Math.sqrt(Math.max(a*a-mx*mx,0));
          const px=x0+mx*scale,py=y0-h*scale;
          ctx.fillStyle='rgba(102,187,106,.30)';
          ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(px,py);ctx.lineTo(x1,y0);ctx.closePath();ctx.fill();
          ctx.strokeStyle='#2e7d32';
          ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(px,py);ctx.lineTo(x1,y0);ctx.stroke();
          ctx.fillStyle='#1b5e20';ctx.font='bold 20px sans-serif';
          ctx.fillText('✓ '+a+' + '+b+' = '+(a+b)+' > '+c+'，拼成三角形！',70,36);
          ctx.fillStyle='#16213a';ctx.font='bold 16px sans-serif';
          ctx.fillText(a,x0-26,(y0+py)/2);ctx.fillText(b,x1+8,(y0+py)/2);
        }else{
          // 两条短边各自画虚线圆弧，展示“够不着”的缺口
          ctx.setLineDash([9,7]);ctx.lineWidth=4;
          ctx.strokeStyle='#e53935';
          ctx.beginPath();ctx.arc(x0,y0,a*scale,Math.PI*0.62,Math.PI*0.98);ctx.stroke();
          ctx.beginPath();ctx.arc(x1,y0,b*scale,Math.PI*0.02,Math.PI*0.38);ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle='#b71c1c';ctx.font='bold 20px sans-serif';
          ctx.fillText('✗ '+a+' + '+b+' = '+(a+b)+' ≤ '+c+'，合不拢！',70,36);
          ctx.fillStyle='#16213a';ctx.font='bold 16px sans-serif';
          ctx.fillText(a,x0-24,y0+22);ctx.fillText(b,x1+8,y0+22);
        }
      }
      body.querySelector('#tgFound').appendChild(el('div','cntline','已点亮 0 / '+valid.length+' 种'));
      drawTri(lens[0],lens[2],lens[4],false);
    },
    reveal:function(){
      return '<p>能拼成三角形的 '+valid.length+' 种组合：'+
        valid.map(function(v){return '<b>'+v.join('、')+'</b>';}).join('；')+'。</p>'+
        '<p>判定方法：两条较短边的和 > 最长边。所以 P = '+valid.length+'/10 = '+fracText(valid.length,10)+'。</p>';
    }
  };
  return m;
}

/* =====================================================================
   任务六：传话小树林（树状图 + 加乘原理）
   对应教参：例5（“四”“十”听错的信息传递问题）
   ===================================================================== */
function mTree(){
  const p=pick([10,20]);const q=100-p;
  const res=q*q+p*p;
  const chipsDef=[
    {id:'aa',path:'听对 → 听对',calc:q+'% × '+q+'%',val:q*q,ok:true},
    {id:'ab',path:'听对 → 听错',calc:q+'% × '+p+'%',val:q*p,ok:false},
    {id:'ba',path:'听错 → 听对',calc:p+'% × '+q+'%',val:p*q,ok:false},
    {id:'bb',path:'听错 → 听错',calc:p+'% × '+p+'%',val:p*p,ok:true}
  ];
  const place={};   // 记录每张卡片当前所在的容器 id
  const m={
    id:'tree',
    title:'传话小树林',
    tip:'把 4 张“传话路径”卡片拖进正确的筐：牛牛认为的日期到底是“正确”还是“错误”？（连续听错两次会怎样？）',
    story:'学校打算在 <b>1 月 4 日</b>或<b>1 月 10 日</b>组织同学们看电影（真实日期是其中一天）。确定日期后老师告诉了班长，但由于“四”和“十”发音接近，'+
      '班长有 <b>'+p+'%</b> 的可能听错；班长又把日期告诉牛牛，牛牛也有 <b>'+p+'%</b> 的可能听错。'+
      '四条传话路径的可能性如卡片所示，请把它们拖进正确的两个筐里。',
    mount:function(body){
      body.innerHTML=
       '<div class="treecol">'+
        '<div class="node">老师<br><span class="small">说出真实日期</span></div>'+
        '<div class="node">班长<br><span class="small">听对 '+q+'% / 听错 '+p+'%</span></div>'+
        '<div class="node">牛牛<br><span class="small">听对 '+q+'% / 听错 '+p+'%</span></div>'+
       '</div>'+
       '<div class="row">'+
        '<div class="col"><div class="zonelab">路径卡片（拖到下面的筐里）</div>'+
          '<div class="zone" id="treePool" style="min-height:130px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center"></div></div>'+
        '<div class="col"><div class="zonelab">牛牛认为的日期是【正确】</div>'+
          '<div class="zone tray good" id="trayOk" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"></div>'+
          '<div class="sum" id="sumOk">筐内合计：0%</div></div>'+
        '<div class="col"><div class="zonelab">牛牛认为的日期是【错误】</div>'+
          '<div class="zone tray bad" id="trayNo" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"></div>'+
          '<div class="sum" id="sumNo">筐内合计：0%</div></div>'+
       '</div>';
      const pool=body.querySelector('#treePool');
      const trayOk=body.querySelector('#trayOk');
      const trayNo=body.querySelector('#trayNo');
      shuffle(chipsDef).forEach(function(cd){
        const c=el('div','chip','<div class="pth">'+cd.path+'</div><div class="val">'+cd.calc+' = '+cd.val+'%</div>');
        c.dataset.cid=cd.id;
        pool.appendChild(c);
        place[cd.id]='treePool';
        enableDrag(c,function(){return {kind:'chip',id:cd.id,el:c};});
      });
      function sumOf(tray){let s=0;tray.querySelectorAll('.chip').forEach(function(c){
        s+=chipsDef.find(function(d){return d.id===c.dataset.cid;}).val;});return s;}
      function refresh(){
        body.querySelector('#sumOk').textContent='筐内合计：'+sumOf(trayOk)+'%';
        body.querySelector('#sumNo').textContent='筐内合计：'+sumOf(trayNo)+'%';
        const okSet=Array.prototype.map.call(trayOk.querySelectorAll('.chip'),function(c){return c.dataset.cid;}).sort().join(',');
        const noSet=Array.prototype.map.call(trayNo.querySelectorAll('.chip'),function(c){return c.dataset.cid;}).sort().join(',');
        if(okSet.length&&noSet.length&&(okSet.split(',').length+noSet.split(',').length)===4){
          const wantOk=chipsDef.filter(function(d){return d.ok;}).map(function(d){return d.id;}).sort().join(',');
          const wantNo=chipsDef.filter(function(d){return !d.ok;}).map(function(d){return d.id;}).sort().join(',');
          if(okSet===wantOk&&noSet===wantNo){
            finishMission('<div class="winbig">分类完全正确！</div>'+
              '<p><b>乘法原理</b>算出每条路：都听对 '+q+'%×'+q+'%='+(q*q)+'%，都听错 '+p+'%×'+p+'%='+(p*p)+
              '%；<b>加法原理</b>把“结果正确”的两类相加：<br>'+
              q+'% × '+q+'% + '+p+'% × '+p+'% = '+res+'%。</p>'+
              '<p>关键洞察：连续听错两次，“四”又变回“四”，日期反而对了！所以“都听对”和“都听错”都属于正确。</p>');
          }else{
            toast('四张都放进去了，但分堆不对：想想连续听错两次会怎样？可以拖出来重新分');
          }
        }
      }
      function wireZone(zel,zid){
        addZone(zel,{accepts:function(d){return d.kind==='chip';},onDrop:function(d){
          if(d.el.parentNode)d.el.parentNode.removeChild(d.el);
          zel.appendChild(d.el);place[d.id]=zid;refresh();
        }});
      }
      wireZone(pool,'treePool');wireZone(trayOk,'trayOk');wireZone(trayNo,'trayNo');
    },
    reveal:function(){
      return '<p>【正确】筐应放：<b>听对→听对</b>（'+q+'%×'+q+'%='+(q*q)+'%）和 <b>听错→听错</b>（'+p+'%×'+p+'%='+(p*p)+
        '%）——连续听错两次，日期又绕回正确的那一天。</p>'+
        '<p>【错误】筐应放：<b>听对→听错</b>和<b>听错→听对</b>（各 '+q*p+'%）。</p>'+
        '<p>所以牛牛认为正确日期的可能性 = '+q+'%×'+q+'% + '+p+'%×'+p+'% = <b>'+res+'%</b>。</p>';
    }
  };
  return m;
}

/* =====================================================================
   任务七：涂色列举棋盘（在“全部等可能结果”表格里点亮符合条件的结果）
   对应教参：练习13/14/15、例2 型列举法与树状图/表格法
   ===================================================================== */
function mGrid(level){
  const SCN={
    easy:[
      {key:'coins',h:['正面','反面'],v:['正面','反面'],vt:'第一枚硬币',ht:'第二枚硬币',

            (scn.diag&&r===c)?'不会发生':'');

            cd.addEventListener('click',function(){
              if(S.locked)return;
              if(painted.has(key))painted.delete(key);else painted.add(key);
              cd.classList.toggle('on');addStep();refresh();
            });
          }
          cells[key]=cd;
          tab.appendChild(cd);
        }
      }
      const total=scn.diag?nR*nC-nR:nR*nC;
      function refresh(){
        const k=painted.size;
        body.querySelector('#gLive').innerHTML='已点亮 <b>'+k+'</b> 格 / 全部等可能结果共 <b>'+total+
          '</b> 格 → 当前可能性 = '+fracHTML(k,total)+
          '<br><span class="small">想一想：符合条件的结果到底有哪些？点亮太多或太少都不算对哦</span>';
        if(k===favSet.size){
          let allIn=true;
          painted.forEach(function(key){if(!favSet.has(key))allIn=false;});
          if(allIn){
            finishMission('<div class="winbig">列举完全正确！</div><p>'+scn.win+'</p>'+
              '<p class="small">列举法（表格/树状图）是古典概型的基本功：先摆出所有等可能结果，再数出符合条件的结果。</p>');
          }
        }
      }
      function headHTML(h){
        if(typeof h==='string')return h;
        return ballDotHTML(h.c)+h.t;
      }
      refresh();
    },
    reveal:function(){
      const list=scn.fav.map(function(f){return '('+headText(scn.v[f[0]])+' , '+headText(scn.h[f[1]])+')';}).join('　');
      return '<p>应该点亮的 '+scn.fav.length+' 个格子：'+list+'。</p>'+
        '<p>P = '+scn.fav.length+'/'+totalText()+' = '+fracText(scn.fav.length,scn.diag?12:scn.v.length*scn.h.length)+
        '。'+scn.win+'</p>';
      function headText(h){return typeof h==='string'?h:h.t;}
    }
  };
  function totalText(){return scn.diag?12:scn.v.length*scn.h.length;}
  return m;
}

/* =====================================================================
   组卷：三档难度（初级/中级/高级）
   ===================================================================== */
function buildMissions(diff){
  let list;
  if(diff===0){
    list=[mBagFill(0),mSpinner(0),mGrid(0),mCondDraw()];
  }else if(diff===1){
    list=[mBagFill(1),mTriangle(1),mGrid(1),mSpinner(1)];
  }else{
    const pool=[mTree(),mPurple(),mGrid(2),mBagRemove(),mTriangle(2)];
    list=shuffle(pool).slice(0,4);
  }
  return shuffle(list);
}

/* =====================================================================
   任务八：取球调概率（从满袋往外取球，逆向构造概率）
   对应教参：练习16（20 个球，取出若干黑球使 P黑 达标）
   ===================================================================== */
function mBagRemove(){
  const start={yellow:5,black:8,red:7};
  const bag={yellow:5,black:8,red:7};
  const t=pick([[1,3],[1,4],[1,5]]);
  let sol=null;
  for(let m=1;m<=8;m++){if(fracEq(8-m,20-m,t[0],t[1])){sol=m;break;}}
  const msn={
    id:'bagRemove',
    title:'取球调概率',
    tip:'把袋里的球拖到“取球筐”（点袋里的球也可以直接取出），让“摸出黑球”的可能性恰好等于目标值。',
    story:'一个不透明的袋中装有 20 个只有颜色不同的球，其中 <b>5 个黄球、8 个黑球、7 个红球</b>。'+
      '现在从袋中取出若干个球（拖到取球筐里），使得搅匀后“从袋中摸出一个球是黑球”的可能性 = '+fracHTML(t[0],t[1])+'。',
    mount:function(body){
      body.innerHTML=
       '<div class="row">'+
        '<div class="col"><div class="zonelab">袋子（共 20 个球）</div><div class="bag zone" id="brBag"></div>'+
          '<div class="bagcap" id="brCap"></div></div>'+
        '<div class="col"><div class="zonelab">取球筐（拖到这里）</div><div class="zone" id="brOut" style="min-height:120px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;justify-content:center"></div>'+
          '<div class="bagcap">点筐里的球可以放回袋子</div></div>'+
        '<div class="col">'+
          '<div class="tgt">目标：P(黑球) = '+fracHTML(t[0],t[1])+'</div>'+
          '<div class="livebox" id="brLive"></div>'+
        '</div>'+
       '</div>';
      const bagEl=body.querySelector('#brBag');
      const out=body.querySelector('#brOut');
      function fillBag(){
        bagEl.innerHTML='';
        for(let i=0;i<bag.black;i++)bagEl.appendChild(ballEl('black'));
        for(let i=0;i<bag.red;i++)bagEl.appendChild(ballEl('red'));
        for(let i=0;i<bag.yellow;i++)bagEl.appendChild(ballEl('yellow'));
        Array.prototype.forEach.call(bagEl.children,function(b){
          enableDrag(b,function(){return b.parentNode===bagEl?{kind:'ball',color:b.dataset.color,src:b}:null;});
        });
      }
      fillBag();
      addZone(out,{accepts:function(d){return d.kind==='ball';},onDrop:function(d){
        if(d.src&&d.src.parentNode===bagEl){bag[d.color]--;d.src.remove();out.appendChild(ballEl(d.color,true));refresh();}
      }});
      // 点袋里的球直接取出；点筐里的球放回
      bagEl.addEventListener('click',function(ev){
        if(S.locked)return;
        const b=ev.target.closest('.ball');
        if(!b||b.parentNode!==bagEl)return;
        const c=b.dataset.color;bag[c]--;b.remove();
        out.appendChild(ballEl(c,true));addStep();refresh();
      });
      out.addEventListener('click',function(ev){
        if(S.locked)return;
        const b=ev.target.closest('.ball');
        if(!b)return;
        const c=b.dataset.color;bag[c]++;b.remove();addStep();fillBag();refresh();
      });
      function refresh(){
        const total=bag.black+bag.red+bag.yellow;
        body.querySelector('#brCap').textContent='袋里：黑 '+bag.black+' · 红 '+bag.red+' · 黄 '+bag.yellow+'（共 '+total+' 个）';
        const lv=body.querySelector('#brLive');
        if(total===0){lv.innerHTML='袋里没有球啦，先放回去一些。';return;}
        lv.innerHTML='P(黑球) = '+bag.black+' ÷ '+total+' = '+fracHTML(bag.black,total)+
          '<div class="bar"><i style="width:'+(bag.black/total*100).toFixed(1)+'%;background:#455a64"></i></div>';
        if(fracEq(bag.black,total,t[0],t[1])){
          finishMission('<div class="winbig">黑球的可能性调好啦！</div>'+
            '<p>现在袋里还有 '+total+' 个球（黑球 '+bag.black+' 个），P(黑) = '+bag.black+'/'+total+' = '+fracText(t[0],t[1])+'。</p>'+
            '<p><b>方程思想</b>（练习16）：设取出 x 个黑球，则 (8−x)/(20−x) = '+fracText(t[0],t[1])+
            '，解方程就能求出该取几个。取出别的颜色的球也会改变分母，所以要同时考虑分子分母的变化。</p>');
        }
      }
      refresh();
    },
    reveal:function(){
      if(!sol)return '正在计算参考方案……';
      return '<p>最直接的做法：只从袋里取出 <b>'+sol+' 个黑球</b>，则 P(黑) = '+(8-sol)+'/'+(20-sol)+' = '+fracText(t[0],t[1])+'。</p>'+
        '<p class="small">同时取黑球和其他球、但保持比值不变的做法也算对。</p>';
    }
  };
  return msn;
}

function finishMission(html){
  if(S.locked)return;
  S.locked=true;
  const last=S.idx>=S.missions.length-1;
  const tail=(S.missions[S.idx].revealedFlag?'<p class="small">（本关看过提示后完成）</p>':'');
  showModal('<h2>★ 本关完成！</h2><div class="mbody">'+html+tail+'</div>',
    [{label:last?'查看成绩':'下一关',cls:last?'':'green',cb:function(){

    }}]);
}
function finishRun(){
  stopTimer();
  launchConfetti(3600);
  showModal('<h2>全部通关，太厉害啦！</h2><div class="mbody" style="text-align:center">'+
    '<div class="winbig" style="font-size:32px">4 / 4 关全部完成</div>'+
    '<p>用时 <b>'+fmtTime(S.sec)+'</b> · 操作步数 <b>'+S.steps+'</b> 步'+
    (S.revealed?(' · 揭示答案 <b>'+S.revealed+'</b> 次'):'（全程未看答案，了不起！）')+'</p>'+
    '<p>你已经在游戏里用过了<b>古典概型、列举法、加法原理、乘法原理、有放回与不放回、反向考虑</b>这些本领。</p></div>',
    [{label:'再玩一次（换新题目）',cls:'green',cb:function(){startRun(S.diff);}},

}

/* ---------------- 底部按钮 ---------------- */
$('#btnRules').addEventListener('click',function(){

   '<p><b>目标</b>：依次完成 4 个概率小关，通过“操作”让可能性（概率）达到目标。</p>'+
   '<ul><li>拖动：按住球/线段/卡片，拖到虚线框里松手；点一下放过的东西通常可以放回。</li>'+
   '<li>涂色：点击转盘扇形（灰→红→蓝→还原）或表格格子来点亮。</li>'+
   '<li>右上角显示<b>用时</b>和<b>操作步数</b>，步数越少说明想得越清楚。</li>'+
   '<li>卡住了点“揭示答案”看参考方案；点“重新开始本关”可以重来；点“返回难度选择”换难度。</li></ul>'+
   '<p><b>知识锦囊</b>：可能性（概率）= 符合条件的情况数 ÷ 所有等可能的情况数；'+
   '分步用乘法原理，分类用加法原理；情况很多时可以先算“不符合”再反过来（反向考虑）。</p></div>',
   [{label:'知道啦',cls:'green'}]);
});
$('#btnReveal').addEventListener('click',function(){
  if(!S.started){toast('请先在主页选择难度出发');return;}
  const m=S.missions[S.idx];
  m.revealedFlag=true;S.revealed++;
  showModal('<h2>本关参考方案</h2><div class="mbody">'+m.reveal()+
    '<p class="small">看过提示也完全可以继续动手完成这一关哦！</p></div>',
    [{label:'继续挑战',cls:'green'}]);
});
$('#btnRestart').addEventListener('click',function(){
  if(!S.started){toast('请先在主页选择难度出发');return;}
  toast('本关已重置，重新试一试！');
  mountMission();
});
$('#btnHome').addEventListener('click',function(){showMenu();});

/* ---------------- 启动 ---------------- */
applyPalette();
showMenu();
</script>
