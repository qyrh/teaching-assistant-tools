<script>"use strict";const $=s=>document.querySelector(s);const randInt=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!==void 0)e.innerHTML=html;return e}function yearName(y){if(y<0)return-y+" 年前";if(y>0)return y+" 年后";return"今年"}const PALETTES=[{main:"#1565c0",main2:"#64b5f6",bg:"#e6f2fc",soft:"#dbeafc"},{main:"#e65100",main2:"#ffb74d",bg:"#fdf1e3",soft:"#ffe8cc"},{main:"#2e7d32",main2:"#81c784",bg:"#e9f5ea",soft:"#d7f0d9"},{main:"#6a1b9a",main2:"#ba68c8",bg:"#f4e9fa",soft:"#eddcf7"},{main:"#c2185b",main2:"#f06292",bg:"#fde9f1",soft:"#fad2e3"},{main:"#00838f",main2:"#4dd0e1",bg:"#e0f6f8",soft:"#cdeef2"}];function applyPalette(){const p=PALETTES[randInt(0,PALETTES.length-1)];const r=document.documentElement.style;r.setProperty("--main",p.main);r.setProperty("--main2",p.main2);r.setProperty("--bg",p.bg);r.setProperty("--soft",p.soft)}const POOL={easy:[{type:"lab",src:"B卷·第1题",text:"甲5年前的年龄等于乙5年后的年龄，甲今年的年龄是乙今年年龄的3倍。甲和乙今年分别多少岁？",hint:'先把时光机拨到"今年"检查倍数关系；第一条条件随时都在检查。',people:[{name:"甲",emoji:"👦",min:10,max:40,ans:15},{name:"乙",emoji:"👧",min:1,max:20,ans:5}],timeMin:-10,timeMax:10,conds:[{desc:"甲5年前的年龄 = 乙5年后的年龄",read:P=>"甲5年前 "+(P["甲"]-5)+" 岁 ｜ 乙5年后 "+(P["乙"]+5)+" 岁",ok:P=>P["甲"]-5===P["乙"]+5},{desc:"今年：甲的年龄是乙的3倍",year:0,read:P=>"现在甲是乙的 "+(P["乙"]>0?(P["甲"]/P["乙"]).toFixed(1):"—")+" 倍",ok:P=>P["甲"]===P["乙"]*3}],ans:"两人的年龄差永远不变：5年前甲的年龄 = 5年后乙的年龄，说明甲比乙大 5+5=10（岁）。\n又知甲是乙的3倍：把乙看作1份，甲是3份，相差3-1=2份。\n10 ÷ 2 = 5（岁），所以乙今年5岁，甲今年 5×3=15（岁）。"},{type:"lab",src:"A卷·第1题",text:"儿子今年18岁，15年前父亲的年龄是儿子的10倍。问：父亲今年多少岁？",hint:'把时光机拨到"15年前"，观察父子俩那时的年龄，再调整父亲的年龄滑块。',people:[{name:"儿子",emoji:"👦",min:18,max:18,ans:18,fixed:true},{name:"父亲",emoji:"👨",min:20,max:70,ans:45}],timeMin:-20,timeMax:5,conds:[{desc:"15年前：父亲的年龄是儿子的10倍",year:-15,read:P=>"15年前：父亲 "+(P["父亲"]-15)+" 岁 ｜ 儿子 "+(P["儿子"]-15)+" 岁的10倍是 "+(P["儿子"]-15)*10+" 岁",ok:P=>P["父亲"]-15===(P["儿子"]-15)*10}],ans:"15年前儿子的年龄：18-15=3（岁）；那时父亲是儿子的10倍：3×10=30（岁）。\n父亲今年：30+15=45（岁）。"},{type:"blocks",src:"和倍变式",text:"爷爷和孙子的年龄加在一起正好是72岁，今年爷爷的年龄是孙子的8倍。爷爷和孙子今年各多少岁？",hint:'把孙子的年龄看作"1份"，往两个人的年龄槽里拖积木：孙子几块？爷爷几块？',roles:[{name:"孙子",emoji:"👦"},{name:"爷爷",emoji:"👴"}],trayN:18,pieceMax:15,ansP:8,conds:[{desc:"爷爷的积木块数是孙子的8倍",read:(n,p)=>"爷爷 "+n["爷爷"]+" 块 ｜ 孙子 "+n["孙子"]+" 块 × 8 = "+n["孙子"]*8+" 块",ok:(n,p)=>n["孙子"]>=1&&n["爷爷"]===n["孙子"]*8},{desc:"两人年龄总和 = 72 岁",read:(n,p)=>"现在总和 "+(n["孙子"]+n["爷爷"])*p+" 岁（目标 72 岁）",ok:(n,p)=>(n["孙子"]+n["爷爷"])*p===72}],ans:"把孙子的年龄看作1份，爷爷的年龄是这样的8份，一共 1+8=9（份）。\n每份：72 ÷ 9 = 8（岁）。\n所以孙子今年8岁，爷爷今年 8×8=64（岁）。"},{type:"blocks",src:"和倍变式",text:"妈妈和小红的年龄加在一起正好是35岁，今年妈妈的年龄是小红的6倍。妈妈和小红今年各多少岁？",hint:'把小红的年龄看作"1份"，用积木铺一铺：小红几块？妈妈几块？',roles:[{name:"小红",emoji:"👧"},{name:"妈妈",emoji:"👩"}],trayN:16,pieceMax:15,ansP:5,conds:[{desc:"妈妈的积木块数是小红的6倍",read:(n,p)=>"妈妈 "+n["妈妈"]+" 块 ｜ 小红 "+n["小红"]+" 块 × 6 = "+n["小红"]*6+" 块",ok:(n,p)=>n["小红"]>=1&&n["妈妈"]===n["小红"]*6},{desc:"两人年龄总和 = 35 岁",read:(n,p)=>"现在总和 "+(n["小红"]+n["妈妈"])*p+" 岁（目标 35 岁）",ok:(n,p)=>(n["小红"]+n["妈妈"])*p===35}],ans:"把小红的年龄看作1份，妈妈是这样的6份，一共 1+6=7（份）。\n每份：35 ÷ 7 = 5（岁）。\n所以小红今年5岁，妈妈今年 5×6=30（岁）。"},{type:"axis",src:"例5",text:'小明问李老师今年多少岁，李老师说："当我像你这么大时，你才3岁；当你像我这么大时，我已经42岁了。"李老师今年多少岁？小明今年多少岁？',hint:'从3岁到42岁之间正好铺了3个"年龄差"。拖动两个圆点，让三段彩线一样长！',axisMax:50,anchors:[{pos:3,label:"3岁"},{pos:42,label:"42岁"}],points:[{name:"小明今年",emoji:"👦",min:4,max:40,ans:16},{name:"李老师今年",emoji:"👨‍🏫",min:5,max:41,ans:29}],ans:"两人的年龄差永远不变。从图中看出：3岁到42岁之间正好是3个年龄差。\n年龄差：(42-3) ÷ 3 = 13（岁）。\n小明今年：3+13=16（岁），李老师今年：16+13=29（岁）。"}],mid:[{type:"lab",src:"思考与练习·第10题",text:"今年小亮的年龄是小英的2倍，6年前小亮的年龄是小英的5倍。小英和小亮今年各是多少岁？",hint:'先在"今年"点亮第一盏灯，再把时光机拨到"6年前"点亮第二盏灯。',people:[{name:"小英",emoji:"👧",min:1,max:30,ans:8},{name:"小亮",emoji:"👦",min:1,max:60,ans:16}],timeMin:-10,timeMax:10,conds:[{desc:"今年：小亮是小英的2倍",year:0,read:P=>"现在小亮是小英的 "+(P["小英"]>0?(P["小亮"]/P["小英"]).toFixed(1):"—")+" 倍",ok:P=>P["小亮"]===P["小英"]*2},{desc:"6年前：小亮是小英的5倍",year:-6,read:P=>P["小英"]<6?"6年前小英还未出生，条件无法成立":"6年前：小亮 "+(P["小亮"]-6)+" 岁 ｜ 小英 "+(P["小英"]-6)+" 岁的5倍是 "+(P["小英"]-6)*5+" 岁",ok:P=>P["小英"]>=6&&P["小亮"]-6===(P["小英"]-6)*5}],ans:'设小英今年 x 岁，则小亮今年 2x 岁。\n6年前：小亮 2x-6 岁，小英 x-6 岁，由"5倍"得 2x-6 = 5(x-6)。\n解得 3x = 24，x = 8。\n所以小英今年8岁，小亮今年 8×2=16（岁）。'},{type:"lab",src:"例3",text:"今年小红的年龄是小梅的5倍，3年后小红的年龄是小梅的2倍。小红和小梅今年各是多少岁？",hint:'3年后两人各长3岁。先点亮"今年"的灯，再把时光机拨到"3年后"。',people:[{name:"小梅",emoji:"👧",min:1,max:20,ans:1},{name:"小红",emoji:"👩",min:1,max:40,ans:5}],timeMin:-5,timeMax:10,conds:[{desc:"今年：小红是小梅的5倍",year:0,read:P=>"现在小红是小梅的 "+(P["小梅"]>0?(P["小红"]/P["小梅"]).toFixed(1):"—")+" 倍",ok:P=>P["小红"]===P["小梅"]*5},{desc:"3年后：小红是小梅的2倍",year:3,read:P=>"3年后：小红 "+(P["小红"]+3)+" 岁 ｜ 小梅 "+(P["小梅"]+3)+" 岁的2倍是 "+(P["小梅"]+3)*2+" 岁",ok:P=>P["小红"]+3===(P["小梅"]+3)*2}],ans:"用假设法：3年后两人各长3岁。假如小红仍保持是小梅的5倍，小红要长 3×5=15（岁），\n但她实际只长了3岁，少长了 15-3=12（岁），所以倍数从5倍降到2倍，少了 5-2=3 倍。\n3年后小梅：12 ÷ 3 = 4（岁）。今年小梅 4-3=1（岁），小红 1×5=5（岁）。"},{type:"lab",src:"B卷·第3题",text:"张明5年前的年龄与李达8年后的年龄相等；张明4年后与李达3年前的年龄和是36岁。张明和李达今年各多少岁？",hint:"第一条：张明5年前 = 李达8年后，说明两人相差 5+8=13 岁。两条条件都随时在检查。",people:[{name:"张明",emoji:"👦",min:10,max:50,ans:24},{name:"李达",emoji:"👧",min:1,max:30,ans:11}],timeMin:-10,timeMax:10,conds:[{desc:"张明5年前的年龄 = 李达8年后的年龄",read:P=>"张明5年前 "+(P["张明"]-5)+" 岁 ｜ 李达8年后 "+(P["李达"]+8)+" 岁",ok:P=>P["张明"]-5===P["李达"]+8},{desc:"张明4年后与李达3年前的年龄和是36岁",read:P=>"(张明+4) + (李达-3) = "+(P["张明"]+4+(P["李达"]-3))+" 岁（目标 36 岁）",ok:P=>P["张明"]+4+(P["李达"]-3)===36}],ans:'由"张明5年前 = 李达8年后"可知：张明比李达大 5+8=13（岁）。\n"张明4年后与李达3年前的年龄和是36岁"折算到今年：36-4+3=35（岁）。\n张明：(35+13) ÷ 2 = 24（岁）；李达：(35-13) ÷ 2 = 11（岁）。'},{type:"lab",src:"思考与练习·第4题",text:"大马年龄是小马年龄的4倍，再过20年大马的年龄比小马年龄的2倍小14岁。大马、小马现在各多少岁？",hint:'先点亮"今年"的4倍灯，再把时光机拨到"20年后"点亮第二盏灯。',people:[{name:"小马",emoji:"🐴",min:1,max:20,ans:3},{name:"大马",emoji:"🐎",min:1,max:60,ans:12}],timeMin:-5,timeMax:25,conds:[{desc:"今年：大马是小马的4倍",year:0,read:P=>"现在大马是小马的 "+(P["小马"]>0?(P["大马"]/P["小马"]).toFixed(1):"—")+" 倍",ok:P=>P["大马"]===P["小马"]*4},{desc:"20年后：大马比小马的2倍小14岁",year:20,read:P=>"20年后：大马 "+(P["大马"]+20)+" 岁 ｜ 小马 "+(P["小马"]+20)+" 岁的2倍减14是 "+((P["小马"]+20)*2-14)+" 岁",ok:P=>P["大马"]+20===(P["小马"]+20)*2-14}],ans:"设小马今年 x 岁，大马今年 4x 岁。\n20年后：4x+20 = 2(x+20)-14，即 4x+20 = 2x+26。\n解得 2x = 6，x = 3。\n所以小马现在3岁，大马现在 3×4=12（岁）。"},{type:"lab",src:"思考与练习·第1题",text:"今年小明和妈妈的年龄和是42岁，6年前妈妈的年龄是小明的14倍。小明和妈妈今年各是多少岁？",hint:'先点亮"今年年龄和"的灯，再拨到"6年前"点亮14倍的灯。',people:[{name:"小明",emoji:"👦",min:1,max:25,ans:8},{name:"妈妈",emoji:"👩",min:20,max:50,ans:34}],timeMin:-10,timeMax:10,conds:[{desc:"今年：小明和妈妈的年龄和是42岁",year:0,read:P=>"现在年龄和 "+(P["小明"]+P["妈妈"])+" 岁（目标 42 岁）",ok:P=>P["小明"]+P["妈妈"]===42},{desc:"6年前：妈妈是小明的14倍",year:-6,read:P=>P["小明"]<6?"6年前小明还未出生，条件无法成立":"6年前：妈妈 "+(P["妈妈"]-6)+" 岁 ｜ 小明 "+(P["小明"]-6)+" 岁的14倍是 "+(P["小明"]-6)*14+" 岁",ok:P=>P["小明"]>=6&&P["妈妈"]-6===(P["小明"]-6)*14}],ans:"6年前两人的年龄和：42-6×2=30（岁）。\n那时妈妈是小明的14倍：小明 30 ÷ (14+1) = 2（岁），妈妈 2×14=28（岁）。\n今年小明 2+6=8（岁），妈妈 28+6=34（岁）。"},{type:"lab",src:"例1",text:"已知祖父和父亲、父亲和孙子年龄的差是一样的，又知祖父和孙子的年龄之和为84岁，这个岁数再加上孙子的年龄，正好是100岁。问三个人年龄各是多少？",hint:'三个人的年龄差相等：祖父-父亲 = 父亲-孙子。三条条件都在"今年"检查。',people:[{name:"孙子",emoji:"👦",min:1,max:30,ans:16},{name:"父亲",emoji:"👨",min:20,max:60,ans:42},{name:"祖父",emoji:"👴",min:40,max:85,ans:68}],timeMin:-10,timeMax:10,conds:[{desc:"今年：祖父和孙子的年龄和是84岁",year:0,read:P=>"现在祖父+孙子 = "+(P["祖父"]+P["孙子"])+" 岁（目标 84 岁）",ok:P=>P["祖父"]+P["孙子"]===84},{desc:"祖父孙子的和再加上孙子，正好是100岁",year:0,read:P=>"现在 祖父+孙子+孙子 = "+(P["祖父"]+P["孙子"]*2)+" 岁（目标 100 岁）",ok:P=>P["祖父"]+P["孙子"]*2===100},{desc:"父亲-孙子 = 祖父-父亲（两个年龄差一样）",year:0,read:P=>"父亲-孙子 "+(P["父亲"]-P["孙子"])+" 岁 ｜ 祖父-父亲 "+(P["祖父"]-P["父亲"])+" 岁",ok:P=>P["父亲"]-P["孙子"]===P["祖父"]-P["父亲"]&&P["父亲"]>P["孙子"]}],ans:"祖父和孙子的年龄和加上孙子的年龄是100岁，所以孙子：100-84=16（岁），祖父：84-16=68（岁）。\n祖父比孙子大 68-16=52（岁），这正好是两个相同的年龄差，一个差是 52 ÷ 2 = 26（岁）。\n父亲今年：16+26=42（岁）。"},{type:"blocks",src:"和倍变式",text:"爸爸和儿子的年龄加在一起正好是45岁，今年爸爸的年龄是儿子的4倍。爸爸和儿子今年各多少岁？",hint:'把儿子的年龄看作"1份"，用积木铺一铺两人的年龄槽。',roles:[{name:"儿子",emoji:"👦"},{name:"爸爸",emoji:"👨"}],trayN:14,pieceMax:15,ansP:9,conds:[{desc:"爸爸的积木块数是儿子的
