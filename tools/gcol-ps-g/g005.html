<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>智慧牧场·复杂鸡兔同笼大闯关</title>
<style>
/* ============================================================
   智慧牧场·复杂鸡兔同笼大闯关
   单文件自包含互动游戏：零外部依赖，纯内联 CSS + JS
   核心玩法与数学方法深度绑定：
   1) 牧场打包关：拖车送走多出来的动物 → 天平平衡 → 6脚一包打包 → 拖数字点名
   2) 竞赛翻牌关：假设全对 → 翻牌找错题看差值 → 拖数字上颁奖台
   ============================================================ */

/* ---------- 全局变量（每局随机换色板） ---------- */
:root{
  --c-main:#f4772e;      /* 主色 */
  --c-main-d:#c95817;    /* 主色深 */
  --c-bg:#fff6ee;        /* 背景 */
  --c-card:#ffffff;      /* 卡片底 */
  --c-ink:#3a2a1c;       /* 正文墨色 */
  --c-soft:#ffe3cc;      /* 浅色块 */
  --c-ok:#2f9e44;        /* 成功绿 */
  --c-warn:#e8590c;      /* 提醒橙 */
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--c-bg);
  color:var(--c-ink);
  font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;
  font-size:19px; line-height:1.55;
  min-height:100vh;
}
b{font-weight:800;}
button{font-family:inherit;}

/* ---------- 屏幕切换 ---------- */
.screen{display:none; width:100%; max-width:1020px; margin:0 auto; padding:14px 14px 40px;}
.screen.active{display:block;}

/* ---------- 难度选择菜单 ---------- */
.menu-box{text-align:center; padding-top:26px;}
.menu-box h1{
  font-size:clamp(26px,4.6vw,44px); margin:10px 0 6px;
  color:var(--c-main-d); letter-spacing:2px; text-shadow:0 2px 0 rgba(0,0,0,.06);
}
.menu-sub{font-size:clamp(16px,2.4vw,22px); color:#7c6a58; margin:0 0 22px;}
.diff-cards{
  display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-bottom:22px;
}
.diff-card{
  flex:1 1 220px; max-width:290px;
  background:var(--c-card); border:4px solid var(--c-main); border-radius:22px;
  padding:20px 16px; cursor:pointer; display:flex; flex-direction:column; gap:8px;
  box-shadow:0 8px 0 var(--c-main-d); transition:transform .15s;
  min-height:180px; justify-content:center;
}
.diff-card:hover{transform:translateY(-4px);}
.diff-card:active{transform:translateY(2px); box-shadow:0 4px 0 var(--c-main-d);}
.dc-badge{font-size:40px; line-height:1;}
.dc-name{font-size:30px; font-weight:900; color:var(--c-main-d);}
.dc-sub{font-size:20px; font-weight:700; color:var(--c-ink);}
.dc-desc{font-size:16px; color:#8a7663;}

/* ---------- 顶部信息条 ---------- */
.hud{
  position:sticky; top:0; z-index:50;
  background:var(--c-card); border-bottom:3px solid var(--c-soft);
  border-radius:0 0 16px 16px;
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding:10px 14px; margin-bottom:14px; flex-wrap:wrap;
  box-shadow:0 3px 10px rgba(0,0,0,.07);
}
.hud-l{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
.hud-title{font-size:22px; font-weight:900; color:var(--c-main-d);}
.hud-level{font-size:17px; font-weight:700; background:var(--c-soft); padding:3px 12px; border-radius:999px;}
.dots{display:inline-flex; gap:6px; align-items:center;}
.dot{width:14px;height:14px;border-radius:50%;background:#d9cdbf;display:inline-block;border:2px solid #b8a894;}
.dot.now{background:var(--c-main);border-color:var(--c-main-d);animation:pulse 1.2s infinite;}
.dot.done{background:var(--c-ok);border-color:#1d6f2e;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.3);}}
.hud-r{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.meter{font-size:17px; font-weight:700; background:var(--c-soft); border-radius:12px; padding:4px 10px; white-space:nowrap;}
.meter b{color:var(--c-main-d); font-size:19px;}

/* ---------- 通用按钮 ---------- */
.btn{
  border:none; border-radius:14px; cursor:pointer;
  background:var(--c-main); color:#fff; font-weight:800;
  box-shadow:0 4px 0 var(--c-main-d);
  transition:transform .12s; padding:10px 18px; font-size:18px;
}
.btn:hover{transform:translateY(-2px);}
.btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--c-main-d);}
.btn:disabled{background:#c9bcae; box-shadow:0 4px 0 #a4937f; cursor:not-allowed; transform:none; color:#f4efe8;}
.btn.sm{font-size:15px; padding:7px 12px; border-radius:11px;}
.btn.warn{background:#8f5fd6; box-shadow:0 4px 0 #6a40ab;}
.btn.warn:disabled{background:#c9bcae;}
.btn.back{background:#7d8a96; box-shadow:0 4px 0 #5a6672;}
.btn.big{font-size:22px; padding:14px 34px; border-radius:18px;}
.btn.ok{background:var(--c-ok); box-shadow:0 4px 0 #1d6f2e;}

/* ---------- 题目卡片 ---------- */
.q-card{
  background:var(--c-card); border:3px solid var(--c-main); border-radius:18px;
  padding:16px 18px; margin:14px 0; box-shadow:0 4px 12px rgba(0,0,0,.06);
}
.q-tag{
  display:inline-block; background:var(--c-main); color:#fff; font-weight:900;
  border-radius:10px; padding:2px 14px; font-size:17px; margin-bottom:8px;
}
.q-text{font-size:clamp(18px,2.6vw,23px); font-weight:700; margin:6px 0 10px;}
.q-facts{display:flex; gap:10px; flex-wrap:wrap;}
.fact{
  background:var(--c-soft); border-radius:12px; padding:5px 14px;
  font-size:17px; font-weight:700;
}

/* ---------- 关卡阶段面板 ---------- */
.stage{
  background:var(--c-card); border:3px dashed #d9cdbf; border-radius:18px;
  padding:16px 18px; margin:16px 0; opacity:.38; pointer-events:none;
  transition:opacity .4s, border-color .4s; position:relative;
}
.stage.open{opacity:1; pointer-events:auto; border-color:var(--c-main);}
.stage.done{border-style:solid; border-color:var(--c-ok); background:#f4fff5;}
.stage-done-badge{
  position:absolute; top:-14px; right:14px; background:var(--c-ok); color:#fff;
  font-weight:900; border-radius:999px; padding:2px 14px; font-size:16px;
  box-shadow:0 3px 0 #1d6f2e;
}
.stage-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px;}
.stage-no{
  background:var(--c-main); color:#fff; font-weight:900; border-radius:10px;
  padding:2px 12px; font-size:17px; white-space:nowrap;
}
.stage-head h3{margin:0; font-size:22px; color:var(--c-main-d);}
.stage-tip{margin:4px 0 12px; font-size:17px; color:#7c6a58;}

/* ---------- 天平 ---------- */
.beam-box{display:flex; justify-content:center; margin:4px 0 6px;}
.beam-svg{width:min(340px,86%); height:auto; display:block;}
.beam-caps{display:flex; justify-content:center; gap:36px; font-size:17px; font-weight:700; color:#7c6a58;}
.beam-caps span b{color:var(--c-main-d);}
.beam-msg{
  text-align:center; font-size:clamp(17px,2.4vw,21px); font-weight:800;
  background:var(--c-soft); border-radius:14px; padding:10px 14px; margin:12px 0;
}
.beam-msg.bal{background:#d3f5d8; color:#1d6f2e; animation:pulse 1s infinite;}

/* ---------- 拖动滑轨（送走小车） ---------- */
.slider-row{padding:6px 4px 2px;}
.track{
  position:relative; height:52px; border-radius:26px; background:#efe4d6;
  border:3px solid #d9c6ae; touch-action:none; cursor:pointer; user-select:none;
}
.track-fill{
  position:absolute; left:0; top:0; bottom:0; width:0%;
  background:linear-gradient(90deg,var(--c-soft),var(--c-main));
  border-radius:23px 0 0 23px; opacity:.85;
}
.track-ticks{position:absolute; left:0; right:0; top:0; bottom:0;}
.tick{position:absolute; top:6px; bottom:6px; width:2px; background:rgba(0,0,0,.14);}
.tick-num{position:absolute; top:100%; margin-top:2px; transform:translateX(-50%); font-size:14px; color:#9b8a72;}
.handle{
  position:absolute; top:50%; width:56px; height:56px; border-radius:50%;
  background:var(--c-card); border:4px solid var(--c-main-d);
  transform:translate(-50%,-50%); display:flex; align-items:center; justify-content:center;
  font-size:28px; cursor:grab; touch-action:none; user-select:none;
  box-shadow:0 4px 8px rgba(0,0,0,.22); z-index:3; left:0%;
}
.handle:active{cursor:grabbing;}
.slider-cap{display:flex; justify-content:space-between; font-size:15px; color:#9b8a72; margin-top:20px;}

/* ---------- 数据条 ---------- */
.stat-row{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin:12px 0;}
.stat{
  background:var(--c-soft); border-radius:14px; padding:8px 16px;
  font-size:17px; font-weight:700; min-width:130px; text-align:center;
}
.stat b{color:var(--c-main-d); font-size:22px;}
.unit-tip{
  text-align:center; font-size:17px; font-weight:800; color:var(--c-main-d);
  background:#fff7e8; border:2px dashed var(--c-main); border-radius:12px; padding:8px 12px; margin:10px 0;
}

/* ---------- 打包带（第二阶段） ---------- */
.pack-wrap{padding:4px 2px 0;}
.pack-track{
  position:relative; height:56px; border-radius:14px; background:#efe4d6;
  border:3px solid #d9c6ae; touch-action:none; cursor:pointer; user-select:none;
  --nmax:10;
  background-image:linear-gradient(to right, rgba(0,0,0,.16) 1.5px, transparent 1.5px);
  background-size:calc(100%/var(--nmax)) 100%;
}
.pack-fill{
  position:absolute; left:0; top:0; bottom:0; width:0%;
  background:repeating-linear-gradient(45deg,var(--c-main),var(--c-main) 12px,var(--c-main-d) 12px,var(--c-main-d) 24px);
  border-radius:11px 0 0 11px; opacity:.8;
}
.pack-handle{
  position:absolute; top:50%; width:58px; height:58px; border-radius:14px;
  background:var(--c-card); border:4px solid var(--c-main-d);
  transform:translate(-50%,-50%); display:flex; align-items:center; justify-content:center;
  font-size:30px; cursor:grab; touch-action:none; user-select:none;
  box-shadow:0 4px 8px rgba(0,0,0,.22); z-index:3; left:0%;
}
.pack-scale{position:relative; height:26px; margin-top:6px;}
.pack-scale span{position:absolute; transform:translateX(-50%); font-size:15px; color:#9b8a72; font-weight:700;}
.pack-done-msg{
  text-align:center; font-size:20px; font-weight:900; color:#1d6f2e; margin:10px 0 2px;
}

/* ---------- 点名入舍（第三阶段） ---------- */
.slots{display:flex; gap:18px; justify-content:center; flex-wrap:wrap; margin:12px 0;}
.slot{
  flex:1 1 200px; max-width:280px; min-height:118px;
  background:#fffdf7; border:3px dashed var(--c-main); border-radius:18px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  padding:10px; transition:background .2s, border-color .2s;
}
.slot.hot{background:#fff0d6; border-color:var(--c-warn); transform:scale(1.04);}
.slot.filled{border-style:solid; border-color:var(--c-ok); background:#f0fff2;}
.slot-label{font-size:20px; font-weight:800; color:var(--c-main-d);}
.slot-hole{font-size:17px; color:#b3a18c; font-weight:700;}
.slot-val{font-size:34px; font-weight:900; color:var(--c-ok);}
.slot-unit{font-size:16px; color:#7c6a58; font-weight:700;}
.chip-tray{
  display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin:14px 0 6px;
  min-height:74px; padding:6px;
}
.chip{
  width:74px; height:64px; border-radius:16px; background:var(--c-card);
  border:3px solid var(--c-main); box-shadow:0 4px 0 var(--c-main-d);
  display:flex; align-items:center; justify-content:center;
  font-size:26px; font-weight:900; color:var(--c-main-d);
  cursor:grab; touch-action:none; user-select:none; z-index:5;
}
.chip:hover{transform:translateY(-3px);}
.chip.used{opacity:0; pointer-events:none;}
.chip.ghost{
  position:fixed; left:0; top:0; z-index:2000; pointer-events:none;
  transform:scale(1.12); box-shadow:0 10px 18px rgba(0,0,0,.3);
}

/* ---------- 竞赛记分板 ---------- */
.score-board{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin:12px 0;}
.score-cell{
  flex:1 1 150px; max-width:230px; text-align:center; border-radius:16px;
  padding:10px 8px; font-size:17px; font-weight:700; background:#f3ede4; border:3px solid #d9cdbf;
}
.score-cell b{display:block; font-size:34px; color:var(--c-main-d); line-height:1.15;}
.score-cell.now{background:#fff7e8; border-color:var(--c-main);}
.score-cell.now b{color:var(--c-warn);}
.score-cell.target{background:#eef6ff; border-color:#6a9fd6;}
.score-cell.target b{color:#2f6cad;}
.score-cell.hit{background:#e3f9e7; border-color:var(--c-ok);}
.score-cell.hit b{color:var(--c-ok);}
.flip-tip{font-size:17px; text-align:center; color:#7c6a58; margin:8px 0;}
.tiles{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(76px,1fr));
  gap:10px; margin:12px 0; touch-action:manipulation;
}
.tile{height:78px; perspective:600px; cursor:pointer;}
.tile-in{
  position:relative; width:100%; height:100%; transform-style:preserve-3d;
  transition:transform .45s; border-radius:14px;
}
.tile.wrong .tile-in{transform:rotateY(180deg);}
.face{
  position:absolute; inset:0; border-radius:14px; backface-visibility:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  font-weight:900; border:3px solid;
}
.face.front{background:#e9f8ec; border-color:#79c98b; color:#1d6f2e;}
.face.back{background:#fdeeee; border-color:#e08c8c; color:#b64545; transform:rotateY(180deg);}
.face .mk{font-size:26px; line-height:1;}
.face .pt{font-size:15px;}
.face .no{position:absolute; top:3px; left:8px; font-size:13px; opacity:.55; font-weight:700;}
.tiles.locked .tile{cursor:default;}
.float-pt{
  position:absolute; left:50%; top:0; transform:translateX(-50%);
  font-size:20px; font-weight:900; pointer-events:none; z-index:6;
  animation:floatUp .95s forwards;
}
@keyframes floatUp{0%{opacity:1; translate:0 0;}100%{opacity:0; translate:0 -46px;}}
.diff-strip{
  text-align:center; font-size:19px; font-weight:800; background:var(--c-soft);
  border-radius:14px; padding:9px 12px; margin:12px 0;
}
.diff-strip.over{background:#fdeeee; color:#b64545;}
.diff-strip.equal{background:#d3f5d8; color:#1d6f2e;}
.derive{
  background:#f4f0ff; border:3px solid #8f5fd6; border-radius:16px;
  padding:12px 16px; font-size:17.5px; font-weight:700; margin:12px 0; line-height:1.9;
}
.derive h4{margin:0 0 4px; color:#6a40ab; font-size:19px;}

/* ---------- 底部按钮行 ---------- */
.foot-bar{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:18px;}

/* ---------- 结算 ---------- */
.final-box{text-align:center; padding-top:30px;}
.final-trophy{font-size:86px; animation:bounceT 1.2s infinite;}
@keyframes bounceT{0%,100%{transform:translateY(0);}50%{transform:translateY(-16px);}}
.final-box h2{font-size:clamp(26px,4vw,40px); color:var(--c-main-d); margin:8px 0 16px;}
.final-stats{
  display:inline-block; text-align:left; background:var(--c-card);
  border:3px solid var(--c-main); border-radius:18px; padding:16px 30px; margin-bottom:20px;
  font-size:20px; font-weight:700;
}
.final-stats b{color:var(--c-main-d);}
.final-btns{display:flex; gap:16px; justify-content:center; flex-wrap:wrap;}

/* ---------- 弹窗 ---------- */
.mask{
  position:fixed; inset:0; background:rgba(40,28,16,.55); z-index:1000;
  display:none; align-items:center; justify-content:center; padding:16px;
}
.mask.show{display:flex;}
.modal{
  background:var(--c-card); border-radius:22px; border:4px solid var(--c-main);
  max-width:640px; width:100%; max-height:86vh; overflow-y:auto;
  padding:20px 22px; box-shadow:0 20px 50px rgba(0,0,0,.35);
  animation:popIn .28s;
}
@keyframes popIn{0%{transform:scale(.85); opacity:0;}100%{transform:scale(1); opacity:1;}}
.modal h2{margin:4px 0 10px; color:var(--c-main-d); font-size:26px; text-align:center;}
.modal p{font-size:18px; margin:8px 0;}
.rule-part{background:var(--c-soft); border-radius:14px; padding:10px 14px; margin:10px 0;}
.rule-part h3{margin:2px 0 6px; font-size:20px; color:var(--c-main-d);}
.sol-box{
  background:#f7f4ee; border:2px solid #d9cdbf; border-radius:14px;
  padding:12px 16px; font-size:17.5px; font-weight:700; line-height:1.9; text-align:left;
}
.clear-box{text-align:center;}
.clear-emoji{font-size:64px;}
.clear-star{font-size:19px; color:#b0862a; font-weight:800; margin:6px 0;}
.btn-row{display:flex; justify-content:center; gap:14px; flex-wrap:wrap; margin-top:14px;}

/* ---------- 轻提示 ---------- */
.toast{
  position:fixed; left:50%; bottom:36px; transform:translateX(-50%) translateY(20px);
  background:rgba(51,37,20,.92); color:#fff; font-size:18px; font-weight:700;
  border-radius:14px; padding:10px 22px; z-index:1500; opacity:0;
  pointer-events:none; transition:opacity .25s, transform .25s; max-width:88vw; text-align:center;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ---------- 撒花画布 ---------- */
#fx{position:fixed; inset:0; pointer-events:none; z-index:900;}

/* ---------- 响应式微调 ---------- */
@media (max-width:640px){
  body{font-size:17px;}
  .hud{padding:8px 10px;}
  .hud-title{font-size:18px;}
  .meter{font-size:14px; padding:3px 8px;}
  .btn.sm{font-size:13px; padding:6px 9px;}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(62px,1fr)); gap:8px;}
  .tile{height:66px;}
  .chip{width:64px; height:58px; font-size:22px;}
  .stat{min-width:104px; font-size:15px; padding:6px 10px;}
  .score-cell b{font-size:28px;}
}
</style>
</head>
<body>

<!-- 撒花庆祝画布 -->
<canvas id="fx"></canvas>

<!-- ============ 屏幕一：难度选择 ============ -->
<section id="screen-menu" class="screen active">
  <div class="menu-box">
    <div style="font-size:56px;">🐣🐇</div>
    <h1>智慧牧场 · 复杂鸡兔同笼</h1>
    <p class="menu-sub">送一送 · 捆一捆 · 翻一翻 —— 玩着玩着就会「假设法」啦！</p>
    <div class="diff-cards">
      <button class="diff-card" data-d="easy">
        <span class="dc-badge">🐥</span>
        <span class="dc-name">初级</span>
        <span class="dc-sub">小牧场见习员</span>
        <span class="dc-desc">数字小巧，先学会「送走多出来的，再六脚打包」</span>
      </button>
      <button class="diff-card" data-d="mid">
        <span class="dc-badge">🦌</span>
        <span class="dc-name">中级</span>
        <span class="dc-sub">牧场小能手</span>
        <span class="dc-desc">梅花鹿和鸵鸟登场，还有竞赛得分翻牌关</span>
      </button>
      <button class="diff-card" data-d="hard">
        <span class="dc-badge">🐂</span>
        <span class="dc-name">高级</span>
        <span class="dc-sub">牧场大侦探</span>
        <span class="dc-desc">大数字挑战：792只脚怎么打包？倒扣分怎么算？</span>
      </button>
    </div>
    <button class="btn big" id="btn-rules1">📖 玩法说明</button>
  </div>
</section>

<!-- ============ 屏幕二：游戏 ============ -->
<section id="screen-game" class="screen">
  <header class="hud">
    <div class="hud-l">
      <span class="hud-title">智慧牧场</span>
      <span class="hud-level" id="hud-level">第1关 / 共3关</span>
      <span class="dots" id="hud-dots"></span>
    </div>
    <div class="hud-r">
      <span class="meter">⏱ <b id="hud-time">00:00</b></span>
      <span class="meter">👣 <b id="hud-steps">0</b> 步</span>
      <button class="btn sm" id="btn-rules2">玩法说明</button>
      <button class="btn sm warn" id="btn-reveal">揭示答案</button>
      <button class="btn sm" id="btn-restart">重新开始</button>

    </div>

/* ================= 工具函数 ================= */
function $(id){ return document.getElementById(id); }
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function pickN(arr,n){ return shuffle(arr).slice(0,n); }
function uniqNums(arr){
  var seen={}, out=[];
  for(var i=0;i<arr.length;i++){
    if(!seen[arr[i]]){ seen[arr[i]]=true; out.push(arr[i]); }
  }
  return out;
}
function fmtTime(sec){
  var m=Math.floor(sec/60), s=sec%60;

}

/* ================= 派生计算 ================= */
function farmTotal(lv){ return lv.more.feet*lv.diff + 6*lv.r; }
function cBase(c){ return c.n*c.a; }
function cPer(c){ return c.a+c.b; }
function cWrong(c){ return (cBase(c)-c.s)/cPer(c); }
function cRight(c){ return c.n-cWrong(c); }

/* ================= 题干与解析文本 ================= */

}
function farmSol(lv){

         '（只脚），这时'+lv.more.name+'和'+lv.less.name+'的只数正好同样多。</p>'+

         '＝6（只脚），'+R+'÷6＝'+lv.r+'（包），所以'+lv.less.name+'有 '+lv.r+' 只。</p>'+
         '<p>第3步（算一算）：'+lv.more.name+'有 '+lv.r+'＋'+lv.diff+'＝'+mc+'（只）。</p>'+
         '<p>答：'+lv.more.name+'有'+mc+'只，'+lv.less.name+'有'+lv.r+'只。</p>';
}
function contestText(c){
  if(c.customText) return c.customText;
  return c.who+'参加'+c.match+'，一共'+c.n+'道试题。做对一题得'+c.a+
         '分，做错或没做一题要倒扣'+c.b+'分。'+c.who+'最后得了'+c.s+'分，他做对了几道题？';
}
function contestSol(c){
  var base=cBase(c), per=cPer(c), w=cWrong(c), rt=cRight(c);
  return '<p>假设'+c.who+'把'+c.n+'道题全部做对，可得 '+c.a+'×'+c.n+'＝'+base+'（分），比实际多得 '+

         '<p>做错或没做一道题，不但得不到'+c.a+'分，还要倒扣'+c.b+'分，一共要少得 '+c.a+'＋'+c.b+'＝'+
         per+'（分）。</p>'+
         '<p>'+ (base-c.s) +'里有多少个'+per+'，就是做错（或没做）的题数：'+(base-c.s)+'÷'+per+'＝'+w+
         '（道）。</p>'+
         '<p>所以做对了 '+c.n+'−'+w+'＝'+rt+'（道）。答：'+c.who+'做对了'+rt+'道题。</p>';
}

/* ================= 组建关卡 ================= */
function buildFarmLevel(data){
  var T=farmTotal(data);
  var F=data.more.feet*data.diff, R=6*data.r, mc=data.r+data.diff;
  var chips=uniqNums([mc,data.r,F,data.diff,R,6,T]).slice(0,5);
  return {
    kind:'farm', more:data.more, less:data.less, diff:data.diff, r:data.r,
    total:T, removedFeet:F, remainFeet:R, moreCount:mc,
    text:farmText(data), solHtml:farmSol(data),
    chips:shuffle(chips),
    slotAns:[mc, data.r]
  };
}
function buildContestLevel(data){
  var base=cBase(data), per=cPer(data), w=cWrong(data), rt=cRight(data);
  var chips=uniqNums([rt,w,data.n,per,base,data.s]).slice(0,5);
  return {
    kind:'contest', n:data.n, a:data.a, b:data.b, s:data.s, who:data.who,
    base:base, per:per, wrong:w, right:rt,
    text:contestText(data), solHtml:contestSol(data),
    chips:shuffle(chips),
    slotAns:[rt]
  };
}
function buildLevels(key){
  var farms=pickN(FARM_BANK[key],2).map(buildFarmLevel);
  var cons=pickN(CONTEST_BANK[key],1).map(buildContestLevel);
  return shuffle(farms.concat(cons));
}

/* ================= 撒花引擎（Canvas） ================= */
var FX={cv:null,cx:null,parts:[],raf:0,w:0,h:0};
function fxInit(){
  FX.cv=$('fx'); FX.cx=FX.cv.getContext('2d');
  fxResize();
  window.addEventListener('resize',fxResize);
}
function fxResize(){
  FX.w=FX.cv.width=window.innerWidth;
  FX.h=FX.cv.height=window.innerHeight;
}
function confetti(n){
  for(var i=0;i<n;i++){
    FX.parts.push({
      x:Math.random()*FX.w,
      y:-30-Math.random()*FX.h*0.3,
      vx:(Math.random()-0.5)*3,
      vy:2+Math.random()*3.5,
      rot:Math.random()*Math.PI*2,
      vr:(Math.random()-0.5)*0.25,
      size:7+Math.random()*9,
      color:curColors[Math.floor(Math.random()*curColors.length)],
      star:Math.random()<0.25
    });
  }
  if(!FX.raf) fxLoop();
}
function fxLoop(){
  var c=FX.cx;
  c.clearRect(0,0,FX.w,FX.h);
  for(var i=FX.parts.length-1;i>=0;i--){
    var p=FX.parts[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.rot+=p.vr;
    if(p.y>FX.h+40){ FX.parts.splice(i,1); continue; }
    c.save();
    c.translate(p.x,p.y); c.rotate(p.rot);
    c.fillStyle=p.color;
    if(p.star){ drawStar(c,p.size); c.fill(); }
    else{ c.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.62); }
    c.restore();
  }
  if(FX.parts.length>0){ FX.raf=requestAnimationFrame(fxLoop); }
  else{ FX.raf=0; c.clearRect(0,0,FX.w,FX.h); }
}
function drawStar(c,r){
  c.beginPath();
  for(var i=0;i<10;i++){
    var ang=Math.PI/5*i - Math.PI/2;
    var rr = i%2===0 ? r : r*0.45;
    var x=Math.cos(ang)*rr, y=Math.sin(ang)*rr;
    if(i===0) c.moveTo(x,y); else c.lineTo(x,y);
  }
  c.closePath();
}

/* ================= 通用拖动滑轨组件 =================
   在轨道上拖动（鼠标/触摸统一用指针事件），值取 0..max 的整数 */
function makeDragSlider(track, handle, max, cb){
  var dragging=false, cur=0;
  function toVal(clientX){
    var r=track.getBoundingClientRect();
    var t=(clientX-r.left)/r.width;
    if(t<0) t=0; if(t>1) t=1;
    return Math.round(t*max);
  }
  track.addEventListener('pointerdown',function(e){
    if(track.dataset.locked==='1') return;
    dragging=true;
    track.setPointerCapture(e.pointerId);
    e.preventDefault();
    cur=toVal(e.clientX);
    cb(cur,false);
  });
  track.addEventListener('pointermove',function(e){
    if(!dragging || track.dataset.locked==='1') return;
    var v=toVal(e.clientX);
    if(v!==cur){ cur=v; cb(cur,false); }
  });
  function end(){
    if(!dragging) return;
    dragging=false;
    cb(cur,true);
  }
  track.addEventListener('pointerup',end);
  track.addEventListener('pointercancel',end);
}

/* ================= 数字芯片拖放组件 ================= */
function attachChipDrag(chip, slotEls, onDrop){
  chip.addEventListener('pointerdown',function(e){
    if(chip.classList.contains('used')) return;
    e.preventDefault();
    chip.setPointerCapture(e.pointerId);
    /* 生成跟随指针的“幽灵”芯片 */
    var ghost=chip.cloneNode(true);
    ghost.classList.add('ghost');
    document.body.appendChild(ghost);
    var r=chip.getBoundingClientRect();
    var ox=e.clientX-r.left, oy=e.clientY-r.top;
    ghost.style.left=(e.clientX-ox)+'px';
    ghost.style.top=(e.clientY-oy)+'px';
    chip.style.opacity='0.35';

    function mv(ev){
      ghost.style.left=(ev.clientX-ox)+'px';
      ghost.style.top=(ev.clientY-oy)+'px';
      for(var i=0;i<slotEls.length;i++){
        var q=slotEls[i].getBoundingClientRect();
        var hit = ev.clientX>q.left && ev.clientX<q.right && ev.clientY>q.top && ev.clientY<q.bottom;
        slotEls[i].classList.toggle('hot', hit && slotEls[i].dataset.filled!=='1');
      }
    }
    function up(ev){
      chip.removeEventListener('pointermove',mv);
      chip.removeEventListener('pointerup',up);
      chip.removeEventListener('pointercancel',up);
      ghost.parentNode.removeChild(ghost);
      chip.style.opacity='';
      var target=null;
      for(var i=0;i<slotEls.length;i++){
        slotEls[i].classList.remove('hot');
        var q=slotEls[i].getBoundingClientRect();
        if(ev.clientX>q.left && ev.clientX<q.right && ev.clientY>q.top && ev.clientY<q.bottom){
          target=slotEls[i];
        }
      }
      if(target){ onDrop(chip,target); }
    }
    chip.addEventListener('pointermove',mv);
    chip.addEventListener('pointerup',up);
    chip.addEventListener('pointercancel',up);
  });
}

/* --- 第一阶段：送走多出来的 --- */
function setupFarmS1(lv,maxSend){
  var m=lv.more,l=lv.less;
  var track=$('s1track'), handle=$('s1handle');
  /* 生成刻度 */
  var ticks='';
  var tickStep = maxSend>20 ? 4 : 2;
  for(var k=tickStep;k<maxSend;k+=tickStep){
    ticks+='<span class="tick" style="left:'+(k/maxSend*100)+'%"></span>'+
           '<span class="tick-num" style="left:'+(k/maxSend*100)+'%">'+k+'</span>';
  }
  $('s1ticks').innerHTML=ticks;

  var lastReleased=0;
  makeDragSlider(track,handle,maxSend,function(x,released){
    $('s1fill').style.width=(x/maxSend*100)+'%';
    handle.style.left=(x/maxSend*100)+'%';
    $('s1x').textContent=x;
    $('s1feet').textContent=m.feet*x;
    $('s1rest').textContent=Math.max(0,lv.total-m.feet*x);
    var d=lv.diff-x;
    var ang = d===0 ? 0 : -(Math.max(-13,Math.min(13,d*1.4)));
    var g=$('beamG');
    if(g){ g.style.transform='rotate('+ang+'deg)'; }
    var msg=$('s1msg'), btn=$('s1go');
    if(d===0){
      msg.textContent='🎉 天平平衡啦！剩下的'+m.name+'和'+l.name+'一样多，可以打包咯！';
      msg.classList.add('bal');
      btn.disabled=false;
      btn.textContent='开始打包 ➜';
      btn.classList.add('ok');
    }else if(d>0){
      msg.textContent='天平左边沉：剩下的'+m.name+'还比'+l.name+'多 '+d+' 只';
      msg.classList.remove('bal');
      btn.disabled=true;
      btn.textContent='先让天平变平衡 ⚖';
      btn.classList.remove('ok');
    }else{
      msg.textContent='天平右边沉：送多啦，'+l.name+'反而比'+m.name+'多 '+(-d)+' 只，往回拖一点';
      msg.classList.remove('bal');
      btn.disabled=true;
      btn.textContent='先让天平变平衡 ⚖';
      btn.classList.remove('ok');
    }
    if(released && x!==lastReleased){ lastReleased=x; addStep(); }
  });

  $('s1go').addEventListener('click',function(){
    track.dataset.locked='1';
    $('st1').classList.add('done');
    $('st1').insertAdjacentHTML('beforeend','<div class="stage-done-badge">✔ 第1步完成</div>');
    $('s1go').disabled=true;
    $('s1go').textContent='已送走 '+lv.diff+' 只'+lv.more.name+'，带走 '+lv.removedFeet+' 只脚';
    confetti(26);
    setupFarmS2(lv);
    $('st2').classList.add('open');
    $('st2').scrollIntoView({behavior:'smooth',block:'nearest'});
  });
}

/* --- 第二阶段：六脚打包带 --- */
function setupFarmS2(lv){
  var Nmax=lv.r; /* 包数上限 = 少的一方只数 */
  var track=$('pk-track');
  track.style.setProperty('--nmax',Nmax);
  var handle=$('pk-handle');

  /* 刻度标签 */
  var step = Nmax<=12 ? 2 : (Nmax<=30 ? 5 : 20);
  var scale='';
  for(var k=0;k<=Nmax;k+=step){
    if(k===Nmax && Nmax%step!==0){ break; }
    scale+='<span style="left:'+(k/Nmax*100)+'%">'+k+'</span>';
  }
  if(Nmax%step!==0){ scale+='<span style="left:100%">'+Nmax+'</span>'; }
  else if(scale.indexOf('>'+Nmax+'<')<0){ scale+='<span style="left:100%">'+Nmax+'</span>'; }
  $('pk-scale').innerHTML=scale;

  var finished=false;
  var lastReleased=0;
  makeDragSlider(track,handle,Nmax,function(n,released){
    if(finished) return;
    $('pk-fill').style.width=(n/Nmax*100)+'%';
    handle.style.left=(n/Nmax*100)+'%';
    $('pkN').textContent=n;
    $('pkF').textContent=6*n;
    $('pkR').textContent=lv.remainFeet-6*n;
    if(released && n!==lastReleased){ lastReleased=n; addStep(); }
    if(n===Nmax){ finishPack(); }
  });

  function finishPack(){
    if(finished) return;
    finished=true;
    track.dataset.locked='1';
    setTimeout(function(){
      var doneMsg=$('pk-done');
      doneMsg.style.display='block';
      doneMsg.textContent='🎉 打包完成！一共 '+Nmax+' 包，每包6只脚 —— 少的一方（'+lv.less.name+'）就有 '+Nmax+' 只！';
      $('st2').classList.add('done');
      $('st2').insertAdjacentHTML('beforeend','<div class="stage-done-badge">✔ 第2步完成</div>');
      confetti(46);
      $('st3').classList.add('open');
      setupFarmS3(lv);
      $('st3').scrollIntoView({behavior:'smooth',block:'nearest'});
    },420);
  }
}

/* --- 第三阶段：点名入舍（拖数字） --- */
function setupFarmS3(lv){
  var tray=$('ftray');
  var slotEls=Array.prototype.slice.call(document.querySelectorAll('#fslots .slot'));
  var chipsHtml='';
  for(var i=0;i<lv.chips.length;i++){
    chipsHtml+='<div class="chip" data-v="'+lv.chips[i]+'">'+lv.chips[i]+'</div>';
  }
  tray.innerHTML=chipsHtml;
  var chips=Array.prototype.slice.call(tray.children);
  var filledCount=0;

  chips.forEach(function(chip){
    attachChipDrag(chip,slotEls,function(ch,slot){
      addStep();
      var i=parseInt(slot.dataset.i,10);
      var v=parseInt(ch.dataset.v,10);
      if(v===lv.slotAns[i]){

      }else{
        toast('再想一想：这个数放在这里不太对哦～看看打包出了几包？');
      }
    });
  });
}

function setupContest(lv){
  var tilesEl=$('ctiles');
  var wrongCount=0;
  var locked=false;

  tilesEl.addEventListener('click',function(e){
    if(locked) return;
    var tile=e.target;
    while(tile && !tile.classList.contains('tile')){ tile=tile.parentNode; }
    if(!tile || tile.parentNode!==tilesEl) return;
    var willWrong = tile.classList.contains('wrong') ? -1 : 1;
    tile.classList.toggle('wrong');
    wrongCount+=willWrong;
    addStep();
    /* 漂浮分数提示 */
    var f=document.createElement('span');
    f.className='float-pt';
    f.textContent = willWrong===1 ? '−'+lv.per+'分' : '＋'+lv.per+'分';
    f.style.color = willWrong===1 ? '#b64545' : '#2f9e44';
    tile.appendChild(f);
    setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); },950);

    var cur=lv.base-lv.per*wrongCount;
    $('sc-cur').textContent=cur;
    var diffEl=$('cdiff'), go=$('cgo'), nowCell=$('sc-now');
    if(cur===lv.s){
      diffEl.innerHTML='🎉 成绩正好吻合！共翻出 <b>'+wrongCount+'</b> 道错题：'+lv.base+'−'+lv.s+'＝'+(lv.base-lv.s)+'分，'+(lv.base-lv.s)+'÷'+lv.per+'＝'+wrongCount+'（道）';
      diffEl.classList.remove('over'); diffEl.classList.add('equal');
      nowCell.classList.add('hit');
      go.disabled=false; go.textContent='成绩吻合，锁定成绩！'; go.classList.add('ok');
    }else if(cur>lv.s){
      diffEl.innerHTML='每翻错 1 题，总分减少 '+lv.a+'＋'+lv.b+'＝'+lv.per+' 分。距离目标还差 <b id="sc-d">'+(cur-lv.s)+'</b> 分';
      diffEl.classList.remove('over','equal');
      nowCell.classList.remove('hit');
      go.disabled=true; go.textContent='翻到成绩正好吻合为止 ⚖'; go.classList.remove('ok');
    }else{
      diffEl.innerHTML='翻多啦！当前 '+cur+' 分，比目标 '+lv.s+' 分少了 '+(lv.s-cur)+' 分。再点卡片把错的翻回来～';
      diffEl.classList.add('over'); diffEl.classList.remove('equal');
      nowCell.classList.remove('hit');
      go.disabled=true; go.textContent='翻到成绩正好吻合为止 ⚖'; go.classList.remove('ok');
    }
  });

  $('cgo').addEventListener('click',function(){
    if(locked) return;
    locked=true;
    tilesEl.classList.add('locked');
    var d=$('cderive');
    d.style.display='block';
    d.innerHTML='<h4>🧠 假设法四步走（看，你刚刚翻出来啦！）</h4>'+
      '1）假设全对：'+lv.a+'×'+lv.n+'＝'+lv.base+'（分）<br>'+
      '2）算总差：'+lv.base+'−'+lv.s+'＝'+(lv.base-lv.s)+'（分）<br>'+
      '3）每题差：'+lv.a+'＋'+lv.b+'＝'+lv.per+'（分）<br>'+
      '4）错题数：'+(lv.base-lv.s)+'÷'+lv.per+'＝'+lv.wrong+'（道）→ 那做对了几道？拖上去！';
    $('cst1').classList.add('done');
    $('cst1').insertAdjacentHTML('beforeend','<div class="stage-done-badge">✔ 成绩锁定</div>');
    confetti(26);
    $('cst2').classList.add('open');
    setupContestS2(lv);
    $('cst2').scrollIntoView({behavior:'smooth',block:'nearest'});
  });
}

function setupContestS2(lv){

/* ================= 通关与结算 ================= */
function levelClear(){
  var lv=G.levels[G.idx];
  G.clears[G.idx]= G.revealed ? 1 : 2; /* 2=完全独立完成 */
  confetti(90);
  var last = G.idx===G.levels.length-1;
  var stars = G.revealed ? '🌟 看过解析后完成，也很棒！' : '⭐⭐⭐ 完全自己完成，真了不起！';
  openModal(
    '<div class="clear-box">'+
      '<div class="clear-emoji">🎉</div>'+
      '<h2>第'+(G.idx+1)+'关 通过！</h2>'+
      '<p class="clear-star">'+stars+'</p>'+
      '<div class="sol-box">'+lv.solHtml+'</div>'+
      '<div class="btn-row"><button class="btn big" id="m-next">'+(last?'查看成绩单 🏆':'下一关 ➜')+'</button></div>'+
    '</div>', false);
  $('m-next').onclick=function(){
    closeModal();
    updateHud();
    if(last){ showFinal(); }
    else{ G.idx++; renderLevel(); }
  };
}

function showFinal(){
  stopTimer();
  var full=0;
  var rows='';
  for(var i=0;i<G.levels.length;i++){
    var lv=G.levels[i];
    var st = G.clears[i]===2 ? '⭐⭐⭐ 独立完成' : '🌟 看过解析';
    if(G.clears[i]===2) full++;
    rows+='第'+(i+1)+'关 '+(lv.kind==='farm'?'牧场打包关':'竞赛翻牌关')+' —— '+st+'<br>';
  }
  $('final-stats').innerHTML=
    '难度：<b>'+(G.diffKey==='easy'?'初级':(G.diffKey==='mid'?'中级':'高级'))+'</b><br>'+
    rows+
    '总用时：<b>'+fmtTime(G.elapsed)+'</b><br>'+
    '总操作步数：<b>'+G.steps+'</b> 步<br>'+
    '获得星星：<b>'+full+' / '+G.levels.length+'</b>';
  show('screen-final');
  confetti(160);
  setTimeout(function(){confetti(120);},900);
  setTimeout(function(){confetti(120);},1800);
}
