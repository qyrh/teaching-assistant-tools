<body>
<div id="topbar">
  <div class="brand">🏝️ 智慧岛大探险<span class="sub">能力测试挑战（四）</span></div>
  <div class="top-right">
    <button id="btn-rules" class="btn btn-mini">规则说明</button>
    <div class="hud">⏱ <span id="hud-time">00:00</span> · 👣 <span id="hud-steps">0</span></div>
  </div>
</div>

<main id="stage">
  <!-- 难度选择 -->
  <section id="scr-select" class="screen">
    <h1>选择你的挑战难度</h1>
    <p class="page-sub">全部挑战来自《奥数起跑线》P6【35】能力测试卷（四）。每个难度 4 个动手挑战站，全部点亮即可开启大庆祝！</p>
    <div class="diff-grid">
      <div class="diff-card" data-level="easy">
        <div class="ic">🌱</div><h3>初级 · 热身启程</h3>
        <p>拨钟面读夹角 · 21颗糖稳赢 · 圈圈分卡片 · 彩灯规律</p>
      </div>
      <div class="diff-card" data-level="mid">
        <div class="ic">🚀</div><h3>中级 · 智慧进阶</h3>
        <p>100°与72°的时刻 · 64块糖原题 · 兴趣小组容斥 · 火车时刻安排</p>
      </div>
      <div class="diff-card" data-level="hard">
        <div class="ic">🏔️</div><h3>高级 · 勇者巅峰</h3>
        <p>镜子对称时刻 · 拿到最后反而输 · 100人双圈容斥 · 螺旋拐弯数列</p>
      </div>
    </div>
  </section>

  <!-- 挑战地图 -->
  <section id="scr-map" class="screen hide">
    <h1>挑战地图</h1>
    <p class="page-sub" id="map-sub"></p>
    <div class="map-wrap" id="map-wrap"></div>
    <div class="map-foot"><button id="btn-back-select" class="btn btn-ghost">🏠 返回难度选择</button></div>
  </section>

  <!-- 站点进行中 -->
  <section id="scr-station" class="screen hide">
    <div class="station-head">
      <div class="s-icon" id="st-icon"></div>
      <div class="s-title"><h2 id="st-name"></h2><div class="s-prog" id="st-prog"></div></div>
    </div>
    <div class="q-card" id="st-q"></div>
    <div id="st-msg" class="hide"></div>
    <div id="station-body"></div>
    <div class="station-foot">
      <button id="btn-reveal" class="btn btn-warm">💡 揭示答案</button>
      <button id="btn-restart" class="btn btn-ghost">🔄 重新开始本关</button>
      <button id="btn-quit" class="btn btn-ghost">🏠 返回难度选择</button>
    </div>
  </section>

  <!-- 结算 -->
  <section id="scr-final" class="screen hide">
    <h1>🎉 全部站点点亮！</h1>
    <div id="final-body" class="card"></div>
    <div class="station-foot">
      <button id="btn-again" class="btn btn-main">🔁 再玩一次</button>
      <button id="btn-select2" class="btn btn-ghost">🏠 返回难度选择</button>
    </div>
  </section>
</main>

<div id="modal" class="hide"><div id="modal-card" class="modal-card"></div></div>
