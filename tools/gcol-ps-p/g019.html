<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>质因数魔法工坊 · 第26讲 分解质因数（一）</title>
<style>
/* ============================================================
   质因数魔法工坊 —— 单文件互动游戏
   内容来源：奥数起跑线 P5 第26讲《分解质因数（一）》
   结构说明：
     1) CSS：色板变量 + 布局 + 各关卡组件样式（含响应式）
     2) HTML 骨架：HUD / 主屏 / 拖拽替身 / 弹窗 / 彩纸画布
     3) JS：工具 → 彩纸 → 弹窗/提示 → 拖拽系统 → 关卡数据 →
        游戏控制器 → 五种关卡模块（因数树/天平/平方阵/生活屋/除法机）
   ============================================================ */

/* ---------- 色板变量（每局随机更换主题色） ---------- */
:root{
  --bg:#FFF7ED; --card:#FFFFFF; --ink:#1F2937;
  --p:#EA580C; --pd:#9A3412; --acc:#0D9488;
  --ok:#15803D; --okbg:#DCFCE7;
  --warn:#B45309; --warnbg:#FEF3C7;
  --bad:#B91C1C; --badbg:#FEE2E2;
  --gold:#F59E0B; --line:#CBD5E1;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:rgba(0,0,0,0); }
html,body{ margin:0; padding:0; }
body{
  background:var(--bg); color:var(--ink);
  font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
  font-size:18px; line-height:1.55; user-select:none;
}
#app{ max-width:1180px; margin:0 auto; padding:10px 12px 34px; }

/* ---------- 顶部信息条（计时/步数/宝石 右上角实时显示） ---------- */
#hud{
  display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;
  gap:12px; background:var(--card); border:3px solid var(--p); border-radius:16px;
  padding:8px 16px; margin-bottom:14px; box-shadow:0 4px 0 var(--pd);
}
.hud-logo{ font-weight:900; font-size:22px; color:var(--pd); }
.hud-chip{ margin-left:12px; font-size:17px; font-weight:700; color:var(--acc); }
.hud-r{ display:flex; gap:14px; flex-wrap:wrap; }
.hud-item{ background:var(--bg); border:2px solid var(--line); border-radius:10px; padding:2px 12px; font-size:17px; }
.hud-item b{ color:var(--p); font-size:19px; }

/* ---------- 通用按钮 ---------- */
.btn{
  font-family:inherit; font-size:19px; font-weight:800; color:var(--ink);
  background:#fff; border:3px solid var(--ink); border-radius:14px;
  padding:10px 22px; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.25);
  transition:transform .08s, box-shadow .08s;
}
.btn:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.25); }
.btn.primary{ background:var(--p); border-color:var(--pd); color:#fff; box-shadow:0 4px 0 var(--pd); }
.btn.warn{ background:var(--warnbg); border-color:var(--warn); color:var(--warn); }
.btn.ghostb{ background:transparent; border-color:var(--line); color:var(--ink); }
.btn:disabled{ opacity:.45; cursor:default; }

/* ---------- 菜单屏 ---------- */
.menu{ text-align:center; padding:18px 6px; }
.menu h1{ font-size:44px; margin:16px 0 6px; color:var(--pd); letter-spacing:4px; text-shadow:2px 2px 0 #fff; }
.menu .sub{ font-size:20px; color:var(--acc); font-weight:700; margin-bottom:22px; }
.menu .intro{ background:var(--card); border:3px dashed var(--p); border-radius:16px; padding:12px 18px; max-width:860px; margin:0 auto 26px; font-size:18px; text-align:left; }
.diff-row{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
.diff-card{
  width:250px; background:var(--card); border:4px solid var(--p); border-radius:20px;
  padding:18px 14px; cursor:pointer; transition:transform .12s; box-shadow:0 6px 0 var(--pd);
}
.diff-card:hover{ transform:translateY(-4px); }
.diff-card h2{ margin:0 0 6px; font-size:26px; color:var(--p); }
.diff-card .dsub{ font-weight:800; color:var(--acc); margin-bottom:8px; }
.diff-card p{ margin:0; font-size:16.5px; color:var(--ink); }
.menu-foot{ margin-top:26px; }

/* ---------- 关卡框架 ---------- */
.stage-head{ background:var(--card); border:3px solid var(--acc); border-radius:16px; padding:10px 16px; margin-bottom:12px; }
.stage-tag{ font-size:18px; font-weight:900; color:var(--acc); margin-bottom:4px; }
.stage-problem{ font-size:18.5px; margin:0; }
.stage-problem b{ color:var(--p); }
.stage-area{ position:relative; background:var(--card); border:3px solid var(--line); border-radius:16px; padding:14px; min-height:430px; }
.game-controls{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:14px; }

/* 通关覆盖层 */
.stage-overlay{ position:absolute; inset:0; background:rgba(255,255,255,.82); border-radius:13px; display:flex; align-items:center; justify-content:center; z-index:30; }
.done-card{ background:#fff; border:4px solid var(--gold); border-radius:18px; padding:20px 30px; text-align:center; max-width:92%; box-shadow:0 8px 24px rgba(0,0,0,.18); }
.done-title{ font-size:30px; font-weight:900; color:var(--p); margin-bottom:8px; }
.done-banner{ font-size:21px; font-weight:800; color:var(--ok); margin-bottom:8px; }
.done-gems{ font-size:22px; font-weight:900; color:var(--gold); margin-bottom:12px; }

/* ---------- 通用宝石架 / 宝石块 ---------- */
.tile-shelf{ background:var(--bg); border:3px dashed var(--p); border-radius:14px; padding:10px 14px; margin-bottom:14px; text-align:center; }
.shelf-title{ font-weight:900; color:var(--pd); font-size:18px; margin-bottom:8px; }
.shelf-row{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
.tile{
  width:62px; height:62px; border-radius:14px; background:#fff;
  border:4px solid var(--p); color:var(--pd); font-size:26px; font-weight:900;
  display:flex; align-items:center; justify-content:center; cursor:grab;
  touch-action:none; box-shadow:0 3px 0 var(--pd);
}
.tile:active{ cursor:grabbing; }
.src-dragging{ opacity:.3; }

/* ---------- 拖拽替身 / 悬停高亮 / 抖动 ---------- */
#drag-ghost{ position:fixed; z-index:1000; pointer-events:none; transform:translate(-50%,-80%) rotate(-5deg); filter:drop-shadow(0 8px 10px rgba(0,0,0,.3)); }
.drop-hover{ outline:5px dashed var(--gold); outline-offset:3px; }
@keyframes shakeX{ 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }
.shake{ animation:shakeX .45s; }
@keyframes popIn{ from{transform:scale(.2); opacity:0} to{transform:scale(1); opacity:1} }
.pop{ animation:popIn .4s; }

/* ---------- 关卡1：因数树培育 ---------- */
.tree-wrap{ overflow-x:auto; padding-bottom:6px; }
.tree-inner{ position:relative; margin:0 auto; min-height:200px; }
.tree-inner svg{ position:absolute; left:0; top:0; }
.tree-inner svg line{ stroke:var(--p); stroke-width:4; stroke-linecap:round; opacity:.55; }
.fnode{
  position:absolute; width:66px; height:66px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:23px; font-weight:900; transition:left .45s ease, top .45s ease; z-index:5;
}
.fnode.comp{ background:#fff; border:4px solid var(--p); color:var(--ink); cursor:grab; box-shadow:0 0 0 0 rgba(234,88,12,.5); animation:pulseRing 1.6s infinite; }
@keyframes pulseRing{ 0%{box-shadow:0 0 0 0 rgba(234,88,12,.45)} 70%{box-shadow:0 0 0 14px rgba(234,88,12,0)} 100%{box-shadow:0 0 0 0 rgba(234,88,12,0)} }
.fnode.prim{ background:radial-gradient(circle at 32% 28%, #FEF9C3, #FDE047 60%, #F59E0B); border:4px solid #B45309; color:#78350F; box-shadow:0 3px 0 #B45309; }
.fnode.split{ background:var(--bg); border:4px solid var(--line); color:var(--ink); }
.notrans{ transition:none !important; }
.win-banner{ margin-top:10px; text-align:center; font-size:23px; font-weight:900; color:var(--ok); }

/* ---------- 关卡2：宝石天平 ---------- */
.beam-zone{ height:64px; position:relative; margin:2px 0 12px; }
.beam-pivot{ position:absolute; left:50%; top:6px; transform:translateX(-50%); width:0; height:0; border-left:16px solid transparent; border-right:16px solid transparent; border-bottom:44px solid var(--line); }
.beam{
  position:absolute; left:6%; right:6%; top:24px; height:16px; border-radius:8px;
  background:linear-gradient(var(--p), var(--pd)); transform-origin:50% 50%;
  transition:transform .55s ease;
}
.beam .bplate{ position:absolute; top:-7px; width:30px; height:30px; border-radius:50%; background:var(--gold); border:4px solid #B45309; }
.beam .bplate.l{ left:-8px; } .beam .bplate.r{ right:-8px; }
.trays{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.tray{ background:var(--bg); border:4px dashed var(--p); border-radius:16px; padding:10px; min-height:120px; }
.tray-title{ font-weight:900; color:var(--pd); font-size:19px; text-align:center; margin-bottom:8px; }
.tray-cards{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; min-height:84px; align-content:flex-start; padding:6px; }
.bcard{
  width:76px; height:76px; border-radius:14px; background:#fff; border:4px solid var(--acc);
  color:var(--ink); font-size:24px; font-weight:900; display:flex; align-items:center;
  justify-content:center; cursor:grab; touch-action:none; box-shadow:0 3px 0 var(--acc);
}
.inv{ margin-top:10px; border-top:3px dotted var(--line); padding-top:8px; display:flex; flex-direction:column; gap:8px; }
.inv-row{ display:flex; align-items:center; gap:12px; min-height:26px; padding:2px 6px; border-radius:8px; }
.inv-row.eq{ background:var(--okbg); }
.inv-row.neq{ background:var(--warnbg); }
.pchip{ min-width:40px; text-align:center; border-radius:8px; background:#fff; border:3px solid; font-weight:900; font-size:17px; padding:1px 6px; }
.inv-blocks{ display:flex; gap:6px; flex-wrap:wrap; }
.inv-sq{ width:17px; height:17px; border-radius:4px; border:2px solid rgba(0,0,0,.25); }
.inv-zero{ color:var(--line); font-weight:800; font-size:16px; }
.bpool{ margin-top:16px; background:var(--bg); border:3px dotted var(--line); border-radius:14px; padding:10px; }
.pool-title{ font-weight:900; color:var(--ink); text-align:center; margin-bottom:8px; font-size:18px; }
.pool-cards{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; min-height:84px; }
.bal-note{ text-align:center; margin-top:10px; font-size:18px; font-weight:800; color:var(--acc); }

/* ---------- 关卡3：平方宝石阵 ---------- */
.sq-wrap{ text-align:center; }
.sq-cols{ display:flex; gap:18px; justify-content:center; flex-wrap:wrap; margin-top:6px; }
.sq-col{ background:var(--bg); border:4px solid var(--acc); border-radius:16px; padding:12px 18px; min-width:150px; }
.sq-col.oddcol{ border-color:var(--warn); background:var(--warnbg); }
.sq-col.evecol{ border-color:var(--ok); background:var(--okbg); }
.sq-head{ font-weight:900; font-size:20px; margin-bottom:10px; }
.sq-stack{ display:flex; flex-direction:column; gap:12px; align-items:center; min-height:60px; justify-content:flex-end; }
.sq-block{ width:44px; height:34px; border-radius:8px; border:3px solid rgba(0,0,0,.3); color:#fff; font-size:16px; font-weight:800; display:flex; align-items:center; justify-content:center; }
.sq-block.added{ border-style:dashed; border-color:#fff; outline:3px solid var(--gold); cursor:pointer; }
.sq-foot{ margin-top:10px; font-weight:900; font-size:18px; }
.sq-foot.odd{ color:var(--warn); } .sq-foot.eve{ color:var(--ok); }
.sq-a{ margin-top:16px; font-size:21px; font-weight:900; color:var(--pd); }

/* ---------- 关卡4：生活智慧屋 ---------- */
.life-tray{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-bottom:16px; }
.life-row{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
.life-slot{ background:var(--bg); border:4px dashed var(--p); border-radius:16px; padding:12px; width:250px; min-height:190px; text-align:center; }
.life-slot .ls-title{ font-weight:900; font-size:20px; color:var(--pd); }
.life-slot .ls-range{ font-size:16.5px; color:var(--acc); font-weight:700; margin:2px 0 8px; }
.ls-cards{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; min-height:74px; padding:6px; }
.ls-val{ font-size:24px; font-weight:900; margin-top:6px; }
.ls-state{ font-size:17px; font-weight:800; margin-top:4px; min-height:26px; }
.ls-good{ color:var(--ok); } .ls-bad{ color:var(--bad); }
.lgem{
  width:64px; height:64px; border-radius:50%;
  background:radial-gradient(circle at 32% 28%, #FEF9C3, #FDE047 60%, #F59E0B);
  border:4px solid #B45309; color:#78350F; font-size:24px; font-weight:900;
  display:flex; align-items:center; justify-content:center; cursor:grab; touch-action:none;
  box-shadow:0 3px 0 #B45309;
}

/* ---------- 关卡5：除法探秘机 ---------- */
.div-machine{
  display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap;
  background:var(--bg); border:4px solid var(--p); border-radius:18px; padding:18px 16px; margin-bottom:14px;
}
.d-big{ font-size:40px; font-weight:900; color:var(--pd); }
.d-op{ font-size:32px; font-weight:900; }
.d-slot{ width:78px; height:78px; border:4px dashed var(--acc); border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:900; color:var(--acc); background:#fff; }
.d-q,.d-r{ font-size:38px; font-weight:900; min-width:56px; text-align:center; }
.d-r.hit{ color:var(--ok); } .d-r.miss{ color:var(--bad); }
.div-progress{ text-align:center; font-size:20px; font-weight:900; color:var(--acc); margin-bottom:12px; }
.div-gems{ display:flex; gap:14px; justify-content:center; min-height:70px; flex-wrap:wrap; margin-bottom:8px; }
.dgem{
  width:64px; height:64px; border-radius:14px;
  background:radial-gradient(circle at 32% 28%, #FEF9C3, #FDE047 60%, #F59E0B);
  border:4px solid #B45309; color:#78350F; font-size:24px; font-weight:900;
  display:flex; align-items:center; justify-content:center;
}

/* ---------- 结算屏 ---------- */
.end-screen{ text-align:center; padding-top:12px; }
.end-screen h1{ font-size:40px; color:var(--pd); margin:12px 0; }
.end-stats{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-bottom:18px; }
.estat{ background:var(--card); border:4px solid var(--gold); border-radius:16px; padding:12px 26px; font-size:20px; font-weight:800; }
.estat b{ color:var(--p); font-size:26px; }
.end-list{ display:inline-block; text-align:left; background:var(--card); border:3px solid var(--line); border-radius:14px; padding:12px 22px; margin-bottom:20px; font-size:18.5px; }
.end-list li{ margin:4px 0; }

/* ---------- 弹窗 / 提示条 / 彩纸 ---------- */
#modal-mask{ position:fixed; inset:0; background:rgba(15,23,42,.55); z-index:900; display:flex; align-items:center; justify-content:center; padding:16px; }
#modal-card{ background:#fff; border:4px solid var(--p); border-radius:20px; max-width:760px; width:100%; max-height:86vh; overflow:auto; padding:22px 26px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
#modal-card h3{ margin:0 0 12px; font-size:27px; color:var(--pd); }
#modal-card .m-body{ font-size:18.5px; }
#modal-card .m-body b{ color:var(--p); }
#modal-card .m-btns{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:18px; }
#modal-card .rule-item{ margin:10px 0; padding:10px 14px; border:2px dashed var(--line); border-radius:12px; }
#modal-card .rule-item b{ color:var(--acc); }
#toast{
  position:fixed; left:50%; bottom:34px; transform:translateX(-50%);
  background:#1F2937; color:#fff; font-size:19px; font-weight:800;
  border-radius:12px; padding:10px 22px; z-index:950; max-width:88vw; text-align:center;
  box-shadow:0 6px 18px rgba(0,0,0,.35);
}
#fx{ position:fixed; inset:0; pointer-events:none; z-index:990; }

/* ---------- 响应式（触摸/小屏可用） ---------- */
@media (max-width:760px){
  body{ font-size:17px; }
  .hud-logo{ font-size:19px; } .hud-item{ font-size:15.5px; padding:1px 9px; }
  .menu h1{ font-size:33px; }
  .trays{ grid-template-columns:1fr; }
  .life-slot{ width:min(100%, 320px); }
  .tile{ width:54px; height:54px; font-size:22px; }
  .fnode{ width:58px; height:58px; font-size:20px; }
  .stage-problem{ font-size:17.5px; }
  .btn{ font-size:17.5px; padding:9px 16px; }
}
</style>

<body>
<div id="app">
  <header id="hud">
    <div class="hud-l"><span class="hud-logo">质因数魔法工坊</span><span id="hud-stage" class="hud-chip"></span></div>
    <div class="hud-r">
      <span class="hud-item">用时 <b id="hud-time">00:00</b></span>
      <span class="hud-item">步数 <b id="hud-steps">0</b></span>
      <span class="hud-item">宝石 <b id="hud-gems">0</b></span>
    </div>
  </header>
  <main id="screen"></main>
</div>
<div id="drag-ghost" hidden></div>
<div id="toast" hidden></div>
<div id="modal-mask" hidden><div id="modal-card"></div></div>
<canvas id="fx"></canvas>

<script>
"use strict";
/* ============================================================
   一、工具函数
   ============================================================ */
function $(sel, root){ return (root || document).querySelector(sel); }
function shuffle(arr){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
/* 判断质数 */
function isPrime(n){
  if(n < 2) return false;
  for(var i = 2; i * i <= n; i++){ if(n % i === 0) return false; }
  return true;
}
/* 分解质因数：返回 {质数:个数}，键为字符串，使用时注意转数字 */
function factorize(n){
  var f = {}, m = n, p;
  for(p = 2; p * p <= m; p++){ while(m % p === 0){ f[p] = (f[p] || 0) + 1; m /= p; } }
  if(m > 1){ f[m] = (f[m] || 0) + 1; }
  return f;
}
/* 因数条目（质数从小到大）：[[2,3],[3,2],[7,1]] */
function factorEntries(n){
  var f = factorize(n);
  return Object.keys(f).map(function(k){ return [+k, f[k]]; }).sort(function(a,b){ return a[0]-b[0]; });
}
/* 质因数连乘字符串：504 -> "2 × 2 × 2 × 3 × 3 × 7" */
function fmtFactor(n){
  var f = factorEntries(n), out = [];
  f.forEach(function(e){ for(var i = 0; i < e[1]; i++) out.push(e[0]); });
  return out.join(" × ");
}
/* 每个质数的展示颜色 */
var PRIME_COLORS = {2:"#2563EB",3:"#DB2777",5:"#F59E0B",7:"#059669",11:"#7C3AED",13:"#0284C7",97:"#DC2626",251:"#4F46E5"};
function primeColor(p){ return PRIME_COLORS[p] || "#6B7280"; }
function twoPad(x){ return (x < 10 ? "0" : "") + x; }
function fmtTime(ms){
  var s = Math.floor(ms / 1000);
  return twoPad(Math.floor(s / 60)) + ":" + twoPad(s % 60);
}

/* ============================================================
   二、随机色板（每局随机主色，保证多次游玩不重样）
   ============================================================ */
var PALETTES = [
  {bg:"#FFF7ED", p:"#EA580C", pd:"#9A3412", acc:"#0D9488"},
  {bg:"#EFF6FF", p:"#2563EB", pd:"#1E3A8A", acc:"#F59E0B"},
  {bg:"#F0FDF4", p:"#16A34A", pd:"#14532D", acc:"#DB2777"},
  {bg:"#FAF5FF", p:"#7C3AED", pd:"#4C1D95", acc:"#0891B2"},
  {bg:"#FDF2F8", p:"#DB2777", pd:"#831843", acc:"#4F46E5"}
];
function applyPalette(){
  var pal = pick(PALETTES), r = document.documentElement.style;
  r.setProperty("--bg", pal.bg);
  r.setProperty("--p", pal.p);
  r.setProperty("--pd", pal.pd);
  r.setProperty("--acc", pal.acc);
}

/* ============================================================
   三、庆祝彩纸（Canvas 实现，通关撒花）
   ============================================================ */
var FX = (function(){
  var cv = $("#fx"), ctx = cv.getContext("2d"), parts = [], running = false;
  function resize(){ cv.width = window.innerWidth; cv.height = window.innerHeight; }
  window.addEventListener("resize", resize); resize();
  function colors(){
    var s = getComputedStyle(document.documentElement);
    return [s.getPropertyValue("--p"), s.getPropertyValue("--acc"), "#FBBF24", "#34D399", "#F87171"];
  }
  function burst(x, y, n){
    var cs = colors(), i;
    for(i = 0; i < n; i++){
      var ang = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 6;
      parts.push({x:x, y:y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp - 3, g:0.16,
        rot:Math.random()*Math.PI, vr:(Math.random()-.5)*.3, size:7+Math.random()*8,
        color:cs[Math.floor(Math.random()*cs.length)], life:70+Math.random()*40});
    }
    run();
  }
  function rain(){
    var cs = colors(), w = cv.width, i;
    for(i = 0; i < 130; i++){
      parts.push({x:Math.random()*w, y:-20-Math.random()*220, vx:(Math.random()-.5)*1.6, vy:2+Math.random()*3, g:0.02,
        rot:Math.random()*Math.PI, vr:(Math.random()-.5)*.25, size:8+Math.random()*8,
        color:cs[Math.floor(Math.random()*cs.length)], life:220+Math.random()*120});
    }
    run();
  }
  function tick(){
    ctx.clearRect(0, 0, cv.width, cv.height);
    var i;
    for(i = parts.length - 1; i >= 0; i--){
      var q = parts[i];
      q.x += q.vx; q.y += q.vy; q.vy += q.g; q.rot += q.vr; q.life--;
      if(q.life <= 0 || q.y > cv.height + 30){ parts.splice(i, 1); continue; }
      ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot);
      ctx.fillStyle = q.color; ctx.globalAlpha = Math.min(1, q.life / 40);
      ctx.fillRect(-q.size/2, -q.size/3, q.size, q.size*0.66);
      ctx.restore();
    }
    if(parts.length){ requestAnimationFrame(tick); }
    else { running = false; ctx.clearRect(0, 0, cv.width, cv.height); }
  }
  function run(){ if(running) return; running = true; requestAnimationFrame(tick); }
  return {burst:burst, rain:rain};
})();

/* ============================================================
   五、拖拽系统（Pointer 事件，鼠标/触摸通用）
   - makeDraggable(el, opts)：让元素可拖起
       opts.payload()  拖拽携带的数据
   - addTarget(el, cfg)：注册放置目标
       cfg.accept(payload, el) -> 是否接受（可省略）
       cfg.onDrop(payload, el, srcEl)  放下且被接受
       cfg.onReject(payload, el)  放下但被拒绝
   ============================================================ */
var DragSys = (function(){
  var ghost = $("#drag-ghost"), targets = [], drag = null;
  function clearTargets(){
    targets.forEach(function(t){ t.el.classList.remove("drop-hover"); });
    targets = [];
  }
  function addTarget(cfg){ targets.push(cfg); }
  function findTarget(x, y){
    var i;
    for(i = targets.length - 1; i >= 0; i--){
      var r = targets[i].el.getBoundingClientRect();
      if(x >= r.left && x <= r.right && y >= r.top && y <= r.bottom){ return targets[i]; }
    }
    return null;
  }
  function setHover(t){
    targets.forEach(function(x){ x.el.classList.toggle("drop-hover", x === t); });
  }
  function makeDraggable(el, opts){
    el.style.touchAction = "none";
    el.addEventListener("pointerdown", function(e){
      if(drag){ return; }
      e.preventDefault();
      drag = {srcEl:el, payload:opts.payload ? opts.payload() : null};
      var rect = el.getBoundingClientRect();
      ghost.replaceChildren(el.cloneNode(true));
      ghost.style.width = rect.width + "px";
      ghost.style.height = rect.height + "px";
      ghost.hidden = false;
      moveGhost(e.clientX, e.clientY);
      el.classList.add("src-dragging");
      try{ el.setPointerCapture(e.pointerId); }catch(err){ /* 个别浏览器不支持时忽略 */ }
      function onMove(ev){ if(drag){ moveGhost(ev.clientX, ev.clientY); setHover(findTarget(ev.clientX, ev.clientY)); } }
      function onUp(ev){
        cleanup();
        var t = findTarget(ev.clientX, ev.clientY);
        if(t){
          var okAcc = !t.accept || t.accept(drag.payload, t.el);
          t.el.classList.remove("drop-hover");
          if(okAcc){ t.onDrop(drag.payload, t.el, el); return; }
          if(t.onReject){ t.onReject(drag.payload, t.el); }
        }
      }
      function onCancel(){ cleanup(); }
      function cleanup(){
        el.removeEventListener("pointermove", onMove);
        el.removeEventListener("pointerup", onUp);
        el.removeEventListener("pointercancel", onCancel);
        el.classList.remove("src-dragging");
        ghost.hidden = true;
        setHover(null);
        drag = null;
      }
      el.addEventListener("pointermove", onMove);
      el.addEventListener("pointerup", onUp);
      el.addEventListener("pointercancel", onCancel);
    });
  }
  function moveGhost(x, y){
    ghost.style.left = x + "px";
    ghost.style.top = y + "px";
  }
  return {makeDraggable:makeDraggable, addTarget:addTarget, clearTargets:clearTargets};
})();

/* 单个关卡的随机配置（重新开始时也调用它，重新抽样） */
function buildStageCfg(diff, type){
  if(type === "tree"){ return {n: pick(TREE_POOL[diff])}; }
  if(type === "balance"){ return pick(BALANCE_SETS[diff]); }
  if(type === "square"){ return {n: pick(SQUARE_POOL[diff])}; }
  if(type === "life"){ return {total:2910}; }
  if(type === "division"){ var d = pick(DIVISION_SETS); return {D:d.D, r:d.r, bank:d.bank, valid:d.valid}; }
  return {};
}

/* 组装一局：关卡种类固定，顺序打乱、数值随机 */
function buildStages(diff){
  if(diff === "easy"){
    return shuffle([
      {type:"tree", cfg:buildStageCfg("easy","tree")},
      {type:"balance", cfg:buildStageCfg("easy","balance")},
      {type:"square", cfg:buildStageCfg("easy","square")}
    ]);
  }
  if(diff === "mid"){
    return shuffle([
      {type:"tree", cfg:buildStageCfg("mid","tree")},
      {type:"balance", cfg:buildStageCfg("mid","balance")},
      {type:"square", cfg:buildStageCfg("mid","square")},
      {type:"life", cfg:buildStageCfg("mid","life")}
    ]);
  }
  return shuffle([
    {type:"tree", cfg:buildStageCfg("hard","tree")},
    {type:"balance", cfg:buildStageCfg("hard","balance")},
    {type:"square", cfg:buildStageCfg("hard","square")},
    {type:"division", cfg:buildStageCfg("hard","division")}
  ]);
}

/* 题干文字（条件完整呈现） */
function problemText(st){
  if(st.type === "tree"){
    return "把 <b>" + st.cfg.n + "</b> 分解质因数！从宝石架上拖一颗质数宝石，放到还能继续分解的数上——如果正好整除，它就会“咔”地裂成两个小一点的数。一直裂到所有的数都变成质数宝石，这一关就通关啦。（想一想短除法：每一步该用哪个质数去除？）";
  }
  if(st.type === "balance"){
    var nums = st.cfg.cards.join("、");
    var src = st.cfg.fromDoc ? "（本讲" + st.cfg.fromDoc + "）" : "";
    return src + "把 <b>" + nums + "</b> 这 " + st.cfg.cards.length + " 个数平均分成两组（每组 " + st.cfg.group + " 个），并使两组数的乘积相等。把数字卡拖进两个宝盒试试——天平的倾斜和两边的“质因数清单”会帮你判断！";
  }
  if(st.type === "square"){
    return "平方数有个特征：每种质因数的个数都是双数。<b>" + st.cfg.n + "</b> 乘上一个非 0 自然数 a，就能得到一个平方数。把质数宝石补进对应的列，让每一列的块数都变成双数——补上宝石的乘积就是 a。注意：要<b>用最少的宝石</b>（多余的宝石可以点一下取下来）！";
  }
  if(st.type === "life"){
    return "（本讲例2）小华的妹妹参加了中学数学竞赛。小华问她：“这次竞赛你得了多少分？是第几名？”妹妹说：“我得的名次、我的岁数和我的分数乘起来正好是 <b>2910</b>，你看我的成绩和名次各是多少？”把 4 颗质数宝石（2、3、5、97）拖进三个格子里，让三个格子的乘积等于 2910，而且符合生活常识：名次在第 1~10 名之间，中学生年龄在 12~18 岁之间，满分为 100 分。";
  }
  return "（本讲例1）在括号里填入适当的数，使等式成立：" + st.cfg.D + " ÷ （ ）＝（ ）…… " + st.cfg.r + "，共有多少种不同的填法？把候选除数一颗一颗拖进“除法探秘机”试一试，找出所有余数正好是 <b>" + st.cfg.r + "</b> 的除数宝石，把它们全部收集起来！（悄悄提醒：除数必须比余数大）";
}

/* 揭示答案文字 */
function revealText(st){
  if(st.type === "tree"){
    return "<b>" + st.cfg.n + " = " + fmtFactor(st.cfg.n) + "</b>。培育路线不止一条，但最后得到的质因数串完全相同——这正是分解质因数的独特之处。";
  }
  if(st.type === "balance"){
    var s = st.cfg.sol;
    return "正确分法：一个宝盒放 <b>" + s[0].join("、") + "</b>，另一个宝盒放 <b>" + s[1].join("、") + "</b>。先把每个数分解质因数，再调整搭配，让两边每种质因数的个数一模一样，乘积就相等了。";
  }
  if(st.type === "square"){
    var n = st.cfg.n, f = factorEntries(n), need = [], a = 1, rt;
    f.forEach(function(e){ if(e[1] % 2 === 1){ need.push(e[0]); a *= e[0]; } });
    rt = Math.round(Math.sqrt(n * a));
    return "块数是单数的列需要各补 1 颗宝石：a = " + (need.join(" × ") || "1") + " = <b>" + a + "</b>；此时 " + n + " × " + a + " = " + (n * a) + " = <b>" + rt + " × " + rt + "</b>。";
  }
  if(st.type === "life"){
    return "2910 = 2 × 3 × 5 × 97。97 放不进名次（超过第10名）也不像年龄（不是中学生），只能当成绩；3 × 5 = 15 岁正好是中学生；名次是第 2 名。答案：<b>第 2 名、15 岁、97 分</b>。";
  }
  var D = st.cfg.D, r = st.cfg.r, m = D - r, pairs = [], i;
  for(i = 1; i * i <= m; i++){ if(m % i === 0){ pairs.push(i + "×" + (m / i)); } }
  return "被除数－余数：" + D + " − " + r + " = " + m + "，把 " + m + " 写成两个数相乘：" + pairs.join("、") + "。除数必须比余数 " + r + " 大，所以可行的除数是 <b>" + st.cfg.valid.join("、") + "</b>，共 " + st.cfg.valid.length + " 种填法。";
}

/* ============================================================

var DIFFS = {
  easy:{name:"初级", sub:"学徒工匠", desc:"3 小关：小数字热身，学会“裂”数字"},
  mid:{name:"中级", sub:"熟练工匠", desc:"4 小关：例题级挑战（含例2、例4、例5同款）"},
  hard:{name:"高级", sub:"大师工匠", desc:"4 小关：综合变式（含练习4、练习9、例1变式）"}
};
var Game = (function(){
  var screen = $("#screen");
  var hudStage = $("#hud-stage"), hudTime = $("#hud-time"),
      hudSteps = $("#hud-steps"), hudGems = $("#hud-gems");
  var S = {diff:null, stages:[], idx:0, gems:0, steps:0, mistakes:0, t0:0, timer:null, stageDone:false, stage:null, results:[]};

  /* ---------- 菜单屏 ---------- */
  function menuScreen(){
    stopTimer();
    S.diff = null;
    hudStage.textContent = "";
    var keys = ["easy","mid","hard"], cards = "";
    keys.forEach(function(k){
      cards += "<div class='diff-card' data-diff='" + k + "'><h2>" + DIFFS[k].name +
        "</h2><div class='dsub'>" + DIFFS[k].sub + "</div><p>" + DIFFS[k].desc + "</p></div>";
    });
    screen.innerHTML =
      "<div class='menu'>" +
      "<h1>质因数魔法工坊</h1>" +
      "<div class='sub'>小学奥数 · 第26讲 分解质因数（一）</div>" +
      "<div class='intro'>把一个合数用质因数相乘的形式表示出来，就叫做<b style='color:var(--p)'>分解质因数</b>。在工坊里，你将成为一名小工匠：培育因数树、称量宝石天平、补齐平方宝石阵、解开生活谜题、驾驭除法探秘机——玩着玩着，分解质因数就烂熟于心啦！先选一个难度开始吧。</div>" +
      "<div class='diff-row'>" + cards + "</div>" +
      "<div class='menu-foot'><button class='btn' id='btn-menu-rules'>玩法说明</button></div>" +
      "</div>";
    var list = screen.querySelectorAll(".diff-card"), i;
    for(i = 0; i < list.length; i++){
      list[i].onclick = function(){ startDifficulty(this.getAttribute("data-diff")); };
    }
    $("#btn-menu-rules").onclick = openRules;
  }

  function openRules(){
    Modal.open("玩法说明", rulesHTML(), [{label:"知道啦", cls:"primary"}]);
  }

  /* ---------- 开始某个难度 ---------- */
  function startDifficulty(diff){
    applyPalette();
    S.diff = diff; S.stages = buildStages(diff); S.idx = 0;
    S.gems = 0; S.steps = 0; S.mistakes = 0; S.results = [];
    hudSteps.textContent = "0"; hudGems.textContent = "0";
    startTimer();
    showStage();
    Modal.open("欢迎来到 " + DIFFS[diff].name + " · " + DIFFS[diff].sub,
      "本局共 <b>" + S.stages.length + "</b> 小关，主题色每局随机。<br>忘记了玩法随时点“玩法说明”。<br><br>" + rulesHTML(),
      [{label:"开始挑战", cls:"primary"}]);
  }

  /* ---------- 计时 ---------- */
  function startTimer(){
    S.t0 = Date.now();
    stopTimer();
    S.timer = setInterval(function(){ hudTime.textContent = fmtTime(Date.now() - S.t0); }, 500);
    hudTime.textContent = "00:00";
  }
  function stopTimer(){ if(S.timer){ clearInterval(S.timer); S.timer = null; } }

  /* ---------- 关卡通用接口 ---------- */
  var api = {
    step: function(){ S.steps++; hudSteps.textContent = S.steps; },
    mistake: function(){ S.mistakes++; },
    toast: function(m){ Toast.show(m); },
    win: function(banner){ completeStage(false, banner); }
  };

  /* ---------- 展示某一关 ---------- */
  function showStage(){

    };

    $("#btn-back").onclick = function(){
      if(S.stage && S.stage.cleanup){ S.stage.cleanup(); }

    };
    S.stage = StageModules[st.type].create($("#stage-area"), st.cfg, api);
  }

  /* ---------- 完成当前关 ---------- */
  function completeStage(revealed, bannerHTML){
    if(S.stageDone){ return; }
    S.stageDone = true;
    DragSys.clearTargets();
    var gain = revealed ? 3 : 10;
    S.gems += gain;
    hudGems.textContent = S.gems;
    S.results.push({title:STAGE_META[S.stages[S.idx].type].title, revealed:revealed});

    ov.className = "stage-overlay";
    ov.innerHTML = "<div class='done-card'><div class='done-title'>" +
      (revealed ? "已了解本关思路" : "太棒了，本关完成！") +
      "</div><div class='done-banner'>" + (bannerHTML || "") + "</div>" +
      "<div class='done-gems'>宝石 +" + gain + "</div>" +
      "<button class='btn primary' id='btn-next'>" + (last ? "查看成绩" : "下一关") + "</button></div>";

   八、关卡模块
   每个 create(area, cfg, api) 返回 {cleanup, reveal}
   ============================================================ */
var StageModules = {};

/* ---------- 关卡1：因数树培育（拖质数裂开合数） ---------- */
StageModules.tree = {
  create: function(area, cfg, api){
    var timers = [], nodes = [], root = mkNode(cfg.n), finished = false, flyFrom = null;
    var wrap = document.createElement("div");
    wrap.className = "tree-wrap";
    var shelf = document.createElement("div");
    shelf.className = "tile-shelf";
    shelf.innerHTML = "<div class='shelf-title'>质数宝石架（拖到下面还能分解的数上）</div>";
    var row = document.createElement("div");
    row.className = "shelf-row";
    [2,3,5,7,11,13].forEach(function(p){
      var t = document.createElement("div");
      t.className = "tile";
      t.textContent = p;
      row.appendChild(t);
      DragSys.makeDraggable(t, {payload: function(){ return p; }});
    });
    shelf.appendChild(row);
    var inner = document.createElement("div");
    inner.className = "tree-inner";
    var NS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(NS, "svg");
    inner.appendChild(svg);
    wrap.appendChild(shelf);
    wrap.appendChild(inner);
    area.appendChild(wrap);

    function mkNode(v){ return {val:v, children:null, el:null, px:0, py:0, slot:0}; }
    function later(fn, ms){ timers.push(setTimeout(fn, ms)); }

    /* 递归布局：叶子均分横槽位，父节点居子女中点 */
    function render(){
      var UNIT = 92, VH = 106, TOP = 56, leafIdx = 0, maxDepth = 0;
      (function place(node, depth){
        if(depth > maxDepth){ maxDepth = depth; }
        if(!node.children){ node.slot = leafIdx++; }
        else {
          node.children.forEach(function(c){ place(c, depth + 1); });
          node.slot = (node.children[0].slot + node.children[1].slot) / 2;
        }
      })(root, 0);
      var wrapW = wrap.clientWidth || 760;
      var innerW = Math.max(wrapW - 20, leafIdx * UNIT + 120);
      var offX = (innerW - (leafIdx - 1) * UNIT) / 2;
      inner.style.width = innerW + "px";
      inner.style.height = ((maxDepth + 1) * VH + 30) + "px";
      svg.setAttribute("width", innerW);
      svg.setAttribute("height", (maxDepth + 1) * VH + 30);
      while(svg.firstChild){ svg.removeChild(svg.firstChild); }
      var pending = [];
      (function walk(node, depth){
        node.px = offX + node.slot * UNIT;
        node.py = TOP + depth * VH;
        var cls = node.children ? "fnode split" : (isPrime(node.val) ? "fnode prim" : "fnode comp");
        if(!node.el){
          /* 新节点：先出现在被裂开节点的位置（无过渡），再飞到目标位置 */
          var fx0 = flyFrom ? flyFrom.x : node.px;
          var fy0 = flyFrom ? flyFrom.y : node.py;
          node.el = document.createElement("div");
          node.el.className = cls + " notrans pop";
          node.el.style.left = (fx0 - 33) + "px";
          node.el.style.top = (fy0 - 33) + "px";
          inner.appendChild(node.el);
          pending.push(node);
        } else {
          node.el.className = cls;
          node.el.style.left = (node.px - 33) + "px";
          node.el.style.top = (node.py - 33) + "px";
        }
        node.el.textContent = node.val;
        /* 大数字适当缩小字号，保证在圆里放得下（仍不小于 16px） */
        node.el.style.fontSize = (node.val >= 1000 ? "18px" : (node.val >= 100 ? "21px" : "23px"));
        if(node.children){
          node.children.forEach(function(c){
            var ln = document.createElementNS(NS, "line");
            ln.setAttribute("x1", node.px); ln.setAttribute("y1", node.py + 38);
            ln.setAttribute("x2", c.px); ln.setAttribute("y2", c.py - 38);
            svg.appendChild(ln);
            walk(c, depth + 1);
          });
        }
      })(root, 0);
      /* 新节点下一帧恢复过渡，滑向自己的位置 */
      pending.forEach(function(nd){
        var el = nd.el, fx = (nd.px - 33), fy = (nd.py - 33);
        later(function(){
          el.classList.remove("notrans");
          el.style.left = fx + "px";
          el.style.top = fy + "px";
        }, 30);
      });
      /* 只把“还没裂开的合数”注册为放置目标 */
      DragSys.clearTargets();
      nodes.length = 0;
      (function collect(node){
        nodes.push(node);
        if(node.children){ node.children.forEach(collect); }
      })(root);
      nodes.forEach(function(nd){
        if(!nd.children && !isPrime(nd.val)){
          DragSys.addTarget({
            el: nd.el,
            onDrop: function(p){
              if(finished){ return; }
              if(nd.val % p === 0){ splitNode(nd, p); }
              else {
                api.mistake(); api.step();
                nd.el.classList.add("shake");
                later(function(){ nd.el.classList.remove("shake"); }, 500);
                api.toast(nd.val + " 不能被 " + p + " 整除哦，换一颗宝石试试");
              }
            }
          });
        }
      });
    }

    /* 裂开节点 */
    function splitNode(node, p){
      var q = node.val / p;
      flyFrom = {x:node.px, y:node.py}; /* 新节点从被裂开的节点处飞出 */
      node.children = [mkNode(p), mkNode(q)];
      api.step();
      render();
      flyFrom = null;
      checkWin();
    }

    function checkWin(){
      var allPrime = true;
      (function scan(node){
        if(!node.children){ if(!isPrime(node.val)){ allPrime = false; } }
        else { node.children.forEach(scan); }
      })(root);
      if(allPrime && !finished){
        finished = true;
        DragSys.clearTargets();
        var banner = document.createElement("div");
        banner.className = "win-banner";
        banner.innerHTML = cfg.n + " = " + fmtFactor(cfg.n);
        wrap.appendChild(banner);
        api.win(cfg.n + " 的质因数是：" + fmtFactor(cfg.n));
      }
    }

    render();
    return {
      cleanup: function(){ timers.forEach(clearTimeout); },
      reveal: function(){ return revealText({type:"tree", cfg:cfg}); }
    };
  }
};

/* ---------- 关卡2：宝石天平（等积分组 + 实时质因数清单） ---------- */
StageModules.balance = {
  create: function(area, cfg, api){
    var timers = [], finished = false;
    var box = document.createElement("div");
    box.className = "bal-wrap";
    box.innerHTML =
      "<div class='beam-zone'><div class='beam-pivot'></div><div class='beam' id='beam'><i class='bplate l'></i><i class='bplate r'></i></div></div>" +
      "<div class='trays'>" +
      "<div class='tray' id='tray-L'><div class='tray-title'>左宝盒（放 " + cfg.group + " 张）</div><div class='tray-cards'></div><div class='inv'></div></div>" +
      "<div class='tray' id='tray-R'><div class='tray-title'>右宝盒（放 " + cfg.group + " 张）</div><div class='tray-cards'></div><div class='inv'></div></div>" +
      "</div>" +
      "<div class='bpool'><div class='pool-title'>待分配的数字卡（拖进上面的宝盒）</div><div class='pool-cards'></div></div>" +
      "<div class='bal-note' id='bal-note'>天平会向乘积大的一边倾斜；两边质因数清单一致时才会平衡</div>";
    area.appendChild(box);
    var beam = $("#beam", box), note = $("#bal-note", box);
    var holders = {L: $(".tray-cards", $("#tray-L", box)), R: $(".tray-cards", $("#tray-R", box)), P: $(".pool-cards", box)};

    /* 建立卡片 */
    shuffle(cfg.cards).forEach(function(v){
      var el = document.createElement("div");
      el.className = "bcard";
      el.textContent = v;
      holders.P.appendChild(el);
      var card = {val:v, el:el, side:"P"};
      DragSys.makeDraggable(el, {payload: function(){ return card; }});
    });

    /* 三个放置区 */
    DragSys.addTarget({el: $("#tray-L", box), onDrop: function(card){ place(card, "L"); }});
    DragSys.addTarget({el: $("#tray-R", box), onDrop: function(card){ place(card, "R"); }});
    DragSys.addTarget({el: $(".bpool", box), onDrop: function(card){ place(card, "P"); }});

    function place(card, side){
      if(card.side === side || finished){ return; }
      card.side = side;
      holders[side].appendChild(card.el);
      api.step();
      update();
    }

    /* 统计某侧每种质因数的个数 */
    function invOf(side){
      var inv = {};
      Object.keys(holders).forEach(function(k){
        if(k !== side){ return; }
        Array.prototype.forEach.call(holders[k].children, function(el){
          factorEntries(parseInt(el.textContent, 10)).forEach(function(e){
            inv[e[0]] = (inv[e[0]] || 0) + e[1];
          });
        });
      });
      return inv;
    }
    function prodOf(side){
      var m = 1;
      Array.prototype.forEach.call(holders[side].children, function(el){ m *= parseInt(el.textContent, 10); });
      return m;
    }
    function countOf(side){ return holders[side].children.length; }

    function update(){
      var invL = invOf("L"), invR = invOf("R");
      var primes = {};
      [invL, invR].forEach(function(inv){
        Object.keys(inv).forEach(function(k){ primes[k] = true; });
      });
      var sorted = Object.keys(primes).map(Number).sort(function(a,b){ return a - b; });
      var equal = sorted.length > 0 && sorted.every(function(p){ return (invL[p] || 0) === (invR[p] || 0); });
      /* 渲染两侧清单（对齐质数顺序，方便对照） */
      renderInv($(".inv", $("#tray-L", box)), sorted, invL, invR);
      renderInv($(".inv", $("#tray-R", box)), sorted, invR, invL);
      /* 天平倾斜角度（对数比例，限幅） */
      var ang = Math.log(prodOf("L") / prodOf("R")) * 12;
      ang = Math.max(-9, Math.min(9, ang));
      beam.style.transform = "rotate(" + (-ang) + "deg)";
      note.textContent = countOf("L") + " 张 vs " + countOf("R") + " 张 —— " +
        (equal ? "两边质因数清单一致！" : "清单还不一致，对照两边的方块数量调整一下");
      /* 胜利判定：卡片全部分完 + 清单一致 + 张数正确 */
      if(countOf("P") === 0 && countOf("L") === cfg.group && countOf("R") === cfg.group && equal){
        finished = true;
        DragSys.clearTargets();
        var pl = prodOf("L");
        later(function(){ api.win("两边乘积都是 " + pl + "，天平完美平衡！"); }, 650);
      } else if(countOf("P") === 0 && !equal){
        api.toast("所有卡都放进去了，但两边的质因数清单还不一样，再挪一挪");
      }
    }
    function later(fn, ms){ timers.push(setTimeout(fn, ms)); }
    function renderInv(el, sorted, mine, other){
      el.innerHTML = "";
      if(sorted.length === 0){
        el.innerHTML = "<div class='inv-zero'>（宝盒还是空的）</div>";
        return;
      }
      sorted.forEach(function(p){
        var c = mine[p] || 0, oc = other[p] || 0;
        var row = document.createElement("div");
        row.className = "inv-row " + (c === oc ? "eq" : "neq");
        var chip = "<span class='pchip' style='border-color:" + primeColor(p) + ";color:" + primeColor(p) + "'>" + p + "</span>";
        var blocks = "";
        var i2;
        if(c === 0){ blocks = "<span class='inv-zero'>没有</span>"; }
        else { for(i2 = 0; i2 < c; i2++){ blocks += "<span class='inv-sq' style='background:" + primeColor(p) + "'></span>"; } }
        row.innerHTML = chip + "<span class='inv-blocks'>" + blocks + "</span>";
        el.appendChild(row);
      });
    }
    update();
    return {
      cleanup: function(){ timers.forEach(clearTimeout); },
      reveal: function(){ return revealText({type:"balance", cfg:cfg}); }
    };
  }
};

/* ---------- 关卡3：平方宝石阵（补质因数成双） ---------- */
StageModules.square = {
  create: function(area, cfg, api){
    var timers = [], finished = false, added = {};
    var n = cfg.n, f = factorEntries(n);
    var box = document.createElement("div");
    box.className = "sq-wrap";
    /* 宝石架：只提供 N 含有的质数 */
    var shelf = document.createElement("div");
    shelf.className = "tile-shelf";
    shelf.innerHTML = "<div class='shelf-title'>质数宝石架（拖进下面的列里）</div>";
    var row = document.createElement("div");
    row.className = "shelf-row";
    f.forEach(function(e){
      var t = document.createElement("div");
      t.className = "tile";
      t.style.borderColor = primeColor(e[0]);
      t.style.color = primeColor(e[0]);
      t.textContent = e[0];
      row.appendChild(t);
      DragSys.makeDraggable(t, {payload: function(){ return e[0]; }});
    });
    shelf.appendChild(row);
    box.appendChild(shelf);
    var cols = document.createElement("div");
    cols.className = "sq-cols";
    box.appendChild(cols);
    var aLine = document.createElement("div");
    aLine.className = "sq-a";
    box.appendChild(aLine);
    area.appendChild(box);

    function later(fn, ms){ timers.push(setTimeout(fn, ms)); }

    f.forEach(function(e){
      var p = e[0], base = e[1];
      added[p] = 0;
      var col = document.createElement("div");
      col.className = "sq-col";
      col.dataset.p = p;
      col.innerHTML = "<div class='sq-head'>质数 " + p + "</div><div class='sq-stack'></div><div class='sq-foot'></div>";
      cols.appendChild(col);
      var stack = $(".sq-stack", col);
      var i;
      for(i = 0; i < base; i++){
        var b = document.createElement("div");
        b.className = "sq-block";
        b.style.background = primeColor(p);
        b.textContent = p;
        stack.appendChild(b);
      }
      DragSys.addTarget({
        el: col,
        accept: function(payload){ return payload === p; },
        onDrop: function(){
          if(finished){ return; }
          added[p]++;
          var nb = document.createElement("div");
          nb.className = "sq-block added";
          nb.style.background = primeColor(p);
          nb.textContent = p;
          nb.title = "点一下取下这颗宝石";
          nb.onclick = function(){
            if(finished){ return; }
            added[p]--;
            nb.remove();
            update();
          };
          stack.appendChild(nb);
          api.step();
          update();
        },
        onReject: function(payload){
          api.mistake();
          Toast.show("这颗 " + payload + " 宝石不属于" + p + "这一列哦");
        }
      });
    });

    function update(){
      var allEven = true, aRun = 1, needCnt = 0, ok = true;
      f.forEach(function(e){
        var p = e[0], total = e[1] + added[p];
        var colEl = cols.querySelector(".sq-col[data-p='" + p + "']");
        var foot = $(".sq-foot", colEl);
        foot.textContent = total + " 个 · " + (total % 2 === 0 ? "双数" : "单数");
        foot.className = "sq-foot " + (total % 2 === 0 ? "eve" : "odd");
        colEl.className = "sq-col " + (total % 2 === 0 ? "evecol" : "oddcol");
        if(total % 2 === 1){ allEven = false; }
        if(e[1] % 2 === 1){ needCnt++; }
        if(added[p] > 1 || (e[1] % 2 === 0 && added[p] > 0)){ ok = false; }
        var i2;
        for(i2 = 0; i2 < added[p]; i2++){ aRun *= p; }
      });
      aLine.innerHTML = "当前补上的乘积 a = " + aRun + "（通关条件：每列块数都是双数，且每种宝石最多补 1 颗）";
      if(allEven && !finished){
        if(ok){
          finished = true;
          DragSys.clearTargets();
          var rt = Math.round(Math.sqrt(n * aRun));
          later(function(){ api.win("a 的最小值 = " + aRun + "，" + n + " × " + aRun + " = " + (n * aRun) + " = " + rt + " × " + rt); }, 500);
        } else {
          Toast.show("每列都是双数了！但用了多余的宝石——点一下金色边框的宝石取下来，让 a 更小");
        }
      }
    }
    update();
    return {
      cleanup: function(){ timers.forEach(clearTimeout); },
      reveal: function(){ return revealText({type:"square", cfg:cfg}); }
    };
  }
};

/* ---------- 关卡4：生活智慧屋（例2：名次×年龄×分数=2910） ---------- */
StageModules.life = {
  create: function(area, cfg, api){
    var finished = false;
    var slots = [
      {name:"名次", lo:1, hi:10,  fmt: function(v){ return "第 " + v + " 名"; }, bad:function(v){ return v > 10 ? "第 " + v + " 名？比赛名次排不到这么大呀" : "名次出问题了"; }},

      {name:"成绩", lo:1, hi:100, fmt: function(v){ return v + " 分"; }, bad:function(v){ return v > 100 ? v + " 分？满分只有 100 呀" : "分数出问题了"; }}
    ];
    var gems = [2, 3, 5, 97];
    var box = document.createElement("div");
    /* 质数宝石托盘 */
    var tray = document.createElement("div");
    tray.className = "tile-shelf life-tray";
    tray.innerHTML = "<div class='shelf-title' style='width:100%'>质数宝石盘（每颗都要用上，可以几颗放进同一个格子）</div>";
    var row = document.createElement("div");
    row.className = "shelf-row";
    tray.appendChild(row);
    box.appendChild(tray);
    var slotRow = document.createElement("div");
    slotRow.className = "life-row";
    box.appendChild(slotRow);
    area.appendChild(box);

    gems.forEach(function(g){
      var el = document.createElement("div");
      el.className = "lgem";
      el.textContent = g;
      row.appendChild(el);
      var gem = {val:g, el:el, at:"tray"};
      DragSys.makeDraggable(el, {payload: function(){ return gem; }});
    });
    var slotHolders = [];
    slots.forEach(function(s, idx){
      var d = document.createElement("div");
      d.className = "life-slot";
      d.innerHTML = "<div class='ls-title'>" + s.name + "格</div>" +
        "<div class='ls-range'>" + (s.name === "名次" ? "第 1~10 名" : (s.name === "年龄" ? "中学生 12~18 岁" : "满分 100 分")) + "</div>" +
        "<div class='ls-cards'></div><div class='ls-val'></div><div class='ls-state'></div>";
      slotRow.appendChild(d);
      slotHolders.push($(".ls-cards", d));
      DragSys.addTarget({el:d, onDrop: function(gem){ moveGem(gem, idx); }});
    });
    DragSys.addTarget({el:tray, onDrop: function(gem){ moveGem(gem, "tray"); }});

    function moveGem(gem, to){
      if(finished){ return; }
      var from = gem.at;
      if(from === to){ return; }
      if(from === "tray"){ row.removeChild(gem.el); }
      else { slotHolders[from].removeChild(gem.el); }
      if(to === "tray"){ row.appendChild(gem.el); }
      else { slotHolders[to].appendChild(gem.el); }
      gem.at = to;
      api.step();
      update();
    }

    function update(){
      var allOk = true, answers = [];
      slots.forEach(function(s, idx){
        var v = 1;
        Array.prototype.forEach.call(slotHolders[idx].children, function(el){ v *= parseInt(el.textContent, 10); });
        var valEl = $(".ls-val", slotRow.children[idx]);
        var stEl = $(".ls-state", slotRow.children[idx]);
        var placed = slotHolders[idx].children.length;
        valEl.textContent = placed === 0 ? "（空，算作 1）" : s.fmt(v);
        if(v >= s.lo && v <= s.hi){
          stEl.textContent = "符合要求";
          stEl.className = "ls-state ls-good";
          answers.push(s.fmt(v));
        } else {
          stEl.textContent = s.bad(v);
          stEl.className = "ls-state ls-bad";
          allOk = false;
        }
      });
      /* 总乘积校验：四颗宝石全部用上时乘积恒为 2910，只要三个格子范围全对即胜利 */
      var used = 0;
      slots.forEach(function(s, idx){ used += slotHolders[idx].children.length; });
      if(allOk && used === gems.length && row.children.length === 0 && !finished){
        finished = true;
        DragSys.clearTargets();
        api.win("妹妹是中学生：15 岁，考了第 2 名，成绩 97 分！");
      }
    }
    update();
    return {
      cleanup: function(){ DragSys.clearTargets(); },
      reveal: function(){ return revealText({type:"life", cfg:cfg}); }
    };
  }
};

    var box = document.createElement("div");
    box.innerHTML =
      "<div class='div-machine'><span class='d-big'>" + cfg.D + "</span><span class='d-op'>÷</span>" +
      "<div class='d-slot' id='dslot'>拖入</div><span class='d-op'>=</span>" +
      "<span class='d-q' id='dq'>?</span><span class='d-op'>……</span><span class='d-r' id='dr'>?</span></div>" +
      "<div class='div-progress'>已收集 <b id='dcnt'>0</b> / " + cfg.valid.length + " 枚除数宝石（目标余数 " + cfg.r + "）：<span class='div-gems' id='dgems'></span></div>";
    var shelf = document.createElement("div");
    shelf.className = "tile-shelf";
    shelf.innerHTML = "<div class='shelf-title'>候选除数（拖进上面的机器试试）</div>";
    var row = document.createElement("div");
    row.className = "shelf-row";
    shelf.appendChild(row);
    box.appendChild(shelf);
    area.appendChild(box);

    var slot = $("#dslot", box), dq = $("#dq", box), dr = $("#dr", box),
        dcnt = $("#dcnt", box), dgems = $("#dgems", box);
    function later(fn, ms){ timers.push(setTimeout(fn, ms)); }

    shuffle(cfg.bank).forEach(function(v){
      var t = document.createElement("div");
      t.className = "tile";
      t.textContent = v;
      row.appendChild(t);
      DragSys.makeDraggable(t, {payload: function(){ return v; }});
    });
    DragSys.addTarget({
      el: slot,
      onDrop: function(v){
        if(finished || busy){ return; }
        if(collected[v]){ Toast.show(v + " 这枚已经收好啦"); return; }
        busy = true;
        api.step();
        slot.textContent = v;
        var q = Math.floor(cfg.D / v), r = cfg.D % v;
        dq.textContent = q;
        dr.textContent = r;
        dr.className = "d-r " + (r === cfg.r ? "hit" : "miss");
        later(function(){
          slot.textContent = "拖入";
          if(r === cfg.r){
            collected[v] = true;
            var g = document.createElement("div");
            g.className = "dgem pop";
            g.textContent = v;
            dgems.appendChild(g);
            var cnt = Object.keys(collected).length;
            dcnt.textContent = cnt;
            Toast.show(cfg.D + " ÷ " + v + " = " + q + " …… " + r + "，余数正好是 " + cfg.r + "，收下！");
            FX.burst(window.innerWidth / 2, window.innerHeight / 2, 26);
            if(cnt === cfg.valid.length && !finished){
              finished = true;
              later(function(){ DragSys.clearTargets(); api.win(cfg.valid.length + " 种填法全部找齐，共 " + cfg.valid.length + " 枚宝石！"); }, 600);
            }
          } else {
            Toast.show(cfg.D + " ÷ " + v + " = " + q + " …… " + r + "，余数不是 " + cfg.r + "，再试试别的");
            dq.textContent = "?"; dr.textContent = "?"; dr.className = "d-r";
            api.mistake();
          }
          busy = false;
        }, 950);
      }
    });
    return {
      cleanup: function(){ timers.forEach(clearTimeout); },
      reveal: function(){ return revealText({type:"division", cfg:cfg}); }
    };
  }
};

/* ============================================================
   九、启动
   ============================================================ */
applyPalette();
Game.menuScreen();
</script>
