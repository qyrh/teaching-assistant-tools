      <div class="menu-desc">

        每一关都要<b>动手操作</b>：拖动线段图、划过卡片做交换、点按翻牌、加减配对、调节天数滑杆……让所有目标条件同时达成即通关！

      <div class="actions"><button class="btn ghost" id="btnRules">规则说明</button></div>

2只鸡后鸡兔同样多：剩下脚数 138−2×12=114 只，每对 2+4=6 只脚。",readouts:function(v){return[{label:"鸡的只数（配对+零头）",val:v.p+v.e,unit:"只"},{label:"兔的只数（=配对数）",val:v.p,unit:"只"},{label:"鸡比兔多",val:v.e,unit:"只",target:12,big:true},{label:"总脚数（6×对数+2×零头）",val:6*v.p+2*v.e,unit:"只",target:138,big:true}]}},sol:["去掉多出的12只鸡：剩下脚数 138−2×12=114（只），此时鸡和兔同样多。","1鸡1兔一对，每对6只脚：114÷6=19（对）。","兔19只；鸡：19+12=31（只）。"],ans:"鸡31只，兔19只。"},{name:"水果批发站 · 同时卖完",tpl:"slider",story:"仓库所存的苹果是香蕉的3倍。春节前夕，平均每天批发出250千克香蕉、600千克苹果，几天后香蕉全部批发完，苹果还剩900千克。这个仓库原有苹果和香蕉各多少千克？",tip:"苹果是香蕉的3倍：要同时卖完，每天应卖苹果 250×3=750 千克！",cfg:{knob:{label:"批发天数",min:1,max:12,init:1,unit:"天"},hint:"按3倍同卖：每天应卖苹果 250×3=750（千克），实际每天只卖600千克，每天就会剩下 750−600=150（千克）。",compute:function(d){return{bars:[{label:"原有香蕉（250×天数）",val:250*d,max:2e3,txt:250*d+"千克"},{label:"应卖的苹果（750×天数）",val:750*d,max:5e3,txt:750*d+"千克"},{label:"实际已卖苹果（600×天数）",val:600*d,max:5e3,txt:600*d+"千克"}],rows:[{label:"苹果剩余（750×天数−600×天数）",val:150*d,unit:"千克",target:900,big:true}]}}},sol:["要同时卖完，每天应卖苹果 250×3=750（千克），实际只卖600千克，每天剩下 750−600=150（千克）。","剩下的900千克里有多少个150：900÷150=6（天）。","香蕉：250×6=1500（千克）；苹果：1500×3=4500（千克）。"],ans:"原有苹果4500千克，香蕉1500千克。"}],"高级":[{name:"六倍分组乐园",tpl:"pair",story:"兔的只数是鸡的6倍，鸡和兔共有390只脚。鸡和兔各有几只？",tip:"既然兔是鸡的6倍，就把1只鸡和6只兔编成一组，看看每组的脚数！",cfg:{kind:"group",knobs:[{key:"g",label:"小组数（每组 1鸡 + 6兔）",min:0,max:20,init:0,unit:"组"}],opTip:"👆 点 ＋ / − 调整小组数！每组 1鸡+6兔 共 2+4×6=26 只脚，让总脚数=390！",note:"1只鸡和6只兔编成一组：每组脚 2+4×6=26（只）。分组法也是假设法的好朋友！",readouts:function(v){return[{label:"鸡的只数（=组数）",val:v.g,unit:"只"},{label:"兔的只数（6×组数）",val:6*v.g,unit:"只"},{label:"总脚数（26×组数）",val:26*v.g,unit:"只",target:390,big:true}]}},sol:["兔是鸡的6倍：把1只鸡和6只兔编成一组，每组脚 2+4×6=26（只）。","组数：390÷26=15（组）。","鸡：15只；兔：15×6=90（只）。"],ans:"鸡15只，兔90只。"},{name:"登山时间轴 · 上下分配",tpl:"slider",story:"小宇去爬山。他从东坡上山，每小时行2千米，到山顶玩了1小时，又从西坡下山，每小时行3千米，全程共行19千米，共用9小时。上山、下山的路程各是多少千米？",tip:"总共9小时，玩1小时，路上正好8小时。把8小时分给上山和下山！",cfg:{knob:{label:"上山时间（路上共8小时）",min:0,max:8,init:0,unit:"小时"},hint:"路上共 9−1=8（小时）。假设8小时全用来上山：只能行 2×8=16 千米，比19千米少3千米。每把1小时上山换成下山：多行 3−2=1 千米。",compute:function(t){return{bars:[{label:"上山用时",val:t,max:8,txt:t+"小时"},{label:"下山用时（8−上山）",val:8-t,max:8,txt:8-t+"小时"},{label:"上山路程（2×上山时）",val:2*t,max:24,txt:2*t+"千米"},{label:"下山路程（3×下山时）",val:3*(8-t),max:24,txt:3*(8-t)+"千米"}],rows:[{label:"全程路程（24−上山时）",val:2*t+3*(8-t),unit:"千米",target:19,big:true}]}}},sol:["路上时间：9−1=8（小时）。假设8小时全上山：行 2×8=16（千米），比实际少 19−16=3（千米）。","每把1小时上山换成下山：多行 3−2=1（千米）。","下山：3÷1=3（小时）；上山：8−3=5（小时）。","上山路程：2×5=10（千米）；下山路程：3×3=9（千米）。"],ans:"上山10千米，下山9千米。"},{name:"果园浇水站 · 同时浇完",tpl:"slider",story:"果园里苹果树的棵数是桃树的3倍，管理人员每天能给25棵苹果树和15棵桃树浇水，几天后，当桃树全部浇完时苹果树还有140棵没有浇。果园里这两种树共有多少棵？",tip:"苹果树是桃树的3倍：要同时浇完，每天应浇苹果树 15×3=45 棵！",cfg:{knob:{label:"浇水天数",min:1,max:12,init:1,unit:"天"},hint:"按3倍同浇：每天应浇苹果树 15×3=45（棵），实际每天只浇25棵，每天就会剩 45−25=20（棵）没浇。",compute:function(d){return{bars:[{label:"桃树总量（15×天数）",val:15*d,max:200,txt:15*d+"棵"},{label:"苹果树总量（45×天数）",val:45*d,max:500,txt:45*d+"棵"},{label:"已浇的苹果树（25×天数）",val:25*d,max:500,txt:25*d+"棵"}],rows:[{label:"苹果树还没浇的（45×天数−25×天数）",val:20*d,unit:"棵",target:140,big:true}]}}},sol:["要同时浇完，每天应浇苹果树 15×3=45（棵），实际只浇25棵，每天剩下 45−25=20（棵）。","剩下的140棵里有多少个20：140÷20=7（天）。","桃树：15×7=105（棵）；苹果树：105×3=315（棵）；两种树共 105+315=420（棵）。"],ans:"两种树共有420棵（桃树105棵，苹果树315棵）。"},{name:"双仓进货 · 倍数对齐",tpl:"slider",story:"甲仓库有货物58吨，乙仓库有货物32吨。现在甲仓库每天进货4吨，乙仓库每天进货20吨，多少天后，乙仓库的货物是甲仓库的2倍？",tip:"假设乙仓现在就是甲仓的2倍：应有 58×2=116 吨，比实际多出好多，用每天的进货差去补！",cfg:{knob:{label:"进货天数",min:1,max:12,init:1,unit:"天"},hint:"假设乙仓现在就是甲仓的2倍：应有 58×2=116（吨），比实际的32吨多 116−32=84（吨）。乙仓每天比「甲仓2倍应进的 4×2=8 吨」多进 20−8=12（吨）。",compute:function(d){return{bars:[{label:"甲仓货物（58+4×天数）",val:58+4*d,max:200,txt:58+4*d+"吨"},{label:"乙仓货物（32+20×天数）",val:32+20*d,max:200,txt:32+20*d+"吨"},{label:"甲仓货物×2",val:2*(58+4*d),max:200,txt:2*(58+4*d)+"吨"}],rows:[{label:"乙仓−甲仓×2（把相差调成0）",val:32+20*d-2*(58+4*d),unit:"吨",target:0,big:true}]}}},sol:["假设乙仓现在就是甲仓的2倍：应有 58×2=116（吨），比实际的32吨多 116−32=84（吨）。","每天乙仓比「甲仓的2倍应进货 4×2=8 吨」多进 20−8=12（吨）。","84÷12=7（天）后，乙仓货物正好是甲仓的2倍（验证：甲 58+28=86 吨，乙 32+140=172 吨）。"],ans:"7天后乙仓库的货物是甲仓库的2倍。"},{name:"兴趣小组大厅",tpl:"bars",story:"学校三个兴趣小组共有学生360人。书画兴趣小组的人数比器乐兴趣小组多30人，器乐兴趣小组的人数比科技兴趣小组少18人。三个兴趣小组各有多少人？",tip:"以器乐小组为「1份」：书画多30人，科技多18人。假设三个组都和器乐一样多！",cfg:{unit:"人",baseName:"器乐小组人数",baseMax:130,baseInit:1,bars:[{label:"书画组",coeff:1,off:30},{label:"器乐组",coeff:1,off:0},{label:"科技组",coeff:1,off:18}],sumLabel:"三个小组总人数",target:360,foldHint:"多出的 30+18=48 人先放一边，三个组就一样多啦！剩下的总数÷3 就是器乐组。"},sol:["以器乐小组为标准：书画组多30人，科技组多18人。","假设三个组都和器乐一样多：360−(30+18)=312（人）。","每份：312÷3=104（人）。器乐104人；书画：104+30=134人；科技：104+18=122人。"],ans:"书画组134人，器乐组104人，科技组122人。"},{name:"三筐苹果仓库 · 份数拉齐",tpl:"bars",story:"三筐苹果共130个，第二筐的苹果数是第一筐的3倍，第三筐的苹果数比第二筐的2倍多10个。三筐苹果各有多少个？",tip:"把第一筐看作「1份」：第二筐3份，第三筐 2×3=6 份还多10个。多的10个先放一边！",cfg:{unit:"个",baseName:"1份（第一筐）的个数",baseMax:30,baseInit:1,bars:[{label:"第一筐",coeff:1,off:0},{label:"第二筐",coeff:3,off:0},{label:"第三筐",coeff:6,off:10}],sumLabel:"三筐总个数",target:130,foldHint:"第三筐多出的10个先放一边，剩下正好是 1+3+6=10 份！剩下的总数÷10 就是每份。"},sol:["把第一筐看作1份：第二筐3份，第三筐 2×3=6 份多10个。","把多出的10个放一边：130−10=120（个），正好是 1+3+6=10（份）。","每份：120÷10=12（个）。第一筐12个；第二筐 12×3=36 个；第三筐 36×2+10=82 个。"],ans:"第一筐12个，第二筐36个，第三筐82个。"}]};function showScreen(name){G.screen=name;$("#scrMenu").classList.toggle("hidden",name!=="menu");$("#scrStation").classList.toggle("hidden",name!=="station");$("#scrWin").classList.toggle("hidden",name!=="win");$("#btnBack").classList.toggle("hidden",name==="menu");updProg()}function startLevel(level){G.level=level;G.problems=shuffle(POOL[level]).slice(0,3);G.idx=0;G.stars=0;G.steps=0;G.marks=[null,null,null];applyPalette(pick(PALETTES));$("#hudLevel").textContent=level;$("#hudSteps").textContent="0";startTimer();mountStation(G.problems[0])}function mountStation(p){G.cur=p;G.solved=false;G.revealed=false;G.stationSteps=0;showScreen("station");$("#stTitle").textContent="第"+(G.idx+1)+"关 · "+p.name;$("#stStory").textContent=p.story;$("#stTip").textContent="小提示："+p.tip;$("#stage").innerHTML="";$("#statusList").innerHTML="";$("#doneMask").classList.add("hidden");$("#doneMask").innerHTML="";$("#btnReveal").disabled=false;RENDER[p.tpl](p.cfg);updProg()}function updProg(){const box=$("#prog");box.innerHTML="";for(let i=0;i<3;i++){const d=el("div","dot");const mk=G.marks[i];if(mk==="star"){d.classList.add("star");d.textContent="★"}else if(mk==="eye"){d.classList.add("eye");d.textContent="👀"}else if(i===G.idx&&G.screen==="station"){d.classList.add("active");d.textContent=String(i+1)}else{d.textContent=String(i+1)}box.appendChild(d)}}function onSolve(){if(G.solved){return}G.solved=true;G.marks[G.idx]=G.revealed?"eye":"star";if(!G.revealed){G.stars++}$("#btnReveal").disabled=true;const m=$("#doneMask");m.classList.remove("hidden");m.innerHTML="";const c=el("div","done-card");c.appendChild(el("div","done-t",G.revealed?"👀 已看过揭秘，本关完成":"🎉 太棒了！本关通过"));if(!G.revealed){c.appendChild(el("div","done-star","★"))}const ol=el("ol","done-ol");G.cur.sol.forEach(function(s){const li=document.createElement("li");li.textContent=s;ol.appendChild(li)});c.appendChild(ol);c.appendChild(el("div","done-ans","答："+G.cur.ans));const b=el("button","btn",G.idx>=2?"查看战绩 →":"下一关 →");b.addEventListener("click",nextStation);c.appendChild(b);m.appendChild(c);burst(1400);updProg()}function nextStation(){G.idx++;if(G.idx>=G.problems.length){winScreen()}else{mountStation(G.problems[G.idx])}}function revealAnswer(){if(!G.cur||G.solved){return}G.revealed=true;const body='<ol class="sol">'+G.cur.sol.map(function(s){return"<li>"+s+"</li>"}).join("")+'</ol><p class="ans">答：'+G.cur.ans+'</p><p class="warn-line">看了揭秘，本关完成后不亮星哦，下一关加油！</p>';showModal("本关思路揭秘 · "+G.cur.name,body,[{label:"记下来了，完成本关",fn:onSolve}])}function winScreen(){stopTimer();showScreen("win");let starsTxt="";for(let i=0;i<3;i++){starsTxt+=i<G.stars?"★":"☆"}$("#winStars").textContent=starsTxt;$("#winMsg").textContent=G.stars>=3?"三星通关，你就是假设法大师！":G.stars===2?"两颗星，已经非常棒了！":"完成挑战！再试一次拿满星吧！";$("#winStats").innerHTML="难度："+G.level+"<br>用时："+timeStr()+"　·　总步数："+G.steps+"<br>获得星星："+G.stars+" / 3";burst(3600)}function showModal(title,bodyHtm
