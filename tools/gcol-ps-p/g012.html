<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>第18讲 快乐的游戏 · 数学游戏嘉年华</title>
<style>
/* ============ 全局变量与基础样式 ============ */
:root{
  --c1:#f97316;        /* 主色（每局随机更换） */
  --c2:#fbbf24;        /* 辅色 */
  --csoft:#fff7ed;     /* 主色浅底 */
  --ink:#3b2412;       /* 深色文字 */
  --bg:#fffdf7;        /* 页面底色 */
  --ok:#15803d;        /* 成功绿 */
  --bad:#dc2626;       /* 提醒红 */
  --opp:#64748b;       /* 对方颜色（灰蓝） */
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Heiti SC",sans-serif;
  background:var(--bg); color:var(--ink); touch-action:manipulation; }
#app{ max-width:1020px; margin:0 auto; padding:10px 12px 40px; }
button{ font-family:inherit; cursor:pointer; }
.hidden{ display:none !important; }

/* ============ 顶部信息栏（HUD）：标题 + 计时 + 步数 ============ */
#hud{ position:sticky; top:0; z-index:60; background:linear-gradient(92deg,var(--c1),var(--c2));
  color:#fff; border-radius:16px; padding:10px 16px; display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center;
  box-shadow:0 5px 16px rgba(0,0,0,.18); }
#hud .logo{ display:flex; align-items:center; gap:8px; font-size:20px; font-weight:bold; letter-spacing:1px; }
#hud .spacer{ flex:1; }
#hud .chip{ background:rgba(255,255,255,.22); border-radius:999px; padding:6px 14px; font-size:16px; font-weight:bold; white-space:nowrap; }
#hud .btn-mini{ background:rgba(255,255,255,.9); color:var(--ink); border:none; border-radius:999px;
  padding:8px 14px; font-size:15px; font-weight:bold; }
#hud .btn-mini:active{ transform:scale(.95); }

/* ============ 屏幕切换 ============ */
.screen{ margin-top:14px; }

/* ============ 难度选择菜单 ============ */
.menu-hero{ text-align:center; margin:26px 0 10px; }
.menu-hero h1{ font-size:34px; margin:6px 0; color:var(--c1); text-shadow:1px 1px 0 #fff; }
.menu-hero p{ font-size:18px; margin:6px 0; }
.diff-row{ display:flex; flex-wrap:wrap; gap:16px; justify-content:center; margin-top:22px; }
.diff-card{ flex:1 1 240px; max-width:300px; background:#fff; border:4px solid var(--c1); border-radius:22px;
  padding:22px 18px; text-align:center; box-shadow:0 8px 18px rgba(0,0,0,.10); transition:transform .15s; }
.diff-card:active{ transform:scale(.97); }
.diff-card h2{ font-size:26px; margin:4px 0 6px; color:var(--c1); }
.diff-card .tag{ display:inline-block; background:var(--csoft); color:var(--c1); border-radius:999px; padding:4px 14px; font-weight:bold; }
.diff-card p{ font-size:16px; line-height:1.7; color:#5b4636; margin:10px 0 14px; }
.diff-card .go{ background:linear-gradient(92deg,var(--c1),var(--c2)); color:#fff; border:none; border-radius:14px;
  padding:12px 26px; font-size:19px; font-weight:bold; box-shadow:0 4px 10px rgba(0,0,0,.15); }

/* ============ 关卡地图 ============ */
#map-title{ text-align:center; font-size:26px; margin:16px 0 4px; color:var(--c1); }
#map-sub{ text-align:center; font-size:16px; color:#7a6650; margin:0 0 14px; }
.level-row{ display:flex; flex-wrap:wrap; gap:14px; justify-content:center; }
.level-card{ flex:1 1 210px; max-width:260px; background:#fff; border:3px solid #e7d9c4; border-radius:18px; padding:16px; text-align:center; }
.level-card.open{ border-color:var(--c1); box-shadow:0 6px 14px rgba(0,0,0,.10); }
.level-card.locked{ opacity:.55; }
.level-card .idx{ font-size:14px; color:#9b8468; font-weight:bold; }
.level-card h3{ margin:4px 0 8px; font-size:20px; }
.level-card .kind{ display:inline-block; background:var(--csoft); color:var(--c1); border-radius:999px; padding:3px 12px; font-size:14px; font-weight:bold; margin-bottom:10px; }
.level-card .stars{ color:#f5b301; font-size:20px; letter-spacing:2px; min-height:26px; }
.level-card .go{ background:linear-gradient(92deg,var(--c1),var(--c2)); color:#fff; border:none; border-radius:12px; padding:10px 22px; font-size:17px; font-weight:bold; }
.level-card .go:disabled{ background:#d8cbb8; cursor:not-allowed; }

/* ============ 游戏通用面板 ============ */
.panel{ background:#fff; border:3px solid var(--c1); border-radius:18px; padding:14px 16px; margin:12px 0; box-shadow:0 4px 12px rgba(0,0,0,.07); }
.panel h3{ margin:0 0 8px; font-size:20px; color:var(--c1); }
.story-text{ font-size:19px; line-height:1.9; margin:0; }
.story-text b{ color:var(--bad); }
.turn-banner{ text-align:center; font-size:22px; font-weight:bold; color:var(--c1); margin:10px 0; min-height:32px; }
.ctrl-row{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:14px 0 4px; }
.btn{ border:none; border-radius:14px; padding:12px 20px; font-size:17px; font-weight:bold; background:#efe4d2; color:var(--ink); }
.btn:active{ transform:scale(.95); }
.btn-primary{ background:linear-gradient(92deg,var(--c1),var(--c2)); color:#fff; box-shadow:0 4px 10px rgba(0,0,0,.15); }
.btn-big{ font-size:20px; padding:14px 30px; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }

/* ============ 24点：牌与运算 ============ */
.tile-row{ display:flex; flex-wrap:wrap; gap:16px; justify-content:center; min-height:150px; align-items:stretch; padding:8px 0; user-select:none; }
.tile{ width:128px; min-height:142px; background:#fff; border:3px solid #c9b48f; border-radius:14px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; position:relative; transition:transform .12s, box-shadow .12s; }
.tile .face{ position:absolute; top:6px; left:8px; font-size:15px; font-weight:bold; color:#b08552; }
.tile .val{ font-size:38px; font-weight:bold; color:var(--ink); }
.tile .sub{ font-size:16px; color:#8a7560; max-width:116px; text-align:center; line-height:1.35; word-break:break-all; }
.tile.sel{ border-color:var(--c1); box-shadow:0 0 0 5px var(--csoft),0 6px 14px rgba(0,0,0,.15); transform:translateY(-8px); }
.tile.sel .order{ position:absolute; top:-14px; right:-10px; background:var(--c1); color:#fff; border-radius:999px; padding:3px 10px; font-size:14px; font-weight:bold; }
.tile.shake{ animation:shakeX .4s; }
@keyframes shakeX{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-9px)} 75%{transform:translateX(9px)} }
.tile.newpop{ animation:popin .35s; }
@keyframes popin{ 0%{transform:scale(.4);opacity:0} 100%{transform:scale(1);opacity:1} }
.opbar{ display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin:8px 0; }
.op{ width:74px; height:74px; border-radius:18px; border:3px solid var(--c1); background:#fff; color:var(--c1);
  font-size:34px; font-weight:bold; line-height:1; }
.op:disabled{ border-color:#d8cbb8; color:#d8cbb8; background:#f6f0e6; }
.op:not(:disabled):active{ background:var(--c1); color:#fff; transform:scale(.93); }
.preview-line{ text-align:center; font-size:18px; color:#7a6650; min-height:28px; margin:4px 0; }
.status-line{ text-align:center; font-size:16px; color:#9b8468; }
.calclog{ font-size:16px; line-height:1.9; color:#5b4636; margin:4px 0; max-height:130px; overflow-y:auto; }
.calclog span{ display:inline-block; background:var(--csoft); border-radius:8px; padding:2px 10px; margin:3px 4px; color:var(--c1); font-weight:bold; }

/* ============ 取物游戏：物品堆 ============ */
.pile{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; padding:12px 4px; user-select:none; touch-action:none; min-height:70px; }
.item{ border:none; background:transparent; padding:0; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; }
.item .body{ display:block; transition:transform .12s, opacity .3s; }
.item .num{ font-size:16px; color:#9b8468; margin-top:3px; min-height:18px; }
.it-candy .body{ width:46px; height:46px; border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #fff 0 6%, transparent 7%),
             repeating-linear-gradient(45deg, var(--c1) 0 7px, #fff 7px 14px);
  border:3px solid rgba(0,0,0,.15); }
.it-match .body{ width:12px; height:52px; border-radius:6px; background:linear-gradient(180deg,#e2b07e 70%, #b45309 70%); border:1px solid rgba(0,0,0,.12); }
.it-stick .body{ width:14px; height:52px; border-radius:7px; background:linear-gradient(180deg,#f5d9a8,#e0b274); border:1px solid rgba(0,0,0,.12); }
.it-card .body{ width:42px; height:58px; border-radius:8px; background:linear-gradient(135deg,#fff,var(--csoft));
  border:3px solid var(--c1); position:relative; }
.it-card .body::after{ content:""; position:absolute; inset:6px; border:2px dashed var(--c1); border-radius:5px; opacity:.6; }
.item.picked .body{ transform:translateY(-12px) scale(1.08); filter:brightness(1.15); }
.item.taken-hero .body{ transform:scale(.82); opacity:.85; }
.item.taken-hero.it-candy .body, .item.taken-hero.it-card .body{ background:var(--c1); border-color:var(--c2); }
.item.taken-hero.it-match .body, .item.taken-hero.it-stick .body{ background:var(--c1); }
.item.taken-opp .body{ transform:scale(.82); opacity:.55; filter:grayscale(1); }
.item.taken{ pointer-events:none; }
.basket-row{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin:8px 0; }
.basket{ border-radius:999px; padding:8px 20px; font-size:17px; font-weight:bold; background:var(--csoft); color:var(--c1); }
.basket.opp{ background:#eef1f5; color:var(--opp); }
.order-row{ display:flex; flex-wrap:wrap; gap:16px; justify-content:center; margin:12px 0; }

/* ============ 数数到70：数字网格 ============ */
.numgrid{ display:grid; grid-template-columns:repeat(10,1fr); gap:12px; padding:8px 2px; }
.cell{ aspect-ratio:1/1; border-radius:10px; border:2px solid #e0d2ba; background:#fff; font-size:17px; font-weight:bold; color:#7a6650; }
.cell.can{ border-color:var(--c1); color:var(--c1); background:var(--csoft); animation:pulse 1.2s infinite; }
@keyframes pulse{ 0%,100%{box-shadow:0 0 0 0 rgba(0,0,0,0)} 50%{box-shadow:0 0 0 5px var(--csoft)} }
.cell.prev{ background:var(--c2); color:var(--ink); border-color:var(--c2); }
.cell.hero{ background:var(--c1); color:#fff; border-color:var(--c1); }
.cell.opp{ background:var(--opp); color:#fff; border-color:var(--opp); }
.count-now{ text-align:center; font-size:24px; font-weight:bold; color:var(--c1); margin:6px 0; }

/* ============ 弹窗与提示 ============ */
#modal-mask{ position:fixed; inset:0; background:rgba(40,25,10,.45); z-index:1000; display:flex; align-items:center; justify-content:center; padding:16px; }
#modal{ background:#fff; border-radius:20px; max-width:620px; width:100%; max-height:86vh; overflow-y:auto; padding:22px 24px; box-shadow:0 12px 40px rgba(0,0,0,.3); }
#modal h2{ margin:0 0 12px; font-size:24px; color:var(--c1); text-align:center; }
#modal .mbody{ font-size:18px; line-height:1.95; white-space:pre-wrap; }
#modal .mbody b{ color:var(--bad); }
#modal .mbody .em{ color:var(--c1); font-weight:bold; }
#modal .mbtns{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:18px; }
#toast{ position:fixed; left:50%; bottom:34px; transform:translateX(-50%); background:rgba(50,35,15,.92); color:#fff;
  border-radius:999px; padding:12px 26px; font-size:17px; z-index:1200; opacity:0; pointer-events:none; transition:opacity .25s; max-width:86vw; text-align:center; }
#toast.show{ opacity:1; }
.star-row{ text-align:center; font-size:34px; color:#f5b301; letter-spacing:6px; margin:6px 0; }

/* ============ 特效画布（彩纸与烟花） ============ */
#fx{ position:fixed; inset:0; z-index:900; pointer-events:none; }

/* ============ 全部通关遮罩 ============ */
#allover{ position:fixed; inset:0; z-index:1100; background:rgba(255,248,230,.94); display:flex; align-items:center; justify-content:center; padding:18px; }
#allover .inner{ text-align:center; max-width:560px; }
#allover h1{ font-size:36px; color:var(--c1); margin:10px 0; }
#allover p{ font-size:20px; line-height:1.9; }
#allover .ctrl-row{ margin-top:16px; }

/* ============ 移动端适配 ============ */
@media (max-width:640px){
  #hud .logo{ font-size:17px; }
  #hud .chip{ font-size:14px; padding:5px 10px; }
  .menu-hero h1{ font-size:26px; }
  .tile{ width:96px; min-height:120px; }
  .tile .val{ font-size:30px; }
  .tile .sub{ font-size:15px; max-width:88px; }
  .op{ width:62px; height:62px; font-size:28px; }
  .story-text{ font-size:17px; }
  .cell{ font-size:13px; }
  .item .num{ font-size:14px; }
  .it-candy .body{ width:38px; height:38px; }
}
</style>
</head>
<body>
<div id="app">

  <!-- 顶部信息栏：标题 / 色板 / 计时 / 步数 / 常用按钮 -->
  <header id="hud">
    <div class="logo">
      <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 1.8l3.1 6.3 6.9 1-5 4.9 1.2 6.9L12 17.6l-6.2 3.3L7 14 2 9.1l6.9-1z"
              fill="#fff" stroke="#ffffff88" stroke-width="1"/>
      </svg>
      <span>快乐的游戏 · 嘉年华</span>
    </div>
    <div class="spacer"></div>
    <div class="chip" id="hud-pal">色板</div>
    <div class="chip">计时 <span id="hud-time">00:00</span></div>
    <div class="chip">步数 <span id="hud-steps">0</span></div>
    <button class="btn-mini" id="btn-rules">玩法说明</button>
    <button class="btn-mini" id="btn-back-menu">返回难度选择</button>
  </header>

  <!-- 屏幕一：难度选择 -->
  <section class="screen" id="screen-menu">
    <div class="menu-hero">
      <h1>数学游戏嘉年华</h1>
      <p>巧算24点 · 智取糖果 · 数数到70 —— 玩着玩着就懂了！</p>
      <p style="font-size:15px;color:#9b8468;">每次进入都会随机抽取新的题目和新的配色哦，选一个难度开始吧！</p>
    </div>
    <div class="diff-row">
      <div class="diff-card">
        <span class="tag">初级 · 糖果小镇</span>
        <h2>初级</h2>
        <p>例题级：四张牌巧算24点，学会"每次合起来凑3"的抢糖妙招。</p>
        <button class="go" data-diff="初级">开始冒险</button>
      </div>
      <div class="diff-card">
        <span class="tag">中级 · 星光乐园</span>
        <h2>中级</h2>
        <p>练习级：更巧的24点拼法，每次拿1~3根火柴的智慧取胜法。</p>
        <button class="go" data-diff="中级">开始冒险</button>
      </div>
      <div class="diff-card">
        <span class="tag">高级 · 智慧巅峰</span>
        <h2>高级</h2>
        <p>变式综合：火眼金睛识破"算不出24"的牌局，后拿反超抢牌，数数冲向70！</p>
        <button class="go" data-diff="高级">开始冒险</button>
      </div>
    </div>
  </section>

  <!-- 屏幕二：关卡地图 -->
  <section class="screen hidden" id="screen-map">
    <h2 id="map-title">关卡地图</h2>
    <p id="map-sub">按顺序闯关，全部点亮就能参加通关庆典！</p>
    <div class="level-row" id="map-levels"></div>
  </section>

  <!-- 屏幕三：游戏主区域（按关卡动态渲染） -->
  <section class="screen hidden" id="screen-play">
    <div id="play-root"></div>
  </section>
</div>

<!-- 特效画布：彩纸与烟花 -->
<canvas id="fx"></canvas>

<!-- 通用弹窗 -->
<div id="modal-mask" class="hidden">
  <div id="modal" role="dialog" aria-modal="true">
    <h2 id="modal-title"></h2>
    <div class="mbody" id="modal-body"></div>
    <div class="star-row hidden" id="modal-stars"></div>
    <div class="mbtns" id="modal-btns"></div>
  </div>
</div>

<!-- 全部通关遮罩 -->
<div id="allover" class="hidden">
  <div class="inner">
    <h1>全部通关，太棒啦！</h1>
    <p id="allover-stats"></p>
    <div class="ctrl-row">
      <button class="btn btn-primary btn-big" id="btn-again">再来一局（重新抽题）</button>
      <button class="btn btn-big" id="btn-allover-menu">返回难度选择</button>
    </div>
  </div>
</div>

<!-- 底部轻提示 -->
<div id="toast"></div>

<script>
"use strict";
/* =====================================================================
 * 第18讲《快乐的游戏》互动游戏
 * 核心题型（源自教参）：
 *   一、算"24点"：四张牌用加减乘除（可加括号）凑出24，或正确判定算不出
 *   二、轮流取物（取糖果/火柴/小棒/扑克牌）：总数÷(每次最多+1) 定先后的必胜法
 *   三、轮流数数到70：同样的"凑倍数"思想
 * 操作交互设计（真操作，不是选择题）：
 *   24点 —— 点选两张牌再点运算符，两牌"合并"成新牌，合并三次构造出24
 *   取物 —— 点选或按住划过物品选中，确认取走；与电脑伙伴轮流拿
 *   数数 —— 在数字网格上点亮要数到的数字
 * ===================================================================== */

/* ---------------- 小工具 ---------------- */
function qs(sel){ return document.querySelector(sel); }
/* 建元素：tag 标签，cls 类名，html 内文（可省略） */
function el(tag, cls, html){
  var n = document.createElement(tag);
  if(cls){ n.className = cls; }
  if(arguments.length > 2 && html !== null){ n.innerHTML = html; }
  return n;
}
/* 洗牌（Fisher-Yates），返回新数组 */
function shuffle(arr){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
/* 从数组随机取 n 个（不重复） */
function sample(arr, n){
  return shuffle(arr).slice(0, n);
}
/* 随机整数 [a,b] */
function randInt(a, b){
  return a + Math.floor(Math.random() * (b - a + 1));
}

/* ---------------- 分数（有理数）精确运算：24点需要精确的除法 ---------------- */
function gcd(a, b){ return b === 0 ? a : gcd(b, a % b); }
/* 规范化分数：分母为正、约分 */
function frac(n, d){
  if(d < 0){ n = -n; d = -d; }
  var g = gcd(Math.abs(n), Math.abs(d));
  if(g === 0){ g = 1; }
  return { n: Math.round(n / g), d: Math.round(d / g) };
}
var F0 = { n: 0, d: 1 };
function fAdd(a, b){ return frac(a.n * b.d + b.n * a.d, a.d * b.d); }
function fSub(a, b){ return frac(a.n * b.d - b.n * a.d, a.d * b.d); }
function fMul(a, b){ return frac(a.n * b.n, a.d * b.d); }
function fDiv(a, b){ return frac(a.n * b.d, a.d * b.n); } /* 调用前需保证 b 不是 0 */
function isZero(a){ return a.n === 0; }
function is24(a){ return a.n === 24 * a.d && a.d > 0; }
function fToStr(a){ return a.d === 1 ? String(a.n) : (a.n + "/" + a.d); }
function fFromInt(x){ return { n: x, d: 1 }; }

/* ---------------- 24点求解器：穷举"任选两数合并"的所有运算树 ----------------
 * 返回形如 "(13−5)×(7−4)" 的表达式字符串；无解返回 null */
function solve24(cards){
  function go(items){
    if(items.length === 1){
      return is24(items[0].v) ? items[0].s : null;
    }
    for(var i = 0; i < items.length; i++){
      for(var j = 0; j < items.length; j++){
        if(i === j){ continue; }
        var a = items[i], b = items[j];
        var rest = [];
        for(var k = 0; k < items.length; k++){
          if(k !== i && k !== j){ rest.push(items[k]); }
        }
        /* 四种运算（减法和除法区分先后，两个方向都试） */
        var cands = [
          { v: fAdd(a.v, b.v), s: "(" + a.s + "+" + b.s + ")", op: "+" },
          { v: fSub(a.v, b.v), s: "(" + a.s + "−" + b.s + ")", op: "−" },
          { v: fMul(a.v, b.v), s: "(" + a.s + "×" + b.s + ")", op: "×" }
        ];
        if(!isZero(b.v)){ cands.push({ v: fDiv(a.v, b.v), s: "(" + a.s + "÷" + b.s + ")", op: "÷" }); }
        for(var c = 0; c < cands.length; c++){
          var next = rest.concat([{ v: cands[c].v, s: cands[c].s }]);
          var r = go(next);
          if(r){ return r; }
        }
      }
    }
    return null;
  }
  var init = cards.map(function(x){
    return { v: fFromInt(x), s: faceOf(x) === "" ? String(x) : faceOf(x) };
  });
  return go(init);
}
/* 牌面字母：J=11 Q=12 K=13 */
function faceOf(x){
  if(x === 11){ return "J"; }
  if(x === 12){ return "Q"; }
  if(x === 13){ return "K"; }
  return "";
}
/* 去掉最外层一对括号（仅用于展示） */
function stripOuter(expr){
  if(expr.length >= 2 && expr.charAt(0) === "(" && expr.charAt(expr.length - 1) === ")"){
    var depth = 0, ok = true;
    for(var i = 0; i < expr.length; i++){
      if(expr.charAt(i) === "("){ depth++; }
      else if(expr.charAt(i) === ")"){ depth--; }
      if(depth === 0 && i < expr.length - 1){ ok = false; break; }
    }
    if(ok){ return expr.slice(1, -1); }
  }
  return expr;
}

/* 发射一批彩纸（从顶部飘落） */
function confetti(count){
  for(var i = 0; i < count; i++){
    FX.parts.push({
      kind: "paper",
      x: Math.random() * fxCanvas.width,
      y: -20 - Math.random() * 160,
      vx: (Math.random() - 0.5) * 2.2,
      vy: 2 + Math.random() * 3,
      w: 8 + Math.random() * 8,
      h: 6 + Math.random() * 6,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.24,
      color: FX.colors[randInt(0, FX.colors.length - 1)],
      life: 240
    });
  }
  fxRun();
}
/* 在某处绽放一团烟花（向外散开的圆点） */
function firework(x, y){
  var hue = FX.colors[randInt(0, FX.colors.length - 1)];
  for(var i = 0; i < 42; i++){
    var ang = (Math.PI * 2 * i) / 42;
    var sp = 2 + Math.random() * 3.6;
    FX.parts.push({
      kind: "spark",
      x: x, y: y,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp,
      r: 2.5 + Math.random() * 2.5,
      color: hue,
      life: 80 + randInt(0, 30)
    });
  }
  fxRun();
}
function fxRun(){
  if(FX.running){ return; }
  FX.running = true;
  requestAnimationFrame(fxTick);
}
function fxTick(){
  fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
  for(var i = FX.parts.length - 1; i >= 0; i--){
    var p = FX.parts[i];
    p.x += p.vx;
    p.y += p.vy;
    if(p.kind === "paper"){
      p.vy += 0.02;
      p.rot += p.vr;
      p.life -= 1;
      fxCtx.save();
      fxCtx.translate(p.x, p.y);
      fxCtx.rotate(p.rot);
      fxCtx.fillStyle = p.color;
      fxCtx.globalAlpha = Math.max(0, Math.min(1, p.life / 80));
      fxCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      fxCtx.restore();
    } else {
      p.vy += 0.045;
      p.vx *= 0.985;
      p.vy *= 0.985;
      p.life -= 1;
      fxCtx.fillStyle = p.color;
      fxCtx.globalAlpha = Math.max(0, Math.min(1, p.life / 60));
      fxCtx.beginPath();
      fxCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      fxCtx.fill();
    }
    if(p.life <= 0 || p.y > fxCanvas.height + 30){
      FX.parts.splice(i, 1);
    }
  }
  fxCtx.globalAlpha = 1;
  if(FX.parts.length > 0){
    requestAnimationFrame(fxTick);
  } else {
    FX.running = false;
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
  }
}

}

/* ---------------- 关卡生成（随机抽样 + 求解器复核） ---------------- */
function pick24(tier){
  var pool = POOL_24[tier].filter(function(p){
    var solvable = solve24(p.cards) !== null;
    return tier === "trick" ? !solvable : solvable; /* trick 池只要“算不出”的牌组 */
  });
  if(pool.length === 0){
    /* 兜底：四张1一定算不出24（和为4，小于9） */
    pool = [{ cards: [1, 1, 1, 1], src: "变式" }];
  }
  var p = pool[randInt(0, pool.length - 1)];
  var sol = solve24(p.cards);
  return {
    kind: "g24", tier: tier,
    title: tier === "trick" ? "火眼金睛判牌局" : "巧算24点魔法屋",
    story: "算“24点”：拿出四张扑克牌（不含大小王），对牌上的点数做加、减、乘、除（可以用括号），谁先算出24谁就获胜；谁先说出这四张牌不能算出24，也算获胜。（J=11，Q=12，K=13）",
    srcNote: p.src,
    cards: shuffle(p.cards),
    solvable: sol !== null,
    solution: sol
  };
}
function pickNim(cfg){
  var titleMap = { candy: "智取糖果", match: "火柴智慧拿", stick: "小棒巧拿", card: "扑克巧取" };
  return {
    kind: "nim",
    title: titleMap[cfg.theme] || "智取糖果",
    story: cfg.story,
    srcNote: cfg.src,
    total: cfg.total, maxTake: cfg.maxTake, pre: cfg.pre,
    theme: cfg.theme, unit: cfg.unit, item: cfg.item,
    hero: cfg.hero, opp: cfg.opp, numbered: cfg.numbered
  };
}
function pickCount(){
  return {
    kind: "count",
    title: "数数冲向70",
    story: "甲、乙两人轮流数数，从1开始，每人每次数1~5个连续数，谁先数到70谁就获胜。问：甲怎样数才能确保获胜？",
    srcNote: "练习4",
    total: 70, maxTake: 5, hero: "甲", opp: "乙"
  };
}
function buildLevels(diff){
  var lv = [];
  if(diff === "初级"){
    lv.push(pick24("easy"));
    var two = sample(POOL_NIM_12, 2);
    lv.push(pickNim(two[0]), pickNim(two[1]));
  } else if(diff === "中级"){
    lv.push(pick24("medium"));
    lv.push(pickNim(POOL_NIM_13[0]));
    lv.push(pickNim(POOL_NIM_VAR[randInt(0, POOL_NIM_VAR.length - 1)]));
  } else {
    lv.push(pick24("hard"));
    lv.push(pick24("trick"));
    lv.push(pickNim(POOL_NIM_PRE[randInt(0, POOL_NIM_PRE.length - 1)]));
    lv.push(pickCount());
  }
  lv.forEach(function(l, i){
    l.idx = i;
    l.done = false;
    l.stars = 0;
  });
  return lv;
}

  else { renderCount(l); }
  /* 每种玩法第一次进入时自动弹出规则说明 */
  if(!S.shownKinds[l.kind]){
    S.shownKinds[l.kind] = true;
    showModal("玩法说明", RULES_TEXT[l.kind], [{ label: "开始挑战", primary: true, big: true, cb: hideModal }]);
  }
}

/* ---------------- 必胜法解析文案 ---------------- */
function nimStrategyText(d){
  var K = d.maxTake, T = d.total;
  if(d.pre && d.pre > 0){
    var R = T - d.pre;
    var r2 = R % (K + 1);
    return d.opp + "先拿了" + d.pre + d.unit + "，剩下" + R + d.unit + "。\n" +
      R + " ÷ " + (K + 1) + " = " + Math.floor(R / (K + 1)) + "……" + r2 + "，余数是" + r2 + "。\n" +
      "所以" + d.hero + "接下来应该拿走" + r2 + d.unit + "，让剩下的数量变成" + (K + 1) + "的倍数；\n" +
      "之后不管" + d.opp + "拿几" + d.unit + "，" + d.hero + "就拿" + (K + 1) + "减去他拿的数，两人每次合起来恰好是" + (K + 1) + "，\n" +
      "这样最后1" + d.unit + "一定落在" + d.hero + "手里，稳稳获胜！";
  }
  var m = T % (K + 1);
  if(m === 0){
    var multi = "";
    if(T <= 30){
      var list = [];
      for(var x = K + 1; x <= T; x += (K + 1)){ list.push(x); }
      multi = "（编号是" + list.join("、") + "的都会归你哦）";
    }
    return T + " ÷ " + (K + 1) + " = " + (T / (K + 1)) + "，没有余数。\n" +
      "让" + d.opp + "先拿！之后" + d.opp + "每次拿几" + d.unit + "，你就拿" + (K + 1) + "减去他拿的数，\n" +
      "两人每一轮合起来恰好是" + (K + 1) + multi + "，最后1" + d.unit + "就是你的！";
  }
  return T + " ÷ " + (K + 1) + " = " + Math.floor(T / (K + 1)) + "……" + m + "，余数是" + m + "。\n" +
    "所以要<b>先拿</b>，而且第一次就拿" + m + d.unit + "，把余数拿掉；\n" +
    "之后" + d.opp + "拿几" + d.unit + "，你就拿" + (K + 1) + "减去他拿的数，每一轮合起来恰好是" + (K + 1) + "，\n" +
    "最后1" + d.unit + "一定归你！";
}
function countStrategyText(d){
  return "70 ÷ 6 = 11……4，余数是4。\n" +
    "甲应该<b>先数</b>，第一次就数4个数（1、2、3、4）；\n" +
    "之后不管乙数几个，甲每次数的个数和乙数个数加起来恰好是6，\n" +
    "甲就会依次数到 10、16、22、28、34、40、46、52、58、64、70，最先数到70获胜！";
}
function g24RevealText(l){
  if(l.solvable){
    return "一种算法：<span class='em'>" + stripOuter(l.solution) + " = 24</span>\n\n" +
      "方法点拨：先把24拆成熟悉的乘法（3×8、4×6、2×12、1×24），再想办法让四张牌凑出这两个数；\n" +
      "别忘了用括号改变运算顺序，减法和除法还要注意先后的方向哦。";
  }
  var sum = l.cards.reduce(function(a, b){ return a + b; }, 0);
  var tip = sum < 9 ? "\n小秘诀：四张牌的点数和小于9时，一定算不出24（这四张的和是" + sum + "）。" : "";
  return "把加、减、乘、除所有能用的组合都试一遍，都得不到24——这四张牌真的算不出24！" + tip;
}

/* ---------------- 玩法一：巧算24点 ---------------- */
function renderG24(l){
  var root = qs("#play-root");
  root.innerHTML = "";
  var G = {
    tiles: [],      /* 当前牌面：{id, v, expr, face} */
    sel: [],        /* 已选中牌的 id（按点选先后） */
    history: [],    /* 撤回用快照 */
    log: [],        /* 计算过程 */
    uid: 0
  };
  function snapshot(){
    G.history.push({
      tiles: JSON.parse(JSON.stringify(G.tiles)),
      log: G.log.slice()
    });
    if(G.history.length > 40){ G.history.shift(); }
  }
  function resetG24(){
    G.tiles = l.cards.map(function(c){
      return { id: ++G.uid, v: fFromInt(c), expr: faceOf(c) === "" ? String(c) : faceOf(c), face: faceOf(c) };
    });
    G.sel = [];
    G.history = [];
    G.log = [];
    draw();
  }
  function findTile(id){
    return G.tiles.filter(function(t){ return t.id === id; })[0];
  }
  function tileLabel(t){
    return fToStr(t.v);
  }
  function draw(){
    root.innerHTML = "";
    root.appendChild(storyPanel(l, "本关牌组来自：" + (l.srcNote || "变式") + "。点两张牌再点运算符号，把它们合并成新牌吧！"));

    var playPanel = el("div", "panel");
    playPanel.appendChild(el("h3", "", "牌桌（合并三次，凑出24）"));

    /* 牌区 */
    var trow = el("div", "tile-row");
    G.tiles.forEach(function(t){
      var div = el("div", "tile");
      if(t.face){ div.appendChild(el("div", "face", t.face)); }
      div.appendChild(el("div", "val", tileLabel(t)));
      var subTxt = (t.face === "" && t.expr !== tileLabel(t)) ? t.expr : "";
      if(subTxt){ div.appendChild(el("div", "sub", subTxt)); }
      var si = G.sel.indexOf(t.id);
      if(si >= 0){
        div.classList.add("sel");
        div.appendChild(el("div", "order", si === 0 ? "先选" : "后选"));
      }
      div.addEventListener("click", function(){ toggleSel(t.id); });
      trow.appendChild(div);
    });
    playPanel.appendChild(trow);

    /* 预览行 + 运算条 */
    var prev = el("div", "preview-line");
    if(G.sel.length === 2){
      var a = findTile(G.sel[0]), b = findTile(G.sel[1]);
      prev.innerHTML = "将要计算：<b>" + tileLabel(a) + " ？ " + tileLabel(b) + "</b>（先选的在左边）";
    } else if(G.sel.length === 1){
      prev.textContent = "再点一张牌，就可以选择运算符号啦";
    } else {
      prev.textContent = "先点选两张牌（先点的在左边）";
    }
    playPanel.appendChild(prev);

    var opbar = el("div", "opbar");
    ["+", "−", "×", "÷"].forEach(function(op){
      var b = el("button", "op", op);
      b.disabled = G.sel.length !== 2;
      b.addEventListener("click", function(){ merge(op); });
      opbar.appendChild(b);
    });
    playPanel.appendChild(opbar);

    /* 状态行 */
    var merged = 3 - (G.tiles.length - 1);
    playPanel.appendChild(el("div", "status-line",
      "已合并 " + merged + " / 3 步 · 当前剩 " + G.tiles.length + " 张牌"));

    /* 计算过程 */
    var logBox = el("div", "calclog");
    if(G.log.length === 0){
      logBox.appendChild(el("span", "", "计算过程会记录在这里"));
    } else {
      G.log.forEach(function(s){ logBox.appendChild(el("span", "", s)); });
    }
    playPanel.appendChild(logBox);

    /* 撤回 + 判定按钮 */
    var row2 = el("div", "ctrl-row");
    var bUndo = el("button", "btn", "撤回一步");
    bUndo.disabled = G.history.length === 0;
    bUndo.addEventListener("click", undo);
    row2.appendChild(bUndo);
    var bJudge = el("button", "btn", "我判定：这四张牌算不出24");
    bJudge.addEventListener("click", judgeNo24);
    row2.appendChild(bJudge);
    playPanel.appendChild(row2);

    root.appendChild(playPanel);

    /* 控制区：揭示答案 / 重新开始 / 返回地图 */
    root.appendChild(ctrlPanel(l, function(){
      S.hintUsed = true;
      showModal("答案与解析", g24RevealText(l), [{ label: "继续挑战", primary: true, cb: hideModal }]);
    }, function(){ resetG24(); toast("已重新开始，换个拼法试试！"); }));
  }
  function toggleSel(id){
    var i = G.sel.indexOf(id);
    if(i >= 0){
      G.sel.splice(i, 1);
    } else {
      if(G.sel.length >= 2){ G.sel.shift(); }
      G.sel.push(id);
    }
    draw();
  }
  function merge(op){
    if(G.sel.length !== 2){ return; }
    var a = findTile(G.sel[0]), b = findTile(G.sel[1]);
    if(op === "÷" && isZero(b.v)){
      toast("0 不能作除数，换一个方向或换种拼法吧！");
      return;
    }
    snapshot();
    var v;
    if(op === "+"){ v = fAdd(a.v, b.v); }
    else if(op === "−"){ v = fSub(a.v, b.v); }
    else if(op === "×"){ v = fMul(a.v, b.v); }
    else { v = fDiv(a.v, b.v); }
    var expr = "(" + a.expr + op + b.expr + ")";
    G.tiles = G.tiles.filter(function(t){ return t.id !== a.id && t.id !== b.id; });
    G.tiles.push({ id: ++G.uid, v: v, expr: expr, face: "" });
    G.log.unshift(stripOuter(expr) + " = " + fToStr(v));
    G.sel = [];
    addSteps(1);
    draw();
    /* 给新牌加个出场动画 */
    var tiles = root.querySelectorAll(".tile");
    if(tiles.length){ tiles[tiles.length - 1].classList.add("newpop"); }
    if(G.tiles.length === 1){
      if(is24(G.tiles[0].v)){
        winG24();
      } else {
        var last = root.querySelector(".tile");
        if(last){ last.classList.add("shake"); }
        toast("结果是 " + fToStr(G.tiles[0].v) + "，不是24。点“撤回一步”换种拼法！");
      }
    }
  }
  function undo(){
    var snap = G.history.pop();
    if(!snap){ return; }
    G.tiles = snap.tiles;
    G.log = snap.log;
    G.sel = [];
    addSteps(1);
    draw();
  }
  function judgeNo24(){
    addSteps(1);
    if(!l.solvable){
      var sum = l.cards.reduce(function(a, b){ return a + b; }, 0);
      var tip = sum < 9 ? "这四张牌的和是" + sum + "，小于9，一定算不出24。" : "把加减乘除所有组合都试遍，都得不到24。";
      var stars = S.hintUsed ? 2 : 3;
      showModal("判定正确，通关！",
        "火眼金睛！这四张牌<b>真的算不出24</b>。\n" + tip + "\n别忘了教参里的小秘诀：四张牌的点数和小于9，一定算不出24。",
        [{ label: "太棒了", primary: true, big: true, cb: function(){ hideModal(); finishLevel(stars); } }]);
      celebrate(false);
    } else {
      toast("咦，其实能算出24哦！点“揭示答案”看看提示，再拼一次吧！");
      showModal("再想想",
        "这四张牌<b>可以</b>算出24哦！\n提示：" + stripOuter(l.solution) + "\n试着把它拼出来吧！",
        [{ label: "继续拼", primary: true, cb: hideModal }]);
      G.log.unshift("判定“算不出24”——不对哦，再试试");
      draw();
    }
  }
  function winG24(){
    var expr = stripOuter(G.tiles[0].expr);
    var stars = S.hintUsed ? 2 : 3;
    celebrate(false);
    showModal("通关啦！",
      "你拼出了：<span class='em'>" + expr + " = 24</span>\n\n方法点拨：24 = 3×8 = 4×6 = 2×12，先想目标再凑数，四张牌各用一次，括号帮大忙！",
      [{ label: "下一关", primary: true, big: true, cb: function(){ hideModal(); finishLevel(stars); } },
       { label: "再玩本关", cb: function(){ hideModal(); resetG24(); } }],
      stars);
  }
  resetG24();
}

/* ---------------- 玩法二：轮流取物（糖果/火柴/小棒/扑克牌） ---------------- */
function renderNim(l){
  var root = qs("#play-root");
  root.innerHTML = "";
  var N = {
    remaining: l.total,
    taken: [],        /* 每个编号的归属：null / "hero" / "opp" */
    phase: l.pre > 0 ? "play" : "order",
    turn: l.pre > 0 ? "opp" : "hero",
    busy: false,
    picked: {}        /* 已点选的编号 */
  };
  for(var i = 1; i <= l.total; i++){ N.taken[i] = null; }
  var sweeping = false;

  function pickedList(){
    var out = [];
    for(var i = 1; i <= l.total; i++){ if(N.picked[i]){ out.push(i); } }
    return out;
  }
  function heroTakenCount(){
    var c = 0;
    for(var i = 1; i <= l.total; i++){ if(N.taken[i] === "hero"){ c++; } }
    return c;
  }
  function oppTakenCount(){
    var c = 0;
    for(var i = 1; i <= l.total; i++){ if(N.taken[i] === "opp"){ c++; } }
    return c;
  }
  /* 电脑伙伴的取法：能占到“余数”就立刻占，否则随机等待机会 */
  function robotPick(){
    var m = N.remaining % (l.maxTake + 1);
    if(m !== 0){ return Math.min(m, N.remaining); }
    var cap = Math.min(l.maxTake, N.remaining);
    return randInt(1, cap);
  }
  function draw(bannerText){
    root.innerHTML = "";
    var extra = "每次只能拿 1~" + l.maxTake + " " + l.unit + "，谁拿到最后 1 " + l.unit + " 谁获胜。";
    root.appendChild(storyPanel(l, extra));

    var panel = el("div", "panel");
    panel.appendChild(el("h3", "", "物品桌（还剩 " + N.remaining + " " + l.unit + "）"));

    /* 轮到谁的提示 */
    var banner = el("div", "turn-banner", bannerText ? bannerText :
      (N.phase === "order" ? "先决定谁先拿！" :
       (N.turn === "hero" ? "轮到你啦，选中 " + (pickedList().length || "几") + " " + l.unit + " 后确认" : l.opp + " 正在思考……")));
    panel.appendChild(banner);

    if(N.phase === "order"){
      var orow = el("div", "order-row");
      var b1 = el("button", "btn btn-primary btn-big", "我先拿");
      b1.addEventListener("click", function(){
        N.phase = "play"; N.turn = "hero"; addSteps(1); draw();
      });
      var b2 = el("button", "btn btn-big", "让" + l.opp + "先拿");
      b2.addEventListener("click", function(){
        N.phase = "play"; N.turn = "opp"; addSteps(1); draw(); robotTurn();
      });
      orow.appendChild(b1); orow.appendChild(b2);
      panel.appendChild(orow);
      panel.appendChild(el("div", "status-line", "提示：先算一算 " + l.total + " ÷ " + (l.maxTake + 1) + "，再决定先后哦。"));
    }

    if(N.phase !== "order"){
      /* 物品堆（可点选 / 划选） */
      var pile = el("div", "pile");
      for(var i = 1; i <= l.total; i++){
        var it = el("button", "item it-" + l.theme + (N.taken[i] ? " taken taken-" + N.taken[i] : ""));
        if(N.picked[i] && !N.taken[i]){ it.classList.add("picked"); }
        it.setAttribute("data-n", String(i));
        var body = el("span", "body", "");
        it.appendChild(body);
        it.appendChild(el("span", "num", l.numbered ? String(i) : ""));
        pile.appendChild(it);
      }
      panel.appendChild(pile);

      /* 记分篮 */
      var baskets = el("div", "basket-row");
      baskets.appendChild(el("div", "basket", l.hero + "（你）已拿 " + heroTakenCount() + " " + l.unit));
      baskets.appendChild(el("div", "basket opp", l.opp + " 已拿 " + oppTakenCount() + " " + l.unit));
      panel.appendChild(baskets);

      /* 确认按钮 */
      var crow = el("div", "ctrl-row");
      var n = pickedList().length;
      var bTake = el("button", "btn btn-primary btn-big", "拿走选中的 " + n + " " + l.unit);
      bTake.disabled = !(N.phase === "play" && N.turn === "hero" && !N.busy && n >= 1);
      bTake.addEventListener("click", heroTake);
      crow.appendChild(bTake);
      var bClear = el("button", "btn", "清除选择");
      bClear.addEventListener("click", function(){
        N.picked = {}; draw();
      });
      crow.appendChild(bClear);
      panel.appendChild(crow);

      bindPileEvents(pile);
    }
    root.appendChild(panel);

    root.appendChild(ctrlPanel(l, function(){
      S.hintUsed = true;
      showModal("答案与解析", nimStrategyText(l), [{ label: "继续挑战", primary: true, cb: hideModal }]);
    }, function(){
      toast("本关重新开始！");
      renderNim(l);
    }));
  }
  /* 点选 + 按住划选（指针事件，兼容触摸）；重绘前先移除旧的窗口监听，避免累积 */
  var sweepMove = null;
  var sweepUp = null;
  function bindPileEvents(pile){
    function itemFromEvent(e){
      var elm = document.elementFromPoint(e.clientX, e.clientY);
      if(!elm){ return null; }
      var node = elm.closest ? elm.closest(".item") : null;
      if(!node || !pile.contains(node)){ return null; }
      return node;
    }
    function tryPick(node){
      var n = parseInt(node.getAttribute("data-n"), 10);
      if(N.taken[n] || N.phase !== "play" || N.turn !== "hero" || N.busy){ return; }
      if(N.picked[n]){
        delete N.picked[n];
        node.classList.remove("picked");
        updateTakeBtn();
        return;
      }
      if(pickedList().length >= l.maxTake){
        toast("每次最多拿 " + l.maxTake + " " + l.unit + " 哦！");
        return;
      }
      N.picked[n] = true;
      node.classList.add("picked");
      updateTakeBtn();
    }
    if(sweepMove){ window.removeEventListener("pointermove", sweepMove); }
    if(sweepUp){ window.removeEventListener("pointerup", sweepUp); }
    sweepMove = function(e){
      if(!sweeping){ return; }
      var node = itemFromEvent(e);
      if(node){ tryPick(node); }
    };
    sweepUp = function(){ sweeping = false; };
    window.addEventListener("pointermove", sweepMove);
    window.addEventListener("pointerup", sweepUp);
    pile.addEventListener("pointerdown", function(e){
      if(N.phase !== "play" || N.turn !== "hero" || N.busy){ return; }
      sweeping = true;
      var node = itemFromEvent(e);
      if(node){ tryPick(node); }
      e.preventDefault();
    });
    function updateTakeBtn(){
      var btns = root.querySelectorAll(".ctrl-row .btn-primary");
      /* 确认按钮是物品面板里的主按钮（第一个） */
      if(btns.length){
        var n = pickedList().length;
        var b = btns[0];
        b.textContent = "拿走选中的 " + n + " " + l.unit;
        b.disabled = !(N.phase === "play" && N.turn === "hero" && !N.busy && n >= 1);
      }
      var banner = root.querySelector(".turn-banner");
      if(banner && N.phase === "play" && N.turn === "hero"){
        banner.textContent = "轮到你啦，已选中 " + pickedList().length + " " + l.unit;
      }
    }
  }
  /* 把若干编号的物品判给某人（带小动画） */
  function grant(nums, who, doneCb){
    N.busy = true;
    var k = 0;
    var int = setInterval(function(){
      if(k >= nums.length){
        clearInterval(int);
        N.remaining -= nums.length;
        N.busy = false;
        if(doneCb){ doneCb(); }
        return;
      }
      var n = nums[k];
      N.taken[n] = who;
      var node = root.querySelector('.item[data-n="' + n + '"]');
      if(node){
        node.classList.remove("picked");
        node.classList.add("taken", "taken-" + who);
      }
      k++;
    }, 240);
  }
  /* 玩家回合：拿走选中的 */
  function heroTake(){
    var nums = pickedList();
    if(nums.length < 1 || nums.length > l.maxTake){ return; }
    N.picked = {};
    addSteps(1);
    grant(nums, "hero", function(){
      if(N.remaining === 0){
        winNim();
      } else {
        N.turn = "opp";
        draw(); robotTurn();
      }
    });
  }
  /* 电脑伙伴回合 */
  function robotTurn(){
    N.busy = true;
    draw();
    setTimeout(function(){
      var k = robotPick();
      /* 从剩下的编号里随机挑 k 个 */
      var avail = [];
      for(var i = 1; i <= l.total; i++){ if(!N.taken[i]){ avail.push(i); } }
      var nums = sample(avail, k);
      grant(nums, "opp", function(){
        if(N.remaining === 0){
          loseNim();
        } else {
          N.turn = "hero";
          draw("轮到你啦，点选或划选要拿的" + l.item + "！");
        }
      });
    }, 800);
  }
  function winNim(){
    var stars = (S.hintUsed ? 1 : 0) + (S.fails > 0 ? 1 : 0) >= 1 ? 2 : 3;
    celebrate(false);
    showModal("获胜啦！最后 1 " + l.unit + " 归你了！",
      nimStrategyText(l),
      [{ label: "下一关", primary: true, big: true, cb: function(){ hideModal(); finishLevel(stars); } },
       { label: "再玩本关", cb: function(){ hideModal(); renderNim(l); } }],
      stars);
  }
  function loseNim(){
    S.fails++;
    showModal("就差一点点！",
      "这回" + l.opp + "拿到了最后 1 " + l.unit + "。\n\n看看必胜解析，按方法再来一次一定行：\n" + nimStrategyText(l),
      [{ label: "再试一次", primary: true, big: true, cb: function(){ hideModal(); renderNim(l); } },
       { label: "返回地图", cb: function(){ hideModal(); renderMap(); showScreen("#screen-map"); } }]);
  }
  /* 开局：如果故事里对方已经先拿，先替他拿掉，然后轮到玩家 */
  draw();
  if(l.pre > 0){
    setTimeout(function(){
      var nums = [];
      for(var i = 0; i < l.pre; i++){ nums.push(l.total - i); }
      grant(nums, "opp", function(){
        N.turn = "hero";
        draw(l.opp + "先拿了 " + l.pre + " " + l.unit + "，现在轮到你啦！");
      });
    }, 500);
  }
}

/* ---------------- 玩法三：数数到70 ---------------- */
function renderCount(l){
  var root = qs("#play-root");
  root.innerHTML = "";
  var C = {
    cur: 0,            /* 已经数到几 */
    cells: {},         /* 每个数的归属 */
    phase: "order",
    turn: "hero",
    busy: false,
    previewEnd: 0
  };
  for(var i = 1; i <= 70; i++){ C.cells[i] = ""; }

  function draw(bannerText){
    root.innerHTML = "";
    root.appendChild(storyPanel(l, "每人每次数 1~5 个连续的数（必须紧接当前数过的），谁先数到 70 谁获胜。"));

    var panel = el("div", "panel");
    panel.appendChild(el("h3", "", "数字广场"));
    panel.appendChild(el("div", "count-now", "已经数到：" + (C.cur === 0 ? "还没开始" : C.cur)));
    var banner = el("div", "turn-banner", bannerText ? bannerText :
      (C.phase === "order" ? "先决定谁先数！" :
       (C.turn === "hero" ? "点亮你想数到的数字吧（往后 1~5 个）" : l.opp + " 正在数……")));
    panel.appendChild(banner);

    if(C.phase === "order"){
      var orow = el("div", "order-row");
      var b1 = el("button", "btn btn-primary btn-big", "我先数");
      b1.addEventListener("click", function(){
        C.phase = "play"; C.turn = "hero"; addSteps(1); draw();
      });
      var b2 = el("button", "btn btn-big", "让" + l.opp + "先数");
      b2.addEventListener("click", function(){
        C.phase = "play"; C.turn = "opp"; addSteps(1); draw(); robotTurn();
      });
      orow.appendChild(b1); orow.appendChild(b2);
      panel.appendChild(orow);
      panel.appendChild(el("div", "status-line", "提示：先算一算 70 ÷ 6，再决定先后哦。"));
    }

    if(C.phase !== "order"){
      var grid = el("div", "numgrid");
      var cap = Math.min(C.cur + l.maxTake, 70);
      for(var n = 1; n <= 70; n++){
        var cls = "cell";
        if(C.cells[n] === "hero"){ cls += " hero"; }
        else if(C.cells[n] === "opp"){ cls += " opp"; }
        else if(n > C.cur && n <= cap){ cls += " can"; }
        if(C.previewEnd && n > C.cur && n <= C.previewEnd){ cls += " prev"; }
        var cell = el("button", cls, String(n));
        (function(nn){
          cell.addEventListener("click", function(){ pickCell(nn); });
        })(n);
        grid.appendChild(cell);
      }
      panel.appendChild(grid);

      var crow = el("div", "ctrl-row");
      var bGo = el("button", "btn btn-primary btn-big", C.previewEnd ? "确认数到 " + C.previewEnd : "先点亮一个数字");
      bGo.disabled = !C.previewEnd || C.busy || C.turn !== "hero";
      bGo.addEventListener("click", heroCount);
      crow.appendChild(bGo);
      panel.appendChild(crow);
    }
    root.appendChild(panel);

    root.appendChild(ctrlPanel(l, function(){
      S.hintUsed = true;
      showModal("答案与解析", countStrategyText(l), [{ label: "继续挑战", primary: true, cb: hideModal }]);
    }, function(){
      toast("本关重新开始！");
      renderCount(l);
    }));
  }
  function pickCell(n){
    if(C.phase !== "play" || C.turn !== "hero" || C.busy){ return; }
    var cap = Math.min(C.cur + l.maxTake, 70);
    if(n <= C.cur || n > cap){ return; }
    C.previewEnd = (C.previewEnd === n) ? 0 : n;
    draw();
  }
  /* 把 cur+1..end 依次点亮给 who */
  function colorRange(end, who, doneCb){
    C.busy = true;
    var n = C.cur + 1;
    var int = setInterval(function(){
      if(n > end){
        clearInterval(int);
        C.cur = end;
        C.busy = false;
        C.previewEnd = 0;
        if(doneCb){ doneCb(); }
        return;
      }
      C.cells[n] = who;
      var cell = root.querySelector('.numgrid .cell:nth-child(' + n + ')');
      if(cell){
        cell.classList.remove("can", "prev");
        cell.classList.add(who);
      }
      n++;
    }, 110);
  }
  function heroCount(){
    if(!C.previewEnd){ return; }
    var end = C.previewEnd;
    addSteps(1);
    colorRange(end, "hero", function(){
      if(C.cur === 70){
        winCount();
      } else {
        C.turn = "opp";
        draw(); robotTurn();
      }
    });
  }
  function robotTurn(){
    C.busy = true;
    draw();
    setTimeout(function(){
      var rem = 70 - C.cur;
      var m = rem % (l.maxTake + 1);
      var k = m !== 0 ? m : randInt(1, Math.min(l.maxTake, rem));
      var end = C.cur + k;
      colorRange(end, "opp", function(){
        if(C.cur === 70){
          loseCount();
        } else {
          C.turn = "hero";
          draw("轮到你啦，点亮你想数到的数字！");
        }
      });
    }, 700);
  }
  function winCount(){
    var stars = (S.hintUsed ? 1 : 0) + (S.fails > 0 ? 1 : 0) >= 1 ? 2 : 3;
    celebrate(false);
    showModal("最先数到70，获胜啦！",
      countStrategyText(l),
      [{ label: "下一关", primary: true, big: true, cb: function(){ hideModal(); finishLevel(stars); } },
       { label: "再玩本关", cb: function(){ hideModal(); renderCount(l); } }],
      stars);
  }
  function loseCount(){
    S.fails++;
    showModal("就差一点点！",
      "这回" + l.opp + "先数到了70。\n\n看看必胜解析，按方法再来一次一定行：\n" + countStrategyText(l),
      [{ label: "再试一次", primary: true, big: true, cb: function(){ hideModal(); renderCount(l); } },
       { label: "返回地图", cb: function(){ hideModal(); renderMap(); showScreen("#screen-map"); } }]);
  }
  draw();
}

/* ---------------- 关卡通关与全局结束 ---------------- */
function finishLevel(stars){
  var l = S.levels[S.cur];
  l.done = true;
  l.stars = Math.max(l.stars, Math.max(1, Math.min(3, stars)));
  var allDone = S.levels.every(function(x){ return x.done; });
  renderMap();
  if(allDone){
    /* 全部通关：大庆典 */
    var s = Math.floor((Date.now() - S.t0) / 1000);
    var mm = Math.floor(s / 60), ss = s % 60;
    qs("#allover-stats").innerHTML =
      S.diff + " 的 " + S.levels.length + " 个关卡全部点亮！<br>" +
      "用时 " + mm + " 分 " + ss + " 秒 · 共 " + S.steps + " 步操作<br>" +
      "你已经掌握“巧算24点”和“凑倍数必胜法”啦，试试更高的难度或再来一局吧！";
    qs("#allover").classList.remove("hidden");
    celebrate(true);
  } else {
    showScreen("#screen-map");
  }
}

/* ---------------- 顶部按钮 ---------------- */
qs("#btn-rules").addEventListener("click", function(){
  var l = S.levels[S.cur];
  var txt = "";
  if(S.cur >= 0 && l){
    txt = RULES_TEXT[l.kind];
  } else {
    txt = "本嘉年华有三种玩法：\n\n" + RULES_TEXT.g24 + "\n\n———\n\n" + RULES_TEXT.nim + "\n\n———\n\n" + RULES_TEXT.count;
  }
  showModal("玩法说明", txt, [{ label: "知道啦", primary: true, big: true, cb: hideModal }]);
});
qs("#btn-back-menu").addEventListener("click", function(){
  hideModal();
  qs("#allover").classList.add("hidden");
  showScreen("#screen-menu");
});
qs("#btn-again").addEventListener("click", function(){
  qs("#allover").classList.add("hidden");
  applyRandomPalette();
  S.levels = buildLevels(S.diff);
  S.cur = -1;
  S.steps = 0;
  qs("#hud-steps").textContent = "0";
  startTimer();
  renderMap();
  showScreen("#screen-map");
  toast("新的一局：题目和配色都换啦！");
});
qs("#btn-allover-menu").addEventListener("click", function(){
  qs("#allover").classList.add("hidden");
  showScreen("#screen-menu");
});

/* ---------------- 启动：随机色板 ---------------- */
applyRandomPalette();
</script>
