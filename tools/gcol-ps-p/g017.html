<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>奇趣智慧岛·闯关大冒险（能力测试卷四）</title>
<style>
/* ============ 全局变量（由JS随机配色写入） ============ */
:root{
  --main:#3b82f6; --dark:#1d4ed8; --light:#dbeafe;
  --accent:#f59e0b; --bg:#f0f7ff; --ink:#1e3a5f;
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",system-ui,sans-serif;
  background:linear-gradient(180deg,var(--bg) 0%,#ffffff 140%);
  color:var(--ink); font-size:18px; -webkit-tap-highlight-color:transparent;
}
#app{ max-width:1040px; margin:0 auto; padding-bottom:30px; }

/* ============ 顶栏 ============ */
#topbar{
  position:sticky; top:0; z-index:60; display:flex; flex-wrap:wrap; align-items:center;
  gap:8px 12px; padding:10px 14px; background:rgba(255,255,255,.95);
  border-bottom:4px solid var(--main); box-shadow:0 3px 10px rgba(30,60,110,.12);
}
.brand{ font-weight:900; font-size:clamp(20px,3vw,26px); color:var(--dark); }
.brand small{ font-size:15px; color:var(--accent); margin-left:6px; }
.hud{ margin-left:auto; display:flex; flex-wrap:wrap; gap:8px; }
.hud-item{
  background:var(--light); border:2px solid var(--main); border-radius:999px;
  padding:4px 14px; font-size:18px; font-weight:800; color:var(--dark); white-space:nowrap;
}
.topbtns{ display:flex; flex-wrap:wrap; gap:8px; }
.btn{
  border:2px solid var(--main); background:#fff; color:var(--dark); font-weight:800;
  font-size:17px; padding:9px 16px; border-radius:12px; cursor:pointer;
  transition:transform .15s, box-shadow .15s; font-family:inherit;
}
.btn:hover{ transform:translateY(-2px); box-shadow:0 4px 10px rgba(30,60,110,.18); }
.btn-main{ background:var(--main); color:#fff; }
.btn-acc{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn[disabled]{ opacity:.45; cursor:not-allowed; transform:none; }

/* ============ 屏幕切换 ============ */
.screen{ display:none; padding:16px 10px 40px; animation:fadein .35s; }
.screen.active{ display:block; }
@keyframes fadein{ from{opacity:0; transform:translateY(8px);} to{opacity:1;} }

/* ============ 首页 ============ */
.hero{ text-align:center; margin:26px 0 10px; }
.hero h1{
  font-size:clamp(30px,6vw,46px); margin:8px 0; color:var(--dark);
  text-shadow:2px 2px 0 var(--light);
}
.hero .sub{ font-size:clamp(17px,2.6vw,21px); color:var(--ink); margin:6px 0 18px; }
.palette-row{ font-size:20px; letter-spacing:6px; margin-bottom:16px; }
.diff-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin:18px auto 26px; max-width:900px; }
.diff-card{
  background:#fff; border:3px solid var(--main); border-radius:20px; padding:20px 16px;
  cursor:pointer; text-align:center; transition:transform .18s, box-shadow .18s;
}
.diff-card:hover{ transform:translateY(-6px) scale(1.02); box-shadow:0 10px 22px rgba(30,60,110,.2); }
.diff-card h3{ margin:6px 0 8px; font-size:26px; color:var(--dark); }
.diff-card .lv{ font-size:38px; }
.diff-card p{ margin:6px 0; font-size:16.5px; line-height:1.6; color:#44506b; }
.home-tip{ text-align:center; font-size:17px; color:#44506b; margin-top:8px; }

/* ============ 游戏页公共 ============ */
#progress{ display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin:12px 0 6px; }
.prog-item{ display:flex; align-items:center; gap:6px; }
.prog-dot{
  width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-weight:900; font-size:18px; background:#e7edf6; color:#8b98ad; border:3px solid #c6d2e5;
}
.prog-item.cur .prog-dot{ background:var(--main); color:#fff; border-color:var(--dark); transform:scale(1.12); box-shadow:0 0 0 5px rgba(120,150,220,.25); }
.prog-item.done .prog-dot{ background:var(--accent); color:#fff; border-color:#b45309; }
.prog-item.done .prog-dot::after{ content:"✔"; }
.prog-item.done .prog-dot, .prog-item.cur .prog-dot{ position:relative; }
.prog-item span.pname{ font-size:15px; color:#44506b; }
#island-head{ text-align:center; margin:6px 0 4px; }
#island-head h2{ margin:4px 0; font-size:clamp(22px,3.6vw,30px); color:var(--dark); }
#island-sub{ font-size:17px; color:#44506b; }
#problem-card{
  background:#fff8e1; border-left:8px solid var(--accent); border-radius:14px;
  padding:14px 18px; margin:12px 0; font-size:19px; line-height:1.75;
}
#problem-card .src{
  display:inline-block; font-size:15px; background:#ffe9b3; color:#7a5200;
  border-radius:8px; padding:2px 10px; margin-bottom:6px; font-weight:700;
}
#play-area{
  background:#fff; border:3px solid #dbe4f2; border-radius:20px;
  padding:18px; min-height:340px; position:relative; overflow:hidden;
}
.island-actions{ display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:16px; }
.mini-btn{
  border:2px solid var(--dark); background:var(--light); color:var(--dark);
  font-size:17px; font-weight:800; padding:9px 18px; border-radius:12px; cursor:pointer; font-family:inherit;
}
.mini-btn:hover{ filter:brightness(.96); }
.success-banner{
  margin-top:14px; padding:14px 16px; border-radius:14px; background:#e8f9ee;
  border:3px solid #22a35a; font-size:20px; font-weight:800; color:#14683b;
  animation:pop .45s; line-height:1.6;
}
.fail-banner{
  margin-top:14px; padding:14px 16px; border-radius:14px; background:#fdeeee;
  border:3px solid #d9534f; font-size:19px; font-weight:800; color:#8c2f2c; animation:pop .4s; line-height:1.6;
}
@keyframes pop{ from{ transform:scale(.75); opacity:0; } to{ transform:scale(1); opacity:1; } }
@keyframes shakeAnim{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }
.shake{ animation:shakeAnim .38s; }
.tip-line{ font-size:17px; color:#44506b; margin:8px 0; line-height:1.65; }
.bignum{ font-size:30px; font-weight:900; color:var(--dark); }
.center{ text-align:center; }

/* ============ 通用拖拽物件 ============ */
.chip{
  display:inline-flex; align-items:center; justify-content:center; min-width:58px; height:56px;
  padding:0 14px; border-radius:14px; background:var(--light); border:3px solid var(--dark);
  font-size:20px; font-weight:900; color:var(--dark); cursor:grab; touch-action:none;
  user-select:none; -webkit-user-select:none; transition:transform .15s;
}
.chip:hover{ transform:translateY(-4px); }
.chip.dragging-src{ opacity:.25; }
.chip.locked{ cursor:default; background:#d9f2e3; border-color:#22a35a; }
.ghost{
  position:fixed; z-index:900; pointer-events:none; opacity:.92;
  transform:translate(-50%,-55%) scale(1.08); margin:0;
}
.zone{
  min-height:64px; padding:8px 12px; border:3px dashed var(--main); border-radius:14px;
  display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;
  font-size:18px; font-weight:700; color:var(--dark); background:rgba(255,255,255,.75);
  transition:background .15s, transform .15s; touch-action:none;
}
.zone-hot{ background:var(--accent); color:#fff; transform:scale(1.04); }
.chip-row{ display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin:12px 0; }

/* ============ 岛1：一笔画 ============ */
#draw-canvas{ display:block; margin:8px auto; touch-action:none; border-radius:14px; background:#fff; border:2px solid #e2e8f4; cursor:crosshair; }
.draw-status{ display:flex; flex-wrap:wrap; gap:14px; justify-content:center; align-items:center; font-size:19px; font-weight:800; margin:6px 0; }
.stuck-tip{ background:#fff4e0; border:2px dashed #d97706; border-radius:12px; padding:10px 14px; font-size:17px; color:#92600a; margin:10px auto; max-width:560px; }

/* ============ 岛2：24点 ============ */
.p24-row{ display:flex; flex-wrap:wrap; gap:16px; justify-content:center; margin:14px 0; min-height:130px; align-items:center; }
.p24card{
  width:92px; height:126px; border-radius:14px; background:#fff; border:3px solid #333;
  box-shadow:0 5px 12px rgba(0,0,0,.15); display:flex; flex-direction:column; align-items:center;
  justify-content:center; cursor:pointer; font-weight:900; transition:transform .25s, box-shadow .25s;
  user-select:none; -webkit-user-select:none; touch-action:manipulation;
}
.p24card .pv{ font-size:44px; line-height:1; }
.p24card .ps{ font-size:26px; }
.p24card.red{ color:#d64545; } .p24card.black{ color:#222; }
.p24card:hover{ transform:translateY(-6px); }
.p24card.sel{ transform:translateY(-12px) scale(1.06); box-shadow:0 0 0 5px var(--accent); }
.p24card.newly{ animation:pop .4s; }
.p24card.faded{ opacity:.35; cursor:not-allowed; }
.op-row{ display:flex; gap:14px; justify-content:center; margin:8px 0; flex-wrap:wrap; }
.op-tile{
  width:64px; height:64px; border-radius:16px; border:3px solid var(--dark); background:#fff;
  font-size:32px; font-weight:900; color:var(--dark); cursor:pointer; transition:transform .15s; font-family:inherit;
}
.op-tile:hover{ transform:translateY(-4px); }
.op-tile.sel{ background:var(--accent); color:#fff; border-color:#b45309; transform:translateY(-4px); }
.p24-msg{ text-align:center; font-size:19px; font-weight:800; min-height:30px; margin:6px 0; }

/* ============ 岛3：间隔魔法镇 ============ */
.scene-head{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; margin:2px 0 8px; }
.scene-badge{ background:var(--main); color:#fff; font-weight:900; border-radius:10px; padding:4px 14px; font-size:17px; }
.rulerwrap{ position:relative; height:130px; margin:16px 4px 4px; }
.rulerline{ position:absolute; left:0; right:0; bottom:38px; height:4px; background:var(--dark); border-radius:3px; }
.tick{ position:absolute; bottom:30px; width:3px; height:16px; background:var(--dark); transform:translateX(-50%); }
.tick.major{ height:22px; width:4px; }
.ticklabel{ position:absolute; bottom:0; transform:translateX(-50%); font-size:16px; font-weight:700; color:#44506b; white-space:nowrap; }
.ruler-caption{ text-align:center; font-size:16px; color:#44506b; margin-top:2px; }
.bus{
  position:absolute; bottom:46px; transform:translateX(-50%); font-size:32px; cursor:grab;
  touch-action:none; user-select:none; -webkit-user-select:none; z-index:5; filter:drop-shadow(0 3px 3px rgba(0,0,0,.25));
}
.bus.fixed{ cursor:default; }
.bus.hot{ filter:drop-shadow(0 0 8px var(--accent)); }
.bus .bidx{ position:absolute; top:-20px; left:50%; transform:translateX(-50%); font-size:16px; font-weight:900; color:#fff; background:var(--main); border-radius:8px; padding:0 7px; white-space:nowrap; }
.bus.dragbus .bidx{ background:#d97706; }
.person .bidx{ position:absolute; top:-20px; left:50%; transform:translateX(-50%); font-size:16px; font-weight:900; color:#fff; background:#44506b; border-radius:8px; padding:0 7px; white-space:nowrap; }
.gap-badge{
  position:absolute; bottom:82px; transform:translateX(-50%); background:var(--accent); color:#fff;
  font-size:16px; font-weight:900; border-radius:999px; padding:1px 9px; animation:pop .4s; z-index:6; white-space:nowrap;
}
.person{
  position:absolute; bottom:46px; transform:translateX(-50%); font-size:30px; touch-action:none;
  user-select:none; -webkit-user-select:none; z-index:5;
}
.qprev{ position:relative; height:30px; margin:10px 4px 0; border-bottom:2px dashed #c3cfe4; }
.qdot{ position:absolute; bottom:2px; transform:translateX(-50%); font-size:18px; }
.qmark{ position:absolute; bottom:0; font-size:16px; font-weight:900; transform:translateX(-50%); }
.building{ display:flex; gap:22px; justify-content:center; align-items:flex-start; flex-wrap:wrap; }
.bld-col{ position:relative; padding-bottom:6px; }
.floor{
  width:170px; height:48px; border:2px solid var(--main); border-radius:10px; margin:4px 0;
  display:flex; align-items:center; padding:0 14px; font-size:18px; font-weight:800; background:#fff;
}
.floor.hl{ background:var(--light); }
.kidchip{
  position:absolute; left:50%; transform:translate(-50%,-50%); font-size:38px; cursor:grab;
  touch-action:none; user-select:none; -webkit-user-select:none; z-index:6; filter:drop-shadow(0 3px 4px rgba(0,0,0,.3));
}
.slot-panel{ background:#f7faff; border:2px solid #dbe4f2; border-radius:16px; padding:14px; min-width:240px; }
.slot-title{ font-size:18px; font-weight:900; color:var(--dark); margin-bottom:8px; text-align:center; }
.plaza{
  position:relative; width:min(380px,92%); aspect-ratio:1/1; margin:14px auto;
  border:6px solid var(--main); border-radius:12px; background:#ecf8ef;
}
.flagchip{
  position:absolute; width:32px; height:32px; transform:translate(-50%,-50%);
  display:flex; align-items:center; justify-content:center; font-size:22px;
}
.flagchip.dup{ cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; z-index:6; }
.flagchip.dup:hover{ filter:drop-shadow(0 0 6px #d97706); }
.x2ring{
  position:absolute; width:64px; height:64px; transform:translate(-50%,-50%);
  border:2px dashed #c2410c; border-radius:50%; pointer-events:none;
  display:flex; align-items:center; justify-content:center;
}
.x2ring b{ background:#c2410c; color:#fff; border-radius:8px; font-size:16px; padding:0 7px; }
.flag-count{ text-align:center; font-size:22px; font-weight:900; margin:6px 0; }
.whbox-title{ text-align:center; font-weight:900; font-size:17px; margin-bottom:6px; }

/* ============ 岛4：报数擂台 ============ */
.numgrid{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:14px 0; }
.numcell{
  min-width:clamp(32px,6vw,46px); height:clamp(32px,6vw,46px); border-radius:10px;
  border:2px solid #b9c6da; display:flex; align-items:center; justify-content:center;
  font-size:17px; font-weight:800; background:#fff; color:#3b4a66; touch-action:none;
  user-select:none; -webkit-user-select:none; transition:background .12s;
}
.numcell.stu{ background:var(--main); border-color:var(--dark); color:#fff; }
.numcell.ai{ background:var(--accent); border-color:#b45309; color:#fff; }
.numcell.sel{ outline:4px solid #ef4a7b; transform:scale(1.08); }
.numcell.frontier{ box-shadow:0 0 0 4px rgba(59,130,246,.4); animation:pulse 1s infinite; }
@keyframes pulse{ 0%,100%{ box-shadow:0 0 0 3px rgba(59,130,246,.35);} 50%{ box-shadow:0 0 0 7px rgba(59,130,246,.15);} }
.turn-line{ text-align:center; font-size:20px; font-weight:900; min-height:34px; margin:4px 0; }
.roleduo{ display:flex; gap:18px; justify-content:center; flex-wrap:wrap; margin:14px 0; }
.rolezone{ min-width:190px; min-height:110px; font-size:20px; }

/* ============ 岛5：天平屋 ============ */
.bal-wrap{ position:relative; height:210px; margin:12px auto; max-width:560px; }
.bal-post{ position:absolute; left:50%; top:40px; transform:translateX(-50%); width:16px; height:130px; background:var(--dark); border-radius:8px; }
.bal-base{ position:absolute; left:50%; top:166px; transform:translateX(-50%); width:200px; height:14px; background:var(--dark); border-radius:8px; }
.bal-beam{
  position:absolute; left:6%; right:6%; top:46px; height:14px; background:var(--dark);
  border-radius:8px; transition:transform .8s ease; transform-origin:center center;
}
.pan{
  position:absolute; top:64px; width:44%; border:3px solid var(--dark); border-radius:0 0 18px 18px;
  background:#fff; padding:8px 6px; text-align:center; transition:top .8s ease; z-index:3;
}
.pan .pt{ font-size:16px; font-weight:800; color:#44506b; }
.pan .pm{ font-size:22px; font-weight:900; color:var(--dark); margin-top:3px; }
.panstring{ position:absolute; top:46px; width:3px; height:22px; background:var(--dark); transition:top .8s ease; }
.purse-slot{ margin:14px auto; max-width:420px; }
.purse-emoji{ font-size:56px; text-align:center; margin:4px 0; }
.bar-row{ margin:16px 0 6px; }
.bar-label{ font-size:18px; font-weight:900; margin-bottom:5px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.bar-track{ position:relative; height:48px; background:#f1f5fb; border:2px solid #c8d4e8; border-radius:10px; }
.seg-remain{ position:absolute; left:0; top:0; bottom:0; background:var(--main); }
.seg-out{
  position:absolute; top:0; bottom:0;
  background:repeating-linear-gradient(45deg,#ffd9a8 0 8px,#fff1dd 8px 16px);
  border-left:2px dashed #d97706;
}
.bar-girl .seg-remain{ background:#7bbf7b; }
.bar-eq .bar-track{ outline:4px solid #22a35a; }
.bar-handle{
  position:absolute; top:-8px; width:20px; height:64px; background:var(--dark); border-radius:8px;
  cursor:ew-resize; touch-action:none; z-index:5; display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:15px; font-weight:900;
}
.live-eq{ font-size:19px; font-weight:800; margin-top:6px; line-height:1.7; }
.unit-tick{ position:absolute; bottom:0; width:1px; height:7px; background:#c8d4e8; }

/* ============ 弹窗 / 提示 / 彩纸 ============ */
#modal-mask{
  position:fixed; inset:0; background:rgba(20,35,60,.5); display:flex;
  align-items:center; justify-content:center; z-index:1000; padding:16px;
}
#modal-mask.hidden{ display:none; }
#modal-box{
  background:#fff; border-radius:18px; max-width:640px; width:100%; max-height:82vh;
  overflow:auto; padding:24px 26px; border-top:10px solid var(--main); animation:pop .3s;
}
#modal-box h2{ margin:4px 0 12px; color:var(--dark); font-size:26px; }
#modal-box .mbody{ font-size:18px; line-height:1.85; }
#modal-box .mbody b{ color:var(--dark); }
#toast{
  position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:rgba(25,38,60,.93);
  color:#fff; padding:12px 24px; border-radius:12px; font-size:19px; z-index:1500;
  opacity:0; pointer-events:none; transition:opacity .25s; max-width:88vw; text-align:center; line-height:1.6;
}
#toast.show{ opacity:1; }
#confetti-canvas{ position:fixed; inset:0; pointer-events:none; z-index:2000; }

/* ============ 完成页 ============ */
.done-card{
  background:#fff; border:4px solid var(--accent); border-radius:24px; max-width:620px;
  margin:30px auto; padding:30px 24px; text-align:center; animation:pop .5s;
}
.done-card h2{ font-size:34px; color:var(--dark); margin:8px 0; }
.done-stars{ font-size:40px; letter-spacing:5px; margin:10px 0; }
.done-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:18px 0; font-size:19px; }
.done-grid div{ background:var(--light); border-radius:12px; padding:10px; font-weight:800; }

@media (max-width:720px){
  .diff-grid{ grid-template-columns:1fr; }
  .hud{ margin-left:0; }
  .p24card{ width:74px; height:104px; } .p24card .pv{ font-size:34px; }
  .pan .pm{ font-size:18px; }
  .floor{ width:130px; height:42px; font-size:16px; }
  .btn{ padding:8px 12px; font-size:16px; }
}
</style>
</head>
<body>
<div id="app">
  <!-- ============ 顶栏：标题 + 计时/步数/星星 + 功能按钮 ============ -->
  <header id="topbar">
    <div class="brand">🏝️ 奇趣智慧岛<small>闯关大冒险</small></div>
    <div class="hud">
      <div class="hud-item">⏱ <b id="hud-timer">00:00</b></div>
      <div class="hud-item">👣 <b id="hud-steps">0</b> 步</div>
      <div class="hud-item">⭐ <b id="hud-stars">0</b></div>
    </div>
    <nav class="topbtns">
      <button class="btn" id="btn-rules">规则</button>
      <button class="btn btn-acc hide-in-home" id="btn-reveal">揭示答案</button>
      <button class="btn hide-in-home" id="btn-restart">重新开始</button>
      <button class="btn hide-in-home" id="btn-home">返回难度选择</button>
    </nav>
  </header>

  <main id="stage">
    <!-- ============ 首页：难度选择 ============ -->
    <section class="screen active" id="screen-home">
      <div class="hero">
        <h1>🏝️ 奇趣智慧岛 · 闯关大冒险</h1>
        <div class="sub">依据《能力测试卷（四）》精心改编 · 五座智慧小岛等你来闯！</div>
        <div class="palette-row" id="palette-row">🎨 每次闯关都会换新颜色哦</div>
      </div>
      <div class="diff-grid">
        <div class="diff-card" data-diff="1">
          <div class="lv">🌱</div><h3>初级 · 小试身手</h3>
          <p>例题级挑战：图形简单一点，数字小巧一点，先来热热身！</p>
        </div>
        <div class="diff-card" data-diff="2">
          <div class="lv">🌟</div><h3>中级 · 勇者试炼</h3>

   依据《奥数起跑线 P2 能力测试卷（四）》改编的互动操作游戏。

/* ---------------- 基础工具 ---------------- */
const $ = (s)=> document.querySelector(s);
const $$ = (s)=> Array.from(document.querySelectorAll(s));
function rand(n){ return Math.floor(Math.random()*n); }            // 0..n-1 随机整数
function pick(arr){ return arr[rand(arr.length)]; }                 // 随机取一个元素
function shuffle(arr){                                             // 洗牌（返回新数组）
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = rand(i+1); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function fmtTime(sec){                                             // 秒 → mm:ss
  const m = Math.floor(sec/60), s = sec%60;
  return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}
function fmtJiao(v){                                               // 角 → “X元Y角”
  const y = Math.floor(v/10), j = v%10;
  if(y===0){ return j+"角"; }
  if(j===0){ return y+"元"; }
  return y+"元"+j+"角";
}
let toastTimer = null;
function toast(msg){                                               // 底部轻提示
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  if(toastTimer){ clearTimeout(toastTimer); }
  toastTimer = setTimeout(()=>{ t.classList.remove("show"); }, 2000);
}
function openModal(title, html){                                   // 打开通用弹窗
  $("#modal-title").innerHTML = title;
  $("#modal-body").innerHTML = html;

/* ---------------- 彩纸庆祝（Canvas 实现，G5） ---------------- */
const Confetti = {
  cv: null, ctx: null, parts: [], raf: 0,
  init(){
    this.cv = $("#confetti-canvas"); this.ctx = this.cv.getContext("2d");
    this.resize();
    window.addEventListener("resize", ()=>{ this.resize(); });
  },
  resize(){
    this.cv.width = window.innerWidth; this.cv.height = window.innerHeight;
  },
  colors(){ return ["#f94144","#f8961e","#f9c74f","#90be6d","#43aa8b","#577590","#e0559a","#8a5cf0"]; },
  burst(n, cx, cy){                                                // 一次喷发
    const cols = this.colors();
    for(let i=0;i<n;i++){
      const ang = Math.random()*Math.PI*2, sp = 4+Math.random()*7;
      this.parts.push({
        x:cx, y:cy, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-5,
        w:7+Math.random()*8, h:5+Math.random()*6, rot:Math.random()*Math.PI,
        vr:(Math.random()-0.5)*0.3, col:pick(cols), life:70+rand(40),
        shape: rand(2),
      });
    }
    if(!this.raf){ this.loop(); }
  },
  burstFromTop(){                                                  // 顶部撒彩纸
    const w = this.cv.width;
    for(let i=0;i<5;i++){
      setTimeout(()=>{ this.burst(26, w*(0.1+Math.random()*0.8), -10); }, i*220);
    }
  },
  loop(){
    const step = ()=>{
      const ctx = this.ctx, w = this.cv.width, h = this.cv.height;
      ctx.clearRect(0,0,w,h);
      for(let i=this.parts.length-1;i>=0;i--){
        const p = this.parts[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.22; p.rot += p.vr; p.life -= 1;
        if(p.life<=0 || p.y > h+30){ this.parts.splice(i,1); continue; }
        ctx.save();
        ctx.translate(p.x,p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.col;
        ctx.globalAlpha = Math.min(1, p.life/30);
        if(p.shape===0){ ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); }
        else if(p.shape===1){ ctx.beginPath(); ctx.arc(0,0,p.w/2.4,0,Math.PI*2); ctx.fill(); }
        else{ ctx.beginPath(); ctx.moveTo(0,-p.h/2); ctx.lineTo(p.w/2,p.h/2); ctx.lineTo(-p.w/2,p.h/2); ctx.closePath(); ctx.fill(); }
        ctx.restore();
      }
      if(this.parts.length>0){ this.raf = requestAnimationFrame(step); }
      else{ this.raf = 0; ctx.clearRect(0,0,w,h); }
    };
    this.raf = requestAnimationFrame(step);
  }
};

/* ---------------- 通用指针拖拽系统（拖片 chip → 落点 zone） ---------------- */
const DragSys = {
  handler: null,          // 当前关卡的放置处理函数 (zoneName, chipData, chipEl) => true 表示放置成功
  zones: [],              // 已注册的落点
  active: null,           // 正在拖拽的对象
  hotZone: null,
  reset(handler){ this.handler = handler; this.zones = []; this.hotZone = null; this.active = null; },
  addZone(el, name){ el.classList.add("zone"); el.dataset.drop = name; this.zones.push({el, name}); },
  addChip(el, data){
    if(!el.classList.contains("flagchip")){ el.classList.add("chip"); }
    el.addEventListener("pointerdown", (ev)=>{ this.begin(ev, el, data); });
  },
  begin(ev, el, data){
    if(this.active){ return; }
    if(el.classList.contains("locked")){ return; }
    ev.preventDefault();
    const ghost = el.cloneNode(true);
    ghost.classList.add("ghost"); ghost.classList.remove("sel"); ghost.classList.remove("dragging-src");
    document.body.appendChild(ghost);
    const a = { chipEl: el, data, ghost, px: ev.clientX, py: ev.clientY };
    this.active = a;
    el.classList.add("dragging-src");
    this.moveGhost();
    try{ el.setPointerCapture(ev.pointerId); }catch(err){ /* 个别浏览器不支持时忽略 */ }
    const onMove = (e)=>{ if(!this.active){ return; } this.active.px = e.clientX; this.active.py = e.clientY; this.moveGhost(); };
    const onUp = ()=>{
      el.removeEventListener("pointermove", onMove);
      el.removeEventListener("pointerup", onUp);
      el.removeEventListener("pointercancel", onUp);
      this.end();
    };
    el.addEventListener("pointermove", onMove);
    el.addEventListener("pointerup", onUp);
    el.addEventListener("pointercancel", onUp);
  },
  moveGhost(){
    const a = this.active;
    a.ghost.style.left = a.px+"px"; a.ghost.style.top = a.py+"px";
    this.updateHot(a.px, a.py);
  },
  updateHot(px, py){
    const el = document.elementFromPoint(px, py);
    const z = (el && el.closest) ? el.closest("[data-drop]") : null;
    this.hotZone = z;
    this.zones.forEach((it)=>{ it.el.classList.toggle("zone-hot", !!z && it.el===z); });
  },
  end(){
    const a = this.active;
    const zone = this.hotZone;
    let placed = false;
    if(zone && this.handler){
      placed = !!this.handler(zone.dataset.drop, a.data, a.chipEl);
    }
    this.zones.forEach((it)=>{ it.el.classList.remove("zone-hot"); });
    a.ghost.remove();
    a.chipEl.classList.remove("dragging-src");
    this.active = null; this.hotZone = null;
    if(!placed){ toast("放的位置不对哦，再试一次！"); }
  }
};

/* =====================================================================
   岛1：一笔画星阵（Canvas 描线，操作即思考）
   ===================================================================== */
function makeDrawIsland(root, ctx, cfg){
  const g = cfg.graph;
  const timers = [];
  let destroyed = false, revealUsed = false;
  /* 构建邻接表与度数 */
  const adj = g.nodes.map(()=>[]);
  g.edges.forEach((e,i)=>{ adj[e[0]].push({to:e[1], ei:i}); adj[e[1]].push({to:e[0], ei:i}); });
  const deg = g.nodes.map((_,i)=> adj[i].length);
  const oddNodes = g.nodes.map((_,i)=>i).filter((i)=> deg[i]%2===1);

  root.innerHTML =
    '<div class="draw-status"><span>图形：<b>'+g.name+'</b></span>'+
    '<span>已画 <b id="draw-cnt" style="color:var(--main)">0</b> / '+g.edges.length+' 条线</span></div>'+
    '<div class="tip-line center">从一个圆点出发，沿线条拖动（或连续点击相邻两点）一笔画完所有线，每条线只能画一次！</div>'+
    '<canvas id="draw-canvas"></canvas>'+
    '<div class="stuck-tip" id="draw-stuck" style="display:none">😅 走到没有新路的地方啦！点「撤销一步」倒回去，或「重新画」换条路试试。</div>'+
    '<div class="island-actions">'+
    '<button class="mini-btn" id="draw-undo">↩ 撤销一步</button>'+
    '<button class="mini-btn" id="draw-clear">🔄 重新画</button></div>';

  const cv = root.querySelector("#draw-canvas");
  const box = root;
  let size = 300;
  function fit(){
    size = Math.max(260, Math.min(box.clientWidth-8, 520));
    const dpr = window.devicePixelRatio || 1;
    cv.style.width = size+"px"; cv.style.height = size+"px";
    cv.width = Math.round(size*dpr); cv.height = Math.round(size*dpr);
  }
  fit();
  const onWinResize = ()=>{ fit(); };
  window.addEventListener("resize", onWinResize);

  const PAD = 34;                                  // 画布内边距（像素）
  function toPx(p){                                // 逻辑坐标 → 像素
    return [ PAD + p[0]/100*(size-2*PAD), PAD + p[1]/100*(size-2*PAD) ];
  }
  function toLogical(e){
    const r = cv.getBoundingClientRect();
    return [ (e.clientX-r.left)/r.width*100, (e.clientY-r.top)/r.height*100 ];
  }
  function nearestNode(lx, ly){
    let best = -1, bd = 81;                        // 命中半径：逻辑距离 9
    g.nodes.forEach((n,i)=>{
      const dx = n[0]-lx, dy = n[1]-ly, d = dx*dx+dy*dy;
      if(d < bd){ bd = d; best = i; }
    });
    return best;
  }

  let path = [];                                   // 依次经过的点
  let used = new Set();                            // 已画边的编号
  let dragging = false;
  let flash = { ei:-1, t:0 };                      // 重复画某边时的红色闪烁
  let revealSet = new Set();                       // 揭示动画用
  let revealAnim = false;
  let done = false;
  let lastToastAt = 0;

  function last(){ return path.length ? path[path.length-1] : -1; }
  function edgeBetween(a,b){
    for(const it of adj[a]){ if(it.to===b){ return it.ei; } }
    return -1;
  }
  function updateCnt(){ root.querySelector("#draw-cnt").textContent = used.size; }
  function checkStuck(){
    const box2 = root.querySelector("#draw-stuck");
    if(done || used.size===g.edges.length || path.length===0){ box2.style.display="none"; return; }
    let ok = false;
    for(const it of adj[last()]){ if(!used.has(it.ei)){ ok = true; break; } }
    box2.style.display = ok ? "none" : "block";
  }
  function commitEdge(ei, toNode){
    used.add(ei); path.push(toNode);
    addStep(1); updateCnt();
    if(used.size === g.edges.length){
      done = true;
      Confetti.burst(70, window.innerWidth/2, window.innerHeight/3);
      ctx.done("太棒了！一笔画成了！<br>这个图形有 "+oddNodes.length+" 个奇点"+
        (oddNodes.length===2 ? "，从一个奇点出发、到另一个奇点结束。" : "（全是双数点），从任何点出发都能回到起点。"));
    } else { checkStuck(); }
  }
  function tryCommit(v){
    const l = last();
    if(v===l || l<0){ return; }
    const ei = edgeBetween(l, v);
    if(ei>=0 && !used.has(ei)){ commitEdge(ei, v); return; }
    if(ei>=0 && used.has(ei)){
      flash = { ei, t: performance.now() };
      const now = performance.now();
      if(now - lastToastAt > 1200){ toast("这条线已经画过啦，换一条！"); lastToastAt = now; }
    }
  }

  /* 指针事件：支持“拖动扫过”与“连点两点”两种画法 */
  cv.addEventListener("pointerdown", (e)=>{
    if(done || revealAnim){ return; }
    e.preventDefault();
    const [lx,ly] = toLogical(e);
    const hit = nearestNode(lx,ly);
    if(hit<0){ toast("请按住一个圆点开始画哦"); return; }
    if(path.length===0){
      path.push(hit); dragging = true;
      toast("出发！沿着线条拖动，或点击相邻的点");
      try{ cv.setPointerCapture(e.pointerId); }catch(err){ /* 忽略 */ }
      return;
    }
    if(hit === last()){
      dragging = true;
      try{ cv.setPointerCapture(e.pointerId); }catch(err){ /* 忽略 */ }
    } else {
      tryCommit(hit);                              // 连点模式：直接尝试画到该点
    }
  });
  cv.addEventListener("pointermove", (e)=>{
    if(!dragging || done || revealAnim){ return; }
    const [lx,ly] = toLogical(e);
    const hit = nearestNode(lx,ly);
    if(hit>=0 && hit!==last()){ tryCommit(hit); }
  });
  const stopDrag = ()=>{ dragging = false; };
  cv.addEventListener("pointerup", stopDrag);
  cv.addEventListener("pointercancel", stopDrag);

  root.querySelector("#draw-undo").addEventListener("click", ()=>{
    if(done || revealAnim){ return; }
    if(path.length>1){
      const v = path.pop();
      const u = last();
      const ei = edgeBetween(u, v);
      if(ei>=0){ used.delete(ei); }
      updateCnt(); checkStuck();
    } else if(path.length===1){
      path = []; used.clear(); updateCnt(); checkStuck(); toast("回到起点，重新出发！");
    }
  });
  root.querySelector("#draw-clear").addEventListener("click", ()=>{
    if(revealAnim){ return; }
    path = []; used.clear(); updateCnt(); checkStuck(); toast("重新画！这次先找找奇点在哪里");
  });

  /* 持续渲染 */
  function render(){
    if(destroyed){ return; }
    const dpr = window.devicePixelRatio || 1;
    const c = cv.getContext("2d");
    c.setTransform(dpr,0,0,dpr,0,0);
    c.clearRect(0,0,size,size);
    const mainCol = getComputedStyle(document.documentElement).getPropertyValue("--main").trim();
    const accCol = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
    /* 底层线 */
    g.edges.forEach((e,i)=>{
      const a = toPx(g.nodes[e[0]]), b = toPx(g.nodes[e[1]]);
      c.lineCap = "round";
      c.lineWidth = 13;
      c.strokeStyle = "#e3e9f4";
      c.beginPath(); c.moveTo(a[0],a[1]); c.lineTo(b[0],b[1]); c.stroke();
      if(used.has(i) || revealSet.has(i)){
        c.lineWidth = 9;
        c.strokeStyle = revealSet.has(i) ? accCol : mainCol;
        c.shadowColor = c.strokeStyle; c.shadowBlur = 8;
        c.beginPath(); c.moveTo(a[0],a[1]); c.lineTo(b[0],b[1]); c.stroke();
        c.shadowBlur = 0;
      }
      if(flash.ei===i && performance.now()-flash.t < 450){
        c.lineWidth = 9; c.strokeStyle = "rgba(230,60,60,.85)";
        c.beginPath(); c.moveTo(a[0],a[1]); c.lineTo(b[0],b[1]); c.stroke();
      }
    });
    /* 顶点 */
    const t = performance.now()/500;
    g.nodes.forEach((n,i)=>{
      const p = toPx(n);
      c.beginPath(); c.arc(p[0],p[1], 12, 0, Math.PI*2);
      c.fillStyle = "#fff"; c.fill();
      c.lineWidth = 4; c.strokeStyle = (i===last()) ? accCol : "#44506b";
      c.stroke();
      if(i===last()){
        const r = 16 + 4*Math.sin(t*3);
        c.beginPath(); c.arc(p[0],p[1], r, 0, Math.PI*2);
        c.strokeStyle = accCol; c.lineWidth = 3; c.stroke();
      }
    });
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  /* 揭示答案：自动求解一条一笔画路线并动画演示 */
  function reveal(){
    if(revealAnim || done){ return; }
    revealUsed = true; ctx.markReveal();
    const E = g.edges.length;
    const usedE = new Array(E).fill(false);
    let found = null;
    const starts = oddNodes.length ? oddNodes : [0];
    function dfs(u, acc){
      if(found){ return; }
      if(acc.length === E){ found = acc.slice(); return; }
      for(const it of adj[u]){
        if(!usedE[it.ei]){
          usedE[it.ei] = true; acc.push(it.ei);
          dfs(it.to, acc);
          if(found){ return; }
          usedE[it.ei] = false; acc.pop();
        }
      }
    }
    for(const s of starts){ dfs(s, []); if(found){ break; } }
    if(!found){ openModal("揭示答案","这个图形画不成，找老师帮忙看看吧！"); return; }
    revealAnim = true; revealSet.clear(); path = []; used.clear(); updateCnt(); checkStuck();
    let k = 0;
    const stepIv = setInterval(()=>{
      if(destroyed){ clearInterval(stepIv); return; }
      if(k >= found.length){
        clearInterval(stepIv);
        timers.push(setTimeout(()=>{
          revealSet.clear(); revealAnim = false;
          toast("看明白了吗？跟着这条路线自己再画一遍吧！");
        }, 1600));
        return;
      }
      revealSet.add(found[k]); k += 1;
    }, 430);
    timers.push(stepIv);
    openModal("揭示答案",
      "<p><b>小锦囊（试卷提示）</b>：图中连出奇数条线的点叫奇点。</p>"+
      "<p>本图形有 <b>"+oddNodes.length+"</b> 个奇点"+
      (oddNodes.length===2
        ? "——有两个奇点时，必须<b>从一个奇点出发，到另一个奇点结束</b>，就能一笔画成。"
        : "——没有奇点（全是双数点）时，<b>从任何一个点出发</b>都能一笔画回出发点。")+"</p>"+
      "<p>现在画面上会用亮色演示一条成功路线，看好啦！</p>");
  }

  return {
    reveal,
    destroy(){
      destroyed = true;
      window.removeEventListener("resize", onWinResize);
      timers.forEach((t)=>{ clearTimeout(t); clearInterval(t); });
    },
    revealInfo(){ return revealUsed; },
  };
}

/* =====================================================================
   岛2：24点合体工坊（点牌 → 点运算符 → 点牌，两两合体）
   ===================================================================== */
function make24Island(root, ctx, cfg){
  const suits = ["♠","♥","♣","♦"];
  let history = [];                                // 撤销用历史（每步保存牌面快照）
  let cards = [];                                  // 当前牌（对象数组 {v, suit, red}）
  let selA = -1, selOp = "";
  let revealUsed = false;
  const timers = [];
  let destroyed = false;

  function newCard(v){
    const s = pick(suits);
    return { v, suit:s, red:(s==="♥"||s==="♦") };
  }
  function initCards(){
    cards = cfg.cards.map((v)=> newCard(v));
    history = []; selA = -1; selOp = "";
  }
  initCards();

  root.innerHTML =
    '<div class="p24-msg" id="p24-msg">点一张牌 → 点运算符号 → 再点另一张牌：两张牌就会合体成一张新牌！</div>'+
    '<div class="p24-row" id="p24-row"></div>'+
    '<div class="op-row" id="p24-ops"></div>'+
    '<div class="island-actions">'+
    '<button class="mini-btn" id="p24-undo">↩ 撤销一步</button>'+
    '<button class="mini-btn" id="p24-reset">🔄 重拿四张牌</button></div>';

  const row = root.querySelector("#p24-row");
  const opsBox = root.querySelector("#p24-ops");
  const msg = root.querySelector("#p24-msg");
  const OP_LIST = [["+","＋"],["-","−"],["*","×"],["/","÷"]];
  OP_LIST.forEach((op)=>{
    const b = document.createElement("button");
    b.className = "op-tile"; b.textContent = op[1]; b.dataset.op = op[0];
    b.addEventListener("click", ()=>{
      if(selA<0){ toast("先点一张牌，再选运算符号"); return; }
      selOp = op[0];
      root.querySelectorAll(".op-tile").forEach((t)=>{ t.classList.toggle("sel", t.dataset.op===selOp); });
      msg.textContent = "已选 "+op[1]+"，再点另一张牌完成合体！";
    });
    opsBox.appendChild(b);
  });

  function render(){
    row.innerHTML = "";
    cards.forEach((c,i)=>{
      const d = document.createElement("div");
      d.className = "p24card "+(c.red?"red":"black")+(i===selA?" sel":"");
      d.innerHTML = '<div class="pv">'+c.v+'</div><div class="ps">'+c.suit+'</div>';
      d.addEventListener("click", ()=> onCard(i, d));
      row.appendChild(d);
    });
  }
  function onCard(i, el){
    if(destroyed){ return; }
    if(selA<0){
      selA = i; selOp = "";
      root.querySelectorAll(".op-tile").forEach((t)=>{ t.classList.remove("sel"); });
      render(); msg.textContent = "已选中 "+cards[i].v+"，选一个运算符号吧！";
      return;
    }
    if(selA===i){                                   // 再点同一张 = 取消选中
      selA = -1; selOp = ""; render(); msg.textContent = "已取消，重新选牌";
      return;
    }
    if(!selOp){ toast("先点一个运算符号（＋－×÷）"); return; }
    /* 执行合体 */
    const a = cards[selA].v, b = cards[i].v;
    let r = null;
    if(selOp==="+"){ r = a+b; }
    else if(selOp==="-"){
      if(a-b < 0){ toast(a+"−"+b+" 会变成负数，交换一下两张牌的顺序试试！"); el.classList.add("shake"); setTimeout(()=>{ el.classList.remove("shake"); },400); return; }
      r = a-b;
    }
    else if(selOp==="*"){ r = a*b; }
    else if(selOp==="/"){
      if(b===0 || a%b!==0){ toast(a+"÷"+b+" 除不尽哦，换一种算法试试！"); el.classList.add("shake"); setTimeout(()=>{ el.classList.remove("shake"); },400); return; }
      r = a/b;
    }
    history.push(JSON.stringify(cards));
    const rest = cards.filter((_,j)=> j!==selA && j!==i);
    cards = rest.concat([Object.assign(newCard(r), {newly:true})]);
    selA = -1; selOp = "";
    root.querySelectorAll(".op-tile").forEach((t)=>{ t.classList.remove("sel"); });
    addStep(1); render();
    msg.textContent = "合体得到 "+r+" ！";
    if(cards.length===1){
      if(r===24){
        Confetti.burst(70, window.innerWidth/2, window.innerHeight/3);
        ctx.done("🎉 合体成功，正好是 24！<br>"+cfg.sol);
      } else {
        msg.textContent = "最后只剩 "+r+"，不是 24——点「撤销一步」换个算法！";
      }
    }
  }
  root.querySelector("#p24-undo").addEventListener("click", ()=>{
    if(history.length){
      cards = JSON.parse(history.pop()).map((c)=>{ const n = newCard(c.v); n.suit = c.suit; n.red = c.red; return n; });
      selA = -1; selOp = ""; render(); msg.textContent = "回到上一步，换一种合体方式！";
    } else { toast("已经是开始状态啦"); }
  });
  root.querySelector("#p24-reset").addEventListener("click", ()=>{
    initCards(); render(); msg.textContent = "四张牌重新拿好，再来一次！";
  });
  render();

  return {
    reveal(){
      revealUsed = true; ctx.markReveal();
      openModal("揭示答案",
        "<p>这四张牌是：<b>"+cfg.cards.join("、")+"</b></p>"+
        "<p>一种合体路线：<b>"+cfg.sol+"</b></p>"+
        "<p>答案不唯一——动手试试你自己的路线吧！</p>");
    },
    destroy(){ destroyed = true; timers.forEach((t)=>{ clearTimeout(t); }); },
  };
}

/* =====================================================================
   岛3：间隔魔法镇（每局随机抽 2 个场景）
   ===================================================================== */
function makeGapIsland(root, ctx, cfg){
  const scenes = cfg.scenes;                        // [{key, cfg, data}, ...]
  let idx = 0;
  let destroyed = false;
  const cleanup = [];

  function mountScene(){
    if(destroyed){ return; }
    const sc = scenes[idx];
    ctx.setSub("第 "+(idx+1)+" / "+scenes.length+" 小关 · "+GAP_DATA[sc.key].label);
    ctx.setProblem(GAP_DATA[sc.key].prob[G.diff]);
    root.innerHTML = "";
    if(sc.key==="bus"){ buildBus(root, sc); }
    else if(sc.key==="queue"){ buildQueue(root, sc); }
    else if(sc.key==="stairs"){ buildStairs(root, sc); }
    else { buildFlags(root, sc); }
  }
  function sceneDone(sol){
    const banner = document.createElement("div");
    banner.className = "success-banner";
    banner.innerHTML = "🎉 本小关通过！"+sol;
    root.appendChild(banner);
    Confetti.burst(50, window.innerWidth/2, window.innerHeight/3);
    if(idx < scenes.length-1){
      const btn = document.createElement("button");
      btn.className = "mini-btn"; btn.textContent = "➡ 去下一小关";
      btn.style.display = "block"; btn.style.margin = "14px auto";
      btn.addEventListener("click", ()=>{ idx += 1; mountScene(); });
      root.appendChild(btn);
    } else {
      timers(function(){ ctx.done("「间隔魔法镇」全部通过！记住魔法口诀：<b>棵数−1=间隔数</b>（爬楼：层数−1；排队：人数−1；发车：辆数−1；插旗：每边相加再减去角上重复的）。"); }, 600);
    }
  }
  function timers(fn, ms){ const t = setTimeout(()=>{ if(!destroyed){ fn(); } }, ms); cleanup.push(t); }

  /* ---------- 场景A：公交车站时间轴 ---------- */
  function buildBus(box, sc){
    const gap = sc.cfg.gap, total = sc.cfg.total;
    const maxMin = (total+2)*gap;                   // 时间轴总长（多留几个刻度作干扰）
    const N = Math.round(maxMin/gap);
    box.innerHTML =
      '<div class="tip-line center">'+GAP_DATA.bus.tip.replace("{N}", total)+'</div>'+
      '<div class="rulerwrap" id="bus-ruler"></div>'+
      '<div class="ruler-caption">时间轴（单位：分钟）——前 '+(total-1)+' 辆已经发车，请把<b>第 '+total+' 辆车</b>拖到正确的位置</div>';
    const ruler = box.querySelector("#bus-ruler");
    const W = ()=> ruler.clientWidth;
    const xOf = (v)=> v/maxMin*W();
    for(let i=0;i<=N;i++){
      const tk = document.createElement("div");
      tk.className = "tick"+((i%2===0)?" major":"");
      tk.style.left = xOf(i*gap)+"px";
      ruler.appendChild(tk);
      if(N<=13 || i%2===0){
        const lb = document.createElement("div");
        lb.className = "ticklabel"; lb.style.left = xOf(i*gap)+"px";
        lb.textContent = (i*gap);
        ruler.appendChild(lb);
      }
    }
    const line = document.createElement("div"); line.className = "rulerline"; ruler.appendChild(line);
    for(let i=0;i<total-1;i++){
      const b = document.createElement("div");
      b.className = "bus fixed";
      b.style.left = xOf(i*gap)+"px";
      b.innerHTML = "🚌<span class='bidx'>"+(i+1)+"</span>";
      ruler.appendChild(b);
    }
    const drag = document.createElement("div");
    drag.className = "bus dragbus";
    drag.style.left = xOf(maxMin*0.5)+"px";
    drag.innerHTML = "🚌<span class='bidx'>"+total+"</span>";
    ruler.appendChild(drag);
    /* 拖动逻辑 */
    let dragging = false;
    let finished = false;
    drag.addEventListener("pointerdown", (e)=>{
      if(finished){ return; }
      e.preventDefault(); dragging = true;
      try{ drag.setPointerCapture(e.pointerId); }catch(err){ /* 忽略 */ }
    });
    drag.addEventListener("pointermove", (e)=>{
      if(!dragging || finished){ return; }
      const r = ruler.getBoundingClientRect();
      const v = Math.max(0, Math.min(maxMin, (e.clientX-r.left)/r.width*maxMin));
      drag.style.left = xOf(v)+"px";
      const near = Math.round(v/gap)*gap;
      drag.classList.toggle("hot", near===gap*(total-1));
    });
    drag.addEventListener("pointerup", (e)=>{
      if(!dragging || finished){ return; }
      dragging = false;
      const r = ruler.getBoundingClientRect();
      const v = Math.max(0, Math.min(maxMin, (e.clientX-r.left)/r.width*maxMin));
      const tick = Math.round(v/gap)*gap;
      drag.style.left = xOf(tick)+"px";
      addStep(1);
      if(tick === gap*(total-1)){
        finished = true;
        drag.classList.remove("hot");
        /* 成功：标出每个间隔 */
        for(let i=0;i<total-1;i++){
          const mid = xOf(i*gap + gap/2);
          const bd = document.createElement("div");
          bd.className = "gap-badge";
          bd.style.left = mid+"px";
          bd.style.bottom = (82 + (i%2)*26)+"px";
          bd.textContent = "间隔"+(i+1);
          ruler.appendChild(bd);
        }
        sceneDone(GAP_DATA.bus.sol[G.diff]+
          "<br>第"+total+"辆车正好在 <b>"+(gap*(total-1))+"分钟</b> 处发车！");
      } else {
        toast("再想想：第1辆到第"+total+"辆之间一共有几个"+gap+"分钟的间隔？");
        drag.classList.add("shake");
        setTimeout(()=>{ drag.classList.remove("shake"); }, 400);
      }
    });
  }

  /* ---------- 场景B：排队做操 ---------- */
  function buildQueue(box, sc){
    const n = sc.cfg.n, L = sc.cfg.len;
    const dRight = L/(n-1);
    box.innerHTML =
      '<div class="tip-line center">'+GAP_DATA.queue.tip+'</div>'+
      '<div class="rulerwrap" id="q-ruler"></div>'+
      '<div class="ruler-caption">米尺（单位：米）——<b>第1位</b>站在 0 米，<b>第'+n+'位（队尾）</b>站在 '+L+' 米处</div>'+
      '<div class="qprev" id="q-prev"><div class="qmark" style="left:100%;color:#22a35a">第'+n+'位·'+L+'米</div></div>'+
      '<div class="tip-line center" id="q-live">把「第2位同学」拖到米尺上，决定全队的间隔！</div>';
    const ruler = box.querySelector("#q-ruler");
    const W = ()=> ruler.clientWidth;
    const xOf = (m)=> m/L*W();
    const labStep = (L>30) ? 10 : 5;
    for(let m=0;m<=L;m++){
      const tk = document.createElement("div");
      tk.className = "tick"+((m%labStep===0)?" major":"");
      tk.style.left = xOf(m)+"px";
      ruler.appendChild(tk);
      if(m%labStep===0){
        const lb = document.createElement("div");
        lb.className = "ticklabel"; lb.style.left = xOf(m)+"px";
        lb.textContent = m;
        ruler.appendChild(lb);
      }
    }
    const line = document.createElement("div"); line.className = "rulerline"; ruler.appendChild(line);
    function mkPerson(m, label, fixed){
      const p = document.createElement("div");
      p.className = "person"; p.style.left = xOf(m)+"px";
      p.innerHTML = "🧑"+(label?"<span class='bidx'>"+label+"</span>":"");
      if(fixed){ p.style.cursor = "default"; }
      ruler.appendChild(p);
      return p;
    }
    mkPerson(0, "第1位", true);
    mkPerson(L, "第"+n+"位", true);
    const p2 = mkPerson(L*0.5, "第2位·拖我", false);
    p2.style.cursor = "grab";
    const prev = box.querySelector("#q-prev");
    const live = box.querySelector("#q-live");
    function drawPreview(d){
      prev.querySelectorAll(".qdot").forEach((e)=>{ e.remove(); });
      for(let i=0;i<n;i++){
        const dot = document.createElement("div");
        dot.className = "qdot";
        const m = i*d;
        dot.style.left = Math.min(100, m/L*100)+"%";
        dot.textContent = i===0 ? "🧑" : "🙂";
        if(i===n-1){ dot.style.fontSize = "24px"; dot.style.color = (m===L) ? "#22a35a" : "#d94141"; }
        prev.appendChild(dot);
      }
    }
    let dragging = false;
    let finished = false;
    p2.addEventListener("pointerdown", (e)=>{
      if(finished){ return; }
      e.preventDefault(); dragging = true;
      try{ p2.setPointerCapture(e.pointerId); }catch(err){ /* 忽略 */ }
    });
    p2.addEventListener("pointermove", (e)=>{
      if(!dragging || finished){ return; }
      const r = ruler.getBoundingClientRect();
      const m = Math.max(0, Math.min(L, (e.clientX-r.left)/r.width*L));
      p2.style.left = xOf(m)+"px";
      const d = Math.max(1, Math.round(m));
      drawPreview(d);
      live.innerHTML = "当前间隔 <b>"+d+" 米</b>：第"+n+"位同学会站在 "+(n-1)+"×"+d+" = <b>"+((n-1)*d)+" 米</b> 处"+
        ((n-1)*d===L ? " ✅ 正好！" : " ❌ 不是 "+L+" 米");
    });
    p2.addEventListener("pointerup", (e)=>{
      if(!dragging || finished){ return; }
      dragging = false;
      const r = ruler.getBoundingClientRect();
      const m = Math.max(0, Math.min(L, (e.clientX-r.left)/r.width*L));
      const d = Math.max(1, Math.round(m));
      p2.style.left = xOf(d)+"px";
      drawPreview(d);
      addStep(1);
      if(d*(n-1) === L){
        finished = true;
        live.innerHTML = "完美！间隔 <b>"+d+" 米</b>："+n+"人站成一条 "+L+" 米的长队！";
        p2.querySelector(".bidx").textContent = "第2位·"+d+"米";
        sceneDone(GAP_DATA.queue.sol[G.diff]);
      } else {
        toast("第"+n+"位同学站在了 "+(d*(n-1))+" 米，不是 "+L+" 米——调整一下间隔！");
        p2.classList.add("shake");
        setTimeout(()=>{ p2.classList.remove("shake"); }, 400);
      }
    });
  }

  /* ---------- 场景C：爬楼梯 ---------- */
  function buildStairs(box, sc){
    const c = sc.cfg;
    const cards = shuffle(c.cards);
    box.innerHTML =
      '<div class="tip-line center">'+GAP_DATA.stairs.tip+'</div>'+
      '<div class="building">'+
        '<div class="bld-col" id="bld"></div>'+
        '<div class="slot-panel">'+
          '<div class="slot-title">第一步：每层楼用时是多久？</div>'+
          '<div class="chip-row" id="st-chips"></div>'+
          '<div class="zone" data-note="slot" id="st-slot">把「每层用时」卡拖到这里</div>'+
          '<div class="tip-line center" id="st-msg1" style="min-height:26px"></div>'+
          '<div class="slot-title" style="margin-top:12px">第二步：把小丁拖到「'+c.askTo+'楼」</div>'+
          '<div class="tip-line center" id="st-msg2" style="min-height:26px">小丁现在还在 1 楼哦</div>'+
        '</div>'+
      '</div>';
    const bld = box.querySelector("#bld");
    const floorEls = [];
    for(let f=c.floors; f>=1; f--){
      const d = document.createElement("div");
      d.className = "floor";
      d.innerHTML = (f===1 ? "🏠 " : "")+f+" 楼"+(f===c.givenTo ? "（到这里用了"+c.givenMin+"分钟）" : "")+(f===c.askTo ? "（目的地）" : "");
      bld.appendChild(d);
      floorEls[f] = d;
    }
    const kid = document.createElement("div");
    kid.className = "kidchip"; kid.textContent = "🧒";
    kid.title = "拖我上楼";
    bld.appendChild(kid);
    function floorY(f){
      const r1 = floorEls[1].getBoundingClientRect(), rB = bld.getBoundingClientRect();
      return (r1.top - rB.top) - (f-1)*(r1.height+8) + r1.height/2;
    }
    function placeKid(f){ kid.style.top = floorY(f)+"px"; }
    requestAnimationFrame(()=>{ placeKid(1); });

    let perMin = null;
    let done2 = false;
    const cardEls = [];
    /* 时长卡拖放 */
    DragSys.reset((zone, data)=>{
      if(zone!=="st-slot" || perMin!==null){ return false; }
      /* 自洽检验：(givenTo-1) 层 × 每层时长 必须 = givenMin 分钟 */
      if((c.givenTo-1)*data === c.givenMin){
        perMin = data;
        const slot = box.querySelector("#st-slot");
        slot.innerHTML = "每层楼用时：<b style='font-size:24px'>"+data+" 分钟</b> ✅";
        slot.style.borderStyle = "solid"; slot.style.background = "#d9f2e3";
        cardEls.forEach((el)=>{ el.classList.add("locked"); });
        addStep(1);
        box.querySelector("#st-msg1").innerHTML = "检验："+(c.givenTo-1)+"层 × "+data+"分钟 = "+((c.givenTo-1)*data)+"分钟，和题目一致！";
        return true;
      }
      box.querySelector("#st-msg1").innerHTML = "❌ 照每层"+data+"分钟算，1楼到"+c.givenTo+"楼要 "+((c.givenTo-1)*data)+" 分钟，不是 "+c.givenMin+" 分钟哦！";
      box.querySelector("#st-msg1").classList.add("shake");
      setTimeout(()=>{ box.querySelector("#st-msg1").classList.remove("shake"); }, 420);
      return false;
    });
    DragSys.addZone(box.querySelector("#st-slot"), "st-slot");
    cards.forEach((v)=>{
      const chip = document.createElement("div");
      chip.textContent = v+" 分钟";
      DragSys.addChip(chip, v);
      cardEls.push(chip);
      box.querySelector("#st-chips").appendChild(chip);
    });
    /* 小丁拖动：按楼层高度吸附 */
    let dragging = false;
    function calcFloor(cy){
      const h1 = floorEls[1].getBoundingClientRect();
      const fh = h1.height+8;
      return Math.max(1, Math.min(c.floors, Math.round(1 + (h1.top + h1.height/2 - cy)/fh)));
    }
    function setHover(f){
      floorEls.forEach((el,fi)=>{ if(el){ el.classList.toggle("hl", fi===f); } });
      if(perMin!==null && !done2){
        box.querySelector("#st-msg2").innerHTML = "从1楼到"+f+"楼要爬 "+(f-1)+" 层 × "+perMin+"分钟 = <b>"+((f-1)*perMin)+"分钟</b>";
      }
    }
    kid.addEventListener("pointerdown", (e)=>{
      e.preventDefault();
      if(done2){ return; }
      if(perMin===null){ toast("先把「每层用时」卡拖进楼道口！"); return; }
      dragging = true;
      try{ kid.setPointerCapture(e.pointerId); }catch(err){ /* 忽略 */ }
    });
    kid.addEventListener("pointermove", (e)=>{
      if(!dragging || done2){ return; }
      const rB = bld.getBoundingClientRect();
      kid.style.top = (e.clientY - rB.top)+"px";
      setHover(calcFloor(e.clientY));
    });
    kid.addEventListener("pointerup", (e)=>{
      if(!dragging || done2){ return; }
      dragging = false;
      const f = calcFloor(e.clientY);
      placeKid(f); setHover(f);
      addStep(1);
      if(f===c.askTo){
        done2 = true;
        const total = (f-1)*perMin;
        box.querySelector("#st-msg2").innerHTML = "🎉 从1楼到"+c.askTo+"楼爬了 "+(c.askTo-1)+" 层，每层"+perMin+"分钟，共 <b style='font-size:24px;color:#14683b'>"+total+" 分钟</b>！";
        sceneDone(GAP_DATA.stairs.sol[G.diff]);
      } else {
        toast("题目问的是到 "+c.askTo+" 楼要用多少分钟，把小丁拖到 "+c.askTo+" 楼！");
        kid.classList.add("shake");
        setTimeout(()=>{ kid.classList.remove("shake"); }, 400);
      }
    });
  }

  /* ---------- 场景D：操场插彩旗 ---------- */
  function buildFlags(box, sc){
    const per = sc.cfg.per;
    const total0 = per*4, totalR = per*4-4;
    box.innerHTML =
      '<div class="flag-count">现在四周一共数出 <b class="bignum" id="fl-count">'+total0+'</b> 面旗（每边'+per+'面 × 4边）</div>'+
      '<div class="plaza" id="plaza"></div>'+
      '<div class="whbox-title">🗑️ 旗子仓库：把每个角上<b>多算的那一面</b>拖进来</div>'+
      '<div class="zone" id="fl-wh" style="max-width:420px;margin:0 auto 10px">松手放进仓库</div>'+
      '<div class="tip-line center">咦？每边'+per+'面、四边相乘是 '+total0+' 面，可比真正的总数多了！——因为<b>角上的每面旗都被相邻两边数了两次</b>（看圈出的 ×2 记号）。</div>';
    const plaza = box.querySelector("#plaza");
    let removed = 0;
    const chipEls = [];
    function addFlag(xp, yp, sideName, dup){
      const f = document.createElement("div");
      f.className = "flagchip"+(dup?" dup":"");
      f.style.left = xp+"%"; f.style.top = yp+"%";
      f.textContent = "🚩";
      plaza.appendChild(f);
      chipEls.push(f);
      return f;
    }
    /* 每边 per 面旗：角 + 中间 per-2 面；角上放两面（一面算数、一面是“重复的”） */
    for(let s=0;s<4;s++){
      for(let j=0;j<per;j++){
        const t = j/(per-1)*100;                    // 沿边位置 0~100
        let xp, yp;
        if(s===0){ xp = t; yp = 0; }                // 上边
        else if(s===1){ xp = 100; yp = t; }         // 右边
        else if(s===2){ xp = 100-t; yp = 100; }     // 下边
        else { xp = 0; yp = 100-t; }                // 左边
        const isCorner = (j===0 || j===per-1);
        const isDup = isCorner && (s===1 || s===3); // 右边和左边的角旗作为“重复”的那一面
        addFlag(xp, yp, s, isDup);
      }
    }
    /* 角上 ×2 记号 */
    [[0,0],[100,0],[100,100],[0,100]].forEach((c)=>{
      const r = document.createElement("div");
      r.className = "x2ring";
      r.style.left = c[0]+"%"; r.style.top = c[1]+"%";
      r.innerHTML = "<b>×2</b>";
      plaza.appendChild(r);
    });
    const cntEl = box.querySelector("#fl-count");
    function updateCount(){ cntEl.textContent = total0 - removed; }
    DragSys.reset((zone, data)=>{
      if(zone!=="fl-wh"){ return false; }
      if(!data.isDup){ return false; }
      if(data.el.classList.contains("locked")){ return false; }
      /* 移入仓库并锁定，防止重复放置 */
      data.el.style.position = "static";
      data.el.style.transform = "none";
      data.el.style.left = "auto"; data.el.style.top = "auto";
      data.el.classList.remove("dup");
      data.el.classList.add("locked");
      box.querySelector("#fl-wh").appendChild(data.el);
      removed += 1; addStep(1); updateCount();
      if(removed===4){
        if(total0-4 === totalR){
          sceneDone(GAP_DATA.flags.sol[G.diff]+"<br>看，四周真正的旗子总数就是 <b>"+totalR+"</b> 面！");
        }
      } else {
        toast("已放回 "+removed+" 面重复的旗，还差 "+(4-removed)+" 面");
      }
      return true;
    });
    DragSys.addZone(box.querySelector("#fl-wh"), "fl-wh");
    plaza.querySelectorAll(".flagchip.dup").forEach((el)=>{
      DragSys.addChip(el, { isDup:true, el });
    });
  }

  mountScene();
  return {
    reveal(){
      ctx.markReveal();
      const sc = scenes[idx];
      openModal("揭示答案",
        "<p><b>"+GAP_DATA[sc.key].label+"</b></p><p>"+GAP_DATA[sc.key].sol[G.diff]+"</p>"+
        "<p style='color:#986'>提示看完后，还是要把操作完成哦！</p>");
    },
    destroy(){
      destroyed = true;
      cleanup.forEach((t)=>{ clearTimeout(t); });
    },
  };
}

/* =====================================================================
   岛4：报数小擂台（先选先后手，再在数字条上拖选报数，和电脑对局）
   ===================================================================== */
function makeCountIsland(root, ctx, cfg){
  const target = cfg.target, maxN = cfg.maxN, m = cfg.m;
  let role = null;                                  // "me" 我先报 / "ai" 对方先报
  let cur = 0, lock = false, finished = false;
  let revealUsed = false;
  const cleanup = [];
  let destroyed = false;
  function later(fn, ms){ const t = setTimeout(()=>{ if(!destroyed){ fn(); } }, ms); cleanup.push(t); }

  function buildRolePick(){
    root.innerHTML =
      '<div class="tip-line center">先把你的小棋子 🧑 拖到其中一个台子上：想<b>确保取胜</b>，你选哪个？</div>'+
      '<div class="roleduo">'+
        '<div class="zone rolezone" id="role-me">🙋 我先报（我先开始）</div>'+
        '<div class="zone rolezone" id="role-ai">😴 让对方先报</div>'+
      '</div>'+
      '<div class="chip-row"><div id="me-chip" style="font-size:26px">🧑</div></div>';
    DragSys.reset((zone)=>{
      if(zone!=="role-me" && zone!=="role-ai"){ return false; }
      role = (zone==="role-me") ? "me" : "ai";
      addStep(1);
      buildDuel();
      return true;
    });
    DragSys.addZone(root.querySelector("#role-me"), "role-me");
    DragSys.addZone(root.querySelector("#role-ai"), "role-ai");
    DragSys.addChip(root.querySelector("#me-chip"), { me:true });
  }

  function buildDuel(){
    root.innerHTML =
      '<div class="turn-line" id="cnt-turn"></div>'+
      '<div class="numgrid" id="cnt-grid"></div>'+
      '<div class="island-actions">'+
        '<button class="mini-btn btn-acc" id="cnt-go" style="background:var(--accent);color:#fff;border-color:#b45309" disabled>📣 报数！</button>'+
      '</div>'+
      '<div class="tip-line center">轮到你时：从亮着的下一个数开始，<b>按住并拖过 '+maxN+' 个以内连续的数</b>，然后点「报数！」</div>'+
      '<div id="cnt-extra"></div>';
    const grid = root.querySelector("#cnt-grid");
    const turn = root.querySelector("#cnt-turn");
    const goBtn = root.querySelector("#cnt-go");
    const cells = [];
    for(let i=1;i<=target;i++){
      const c = document.createElement("div");
      c.className = "numcell"; c.textContent = i; c.dataset.i = i;
      grid.appendChild(c); cells.push(c);
    }
    let selEnd = 0;                                 // 本次拖选的末尾数
    function paint(){
      cells.forEach((c)=>{
        const i = +c.dataset.i;
        c.classList.toggle("sel", lock===false && selEnd>0 && i>cur && i<=selEnd);
        c.classList.toggle("frontier", !lock && i===cur+1);
      });
    }
    function setTurn(txt){ turn.innerHTML = txt; }
    function myTurn(){
      lock = false; selEnd = 0;
      setTurn("🧑 轮到你啦：从 <b>"+(cur+1)+"</b> 开始，拖选 1～"+maxN+" 个连续的数");
      goBtn.disabled = true;
      paint();
    }
    /* 学生拖选 */
    grid.addEventListener("pointerdown", (e)=>{
      if(lock || finished){ return; }
      const cell = e.target.closest(".numcell");
      if(!cell){ return; }
      const i = +cell.dataset.i;
      if(i !== cur+1){ toast("要从 "+(cur+1)+" 开始报哦！"); return; }
      e.preventDefault();
      selEnd = i;
      try{ grid.setPointerCapture(e.pointerId); }catch(err){ /* 非真实指针时忽略 */ }
      function mv(ev){
        const el = document.elementFromPoint(ev.clientX, ev.clientY);
        const c2 = el && el.closest ? el.closest(".numcell") : null;
        if(c2){
          const j = +c2.dataset.i;
          if(j>cur && j<=Math.min(cur+maxN, target)){ selEnd = j; paint(); }
        }
      }
      function up(){
        grid.removeEventListener("pointermove", mv);
        grid.removeEventListener("pointerup", up);
        grid.removeEventListener("pointercancel", up);
        goBtn.disabled = (selEnd<=cur);
      }
      grid.addEventListener("pointermove", mv);
      grid.addEventListener("pointerup", up);
      grid.addEventListener("pointercancel", up);
    });
    goBtn.addEventListener("click", ()=>{
      if(lock || finished || selEnd<=cur){ return; }
      lock = true; addStep(1);
      for(let i=cur+1;i<=selEnd;i++){ cells[i-1].classList.add("stu"); cells[i-1].classList.remove("frontier"); }
      cur = selEnd; selEnd = 0; paint();
      if(cur===target){ winRound(); return; }
      setTurn("对方正在报数……");
      later(aiTurn, 700);
    });
    function aiTurn(){
      /* 电脑必胜策略：让自己报完后的 cur 是 m 的倍数 */
      let k = 1;
      if(cur % m !== 0){ const t2 = (Math.floor(cur/m)+1)*m; k = t2 - cur; }
      const from = cur+1, to = cur+k;
      let i = from;
      const iv = setInterval(()=>{
        if(destroyed){ clearInterval(iv); return; }
        if(i>to){
          clearInterval(iv);
          cur = to;
          if(cur===target){ loseRound(); return; }
          myTurn();
          return;
        }
        cells[i-1].classList.add("ai");
        i += 1;
      }, 300);
      cleanup.push(iv);
    }
    function winRound(){
      finished = true;
      Confetti.burst(80, window.innerWidth/2, window.innerHeight/3);
      setTurn("🎉 你先报到了 "+target+"，本局获胜！");
      later(()=>{ ctx.done("报数小擂台通过！<br>"+cfg.sol); }, 500);
    }
    function loseRound(){
      finished = true;
      setTurn("😅 这一局对方先报到了 "+target+"。");
      const extra = root.querySelector("#cnt-extra");
      extra.innerHTML =
        '<div class="fail-banner">别灰心！想一想：'+target+"÷"+m+" 有没有余数？先报的人有必胜办法，还是后报的人有？</div>"+
        '<div class="island-actions">'+
        '<button class="mini-btn" id="cnt-retry">🔄 再试一次（还是'+(role==="me"?"我先报":"对方先报")+"）</button>"+
        '<button class="mini-btn" id="cnt-reswap">🔀 换一换先后顺序再试</button></div>';
      extra.querySelector("#cnt-retry").addEventListener("click", ()=>{
        cur = 0; finished = false;
        cells.forEach((c)=>{ c.className = "numcell"; });
        buildDuel();
      });
      extra.querySelector("#cnt-reswap").addEventListener("click", ()=>{ buildRolePick(); });
    }
    /* 开局 */
    if(role==="me"){ myTurn(); }
    else {
      lock = true; setTurn("对方正在报数……");
      later(aiTurn, 600);
    }
  }

  buildRolePick();
  return {
    reveal(){
      revealUsed = true; ctx.markReveal();
      openModal("揭示答案",
        "<p>"+cfg.sol+"</p><p>按这个策略去赢下这一局吧（用「让对方先报」的顺序更容易成功哦）！</p>");
    },
    destroy(){ destroyed = true; cleanup.forEach((t)=>{ clearTimeout(t); clearInterval(t); }); },
  };
}

/* =====================================================================
   岛5：智慧天平屋（饼干钱袋 / 教室人数条形图）
   ===================================================================== */
function makeBalanceIsland(root, ctx, cfg){
  const scenes = cfg.scenes;
  let idx = 0;
  const cleanup = [];
  let destroyed = false;
  function later(fn, ms){ const t = setTimeout(()=>{ if(!destroyed){ fn(); } }, ms); cleanup.push(t); }

  function mountScene(){
    if(destroyed){ return; }
    const sc = scenes[idx];
    if(sc.key==="biscuit"){
      ctx.setSub("第 "+(idx+1)+" / "+scenes.length+" 小关 · 🍪 饼干钱袋");
      ctx.setProblem(BISCUIT_DATA[G.diff].prob);
      buildBiscuit(root);
    } else {
      ctx.setSub("第 "+(idx+1)+" / "+scenes.length+" 小关 · 📏 教室人数");
      ctx.setProblem(BOYS_DATA[G.diff].prob);
      buildBoys(root);
    }
  }
  function sceneDone(sol){
    const banner = document.createElement("div");
    banner.className = "success-banner";
    banner.innerHTML = "🎉 本小关通过！"+sol;
    root.appendChild(banner);
    Confetti.burst(50, window.innerWidth/2, window.innerHeight/3);
    if(idx < scenes.length-1){
      const btn = document.createElement("button");
      btn.className = "mini-btn"; btn.textContent = "➡ 去下一小关";
      btn.style.display = "block"; btn.style.margin = "14px auto";
      btn.addEventListener("click", ()=>{ idx += 1; mountScene(); });
      root.appendChild(btn);
    } else {
      later(()=>{ ctx.done("「智慧天平屋」全部通过！比一比、画一画，难题就变简单啦！"); }, 600);
    }
  }

  /* ---------- 场景A：饼干钱袋（拖价签 → 天平验证 → 拖钱数） ---------- */
  function buildBiscuit(box){
    const d = BISCUIT_DATA[G.diff];
    const tags = shuffle(d.tags);
    const chips = shuffle(d.chips);
    box.innerHTML =
      '<div class="tip-line center">第一步：把一张<b>价签</b>拖到饼干上——如果按这个价格，两种买法算出的钱一样多，天平就会平衡！</div>'+
      '<div style="display:flex;flex-wrap:wrap;gap:18px;justify-content:center;align-items:flex-start">'+
        '<div class="slot-panel" style="text-align:center">'+
          '<div style="font-size:56px">🍪</div>'+
          '<div class="zone" id="bs-slot" style="min-height:56px">每包饼干的价格？拖价签到这里</div>'+
        '</div>'+
        '<div class="slot-panel" style="flex:1;min-width:280px">'+
          '<div class="slot-title">价签（每张都试试看）</div>'+
          '<div class="chip-row" id="bs-tags"></div>'+
          '<div class="bal-wrap">'+
            '<div class="bal-post"></div><div class="bal-base"></div>'+
            '<div class="bal-beam" id="bs-beam"></div>'+
            '<div class="panstring" id="bs-strL" style="left:14%"></div>'+
            '<div class="panstring" id="bs-strR" style="right:14%"></div>'+
            '<div class="pan" id="bs-panL" style="left:3%"></div>'+
            '<div class="pan" id="bs-panR" style="right:3%"></div>'+
          '</div>'+
        '</div>'+
      '</div>'+
      '<div class="tip-line center" id="bs-msg">先拖一张价签试试看！</div>'+
      '<div id="bs-phase2" style="display:none">'+
        '<div class="tip-line center">第二步：价格对啦！那妈妈的钱袋里有多少钱？把钱数拖给钱袋 👛</div>'+
        '<div class="purse-slot zone" id="bs-purse"><span class="purse-emoji">👛</span> 把正确的钱数拖到这里</div>'+
        '<div class="chip-row" id="bs-chips"></div>'+
      '</div>';
    const beam = box.querySelector("#bs-beam");
    const panL = box.querySelector("#bs-panL"), panR = box.querySelector("#bs-panR");
    const strL = box.querySelector("#bs-strL"), strR = box.querySelector("#bs-strR");
    function setPans(m1, m2){
      panL.innerHTML = '<div class="pt">买'+d.buy1+'包的钱＋多的'+fmtJiao(d.extra1)+'</div><div class="pm">'+(m1===null?"？":fmtJiao(m1))+'</div>';
      panR.innerHTML = '<div class="pt">买'+d.buy2+'包的钱−还差的'+fmtJiao(d.short2)+'</div><div class="pm">'+(m2===null?"？":fmtJiao(m2))+'</div>';
      if(m1===null || m2===null){ beam.style.transform = "rotate(0deg)"; return; }
      if(m1===m2){
        beam.style.transform = "rotate(0deg)";
        panL.style.top = "78px"; panR.style.top = "78px";
        strL.style.top = "60px"; strR.style.top = "60px";
      } else {
        beam.style.transform = "rotate("+(m1>m2?4:-4)+"deg)";
        panL.style.top = (m1>m2?"96px":"60px"); panR.style.top = (m1>m2?"60px":"96px");
        strL.style.top = (m1>m2?"78px":"42px"); strR.style.top = (m1>m2?"42px":"78px");
      }
    }
    setPans(null, null);
    let priceFound = false;
    const tagEls = [];
    DragSys.reset((zone, data)=>{
      if(zone==="bs-slot" && !priceFound){
        const m1 = d.buy1*data + d.extra1;
        const m2 = d.buy2*data - d.short2;
        setPans(m1, m2);
        addStep(1);
        if(m1===m2){
          priceFound = true;
          const slot = box.querySelector("#bs-slot");
          slot.style.borderStyle = "solid"; slot.style.background = "#d9f2e3";
          slot.innerHTML = "每包：<b style='font-size:24px'>"+fmtJiao(data)+"</b> ✅ 天平平衡！";
          box.querySelector("#bs-msg").innerHTML = "✨ 按每包 "+fmtJiao(data)+"：买"+d.buy1+"包的钱＋多的"+fmtJiao(d.extra1)+" ＝ 买"+d.buy2+"包的钱−还差的"+fmtJiao(d.short2)+" ＝ <b>"+fmtJiao(m1)+"</b>";
          box.querySelector("#bs-phase2").style.display = "block";
          tagEls.forEach((el)=>{ el.classList.add("locked"); });
          return true;
        }
        box.querySelector("#bs-msg").innerHTML = "按每包 "+fmtJiao(data)+"：两次算出的钱是 "+fmtJiao(m1)+" 和 "+fmtJiao(m2)+"，不相等——天平不平，换一张价签！";
        return false;
      }
      if(zone==="bs-purse" && priceFound){
        if(data === d.money){
          const purse = box.querySelector("#bs-purse");
          purse.style.borderStyle = "solid"; purse.style.background = "#d9f2e3";
          purse.innerHTML = '<span class="purse-emoji">👛💰</span> 妈妈带了 <b style="font-size:26px">'+fmtJiao(d.money)+'</b>！';
          addStep(1);
          sceneDone(BISCUIT_DATA[G.diff].sol);
          return true;
        }
        toast("再算一算：买"+d.buy1+"包的钱＋多出来的"+fmtJiao(d.extra1)+"才是带的钱哦！");
        return false;
      }
      return false;
    });
    DragSys.addZone(box.querySelector("#bs-slot"), "bs-slot");
    tags.forEach((v)=>{
      const chip = document.createElement("div");
      chip.textContent = fmtJiao(v);
      DragSys.addChip(chip, v);
      tagEls.push(chip);
      box.querySelector("#bs-tags").appendChild(chip);
    });
    later(()=>{
      if(destroyed){ return; }
      DragSys.addZone(box.querySelector("#bs-purse"), "bs-purse");
      chips.forEach((v)=>{
        const chip = document.createElement("div");
        chip.textContent = fmtJiao(v);
        DragSys.addChip(chip, v);
        box.querySelector("#bs-chips").appendChild(chip);
      });
    }, 50);
  }

  /* ---------- 场景B：教室人数（拖动条形图手柄） ---------- */
  function buildBoys(box){
    const d = BOYS_DATA[G.diff];
    const maxU = d.max;
    const girlsLeft = d.girls - d.gOut;            // 女生剩下的人数（固定）
    box.innerHTML =
      '<div class="tip-line center">拖动<b>男生条形右端的手柄</b>，让男生「剩下」的人数和女生「剩下」的人数一样多！</div>'+
      '<div class="bar-row bar-girl" id="bb-girl">'+
        '<div class="bar-label">👩 女生：'+d.girls+' 人'+
          '<span style="background:#7bbf7b;color:#fff;border-radius:8px;padding:1px 10px">剩下 '+girlsLeft+' 人 ✅</span>'+
          '<span style="background:#ffe3c2;border-radius:8px;padding:1px 10px">出去 '+d.gOut+' 人</span>'+
        '</div>'+
        '<div class="bar-track" id="bb-gtrack"></div>'+
      '</div>'+
      '<div class="bar-row" id="bb-boy">'+
        '<div class="bar-label">👦 男生：？ 人'+
          '<span id="bb-bseg" style="background:var(--light);border-radius:8px;padding:1px 10px">剩下 ? 人</span>'+
          '<span style="background:#ffe3c2;border-radius:8px;padding:1px 10px">出去 '+d.bOut+' 人</span>'+
        '</div>'+
        '<div class="bar-track" id="bb-btrack"></div>'+
      '</div>'+
      '<div class="live-eq center" id="bb-live"></div>';
    const gTrack = box.querySelector("#bb-gtrack");
    const bTrack = box.querySelector("#bb-btrack");
    /* 女生条：固定 */
    const gRemain = document.createElement("div"); gRemain.className = "seg-remain";
    const gOut = document.createElement("div"); gOut.className = "seg-out";
    gTrack.appendChild(gRemain); gTrack.appendChild(gOut);
    /* 男生条 */
    const bRemain = document.createElement("div"); bRemain.className = "seg-remain";
    const bOut = document.createElement("div"); bOut.className = "seg-out";
    const handle = document.createElement("div"); handle.className = "bar-handle"; handle.textContent = "⇔";
    bTrack.appendChild(bRemain); bTrack.appendChild(bOut); bTrack.appendChild(handle);
    /* 刻度 */
    for(let u=0;u<=maxU;u+=2){
      const tk1 = document.createElement("div"); tk1.className = "unit-tick"; tk1.style.left = (u/maxU*100)+"%";
      gTrack.appendChild(tk1);
      const tk2 = document.createElement("div"); tk2.className = "unit-tick"; tk2.style.left = (u/maxU*100)+"%";
      bTrack.appendChild(tk2);
    }
    let boysN = Math.min(d.max, d.ans + 6);         // 初始给一个偏移值
    let finished = false;
    function layout(){
      const W = bTrack.clientWidth;
      const px = (v)=> v/maxU*W;
      gRemain.style.width = px(girlsLeft)+"px";
      gOut.style.left = px(girlsLeft)+"px"; gOut.style.width = px(d.gOut)+"px";
      const bLeft = Math.max(0, boysN - d.bOut);
      bRemain.style.width = px(bLeft)+"px";
      bOut.style.left = px(bLeft)+"px"; bOut.style.width = Math.min(px(boysN), W-px(bLeft))+"px";
      handle.style.left = (px(boysN)-10)+"px";
      const eq = (boysN - d.bOut) === girlsLeft;
      box.querySelector("#bb-boy").classList.toggle("bar-eq", eq);
      box.querySelector("#bb-bseg").textContent = "剩下 "+bLeft+" 人"+(eq?" ✅":"");
      if(!finished){
        box.querySelector("#bb-live").innerHTML =
          "女生："+d.girls+" − "+d.gOut+" = <b>"+girlsLeft+"</b>（人）　　"+
          "男生："+boysN+" − "+d.bOut+" = <b>"+bLeft+"</b>（人）"+
          (eq ? "　🎉 相等！松手看看吧" : "　还不相等，继续拖");
      }
    }
    requestAnimationFrame(layout);
    const onRs = ()=>{ layout(); };
    window.addEventListener("resize", onRs);
    cleanup.push(()=>{ window.removeEventListener("resize", onRs); });
    let dragging = false;
    handle.addEventListener("pointerdown", (e)=>{
      if(finished){ return; }
      e.preventDefault(); dragging = true;
      try{ handle.setPointerCapture(e.pointerId); }catch(err){ /* 忽略 */ }
    });
    handle.addEventListener("pointermove", (e)=>{
      if(!dragging || finished){ return; }
      const r = bTrack.getBoundingClientRect();
      boysN = Math.max(d.bOut, Math.min(maxU, Math.round((e.clientX-r.left)/r.width*maxU)));
      layout();
    });
    handle.addEventListener("pointerup", ()=>{
      if(!dragging || finished){ return; }
      dragging = false; addStep(1);
      if(boysN === d.ans){
        finished = true;
        box.querySelector("#bb-live").innerHTML =
          "🎉 男生："+d.ans+" − "+d.bOut+" = "+(d.ans-d.bOut)+"（人），和女生剩下的相等！<br>"+
          "教室里原来有 <b style='font-size:26px;color:#14683b'>"+d.ans+" 名男同学</b>！";
        sceneDone(BOYS_DATA[G.diff].sol);
      } else {
        toast("剩下的人数还不相等哦——想想女生剩下几人？男生也要剩下几人？");
      }
    });
  }

  mountScene();
  return {
    reveal(){
      ctx.markReveal();
      const sc = scenes[idx];
      let html = "";
      if(sc.key==="biscuit"){ html = "<p>"+BISCUIT_DATA[G.diff].sol+"</p>"; }
      else { html = "<p>"+BOYS_DATA[G.diff].sol+"</p>"; }
      openModal("揭示答案", html+"<p>看完提示后，请继续完成操作哦！</p>");
    },
    destroy(){
      destroyed = true;
      cleanup.forEach((t)=>{
        if(typeof t === "function"){ t(); }
        else { clearTimeout(t); clearInterval(t); }
      });
    },
  };
}

/* =====================================================================
   游戏框架：难度选择 → 岛屿流程 → 完成页
   ===================================================================== */

  { key:"draw",    name:"岛1 · 一笔画星阵", emoji:"✏️" },
  { key:"p24",     name:"岛2 · 24点合体工坊", emoji:"🃏" },

];

function showScreen(id){
  $$(".screen").forEach((s)=>{ s.classList.remove("active"); });

  $$(".hide-in-home").forEach((b)=>{ b.style.display = inGame ? "" : "none"; });

function buildPlan(diff){
  /* 反重复机制：每局随机抽题/抽场景/洗牌 */
  const gapKeys = shuffle(["bus","queue","stairs","flags"]).slice(0,2);
  const balKeys = (diff===3) ? shuffle(["biscuit","boys"]) : [pick(["biscuit","boys"])];
  return [
    { key:"draw", cfg:{ graph: pick(DRAW_POOL[diff]) } },
    { key:"p24",  cfg:(function(){
        const s = pick(SET24[diff]);
        return { cards: shuffle(s.cards), sol: s.sol };
      })() },
    { key:"gap",  cfg:{ scenes: gapKeys.map((k)=>({ key:k, cfg:GAP_DATA[k].cfg[diff] })) } },
    { key:"count",cfg: COUNT_DATA[diff] },
    { key:"balance", cfg:{ scenes: balKeys.map((k)=>({ key:k })) } },
  ];
}

function mountIsland(){

  const area = $("#play-area");
  area.innerHTML = "";
  $("#island-actions").innerHTML = "";
  const ctxObj = {
    setProblem(html){ $("#problem-card").innerHTML = '<span class="src">题目</span><br>'+html; },
    setSub(txt){ $("#island-sub").textContent = txt; },
    markReveal(){ G.curRevealUsed = true; },
    done(msg){
      const stars = islandStars();
      G.stars += stars; $("#hud-stars").textContent = G.stars;
      const banner = document.createElement("div");
      banner.className = "success-banner";
      banner.innerHTML = "⭐".repeat(stars)+" 本关通过！"+msg;
      $("#island-actions").appendChild(banner);

  /* 各岛初始题目文案 */
  const INIT_PROB = {
    draw:"操作题第2题：下面的图形能不能一笔画成？如果能量一笔画成，就亲手把它一笔画出来！（每局图形随机出现）<br><b>小锦囊（试卷提示）</b>：连出奇数条线的点叫<b>奇点</b>；奇点是 0 个或 2 个才能一笔画成，有 2 个奇点时必须从一个奇点出发！",
    p24:"操作题第1题：用给出的四张扑克牌算出 24——点一张牌、点运算符号、再点另一张牌，两张牌合体成一张新牌，一路合体到最后剩下的正好是 24 就赢啦！（每局牌组随机出现）",
    gap:"间隔问题大挑战：动手摆一摆，找到隐藏的“间隔”！",
    count:"轮流报数比智慧：先选先后手，再和电脑一轮一轮报数，谁先报到目标数谁赢！",
    balance:"比一比、拖一拖：用天平和条形图找出隐藏的数量！",
  };
  ctxObj.setProblem(INIT_PROB[plan.key]);
  ctxObj.setSub("");
  G.island = ISLAND_MAKERS[plan.key](area, ctxObj, plan.cfg);
}

function startGame(diff){
  G.diff = diff;
  G.steps = 0; G.stars = 0; G.reveals = 0; G.islandIdx = 0;
  $("#hud-steps").textContent = "0"; $("#hud-stars").textContent = "0";
  applyPalette();
  G.plan = buildPlan(diff);
  showScreen("screen-game");
  startTimer();
  mountIsland();
  if(G.firstRules){
    G.firstRules = false;
    setTimeout(()=>{ openRules(); }, 350);
  }
}

function finishGame(){
  stopTimer();
  showScreen("screen-done");
  $("#done-time").textContent = fmtTime(G.sec);
  $("#done-steps").textContent = G.steps+" 步";
  $("#done-starcount").textContent = G.stars+" / 15";
  $("#done-stars").textContent = "⭐".repeat(Math.max(1,G.stars));
  let title = "勇气小达人";
  if(G.stars >= 13){ title = "👑 智慧大师"; }
  else if(G.stars >= 9){ title = "🌟 闯关能手"; }
  $("#done-title").textContent = title;
  $("#done-say").innerHTML = "你依次闯过了<b>一笔画、24点、间隔问题、报数策略、盈亏与人数</b>五座小岛——这正是《能力测试卷（四）》的全部核心题型！换个难度再来一局，题目和颜色都会重新随机哦！";
  Confetti.burstFromTop();
  setTimeout(()=>{ Confetti.burstFromTop(); }, 900);
}

/* ---------------- 规则面板 ---------------- */
function openRules(){
  openModal("🏝️ 游戏规则与玩法", `
    <p><b>目标</b>：依次闯过 5 座智慧小岛，收集尽可能多的星星（每关最多 3 颗，使用「揭示答案」会少得 1 颗）。</p>
    <p><b>✏️ 岛1 一笔画星阵</b>：从一个圆点出发，沿线条拖动（或连续点击相邻的点），把所有线一笔画完，每条线只能画一次。走不通就「撤销一步」换个方向。</p>
    <p><b>🃏 岛2 24点合体工坊</b>：点一张牌 → 点 ＋－×÷ → 再点另一张牌，两张牌合体成一张新牌；四张牌一路合体，最后正好剩下 24 就赢。除不尽、减出负数都不行哦。</p>
    <p><b>🚌 岛3 间隔魔法镇</b>：两个随机小关（发车 / 排队 / 爬楼 / 插旗），都要<b>动手拖</b>：拖车、拖人、拖卡、拖旗，把“间隔”摆出来答案就出来了。</p>
    <p><b>📣 岛4 报数小擂台</b>：先拖棋子选“我先报/对方先报”，再在数字条上按住拖选连续的数报出去。想确保获胜，先想想目标数除以“每次最多报数+1”有没有余数！</p>
    <p><b>⚖️ 岛5 智慧天平屋</b>：拖价签让天平平衡找出单价，再拖钱数放进钱袋；或拖动条形图手柄，让两边“剩下”的人数一样多。</p>
    <p><b>顶部按钮</b>：「揭示答案」看本关思路；「重新开始」重玩本关；「返回难度选择」回到首页。右上角实时显示<b>用时</b>和<b>步数</b>。</p>
    <p style="color:#986">每局题目、场景、颜色都会随机刷新，多玩几遍也不重样！</p>
  `);
}

/* ---------------- 事件绑定与启动 ---------------- */
function init(){
  Confetti.init();
  $$(".diff-card").forEach((card)=>{
    card.addEventListener("click", ()=>{ startGame(+card.dataset.diff); });
  });
  $("#btn-rules").addEventListener("click", openRules);
  $("#modal-close").addEventListener("click", closeModal);
  $("#modal-mask").addEventListener("click", (e)=>{ if(e.target.id==="modal-mask"){ closeModal(); } });
  $("#btn-reveal").addEventListener("click", ()=>{
    if(G.island && G.island.reveal){ G.island.reveal(); }
  });
  $("#btn-restart").addEventListener("click", ()=>{
    if(!$("#screen-game").classList.contains("active")){ return; }
    /* 重新生成本关随机数据并重挂载 */
    G.plan[G.islandIdx] = buildPlan(G.diff)[G.islandIdx];
    mountIsland();
    toast("本关已重新开始，题目重新随机！");
  });
  $("#btn-home").addEventListener("click", ()=>{
    stopTimer();
    if(G.island){ G.island.destroy(); G.island = null; }
    showScreen("screen-home");
  });
  $("#btn-again").addEventListener("click", ()=>{ startGame(G.diff); });
  $("#btn-backhome").addEventListener("click", ()=>{
    showScreen("screen-home");
  });
  showScreen("screen-home");
}
init();
</script>
