<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>青草大管家 · 牛顿问题互动探险</title>
<style>
/* ============ 基础与色板 ============ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --pri:#2f9e55; --prd:#1f7a3e; --acc:#f4a017; --bg:#eef9f0;
  --pn:#ffffff; --ink:#22303a; --mut:#5d707e; --line:#d6e4da;
  --ok:#1c9e5a; --bad:#e24a4a; --soft:#eef7f0;
}
html{font-size:18px}
body{
  font-family:"Microsoft YaHei","PingFang SC","SimHei",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.55;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.screen{display:none;min-height:100vh}
.screen.active{display:block}
.wrap{max-width:1100px;margin:0 auto;padding:16px}

/* ============ 首页 ============ */
#scr-title{display:none;align-items:center;justify-content:center}
#scr-title.active{display:flex}
.tcard{background:var(--pn);border-radius:26px;box-shadow:0 10px 34px rgba(30,90,50,.14);
  padding:44px 36px 30px;text-align:center;max-width:640px;margin:24px auto;border-top:10px solid var(--pri)}
.ticon{font-size:56px;letter-spacing:8px}
.tcard h1{font-size:44px;color:var(--prd);margin:10px 0 4px;letter-spacing:6px}
.tsub{font-size:22px;color:var(--acc);font-weight:bold;margin-bottom:12px}
.tdesc{font-size:18px;color:var(--mut);margin-bottom:22px}
.tbtns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.bigbtn{background:var(--pri);color:#fff;font-size:22px;font-weight:bold;
  padding:14px 40px;border-radius:16px;box-shadow:0 5px 0 var(--prd);transition:transform .1s}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--prd)}
.bigbtn.ghost{background:#fff;color:var(--pri);border:3px solid var(--pri);box-shadow:0 5px 0 var(--line)}
.bigbtn.warn{background:var(--acc);box-shadow:0 5px 0 #c07c0a}
.bigbtn:disabled{opacity:.45;cursor:not-allowed}
.tfoot{font-size:15px;color:var(--mut)}

/* ============ 难度选择 ============ */
.dh{font-size:30px;color:var(--prd);text-align:center;margin:26px 0 6px}
.dsub{text-align:center;color:var(--mut);margin-bottom:22px}
.dcards{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.dcard{background:var(--pn);border-radius:20px;padding:22px 20px 18px;width:300px;text-align:left;
  border:3px solid var(--line);box-shadow:0 6px 18px rgba(30,90,50,.08);transition:transform .12s,border-color .12s}
.dcard:hover{transform:translateY(-4px);border-color:var(--pri)}
.dtag{display:inline-block;background:var(--acc);color:#fff;font-weight:bold;border-radius:10px;
  padding:2px 14px;font-size:17px;margin-bottom:8px}
.dcard[data-d="3"] .dtag{background:#e24a8f}
.dcard[data-d="2"] .dtag{background:#2b8cd6}
.dname{font-size:26px;font-weight:bold;color:var(--prd)}
.dlist{font-size:17px;margin:8px 0 4px;color:var(--ink)}
.dnote{font-size:15px;color:var(--mut)}
.linkbtn{display:block;margin:26px auto;padding:10px 24px;min-height:44px;border-radius:14px;color:var(--mut);font-size:17px;text-decoration:underline;transition:color .12s,background .12s}
.linkbtn:hover{color:var(--prd);background:var(--soft)}

/* ============ 关卡页头部 ============ */
.lhead{position:sticky;top:0;z-index:30;background:var(--pn);border-bottom:3px solid var(--line);
  box-shadow:0 2px 10px rgba(30,60,40,.06)}
.lheadin{max-width:1100px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;
  justify-content:space-between;gap:10px;flex-wrap:wrap}
.lname{font-size:20px;font-weight:bold;color:var(--prd)}
.lmeta{font-size:17px;color:var(--mut);display:flex;gap:16px;align-items:center}
.lmeta b{color:var(--ink);font-size:19px}
.lbtns{display:flex;gap:8px;flex-wrap:wrap}
.sbtn{background:var(--soft);border:2px solid var(--line);border-radius:10px;padding:6px 12px;font-size:16px}
.sbtn:hover{border-color:var(--pri);color:var(--prd)}

/* ============ 任务卡 ============ */
.taskcard{background:var(--pn);border-radius:18px;border-left:10px solid var(--acc);
  padding:16px 20px;margin:16px 0;box-shadow:0 4px 14px rgba(30,90,50,.07)}
.taskcard h3{color:var(--acc);font-size:19px;margin-bottom:6px}
.tasktext{font-size:19px;line-height:1.8}
.taskbase{margin-top:8px;background:var(--soft);border-radius:10px;padding:8px 12px;font-size:17px;color:var(--prd);font-weight:bold}
.taskask{margin-top:8px;font-size:20px;font-weight:bold;color:#c05621}

/* ============ 阶段标签 ============ */
.ptabs{display:flex;gap:12px;margin:14px 0;flex-wrap:wrap}
.ptab{flex:1;min-width:170px;background:var(--pn);border:3px solid var(--line);border-radius:14px;
  padding:10px 12px;font-size:19px;font-weight:bold;text-align:left;position:relative;color:var(--mut)}
.ptab .pstep{font-size:15px;display:block;color:var(--acc);font-weight:bold}
.ptab.cur{border-color:var(--pri);color:var(--prd);background:var(--soft)}
.ptab.lock{opacity:.55}
.ptab.done::after{content:"✓";position:absolute;right:12px;top:10px;color:var(--ok);font-size:22px}
.pane{display:none;background:var(--pn);border-radius:18px;padding:18px 20px;
  box-shadow:0 4px 14px rgba(30,90,50,.07)}
.pane.on{display:block}
.pane h4{font-size:21px;color:var(--prd);margin-bottom:4px}
.pnote{font-size:17px;color:var(--mut);margin-bottom:12px}

/* ============ 画布 ============ */
.cvwrap{position:relative;margin:8px 0 14px}
canvas.cv{width:100%;height:320px;display:block;border-radius:16px;background:#dff0e6;
  border:3px solid var(--line);touch-action:none}
@media (max-width:640px){canvas.cv{height:250px}}

/* ============ 滑块/标尺 ============ */
.slbox{margin:6px 0 14px}
.sllab{display:flex;justify-content:space-between;font-size:18px;font-weight:bold;margin-bottom:4px}
.sllab .val{color:var(--prd);font-size:21px}
.slider{position:relative;height:46px;background:var(--soft);border:3px solid var(--line);
  border-radius:23px;touch-action:none}
.sfill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--pri),var(--acc));
  opacity:.35;border-radius:23px 0 0 23px}
.shandle{position:absolute;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
  background:var(--pn);border:5px solid var(--pri);box-shadow:0 3px 8px rgba(0,0,0,.2);
  display:flex;align-items:center;justify-content:center;font-size:22px;touch-action:none;cursor:grab}
.ruler{position:relative;height:64px;background:var(--soft);border:3px solid var(--line);
  border-radius:12px;touch-action:none;margin:6px 0}
.rtick{position:absolute;bottom:0;width:2px;height:12px;background:#b9cbc0}
.rnum{position:absolute;bottom:16px;font-size:16px;color:var(--mut);transform:translateX(-50%)}
.rhandle{position:absolute;top:2px;width:46px;height:34px;margin-left:-23px;border-radius:10px;
  background:var(--acc);color:#fff;font-weight:bold;font-size:17px;display:flex;align-items:center;
  justify-content:center;box-shadow:0 3px 6px rgba(0,0,0,.25);touch-action:none;cursor:grab}

/* ============ 按钮 ============ */
.rowbtns{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}
.mbtn{background:var(--pri);color:#fff;font-size:19px;font-weight:bold;padding:10px 26px;
  border-radius:12px;box-shadow:0 4px 0 var(--prd)}
.mbtn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--prd)}
.mbtn.org{background:var(--acc);box-shadow:0 4px 0 #c07c0a}
.mbtn.gray{background:#8fa39a;box-shadow:0 4px 0 #6c8078}

/* ============ 侦探笔记 ============ */
.nbook{width:100%;border-collapse:collapse;margin-top:10px;font-size:17px}
.nbook th{background:var(--soft);color:var(--prd);padding:7px 8px;border:2px solid var(--line);font-size:17px}
.nbook td{padding:7px 8px;border:2px solid var(--line);text-align:center}
.nbook .off{background:#fff8e8;font-weight:bold}
.unlocktip{margin-top:12px;background:#fff8e8;border:2px dashed var(--acc);border-radius:12px;
  padding:10px 14px;font-size:17px;color:#9a6a10}

/* ============ 推理屋 ============ */
.frow{border:3px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px;background:#fff}
.frow.ok{border-color:var(--ok);background:#f2fcf6}
.frow.dim{opacity:.5}
.frow.shake{animation:shk .5s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.fstep{font-size:16px;color:var(--acc);font-weight:bold}
.flabel{font-size:20px;font-weight:bold;color:var(--prd);margin-bottom:8px}
.fexpr{font-size:24px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:bold}
.op{color:var(--ink)}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:74px;height:52px;
  border:3px dashed #a8c3b0;border-radius:12px;font-size:23px;background:#fbfefc;color:var(--prd);padding:0 8px}
.slot.fill{border-style:solid;border-color:var(--pri);background:var(--soft)}
.slot.hot{border-color:var(--acc);box-shadow:0 0 0 3px rgba(244,160,23,.35)}
.fres{font-size:21px;color:var(--ok);margin-left:8px}
.ftray{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;min-height:64px;
  background:var(--soft);border-radius:12px;padding:10px}
.chip{background:#fff;border:3px solid var(--pri);border-radius:12px;padding:4px 12px;text-align:center;
  box-shadow:0 3px 0 var(--line);touch-action:none;user-select:none;cursor:grab}
.chip b{display:block;font-size:22px;color:var(--prd)}
.chip i{display:block;font-style:normal;font-size:14px;color:var(--mut)}
.chip.used{display:none}
.chip.sel{border-color:var(--acc);box-shadow:0 0 0 4px rgba(244,160,23,.4)}
.chip.ghost{position:fixed;z-index:99;opacity:.92;pointer-events:none;transform:rotate(-4deg) scale(1.06)}
.fhint{margin-top:8px;font-size:17px;color:#c05621;background:#fff4ec;border-radius:10px;padding:8px 12px}
.hidden{display:none!important}
.intel{background:linear-gradient(135deg,#fff8e8,#fdffe9);border:3px solid var(--acc);border-radius:16px;
  padding:14px 18px;margin-top:6px}
.intel h5{font-size:20px;color:#9a6a10;margin-bottom:8px}
.icards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.icard{background:#fff;border:2px solid var(--acc);border-radius:12px;padding:8px 16px;font-size:19px;font-weight:bold;color:#9a6a10}
.icard b{color:#c05621;font-size:22px}

/* ============ 调度台 ============ */
.szone{position:relative}
.sdrop{min-height:64px;border:3px dashed #a8c3b0;border-radius:14px;background:#f7fcf8;
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px;margin:8px 0;font-size:18px;color:var(--mut)}
.tok{background:#fff;border:3px solid var(--pri);border-radius:12px;padding:6px 12px;font-size:21px;
  font-weight:bold;color:var(--prd);box-shadow:0 3px 0 var(--line);touch-action:none;user-select:none;cursor:grab}
.tok i{font-style:normal;font-size:15px;color:var(--mut);display:block;font-weight:normal}
.placed{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.ptok{background:var(--soft);border:2px solid var(--pri);border-radius:10px;padding:4px 10px;font-size:18px;font-weight:bold}
.ptok u{cursor:pointer;color:var(--bad);text-decoration:none;margin-left:6px}
.spred{background:var(--soft);border-radius:14px;padding:12px 16px;font-size:19px;margin:10px 0;
  border-left:8px solid var(--pri)}
.spred b{font-size:23px;color:var(--prd)}
.spred.match{border-left-color:var(--ok);background:#effcf3;animation:pop .5s}
.spred.nomatch{border-left-color:var(--acc)}
@keyframes pop{0%{transform:scale(.96)}55%{transform:scale(1.03)}100%{transform:scale(1)}}
.fixeddesc{font-size:20px;font-weight:bold;color:var(--prd);background:var(--soft);
  border-radius:12px;padding:8px 14px;display:inline-block;margin:6px 0}
.rembox{display:flex;align-items:center;gap:14px;margin:10px 0;flex-wrap:wrap}
.rembar{flex:1;min-width:180px;height:34px;background:#eef3ef;border:3px solid var(--line);border-radius:17px;overflow:hidden;position:relative}
.remfill{height:100%;background:linear-gradient(90deg,#69c17f,#2f9e55);width:100%;transition:width .15s}
.remfill.zero{background:var(--acc)}
.remtxt{font-size:19px;font-weight:bold}
.remtxt.zero{color:#c05621}
.qnote{font-size:17px;color:var(--mut);background:var(--soft);border-radius:10px;padding:6px 12px;display:inline-block;margin:4px 0}

/* ============ 模态框 ============ */
.mwrap{position:fixed;inset:0;background:rgba(20,40,28,.5);z-index:60;display:flex;
  align-items:center;justify-content:center;padding:18px}
.mcard{background:#fff;border-radius:22px;max-width:660px;width:100%;max-height:86vh;overflow:auto;
  padding:26px 28px;border-top:10px solid var(--pri);box-shadow:0 16px 50px rgba(0,0,0,.3)}
.mcard h3{font-size:26px;color:var(--prd);margin-bottom:12px}
.mcard .mbody{font-size:18px;line-height:1.8}
.mcard .mbody p{margin-bottom:8px}
.mcard .mbody .sol{background:var(--soft);border-radius:12px;padding:12px 16px;font-size:18px;line-height:2}
.mcard .mbody ul{margin:6px 0 10px 24px}
.mbtns{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
.stars{font-size:34px;letter-spacing:8px;margin-bottom:8px}
.recap{background:#fffbe9;border:2px solid var(--acc);border-radius:12px;padding:10px 16px;margin:10px 0}
.recap p{margin:3px 0;font-size:18px}

/* ============ 提示浮层 ============ */
.toastc{position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(20px);z-index:80;
  background:rgba(34,48,58,.92);color:#fff;padding:12px 26px;border-radius:14px;font-size:19px;
  opacity:0;transition:all .3s;pointer-events:none;max-width:86vw;text-align:center}
.toastc.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ 结算页 ============ */
.finbox{text-align:center;padding:40px 16px}
.finbox h2{font-size:38px;color:var(--prd);margin:12px 0}
.finbox .fstats{font-size:20px;color:var(--mut);margin-bottom:24px}
#confettiCv{position:fixed;inset:0;pointer-events:none;z-index:70}
</style>
</head>
<body>
<div id="app">

  <!-- 首页 -->
  <section id="scr-title" class="screen active">
    <div class="tcard">
      <div class="ticon">🐮🌱🐑</div>
      <h1>青草大管家</h1>
      <p class="tsub">牛顿问题（牛吃草）互动探险</p>
      <p class="tdesc">草在长、羊在吃——先实验、再推理、后调度，<br>亲手揭开「每天新长的草」和「原有的草」的秘密！</p>
      <div class="tbtns">
        <button class="bigbtn" id="btnStart" type="button">开始探险</button>
        <button class="bigbtn ghost" id="btnRulesT" type="button">玩法规则</button>
      </div>
      <p class="tfoot">改编自《奥数起跑线》P5 · 第29讲 牛顿问题</p>
    </div>
  </section>

  <!-- 难度选择 -->
  <section id="scr-diff" class="screen">
    <div class="wrap">
      <h2 class="dh">选择难度，开始今天的牧场任务</h2>
      <p class="dsub">每局随机抽取关卡顺序与配色，玩几次都不重样</p>
      <div class="dcards">
        <button class="dcard" data-d="1" type="button">
          <span class="dtag">初级</span>
          <div class="dname">新芽牧场</div>
          <div class="dlist">羊群吃草 · 抽水小队 · 舀水救援</div>
          <div class="dnote">经典牛吃草：算出需要多少位「小管家」</div>
        </button>
        <button class="dcard" data-d="2" type="button">
          <span class="dtag">中级</span>
          <div class="dname">清泉农场</div>
          <div class="dlist">极速抽水 · 吃不完的秘密 · 车站疏导</div>
          <div class="dnote">反向求解时间 · 永远吃不完的平衡点</div>
        </button>
        <button class="dcard" data-d="3" type="button">
          <span class="dtag">高级</span>
          <div class="dname">丰收大地</div>
          <div class="dlist">降温牧场 · 牛羊混编 · 双场调度 · 三块草地</div>
          <div class="dnote">草会减少 · 牛羊换算 · 面积倍数综合挑战</div>
        </button>
      </div>
      <button class="linkbtn" id="btnBackTitle" type="button">返回首页</button>
    </div>
  </section>

  <!-- 关卡（由脚本生成内容） -->
  <section id="scr-level" class="screen"><div id="levelHost"></div></section>
</div>

<!-- 通用模态框 -->
<div id="modal" class="mwrap hidden">
  <div class="mcard">
    <h3 id="mTitle">标题</h3>
    <div class="mbody" id="mBody"></div>
    <div class="mbtns" id="mBtns"></div>
  </div>
</div>
<div id="toast" class="toastc"></div>
<canvas id="confettiCv"></canvas>

<script>
"use strict";
/* ==================================================================
   青草大管家 · 牛顿问题（牛吃草）互动游戏
   核心方法：设 1 个吃草者 1 天(分钟/小时/周)的消耗量为 1 份，
   由两组方案求出 每天新增量 g = (总耗1-总耗2)÷(时间1-时间2)，
   再求 原有量 o = 总耗1 - g×时间1，最后完成目标调度。
   游戏三步：实验台(拖滑块做实验) -> 推理屋(拖卡片拼公式) -> 调度台(拖动物/拖时间标尺验证)
   ================================================================== */

/* ---------- 小工具 ---------- */
function $(s){return document.querySelector(s);}
function $$(s){return Array.from(document.querySelectorAll(s));}
function fmt(x){ /* 数字显示：最多两位小数 */
  var r=Math.round(x*100)/100;
  return String(r);
}
function fmtD(x){ /* 天数显示：一位小数 */
  if(!isFinite(x)){return "∞";}
  var r=Math.round(x*10)/10;
  return String(r);
}
function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}
var toastTimer=0;
function toast(msg){
  var t=$("#toast");
  t.textContent=msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove("show");},2400);
}

/* ---------- 随机色板（每关随机换装） ---------- */
var PALETTES=[
 {pri:"#2f9e55",prd:"#1f7a3e",acc:"#f4a017",bg:"#eef9f0",line:"#cfe6d6",soft:"#eef7f0"},
 {pri:"#2b8cd6",prd:"#1d6aa8",acc:"#f6a01d",bg:"#edf6fe",line:"#cbe2f2",soft:"#eef6fd"},
 {pri:"#e8823c",prd:"#c0662a",acc:"#2b8cd6",bg:"#fdf3ec",line:"#f0dcc9",soft:"#fdf2ea"},
 {pri:"#8a5cd6",prd:"#6f46ad",acc:"#f6a01d",bg:"#f5f1fc",line:"#e0d5f2",soft:"#f4effc"},
 {pri:"#14a08d",prd:"#0f8072",acc:"#f0716d",bg:"#ecfaf7",line:"#c8ece5",soft:"#ebf9f6"},
 {pri:"#d95f8f",prd:"#b44a75",acc:"#3aa7a3",bg:"#fdf0f6",line:"#f2d3e0",soft:"#fdeff5"}
];
function applyPalette(){
  var pal=PALETTES[Math.floor(Math.random()*PALETTES.length)];
  var r=document.documentElement.style;
  r.setProperty("--pri",pal.pri);
  r.setProperty("--prd",pal.prd);
  r.setProperty("--acc",pal.acc);
  r.setProperty("--bg",pal.bg);
  r.setProperty("--line",pal.line);
  r.setProperty("--soft",pal.soft);
}

/* ==================================================================
   题库：全部取自 docx《第29讲 牛顿问题》例题与思考练习
   每关数据：g=每天新增量(份)，o=原有量(份)；负数 g 表示每天自然减少
   ================================================================== */

/* ---------- 模拟计算 ---------- */
function simDays(p,n,predO,predG){
 var rate=p.ratePer*n;
 var net=rate-predG;
 if(net<=1e-9){return Infinity;}
 return predO/net;
}

/* ---------- 动画播放（关键帧预渲染 + 画布池复用 + 图像翻页） ---------- */
var framePool=[]; /* 离屏画布池：全游戏循环复用，避免频繁新建画布 */
function acquireFrame(W,H){
 for(var i=0;i<framePool.length;i++){
   if(!framePool[i].busy){
     framePool[i].busy=true;
     if(framePool[i].cv.width!==W||framePool[i].cv.height!==H){
       framePool[i].cv.width=W;framePool[i].cv.height=H;
     }
     return framePool[i];
   }
 }
 var item={cv:document.createElement("canvas"),busy:true};
 item.cv.width=W;item.cv.height=H;
 framePool.push(item);
 return item;
}
function playAnim(cv,p,cfg,onDone){
 var seq=++animSeq;
 var T=cfg.T;
 var c0=ctxOf(cv), W=Math.max(1,Math.round(c0.w)), H=Math.max(1,Math.round(c0.h));
 /* 1) 一次性把若干关键帧渲染到离屏画布（池化复用） */
 var FRAMES=Math.max(8,Math.min(14,Math.ceil(T)));
 var frames=[],fi,t,amt,item;
 for(fi=0;fi<FRAMES;fi++){
   t=T*(fi/(FRAMES-1));
   amt=cfg.predO+cfg.predG*t-cfg.rate*t;
   item=acquireFrame(W,H);
   drawScene(item.cv,p,{
     day:t,ratio:Math.max(0,amt/cfg.predO),amount:amt,
     n:cfg.n,active:cfg.active,activeField:cfg.activeField,amountTotal:cfg.amountTotal,
     line1:cfg.line1,line2:cfg.line2
   });
   frames.push(item);
 }
 /* 2) 播放：只做 drawImage 翻页 */
 var dur=Math.max(1500,Math.min(4800,T*160));
 var st=null;
 function frame(ts){
   if(seq!==animSeq){return;} /* 已取消 */
   if(st==null){st=ts;}
   var k=Math.min(1,(ts-st)/dur);
   var idx2=Math.min(frames.length-1,Math.floor(k*frames.length));
   var ctx=cv.getContext("2d");
   ctx.setTransform(1,0,0,1,0,0);
   ctx.clearRect(0,0,cv.width,cv.height);
   ctx.drawImage(frames[idx2].cv,0,0,cv.width,cv.height);
   if(k<1){requestAnimationFrame(frame);}
   else{
     /* 释放池中画布，收尾延后到动画帧之外执行 */
     frames.forEach(function(it){it.busy=false;});
     setTimeout(function(){
       if(seq===animSeq){ onDone(T,cfg.predO+cfg.predG*T-cfg.rate*T); }
     },60);
   }
 }
 requestAnimationFrame(frame);
}

/* ---------- 通用滑块（指针拖动） ---------- */
function makeSlider(mount,min,max,val,onInput){
 var fill=mount.querySelector(".sfill"),handle=mount.querySelector(".shandle");
 if(!fill||!handle){return;}
 var cur=val;
 function setV(v,fire){
   v=Math.max(min,Math.min(max,Math.round(v)));
   cur=v;
   var pct=max>min?((v-min)/(max-min))*100:0;
   if(fill){fill.style.width=pct+"%";}
   handle.style.left=pct+"%";
   if(fire!==false){onInput(v);}
 }
 function fromEvent(ev){
   var r=mount.getBoundingClientRect();
   var ratio=(ev.clientX-r.left)/Math.max(1,r.width);
   setV(min+ratio*(max-min));
 }
 var dragging=false;
 mount.addEventListener("pointerdown",function(ev){
   dragging=true;
   try{mount.setPointerCapture(ev.pointerId);}catch(err){}
   fromEvent(ev);
   ev.preventDefault();
 });
 mount.addEventListener("pointermove",function(ev){ if(dragging){fromEvent(ev);} });

function slotCount(pat){

}
function exprHTML(pat){

function fillTray(p,ri){
 var tray=$("#tray"+ri); if(!tray){return;}
 tray.innerHTML="";
 var r=p.rows[ri];
 shuffle(r.chips.concat(r.decoys)).forEach(function(c){

 });
 /* 激活该行视觉 */
 $$(".frow").forEach(function(el,idx){
   el.classList.toggle("dim",idx>ri&&!S.rowStates[idx].done);
 });
 tray.parentElement.classList.remove("dim");
}
function acceptSlot(el){
 return el.classList&&el.classList.contains("slot")&&!el.classList.contains("fill");
}
function tapChip(chip){
 if(S.selChip===chip){
   chip.classList.remove("sel");S.selChip=null;
   $$(".slot.hot").forEach(function(s){s.classList.remove("hot");});
   return;
 }
 $$(".chip.sel").forEach(function(c){c.classList.remove("sel");});
 $$(".slot.hot").forEach(function(s){s.classList.remove("hot");});
 S.selChip=chip;
 chip.classList.add("sel");
 /* 高亮可放置的空槽 */
 $$(".frow").forEach(function(row){
   var ri=+row.dataset.ri;
   if(!S.rowStates[ri].done){
     row.querySelectorAll(".slot").forEach(function(s){
       if(!s.classList.contains("fill")){s.classList.add("hot");}
     });
   }
 });
 toast("已选中卡片 "+chip.dataset.val+"，再点一个发亮的空槽放进去");
}
function placeChip(chip,slot){
 var row=slot.closest(".frow");
 var ri=+row.dataset.ri;
 if(S.rowStates[ri].done){return;}
 var si=+slot.dataset.si;
 if(S.rowStates[ri].filled[si]){return;}
 slot.textContent=chip.dataset.val;
 slot.dataset.cid=chip.dataset.cid;
 slot.classList.add("fill");
 chip.classList.add("used");
 if(S.selChip===chip){S.selChip=null;}
 chip.classList.remove("sel");
 S.rowStates[ri].filled[si]=chip.dataset.cid;
 addStep();
 checkRow(S.p,ri);
}
function checkRow(p,ri){
 var st=S.rowStates[ri],r=p.rows[ri];
 if(st.filled.some(function(v){return !v;})){return;}
 var ok=st.filled.every(function(cid,i){return cid===r.ans[i];});
 if(ok){
   st.done=true;
   var row=$$(".frow")[ri];
   row.classList.add("ok");
   row.classList.remove("dim");
   $("#fres"+ri).classList.remove("hidden");
   $$("#tray"+ri+" .chip").forEach(function(c){c.remove();});
   $("#tray"+ri).innerHTML='<span style="font-size:17px;color:var(--ok)">✓ 这一步拼对啦！</span>';
   confetti(900);
   if(ri+1<p.rows.length){
     fillTray(p,ri+1);
     toast("第 "+["一","二","三","四"][ri]+" 步完成！继续下一步～");
   }else{
     S.deduceDone=true;
     $("#intelBox").classList.remove("hidden");
     updateTabs();
     confetti(1600);
     toast("关键情报全部点亮！调度台已解锁！");
   }
 }else{
   st.attempts++;
   var row2=$$(".frow")[ri];
   row2.classList.add("shake");
   setTimeout(function(){row2.classList.remove("shake");},520);
   if(st.attempts>=2){$("#fhint"+ri).classList.remove("hidden");}
   setTimeout(function(){
     row2.querySelectorAll(".slot.fill").forEach(function(sl){
       var cid=sl.dataset.cid;
       var chip=$("#tray"+ri+" .chip[data-cid='"+cid+"']");
       if(chip){chip.classList.remove("used");}
       sl.textContent="";
       sl.classList.remove("fill");
       delete sl.dataset.cid;
     });
     st.filled=new Array(st.filled.length).fill(null);
     toast("这一步还差一点，卡片已退回，再想想～");
   },600);
 }
}

/* ---------- 通用拖拽（指针事件，兼容触屏） ---------- */
function bindDrag(el,hooks){
 var st=null;
 el.addEventListener("pointerdown",function(ev){
   if(el.classList.contains("used")){return;}
   ev.preventDefault();
   st={sx:ev.clientX,sy:ev.clientY,moved:false,ghost:null};
   try{el.setPointerCapture(ev.pointerId);}catch(err){}
 });
 el.addEventListener("pointermove",function(ev){
   if(!st){return;}
   var dx=ev.clientX-st.sx,dy=ev.clientY-st.sy;
   if(!st.moved&&Math.hypot(dx,dy)>7){
     st.moved=true;
     var g=el.cloneNode(true);
     g.classList.add("ghost");
     g.style.width=el.offsetWidth+"px";
     g.classList.remove("used");
     document.body.appendChild(g);
     st.ghost=g;
   }
   if(st.ghost){
     st.ghost.style.left=(ev.clientX-el.offsetWidth/2)+"px";
     st.ghost.style.top=(ev.clientY-30)+"px";
   }
 });
 el.addEventListener("pointerup",function(ev){
   if(!st){return;}
   var info=st; st=null;
   if(info.ghost){info.ghost.remove();}
   if(info.moved){
     var under=document.elementFromPoint(ev.clientX,ev.clientY);
     if(under&&hooks.accept(under)){
       hooks.drop(el,under);
     }else if(under&&hooks.acceptDropZone&&hooks.acceptDropZone(under)){
       hooks.dropZone(el,under);
     }
   }else{
     hooks.tap(el);
   }
 });
 el.addEventListener("pointercancel",function(){
   if(st&&st.ghost){st.ghost.remove();}
   st=null;
 });
}

/* 时间标尺 */
function buildRuler(p,q){
 var ruler=$("#tRuler"),handle=$("#tHandle");
 var pr=predParams();
 var maxT=q.maxT;
 /* 刻度 */
 var step=maxT<=12?1:(maxT<=24?2:5);
 for(var v=0;v<=maxT;v++){
   var tick=document.createElement("div");
   tick.className="rtick";
   tick.style.left=((v/maxT)*100)+"%";
   ruler.appendChild(tick);
   if(v%step===0){
     var num=document.createElement("div");
     num.className="rnum";
     num.style.left=((v/maxT)*100)+"%";
     num.textContent=String(v);
     ruler.appendChild(num);
   }
 }
 function setT(t,fire){
   t=Math.max(0,Math.min(maxT,Math.round(t)));
   S.sch.t=t;
   handle.style.left=(t/maxT*100)+"%";
   handle.textContent=String(t);
   $("#tLab").textContent=t+" "+q.unit;
   var rem=pr.predO+pr.predG*t-q.rate*t;
   var fill=$("#remFill"),txt=$("#remTxt");
   var ratio=Math.max(0,Math.min(1,rem/pr.predO));
   fill.style.width=(ratio*100)+"%";
   fill.classList.toggle("zero",Math.abs(rem)<1e-9);
   txt.classList.toggle("zero",Math.abs(rem)<1e-9);
   if(Math.abs(rem)<1e-9){
     txt.textContent="第 "+t+" "+q.unit+"：剩余 0 "+p.unitName+" —— 找到啦！";
   }else if(rem>0){
     txt.textContent="第 "+t+" "+q.unit+"：还剩 "+fmt(rem)+" "+p.unitName;
   }else{
     txt.textContent="第 "+t+" "+q.unit+"：早已吃光（超出 "+fmt(-rem)+" 份）";
   }
   drawSchedStatic(p,t);
 }
 var dragging=false;
 ruler.addEventListener("pointerdown",function(ev){
   dragging=true;
   try{ruler.setPointerCapture(ev.pointerId);}catch(err){}
   var r=ruler.getBoundingClientRect();
   setT((ev.clientX-r.left)/r.width*maxT);
   ev.preventDefault();
 });
 ruler.addEventListener("pointermove",function(ev){
   if(!dragging){return;}
   var r=ruler.getBoundingClientRect();
   setT((ev.clientX-r.left)/r.width*maxT);
 });
 ruler.addEventListener("pointerup",function(){ if(dragging){dragging=false;addStep();} });
 ruler.addEventListener("pointercancel",function(){dragging=false;});
 setT(0,false);
}
/* 动物/编组卡片 */
function buildTokens(p,q){
 var tray=$("#sTray");
 tray.style.cssText="display:flex;gap:10px;flex-wrap:wrap;margin:8px 0";
 /* 编组卡：大数用大编组，小数用小编组，保证任意目标数量都能拼出来 */
 var denom=q.groups?q.groups:(q.maxN>=20?[10,5,1]:(q.maxN>=10?[5,1]:[1]));
 var defs=denom.map(function(g){return {val:g,label:g+" "+p.measure+p.actor};});
 defs.forEach(function(d){
   var b=document.createElement("button");
   b.type="button";
   b.className="tok";
   b.dataset.val=String(d.val);
   b.innerHTML=p.emoji+" ＋"+d.val+"<i>"+d.label+"</i>";
   bindDrag(b,{
     accept:function(el){return el.id==="sDrop";},
     drop:function(el,zone){addToken(p,+el.dataset.val);},
     tap:function(el){addToken(p,+el.dataset.val);}
   });
   tray.appendChild(b);
 });
}
function addToken(p,v){
 S.sch.n+=v;
 S.sch.placed.push(v);
 renderPlaced(p);
 updatePred(p);
 drawSchedStatic(p);
 addStep();
}
function renderPlaced(p){
 var box=$("#sDrop");
 box.textContent="";
 /* 按面额合并展示，每枚可单独撤回一张 */
 var agg={};
 S.sch.placed.forEach(function(v){agg[v]=(agg[v]||0)+1;});
 Object.keys(agg).map(Number).sort(function(a,b){return b-a;}).forEach(function(k){
   var sp=document.createElement("span");
   sp.className="ptok";
   sp.textContent=p.emoji+" "+k+"×"+agg[k]+" ";
   var u=document.createElement("u");
   u.textContent="－";
   u.title="撤回一张 "+k+" 的编组卡";
   u.addEventListener("click",function(){removeToken(p,k);});
   sp.appendChild(u);
   box.appendChild(sp);
 });
 var b2=document.createElement("b");
 b2.textContent=" 共 "+S.sch.n+" "+p.measure+p.actor;
 box.appendChild(b2);
}
function removeToken(p,k){
 var idx=S.sch.placed.indexOf(k);
 if(idx>=0){S.sch.placed.splice(idx,1);}
 S.sch.n=Math.max(0,S.sch.n-k);
 renderPlaced(p);
 updatePred(p);
 drawSchedStatic(p);
 addStep();
}
function updatePred(p){
 var q=p.q,pr=predParams(),box=$("#sPred");
 if(!box){return;}
 if(q.type==="time"){return;}
 var rate=p.ratePer*S.sch.n;
 if(S.sch.n===0){
   box.className="spred";
   box.innerHTML="当前还没有"+p.actor+"哦";
   return;
 }
 if(q.type==="never"){
   box.className="spred"+(S.sch.n===q.answer?" match":"");
   var stat;
   if(rate<pr.predG){stat="吃的不如长的 → <b>草永远吃不完</b>（还能再多放！）";}
   else if(rate===pr.predG){stat="<b>正好平衡：每天新长的草全部被吃掉，原有的草保持不变！</b>";}
   else{stat="每天净减少 "+fmt(rate-pr.predG)+" 份 → 草会在 "+fmtD(pr.predO/(rate-pr.predG))+" "+p.unit+"被吃光";}
   box.innerHTML="当前：<b>"+S.sch.n+"</b> 头 · 每天吃 <b>"+fmt(rate)+"</b> 份 · 每天新长 <b>"+fmt(pr.predG)+"</b> 份<br>"+stat;
   return;
 }
 /* actors 模式 */
 var days=(S.sch.n<=pr.predG)?Infinity:(pr.predO/(p.ratePer*S.sch.n-pr.predG));
 var match=Math.abs(days-q.targetT)<1e-9;
 box.className="spred"+(match?" match":"");
 box.innerHTML="当前：<b>"+S.sch.n+"</b> "+p.measure+p.actor+" · 每天吃 <b>"+fmt(rate)+"</b> 份 · 每天新长 <b>"+fmt(pr.predG)+"</b> 份<br>"+
  "预计用时：<b>"+(isFinite(days)?fmtD(days):"永远吃不完")+"</b> "+p.unit+"　|　"+q.targetTxt+(match?"　✅ 就是现在！":"");
}
function drawSchedStatic(p,day){
 var cv=$("#schCv"); if(!cv){return;}
 var q=p.q,pr=predParams();
 if(q.type==="time"){
   var t=(day!=null)?day:S.sch.t;
   var amt=pr.predO+pr.predG*t-q.rate*t;
   var nIcons=q.mixed?0:Math.min(30,Math.round(q.rate/p.ratePer));
   drawScene(cv,p,{
     day:t,ratio:Math.max(0,amt/pr.predO),amount:amt,
     n:q.mixed?0:nIcons,
     active:p.theme==="farm"?"both":(p.theme==="fields"?"f3":""),
     activeField:p.theme==="fields"?2:0,
     line1:p.gWord+" "+fmt(pr.predG)+" "+p.unitName,
     line2:"每天吃掉 "+fmt(q.rate)+" "+p.unitName
   });
   if(q.mixed){
     /* 牛羊混编：在画布上叠画固定阵容 */
     var c=ctxOf(cv);
     c.ctx.font="24px serif"; c.ctx.textAlign="left";
     c.ctx.fillText("🐮×"+q.mixed[0].c+"　🐑×"+q.mixed[1].c,20,c.h-16);
   }
 }else{
   var n=S.sch.n;
   var amt=pr.predO; /* 静态时显示满草 */
   var opts={
     day:null,ratio:1,amount:amt,
     n:n,active:p.theme==="farm"?"both":"",
     line1:p.gWord+" "+fmt(pr.predG)+" "+p.unitName,
     line2:"每天吃掉 "+fmt(p.ratePer*n)+" "+p.unitName
   };
   if(p.theme==="farm"){opts.amountTotal=pr.predO;}
   drawScene(cv,p,opts);
 }
}
/* 出发验证 */
function verify(p){
 if(S.levelDone){return;}
 var q=p.q,pr=predParams();
 if(q.type==="time"){
   var t=S.sch.t;

     active:p.theme==="farm"?"both":(p.theme==="fields"?"f3":""),
     activeField:p.theme==="fields"?2:0,
     line1:p.gWord+" "+fmt(pr.predG)+" "+p.unitName,
     line2:"每天吃掉 "+fmt(q.rate)+" "+p.unitName
   },function(endT,endAmt){
     animSeqIsPlaying=false;
     if(t===q.answer){
       levelPass();
     }else if(endAmt>0){
       toast("第 "+t+" "+q.unit+"还剩 "+fmt(endAmt)+" "+p.unitName+"没吃完——时间还要再长一点");
     }else{

     }
   });
   return;
 }
 /* actors / never */
 var n=S.sch.n;
 if(n<=0){toast("先拖一些"+p.actor+"进来哦！");return;}
 addStep();
 var rate=p.ratePer*n;
 var days=(n<=pr.predG)?Infinity:(pr.predO/(rate-pr.predG));
 var T=isFinite(days)?Math.min(days,48):20;
 animSeqIsPlaying=true;
 playAnim($("#schCv"),p,{
   T:T,rate:rate,predO:pr.predO,predG:pr.predG,n:n,
   active:p.theme==="farm"?"both":"",
   line1:p.gWord+" "+fmt(pr.predG)+" "+p.unitName,
   line2:"每天吃掉 "+fmt(rate)+" "+p.unitName
 },function(endT,endAmt){
   animSeqIsPlaying=false;
   if(q.type==="never"){
     if(n===q.answer){
       levelPass();
     }else if(rate<pr.predG){
       toast("确实永远吃不完，但还不是最多的！牧场还能容纳更多牛，再加一点～");
       drawSchedStatic(p);
     }else if(rate===pr.predG){
       toast("正好平衡了！但要确认这就是「最多」的头数哦～再出发一次试试！");
     }else{
       toast("牛太多啦：每天吃 "+fmt(rate)+" 份 > 每天新长 "+fmt(pr.predG)+" 份，草会被吃光！");
       drawSchedStatic(p);
     }
     return;
   }
   /* actors 普通模式 */
   if(Math.abs(days-q.targetT)<1e-9){
     levelPass();
   }else if(!isFinite(days)){
     toast("这样草永远吃不完——数量还不够哦！");
     drawSchedStatic(p);
   }else if(days<q.targetT){
     toast("太快啦！"+fmtD(days)+" "+p.unit+"就吃光了，比目标早——"+p.actor+"太多了");
     drawSchedStatic(p);
   }else{
     toast("太慢啦！要 "+fmtD(days)+" "+p.unit+"才能吃光，比目标晚——"+p.actor+"还不够");
     drawSchedStatic(p);
   }
 });
}

/* ---------- 彩纸庆祝 ---------- */
function confetti(ms){
 var cv=$("#confettiCv");
 cv.width=window.innerWidth; cv.height=window.innerHeight;
 var ctx=cv.getContext("2d");
 var cols=["#f4a017","#2f9e55","#2b8cd6","#e24a8f","#8a5cd6","#14a08d"];
 var parts=[];
 for(var i=0;i<120;i++){
   parts.push({
     x:Math.random()*cv.width,
     y:-20-Math.random()*cv.height*0.5,
     vy:2+Math.random()*3.5,
     vx:(Math.random()-0.5)*2.4,
     r:4+Math.random()*6,
     c:cols[Math.floor(Math.random()*cols.length)],
     a:Math.random()*Math.PI,
     va:(Math.random()-0.5)*0.25
   });
 }
 var st=Date.now();
 function tick(){
   ctx.clearRect(0,0,cv.width,cv.height);
   parts.forEach(function(pt){
     pt.x+=pt.vx; pt.y+=pt.vy; pt.a+=pt.va;
     ctx.save();
     ctx.translate(pt.x,pt.y);
     ctx.rotate(pt.a);
     ctx.fillStyle=pt.c;
     ctx.fillRect(-pt.r/2,-pt.r/2,pt.r,pt.r*0.7);
     ctx.restore();
   });
   if(Date.now()-st<ms){requestAnimationFrame(tick);}
   else{ctx.clearRect(0,0,cv.width,cv.height);}
 }
 requestAnimationFrame(tick);
}
