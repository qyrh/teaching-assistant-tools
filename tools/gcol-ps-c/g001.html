 0}.tick-label{width:92px;font-size:16px;font-weight:800;color:#546E7A;text-align:right;padding-right:8px;flex:none}.tick-strip{position:relative;height:24px}.tk{position:absolute;top:0;width:5px;height:24px;background:#F57F17;border-radius:2px;transform:translateX(-50%)}.tk.dim{background:#CFD8DC;height:12px;top:6px}.stick{display:flex;height:52px;border:3px solid #8D6E63;border-radius:6px;overflow:hidden}.cell{height:100%;background:linear-gradient(#D7A86E,#C69158);border-right:1px solid #a97d52;cursor:pointer;user-select:none;transition:background .15s}.cell:hover{background:#E8B57E}.cell.cut{background:repeating-linear-gradient(45deg,#E53935 0 5px,#FFF 5px 10px);border-right:2px solid #B71C1C}.cell.bad{animation:shake .45s;background:#E53935}.cell.endcap{background:#8D6E63;cursor:not-allowed}.ruler-line{display:flex;justify-content:space-between;font-size:17px;font-weight:800;color:#6D4C41;position:relative}.ruler-line span{background:#FBF6EE;padding:0 4px}.modal-back{position:fixed;inset:0;background:rgba(38,50,56,.55);z-index:80;display:none;align-items:center;justify-content:center;padding:18px}.modal-back.open{display:flex}.modal{background:#fff;border-radius:22px;max-width:660px;width:100%;max-height:86vh;overflow-y:auto;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35);border-top:10px solid var(--p);animation:pop .3s}@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}.modal-title{font-size:26px;font-weight:800;color:var(--pd);margin-bottom:10px}.modal-body{font-size:19px;line-height:1.75}.modal-body ol{padding-left:24px}.modal-body li{margin:6px 0}.modal-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-size:19px;font-weight:700;padding:12px 22px;border-radius:14px;opacity:0;pointer-events:none;transition:all .3s;z-index:100;max-width:88vw;text-align:center}.toast <body>
<header>
  <div class="app-title">🏝️ 因数与倍数 · 探秘数岛<span class="sub">五年级 · 数的性质的妙用：因数与倍数</span></div>
  <div class="hud">
    <span class="hud-chip" id="hud-time">⏱ 00:00</span>
    <span class="hud-chip" id="hud-steps">👣 0 步</span>
  </div>
</header>

<main class="wrap">
  <!-- 难度选择界面 -->
  <div class="screen" id="screen-menu">
    <div class="menu-hero">
      <svg class="hero-svg" viewBox="0 0 200 60" aria-hidden="true">
        <path d="M6 44 Q 30 20 58 38 T 110 36 T 160 40 T 194 42" fill="none" stroke="var(--p)" stroke-width="6" stroke-linecap="round"/>
        <circle cx="165" cy="14" r="9" fill="#FFB300"/>
        <text x="10" y="20" font-size="16" fill="var(--pd)" font-weight="bold">🔑 短除模型</text>
      </svg>
      <h1>用「短除钥匙」解锁最大公因数与最小公倍数的秘密！</h1>
      <p>每一关都要动手操作：抽公因数、点亮灯塔、拖动相聚旗、分装零件、拼装数卡、巧锯木棍……玩着玩着就懂了。</p>
    </div>
    <div class="menu-cards">
      <button class="menu-card" data-diff="easy">
        <div class="mc-emoji">🏖️</div>
        <h2>初级 · 启程沙滩</h2>
        <p>短除钥匙机 → 灯塔大道 → 相聚时光轴（2 人）<br/>例题难度，热身出发！</p>
      </button>
      <button class="menu-card" data-diff="mid">
        <div class="mc-emoji">🌳</div>
        <h2>中级 · 进阶密林</h2>
        <p>零件分装站 → 三人相聚时光轴 → 数卡拼装台<br/>先去余数，再找公因数！</p>
      </button>
      <button class="menu-card" data-diff="hard">
        <div class="mc-emoji">⛰️</div>
        <h2>高级 · 勇者星峰</h2>
        <p>数卡拼装台 ×2 → 巧木匠工坊<br/>综合变式，挑战满星！</p>
      </button>
    </div>
    <div class="menu-foot">
      <button class="btn ghost" id="btn-rules-menu">📖 玩法说明</button>
    </div>
  </div>

  <!-- 游戏界面 -->
  <div class="screen" id="screen-game" hidden>
    <div class="game-top">
      <div class="progress-dots" id="progress"></div>
      <div class="level-title" id="level-title"></div>
    </div>
    <div class="task-card" id="task-card"></div>
    <div class="stage-card" id="stage"></div>
    <div class="toolbar">
      <button class="btn ghost" id="btn-rules">📖 玩法说明</button>
      <button class="btn ghost" id="btn-reveal">💡 揭示答案</button>
      <button class="btn ghost" id="btn-restart">🔄 重新开始(本关)</button>
      <button class="btn ghost" id="btn-back">🏠 返回选难度</button>
    </div>
  </div>
</main>

<!-- 规则/结算 弹窗 -->
<div class="modal-back" id="modal">
  <div class="modal">
    <div class="modal-title"></div>
    <div class="modal-body"></div>
    <div class="modal-btns"></div>
  </div>
</div>

<!-- 轻提示 -->
<div class="toast" id="toast"></div>

<!-- 庆祝彩纸画布 -->

<script>"use strict";const $=s=>document.querySelector(s);function shuffle(arr){const r=arr.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=r[i];r[i]=r[j];r[j]=t}return r}function pickOne(arr){return arr[Math.floor(Math.random()*arr.length)]}function gcd2(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t}return a}function gcdAll(arr){return arr.reduce((x,y)=>gcd2(x,y))}function lcm2(a,b){return a/gcd2(a,b)*b}function lcmAll(arr){return arr.reduce((x,y)=>lcm2(x,y))}function pad(n){return n<10?"0"+n:""+n}function dateCN(base,addDays){const dt=new Date(2025,base[0]-1,base[1]+addDays);return dt.getMonth()+1+"月"+dt.getDate()+"日"}function pairwiseCoprime(arr){for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++)if(gcd2(arr[i],arr[j])!==1)return false;return true}const PALETTES=[{p:"#F57C00",pd:"#E65100",bg:"#FFF8E1",acc:"#43A047"},{p:"#1E88E5",pd:"#0D47A1",bg:"#E3F2FD",acc:"#FB8C00"},{p:"#43A047",pd:"#1B5E20",bg:"#F1F8E9",acc:"#F4511E"},{p:"#8E24AA",pd:"#4A148C",bg:"#F3E5F5",acc:"#00897B"},{p:"#EC407A",pd:"#AD1457",bg:"#FCE4EC",acc:"#3949AB"},{p:"#00ACC1",pd:"#006064",bg:"#E0F7FA",acc:"#F9A825"}];function applyPalette(){const c=pickOne(PALETTES);const root=document.documentElement.style;root.setProperty("--p",c.p);root.setProperty("--pd",c.pd);root.setProperty("--bg",c.bg);root.setProperty("--acc",c.acc)}const G={diffKey:null,levels:[],idx:0,steps:0,mistakes:0,stars:[],startTime:0,timer:null,revealed:false,doneThisLevel:false,engine:null};function updateHUD(){$("#hud-steps").textContent="👣 "+G.steps+" 步"}function startTimer(){stopTimer();G.timer=setInterval(()=>{const s=Math.floor((Date.now()-G.startTime)/1e3);$("#hud-time").textContent="⏱ "+pad(Math.floor(s/60))+":"+pad(s%60)},500)}function stopTimer(){if(G.timer){clearInterval(G.timer);G.timer=null}}let toastTimer=null;function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2600)}function showModal(title,bodyHTML,buttons){const m=$("#modal");m.querySelector(".modal-title").textContent=title;m.querySelector(".modal-body").innerHTML=bodyHTML;const btnBox=m.querySelector(".modal-btns");btnBox.innerHTML="";buttons.forEach(b=>{const btn=document.createElement("button");btn.className="btn primary";btn.textContent=b.label;btn.onclick=b.fn;btnBox.appendChild(btn)});m.classList.add("open")}function closeModal(){$("#modal").classList.remove("open")}const FX={cv:null,ctx:null,ps:[],running:false};function fxInit(){FX.cv=$("#fx");FX.ctx=FX.cv.getContext("2d");const resize=()=>{FX.cv.width=window.innerWidth;FX.cv.height=window.innerHeight};resize();window.addEventListener("resize",resize)}function fxColors(){const cs=getComputedStyle(document.documentElement);return["#FFC107","#FF7043","#66BB6A","#42A5F5","#EC407A",cs.getPropertyValue("--p").trim()||"#F57C00"]}function fxAdd(x,y,n,withStars){const colors=fxColors();for(let i=0;i<n;i++){const ang=Math.random()*Math.PI*2;const sp=3+Math.random()*7;FX.ps.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-3,g:.18,r:4+Math.random()*6,color:pickOne(colors),life:70+Math.random()*40,rot:Math.random()*360,vr:-8+Math.random()*16,shape:withStars&&Math.random()<.3?"star":"rect"})}if(!FX.running)fxRun()}function drawStar(ctx,x,y,r,color){ctx.save();ctx.fillStyle=color;ctx.beginPath();for(let i=0;i<10;i++){const ang=-Math.PI/2+i*Math.PI/5;const rr=i%2===0?r:r*.45;const px=x+Math.cos(ang)*rr,py=y+Math.sin(ang)*rr;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.closePath();ctx.fill();ctx.restore()}function fxRun(){FX.running=true;const ctx=FX.ctx;const loop=()=>{ctx.clearRect(0,0,FX.cv.width,FX.cv.height);FX.ps=FX.ps.filter(p=>p.life>0);FX.ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.rot+=p.vr;p.life-=1;ctx.globalAlpha=Math.max(0,Math.min(1,p.life/40));if(p.shape==="star"){drawStar(ctx,p.x,p.y,p.r+2,p.color)}else{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.fillStyle=p.color;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.7);ctx.restore()}});ctx.globalAlpha=1;if(FX.ps.length){requestAnimationFrame(loop)}else{FX.running=false;ctx.clearRect(0,0,FX.cv.width,FX.cv.height)}};requestAnimationFrame(loop)}function celebrateSmall(){fxAdd(window.innerWidth/2,window.innerHeight*.35,70,true)}function celebrateBig(){let k=0;const iv=setInterval(()=>{fxAdd(window.innerWidth*(.15+Math.random()*.7),window.innerHeight*(.15+Math.random()*.4),60,true);k++;if(k>=8)clearInterval(iv)},260)}function attachDrag(el,opts){let sx=0,sy=0,ghost=null,moved=false,pid=null,lastPtr=0;el.style.touchAction="none";el.addEventListener("pointerdown",e=>{if(el.classList.contains("disabled"))return;pid=e.pointerId;sx=e.clientX;sy=e.clientY;moved=false;try{el.setPointerCapture(pid)}catch(err){}});el.addEventListener("pointermove",e=>{if(pid===null)return;if(!moved&&Math.hypot(e.clientX-sx,e.clientY-sy)>12){moved=true;ghost=el.cloneNode(true);ghost.classList.add("ghost");ghost.classList.remove("sel");document.body.appendChild(ghost);el.classList.add("dim-src")}if(moved&&ghost){ghost.style.left=e.clientX+"px";ghost.style.top=e.clientY+"px"}});const finish=e=>{if(pid===null)return;const wasMoved=moved;if(ghost){ghost.remove();ghost=null;el.classList.remove("dim-src")}pid=null;lastPtr=Date.now();if(wasMoved){if(opts.dropSel){const tgt=document.elementFromPoint(e.clientX,e.clientY);const zone=tgt?tgt.closest(opts.dropSel):null;if(zone&&opts.onDropEl)opts.onDropEl(zone)}}else if(opts.onTap){opts.onTap(e)}};el.addEventListener("pointerup",finish);el.addEventListener("pointercancel",finish);el.addEventListener("click",e=>{if(pid===null&&Date.now()-lastPtr>500&&opts.onTap)opts.onTap(e)})}const PRIMES=[2,3,5,7,11];const MACHINE_POOL=[{nums:[40,60],intro:"研学准备：从军军家到学校的大路，旧电线杆每 40 米一根，新方案每 60 米一根。先把 40 和 60 放进短除钥匙机：点击质数卡抽出所有公因数，直到两数互质，机器就会给出最大公因数和最小公倍数。",hint:"当 m 是 A、B 的最大公因数时：A=m×a，B=m×b，a、b 互质；[A,B]=m×a×b；A×B=(A,B)×[A,B]。",explain:"40 和 60 连续抽出公因数 2、2、5：最大公因数 = 2×2×5 = 20；剩下 2 和 3 互质，最小公倍数 = 2
