<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>几何概率工坊 · 幸运投掷实验室</title>
<style>
/* ================= 基础与色板变量 ================= */
:root{
  --bg1:#fff7ed; --bg2:#ffe3c2; --panel:#ffffff; --ink:#3b2a1a;
  --c1:#e05d1d; --c2:#0e7bb8; --c3:#fde8d7; --line:#dcc2a4;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  color:var(--ink); min-height:100vh; user-select:none;
}
.wrap{max-width:1040px;margin:0 auto;padding:14px;}
h1,h2,h3{margin:.2em 0 .4em 0;}
button{font-family:inherit;}
.btn{
  display:inline-block;border:3px solid var(--c1);background:#fff;color:var(--c1);
  font-size:18px;font-weight:bold;padding:10px 20px;border-radius:14px;cursor:pointer;
  margin:6px 8px 6px 0; transition:transform .12s ease, box-shadow .12s ease;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.15);}
.btn-primary{background:var(--c1);color:#fff;}
.btn-mini{font-size:15px;padding:6px 12px;border-width:2px;border-radius:10px;}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;}
/* ================= 开始屏 ================= */
.title-card{background:var(--panel);border:4px solid var(--c1);border-radius:22px;
  padding:26px 22px;text-align:center;margin-top:4vh;box-shadow:0 8px 24px rgba(0,0,0,.10);}
.title-card h1{font-size:44px;color:var(--c1);letter-spacing:4px;}
.title-card .sub{font-size:20px;margin:6px 0 2px;}
.title-card .from{font-size:15px;color:#7a6a55;margin-top:2px;}
.diff-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:18px;}
.diff-card{
  flex:1 1 220px;max-width:280px;background:var(--c3);border:3px dashed var(--c1);
  border-radius:18px;padding:16px 10px;cursor:pointer;text-align:center;
  font-size:16px;transition:transform .15s ease, background .15s ease;
}
.diff-card:hover{transform:translateY(-4px);background:#fff;}
.diff-card b{display:block;font-size:26px;color:var(--c1);margin:4px 0;}
.diff-card .stars{color:#e2a400;font-size:18px;letter-spacing:2px;}
/* ================= 游戏屏 ================= */
#hud{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;
  background:var(--panel);border:3px solid var(--c1);border-radius:14px;padding:8px 14px;margin-bottom:8px;}
#hud .hud-left b{font-size:20px;color:var(--c1);}
#hud .hud-left span{font-size:15px;color:#7a6a55;margin-left:8px;}
#hud .hud-right{display:flex;gap:14px;}
.hud-item{font-size:16px;}
.hud-item b{color:var(--c2);font-size:19px;}
#hud-btns{margin-bottom:8px;}
.level-card{background:var(--panel);border:4px solid var(--line);border-radius:18px;padding:14px;}
.lv-head h2{color:var(--c2);font-size:24px;}
.lv-src{font-size:14px;color:#8a7a63;margin:0 0 8px 0;}
.paper{background:#fffbe9;border:2px solid #e8d9a8;border-radius:12px;padding:10px 12px;
  font-size:16px;line-height:1.65;margin:8px 0;}
.paper .hl{color:var(--c1);font-weight:bold;}
.lv-body{margin-top:6px;}
.ro{background:var(--c3);border:2px solid var(--line);border-radius:12px;padding:10px 12px;
  font-size:17px;line-height:1.8;margin:10px 0;}
.ro b{color:var(--c1);}
.ro .ok{color:#0a8a4a;font-weight:bold;}
.ro .no{color:#c0392b;font-weight:bold;}
canvas.board{display:block;margin:10px auto;background:#fff;border:3px solid var(--line);
  border-radius:12px;max-width:100%;height:auto;touch-action:none;}
.reveal-note{background:#eef4ff;border:2px solid #9db8e8;border-radius:12px;
  padding:10px 12px;font-size:16px;line-height:1.7;margin:10px 0;}
/* ================= A1 事件分拣 ================= */
.a1-cards{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0;min-height:56px;}
.card-drag{
  background:#fff;border:3px solid var(--c1);border-radius:12px;padding:10px 14px;
  font-size:17px;font-weight:bold;cursor:grab;touch-action:none;box-shadow:0 3px 6px rgba(0,0,0,.12);
}
.card-drag.dragging{opacity:.35;}
.drag-ghost{position:fixed;z-index:999;pointer-events:none;background:#fff;border:3px solid var(--c2);
  border-radius:12px;padding:10px 14px;font-size:17px;font-weight:bold;color:var(--c2);
  box-shadow:0 8px 18px rgba(0,0,0,.25);transform:translate(-50%,-120%);}
.a1-bins{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
.bin{flex:1 1 200px;min-height:150px;border:3px dashed var(--c2);border-radius:14px;
  padding:8px;background:#fbfdff;text-align:center;}
.bin.hl{background:#e2f2ff;border-color:var(--c1);box-shadow:0 0 0 4px rgba(224,93,29,.2);}
.bin b{font-size:19px;color:var(--c2);}
.bin i{display:block;font-style:normal;font-size:14px;color:#7a6a55;margin-bottom:6px;}
.bin-chips{display:flex;flex-direction:column;gap:6px;}
.chip{background:var(--c3);border:2px solid var(--c1);border-radius:10px;padding:5px 8px;
  font-size:15px;font-weight:bold;animation:pop .25s ease;}
@keyframes pop{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
/* ================= A2 骰子拼分数 ================= */
.dice-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:10px 0;}
.die-box{text-align:center;}
.die{width:72px;height:72px;background:#fff;border:3px solid var(--ink);border-radius:12px;
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:8px;gap:2px;}
.die span{border-radius:50%;}
.die span.pip{background:var(--c1);}
.die-box i{font-style:normal;font-size:14px;color:#7a6a55;}
.frac-build{display:flex;flex-direction:column;align-items:center;gap:0;margin:12px auto;}
.slot{width:110px;height:74px;border:3px dashed var(--c2);border-radius:12px;background:#fbfdff;
  display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:bold;color:var(--c2);
  touch-action:none;position:relative;}
.slot.hl{background:#e2f2ff;border-color:var(--c1);}
.slot.full{border-style:solid;background:#fff;color:var(--c1);}
.slot .slot-tag{position:absolute;top:-12px;right:-8px;background:var(--c2);color:#fff;
  font-size:13px;padding:1px 8px;border-radius:8px;}
.frac-bar{width:190px;height:6px;background:var(--ink);border-radius:3px;margin:10px 0;}
.tray{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:12px 0;min-height:60px;}
/* ================= 数字线 ================= */
.numline{margin:14px auto 6px auto;max-width:640px;}
.nl-track{position:relative;height:64px;border-left:3px solid var(--ink);border-right:3px solid var(--ink);
  background:linear-gradient(#fff,#f4ede2);border-radius:6px;touch-action:none;cursor:pointer;}
.nl-track:before{content:"";position:absolute;left:0;right:0;top:34px;height:4px;background:var(--ink);border-radius:2px;}
.nl-tick{position:absolute;top:26px;width:3px;height:20px;background:#9a8b74;transform:translateX(-50%);}
.nl-tick.major{background:var(--ink);height:28px;top:22px;}
.nl-lab{position:absolute;top:48px;transform:translateX(-50%);font-size:14px;font-weight:bold;color:#5f503c;}
.nl-marker{position:absolute;top:6px;width:26px;height:40px;transform:translateX(-50%);cursor:grab;z-index:5;}
.nl-marker i{position:absolute;left:50%;top:24px;transform:translateX(-50%);
  border-left:11px solid transparent;border-right:11px solid transparent;border-top:18px solid var(--c1);}
.nl-marker b{position:absolute;left:50%;top:-16px;transform:translateX(-50%);
  background:var(--c1);color:#fff;font-size:15px;padding:2px 8px;border-radius:8px;white-space:nowrap;}
/* ================= 表格 ================= */
.tbl-scroll{overflow-x:auto;margin:8px 0;}
table.data{border-collapse:collapse;margin:0 auto;background:#fff;}
table.data th,table.data td{border:2px solid var(--line);padding:6px 10px;font-size:15px;text-align:center;white-space:nowrap;}
table.data th{background:var(--c3);color:var(--ink);}
table.data td.new{background:#fff3cc;}
/* ================= 弹窗 / 提示 / 特效 ================= */
.modal{position:fixed;inset:0;background:rgba(40,25,10,.45);display:flex;
  align-items:center;justify-content:center;z-index:600;padding:14px;}
.modal[hidden]{display:none;}
.modal-card{background:#fff;border:4px solid var(--c1);border-radius:18px;padding:18px 20px;
  max-width:660px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.3);}
.modal-card h2{color:var(--c1);font-size:24px;}
.modal-actions{text-align:center;margin-top:10px;}
.note{font-size:14px;color:#7a6a55;}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:700;
  background:var(--ink);color:#fff;font-size:17px;padding:10px 20px;border-radius:14px;
  box-shadow:0 6px 16px rgba(0,0,0,.3);max-width:88vw;text-align:center;}
#toast[hidden]{display:none;}
#fx-canvas{position:fixed;inset:0;z-index:500;pointer-events:none;}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}
  40%{transform:translateX(8px);}60%{transform:translateX(-6px);}80%{transform:translateX(6px);}}
.shake{animation:shake .45s ease;}
/* ================= 结算屏 ================= */
.final-card{background:var(--panel);border:4px solid var(--c1);border-radius:22px;text-align:center;
  padding:30px 20px;margin-top:6vh;box-shadow:0 8px 24px rgba(0,0,0,.12);}
.final-card h2{font-size:38px;color:var(--c1);}
#final-stats{font-size:19px;line-height:2;}
.legend-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:15px;margin:6px 0;}
.legend-row span{display:inline-flex;align-items:center;gap:6px;}
.dot-ic{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.25);}
@media (max-width:720px){
  .title-card h1{font-size:32px;}
  .diff-card b{font-size:22px;}
  .paper,.ro{font-size:15px;}
  .btn{font-size:16px;padding:8px 14px;}
  .slot{width:88px;height:62px;font-size:28px;}
  .die{width:56px;height:56px;padding:6px;}
}
</style>
</head>
<body>
<div class="wrap">
  <!-- ============ 开始屏 ============ -->
  <section id="scr-start">
    <div class="title-card">
      <h1>几何概率工坊</h1>
      <p class="sub">掷一掷 · 涂一涂 · 拖一拖 —— 面积里藏着"可能性"!</p>
      <p class="from">内容源自 苏科版八年级下册 · 题型【几何图形中的可能性大小】</p>
      <div class="diff-row">
        <button class="diff-card" data-d="d1"><span class="stars">★★</span><b>初级</b>
          <span>事件分拣官 · 幸运第五掷</span></button>
        <button class="diff-card" data-d="d2"><span class="stars">★★★</span><b>中级</b>
          <span>太极涂色 · 网格扇形 · 麦穗实验</span></button>
        <button class="diff-card" data-d="d3"><span class="stars">★★★★</span><b>高级</b>
          <span>圆碟缝隙 · 投石估草 · 转盘设计</span></button>
      </div>
      <div class="start-actions"><button class="btn btn-primary" id="btn-rules-0">游戏规则说明</button></div>
    </div>
  </section>

  <!-- ============ 游戏屏 ============ -->
  <section id="scr-game" hidden>
    <header id="hud">
      <div class="hud-left"><b id="hud-level">—</b><span id="hud-prog"></span></div>
      <div class="hud-right">
        <span class="hud-item">时间 <b id="hud-time">00:00</b></span>
        <span class="hud-item">步数 <b id="hud-steps">0</b></span>
      </div>
    </header>
    <div id="hud-btns">
      <button class="btn btn-mini" id="btn-rules">规则说明</button>
      <button class="btn btn-mini" id="btn-reveal">揭示答案</button>
      <button class="btn btn-mini" id="btn-restart">重新开始</button>
      <button class="btn btn-mini" id="btn-back">返回难度选择</button>
    </div>
    <div id="level-root"></div>
  </section>

  <!-- ============ 结算屏 ============ -->
  <section id="scr-final" hidden>
    <div class="final-card">
      <h2 id="final-title">全部通关,太了不起了!</h2>
      <p id="final-sub" style="font-size:18px;"></p>
      <div id="final-stats"></div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="btn-again">再玩一次</button>
        <button class="btn" id="btn-back2">返回难度选择</button>
      </div>
    </div>
  </section>
</div>

<canvas id="fx-canvas"></canvas>

<!-- 规则弹窗 -->
<div class="modal" id="modal-rules" hidden>
  <div class="modal-card">
    <h2>游戏规则说明</h2>
    <div id="rules-body"></div>
    <div class="modal-actions"><button class="btn btn-primary" id="btn-rules-close">开始挑战</button></div>
  </div>
</div>

<!-- 通关弹窗 -->
<div class="modal" id="modal-pass" hidden>
  <div class="modal-card">
    <h2 id="pass-title">太棒了,本关完成!</h2>
    <div id="pass-body"></div>
    <div class="modal-actions">
      <button class="btn" id="btn-pass-retry">再挑战本关</button>
      <button class="btn btn-primary" id="btn-pass-next">进入下一关</button>
    </div>
  </div>
</div>

<div id="toast" hidden></div>

<script>
(function(){
'use strict';
/* =========================================================
   几何概率工坊 · 幸运投掷实验室
   核心思想:几何概率 = 有利于积 / 总面积;频率的稳定值估计概率。
   所有关卡都要求"动手操作"——操作本身就是解题。
   ========================================================= */

/* ---------------- 基础工具 ---------------- */
function $(s){return document.querySelector(s);}
function ce(tag,cls,html){
  var el=document.createElement(tag);
  if(cls){el.className=cls;}
  if(html!=null){el.innerHTML=html;}
  return el;
}
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}        // [a,b] 内随机整数
function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=arr[i];arr[i]=arr[j];arr[j]=t;
  }
  return arr;
}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a||1;}
function fracStr(n,d){var g=gcd(n,d);return (n/g)+'/'+(d/g);}       // 化简分数
function piStr(n,d32){                                               // n*π/d32 形式
  var g=gcd(n,d32);n/=g;var d=d32/g;
  if(n===0){return '0';}
  if(d===1){return n===1?'π':n+'π';}
  return (n===1?'':n)+'π/'+d;
}
var toastTimer=0;
function toast(msg){
  var t=$('#toast');t.textContent=msg;t.hidden=false;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.hidden=true;},2800);
}
function fmtTime(sec){
  var m=Math.floor(sec/60),s=sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
/* 画布事件坐标换算(CSS 缩放时仍准确) */
function cpos(e,cv){
  var r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)*(cv.width/r.width),y:(e.clientY-r.top)*(cv.height/r.height)};
}

/* ---------------- 色板(G8 随机主色) ---------------- */
var PAL_LIST=[
 {name:'珊瑚橙',bg1:'#fff7ed',bg2:'#ffe3c2',ink:'#3b2a1a',c1:'#e05d1d',c2:'#0e7bb8',c3:'#fde8d7',line:'#dcc2a4'},
 {name:'薄荷绿',bg1:'#f0fdf6',bg2:'#c9f2dd',ink:'#123527',c1:'#0f9d58',c2:'#7c4dc4',c3:'#ddf6ea',line:'#b9dcc9'},
 {name:'海洋蓝',bg1:'#eef6ff',bg2:'#c9e2fb',ink:'#152d45',c1:'#1668c4',c2:'#e08a00',c3:'#ddeeff',line:'#aecdea'},
 {name:'樱花粉',bg1:'#fff0f5',bg2:'#ffd6e4',ink:'#45212f',c1:'#d63384',c2:'#0b8a6d',c3:'#ffe3ee',line:'#e8bccd'},
 {name:'柠檬黄',bg1:'#fffdee',bg2:'#fdeec3',ink:'#40300a',c1:'#c9930a',c2:'#4a5fd0',c3:'#fdf3d3',line:'#ddc98f'},
 {name:'葡萄紫',bg1:'#f7f0ff',bg2:'#e2d2fb',ink:'#2e1c45',c1:'#7a3fd4',c2:'#d2691e',c3:'#efe3ff',line:'#c6b0e6'}
];
var PAL=PAL_LIST[0];
function applyPalette(){
  PAL=PAL_LIST[ri(0,PAL_LIST.length-1)];
  var st=document.documentElement.style;
  st.setProperty('--bg1',PAL.bg1);st.setProperty('--bg2',PAL.bg2);
  st.setProperty('--ink',PAL.ink);st.setProperty('--c1',PAL.c1);
  st.setProperty('--c2',PAL.c2);st.setProperty('--c3',PAL.c3);
  st.setProperty('--line',PAL.line);
}

/* ---------------- 全局状态 ---------------- */
var TOKEN=0;                 // 异步令牌:重载关卡后旧动画立即失效
var G={diffKey:null,levels:[],idx:0,steps:0,startT:0,timerInt:null,revealed:false,cur:null,done:false,elapsed:0};
function bump(){G.steps++;$('#hud-steps').textContent=G.steps;}       // 步数统计(G7)
function renderHud(){
  var def=REG[G.levels[G.idx]];
  $('#hud-level').textContent=def.diff+' · '+def.title;
  $('#hud-prog').textContent='第 '+(G.idx+1)+' / '+G.levels.length+' 关';
  $('#hud-steps').textContent=G.steps;
}

/* ---------------- 通用拖拽(指针事件,兼容触摸) ---------------- */
function makeDrag(elm,opts){
  var sx=0,sy=0,active=false;
  elm.addEventListener('pointerdown',function(e){
    active=true;sx=e.clientX;sy=e.clientY;
    try{elm.setPointerCapture(e.pointerId);}catch(err){}
    if(opts.onStart){opts.onStart(e);}
    e.preventDefault();
  });
  elm.addEventListener('pointermove',function(e){
    if(!active){return;}
    opts.onDrag(e,e.clientX-sx,e.clientY-sy);
  });
  function end(e){
    if(!active){return;}
    active=false;
    if(opts.onEnd){opts.onEnd(e,e.clientX-sx,e.clientY-sy);}
  }
  elm.addEventListener('pointerup',end);
  elm.addEventListener('pointercancel',end);
}
/* 卡片式拖拽:拖动时显示"幽灵卡片",松手时命中 data-drop 目标 */
function ghostDrag(elm,opts){
  makeDrag(elm,{
    onStart:function(){
      elm.classList.add('dragging');
      var g=ce('div','drag-ghost');g.textContent=elm.getAttribute('data-text');
      document.body.appendChild(g);elm._ghost=g;
    },
    onDrag:function(e){
      var g=elm._ghost;if(!g){return;}
      g.style.left=e.clientX+'px';g.style.top=e.clientY+'px';
      clearHl();
      var t=dropAt(e);if(t){t.classList.add('hl');}
    },
    onEnd:function(e){
      var g=elm._ghost;if(g){g.remove();elm._ghost=null;}
      clearHl();elm.classList.remove('dragging');
      var t=dropAt(e);
      if(t){opts.drop(t,elm);}else if(opts.miss){opts.miss();}
    }
  });
  function dropAt(e){
    var el=document.elementFromPoint(e.clientX,e.clientY);
    while(el&&el!==document.body){
      if(el.getAttribute&&el.getAttribute('data-drop')){return el;}
      el=el.parentElement;
    }
    return null;
  }
  function clearHl(){
    var list=document.querySelectorAll('[data-drop].hl');
    for(var i=0;i<list.length;i++){list[i].classList.remove('hl');}
  }
}

/* ---------------- 庆祝动画(G5 彩纸) ---------------- */
var FX={
  cv:null,ctx:null,parts:[],raf:0,rain:false,
  init:function(){
    this.cv=$('#fx-canvas');this.ctx=this.cv.getContext('2d');
    var self=this;
    function rs(){self.cv.width=window.innerWidth;self.cv.height=window.innerHeight;}
    rs();window.addEventListener('resize',rs);
  },
  colors:function(){return [PAL.c1,PAL.c2,'#f2b705','#43a047','#8e44ad','#e91e63'];},
  burst:function(n){
    n=n||90;
    var w=this.cv.width,h=this.cv.height;
    for(var i=0;i<n;i++){
      var c=this.colors()[ri(0,5)];
      this.parts.push({
        x:w/2+(Math.random()-0.5)*160,y:h*0.32,
        vx:(Math.random()-0.5)*13,vy:-Math.random()*9-3,
        g:0.28,rot:Math.random()*6.28,vr:(Math.random()-0.5)*0.35,
        w:ri(7,13),h:ri(4,8),color:c,life:1,decay:0.006+Math.random()*0.005
      });
    }
    this.run();
  },
  dropOne:function(){
    var w=this.cv.width;
    this.parts.push({
      x:Math.random()*w,y:-14,vx:(Math.random()-0.5)*2.4,vy:Math.random()*2.4+1.6,
      g:0.05,rot:Math.random()*6.28,vr:(Math.random()-0.5)*0.3,
      w:ri(7,12),h:ri(4,8),color:this.colors()[ri(0,5)],life:1,decay:0.0035
    });
  },
  startRain:function(){this.rain=true;this.run();},
  stopRain:function(){this.rain=false;},
  run:function(){
    if(this.raf){return;}
    var self=this;
    function loop(){
      var ctx=self.ctx,w=self.cv.width,h=self.cv.height;
      ctx.clearRect(0,0,w,h);
      if(self.rain&&self.parts.length<260){
        for(var k=0;k<3;k++){self.dropOne();}
      }
      for(var i=self.parts.length-1;i>=0;i--){
        var p=self.parts[i];
        p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=p.decay;
        if(p.life<=0||p.y>h+30){self.parts.splice(i,1);continue;}
        ctx.save();
        ctx.globalAlpha=Math.max(0,Math.min(1,p.life));
        ctx.translate(p.x,p.y);ctx.rotate(p.rot);
        ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
        ctx.restore();
      }
      if(self.parts.length>0||self.rain){self.raf=requestAnimationFrame(loop);}
      else{self.raf=0;ctx.clearRect(0,0,w,h);}
    }
    this.raf=requestAnimationFrame(loop);
  }
};

/* ---------------- 数字线组件(拖动定位作答) ---------------- */
function makeNumLine(cfg){
  var root=ce('div','numline');
  var track=ce('div','nl-track');
  root.appendChild(track);
  var ticks=Math.round((cfg.max-cfg.min)/cfg.tick);
  var i,tk,lb;
  for(i=0;i<=ticks;i++){
    tk=ce('span','nl-tick');tk.style.left=(i/ticks*100)+'%';
    if(i%cfg.majorEvery===0){
      tk.className='nl-tick major';
      lb=ce('span','nl-lab');lb.style.left=(i/ticks*100)+'%';
      lb.textContent=cfg.fmt(cfg.min+i*cfg.tick);
      track.appendChild(lb);
    }
    track.appendChild(tk);
  }
  var mk=ce('div','nl-marker','<b></b><i></i>');
  track.appendChild(mk);
  var bubble=mk.querySelector('b');
  var val=cfg.v0;
  function set(v){
    val=Math.round(v/cfg.snap)*cfg.snap;
    if(val<cfg.min){val=cfg.min;}
    if(val>cfg.max){val=cfg.max;}
    mk.style.left=((val-cfg.min)/(cfg.max-cfg.min)*100)+'%';
    bubble.textContent=cfg.live(val);
  }
  function fromEvent(e){
    var r=track.getBoundingClientRect();
    var t=(e.clientX-r.left)/r.width;
    if(t<0){t=0;}if(t>1){t=1;}
    set(cfg.min+t*(cfg.max-cfg.min));
  }
  var dragging=false;
  track.addEventListener('pointerdown',function(e){
    dragging=true;
    try{track.setPointerCapture(e.pointerId);}catch(err){}
    fromEvent(e);e.preventDefault();
  });
  track.addEventListener('pointermove',function(e){if(dragging){fromEvent(e);}});
  track.addEventListener('pointerup',function(e){
    if(!dragging){return;}
    dragging=false;fromEvent(e);bump();
    if(cfg.onEnd){cfg.onEnd(val);}
  });
  track.addEventListener('pointercancel',function(){dragging=false;});
  set(cfg.v0);
  return {root:root,set:set,get:function(){return val;}};
}

var A1_POOL=[

];

function makeA1(){
  var st={done:false,placed:0,need:6,chosen:[],body:null,noteAdded:false};
  var BINS=[
    {k:'must',name:'必然事件',tip:'一定会发生'},
    {k:'rand',name:'随机事件',tip:'可能发生,也可能不发生'},
    {k:'imp',name:'不可能事件',tip:'一定不会发生'}
  ];
  function pickCards(){
    var by={must:[],rand:[],imp:[]},i;
    for(i=0;i<A1_POOL.length;i++){by[A1_POOL[i].k].push(A1_POOL[i]);}
    var out=[];
    ['must','rand','imp'].forEach(function(k){
      shuffle(by[k]);
      out.push(by[k][0],by[k][1]);
    });

    var chips=binEl.querySelector('.bin-chips');

      '<p>· <b>必然事件</b>:一定会发生(如四边形内角和360°)。</p>'+
      '<p>· <b>随机事件</b>:可能发生也可能不发生(如"内错角相等"、"梯形的对角线不相等")。</p>'+
      '<p>· <b>不可能事件</b>:一定不会发生。原题中"存在实数x满足x²+1=0"——因为 x²≥0,x²+1≥1 恒大于0,所以没有实数解,是<span class="hl">不可能事件(原题选D)</span>。</p>'+
      '<p>判断绝招:问自己"它一定发生吗?一定不发生吗?"都不一定,就是随机事件。</p>';

  }

      });

function makeA2(){
  var st={done:false,v:6,slots:{num:null,den:null},body:null,cardEls:{}};
  function dieFace(n){
    var map={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};

    }

  }
  function readout(){
    var r=st.body.querySelector('.a2-ro');
    if(st.slots.num&&st.slots.den){
      r.innerHTML='当前拼出的概率 = <b>'+st.slots.num+' / '+st.slots.den+
        '</b> ≈ '+(st.slots.num/st.slots.den).toFixed(3);
    }else{
      r.innerHTML='把数字卡片拖进<b>分子</b>和<b>分母</b>框,拼出"第五次掷出 '+st.v+' 点"的概率。';
    }

      st.done=true;
      var dice=st.body.querySelectorAll('.die');
      for(var i=0;i<dice.length;i++){dice[i].classList.add('shake');}
      passLevel(
        '<p><b>真相:</b>每次抛掷都是<b>相互独立</b>的,骰子没有"记忆"!</p>'+
        '<p>前四次都掷出 '+st.v+' 点,并不会让第五次更容易或更难出现 '+st.v+'。第五次仍然面对同样6个等可能的结果。</p>'+
        '<p>P(第五次掷出 '+st.v+' 点) = <b>1/6 ≈ 0.167</b>。(原题以6点为例,答案 1/6)</p>'
      );
    }else{
      var fb=st.body.querySelector('.frac-build');
      fb.classList.add('shake');
      setTimeout(function(){fb.classList.remove('shake');},500);
      toast('再想想:骰子有"记忆"吗?前四次的结果会改变第五次吗?');
      readout();
    }
  }
  function setSlot(slotEl,val){

    if(st.slots[which]!=null){
      // 原来的卡片退回卡槽
      var old=st.cardEls[st.slots[which]];

    if(val!=null){
      slotEl.textContent=val;
      slotEl.classList.add('full');
    }else{
      slotEl.innerHTML='<span class="slot-tag">'+(which==='num'?'分子':'分母')+'</span>';
      slotEl.classList.remove('full');

  }
  return {

      st.done=false;st.v=ri(1,6);st.slots={num:null,den:null};st.cardEls={};
      var body=scaffold(root,{
        title:def.diff+' · 幸运第五掷',

        intro:'原题:"一枚正方体骰子六个面上分别标有数字1、2、3、4、5、6,若连续抛掷四次,朝上一面的点数都为6,则第五次抛掷朝上一面的点数为6的概率是___"。<br>本关换了数字:连续四次都掷出了 <b class="hl">'+st.v+

        if(roll>=8){

        var c=ce('div','card-drag',String(n));

        });
        tray.appendChild(c);
      });
      body.appendChild(tray);

      if(st.done){toast('本关已通关啦');return;}
      st.done=true;G.revealed=true;
      /* 清空并示范 1/6 */
      var slots=st.body.querySelectorAll('.slot');
      setSlot(slots[0],null);setSlot(slots[1],null);
      setTimeout(function(){setSlot(slots[0],1);},350);
      setTimeout(function(){setSlot(slots[1],6);},750);
      st.body.appendChild(ce('div','reveal-note',
        '<b>已揭示答案:</b>1/6。每次抛掷相互独立,前四次的结果不影响第五次,仍然是6个等可能结果中的1个。点"重新开始"换数字再战!'));
    }
  };

/* =========================================================
   关卡 B1:太极涂色(点涂区域,让灰色概率恰为 π/8)
   ========================================================= */
var B1_MASKS=null;   // 四个区域的像素掩码(懒加载,只建一次)
function b1RegionPath(ctx,k){
  var cx=230,cy=230,a=180,r2=90;
  ctx.beginPath();
  if(k===0){        // 右半(去掉下小圆的右半)
    ctx.arc(cx,cy,a,-Math.PI/2,Math.PI/2,false);
    ctx.arc(cx,cy+r2,r2,Math.PI/2,-Math.PI/2,true);
    ctx.closePath();
  }else if(k===1){  // 下小圆右半
    ctx.arc(cx,cy+r2,r2,-Math.PI/2,Math.PI/2,false);
    ctx.closePath();
  }else if(k===2){  // 左半(去掉上小圆的左半)
    ctx.arc(cx,cy,a,Math.PI/2,Math.PI*1.5,false);
    ctx.arc(cx,cy-r2,r2,-Math.PI/2,Math.PI/2,true);
    ctx.closePath();
  }else{            // 上小圆左半
    ctx.arc(cx,cy-r2,r2,Math.PI/2,Math.PI*1.5,false);
    ctx.closePath();
  }
}
function b1BuildMasks(){
  if(B1_MASKS){return;}
  B1_MASKS=[];
  var off=document.createElement('canvas');
  off.width=460;off.height=460;
  var c=off.getContext('2d');
  for(var k=0;k<4;k++){
    c.clearRect(0,0,460,460);
    c.fillStyle='#fff';
    b1RegionPath(c,k);
    c.fill();
    var img=c.getImageData(0,0,460,460).data;
    var m=new Uint8Array(460*460);
    for(var i=0;i<m.length;i++){m[i]=img[i*4]>127?1:0;}
    B1_MASKS.push(m);
  }
}
function b1RegionAt(x,y){
  if(x<0||y<0||x>=460||y>=460){return -1;}
  var idx=Math.floor(y)*460+Math.floor(x);
  for(var k=0;k<4;k++){
    if(B1_MASKS[k][idx]){return k;}
  }
  return -1;
}
function makeB1(){
  var st={done:false,gray:[false,false,false,false],cv:null,body:null,pins:[]};
  var WGT=[3,1,3,1];   // 各区域占大圆的比例(×πa²/8)
  function grayN(){
    var s=0;
    for(var i=0;i<4;i++){if(st.gray[i]){s+=WGT[i];}}
    return s;
  }
  function draw(){
    var ctx=st.cv.getContext('2d');
    ctx.clearRect(0,0,460,460);
    /* 正方形底 */
    ctx.fillStyle='#fdfaf4';
    ctx.fillRect(50,50,360,360);
    /* 四个区域:灰/白 */
    for(var k=0;k<4;k++){
      b1RegionPath(ctx,k);
      ctx.fillStyle=st.gray[k]?PAL.c1:'#ffffff';
      ctx.fill();
      ctx.strokeStyle='rgba(60,45,25,.9)';
      ctx.lineWidth=3;
      ctx.stroke();
    }
    /* 落针验证的小点 */
    for(var p=0;p<st.pins.length;p++){
      ctx.beginPath();
      ctx.arc(st.pins[p].x,st.pins[p].y,2.6,0,6.283);
      ctx.fillStyle=st.pins[p].in?PAL.c2:'#b9aa93';
      ctx.fill();
    }
    /* 正方形边框与标注(题干图形条件完整重绘) */
    ctx.strokeStyle=PAL.ink;
    ctx.lineWidth=4;
    ctx.strokeRect(50,50,360,360);
    ctx.fillStyle=PAL.ink;
    ctx.font='bold 22px "Microsoft YaHei",sans-serif';
    ctx.fillText('A',26,44);ctx.fillText('B',436,44);
    ctx.fillText('C',436,432);ctx.fillText('D',26,432);
    ctx.font='bold 20px "Microsoft YaHei",sans-serif';
    ctx.fillText('2a',218,32);
    ctx.beginPath();ctx.moveTo(50,38);ctx.lineTo(410,38);
    ctx.lineWidth=2;ctx.stroke();
  }
  function readout(){
    var n=grayN();
    var ro=st.body.querySelector('.b1-ro');
    var pDec=n===0?0:(n*Math.PI/32);
    var html='已涂灰色面积 = 大圆面积的 <b>'+(n===0?'0':fracStr(n,8))+'</b>'+
      '　→　P(针尖落在灰色区域) = <b>'+(n===0?'0':piStr(n,32))+'</b>'+(n===0?'':' ≈ '+pDec.toFixed(4));
    if(n===4){
      html+='<br><span class="ok">恰好是 π/8,和原题答案一致!正在落针验证……</span>';
    }else{
      html+='<br>目标:让 P 恰好 = <b>π/8 ≈ 0.3927</b>(即灰色面积 = 大圆的一半)。点一下图中的区域即可涂灰/擦白。';
    }
    ro.innerHTML=html;
  }
  function verify(){
    var tk=TOKEN;
    st.pins=[];
    var hits=0,total=120,i=0;
    function step(){
      if(tk!==TOKEN||st.done){return;}
      var ctx=st.cv.getContext('2d');
      for(var c=0;c<3&&i<total;c++,i++){
        var x=50+Math.random()*360,y=50+Math.random()*360;
        var k=b1RegionAt(x,y);
        var ing=(k>=0&&st.gray[k]);
        if(ing){hits++;}
        st.pins.push({x:x,y:y,in:ing});
      }
      draw();
      if(i<total){requestAnimationFrame(step);}
      else{
        /* 落针期间若区域被改动,则中止验证 */
        if(grayN()!==4){
          toast('灰色区域被改动了,请让概率重新恰好等于 π/8');
          st.pins=[];draw();readout();
          return;
        }
        st.done=true;
        passLevel(
          '<p>你涂出的灰色区域面积 = <b>大圆面积的一半 = πa²/2</b>(太极"小鱼"无论怎么游,都恰好占大圆一半)。</p>'+
          '<p>正方形 ABCD 边长 2a,面积 = (2a)² = <b>4a²</b>。</p>'+
          '<p>P = (πa²/2) ÷ 4a² = <b>π/8 ≈ 0.3927</b>(原题选C)。</p>'+
          '<p>落针验证:'+hits+'/'+total+' ≈ '+(hits/total).toFixed(3)+',和理论值吻合!</p>'
        );
      }
    }
    requestAnimationFrame(step);
  }
  return {
    title:'太极涂色',
    build:function(root,def){
      b1BuildMasks();
      st.done=false;st.gray=[false,false,false,false];st.pins=[];
      var body=scaffold(root,{
        title:def.diff+' · 太极涂色',
        src:'改编自 2023-2024南京市八年级期末第7题(太极图落针)',
        intro:'原题:"如图,正方形ABCD内的图形来自中国古代的太极图,现随机向正方形内掷一枚小针,则针尖落在灰色区域内的概率为___"(原题选C,π/8)。<br>图中大圆半径为 a,四个可涂区域:左右两个"大半叶"(各占大圆 3/8)、上下两个"小半叶"(各占大圆 1/8)。<b class="hl">点一点,涂出灰色区域</b>,让"针尖落在灰色区域"的概率恰好等于 <b class="hl">π/8</b>,再由系统落针验证!'
      });
      st.body=body;
      var cv=ce('canvas','board');
      cv.width=460;cv.height=460;
      cv.addEventListener('pointerup',function(e){
        if(st.done||G.revealed){return;}
        var p=cpos(e,cv);
        var k=b1RegionAt(p.x,p.y);
        if(k>=0){
          st.gray[k]=!st.gray[k];
          bump();
          draw();readout();
          if(grayN()===4){setTimeout(verify,300);}
        }
      });
      body.appendChild(cv);
      st.cv=cv;
      body.appendChild(ce('div','ro b1-ro'));
      draw();readout();
    },
    reveal:function(){
      if(st.done){toast('本关已通关啦');return;}
      st.done=true;G.revealed=true;
      st.gray=[true,false,false,true];   // 右半大叶 + 上小左叶 = 一条完整的"太极鱼"
      draw();
      st.body.querySelector('.b1-ro').innerHTML=
        '已揭示:涂"右侧大半叶 + 左上小半叶"即一条太极鱼,面积 = 3πa²/8 + πa²/8 = <b>πa²/2</b>,P = πa²/2 ÷ 4a² = <b>π/8</b>。点"重新开始"再独立涂一次!';
      st.body.appendChild(ce('div','reveal-note',
        '<b>已揭示答案:</b>任何一种"一半"涂法(左半、右半、或两条小鱼中的任一条)面积都是 πa²/2,概率都是 π/8 ≈ 0.3927(原题选C)。'));
    }
  };
}

/* =========================================================
   关卡 B2:网格扇形师(拖格点 A、B,构造 √10 与 90°)
   ========================================================= */
function makeB2(){
  var st={done:false,cv:null,body:null,A:null,B:null};
  var MX=40,MY=36,U=60;              // 画布边距与单位格边长(px)
  function P(i,j){return {x:MX+U*i,y:MY+300-U*j};}   // 格点 → 像素(y 轴向上)
  var O={i:3,j:2};
  function nearest(px,py){
    var i=Math.round((px-MX)/U),j=Math.round((MY+300-py)/U);
    if(i<0){i=0;}if(i>6){i=6;}
    if(j<0){j=0;}if(j>5){j=5;}
    return {i:i,j:j};
  }
  function vec(p){var o=P(O.i,O.j);return {x:p.px-o.x,y:p.py-o.y};}
  function lensq(v){return (v.x*v.x+v.y*v.y)/(U*U);}   // 单位化为"格"的平方
  function angleBetween(){
    var a=vec(st.A),b=vec(st.B);
    var d=(a.x*b.x+a.y*b.y)/Math.sqrt((a.x*a.x+a.y*a.y)*(b.x*b.x+b.y*b.y));
    if(d>1){d=1;}if(d<-1){d=-1;}
    return Math.acos(d)*180/Math.PI;
  }
  function draw(){
    var ctx=st.cv.getContext('2d');
    ctx.clearRect(0,0,440,400);
    /* 网格 */
    ctx.strokeStyle='#c9b998';ctx.lineWidth=1.5;
    for(var i=0;i<=6;i++){
      ctx.beginPath();ctx.moveTo(MX+U*i,MY);ctx.lineTo(MX+U*i,MY+300);ctx.stroke();
    }
    for(var j=0;j<=5;j++){
      ctx.beginPath();ctx.moveTo(MX,MY+U*j);ctx.lineTo(MX+360,MY+U*j);ctx.stroke();
    }
    /* 阴影扇形(OA=OB 时) */
    var a=vec(st.A),b=vec(st.B);
    var la=Math.sqrt(a.x*a.x+a.y*a.y),lb=Math.sqrt(b.x*b.x+b.y*b.y);
    var o=P(O.i,O.j);
    if(Math.abs(la-lb)<1&&la>1){
      var a1=Math.atan2(a.y,a.x),a2=Math.atan2(b.y,b.x);
      var diff=(a2-a1)%(2*Math.PI);
      if(diff<0){diff+=2*Math.PI;}
      var a2n=a1+diff;
      ctx.beginPath();
      ctx.moveTo(o.x,o.y);
      ctx.arc(o.x,o.y,la,a1,a2n,false);
      ctx.closePath();
      ctx.fillStyle=PAL.c1;ctx.globalAlpha=0.45;ctx.fill();ctx.globalAlpha=1;
    }
    /* 射线 OA、OB */
    ctx.strokeStyle=PAL.c2;ctx.lineWidth=3;
    [[st.A,'A'],[st.B,'B']].forEach(function(pr){
      var pt=pr[0].px!=null?{x:pr[0].px,y:pr[0].py}:P(pr[0].i,pr[0].j);
      ctx.beginPath();ctx.moveTo(o.x,o.y);ctx.lineTo(pt.x,pt.y);ctx.stroke();
    });
    /* 格点 */
    ctx.fillStyle='#9a8b74';
    for(var gi=0;gi<=6;gi++){
      for(var gj=0;gj<=5;gj++){
        var gp=P(gi,gj);
        ctx.beginPath();ctx.arc(gp.x,gp.y,2.5,0,6.283);ctx.fill();
      }
    }
    /* O、A、B 三点 */
    function drawPt(p,label,color){
      ctx.beginPath();ctx.arc(p.x,p.y,9,0,6.283);
      ctx.fillStyle=color;ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.stroke();
      ctx.fillStyle=PAL.ink;
      ctx.font='bold 19px "Microsoft YaHei",sans-serif';
      ctx.fillText(label,p.x+11,p.y-11);
    }
    drawPt(o,'O','#3d3d3d');
    drawPt(st.A.px!=null?{x:st.A.px,y:st.A.py}:P(st.A.i,st.A.j),'A',PAL.c1);
    drawPt(st.B.px!=null?{x:st.B.px,y:st.B.py}:P(st.B.i,st.B.j),'B',PAL.c2);
    /* 单位标注 */
    ctx.fillStyle=PAL.ink;
    ctx.font='16px "Microsoft YaHei",sans-serif';
    ctx.fillText('1',MX+U*0.5-4,MY+300+18);
    ctx.beginPath();ctx.moveTo(MX,MY+300+8);ctx.lineTo(MX+U,MY+300+8);
    ctx.strokeStyle=PAL.ink;ctx.lineWidth=2;ctx.stroke();
    ctx.font='bold 17px "Microsoft YaHei",sans-serif';
    ctx.fillText('每个小正方形边长 = 1,网格面积 = 6×5×1 = 30',MX,MY+300+38);
  }
  function readout(){
    var a=vec(st.A),b=vec(st.B);
    var qa=lensq(a),qb=lensq(b);
    var ang=angleBetween();
    var la=Math.sqrt(a.x*a.x+a.y*a.y),lb=Math.sqrt(b.x*b.x+b.y*b.y);
    var html='OA² = <b>'+qa.toFixed(1)+'</b>(格²)　OB² = <b>'+qb.toFixed(1)+'</b>(格²)　∠AOB = <b>'+ang.toFixed(1)+'°</b><br>';
    if(Math.abs(la-lb)<1&&la>1){
      var area=ang/360*Math.PI*qa;
      html+='扇形OAB面积 = '+ang.toFixed(0)+'/360 × π × '+qa.toFixed(0)+' = <b>'+area.toFixed(2)+'</b>　P(落在扇形内) = <b>'+(area/30).toFixed(4)+'</b>';
    }else{
      html+='先把 OA、OB 调成一样长,才能形成扇形哦';
    }
    html+='<br>目标:<b>OA=OB=√10(即 OA²=OB²=10)</b> 且 <b>∠AOB=90°</b> → P = π/12 ≈ 0.2618(原题选A)';
    st.body.querySelector('.b2-ro').innerHTML=html;
  }
  function checkPass(){
    if(st.done||G.revealed){return;}
    var a=vec(st.A),b=vec(st.B);
    var qa=Math.round(lensq(a)),qb=Math.round(lensq(b));
    var ang=angleBetween();
    if(qa===10&&qb===10&&Math.abs(ang-90)<=0.5){
      verify(qa,ang);
    }
  }
  function verify(){
    var tk=TOKEN;
    var o=P(O.i,O.j);
    var a=vec(st.A),b=vec(st.B);
    var a1=Math.atan2(a.y,a.x),a2=Math.atan2(b.y,b.x);
    var diff=(a2-a1)%(2*Math.PI);if(diff<0){diff+=2*Math.PI;}
    var r=Math.sqrt(a.x*a.x+a.y*a.y);
    var ctx=st.cv.getContext('2d');
    var total=400,hits=0,i=0;
    function step(){
      if(tk!==TOKEN||st.done){return;}
      for(var c=0;c<8&&i<total;c++,i++){
        var x=MX+Math.random()*360,y=MY+Math.random()*300;
        var dx=x-o.x,dy=y-o.y;
        var dd=Math.atan2(dy,dx)-a1;
        dd=dd%(2*Math.PI);if(dd<0){dd+=2*Math.PI;}
        var inSec=(dx*dx+dy*dy<=r*r&&dd<=diff);
        if(inSec){hits++;}
        ctx.beginPath();ctx.arc(x,y,2.2,0,6.283);
        ctx.fillStyle=inSec?PAL.c1:'#c7bba3';
        ctx.fill();
      }
      if(i<total){requestAnimationFrame(step);}
      else{
        /* 落点期间若 A、B 被拖动,则中止验证 */
        var qa2=Math.round(lensq(vec(st.A))),qb2=Math.round(lensq(vec(st.B)));
        var ang2=angleBetween();
        if(!(qa2===10&&qb2===10&&Math.abs(ang2-90)<=0.5)){
          toast('A、B 被拖动了,请重新摆到 OA=OB=√10 且 ∠AOB=90°');
          return;
        }
        st.done=true;
        passLevel(
          '<p>扇形OAB面积 = 90/360 × π × (√10)² = <b>2.5π</b>;网格总面积 = 6×5×1 = <b>30</b>。</p>'+
          '<p>P(飞镖落在扇形内) = 2.5π ÷ 30 = <b>π/12 ≈ 0.2618</b>(原题选A)。</p>'+
          '<p>模拟落点:'+hits+'/'+total+' ≈ '+(hits/total).toFixed(3)+',与理论值吻合!</p>'
        );
      }
    }
    requestAnimationFrame(step);
  }
  return {
    title:'网格扇形师',
    build:function(root,def){
      st.done=false;
      var ai,bi;
      /* 初始随机放两个格点(避开 O 点和彼此重合) */
      do{ai={i:ri(0,6),j:ri(0,5)};}while(ai.i===O.i&&ai.j===O.j);
      do{bi={i:ri(0,6),j:ri(0,5)};}while((bi.i===O.i&&bi.j===O.j)||(bi.i===ai.i&&bi.j===ai.j));
      st.A=ai;st.B=bi;
      var body=scaffold(root,{
        title:def.diff+' · 网格扇形师',
        src:'改编自 2021-2022苏州中考第6题(网格扇形概率)',
        intro:'原题情境:在由30个边长为1的小正方形组成的网格中,O是格点,且 OA=OB=√10,∠AOB=90°。向网格中任意投掷一枚飞镖(落在网格内每点机会相等),求飞镖落在扇形OAB(阴影部分)内的概率(原题选A,π/12)。<br><b class="hl">本关由你来构造:</b>拖动 <b class="hl">A、B</b> 两个点(会自动吸附到格点),使 <b class="hl">OA=OB=√10 且 ∠AOB=90°</b>,构造正确即自动落点验证!'
      });
      st.body=body;
      var cv=ce('canvas','board');
      cv.width=440;cv.height=400;
      st.cv=cv;
      body.appendChild(cv);
      body.appendChild(ce('div','ro b2-ro'));
      /* 拖动 A/B */
      var dragPt=null;
      function ptPos(p){return p.px!=null?{x:p.px,y:p.py}:P(p.i,p.j);}
      cv.addEventListener('pointerdown',function(e){
        if(st.done||G.revealed){return;}
        var m=cpos(e,cv);
        var pa=ptPos(st.A),pb=ptPos(st.B);
        if(Math.hypot(m.x-pa.x,m.y-pa.y)<20){dragPt=st.A;}
        else if(Math.hypot(m.x-pb.x,m.y-pb.y)<20){dragPt=st.B;}
        if(dragPt){
          try{cv.setPointerCapture(e.pointerId);}catch(err){}
          e.preventDefault();
        }
      });
      cv.addEventListener('pointermove',function(e){
        if(!dragPt){return;}
        var m=cpos(e,cv);
        dragPt.px=m.x;dragPt.py=m.y;
        draw();readout();
      });
      function up(){
        if(!dragPt){return;}
        var near=nearest(dragPt.px,dragPt.py);
        dragPt.i=near.i;dragPt.j=near.j;dragPt.px=null;dragPt.py=null;
        dragPt=null;
        bump();
        draw();readout();
        checkPass();
      }
      cv.addEventListener('pointerup',up);
      cv.addEventListener('pointercancel',function(){dragPt=null;});
      draw();readout();
    },
    reveal:function(){
      if(st.done){toast('本关已通关啦');return;}
      st.done=true;G.revealed=true;
      /* 示范解:O(3,2),A(4,5),B(0,3):向量(1,3)与(-3,1)长度均√10且垂直 */
      var fromA=P(st.A.i,st.A.j),fromB=P(st.B.i,st.B.j);
      var toA=P(4,5),toB=P(0,3);
      var tk=TOKEN,t0=null;
      function anim(ts){
        if(tk!==TOKEN){return;}
        if(t0==null){t0=ts;}
        var t=Math.min(1,(ts-t0)/600);
        st.A.px=fromA.x+(toA.x-fromA.x)*t;st.A.py=fromA.y+(toA.y-fromA.y)*t;
        st.B.px=fromB.x+(toB.x-fromB.x)*t;st.B.py=fromB.y+(toB.y-fromB.y)*t;
        draw();
        if(t<1){requestAnimationFrame(anim);}
        else{st.A={i:4,j:5};st.B={i:0,j:3};draw();readout();}
      }
      requestAnimationFrame(anim);
      st.body.appendChild(ce('div','reveal-note',
        '<b>已揭示答案:</b>一种构造是 A 在 O 右上方(相隔1格、3格),B 在 O 左上方(相隔3格、1格):两向量 (1,3) 与 (-3,1) 长度都是 √10,数量积 1×(-3)+3×1=0,所以夹角90°。扇形面积 = 90/360×π×10 = 2.5π,P = 2.5π/30 = <b>π/12</b>(原题选A)。点"重新开始"再独立构造一次!'));
    }
  };
}

/* =========================================================
   关卡 B3:麦穗实验员(加批次试验,拖数字线估计概率)
   ========================================================= */
function makeB3(){
  var st={done:false,body:null,batches:0,rows:null,points:[]};
  var DOC=[{n:100,m:94},{n:200,m:191},{n:500,m:473},{n:1000,m:954},{n:2000,m:1906},{n:5000,m:4748}];
  function buildTable(){
    var tb=ce('div','tbl-scroll');
    var html='<table class="data"><tr><th>试验的麦粒数 n</th>';
    st.points.forEach(function(p){html+='<th>'+p.n+'</th>';});
    html+='</tr><tr><td>发芽的麦粒数 m</td>';
    st.points.forEach(function(p){html+='<td'+(p.fresh?' class="new"':'')+'>'+p.m+'</td>';});
    html+='</tr><tr><td>发芽的频率 m/n</td>';
    st.points.forEach(function(p){html+='<td'+(p.fresh?' class="new"':'')+'>'+(p.m/p.n).toFixed(4)+'</td>';});
    html+='</tr></table>';
    tb.innerHTML=html;
    return tb;
  }
  function drawChart(){
    var cv=st.body.querySelector('canvas');
    var ctx=cv.getContext('2d');
    ctx.clearRect(0,0,480,220);
    var L=58,R=452,T=18,B=186;
    ctx.strokeStyle='#c9b998';ctx.lineWidth=1.5;
    ctx.strokeRect(L,T,R-L,B-T);
    /* y 轴刻度 0.90~1.00 */
    ctx.fillStyle=PAL.ink;ctx.font='13px "Microsoft YaHei",sans-serif';
    for(var k=0;k<=4;k++){
      var v=0.90+k*0.025;
      var y=B-(v-0.90)/0.10*(B-T);
      ctx.beginPath();ctx.moveTo(L-5,y);ctx.lineTo(L,y);ctx.stroke();
      ctx.fillText(v.toFixed(3).slice(0,4),6,y+4);
    }
    /* x 轴刻度 0~10000 */
    for(var n=0;n<=10000;n+=2000){
      var x=L+n/10000*(R-L);
      ctx.beginPath();ctx.moveTo(x,B);ctx.lineTo(x,B+5);ctx.stroke();
      ctx.fillText(String(n),x-16,B+18);
    }
    ctx.font='14px "Microsoft YaHei",sans-serif';
    ctx.fillText('试验麦粒数 n →',250,212);
    ctx.save();
    ctx.translate(14,120);ctx.rotate(-Math.PI/2);
    ctx.fillText('发芽频率',-30,0);
    ctx.restore();
    /* 0.95 参考虚线 */
    var y95=B-0.05/0.10*(B-T);
    ctx.setLineDash([6,5]);
    ctx.strokeStyle=PAL.c2;
    ctx.beginPath();ctx.moveTo(L,y95);ctx.lineTo(R,y95);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=PAL.c2;
    ctx.fillText('0.95',R-38,y95-6);
    /* 频率折线与点 */
    ctx.strokeStyle=PAL.c1;ctx.lineWidth=2;
    ctx.beginPath();
    st.points.forEach(function(p,i){
      var x=L+p.n/10000*(R-L);
      var y=B-(p.m/p.n-0.90)/0.10*(B-T);
      if(i===0){ctx.moveTo(x,y);}else{ctx.lineTo(x,y);}
    });
    ctx.stroke();
    st.points.forEach(function(p,i){
      var x=L+p.n/10000*(R-L);
      var y=B-(p.m/p.n-0.90)/0.10*(B-T);
      ctx.beginPath();
      ctx.arc(x,y,i===st.points.length-1?5:3.2,0,6.283);
      ctx.fillStyle=i===st.points.length-1?PAL.c2:PAL.c1;
      ctx.fill();
    });
  }
  return {
    title:'麦穗实验员',
    build:function(root,def){
      st.done=false;st.batches=0;
      st.points=DOC.map(function(p){return {n:p.n,m:p.m,fresh:false};});
      var body=scaffold(root,{
        title:def.diff+' · 麦穗实验员',

/* =========================================================
   关卡 C1:圆碟安全区(拖圆碟探索 + 拖/调安全区方框)
   ========================================================= */
function makeC1(){
  var st={done:false,body:null,cv:null,cfg:null,disc:null,sq:null,mode:null};
  var CFGS=[
    {a:40,r:5},{a:20,r:5},{a:40,r:10},{a:30,r:5},{a:60,r:10}
  ];
  function k(){return 136/st.cfg.a;}          // cm → px 比例
  function px(v){return v*k();}
  function safeS(){return st.cfg.a-2*st.cfg.r;}
  function distToLines(cm){
    var a=st.cfg.a,best=1e9;
    var ls=[0,a,2*a,3*a];
    for(var i=0;i<ls.length;i++){
      var dx=Math.abs(cm.x-ls[i]),dy=Math.abs(cm.y-ls[i]);
      if(dx<best){best=dx;}
      if(dy<best){best=dy;}
    }
    return best;
  }
  function draw(extra){
    var ctx=st.cv.getContext('2d');
    var K=k();
    ctx.clearRect(0,0,408,408);
    /* 地砖 */
    ctx.fillStyle='#f7f1e4';
    ctx.fillRect(0,0,408,408);
    ctx.strokeStyle='#8b7355';ctx.lineWidth=5;
    for(var i=0;i<=3;i++){
      ctx.beginPath();ctx.moveTo(i*136,0);ctx.lineTo(i*136,408);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,i*136);ctx.lineTo(408,i*136);ctx.stroke();
    }
    /* 验证点 */
    if(extra){
      for(var q=0;q<extra.length;q++){
        ctx.beginPath();
        ctx.arc(px(extra[q].x),px(extra[q].y),2.4,0,6.283);
        ctx.fillStyle=extra[q].safe?'#2e9e5b':'#d95f4a';
        ctx.fill();
      }
    }
    /* 学生的安全区方框 */
    ctx.setLineDash([9,6]);
    ctx.strokeStyle='#e08a00';ctx.lineWidth=4;
    ctx.strokeRect(px(st.sq.x),px(st.sq.y),px(st.sq.s),px(st.sq.s));
    ctx.setLineDash([]);
    /* 角柄 */
    ctx.beginPath();
    ctx.arc(px(st.sq.x+st.sq.s),px(st.sq.y+st.sq.s),9,0,6.283);
    ctx.fillStyle='#e08a00';ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    /* 圆碟 */
    var d=distToLines(st.disc);
    var safe=d>=st.cfg.r-1e-9;
    ctx.beginPath();
    ctx.arc(px(st.disc.x),px(st.disc.y),px(st.cfg.r),0,6.283);
    ctx.fillStyle=safe?'rgba(46,158,91,.55)':'rgba(217,95,74,.55)';
    ctx.fill();
    ctx.strokeStyle=safe?'#1c7a44':'#a33326';
    ctx.lineWidth=3.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(px(st.disc.x),px(st.disc.y),2.6,0,6.283);
    ctx.fillStyle=PAL.ink;ctx.fill();
    /* 标注 */
    ctx.fillStyle=PAL.ink;
    ctx.font='16px "Microsoft YaHei",sans-serif';
    ctx.fillText('地砖 '+st.cfg.a+'cm×'+st.cfg.a+'cm(每格一块)',8,398);
    ctx.font='bold 16px "Microsoft YaHei",sans-serif';
    ctx.fillText('圆碟半径 r='+st.cfg.r+'cm',8,24);
  }
  function readout(){
    var d=distToLines(st.disc);
    var safe=d>=st.cfg.r-1e-9;
    var s=st.sq.s,a=st.cfg.a,r=st.cfg.r;
    var p=1-(s*s)/(a*a);
    var html='圆心到最近缝隙的距离 = <b>'+d.toFixed(1)+' cm</b> '+(safe?'<span class="ok">安全(≥ r='+r+'cm)</span>':'<span class="no">会碰到缝隙!(< r='+r+'cm)</span>');
    html+='<br>你标记的安全区边长 s = <b>'+s+' cm</b> → P(圆碟与缝相交) = 1 − (s/'+a+')² = <b>'+p.toFixed(4)+'</b>';
    if(s===safeS()&&st.sq.x%a===r&&st.sq.y%a===r){
      html+=' <span class="ok">= '+fracStr(a*a-s*s,a*a)+' ✓ 正确!正在验证……</span>';
    }else{
      html+='<br>拖动<b>圆碟</b>到处逛逛(绿=安全,红=碰到缝隙);再拖<b>橙色方框</b>(拖框身移动,拖角柄调大小),把"圆心安全落点区"精确标出来!';
    }
    st.body.querySelector('.c1-ro').innerHTML=html;
  }
  function verify(){
    var tk=TOKEN,a=st.cfg.a,r=st.cfg.r;
    var extra=[],safeCnt=0,total=600,i=0;
    function step(){
      if(tk!==TOKEN||st.done){return;}
      for(var c=0;c<10&&i<total;c++,i++){
        var x=Math.random()*3*a,y=Math.random()*3*a;
        var mx=x%a,my=y%a;
        var safe=(mx>=r-1e-9&&mx<=a-r+1e-9&&my>=r-1e-9&&my<=a-r+1e-9);
        if(safe){safeCnt++;}
        extra.push({x:x,y:y,safe:safe});
      }
      draw(extra);
      st.body.querySelector('.c1-ro').innerHTML=
        '模拟 '+i+' 次抛碟:相交 <b>'+(i-safeCnt)+'</b> 次,频率 = <b>'+((i-safeCnt)/i).toFixed(3)+'</b>(理论值 '+fracStr(a*a-safeS()*safeS(),a*a)+' = '+(1-safeS()*safeS()/(a*a)).toFixed(4)+')……';
      if(i<total){requestAnimationFrame(step);}
      else{
        /* 验证期间若方框被改动,则中止 */
        var a2=st.cfg.a,r2=st.cfg.r;
        var ok2=st.sq.s===a2-2*r2&&(st.sq.x%a2===r2)&&(st.sq.y%a2===r2);
        if(!ok2){
          toast('安全区方框被改动了,请重新精确标记');
          return;
        }
        st.done=true;
        passLevel(
          '<p>圆碟与缝相交 ⟺ 圆心到缝的距离 &lt; r。所以"安全落点区"是每块砖中央边长 <b>'+(st.cfg.a-2*st.cfg.r)+' cm(即 a−2r)</b> 的小正方形。</p>'+
          '<p>P(相交) = 1 − ((a−2r)/a)² = 1 − ('+safeS()+'/'+st.cfg.a+')² = 1 − '+fracStr(safeS()*safeS(),st.cfg.a*st.cfg.a)+' = <b>'+fracStr(st.cfg.a*st.cfg.a-safeS()*safeS(),st.cfg.a*st.cfg.a)+' ≈ '+(1-safeS()*safeS()/(st.cfg.a*st.cfg.a)).toFixed(4)+'</b>。</p>'+
          '<p>模拟600次相交频率 ≈ '+((total-safeCnt)/total).toFixed(3)+',与理论值吻合!(原题数据 40cm 砖、5cm 碟,答案 <b>7/16</b>)</p>'
        );
      }
    }
    requestAnimationFrame(step);
  }
  function checkPass(){
    if(st.done||G.revealed){return;}
    var a=st.cfg.a,r=st.cfg.r;
    var ok=st.sq.s===a-2*r&&(st.sq.x%a===r)&&(st.sq.y%a===r);
    if(ok){setTimeout(verify,250);}
  }
  return {
    title:'圆碟安全区',
    build:function(root,def){
      st.done=false;
      st.cfg=CFGS[ri(0,CFGS.length-1)];
      st.disc={x:st.cfg.a*1.5,y:st.cfg.a*1.5};
      st.sq={x:st.cfg.a,y:st.cfg.a,s:st.cfg.a};
      var c=st.cfg;
      var body=scaffold(root,{
        title:def.diff+' · 圆碟安全区',
        src:'改编自 2024-2025南京市期末第13题(3)(圆碟与地砖缝隙)',
        intro:'原题:"学校操场旁的地面上铺满了正方形的地砖(40cm×40cm),现在向这一地面上抛掷半径为5cm的圆碟,圆碟与地砖间的缝隙相交的概率是___(直接写出答案)"。<br>本关数据:地砖边长 <b class="hl">a='+c.a+'cm</b>,圆碟半径 <b class="hl">r='+c.r+'cm</b>。<b class="hl">第一步</b>:拖动圆碟到处逛,绿=安全、红=碰到缝隙,找出规律;<b class="hl">第二步</b>:把橙色方框拖/调到"圆心的安全落点区"(拖框身移动,拖右下角柄调边长,按1cm吸附),标对即自动验证!'
      });
      st.body=body;
      var cv=ce('canvas','board');
      cv.width=408;cv.height=408;
      st.cv=cv;
      body.appendChild(cv);
      body.appendChild(ce('div','ro c1-ro'));
      function toCm(e){var p=cpos(e,cv);return {x:p.x/k(),y:p.y/k()};}
      var start=null;
      cv.addEventListener('pointerdown',function(e){
        if(st.done||G.revealed){return;}
        var m=toCm(e);
        try{cv.setPointerCapture(e.pointerId);}catch(err){}
        var hx=st.sq.x+st.sq.s,hy=st.sq.y+st.sq.s;
        if(Math.hypot(m.x-hx,m.y-hy)<1.6){st.mode='resize';}
        else if(m.x>=st.sq.x&&m.x<=st.sq.x+st.sq.s&&m.y>=st.sq.y&&m.y<=st.sq.y+st.sq.s){st.mode='move';}
        else{st.mode='disc';st.disc=m;}
        start=m;
        draw();readout();
        e.preventDefault();
      });
      cv.addEventListener('pointermove',function(e){
        if(!st.mode){return;}
        var m=toCm(e);
        if(st.mode==='disc'){
          st.disc.x=Math.max(0.3,Math.min(3*st.cfg.a-0.3,m.x));
          st.disc.y=Math.max(0.3,Math.min(3*st.cfg.a-0.3,m.y));
        }else if(st.mode==='move'){
          st.sq.x=Math.max(0,Math.min(3*st.cfg.a-st.sq.s,m.x-st.sq.s/2));
          st.sq.y=Math.max(0,Math.min(3*st.cfg.a-st.sq.s,m.y-st.sq.s/2));
        }else{
          st.sq.s=Math.max(2,Math.min(st.cfg.a,Math.max(m.x-st.sq.x,m.y-st.sq.y)));
        }
        draw();readout();
      });
      function up(){
        if(!st.mode){return;}
        st.mode=null;
        /* 按 1cm 吸附 */
        st.sq.x=Math.round(st.sq.x);st.sq.y=Math.round(st.sq.y);
        st.sq.s=Math.round(st.sq.s);
        if(st.sq.x+st.sq.s>3*st.cfg.a){st.sq.x=3*st.cfg.a-st.sq.s;}
        if(st.sq.y+st.sq.s>3*st.cfg.a){st.sq.y=3*st.cfg.a-st.sq.s;}
        bump();
        draw();readout();
        checkPass();
      }
      cv.addEventListener('pointerup',up);
      cv.addEventListener('pointercancel',function(){st.mode=null;});
      draw();readout();
    },
    reveal:function(){
      if(st.done){toast('本关已通关啦');return;}
      st.done=true;G.revealed=true;
      var a=st.cfg.a,tx=a+st.cfg.r,ty=a+st.cfg.r,ts=a-2*st.cfg.r;
      var x0=st.sq.x,y0=st.sq.y,s0=st.sq.s,tk=TOKEN,t0=null;
      var self=this;
      function anim(ts){
        if(tk!==TOKEN){return;}
        if(t0==null){t0=ts;}
        var t=Math.min(1,(ts-t0)/600);
        st.sq.x=x0+(tx-x0)*t;st.sq.y=y0+(ty-y0)*t;st.sq.s=s0+(ts-s0)*t;
        draw();readout();
        if(t<1){requestAnimationFrame(anim);}
        else{
          st.sq={x:tx,y:ty,s:ts};draw();
          st.body.querySelector('.c1-ro').innerHTML=
            '已揭示:安全区是每块砖中央边长 '+(a-2*st.cfg.r)+'cm 的正方形,P = 1 − ('+(a-2*st.cfg.r)+'/'+a+')² = <b>'+fracStr(a*a-(a-2*st.cfg.r)*(a-2*st.cfg.r),a*a)+'</b>。';
        }
      }
      requestAnimationFrame(anim);
      st.body.appendChild(ce('div','reveal-note',
        '<b>已揭示答案:</b>圆心必须离每条缝至少 r cm 才安全,安全落点区是每块砖中央边长 (a−2r) 的正方形;P(相交) = 1 − ((a−2r)/a)²。原题(40cm砖、5cm碟)= 1 − (30/40)² = <b>7/16</b>。点"重新开始"换新数据再战!'));
    }
  };
}

/* =========================================================
   关卡 C2:投石估草地(模拟投石 + 拖数字线估面积)
   ========================================================= */
function makeC2(){
  var st={done:false,body:null,cv:null,c1:0,c2:0,c3:0,dotCtx:null,cell:null,GW:160,GH:128,grassCells:null,grassArea:0};
  var RX=80,RY=72,RW=320,RH=256;      // 长方形区域像素位置(5m×4m,64px/m)
  function inRect(x,y){return x>=RX&&x<=RX+RW&&y>=RY&&y<=RY+RH;}
  function buildGrass(){
    /* 随机生成圆斑并缩放,使草地面积 = 502/630 × 20 ≈ 15.94 m²(与原题数据一致) */
    var S=64;                          // px/米
    var circles=[],n=ri(7,9),i;
    for(i=0;i<n;i++){
      circles.push({
        x:(0.7+Math.random()*3.6)*S,
        y:(0.7+Math.random()*2.6)*S,
        r:(0.5+Math.random()*0.55)*S
      });
    }
    var targetPx=(502/630)*RW*RH;
    var off=document.createElement('canvas');
    off.width=RW;off.height=RH;
    var c=off.getContext('2d');
    function bake(){
      c.clearRect(0,0,RW,RH);
      c.save();
      c.beginPath();c.rect(0,0,RW,RH);c.clip();
      c.fillStyle='#fff';
      circles.forEach(function(ci){c.beginPath();c.arc(ci.x,ci.y,ci.r,0,6.283);c.fill();});
      c.restore();
      var img=c.getImageData(0,0,RW,RH).data;
      var gw=st.GW,gh=st.GH;
      var grid=new Uint8Array(gw*gh);
      var cnt=0;
      for(var gy=0;gy<gh;gy++){
        for(var gx=0;gx<gw;gx++){
          var px=gx*2,py=gy*2;
          var on=img[(Math.floor(py)*RW+Math.floor(px))*4]>127?1:0;
          grid[gy*gw+gx]=on;cnt+=on;
        }
      }
      return {grid:grid,pxArea:cnt*4};
    }
    var res=bake();
    for(i=0;i<3;i++){
      var scale=Math.sqrt(targetPx/res.pxArea);
      circles.forEach(function(ci){ci.r*=scale;});
      res=bake();
    }
    st.grassCells=res.grid;
    st.grassArea=res.pxArea/(S*S);
    return circles;
  }
  function onGrass(x,y){
    if(!inRect(x,y)){return false;}
    var gx=Math.floor((x-RX)/2),gy=Math.floor((y-RY)/2);
    if(gx<0||gy<0||gx>=st.GW||gy>=st.GH){return false;}
    return st.grassCells[gy*st.GW+gx]===1;
  }
  function drawBg(){
    var cv=document.createElement('canvas');
    cv.width=480;cv.height=400;
    var c=cv.getContext('2d');
    /* 操场泥地 */
    c.fillStyle='#efe0c8';
    c.fillRect(0,0,480,400);
    /* 长方形区域 */
    c.fillStyle='#e6d5b2';
    c.fillRect(RX,RY,RW,RH);
    /* 草地圆斑(重画一遍,与命中判定一致) */
    c.save();
    c.beginPath();c.rect(RX,RY,RW,RH);c.clip();
    st.circles.forEach(function(ci){
      c.beginPath();c.arc(RX+ci.x,RY+ci.y,ci.r,0,6.283);
      c.fillStyle='#7cc267';c.fill();
      c.strokeStyle='#4b8f3b';c.lineWidth=2;c.stroke();
    });
    c.restore();
    /* 边框与标注 */
    c.strokeStyle=PAL.ink;c.lineWidth=4;
    c.strokeRect(RX,RY,RW,RH);
    c.fillStyle=PAL.ink;
    c.font='bold 17px "Microsoft YaHei",sans-serif';
    c.fillText('长5米',RX+RW/2-32,RY+RH+26);
    c.save();
    c.translate(RX-24,RY+RH/2+18);
    c.rotate(-Math.PI/2);
    c.fillText('宽4米',0,0);
    c.restore();
    return cv;
  }
  function redraw(){
    var ctx=st.cv.getContext('2d');
    ctx.clearRect(0,0,480,400);
    ctx.drawImage(st.bg,0,0);
    ctx.drawImage(st.dots,0,0);
  }
  function counters(){
    var tot=st.c1+st.c2;
    var f=tot>0?st.c1/tot:0;
    st.body.querySelector('.c2-cnt').innerHTML=
      '落在<b>草地内</b>: '+st.c1+' 颗　落在<b>长方形内、草地外</b>: '+st.c2+' 颗　落在<b>长方形外</b>: '+st.c3+' 颗<br>'+
      '草地内频率 = '+st.c1+' ÷ '+tot+' = <b>'+(tot>0?f.toFixed(3):'—')+'</b>'+
      (tot>=100?'　(频率已较稳定,可以估面积了)':'　(再投一些,等频率稳定)');
  }
  function throwStones(cnt){
    var tk=TOKEN,dc=st.dotCtx,i=0;
    function step(){
      if(tk!==TOKEN){return;}
      for(var c=0;c<12&&i<cnt;c++,i++){
        var x=Math.random()*480,y=Math.random()*400;
        var color,weight=0;
        if(!inRect(x,y)){color='#9c9c9c';st.c3++;}
        else if(onGrass(x,y)){color='#2f7d32';st.c1++;weight=1;}
        else{color='#b3832f';st.c2++;}
        dc.beginPath();dc.arc(x,y,2.3,0,6.283);
        dc.fillStyle=color;dc.fill();
      }
      redraw();counters();
      if(i<cnt){requestAnimationFrame(step);}
    }
    requestAnimationFrame(step);
  }
  return {
    title:'投石估草地',
    build:function(root,def){
      st.done=false;st.c1=0;st.c2=0;st.c3=0;
      st.circles=buildGrass();
      var body=scaffold(root,{
        title:def.diff+' · 投石估草地',
        src:'改编自 2024-2025南京市期末第13题(2)(投石估计草地面积)',
        intro:'原题:"七(1)班学习小组在草地的外围画了一个<b>长5米、宽4米</b>的长方形,在不远处向长方形内掷石子并记录(长方形外的石子不参与估计)。同学们认为用概率知识就能算出草地的面积大约是多少平方米(结果保留整数)。<br>原题记录:草地内 112、92、177、121 颗;长方形内、草地外 28、24、43、33 颗;长方形外 10、24、32、28 颗。<br><b class="hl">你的任务:</b>先点按钮<b class="hl">投石子</b>(至少100颗)看频率稳定值,再<b class="hl">拖动数字线游标</b>,把你估计的草地面积标出来(提示:估计面积 = 稳定频率 × 20)!"'
      });
      st.body=body;
      var cv=ce('canvas','board');
      cv.width=480;cv.height=400;
      st.cv=cv;
      body.appendChild(cv);
      st.bg=drawBg();
      st.dots=document.createElement('canvas');
      st.dots.width=480;st.dots.height=400;
      st.dotCtx=st.dots.getContext('2d');
      redraw();
      var lg=ce('div','legend-row',
        '<span><i class="dot-ic" style="background:#7cc267;"></i>草地</span>'+
        '<span><i class="dot-ic" style="background:#2f7d32;"></i>石子落在草地内</span>'+
        '<span><i class="dot-ic" style="background:#b3832f;"></i>落在长方形内、草地外</span>'+
        '<span><i class="dot-ic" style="background:#9c9c9c;"></i>落在长方形外(不计入)</span>');
      body.appendChild(lg);
      var btnRow=ce('div',null);
      [['投1颗',1],['投50颗',50],['投500颗',500]].forEach(function(pr){
        var b=ce('button','btn btn-mini',pr[0]);
        b.onclick=function(){
          if(st.done){return;}
          bump();
          throwStones(pr[1]);
        };
        btnRow.appendChild(b);
      });
      body.appendChild(btnRow);
      body.appendChild(ce('div','ro c2-cnt'));
      counters();
      var nl=makeNumLine({
        min:0,max:20,tick:0.5,majorEvery:4,snap:0.1,v0:10,
        fmt:function(v){return String(Math.round(v));},
        live:function(v){return v.toFixed(1)+' m²';},
        onEnd:function(v){
          if(st.done){return;}
          var tot=st.c1+st.c2;
          if(tot<100){
            toast('先多投一些石子(目前 '+tot+' 颗,至少100颗),等频率稳定再估计!');
            return;
          }
          /* 原题数据:502/630×20 ≈ 15.9 → 16 平方米 */
          if(Math.abs(v-15.94)<=0.45){
            st.done=true;
            passLevel(
              '<p>草地内的稳定频率 ≈ <b>0.797</b>(原题数据:502 ÷ (502+128) = 502/630 ≈ 0.797;你的模拟:'+st.c1+' ÷ '+(st.c1+st.c2)+' = '+(st.c1/(st.c1+st.c2)).toFixed(3)+')。</p>'+
              '<p>把草地面积占长方形的比例用频率估计,则草地面积 ≈ 0.797 × (5×4) = 0.797 × 20 ≈ <b>15.9 ≈ 16 平方米</b>(保留整数)。</p>'+
              '<p>关键:落点均匀时,<b>频率 ≈ 面积比</b>,所以 部分面积 = 频率 × 整体面积。</p>'
            );
          }else{

    }
  };
}

/* =========================================================
   关卡 C3:转盘设计师(滑块连续调节灰色圆心角)
   ========================================================= */
function makeC3(){
  var st={done:false,body:null,cv:null,cfg:null,theta:90,needle:-1};
  var CFGS=[
    {deg:180,p:'1/2'},{deg:225,p:'5/8'},{deg:120,p:'1/3'},
    {deg:270,p:'3/4'},{deg:240,p:'2/3'},{deg:300,p:'5/6'}
  ];
  function drawWheel(){
    var ctx=st.cv.getContext('2d');
    ctx.clearRect(0,0,340,350);
    var cx=170,cy=185,r=138;
    /* 灰色扇形 */
    var rad=st.theta*Math.PI/180;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+rad,false);
    ctx.closePath();
    ctx.fillStyle=PAL.c1;ctx.globalAlpha=0.85;ctx.fill();ctx.globalAlpha=1;
    ctx.strokeStyle=PAL.ink;ctx.lineWidth=2;
    ctx.stroke();
    /* 白色余下部分 */
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,-Math.PI/2+rad,-Math.PI/2+2*Math.PI,false);
    ctx.closePath();
    ctx.fillStyle='#ffffff';ctx.fill();
    ctx.strokeStyle=PAL.ink;ctx.lineWidth=2;
    ctx.stroke();
    /* 外圈 */
    ctx.beginPath();ctx.arc(cx,cy,r,0,6.283);
    ctx.strokeStyle=PAL.ink;ctx.lineWidth=4;
    ctx.stroke();
    /* 中心转轴 */
    ctx.beginPath();ctx.arc(cx,cy,7,0,6.283);
    ctx.fillStyle=PAL.ink;ctx.fill();
    /* 旋转指针(动画时) */
    if(st.needle>=0){
      var nx=cx+Math.cos(st.needle)*r*0.92,ny=cy+Math.sin(st.needle)*r*0.92;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(nx,ny);
      ctx.strokeStyle=PAL.c2;ctx.lineWidth=5;ctx.stroke();
      ctx.beginPath();ctx.arc(nx,ny,7,0,6.283);
      ctx.fillStyle=PAL.c2;ctx.fill();
    }
    /* 顶部固定箭头 */
    ctx.beginPath();
    ctx.moveTo(cx,26);ctx.lineTo(cx-12,8);ctx.lineTo(cx+12,8);
    ctx.closePath();
    ctx.fillStyle=PAL.ink;ctx.fill();
    ctx.font='bold 16px "Microsoft YaHei",sans-serif';
    ctx.fillStyle=PAL.ink;
    ctx.fillText('指针从顶端顺时针转,停在灰色区域算"成功"',18,342);
  }
  function readout(){
    st.body.querySelector('.c3-ro').innerHTML=
      '灰色圆心角 θ = <b>'+st.theta+'°</b>　P(停在灰色) = '+st.theta+'/360 = <b>'+fracStr(st.theta,360)+
      '</b> ≈ '+(st.theta/360).toFixed(3)+'<br>目标:让 P 恰好 = <b>'+st.cfg.p+'</b>(θ='+st.cfg.deg+'°)';
  }
  function spinAndPass(){
    var tk=TOKEN;
    var t0=null,dur=1800;
    var startA=Math.random()*6.283;
    var total=4*6.283+Math.random()*6.283;
    function anim(ts){
      if(tk!==TOKEN||st.done){st.needle=-1;drawWheel();return;}
      if(t0==null){t0=ts;}
      var t=Math.min(1,(ts-t0)/dur);
      var ease=1-Math.pow(1-t,3);
      st.needle=startA+total*ease;
      drawWheel();
      if(t<1){requestAnimationFrame(anim);}
      else{
        /* 试转期间若滑块被改动,则中止 */
        if(st.theta!==st.cfg.deg){
          st.needle=-1;drawWheel();
          toast('转盘被改动了,请重新调到目标概率');
          return;
        }
        var hits=0,N=30,i;
        for(i=0;i<N;i++){
          var a=Math.random()*6.283;
          var rel=(a+Math.PI/2)%(6.283);
          if(rel<=st.theta*Math.PI/180){hits++;}
        }
        st.done=true;
        passLevel(
          '<p>指针停在灰色区域的概率 = <b>灰色圆心角 ÷ 360°</b> = '+st.cfg.deg+'°/360° = <b>'+st.cfg.p+' ≈ '+(st.cfg.deg/360).toFixed(3)+'</b>。</p>'+
          '<p>模拟转30次:停在灰色 '+hits+' 次,频率 ≈ '+(hits/N).toFixed(3)+',与理论值吻合!</p>'+
          '<p>这就是最朴素的几何概率:部分占整体的比例,就是"落在部分"的概率。</p>'
        );
      }
    }
    requestAnimationFrame(anim);
  }
  return {
    title:'转盘设计师',
    build:function(root,def){
      st.done=false;
      st.cfg=CFGS[ri(0,CFGS.length-1)];
      var v0;
      do{v0=ri(0,359);}while(v0===st.cfg.deg);
      st.theta=v0;st.needle=-1;
      var body=scaffold(root,{
        title:def.diff+' · 转盘设计师',
        src:'本关为同题型自编变式(圆心角与概率)',
        intro:'转盘被分成灰色和白色两部分,<b class="hl">拖动滑块连续调节灰色扇形的圆心角 θ</b>。指针停在灰色区域的概率 = θ/360°。<br><b class="hl">你的任务:</b>设计转盘,让"指针停在灰色区域"的概率恰好 = <b class="hl">'+st.cfg.p+'</b>。调对后指针会自动试转验证!'
      });
      st.body=body;
      var cv=ce('canvas','board');
      cv.width=340;cv.height=350;
      st.cv=cv;
      body.appendChild(cv);
      body.appendChild(ce('div','ro c3-ro'));
      var sliderBox=ce('div',null,'');
      var lab=ce('div',null,'<b style="font-size:18px;">灰色圆心角 θ = <span class="c3-theta">'+st.theta+'</span>°</b>');
      var sl=document.createElement('input');
      sl.type='range';sl.min=0;sl.max=360;sl.step=1;sl.value=st.theta;
      sl.style.width='86%';sl.style.height='34px';
      sl.style.accentColor=PAL.c1;
      sl.addEventListener('input',function(){
        st.theta=parseInt(sl.value,10);
        lab.querySelector('.c3-theta').textContent=st.theta;
        drawWheel();readout();
      });
      sl.addEventListener('change',function(){
        bump();
        if(!st.done&&!G.revealed&&st.theta===st.cfg.deg){
          setTimeout(spinAndPass,220);
        }
      });
      sliderBox.appendChild(lab);
      sliderBox.appendChild(sl);
      body.appendChild(sliderBox);
      drawWheel();readout();
    },
    reveal:function(){
      if(st.done){toast('本关已通关啦');return;}
      st.done=true;G.revealed=true;
      var body=st.body;
      var sl=body.querySelector('input[type=range]');
      var from=st.theta,to=st.cfg.deg,tk=TOKEN,t0=null;
      var self=this;
      function anim(ts){
        if(tk!==TOKEN){return;}
        if(t0==null){t0=ts;}
        var t=Math.min(1,(ts-t0)/600);
        var v=Math.round(from+(to-from)*t);
        st.theta=v;sl.value=String(v);
        body.querySelector('.c3-theta').textContent=v;
        drawWheel();readout();
        if(t<1){requestAnimationFrame(anim);}
      }
      requestAnimationFrame(anim);
      body.appendChild(ce('div','reveal-note',
        '<b>已揭示答案:</b>θ = '+st.cfg.deg+'°,P = '+st.cfg.deg+'/360 = '+st.cfg.p+'。点"重新开始"换一个新目标独立再设计!'));
    }
  };
}

/* =========================================================
   注册表与流程控制
   ========================================================= */
var REG={
  a1:{make:makeA1,title:'事件分拣官',diff:'初级'},
  a2:{make:makeA2,title:'幸运第五掷',diff:'初级'},
  b1:{make:makeB1,title:'太极涂色',diff:'中级'},
  b2:{make:makeB2,title:'网格扇形师',diff:'中级'},
  b3:{make:makeB3,title:'麦穗实验员',diff:'中级'},
  c1:{make:makeC1,title:'圆碟安全区',diff:'高级'},
  c2:{make:makeC2,title:'投石估草地',diff:'高级'},
  c3:{make:makeC3,title:'转盘设计师',diff:'高级'}
};
var DIFFS={
  d1:{name:'初级',keys:['a1','a2']},
  d2:{name:'中级',keys:['b1','b2','b3']},
  d3:{name:'高级',keys:['c1','c2','c3']}
};
function loadLevel(i){
  TOKEN++;
  G.idx=i;G.revealed=false;G.done=false;
  var key=G.levels[i];
  var def=REG[key];
  G.cur=def.make();
  var root=$('#level-root');
  root.innerHTML='';
  G.cur.build(root,def);
  renderHud();
}
function passLevel(html){
  if(G.done){return;}
  G.done=true;
  FX.burst();
  var last=G.idx===G.levels.length-1;
  $('#pass-title').textContent=G.revealed?'本关完成(看过答案版本)':'太棒了,本关完成!';
  var extra=G.revealed?'<p class="note">提示:这关你揭示过答案,可以点"再挑战本关"独立再做一次。</p>':'';
  $('#pass-body').innerHTML=html+extra;
  $('#btn-pass-next').textContent=last?'查看闯关成果':'进入下一关';
  $('#modal-rules').hidden=true;
  $('#modal-pass').hidden=false;
}
function showRules(auto){
  $('#rules-body').innerHTML=
    '<p><b>玩法总则:</b>这里没有"选一选、填一填"!每一关都要动手——<b>拖一拖、涂一涂、掷一掷</b>,你的操作本身就是解题过程。</p>'+
    '<ul>'+
    '<li><b>初级</b>:把事件卡片拖进正确的筐;用数字卡片拼出骰子第五掷的概率。</li>'+
    '<li><b>中级</b>:点涂太极图让灰色恰好占大圆一半;拖格点造出 √10 与 90° 的扇形;加试验批次、拖游标找频率稳定值。</li>'+
    '<li><b>高级</b>:拖圆碟找安全落点区并精确标记;投石子估计草地面积;拖滑块设计转盘概率。</li>'+
    '</ul>'+
    '<p><b>课堂小知识:</b>几何概率 = 有利于积 ÷ 总面积;大量重复试验时,频率会稳定在概率附近。</p>'+
    '<p><b>按钮说明:</b>[揭示答案] 看本关示范;[重新开始] 换一组新数据再来;[返回难度选择] 回到首页。右上角实时显示<b>时间与步数</b>,每关通关都有庆祝动画!</p>'+
    (auto?'<p class="note">准备好了就点下面的按钮,出发!</p>':'');
  $('#modal-pass').hidden=true;
  $('#modal-rules').hidden=false;
}
function stopTimer(){
  if(G.timerInt){clearInterval(G.timerInt);G.timerInt=null;}
}
function startRun(dk){
  applyPalette();                                    // 每局随机主色(G8)
  G.diffKey=dk;G.steps=0;G.done=false;G.revealed=false;
  G.levels=shuffle(DIFFS[dk].keys.slice());          // 关卡顺序随机
  $('#scr-start').hidden=true;
  $('#scr-final').hidden=true;
  $('#scr-game').hidden=false;
  FX.stopRain();
  G.startT=Date.now();
  stopTimer();
  G.timerInt=setInterval(function(){
    G.elapsed=Math.floor((Date.now()-G.startT)/1000);
    $('#hud-time').textContent=fmtTime(G.elapsed);
  },500);
  loadLevel(0);
  showRules(true);                                   // 进场先弹规则(G6)
}
function finishRun(){
  stopTimer();
  TOKEN++;
  $('#scr-game').hidden=true;
  $('#scr-final').hidden=false;
  var dn=DIFFS[G.diffKey].name;
  $('#final-sub').textContent='你在"'+dn+'难度"的 '+G.levels.length+' 个关卡全部完成,几何概率的秘密已经被你亲手揭开!';
  $('#final-stats').innerHTML='难度:<b>'+dn+'</b>　|　用时:<b>'+fmtTime(G.elapsed)+
    '</b>　|　总步数:<b>'+G.steps+'</b><br>再玩一次会换新的色板和新的关卡数据哦!';
  FX.startRain();                                    // 通关庆祝:彩纸雨(G5)
  setTimeout(function(){FX.burst(140);},600);
}
function backToStart(){
  stopTimer();TOKEN++;
  FX.stopRain();
  $('#scr-game').hidden=true;
  $('#scr-final').hidden=true;
  $('#scr-start').hidden=false;
  $('#modal-pass').hidden=true;
  $('#modal-rules').hidden=true;
}

/* ---------------- 绑定界面 ---------------- */
function bind(){
  var cards=document.querySelectorAll('.diff-card');
  for(var i=0;i<cards.length;i++){
    (function(c){
      c.onclick=function(){startRun(c.getAttribute('data-d'));};
    })(cards[i]);
  }
  $('#btn-rules-0').onclick=function(){showRules(false);};
  $('#btn-rules').onclick=function(){showRules(false);};
  $('#btn-rules-close').onclick=function(){$('#modal-rules').hidden=true;};
  $('#btn-reveal').onclick=function(){
    if(!G.cur){return;}
    if(G.revealed){toast('已揭示过啦,点"重新开始"换一组新数据');return;}
    G.revealed=true;
    G.cur.reveal();
  };
  $('#btn-restart').onclick=function(){
    loadLevel(G.idx);
    toast('本关已重新开始,数据已随机刷新!');
  };
  $('#btn-back').onclick=backToStart;
  $('#btn-back2').onclick=backToStart;
  $('#btn-again').onclick=function(){
    $('#scr-final').hidden=true;
    $('#scr-start').hidden=false;
    FX.stopRain();
  };
  $('#btn-pass-next').onclick=function(){
    $('#modal-pass').hidden=true;
    if(G.idx===G.levels.length-1){finishRun();}
    else{loadLevel(G.idx+1);}
  };
  $('#btn-pass-retry').onclick=function(){
    $('#modal-pass').hidden=true;
    loadLevel(G.idx);
  };
}

/* ---------------- 启动 ---------------- */
FX.init();
applyPalette();
bind();
})();
</script>

var b=el("div","tafb-btn","💬");b.title="对这个游戏提意见";
b.onclick=function(){openBox();};
function ready(){(document.body?document.body.appendChild(b):setTimeout(ready,300));}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",ready);}else{ready();}
function openBox(){
 var mask=el("div","tafb-mask"),box=el("div","tafb-box");
 box.appendChild(el("h3",null,"意见反馈"));
 var x=el("span",null,"✕");x.className="tafb-x";x.onclick=function(){mask.remove();};box.appendChild(x);
 box.appendChild(el("div","g","游戏："+M.name+"（"+M.id+" v"+M.ver+"）"));
 var sel=el("select");
 ["题目或答案有错","操作不顺畅/点不到","界面显示问题","太简单/太难","功能建议","其他"].forEach(function(t){var o=el("option",null,t);o.value=t;sel.appendChild(o);});
 box.appendChild(sel);
 var ta=el("textarea");ta.placeholder="说说哪里有问题、希望怎么改（写清第几关/哪道题更好）";box.appendChild(ta);
 var ct=el("input");ct.placeholder="联系方式（可选，方便回访）";box.appendChild(ct);
 function payload(){
  var cat=sel.value,txt=ta.value.trim()||"（未填写具体内容）";
  var title="[反馈]["+M.id+" v"+M.ver+"] "+cat+"："+txt.slice(0,40);
  var body="【游戏】"+M.name+"\n【标识】"+M.id+" v"+M.ver+"\n【教参】"+M.jiaocan+"\n【学段/年级】"+M.stage+" / "+(M.grade||"通用")+"\n【系列】"+M.series
   +"\n【问题类型】"+cat+"\n【问题描述】"+txt+"\n【联系】"+(ct.value.trim()||"无")+"\n【时间】"+new Date().toLocaleString()+"\n【环境】"+navigator.userAgent;
  return {title:title,body:body,plain:body};
 }
 var row=el("div","tafb-row");
 var cp=el("button","tafb-cp","复制反馈内容");
 cp.onclick=function(){
  var p=payload();
  var done=function(){cp.textContent="已复制 ✔";setTimeout(function(){cp.textContent="复制反馈内容";},1600);};
  function fallback(){var t=el("textarea");t.value=p.plain;document.body.appendChild(t);t.select();try{document.execCommand("copy");done();}catch(e){}t.remove();}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(p.plain).then(done,fallback);}else{fallback();}
 };

 row.appendChild(cp);row.appendChild(ok);box.appendChild(row);
 var tip=el("div","g","「提交」会用系统浏览器打开 GitHub 反馈页（需登录），提交即建一条带游戏标识的建议；不方便登录就「复制反馈内容」发给作者。");
 tip.style.marginTop="10px";box.appendChild(tip);
 mask.appendChild(box);mask.onclick=function(e){if(e.target===mask)mask.remove();};
 document.documentElement.appendChild(mask);
}
})();
