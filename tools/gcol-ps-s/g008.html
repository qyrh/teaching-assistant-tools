<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>植树小镇·绿化大冒险（第6讲 植树问题）</title>
<style>
/* ============ 全局与色板变量（每局随机换色） ============ */
:root{
  --main:#2f8f4e; --deep:#1d6b38; --soft:#e9f7ee; --accent:#ff9d2e; --bg:#f4faf5;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
  background:var(--bg); color:#22303a; font-size:17px;
  user-select:none; -webkit-user-select:none; min-height:100vh;
}
.hidden{display:none !important;}
b{color:var(--deep);}

/* ============ 顶栏 ============ */
#topbar{
  position:sticky; top:0; z-index:50; display:flex; justify-content:space-between; align-items:center;
  background:var(--main); color:#fff; padding:10px 16px; box-shadow:0 2px 8px rgba(0,0,0,.18);
}
#brand{font-size:20px; font-weight:bold;}
#brand-sub{font-size:14px; opacity:.9; margin-left:8px; font-weight:normal;}
#hud{display:flex; gap:8px; flex-wrap:wrap;}
.hud-chip{background:rgba(255,255,255,.18); border-radius:999px; padding:5px 12px; font-size:16px;}
.hud-chip b{color:#fff; font-size:18px;}

/* ============ 屏幕通用 ============ */
.screen{max-width:1000px; margin:0 auto; padding:14px 12px 40px;}

/* ============ 难度菜单 ============ */
.menu-box{text-align:center; background:#fff; border-radius:20px; padding:28px 18px; box-shadow:0 4px 18px rgba(0,0,0,.08); margin-top:18px;}
.menu-box h1{font-size:30px; margin:6px 0 10px; color:var(--deep);}
.subtitle{font-size:18px; color:#5a6b76; margin:0 0 22px;}
.diff-row{display:flex; gap:16px; justify-content:center; flex-wrap:wrap;}
.diff-card{
  flex:1; min-width:200px; max-width:280px; cursor:pointer; border:3px solid var(--main);
  background:var(--soft); border-radius:18px; padding:20px 12px; font-size:18px; transition:transform .15s;
}
.diff-card:hover{transform:translateY(-4px);}
.diff-ic{font-size:44px;}
.diff-name{font-size:21px; font-weight:bold; margin:8px 0 6px; color:var(--deep);}
.diff-desc{font-size:15px; color:#5a6b76;}
.menu-tip{margin:20px 0 14px; color:#7a8a94; font-size:15px;}

/* ============ 按钮 ============ */
.btn{
  cursor:pointer; border:none; border-radius:14px; padding:12px 18px; font-size:17px; font-weight:bold;
  background:#fff; color:var(--deep); border:3px solid var(--main); font-family:inherit;
}
.btn:hover{background:var(--soft);}
.btn.primary{background:var(--main); color:#fff; border-color:var(--deep);}
.btn.primary:hover{background:var(--deep);}
.btn.warn{background:#fff; color:#c05600; border-color:#e07a1f;}
.btn.warn:hover{background:#fdf1e3;}
#btn-row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:12px;}

/* ============ 关卡头部与题卡 ============ */
#mission-head{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
.chip{background:#fff; border:2px solid var(--main); color:var(--deep); border-radius:999px; padding:5px 14px; font-size:16px; font-weight:bold;}
.chip-title{background:var(--main); color:#fff;}
#mission-card{background:#fff; border-left:10px solid var(--main); border-radius:12px; padding:14px 16px; box-shadow:0 3px 10px rgba(0,0,0,.07);}
#m-goal{font-size:18px; font-weight:bold; color:var(--deep); margin-bottom:8px;}
#m-text{font-size:19px; line-height:1.65;}

/* ============ 数据条 / 舞台 / 托盘 ============ */
#stats-row{display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 8px;}
.stat-chip{background:var(--soft); border:2px solid var(--main); border-radius:999px; padding:6px 14px; font-size:17px;}
.stat-chip b{font-size:19px; color:var(--deep);}
.stat-chip.warnchip{background:#fdf1e3; border-color:#e07a1f; color:#a34c00;}
.stat-chip.okchip{background:#e6f7ea; border-color:#2e8b57; color:#1d6b38;}
#stage{
  position:relative; background:#fff; border:3px solid var(--main); border-radius:16px;
  min-height:300px; padding:10px; overflow:hidden; touch-action:none;
}
#tray{display:flex; gap:12px; justify-content:center; margin-top:12px; min-height:64px; flex-wrap:wrap;}
.tray-item{
  display:inline-flex; align-items:center; gap:8px; background:var(--soft); border:3px dashed var(--main);
  border-radius:14px; padding:10px 16px; font-size:18px; font-weight:bold; color:var(--deep);
  cursor:grab; touch-action:none;
}
.tray-item:active{cursor:grabbing;}
#feedback{min-height:34px; margin-top:12px; text-align:center; font-size:18px; font-weight:bold;}
#feedback.ok{color:#1d6b38;}
#feedback.err{color:#c62828;}
#feedback.idle{color:#7a8a94; font-weight:normal; font-size:16px;}
.stage-note{text-align:center; color:#7a8a94; font-size:15px; margin-top:4px;}

/* ============ 路 / 树 / 旗帜 等对象 ============ */
.road-wrap{position:relative; margin-top:14px;}
.road{position:relative; height:76px; background:linear-gradient(#9ccc65,#7cb342); border:3px solid #558b2f; border-radius:10px;}
.ruler{position:relative; height:36px; margin-top:2px;}
.tick{position:absolute; top:0; width:2px; height:10px; background:#78909c;}
.tick.big{height:16px; background:#456;}
.tick-label{position:absolute; top:16px; transform:translateX(-50%); font-size:16px; color:#456;}
#objs{position:absolute; inset:0;}
.obj{position:absolute; transform:translate(-50%,-100%); text-align:center; cursor:grab; touch-action:none; z-index:5;}
.obj.fixedobj{cursor:default;}
.obj .ic{font-size:30px; line-height:1; display:block; filter:drop-shadow(0 2px 1px rgba(0,0,0,.25));}
.obj .idx{display:block; font-size:16px; font-weight:bold; color:#263238; background:rgba(255,255,255,.85); border-radius:8px; padding:0 5px; margin-top:1px;}
.obj.bad .ic{filter:drop-shadow(0 0 6px #e53935);}
.obj.bad::after{content:"✖"; position:absolute; top:-6px; right:-10px; color:#e53935; font-size:18px; font-weight:bold;}
.obj.ghost{opacity:.55; cursor:default; animation:pulse 1s infinite; pointer-events:none;}
.obj.win .ic{animation:jump .6s infinite;}
@keyframes pulse{0%,100%{transform:translate(-50%,-100%) scale(1);}50%{transform:translate(-50%,-100%) scale(1.25);}}
@keyframes jump{0%,100%{transform:translate(-50%,-100%);}50%{transform:translate(-50%,-115%);}}
.ghostfly{position:fixed; z-index:2000; pointer-events:none; transform:translate(-50%,-60%); font-size:34px;}
.measure-handle{
  position:absolute; transform:translate(-50%,-50%); width:44px; height:44px; border-radius:50%;
  background:var(--accent); border:3px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.3);
  display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:bold; color:#fff;
  cursor:grab; touch-action:none; z-index:8;
}
.measure-handle .tag{position:absolute; top:-24px; font-size:16px; white-space:nowrap; color:#a34c00; font-weight:bold;}

/* ============ 正方形池塘（点击落子） ============ */
.pond-box{position:relative; margin:12px auto;}
.pond{position:absolute; inset:0; background:linear-gradient(135deg,#4fc3f7,#29b6f6); border:6px solid #8d6e63; border-radius:8px;}
.pond-center{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:19px; font-weight:bold; text-shadow:0 1px 3px rgba(0,0,0,.4); text-align:center;}
.dot{position:absolute; transform:translate(-50%,-50%); width:34px; height:34px; border-radius:50%; cursor:pointer; touch-action:none;}
.dot::after{content:""; position:absolute; inset:9px; border-radius:50%; background:rgba(255,255,255,.9); border:2px solid #8d6e63;}
.dot .planted{position:absolute; left:50%; top:50%; transform:translate(-50%,-58%); font-size:28px; pointer-events:none;}

/* ============ 锯木工坊 ============ */
.log-wrap{position:relative; margin-top:60px;}
.log{position:relative; height:66px; background:linear-gradient(#c98a4b,#a8712f); border:3px solid #7a4f20; border-radius:12px;}
.saw{position:absolute; top:-52px; transform:translateX(-50%); text-align:center; cursor:grab; touch-action:none; z-index:6;}
.saw .ic{font-size:30px; display:block;}
.saw .cutline{position:absolute; left:50%; top:34px; height:84px; border-left:3px dashed #c62828; transform:translateX(-50%);}
.seg{position:absolute; top:0; height:100%; background:linear-gradient(#c98a4b,#a8712f); border:3px solid #7a4f20; border-radius:8px; transition:transform .9s ease, filter .9s;}

/* ============ 爬楼 ============ */
.bld{position:relative; width:340px; max-width:92%; margin:6px auto;}
.floor{height:27px; border:1px solid #b0bec5; border-right:4px solid #90a4ae; background:#fafcff; display:flex; align-items:center; padding-left:8px; color:#546e7a; font-size:16px;}
.floor.first{background:#eceff1; font-weight:bold;}
.avatar{
  position:absolute; left:64%; transform:translate(-50%,-50%); text-align:center; cursor:grab; touch-action:none; z-index:7;
}
.avatar .ic{font-size:32px; display:block; filter:drop-shadow(0 2px 1px rgba(0,0,0,.25));}
.avatar .nm{display:block; font-size:16px; font-weight:bold; background:rgba(255,255,255,.9); border-radius:8px; padding:0 6px;}
.avatar.pinned{cursor:default;}
.avatar .flag{position:absolute; right:-24px; top:-6px; font-size:22px;}

/* ============ 弹层 ============ */
.modal{position:fixed; inset:0; background:rgba(20,40,30,.5); z-index:1000; display:flex; align-items:center; justify-content:center; padding:14px;}
.modal-box{background:#fff; border-radius:18px; max-width:660px; width:94%; max-height:84vh; overflow:auto; padding:22px 24px; box-shadow:0 10px 40px rgba(0,0,0,.3);}
#modal-title{font-size:24px; font-weight:bold; color:var(--deep); margin-bottom:12px;}
#modal-body{font-size:17px; line-height:1.7;}
#modal-body h3{color:var(--main); margin:14px 0 6px; font-size:19px;}
#modal-body .formula{background:var(--soft); border-radius:10px; padding:10px 12px; margin:8px 0; font-size:17px;}
.reveal-box{background:#fff8e1; border:2px solid #ffca28; border-radius:12px; padding:12px 14px; font-size:19px; font-weight:bold; color:#7a4f00;}
.explain-box{background:var(--soft); border-radius:12px; padding:12px 14px; margin-top:10px; font-size:17px;}
#modal-btns{display:flex; gap:10px; justify-content:flex-end; margin-top:18px; flex-wrap:wrap;}
.note{color:#8a9aa5; font-size:15px;}

/* ============ 彩纸画布 ============ */
#fx{position:fixed; inset:0; pointer-events:none; z-index:990;}

/* ============ 抖动动画 ============ */
.shake{animation:shakeX .4s;}
@keyframes shakeX{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}

/* ============ 小屏适配 ============ */
@media (max-width:700px){
  #brand{font-size:16px;} #brand-sub{display:none;}
  .hud-chip{font-size:13px; padding:4px 8px;} .hud-chip b{font-size:14px;}
  #m-text{font-size:17px;} .btn{padding:10px 12px; font-size:15px;}
  .obj .ic{font-size:24px;} .tick-label{font-size:14px;}
}
</style>
</head>
<body>

<header id="topbar">
  <div id="brand">🌳 植树小镇 · 绿化大冒险<span id="brand-sub">第6讲 植树问题</span></div>
  <div id="hud">
    <span class="hud-chip">⏱ 用时 <b id="hud-time">00:00</b></span>
    <span class="hud-chip">🖐 操作 <b id="hud-steps">0</b> 次</span>
    <span class="hud-chip">⭐ 星星 <b id="hud-stars">0</b></span>
  </div>
</header>

<!-- ======== 难度选择屏 ======== -->
<section id="screen-menu" class="screen">

    <p class="subtitle">亲手拖一拖、摆一摆：树苗、彩旗、锯子和卷尺里，藏着"间隔"的大秘密！</p>
    <div class="diff-row">
      <button class="diff-card" data-diff="1">

      </button>
      <button class="diff-card" data-diff="3">
        <div class="diff-ic">🌳</div>

  </div>
</section>

<!-- ======== 游戏屏 ======== -->
<section id="screen-game" class="screen hidden">
  <div id="mission-head">
    <span class="chip" id="m-idx">第 1 关 / 共 3 关</span>
    <span class="chip" id="m-diff">初级</span>
    <span class="chip chip-title" id="m-title">种树小能手</span>
  </div>
  <div id="mission-card">
    <div id="m-goal">🎯 目标：</div>

  <div id="stats-row"></div>

  </div>
</section>

<!-- ======== 通用弹层 ======== -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div id="modal-title"></div>
    <div id="modal-body"></div>
    <div id="modal-btns"></div>
  </div>
</div>

<canvas id="fx"></canvas>

<script>
'use strict';
/* =====================================================================
 * 植树小镇·绿化大冒险 —— 第6讲 植树问题 互动游戏
 * 核心题型：两端都植 / 两侧栽树 / 锯木头（次数=段数-1）/ 爬楼（层数-1=段数）/ 封闭图形（棵数=段数）
 * 交互引擎：PlaceEngine（拖放种树/点击落子/卷尺测量）、HandleEngine（棵距手柄连续调节：
 *          直线两侧/固定棵数/圆形跑道/方形水池）、SawEngine（拖锯子）、ClimbEngine（拖小人爬楼）
 * ===================================================================== */

/* ---------------- 基础工具 ---------------- */
function $(s){return document.querySelector(s);}
function ce(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmtTime(sec){var m=Math.floor(sec/60),s=sec%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function rng(a,b,st){var r=[];for(var v=a;v<=b+1e-9;v+=st)r.push(Math.round(v*1000)/1000);return r;}

/* ---------------- 随机色板（G8：每局换色） ---------------- */
var PALETTES=[
 {main:'#2f8f4e',deep:'#1d6b38',soft:'#e9f7ee',accent:'#ff9d2e',bg:'#f4faf5'},
 {main:'#2478c8',deep:'#175a9c',soft:'#e8f2fc',accent:'#ff9d2e',bg:'#f3f8fd'},
 {main:'#e07a1f',deep:'#a85a0e',soft:'#fdf1e3',accent:'#2f8f4e',bg:'#fdf8f1'},
 {main:'#7d4bbd',deep:'#5d3691',soft:'#f3ecfb',accent:'#ff9d2e',bg:'#f9f6fd'},
 {main:'#0e8f86',deep:'#0a6b64',soft:'#e6f6f4',accent:'#ff7a45',bg:'#f2faf9'}
];
function applyPalette(){
  var p=PALETTES[Math.floor(Math.random()*PALETTES.length)];
  var r=document.documentElement.style;
  r.setProperty('--main',p.main);r.setProperty('--deep',p.deep);
  r.setProperty('--soft',p.soft);r.setProperty('--accent',p.accent);r.setProperty('--bg',p.bg);
}

/* =====================================================================
 * 题库（全部取自教参第6讲：例题1-5、练习1-5、巩固练习1-7）
 * 每题包含完整题干、目标、答案与解析；每局从对应难度池随机抽3关
 * ===================================================================== */
var PROBS={
 /* ---- 初级池（例题级） ---- */
 p1:{d:1,eng:'place',title:'种树小能手',icon:'🌳',trayName:'树苗（随意拖）',len:24,labelStep:3,
   targets:rng(0,24,3),showIdx:true,idxUnit:'棵',
   goal:'从 0 米处开始，每隔 3 米栽一棵（两端都要有树），一共栽 9 棵',
   text:'小朋友们在路的一边植树，先植一棵树，以后每隔 3 米植一棵，已经植了 9 棵。请把 9 棵树苗拖到路边正确的位置，然后看看：第一棵和第九棵树相距多少米？',
   tip:'把树苗从下方托盘拖到路上，对准米尺刻度线再松手（拖出路面可以收回）。',
   successChip:'第1棵 ↔ 第9棵：8 个间隔 × 3米 = 24米',
   reveal:'第一棵和第九棵树相距 <b>3×(9-1)=24（米）</b>。',
   explain:'9 棵树之间有 9-1=8 个间隔，每个间隔 3 米，所以相距 3×8=24 米。两端都植树时：棵数=段数+1。'},
 p2:{d:1,eng:'saw',kind:'count',title:'锯木工坊',budget:28,perCut:4,targetCount:7,
   goal:'把锯子拖到钢管上，摆出全部锯口，让 28 分钟刚好用完',
   text:'把一根钢管锯成小段，一共花了 28 分钟，已知每锯开一处需要 4 分钟。请拖动锯子摆出全部锯口（时间刚好用完），再点"检查成果"，看看钢管被锯成了多少段？',
   tip:'从托盘把锯子拖到钢管上（锯口位置可自由摆放，拖离钢管可收回）。',
   reveal:'钢管被锯成 <b>28÷4+1=8（段）</b>。',
   explain:'一共锯了 28÷4=7（处）；锯的次数比段数少 1，所以段数=7+1=8（段）。这就是"两端都不植树"：段数=棵数+1。'},
 p3:{d:1,eng:'handle',kind:'circle',P:300,sRange:[3,30],targetS:6,targetCount:50,
   primary:{icon:'🚩',color:'#e53935',name:'红旗'},secondary:{icon:'🟡',color:'#fdd835',name:'黄旗',per:1},
   spacingName:'旗距',countName:'红旗',
   goal:'拖动橙色手柄旗，让红旗刚好每隔 6 米正好排满一圈',
   text:'一个圆形跑道长 300 米，沿跑道周围每隔 6 米插一面红旗，每两面红旗中间插一面黄旗。请拖动手柄旗调节旗距，让红旗每隔 6 米正好排满一圈，数一数：跑道周围各插了多少面红旗和黄旗？',
   tip:'按住带橙色圆环的旗子沿跑道拖动，即可调节旗距。',
   reveal:'红旗：<b>300÷6=50（面）</b>；黄旗：<b>50 面</b>。',
   explain:'封闭图形上，棵数=段数：300÷6=50（面红旗）；每两面红旗中间插一面黄旗，黄旗数=红旗数=50 面。'},
 p4:{d:1,eng:'place',title:'彩旗大道',icon:'🚩',trayName:'彩旗（随意拖）',len:95,labelStep:10,

/* 每个难度的关卡池（每局随机抽 3 关，反重复） */
var POOLS={1:['p1','p2','p3','p4'],2:['p5','p6','p7','p8','p9','p10'],3:['p11','p12','p13','p14','p15','p16','p17']};
var DIFF_NAME={1:'初级',2:'中级',3:'高级'};

/* =====================================================================
 * 引擎一：PlaceEngine —— 拖放种树（直线）/ 点击落子（正方形）/ 卷尺测量
 * ===================================================================== */
function PlaceEngine(prob,ctx){
  var st=ctx.stage,tray=ctx.tray;
  var S={placed:[],stage:1,ml:null,mr:null};   // 状态：已放米数、测量阶段、卷尺两端
  var ppm=20,roadEl=null,objLayer=null,ghostM=null,handleL=null,handleR=null;

  function meterSet(){var s={};prob.targets.forEach(function(m){s[m]=1;});return s;}

  /* --- 搭建 DOM（路/尺 或 池塘） --- */
  function buildUI(){
    st.innerHTML='';
    if(prob.square){buildSquare();return;}
    var wrap=ce('div','road-wrap');
    roadEl=ce('div','road');roadEl.id='road';
    var ruler=ce('div','ruler');
    objLayer=ce('div','','');objLayer.id='objs';
    var w=st.clientWidth-30;
    ppm=w/prob.len;
    /* 刻度线与整十/整五标签 */
    var step=prob.labelStep||5;
    var labelStep=Math.max(step,Math.ceil(60/ppm));
    for(var m=0;m<=prob.len;m++){
      var t=ce('div','tick'+(m%labelStep===0?' big':''));
      t.style.left=(m*ppm)+'px';ruler.appendChild(t);
      if(m%labelStep===0){
        var l=ce('div','tick-label',m+'米');l.style.left=(m*ppm)+'px';ruler.appendChild(l);
      }
    }
    var endL=ce('div','tick-label','起点');
    endL.style.left='0px';endL.style.top='-20px';endL.style.color='#1d6b38';ruler.appendChild(endL);
    roadEl.appendChild(objLayer);
    wrap.appendChild(roadEl);wrap.appendChild(ruler);
    st.appendChild(wrap);
  }

  /* --- 正方形池塘（点击落子模式） --- */
  function buildSquare(){
    var sidePx=Math.min(300,Math.max(200,st.clientWidth*0.5));
    var box=ce('div','pond-box');
    box.style.width=sidePx+'px';box.style.height=sidePx+'px';
    var pond=ce('div','pond');box.appendChild(pond);
    var cen=ce('div','pond-center','正方形水池<br>边长 '+prob.side+' 米<br>（周长 '+prob.side*4+' 米）');
    box.appendChild(cen);
    var px=sidePx/2;                 // 半边像素
    var per=prob.side*4;             // 周长(米)
    var dots=[];
    for(var d=0;d<per;d+=prob.gap){
      var pos=perPoint(d,per,sidePx);
      var dot=ce('div','dot');
      dot.style.left=(sidePx/2+pos.x)+'px';dot.style.top=(sidePx/2+pos.y)+'px';
      (function(dd){
        dot.addEventListener('pointerdown',function(e){
          e.preventDefault();
          var i=S.placed.indexOf(dd);
          if(i>=0){S.placed.splice(i,1);}
          else{S.placed.push(dd);}
          renderSquare(box,sidePx);ctx.onOp();updateChips();
        });
      })(d);
      box.appendChild(dot);dots.push(dot);
    }
    st.appendChild(box);
    var note=ce('div','stage-note','💧 小圆点就是可以栽树的位置（每隔 '+prob.gap+' 米一个，四个角都有）');
    st.appendChild(note);
    S._box=box;S._sidePx=sidePx;
    renderSquare(box,sidePx);
  }
  /* 周长参数 d(米) 转为正方形边上坐标（从左上角顺时针） */
  function perPoint(d,per,sidePx){
    var side=per/4;var u=(d%(per))/side;var k=Math.floor(d%(per)/side);
    var half=sidePx/2;
    if(k===0)return{x:-half+u*sidePx,y:-half};
    if(k===1)return{x:half,y:-half+u*sidePx};
    if(k===2)return{x:half-u*sidePx,y:half};
    return{x:-half,y:half-u*sidePx};
  }
  function renderSquare(box,sidePx){
    if(!box)return;
    var dots=box.querySelectorAll('.dot');
    var planted={};S.placed.forEach(function(d){planted[d]=1;});
    /* 圆点按周长参数顺序创建，直接按下标渲染已栽的树 */
    dots.forEach(function(dot,idx){
      var old=dot.querySelector('.planted');if(old)old.remove();
      if(planted[idx*prob.gap]){dot.appendChild(ce('div','planted','🌳'));}
    });
  }

  /* --- 渲染直线上的树/旗（含固定松树与序号标签） --- */
  function renderObjs(){
    if(prob.square||!objLayer)return;
    objLayer.innerHTML='';
    var all=[];
    (prob.fixed||[]).forEach(function(f){all.push({m:f.m,icon:f.icon,name:f.name,fix:true});});
    S.placed.forEach(function(m){all.push({m:m,icon:prob.icon,name:'',fix:false});});
    all.sort(function(a,b){return a.m-b.m;});
    all.forEach(function(o,i){
      var e=ce('div','obj'+(o.fix?' fixedobj':''));
      e.innerHTML='<span class="ic">'+o.icon+'</span>'+(prob.showIdx?'<span class="idx">第'+(i+1)+(prob.idxUnit||'棵')+'</span>':'');
      e.style.left=(o.m*ppm)+'px';e.style.top='86px';
      e.dataset.m=o.m;e.dataset.fix=o.fix?'1':'0';
      objLayer.appendChild(e);
      if(!o.fix)bindObjDrag(e);
    });
  }

  /* --- 托盘拖出树苗（自由拖拽） --- */
  function buildTray(){
    tray.innerHTML='';
    if(S.stage===2||prob.square)return;
    var item=ce('div','tray-item','<span style="font-size:28px">'+prob.icon+'</span>'+prob.trayName);
    item.addEventListener('pointerdown',function(e){
      e.preventDefault();
      var g=ce('div','ghostfly',prob.icon);
      document.body.appendChild(g);
      function mv(ev){g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px';}
      function up(ev){
        window.removeEventListener('pointermove',mv);
        g.remove();
        dropAt(ev.clientX,ev.clientY);
      }
      window.addEventListener('pointermove',mv);
      window.addEventListener('pointerup',up,{once:true});
    });
    tray.appendChild(item);
  }

  /* --- 松手落点判定 --- */
  function dropAt(cx,cy){
    var rect=roadEl.getBoundingClientRect();
    if(cy<rect.top-40||cy>rect.bottom+30){flash('要把树苗拖到绿色的路上哦');return;}
    var x=cx-rect.left;
    var m=Math.round(x/ppm);
    if(m<0||m>prob.len){flash('超出这条路的两头啦');return;}
    if(S.placed.indexOf(m)>=0||(prob.fixed||[]).some(function(f){return f.m===m;})){flash('这个位置已经有啦，换一个刻度吧');return;}
    S.placed.push(m);ctx.onOp();
    clearGhost(m);renderObjs();updateChips();
  }

  /* --- 已放置对象可拖动微调 / 拖出移除 --- */
  function bindObjDrag(el){
    el.addEventListener('pointerdown',function(e){
      e.preventDefault();e.stopPropagation();
      var m=parseFloat(el.dataset.m);
      el.setPointerCapture(e.pointerId);
      function mv(ev){
        var rect=roadEl.getBoundingClientRect();
        el.style.left=(ev.clientX-rect.left)+'px';
        el.style.top=(ev.clientY-rect.top)+'px';
      }
      function up(ev){
        el.removeEventListener('pointermove',mv);
        el.removeEventListener('pointerup',up);
        var rect=roadEl.getBoundingClientRect();
        var out=ev.clientY<rect.top-50||ev.clientY>rect.bottom+40||ev.clientX<rect.left-30||ev.clientX>rect.right+30;
        var i=S.placed.indexOf(m);if(i>=0)S.placed.splice(i,1);
        if(!out){
          var nm=Math.round((ev.clientX-rect.left)/ppm);
          if(nm>=0&&nm<=prob.len&&S.placed.indexOf(nm)<0&&!(prob.fixed||[]).some(function(f){return f.m===nm;})){
            S.placed.push(nm);ctx.onOp();clearGhost(nm);
          }else{flash('这个刻度放不下，树苗回到了托盘');}
        }else{ctx.onOp();}
        renderObjs();updateChips();
      }
      el.addEventListener('pointermove',mv);
      el.addEventListener('pointerup',up,{once:true});
    });
  }

  /* --- 卷尺测量阶段（第16题第二段交互） --- */
  function setupMeasure(){
    tray.innerHTML='';ghostM=null;
    if(handleL)handleL.remove();if(handleR)handleR.remove();
    handleL=mkHandle('尺左端','🔵',0);
    handleR=mkHandle('尺右端','🔴',12);
    var note=ce('div','stage-note','📏 把两个卷尺端点分别拖到树上，它们会自动吸住，读数就在上方数据条里');
    st.appendChild(note);
    updateChips();
  }
  function mkHandle(tag,ic,m){
    var h=ce('div','measure-handle',ic+'<span class="tag">'+tag+'</span>');
    h.style.position='absolute';
    positionHandle(h,m);
    h.addEventListener('pointerdown',function(e){
      e.preventDefault();e.stopPropagation();
      h.setPointerCapture(e.pointerId);
      function mv(ev){moveHandle(h,ev.clientX,ev.clientY,false);}
      function up(ev){moveHandle(h,ev.clientX,ev.clientY,true);h.removeEventListener('pointermove',mv);}
      h.addEventListener('pointermove',mv);
      h.addEventListener('pointerup',up,{once:true});
    });
    st.appendChild(h);
    return h;
  }
  function allTreeMeters(){
    var a=[];(prob.fixed||[]).forEach(function(f){a.push(f.m);});
    S.placed.forEach(function(m){a.push(m);});
    return a.sort(function(x,y){return x-y});
  }
  function positionHandle(h,m){
    var roadRect=roadEl.getBoundingClientRect();
    var stRect=st.getBoundingClientRect();
    h.style.left=(roadRect.left-stRect.left+m*ppm)+'px';
    h.style.top=(roadRect.top-stRect.top+38)+'px';
  }
  function moveHandle(h,cx,cy,done){
    /* 吸附到最近的树 */
    var roadRect=roadEl.getBoundingClientRect();
    var stRect=st.getBoundingClientRect();
    var best=null,bd=1e9;
    allTreeMeters().forEach(function(m){
      var tx=roadRect.left+m*ppm;
      var d=Math.abs(tx-cx);
      if(d<bd){bd=d;best=m;}
    });
    if(best!==null&&bd<30){
      positionHandle(h,best);
      if(h===handleL)S.ml=best;else S.mr=best;
    }else{
      h.style.left=(cx-stRect.left)+'px';
      h.style.top=(cy-stRect.top)+'px';
      if(h===handleL)S.ml=null;else S.mr=null;
    }
    if(done){ctx.onOp();}
    updateChips();
  }

  /* --- 数据条 --- */
  function updateChips(){
    var chips=[];
    if(prob.square){
      chips.push(['已栽',S.placed.length+' 棵','']);
      chips.push(['目标是','每隔 '+prob.gap+' 米一棵（角上也栽）','']);
    }else if(S.stage===2){
      var read=(S.ml!==null&&S.mr!==null)?Math.abs(S.mr-S.ml):null;
      chips.push(['卷尺读数',read===null?'把两端吸到树上':read+' 米',read===prob.measure.answer?'okchip':'']);
      chips.push(['要量的','第 1 棵 ↔ 第 10 棵','']);
    }else{
      chips.push(['已种',S.placed.length+' '+(prob.idxUnit==='面'?'面':'棵'),'']);
      chips.push(['题目要求',prob.targets.length+' '+(prob.idxUnit==='面'?'面':'棵')+'，相邻间隔相等','']);
    }
    ctx.chips(chips);
  }

  /* --- 提示：幽灵树闪炼下一个正确位置 --- */
  function hint(){
    if(prob.square){
      var per=prob.side*4;
      var miss=null;
      for(var d=0;d<per;d+=prob.gap){if(S.placed.indexOf(d)<0){miss=d;break;}}
      if(miss!==null)flash('💡 沿着池塘边，每隔 '+prob.gap+' 米就有一个树坑（包括四个角），一个都不要漏哦！');
      return;
    }
    if(S.stage===2){flash('💡 把蓝色端点吸到最左边的松树（第1棵），红色端点吸到第10棵树。');return;}
    var need=meterSet(),miss=null;
    for(var i=0;i<prob.targets.length;i++){if(S.placed.indexOf(prob.targets[i])<0){miss=prob.targets[i];break;}}
    var extra=S.placed.filter(function(m){return !need[m];});
    if(extra.length>0){flash('💡 有 '+extra.length+' 棵位置不对（标了✖），先把它们拖到别的刻度试试。');return;}
    if(miss!==null){showGhost(miss);flash('💡 看到闪烁的影子树了吗？下一棵就种在那里！');return;}
    flash('💡 位置都对啦，点"检查成果"吧！');
  }
  function showGhost(m){
    clearGhostEl();
    var e=ce('div','obj ghost','<span class="ic">'+prob.icon+'</span>');
    e.style.left=(m*ppm)+'px';e.style.top='86px';ghostM=m;
    objLayer.appendChild(e);
  }
  function clearGhost(m){if(ghostM===m){clearGhostEl();ghostM=null;}}
  function clearGhostEl(){if(objLayer){var g=objLayer.querySelector('.ghost');if(g)g.remove();}}

  /* --- 检查 --- */
  function check(){
    if(prob.square){
      if(S.placed.length===prob.targets.length)return{ok:true,msg:prob.successChip};
      return{ok:false,msg:'还差 '+(prob.targets.length-S.placed.length)+' 棵没有栽，沿着边再找找树坑（周长÷棵距=棵数）！'};
    }
    if(S.stage===2){
      if(S.ml!==null&&S.mr!==null){
        var a=S.ml,b=S.mr,ex=prob.measure.expect;
        if((a===ex[0]&&b===ex[1])||(a===ex[1]&&b===ex[0]))return{ok:true,msg:prob.successChip};
        return{ok:false,msg:'现在量的是第'+treeIdx(a)+'棵到第'+treeIdx(b)+'棵（'+Math.abs(b-a)+'米）。卷尺两端要分别对准第 1 棵和第 10 棵哦！'};
      }
      return{ok:false,soft:true,msg:'请先把卷尺两端都吸到树上，再点"检查成果"。'};
    }
    var need=meterSet();
    var missing=prob.targets.filter(function(m){return S.placed.indexOf(m)<0;});
    var extra=S.placed.filter(function(m){return !need[m];});
    if(missing.length===0&&extra.length===0){
      if(prob.measure){
        S.stage=2;setupMeasure();
        return{ok:false,soft:true,msg:'🌳 白玉兰全部栽对！接下来拖动卷尺两端，量出第 1 棵到第 10 棵的距离，再点一次"检查成果"。'};
      }
      return{ok:true,msg:prob.successChip};
    }
    /* 标出位置不对的树 */
    if(objLayer){
      objLayer.querySelectorAll('.obj').forEach(function(e){
        var m=parseFloat(e.dataset.m);
        if(e.dataset.fix!=='1'&&!need[m])e.classList.add('bad');
        setTimeout(function(){e.classList.remove('bad');},1800);
      });
    }
    var msg='';
    if(missing.length>0)msg+='还差 '+missing.length+' 棵没种；';
    if(extra.length>0)msg+='有 '+extra.length+' 棵位置不对（标了✖）';
    return{ok:false,msg:msg+'。想一想：相邻两棵树相距多少米？'};
  }
  function treeIdx(m){return allTreeMeters().indexOf(m)+1;}

  /* --- 演示正确答案 --- */
  function demo(){
    if(prob.square){S.placed=prob.targets.slice();if(S._box)renderSquare(S._box,S._sidePx);updateChips();return;}
    S.placed=prob.targets.slice();renderObjs();
    if(prob.measure){S.stage=2;setupMeasure();S.ml=prob.measure.expect[0];S.mr=prob.measure.expect[1];
      positionHandle(handleL,S.ml);positionHandle(handleR,S.mr);updateChips();}
  }

  /* --- 成功庆祝：首尾树高亮 --- */
  function celebrate(){
    if(prob.square||!objLayer)return;
    var os=objLayer.querySelectorAll('.obj');
    if(os.length>0){os[0].classList.add('win');os[os.length-1].classList.add('win');}
  }

  function mount(){
    S={placed:[],stage:1,ml:null,mr:null};
    handleL=null;handleR=null;ghostM=null;
    buildUI();buildTray();
    if(!prob.square)renderObjs();
    updateChips();
    ctx.tip(prob.tip);
  }
  function relayout(){
    buildUI();                      /* buildUI 内部已处理池塘/直线两种形态 */
    if(!prob.square){
      renderObjs();
      if(S.stage===2){              /* 测量阶段：重建卷尺端点并复位吸附 */
        setupMeasure();
        if(S.ml!==null&&handleL)positionHandle(handleL,S.ml);
        if(S.mr!==null&&handleR)positionHandle(handleR,S.mr);
      }
    }
    updateChips();
  }
  function flash(t){ctx.tip(t);}
  mount();
  return {mount:mount,check:check,hint:hint,demo:demo,celebrate:celebrate,relayout:relayout};
}

/* =====================================================================
 * 引擎二：HandleEngine —— 棵距手柄（Canvas 连续调节）
 * 支持：直线固定总长(可两侧)/直线固定棵数/圆形跑道/正方形水池
 * ===================================================================== */
function HandleEngine(prob,ctx){
  var st=ctx.stage;
  var cv,c2,W,H,dpr;
  var s=initS();          // 当前间距（米）
  var dragging=false,handlePos={x:0,y:0};

  function initS(){
    var a=prob.sRange[0],b=prob.sRange[1];
    var ans=answerS();
    var cand=[];
    for(var v=a;v<=b;v++){if(v!==ans)cand.push(v);}
    if(cand.length===0)cand=[a];
    return cand[Math.floor(Math.random()*cand.length)];
  }
  function answerS(){
    if(prob.kind==='fixedlen')return prob.L/(prob.goalCount-1);
    return prob.targetS;
  }

  function sizeCanvas(){
    dpr=window.devicePixelRatio||1;
    W=st.clientWidth-8;
    if(prob.kind==='circle')H=Math.min(460,Math.max(340,W*0.7));
    else if(prob.kind==='square')H=Math.min(430,Math.max(330,W*0.62));
    else if(prob.kind==='fixedcount')H=250;
    else H=prob.twoSide?290:210;
    cv.width=W*dpr;cv.height=H*dpr;
    cv.style.width=W+'px';cv.style.height=H+'px';
    c2.setTransform(dpr,0,0,dpr,0,0);
  }

  /* ---- 各形态的渲染 ---- */
  var lastPtr=null,cheerT=0;
  function render(){
    c2.clearRect(0,0,W,H);
    if(prob.kind==='circle')renderCircle();
    else if(prob.kind==='square')renderSquare();
    else if(prob.kind==='fixedcount')renderFixedCount();
    else renderFixedLen();
    /* 拖动时在指针处画"幽灵手柄"，让连续调节看得见（尤其固定棵数模式） */
    if(dragging&&lastPtr){
      c2.beginPath();c2.arc(lastPtr.x,lastPtr.y,15,0,Math.PI*2);
      c2.strokeStyle='#ff8f00';c2.lineWidth=4;c2.stroke();
      c2.fillStyle='#ff8f00';c2.font='bold 18px sans-serif';c2.textAlign='center';
      c2.fillText(s+'米',lastPtr.x,lastPtr.y-26);
    }
    /* 通关后的短暂庆祝高亮 */
    if(Date.now()-cheerT<2200&&Date.now()>=cheerT){
      c2.font='46px sans-serif';c2.textAlign='center';
      c2.fillText('🎉',W/2,H/2-6);
      c2.font='34px sans-serif';
      c2.fillText('⭐',W/2-70,H/2-40);
      c2.fillText('⭐',W/2+70,H/2-40);
    }
  }

  function drawObj(x,y,color,icon,small){
    if(small||!icon){
      c2.beginPath();c2.arc(x,y,small?4:7,0,Math.PI*2);
      c2.fillStyle=color;c2.fill();
      c2.strokeStyle='rgba(0,0,0,.25)';c2.lineWidth=1;c2.stroke();
      return;
    }
    c2.font=(prob.kind==='fixedcount'&&spacingPx()<26?'16px':'20px')+' sans-serif';
    c2.textAlign='center';c2.textBaseline='middle';
    c2.fillText(icon,x,y);
  }
  function drawHandleRing(x,y){
    c2.beginPath();c2.arc(x,y,17,0,Math.PI*2);
    c2.strokeStyle='#ff8f00';c2.lineWidth=4;c2.stroke();
    c2.fillStyle='#ff8f00';c2.font='bold 16px sans-serif';
    c2.textAlign='center';c2.fillText('拖我',x,y-26);
  }

  /* 直线·固定总长（两端桩固定，按间距摆树，可两侧+间栽副对象） */
  function renderFixedLen(){
    var x0=36,x1=W-36,ppm=(x1-x0)/prob.L;
    var bandH=64;
    var yN=40,yS=yN+bandH+92;
    var fit=prob.L%s===0;
    var cnt=Math.floor(prob.L/s)+1;
    /* 两条路带 */
    c2.fillStyle='#8bc34a';roundRect(x0-8,yN-14,(x1-x0)+16,bandH,10);c2.fill();
    if(prob.twoSide){c2.fillStyle='#8bc34a';roundRect(x0-8,yS-14,(x1-x0)+16,bandH,10);c2.fill();}
    /* 米尺 */
    var step=niceStep(70/ppm);
    c2.fillStyle='#456';c2.font='15px sans-serif';c2.textAlign='center';
    for(var m=0;m<=prob.L;m+=step){
      var x=x0+m*ppm;
      c2.fillRect(x-1,yN+bandH+4,2,12);
      c2.fillText(m+'米',x,yN+bandH+38);
    }
    c2.fillStyle='#1d6b38';c2.font='bold 15px sans-serif';
    c2.textAlign='left';c2.fillText('起点',x0-30,yN+bandH+38);
    c2.textAlign='right';c2.fillText('终点',x1+30,yN+bandH+38);
    /* 主对象（北侧） */
    var drawn=0;
    for(var mm=0;mm<=prob.L+1e-9;mm+=s){
      var xx=x0+mm*ppm;drawn++;
      drawObj(xx,yN+bandH/2-8,prob.primary.color,prob.primary.icon,cnt>60);
      if(drawn===2){handlePos={x:xx,y:yN+bandH/2-8};drawHandleRing(xx,yN+bandH/2-8);}
    }
    /* 南侧镜像 */
    if(prob.twoSide){
      var d2=0;
      for(var m2=0;m2<=prob.L+1e-9;m2+=s){
        drawObj(x0+m2*ppm,yS+bandH/2-8,prob.primary.color,prob.primary.icon,cnt>60);d2++;
      }
    }
    /* 副对象（如柳树/黄旗）在每段中间等距出现 */
    if(fit&&prob.secondary){
      var gaps=prob.L/s;
      [yN,yS].forEach(function(yy){
        for(var g=0;g<gaps;g++){
          for(var k=1;k<=prob.secondary.per;k++){
            var xm=x0+(g+k/(prob.secondary.per+1))*s*ppm;
            drawObj(xm,yy+bandH/2+14,prob.secondary.color,prob.secondary.icon,true);
          }
        }
      });
    }
    /* 末端未排满提示 */
    if(!fit){
      var lastX=x0+Math.floor(prob.L/s)*s*ppm;
      c2.strokeStyle='#e65100';c2.setLineDash([6,5]);c2.lineWidth=3;
      c2.beginPath();c2.moveTo(lastX+10,yN+bandH/2);c2.lineTo(x1-6,yN+bandH/2);c2.stroke();c2.setLineDash([]);
      c2.fillStyle='#e65100';c2.font='bold 16px sans-serif';c2.textAlign='center';
      c2.fillText('差一截，没排到终点',(lastX+x1)/2,yN-2);
    }
  }

  /* 直线·固定棵数（拖间距→总长随之变化） */
  function spacingPx(){
    var a=W-90;
    return Math.min(18,a/((prob.N-1)));
  }
  function renderFixedCount(){
    var totalM=(prob.N-1)*s;
    var spx=spacingPx();
    var roadW=(prob.N-1)*spx;
    var x0=(W-roadW)/2,y0=64,h=88;
    c2.fillStyle='#8bc34a';roundRect(x0-10,y0,roadW+20,h,10);c2.fill();
    /* 对象 */
    for(var i=0;i<prob.N;i++){
      var x=x0+i*spx,y=y0+h/2;
      if(prob.rows){
        c2.fillStyle=prob.primary.color;
        c2.fillRect(x-2,y-14,4,28);
      }else{
        drawObj(x,y,prob.primary.color,prob.primary.icon,spx<26);
      }
      if(i===1){handlePos={x:x,y:y};drawHandleRing(x,y);}
    }
    /* 首尾标签 */
    c2.fillStyle='#1d6b38';c2.font='bold 17px sans-serif';
    c2.textAlign='center';
    c2.fillText('第1'+(prob.rows?'排':'棵'),x0,y0+h+26);
    c2.fillText('第'+prob.N+(prob.rows?'排':'棵'),x0+roadW,y0+h+26);
    /* 米尺刻度 */
    var tickN=Math.min(prob.N-1,10);
    var every=Math.max(1,Math.round((prob.N-1)/tickN));
    c2.fillStyle='#456';c2.font='15px sans-serif';
    for(var t=0;t<=prob.N-1;t+=every){
      var tx=x0+t*spx;
      c2.fillText((t*s)+'米',tx,y0+h+48);
    }
    /* 总长大字 */
    c2.fillStyle='#ff8f00';c2.font='bold 22px sans-serif';c2.textAlign='center';
    c2.fillText((prob.rows?'首尾相距 ':'全长 ')+totalM+' 米',W/2,26);
  }

  /* 圆形跑道 */
  function renderCircle(){
    var cx=W/2,cy=H/2+6,r=Math.min(W,H)/2-56;
    c2.strokeStyle='#cfd8dc';c2.lineWidth=16;
    c2.beginPath();c2.arc(cx,cy,r,0,Math.PI*2);c2.stroke();
    var fit=prob.P%s===0;
    var n=Math.floor(prob.P/s);
    /* 副对象（黄旗/月季）在主对象之间的弧中点 */
    if(fit&&prob.secondary){
      for(var g=0;g<n;g++){
        for(var k=1;k<=prob.secondary.per;k++){
          var a2=((g+k/(prob.secondary.per+1))*s/prob.P)*Math.PI*2-Math.PI/2;
          drawObj(cx+Math.cos(a2)*r,cy+Math.sin(a2)*r,prob.secondary.color,prob.secondary.icon,true);
        }
      }
    }
    /* 主对象 */
    for(var i=0;i<n;i++){
      var ang=(i*s/prob.P)*Math.PI*2-Math.PI/2;
      var x=cx+Math.cos(ang)*r,y=cy+Math.sin(ang)*r;
      drawObj(x,y,prob.primary.color,prob.primary.icon,n>60);
      if(i===1){handlePos={x:x,y:y};drawHandleRing(x,y);}
    }
    /* 未闭合虚线 */
    if(!fit){
      var lastA=(((n*s)%prob.P)/prob.P)*Math.PI*2-Math.PI/2;
      c2.strokeStyle='#e65100';c2.setLineDash([7,6]);c2.lineWidth=5;
      c2.beginPath();c2.arc(cx,cy,r,lastA,-Math.PI/2,false);c2.stroke();c2.setLineDash([]);
    }
    c2.fillStyle='#1d6b38';c2.font='bold 19px sans-serif';c2.textAlign='center';
    c2.fillText('周长 '+prob.P+' 米',cx,cy-8);
    c2.fillStyle='#78909c';c2.font='15px sans-serif';
    c2.fillText(fit?'正好排满一圈':'还不能正好排满一圈',cx,cy+18);
  }

  /* 正方形水池 */
  function renderSquare(){
    var sp=Math.min(240,W/2-56,H-120);
    var x0=(W-sp)/2,y0=(H-sp)/2;
    c2.strokeStyle='#b0bec5';c2.lineWidth=14;
    c2.strokeRect(x0,y0,sp,sp);
    c2.fillStyle='#4fc3f7';c2.globalAlpha=.55;
    c2.fillRect(x0+7,y0+7,sp-14,sp-14);c2.globalAlpha=1;
    var fit=prob.P%s===0;
    var n=Math.floor(prob.P/s);
    var pxPerM=sp*4/prob.P;
    if(fit&&prob.secondary){
      for(var g=0;g<n;g++){
        for(var k=1;k<=prob.secondary.per;k++){
          var d2=(g+k/(prob.secondary.per+1))*s;
          var p2=perPt(d2,x0,y0,sp,pxPerM);
          drawObj(p2.x,p2.y,prob.secondary.color,prob.secondary.icon,true);
        }
      }
    }
    for(var i=0;i<n;i++){
      var p=perPt(i*s,x0,y0,sp,pxPerM);
      drawObj(p.x,p.y,prob.primary.color,prob.primary.icon,n>60);
      if(i===1){handlePos={x:p.x,y:p.y};drawHandleRing(p.x,p.y);}
    }
    if(!fit){
      c2.fillStyle='#e65100';c2.font='bold 16px sans-serif';c2.textAlign='center';
      c2.fillText('还不能正好围满一周',W/2,y0-14);
    }
    c2.fillStyle='#01579b';c2.font='bold 18px sans-serif';c2.textAlign='center';
    c2.fillText('正方形水池 · 周长 '+prob.P+' 米',W/2,H-16);
  }
  function perPt(d,x0,y0,sp,pxPerM){
    var dd=(d*pxPerM)%(sp*4);
    if(dd<sp)return{x:x0+dd,y:y0};
    if(dd<2*sp)return{x:x0+sp,y:y0+dd-sp};
    if(dd<3*sp)return{x:x0+3*sp-dd,y:y0+sp};
    return{x:x0,y:y0+4*sp-dd};
  }

  function roundRect(x,y,w,h,r){
    c2.beginPath();
    c2.moveTo(x+r,y);c2.arcTo(x+w,y,x+w,y+h,r);c2.arcTo(x+w,y+h,x,y+h,r);
    c2.arcTo(x,y+h,x,y,r);c2.arcTo(x,y,x+w,y,r);c2.closePath();
  }
  function niceStep(minM){
    var steps=[1,2,5,10,20,25,50,100];
    for(var i=0;i<steps.length;i++){if(steps[i]>=minM)return steps[i];}
    return 100;
  }

  /* ---- 指针拖动 ---- */
  function bindPointer(){
    cv.addEventListener('pointerdown',function(e){
      e.preventDefault();
      var p=pt(e);
      if(Math.hypot(p.x-handlePos.x,p.y-handlePos.y)<46){
        dragging=true;cv.setPointerCapture(e.pointerId);
      }
    });
    cv.addEventListener('pointermove',function(e){
      if(!dragging)return;
      var p=pt(e);
      lastPtr=p;
      var ns=sFromPointer(p);
      if(ns!==s){s=ns;render();updateChips();}
      else{render();}
    });
    cv.addEventListener('pointerup',function(){
      if(dragging){dragging=false;lastPtr=null;render();ctx.onOp();}
    });
  }
  function pt(e){
    var r=cv.getBoundingClientRect();
    return{x:e.clientX-r.left,y:e.clientY-r.top};
  }
  function sFromPointer(p){
    var a=prob.sRange[0],b=prob.sRange[1];
    if(prob.kind==='circle'){
      var cx=W/2,cy=H/2+6,r=Math.min(W,H)/2-56;
      var ang=Math.atan2(p.y-cy,p.x-cx);
      var frac=((ang+Math.PI/2)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)/(Math.PI*2);
      return clamp(Math.round(frac*prob.P),a,b);
    }
    if(prob.kind==='square'){
      var sp=Math.min(240,W/2-56,H-120);
      var x0=(W-sp)/2,y0=(H-sp)/2;
      var d=nearestPerimeter(p.x,p.y,x0,y0,sp);
      var pxPerM=sp*4/prob.P;
      return clamp(Math.round(d/pxPerM),a,b);
    }
    if(prob.kind==='fixedcount'){
      var spx=spacingPx();
      var roadW=(prob.N-1)*spx;
      var x0=(W-roadW)/2;
      return clamp(Math.round((p.x-x0)/spx),a,b);
    }
    var x0b=36,ppm=(W-72)/prob.L;
    return clamp(Math.round((p.x-x0b)/ppm),a,b);
  }
  /* 点到正方形边的最近周长参数（顺时针，从左上角起） */
  function nearestPerimeter(px,py,x0,y0,sp){
    var bestD=1e9,bestP=0;
    var cand=[
      {p:clamp(px,x0,x0+sp)-x0, d:Math.abs(py-y0)},
      {p:sp+(clamp(py,y0,y0+sp)-y0), d:Math.abs(px-(x0+sp))},
      {p:2*sp+(x0+sp-clamp(px,x0,x0+sp)), d:Math.abs(py-(y0+sp))},
      {p:3*sp+(y0+sp-clamp(py,y0,y0+sp)), d:Math.abs(px-x0)}
    ];
    cand.forEach(function(c){if(c.d<bestD){bestD=c.d;bestP=c.p;}});
    return bestP;
  }

  /* ---- 数据条 ---- */
  function updateChips(){
    var chips=[];
    if(prob.kind==='circle'||prob.kind==='square'){
      var fit=prob.P%s===0;
      var cu=prob.countName.indexOf('花')>=0?'株':(prob.countName.indexOf('灯')>=0?'盏':'面');
      chips.push(['周长',prob.P+' 米','']);
      chips.push([prob.spacingName,s+' 米','']);
      chips.push(['状态',fit?'正好排满':'未排满一圈',fit?'okchip':'warnchip']);
      if(fit){
        chips.push([prob.countName,(prob.P/s)+' '+cu,fit&&s===answerS()?'okchip':'']);
        if(prob.secondary){
          var cu2=prob.secondary.name.indexOf('花')>=0?'株':(prob.secondary.name.indexOf('灯')>=0?'盏':'面');
          chips.push([prob.secondary.name,(prob.P/s)*prob.secondary.per+' '+cu2,'']);
        }
      }
    }else if(prob.kind==='fixedlen'){
      var fit2=prob.L%s===0;
      var n=Math.floor(prob.L/s)+1;
      var unit=prob.primary.name==='椅子'?'把':(prob.primary.name==='彩灯'?'盏':'棵');
      chips.push(['全长',prob.L+' 米','']);
      chips.push([prob.twoSide?'棵距':'灯距',s+' 米','']);
      chips.push(['每侧',n+' '+unit,'']);
      if(prob.twoSide)chips.push(['两侧共',2*n+' '+unit,'']);
      chips.push(['状态',fit2?'正好排到终点':'没排到终点',fit2?'okchip':'warnchip']);
      if(fit2&&prob.secondary){
        var gaps=prob.L/s;
        chips.push([prob.secondary.name+'（每侧）',gaps*prob.secondary.per+' 棵','']);
        chips.push([prob.secondary.name+'（两侧）',gaps*prob.secondary.per*2+' 棵','']);
      }
    }else{
      chips.push(['数量',prob.N+' '+(prob.rows?'排（640÷4）':'棵（两端都栽）'),'']);
      chips.push([prob.spacingName,s+' 米','']);
      chips.push([prob.totalName,((prob.N-1)*s)+' 米','']);
    }
    ctx.chips(chips);
  }

  function check(){
    if(prob.kind==='circle'||prob.kind==='square'){
      var fit=prob.P%s===0;
      if(!fit)return{ok:false,msg:'现在每隔 '+s+' 米，绕一圈不能正好排满哦（周长 '+prob.P+' 米要能被'+prob.spacingName+'整除）。再拖拖手柄！'};
      var cnt=prob.P/s;
      if(cnt!==prob.targetCount)return{ok:false,msg:'现在排了 '+cnt+' 个，题目要求每隔 '+prob.targetS+' 米一个，再调一调'+prob.spacingName+'。'};
      return{ok:true,msg:'正好每隔 '+prob.targetS+' 米排满一圈！'};
    }
    if(prob.kind==='fixedlen'){
      var fit2=prob.L%s===0,n=Math.floor(prob.L/s)+1;
      if(!fit2)return{ok:false,msg:'最后一棵还没排到终点呢。总长 '+prob.L+' 米要能正好分成若干段才行。'};
      if(n!==prob.goalCount)return{ok:false,msg:'现在每侧排了 '+n+' 个，目标是每侧 '+prob.goalCount+' 个。提示：先算每侧有多少个，再算间隔数！'};
      return{ok:true,msg:'每侧正好 '+prob.goalCount+' 个，'+(prob.spacingName||'棵距')+'是 '+answerS()+' 米！'};
    }
    if(s!==prob.targetS){
      return{ok:false,msg:'现在'+prob.spacingName+'是 '+s+' 米，题目要求每隔 '+prob.targetS+' 米一个哦。'};
    }
    return{ok:true,msg:prob.spacingName+'正好 '+prob.targetS+' 米！'};
  }
  function hint(){
    var ans=answerS();
    var txt;
    if(prob.kind==='fixedlen'){
      txt='💡 每侧先算个数：'+(prob.goalCount<=8?'共'+(prob.goalCount*2)+'个÷2侧='+prob.goalCount+'个；':prob.goalCount+'个；')+'间隔数=个数-1；'+prob.spacingName+'=总长÷间隔数。把第2个对象拖到 '+ans+' 米处！';
    }else if(prob.kind==='fixedcount'){
      txt='💡 先想间隔数：'+prob.N+' 个有 '+prob.N+'-1='+(prob.N-1)+' 个间隔；把'+prob.spacingName+'调到 '+ans+' 米，看看'+prob.totalName+'是多少。';
    }else{
      txt='💡 封闭图形：个数=周长÷'+prob.spacingName+'='+prob.P+'÷'+ans+'。把'+prob.spacingName+'调到 '+ans+' 米试试！';
    }
    ctx.tip(txt);
    /* 手柄旁边闪一下目标位置的幽灵提示 */
    c2.fillStyle='rgba(255,143,0,.9)';
    c2.font='bold 18px sans-serif';c2.textAlign='center';
    c2.fillText('→ '+ans+'米 ←',handlePos.x,handlePos.y+42);
  }
  function demo(){s=answerS();render();updateChips();}
  function celebrate(){
    /* 画布上闪动庆祝图案约 2 秒 */
    cheerT=Date.now();
    var n=0;
    var t=setInterval(function(){render();if(++n>16)clearInterval(t);},130);
  }
  function mount(){
    st.innerHTML='';s=initS();
    cv=ce('canvas');cv.style.touchAction='none';cv.style.display='block';cv.style.margin='0 auto';
    st.appendChild(cv);
    c2=cv.getContext('2d');
    sizeCanvas();bindPointer();render();updateChips();
    ctx.tip(prob.tip);
  }
  function relayout(){if(c2){sizeCanvas();render();updateChips();}}
  mount();
  return{mount:mount,check:check,hint:hint,demo:demo,relayout:relayout,celebrate:celebrate};
}

/* =====================================================================
 * 引擎三：SawEngine —— 拖锯子锯木头
 * ===================================================================== */
function SawEngine(prob,ctx){
  var st=ctx.stage,tray=ctx.tray;
  var S={cuts:[]};        // ruler 模式存米数；count 模式存 0~1 的比例
  var logEl,ppm=60,logW=0,done=false;

  function isRuler(){return prob.kind==='ruler';}

  function buildUI(){
    st.innerHTML='';
    var wrap=ce('div','log-wrap');
    logEl=ce('div','log');logEl.id='log';
    wrap.appendChild(logEl);
    st.appendChild(wrap);
    logW=st.clientWidth-80;
    logEl.style.width=logW+'px';
    logEl.style.margin='0 auto';
    ppm=logW/prob.len;
    if(isRuler()){
      var ruler=ce('div','ruler');
      ruler.style.width=logW+'px';ruler.style.margin='0 auto';
      for(var m=0;m<=prob.len;m++){
        var t=ce('div','tick'+(m%prob.labelStep===0?' big':''));
        t.style.left=(m*ppm)+'px';ruler.appendChild(t);
        if(m%prob.labelStep===0){
          var l=ce('div','tick-label',m+'米');l.style.left=(m*ppm)+'px';ruler.appendChild(l);
        }
      }
      wrap.appendChild(ruler);
      var note=ce('div','stage-note','🪵 圆木总长未知！锯成 2 米一段，锯口都对准刻度线');
      st.appendChild(note);
    }else{
      var note2=ce('div','stage-note','🪵 钢管：锯口位置可以自由摆放，关键是要摆对"锯几次"');
      st.appendChild(note2);
    }
    renderCuts();
  }
  function renderCuts(){
    logEl.querySelectorAll('.saw').forEach(function(e){e.remove();});
    S.cuts.forEach(function(c,i){
      var x=isRuler()?c*ppm:c*logW;
      var e=ce('div','saw','<span class="ic">🪚</span><div class="cutline"></div>');
      e.style.left=x+'px';
      logEl.appendChild(e);
      bindCutDrag(e,i);
    });
    updateChips();
  }
  function buildTray(){
    tray.innerHTML='';
    var item=ce('div','tray-item','<span style="font-size:28px">🪚</span>锯子（随意拖）');
    item.addEventListener('pointerdown',function(e){
      e.preventDefault();
      var g=ce('div','ghostfly','🪚');
      document.body.appendChild(g);
      function mv(ev){g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px';}
      function up(ev){window.removeEventListener('pointermove',mv);g.remove();dropAt(ev.clientX,ev.clientY);}
      window.addEventListener('pointermove',mv);
      window.addEventListener('pointerup',up,{once:true});
    });
    tray.appendChild(item);
  }
  function dropAt(cx,cy){
    if(done)return;
    var r=logEl.getBoundingClientRect();
    if(cy<r.top-60||cy>r.bottom+50){flash('要把锯子拖到木头上哦');return;}
    var x=cx-r.left;
    if(x<10||x>logW-10){flash('锯口太靠边啦');return;}
    if(isRuler()){
      var m=Math.round(x/ppm);
      if(m<=0||m>=prob.len){flash('锯口要在木头中间的刻度上');return;}
      if(S.cuts.indexOf(m)>=0){flash('这个锯口已经锯过了');return;}
      S.cuts.push(m);
    }else{
      var f=x/logW;
      for(var i=0;i<S.cuts.length;i++){if(Math.abs(S.cuts[i]-f)*logW<34){flash('两个锯口离得太近啦');return;}}
      S.cuts.push(f);
    }
    ctx.onOp();renderCuts();
  }
  function bindCutDrag(el,i){
    el.addEventListener('pointerdown',function(e){
      e.preventDefault();e.stopPropagation();
      el.setPointerCapture(e.pointerId);
      function mv(ev){
        var r=logEl.getBoundingClientRect();
        el.style.left=(ev.clientX-r.left)+'px';
        el.style.top=(ev.clientY-r.top-52)+'px';
      }
      function up(ev){
        el.removeEventListener('pointermove',mv);
        var r=logEl.getBoundingClientRect();
        var out=ev.clientY<r.top-80||ev.clientY>r.bottom+60;
        var x=ev.clientX-r.left;
        if(out){S.cuts.splice(i,1);ctx.onOp();}
        else if(isRuler()){
          var m=Math.round(x/ppm);
          if(m>0&&m<prob.len&&S.cuts.indexOf(m)<0){S.cuts[i]=m;ctx.onOp();}
        }else{
          var f=x/logW,ok=true;
          for(var j=0;j<S.cuts.length;j++){if(j!==i&&Math.abs(S.cuts[j]-f)*logW<34)ok=false;}
          if(ok&&f>0.02&&f<0.98){S.cuts[i]=f;ctx.onOp();}
        }
        renderCuts();
      }
      el.addEventListener('pointermove',mv);
      el.addEventListener('pointerup',up,{once:true});
    });
  }
  function updateChips(){
    var used=S.cuts.length*prob.perCut;
    ctx.chips([
      ['锯口数',S.cuts.length+' 处',''],
      ['每锯一处',prob.perCut+' 分钟',''],
      ['已用时间',used+' 分钟 / 预算 '+prob.budget+' 分钟',used>prob.budget?'warnchip':(used===prob.budget?'okchip':'')]
    ]);
  }
  function check(){
    if(done)return{ok:true,msg:'已经完成啦！'};
    if(isRuler()){
      var need=prob.targets.slice().sort(function(a,b){return a-b;});
      var have=S.cuts.slice().sort(function(a,b){return a-b;});
      var miss=need.filter(function(m){return have.indexOf(m)<0;});
      var extra=have.filter(function(m){return need.indexOf(m)<0;});
      if(miss.length===0&&extra.length===0){done=true;splitAnim();return{ok:true,msg:'圆木长 (12÷3+1)×2=10 米'};}
      var msg='';
      if(miss.length)msg+='还差 '+miss.length+' 个锯口；';
      if(extra.length)msg+='有 '+extra.length+' 个锯口位置不对（每 2 米一处，从左端起）；';
      return{ok:false,msg:msg+'时间预算：'+prob.budget+'÷'+prob.perCut+'='+(prob.budget/prob.perCut)+'（处）。'};
    }
    if(S.cuts.length===prob.targetCount){
      done=true;splitAnim();
      return{ok:true,msg:'钢管被锯成了 '+(prob.targetCount+1)+' 段！'};
    }
    var t=S.cuts.length*prob.perCut;
    if(t>prob.budget)return{ok:false,msg:'已经用了 '+t+' 分钟，超过 '+prob.budget+' 分钟预算啦！该锯 '+(prob.budget/prob.perCut)+' 处，收掉多余的锯子。'};
    return{ok:false,msg:'现在锯了 '+S.cuts.length+' 处（用时 '+t+' 分钟）。先算算：'+prob.budget+'÷'+prob.perCut+'=几处？'};
  }
  /* 成功动画：木头分段散开 */
  function splitAnim(){
    var segs;
    if(isRuler()){
      var pts=[0].concat(S.cuts.slice().sort(function(a,b){return a-b;}),[prob.len]);
      segs=[];
      for(var i=0;i<pts.length-1;i++)segs.push([pts[i],pts[i+1]]);
    }else{
      segs=[];var n=S.cuts.length+1;
      for(var j=0;j<n;j++)segs.push([j/n,(j+1)/n]);
    }
    logEl.querySelectorAll('.saw').forEach(function(e){e.remove();});
    logEl.style.background='transparent';logEl.style.border='none';
    segs.forEach(function(sg,i){
      var x0=(isRuler()?sg[0]*ppm:sg[0]*logW);
      var w=(isRuler()?(sg[1]-sg[0])*ppm:(sg[1]-sg[0])*logW);
      var seg=ce('div','seg');
      seg.style.left=x0+'px';seg.style.width=Math.max(6,w-4)+'px';
      logEl.appendChild(seg);
      var shift=(i-(segs.length-1)/2)*14;
      requestAnimationFrame(function(){
        seg.style.transform='translate('+shift+'px,30px) rotate('+(i%2?3:-3)+'deg)';
      });
    });
    var chip=ce('div','stage-note','🎉 一共锯成了 '+segs.length+' 段！（锯 '+(segs.length-1)+' 次 = 段数 '+segs.length+' - 1）');
    st.appendChild(chip);
    updateChipsDone(segs.length);
  }
  function updateChipsDone(n){
    ctx.chips([
      ['锯口数',(n-1)+' 处','= 段数-1'],
      ['段数',n+' 段','okchip']
    ]);
  }
  function hint(){
    if(done)return;
    if(isRuler()){
      ctx.tip('💡 每段 2 米：锯口在 2、4、6、8 米处（时间 12÷3=4 处）。');
      var miss=prob.targets.filter(function(m){return S.cuts.indexOf(m)<0;});
      if(miss.length&&logEl){
        var e=ce('div','saw','<span class="ic" style="opacity:.5">🪚</span><div class="cutline" style="opacity:.5"></div>');
        e.style.left=(miss[0]*ppm)+'px';e.style.pointerEvents='none';
        logEl.appendChild(e);
        setTimeout(function(){e.remove();},2200);
      }
    }else{
      ctx.tip('💡 先算锯的次数：'+prob.budget+'÷'+prob.perCut+'='+(prob.budget/prob.perCut)+'（处），摆 '+prob.targetCount+' 把锯子就对了。');
    }
  }
  function demo(){
    done=false;S.cuts=[];
    if(isRuler()){S.cuts=prob.targets.slice();}
    else{for(var i=1;i<=prob.targetCount;i++)S.cuts.push(i/(prob.targetCount+1));}
    buildUI();updateChips();
  }
  function celebrate(){
    /* 通关后让每段木头轻轻晃动一下 */
    logEl.querySelectorAll('.seg').forEach(function(sg,i){
      sg.style.transition='transform .5s ease';
      sg.style.transform='translate('+((i%2?14:-14))+'px,36px) rotate('+(i%2?6:-6)+'deg)';
    });
  }
  function flash(t){ctx.tip(t);}
  function mount(){
    done=false;S={cuts:[]};
    buildUI();buildTray();ctx.tip(prob.tip);
  }
  function relayout(){buildUI();}
  mount();
  return{mount:mount,check:check,hint:hint,demo:demo,relayout:relayout,celebrate:celebrate};
}

/* =====================================================================
 * 引擎四：ClimbEngine —— 拖小人爬楼
 * ===================================================================== */
function ClimbEngine(prob,ctx){
  var st=ctx.stage;
  var S={floor:prob.kind==='duo'?prob.bStart:prob.start};
  var bld,avatar,avatar2,rowH=27,done=false;

  function buildUI(){
    st.innerHTML='';
    bld=ce('div','bld');
    for(var f=prob.floors;f>=1;f--){
      var r=ce('div','floor'+(f===1?' first':''),'第'+f+'层');
      bld.appendChild(r);
    }
    st.appendChild(bld);
    if(prob.kind==='duo'){
      avatar2=mkAvatar(prob.aName,'🧑','pinned',prob.aFloor,true);
      avatar=mkAvatar(prob.bName,'👧','',S.floor,false);
    }else{
      avatar=mkAvatar('小明','🧑','',S.floor,false);
    }
    updateChips();
  }
  function floorY(f){
    return (prob.floors-f)*rowH+rowH/2;
  }
  function mkAvatar(name,ic,cls,floor,flag){
    var a=ce('div','avatar '+cls,'<span class="ic">'+ic+'</span><span class="nm">'+name+'</span>'+(flag?'<span class="flag">🚩</span>':''));
    a.style.top=floorY(floor)+'px';
    if(!cls||cls.indexOf('pinned')<0){
      a.addEventListener('pointerdown',function(e){
        e.preventDefault();
        a.setPointerCapture(e.pointerId);
        function mv(ev){
          var r=bld.getBoundingClientRect();
          var f=clamp(prob.floors-Math.floor((ev.clientY-r.top)/rowH),1,prob.floors);
          a.style.top=floorY(f)+'px';
        }
        function up(ev){
          a.removeEventListener('pointermove',mv);
          var r=bld.getBoundingClientRect();
          var f=clamp(prob.floors-Math.floor((ev.clientY-r.top)/rowH),1,prob.floors);
          S.floor=f;ctx.onOp();a.style.top=floorY(f)+'px';updateChips();
        }
        a.addEventListener('pointermove',mv);
        a.addEventListener('pointerup',up,{once:true});
      });
    }
    bld.appendChild(a);
    return a;
  }
  function updateChips(){
    if(prob.kind==='duo'){
      ctx.chips([
        [prob.aName+'（已到）','第'+prob.aFloor+'层 · 走了'+(prob.aFloor-1)+'段',''],
        [prob.bName,'第'+S.floor+'层 · 走了'+(S.floor-1)+'段',S.floor===prob.goalFloor?'okchip':''],
        ['已知','小明走3段的时间＝小红走4段','']
      ]);
    }else{
      var seg=S.floor-prob.start;
      ctx.chips([
        ['测速','1层→3层走了2段用32秒',''],
        ['每段','32÷2＝16 秒',''],
        ['已走',seg+' 段（从'+prob.start+'层出发）',''],
        ['已用时',seg+'×16＝'+(seg*16)+' 秒',S.floor===prob.goalFloor?'okchip':'']
      ]);
    }
  }
  function check(){
    if(S.floor===prob.goalFloor){
      done=true;
      return{ok:true,msg:prob.kind==='duo'?'小红到了第'+prob.goalFloor+'层！':'用时 9×16=144 秒！'};
    }
    if(prob.kind==='duo'){
      return{ok:false,msg:'小红现在走了 '+(S.floor-1)+' 段。小明走了 16-1=15 段，是 3 段的 5 倍；小红走的段数也该是 4 段的 5 倍哦！'};
    }
    return{ok:false,msg:'把小明拖到第 12 层再检查！提示：从'+prob.start+'层出发，每段 16 秒。'};
  }
  function hint(){
    if(prob.kind==='duo')ctx.tip('💡 段数=层数-1：小明 16-1=15 段（3段的5倍）；小红：4×5=20 段，所以是 20+1=21 层。');
    else ctx.tip('💡 从 3 层到 12 层要走 12-3=9 段，每段 32÷2=16 秒。把小明拖到 12 层！');
  }
  function demo(){S.floor=prob.goalFloor;avatar.style.top=floorY(prob.goalFloor)+'px';updateChips();}
  function celebrate(){if(avatar){avatar.querySelector('.ic').style.animation='jump .6s infinite 3';}}
  function mount(){done=false;S={floor:prob.kind==='duo'?prob.bStart:prob.start};buildUI();ctx.tip(prob.tip);}
  function relayout(){buildUI();}
  mount();
  return{mount:mount,check:check,hint:hint,demo:demo,celebrate:celebrate,relayout:relayout};
}

var FX={
  cv:null,c:null,ps:[],raf:0,
  init:function(){
    this.cv=$('#fx');this.c=this.cv.getContext('2d');
    var self=this;
    function rs(){self.cv.width=window.innerWidth;self.cv.height=window.innerHeight;}
    rs();window.addEventListener('resize',rs);
  },
  burst:function(x,y,n){
    var colors=['#ff5252','#ffd740','#69f0ae','#40c4ff','#e040fb','#ff9d2e','#fff176'];
    for(var i=0;i<n;i++){
      var a=Math.random()*Math.PI*2,v=3+Math.random()*7;
      this.ps.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,g:.18,r:4+Math.random()*5,
        c:colors[Math.floor(Math.random()*colors.length)],rot:Math.random()*6,vr:(Math.random()-.5)*.3,life:70+Math.random()*40,shape:Math.random()<.25?'star':'rect'});
    }
    if(!this.raf)this.tick();
  },
  burstCenter:function(){this.burst(window.innerWidth/2,window.innerHeight*0.35,120);},
  bigShow:function(){
    var self=this;var i=0;
    var t=setInterval(function(){
      self.burst(window.innerWidth*(0.2+Math.random()*0.6),window.innerHeight*(0.15+Math.random()*0.4),90);
      if(++i>=6)clearInterval(t);
    },380);
  },
  tick:function(){
    var c=this.c,self=this;
    c.clearRect(0,0,this.cv.width,this.cv.height);
    this.ps=this.ps.filter(function(p){return p.life>0;});
    this.ps.forEach(function(p){
      p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.rot+=p.vr;p.life--;
      c.save();c.translate(p.x,p.y);c.rotate(p.rot);
      c.globalAlpha=Math.min(1,p.life/40);c.fillStyle=p.c;
      if(p.shape==='star'){
        c.beginPath();
        for(var k=0;k<5;k++){
          var a1=k*Math.PI*2/5-Math.PI/2,a2=a1+Math.PI/5;
          c.lineTo(Math.cos(a1)*p.r,Math.sin(a1)*p.r);
          c.lineTo(Math.cos(a2)*p.r*0.45,Math.sin(a2)*p.r*0.45);
        }
        c.closePath();c.fill();
      }else{
        c.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.7);
      }
      c.restore();
    });
    if(this.ps.length){this.raf=requestAnimationFrame(function(){self.tick();});}
    else{this.raf=0;c.clearRect(0,0,this.cv.width,this.cv.height);}
  }
};
