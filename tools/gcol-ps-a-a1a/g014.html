<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>蜗牛爬井大冒险 · 左右脑开发</title>
<style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{width:100%;height:100%;overflow:hidden;font-family:"Microsoft YaHei","微软雅黑","PingFang SC",sans-serif}:root{--primary:#4ECDC4;--primary-dark:#2BB6AC;--accent:#FF6B6B;--sky-top:#87CEEB;--sky-bottom:#FFE4B5;--night-top:#1a1a3e;--night-bottom:#3a3a5e;--well:#5a3a1a;--well-light:#7a5a2a;--rope:#8B4513;--text:#333;--bg:#f5f5f5;--card:#fff;--snail-shell:#FFB347;--snail-body:#FFD580}body{background:var(--bg);color:var(--text);font-size:18px}#screen-menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary),var(--primary-dark));padding:20px;z-index:100}.menu-title{font-size:48px;color:#fff;font-weight:900;text-align:center;line-height:1.3;text-shadow:3px 3px 0 rgba(0,0,0,.2);margin-bottom:10px}.menu-sub{font-size:22px;color:rgba(255,255,255,.95);margin-bottom:40px;text-align:center}.menu-snail{font-size:90px;margin-bottom:30px;animation:bounce 2s infinite ease-in-out}@keyframes bounce{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-20px) rotate(5deg)}}.diff-buttons{display:flex;flex-direction:column;gap:20px;width:100%;max-width:340px}.diff-btn{padding:22px 30px;font-size:24px;font-weight:700;border:none;border-radius:20px;cursor:pointer;color:#fff;background:rgba(255,255,255,.2);border:3px solid rgba(255,255,255,.4);transition:all .25s;box-shadow:0 6px 0 rgba(0,0,0,.15)}.diff-btn:hover,.diff-btn:active{transform:translateY(-3px);background:rgba(255,255,255,.35)}.diff-btn small{display:block;font-size:15px;font-weight:400;opacity:.9;margin-top:4px}#diff-easy{background:linear-gradient(135deg,#52c41a,#389e0d)}#diff-mid{background:linear-gradient(135deg,#faad14,#d48806)}#diff-hard{background:linear-gradient(135deg,#ff4d4f,#cf1322)}.menu-help{margin-top:30px;color:#fff;font-size:16px;background:rgba(0,0,0,.2);padding:10px 20px;border-radius:30px;cursor:pointer}#screen-game{position:fixed;inset:0;display:none;flex-direction:column}.hud{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--primary);color:#fff;font-size:18px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.2);flex-shrink:0}.hud-item{display:flex;align-items:center;gap:6px}.hud-btn{background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.4);color:#fff;padding:6px 12px;border-radius:10px;cursor:pointer;font-size:16px;font-weight:700}.hud-btn:active{transform:scale(.95)}.task-card{background:var(--card);margin:10px;padding:14px 18px;border-radius:14px;font-size:18px;font-weight:600;box-shadow:0 3px 10px rgba(0,0,0,.1);border-left:8px solid var(--primary);line-height:1.5}.task-card .q{font-size:20px;color:var(--accent);font-weight:800;margin-bottom:6px}.stage-wrap{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:0 10px 10px;min-height:0}.stage{position:relative;width:100%;max-width:520px;height:100%;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.2);border:4px solid var(--well)}.sky{position:absolute;left:0;right:0;top:0;height:55%;background:linear-gradient(to bottom,var(--sky-top),var(--sky-bottom));transition:background 1.2s ease}.sky.night{background:linear-gradient(to bottom,var(--night-top),var(--night-bottom))}.sun{position:absolute;top:15%;right:12%;font-size:50px;transition:opacity 1s,transform 1s}.moon{position:absolute;top:15%;right:12%;font-size:46px;opacity:0;transition:opacity 1s}.star{position:absolute;color:#FFD700;font-size:14px;opacity:0;transition:opacity 1.2s}.ground{position:absolute;left:0;right:0;top:55%;height:45%;background:linear-gradient(to bottom,#8B5A2B,#654321)}.grass{position:absolute;left:0;right:0;top:55%;height:14px;background:repeating-linear-gradient(90deg,#4CAF50,#4CAF50 8px,#3d9140 8px,#3d9140 16px)}.well-top-mark{position:absolute;left:0;right:0;top:55%;height:4px;background:#FFEB3B;box-shadow:0 0 12px #FFEB3B,0 0 24px #FFEB3B;z-index:6}.snail{position:absolute;left:18%;font-size:54px;z-index:5;cursor:grab;transition:left .3s;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3));touch-action:none}.snail.dragging{cursor:grabbing;transition:none;z-index:10}.snail.cheer{animation:cheer .5s infinite}@keyframes cheer{0%,100%{transform:rotate(-10deg) scale(1)}50%{transform:rotate(10deg) scale(1.15)}}.ruler{position:absolute;left:6px;top:55%;bottom:0;width:42px;display:flex;flex-direction:column-reverse;pointer-events:none;z-index:4}.ruler-tick{flex:1;border-top:1px dashed rgba(255,255,255,.5);display:flex;align-items:flex-start;justify-content:center;color:#fff;font-size:12px;font-weight:700;padding-top:1px}.control-panel{flex-shrink:0;padding:8px 10px 14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.ctrl-btn{padding:14px 22px;font-size:18px;font-weight:700;border:none;border-radius:14px;cursor:pointer;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:all .15s}.ctrl-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}#btn-day{background:linear-gradient(135deg,#FFA500,#FF6347)}#btn-night{background:linear-gradient(135deg,#5C6BC0,#3949AB)}#btn-answer{background:linear-gradient(135deg,#9C27B0,#6A1B9A)}#btn-reset{background:linear-gradient(135deg,#607D8B,#455A64)}#btn-back{background:linear-gradient(135deg,#795548,#5D4037)}.log{position:absolute;left:10px;top:160px;background:rgba(0,0,0,.6);color:#fff;padding:8px 12px;border-radius:10px;font-size:13px;max-height:120px;overflow-y:auto;width:140px;z-index:8;line-height:1.6}.log-item{padding:1px 0;opacity:.95}.log-item.day{color:#FFD54F}.log-item.night{color:#90CAF9}.log-item.sum{color:#A5D6A7;font-weight:700;border-top:1px solid rgba(255,255,255,.3);margin-top:3px;padding-top:3px}@keyframes slideDown{0%{transform:translateY(0)}50%{transform:translateY(-6px) rotate(8deg)}100%{transform:translateY(0)}}.snail.sliding{animation:slideDown .8s ease}.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}.modal-mask.show{display:flex}.modal{background:#fff;border-radius:20px;padding:24px;max-width:500px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.4)}.modal h2{color:var(--primary-dark);margin-bottom:14px;font-size:26px}.modal p,.modal li{font-size:17px;line-height:1.7;margin-bottom:8px}.modal ul{padding-left:22px}.modal .close{margin-top:16px;padding:14px;width:100%;background:var(--primary);color:#fff;border:none;border-radius:12px;font-size:20px;font-weight:700;cursor:pointer}.answer-box{background:#FFF8E1;border:2px dashed #FFA000;border-radius:12px;padding:14px;margin:10px 0;font-size:18px;line-height:1.6}.answer-box strong{color:var(--accent)}#confetti{position:fixed;inset:0;pointer-events:none;z-index:300;display:none}#confetti.show{display:block}#victory{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.75);color:#fff;z-index:250;padding:20px}#victory.show{display:flex}.v-snail{font-size:90px;animation:bounce 1.5s infinite}.v-title{font-size:42px;font-weight:900;margin:16px 0;text-shadow:3px 3px 0 rgba(0,0,0,.3)}.v-info{font-size:22px;margin-bottom:8px;text-align:center}.v-stars{font-size:40px;margin:10px 0}.v-btns{display:flex;gap:14px;margin-top:20px;flex-wrap:wrap;justify-content:center}@media(max-width:480px){.menu-title{font-size:34px}.task-card{font-size:16px;padding:10px 12px}.task-card .q{font-size:17px}.snail{font-size:42px}.ctrl-btn{padding:12px 16px;font-size:16px}.log{display:none}.hud{font-size:15px}.modal{padding:18px}.modal h2{font-size:22px}}
</style>
</head>
<body>

<!-- ============ 难度选择屏 ============ -->
<div id="screen-menu">
  <div class="menu-snail">🐌</div>
  <div class="menu-title">蜗牛爬井大冒险</div>
  <div class="menu-sub">—— 第7讲 左右脑开发（下）——</div>
  <div class="diff-buttons">
    <button class="diff-btn" id="diff-easy">初级 · 小试牛刀
      <small>井深 5 米，简单数值</small>
    </button>
    <button class="diff-btn" id="diff-mid">中级 · 勇攀高峰
      <small>井深 11~24 米，需要仔细算</small>
    </button>
    <button class="diff-btn" id="diff-hard">高级 · 终极挑战
      <small>变式：竹竿、高楼、空瓶换汽水</small>
    </button>
  </div>
  <div class="menu-help" id="btn-rules-menu">📖 玩法说明</div>
</div>

<!-- ============ 游戏屏 ============ -->
<div id="screen-game">
  <div class="hud">
    <div class="hud-item">⏱️ <span id="hud-time">0</span>秒</div>
    <div class="hud-item">🌙 第 <span id="hud-day">1</span> 天</div>
    <div class="hud-item">📍 已爬 <span id="hud-height">0</span> 米</div>
    <div class="hud-item">
      <button class="hud-btn" id="btn-rules-game">规则</button>
    </div>
  </div>

  <div class="task-card" id="task-card">
    <div class="q" id="task-q"></div>
    <div id="task-body"></div>
  </div>

  <div class="stage-wrap">
    <div class="stage" id="stage">
      <div class="sky" id="sky">
        <div class="sun" id="sun">☀️</div>
        <div class="moon" id="moon">🌙</div>
      </div>
      <div class="ground"></div>
      <div class="grass"></div>
      <div class="well-top-mark"></div>
      <div class="ruler" id="ruler"></div>
      <div class="log" id="log"></div>
      <div class="snail" id="snail">🐌</div>
    </div>
  </div>

  <div class="control-panel">
    <button class="ctrl-btn" id="btn-day">☀️ 白天爬升</button>
    <button class="ctrl-btn" id="btn-night">🌙 夜晚休息</button>
    <button class="ctrl-btn" id="btn-answer">💡 揭示答案</button>
    <button class="ctrl-btn" id="btn-reset">🔄 重新开始</button>
    <button class="ctrl-btn" id="btn-back">🏠 返回菜单</button>
  </div>
</div>

<!-- ============ 弹窗：规则 / 答案 ============ -->
<div class="modal-mask" id="modal-mask">
  <div class="modal" id="modal-box"></div>
</div>

<!-- ============ 庆祝粒子画布 ============ -->
<canvas id="confetti"></canvas>

<!-- ============ 胜利屏 ============ -->
<div id="victory">
  <div class="v-snail">🐌🎉</div>
  <div class="v-title">恭喜通关！</div>
  <div class="v-stars" id="v-stars">⭐⭐⭐</div>
  <div class="v-info" id="v-info"></div>
  <div class="v-btns">
    <button class="ctrl-btn" id="v-replay" style="background:linear-gradient(135deg,#4ECDC4,#2BB6AC);">🔄 再玩一局</button>
    <button class="ctrl-btn" id="v-menu" style="background:linear-gradient(135deg,#FFA500,#FF6347);">🏠 返回菜单</button>
  </div>
</div>

<script>const QUESTION_BANK={easy:[{type:"well",depth:5,climb:2,slide:1,q:"【例4·小蜗牛出井】井深5米，白天爬2米，晚上滑1米。第几天才能爬出井口？",ans:4,explain:"白天爬2米晚上滑1米，一天一晚实际上升1米。前3天到3米，第4天白天爬2米到5米出井，不再下滑。共4天。"},{type:"well",depth:4,climb:2,slide:1,q:"【变式·小试】井深4米，白天爬2米，晚上滑1米。几天能出井？",ans:3,explain:"前2天到2米，第3天白天爬2米到4米出井。共3天。"},{type:"well",depth:3,climb:2,slide:1,q:"【变式·入门】井深3米，白天爬2米，晚上滑1米。几天出井？",ans:2,explain:"第1天到1米，第2天白天爬2米到3米出井。共2天。"}],mid:[{type:"well",depth:24,climb:8,slide:4,q:"【练习10·深井挑战】井深24米，白天爬8米，晚上滑4米。几天到井口？",ans:5,explain:"白天爬8米晚上滑4米，一天一晚实际上升4米。前4天到16米，第5天白天爬8米到24米出井。共5天。"},{type:"pole",depth:11,climb:3,slide:1,q:"【练习11·蜗牛爬竹竿】竹竿共11节，白天爬3节，晚上滑1节。几天到竿顶？",ans:5,explain:"白天爬3节晚上滑1节，一天一晚实际上升2节。前4天到8节，第5天白天爬3节到11节出竿。共5天。"},{type:"well",depth:13,climb:4,slide:2,q:"【变式·中等】井深13米，白天爬4米，晚上滑2米。几天出井？",ans:6,explain:"白天爬4米晚上滑2米，一天一晚实际上升2米。前5天到10米，第6天白天爬4米到14米（已超13米）出井。共6天。"}],hard:[{type:"well",depth:15,climb:5,slide:3,q:"【综合·大井】井深15米，白天爬5米，晚上滑3米。几天出井？",ans:6,explain:"白天爬5米晚上滑3米，一天一晚实际上升2米。前5天到10米，第6天白天爬5米到15米出井。共6天。"},{type:"floor",depth:18,climb:5,slide:2,q:"【变式·爬高楼】蜗牛爬18层高楼，白天上5层，晚上下2层。几天到顶？",ans:6,explain:"白天上5层晚上下2层，一天一晚实际上升3层。第1天到3层，第2天到6层，第3天到9层，第4天到12层，第5天到15层，第6天白天从15层上5层到20层（已超18层），成功到顶！共6天。"},{type:"well",depth:20,climb:6,slide:4,q:"【终极·深井】井深20米，白天爬6米，晚上滑4米。几天出井？",ans:8,explain:"白天爬6米晚上滑4米，一天一晚实际上升2米。前7天到14米，第8天白天爬6米到20米出井。共8天。"}]};const THEMES=[{primary:"#4ECDC4",primaryDark:"#2BB6AC",accent:"#FF6B6B",skyTop:"#87CEEB",skyBottom:"#FFE4B5"},{primary:"#7E57C2",primaryDark:"#5E35B1",accent:"#FFCA28",skyTop:"#B39DDB",skyBottom:"#E1BEE7"},{primary:"#26A69A",primaryDark:"#00796B",accent:"#EF5350",skyTop:"#80CBC4",skyBottom:"#FFE0B2"},{primary:"#FF7043",primaryDark:"#D84315",accent:"#FFEB3B",skyTop:"#FFAB91",skyBottom:"#FFE082"},{primary:"#5C6BC0",primaryDark:"#283593",accent:"#FF8A65",skyTop:"#9FA8DA",skyBottom:"#C5CAE9"},{primary:"#EC407A",primaryDark:"#AD1457",accent:"#26C6DA",skyTop:"#F48FB1",skyBottom:"#FCE4EC"}];let state={difficulty:null,question:null,currentHeight:0,dayCount:1,phase:"day",startTime:0,timerId:null,finished:false,steps:0};const $=id=>document.getElementById(id);const menuScr=$("screen-menu");const gameScr=$("screen-game");const snail=$("snail");const sky=$("sky");const sun=$("sun");const moon=$("moon");const ruler=$("ruler");const logBox=$("log");function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}function applyRandomTheme(){const t=pick(THEMES);const r=document.documentElement.style;r.setProperty("--primary",t.primary);r.setProperty("--primary-dark",t.primaryDark);r.setProperty("--accent",t.accent);r.setProperty("--sky-top",t.skyTop);r.setProperty("--sky-bottom",t.skyBottom)}function startGame(diff){state.difficulty=diff;const pool=QUESTION_BANK[diff];state.question=JSON.parse(JSON.stringify(pool[rand(0,pool.length-1)]));state.currentHeight=0;state.dayCount=1;state.phase="day";state.finished=false;state.steps=0;state.startTime=Date.now();applyRandomTheme();menuScr.style.display="none";gameScr.style.display="flex";$("victory").classList.remove("show");$("confetti").classList.remove("show");renderTask();buildRuler();positionSnail();setDayPhase();clearLog();log("🏁 开始！白天先爬","day");if(state.timerId)clearInterval(state.timerId);state.timerId=setInterval(()=>{$("hud-time").textContent=Math.floor((Date.now()-state.startTime)/1e3)},500);updateHUD()}function renderTask(){const q=state.question;$("task-q").textContent=q.q;const typeName={well:"井",pole:"竿",floor:"楼"}[q.type]||"目标";$("task-body").innerHTML=`井深/总高：<b>${q.depth}</b> 米 &nbsp;|&nbsp; 白天爬：<b>${q.climb}</b> 米 &nbsp;|&nbsp; 晚上滑：<b>${q.slide}</b> 米<br>
     <span style="color:#666;font-size:15px;">提示：记住"最后一天不下滑"哦！白天够到井口就直接出井。</span>`}function buildRuler(){ruler.innerHTML="";const depth=state.question.depth;for(let i=0;i<=depth;i++){const d=document.createElement("div");d.className="ruler-tick";if(i%Math.max(1,Math.ceil(depth/10))===0||i===depth){d.textContent=i+"m"}ruler.appendChild(d)}}function positionSnail(){const stage=$("stage");const groundH=stage.clientHeight*.45;const depth=state.question.depth;const ratio=Math.min(state.currentHeight/depth,1);const skyH=stage.clientHeight*.55;const maxClimbPx=skyH-10;const topPx=stage.clientHeight*.55-ratio*maxClimbPx-30;snail.style.top=Math.max(10,topPx)+"px"}window.addEventListener("resize",()=>{if(gameScr.style.display==="flex")positionSnail()});function doDayClimb(){if(state.finished)return;if(state.phase!=="day"){flashHint('现在已经是夜晚啦，请先点"夜晚休息"',"#5C6BC0");return}state.steps++;const q=state.question;const before=state.currentHeight;state.currentHeight=Math.min(before+q.climb,q.depth);positionSnail();snail.classList.add("dragging");setTimeout(()=>snail.classList.remove("dragging"),300);log(`☀️ 第${state.dayCount}天白天：爬${q.climb}米 → ${state.currentHeight}米`,"day");if(state.currentHeight>=q.depth){log(`🎉 第${state.dayCount}天就出井了！不用下滑！`,"sum");state.finished=true;setTimeout(()=>victory(state.dayCount),700);return}state.phase="night";setNightPhase();updateHUD();flashHint(`白天爬到 ${state.currentHeight} 米。该休息了，点"夜晚休息"`,"#FFA500")}function doNightSlide(){if(state.finished)return;if(state.phase!=="night"){flashHint('现在还是白天，请先点"白天爬升"',"#FFA500");return}state.steps++;const q=state.question;const before=state.currentHeight;state.currentHeight=Math.max(0,before-q.slide);snail.classList.add("sliding");setTimeout(()=>{snail.classList.remove("sliding");positionSnail()},400);log(`🌙 第${state.dayCount}天夜晚：滑${q.slide}米 → ${state.currentHeight}米`,"night");state.dayCount++;state.phase="day";setTimeout(()=>{setDayPhase();updateHUD()},500)}function setDayPhase(){sky.classList.remove("night");sun.style.opacity="1";moon.style.opacity="0";document.querySelectorAll(".star").forEach(s=>s.style.opacity="0")}function setNightPhase(){sky.classList.add("night");sun.style.opacity="0";moon.style.opacity="1";ensureStars();document.querySelectorAll(".star").forEach(s=>s.style.opacity="1")}function ensureStars(){if(sky.querySelector(".star"))return;for(let i=0;i<8;i++){const s=document.createElement("div");s.className="star";s.textContent="✦";s.style.left=rand(5,90)+"%";s.style.top=rand(5,40)+"%";s.style.fontSize=rand(10,18)+"px";sky.appendChild(s)}}function updateHUD(){$("hud-day").textContent=state.dayCount;$("hud-height").textContent=state.currentHeight}function clearLog(){logBox.innerHTML=""}function log(text,cls){const d=document.createElement("div");d.className="log-item "+(cls||"");d.textContent=text;logBox.appendChild(d);logBox.scrollTop=logBox.scrollHeight}let hintTimer=null;function flashHint(text,color){let el=document.getElementById("flash-hint");if(!el){el=document.createElement("div");el.id="flash-hint";el.style.cssText="position:fixed;left:50%;top:14%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:10px 18px;border-radius:24px;font-size:16px;font-weight:700;z-index:150;max-width:90%;text-align:center;";document.body.appendChild(el)}el.style.background=color||"rgba(0,0,0,.78)";el.textContent=text;el.style.opacity="1";el.style.transition="opacity .3s";if(hintTimer)clearTimeout(hintTimer);hintTimer=setTimeout(()=>{el.style.opacity="0"},2200)}function victory(usedDays){if(state.timerId)clearInterval(state.timerId);const q=state.question;const correct=q.ansFixed||q.ans;const usedSec=Math.floor((Date.now()-state.startTime)/1e3);const isRight=usedDays===correct;let stars="⭐⭐⭐";if(usedDays>correct)stars="⭐⭐";if(usedDays<correct)stars="⭐⭐⭐";if(!isRight)stars="⭐";$("v-info").innerHTML=`你用了 <b style="color:#FFD54F;">${usedDays}</b> 天让蜗牛出井！<br>正确答案：<b style="color:#A5D6A7;">${correct}</b> 天 &nbsp;|&nbsp; 用时：${usedSec} 秒 &nbsp;|&nbsp; 操作：${state
