<style>:root{--bg:#FFF6EA;--panel:#FFFFFF;--main:#FF8A3D;--deep:#5B3A1E;--soft:#FFE8D2;--line:#EAD3B8;--ok:#3FA34D;--warn:#E07B00;--shadow:#E8C9A4}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0}body{background:var(--bg);color:var(--deep);min-height:100vh;font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC","Heiti SC",sans-serif;font-size:18px;user-select:none;-webkit-user-select:none}b{color:inherit}#topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel);border-bottom:4px solid var(--line);padding:8px 14px;box-shadow:0 2px 8px var(--shadow)}.tb-left{display:flex;gap:8px;align-items:center}.tb-mid{flex:1;min-width:150px;font-size:20px;font-weight:bold}.tb-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.chip{background:var(--soft);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-size:17px;white-space:nowrap}.stage-chip{font-weight:bold;color:var(--main)}.btn{font-family:inherit;font-size:18px;font-weight:bold;color:var(--deep);background:var(--soft);border:3px solid var(--deep);border-radius:14px;padding:10px 18px;cursor:pointer;box-shadow:0 3px 0 var(--deep);min-height:46px}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--deep)}.btn.primary{background:var(--main);color:#FFFFFF}.btn.small{font-size:16px;padding:6px 12px;min-height:40px;box-shadow:0 2px 0 var(--deep)}.btn-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;align-items:center}.btn-row.center{justify-content:center}#app{max-width:1100px;margin:0 auto;padding:16px 14px 60px}.screen-home{text-align:center;padding-top:10px}.home-deco{margin-top:6px}.home-title h1{font-size:34px;margin:10px 0 6px}.home-title .sub{font-size:19px;color:var(--deep);opacity:.85;margin:0 0 24px}.diff-cards{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin:10px 0 20px}.diff-card{width:250px;background:var(--panel);border:4px solid var(--dee ne-height:1.55;min-height:76px}.lc-facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.fact{background:var(--soft);border:2px solid var(--line);border-radius:999px;padding:2px 10px;font-size:16px;font-weight:bold}.f-on{color:#C05600}.f-off{color:#3D6BAA}.lamp-card.okpick{border-color:var(--ok);box-shadow:0 3px 0 var(--ok)}.lamp-card.badpick{border-color:var(--warn);box-shadow:0 3px 0 var(--warn)}.lc-truth{margin-top:6px;font-size:16px;font-weight:bold}.t-lit{color:var(--warn)}.t-dark{color:#3D6BAA}.lamp-shelves{display:flex;gap:16px;flex-wrap:wrap}.lamp-shelves .shelf{flex:1;min-width:260px;min-height:150px}.shelf-cards{display:flex;gap:10px;flex-wrap:wrap}.grp{margin-bottom:10px}.grp-name{font-size:18px;font-weight:bold;margin-bottom:4px}.grp-toks{display:flex;gap:8px;flex-wrap:wrap;min-height:44px}.item{font-size:28px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:2px 8px;line-height:1.3}.basket-box{background:var(--panel)}.basket-sum{font-size:17px;margin-top:6px;line-height:1.6}.bowl{display:inline-block;font-size:30px;font-weight:bold;background:var(--panel);border:3px solid var(--deep);border-radius:16px;padding:10px 18px;cursor:grab;touch-action:none}.plates-row{display:flex;gap:16px;flex-wrap:wrap}.plate-zone{flex:1;min-width:150px;min-height:150px;text-align:center;background:var(--panel);border:4px dashed var(--line);border-radius:18px;padding:8px;cursor:grab;touch-action:none}.plate-zone.dup{border-color:var(--warn);background:#FFF3E0}.plate-count{font-size:34px;font-weight:bold;color:var(--main)}.plate-label{font-size:17px;font-weight:bold}.dup-tip{font-size:15px;color:var(--warn);font-weight:bold;margin-top:2px}.gmsg{margin-top:12px}.banner{background:var(--panel);border:4px solid var(--warn);border-radius:16px;padding:12px 16px;font-size:19px;line-height:1.65}#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--deep);color:#fff;font-size:18px;border-radius:14px;padding:10px 20px;z-index:120;max-width:88vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}#toast.show{opacity:1}#mask{position:fixed;inset:0;background:rgba(40,25,10,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}#mask.show{display:flex}.modal-box{background:var(--panel);border:4px solid var(--deep);border-radius:22px;max-width:720px;width:100%;max-height:84vh;overflow-y:auto;padding:18px 20px}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.modal-head b{font-size:22px}#mBody{font-size:18px;line-height:1.7}#mBody h3{margin:10px 0 4px;color:var(--main);font-size:19px}#mBody p{margin:6px 0}.m-btns{justify-content:center;margin-top:14px}.screen-result{text-align:center;padding-top:30px}.res-emoji{font-size:72px}.screen-result h2{font-size:30px;margin:8px 0}.res-msg{font-size:19px;max-width:640px;margin:0 auto;line-height:1.7}.res-stats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:18px 0}.res-stats span{background:var(--panel);border:3px solid var(--line);border-radius:999px;padding:8px 18px;font-size:19px}#cfLayer{position:fixed;inset:0;pointer-events:none;z-index:110;overflow:hidden}.cfGroup{position:absolute;inset:0}.cf{position:absolute;top:-34px;width:14px;height:20px;opacity:.95;animation-name:cfFall;animation-timing-function:linear;animation-fill-mode:forwards}.cf-round{border-radius:50%;width:15px;height:15px}.cf-star{width:22px;height:22px;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}@keyframes cfFall{0%{transform:translate(0,0) rotate(0deg);opacity:1}80%{opacity:1}100%{transform:translate(var(--dx,0px),108vh) rotate(var(--rr,360deg));opacity:.5}}@media(max-width:760px){body{font-size:17px}.tb-mid{order:9;width:100%;text-align:center}.q-text{font-size:18px}.lamp-card{width:100%}.lc-story{min-height:0}.home-title h1{font-size:27px}.diff-card{width:86%}.pan-slot{width:100px;height:100px}.p-slot <body>

<!-- 顶栏：标题 + 计时 + 步数 + 全局按钮 -->
<header id="topbar">
  <div class="tb-left"><span id="hudStage" class="chip stage-chip"></span></div>
  <div class="tb-mid">左右脑开发 · 快乐闯关</div>
  <div class="tb-right">
    <span class="chip">⏱ <b id="hudTime">00:00</b></span>
    <span class="chip">👣 <b id="hudStep">0</b> 步</span>
    <button class="btn small" id="btnRules">📋 规则</button>
    <button class="btn small" id="btnReveal">💡 揭示答案</button>
    <button class="btn small" id="btnRestart">🔄 重新开始</button>
    <button class="btn small" id="btnHome">🏠 返回难度</button>
  </div>
</header>

<main id="app"></main>

<!-- 撒花庆祝层（纯CSS彩纸+星星，覆盖全屏，不挡操作） -->
<div id="cfLayer"></div>

<!-- 通用弹窗 -->
<div id="mask">
  <div class="modal-box">
    <div class="modal-head"><b id="mTitle"></b><button class="btn small" id="mClose">✖ 关闭</button></div>
    <div id="mBody"></div>
  </div>
</div>

<!-- 轻提示 -->
<div id="toast"></div>

<script>"use strict";var G={difficulty:null,stages:[],stageIdx:0,steps:0,seconds:0,timerId:null,current:null,palName:""};function $(s,root){return(root||document).querySelector(s)}function el(tag,cls,html){var e=document.createElement(tag);if(cls){e.className=cls}if(arguments.length>2&&html!==null){e.innerHTML=html}return e}function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}function fmt(sec){var m=Math.floor(sec/60),s=sec%60;return(m<10?"0":"")+m+":"+(s<10?"0":"")+s}var toastTimer=null;function toast(msg,ms){var t=$("#toast");t.textContent=msg;t.classList.add("show");if(toastTimer){clearTimeout(toastTimer)}toastTimer=setTimeout(function(){t.classList.remove("show")},ms||2600)}function openModal(title,html,buttons){$("#mTitle").textContent=title;var body=$("#mBody");body.innerHTML=html;if(buttons&&buttons.length){var row=el("div","btn-row m-btns");buttons.forEach(function(b){var bt=el("button","btn "+(b.cls||""),b.label);bt.onclick=function(){closeModal();if(b.fn){b.fn()}};row.appendChild(bt)});body.appendChild(row)}$("#mask").classList.add("show")}function closeModal(){$("#mask").classList.remove("show");$("#mBody").innerHTML=""}function renderHUD(){$("#hudTime").textContent=fmt(G.seconds);$("#hudStep").textContent=G.steps;var c=$("#hudStage");if(G.difficulty&&G.stageIdx<G.stages.length){c.textContent=diffName(G.difficulty)+" · 第 "+(G.stageIdx+1)+"/"+G.stages.length+" 关"}else if(G.difficulty){c.textContent=diffName(G.difficulty)+" · 通关！"}else{c.textContent=""}}function addStep(){G.steps++;renderHUD()}function startTimer(){stopTimer();G.timerId=setInterval(function(){G.seconds++;renderHUD()},1e3)}function stopTimer(){if(G.timerId){clearInterval(G.timerId);G.timerId=null}}function diffName(k){return k==="easy"?"初级":k==="mid"?"中级":"高级"}var PALETTES=[{name:"蜜桃橙",bg:"#FFF6EA",panel:"#FFFFFF",main:"#F07818",deep:
