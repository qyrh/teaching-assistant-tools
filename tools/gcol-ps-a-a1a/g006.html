<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数量小剧场 · 加减法应用大闯关</title>
<style>*{box-sizing:border-box;margin:0;padding:0}:root{--c1:#1565c0;--bg1:#e3f2fd;--bg2:#bbdefb;--ac:#ffb300;--ok:#2e7d32;--bad:#c62828}html,body{height:100%}body{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:#263238;min-height:100vh;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}header{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:10px 18px;background:var(--c1);color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.18);flex-wrap:wrap;gap:6px}.brand{font-size:26px;font-weight:bold}#themeName{font-size:14px;opacity:.92;margin-left:10px}.hud{display:flex;gap:14px;font-size:18px;font-weight:bold;background:rgba(255,255,255,.16);padding:6px 14px;border-radius:999px}main{max-width:980px;margin:0 auto;padding:18px 14px 46px}.hidden{display:none!important}.hero{text-align:center;padding:26px 8px 8px}.hero h1{font-size:clamp(28px,5vw,44px);color:var(--c1);text-shadow:0 2px 0 #fff}.hero .sub{font-size:clamp(16px,3vw,22px);margin-top:10px;color:#455a64}.lvCards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:26px}.lvCard{cursor:pointer;border:none;border-radius:20px;padding:26px 16px;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.12);transition:transform .15s,box-shadow .15s;text-align:center;font-family:inherit}.lvCard:hover{transform:translateY(-6px);box-shadow:0 12px 26px rgba(0,0,0,.18)}.lvCard .ic{font-size:52px}.lvCard h2{font-size:24px;color:var(--c1);margin:10px 0 8px}.lvCard p{font-size:16px;color:#546e7a;line-height:1.55}.lvCard .tag{display:inline-block;margin-top:12px;background:var(--ac);color:#4e342e;font-weight:bold;padding:6px 18px;border-radius:999px;font-size:17px}.btn{cursor:pointer;border:3px solid var(--c1);background:#fff;color:var(--c1);font-family:inherit;font-weight:bold;font-size:18px;padding:10px 18px;border-radius:14px;box-shadow:0 3px 0 var(--c1);transition:transform .08s;touch-action:manipulation}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--c1)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.primary{background:var(--c1);color:#fff}.btn.big{font-size:22px;padding:14px 30px}.controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:14px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.progress{display:flex;gap:8px;align-items:center;font-size:18px;font-weight:bold;color:var(--c1);flex-wrap:wrap}.dot{width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid var(--c1);display:flex;align-items:center;justify-content:center;font-size:16px}.dot.cur{background:var(--ac)}.dot.done{background:var(--c1);color:#fff}.storyCard{background:#fff;border-left:10px solid var(--c1);border-radius:14px;padding:14px 18px;font-size:clamp(18px,2.6vw,23px);line-height:1.65;box-shadow:0 4px 12px rgba(0,0,0,.08);margin-bottom:12px}#hintBar{background:#fff7e0;border:2px dashed var(--ac);border-radius:12px;padding:10px 16px;font-size:18px;margin-bottom:12px;min-height:46px;line-height:1.5}.flash{animation:flash .6s}@keyframes flash{0%{background:#ffe082}100%{background:#fff7e0}}.eqStrip{background:#fff;border-radius:12px;padding:10px 16px;font-size:clamp(22px,3.4vw,30px);font-weight:bold;color:var(--c1);text-align:center;letter-spacing:2px;margin-bottom:14px;box-shadow:0 3px 10px rgba(0,0,0,.08)}.stageWrap{position:relative;background:radial-gradient(circle at 50% 25%,#ffffff 0%,var(--bg1) 75%);border:3px solid var(--c1);border-radius:18px;padding:16px;margin-bottom:16px;min-height:150px}#counterChip{position:absolute;top:-16px;right:14px;background:var(--c1);color:#fff;font-weight:bold;border-radius:999px;padding:4px 14px;font-size:17px}#tapChip{position:absolute;top:-16px;left:14px;background:var(--ac);color:#4e342e;font-weight:bold;border-radius:999px;padding:4px 14px;font-size:17px}#stage{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-content:center;min-height:110px;padding-top:8px}.obj{position:relative;font-size:clamp(30px,5vw,42px);width:52px;height:52px;display:flex;align-items:center;justify-content:center}.obj.pop{animation:pop .32s ease}@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}.obj.flyOut{animation:fly .5s ease forwards}@keyframes fly{to{transform:translateY(-64px) scale(.4);opacity:0}}.obj.tappable{cursor:pointer}.badge{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;font-size:14px;font-weight:bold;min-width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff}#timeline{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}.slot{width:150px;min-height:100px;border:3px dashed #90a4ae;border-radius:14px;position:relative;display:flex;align-items:center;justify-content:center;padding:8px;background:rgba(255,255,255,.6)}.slot.hl{border-color:var(--ac);background:#fff8e1;box-shadow:0 0 0 4px rgba(255,179,0,.35)}.slot .slotTag{position:absolute;top:-12px;left:10px;background:#78909c;color:#fff;font-size:14px;padding:2px 10px;border-radius:999px;font-weight:bold}.hand{background:rgba(255,255,255,.55);border-radius:16px;padding:14px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center;min-height:104px}.card{background:#fff;border:3px solid var(--c1);border-radius:14px;padding:12px 10px 8px;width:134px;text-align:center;cursor:grab;position:relative;box-shadow:0 3px 8px rgba(0,0,0,.12)}.card .cVerb{font-size:17px;font-weight:bold;color:#37474f}.card .cNum{font-size:25px;font-weight:bold;color:var(--c1);margin-top:4px}.card .cSign{position:absolute;top:-11px;right:-11px;width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:bold;border:3px solid #fff}.card .cSign.plus{background:var(--ok)}.card .cSign.minus{background:var(--bad)}.cmpRowCard{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:16px;box-shadow:0 4px 12px rgba(0,0,0,.08);border:3px solid transparent}.cmpRowCard.ref{border-color:#4db6ac}.cmpRowCard.tgt{border-color:var(--ac)}.rowHead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px}.rowName{font-size:20px;font-weight:bold;color:#37474f}.chip{background:var(--c1);color:#fff;border-radius:999px;padding:4px 14px;font-size:17px;font-weight:bold}.objRow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:62px;padding:8px;border-radius:12px}#tgtRow{border:3px dashed #b0bec5;background:#fafafa}#tgtRow.hl{border-color:var(--ac);background:#fff8e1}.obj.cmp{cursor:grab}.obj.segSame{outline:3px solid var(--ok);outline-offset:2px;border-radius:8px;background:#e8f5e9}.obj.segMore{outline:3px dashed #ef6c00;outline-offset:2px;border-radius:8px;background:#fff3e0}.segLabel{font-size:16px;color:#546e7a;text-align:center;margin-top:8px;min-height:20px;line-height:1.5}.relStatus{border-radius:12px;padding:10px 16px;font-size:19px;font-weight:bold;text-align:center;margin-bottom:14px}.relStatus.ok{background:#e8f5e9;color:var(--ok);border:3px solid var(--ok)}.relStatus.warn{background:#fff8e1;color:#e65100;border:3px solid #ffb300}.supply{background:rgba(255,255,255,.55);border-radius:16px;padding:10px;margin-bottom:4px}.supplyHead{text-align:center;font-size:17px;color:#546e7a;margin-bottom:8px;font-weight:bold}#resultPanel{background:linear-gradient(150deg,#e8f5e9,#c8e6c9);border:3px solid var(--ok);border-radius:18px;padding:18px;text-align:center;margin-top:16px}#resTitle{font-size:clamp(24px,4vw,32px);font-weight:bold;color:var(--ok)}#resStars{font-size:30px;margin:8px 0;min-height:38px}#resEq{font-size:clamp(26px,4.4vw,36px);font-weight:bold;color:#1b5e20;letter-spacing:2px}#resExp{font-size:18px;color:#37474f;margin-top:10px;line-height:1.65}#scrEnd{text-align:center;padding:40px 10px}#scrEnd h1{font-size:clamp(34px,6vw,52px);color:var(--c1)}#endStars{font-size:44px;margin:16px 0}#endInfo{font-size:20px;color:#546e7a;margin-bottom:26px}.modal{position:fixed;inset:0;background:rgba(38,50,56,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}.modalBox{background:#fff;border-radius:20px;max-width:600px;width:100%;max-height:84vh;overflow:auto;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.3)}.modalBox h2{color:var(--c1);font-size:28px;margin-bottom:14px}.modalBox h3{color:var(--c1);font-size:21px;margin:14px 0 6px}.modalBox p,.modalBox li{font-size:18px;line-height:1.7;color:#37474f}.modalBox ol{padding-left:24px}.modalBox .btn{margin-top:18px}.tip{background:#fff8e1;border:2px dashed var(--ac);border-radius:12px;padding:10px 14px;margin-top:14px;font-size:18px;line-height:1.6}.ghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%) scale(1.08);opacity:.9;margin:0}.draggable{touch-action:none}#fx{position:fixed;inset:0;pointer-events:none;z-index:150}@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}.shake{animation:shake .45s}@media(max-width:680px){.lvCards{grid-template-columns:1fr}.brand{font-size:20px}.hud{font-size:14px;gap:8px;padding:4px 10px}.slot{width:120px;min-height:92px}.card{width:112px}.obj{width:44px;height:44px;font-size:26px}}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<!-- ===== 顶栏：标题 + 随机主题色 + 计时器/步数（G7/G8） ===== -->
<header>
  <div><span class="brand">🎬 数量小剧场</span><span id="themeName"></span></div>
  <div class="hud"><span id="hudTimer">⏱ 00:00</span><span id="hudSteps">👣 0 步</span></div>
</header>

<main>
  <!-- ===== 屏幕一：难度选择（G3） ===== -->
  <section id="scrMenu" class="screen">
    <div class="hero">
      <h1>加减法应用大闯关</h1>
      <p class="sub">把故事变成算式：摆一摆、放一放、数一数，玩着玩着就懂啦！</p>
    </div>
    <div class="lvCards">
      <button class="lvCard" data-level="1">
        <div class="ic">🐟</div>
        <h2>初级 · 溪边小剧场</h2>
        <p>连加连减：摆卡片、放小电影，看数量变多还是变少</p>
        <span class="tag">开始闯关</span>
      </button>
      <button class="lvCard" data-level="2">
        <div class="ic">🌷</div>
        <h2>中级 · 花园小剧场</h2>
        <p>加减混合：有来有走、有拿有放，一样难不倒你</p>
        <span class="tag">开始闯关</span>
      </button>
      <button class="lvCard" data-level="3">
        <div class="ic">🍎</div>
        <h2>高级 · 果园比较场</h2>
        <p>比多比少：摆一摆图标，谁多谁少、相差几，一眼看清</p>
        <span class="tag">开始闯关</span>
      </button>
    </div>
    <div class="controls"><button id="btnRules0" class="btn big">📖 规则说明</button></div>
  </section>

  <!-- ===== 屏幕二：游戏主界面 ===== -->
  <section id="scrGame" class="screen hidden">
    <div class="topbar">
      <button id="btnBack" class="btn">🏠 返回难度选择</button>
      <div class="progress"><span id="qCounter"></span><span id="progress" style="display:flex;gap:8px;"></span></div>
      <button id="btnRules" class="btn">📖 规则说明</button>
    </div>

    <div class="storyCard"><div id="storyText"></div></div>
    <div id="hintBar">欢迎来到小剧场！</div>

    <!-- 剧场模式界面（初级/中级） -->
    <div id="theaterUI" class="hidden">
      <div class="eqStrip"><span id="eqText"></span></div>
      <div class="stageWrap">
        <span id="tapChip" class="hidden"></span>
        <span id="counterChip"></span>
        <div id="stage"></div>
      </div>
      <div id="timeline"></div>
      <div class="hand" id="hand"></div>
    </div>

    <!-- 比较场模式界面（高级） -->
    <div id="compareUI" class="hidden">
      <div class="cmpRowCard ref">
        <div class="rowHead"><span class="rowName" id="refLabel"></span><span class="chip" id="refChip"></span></div>
        <div class="objRow" id="refRow"></div>
        <div class="segLabel" id="refSeg"></div>
      </div>
      <div class="cmpRowCard tgt" id="tgtCard">
        <div class="rowHead"><span class="rowName" id="tgtLabel"></span><span class="chip" id="tgtChip"></span></div>
        <div class="objRow" id="tgtRow"></div>
        <div class="segLabel" id="tgtSeg"></div>
      </div>
      <div class="relStatus warn" id="relStatus"></div>
      <div class="supply">
        <div class="supplyHead" id="supplyName"></div>
        <div class="objRow" id="supplyRow"></div>
      </div>
    </div>

    <!-- 操作按钮（G4：揭示答案 / 重新开始 / 返回难度选择） -->
    <div class="controls">
      <button id="btnPlay" class="btn primary big">▶ 开始放映</button>
      <button id="btnConfirm" class="btn primary big">✅ 确认数量</button>
      <button id="btnReveal" class="btn">💡 揭示答案</button>
      <button id="btnRestart" class="btn">🔄 重新开始</button>
    </div>

    <!-- 结果面板 -->
    <div id="resultPanel" class="hidden">
      <div id="resTitle"></div>
      <div id="resStars"></div>
      <div id="resEq"></div>
      <div id="resExp"></div>
      <div class="controls"><button id="btnNext" class="btn primary big">下一题 →</button></div>
    </div>
  </section>

  <!-- ===== 屏幕三：结算（G5 庆祝） ===== -->
  <section id="scrEnd" class="screen hidden">
    <h1>🎉 通关啦，你真棒！</h1>
    <div id="endStars"></div>
    <div id="endInfo"></div>
    <div class="controls">
      <button id="btnAgain" class="btn primary big">🔁 再玩一次</button>
      <button id="btnEndHome" class="btn big">🏠 返回难度选择</button>
    </div>
  </section>
</main>

<!-- ===== 规则说明弹窗（G6：进入时弹出，可随时再看） ===== -->
<div id="modal" class="modal hidden">
  <div class="modalBox">
    <h2>📖 怎么玩</h2>
    <div id="rulesBody"></div>
    <button id="btnCloseModal" class="btn primary big">我知道啦，开始玩！</button>
  </div>
</div>
