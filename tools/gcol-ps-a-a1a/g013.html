<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>左右脑奇趣工坊 · 第7讲 左右脑开发(1)</title>
<style>
/* ============ 全局样式：变量由 JS 随机色板注入 ============ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
  background:var(--bgsoft,#eef4fb);
  color:#20304a;
  font-size:18px;
  line-height:1.55;
}
#app{max-width:980px;margin:0 auto;padding:10px 12px 40px;}

/* ---------- 顶栏 ---------- */
#topbar{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
  background:var(--main,#f97316);color:#fff;border-radius:16px;
  padding:10px 16px;box-shadow:0 4px 14px rgba(30,40,70,.18);position:sticky;top:6px;z-index:50;
}
#topbar .title{font-size:22px;font-weight:800;letter-spacing:1px;}
#topbar .subtitle{font-size:15px;font-weight:600;opacity:.92;display:block;margin-top:2px;}
.hud{
  background:rgba(255,255,255,.22);border-radius:12px;padding:6px 14px;
  font-size:18px;font-weight:800;white-space:nowrap;
}
.topbtns{display:flex;gap:8px;flex-wrap:wrap;}

/* ---------- 通用按钮 ---------- */
.btn{
  font-family:inherit;font-size:18px;font-weight:800;color:#fff;
  background:var(--main,#f97316);border:3px solid #ffffff;
  border-radius:14px;padding:10px 22px;cursor:pointer;
  box-shadow:0 3px 0 rgba(0,0,0,.18);transition:transform .08s;
}
.btn:active{transform:translateY(2px);box-shadow:none;}
.btn.big{font-size:22px;padding:14px 34px;border-radius:18px;}
.btn.ghost{background:#ffffff;color:var(--mainD,#c2410c);border-color:var(--mainD,#c2410c);}
.btn.warn{background:#7c3aed;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* ---------- 难度菜单 ---------- */
.menu-title{text-align:center;font-size:30px;font-weight:900;margin:26px 0 6px;color:var(--mainD,#c2410c);}
.menu-sub{text-align:center;font-size:17px;color:#54627e;margin-bottom:22px;}
.diff-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
.diff-card{
  width:250px;background:#fff;border:4px solid var(--main,#f97316);border-radius:20px;
  padding:20px 14px;text-align:center;cursor:pointer;transition:transform .12s;
  box-shadow:0 6px 16px rgba(30,40,70,.12);
}
.diff-card:hover{transform:translateY(-5px);}
.diff-card .ic{font-size:46px;}
.diff-card h3{font-size:24px;color:var(--mainD,#c2410c);margin:6px 0 4px;}
.diff-card p{font-size:16px;color:#54627e;}
.menu-foot{text-align:center;margin-top:24px;}

/* ---------- 站点介绍页 ---------- */
.intro-card{
  background:#fff;border:4px dashed var(--main,#f97316);border-radius:24px;
  max-width:560px;margin:40px auto;padding:34px 26px;text-align:center;
  animation:zoomIn .3s ease;
}
.intro-card .ic{font-size:64px;}
.intro-card h2{font-size:28px;color:var(--mainD,#c2410c);margin:8px 0 8px;}
.intro-card p{font-size:18px;color:#42506c;margin-bottom:18px;}

/* ---------- 关卡界面 ---------- */
.round-head{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
  margin:14px 0 8px;font-weight:800;font-size:18px;color:#42506c;
}
.prog-dots{display:flex;gap:6px;flex-wrap:wrap;}
.prog-dots i{width:14px;height:14px;border-radius:50%;background:#cdd6e6;display:block;}
.prog-dots i.done{background:var(--main,#f97316);}
.prog-dots i.cur{background:var(--accent,#7c3aed);transform:scale(1.25);}
.qcard{
  background:#fff;border-left:10px solid var(--main,#f97316);border-radius:14px;
  padding:14px 18px;font-size:19px;box-shadow:0 3px 10px rgba(30,40,70,.1);margin-bottom:10px;
}
.qcard .src{display:inline-block;background:var(--bgsoft,#eef4fb);color:#54627e;font-size:16px;
  border-radius:8px;padding:1px 10px;margin-bottom:6px;font-weight:700;}
.goal-chip{
  display:inline-block;background:var(--accent,#7c3aed);color:#fff;font-size:19px;font-weight:800;
  border-radius:12px;padding:6px 16px;margin:4px 0 10px;box-shadow:0 3px 0 rgba(0,0,0,.15);
}
.game-area{
  background:#fff;border-radius:18px;padding:14px;box-shadow:0 4px 14px rgba(30,40,70,.1);
  margin-bottom:12px;overflow:hidden;
}
.ctrl-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0 4px;}
.status-line{
  text-align:center;font-size:19px;font-weight:800;color:var(--mainD,#c2410c);
  min-height:30px;margin-top:8px;
}
.hint-line{text-align:center;font-size:16px;color:#7b88a0;margin-top:4px;}

/* ---------- 剪纸坊画布 ---------- */
canvas.cutcv{width:100%;display:block;border-radius:12px;background:var(--bgsoft,#eef4fb);touch-action:none;}

/* ---------- 书页镇 ---------- */
.book-wrap{position:relative;padding-top:74px;}
.book-title{font-size:18px;font-weight:800;color:#42506c;margin-bottom:8px;}
.pages-grid{
  display:grid;grid-template-columns:repeat(10,1fr);gap:8px 6px;
}
.chip{
  aspect-ratio:1/1.02;background:#fff;border:3px solid #b9c5da;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:900;color:#42506c;position:relative;
}
.chip.read{background:#e7ebf2;color:#9aa6ba;border-color:#c4cddc;}
.chip.read::after{content:"✓";position:absolute;top:0px;right:4px;font-size:16px;color:#9aa6ba;}
.chip.lit{background:var(--mainL,#fed7aa);border-color:var(--main,#f97316);color:var(--mainD,#c2410c);}
.chip.hover{outline:4px solid var(--accent,#7c3aed);outline-offset:1px;}
.chip.cele{animation:popd .4s;}
.ribbon{
  position:absolute;width:36px;height:64px;z-index:20;cursor:grab;touch-action:none;
  display:flex;flex-direction:column;align-items:center;border-radius:8px 8px 0 0;
  font-size:16px;font-weight:900;color:#fff;padding-top:5px;user-select:none;
  clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);
}
.ribbon.start{background:#16a34a;}
.ribbon.end{background:#ea580c;}
.ribbon.locked{cursor:not-allowed;filter:saturate(.8);}
.ribbon.dragging{cursor:grabbing;z-index:40;transform:scale(1.12);box-shadow:0 8px 18px rgba(0,0,0,.25);}
.tray{
  margin-top:16px;min-height:90px;border:3px dashed #b9c5da;border-radius:14px;
  display:flex;align-items:center;gap:18px;padding:10px 16px;background:#f7fafd;
}
.tray .ribbon{position:static;}
.tray-label{font-size:16px;color:#7b88a0;font-weight:700;}
.count-bubble{
  margin-left:auto;background:#fff;border:3px solid var(--main,#f97316);color:var(--mainD,#c2410c);
  border-radius:12px;font-size:19px;font-weight:900;padding:6px 16px;white-space:nowrap;
}

/* ---------- 派对小屋 ---------- */
.scene{
  position:relative;border-radius:16px;background:var(--bgsoft,#eef4fb);
  padding:14px;display:flex;gap:12px;flex-wrap:wrap;
}
.room{
  flex:1 1 380px;min-height:250px;border:4px dashed var(--main,#f97316);border-radius:16px;
  background:#fff;padding:14px;position:relative;
}
.room-label{position:absolute;top:-16px;left:14px;background:var(--main,#f97316);color:#fff;
  font-size:16px;font-weight:900;border-radius:8px;padding:2px 12px;}
.room-flex{display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start;justify-content:center;padding-top:10px;position:relative;}
.doorcol{
  width:130px;display:flex;flex-direction:column;align-items:center;gap:8px;
  border-radius:16px;background:#fff;padding:10px 6px;
}
.doorcol .door{font-size:38px;}
.doll{display:flex;flex-direction:column;align-items:center;width:64px;user-select:none;touch-action:none;position:relative;}
.doll .head{
  width:46px;height:46px;border-radius:50%;background:#ffe0c2;border:3px solid #8a5a30;
  display:flex;align-items:center;justify-content:center;font-size:26px;
}
.doll .body{width:38px;height:36px;border-radius:10px 10px 16px 16px;background:var(--dc,#7c3aed);border:2px solid rgba(0,0,0,.12);}
.doll .nm{font-size:16px;font-weight:900;color:#42506c;margin-top:2px;}
.doll.mini{width:44px;}
.doll.mini .head{width:36px;height:36px;font-size:20px;border-width:2px;}
.doll.mini .body{width:26px;height:18px;border-radius:6px 6px 10px 10px;}
.doll.mini .nm{display:none;}
.doll.hero .head{box-shadow:0 0 0 5px var(--accent,#7c3aed) inset;animation:floaty 1.6s ease-in-out infinite;}
.doll.dragging{z-index:80;transform:scale(1.15);filter:drop-shadow(0 8px 10px rgba(0,0,0,.25));cursor:grabbing;}
.doll.pop{animation:popd .4s;}
.doll .cnt{
  position:absolute;top:-12px;left:50%;transform:translateX(-50%);
  background:#16a34a;color:#fff;font-size:16px;font-weight:900;border-radius:50%;
  width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;z-index:5;
}
.doll .holds{font-size:24px;margin-top:-2px;}
.cnt-chip{
  display:inline-block;background:#fff;border:3px solid var(--main,#f97316);color:var(--mainD,#c2410c);
  border-radius:12px;font-size:17px;font-weight:900;padding:4px 12px;
}
.drag-hint{font-size:16px;font-weight:800;color:var(--accent,#7c3aed);animation:floaty 1.4s ease-in-out infinite;text-align:center;}
.queue{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px;}
.burst{position:absolute;font-size:32px;pointer-events:none;animation:riseFade 1s ease forwards;z-index:70;}

/* ---------- 门票 / 小兔子 ---------- */
.gate-row{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px;}
.gate-arch{
  font-size:20px;font-weight:900;color:#fff;background:var(--main,#f97316);
  border-radius:16px 16px 0 0;padding:8px 26px;text-align:center;
}
.ticket{
  width:78px;height:58px;border-radius:10px;background:#fff;border:3px dashed var(--mainD,#c2410c);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:26px;cursor:grab;touch-action:none;user-select:none;box-shadow:0 2px 6px rgba(0,0,0,.12);
}
.ticket span{font-size:16px;font-weight:900;color:var(--mainD,#c2410c);}
.ticket.dragging{transform:scale(1.12);box-shadow:0 8px 16px rgba(0,0,0,.25);cursor:grabbing;}

/* ---------- 时间轴 ---------- */
.performers{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-bottom:12px;}
.perf{width:96px;text-align:center;}
.perf .who{display:flex;justify-content:center;}
.perf .nm{font-size:16px;font-weight:900;margin-top:2px;}
.perf .barwrap{height:16px;background:#e2e8f2;border-radius:8px;overflow:hidden;margin-top:4px;border:2px solid #c3cddd;}
.perf .bar{height:100%;width:0%;background:var(--main,#f97316);transition:width 1.3s linear;border-radius:6px;}
.track-wrap{position:relative;padding:44px 10px 40px;}
.track{
  position:relative;height:14px;background:linear-gradient(#c3cddd,#a9b7cc);
  border-radius:8px;cursor:ew-resize;
}
.tick{position:absolute;top:-9px;width:3px;height:32px;background:#8a94a8;}
.tick.major{height:40px;top:-13px;background:#54627e;}
.tick-label{position:absolute;top:24px;transform:translateX(-50%);font-size:16px;font-weight:900;color:#42506c;}
.flag{
  position:absolute;top:-74px;width:46px;height:80px;cursor:grab;touch-action:none;z-index:20;
  transform:translateX(-50%);text-align:center;
}
.flag .pole{width:5px;height:66px;background:#54627e;margin:6px auto 0;border-radius:3px;}
.flag .cloth{font-size:30px;line-height:1;}
.flag .bubble{
  position:absolute;top:-24px;left:50%;transform:translateX(-50%);
  background:var(--accent,#7c3aed);color:#fff;font-size:16px;font-weight:900;
  border-radius:10px;padding:2px 10px;white-space:nowrap;
}
.flag.dragging{cursor:grabbing;}
.age-stage{display:flex;gap:40px;justify-content:center;align-items:flex-end;height:210px;margin:10px 0 4px;}
.age-col{text-align:center;width:110px;}
.age-col .nm{font-size:18px;font-weight:900;}
.age-bar{width:64px;margin:0 auto;background:var(--main,#f97316);border:3px solid #334155;border-radius:8px 8px 0 0;transition:height .15s;}
.slider-wrap{margin:14px 10px 4px;}
.slider-title{font-size:17px;font-weight:900;color:#42506c;margin-bottom:6px;}
.slider-track{position:relative;height:18px;background:linear-gradient(#c3cddd,#a9b7cc);border-radius:10px;touch-action:none;}
.knob{
  position:absolute;top:-16px;width:38px;height:48px;border-radius:10px;background:var(--accent,#7c3aed);
  border:3px solid #fff;transform:translateX(-50%);cursor:grab;touch-action:none;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:900;
}
.knob.dragging{cursor:grabbing;}

/* ---------- 弹窗 ---------- */
.modal{
  position:fixed;inset:0;background:rgba(20,28,48,.55);display:none;
  align-items:center;justify-content:center;z-index:100;padding:16px;
}
.modal.show{display:flex;}
.modal-card{
  background:#fff;border-radius:20px;max-width:620px;width:100%;max-height:84vh;overflow:auto;
  padding:26px 24px;animation:zoomIn .25s ease;box-shadow:0 10px 40px rgba(0,0,0,.3);
}
.modal-card h2{color:var(--mainD,#c2410c);font-size:26px;margin-bottom:12px;}
.modal-card .ans-block{
  background:var(--mainL,#fed7aa);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:18px;
}
.modal-card .exp-block{background:var(--bgsoft,#eef4fb);border-radius:12px;padding:12px 14px;font-size:18px;}
.modal-card .btn-row{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;}
.rule-sec{margin-bottom:12px;}
.rule-sec h3{font-size:20px;color:var(--mainD,#c2410c);}
.rule-sec p{font-size:17px;color:#42506c;}

/* ---------- 庆功 ---------- */
.cele-card{
  background:#fff;border:5px solid var(--main,#f97316);border-radius:26px;text-align:center;
  padding:38px 22px;margin:36px auto;max-width:600px;animation:zoomIn .4s ease;
}
.cele-card .big{font-size:34px;font-weight:900;color:var(--mainD,#c2410c);margin-bottom:8px;}
.cele-card .stats{font-size:20px;font-weight:800;color:#42506c;margin-bottom:20px;line-height:1.9;}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:200;}

/* ---------- 动画 ---------- */
@keyframes zoomIn{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}
@keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
@keyframes popd{0%{transform:scale(1);}45%{transform:scale(1.28);}100%{transform:scale(1);}}
@keyframes riseFade{0%{opacity:1;transform:translateY(0) scale(1);}100%{opacity:0;transform:translateY(-56px) scale(1.4);}}
@keyframes wig{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
.wig{animation:wig .35s 2;}

/* ---------- 响应式 ---------- */
@media (max-width:640px){
  #topbar .title{font-size:18px;}
  .pages-grid{grid-template-columns:repeat(5,1fr);}
  .qcard{font-size:17px;}
  .doll{width:54px;}
  .doorcol{width:100%;flex-direction:row;justify-content:center;flex-wrap:wrap;}
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="title">✂️ 左右脑奇趣工坊<span class="subtitle">第7讲 左右脑开发(1)（上）· 思维培养</span></div>
    <div class="hud">⏱ <span id="timer">00:00</span> ｜ 🖐 <span id="steps">0</span> 次 ｜ ⭐ <span id="stars">0</span></div>
    <div class="topbtns">
      <button class="btn ghost" id="btnRules">玩法说明</button>
      <button class="btn ghost" id="btnBackMenu">返回难度选择</button>
    </div>
  </header>
  <main id="stage"></main>
</div>

<!-- 通用弹窗 -->
<div class="modal" id="modal"><div class="modal-card" id="modalCard"></div></div>
<!-- 庆祝彩纸画布 -->
<canvas id="confetti"></canvas>

<script>
'use strict';
/* ================================================================
   左右脑奇趣工坊 —— 互动教学游戏（单文件，零外部依赖）
   内容来源：《第7讲 左右脑开发(1)（上）》
   三大站点（对应本讲正文的三大好方法）：
   ✂️ 剪纸坊 —— 拖剪点剪纸 / 画直线剪纸（例2、练习4、练习6）
   📖 书页镇 —— 拖书签点亮页码区间，末页-首页+1（例3、练习7~9）
   🎉 派对小屋 —— 脑筋急转弯：同时进行时间相同、数人别忘自己、
      祖孙三代身份重复（例1、练习1~5）
   ================================================================ */

/* ---------------- 工具函数 ---------------- */
function $(s){return document.querySelector(s);}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}
function sample(arr,n){return shuffle(arr).slice(0,n);}
function choice(arr){return arr[Math.floor(Math.random()*arr.length)];}
function fmt2(n){return (n<10?'0':'')+n;}
function el(tag,cls,html){
  const d=document.createElement(tag);
  if(cls)d.className=cls;
  if(html!=null)d.innerHTML=html;
  return d;
}

/* ---------------- 随机色板（每局随机主色，常玩不腻） ---------------- */
const PALETTES=[
  {name:'活力橙',main:'#f97316',mainD:'#c2410c',mainL:'#ffedd5',accent:'#7c3aed',bgsoft:'#fff7ed'},
  {name:'天空蓝',main:'#0284c7',mainD:'#075985',mainL:'#e0f2fe',accent:'#f97316',bgsoft:'#f0f9ff'},
  {name:'草地绿',main:'#16a34a',mainD:'#166534',mainL:'#dcfce7',accent:'#e11d48',bgsoft:'#f0fdf4'},
  {name:'葡萄紫',main:'#9333ea',mainD:'#6b21a8',mainL:'#f3e8ff',accent:'#0d9488',bgsoft:'#faf5ff'},
  {name:'蜜桃粉',main:'#db2777',mainD:'#9d174d',mainL:'#fce7f3',accent:'#0284c7',bgsoft:'#fdf2f8'},
  {name:'柠檬黄',main:'#ca8a04',mainD:'#854d0e',mainL:'#fef9c3',accent:'#16a34a',bgsoft:'#fefce8'}
];
let PAL=choice(PALETTES);
function applyPalette(){
  const r=document.documentElement.style;
  r.setProperty('--main',PAL.main);
  r.setProperty('--mainD',PAL.mainD);
  r.setProperty('--mainL',PAL.mainL);
  r.setProperty('--accent',PAL.accent);
  r.setProperty('--bgsoft',PAL.bgsoft);
}
applyPalette();

/* ---------------- 全局状态与 HUD（计时器 + 步数统计） ---------------- */
const G={
  screen:'menu', difficulty:null, session:[], cur:0,
  stars:0, steps:0, sec:0, timerInt:null,
  curGame:null, curDef:null, revealed:false, totalRounds:0
};
function addStep(){G.steps++;$('#steps').textContent=G.steps;}
function addStar(){G.stars++;$('#stars').textContent=G.stars;}
function startTimer(){
  stopTimer();
  G.timerInt=setInterval(()=>{
    G.sec++;
    $('#timer').textContent=fmt2(Math.floor(G.sec/60))+':'+fmt2(G.sec%60);
  },1000);
}
function stopTimer(){if(G.timerInt){clearInterval(G.timerInt);G.timerInt=null;}}

/* ---------------- 彩纸庆祝 ---------------- */
const Confetti=(function(){
  const cv=$('#confetti');const ctx=cv.getContext('2d');
  let parts=[];let running=false;
  function fit(){cv.width=innerWidth;cv.height=innerHeight;}
  window.addEventListener('resize',fit);fit();
  const COLORS=['#f97316','#7c3aed','#16a34a','#0284c7','#db2777','#ca8a04'];
  function spawn(x,y,vx,vy){
    parts.push({x,y,vx,vy,w:6+Math.random()*8,h:8+Math.random()*10,
      c:choice(COLORS),rot:Math.random()*6.28,vr:(Math.random()-.5)*.3,life:1});
  }
  function burst(n){       /* 从天而降的彩纸雨 */
    for(let i=0;i<n;i++){
      spawn(Math.random()*cv.width,-20-Math.random()*120,(Math.random()-.5)*2.4,1.5+Math.random()*2.5);
    }
    loop();
  }
  function pop(x,y,n){     /* 指定位置炸开一小簇 */
    for(let i=0;i<n;i++){
      const a=Math.random()*6.28,s=2+Math.random()*4;
      spawn(x,y,Math.cos(a)*s,Math.sin(a)*s-2);
    }
    loop();
  }
  function loop(){
    if(running)return;running=true;
    (function frame(){
      ctx.clearRect(0,0,cv.width,cv.height);
      parts=parts.filter(p=>p.life>0&&p.y<cv.height+30);
      for(const p of parts){
        p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.rot+=p.vr;p.life-=.004;
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
        ctx.globalAlpha=Math.max(0,Math.min(1,p.life));
        ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
      }
      if(parts.length){requestAnimationFrame(frame);}
      else{running=false;ctx.clearRect(0,0,cv.width,cv.height);}
    })();
  }
  return {burst,pop};
})();

let timelineAnim=null;   /* 时间轴进度条动画句柄（供“开始”按钮调用） */

const WORLDS={
  cut:{name:'剪纸坊',icon:'✂️',cls:CutGame,intro:'拖动剪刀剪点，把纸剪成两块，看看角变多了还是变少了！'},
  book:{name:'书页镇',icon:'📖',cls:BookGame,intro:'拖动两枚书签点亮页码，记住：两头的页都要算！'},
  party:{name:'派对小屋',icon:'🎉',cls:PartyGame,intro:'拖人、发门票、拖时间旗帜——生活中的趣味问题都在这里！'}
};
function poolOf(world,diff){
  if(world==='cut')return CUT_POOLS[diff];
  if(world==='book')return BOOK_POOLS[diff];
  return PARTY_POOLS[diff];
}
function buildSession(diff){
  const counts={easy:2,mid:3,hard:3};
  const order=shuffle(['cut','book','party']);
  const seq=[];
  for(const w of order){
    seq.push({type:'intro',world:w});
    const rs=sample(poolOf(w,diff),counts[diff]);
    rs.forEach(function(def,i){seq.push({type:'round',world:w,def:def,wi:i+1,wt:rs.length});});
  }
  seq.push({type:'end'});
  return seq;
}

  const row=el('div','diff-row');

function startGame(diff){
  PAL=choice(PALETTES);applyPalette();      /* 每局随机换主色 */
  G.difficulty=diff;
  G.session=buildSession(diff);
  G.cur=0;G.stars=0;G.steps=0;G.sec=0;
  $('#steps').textContent='0';$('#stars').textContent='0';$('#timer').textContent='00:00';
  G.totalRounds=G.session.filter(function(s){return s.type==='round';}).length;
  startTimer();
  showModal(rulesHTML());                   /* 进入时弹出玩法说明 */
  next();
}

function next(){
  if(G.cur>=G.session.length)return;
  const st=G.session[G.cur];
  if(st.type==='intro'){renderIntro(st);}
  else if(st.type==='round'){renderRound(st);}
  else{renderEnd();}
}

function renderIntro(st){
  G.screen='intro';
  const w=WORLDS[st.world];
  const card=el('div','intro-card',
    '<div class="ic">'+w.icon+'</div><h2>'+w.name+'</h2><p>'+w.intro+'</p>');
  const b=el('button','btn big','出发！');
  b.addEventListener('click',function(){G.cur++;next();});
  card.appendChild(b);
  $('#stage').innerHTML='';
  $('#stage').append(card);
}

function renderRound(st){
  G.screen='round';G.curDef=st.def;G.revealed=false;
  $('#stage').innerHTML='';
  const w=WORLDS[st.world];
  /* 关卡头 + 进度点 */
  const doneCount=G.session.slice(0,G.cur).filter(function(x){return x.type==='round';}).length;
  const head=el('div','round-head');
  const dots=el('div','prog-dots');
  let seen=0;
  G.session.forEach(function(s){
    if(s.type!=='round')return;
    seen++;
    const i=el('i');
    if(seen<=doneCount)i.className='done';
    else if(seen===doneCount+1)i.className='cur';
    dots.appendChild(i);
  });
  head.append(el('span','',w.icon+' <b>'+w.name+'</b> · 第 '+st.wi+' / '+st.wt+' 关'),dots);
  /* 题目卡 */
  const q=el('div','qcard','<span class="src">本题来自：'+st.def.src+'</span><br>'+st.def.q);
  /* 游戏区 */
  const area=el('div','game-area');
  /* 控制行：揭示答案 / 重新开始（本关） */
  const ctrl=el('div','ctrl-row');
  const bReveal=el('button','btn warn','💡 揭示答案');
  bReveal.addEventListener('click',revealAnswer);
  const bReset=el('button','btn ghost','🔄 重新开始');
  bReset.addEventListener('click',function(){renderRound(st);});
  ctrl.append(bReveal,bReset);
  $('#stage').append(head,q,area,ctrl);
  /* 挂载对应小游戏 */
  new w.cls(area,st.def,finishRound);
}

/* ================================================================
   小游戏一：✂️ 剪纸坊（Canvas 真拖拽剪纸）
   ================================================================ */
function CutGame(box,rd,onDone){
  /* ---------- 画布初始化（响应式 + 高清屏适配） ---------- */
  const LW=760,LH=480;                    /* 逻辑坐标系 */
  const cv=el('canvas','cutcv');
  const status=el('div','status-line');
  const hint=el('div','hint-line');
  box.append(cv,status,hint);
  const ctx=cv.getContext('2d');
  let scale=1,dpr=1;
  function resize(){
    const w=cv.clientWidth||(box.clientWidth-28);
    if(w<=0)return;
    dpr=window.devicePixelRatio||1;
    scale=w/LW;
    cv.width=Math.round(w*dpr);
    cv.height=Math.round(w*LH/LW*dpr);
    cv.style.height=(w*LH/LW)+'px';
  }
  window.addEventListener('resize',resize);

  /* ---------- 图形定义 ---------- */
  const SHAPES={
    triangle:{pts:[{x:380,y:70},{x:640,y:400},{x:120,y:400}]},
    square:{pts:[{x:235,y:85},{x:560,y:85},{x:560,y:400},{x:235,y:400}]},
    pentagon:(function(){
      const c={x:395,y:250},R=182,pts=[];
      for(let k=0;k<5;k++){
        const a=(-90+72*k)*Math.PI/180;
        pts.push({x:c.x+R*Math.cos(a),y:c.y+R*Math.sin(a)});
      }
      return {pts:pts};
    })()
  };

  if(rd.kind==='cutLines'){buildCutLines();}
  else{buildCutPoints();}

  /* ================= 模式一：拖剪点，剪一刀 ================= */
  function buildCutPoints(){
    const pts=SHAPES[rd.shape].pts;
    /* ★ 贴纸：随机贴在某个角附近（向内缩 22%，保证落在纸内） */
    const starCorner=Math.floor(Math.random()*pts.length);
    const c0=centroid(pts);
    const star={x:pts[starCorner].x+(c0.x-pts[starCorner].x)*0.22,
                y:pts[starCorner].y+(c0.y-pts[starCorner].y)*0.22};
    /* 两把剪刀（未放上纸之前停在画布下方） */
    const mkA={x:200,y:446,on:false,info:null};
    const mkB={x:560,y:446,on:false,info:null};
    let drag=null;          /* 当前拖动的剪点 */
    let pieces=null;        /* 剪开后的两块纸 */
    let cutMid=null,animStart=0,lockTS=0;
    let done=false;

    const goal=el('div','goal-chip','🎯 目标：带★的那块纸 = '+rd.target+' 个角');
    box.insertBefore(goal,cv);

    function centroid(poly){
      let x=0,y=0;
      for(const p of poly){x+=p.x;y+=p.y;}
      return {x:x/poly.length,y:y/poly.length};
    }
    /* 求指针在纸边界上的最近点（角点附近自动吸附到角） */
    function nearestOnBoundary(p){
      let best=null,bs=Infinity;
      const n=pts.length;
      for(let i=0;i<n;i++){
        const a=pts[i],b=pts[(i+1)%n];
        const dx=b.x-a.x,dy=b.y-a.y,L2=dx*dx+dy*dy||1;
        let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/L2;
        t=Math.max(0,Math.min(1,t));
        const x=a.x+dx*t,y=a.y+dy*t,d=Math.hypot(p.x-x,p.y-y);
        if(d<bs){bs=d;best={x:x,y:y,ei:i,t:t,atV:false};}
      }
      for(let i=0;i<n;i++){
        const d=Math.hypot(p.x-pts[i].x,p.y-pts[i].y);
        if(d<34&&d*0.45<bs){bs=d*0.45;best={x:pts[i].x,y:pts[i].y,ei:i,t:0,atV:true};}
      }
      return best;
    }
    /* 沿纸的边界，用弦 A-B 把纸剪成两块（返回两个多边形） */
    function splitByChord(A,B){
      const n=pts.length;
      let a=A,b=B;
      const ka=A.ei*1000+(A.atV?0:A.t*999);
      const kb=B.ei*1000+(B.atV?0:B.t*999);
      let lo=ka,hi=kb;
      if(ka>kb){a=B;b=A;lo=kb;hi=ka;}
      const p1=[{x:a.x,y:a.y}],p2=[{x:b.x,y:b.y}];
      const after=[],before=[];
      for(let j=0;j<n;j++){
        const kj=j*1000;
        if(kj>lo+0.5&&kj<hi-0.5){p1.push({x:pts[j].x,y:pts[j].y});}
        else if(kj>hi+0.5){after.push({x:pts[j].x,y:pts[j].y});}
        else if(kj<lo-0.5){before.push({x:pts[j].x,y:pts[j].y});}
      }
      p1.push({x:b.x,y:b.y});
      for(const v of after)p2.push(v);
      for(const v of before)p2.push(v);
      p2.push({x:a.x,y:a.y});
      return [p1,p2];
    }
    function pointInPoly(pt,poly){
      let ins=false;
      for(let i=0,j=poly.length-1;i<poly.length;j=i++){
        const a=poly[i],b=poly[j];
        if((a.y>pt.y)!==(b.y>pt.y)&&pt.x<(b.x-a.x)*(pt.y-a.y)/(b.y-a.y)+a.x)ins=!ins;
      }
      return ins;
    }
    /* 剪刀按钮 */
    const ctrl=el('div','ctrl-row');
    const bCut=el('button','btn big','✂️ 咔嚓剪开！');
    bCut.disabled=true;
    bCut.addEventListener('click',doCut);
    ctrl.appendChild(bCut);
    box.insertBefore(ctrl,status);
    hint.textContent='把 ✂A、✂B 拖到纸的边上（想剪在角上就靠近角放手），虚线画好就能剪。';

    function doCut(){
      if(done||pieces)return;
      if(!mkA.on||!mkB.on)return;
      const res=splitByChord(mkA.info,mkB.info);
      if(res[0].length<3||res[1].length<3){
        status.textContent='这样剪不开哦：两个剪点要放在不同的边上！';
        status.style.color='#dc2626';
        return;
      }
      addStep();
      pieces=res;
      cutMid={x:(mkA.info.x+mkB.info.x)/2,y:(mkA.info.y+mkB.info.y)/2};
      animStart=performance.now();
      /* 判断★在哪一块并数角 */
      const starIdx=pointInPoly(star,pieces[0])?0:1;
      const nStar=pieces[starIdx].length;
      const typeTxt=(mkA.info.atV&&mkB.info.atV)?'从角到角':((mkA.info.atV||mkB.info.atV)?'从角到边':'从边到边');
      pieces.starIdx=starIdx;pieces.nStar=nStar;pieces.type=typeTxt;
      bCut.disabled=true;
      if(nStar===rd.target){
        done=true;
        setTimeout(function(){
          status.textContent='成功！你的剪法【'+typeTxt+'】，带★的纸有 '+nStar+' 个角！';
          status.style.color='#16a34a';
          const r=cv.getBoundingClientRect();
          Confetti.pop(r.left+star.x*scale,r.top+star.y*scale,60);
          setTimeout(onDone,700);
        },420);
      }else{
        lockTS=performance.now()+1300;
        status.textContent='带★的纸现在有 '+nStar+' 个角（目标是 '+rd.target+' 个），纸又长回来啦，换个剪法试试！';
        status.style.color='#dc2626';
      }
    }
    /* 指针事件（鼠标 + 触摸通用） */
    function toLogic(e){
      const r=cv.getBoundingClientRect();
      return {x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale};
    }
    cv.addEventListener('pointerdown',function(e){
      if(done||pieces)return;
      const p=toLogic(e);
      const dA=Math.hypot(p.x-mkA.x,p.y-mkA.y),dB=Math.hypot(p.x-mkB.x,p.y-mkB.y);
      if(dA<40||dB<40){
        drag=(dA<=dB)?'A':'B';
        cv.setPointerCapture(e.pointerId);
        e.preventDefault();
      }
    });
    cv.addEventListener('pointermove',function(e){
      if(!drag||done||pieces)return;
      const m=(drag==='A')?mkA:mkB;
      const info=nearestOnBoundary(toLogic(e));
      m.info=info;m.x=info.x;m.y=info.y;m.on=true;
    });
    cv.addEventListener('pointerup',function(){
      drag=null;
      if(!pieces&&!done)bCut.disabled=!(mkA.on&&mkB.on);
    });
    cv.addEventListener('pointercancel',function(){drag=null;});

    /* ---------- 绘制 ---------- */
    function drawPoly(poly,fill,stroke,off){
      ctx.beginPath();
      ctx.moveTo(poly[0].x+off.x,poly[0].y+off.y);
      for(let i=1;i<poly.length;i++)ctx.lineTo(poly[i].x+off.x,poly[i].y+off.y);
      ctx.closePath();
      ctx.fillStyle=fill;ctx.fill();
      ctx.lineWidth=5;ctx.strokeStyle=stroke;ctx.stroke();
    }
    function drawMarker(m,color,name){
      ctx.beginPath();ctx.arc(m.x,m.y,20,0,6.29);
      ctx.fillStyle=color;ctx.fill();
      ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.stroke();
      ctx.font='bold 17px sans-serif';ctx.fillStyle='#fff';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('✂'+name,m.x,m.y+1);
    }
    function frame(){
      requestAnimationFrame(frame);
      ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);
      ctx.clearRect(0,0,LW,LH);
      if(!pieces){
        /* 整张纸 */
        drawPoly(pts,PAL.mainL,PAL.mainD,{x:0,y:0});
        ctx.font='34px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('★',star.x,star.y);
        /* 剪线预览 */
        if(mkA.on&&mkB.on){
          ctx.setLineDash([12,10]);ctx.lineWidth=4;ctx.strokeStyle='#54627e';
          ctx.beginPath();ctx.moveTo(mkA.x,mkA.y);ctx.lineTo(mkB.x,mkB.y);ctx.stroke();
          ctx.setLineDash([]);
        }
        drawMarker(mkA,'#dc2626','A');
        drawMarker(mkB,'#2563eb','B');
      }else{
        /* 两块纸分开的动画 */
        const t=Math.min(1,(performance.now()-animStart)/380);
        const k=(1-Math.pow(1-t,3))*26;
        const offs=pieces.map(function(p){
          const c=centroid(p);
          const dx=c.x-cutMid.x,dy=c.y-cutMid.y,L=Math.hypot(dx,dy)||1;
          return {x:dx/L*k,y:dy/L*k};
        });
        pieces.forEach(function(p,i){
          const starSide=(i===pieces.starIdx);
          drawPoly(p,starSide?PAL.mainL:'#f1f4f9',starSide?PAL.mainD:'#9aa6ba',offs[i]);
        });
        const so=offs[pieces.starIdx];
        ctx.font='36px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('★',star.x+so.x,star.y+so.y);
        /* 带星块的角逐个编号 */
        const sp=pieces[pieces.starIdx];
        const c=centroid(sp);
        ctx.font='bold 17px sans-serif';
        sp.forEach(function(v,i){
          const vx=v.x+so.x,vy=v.y+so.y;
          const nx=vx+(vx-c.x-so.x)*0.22,ny=vy+(vy-c.y-so.y)*0.22;
          ctx.beginPath();ctx.arc(nx,ny,14,0,6.29);
          ctx.fillStyle='#16a34a';ctx.fill();
          ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();
          ctx.fillStyle='#fff';ctx.fillText(String(i+1),nx,ny+1);
        });
        ctx.font='bold 26px sans-serif';
        ctx.fillStyle='#16a34a';
        ctx.fillText('★这块：'+pieces.nStar+' 个角（目标 '+rd.target+'）',LW/2,32);
        /* 失败后纸重新长回来 */
        if(!done&&lockTS&&performance.now()>lockTS){
          pieces=null;lockTS=0;
          bCut.disabled=!(mkA.on&&mkB.on);
          status.textContent='';
        }
      }
    }
    resize();frame();
  }

  /* ================= 模式二：画直线剪纸（最少刀数） ================= */
  function buildCutLines(){
    const sq=SHAPES.square.pts.slice();
    const center=centroidOf(sq);
    let polys=[sq],cuts=0,doneL=false,line=null;

    const goal=el('div','goal-chip','🎯 目标：剪出 4 个小长方形（刀数越少越厉害）');
    box.insertBefore(goal,cv);
    const bResetL=el('button','btn ghost','🔄 纸恢复原样');
    bResetL.addEventListener('click',function(){if(!doneL){polys=[sq];cuts=0;update();}});
    const ctrlL=el('div','ctrl-row');ctrlL.appendChild(bResetL);
    box.insertBefore(ctrlL,status);
    hint.textContent='在纸上按住并拖动画一刀（自动对齐横线或竖线），松手就剪开。';

    function centroidOf(p){let x=0,y=0;for(const q of p){x+=q.x;y+=q.y;}return {x:x/p.length,y:y/p.length};}
    function update(){
      status.textContent='已剪 '+cuts+' 刀 · 现在有 '+polys.length+' 块（目标：4 块长方形）';
      status.style.color='#42506c';
    }
    /* 用水平/垂直直线把凸多边形剪成两块 */
    function splitByLine(poly,axis,c){
      const lo=[],hi=[];
      const n=poly.length;
      for(let i=0;i<n;i++){
        const a=poly[i],b=poly[(i+1)%n];
        const av=(axis==='h')?a.y:a.x,bv=(axis==='h')?b.y:b.x;
        if(av<=c)lo.push(a);else hi.push(a);
        if((av<c-0.4&&bv>c+0.4)||(av>c+0.4&&bv<c-0.4)){
          const t=(c-av)/(bv-av);
          const m={x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t};
          lo.push(m);hi.push(m);
        }
      }
      return [lo,hi];
    }
    function isRect(p){
      if(p.length!==4)return false;
      const xs=[],ys=[];
      p.forEach(function(v){
        const rx=Math.round(v.x),ry=Math.round(v.y);
        if(xs.indexOf(rx)<0)xs.push(rx);
        if(ys.indexOf(ry)<0)ys.push(ry);
      });
      return xs.length===2&&ys.length===2;
    }
    function doCutLine(axis,c){
      if(doneL)return;
      let hit=false;const next=[];
      for(const poly of polys){
        const vs=poly.map(function(p){return (axis==='h')?p.y:p.x;});
        const mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);
        if(c>mn+0.5&&c<mx-0.5){hit=true;const r=splitByLine(poly,axis,c);next.push(r[0],r[1]);}
        else{next.push(poly);}
      }
      if(!hit){
        status.textContent='这一刀没剪到纸上，从纸的中间画过去试试！';
        status.style.color='#dc2626';
        return;
      }
      addStep();
      cuts++;polys=next;
      if(polys.length===4&&polys.every(isRect)){
        doneL=true;
        if(cuts===2){
          status.textContent='完美！只用了 2 刀：横 1 刀 + 竖 1 刀 = 4 个小长方形！';
        }else{
          status.textContent='成功！你用了 '+cuts+' 刀剪出 4 个长方形。其实横 1 刀竖 1 刀只要 2 刀哦！';
        }
        status.style.color='#16a34a';
        setTimeout(function(){Confetti.burst(80);onDone();},800);
      }else if(polys.length>4){
        status.textContent='剪出 '+polys.length+' 块啦，只要 4 块——纸恢复原样，再试试！';
        status.style.color='#dc2626';
        polys=[sq];cuts=0;
        setTimeout(update,900);
      }else{
        update();
      }
    }
    function toLogic(e){
      const r=cv.getBoundingClientRect();
      return {x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale};
    }
    cv.addEventListener('pointerdown',function(e){
      if(doneL)return;
      const p=toLogic(e);
      line={x0:p.x,y0:p.y,x1:p.x,y1:p.y};
      cv.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    cv.addEventListener('pointermove',function(e){
      if(!line)return;
      const p=toLogic(e);line.x1=p.x;line.y1=p.y;
    });
    cv.addEventListener('pointerup',function(){
      if(!line)return;
      const dx=line.x1-line.x0,dy=line.y1-line.y0;
      if(Math.abs(dx)>14||Math.abs(dy)>14){
        const horiz=Math.abs(dx)>=Math.abs(dy);   /* 横向拖动 → 横线剪 */
        if(horiz)doCutLine('h',Math.round(line.y0));
        else doCutLine('v',Math.round(line.x0));
      }
      line=null;
    });
    cv.addEventListener('pointercancel',function(){line=null;});
    /* 绘制循环 */
    (function frameL(){
      requestAnimationFrame(frameL);
      ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);
      ctx.clearRect(0,0,LW,LH);
      polys.forEach(function(p,i){
        const c=centroidOf(p);
        let ox=0,oy=0;
        if(polys.length>1){
          const dx=c.x-center.x,dy=c.y-center.y,L=Math.hypot(dx,dy)||1;
          ox=dx/L*13;oy=dy/L*13;
        }
        ctx.beginPath();
        ctx.moveTo(p[0].x+ox,p[0].y+oy);
        for(let k=1;k<p.length;k++)ctx.lineTo(p[k].x+ox,p[k].y+oy);
        ctx.closePath();
        ctx.fillStyle=(i%2===0)?PAL.mainL:'#fff3df';
        ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=PAL.mainD;ctx.stroke();
        if(polys.length>1&&isRect(p)){
          ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillStyle=PAL.mainD;ctx.fillText('长方形',c.x+ox,c.y+oy);
        }
      });
      if(line){
        const dx=line.x1-line.x0,dy=line.y1-line.y0;
        const horiz=Math.abs(dx)>=Math.abs(dy);
        ctx.setLineDash([12,10]);ctx.lineWidth=4;ctx.strokeStyle='#dc2626';
        ctx.beginPath();
        if(horiz){ctx.moveTo(30,Math.round(line.y0));ctx.lineTo(LW-30,Math.round(line.y0));}
        else{ctx.moveTo(Math.round(line.x0),30);ctx.lineTo(Math.round(line.x0),LH-30);}
        ctx.stroke();ctx.setLineDash([]);
      }
    })();
    resize();update();
  }
}

/* ================================================================
   小游戏二：📖 书页镇（拖书签点亮页码区间，含“还要看”两步题）
   ================================================================ */
function BookGame(box,rd,onDone){
  let finished=false;
  const easy=(G.difficulty==='easy');
  const wrap=el('div','book-wrap');
  const title=el('div','book-title','📖 故事书《思维大冒险》（共 '+rd.pages+' 页）');
  const grid=el('div','pages-grid');
  const chips=[];
  for(let i=1;i<=rd.pages;i++){
    const c=el('div','chip',String(i));
    c.dataset.page=String(i);
    grid.appendChild(c);chips.push(c);
  }
  const tray=el('div','tray');
  const trayLabel=el('div','tray-label','书签停放区：把书签拖到书页上 ⇩');
  tray.appendChild(trayLabel);
  let bubble=null;
  if(easy){bubble=el('div','count-bubble','已点亮 ? 页');tray.appendChild(bubble);}
  wrap.append(title,grid,tray);
  box.appendChild(wrap);

  const state={start:null,end:null};
  /* 两枚书签 */
  const rbStart=makeRibbon('start','开始');
  const rbEnd=makeRibbon('end','结束');
  tray.append(rbStart,rbEnd);
  rbStart.classList.add('in-tray');rbEnd.classList.add('in-tray');

  function makeRibbon(cls,label){
    const r=el('div','ribbon '+cls,label);
    r.dataset.role=cls;
    return r;
  }
  /* 已读页打勾（remain 题型） */
  if(rd.kind==='remain'){
    for(let i=rd.readFrom;i<=rd.readTo;i++)chips[i-1].classList.add('read');
    const h=el('div','hint-line','绿色书签放在“接下来开始读的页”，橙色书签放在“读到的最后一页”。');
    tray.after(h);
  }
  /* 锁定的书签（findEnd / findStart 题型） */
  if(rd.kind==='findEnd'){
    state.start=rd.start;
    placeRibbon(rbStart,rd.start);
    rbStart.classList.add('locked');rbStart.classList.remove('in-tray');
  }else if(rd.kind==='findStart'){
    state.end=rd.end;
    placeRibbon(rbEnd,rd.end);
    rbEnd.classList.add('locked');rbEnd.classList.remove('in-tray');
  }
  function placeRibbon(rb,page){
    const chip=chips[page-1];
    rb.style.left=(chip.offsetLeft+chip.offsetWidth/2-18)+'px';
    rb.style.top=(chip.offsetTop-62)+'px';
    rb.dataset.page=String(page);
    rb.classList.remove('in-tray');
  }
  function backToTray(rb){
    rb.style.left='';rb.style.top='';
    rb.dataset.page='';
    rb.classList.add('in-tray');
    tray.appendChild(rb);
  }
  /* 拖拽（指针事件：鼠标 + 触摸通用，按矩形命中判断落点） */
  function bindDrag(rb){
    rb.addEventListener('pointerdown',function(e){
      if(rb.classList.contains('locked')||G.curDef!==rd||finished)return;
      e.preventDefault();
      rb.setPointerCapture(e.pointerId);
      rb.classList.add('dragging');
      /* 切换为 wrap 内的绝对定位，跟随指针 */
      const r0=rb.getBoundingClientRect();
      const wr=wrap.getBoundingClientRect();
      const offX=e.clientX-r0.left,offY=e.clientY-r0.top;
      rb.classList.remove('in-tray');
      wrap.appendChild(rb);
      rb.style.left=(r0.left-wr.left)+'px';
      rb.style.top=(r0.top-wr.top)+'px';
      const move=function(ev){
        rb.style.left=(ev.clientX-offX-wr.left)+'px';
        rb.style.top=(ev.clientY-offY-wr.top)+'px';
        chips.forEach(function(c){c.classList.remove('hover');});
        const hc=chipAt(ev.clientX,ev.clientY);
        if(hc)hc.classList.add('hover');
      };
      const up=function(ev){
        rb.classList.remove('dragging');
        chips.forEach(function(c){c.classList.remove('hover');});
        const hc=chipAt(ev.clientX,ev.clientY);
        if(hc){
          const page=parseInt(hc.dataset.page,10);
          if(rd.kind==='remain'&&hc.classList.contains('read')){
            say('第 '+page+' 页已经读过啦（打了 ✓ 的页），要选还没读的页哦！');
            backToTray(rb);
          }else{
            if(rb.dataset.role==='start')state.start=page;else state.end=page;
            placeRibbon(rb,page);
            addStep();
            renderLit();
          }
        }else{
          backToTray(rb);
          if(rb.dataset.role==='start')state.start=null;else state.end=null;
          renderLit();
        }
        rb.removeEventListener('pointermove',move);
        rb.removeEventListener('pointerup',up);
        rb.removeEventListener('pointercancel',up);
      };
      rb.addEventListener('pointermove',move);
      rb.addEventListener('pointerup',up);
      rb.addEventListener('pointercancel',up);
    });
  }
  bindDrag(rbStart);bindDrag(rbEnd);
  function chipAt(cx,cy){
    for(const c of chips){
      const r=c.getBoundingClientRect();
      if(cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom)return c;
    }
    return null;
  }
  /* 点亮区间（包括两头） */
  function renderLit(){
    chips.forEach(function(c){c.classList.remove('lit');});
    if(state.start&&state.end&&state.end>=state.start){
      for(let i=state.start;i<=state.end;i++)chips[i-1].classList.add('lit');
    }
    if(bubble){
      if(state.start&&state.end&&state.end>=state.start){
        bubble.textContent='已点亮 '+(state.end-state.start+1)+' 页';
      }else{bubble.textContent='已点亮 ? 页';}
    }
  }
  const stat=el('div','status-line');box.appendChild(stat);
  function say(msg){stat.textContent=msg;stat.style.color='#dc2626';}
  /* 交卷按钮 */
  const ctrl=el('div','ctrl-row');
  const bGo=el('button','btn big','✅ 就是这些页，交卷！');
  bGo.addEventListener('click',submit);
  ctrl.appendChild(bGo);
  box.appendChild(ctrl);
  function finish(){
    if(finished)return;
    finished=true;
    chips.forEach(function(c){c.classList.add('cele');});
    setTimeout(onDone,500);
  }
  function submit(){
    if(G.curDef!==rd||finished)return;
    if(rd.kind==='findEnd'){
      if(!state.end){say('先把橙色【结束】书签拖到书页上哦！');return;}
      if(state.end<state.start){say('结束页要排在开始页（第 '+rd.start+' 页）后面呀，再想想！');return;}
      if(state.end===rd.end){
        stat.textContent='答对啦！从第 '+rd.start+' 页到第 '+rd.end+' 页，两头都算！';
        stat.style.color='#16a34a';addStep();finish();
      }else if(easy){
        say('从第 '+rd.start+' 页到第 '+state.end+' 页是 '+(state.end-state.start+1)+' 页，目标是 '+rd.count+' 页，还差一点点！');
      }else{
        say('页数不对哦。想一想：两头都算，页数 = 结束页 − 开始页 + 1。');
      }
    }else if(rd.kind==='findStart'){
      if(!state.start){say('先把绿色【开始】书签拖到书页上哦！');return;}
      if(state.start>state.end){say('开始页要排在结束页（第 '+rd.end+' 页）前面呀！');return;}
      if(state.start===rd.start){
        stat.textContent='答对啦！从第 '+rd.start+' 页看到第 '+rd.end+' 页！';
        stat.style.color='#16a34a';addStep();finish();
      }else if(easy){
        say('从第 '+state.start+' 页到第 '+rd.end+' 页是 '+(rd.end-state.start+1)+' 页，目标是 '+rd.count+' 页，再调调！');
      }else{
        say('再想想：页数 = 结束页 − 开始页 + 1，两头都要算。');
      }
    }else{ /* remain：还要看的页 */
      if(!state.start||!state.end){say('先把两枚书签都拖到还没读的页上哦！');return;}
      if(state.end<state.start){say('结束书签要放在开始书签后面呀！');return;}
      if(state.start<=rd.readTo){say('前面已经看到第 '+rd.readTo+' 页啦，接下来要从第 '+(rd.readTo+1)+' 页开始哦！');return;}
      const n=state.end-state.start+1;
      if(state.start===rd.from&&n===rd.remain){
        stat.textContent='答对啦！从第 '+state.start+' 页读到第 '+state.end+' 页，正好 '+rd.remain+' 页！';
        stat.style.color='#16a34a';addStep();finish();
      }else if(state.start!==rd.from){
        say('开始页不对：前面看到第 '+rd.readTo+' 页，接着要从第 '+(rd.readTo+1)+' 页开始读哦！');
      }else{
        say('你框了 '+n+' 页，还需要 '+rd.remain+' 页，调整一下结束书签！');
      }
    }
  }
  renderLit();
  window.addEventListener('resize',function(){
    if(rbStart.dataset.page&&!rbStart.classList.contains('in-tray')&&!rbStart.classList.contains('locked'))placeRibbon(rbStart,parseInt(rbStart.dataset.page,10));
    if(rbEnd.dataset.page&&!rbEnd.classList.contains('in-tray')&&!rbEnd.classList.contains('locked'))placeRibbon(rbEnd,parseInt(rbEnd.dataset.page,10));
    if(rbStart.classList.contains('locked'))placeRibbon(rbStart,parseInt(rbStart.dataset.page,10));
    if(rbEnd.classList.contains('locked'))placeRibbon(rbEnd,parseInt(rbEnd.dataset.page,10));
  });
}

/* ================================================================
   小游戏三：🎉 派对小屋（拖人物 / 发门票 / 时间轴）
   ================================================================ */
function PartyGame(box,rd,onDone){
  if(rd.kind==='bringIn')buildBringIn();
  else if(rd.kind==='tickets')buildTickets();
  else buildTimeline();

  const FACES=['😊','😄','😁','🙂','😍','😎','🤗','😽'];
  const GUEST_NAMES=['乐乐','朵朵','皮皮','天天','小美','壮壮','豆豆','米米','宁宁','安安','欣欣','淘淘','毛毛','露露'];
  function dollColor(){return 'hsl('+Math.floor(Math.random()*360)+',65%,55%)';}
  function makeDoll(name,mini,hero){
    const d=el('div','doll'+(mini?' mini':'')+(hero?' hero':''));
    d.innerHTML='<div class="head">'+choice(FACES)+'</div>'+
      '<div class="body" style="--dc:'+dollColor()+'"></div>'+
      (mini?'':'<div class="nm">'+name+'</div>');
    return d;
  }
  function burstFx(host,emoji){
    const b=el('div','burst',emoji);
    b.style.left='40%';b.style.top='6px';
    host.appendChild(b);
    setTimeout(function(){b.remove();},1000);
  }
  /* 通用拖拽：拖到目标区域（按矩形命中判断），失败回到原容器 */
  function makeDraggable(doll,targets){
    doll.addEventListener('pointerdown',function(e){
      e.preventDefault();
      doll.setPointerCapture(e.pointerId);
      doll.classList.add('dragging');
      const origParent=doll.parentElement;
      const dr=doll.getBoundingClientRect();
      const offX=e.clientX-dr.left,offY=e.clientY-dr.top;
      /* 固定定位跟随指针 */
      doll.style.position='fixed';
      doll.style.left=dr.left+'px';doll.style.top=dr.top+'px';
      doll.style.width=dr.width+'px';
      document.body.appendChild(doll);
      const move=function(ev){
        doll.style.left=(ev.clientX-offX)+'px';
        doll.style.top=(ev.clientY-offY)+'px';
      };
      const up=function(ev){
        doll.classList.remove('dragging');
        doll.style.position='';doll.style.left='';doll.style.top='';doll.style.width='';
        let placed=false;
        for(const t of targets){
          const r=t.host.getBoundingClientRect();
          if(ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom){
            t.accept(doll);placed=true;break;
          }
        }
        if(!placed)origParent.appendChild(doll);
        doll.removeEventListener('pointermove',move);
        doll.removeEventListener('pointerup',up);
        doll.removeEventListener('pointercancel',up);
      };
      doll.addEventListener('pointermove',move);
      doll.addEventListener('pointerup',up);
      doll.addEventListener('pointercancel',up);
    });
  }

  /* ================= A. 拖人物进门（+1 数上自己） ================= */
  function buildBringIn(){
    let finishedP=false;
    const roomName={classroom:'教室',court:'篮球场',handshake:'自行车赛场',toast:'聚会小屋'}[rd.scene]||'房间';
    const scene=el('div','scene');
    const room=el('div','room','<div class="room-label">'+roomName+'</div>');
    const roomFlex=el('div','room-flex');
    room.appendChild(roomFlex);
    const door=el('div','doorcol','<div class="door">🚪</div>');
    const doorHint=el('div','drag-hint','把'+rd.hero+'拖进'+roomName+'');
    door.appendChild(doorHint);
    scene.append(room,door);
    box.appendChild(scene);
    const stat=el('div','status-line');box.appendChild(stat);

    /* 主人公 */
    const heroDoll=makeDoll(rd.hero,false,true);
    door.insertBefore(heroDoll,doorHint);
    let heroIn=false;
    let guests=[];
    let cntChip=null;

    /* 教室 / 球场：屋里先有小朋友 */
    if(rd.kidsIn){
      roomFlex.appendChild(el('div','cnt-chip',roomName+'里已有 '+rd.kidsIn+' 个小朋友'));
      for(let i=0;i<rd.kidsIn;i++)roomFlex.appendChild(makeDoll('',true,false));
    }
    /* 握手 / 碰杯：等候区 + 实时计数 */
    if(rd.guestsTarget){
      cntChip=el('div','cnt-chip',rd.hero+'已'+(rd.scene==='toast'?'碰杯':'握手')+' 0 次（她记得一共 '+rd.guestsTarget+' 次）');
      door.insertBefore(cntChip,doorHint);
      const qwrap=el('div');qwrap.style.marginTop='10px';
      const queue=el('div','queue');
      queue.appendChild(el('div','tray-label','等候区：把这些小选手拖进'+roomName+'（拖回来可以请出去）'));
      const poolNames=shuffle(GUEST_NAMES).slice(0,rd.guestsTarget+4);
      for(const nm of poolNames){
        const g=makeDoll(nm,false,false);
        queue.appendChild(g);
        makeDraggable(g,[
          {host:roomFlex,accept:function(){enterGuest(g,nm);}},
          {host:queue,accept:function(){leaveGuest(g);}}
        ]);
      }
      qwrap.appendChild(queue);
      box.appendChild(qwrap);
    }
    function recount(){
      if(cntChip)cntChip.textContent=rd.hero+'已'+(rd.scene==='toast'?'碰杯':'握手')+' '+guests.length+' 次（她记得一共 '+rd.guestsTarget+' 次）';
    }
    function enterGuest(g,nm){
      if(guests.indexOf(g)>=0)return;
      guests.push(g);
      roomFlex.appendChild(g);
      burstFx(roomFlex,rd.scene==='toast'?'🥂':'🤝');
      g.classList.add('pop');setTimeout(function(){g.classList.remove('pop');},420);
      recount();addStep();
    }
    function leaveGuest(g){
      guests=guests.filter(function(x){return x!==g;});
      const q=box.querySelector('.queue');
      if(q)q.appendChild(g);
      recount();
    }
    /* 主人公拖拽：进门 / 回门口 */
    makeDraggable(heroDoll,[
      {host:roomFlex,accept:function(){
        roomFlex.appendChild(heroDoll);
        if(!heroIn){
          heroIn=true;addStep();
          heroDoll.classList.add('pop');setTimeout(function(){heroDoll.classList.remove('pop');},420);
          doorHint.textContent=rd.hero+'已就位！按【报数】数一数';
        }
      }},
      {host:door,accept:function(){
        door.insertBefore(heroDoll,doorHint);
        if(heroIn){heroIn=false;doorHint.textContent='把'+rd.hero+'拖进'+roomName;}
      }}
    ]);
    /* 报数按钮：逐个编号动画 */
    const ctrl=el('div','ctrl-row');
    const bCount=el('button','btn big','🔢 报数！');
    bCount.addEventListener('click',doCount);
    ctrl.appendChild(bCount);
    box.appendChild(ctrl);
    let counting=false;
    function doCount(){
      if(counting||finishedP||G.curDef!==rd)return;
      counting=true;bCount.disabled=true;
      const kids=[].slice.call(roomFlex.querySelectorAll('.doll'));
      kids.forEach(function(k){
        const c=k.querySelector('.cnt');if(c)c.remove();
      });
      let i=0;
      const int=setInterval(function(){
        if(i>=kids.length){
          clearInterval(int);
          const total=kids.length;
          stat.textContent='一、二、三……'+roomName+'里一共有 '+total+' 人！';
          setTimeout(function(){verdict(total);},700);
          return;
        }
        const k=kids[i];
        k.appendChild(el('span','cnt',String(i+1)));
        k.classList.add('pop');setTimeout(function(){k.classList.remove('pop');},420);
        i++;
      },150);
    }
    function verdict(total){
      if(!heroIn){
        stat.textContent='咦，'+rd.hero+'还在门口呢！她自己也是'+(rd.scene==='handshake'?'参赛选手':'聚会一员')+'，要把她请进来一起报数哦！';
        stat.style.color='#dc2626';bCount.disabled=false;counting=false;return;
      }
      if(rd.guestsTarget&&guests.length!==rd.guestsTarget){
        if(guests.length<rd.guestsTarget){
          stat.textContent=rd.hero+'只'+(rd.scene==='toast'?'碰了':'握了')+guests.length+'次手，她记得是 '+rd.guestsTarget+' 次——再请几位小选手进来！';
        }else{
          stat.textContent='握了 '+guests.length+' 次手，比 '+rd.guestsTarget+' 次多了——有 '+(guests.length-rd.guestsTarget)+' 位不是选手，把他们拖回等候区吧！';
        }
        stat.style.color='#dc2626';bCount.disabled=false;counting=false;return;
      }
      if(total===rd.total){
        stat.textContent='答对啦！一共有 '+rd.total+' 人！';
        stat.style.color='#16a34a';
        finishedP=true;
        setTimeout(onDone,600);
      }else{
        stat.textContent='数出 '+total+' 人，再检查一下该进来的都进来了吗？';
        stat.style.color='#dc2626';bCount.disabled=false;counting=false;
      }
    }
  }

  /* ================= B. 发门票 / 分小兔子（祖孙三代） ================= */
  function buildTickets(){
    let doneT=false;
    const isFamily=(rd.scene==='family');
    const arch=el('div','gate-arch',isFamily?'🏰 儿童公园大门':'🌲 森林营地');
    const gateRow=el('div','gate-row');
    gateRow.appendChild(arch);
    box.appendChild(gateRow);
    const scene=el('div','scene');
    const peopleRow=el('div','room-flex');
    scene.appendChild(peopleRow);
    box.appendChild(scene);
    const stat=el('div','status-line');box.appendChild(stat);
    stat.textContent='已发出 0 张'+rd.itemName;

    const dolls=[];
    rd.people.forEach(function(nm){
      const d=makeDoll(nm,false,false);
      d.dataset.holds='0';
      peopleRow.appendChild(d);
      dolls.push(d);
    });
    /* 物品托盘（6 张，比 3 多，允许探索） */
    const tray=el('div','tray');
    tray.appendChild(el('div','tray-label','把'+rd.itemName+'一张一张拖给上面的人（每人只要一份）⇧'));
    const used=el('div','count-bubble','已用 0 张');
    tray.appendChild(used);
    box.appendChild(tray);
    let usedCount=0;
    for(let i=0;i<6;i++){
      const t=el('div','ticket',rd.item+'<span>'+rd.itemName+'</span>');
      tray.insertBefore(t,used);
      t.addEventListener('pointerdown',function(e){
        if(doneT)return;
        e.preventDefault();
        t.setPointerCapture(e.pointerId);
        t.classList.add('dragging');
        const r=t.getBoundingClientRect();
        const ox=e.clientX-r.left,oy=e.clientY-r.top;
        t.style.position='fixed';t.style.left=r.left+'px';t.style.top=r.top+'px';t.style.zIndex='80';
        const move=function(ev){
          t.style.left=(ev.clientX-ox)+'px';t.style.top=(ev.clientY-oy)+'px';
        };
        const up=function(ev){
          t.classList.remove('dragging');
          t.style.position='';t.style.left='';t.style.top='';t.style.zIndex='';
          let hit=null;
          for(const d of dolls){
            const dr=d.getBoundingClientRect();
            if(ev.clientX>=dr.left&&ev.clientX<=dr.right&&ev.clientY>=dr.top&&ev.clientY<=dr.bottom){hit=d;break;}
          }
          if(hit){
            if(hit.dataset.holds==='1'){
              hit.classList.add('wig');setTimeout(function(){hit.classList.remove('wig');},700);
              stat.textContent='他已经有一'+(rd.itemName==='门票'?'张':'只')+rd.itemName+'啦！每人只要一份。';
              stat.style.color='#dc2626';
            }else{
              hit.dataset.holds='1';
              hit.insertBefore(el('div','holds',rd.item),hit.querySelector('.nm'));
              usedCount++;used.textContent='已用 '+usedCount+' 张';
              addStep();
              stat.textContent='已发出 '+usedCount+' 张'+rd.itemName;
              stat.style.color='#42506c';
              if(dolls.every(function(d){return d.dataset.holds==='1';})){
                doneT=true;
                setTimeout(function(){
                  stat.textContent='每个人都有一份——一共只用了 '+usedCount+' 张'+rd.itemName+'！';
                  stat.style.color='#16a34a';
                  arch.textContent=isFamily?'🏰 大门打开，出发去公园啦！':'🌲 营地大门打开啦！';
                  setTimeout(onDone,700);
                },500);
              }
            }
          }
          t.removeEventListener('pointermove',move);
          t.removeEventListener('pointerup',up);
          t.removeEventListener('pointercancel',up);
        };
        t.addEventListener('pointermove',move);
        t.addEventListener('pointerup',up);
        t.addEventListener('pointercancel',up);
      });
    }
  }

  /* ================= C. 时间轴（同时进行，时间相同） ================= */
  function buildTimeline(){
    let finishedT=false;
    const isAge=(rd.scene==='age');
    const perfData={
      sing:{icon:'🎤',names:['小红','小明','田田','丁丁'],cap:'🎤 4 个人一起唱：同时进行，时间相同'},
      badminton:{icon:'🏸',names:['田田','丁丁'],cap:'🏸 一起打羽毛球：同时进行，时间相同'},
      ball:{icon:'🏀',names:['1号','2号','3号','4号','5号','6号','7号','8号','9号','10号'],cap:'🏀 10 人同场比赛：同时进行，时间相同'},
      cake:{icon:'🍰',names:['乐乐','朵朵','皮皮'],cap:'🍰 同时各吃一块蛋糕：同时进行，时间相同'},
      pingpong:{icon:'🏓',names:['小美','壮壮'],cap:'🏓 一起打乒乓球：同时进行，时间相同'}
    };
    /* 年龄差：时光转盘演示台 */
    if(isAge){
      const st=el('div','age-stage');
      const bro=ageCol('弟弟',7,'#0284c7');
      const sis=ageCol('哥哥',17,'#16a34a');
      st.append(bro.col,sis.col);
      const ageLabel=el('div','status-line','现在是【今年】：弟弟 7 岁，哥哥 17 岁');
      const sw=el('div','slider-wrap');
      sw.innerHTML='<div class="slider-title">🕰️ 时光转盘：拖动看看 <b id="yrVal">0</b> 年后的变化</div>';
      const strack=el('div','slider-track');
      const knob=el('div','knob','⇆');
      strack.appendChild(knob);
      sw.appendChild(strack);
      box.append(st,ageLabel,sw);
      const setYr=function(v){
        const yr=Math.max(0,Math.min(5,v));
        knob.style.left=(yr/5*100)+'%';
        sw.querySelector('#yrVal').textContent=String(yr);
        bro.set(7+yr);sis.set(17+yr);
        ageLabel.textContent=(yr===0?'现在是【今年】：弟弟 7 岁，哥哥 17 岁':yr+' 年后：弟弟 '+(7+yr)+' 岁，哥哥 '+(17+yr)+' 岁（看，两人一起长）');
      };
      bindKnob(strack,knob,function(e){
        const r=strack.getBoundingClientRect();
        setYr(Math.round((e.clientX-r.left)/r.width*5));
      });
      setYr(0);
    }else{
      const pd=perfData[rd.scene];
      const wrapP=el('div','performers');
      const bars=[];
      for(let i=0;i<rd.k;i++){
        const p=el('div','perf');
        const who=makeDoll(pd.names[i]||'',rd.scene==='ball',false);
        const nm=el('div','nm',pd.names[i]);
        const bw=el('div','barwrap');
        const bar=el('div','bar');
        bw.appendChild(bar);
        p.append(who,nm,bw);
        wrapP.appendChild(p);bars.push(bar);
      }
      const cap=el('div','hint-line',pd.cap);
      box.append(wrapP,cap);
      timelineAnim=function(val){   /* 所有人同时进行的动画 */
        bars.forEach(function(b){
          b.style.width='0%';void b.offsetWidth;
          b.style.width=Math.min(100,val/rd.max*100)+'%';
        });
      };
    }
    /* 时间轴 */
    const tw=el('div','track-wrap');
    const track=el('div','track');
    for(let v=0;v<=rd.max;v+=rd.snap){
      const isMajor=(v%rd.labelStep===0);
      const tk=el('div','tick'+(isMajor?' major':''));
      tk.style.left=(v/rd.max*100)+'%';
      track.appendChild(tk);
      if(isMajor){
        const lb=el('div','tick-label',String(v));
        lb.style.left=(v/rd.max*100)+'%';
        track.appendChild(lb);
      }
    }
    const flag=el('div','flag','<div class="bubble">0 '+rd.unit+'</div><div class="cloth">🚩</div><div class="pole"></div>');
    track.appendChild(flag);
    tw.appendChild(track);
    box.appendChild(tw);
    box.appendChild(el('div','hint-line','时间轴单位：'+rd.unit+'（把旗帜拖到正确的位置，再按下面的按钮）'));
    const stat=el('div','status-line');box.appendChild(stat);
    let val=0;
    function setVal(v){
      val=Math.max(0,Math.min(rd.max,v));
      flag.style.left=(val/rd.max*100)+'%';
      flag.querySelector('.bubble').textContent=val+' '+rd.unit;
    }
    setVal(0);
    flag.addEventListener('pointerdown',function(e){
      e.preventDefault();
      flag.setPointerCapture(e.pointerId);
      flag.classList.add('dragging');
      const move=function(ev){
        const r=track.getBoundingClientRect();
        const raw=(ev.clientX-r.left)/r.width*rd.max;
        setVal(Math.round(raw/rd.snap)*rd.snap);
      };
      const up=function(){
        flag.classList.remove('dragging');
        flag.removeEventListener('pointermove',move);
        flag.removeEventListener('pointerup',up);
        flag.removeEventListener('pointercancel',up);
      };
      flag.addEventListener('pointermove',move);
      flag.addEventListener('pointerup',up);
      flag.addEventListener('pointercancel',up);
    });
    function ageCol(name,age,color){
      const col=el('div','age-col');
      const bar=el('div','age-bar');
      bar.style.background=color;
      const nm=el('div','nm','<b>'+name+'</b>');
      col.append(bar,nm);
      const MAXA=24;
      const set=function(a){bar.style.height=(a/MAXA*180)+'px';};
      set(age);
      return {col:col,set:set};
    }
    function bindKnob(tr,kn,fn){
      kn.addEventListener('pointerdown',function(e){
        e.preventDefault();
        kn.setPointerCapture(e.pointerId);
        kn.classList.add('dragging');
        const move=function(ev){fn(ev);};
        const up=function(){
          kn.classList.remove('dragging');
          kn.removeEventListener('pointermove',move);
          kn.removeEventListener('pointerup',up);
          kn.removeEventListener('pointercancel',up);
        };
        kn.addEventListener('pointermove',move);
        kn.addEventListener('pointerup',up);
        kn.addEventListener('pointercancel',up);
      });
    }
    /* 开始按钮 */
    const ctrl=el('div','ctrl-row');
    const bGo=el('button','btn big','▶️ '+rd.act);
    bGo.addEventListener('click',function(){
      if(finishedT||G.curDef!==rd)return;
      addStep();
      if(!isAge&&timelineAnim)timelineAnim(val);
      setTimeout(function(){
        if(val===rd.answer){
          stat.textContent='答对啦！'+(isAge?('相差 '+val+' '+rd.unit):('每个人的时间都是 '+val+' '+rd.unit+'！'));
          stat.style.color='#16a34a';
          finishedT=true;
          setTimeout(onDone,600);
        }else{
          stat.style.color='#dc2626';
          if(rd.scene==='cake'&&val===6){stat.textContent='不是 2×3 哦：大家同时各吃一块，时间不变，再拖拖看！';}
          else if(rd.scene==='sing'&&val===1){stat.textContent='不是 4÷4 哦：大家是同时唱，不是轮流唱！';}
          else if(rd.scene==='pingpong'&&val===30){stat.textContent='不是 60÷2 哦：两人同时打，不是轮流打！';}
          else if(rd.scene==='ball'&&val===4){stat.textContent='不是 40÷10 哦：10 人同时上场，不是轮流上！';}
          else if(isAge){stat.textContent='再看看时光转盘：两人一起长大，相差的岁数会变吗？';}
          else{stat.textContent='想一想：大家是【同时】进行的，时间相同！再拖拖看。';}
        }
      },isAge?200:1350);
    });
    ctrl.appendChild(bGo);
    box.appendChild(ctrl);
  }
}

showMenu();
