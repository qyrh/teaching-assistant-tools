<div id="app">

  <!-- ============ 首屏：标题 + 难度选择 ============ -->
  <section id="homeScreen">
    <div class="badge">高中数学 · 选择性必修 · 第五章 5.2 导数的运算</div>
    <h1 class="title">切线大师 · 导数星工坊</h1>
    <p class="sub">
      欢迎来到导数星工坊！星轨就是函数曲线，光尺就是切线。拖动星轨上发光的切点，光尺会跟着转动；
      还可以转动公式连线盘、推动参数滑块、校准匠心中平——在动手中玩转求导公式与切线方法！
      每一局的关卡数据、配色都会随机刷新，越玩越熟！
    </p>
    <div class="diffGrid">
      <button class="diffCard" data-diff="e">
        <div class="dName">初级 · 星火试炼</div>
        <div class="dDesc">导数公式连线盘 + 幂函数、指数、对数、三角函数的光尺斜率校准。练熟基本求导公式。</div>
        <div class="dStars">4 个关卡 · 14 颗星</div>
      </button>
      <button class="diffCard" data-diff="m">
        <div class="dName">中级 · 星轨进阶</div>
        <div class="dDesc">过定点拉切线、抛物线双切线交点、匠心中平待定系数、平行切线最近距离。练熟切线方程方法。</div>
        <div class="dStars">4 个关卡 · 7 颗星</div>
      </button>
      <button class="diffCard" data-diff="h">
        <div class="dName">高级 · 星河大师</div>
        <div class="dDesc">双轨公切线、滑块调出唯一交点、切线三角形定值探索、双尺交汇大师赛。综合挑战！</div>
        <div class="dStars">4 个关卡 · 13 颗星</div>
      </button>
    </div>
    <div class="homeBtns">
      <button id="btnRulesHome" class="btn ghost">规则说明</button>
    </div>
  </section>

  <!-- ============ 游戏屏 ============ -->
  <section id="gameScreen" class="hidden">
    <div id="hud">
      <div class="hudL">

        <span id="hudStars" class="chip">★ 0/0</span>
      </div>
      <div class="hudR">

        <span id="hudSteps" class="chip">步数 0</span>
        <button id="btnRules" class="btn ghost mini">规则说明</button>
      </div>
    </div>
    <div id="taskPanel">
      <div id="taskTitle">…</div>
      <div id="taskText">…</div>
    </div>
    <div id="stage">
      <canvas id="board"></canvas>
      <div id="matchBoard" class="hidden">
        <div class="matchCol" id="colL"></div>
        <svg id="matchSvg"></svg>
        <div class="matchCol" id="colR"></div>
      </div>
      <div id="toast" class="hidden"></div>
    </div>
    <div id="widgetBar"></div>
    <div id="readoutBar"></div>
    <div id="btnRow">
      <button id="btnReveal" class="btn warm">揭示答案</button>
      <button id="btnRestart" class="btn ghost">重新开始</button>
      <button id="btnBack" class="btn ghost">返回难度选择</button>
    </div>
  </section>

  <!-- ============ 通用弹窗 ============ -->

      <div id="modalBody"></div>

  </div>

</div>

:null,doneStars:[],timerInt:null};var pal=PALETTES[0];var toastTimer=null;function showToast(text,ms){var t=$("toast");t.textContent=text;t.classList.remove("hidden");if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.add("hidden")},ms||2600)}function showModal(title,bodyHTML,buttons){$("modalTitle").textContent=title;$("modalBody").innerHTML=bodyHTML;var box=$("modalBtns");box.innerHTML="";(buttons||[]).forEach(function(b){var el=document.createElement("button");el.className="btn "+(b.cls||"primary");el.textContent=b.text;el.addEventListener("click",function(){hideModal();if(b.fn)b.fn()});box.appendChild(el)});$("modalWrap").classList.remove("hidden")}function hideModal(){$("modalWrap").classList.add("hidden")}var fxCanvas=$("fx"),fxCtx=fxCanvas.getContext("2d");var particles=[];function resizeFx(){var dpr=window.devicePixelRatio||1;fxCanvas.width=Math.round(window.innerWidth*dpr);fxCanvas.height=Math.round(window.innerHeight*dpr);fxCtx.setTransform(dpr,0,0,dpr,0,0)}function burst(x,y,n,big){var colors=[pal.c1,pal.c2,pal.c3,pal.accent,pal.good];for(var i=0;i<n;i++){var ang=Math.random()*PI*2;var sp=(big?4:2.5)+Math.random()*(big?7:4);particles.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-3,w:5+Math.random()*6,h:8+Math.random()*8,rot:Math.random()*PI,vr:(Math.random()-.5)*.3,color:pick(colors),life:1,decay:.008+Math.random()*.01})}}function burstAtCanvas(fx,fy){var r=$("board").getBoundingClientRect();burst(r.left+fx,r.top+fy,42,true)}function drawParticles(dt){fxCtx.clearRect(0,0,window.innerWidth,window.innerHeight);for(var i=particles.length-1;i>=0;i--){var p=particles[i];p.vy+=.12;p.vx*=.995;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=p.decay;if(p.life<=0||p.y>window.innerHeight+30){particles.splice(i,1);continue}fxCtx.save();fxCtx.translate(p.x,p.y);fxCtx.rotate(p.rot);fxCtx.globalAlpha=Math.max(0,p.life);fxCtx.fillStyle=p.color;fxCtx.fillRect(-p.w/2,-p.h/2,p.w,p.h);fxCtx.restore()}}function fireworks(durationMs){var n=0;var iv ed=true}}],readouts:[{label:"切点",val:function(){return"P("+fmt(P1.x)+", "+fmt(EXP(P1.x))+")"}},{label:"k = y′ = eˣ",val:function(){return fmt(EXP(P1.x))}},{label:"目标斜率",val:function(){return k1txt}}]};var sc2={brief:"订单二：星轨 y = ln x（此时 y′ = 1/x）。拖动P使 k = "+k2+"。观察：越靠左 k 越大，1/x 处处为正！",view:{xmin:.03,xmax:3.15,ymin:-2.6,ymax:2.2},curves:[{f:LN,label:"y = ln x",color:pal.c1}],points:[P2],goals:[{id:"g2",label:"斜率 k = "+k2,pts:["P"],lockPts:true,inRange:function(){return ABS(1/P2.x-k2)<.22},snap:function(){P2.x=a2;P2.locked=true}}],readouts:[{label:"切点",val:function(){return"P("+fmt(P2.x)+", "+fmt(LN(P2.x))+")"}},{label:"k = y′ = 1/x",val:function(){return fmt(1/P2.x)}},{label:"目标斜率",val:function(){return""+k2}}]};return{key:"calEL",kind:"canvas",name:"光尺校准 · 指数与对数",scenes:[sc1,sc2],goalCount:2,story:"指数与对数函数的导数最容易丢 ln！来星轨上亲手感受 eˣ 与 ln x 的切线变化吧。",noteHtml:'<p>指数、对数求导公式：</p><div class="formula">(eˣ)′ = eˣ　→　令 eˣ = '+k1txt+"，得 x = "+fmt(a1)+'</div><div class="formula">(ln x)′ = 1/x　→　令 1/x = '+k2+"，得 x = "+fmt(a2)+'</div><div class="formula">(aˣ)′ = aˣ·ln a　　(log_a x)′ = 1/(x·ln a)</div><p class="starLine">易错提醒：y = eˣ 的导数不变，但 y = 2ˣ 的导数是 2ˣ·ln2。</p>'}}function buildCalTrig(){var P1={id:"P",name:"P",curve:0,x:2.2,touched:false};var P2={id:"P",name:"P",curve:0,x:1,touched:false};var trigTicks=[{v:0,l:"0"},{v:PI/2,l:"π/2"},{v:PI,l:"π"},{v:3*PI/2,l:"3π/2"},{v:2*PI,l:"2π"}];var sc1={brief:"订单一：星轨 y = sin x（y′ = cos x，横轴为弧度制）。在发光区域内拖动P，使 k = 1。想想区域内哪里 cos x 能取到最大值 1？",view:{xmin:-.9,xmax:7.2,ymin:-1.8,ymax:1.8},curves:[{f:Math.sin,label:"y = sin x",color:pal.c1}],zones:[{x1:-.85,x2:1.2}],xticks:trigTicks,points:[P1],goals:[{id:"g1",label:"k = 1（区域内唯一）",pts:["P"],lockPts:true,inRange:function(){return ABS(Math.cos(P1.x)-1)<.05&&P1.x>=-.85&&P1.x<=1.2},snap:function(){P1.x=0;P1.locked=true}}],readouts:[{label:"切点横坐标",val:function(){return fmt(P1.x)}},{label:"k = y′ = cos x",val:function(){return fmt(Math.cos(P1.x))}},{label:"目标",val:function(){return"1"}}]};var sc2={brief:"订单二：星轨 y = cos x（y′ = −sin x）。在发光区域内拖动P，使切线水平（k = 0）。",view:{xmin:-.9,xmax:7.2,ymin:-1.8,ymax:1.8},curves:[{f:Math.cos,label:"y = cos x",color:pal.c1}],zones:[{x1:2.2,x2:4.1}],xticks:trigTicks,points:[P2],goals:[{id:"g2",label:"k = 0（切线水平）",pts:["P"],lockPts:true,inRange:function(){return ABS(Math.sin(P2.x))<.06&&P2.x>=2.2&&P2.x<=4.1},snap:function(){P2.x=PI;P2.locked=true}}],readouts:[{label:"切点横坐标",val:function(){return fmt(P2.x)}},{label:"k = y′ = −sin x",val:function(){return fmt(-Math.sin(P2.x))}},{label:"目标",val:function(){return"0"}}]};return{key:"calTrig",kind:"canvas",name:"光尺校准 · 三角函数",scenes:[sc1,sc2],goalCount:2,story:"三角星轨起伏绵延，切线斜率在正负之间摆动。注意横轴使用弧度制！",noteHtml:'<p>三角函数求导公式：</p><div class="formula">(sin x)′ = cos x　→　区域内 cos x = 1 仅在 x = 0 处成立（cos x ≤ 1，等号仅在 x=2kπ）</div><div class="formula">(cos x)′ = −sin x　→　区域内 −sin x = 0，即 sin x = 0，得 x = π</div><p class="starLine">切线水平 ⇔ 斜率为 0 ⇔ f′(x₀) = 0，这是日后用导数研究极值的关键信号！</p>'}}function buildTanExternal(){var P={id:"P",name:"P",curve:0,x:-1,touched:false};function dev(){var p=P.x;return 4*p-p*p-3}var sc={brief:"客人把一颗星宝石定在 T(2,3)（不在曲线上！）。拖动切点P，让光尺恰好穿过星宝石。这样的切点有两个——把两条都找出来！提示：切线过 T ⇔ 偏差读数为 0。",view:{xmin:-1.4,xmax:4.3,ymin:-2.6,ymax:10.6},curves:[{f:function(x){return x*x},label:"y = x²",color:pal.c1}],marks:[{x:2,y:3,kind:"gem",label:"T(2,3)"}],points:[P],customDraw:function(){var p=P.x,k=2*p;drawFuncLine(function(x){return p*p+k*(x-p)},state.scene.view.xmin,state.scene.view.xmax,pal.c2,[12,8],3,null)},goals:[{id:"g1",label:"第一条过T的切线（切点在左侧）",pts:["P"],lockPts:false,inRange:function(){return ABS(dev())<.28&&P.x<2},snap:function(){P.x=1}},{id:"g2",label:"第二条过T的切线（切点在右侧）",pts:["P"],lockPts:true,inRange:function(){return ABS(dev())<.28&&P.x>2},snap:function(){P.x=3;P.locked=true}}],readouts:[{label:"切点",val:function(){return"P("+fmt(P.x)+", "+fmt(P.x*P.x)+")"}},{label:"k = 2x",val:function(){return fmt(2*P.x)}},{label:"切线过T偏差",val:function(){return fmt(dev())+"（目标0）"}}]};return{key:"tanExt",kind:"canvas",name:"星门穿越 · 过定点的切线",scenes:[sc],goalCount:2,story:"过曲线外一点作切线，是切线问题的经典题型。注意：这个点不一定在曲线上，切点要另找！",noteHtml:'<p>设切点为 (x₀, x₀²)，则切线：y = x₀² + 2x₀(x − x₀)。把 T(2,3) 代入：</p><div class="formula">3 = x₀² + 2x₀(2 − x₀) = 4x₀ − x₀²　→　x₀² − 4x₀ + 3 = 0</div><div class="formula">解得 x₀ = 1 或 x₀ = 3，切点分别为 (1,1) 与 (3,9)</div><p>两条切线：x₀=1 时 y = 2x−1；x₀=3 时 y = 6x−9。</p><p class="starLine">方法总结：『点在切线上』代入切线方程，是求过定点切线的通用钥匙。</p>'}}function buildParabMeet(){var P={id:"P",name:"P",curve:0,x:.4,touched:false};var Q={id:"Q",name:"Q",curve:0,x:1.5,touched:false};var A={id:"A",name:"A",free:true,x:1.5,y:-5.5,touched:false};var gP={id:"gP",label:"P 拖到横坐标 4",pts:["P"],lockPts:true,inRange:function(){return ABS(P.x-4)<.32},snap:function(){P.x=4;P.locked=true}};var gQ={id:"gQ",label:"Q 拖到横坐标 −2",pts:["Q"],lockPts:true,inRange:function(){return ABS(Q.x+2)<.32},snap:function(){Q.x=-2;Q.locked=true}};var gA={id:"gA",label:"A 放到两切线交点处",pts:["A"],lockPts:true,inRange:function(){return gP.done&&gQ.done&&ABS(A.x-1)<.35&&ABS(A.y+4)<.35},snap:function(){A.x=1;A.y=-4;A.locked=true},onHit:function(){showToast("交点A的纵坐标 = −4",3200)}};var sc={brief:"抛物线 x² = 2y（即 y = x²/2，y′ = x）上，P 的横坐标为 4，Q 的横坐标为 −2。先把 P、Q 拖到指定横坐标（看虚线引导标），两条光尺亮起后，再把交点星A拖到两切线相交的位置！",view:{xmin:-4.6,xmax:5.6,ymin:-6.8,ymax:13.6},curves:[{f:function(x){return x*x/2},label:"y = x²/2（x²=2y）",color:pal.c1,from:-5,to:5.2}],marks:[{x:4,y:0,kind:"cross",label:"P横坐标=4"},{x:-2,y:0,kind:"cross",label:"Q横坐标=−2"}],points:[P,Q,A],customDraw:function(){drawVGuide(4,8,pal.c3);drawVGuide(-2,2,pal.c3);[P.x,Q.x].forEach(function(t,i){drawFuncLine(function(x){return t*x-t*t/2},state.scene.view.xmin,state.scene.view.xmax,i===0?pal.c2:pal.c3,[12,8],3,null)})},goals:[gP,gQ,gA],readouts:[{label:"k_P = y′",val:function(){return fmt(P.x)}},{label:"k_Q = y′",val:function(){return fmt(Q.x)}},{label:"A 坐标",val:function(){return"("+fmt(A.x)+", "+fmt(A.y)+")"}}]};return{key:"parabMeet",kind:"canvas",name:"双尺交汇 · 抛物线两切线",scenes:[sc],goalCount:3,story:"两条切线的交点怎么求？先分别写出两条切线方程，再联立！（本关源自测评卷第3题）",noteHtml:'<p>抛物线 x² = 2y 即 y = x²/2，则 y′ = x。</p><div class="formula">P(4,8) 处：k_P = 4，切线 y = 4(x−4)+8 = 4x − 8</div><div class="formula">Q(−2,2) 处：k_Q = −2，切线 y = −2(x+2)+2 = −2x − 2</div><div class="formula">联立：4x − 8 = −2x − 2　→　x = 1，y = −4</div><p class="starLine">所以两切线交点 A 的纵坐标为 −4。方法：切线方程 → 联立求解。</p>'}}function buildBalanceLevel(){var sl={id:"c",label:"c",min:-9,max:1,value:0};var sc={brief:"函数 f(x) = x³ + c·x² + 2x − 1，其中 c 恰好等于 f′(1)（它是个未知数！）。拖动滑块选一个 c：天平左盘放「你选的 c」，右盘放「按这个 c 算出的 f′(1) = 3+2c+2 = 5+2c」。天平平衡时，你选的 c 才真正等于 f′(1)！曲线也会随 c 实时变形哦。",view:{xmin:-2.6,xmax:2.6,ymin:-6,ymax:6},curves:[{f:function(x){return x*x*x+sl.value*x*x+2*x-1},label:"y = x³ + c·x² + 2x − 1",color:pal.c1,from:-2.2,to:2.2}],sliders:[sl],balance:{left:function(){return sl.value},right:function(){return 5+2*sl.value}},points:[],goals:[{id:"g1",label:"天平平衡：c = 5 + 2c",pts:[],inRange:function(){return ABS(sl.value-(5+2*sl.value))<.09},snap:function(){sl._sync(-5)},onHit:function(){showToast("f′(1) = c = −5，于是 f′(2) = 3·4 + 2·(−5)·2 + 2 = −6",4200)}}],readouts:[{label:"你选的 c",val:function(){return fmt(sl.value)}},{label:"算出的 f′(1) = 5+2c",val:function(){return fmt(5+2*sl.value)}},{label:"左右差",val:function(){return fmt(sl.value-(5+2*sl.value))+"（目标0）"}}]};return{key:"balance",kind:"canvas",name:"匠心天平 · 待定系数",scenes:[sc],goalCount:1,story:"f(x)=x³+x²f′(1)+2x−1 型的『自我指涉』题怎么处理？先求导、再代 x=1 建立方程！（本关源自测评卷第4题）",noteHtml:'<p>f(x) = x³ + c·x² + 2x − 1（记 c = f′(1)），求导：</p><div class="formula">f′(x) = 3x² + 2c·x + 2</div><div class="formula">代入 x = 1：f′(1) = 3 + 2c + 2 = 5 + 2c，而 f′(1) = c</div><div class="formula">所以 c = 5 + 2c，解得 c = −5，即 f′(x) = 3x² − 10x + 2</div><div class="formula">f′(2) = 12 − 20 + 2 = −6</div><p class="starLine">方法总结：把 f′(1) 当作未知数，在等式两边同时出现时『解方程』。</p>'}}function buildParalDist(){var A={id:"A",name:"A",curve:0,x:2.6,touched:false};function dist(){var x=A.x;return ABS(2*x-LN(x)-1)/SQRT(5)}var sc={brief:"星尘曲线 y = ln x 旁有一条星光走廊 l: y = 2x − 1。拖动切点A，让切线与走廊平行（即 1/x = 2）。平行的那一刻，A 到走廊的距离就是整条曲线到走廊的最小距离！",view:{xmin:.02,xmax:4.3,ymin:-3.2,ymax:2.9},curves:[{f:LN,label:"y = ln x",color:pal.c1}],lines:[{f:function(x){return 2*x-1},color:pal.c2,dash:[12,8],width:3,label:"l: y = 2x−1"}],points:[A],customDraw:function(){var x0=A.x,y0=LN(x0);drawFuncLine(function(x){return y0+(x-x0)/x0},state.scene.view.xmin,state.scene.view.xmax,pal.c3,[10,7],3,null)},goals:[{id:"g1",label:"切线与 l 平行（k = 2）",pts:["A"],lockPts:true,inRange:function(){return ABS(1/A.x-2)<.14},snap:function(){A.x=.5;A.locked=true},onHit:function(){showToast("最近距离 = ln2/√5 ≈ 0.31",3400)}}],readouts:[{label:"切点",val:function(){return"A("+fmt(A.x)+", "+fmt(LN(A.x))+")"}},{label:"k = y′ = 1/x",val:function(){return fmt(1/A.x)}},{label:"A到l距离",val:function(){return fmt(dist())}}]};return{key:"paralDist",kind:"canvas",name:"最近星距 · 平行切线",scenes:[sc],goalCount:1,story:"曲线到直线的最小距离，藏在『平行切线』的切点处！（本关源自测评卷第9题）",noteHtml:'<p>切线与 l 平行 ⇔ 斜率相等：</p><div class="formula">1/x₀ = 2　→　x₀ = 1/2，切点 A(1/2, ln(1/2)) = (1/2, −ln2)</div><div class="formula">最小距离 d = |2·(1/2) − (−ln2) − 1| / √(2²+1²) = ln2/√5 ≈ 0.31</div><p class="starLine">方法总结：最小距离点处的切线斜率 = 已知直线斜率（点到直线距离公式收尾）。</p>'}}function buildCommonTan(){var P={id:"P",name:"P",curve:0,x:-2.4,touched:false};var Q={id:"Q",name:"Q",curve:1,x:2.4,touched:false};function kP(){return 2*P.x}function kQ(){return Q.x}function bP(){return-P.x*P.x}function bQ(){return 1-Q.x*Q.x/2}function gap(){return ABS(bQ()-bP())}var sc={brief:"两条星轨 C₁: y = x² 与 C₂: y = ½x² + 1 需要公共光尺（公切线）！同时拖动两轨上的切点 P、Q，让两条切线重合：斜率相等（k₁ = k₂）且截距相等。这样的公切线有两条，都要找出来！",view:{xmin:-3.3,xmax:3.3,ymin:-2.9,ymax:6.3},curves:[{f:function(x){return x*x},label:"C₁: y = x²",color:pal.c1},{f:function(x){return .5*x*x+1},label:"C₂: y = ½x²+1",color:pal.c2}],points:[P,Q],customDraw:function(){var v=state.scene.view;drawFuncLine(function(x){return kP()*x+bP()},v.xmin,v.xmax,pal.c3,[12,8],3,null);drawFuncLine(function(x){return kQ()*x+bQ()},v.xmin,v.xmax,pal.accent,[4,8],3,null)},goals:[{id:"g+",label:"右侧公切线（P 在右半轨）",pts:["P","Q"],lockPts:false,inRange:function(){return ABS(kP()-kQ())<.16&&gap()<.32&&P.x>0},snap:function(){P.x=1;Q.x=2}},{id:"g−",label:"左侧公切线（P 在左半轨）",pts:["P","Q"],lockPts:true,inRange:function(){return ABS(kP()-kQ())<.16&&gap()<.32&&P.x<0},snap:function(){P.x=-1;Q.x=-2;P.locked=true;Q.locked=true}}],readouts:[{label:"k₁ = 2x_P",val:function(){return fmt(kP())}},{label:"k₂ = x_Q",val:function(){return fmt(kQ())}},{label:"截距差",val:function(){return fmt(gap())+"（目标0）"}}]};return{key:"commonTan",kind:"canvas",name:"同心双尺 · 公切线",scenes:[sc],goalCount:2,story:"公切线 = 一条线同时是两条曲线的切线：斜率相等 + 截距相等，两个条件同时成立！（源自测评卷第15题的公切线思想）",noteHtml:'<p>设公切线与 C₁ 切于横坐标 a、与 C₂ 切于横坐标 b：</p><div class="formula">C₁ 切线：y = 2a·x − a²；　C₂ 切线：y = b·x + 1 − b²/2</div><div class="formula">斜率相等：2a = b；截距相等：−a² = 1 − b²/2 = 1 − 2a²</div><div class="formula">解得 a² = 1，即 a = 1（b=2）或 a = −1（b=−2）</div><p>两条公切线：y = 2x − 1 与 y = −2x − 1。</p><p class="starLine">方法总结：公切线问题的关键是『一点一导』分别写切线，再让两条切线相同。</p>'}}function buildSliderTan(){var sl={id:"a",label:"a",min:-4.5,max:4.5,value:2.6};function disc(){return(sl.value-1)*(sl.value-1)-4}function roots(){var d=disc();if(d<-1e-9)return[];if(d<1e-9){var r=-(sl.value-1)/2;return[r]}var s=SQRT(d);return[(-(sl.value-1)-s)/2,(-(sl.value-1)+s)/2]}var g1={id:"gm",label:"相切情形（a 为负）",pts:[],inRange:function(){return ABS(disc())<.07&&sl.value<1},snap:function(){sl._sync(-1)}};var g2={id:"gp",label:"相切情形（a 为正）",pts:[],inRange:function(){return ABS(disc())<.07&&sl.value>1},snap:function(){sl._sync(3)}};var sc={brief:"星光尺 l: y = x − 1 已经架好（它正是曲线 y = x·ln x 在 A(1,0) 处的切线，因为 f′(x)=1+lnx，f′(1)=1）。现在拖动滑块改变抛物线 g: y = x² + a·x，让 g 与 l 恰好只有一个交点（相切）。判别式 Δ = (a−1)² − 4 归零的那一刻，就相切啦！两种相切位置都要找到。",view:{xmin:-3.5,xmax:3.5,ymin:-3.7,ymax:6.5},curves:[{f:function(x){return x*x+sl.value*x},label:"g: y = x² + a·x",color:pal.c1}],lines:[{f:function(x){return x-1},color:pal.c2,dash:[12,8],width:3,label:"l: y = x − 1"}],sliders:[sl],points:[],customDraw:function(){var rs=roots();rs.forEach(function(r){var px=VX(r),py=VY(r-1);bctx.beginPath();bctx.arc(px,py,rs.length===1?11:7,0,PI*2);bctx.fillStyle=pal.c3;bctx.fill();bctx.lineWidth=3;bctx.strokeStyle="#ffffff";bctx.stroke();if(rs.length===1){bctx.fillStyle=pal.c3;bctx.font='bold 17px "Microsoft YaHei", sans-serif';bctx.textAlign="center";bctx.textBaseline="bottom";bctx.fillText("切点("+fmt(r,1)+", "+fmt(r-1,1)+")",px,py-14)}})},goals:[g1,g2],readouts:[{label:"参数 a",val:function(){return fmt(sl.value)}},{label:"Δ = (a−1)²−4",val:function(){return fmt(disc())}},{label:"交点数",val:function(){return""+roots().length}}]};return{key:"sliderTan",kind:"canvas",name:"切点独秀 · 滑块调相切",scenes:[sc],goalCount:2,story:"直线与抛物线相切 ⇔ 联立方程有重根 ⇔ 判别式为零。亲手滑一滑，把 Δ 调到 0！（本关源自测评卷第13题）",noteHtml:'<p>背景：f(x) = x·ln x，f′(x) = 1 + ln x，故 f′(1) = 1，l: y = x − 1 是 f 在 A(1,0) 处的切线。</p><p>相切条件：x² + a·x = x − 1 有唯一解，即</p><div class="formula">x² + (a−1)x + 1 = 0 有重根 ⇔ Δ = (a−1)² − 4 = 0</div><div class="formula">解得 a = −1（切点 x=1）或 a = 3（切点 x=−1）</div><p class="starLine">方法总结：『相切』翻译成『判别式 = 0』，是曲线位置关系问题的常用桥梁。</p>'}}function buildConstArea(){var P={id:"P",name:"P",curve:0,x:4.6,touched:false};function f(x){return x-3/x}function fp(x){return 1+3/(x*x)}function tangY(x){var x0=P.x;return f(x0)+fp(x0)*(x-x0)}function yInt(){return-6/P.x}function xCross(){return 2*P.x}var zones=[[.6,1.2],[1.6,2.2],[2.6,3.4]];var sc={brief:"神秘订单：曲线 y = x − 3/x（x>0）上任一点处的切线，与 y 轴、直线 y = x 围成一个三角形（发光区域）。拖动切点P巡游三个星域，盯住面积读数——你会发现一个永恒的秘密！",view:{xmin:-1.5,xmax:7.7,ymin:-11.2,ymax:8.6},curves:[{f,label:"y = x − 3/x（x>0）",color:pal.c1,from:.19,to:7.7}],lines:[{f:function(x){return x},color:pal.c2,dash:[12,8],width:3,label:"y = x"}],zones:zones.map(function(z){return{x1:z[0],x2:z[1]}}),points:[P],customDraw:function(){var x0=P.x;bctx.beginPath();bctx.moveTo(VX(0),VY(0));bctx.lineTo(VX(0),VY(yInt()));bctx.lineTo(VX(xCross()),VY(xCross()));bctx.closePath();bctx.fillStyle="rgba(255,209,102,0.20)";bctx.fill();bctx.lineWidth=2;bctx.strokeStyle=pal.c3;bctx.stroke();drawFuncLine(tangY,.05,state.scene.view.xmax,pal.c3,[10,7],3,null);bctx.fillStyle=pal.tx;bctx.font='16px "Microsoft YaHei", sans-serif';bctx.textAlign="left";bctx.textBaseline="middle";bctx.fillText("(0, "+fmt(yInt(),1)+")",VX(0)+8,VY(yInt())-12);bctx.fillText("("+fmt(xCross(),1)+", "+fmt(xCross(),1)+")",VX(xCross())-10,VY(xCross())-16)},goals:zones.map(function(z,i){return{id:"z"+i,label:"巡游星域"+(i+1),pts:["P"],lockPts:false,inRange:function(){return P.x>=z[0]&&P.x<=z[1]},snap:function(){P.pulse=performance.now()}}}),readouts:[{label:"切点横坐标 x₀",val:function(){return fmt(P.x)}},{label:"切线与y轴交点",val:function(){return"(0, "+fmt(yInt())+")"}},{label:"与y=x交点",val:function(){return"("+fmt(xCross())+", "+fmt(xCross())+")"}},{label:"三角形面积 S",val:function(){return fmt(.5*ABS(yInt())*ABS(xCross()))}}]};return{key:"constArea",kind:"canvas",name:"定值星域 · 面积秘密",scenes:[sc],goalCount:3,story:"曲线上任意一点的切线，与两条定直线围成的三角形面积居然是定值？拖动切点亲手验证！（本关源自测评卷第14题）",noteHtml:'<p>背景：曲线 y = f(x) 在点 (2, f(2)) 处的切线为 7x − 4y − 12 = 0，可解得 f(x) = x − 3/x（f′(2)=7/4，f(2)=1/2）。</p><p>设切点 P(x₀, y₀)，切线：y = (1 + 3/x₀²)x − 6/x₀。</p><div class="formula">令 x = 0：与 y 轴交于 (0, −6/x₀)；令 y = x：交于 (2x₀, 2x₀)</div><div class="formula">S = ½ · |−6/x₀| · |2x₀| = ½ · (6/x₀) · (2x₀) = 6</div><p class="starLine">面积恒为定值 6——与切点位置无关！x₀ 被约掉的那一刻，就是定值的证明。</p>'}}function buildMeetPro(){var pairs=pick([[3,-4],[4,-2],[5,-1],[2,-3],[3,-1],[5,-2]]);var pairs2=pick([[3,-4],[4,-2],[5,-1],[2,-3],[3,-1]]);function makeScene(pq){var p=pq[0],q=pq[1];var ax=(p+q)/2,ay=p*q/2;var P={id:"P",name:"P",curve:0,x:.3+Math.random(),touched:false};var Q={id:"Q",name:"Q",curve:0,x:Math.random(),touched:false};var A={id:"A",name:"A",free:true,x:.5,y:-6-Math.random()*2,touched:false};var gP={id:"gP",label:"P 拖到横坐标 "+p,pts:["P"],lockPts:true,inRange:function(){return ABS(P.x-p)<.32},snap:function(){P.x=p;P.locked=true}};var gQ={id:"gQ",label:"Q 拖到横坐标 "+q,pts:["Q"],lockPts:true,inRange:function(){return ABS(Q.x-q)<.32},snap:function(){Q.x=q;Q.locked=true}};var gA={id:"gA",label:"A 放到两切线交点",pts:[
