<script>
'use strict';
/* =====================================================================
   等差星河 · 求和工坊
   核心题型来源：docx《4.2.3 等差数列的前n项和》
   —— 高斯配对法 / Sₙ 与 aₙ 的差分关系 / Sₙ 最值与 |aₙ| 求和
   ===================================================================== */

/* ---------- 小工具 ---------- */
function shuffle(arr){ // 洗牌（反重复机制：每局随机）
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function $(id){ return document.getElementById(id); }
function fmtNum(v){ // 分数友好显示
  if(Math.abs(v-Math.round(v))<1e-9) return String(Math.round(v));
  return String(Math.round(v*1000)/1000);
}
function setHint(msg, isErr){
  var h=$('hintbar');
  h.textContent=msg||'';
  h.className= isErr?'err':'';
}

/* =====================================================================
   一、题库数据（均改编自 docx 例题/变式/高考真题，另按同题型自创变式补充）
   ===================================================================== */

/* 初级题库：高斯配对（例1-1、例3-7、例26 九章算术、名师点评高斯经典、自创变式） */
var L1_BANK=[
 {id:'L1a',src:'改编自 例1-1',
  cond:'等差数列 {aₙ} 的前 8 项如星光石所示：2，4，6，8，10，12，14，16（首项 a₁=2，公差 d=2）。请先把它们两两配对，再启动求和机器，算出前 8 项和 S₈。',
  seq:['2','4','6','8','10','12','14','16'],
  vals:[2,4,6,8,10,12,14,16],
  n:8,pairs:4,pairSum:18,middle:null,Sn:72,
  sumOrbs:[18,14,16],cntOrbs:[4,8,2],
  reveal:'【思路】首尾配对（高斯配对法）。\n2+16=18，4+14=18，6+12=18，8+10=18，每一对的和都是 18，共 4 对。\nS₈ = 4 × 18 = 72，即 S₈ = 8×(a₁+a₈)÷2 = 8×(2+16)÷2 = 72。'},
 {id:'L1b',src:'改编自 例3-7',
  cond:'等差数列 {aₙ}：16，14，12，…（首项 a₁=16，公差 d=-2）。星光石上是它的前 6 项。请两两配对，再启动机器求出 S₆。',
  seq:['16','14','12','10','8','6'],
  vals:[16,14,12,10,8,6],
  n:6,pairs:3,pairSum:22,middle:null,Sn:66,
  sumOrbs:[22,18,16],cntOrbs:[3,6,2],
  reveal:'【思路】首尾配对。\n16+6=22，14+8=22，12+10=22，每对和为 22，共 3 对。\nS₆ = 3 × 22 = 66 = 6×(16+6)÷2。'},
 {id:'L1c',src:'改编自 例26《九章算术》',
  cond:'《九章算术》「五人分五钱」：甲、乙、丙、丁、戊五人分 5 钱，甲乙两人所得之和与丙丁戊三人所得之和相等，且五人所得依次成等差数列，即为星光石上的 4/3，7/6，1，5/6，2/3（单位：钱）。请配对求出五人所得总和。',
  seq:['4/3','7/6','1','5/6','2/3'],
  vals:[4/3,7/6,1,5/6,2/3],
  n:5,pairs:2,pairSum:2,middle:1,Sn:5,
  sumOrbs:[2,'5/3','7/6'],cntOrbs:[2,5,3],
  reveal:'【解析】设五人所得为 a-2d, a-d, a, a+d, a+2d。\n由「上二人所得与下三人等」：(a-2d)+(a-d) = a+(a+d)+(a+2d)，得 2a-3d = 3a+3d，即 a = -6d。\n总和 5a = 5，得 a=1，d=-1/6，即 4/3，7/6，1，5/6，2/3。\n配对：4/3+2/3 = 2，7/6+5/6 = 2，中间项为 1，S₅ = 2×2+1 = 5（钱）。'},
 {id:'L1d',src:'同题型自创变式',
  cond:'等差数列 {aₙ} 的前 6 项如星光石所示：-3，1，5，9，13，17（首项 a₁=-3，公差 d=4）。请两两配对，再启动机器求出 S₆。',
  seq:['-3','1','5','9','13','17'],
  vals:[-3,1,5,9,13,17],
  n:6,pairs:3,pairSum:14,middle:null,Sn:42,
  sumOrbs:[14,4,10],cntOrbs:[3,6,5],

var G={diff:null,qs:[],idx:0,steps:0,t0:0,timer:null,themeIdx:0,q:null,revealed:[false,false,false]};

function showScreen(name){
  $('screen-home').hidden = (name!=='home');

}
function applyTheme(){ // 每局随机主题色（G8）
  G.themeIdx=Math.floor(Math.random()*THEMES.length);
  document.body.setAttribute('data-theme',String(G.themeIdx));
  $('hud-theme').textContent='主题：'+THEMES[G.themeIdx];
}
function startTimer(){
  stopTimer();
  G.t0=Date.now();
  G.timer=setInterval(function(){
    var s=Math.floor((Date.now()-G.t0)/1000);
    var mm=String(Math.floor(s/60)).padStart(2,'0');
    var ss=String(s%60).padStart(2,'0');
    $('hud-timer').textContent=mm+':'+ss;
  },500);
}
function stopTimer(){ if(G.timer){clearInterval(G.timer);G.timer=null;} }
function addStep(){ G.steps++; $('hud-steps').textContent='步数 '+G.steps; }

/* 开始一局：随机抽 3 题、随机主题 */
function startRound(diff){
  G.diff=diff;
  G.qs=shuffle(BANKS[diff]).slice(0,3);
  G.idx=0; G.steps=0; G.revealed=[false,false,false];
  $('hud-steps').textContent='步数 0';
  $('hud-timer').textContent='00:00';
  showScreen('game');
  applyTheme();
  startTimer();
  renderQ();      /* 先渲染第一题，规则弹窗会覆盖其上 */
  openRules();
}
function nextQ(){
  G.idx++;
  if(G.idx>=G.qs.length){ finishRound(); return; }
  renderQ();
}
function finishRound(){
  stopTimer();
  var used=Math.floor((Date.now()-G.t0)/1000);
  var mm=String(Math.floor(used/60)).padStart(2,'0'), ss=String(used%60).padStart(2,'0');
  var stars=0;
  for(var i=0;i<G.revealed.length;i++){ if(!G.revealed[i]) stars++; }
  $('win-stats').textContent='用时 '+mm+':'+ss+' · 共 '+G.steps+' 步 · 完成难度「'+DIFF_NAME[G.diff]+'」';
  $('win-stars').textContent='★★★★★'.slice(0,stars)+'☆☆☆☆☆'.slice(0,3-stars);
  $('overlay-win').classList.add('show');
  launchConfetti();
}

/* =====================================================================
   三、通用拖拽系统（指针事件，支持触摸；轻点=选中，再点目标=放置）
   ===================================================================== */
var selectedTile=null; // 点击选中模式的当前星光石

function clearHighlights(){
  var els=document.querySelectorAll('.drop-ok');
  for(var i=0;i<els.length;i++) els[i].classList.remove('drop-ok');
}
function findTarget(targets,x,y){
  var best=null,bestArea=Infinity;
  for(var i=0;i<targets.length;i++){
    if(!targets[i]||!targets[i].el) continue;
    var r=targets[i].el.getBoundingClientRect();
    var pad=14; // 容差适当收紧，避免相邻目标争抢落点
    if(x>=r.left-pad&&x<=r.right+pad&&y>=r.top-pad&&y<=r.bottom+pad){
      /* 面积按"扩边后的矩形"计算，重叠时优先命中更贴身的那个 */
      var area=((r.right-r.left)+pad*2)*((r.bottom-r.top)+pad*2);
      if(area<bestArea){bestArea=area;best=targets[i];}
    }
  }
  return best;
}
function highlightTargets(targets,x,y){
  clearHighlights();
  var t=findTarget(targets,x,y);
  if(t) t.el.classList.add('drop-ok');
}
/* getTargets: 返回 [{el,data}]；onDrop(tile,target|null)；onClick(tile) */
function makeDraggable(tile,getTargets,onDrop,onClick){
  tile.addEventListener('pointerdown',function(e){
    if(tile.classList.contains('locked')) return;
    e.preventDefault();
    var rect=tile.getBoundingClientRect();
    var ghost=tile.cloneNode(true);
    ghost.classList.add('drag-ghost');
    ghost.classList.remove('sel');
    ghost.style.left=rect.left+'px'; ghost.style.top=rect.top+'px';
    ghost.style.width=rect.width+'px'; ghost.style.height=rect.height+'px';
    document.body.appendChild(ghost);
    var sx=e.clientX, sy=e.clientY, moved=false;
    function mm(ev){
      var dx=ev.clientX-sx, dy=ev.clientY-sy;
      if(Math.abs(dx)>6||Math.abs(dy)>6) moved=true;
      ghost.style.left=(rect.left+dx)+'px';
      ghost.style.top=(rect.top+dy)+'px';
      highlightTargets(getTargets(),ev.clientX,ev.clientY);
    }
    function mu(ev){
      window.removeEventListener('pointermove',mm);
      window.removeEventListener('pointerup',mu);
      ghost.remove();
      clearHighlights();
      if(!moved){ if(onClick) onClick(tile); return; }
      var t=findTarget(getTargets(),ev.clientX,ev.clientY);
      onDrop(tile,t);
    }
    window.addEventListener('pointermove',mm);
    window.addEventListener('pointerup',mu);
  });
}
function shakeEl(el){
  el.classList.remove('shake');
  void el.offsetWidth;
  el.classList.add('shake');
}
/* 通用：点击选中 → 点击槽放置 的兜底交互 */
function setupClickPlace(tile,placeFn){
  tile.addEventListener('click',function(){
    if(tile.classList.contains('locked')) return;
    if(selectedTile===tile){
      tile.classList.remove('sel'); selectedTile=null; return;
    }
    if(selectedTile) selectedTile.classList.remove('sel');
    selectedTile=tile; tile.classList.add('sel');
    setHint('已选中一块，再点击要放置的凹槽即可放下');
  });
}

    var t=document.createElement('div');
    t.className='tile';
    t.innerHTML='<span class="t-val">'+q.seq[i]+'</span><span class="t-sub">a<sub>'+(i+1)+'</sub></span>';
    t.dataset.idx=String(i);
    tray.appendChild(t);
  });

  function allSlots(){ // 当前所有空槽（作为拖拽目标）
    var arr=[];
    pairSlots.forEach(function(ps){
      if(!ps[0].firstElementChild) arr.push({el:ps[0]});
      if(!ps[1].firstElementChild) arr.push({el:ps[1]});
    });
    if(centerSlot&&!centerSlot.firstElementChild) arr.push({el:centerSlot});
    return arr;
  }
  function place(tile,slot){
    if(slot.firstElementChild){ setHint('这个槽已经有星光石啦，先点击槽里的石头可以取回',true); return; }
    slot.appendChild(tile);
    tile.classList.add('placed');
    addStep();
    checkPairs();
  }
  function takeBack(slot){
    var t=slot.firstElementChild;
    if(t){ tray.appendChild(t); t.classList.remove('placed'); setHint(''); }
  }

  /* 拖拽 + 点击放置 */
  Array.prototype.forEach.call(tray.children,function(tile){
    makeDraggable(tile,allSlots,function(tile,tgt){
      if(!tgt){ tray.appendChild(tile); tile.classList.remove('placed'); return; }
      place(tile,tgt.el);
    },null);
    setupClickPlace(tile,null);
  });
  /* 槽：点击取回；点击=放置选中的石头 */
  function bindSlot(slot){
    slot.addEventListener('click',function(){
      if(selectedTile){
        var t=selectedTile;
        selectedTile.classList.remove('sel'); selectedTile=null;
        place(t,slot);
        return;
      }
      takeBack(slot);
    });
  }
  pairSlots.forEach(function(ps){ bindSlot(ps[0]); bindSlot(ps[1]); });
  if(centerSlot) bindSlot(centerSlot);

  $('l1-clear').addEventListener('click',function(){
    Array.prototype.forEach.call(zone.querySelectorAll('.slot'),function(s){ takeBack(s); });
    setHint('已清空，重新配对吧');
  });

  /* 配对检查：所有对的和必须相等（等价于首尾对称配对） */
  function checkPairs(){
    var unfilled=0;
    pairSlots.forEach(function(ps){ if(!ps[0].firstElementChild||!ps[1].firstElementChild) unfilled++; });
    if(centerSlot&&!centerSlot.firstElementChild) unfilled++;
    if(unfilled>0){ setHint('还剩 '+unfilled+' 块星光石没有归位'); return; }
    var sums=[],ok=true;
    pairSlots.forEach(function(ps){
      var va=q.vals[parseInt(ps[0].firstElementChild.dataset.idx,10)];
      var vb=q.vals[parseInt(ps[1].firstElementChild.dataset.idx,10)];
      var s=Math.round((va+vb)*1000)/1000;
      sums.push(s);
      ps[2].querySelector('.p-sum').textContent=fmtNum(s);
      if(Math.abs(s-sums[0])>1e-6){ ok=false; ps[2].classList.add('bad'); ps[2].classList.remove('ok'); }
      else { ps[2].classList.add('ok'); ps[2].classList.remove('bad'); }
    });
    if(!ok){
      setHint('有的配对和不相等哦。想一想：第一块和最后一块配成一对，和是多少？',true);
      return;
    }
    /* 中间项自动读入机器 */
    if(centerSlot){
      var mv=q.vals[parseInt(centerSlot.firstElementChild.dataset.idx,10)];
      $('m-mid').textContent=fmtNum(mv)+'（中间项）';
    }
    setHint('配对成功！每对的和都是 '+fmtNum(sums[0])+'，快去启动求和机器');
    Array.prototype.forEach.call(zone.querySelectorAll('.tile'),function(t){ t.classList.add('locked'); });
    $('l1-machine').hidden=false;
  }

  /* 求和机器：数字珠（候选项来自题库设计，各不重复，唯一正确） */
  function makeOrbs(rowId,slotId,want,orbVals){
    var row=$(rowId), slot=$(slotId);
    shuffle(orbVals).forEach(function(v){
      var o=document.createElement('div');
      o.className='orb';
      o.textContent=(typeof v==='number')?fmtNum(v):String(v);
      row.appendChild(o);
      makeDraggable(o,function(){ return [{el:slot}]; },function(orb,tgt){
        if(!tgt) return;
        var okDrop=(typeof v==='number')&&(Math.abs(v-want)<1e-9);
        if(okDrop){
          slot.textContent=fmtNum(v);
          slot.classList.add('filled');
          orb.classList.add('used');
          addStep();
          machineCheck();
        }else{
          shakeEl(slot); shakeEl(orb);
          setHint('这颗珠子放进去机器转不动，再想想：'+(rowId==='orb-cnt'?'一共配成了几对？':'每一对的和是多少？'),true);
          addStep();
        }
      },null);
    });
  }
  function machineCheck(){
    var c=$('m-cnt'), s=$('m-sum');
    if(c.classList.contains('filled')&&s.classList.contains('filled')){
      var cv=parseFloat(c.textContent), sv=parseFloat(s.textContent);
      var midV=(q.middle!=null)?q.middle:0;
      var res=cv*sv+midV;
      $('m-result').textContent='S'+sub(q.n)+' = '+cv+' × '+sv+(midV?(' + '+midV):'')+' = '+res;
      $('star-lamp').classList.add('on');
      setHint('求和机器启动成功！S'+sub(q.n)+' = '+res+'，星灯点亮！');
      qDone(false);
    }
  }
  makeOrbs('orb-cnt','m-cnt',q.pairs,q.cntOrbs);
  makeOrbs('orb-sum','m-sum',q.pairSum,q.sumOrbs);
}

function sub(n){ // 下标数字
  var map={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};
  return String(n).split('').map(function(ch){return map[ch]||ch;}).join('');
}

/* =====================================================================
   五、关卡2：差分熔炉（Sₙ₋₁、Sₙ 相邻两块熔出 aₙ；a₁ 上轨道判定）
   ===================================================================== */
function renderL2(q){
  var stage=$('stage');
  var N=q.S.length;
  var html='';
  html+='<div class="formula-banner">已知 '+q.formula+'，前 '+N+' 项的 S 值如下</div>';
  html+='<div class="belt" id="l2-belt"></div>';
  html+='<div class="furnaces">';
  html+=' <div class="furnace"><h4>首项熔炉</h4><div class="f-slots"><span class="f-slot" id="f1-slot">放 S₁</span></div><div class="f-note">只接受 S₁，熔出 a₁ = S₁</div></div>';
  html+=' <div class="furnace"><h4>差分熔炉</h4><div class="f-slots"><span class="f-slot" id="fd-l">Sₙ₋₁</span><span style="font-size:26px;font-weight:900;color:var(--accent)">−</span><span class="f-slot" id="fd-r">Sₙ</span><span style="font-size:26px;font-weight:900;color:var(--ok)">=</span><span class="f-slot" id="fd-out" style="border-color:var(--ok)">aₙ</span></div><div class="f-note">必须放相邻的两块（下标差 1），熔出 aₙ = Sₙ − Sₙ₋₁</div></div>';
  html+='</div>';
  html+='<div class="sec-title">熔出的通项石（收集栏）</div>';
  html+='<div class="rack" id="l2-rack"></div>';
  html+='<div class="judge" id="l2-judge" hidden>';
  html+=' <div class="j-q">n≥2 时的规律是「'+q.aPat+'」。请把 a₁ 石拖上正确的轨道：它是否符合这个规律？</div>';
  html+=' <div class="tracks">';
  html+='  <div class="track" id="trk-unify"><h5>统一公式轨道</h5><p>a₁ 也符合 n≥2 的规律，通项可以统一表示，{aₙ} 是等差数列</p></div>';
  html+='  <div class="track" id="trk-piece"><h5>分段表示轨道</h5><p>a₁ 是例外，不满足 n≥2 的规律，通项需要分段表示</p></div>';
  html+=' </div>';
  html+=' <div class="conclusion" id="l2-conc"></div>';
  html+='</div>';
  html+='<div class="next-wrap" id="l2-next" hidden><button class="btn big" type="button">下一题</button></div>';
  stage.innerHTML=html;

  var produced={}, producedCount=0;

  /* S 石 */
  var belt=$('l2-belt');
  q.S.forEach(function(v,i){
    var t=document.createElement('div');
    t.className='s-tile';
    t.innerHTML='<span class="t-val">'+fmtNum(v)+'</span><span class="t-sub">S<sub>'+(i+1)+'</sub></span>';
    t.dataset.idx=String(i+1);
    t.dataset.val=String(v);
    belt.appendChild(t);
  });

  var f1=$('f1-slot'), fl=$('fd-l'), fr=$('fd-r'), fout=$('fd-out');
  /* 记住每个槽的占位文字，清空时恢复 */
  [f1,fl,fr,fout].forEach(function(s){ s.dataset.label=s.textContent; });
  function chipIn(slot,tile){ // 在槽内放置一块迷你芯片（先清掉占位文字）
    slot.textContent='';
    var c=document.createElement('div');
    c.style.cssText='font-size:19px;font-weight:900;color:var(--text)';
    c.textContent='S'+sub(tile.dataset.idx);
    c.dataset.idx=tile.dataset.idx;
    slot.appendChild(c);
  }
  function clearSlot(slot){ slot.textContent=slot.dataset.label||''; slot.classList.remove('filled'); }

  function produceA(idx){
    var val= idx===1 ? q.S[0] : q.S[idx-1]-q.S[idx-2];
    if(produced[idx]) return;
    produced[idx]=true; producedCount++;
    var a=document.createElement('div');
    a.className='a-tile';
    a.innerHTML='<span style="font-size:22px">'+fmtNum(val)+'</span><span style="font-size:13px">a<sub>'+idx+'</sub></span>';
    $('l2-rack').appendChild(a);
    fout.textContent=fmtNum(val);
    setTimeout(function(){ if(!produced._lock) clearSlot(fout); },1200);
    setHint('熔出了 a'+sub(idx)+' = '+fmtNum(val));
    if(producedCount===N){
      setTimeout(function(){ $('l2-judge').hidden=false; setHint('通项石集齐！把 a₁ 拖上正确的轨道'); },500);
    }
  }

  /* S 石拖拽 */
  Array.prototype.forEach.call(belt.children,function(tile){
    makeDraggable(tile,function(){ return [{el:f1},{el:fl},{el:fr}]; },function(tile,tgt){
      if(!tgt) return;
      var idx=parseInt(tile.dataset.idx,10);
      if(tgt.el===f1){
        if(idx!==1){ shakeEl(f1); setHint('首项熔炉只接受 S₁（因为 a₁ = S₁）',true); addStep(); return; }
        clearSlot(f1); chipIn(f1,tile); f1.classList.add('filled');
        addStep(); produceA(1);
        setTimeout(function(){ clearSlot(f1); f1.classList.remove('filled'); },800);
        return;
      }
      if(tgt.el===fl||tgt.el===fr){
        var slot=tgt.el;
        if(slot.firstElementChild){ setHint('这一格已经有石头了，先点它可取回',true); return; }
        chipIn(slot,tile); slot.classList.add('filled');
        addStep();
        if(fl.firstElementChild&&fr.firstElementChild){
          var l=parseInt(fl.firstElementChild.dataset.idx,10), r=parseInt(fr.firstElementChild.dataset.idx,10);
          if(r===l+1){
            produceA(r);
          }else{
            shakeEl($('fd-out'));
            setHint('两块石头不相邻（下标要相差 1）：左边放 Sₙ₋₁，右边放 Sₙ',true);
          }
          /* 立即清空两格，方便连续投放（产出的 a 石飞入收集栏即是反馈） */
          clearSlot(fl); clearSlot(fr);
        }
      }
    },null);
  });
  [fl,fr,f1].forEach(function(s){ s.addEventListener('click',function(){ clearSlot(s); s.classList.remove('filled'); }); });

  /* 判定轨道：拖 a₁ */
  function bindTrack(track,isOk){
    track.addEventListener('click',function(){
      var a1tile=judgeTile();
      if(!a1tile){ setHint('请先把收集栏里的 a₁ 石拖到轨道上（或先点击选中 a₁ 再点轨道）'); return; }
      judge(track,isOk);
    });
  }
  function judgeTile(){ return $('l2-rack').querySelector('.a-tile'); }
  function judge(track,isOk){
    addStep();
    if(isOk){
      track.classList.add('win');
      $('l2-conc').textContent=q.conclusion;
      setHint('判定正确！'+q.conclusion);
      qDone(false);
    }else{
      shakeEl(track);
      setHint(q.fits?q.hintPiece:q.hintFit,true);
    }
  }
  /* a₁ 石：允许拖到两条轨道（点击选中→点轨道 也可） */
  var rack=$('l2-rack');
  var observer=new MutationObserver(function(){
    var a1=rack.querySelector('.a-tile');
    if(!a1||a1.classList.contains('armed')) return;
    a1.classList.add('armed');
    makeDraggable(a1,function(){ return [{el:$('trk-unify')},{el:$('trk-piece')}]; },function(t,tgt){
      if(!tgt) return;
      judge(tgt.el, tgt.el===$('trk-unify') ? q.fits : !q.fits);
    },null);
    a1.addEventListener('click',function(){
      if(selectedTile) selectedTile.classList.remove('sel');
      selectedTile=a1; a1.classList.add('sel');
      setHint('已选中 a₁ 石，点击一条轨道放置');
    });
  });
  observer.observe(rack,{childList:true});
  bindTrack($('trk-unify'),q.fits);
  bindTrack($('trk-piece'),!q.fits);
}

/* =====================================================================
   六、关卡3：峰顶探灯 / 翻转之门（Canvas 拖动，松手即作答）
   ===================================================================== */
function renderL3(q){
  var stage=$('stage');
  var isPeak=(q.type==='peak');
  stage.innerHTML='<div class="l3-readout" id="l3-readout"></div>'+
    '<canvas id="l3-cv"></canvas>'+
    '<div class="l3-note">按住图形左右拖动'+(isPeak?'探灯':'翻转之门')+'，松手即放置作答</div>'+
    '<div class="l3-result" id="l3-result"></div>'+
    '<div class="next-wrap" id="l3-next" hidden><button class="btn big" type="button">下一题</button></div>';

  var cv=$('l3-cv'), ctx=cv.getContext('2d');
  var N=q.N, a=[], S=[], i;
  for(i=1;i<=N;i++){ a[i]=q.a1+(i-1)*q.d; }
  S[0]=0;
  for(i=1;i<=N;i++){ S[i]=S[i-1]+a[i]; }
  /* 峰顶答案集合（可能并列，例如存在 0 项时） */
  var peakNs=[],maxS=-Infinity;
  for(i=1;i<=N;i++){ if(S[i]>maxS+1e-9){maxS=S[i];peakNs=[i];} else if(Math.abs(S[i]-maxS)<1e-9){peakNs.push(i);} }
  /* 翻转之门答案：唯一的变号边界 k（1..k 与 k+1..N 各自符号纯净） */
  var foldK=0;
  for(i=1;i<N;i++){ if((a[i]<=0)!==(a[i+1]<=0)) foldK=i; }
  var cat=function(v){ return v<=0?0:1; };

  var st={handle:isPeak?1:0.5, done:false, drag:false, flip:0, flipAnim:null};

  /* 计算几何布局 */
  var W=0,H=isPeak?470:430;
  function layout(){
    W=Math.min(960,stage.clientWidth-4);
    if(W<300) W=300;
    var dpr=window.devicePixelRatio||1;
    cv.width=W*dpr; cv.height=H*dpr;
    /* CSS 宽度与逻辑宽度严格一致，保证指针坐标映射不偏移 */
    cv.style.width=W+'px';
    cv.style.height=H+'px';
    cv.style.display='block';
    cv.style.margin='0 auto';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function css(n){ return getComputedStyle(document.body).getPropertyValue(n).trim(); }

  function draw(){
    layout();
    var main=css('--main'), accent=css('--accent'), ok=css('--ok'), warn=css('--warn'), text=css('--text');
    ctx.clearRect(0,0,W,H);
    ctx.font='700 16px "Microsoft YaHei",sans-serif';

    var padL=54,padR=18;
    var plotW=W-padL-padR;
    var xOf=function(n){ return padL+plotW*(n-0.5)/N; };
    var barW=Math.max(10,plotW/N*0.62);

    if(isPeak){
      /* 上半区：Sₙ 折线（抛物线形态） */
      var cT=34,cB=208;
      var sMin=Math.min.apply(null,S.slice(1)), sMax=Math.max.apply(null,S.slice(1));
      if(sMax-sMin<1e-9){sMax=sMin+1;}
      var yOf=function(v){ return cB-(cB-cT)*0.92*(v-sMin)/(sMax-sMin)- (cB-cT)*0.04; };
      /* 已扫过区域的填充 */
      var hn=Math.max(1,Math.min(N,Math.round(st.handle)));
      ctx.beginPath();
      ctx.moveTo(xOf(1),cB);
      for(i=1;i<=hn;i++) ctx.lineTo(xOf(i),yOf(S[i]));
      ctx.lineTo(xOf(hn),cB);
      ctx.closePath();
      ctx.fillStyle='rgba(255,255,255,0.08)';
      ctx.fill();
      /* 折线 */
      ctx.beginPath();
      for(i=1;i<=N;i++){ if(i===1)ctx.moveTo(xOf(i),yOf(S[i])); else ctx.lineTo(xOf(i),yOf(S[i])); }
      ctx.strokeStyle=main; ctx.lineWidth=4; ctx.stroke();
      for(i=1;i<=N;i++){
        ctx.beginPath();
        ctx.arc(xOf(i),yOf(S[i]),i===hn?8:5,0,Math.PI*2);
        ctx.fillStyle=(i===hn)?accent:'#ffffff';
        ctx.fill();
      }
      /* 坐标标签 */
      ctx.fillStyle=text; ctx.textAlign='right';
      ctx.fillText('Sₙ',padL-8,yOf(S[1])+6);
      ctx.textAlign='center';
      ctx.fillText('Sₙ 图象（点 (n, Sₙ)）',W/2,cT-8<20?24:cT-8);
      /* 峰值参考虚线 */
      ctx.setLineDash([6,6]);
      ctx.beginPath(); ctx.moveTo(xOf(peakNs[0]),yOf(maxS)); ctx.lineTo(xOf(N),yOf(maxS)); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle=text; ctx.textAlign='right';
      ctx.fillText('最大值 '+fmtNum(maxS),W-8,yOf(maxS)-8);
    }

    /* 下半区：aₙ 条形图 */
    var y0=isPeak?348:250;
    var upH=isPeak?96:150, dnH=isPeak?64:110;
    var aMax=Math.max(0,Math.max.apply(null,a.slice(1)));
    var aMin=Math.min(0,Math.min.apply(null,a.slice(1)));
    if(aMax<1e-9)aMax=1; if(aMin>-1e-9)aMin=-1;
    var hOf=function(v){ return v>=0? upH*v/aMax : dnH*v/aMin; };
    /* 中轴线 */
    ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(padL-14,y0); ctx.lineTo(W-6,y0); ctx.stroke();

    var kGate=Math.max(0,Math.min(N,Math.floor(Math.round(st.handle*2)/2)));
    var pureL=true,pureR=true,c0=cat(a[1]),ii;
    for(ii=1;ii<=kGate;ii++){ if(cat(a[ii])!==c0) pureL=false; }
    for(ii=kGate+1;ii<=N;ii++){ if(cat(a[ii])!==c0) pureR=false; }

    for(i=1;i<=N;i++){
      var v=a[i];
      var h=hOf(v);
      var flipNow=0;
      if(!isPeak&&st.flip>0&&v<0) flipNow=st.flip; // 翻转动画进度：非正项从轴下翻到轴上
      var drawH=h*(1-flipNow)+(-h)*flipNow;
      var top,ht;
      if(drawH>=0){ top=y0-drawH; ht=drawH; } else { top=y0; ht=-drawH; }
      ctx.fillStyle= v>=0 ? main : warn;
      if(!isPeak){
        /* 门两侧纯净着色 */
        var sidePure=(i<=kGate)?pureL:pureR;
        ctx.globalAlpha=sidePure?0.95:0.55;
      }
      roundRect(ctx,xOf(i)-barW/2,top,barW,ht,4);
      ctx.fill();
      ctx.globalAlpha=1;
      /* 非正项的翻折虚影（预览） */
      if(!isPeak&&v<0&&st.flip===0){
        ctx.setLineDash([5,4]);
        ctx.strokeStyle= (pureL&&pureR)? ok:'rgba(255,255,255,0.45)';
        ctx.lineWidth=2;
        roundRect(ctx,xOf(i)-barW/2,y0+h,barW,-h,4);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      /* n 轴标签 */
      var showLab=(N<=15)|| (i%2===1) || Math.abs(i-st.handle)<0.6;
      if(showLab){
        ctx.fillStyle=text; ctx.textAlign='center';
        ctx.fillText(String(i),xOf(i),y0+dnH+22);
      }
      /* 探灯附近的数值标注 */
      if(Math.abs(i-st.handle)<2.2||i===1||i===N){
        ctx.fillStyle=accent; ctx.textAlign='center';
        ctx.fillText(fmtNum(v),xOf(i),(v>=0? y0-hOf(v)-8 : y0-hOf(v)+20));
      }
    }
    ctx.fillStyle=text; ctx.textAlign='left';
    ctx.fillText('aₙ 条形图（非正项在轴下方）',padL-10,y0+dnH+44);

    /* 手柄（探灯 / 翻转之门） */
    var hx=xOf(isPeak?st.handle:st.handle);
    ctx.setLineDash([7,5]);
    ctx.strokeStyle=st.done?ok:accent; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(hx,isPeak?cT||30:36); ctx.lineTo(hx,y0+dnH+8); ctx.stroke();
    ctx.setLineDash([]);
    /* 手柄圆点 */
    ctx.beginPath();
    ctx.arc(hx,y0+dnH+8,13,0,Math.PI*2);
    ctx.fillStyle=st.done?ok:accent; ctx.fill();
    ctx.strokeStyle='#ffffff'; ctx.lineWidth=3; ctx.stroke();
    /* 手柄图标文字 */
    ctx.fillStyle='#1b2440'; ctx.textAlign='center'; ctx.font='900 13px sans-serif';
    ctx.fillText(isPeak?'灯':'门',hx,y0+dnH+13);
    ctx.font='700 16px "Microsoft YaHei",sans-serif';
  }

  function roundRect(c,x,y,w,h,r){
    if(h<0){ y=y+h; h=-h; }
    r=Math.min(r,w/2,h/2);
    c.beginPath();
    c.moveTo(x+r,y);
    c.arcTo(x+w,y,x+w,y+h,r);
    c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r);
    c.arcTo(x,y,x+w,y,r);
    c.closePath();
  }

  /* 读数条 */
  function readout(){
    var r=$('l3-readout');
    if(isPeak){
      var n=Math.max(1,Math.min(N,Math.round(st.handle)));
      r.innerHTML='<span>探灯位置 n = '+n+'</span><span>a'+sub(n)+' = '+fmtNum(a[n])+'</span><span class="hot">S'+sub(n)+' = '+fmtNum(S[n])+'</span>';
    }else{
      var b=Math.round(st.handle*2)/2;
      var k=Math.floor(b);
      if(k<0)k=0; if(k>N)k=N;
      var msg;
      if(k===0) msg='门在最左侧';
      else if(k===N) msg='门在最右侧';
      else msg='门在第 '+k+' 项 与 第 '+(k+1)+' 项 之间';
      r.innerHTML='<span>'+msg+'</span><span class="hot">松手时两侧符号都纯净才算放对</span>';
    }
  }

  /* 指针交互（监听器带归属校验，防止跨题残留） */
  function xToN(clientX){
    var rect=cv.getBoundingClientRect();
    var padL=54,padR=18,plotW=W-padL-padR;
    var nx=(clientX-rect.left-padL)/plotW*N+0.5;
    if(isPeak) return Math.max(1,Math.min(N,nx));
    return Math.max(0.5,Math.min(N-0.5,nx)); // 门只能放在相邻两项之间：0.5 ~ N-0.5
  }
  cv.addEventListener('pointerdown',function(e){
    if(st.done||G.q!==q) return;
    st.drag=true;
    st.handle=xToN(e.clientX);
    draw(); readout();
    e.preventDefault();
  });
  window.addEventListener('pointermove',function(e){
    if(G.q!==q) return;
    if(!st.drag||st.done) return;
    st.handle=xToN(e.clientX);
    draw(); readout();
  });
  window.addEventListener('pointerup',function(){
    if(G.q!==q) return;
    if(!st.drag) return;
    st.drag=false;
    if(st.done) return;
    evaluate();
  });

  function evaluate(){
    addStep();
    if(isPeak){
      var n=Math.round(st.handle);
      if(peakNs.indexOf(n)>=0){
        st.done=true; draw();
        $('l3-result').textContent='放对了！n = '+peakNs.join(' 或 ')+' 时，Sₙ 取到最大值 '+fmtNum(maxS);
        setHint('峰顶探灯点亮！'+(peakNs.length>1?'注意：数列中存在等于 0 的项，所以有两个并列的峰顶 n。':''));
        qDone(false);
      }else{
        draw();
        setHint('还不是最高处。观察下方的条形图：从第几项开始变成负数？有没有恰好等于 0 的项？',true);
        $('l3-result').textContent='';
      }
    }else{
      var b=Math.round(st.handle*2)/2;
      var k=Math.floor(b);
      if(Math.abs(k-foldK)<1e-9){
        st.done=true;
        /* 翻转动画 */
        var t0=Date.now();
        function anim(){
          var p=Math.min(1,(Date.now()-t0)/700);
          st.flip=p;
          draw();
          if(p<1){ requestAnimationFrame(anim); }
          else{
            var negSum=0,posSum=0,j;
            for(j=1;j<=N;j++){ if(a[j]<0) negSum+=a[j]; else posSum+=a[j]; }
            var T=posSum-negSum;
            $('l3-result').textContent='门放对了！非正项已翻折：T'+sub(N)+' = '+fmtNum(posSum)+' + '+fmtNum(-negSum)+' = '+fmtNum(T);
            setHint('翻转之门发光！正项部分和为 '+fmtNum(posSum)+'，非正项翻折后贡献 '+fmtNum(-negSum)+'。');
            qDone(false);
          }
        }
        anim();
      }else{
        draw();
        setHint('门两侧还有正、负混杂。继续拖动，让门左侧全是同一种符号、右侧也全是另一种符号。',true);
        $('l3-result').textContent='';
      }
    }
  }

  draw(); readout();
  window.addEventListener('resize',function(){ if(G.q===q){ draw(); } });
}

/* =====================================================================
   七、题目渲染总控 / 通关标记
   ===================================================================== */
function renderQ(){
  var q=G.qs[G.idx];
  G.q=q;
  setHint('');
  $('hud-q').textContent='第 '+(G.idx+1)+' / '+G.qs.length+' 题 · '+DIFF_NAME[G.diff];
  $('q-src').textContent=q.src;
  $('q-cond').textContent=q.cond;
  if(G.diff==='l1') renderL1(q);
  else if(G.diff==='l2') renderL2(q);
  else renderL3(q);
}

/* 当前题完成（revealed=true 表示通过揭示答案完成） */
function qDone(revealed){
  if(revealed) G.revealed[G.idx]=true;
  var q=G.q;
  var nw=document.querySelector('#stage .next-wrap');
  if(nw) nw.hidden=false;
  if(nw&&!nw._bound){
    nw._bound=true;
    nw.querySelector('button').addEventListener('click',function(){ nextQ(); });
  }
}

/* =====================================================================
   八、弹窗：规则 / 揭示答案 / 庆祝彩纸（G5/G6）
   ===================================================================== */
var RULES={
 l1:'【初级 · 配对星轨台】\n1. 星光石上是等差数列的项，把它们拖进配对槽（也可以先点击石头选中、再点击槽放下）。\n2. 目标：让每一对的和都相等——想一想，怎么分组才能做到？（点击已放好的石头可以取回）\n3. 配对成功后，把正确的数字珠拖进求和机器的凹槽：Sₙ = 对数 × 每对和（+ 中间项）。\n4. 机器算出前 n 项和，星灯点亮，进入下一题！',
 l2:'【中级 · 差分熔炉】\n1. 已知 Sₙ，求 aₙ：把 S₁ 拖进「首项熔炉」，得到 a₁ = S₁。\n2. 把相邻的两块 Sₙ₋₁（左格）、Sₙ（右格）拖进「差分熔炉」，熔出 aₙ = Sₙ − Sₙ₋₁。注意：两块必须相邻（下标差 1）！\n3. 集齐全部通项石后，把 a₁ 石拖上正确的轨道：它是否符合 n≥2 时的规律？——这一步就是「检验 n=1」。\n4. 判定正确即通关。',
 l3:'【高级 · 峰顶探灯 / 翻转之门】\n1. 按住图形，左右拖动探灯（或门），松手即放置作答。\n2. 峰顶题：把探灯放在使 Sₙ 最大的 n 处。观察下方条形图：哪一项开始变号？有没有恰好等于 0 的项？（有的话会有两个并列峰顶）\n3. 翻转之门题：把门拖到「正项」与「非正项」的分界处——两侧符号都纯净时门才发光，非正项翻折成绝对值后即可读出 Tₙ。'
};
function openRules(){
  $('rules-title').textContent='规则说明 · '+DIFF_NAME[G.diff];
  $('rules-body').textContent='每局 3 道题，从题库中随机抽取；主题色每局随机切换。\n右上角实时显示计时与步数。\n\n'+RULES[G.diff]+'\n\n提示：随时可以点顶栏的「揭示答案」查看完整解析（用了它本题就不计星星哦）。';

  $('modal-rules').classList.add('show');

$('rules-start').addEventListener('click',function(){
  $('modal-rules').classList.remove('show');
  setHint('');
});
$('btn-rules').addEventListener('click',openRules);
$('btn-rules-home').addEventListener('click',function(){
  $('rules-title').textContent='规则说明';
  $('rules-body').textContent='欢迎来到「等差星河·求和工坊」！这里围绕等差数列的前 n 项和设计了三座工坊：\n\n初级 · 配对星轨台——亲手体验高斯配对法；\n中级 · 差分熔炉——亲手执行 aₙ = Sₙ − Sₙ₋₁ 并检验 n=1；\n高级 · 峰顶探灯——在图上亲手寻找 Sₙ 的最值与 |aₙ| 的翻折求和。\n\n选择一个难度开始吧！';
  $('rules-start').textContent='知道了';
  $('modal-rules').classList.add('show');

/* 揭示答案（打开即视为已揭示，本题不再计星） */
$('btn-reveal').addEventListener('click',function(){

/* ============ 庆祝彩纸（Canvas 粒子，G5） ============ */
var confettiRAF=null;
function launchConfetti(){
  var cv=$('win-cv'), ctx=cv.getContext('2d');
  var dpr=window.devicePixelRatio||1;
  function fit(){
    cv.width=cv.clientWidth*dpr; cv.height=cv.clientHeight*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  fit();
  var cols=[cssVar('--main'),cssVar('--accent'),cssVar('--ok'),'#ffffff',cssVar('--warn')];
  function cssVar(n){ return getComputedStyle(document.body).getPropertyValue(n).trim(); }
  var parts=[];
  var W=cv.clientWidth,H=cv.clientHeight,i;
  for(i=0;i<130;i++){
    parts.push({
      x:Math.random()*W, y:-Math.random()*H*0.6,
      w:6+Math.random()*8, h:8+Math.random()*10,
      vy:1.6+Math.random()*2.6, vx:(Math.random()-0.5)*1.6,
      rot:Math.random()*Math.PI, vr:(Math.random()-0.5)*0.2,
      c:cols[i%cols.length], star:Math.random()<0.18
    });
  }
  var t0=Date.now();
  function frame(){
    ctx.clearRect(0,0,W,H);
    var i,p;
    for(i=0;i<parts.length;i++){
      p=parts[i];
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      if(p.y>H+20){ p.y=-20; p.x=Math.random()*W; }
      ctx.save();
      ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.c;
      if(p.star){
        ctx.font='700 18px sans-serif';
        ctx.fillText('★',-9,6);
      }else{
        ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      }
      ctx.restore();
    }
    /* 庆祝动画限时自动停止（约 6 秒），避免无限占用渲染 */
    var stillOpen=$('overlay-win').classList.contains('show');
    if(stillOpen&&Date.now()-t0<6000){
      confettiRAF=requestAnimationFrame(frame);
    }else{
      cancelAnimationFrame(confettiRAF); confettiRAF=null;
    }
  }
  if(confettiRAF) cancelAnimationFrame(confettiRAF);
  frame();
}

/* 初始进入首页 */
showScreen('home');
