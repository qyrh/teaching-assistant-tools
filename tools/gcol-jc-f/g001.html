<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>线段双中点·星光工坊</title>
<style>
/* ================= 全局主题（色板由 JS 每局随机注入） ================= */
:root{
  --bg:#0e1a3c; --panel:#16264f; --primary:#4da3ff; --accent:#ffd166;
  --ink:#eaf2ff; --sub:#9fb4dd; --line:#33508c;
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--bg); color:var(--ink);
  font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;
  min-height:100vh; overflow-x:hidden;
  transition:background .5s;
}
#app{ max-width:1120px; margin:0 auto; padding:8px 12px; }
.screen{ min-height:calc(100vh - 20px); }
.hidden{ display:none !important; }

/* ================= 标题屏 ================= */
#scr-title{ display:flex; align-items:center; justify-content:center; }
.title-box{ text-align:center; width:100%; max-width:640px; padding:24px 12px; }
.model-line{ position:relative; height:56px; margin:6px auto 2px; width:min(420px,86%); }
.model-line .rail{ position:absolute; left:0; right:0; top:26px; height:5px; border-radius:3px;
  background:linear-gradient(90deg,var(--primary),var(--accent)); }
.model-line .pt{ position:absolute; top:16px; width:24px; height:24px; border-radius:50%;
  background:var(--panel); border:3px solid var(--primary); }
.model-line .pt span{ position:absolute; top:-26px; left:4px; font-weight:bold; font-size:18px; color:var(--ink); }
.model-line .orb{ position:absolute; top:19px; width:17px; height:17px; border-radius:50%;
  background:var(--accent); box-shadow:0 0 14px var(--accent); animation:bob 1.6s ease-in-out infinite; }
.model-line .orb em{ position:absolute; top:-24px; left:1px; font-style:normal; font-weight:bold; font-size:16px; color:var(--accent); }
@keyframes bob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-7px);} }
.logo{ font-size:clamp(30px,6vw,46px); font-weight:900; letter-spacing:4px; margin:8px 0 4px;
  background:linear-gradient(90deg,var(--primary),var(--accent));
  -webkit-background-clip:text; background-clip:text; color:transparent; }
.slogan{ font-size:19px; color:var(--sub); margin:6px 0 22px; }
.diff-btn{ display:block; width:100%; margin:12px auto; padding:15px 20px; font-size:23px; font-weight:bold;
  color:var(--ink); background:var(--panel); border:3px solid var(--primary); border-radius:16px;
  cursor:pointer; transition:transform .12s, box-shadow .12s; text-align:left; }
.diff-btn small{ display:block; font-size:16px; font-weight:normal; color:var(--sub); margin-top:4px; }
.diff-btn:hover{ transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,.35); }
.diff-btn:active{ transform:translateY(0); }
.ghost-btn{ margin-top:16px; padding:10px 26px; font-size:18px; background:transparent; color:var(--accent);
  border:2px dashed var(--accent); border-radius:12px; cursor:pointer; }

/* ================= 游戏屏 ================= */
#scr-game{ display:flex; flex-direction:column; gap:8px; }
#hud{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
.hud-left,.hud-right{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.hud-mid{ flex:1; display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:wrap;
  font-size:19px; font-weight:bold; min-width:200px; }
#hud-stars{ color:var(--accent); letter-spacing:3px; font-size:21px; }
.chip{ background:var(--panel); border:2px solid var(--line); border-radius:10px; padding:3px 10px;
  font-size:17px; font-weight:bold; white-space:nowrap; }
.mini-btn{ padding:7px 14px; font-size:17px; font-weight:bold; color:var(--ink); background:var(--panel);
  border:2px solid var(--primary); border-radius:11px; cursor:pointer; }
.mini-btn:hover{ filter:brightness(1.2); }
.mini-btn.warm{ border-color:var(--accent); color:var(--accent); }
.mission{ font-size:20px; line-height:1.55; background:var(--panel); border:2px solid var(--line);
  border-radius:14px; padding:10px 16px; }
.mission b{ color:var(--accent); }
#stage-wrap{ width:100%; height:clamp(300px,44vh,430px); }
#stage{ width:100%; height:100%; display:block; border:2px solid var(--line); border-radius:14px;
  touch-action:none; cursor:grab; background:transparent; }
#panel{ background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:10px 14px;
  font-size:18px; line-height:1.5; min-height:70px; }
.readout{ font-size:21px; font-weight:bold; margin:2px 0; }
.readout .ok{ color:#3fe08a; }
.readout .warm{ color:var(--accent); }
.hint{ color:var(--sub); font-size:16px; margin-top:4px; }

/* 步骤清单（高级） */
.stp{ display:flex; gap:10px; align-items:center; padding:6px 8px; border-radius:10px; font-size:18px; margin:4px 0;
  border:2px solid transparent; }
.stp.act{ background:rgba(255,255,255,.07); border:2px dashed var(--accent); }
.stp.done{ opacity:.72; }
.stp .idx{ flex:0 0 30px; width:30px; height:30px; border-radius:50%; border:2px solid var(--primary);
  display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:16px; }
.stp.done .idx{ background:var(--primary); color:#08122c; }

/* 日志表（中级） */
table.log{ border-collapse:collapse; margin:6px 0 2px; }
table.log th,table.log td{ padding:4px 12px; font-size:17px; border-bottom:1px solid var(--line); text-align:center; }
table.log th{ color:var(--accent); }
.zchips{ display:flex; gap:8px; flex-wrap:wrap; margin:4px 0; }
.zchip{ padding:4px 12px; border-radius:999px; border:2px solid var(--line); font-size:16px; color:var(--sub); }
.zchip.on{ border-color:var(--accent); color:var(--accent); font-weight:bold; }

/* 比例尺滑块（中级） */
input[type=range]{ width:100%; height:34px; accent-color:var(--accent); cursor:pointer; }
.kbig{ font-size:24px; font-weight:bold; color:var(--accent); margin:2px 0; }
#fitbar{ height:14px; border-radius:7px; background:rgba(255,255,255,.12); overflow:hidden; margin:6px 0; }
#fitbar i{ display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--primary),var(--accent));
  border-radius:7px; transition:width .1s linear; }

/* ================= 遮罩弹层 ================= */
.overlay{ position:fixed; inset:0; background:rgba(3,7,18,.74); display:flex; align-items:center;
  justify-content:center; z-index:50; padding:14px; }
.ov-card{ background:var(--panel); border:3px solid var(--primary); border-radius:18px; padding:20px 24px;
  max-width:660px; width:100%; max-height:86vh; overflow:auto; font-size:19px; line-height:1.65; }
.ov-card h2{ margin:2px 0 10px; font-size:26px; color:var(--accent); letter-spacing:2px; }
.ov-card h3{ margin:14px 0 6px; font-size:20px; color:var(--primary); }
.ov-card ul{ margin:6px 0; padding-left:22px; }
.ov-card li{ margin:5px 0; }
.ov-btn{ display:inline-block; margin:10px 10px 0 0; padding:10px 22px; font-size:19px; font-weight:bold;
  color:#08122c; background:linear-gradient(90deg,var(--primary),var(--accent)); border:none;
  border-radius:12px; cursor:pointer; }
.ov-btn.plain{ background:transparent; color:var(--ink); border:2px solid var(--line); }
.ov-btn:hover{ filter:brightness(1.12); }
.bigstars{ font-size:34px; color:var(--accent); letter-spacing:8px; margin:6px 0; }
.ansline{ font-size:23px; font-weight:bold; color:#3fe08a; margin:8px 0; }

/* 庆祝动画：弹层里的星星逐颗向上浮现（translateY/opacity 动画，
   与标题屏精灵浮动同类，兼容各类图形环境） */
.bigstars .popstar{ display:inline-block; margin:0 6px; animation:starRise .5s ease-out both; }
.bigstars .popstar:nth-child(1){ animation-delay:.05s; }
.bigstars .popstar:nth-child(2){ animation-delay:.25s; }
.bigstars .popstar:nth-child(3){ animation-delay:.45s; }
@keyframes starRise{ 0%{ transform:translateY(18px); opacity:0; } 100%{ transform:translateY(0); opacity:1; } }

@media (max-width:680px){
  .mission{ font-size:17px; }
  .readout{ font-size:18px; }
  .kbig{ font-size:20px; }
  .ov-card{ font-size:17px; padding:14px 16px; }
  .hud-mid{ font-size:16px; }
  .chip{ font-size:14px; }
}
</style>
</head>
<body>
<div id="app">

  <!-- ============ 标题 / 难度选择屏 ============ -->
  <section id="scr-title" class="screen">
    <div class="title-box">
      <div class="model-line">
        <div class="rail"></div>
        <div class="pt" style="left:0;"><span>A</span></div>
        <div class="orb" style="left:26%;"><em>M</em></div>
        <div class="pt" style="left:47%;"><span>C</span></div>
        <div class="orb" style="left:64%;"><em>N</em></div>
        <div class="pt" style="right:0;"><span>B</span></div>
      </div>
      <div class="logo">线段双中点·星光工坊</div>
      <p class="slogan">一半一半又一半——中点精灵在等你点亮光桥！</p>
      <button class="diff-btn" data-diff="easy">初级 · 精灵归位<small>把中点精灵拖到线段中点上，点亮光桥 MN</small></button>
      <button class="diff-btn" data-diff="mid">中级 · 星河探秘<small>拖动能量站 C 探访三个星区，找出 MN 与 AB 的倍数关系</small></button>
      <button class="diff-btn" data-diff="hard">高级 · 钥匙锻造<small>按蓝图搭好图形，锻造长度恰好等于 MN 的星光钥匙</small></button>
      <button id="btn-rules" class="ghost-btn">规则说明</button>
    </div>
  </section>

  <!-- ============ 游戏主屏 ============ -->
  <section id="scr-game" class="screen hidden">
    <header id="hud">
      <div class="hud-left">
        <button id="btn-back" class="mini-btn">返回难度</button>
        <button id="btn-rules2" class="mini-btn">规则</button>
      </div>
      <div class="hud-mid">
        <span id="hud-title">初级·精灵归位</span>
        <span id="hud-round" class="chip">第1/3关</span>
        <span id="hud-stars">☆☆☆</span>
      </div>
      <div class="hud-right">
        <span id="hud-timer" class="chip">时间 00:00</span>
        <span id="hud-steps" class="chip">步数 0</span>
        <button id="btn-reveal" class="mini-btn warm">揭示答案</button>
        <button id="btn-restart" class="mini-btn">重新开始</button>
      </div>
    </header>
    <div id="mission" class="mission"></div>
    <div id="stage-wrap"><canvas id="stage"></canvas></div>
    <div id="panel"></div>
  </section>

  <!-- 通用弹层 -->
  <div id="ov" class="overlay hidden"><div class="ov-card" id="ov-card"></div></div>
</div>

<script>
(function(){
"use strict";
/* =========================================================
 * 线段双中点·星光工坊
 * 核心数学模型：M、N 分别是 AC、BC 的中点时，
 *   C 在线段 AB 上：MN = ½AC + ½CB = ½AB
 *   C 在延长线上：MN = ½AC − ½BC = ½(AC−BC) = ½AB
 * 即：无论 C 在直线何处，MN 永远等于 AB 的一半（口诀：一半一半又一半）。
 * 三种玩法全部以"拖动/构造"为核心操作，不是选择题。
 * ========================================================= */

/* ---------------- 基础小工具 ---------------- */
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const rint = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const fmt = v => { const r = Math.round(v*100)/100; return Number.isInteger(r) ? String(r) : String(r); };
const mmss = ms => {
  const s = Math.floor(ms/1000);
  const m = Math.floor(s/60), r = s%60;
  return (m<10?'0':'')+m+':'+(r<10?'0':'')+r;
};
function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

/* ---------------- 色板（每局随机主色，G8） ---------------- */
const PALETTES = [
  { name:'星夜蓝', bg:'#0e1a3c', panel:'#182855', primary:'#4da3ff', accent:'#ffd166', ink:'#eaf2ff', sub:'#9fb4dd', line:'#33508c' },
  { name:'玫瑰星云', bg:'#2c1032', panel:'#3c1c46', primary:'#ff7eb6', accent:'#ffe066', ink:'#ffeaf6', sub:'#cf9fc0', line:'#6e3660' },
  { name:'翡翠星轨', bg:'#08271f', panel:'#0f3a2e', primary:'#2fd4a7', accent:'#ffd166', ink:'#e8fff5', sub:'#8fc4b0', line:'#2c6b57' },
  { name:'琥珀星尘', bg:'#2d1d05', panel:'#3e2b0a', primary:'#ffb020', accent:'#7ee0ff', ink:'#fff6e0', sub:'#cbab72', line:'#6e5420' },
  { name:'紫晶星环', bg:'#1d1140', panel:'#2a1c58', primary:'#a78bfa', accent:'#7ee0ff', ink:'#f1eaff', sub:'#a99cd6', line:'#4b3a86' },
  { name:'青空星海', bg:'#062033', panel:'#0c3049', primary:'#38c8e8', accent:'#ff9f68', ink:'#e6f7ff', sub:'#8db4c6', line:'#23506b' }
];
let PAL = PALETTES[0];
function rollPalette(prev){
  let p = pick(PALETTES);
  while(PALETTES.length>1 && p===prev){ p = pick(PALETTES); }
  return p;
}
function applyPalette(){
  const r = document.documentElement.style;
  r.setProperty('--bg',PAL.bg); r.setProperty('--panel',PAL.panel);
  r.setProperty('--primary',PAL.primary); r.setProperty('--accent',PAL.accent);
  r.setProperty('--ink',PAL.ink); r.setProperty('--sub',PAL.sub);
  r.setProperty('--line',PAL.line);
}

/* ---------------- 音效设计说明 ----------------
 * 本游戏采用纯视觉反馈（星光点亮、彩纸、弹层、读数变色），
 * 不调用音频组件，保证在各类教室电脑 / 投影环境下都稳定运行。 */
function beep(freq,dur,type){ return; }
const sndSnap = function(){ return; };
const sndGood = function(){ return; };

/* =========================================================
 * 题库（数据全部来自教参 docx：典例1、典例2、小试牛刀2、
 * 直击中考1、直击中考2、拓展，另加同结构变式；每局随机抽样）
 * ========================================================= */

/* ---- 初级题库：给定数值的图形，学生把两只中点精灵拖到中点上 ---- */
function mkE1(){
  const c = pick([3,3.5,4,4.5,5,5.5,6,6.5,7]);
  return {
    kind:'easy',
    text:'如图，C 为线段 AB 上任意一点，AB=10 cm，D、E 分别是 AC、CB 的中点。请把精灵 D、E 拖到 AC、CB 的中点上，点亮光桥 DE！（本局 C 的落点是随机的）',
    pts:{ A:0, B:10, C:c },
    sprites:[ {name:'D', seg:['A','C']}, {name:'E', seg:['C','B']} ],
    ansName:'DE', answer:5,
    reveal:[
      '因为 D、E 分别是 AC、CB 的中点，所以 DC=½AC，CE=½CB。',
      'DE = DC + CE = ½AC + ½CB = ½(AC+CB) = ½AB = ½×10 = 5（cm）。',
      '注意：C 的位置每局都在变，但 DE 稳稳等于 5——这就是双中点模型的魔力！'
    ],
    insight:'DE = 5，恰好等于 ½AB = 5。换一局 C 的位置变了，DE 还是 5！'
  };
}
function mkE2(){
  return {
    kind:'easy',
    text:'如图，点 A、B、C 在同一直线上（B 在 A、C 之间），AB=20，BC=8。M、N 分别是 AC、BC 的中点，请把它们拖到中点位置，点亮光桥 MN！',
    pts:{ A:0, B:20, C:28 },
    sprites:[ {name:'M', seg:['A','C']}, {name:'N', seg:['B','C']} ],
    ansName:'MN', answer:10,
    reveal:[
      'AC = AB + BC = 20 + 8 = 28，所以 M 在刻度 14，N 在刻度 24。',
      'MN = MC − CN = ½AC − ½BC = ½(AC−BC) = ½AB = ½×20 = 10。',
      '验证：MC = 14，CN = 4，MN = 14 − 4 = 10。'
    ],
    insight:'MN = 10，恰好等于 ½AB = 10。（C 在延长线上时模型依然成立！）'
  };
}
function mkE3(){
  return {
    kind:'easy',
    text:'如图，A、B、C 三点在同一直线上，AB=24，BC=3/8×AB。E 是 AC 的中点，D 是 AB 的中点，请把 D、E 拖到中点位置！',
    pts:{ A:0, B:24, C:33 },
    sprites:[ {name:'D', seg:['A','B']}, {name:'E', seg:['A','C']} ],
    ansName:'DE', answer:4.5,
    reveal:[
      'BC = 3/8×24 = 9，AC = AB + BC = 24 + 9 = 33。',
      'D 是 AB 的中点：AD = 12；E 是 AC 的中点：AE = 16.5。',
      'DE = AE − AD = 16.5 − 12 = 4.5。用模型验证：D、E 的重合端点是 A，所以 DE = ½BC = ½×9 = 4.5。'
    ],
    insight:'DE = 4.5，恰好等于 ½BC = 4.5。（重合端点是 A，DE 是 BC 的一半！）'
  };
}
function mkE4(){
  return {
    kind:'easy',
    text:'已知点 C 为线段 AB 上任一点，AC=8 cm，CB=6 cm，M、N 分别是 AC、BC 的中点。请把 M、N 拖到中点位置，点亮光桥 MN！',
    pts:{ A:0, B:14, C:8 },
    sprites:[ {name:'M', seg:['A','C']}, {name:'N', seg:['B','C']} ],
    ansName:'MN', answer:7,
    reveal:[
      'AB = AC + CB = 8 + 6 = 14。',
      'MN = ½AC + ½CB = ½(AC+CB) = ½AB = ½×14 = 7（cm）。',
      '验证：M 在刻度 4，N 在刻度 11，MN = 7。'
    ],
    insight:'MN = 7，恰好等于 ½AB = 7。'
  };
}
function mkE5(){
  const ab = pick([14,16,18]);
  const ac = pick([Math.floor(ab/2)-3, Math.floor(ab/2)-1, Math.floor(ab/2)+2]);
  return {
    kind:'easy',
    text:'如图，AB='+ab+'，C 在线段 AB 上，AC='+ac+'，M、N 分别是 AC、CB 的中点。请把它们拖到中点位置！（变式题）',
    pts:{ A:0, B:ab, C:ac },
    sprites:[ {name:'M', seg:['A','C']}, {name:'N', seg:['B','C']} ],
    ansName:'MN', answer:ab/2,
    reveal:[
      'CB = AB − AC = '+ab+' − '+ac+' = '+(ab-ac)+'。',
      'MN = ½AC + ½CB = ½(AC+CB) = ½AB = ½×'+ab+' = '+fmt(ab/2)+'。',
      '验证：M 在刻度 '+fmt(ac/2)+'，N 在刻度 '+fmt((ac+ab)/2)+'，相减正好 '+fmt(ab/2)+'。'
    ],
    insight:'MN = '+fmt(ab/2)+'，恰好等于 ½AB。'
  };
}
function mkE6(){
  const ab = pick([16,18,20]);
  const bc = pick([5,6,7]);
  return {
    kind:'easy',
    text:'如图，A、B、C 在同一直线上（B 在 A、C 之间），AB='+ab+'，BC='+bc+'，M、N 分别是 AC、BC 的中点。请把它们拖到中点位置！（变式题）',
    pts:{ A:0, B:ab, C:ab+bc },
    sprites:[ {name:'M', seg:['A','C']}, {name:'N', seg:['B','C']} ],
    ansName:'MN', answer:ab/2,
    reveal:[
      'AC = AB + BC = '+ab+' + '+bc+' = '+(ab+bc)+'。',
      'MN = ½AC − ½BC = ½(AC−BC) = ½AB = ½×'+ab+' = '+fmt(ab/2)+'。',
      '验证：M 在刻度 '+fmt((ab+bc)/2)+'，N 在刻度 '+fmt(ab+bc/2)+'，MN = '+fmt(ab/2)+'。'
    ],
    insight:'MN = '+fmt(ab/2)+'，恰好等于 ½AB。（延长线型也服从同一个模型！）'
  };
}
const EASY_BANK = [ mkE1, mkE2, mkE3, mkE4, mkE5, mkE6 ];
function easyRounds(){ return shuffle(EASY_BANK).slice(0,3).map(f=>f()); }

/* ---- 中级题库：AB 长度取自教参各题，三区观测 + 比例尺拟合 ---- */
function midRounds(){
  return shuffle([10,14,16,20,24,28]).slice(0,3).map(ab => ({
    kind:'mid', AB:ab,
    text:'能量站 A、B 已就位，AB='+ab+'。中点精灵 M、N 会自动飞到 AC、BC 的中点。请你拖动能量站 C，把它依次送进三个星区（线段 AB 之间、B 右侧延长线、A 左侧延长线），每到一个星区就记录一条观测日志；集齐 3 条后，拖动魔法比例尺，找出 MN 与 AB 的固定倍数关系！'
  }));
}

/* ---- 高级题库：多步搭建 + 星光钥匙（答案靠构造出来） ---- */
function mkH1(){
  return {
    kind:'hard',

const stage = $('#stage'), ctx = stage.getContext('2d');
const PADL = 54, PADR = 54;
let DPR = 1, CW = 800, CH = 380;

function resize(){
  DPR = window.devicePixelRatio || 1;
  const wrap = $('#stage-wrap');
  CW = Math.max(wrap.clientWidth, 320);
  CH = Math.max(wrap.clientHeight, 280);
  stage.width = Math.round(CW*DPR); stage.height = Math.round(CH*DPR);
  stage.style.width = CW+'px'; stage.style.height = CH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(R){ R.view = viewFor(); }
}
window.addEventListener('resize', resize);

/* 依据当前关卡计算世界范围与映射函数 */
function viewFor(){
  let mn = -2.5, mx = 12;
  if(R.kind==='easy'){
    /* C 可能在 B 的右侧（A-B-C 型），取三点最右再加边距，保证图形完整不被裁切 */
    mn = -2.5;
    mx = Math.max(R.pts.A, R.pts.B, R.pts.C) + 2.5;
  }
  else if(R.kind==='mid'){ mn = -(R.AB*0.55 + 2.5); mx = R.AB*1.55 + 2.5; }
  else { mn = R.worldMin; mx = R.worldMax; }
  const w = Math.max(CW - PADL - PADR, 120);
  const u = w / (mx - mn);
  return {
    mn, mx, u,
    x: v => PADL + (v - mn)*u,
    val: px => (px - PADL)/u + mn,
    axisY: Math.round(CH*0.54),
    dockY: CH - 40
  };
}

const DIFF_NAMES = { easy:'初级·精灵归位', mid:'中级·星河探秘', hard:'高级·钥匙锻造' };

function startDiff(diff){
  G.diff = diff; G.steps = 0; G.elapsed = 0; G.t0 = Date.now();

  $('#hud-title').textContent = DIFF_NAMES[diff];
  G.screen = 'game';

}

function startRound(){
  R = G.rounds[G.ri];
  R.view = viewFor();
  R.starsBG = genStars();

    R.rt = {
      phase:'play', doneT:0,
      sprites: R.sprites.map(s => ({ name:s.name, seg:s.seg, done:false,
        target:(R.pts[s.seg[0]] + R.pts[s.seg[1]])/2 })),

    };

    R.rt = {
      phase:'collect', C: R.AB + rint(2,5),

      stepIdx:0, M:null, spriteDock:true,   // 精灵是否还在停机坪

function updateHardRO(){
  const el = $('#ro');
  if(!el || !R || R.kind!=='hard'){ return; }
  const s = R.steps[R.rt.stepIdx];
  if(!s){
    el.innerHTML = '全部步骤完成！';
    return;
  }
  const X = R.rt.X;
  const seg = (a,b) => Math.abs(X[a]-X[b]);
  if(s.t==='pt' && !s.free){
    const ev = s.expr==='AC' ? seg('A','C') : (s.expr==='BC'||s.expr==='CB' ? seg('B','C') : seg('A','C')-seg('B','C'));
    const near = Math.abs(ev - s.val) <= 0.55;
    el.innerHTML = '读数 <span class="'+(near?'ok':'warm')+'">'+s.expr+' = '+fmt(ev)+'</span> ｜ 目标 '+s.expr+' = '+s.val+
      (s.expr==='AC-BC' ? ' ｜ （延长线上这个差值竟然不变！）' : '');
  } else if(s.t==='pt' && s.free){
    el.innerHTML = '读数 AC = '+fmt(seg('A','C'))+' ｜ CB = '+fmt(seg('C','B'))+' ｜ C 放在 AB 之间任意位置都可以！';
  } else if(s.t==='mid'){
    el.innerHTML = '把精灵 '+s.show+' 拖到 '+s.of.join('')+' 的中点：拖动时会显示到两端点的距离。';

/* =========================================================
 * 指针交互（拖拽核心）
 * ========================================================= */
let drag = null;   // {type, ref, dx, dy}

function evPos(e){
  const r = stage.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function dockSlots(n){
  const arr = [];
  const gap = 130, x0 = PADL + 90;
  for(let i=0;i<n;i++){ arr.push({ x: x0 + i*gap, y: R.view.dockY }); }
  return arr;
}
/* 命中检测：返回可拖对象 */
function hitTarget(px,py){
  const v = R.view;
  if(R.kind==='easy'){
    const slots = dockSlots(R.rt.sprites.length);
    for(let i=0;i<R.rt.sprites.length;i++){
      const sp = R.rt.sprites[i];
      if(sp.done){ continue; }
      const dx = px - slots[i].x, dy = py - slots[i].y;
      if(dx*dx+dy*dy < 30*30){ return { type:'sprite', idx:i }; }
    }
  } else if(R.kind==='mid'){
    if(R.rt.phase!=='collect'){ return null; }
    const cx = v.x(R.rt.C), cy = v.axisY;
    const dx = px-cx, dy = py-cy;
    if(dx*dx+dy*dy < 34*34){ return { type:'C' }; }
  } else {
    const s = R.steps[R.rt.stepIdx];
    if(!s){ return null; }
    const X = R.rt.X;
    if(s.t==='pt'){
      const cx = v.x(X[s.pt]), cy = v.axisY;
      const dx = px-cx, dy = py-cy;
      if(dx*dx+dy*dy < 34*34){ return { type:'pt' }; }
    } else if(s.t==='mid'){
      if(R.rt.spriteDock){
        const slot = dockSlots(1)[0];
        const dx = px-slot.x, dy = py-slot.y;
        if(dx*dx+dy*dy < 30*30){ return { type:'sprite' }; }
      }
    } else if(s.t==='key' && R.rt.keyTip!==null){
      const cx = v.x(R.rt.keyTip), cy = v.axisY + 30;
      const dx = px-cx, dy = py-cy;
      if(dx*dx+dy*dy < 30*30){ return { type:'key' }; }
    }
  }
  return null;
}
/* 某步骤的拖动范围（数值型或引用型上下界） */
function stepRange(s){
  const X = R.rt.X, mx = R.view.mx;
  const hi = (typeof s.hi==='number') ? s.hi : (s.hi==='B-0.8' ? X.B-0.8 : (s.hi==='C+0.8' ? X.C+0.8 : (s.hi==='B+1' ? X.B+1 : mx-1)));
  const lo = (typeof s.lo==='number') ? s.lo : (s.lo==='C+0.8' ? X.C+0.8 : (s.lo==='B+1' ? X.B+1 : 0.8));
  return [lo, Math.max(lo+0.4, hi)];
}

stage.addEventListener('pointerdown', function(e){
  if(!R || G.finished){ return; }
  e.preventDefault();
  const p = evPos(e);
  const t = hitTarget(p.x, p.y);
  if(!t){ return; }
  try{ stage.setPointerCapture(e.pointerId); }catch(err){ /* 某些环境不支持捕获 */ }
  if(t.type==='sprite' && R.kind==='easy'){
    drag = { type:'sprite', idx:t.idx, x:p.x, y:p.y, moved:false };
    R.rt.drag = t.idx;
  } else if(t.type==='C'){
    drag = { type:'C', x:p.x, moved:false };
    R.rt.drag = true;
  } else if(t.type==='pt'){
    drag = { type:'pt', x:p.x, moved:false };
    R.rt.drag = true;
  } else if(t.type==='sprite'){
    drag = { type:'spriteH', x:p.x, y:p.y, moved:false };
    R.rt.drag = true;
  } else if(t.type==='key'){
    drag = { type:'key', x:p.x, moved:false };
    R.rt.drag = true;
  }
});

stage.addEventListener('pointermove', function(e){
  if(!drag || !R){ return; }
  e.preventDefault();
  const p = evPos(e);
  const v = R.view;
  drag.moved = true;
  if(drag.type==='sprite' || drag.type==='spriteH'){
    drag.x = clamp(p.x, 20, CW-20);
    drag.y = clamp(p.y, 30, CH-16);
    if(drag.type==='sprite'){
      const sp = R.rt.sprites[drag.idx];
      const a = R.pts[sp.seg[0]], b = R.pts[sp.seg[1]];
      const dA = Math.abs(v.val(drag.x) - a), dB = Math.abs(v.val(drag.x) - b);
      const el = $('#ro');
      if(el){
        const eq = Math.abs(dA-dB) <= 0.05;
        el.innerHTML = '精灵 '+sp.name+'：到 '+sp.seg[0]+' <span class="'+(eq?'ok':'warm')+'">'+fmt(dA)+'</span>'+
          ' · 到 '+sp.seg[1]+' <span class="'+(eq?'ok':'warm')+'">'+fmt(dB)+'</span>'+
          (eq ? ' —— 距离相等，松手归位！' : ' —— 调到两个距离相等');
      }
    } else {
      const s = R.steps[R.rt.stepIdx];
      const X = R.rt.X;
      const dA = Math.abs(v.val(drag.x) - X[s.of[0]]), dB = Math.abs(v.val(drag.x) - X[s.of[1]]);
      const el = $('#ro');
      if(el){
        const eq = Math.abs(dA-dB) <= 0.05;
        el.innerHTML = '精灵 '+s.show+'：到 '+s.of[0]+' <span class="'+(eq?'ok':'warm')+'">'+fmt(dA)+'</span>'+
          ' · 到 '+s.of[1]+' <span class="'+(eq?'ok':'warm')+'">'+fmt(dB)+'</span>'+
          (eq ? ' —— 距离相等，松手归位！' : ' —— 调到两个距离相等');
      }
    }
  } else if(drag.type==='C'){
    R.rt.C = clamp(v.val(p.x), v.mn+0.6, v.mx-0.6);
    const el = $('#ro');
    if(el && R.rt.phase==='collect'){
      const c = R.rt.C;
      el.innerHTML = 'AC = '+fmt(Math.abs(c))+' ｜ BC = '+fmt(Math.abs(c-R.AB))+' ｜ MN = '+fmt(R.AB/2)+
        ' ｜ MN 是不是一直没变？';
    }
  } else if(drag.type==='pt'){
    const s = R.steps[R.rt.stepIdx];
    const rg = stepRange(s);
    R.rt.X[s.pt] = clamp(v.val(p.x), rg[0], rg[1]);
    updateHardRO();
  } else if(drag.type==='key'){
    const s = R.steps[R.rt.stepIdx];
    R.rt.keyTip = clamp(v.val(p.x), R.rt.M + 0.5, v.mx - 1);
    updateHardRO();
  }
});

function endDrag(e){
  if(!drag || !R){ return; }
  const v = R.view;
  const moved = drag.moved;
  const d = drag; drag = null; R.rt.drag = null;
  if(moved){ G.steps++; updateHud(); }

  if(d.type==='sprite'){
    const sp = R.rt.sprites[d.idx];
    const target = sp.target;
    if(Math.abs(v.val(d.x) - target) <= 0.6){
      sp.done = true; sp.animFrom = { x:d.x, y:d.y }; sp.animT = 0;
      sndSnap();
      const el = $('#ro');
      if(el){ el.innerHTML = '精灵 '+sp.name+' 已在 <span class="ok">'+sp.seg.join('')+' 的中点</span>（刻度 '+fmt(target)+'）归位！'; }
      if(R.rt.sprites.every(s=>s.done)){
        R.rt.phase = 'done'; R.rt.doneT = 0;
        sndGood();
      }
    } else {
      const el = $('#ro');
      if(el){ el.innerHTML = '还差一点！继续拖动精灵 '+sp.name+'，让到两端的距离相等。'; }
    }
  } else if(d.type==='C'){
    const c = R.rt.C, ab = R.AB;
    let zone = null;
    if(c > 0.8 && c < ab-0.8){ zone = 'in'; }
    else if(c > ab+0.8){ zone = 'right'; }
    else if(c < -0.8){ zone = 'left'; }
    if(zone && !R.rt.zones[zone]){
      R.rt.zones[zone] = true;
      R.rt.log.push({
        zone: zone==='in' ? 'AB之间' : (zone==='right' ? 'B右侧延长线' : 'A左侧延长线'),
        AC: Math.abs(c), BC: Math.abs(c-ab), MN: ab/2
      });
      sndSnap();
      renderPanel();
      if(R.rt.zones.in && R.rt.zones.right && R.rt.zones.left){
        setTimeout(function(){
          if(R && R.kind==='mid' && R.rt.phase==='collect'){
            R.rt.phase = 'fit';
            renderPanel();
            sndGood();
          }
        }, 450);
      }
    }
  } else if(d.type==='pt'){
    const s = R.steps[R.rt.stepIdx];
    const X = R.rt.X;
    const seg = (a,b) => Math.abs(X[a]-X[b]);
    let ok = false;
    if(s.free){
      ok = X[s.pt] >= s.lo && X[s.pt] <= s.hi;
    } else {
      const ev = s.expr==='AC' ? seg('A','C') : (s.expr==='BC'||s.expr==='CB' ? seg('B','C') : seg('A','C')-seg('B','C'));
      ok = Math.abs(ev - s.val) <= 0.55;
      if(ok && typeof s.snap==='number'){ X[s.pt] = s.snap; }
    }
    if(ok){
      R.rt.stepIdx++;
      sndSnap();
      afterStep();
    } else {
      const el = $('#ro');
      if(el){ el.innerHTML = '读数还没到位，继续调整 '+s.pt+'！'; }
    }
  } else if(d.type==='spriteH'){
    const s = R.steps[R.rt.stepIdx];
    const X = R.rt.X;
    const target = (X[s.of[0]] + X[s.of[1]])/2;
    if(Math.abs(v.val(d.x) - target) <= 0.6){
      R.rt.M = target; R.rt.spriteDock = false;
      R.rt.stepIdx++;
      sndSnap();
      afterStep();
    } else {
      const el = $('#ro');
      if(el){ el.innerHTML = '还差一点！让精灵 '+s.show+' 到 '+s.of.join('')+' 两端的距离相等。'; }
    }
  } else if(d.type==='key'){
    const s = R.steps[R.rt.stepIdx];
    const len = R.rt.keyTip - R.rt.M;
    if(Math.abs(len - s.len) <= 0.55){
      R.rt.gateLit = true; R.rt.doneT = 0;
      R.rt.stepIdx++;                       // 最后一步也标记完成
      sndGood();
      const el = $('#ro');
      if(el){ el.innerHTML = '<span class="ok">钥匙吻合！隐藏精灵现身了——它正是 '+R.hidden.seg.join('')+' 的中点。</span>'; }
    }
  }
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);

/* 高级：每完成一步后的衔接（进入 key 步骤时初始化钥匙尖端） */
function afterStep(){
  const s = R.steps[R.rt.stepIdx];
  if(s && s.t==='key'){
    R.rt.keyTip = R.rt.M + 1.5;
  }
  renderPanel();
}

/* =========================================================
 * 绘制
 * ========================================================= */
function genStars(){
  const arr = [];
  const n = 44;
  for(let i=0;i<n;i++){
    arr.push({ x:Math.random()*CW, y:Math.random()*CH, r:Math.random()*1.6+0.5, ph:Math.random()*6.28 });
  }
  return arr;
}
function starPath(c,x,y,r,ang){
  const base = ang || 0;
  c.beginPath();
  for(let i=0;i<5;i++){
    const a1 = base - Math.PI/2 + i*4*Math.PI/5;
    const a2 = a1 + Math.PI/5;
    if(i===0){ c.moveTo(x+Math.cos(a1)*r, y+Math.sin(a1)*r); }
    else { c.lineTo(x+Math.cos(a1)*r, y+Math.sin(a1)*r); }
    c.lineTo(x+Math.cos(a2)*r*0.45, y+Math.sin(a2)*r*0.45);
  }
  c.closePath();
}
/* 庆祝动画见 CSS：弹层星星逐颗上浮（starRise），无画布粒子，环境兼容性最好 */
function drawBackground(now){
  ctx.clearRect(0,0,CW,CH);
  ctx.save();
  R.starsBG.forEach(function(s){
    const tw = 0.35 + 0.3*Math.sin(now/900 + s.ph);
    ctx.globalAlpha = Math.max(0.08, tw);
    ctx.fillStyle = PAL.ink;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
  });
  ctx.restore();
}
function drawAxis(v){
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(PADL-30, v.axisY); ctx.lineTo(CW-PADR+30, v.axisY); ctx.stroke();
  /* 刻度：每 1 单位小刻度，偶数单位标数字 */
  ctx.fillStyle = PAL.sub; ctx.strokeStyle = PAL.sub;
  ctx.lineWidth = 2; ctx.font = '16px "Microsoft YaHei",sans-serif'; ctx.textAlign = 'center';
  const start = Math.ceil(v.mn), end = Math.floor(v.mx);
  for(let t=start; t<=end; t++){
    const x = v.x(t);
    const big = t%2===0;
    ctx.beginPath(); ctx.moveTo(x, v.axisY); ctx.lineTo(x, v.axisY + (big?10:6)); ctx.stroke();
    if(big && t%2===0){ ctx.fillText(String(t), x, v.axisY+28); }
  }
}
function drawBand(v,a,b,y,color,name){
  const x1 = v.x(Math.min(a,b)), x2 = v.x(Math.max(a,b));
  ctx.fillStyle = color; ctx.globalAlpha = 0.5;
  roundRect(x1, y, Math.max(x2-x1,3), 7, 3); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = PAL.ink; ctx.font = 'bold 16px "Microsoft YaHei",sans-serif'; ctx.textAlign='center';
  ctx.fillText(name, (x1+x2)/2, y-4);
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawStation(v,pos,letter,opt){
  const x = v.x(pos), y = v.axisY;
  const o = opt || {};
  ctx.save();
  if(o.active){
    const pu = 0.5+0.5*Math.sin(performance.now()/300);
    ctx.strokeStyle = PAL.accent; ctx.lineWidth = 3; ctx.globalAlpha = 0.45+0.4*pu;
    ctx.beginPath(); ctx.arc(x, y-20, 26+pu*4, 0, 6.283); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  /* 指向轴的小三角 */
  ctx.fillStyle = o.color||PAL.primary;
  ctx.beginPath(); ctx.moveTo(x,y-7); ctx.lineTo(x-6,y-16); ctx.lineTo(x+6,y-16); ctx.closePath(); ctx.fill();
  /* 站牌 */
  ctx.fillStyle = PAL.panel; ctx.strokeStyle = o.color||PAL.primary; ctx.lineWidth = 3;
  roundRect(x-17, y-44, 34, 28, 8); ctx.fill(); ctx.stroke();
  ctx.fillStyle = PAL.ink; ctx.font = 'bold 20px "Microsoft YaHei",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(letter, x, y-29);
  ctx.textBaseline='alphabetic';
  if(o.tag){
    ctx.fillStyle = PAL.accent; ctx.font='bold 15px "Microsoft YaHei",sans-serif';
    ctx.fillText(o.tag, x, y+44);
  }
  ctx.restore();
}
/* 手绘柔光（多层半透明圆，替代 shadowBlur，兼容性更好） */
function glowCircle(x,y,r,color,strength){
  ctx.save();
  ctx.fillStyle = color;
  const layers = 3;
  for(let i=layers; i>=1; i--){
    ctx.globalAlpha = (strength||0.16) * (layers-i+1) / layers;
    ctx.beginPath(); ctx.arc(x, y, r + i*6, 0, 6.283); ctx.fill();
  }
  ctx.restore();
}
function drawOrb(v,pos,label,yOff,bob){
  const x = v.x(pos), y = v.axisY + (yOff||0) + Math.sin(performance.now()/500 + pos)* (bob===false?0:2);
  ctx.save();
  glowCircle(x, y, 12, PAL.accent, 0.14);
  ctx.fillStyle = PAL.accent;
  ctx.beginPath(); ctx.arc(x, y, 12, 0, 6.283); ctx.fill();
  ctx.strokeStyle = '#08122c'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y, 12, 0, 6.283); ctx.stroke();
  ctx.fillStyle = '#08122c'; ctx.font='bold 15px "Microsoft YaHei",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label, x, y+1);
  ctx.textBaseline='alphabetic';
  ctx.restore();
  return {x,y};
}
function drawBeam(v,a,b,y,label){
  const x1 = v.x(Math.min(a,b)), x2 = v.x(Math.max(a,b));
  ctx.save();
  const g = ctx.createLinearGradient(x1,0,x2,0);
  g.addColorStop(0, PAL.primary); g.addColorStop(1, PAL.accent);
  ctx.fillStyle = g;
  roundRect(x1, y, Math.max(x2-x1,3), 9, 4); ctx.fill();
  ctx.fillStyle = PAL.ink; ctx.font='bold 18px "Microsoft YaHei",sans-serif'; ctx.textAlign='center';
  ctx.fillText(label, (x1+x2)/2, y+26);
  ctx.restore();
}
function drawGhostBar(v,from,len,y,label){
  const x1 = v.x(from), x2 = v.x(from+len);
  ctx.save();
  ctx.strokeStyle = PAL.accent; ctx.lineWidth = 4; ctx.setLineDash([10,7]);
  ctx.beginPath(); ctx.moveTo(x1,y); ctx.lineTo(x2,y); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = PAL.accent; ctx.font='bold 17px "Microsoft YaHei",sans-serif'; ctx.textAlign='center';
  ctx.fillText(label, (x1+x2)/2, y-8);
  ctx.restore();
}
function drawDashedLink(v,x1,y1,x2,y2,label,color){
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.setLineDash([6,5]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = color; ctx.font='bold 17px "Microsoft YaHei",sans-serif'; ctx.textAlign='center';
  ctx.fillText(label, (x1+x2)/2, (y1+y2)/2 - 8);
  ctx.restore();
}

/* ---- 各难度的场景绘制 ---- */
function drawEasy(v,now){
  const P = R.pts;
  /* 彩色线段条：AC 与 CB */
  drawBand(v, P.A, P.C, v.axisY-20, PAL.primary, 'AC');
  drawBand(v, P.C, P.B, v.axisY-31, PAL.accent, 'CB');
  /* 能量站 */
  drawStation(v, P.A, 'A', {});
  drawStation(v, P.B, 'B', {});
  drawStation(v, P.C, 'C', {});
  /* 停机坪 */
  const slots = dockSlots(R.rt.sprites.length);
  ctx.save();
  ctx.strokeStyle = PAL.line; ctx.lineWidth = 2; ctx.setLineDash([4,4]);
  slots.forEach(function(s){ ctx.strokeRect(s.x-30, s.y-20, 60, 40); });
  ctx.setLineDash([]);
  ctx.restore();
  /* 精灵：已归位 → 轴上；未归位 → 停机坪或跟指针 */
  R.rt.sprites.forEach(function(sp,i){
    if(sp.done){
      /* 归位动画 */
      let t = 1;
      if(sp.animT < 1){
        sp.animT = Math.min(1, sp.animT + 0.08);
        t = sp.animT;
      }
      drawOrb(v, sp.target, sp.name, 0);
    } else if(drag && drag.type==='sprite' && drag.idx===i){
      const seg = sp.seg;
      const a = P[seg[0]], b = P[seg[1]];
      drawDashedLink(v, drag.x, drag.y, v.x(a), v.axisY, '到'+seg[0]+'：'+fmt(Math.abs(v.val(drag.x)-a)),
        Math.abs(Math.abs(v.val(drag.x)-a)-Math.abs(v.val(drag.x)-b))<=0.05 ? '#3fe08a' : PAL.accent);
      drawDashedLink(v, drag.x, drag.y, v.x(b), v.axisY, '到'+seg[1]+'：'+fmt(Math.abs(v.val(drag.x)-b)),
        Math.abs(Math.abs(v.val(drag.x)-a)-Math.abs(v.val(drag.x)-b))<=0.05 ? '#3fe08a' : PAL.accent);
      /* 跟随指针的精灵 */
      ctx.save();
      glowCircle(drag.x, drag.y, 13, PAL.accent, 0.16);
      ctx.fillStyle = PAL.accent;
      ctx.beginPath(); ctx.arc(drag.x, drag.y, 13, 0, 6.283); ctx.fill();
      ctx.fillStyle='#08122c'; ctx.font='bold 16px "Microsoft YaHei",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(sp.name, drag.x, drag.y+1);
      ctx.textBaseline='alphabetic';
      ctx.restore();
    } else {
      const s = slots[i];
      ctx.save();
      const pu = 0.5+0.5*Math.sin(now/350 + i*2);
      glowCircle(s.x, s.y, 12, PAL.accent, 0.08+0.08*pu);
      ctx.fillStyle = PAL.accent;
      ctx.beginPath(); ctx.arc(s.x, s.y, 12, 0, 6.283); ctx.fill();
      ctx.strokeStyle='#08122c'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(s.x, s.y, 12, 0, 6.283); ctx.stroke();
      ctx.fillStyle='#08122c'; ctx.font='bold 15px "Microsoft YaHei",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(sp.name, s.x, s.y+1);
      ctx.textBaseline='alphabetic';
      ctx.fillStyle = PAL.sub; ctx.font='15px "Microsoft YaHei",sans-serif';
      ctx.fillText('拖我', s.x, s.y+30);
      ctx.restore();
    }
  });
  /* 全部归位：光桥 + ½AB 对比条 + 成功面板 */
  if(R.rt.phase==='done'){
    R.rt.doneT += 16;
    const m = R.rt.sprites[0].target, n = R.rt.sprites[1].target;
    drawBeam(v, m, n, v.axisY+34, R.ansName+' = '+fmt(Math.abs(n-m)));
    if(R.rt.doneT > 350){
      drawGhostBar(v, R.pts.A, Math.abs(R.pts.B-R.pts.A)/2, v.axisY+62, '½AB = '+fmt(Math.abs(R.pts.B-R.pts.A)/2)+' —— 与光桥一样长！');
    }
    if(R.rt.doneT > 1400 && !R.rt.shown){
      R.rt.shown = true;
      G.doneCount++; updateHud();
      showEasySuccess();
    }
  }
}
function drawMid(v,now){
  const ab = R.AB, c = R.rt.C;
  const A = 0, B = ab;
  const M = (A+c)/2, N = (B+c)/2;
  /* 星区提示带 */
  const zones = [
    { k:'in', a:0.8, b:ab-0.8, label:'星区一·AB之间' },
    { k:'right', a:ab+0.8, b:v.mx-0.5, label:'星区二·B右侧延长线' },
    { k:'left', a:v.mn+0.5, b:-0.8, label:'星区三·A左侧延长线' }
  ];
  zones.forEach(function(z){
    const got = R.rt.zones[z.k];
    const x1 = v.x(z.a), x2 = v.x(z.b);
    ctx.save();
    ctx.globalAlpha = got ? 0.10 : 0.22;
    ctx.fillStyle = got ? PAL.sub : PAL.primary;
    roundRect(x1, v.axisY-88, Math.max(x2-x1,6), 30, 10); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = got ? PAL.sub : PAL.ink;
    ctx.font = (got?'16px':'bold 16px')+' "Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    const lab = got ? '已记录' : z.label;
    ctx.fillText(lab, (x1+x2)/2, v.axisY-68);
    if(got){
      ctx.fillStyle = PAL.accent;
      starPath(ctx, (x1+x2)/2, v.axisY-97, 9); ctx.fill();
    }
    ctx.restore();
  });
  /* AB 标注 */
  drawBand(v, A, B, v.axisY-46, PAL.primary, 'AB = '+ab);
  drawBand(v, A, c, v.axisY-20, PAL.sub, 'AC');
  drawBand(v, c, B, v.axisY-31, PAL.sub, 'CB');
  /* 能量站（C 可拖） */
  drawStation(v, A, 'A', {});
  drawStation(v, B, 'B', {});
  drawStation(v, c, 'C', { active: R.rt.phase==='collect', color: PAL.accent, tag: R.rt.phase==='collect'?'拖我':'' });
  /* 自动跟随的中点精灵与光桥 */
  drawOrb(v, M, 'M', 0);
  drawOrb(v, N, 'N', 0);
  drawBeam(v, M, N, v.axisY+34, 'MN = '+fmt(ab/2));
  /* 第二阶段：比例尺光带 */
  if(R.rt.phase==='fit'){
    drawGhostBar(v, M, R.rt.k*ab, v.axisY+62, 'k×AB = '+fmt(R.rt.k*ab));
    const near = Math.abs(R.rt.k - 0.5) <= 0.035;
    if(near){
      ctx.save();
      ctx.fillStyle = '#3fe08a'; ctx.font='bold 20px "Microsoft YaHei",sans-serif'; ctx.textAlign='center';
      ctx.fillText('几乎重合！稳住……', CW/2, v.axisY+96);
      ctx.restore();
    }
  }
}
function drawHard(v,now){
  const X = R.rt.X, s = R.steps[R.rt.stepIdx];
  /* 彩色线段条 */
  drawBand(v, X.A, X.C, v.axisY-20, PAL.primary, 'AC');
  drawBand(v, X.C, X.B, v.axisY-31, PAL.accent, 'CB');
  /* 能量站 */
  drawStation(v, X.A, 'A', {});
  drawStation(v, X.B, 'B', { active: s && s.t==='pt' && s.pt==='B', color: PAL.accent, tag:(s && s.t==='pt' && s.pt==='B')?'拖我':'' });
  drawStation(v, X.C, 'C', { active: s && s.t==='pt' && s.pt==='C', color: PAL.accent, tag:(s && s.t==='pt' && s.pt==='C')?'拖我':'' });
  /* 停机坪上的精灵（mid 步骤） */
  if(s && s.t==='mid' && R.rt.spriteDock){
    const slot = dockSlots(1)[0];
    const pu = 0.5+0.5*Math.sin(now/350);
    ctx.save();
    ctx.strokeStyle = PAL.line; ctx.lineWidth=2; ctx.setLineDash([4,4]);
    ctx.strokeRect(slot.x-30, slot.y-20, 60, 40);
    ctx.setLineDash([]);
    glowCircle(slot.x, slot.y, 12, PAL.accent, 0.08+0.08*pu);
    ctx.fillStyle = PAL.accent;
    ctx.beginPath(); ctx.arc(slot.x, slot.y, 12, 0, 6.283); ctx.fill();
    ctx.fillStyle='#08122c'; ctx.font='bold 15px "Microsoft YaHei",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(s.show, slot.x, slot.y+1);
    ctx.textBaseline='alphabetic';
    ctx.fillStyle = PAL.sub; ctx.font='15px "Microsoft YaHei",sans-serif';
    ctx.fillText('拖我', slot.x, slot.y+30);
    ctx.restore();
  }
  /* 已放置的精灵 M */
  if(R.rt.M!==null){
    const label = (s && s.t==='mid' && s.show) ? s.show : (R.steps[R.rt.stepIdx-1] && R.steps[R.rt.stepIdx-1].show) || 'M';
    drawOrb(v, R.rt.M, label, 0);
  }
  /* 拖动中的辅助线（mid 步骤） */
  if(drag && drag.type==='spriteH' && s){
    const dA = Math.abs(v.val(drag.x) - X[s.of[0]]), dB = Math.abs(v.val(drag.x) - X[s.of[1]]);
    const eq = Math.abs(dA-dB)<=0.05;
    drawDashedLink(v, drag.x, drag.y, v.x(X[s.of[0]]), v.axisY, '到'+s.of[0]+'：'+fmt(dA), eq?'#3fe08a':PAL.accent);
    drawDashedLink(v, drag.x, drag.y, v.x(X[s.of[1]]), v.axisY, '到'+s.of[1]+'：'+fmt(dB), eq?'#3fe08a':PAL.accent);
    ctx.save();
    glowCircle(drag.x, drag.y, 13, PAL.accent, 0.16);
    ctx.fillStyle=PAL.accent;
    ctx.beginPath(); ctx.arc(drag.x, drag.y, 13, 0, 6.283); ctx.fill();
    ctx.fillStyle='#08122c'; ctx.font='bold 16px "Microsoft YaHei",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(s.show, drag.x, drag.y+1);
    ctx.textBaseline='alphabetic';
    ctx.restore();
  }
  /* 星光钥匙（key 步骤） */
  if(R.rt.keyTip!==null && R.rt.M!==null){
    const x1 = v.x(R.rt.M), x2 = v.x(R.rt.keyTip), y = v.axisY+30;
    ctx.save();
    const g = ctx.createLinearGradient(x1,0,x2,0);
    g.addColorStop(0,'#ffe9a8'); g.addColorStop(1,'#ffb020');
    ctx.fillStyle = g;
    roundRect(x1, y-5, Math.max(x2-x1,3), 10, 5); ctx.fill();
    ctx.strokeStyle = '#fff3cf'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x2, y, 13, 0, 6.283); ctx.stroke();
    ctx.fillStyle = '#ffb020';
    ctx.beginPath(); ctx.arc(x2, y, 9, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#08122c'; ctx.font='bold 13px "Microsoft YaHei",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('钥匙', x2, y+1);
    ctx.textBaseline='alphabetic';
    ctx.fillStyle = PAL.ink; ctx.font='bold 18px "Microsoft YaHei",sans-serif';
    ctx.fillText('钥匙长度 = '+fmt(R.rt.keyTip - R.rt.M), (x1+x2)/2, y+30);
    ctx.restore();
  }
  /* 钥匙成功：隐藏精灵现身 + 光桥点亮 */
  if(R.rt.gateLit){
    const sKey = R.steps[R.steps.length-1];
    const gate = R.rt.M + sKey.len;
    const hx = (X[R.hidden.seg[0]] + X[R.hidden.seg[1]])/2;
    const pu = 0.5+0.5*Math.sin(now/280);
    ctx.save();
    glowCircle(v.x(gate), v.axisY, 13, PAL.accent, 0.14+0.08*pu);
    ctx.fillStyle = PAL.accent;
    ctx.beginPath(); ctx.arc(v.x(gate), v.axisY, 13, 0, 6.283); ctx.fill();
    ctx.fillStyle='#08122c'; ctx.font='bold 16px "Microsoft YaHei",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(R.hidden.name, v.x(gate), v.axisY+1);
    ctx.textBaseline='alphabetic';
    ctx.restore();
    drawBeam(v, R.rt.M, gate, v.axisY+56, R.ansName+' = '+fmt(sKey.len)+'（= ½×'+fmt(Math.abs(X.A-X.B))+'… 或看解析）');
    R.rt.doneT += 16;
    if(R.rt.doneT > 1200 && !R.rt.shown){
      R.rt.shown = true;
      G.doneCount++; updateHud();
      showHardSuccess();
    }
  }
}

/* 主绘制 */
function draw(now){
  if(!R){ return; }
  const v = R.view;
  drawBackground(now);
  drawAxis(v);
  if(R.kind==='easy'){ drawEasy(v,now); }
  else if(R.kind==='mid'){ drawMid(v,now); }
  else { drawHard(v,now); }
}

/* =========================================================
 * 中级：比例尺稳定判定（在主循环里累计时间）
 * ========================================================= */
function updateFit(dt){
  if(!R || R.kind!=='mid' || R.rt.phase!=='fit'){ return; }
  const near = Math.abs(R.rt.k - 0.5) <= 0.035;
  if(near){ R.rt.stable += dt; } else { R.rt.stable = 0; }
  const fill = $('#fitfill');
  if(fill){ fill.style.width = Math.min(100, R.rt.stable/9) + '%'; }
  updateFitLabel();
  if(R.rt.stable >= 900 && !R.rt.shown){
    R.rt.shown = true; R.rt.phase = 'done';
    G.doneCount++; updateHud();
    sndGood();
    showMidSuccess();
  }
}

    '<h2>规则说明</h2>'+
    '<p>你是<b>星光工程师</b>！数轴星河上住着中点精灵：只要 M、N 分别是 AC、BC 的中点，光桥 MN 就有一个永恒的秘密——</p>'+
    '<p class="ansline">口诀：线段双中点，一半一半又一半 —— MN 永远 = ½AB（与 C 在哪儿无关！）</p>'+
    '<h3>三种玩法</h3>'+
    '<ul>'+
      '<li><b>初级·精灵归位</b>：图形已摆好，把精灵拖到指定线段的<b>中点</b>上（拖动时看"到两端距离"，相等就归位）。</li>'+
      '<li><b>中级·星河探秘</b>：拖动能量站 C 依次进入三个星区收集观测日志，再用<b>魔法比例尺滑块</b>找出 MN = k×AB 里的 k。</li>'+
      '<li><b>高级·钥匙锻造</b>：按任务卡的蓝图一步步搭图（放 C、放 B、放中点精灵），最后从 M 拉出一条长度恰好等于答案 MN 的<b>星光钥匙</b>，藏起来的精灵就会现身！</li>'+
    '</ul>'+
    '<h3>小提示</h3>'+
    '<ul>'+
      '<li>右上角有<b>计时</b>和<b>步数</b>；卡住了随时点<b>揭示答案</b>看完整解析。</li>'+
      '<li>支持鼠标与触屏拖动；每个难度 3 关，全部点亮有庆祝彩蛋！</li>'+
    '</ul>'+
    '<button class="ov-btn" id="ov-close">出发！</button>'
  );
  $('#ov-close').addEventListener('click', closeOv);
}

/* 揭示答案（G4） */
function showReveal(){
  if(!R){ return; }
  let h = '<h2>完整解析</h2>';
  if(R.kind==='easy'){
    h += '<h3>正确位置</h3><ul>';
    R.rt.sprites.forEach(function(sp){
      h += '<li>精灵 '+sp.name+'：'+sp.seg.join('')+' 的中点，刻度 '+fmt(sp.target)+'。</li>';
    });
    h += '</ul><h3>推导</h3><ul>';
    R.reveal.forEach(function(t){ h += '<li>'+t+'</li>'; });
    h += '</ul><p class="ansline">答案：'+R.ansName+' = '+fmt(R.answer)+'</p>';
  } else if(R.kind==='mid'){
    h += '<ul>'+
      '<li>C 在 AB 之间：MN = ½AC + ½CB = ½AB。</li>'+
      '<li>C 在 B 右侧延长线：MN = ½AC − ½BC = ½(AC−BC) = ½AB。</li>'+
      '<li>C 在 A 左侧延长线：结论同样成立！</li>'+
      '<li>所以 MN = k×AB 中的 k = <b>0.5</b>。本关 AB='+R.AB+'，MN 恒为 '+fmt(R.AB/2)+'。</li>'+
    '</ul>'+
    '<p>把魔法比例尺拖到 k=0.5（±0.03 内）并稳住 1 秒即可点亮。</p>';
  } else {
    h += '<h3>搭建目标</h3><ul>';
    R.steps.forEach(function(s,i){
      let t = '';
      if(s.t==='pt'){ t = s.free ? (s.pt+' 放进 '+s.lo+' ~ '+s.hi+' 之间即可') : (s.pt+'：使 '+s.expr+' = '+s.val+(typeof s.snap==='number' ? '（即放到刻度 '+s.snap+'）' : '')); }

  }
  h += '<p class="hint">（做完解答题要用一步一步的推导，模型结论可以用来验证结果哦。）</p>';
  h += '<button class="ov-btn" id="ov-close">继续挑战</button>';
  openOv(h);
  $('#ov-close').addEventListener('click', closeOv);
}
