)return rnd(6,49)*2+1;if(dig===3)return rnd(51,499)*2+1;return rnd(501,4999)*2+1}function randEvenByDig(dig){if(dig===2)return rnd(6,49)*2;if(dig===3)return rnd(51,499)*2;return rnd(501,4999)*2}function genShortPair(){var kind=pick(["oo","ee","oe"]);var op=pick(["+","−"]);var a,b;if(kind==="oo"){a=randOddByDig(2);do{b=randOddByDig(2)}while(b===a)}else if(kind==="ee"){a=randEvenByDig(2);do{b=randEvenByDig(2)}while(b===a)}else{a=randOddByDig(2);b=randEvenByDig(2)}if(op==="−"&&a<b){var t=a;a=b;b=t}return{nums:[a,b],ops:[op],src:"变式"}}function pickTwoShortChains(){var pool=shuffle(DOC_CHAINS.short.concat([genShortPair(),genShortPair(),genShortPair()]));return pool.slice(0,2)}function genChain(len,dig){var nums=[],ops=[];for(var i=0;i<len;i++){nums.push(Math.random()<.5?randOddByDig(dig):randEvenByDig(dig));if(i>0)ops.push(pick(["+","−"]))}return{nums,ops,src:"变式"}}function genWheel(nums){var base=0;nums.forEach(function(n){base+=n});var rest=nums.slice(1);var flips,s;do{flips=rest.filter(function(){return Math.random()<.5});s=0;flips.forEach(function(n){s+=n})}while(s===0||base-2*s<=0);var target=base-2*s;var expr=escapeNum(nums[0]);for(var i=1;i<nums.length;i++){expr+=(flips.indexOf(nums[i])>=0?"−":"+")+escapeNum(nums[i])}return{nums:nums.slice(),ops:nums.map(function(){return"+"}),target,impossible:false,example:expr+"="+target,src:"变式"}}function wheelImp(){if(Math.random()<.6){return{nums:[9,8,7,6,5,4,3,2,1],ops:["+","+","+","+","+","+","+","+"],target:6,impossible:true,src:"练习7"}}return{nums:[7,6,5,4,3,2,1],ops:["+","+","+","+","+","+"],target:13,impossible:true,src:"变式"}}function twinPossible(){var v=pick([{sumT:160,diffT:40,pool:[30,40,50,60,70,80,90,100,110,120],src:"练习4",story:"两位数字探险家要组队出发：他们的【和】与【差】都要正好命中目标值！"},{sumT:200,diffT:60,pool:[50,60,70,80,90,100,110,120,130,140],src:"变式",story:"双子星站接到新任务：找出两个整数，让和与差同时达标！"}]);v.kind="sd";v.impossible=false;v.pool=shuffle(v.pool);return v}function twinImpSD(){return{kind:"sd",sumT:231,diffT:32,impossible:true,src:"例2",p
