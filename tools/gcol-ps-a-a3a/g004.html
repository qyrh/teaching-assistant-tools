15)}100%{transform:scale(1)}}.card.selSt{outline:5px solid #23c34a;outline-offset:2px;transform:translateY(-4px)}.card.dragging{opacity:.35}.cardGhost{position:fixed;z-index:400;pointer-events:none;opacity:.92;transform:rotate(-4deg) scale(1.06)}.zoneHi{outline:6px solid #ffd23f;outline-offset:3px}.stations{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.station{background:#fff;border-radius:20px;padding:14px;border:4px solid var(--c4);box-shadow:0 6px 0 rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;gap:10px;min-height:250px}.stTitle{font-size:22px;font-weight:900;color:#fff;background:var(--c1);padding:6px 20px;border-radius:14px;white-space:nowrap}#fuseRing{border-style:dashed;border-width:5px}#fuseRing.glow{border-color:#23c34a;animation:glowPulse 1s infinite}@keyframes glowPulse{0%,100%{box-shadow:0 6px 0 rgba(0,0,0,.08),0 0 0 0 rgba(35,195,74,.5)}50%{box-shadow:0 6px 0 rgba(0,0,0,.08),0 0 0 16px rgba(35,195,74,0)}}#ringChips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:34px;max-width:100%}.chip{font-size:20px;font-weight:900;background:var(--c3);border:3px solid var(--c1);border-radius:10px;padding:3px 10px}.ringSum{font-size:26px;font-weight:900;color:var(--c2);text-align:center;line-height:1.4;min-height:40px}.ringSum.okk{color:#12994b;font-size:24px}.ringBtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.lvRow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.lvChip{font-size:18px;font-weight:900;padding:6px 14px;border-radius:12px;cursor:pointer;background:#eef0f4;color:#9aa0ab;border:3px solid #ccd1da}.lvChip.ok{background:#fff;color:var(--c2);border-color:var(--c1)}.lvChip.ok.pick{background:var(--c1);color:#fff}#standInfo{font-size:19px;font-weight:800;min-height:30px;color:var(--c2);text-align:center}#standPreview{font-size:24px;font-weight:900;color:#12994b;min-height:34px;text-align:center}.standBtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.sumShow{font-size:21px;font-weight:900;color:var(--ink);text-align:center;line-height:1.6}#dashHint{font-size:15px;color:#888;text-align:center;font-weight:600}#beadWrap{background:#fff;border:4px solid var(--c1);border-radius:18px;padding:16px 10px;margin-bottom:14px;overflow-x:auto;touch-action:pan-x}#beadBelt{display:flex;flex-wrap:nowrap;gap:8px;min-width:max-content;align-items:center;padding:6px 4px}.bead{min-width:52px;padding:10px 8px;font-size:22px;font-weight:900;background:var(--c3);color:var(--ink);border:4px solid var(--c1);border-radius:50%;cursor:pointer;user-select:none;box-shadow:0 4px 0 rgba(0,0,0,.14);line-height:1}.bead.neg{border-color:var(--c2);background:#fdece0;color:#7a3000}.bead.selstart{background:#ffd23f;outline:4px solid #e88b00;transform:scale(1.1)}.bead.inseg{background:#ffe9b3;box-shadow:0 0 0 4px rgba(255,210,63,.55)}.bead.newPk{animation:pop .4s ease}.packPanel{background:#fff;border:4px solid var(--c4);border-radius:18px;padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.08);margin-bottom:14px}#packInfo{font-size:21px;font-weight:900;color:var(--c2);line-height:1.5;text-align:center;flex:1 1 320px}#ctrlBar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;gap:10px;justify-content:center;flex-wrap:wrap;background:rgba(255,255,255,.96);border-top:4px solid var(--c1);padding:10px 8px;box-shadow:0 -4px 14px rgba(0,0,0,.1)}#ctrlBar.on{display:flex}.mask{position:fixed;inset:0;background:rgba(20,22,30,.55);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}.mask.on{display:flex}.modal{background:#fff;border-radius:22px;border:5px solid var(--c1);max-width:680px;width:100%;max-height:86vh;overflow-y:auto;padding:22px 24px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:mUp .25s ease}@keyframes mUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}.modal h2{margin:0 0 12px;font-size:30px;color:var(--c2);text-align:center;letter-spacing:2px}#modalBody{font-size:21px;line-height:1.8;color:#333;white-space:pre-line;text-align:center}#modalBody .solLine{display:block;font-weight:800;color:var(--ink)}#modalBody .starRow{font-size:54px;letter-spacing:8px;line-height:1.2;margin:8px 0;display:block}#modalBody .bigAns{font-size:44px;color:#12994b;font-weight:900}#modalBtns{display:flex;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap}#toast{position:fixed;top:74px;left:50%;transform:translateX(-50%) translateY(-30px);background:rgba(34,36,42,.94);color:#fff;font-size:20px;font-weight:800;padding:12px 26px;border-radius:30px;z-index:500;opacity:0;pointer-events:none;transition:all .25s;max-width:90vw;text-align:center}#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:860px){.stations{grid-template-columns:1fr}.station{min-height:0}#brand{font-size:19px}#hud{font-size:15px;gap:8px}#hud span{padding:3px 9px}.expr{font-size:23px}.card{font-size:26px;min-width:78px;padding:10px 12px}#scrHome h1{font-size:38px}.lvBtn{width:86%;font-size:22px}.bead{min-width:46px;font-size:19px;padding:8px 6px}}

<body>

<!-- 庆祝彩纸动画层 -->
<canvas id="fxCanvas"></canvas>

<!-- 顶栏：品牌 + 计时 + 步数 + 进度 -->
<header id="topBar">
  <div id="brand">🌈 巧算彩虹工坊</div>
  <div id="hud">
    <span id="hudLevel">选难度</span>
    <span id="hudTime">⏱ 00:00</span>
    <span id="hudSteps">👣 步数 0</span>
  </div>
</header>

<!-- 首页：难度选择 -->
<section id="scrHome" class="screen on">
  <h1>巧算彩虹工坊</h1>
  <p class="sub">—— 巧算加减法综合（下）——</p>
  <p class="intro">
    这里的加减算式又长又大，从前往后硬算太慢啦！<br>
    学会三个巧算法宝：<b>凑整融合、拆补变身、分组打包</b>，<br>
    拖一拖、变一变、包一包，长算式马上变简单！
  </p>
  <div class="lvBtns">
    <button class="lvBtn" data-lv="1">初级 · 彩虹融合<small>拖卡片凑整十，两两配对点亮彩虹环</small></button>
    <button class="lvBtn lv2" data-lv="2">中级 · 拆补变身<small>9998 变身 10000-2，先拆零头再凑整</small></button>
    <button class="lvBtn lv3" data-lv="3">高级 · 智慧长龙<small>超长算式分组打包，找规律一包一个准</small></button>
  </div>
  <button id="btnRulesHome" class="ghostBtn">📖 玩法说明</button>
</section>

<!-- 初级 / 中级 工作屏 -->
<section id="scrWork" class="screen">
  <div class="questBar">
    <span id="questTag" class="tag">第 1 关</span>
    <div id="questExpr" class="expr">加载中…</div>
  </div>
  <div id="cardBelt" class="belt"></div>
  <div class="stations">
    <!-- 工作站一：彩虹融合环 -->
    <div id="fuseRing" class="station">
      <div class="stTitle">🌈 彩虹融合环</div>
      <div id="ringChips"></div>
      <div id="ringSum" class="ringSum">把卡片拖进来<br>（点选卡片后再点这里也行）</div>
      <div class="ringBtns">
        <button id="btnFuse" class="mainBtn" disabled>融合！</button>
        <button id="btnRingClear" class="miniBtn">倒回去</button>
      </div>
    </div>
    <!-- 工作站二：拆补魔法台（中级启用） -->
    <div id="splitStand" class="station">
      <div class="stTitle">✨ 拆补魔法台</div>
      <div id="standInfo">拖一张接近整十整百的卡片上台</div>
      <div id="standLevels" class="lvRow"></div>
      <div id="standPreview"></div>
      <div class="standBtns">
        <button id="btnSplit" class="mainBtn" disabled>变身！</button>
        <button id="btnStandBack" class="miniBtn">放回去</button>
      </div>
    </div>
    <!-- 工作站三：总计冲刺站 -->
    <div id="sumStation" class="station">
      <div class="stTitle">🏁 总计冲刺站</div>
      <div id="sumShow" class="sumShow">剩余卡片：0 张</div>
      <div id="dashHint">至少完成 1 次融合才能冲刺<br>剩下的卡片越少，星星越多！</div>
      <button id="btnDash" class="mainBtn">合算冲刺！</button>
    </div>
  </div>
</section>

<!-- 高级 智慧长龙屏 -->
<section id="scrDragon" class="screen">
  <div class="questBar">
    <span id="questTagC" class="tag">第 1 关</span>
    <div id="questExprC" class="expr small">加载中…</div>
  </div>
  <div id="beadWrap"><div id="beadBelt"></div></div>
  <div class="packPanel">
    <div id="packInfo">先点一颗珠子当起点，再点另一颗当终点，选中连续的一段！</div>
    <button id="btnPack" class="mainBtn" disabled>打包成一颗！</button>
    <button id="btnPackCancel" class="miniBtn">取消选择</button>
  </div>
</section>

<!-- 底部控制条（游戏进行中显示） -->
<footer id="ctrlBar">
  <button id="btnRules2" class="ghostBtn">📖 规则说明</button>
  <button id="btnReveal" class="ghostBtn">💡 揭示答案</button>
  <button id="btnRestart" class="ghostBtn">🔄 重新开始</button>
  <button id="btnBackHome" class="ghostBtn">🏠 返回难度</button>
</footer>

<!-- 模态框（规则 / 揭示 / 结算） -->
<div id="modalMask" class="mask">
  <div class="modal">
    <h2 id="modalTitle">标题</h2>
    <div id="modalBody"></div>
    <div id="modalBtns"></div>
  </div>
</div>

<div id="toast"></div>

+73-68",t:[985,-32,37,-276,-85,73,-68],a:634,m:"凑整法",s:["(985-85)+(37+73)-(32+68)-276","= 900+110-100-276","= 634"]}],2:[{e:"9998+998+99+9+6",t:[9998,998,99,9,6],a:11110,m:"拆补凑整法",s:["(10000-2)+(1000-2)+(100-1)+(10-1)+6","= 11110+(6-2-2-1-1)","= 11110"]},{e:"24+63+52+17+49+81+74+38+95",t:[24,63,52,17,49,81,74,38,95],a:493,m:"凑整法",s:["(63+17)+(52+38)+(49+81)+(24+74+95)","= 80+90+130+193","= 493"]},{e:"295+196+297+198+199+15",t:[295,196,297,198,199,15],a:1200,m:"基准数法",s:["(300-5)+(200-4)+(300-3)+(200-2)+(200-1)+15","= 1200+(15-5-4-3-2-1)","= 1200"]},{e:"19+199+1999",t:[19,199,1999],a:2217,m:"基准数法",s:["(20-1)+(200-1)+(2000-1)","= 2220-3","= 2217"]},{e:"67+58+62+55+63",t:[67,58,62,55,63],a:305,m:"基准数法（选60作基准）",s:["(60+7)+(60-2)+(60+2)+(60-5)+(60+3)","= 300+(7-2+2-5+3)","= 305"]},{e:"57+64+238+46",t:[57,64,238,46],a:405,m:"凑整法",s:["57+(62+2)+238+(43+3)","= (57+43)+(62+238)+2+3","= 100+300+5 = 405"]},{e:"7+97+997+9997+99997",t:[7,97,997,9997,99997],a:111095,m:"基准数法",s:["(10-3)+(100-3)+(1000-3)+(10000-3)+(100000-3)","= 111110-15","= 111095"]},{e:"99999+9999+999+99+9",t:[99999,9999,999,99,9],a:111105,m:"基准数法",s:["(100000-1)+(10000-1)+(1000-1)+(100-1)+(10-1)","= 111110-5","= 111105"]},{e:"2017-99-199-299-399-499",t:[2017,-99,-199,-299,-399,-499],a:522,m:"凑整法",s:["(2000+17)-(100-1)-(200-1)-(300-1)-(400-1)-(500-1)","= 500+(17+1+1+1+1+1)","= 522"]},{e:"208+494-498-95",t:[208,494,-498,-95],a:109,m:"拆补凑整法",s:["(200+8)+(500-6)-(500-2)-(100-5)","= 100+(8-6+2+5)","= 109"]},{e:"307+201-398-99",t:[307,201,-398,-99],a:11,m:"拆补凑整法",s:["(300+7)+(200+1)-(400-2)-(100-1)","= 0+(7+1+2+1)","= 11"]},{e:"313-102",t:[313,-102],a:211,m:"拆补凑整法",s:["(300+13)-(100+2)","= 200+11","= 211"]},{e:"853-148-53-52-39-59",t:[853,-148,-53,-52,-39,-59],a:502,m:"凑整法",s:["(853-53)-(148+52)-(40-1)-(60-1)","= 800-200-98","= 502"]},{e:"2985-985",t:[2985,-985],a:2e3,m:"抵消尾数法",s:["2985 与 985 末尾三位相同，优先相消：","2985-985","= 2000"]}]};const DRAGON_GEN={c1(){const t=[];for(let i=30;i>=1;i--){t.push(i%2===0?i:-i)}return t},c >{S.sec++;$("hudTime").textContent="⏱ "+fmtTime(S.sec)},1e3)}function stopTimer(){if(S.timerId){clearInterval(S.timerId);S.timerId=null}}function updHud(){$("hudSteps").textContent="👣 步数 "+S.steps;const total=S.quests.length||3;const cur=Math.min(S.qIndex+1,total);$("hudLevel").textContent=(S.lv===3?"高级":S.lv===2?"中级":"初级")+" 第"+cur+"/"+total+"关"}function addStep(){S.steps++;updHud()}const FX={cv:null,ctx:null,parts:[],raf:0};function fxInit(){FX.cv=$("fxCanvas");FX.ctx=FX.cv.getContext("2d");const fit=()=>{FX.cv.width=window.innerWidth;FX.cv.height=window.innerHeight};fit();window.addEventListener("resize",fit)}function confetti(big){const n=big?220:110;const colors=["#ff7a1a","#23c34a","#1f7ae0","#ffd23f","#e8548f","#8a4fd3"];for(let i=0;i<n;i++){FX.parts.push({x:Math.random()*FX.cv.width,y:-20-Math.random()*FX.cv.height*.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*3.5,w:8+Math.random()*8,h:6+Math.random()*6,rot:Math.random()*Math.PI,vr:(Math.random()-.5)*.25,col:colors[Math.floor(Math.random()*colors.length)]})}if(!FX.raf)fxLoop()}function fxLoop(){const ctx=FX.ctx;ctx.clearRect(0,0,FX.cv.width,FX.cv.height);FX.parts=FX.parts.filter(p=>p.y<FX.cv.height+30);FX.parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.vy+=.02;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.col;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});if(FX.parts.length){FX.raf=requestAnimationFrame(fxLoop)}else{FX.raf=0;ctx.clearRect(0,0,FX.cv.width,FX.cv.height)}}function rulesText(){if(S.lv===3){return"🚌 <b>高级 · 智慧长龙</b>（分组凑整）\n长长的一串算式像一条数字长龙！\n① 点一颗珠子当<b>起点</b>，再点另一颗当<b>终点</b>，选中连续的一段；\n② 点【打包成一颗！】，这段就会收进泡泡，变成一颗新珠子；\n③ 如果一段的和正好是 <b>0</b>，泡泡会「啵」地消失！\n④ 不断分组打包，直到长龙<b>只剩一颗珠子</b>，它就是最终答案！\n💡 妙招：像 2-3-4+5 这样四颗一组和为 0，\n会找规律分组能拿更多星星！"}let txt=S.lv===2?"✨ <b>中级 · 拆补变身</b>（拆补凑整 / 基准数法）\n":"🌈 <b>初级 · 彩虹融合</b>（凑整 / 抵消尾数）\n";txt+="① 把数字卡片<b>拖进彩虹融合环</b>（或点选卡片后再点环），\n　 环里卡片的总和凑成<b>整十数</b>（个位是 0，如 100、300、-200）时环会发光；\n② 点【融合！】把它们<b>合成一张新卡</b>；总和正好是 0 时，卡片「啵」地相消！\n　 融合前后式子的总值<b>始终不变</b>，只是变得越来越短、越来越好算；\n";if(S.lv===2){txt+="③ 遇到 9998、295 这样接近整十整百的数，先拖上<b>拆补魔法台</b>：\n　 选好整十 / 整百 / 整千档位，9998 变身成 10000 和 -2 两张卡；\n④ 最后点【合算冲刺】得出结果。\n"}else{txt+="③ 最后点【合算冲刺】得出结果。\n"}txt+="⭐ 剩下的卡片越少，星星越多（最少完成 1 次融合才能冲刺）！";return txt}function showRules(){openModal("📖 玩法说明",rulesText(),[{t:"知道啦，出发！",fn:closeModal}])}function newCard(v){S.uid++;return{id:S.uid,v,pos:"belt"}}function startABQuest(){const q=S.quests[S.qIndex];S.cards=q.t.map(v=>newCard(v));S.ring=[];S.stand=null;S.sel=[];S.fuseCount=0;S.standLv=10;$("questTag").textContent="第 "+(S.qIndex+1)+" 关 · "+q.m;$("questExpr").textContent=q.e;$("splitStand").style.display=S.lv===2?"flex":"none";showScreen("scrWork");renderAll()}function cardAt(id){return S.cards.find(c=>c.id===id)}function beltCards(){return S.cards.filter(c=>c.pos==="belt")}function renderAll(){const belt=$("cardBelt");belt.innerHTML="";const bs=beltCards();bs.forEach((c,i)=>{const el=document.createElement("div");el.className="card"+(c.v<0?" neg":"")+(S.sel.indexOf(c.id)>=0?" selSt":"");el.textContent=fmtNum(c.v,i===0);el.dataset.cid=c.id;bindCardDrag(el,c.id);belt.appendChild(el)});const ringEls=S.ring.map(id=>cardAt(id)).filter(Boolean);const chips=$("ringChips");chips.innerHTML="";ringEls.forEach(c=>{const sp=document.createElement("span");sp.className="chip";sp.textContent=fmtNum(c.v,false);chips.appendChild(sp)});const sum=ringEls.reduce((a,c)=>a+c.v,0);const sumEl=$("ringSum");const canFuse=ringEls.length>=2&&sum%10===0;if(ringEls.length===0){sumEl.innerHTML="把卡片拖进来<br>（点选卡片后再点这里也行）";sumEl.classList.remove("okk")}else if(canFuse){sumEl.innerHTML="总和 = "+sum+(sum===0?"<br>正好相消！":"<br>凑成整十啦！");sumEl.classList.add("okk")}else{sumEl.innerHTML="总和 = "+sum+"<br>还差一点点，再拖一张试试";sumEl.classList.remove("okk")}$("btnFuse").disabled=!canFuse;$("fuseRing").classList.toggle("glow",canFuse);if(S.stand!==null){const c=cardAt(S.stand);$("standInfo").textContent="台上卡片："+fmtNum(c.v,false);renderStandLevels(c)}else{$("standInfo").textContent="拖一张接近整十整百的卡片上台";$("st
