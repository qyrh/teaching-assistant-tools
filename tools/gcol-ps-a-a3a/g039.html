<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>等式魔法天平 · 农场称重闯关（第20讲 等式代换·上）</title>
<style>
/* =========================================================
   等式魔法天平 · 农场称重闯关
   学段：小学（三上 第20讲 等式代换·上）
   核心玩法：把水果 / 砝码拖到大天平右盘，天平实时倾斜，
             两边一样重即"平衡"，平衡的一刻就完成了一次等量代换。
   全部为内联 CSS + JS，零外部依赖，单文件自包含。
   ========================================================= */

/* ---------- 全局变量（配色每局随机更换，见 JS 中 PALETTES） ---------- */
:root{
  --bg:#FFF3E0; --panel:#FFFFFF; --ink:#4A2C1A;
  --accent:#FF8A3D; --accent2:#FFC94D; --soft:#FFE7CF;
  --good:#1FA05C; --warn:#E2582C;
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;
  background:var(--bg); color:var(--ink); font-size:20px; line-height:1.5;
  transition:background .5s;
}
#app{ max-width:1080px; margin:0 auto; padding:10px 12px 30px; }

/* ---------- 顶栏 ---------- */
#topbar{
  display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px;
  padding:10px 14px; background:var(--panel); border:4px solid var(--ink);
  border-radius:18px; box-shadow:0 5px 0 rgba(0,0,0,.14); position:sticky; top:6px; z-index:50;
}
#brand{ font-size:26px; font-weight:900; letter-spacing:1px; }
#brand small{ font-size:16px; font-weight:700; color:var(--accent); margin-left:6px; }
#hud{ display:flex; gap:10px; flex-wrap:wrap; margin-left:auto; font-weight:800; font-size:18px; }
#hud span{
  background:var(--soft); border:3px solid var(--ink); border-radius:12px; padding:2px 12px; white-space:nowrap;
}
#toolbar{ display:flex; gap:8px; flex-wrap:wrap; width:100%; }
.tbtn{
  font-size:18px; font-weight:900; padding:8px 16px; border-radius:14px; cursor:pointer;
  border:3px solid var(--ink); background:var(--accent2); color:var(--ink);
  box-shadow:0 4px 0 var(--ink); transition:transform .08s, box-shadow .08s;
}
.tbtn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
.tbtn.warm{ background:var(--accent); color:#fff; }

/* ---------- 屏幕切换 ---------- */
.screen{ margin-top:14px; }
.hidden{ display:none !important; }

/* ---------- 难度选择屏 ---------- */
#screen-diff h1{ text-align:center; font-size:34px; font-weight:900; margin:18px 0 6px; }
.diff-tip{
  max-width:760px; margin:0 auto 18px; background:var(--panel); border:4px dashed var(--accent);
  border-radius:16px; padding:12px 18px; font-size:19px; text-align:center;
}
#diff-cards{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
.diff-card{
  flex:1 1 240px; max-width:300px; cursor:pointer; text-align:left;
  background:var(--panel); border:4px solid var(--ink); border-radius:20px; padding:18px 16px;
  box-shadow:0 6px 0 var(--ink); transition:transform .1s;
}
.diff-card:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
.diff-card .dc-name{ font-size:26px; font-weight:900; color:var(--accent); }
.diff-card .dc-stars{ font-size:20px; margin:6px 0; }
.diff-card .dc-desc{ font-size:17px; }
.diff-card .dc-note{ font-size:14px; margin-top:8px; color:#8a6d3b; font-weight:700; }

/* ---------- 游戏屏：故事条 ---------- */
#story-bar{
  background:var(--panel); border:4px solid var(--ink); border-radius:16px;
  padding:10px 16px; font-size:19px; box-shadow:0 4px 0 rgba(0,0,0,.12);
}
#story-bar b{ color:var(--accent); }
#story-src{ display:inline-block; font-size:13px; background:var(--soft); border:2px solid var(--ink);
  border-radius:8px; padding:0 8px; margin-left:8px; vertical-align:middle; }

/* ---------- 线索天平区 + 关系册 ---------- */
#clue-zone{ display:flex; gap:10px; margin-top:10px; align-items:stretch; flex-wrap:wrap; }
#clue-list{ display:flex; gap:10px; flex-wrap:wrap; }
.clue{
  background:var(--panel); border:3px solid var(--ink); border-radius:14px;
  padding:8px 10px; text-align:center; box-shadow:0 3px 0 rgba(0,0,0,.12); min-width:150px;
}
.clue-row{ display:flex; align-items:center; justify-content:center; gap:6px; font-size:24px; }
.clue-side{ min-width:44px; font-size:24px; letter-spacing:-2px; }
.clue-scale{ font-size:26px; }
.clue-cap{ font-size:15px; font-weight:800; margin-top:2px; color:var(--accent); }
#eq-book{
  flex:1 1 200px; min-width:210px; background:var(--soft); border:3px solid var(--ink);
  border-radius:14px; padding:6px 12px;
}
#eq-book b{ font-size:16px; }
#eq-list{ display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
.eq-chip{
  background:var(--panel); border:3px solid var(--good); color:var(--good);
  font-weight:900; font-size:15px; border-radius:10px; padding:2px 10px;
  animation:pop .4s;
}

/* ---------- 轮次目标条 ---------- */
#round-bar{
  margin-top:10px; background:var(--ink); color:#fff; border-radius:14px;
  padding:10px 16px; font-size:21px; font-weight:800; display:flex; flex-wrap:wrap; gap:4px 16px; align-items:center;
}
#round-ind{ background:var(--accent); border-radius:10px; padding:0 12px; font-size:17px; white-space:nowrap; }

/* ---------- 大天平 ---------- */
#balance-outer{
  margin-top:10px; background:var(--panel); border:4px solid var(--ink); border-radius:20px;
  padding:6px 6px 0; box-shadow:0 5px 0 rgba(0,0,0,.14);
}
#balance{ position:relative; height:clamp(280px,42vh,380px); user-select:none; }
#beam{
  position:absolute; left:50%; height:16px; background:var(--accent);
  border:3px solid var(--ink); border-radius:10px; z-index:3;
}
.pan-wrap{ position:absolute; z-index:4; transform:translateX(-50%); width:190px; text-align:center; }
.string{ width:6px; height:56px; background:var(--ink); margin:0 auto; border-radius:3px; }
.pan{
  min-height:96px; background:var(--soft); border:4px solid var(--ink);
  border-radius:14px 14px 46px 46px; padding:8px 6px 12px; margin:0 auto; width:190px;
}
.pan.locked{ background:repeating-linear-gradient(45deg,var(--soft),var(--soft) 10px,#00000008 10px,#00000008 20px); }
.pan.drop-hot{ background:var(--accent2); box-shadow:0 0 0 6px var(--accent2) inset; }
.pan-title{ font-size:13px; font-weight:900; color:#8a6d3b; }
.pan-empty{ color:#b09a7a; font-size:16px; font-weight:800; padding-top:22px; }
.pgroup{
  display:inline-flex; align-items:center; gap:3px; background:#fff; border:2px solid var(--ink);
  border-radius:10px; padding:1px 6px; margin:2px; font-size:22px; font-weight:900; animation:pop .3s;
}
.pg-rm{
  width:24px; height:24px; border-radius:50%; border:2px solid var(--ink); background:var(--warn);
  color:#fff; font-size:15px; font-weight:900; cursor:pointer; line-height:1;
}
.pchips{ display:flex; flex-wrap:wrap; gap:4px; justify-content:center; margin-top:2px; }
.chip-tok{
  display:inline-block; min-width:46px; text-align:center; background:var(--ink); color:#ffe9a8;
  border-radius:50% 50% 50% 50% / 44% 44% 56% 56%; font-size:15px; font-weight:900;
  padding:3px 6px; border:2px solid #000; animation:pop .3s;
}
.chip-tok.rm{ cursor:pointer; background:var(--warn); color:#fff; }
.psum{ width:100%; font-size:14px; font-weight:900; color:var(--accent); }
#pivot-cap{
  position:absolute; left:50%; width:40px; height:40px; background:var(--accent2);
  border:3px solid var(--ink); border-radius:50%; transform:translate(-50%,-50%); z-index:5;
}
#pivot-post{
  position:absolute; left:50%; transform:translateX(-50%); width:14px;
  background:var(--ink); border-radius:6px; z-index:2;
}
#pivot-base{
  position:absolute; left:50%; bottom:6px; transform:translateX(-50%);
  width:min(52%,340px); height:18px; background:var(--accent2);
  border:3px solid var(--ink); border-radius:10px; z-index:2;
}
#balance.balanced #pan-r{ border-color:var(--good); box-shadow:0 0 0 6px #1fa05c44; }
#tilt-hint{
  text-align:center; font-size:20px; font-weight:900; padding:8px 0 12px; color:var(--ink);
}
#tilt-hint .h-eq{ color:var(--good); }

/* ---------- 货架 ---------- */
#shelf-zone{ margin-top:10px; }
#shelf{
  display:flex; gap:12px; flex-wrap:wrap; background:var(--panel);
  border:4px solid var(--ink); border-radius:18px; padding:12px; box-shadow:0 5px 0 rgba(0,0,0,.14);
}
.scard{
  touch-action:none; cursor:grab; user-select:none; text-align:center;
  background:var(--soft); border:3px solid var(--ink); border-radius:14px;
  padding:8px 14px; box-shadow:0 4px 0 var(--ink); min-width:96px;
}
.scard:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
.sc-emoji{ font-size:42px; line-height:1.1; }
.sc-name{ font-size:16px; font-weight:900; }
.sc-sub{ font-size:13px; font-weight:800; color:var(--accent); }
#shelf-tip{ text-align:center; font-size:15px; font-weight:700; color:#8a6d3b; margin-top:8px; }

/* ---------- 结算屏 ---------- */
#screen-final{ text-align:center; }
#final-title{ font-size:40px; font-weight:900; margin:26px 0 8px; }
#final-stars{ font-size:44px; letter-spacing:6px; }
#final-stats{
  display:inline-block; background:var(--panel); border:4px solid var(--ink); border-radius:18px;
  padding:14px 30px; margin:14px 0; font-size:21px; font-weight:800; text-align:left;
}
#final-stats div{ margin:4px 0; }
.bigbtn{
  font-size:24px; font-weight:900; padding:14px 30px; margin:8px 10px; cursor:pointer;
  border:4px solid var(--ink); border-radius:18px; background:var(--accent); color:#fff;
  box-shadow:0 6px 0 var(--ink);
}
.bigbtn.alt{ background:var(--accent2); color:var(--ink); }
.bigbtn:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }

/* ---------- 弹窗 ---------- */
#modal-mask{
  position:fixed; inset:0; background:rgba(30,15,0,.45); z-index:200;
  display:flex; align-items:center; justify-content:center; padding:16px;
}
#modal-box{
  background:var(--panel); border:5px solid var(--ink); border-radius:22px;
  max-width:640px; width:100%; max-height:84vh; overflow:auto; padding:22px 24px;
  box-shadow:0 10px 0 rgba(0,0,0,.25); animation:pop .35s;
}
#modal-box h2{ font-size:28px; font-weight:900; color:var(--accent); margin-bottom:10px; }
#modal-body{ font-size:19px; }
#modal-body .m-eq{
  display:block; background:var(--soft); border:3px dashed var(--accent); border-radius:12px;
  font-size:24px; font-weight:900; text-align:center; padding:8px; margin:12px 0;
}
#modal-body .m-star{ font-size:34px; text-align:center; letter-spacing:4px; margin:8px 0; }
#modal-body ul{ padding-left:24px; }
#modal-body li{ margin:6px 0; }
#modal-btns{ text-align:center; margin-top:16px; }
#modal-btns button{
  font-size:20px; font-weight:900; padding:10px 24px; margin:4px 6px; cursor:pointer;
  border:3px solid var(--ink); border-radius:14px; background:var(--accent2); color:var(--ink);
  box-shadow:0 4px 0 var(--ink);
}
#modal-btns button:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }

/* ---------- 拖拽跟随的"小手"预览 ---------- */
#drag-ghost{
  position:fixed; z-index:300; pointer-events:none; transform:translate(-50%,-60%) scale(1.15);
  font-size:46px; font-weight:900; filter:drop-shadow(0 6px 6px rgba(0,0,0,.3));
}

/* ---------- 庆祝特效画布 ---------- */
#fx{ position:fixed; inset:0; pointer-events:none; z-index:150; }

/* ---------- 通用小动画 ---------- */
@keyframes pop{ 0%{ transform:scale(.3); opacity:0; } 70%{ transform:scale(1.15); } 100%{ transform:scale(1); opacity:1; } }
@keyframes floatUp{ 0%{ transform:translateY(0); opacity:1; } 100%{ transform:translateY(-60px); opacity:0; } }

/* ---------- 移动端适配 ---------- */
@media (max-width:640px){
  body{ font-size:17px; }
  #brand{ font-size:20px; }
  #hud{ font-size:15px; margin-left:0; }
  .tbtn{ font-size:15px; padding:6px 10px; }
  #round-bar{ font-size:17px; }
  .pan-wrap,.pan{ width:150px; }
  .sc-emoji{ font-size:34px; }
  #final-title{ font-size:30px; }
}
</style>
</head>
<body>
<div id="app">

  <!-- ===== 顶部栏：标题 / 计时 / 步数 / 功能按钮 ===== -->
  <header id="topbar">
    <div id="brand">⚖️ 等式魔法天平<small>农场称重闯关 · 等式代换</small></div>
    <div id="hud">
      <span id="hud-level">未开始</span>
      <span id="hud-timer">⏱ 00:00</span>
      <span id="hud-steps">👣 0 步</span>
    </div>
    <nav id="toolbar">
      <button class="tbtn" id="btn-rules">规则说明</button>
      <button class="tbtn warm" id="btn-reveal">揭示答案</button>
      <button class="tbtn" id="btn-restart">重新开始</button>
      <button class="tbtn" id="btn-back">返回难度</button>
    </nav>
  </header>

  <!-- ===== 难度选择屏 ===== -->
  <section id="screen-diff" class="screen">
    <h1>选择闯关难度</h1>
    <div class="diff-tip">
      小知识：<b>等量代换</b>——把一个量用另一个<b>相等的量</b>来代替，关系依然成立。<br>
      如果 a=b，b=c，那么 a=c。聪明的曹冲称象用的就是它！<br>
      玩法：观察上方"线索天平"里的关系，把货架上的水果、砝码<b>拖到</b>大天平右盘，让天平<b>平衡</b>！
    </div>
    <div id="diff-cards">
      <button class="diff-card" data-diff="初级">
        <div class="dc-name">初级 · 果园小当家</div>
        <div class="dc-stars">⭐ 关卡轻松</div>
        <div class="dc-desc">例题级：一步代换，称一称、换一换就能发现关系。</div>
        <div class="dc-note">随机抽取 3 关（共 4 关题库）</div>
      </button>
      <button class="diff-card" data-diff="中级">
        <div class="dc-name">中级 · 农场称重乐</div>
        <div class="dc-stars">⭐⭐ 步步推进</div>
        <div class="dc-desc">练习级：两三步链条，先找中间量，再一步步代换。</div>
        <div class="dc-note">随机抽取 3 关（共 5 关题库）</div>
      </button>
      <button class="diff-card" data-diff="高级">
        <div class="dc-name">高级 · 魔法天平大师</div>
        <div class="dc-stars">⭐⭐⭐ 智慧挑战</div>
        <div class="dc-desc">变式综合：传递长链、和倍差倍、整体代换一起上阵。</div>
        <div class="dc-note">随机抽取 3 关（共 6 关题库）</div>
      </button>
    </div>
  </section>

  <!-- ===== 游戏屏 ===== -->
  <section id="screen-game" class="screen hidden">
    <div id="story-bar"></div>
    <div id="clue-zone">
      <div id="clue-list"></div>
      <div id="eq-book"><b>📖 我的代换关系册</b><div id="eq-list"><span style="font-size:14px;color:#8a6d3b">平衡一次天平，就点亮一条等式！</span></div></div>
    </div>
    <div id="round-bar"><span id="round-ind"></span><span id="round-goal"></span></div>
    <div id="balance-outer">
      <div id="balance">
        <div id="beam"></div>
        <div id="pan-wrap-l" class="pan-wrap"><div class="string"></div><div id="pan-l" class="pan locked"><div class="pan-title">左盘 · 任务物品</div></div></div>
        <div id="pan-wrap-r" class="pan-wrap"><div class="string"></div><div id="pan-r" class="pan"><div class="pan-title">右盘 · 拖到这里</div></div></div>
        <div id="pivot-post"></div><div id="pivot-base"></div><div id="pivot-cap"></div>
      </div>
      <div id="tilt-hint">拖动物品，让天平两边一样重吧！</div>
    </div>
    <div id="shelf-zone">
      <div id="shelf"></div>
      <div id="shelf-tip">把货架上的水果、砝码<b>拖</b>到大天平右盘（轻点卡片也能放上）；点物品上的"−"或轻点砝码可取回。</div>
    </div>
  </section>

  <!-- ===== 结算屏 ===== -->
  <section id="screen-final" class="screen hidden">
    <div id="final-title">🎉 全部通关！你是等式代换小大师！</div>
    <div id="final-stars"></div>
    <div id="final-stats"></div>
    <div>
      <button class="bigbtn" id="btn-again">再玩一次（换新题目与配色）</button>
      <button class="bigbtn alt" id="btn-back2">返回难度选择</button>
    </div>
  </section>

  <!-- ===== 通用弹窗 ===== -->
  <div id="modal-mask" class="hidden"><div id="modal-box"><h2 id="modal-title"></h2><div id="modal-body"></div><div id="modal-btns"></div></div></div>

  <!-- 拖拽预览 + 彩纸画布 -->
  <div id="drag-ghost" class="hidden"></div>
  <canvas id="fx"></canvas>
</div>

<script>
"use strict";
/* =========================================================
 * 等式魔法天平 · 农场称重闯关
 * 一、PALETTES   配色色板（每局随机）
 * 二、POOLS      关卡题库（全部改编自本讲 docx 题目，含少量同构变式）
 * 三、状态与流程 难度选择→抽关→多轮称重→结算
 * 四、大天平     实时倾斜渲染（requestAnimationFrame 缓动）
 * 五、拖拽系统   Pointer Events，兼容鼠标与触摸
 * 六、彩纸烟花   Canvas 粒子庆祝
 * ========================================================= */

/* ---------------- 一、配色色板：每局随机选一 ---------------- */
const PALETTES = [
  {bg:"#FFF3E0",ink:"#4A2C1A",accent:"#FF8A3D",accent2:"#FFC94D",soft:"#FFE7CF"},
  {bg:"#E8F8F0",ink:"#143D2E",accent:"#159A6C",accent2:"#7CDDC4",soft:"#D8F3E7"},
  {bg:"#E9F3FF",ink:"#16375C",accent:"#2D7DE1",accent2:"#8CC6FF",soft:"#DCEBFB"},
  {bg:"#FDEBF3",ink:"#5C2440",accent:"#E85D9E",accent2:"#FFB3D4",soft:"#FBDCEA"},
  {bg:"#FFFBE0",ink:"#5C4A12",accent:"#DEA800",accent2:"#FFE45C",soft:"#FBF3C6"},
  {bg:"#F3EDFF",ink:"#35246B",accent:"#7C5CE0",accent2:"#B9A4FF",soft:"#E8E0FF"}
];
function applyRandomPalette(){
  const p = PALETTES[Math.floor(Math.random()*PALETTES.length)];
  const r = document.documentElement.style;
  r.setProperty("--bg",p.bg);   r.setProperty("--ink",p.ink);
  r.setProperty("--accent",p.accent); r.setProperty("--accent2",p.accent2);
  r.setProperty("--soft",p.soft);
}

/* ---------------- 二、关卡题库 ----------------
 * 说明：物品的"隐藏重量"由本讲题目中的数量关系换算而来（内部全为整数），
 * 线索天平展示的每一条关系都与 docx 原题一致；每局从池中随机抽样。
 * 物品格式：{e:'🍎',n:3} 表示 3 个苹果；{c:60} 表示一枚 60（单位）的砝码。
 * ------------------------------------------------ */
const POOLS = {
"初级": [
  { /* —— 练习2：1苹果=2梨，1梨=3桃 —— */
    title:"果园小当家", src:"改编自 练习2",
    names:{'🍎':'苹果','🍐':'梨','🍑':'桃'}, weights:{'🍎':12,'🍐':6,'🍑':2}, unit:"个",
    story:"水果店门口摆着两台小天平：<b>1个苹果</b>和<b>2个梨</b>一样重，<b>1个梨</b>和<b>3个桃</b>一样重。小掌柜，用桃子把大天平称平衡吧！",
    clues:[
      {left:[{e:'🍎',n:1}],right:[{e:'🍐',n:2}],cap:"1个苹果 = 2个梨"},
      {left:[{e:'🍐',n:1}],right:[{e:'🍑',n:3}],cap:"1个梨 = 3个桃"}
    ],
    rounds:[
      {goal:"右盘只放桃子：多少个桃子和 1个苹果 一样重？",

/* ---------------- 三、全局状态与流程 ---------------- */
const S = {
  diff:null,          // 当前难度
  levels:[],          // 本局抽样出的关卡
  li:0, ri:0,         // 关索引 / 轮索引
  placed:{},          // 右盘水果 {emoji:数量}
  chipsOn:[],         // 右盘砝码面值数组
  steps:0,            // 步数
  reveals:0,          // 本关使用提示次数
  sessionReveals:0,   // 全程提示次数
  stars:[],           // 每关星级
  lock:true,          // 天平锁定（结算中禁止操作）
  eqGot:[],           // 本关已点亮等式
  sec:0,              // 计时秒数
  timerId:null,
  roundActive:false,  // 当前轮是否进行中
  revealUsedThisRound:false,
  revealing:false     // 演示动画进行中
};

const $ = (id)=>document.getElementById(id);
const screens = {diff:$("screen-diff"),game:$("screen-game"),final:$("screen-final")};
function showScreen(name){
  Object.keys(screens).forEach((k)=>{ screens[k].classList.toggle("hidden", k!==name); });
}

/* ---------- 计时器 ---------- */
function startTimer(){
  stopTimer();
  S.timerId = setInterval(()=>{
    S.sec += 1;
    $("hud-timer").textContent = "⏱ " + fmt(S.sec);
  },1000);
}
function stopTimer(){ if(S.timerId){ clearInterval(S.timerId); S.timerId = null; } }
function fmt(s){
  const m = Math.floor(s/60), ss = s%60;
  return (m<10?"0":"")+m+":"+(ss<10?"0":"")+ss;
}

/* ---------- 抽样工具：洗牌后取前 n 个 ---------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const t = a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

/* ---------- 开始一局 ---------- */
function startSession(diff){
  S.diff = diff;
  S.levels = shuffle(POOLS[diff]).slice(0,3);   // 反重复：每局随机抽 3 关
  S.li = 0; S.steps = 0; S.sessionReveals = 0; S.stars = []; S.sec = 0;
  applyRandomPalette();                          // 反重复：每局随机换配色
  $("hud-steps").textContent = "👣 0 步";
  $("hud-timer").textContent = "⏱ 00:00";
  startTimer();
  showScreen("game");
  loadLevel(0);
}

/* ---------- 载入第 i 关 ---------- */
function loadLevel(i){
  S.li = i; S.ri = 0; S.reveals = 0; S.eqGot = [];
  const lv = S.levels[i];
  $("hud-level").textContent = diffName(S.diff) + " · 第" + (i+1) + "/" + S.levels.length + "关";
  $("story-bar").innerHTML = "🧑‍🌾 <b>第" + (i+1) + "关 · " + lv.title + "</b>：" + lv.story +
    '<span id="story-src">' + lv.src + '</span>';
  renderClues(lv);
  renderEqBook();
  loadRound(0);
}

function diffName(d){ return d; }

/* ---------- 渲染线索天平 ---------- */
function sideHTML(items, lv){
  // 把一组物品渲染成紧凑的 HTML（水果 emoji ×n / 砝码）
  let out = "";
  (items||[]).forEach((it)=>{
    if(it.e){
      out += '<div class="pgroup">'+ it.e +'<span style="font-size:14px">×'+it.n+'</span></div>';
    }else if(typeof it.c === "number"){
      out += '<span class="chip-tok">'+it.c+lv.unit+'</span>';
    }
  });
  return out;
}
function renderClues(lv){
  const box = $("clue-list");
  box.innerHTML = "";
  lv.clues.forEach((cl)=>{
    const d = document.createElement("div");
    d.className = "clue";
    d.innerHTML = '<div class="clue-row"><span class="clue-side">'+sideHTML(cl.left,lv)+'</span>'+
                  '<span class="clue-scale">⚖️</span>'+
                  '<span class="clue-side">'+sideHTML(cl.right,lv)+'</span></div>'+
                  '<div class="clue-cap">'+cl.cap+'</div>';
    box.appendChild(d);
  });
}

/* ---------- 关系册（已点亮的等式） ---------- */
function renderEqBook(){
  const box = $("eq-list");
  box.innerHTML = "";
  if(S.eqGot.length===0){
    box.innerHTML = '<span style="font-size:14px;color:#8a6d3b">平衡一次天平，就点亮一条等式！</span>';
    return;
  }
  S.eqGot.forEach((eq)=>{
    const s = document.createElement("span");
    s.className = "eq-chip";
    s.textContent = eq;
    box.appendChild(s);
  });
}

/* ---------- 载入第 r 轮 ---------- */
function loadRound(r){
  S.ri = r;
  S.placed = {}; S.chipsOn = [];
  S.lock = false; S.roundActive = true;
  S.revealUsedThisRound = false; S.revealing = false;
  const lv = curLevel(), rd = lv.rounds[r];
  $("round-ind").textContent = "第" + (r+1) + "/" + lv.rounds.length + "轮";
  $("round-goal").textContent = "🎯 " + rd.goal;
  renderShelf(lv, rd);
  renderPans(lv, rd);
  refreshBalance();
}

function curLevel(){ return S.levels[S.li]; }
function curRound(){ return curLevel().rounds[S.ri]; }

/* ---------- 货架 ---------- */
function renderShelf(lv, rd){
  const sh = $("shelf");
  sh.innerHTML = "";
  (rd.fruits||[]).forEach((e)=>{
    sh.appendChild(makeCard({emoji:e, label:lv.names[e], sub:"＋1", n:1, lv}));
    if(rd.stack){ sh.appendChild(makeCard({emoji:e, label:lv.names[e], sub:"＋5", n:5, lv})); }
  });
  (rd.chips||[]).forEach((v)=>{
    sh.appendChild(makeCard({emoji:"🧱", label:v+lv.unit+"砝码", sub:"＋"+v+lv.unit, chip:v, lv}));
  });
  if((rd.fruits||[]).length+(rd.chips||[]).length===0){
    sh.innerHTML = '<div style="font-size:18px;font-weight:800;color:#8a6d3b">本轮流派特殊：请看目标提示 🤔</div>';
  }
}
function makeCard(o){
  const d = document.createElement("div");
  d.className = "scard";
  d.innerHTML = '<div class="sc-emoji">'+(typeof o.chip === "number" ? "🧱" : o.emoji)+'</div>'+
                '<div class="sc-name">'+o.label+'</div><div class="sc-sub">'+o.sub+'</div>';
  bindDrag(d, o);     // 绑定拖拽 + 轻点
  return d;
}

/* ---------- 左右盘渲染 ---------- */
function renderPans(lv, rd){
  // 左盘：任务物品（锁定）
  const pl = $("pan-l");
  pl.innerHTML = '<div class="pan-title">左盘 · 任务物品</div>' + sideHTML(rd.left, lv);
  refreshRightPan();
}
function refreshRightPan(){
  const lv = curLevel();
  const pr = $("pan-r");
  let html = '<div class="pan-title">右盘 · 拖到这里</div>';
  let any = false;
  Object.keys(S.placed).forEach((e)=>{
    const n = S.placed[e];
    if(n>0){
      any = true;
      html += '<div class="pgroup" data-e="'+e+'">'+e+'<span style="font-size:14px">×'+n+'</span>'+
              '<button class="pg-rm" data-e="'+e+'" title="取回一个">−</button></div>';
    }
  });
  if(S.chipsOn.length>0){
    any = true;
    html += '<div class="pchips">';
    S.chipsOn.forEach((v,i)=>{
      html += '<span class="chip-tok rm" data-i="'+i+'" title="取回砝码">'+v+lv.unit+'</span>';
    });
    const tot = S.chipsOn.reduce((a,b)=>a+b,0);
    html += '<span class="psum">砝码共 '+tot+lv.unit+'</span></div>';
  }
  if(!any){ html += '<div class="pan-empty">空空的，拖点东西进来吧</div>'; }
  pr.innerHTML = html;
  // 绑定取回事件
  pr.querySelectorAll(".pg-rm").forEach((b)=>{
    b.addEventListener("click", (ev)=>{ ev.stopPropagation(); removeFruit(b.dataset.e); });
  });
  pr.querySelectorAll(".chip-tok.rm").forEach((t)=>{
    t.addEventListener("click", (ev)=>{ ev.stopPropagation(); removeChip(parseInt(t.dataset.i,10)); });
  });
}

/* ---------- 重量计算 ---------- */
function leftWeight(){
  const lv = curLevel(), rd = curRound();
  let w = 0;
  rd.left.forEach((it)=>{
    if(it.e){ w += it.n * lv.weights[it.e]; }
    else if(typeof it.c === "number"){ w += it.c; }
  });
  return w;
}
function rightWeight(){
  const lv = curLevel();
  let w = 0;
  Object.keys(S.placed).forEach((e)=>{ w += S.placed[e]*lv.weights[e]; });
  S.chipsOn.forEach((v)=>{ w += v; });
  return w;
}

/* ---------- 增删物品（步数统计） ---------- */
function addFruit(e, n){
  if(S.lock) return;
  S.placed[e] = (S.placed[e]||0) + n;
  bump(); refreshRightPan(); refreshBalance();
}
function addChip(v){
  if(S.lock) return;
  S.chipsOn.push(v);
  bump(); refreshRightPan(); refreshBalance();
}
function removeFruit(e){
  if(S.lock) return;
  if(S.placed[e]){ S.placed[e] -= 1; if(S.placed[e]<=0) delete S.placed[e]; }
  bump(); refreshRightPan(); refreshBalance();
}
function removeChip(i){
  if(S.lock) return;
  S.chipsOn.splice(i,1);
  bump(); refreshRightPan(); refreshBalance();
}
function bump(){ S.steps += 1; $("hud-steps").textContent = "👣 " + S.steps + " 步"; }

/* ---------------- 四、大天平：实时倾斜渲染 ---------------- */
let angleCur = 0, angleTarget = 0;
function refreshBalance(){
  // 依据两边重量差计算目标倾角（右重右沉）
  const lw = leftWeight(), rw = rightWeight();
  const d = rw - lw;
  if(d === 0 && (rw>0)){
    angleTarget = 0;
    onBalanced();                       // 平衡 → 过关判定
    return;
  }
  const mag = Math.min(1, Math.abs(d) / Math.max(20, Math.max(lw,rw)*0.22));
  angleTarget = (d>0?1:-1) * (2 + 12*mag);
  updateHint(d);
  $("balance").classList.remove("balanced");
}
function updateHint(d){
  const lv = curLevel();
  if(d === 0){ $("tilt-hint").innerHTML = '<span class="h-eq">⚖️ 平衡啦！</span>'; return; }
  let side, mag;
  if(d < 0){ side = "⬅️ 左盘更重"; } else { side = "右盘更重 ➡️"; }
  const a = Math.abs(d), big = Math.max(20, Math.max(leftWeight(),rightWeight())*0.22);
  if(a > big) { mag = "差得有点多，大胆加（或减）！"; }
  else if(a > big*0.4){ mag = "接近啦，再加一点试试！"; }
  else { mag = "只差一点点了，微调一下！"; }
  $("tilt-hint").innerHTML = side + " · " + mag + '<span style="font-size:14px;color:#8a6d3b">（右盘砝码合计随时可看，水果重量要靠线索推哦）</span>';
}
function balanceLoop(){
  angleCur += (angleTarget - angleCur) * 0.16;
  if(Math.abs(angleTarget-angleCur) < 0.03) angleCur = angleTarget;
  renderBalance(angleCur);
  requestAnimationFrame(balanceLoop);
}
function renderBalance(a){
  const zone = $("balance");
  const cw = zone.clientWidth, ch = zone.clientHeight;
  const beamW = Math.min(cw*0.74, 560), L = beamW/2;
  const cx = cw/2, cy = Math.min(70, ch*0.22);
  const rad = a*Math.PI/180;
  const beam = $("beam");
  beam.style.width = beamW + "px";
  beam.style.top = cy + "px";
  beam.style.transform = "translate(-50%,-50%) rotate(" + a + "deg)";
  const rx = cx + L*Math.cos(rad), ry = cy + L*Math.sin(rad);
  const lx = cx - L*Math.cos(rad), ly = cy - L*Math.sin(rad);
  const wr = $("pan-wrap-r"), wl = $("pan-wrap-l");
  wr.style.left = rx+"px"; wr.style.top = ry+"px";
  wl.style.left = lx+"px"; wl.style.top = ly+"px";
  const post = $("pivot-post");
  post.style.top = cy+"px";
  post.style.height = (ch - cy - 12) + "px";
  $("pivot-cap").style.top = cy + "px";
}
window.addEventListener("resize", ()=>{ renderBalance(angleCur); });

/* ---------- 平衡 → 本轮成功 ---------- */
function onBalanced(){
  if(!S.roundActive || S.lock){ return; }
  S.lock = true; S.roundActive = false;
  $("balance").classList.add("balanced");
  updateHint(0);
  const lv = curLevel(), rd = curRound();
  // 点亮关系册
  if(S.eqGot.indexOf(rd.eq) < 0){ S.eqGot.push(rd.eq); renderEqBook(); }
  const starTxt = S.revealUsedThisRound ? "" : " 自己称出来的，真棒！";
  confettiBurst(window.innerWidth*0.5, window.innerHeight*0.42, 60);
  showModal({
    title:"⚖️ 平衡啦！" + (S.revealUsedThisRound ? "（观看了演示）" : ""),
    body:'<span class="m-eq">✨ ' + rd.eq + '</span>' +
         '<p><b>代换思路：</b>' + rd.reveal + starTxt + '</p>',
    buttons:[{text: S.ri+1 < lv.rounds.length ? "继续下一轮 →" : "完成本关 🎉", fn: nextStep}]
  });
}
function nextStep(){
  hideModal();
  const lv = curLevel();
  if(S.ri+1 < lv.rounds.length){
    loadRound(S.ri+1);
  }else{
    levelDone();
  }
}

/* ---------- 本关结算：星级 + 庆祝 ---------- */
function levelDone(){
  const lv = curLevel();
  let star = 3;
  if(S.reveals > 0){ star = 2; }
  if(S.reveals >= lv.rounds.length){ star = 1; }
  S.stars.push(star);
  confettiBurst(window.innerWidth*0.3, window.innerHeight*0.3, 90);
  confettiBurst(window.innerWidth*0.7, window.innerHeight*0.3, 90);
  const last = S.li+1 >= S.levels.length;
  showModal({
    title:"🎉 第" + (S.li+1) + "关 · " + lv.title + " 通关！",
    body:'<div class="m-star">' + "⭐".repeat(star) + "☆".repeat(3-star) + '</div>' +
         '<p>你已经点亮的关系：' + S.eqGot.map((e)=>"【"+e+"】").join(" ") + '</p>' +
         '<p style="margin-top:8px">用时 ' + fmt(S.sec) + ' · 共 ' + S.steps + ' 步操作</p>',
    buttons:[{text: last ? "查看总成绩 🏆" : "下一关 →", fn: ()=>{
      hideModal();
      if(last){ showFinal(); } else { loadLevel(S.li+1); }
    }}]
  });
}

/* ---------- 总结算屏（烟花庆祝） ---------- */
function showFinal(){
  stopTimer();
  showScreen("final");
  const total = S.stars.reduce((a,b)=>a+b,0);
  $("final-stars").textContent = "⭐".repeat(total) + "☆".repeat(9-total);
  let rows = "";
  S.levels.forEach((lv,i)=>{
    rows += "<div>" + (i+1) + ". " + lv.title + "（" + lv.src + "）—— " +
            "⭐".repeat(S.stars[i]) + "☆".repeat(3-S.stars[i]) + "</div>";
  });
  $("final-stats").innerHTML = rows +
    "<div style='border-top:3px dashed var(--ink);margin-top:8px;padding-top:8px'>总用时 " + fmt(S.sec) +
    " · 总步数 " + S.steps + " · 提示 " + S.sessionReveals + " 次</div>";
  fireworks(2600);
}

/* ---------------- 五、拖拽系统（Pointer Events，鼠标/触摸通用） ---------------- */
const ghost = $("drag-ghost");
let dragCtx = null;   // {card, x, y, moved, t0, payload}
function bindDrag(el, payload){
  el.addEventListener("pointerdown", (ev)=>{
    if(S.lock){ return; }
    ev.preventDefault();
    dragCtx = {x:ev.clientX, y:ev.clientY, moved:false, t0:Date.now(), payload};
    try{ el.setPointerCapture(ev.pointerId); }catch(e){ /* 个别环境无法捕获指针，拖拽仍可继续 */ }
  });
  el.addEventListener("pointermove", (ev)=>{
    if(!dragCtx){ return; }
    const dx = ev.clientX - dragCtx.x, dy = ev.clientY - dragCtx.y;
    if(!dragCtx.moved && Math.abs(dx)+Math.abs(dy) > 10){
      dragCtx.moved = true;
      ghost.classList.remove("hidden");
      ghost.textContent = (typeof dragCtx.payload.chip === "number")
        ? dragCtx.payload.chip + curLevel().unit
        : dragCtx.payload.emoji + (dragCtx.payload.n>1 ? "×"+dragCtx.payload.n : "");
    }
    if(dragCtx.moved){
      ghost.style.left = ev.clientX + "px";
      ghost.style.top = ev.clientY + "px";
      const r = $("pan-r").getBoundingClientRect();
      const hot = ev.clientX>r.left && ev.clientX<r.right && ev.clientY>r.top && ev.clientY<r.bottom;
      $("pan-r").classList.toggle("drop-hot", hot);
    }
  });
  el.addEventListener("pointerup", (ev)=>{
    if(!dragCtx){ return; }
    const ctx = dragCtx; dragCtx = null;
    ghost.classList.add("hidden");
    $("pan-r").classList.remove("drop-hot");
    const r = $("pan-r").getBoundingClientRect();
    const inside = ev.clientX>r.left && ev.clientX<r.right && ev.clientY>r.top && ev.clientY<r.bottom;
    if(ctx.moved){
      if(inside){ commit(ctx.payload); }
    }else if(Date.now()-ctx.t0 < 400){
      commit(ctx.payload);          // 轻点 = 放上
    }
  });
  el.addEventListener("pointercancel", ()=>{
    dragCtx = null; ghost.classList.add("hidden"); $("pan-r").classList.remove("drop-hot");
  });
}
function commit(p){
  if(typeof p.chip === "number"){ addChip(p.chip); }
  else { addFruit(p.emoji, p.n||1); }
}

/* ---------------- 六、彩纸与烟花（Canvas 粒子） ---------------- */
const fx = $("fx"), fctx = fx.getContext("2d");
let parts = [], fxRun = false;
function fxResize(){ fx.width = window.innerWidth; fx.height = window.innerHeight; }
window.addEventListener("resize", fxResize); fxResize();
function confettiBurst(x,y,n){
  const cols = ["#FF8A3D","#FFC94D","#19B37B","#2D7DE1","#E85D9E","#7C5CE0"];
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = 2+Math.random()*6;
    parts.push({
      x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-3,
      g:0.16, life:60+Math.random()*40, r:4+Math.random()*5,
      c:cols[Math.floor(Math.random()*cols.length)], rot:Math.random()*6.28, vr:(Math.random()-0.5)*0.3
    });
  }
  if(!fxRun){ fxRun = true; fxLoop(); }
}
function fxLoop(){
  fctx.clearRect(0,0,fx.width,fx.height);
  parts = parts.filter((p)=>p.life>0);
  parts.forEach((p)=>{
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life -= 1; p.rot += p.vr;
    fctx.save();
    fctx.translate(p.x,p.y); fctx.rotate(p.rot);
    fctx.fillStyle = p.c;
    fctx.globalAlpha = Math.max(0, Math.min(1, p.life/40));
    fctx.fillRect(-p.r/2, -p.r/2, p.r, p.r*1.6);
    fctx.restore();
  });
  if(parts.length>0){ requestAnimationFrame(fxLoop); }
  else { fxRun = false; fctx.clearRect(0,0,fx.width,fx.height); }
}
function fireworks(dur){
  const t0 = Date.now();
  const iv = setInterval(()=>{
    confettiBurst(window.innerWidth*(0.15+Math.random()*0.7),
                  window.innerHeight*(0.15+Math.random()*0.4), 70);
    if(Date.now()-t0 > dur){ clearInterval(iv); }
  }, 320);
}

/* ---------------- 弹窗系统 ---------------- */

/* 揭示答案：自动演示标准解法 */
$("btn-reveal").addEventListener("click", ()=>{
  if(!S.roundActive || S.lock || S.revealing){ return; }
  const lv = curLevel(), rd = curRound();
  showModal({
    title:"💡 要看演示吗？",
    body:"<p>魔法天平会自动摆出答案，但这一轮的星星会变成观星模式哦～</p>",
    buttons:[
      {text:"看我自己来！", fn: hideModal},
      {text:"看演示", fn: ()=>{ hideModal(); playReveal(); }}
    ]
  });
});
function playReveal(){
  const rd = curRound();
  S.revealing = true; S.revealUsedThisRound = true;
  S.reveals += 1; S.sessionReveals += 1;
  // 清空右盘后逐步摆放标准解
  S.placed = {}; S.chipsOn = []; refreshRightPan(); refreshBalance();
  const acts = [];
  rd.solution.forEach((g)=>{
    if(g.e){
      let n = g.n;
      while(n>0){ const k = Math.min(5,n); acts.push({e:g.e, n:k}); n -= k; }
    }else{ acts.push({c:g.c}); }
  });
  let i = 0;
  const step = ()=>{
    if(i >= acts.length){
      S.revealing = false;
      refreshBalance();          // 摆完必然平衡 → 触发结算
      return;
    }
    const a = acts[i]; i += 1;
    if(a.e){ S.placed[a.e] = (S.placed[a.e]||0) + a.n; }
    else { S.chipsOn.push(a.c); }
    refreshRightPan(); updateTiltOnly();
    setTimeout(step, 420);
  };
  step();
}
function updateTiltOnly(){
  // 演示期间只更新倾斜视觉，不触发过关弹窗
  const lw = leftWeight(), rw = rightWeight(), d = rw-lw;
  const mag = Math.min(1, Math.abs(d)/Math.max(20, Math.max(lw,rw)*0.22));
  angleTarget = d===0 ? 0 : (d>0?1:-1)*(2+12*mag);
  if(d!==0){ updateHint(d); }
}
