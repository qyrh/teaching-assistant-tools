<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>和倍彩虹桥 · 线段图搭建师</title>
<style>:root{--bg1:#fff7ed;--bg2:#eef2ff;--ink:#1f2937;--muted:#6b7280;--card:#ffffff;--line:#e5e7eb;--ok:#16a34a;--warn:#ea580c;--accent:#6366f1;--accent2:#f59e0b;--shadow:0 10px 30px rgba(31,41,55,.12);--c0:#6366f1;--c1:#f59e0b;--c2:#10b981;--c3:#ec4899;--c4:#0ea5e9}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0}body{font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));min-height:100vh;line-height:1.5;overflow-x:hidden}h1,h2,h3{margin:0}button{font-family:inherit;cursor:pointer;border:none;border-radius:14px}.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);position:sticky;top:0;z-index:30;box-shadow:0 2px 12px rgba(0,0,0,.06)}.brand{font-weight:900;font-size:clamp(18px,4vw,24px);color:var(--accent);white-space:nowrap}.brand span{color:var(--accent2)}.spacer{flex:1}.stat{display:flex;flex-direction:column;align-items:center;background:#fff;border:2px solid var(--line);border-radius:12px;padding:4px 12px;min-width:64px}.stat b{font-size:clamp(14px,3.5vw,18px);color:var(--accent)}.stat small{font-size:11px;color:var(--muted)}.iconbtn{width:44px;height:44px;border-radius:12px;font-size:20px;background:#fff;border:2px solid var(--line)}.iconbtn:active{transform:scale(.94)}.screen{display:none;padding:12px clamp(10px,3vw,28px) 40px}.screen.active{display:block;animation:fade .35s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.diffwrap{max-width:880px;margin:18px auto}.diffwrap h2{font-size:clamp(20px,5vw,30px);text-align:center;margin-bottom:6px}.diffwrap p.lead{text-align:center;color:var(--muted);font-size:clamp(13px,3.4vw,16px);margin:0 0 22px}.diffgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.diffcard{background:var(--card);border-radius:22px;padding:22px 18px;box-shadow:var(--shadow);border:3px solid transparent;transition:transform .15s,border-color .15s;text-align:center}.diffcard:active{transform:scale(.97)}.diffcard .emoji{font-size:46px;display:block;margin-bottom:8px}.diffcard h3{font-size:clamp(18px,4.6vw,22px);margin-bottom:6px}.diffcard .tag{display:inline-block;padding:3px 12px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;margin-bottom:10px}.diffcard p{font-size:13px;color:var(--muted);margin:0 0 14px;min-height:48px}.diffcard button{width:100%;padding:12px;font-size:16px;font-weight:800;color:#fff;border-radius:14px}.qcard{max-width:920px;margin:14px auto 10px;background:var(--card);border-radius:20px;padding:14px 18px;box-shadow:var(--shadow);border-left:8px solid var(--accent)}.qcard .qtag{font-size:12px;color:var(--accent);font-weight:800;letter-spacing:1px}.qcard .qtext{font-size:clamp(15px,3.8vw,19px);font-weight:600;margin-top:4px}.qcard .qgoal{margin-top:8px;font-size:clamp(14px,3.6vw,17px);color:var(--warn);font-weight:800}.workshop{max-width:920px;margin:0 auto}.section-title{display:flex;align-items:center;gap:8px;font-weight:800;font-size:clamp(14px,3.6vw,17px);margin:14px 0 8px;color:var(--ink)}.section-title .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}.lanes{display:flex;flex-direction:column;gap:12px}.lane{position:relative;background:var(--card);border-radius:16px;padding:10px 12px 14px;box-shadow:0 4px 14px rgba(0,0,0,.05);border:2px dashed var(--line);transition:border-color .2s,background .2s}.lane.dropok{border-color:var(--accent);background:#eef2ff}.lane.ready{border-color:var(--ok);border-style:solid;background:#f0fdf4}.lane-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}.lane-emoji{font-size:24px}.lane-name{font-weight:800;font-size:clamp(14px,3.6vw,17px)}.lane-rel{font-size:12px;color:var(--muted);background:#f3f4f6;padding:2px 8px;border-radius:999px}.lane-parts{margin-left:auto;font-size:13px;font-weight:700;color:var(--accent)}.lane-parts b{font-size:16px}.track{position:relative;height:46px;background:repeating-linear-gradient(90deg,#f9fafb 0,#f9fafb calc(var(--unit) - 2px),#e5e7eb calc(var(--unit) - 2px),#e5e7eb var(--unit));border-radius:10px;overflow:hidden;display:flex;align-items:center;padding:0 4px}.unit-block{height:34px;border-radius:7px;margin-right:3px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15);position:relative;animation:pop .25s ease}@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}.unit-block.fixed{outline:3px solid rgba(255,255,255,.7);outline-offset:-3px}.unit-block .x{position:absolute;top:-6px;right:-4px;width:16px;height:16px;border-radius:50%;background:#ef4444;color:#fff;font-size:11px;display:none;line-height:16px;text-align:center}.lane:not(.base) .unit-block:hover .x{display:block}.base-anchor{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--c0)}.patch-chip{display:inline-flex;align-items:center;gap:4px;margin-left:8px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:800;color:#fff;cursor:pointer;animation:pop .25s ease}.patch-chip.bu{background:#0ea5e9}.patch-chip.qu{background:#f97316}.lane-val{position:absolute;right:12px;bottom:8px;font-size:13px;font-weight:800;color:var(--ink);background:#fffbeb;padding:2px 8px;border-radius:8px;border:1px solid #fde68a}.palette{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch;background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow)}.pal-group{flex:1;min-width:160px}.pal-group h4{font-size:12px;color:var(--muted);margin:0 0 8px;font-weight:700}.pal-items{display:flex;gap:10px;flex-wrap:wrap}.pal-block{width:64px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.18);cursor:grab;touch-action:none;user-select:none;border:2px solid rgba(255,255,255,.6)}.pal-block:active{cursor:grabbing}.pal-block .hint{display:block;font-size:10px;opacity:.9}.pal-token{min-width:70px;padding:8px 12px;border-radius:12px;color:#fff;font-weight:800;font-size:14px;cursor:grab;touch-action:none;user-select:none;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.18);border:2px solid rgba(255,255,255,.6)}.pal-token.used{opacity:.35;cursor:default}.pal-token .small{display:block;font-size:10px;opacity:.9;font-weight:600}.pal-empty{font-size:13px;color:var(--muted);padding:12px 4px}.meter-box{max-width:920px;margin:14px auto 0;background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}.meter-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}.meter-row .label{font-weight:800;font-size:clamp(15px,4vw,19px)}.meter-row .now{font-size:clamp(22px,7vw,34px);font-weight:900;color:var(--accent)}.meter-row .tgt{font-size:16px;color:var(--muted)}.meter-row .diff{margin-left:auto;font-weight:800;font-size:15px}.bar{height:16px;border-radius:999px;background:#eef2ff;overflow:hidden;position:relative}.bar>i{display:block;height:100%;border-radius:999px;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .15s}.bar.match>i{background:linear-gradient(90deg,#16a34a,#22c55e)}.slider-wrap{margin-top:14px}.slider-wrap label{font-weight:800;font-size:15px}.slider-wrap .val{color:var(--accent);font-weight:900;font-size:18px}input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:999px;background:linear-gradient(90deg,#c7d2fe,#fde68a);margin:10px 0 0;outline:none;touch-action:none}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:34px;height:34px;border-radius:50%;background:#fff;border:4px solid var(--accent);box-shadow:0 3px 8px rgba(0,0,0,.25);cursor:grab}input[type=range]::-moz-range-thumb{width:34px;height:34px;border-radius:50%;background:#fff;border:4px solid var(--accent);box-shadow:0 3px 8px rgba(0,0,0,.25);cursor:grab}.hint-line{font-size:13px;color:var(--muted);margin-top:8px;min-height:18px}.hint-line.ok{color:var(--ok);font-weight:800}.actions{max-width:920px;margin:16px auto 0;display:flex;gap:10px;flex-wrap:wrap}.actions button{flex:1;min-width:120px;padding:13px;font-size:15px;font-weight:800}.btn-bridge{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff}.btn-bridge:disabled{opacity:.45;background:#cbd5e1}.btn-reveal{background:#fff;color:var(--ink);border:2px solid var(--line)}.btn-restart{background:#fff;color:var(--warn);border:2px solid #fed7aa}.btn-back{background:#fff;color:var(--muted);border:2px solid var(--line)}.ghost{position:fixed;z-index:9999;pointer-events:none;opacity:.9;transform:translate(-50%,-50%) rotate(-4deg);transition:none}.modal{position:fixed;inset:0;background:rgba(31,41,55,.55);z-index:100;display:none;align-items:center;justify-content:center;padding:18px}.modal.active{display:flex;animation:fade .2s}.modal-card{background:#fff;border-radius:22px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:22px;box-shadow:var(--shadow)}.modal-card h3{font-size:clamp(18px,5vw,23px);margin-bottom:12px;color:var(--accent)}.modal-card p,.modal-card li{font-size:14px;color:var(--ink)}.modal-card ol,.modal-card ul{padding-left:20px}.modal-card li{margin-bottom:6px}.modal-card .step{background:#f5f3ff;border-radius:12px;padding:10px 12px;margin:8px 0;font-weight:600;border-left:5px solid var(--accent)}.modal-card .ans{background:#ecfdf5;border-radius:12px;padding:10px 12px;margin-top:8px;font-weight:800;color:var(--ok);border-left:5px solid var(--ok)}.modal-close{margin-top:16px;width:100%;padding:13px;background:var(--accent);color:#fff;font-weight:800;font-size:16px;border-radius:14px}#confetti{position:fixed;inset:0;z-index:200;pointer-events:none;display:none}.celebrate{position:fixed;inset:0;z-index:199;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(255,255,255,.4);backdrop-filter:blur(2px)}.celebrate.active{display:flex}.celebrate .box{background:#fff;border-radius:24px;padding:26px 30px;text-align:center;box-shadow:var(--shadow);animation:pop .4s ease}.celebrate h2{font-size:clamp(24px,7vw,38px);color:var(--ok);margin-bottom:6px}.celebrate p{color:var(--muted);margin:0 0 16px}.celebrate button{padding:12px 26px;font-size:16px;font-weight:800;background:var(--accent);color:#fff;border-radius:14px}.bridge{height:10px;border-radius:999px;background:#e5e7eb;margin-top:8px;overflow:hidden}.bridge>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f59e0b,#ec4899,#6366f1)}@media(max-width:560px){.lane-val{position:static;display:inline-block;margin-top:6px}.pal-block{width:56px;height:42px}}
</style>
</head>
<body>

<!-- ============ 顶栏 ============ -->
<div class="topbar">
  <div class="brand">🌈 和倍<span>彩虹桥</span></div>
  <div class="spacer"></div>
  <div class="stat"><b id="stTimer">0″</b><small>计时</small></div>
  <div class="stat"><b id="stSteps">0</b><small>步数</small></div>
  <div class="stat"><b id="stStar">0</b><small>通关</small></div>
  <button class="iconbtn" id="btnRules" title="规则说明">❓</button>
</div>

<!-- ============ 难度选择屏 ============ -->
<div class="screen active" id="screenDiff">
  <div class="diffwrap">
    <h2>欢迎来到线段图搭建工坊</h2>
    <p class="lead">把“和倍问题”变成动手搭建的彩虹桥：拖砖建线段图、多去少补、滑动定每份，搭对就亮灯通关！</p>
    <div class="diffgrid" id="diffGrid"></div>
  </div>
</div>

<!-- ============ 游戏屏 ============ -->
<div class="screen" id="screenGame">
  <div class="qcard">
    <div class="qtag" id="qTag">关卡</div>
    <div class="qtext" id="qText"></div>
    <div class="qgoal" id="qGoal"></div>
  </div>

  <div class="workshop">
    <div class="section-title"><span class="dot"></span>第一步 · 拖砖搭建线段图（数清每条是几份）</div>
    <div class="lanes" id="lanes"></div>

    <div class="section-title"><span class="dot" style="background:var(--accent2)"></span>第二步 · 工具架（从这里拖到上面的线段里）</div>
    <div class="palette" id="palette"></div>

    <div class="section-title"><span class="dot" style="background:var(--ok)"></span>第三步 · 滑动定“1份”是多少，让总和正好等于目标</div>
    <div class="meter-box">
      <div class="meter-row">
        <span class="label">当前总和</span>
        <span class="now" id="mNow">0</span>
        <span class="tgt">／ 目标 <b id="mTgt">0</b></span>
        <span class="diff" id="mDiff"></span>
      </div>
      <div class="bar" id="meterBar"><i></i></div>
      <div class="slider-wrap">
        <label>每份（1份）= <span class="val" id="baseVal">1</span></label>
        <input type="range" id="baseSlider" min="1" max="100" value="1" step="1">
      </div>
      <div class="hint-line" id="hintLine">先把每条线段搭成整倍数，再滑动找每份的大小～</div>
      <div class="bridge"><i id="bridgeFill"></i></div>
    </div>

    <div class="actions">
      <button class="btn-bridge" id="btnBridge" disabled>🌉 搭彩虹桥通关</button>
      <button class="btn-reveal" id="btnReveal">💡 揭示答案</button>
      <button class="btn-restart" id="btnRestart">🔄 重新开始</button>
      <button class="btn-back" id="btnBack">↩ 返回难度选择</button>
    </div>
  </div>
</div>

<!-- ============ 规则/答案 弹窗 ============ -->
<div class="modal" id="modal"><div class="modal-card" id="modalCard"></div></div>

<!-- ============ 通关庆祝 ============ -->
<canvas id="confetti"></canvas>
<div class="celebrate" id="celebrate">
  <div class="box">
    <h2>🎉 搭建成功！</h2>
    <p id="celMsg">彩虹桥亮起来啦～</p>
    <button id="celNext">继续挑战</button>
  </div>
</div>

<script>"use strict";function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a}function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function solveProblem(prob){const totalParts=prob.lanes.reduce((s,l)=>s+l.parts,0);const totalPatch=prob.lanes.reduce((s,l)=>s+l.patch,0);const base=(prob.sum-totalPatch)/totalParts;const values=prob.lanes.map(l=>l.parts*base+l.patch);return{base,totalParts,totalPatch,values,adjSum:prob.sum-totalPatch}}const TPL_EASY=[{story:"文具店里彩色粉笔和白色粉笔一共240盒，白色粉笔是彩色粉笔的5倍。两种粉笔各有多少盒？",sum:240,lanes:[{name:"彩色粉笔",emoji:"🖍️",parts:1,patch:0,isBase:true,rel:"1份（基准）"},{name:"白色粉笔",emoji:"📦",parts:5,patch:0,rel:"5倍"}]},{story:"校园里柳树和杨树一共有260棵，杨树是柳树的4倍。柳树和杨树各有多少棵？",sum:260,lanes:[{name:"柳树",emoji:"🌿",parts:1,patch:0,isBase:true,rel:"1份（基准）"},{name:"杨树",emoji:"🌳",parts:4,patch:0,rel:"4倍"}]},{story:"一道除法算式里，被除数与除数的和是136，被除数是除数的7倍。被除数和除数各是多少？",sum:136,lanes:[{name:"除数",emoji:"➗",parts:1,patch:0,isBase:true,rel:"1份（基准）"},{name:"被除数",emoji:"🔢",parts:7,patch:0,rel:"7倍"}]},{story:"甲、乙两数之和是231，甲数末尾去掉一个0正好等于乙数。甲、乙两数各是多少？",sum:231,lanes:[{name:"乙数",emoji:"🔢",parts:1,patch:0,isBase:true,rel:"1份（基准）"},{name:"甲数",emoji:"🔟",parts:10,patch:0,rel:"10倍"}]}];function genEasy(){const k=randInt(2,6);const b=randInt(20,80);const themes=[{base:["红花朵","🟥"],other:["黄花朵","🟨"]},{base:["小羊","🐑"],other:["大羊","🐏"]},{base:["红气球","🎈"],other:["蓝气球","🟦"]},{base:["故事本","📖"],other:["图画本","🖼️"]}];const th=pick(themes);return{story:`花园里${th.base[0]}和${th.other[0]}一共有${b*(k+1)}个，${th.other[0]}是${th.base[0]}的${k}倍。两种各有多少个？`,sum:b*(k+1),lanes:[{name:th.base[0],emoji:th.base[1],parts:1,patch:0,isBase:true,rel:"1份（基准）"},{name:th.other[0],emoji:th.other[1],parts:k,patch:0,rel:k+"倍"}]}}const TPL_MID=[{story:"光明小学一共有学生760人，其中男生比女生的3倍少40人。男、女生各有多少人？",sum:760,lanes:[{name:"女生",emoji:"👧",parts:1,patch:0,isBase:true,rel:"1份（基准）"},{name:"男生",emoji:"👦",parts:3,patch:-40,rel:"3倍少40"}]},{story:"动物园猴山上一共有猴子180只，大猴子的数量比小猴子的3倍少8只。大、小猴子各有多少只？",sum:180,lanes:[{name:"小猴子",emoji:"🐒",parts:1,patch:0,isBase:true,rel:"1份（基准）"},{name:"大猴子",emoji:"🦍",parts:3,patch:-8,rel:"3倍少8"}]},{story:"书架上一共有书47本，故事书比连环画的4倍多7本。故事书和连环画各有多少本？",sum:47,lanes:[{name:"连环画",emoji:"📕",parts:1,patch:0,isBase:true,rel:"1份（基准）"},{name:"故事书",emoji:"📗",parts:4,patch:7,rel:"4倍多7"}]},{story:"动物园里犀牛和大象一共重1500千克，大象的体重比犀牛的3倍多20千克。犀牛和大象各重多少千克？",sum:1500,lanes:[{name:"犀牛",emoji:"🦏",parts:1,patch:0,isBase:true,rel:"1份（基准）"},{name:"大象",emoji:"🐘",parts:3,patch:20,rel:"3倍多20"}]}];function genMid(){const k=randInt(2,4);const b=randInt(40,150);const d=randInt(6,40);const sign=pick([1,-1]);const patch=sign*d;const themes=[{base:["小红苹果","🍎"],other:["大青苹果","🍏"]},{base:["小金鱼","🐟"],other:["大锦鲤","🐠"]},{base:["白兔","🐇"],other:["灰兔","🐰"]},{base:["糖包","🍬"],other:["糕点","🧁"]}];const th=pick(themes);const rel=patch>0?k+"倍多"+d:k+"倍少"+d;const value=k*b+patch;return{story:`仓库里${th.base[0]}和${th.other[0]}一共有${value+b}件，${th.other[0]}比${th.base[0]}的${rel.replace("倍","倍")}。两种各有多少件？`,sum:value+b,lanes:[{name:th.base[0],emoji:th.base[1],parts:1,patch:0,isBase:true,rel:"1份（基准）"},{name:th.other[0],emoji:th.other[1],parts:k,patch,rel}]}}const TPL_HARD=[{story:"甲、乙、丙三个数之和是183，乙比丙的2倍少4，甲比丙的3倍多7。甲、乙、丙各是多少？",sum:183,lanes:[{name:"丙",emoji:"🔵",parts:1,patch:0,isBase:true,rel:"1份（基准）"},{name:"乙",emoji:"🟢",parts:2,patch:-4,rel:"2倍少4"},{name:"甲",emoji:"🔴",parts:3,patch:7,rel:"3倍多7"}]},{story:"果园里有桃树、梨树、苹果树共552棵。桃树比梨树的2倍多12棵，苹果树比梨树少20棵。三种树各有多少棵？",sum:552,lanes:[{name:"梨树",emoji:"🍐",parts:1,patch:0,isBase:true,rel:"1份（基准）"},{name:"苹果树",emoji:"🍎",parts:1,patch:-20,rel:"少20"},{name:"桃树",emoji:"🍑",parts:2,patch:12,rel:"2倍多12"}]},{story:"养殖场养鸡、鸭、鹅共1462只。鸡的只数比鸭的4倍多132只，鹅的只数比鸭的2倍少70只。鸡、鸭、鹅各有多少只？",sum:1462,lanes:[{name:"鸭",emoji:"🦆",parts:1,patch:0,isBase:true,rel:"1份（基准）"},{name:"鹅",emoji:"🦢",parts:2,patch:-70,rel:"2倍少70"},{name:"鸡",emoji:"🐔",parts:4,patch:132,rel:"4倍多132"}]},{story:"一家三口人，三人年龄之和是72岁，妈妈和爸爸
