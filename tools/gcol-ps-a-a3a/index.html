<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>小数同步·3年级上游戏合集 · 教参游戏合集</title>
<style>
:root{--panel:#fff;--ink:#1f2d45;--ink2:#4b5b74;--ink3:#66758d;--line:#dde6f3;--accent:#3a7bd5;--accent2:#2a5fb0;--soft:#e8f0fd}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;background:linear-gradient(165deg,#f5f9ff,#e9f0fb 60%,#e4ecf8);min-height:100vh;color:var(--ink);-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:10;padding:14px 24px 12px;background:rgba(255,255,255,.88);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;flex:1 1 360px;min-width:0}
.logo{flex:none;width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#4a90e2,#3a7bd5);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 10px rgba(58,123,213,.28)}
.bt{min-width:0}
h1{font-size:21px;line-height:1.3}
h1 .pill{display:inline-block;vertical-align:3px;margin-left:8px;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--accent2);font-size:13px;font-weight:600;white-space:nowrap}
.meta{font-size:13px;color:var(--ink3);margin-top:2px}
.search{position:relative;flex:1 1 320px;max-width:520px}
.search input{width:100%;height:42px;border:1.5px solid var(--line);border-radius:999px;background:#fff;padding:0 46px;font-size:15px;font-family:inherit;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(58,123,213,.15)}
.search input::-webkit-search-cancel-button{display:none}
.search .ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:15px;pointer-events:none}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:50%;background:transparent;color:var(--ink3);font-size:20px;line-height:1;cursor:pointer;display:none}
.search .clear:hover{background:#eef3fb;color:var(--ink)}
.search .clear.show{display:block}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.bar.hide{display:none}
.chip{height:38px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-family:inherit;cursor:pointer;color:var(--ink2);transition:border-color .15s,color .15s}
.chip:hover{border-color:var(--accent);color:var(--accent2)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px rgba(58,123,213,.3)}
.count{margin-left:auto;font-size:13px;color:var(--ink3);white-space:nowrap}
main{padding:16px 24px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;gap:7px;min-height:152px;padding:14px 15px 13px;text-align:left;font-family:inherit;color:inherit;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;cursor:pointer;transition:transform .16s,box-shadow .16s,border-color .16s}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 10px 24px rgba(40,70,140,.14)}
.card:active{transform:translateY(-1px)}
.card:focus-visible{outline:3px solid rgba(58,123,213,.45);outline-offset:2px}
.card .top{display:flex;gap:6px;flex-wrap:wrap}
.badge{padding:3px 9px;border-radius:8px;background:var(--soft);color:var(--accent2);font-size:13px;font-weight:700;line-height:1.3}
.tag{padding:3px 8px;border-radius:8px;background:#f1f4f9;color:var(--ink3);font-size:12px;line-height:1.3}
.card .t,.card .j{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.card .t{font-size:16px;font-weight:700;line-height:1.4;-webkit-line-clamp:2;min-height:44.8px}
.card .j{font-size:13.5px;line-height:1.5;color:var(--ink2);-webkit-line-clamp:2}
.card .go{margin-top:auto;font-size:13px;font-weight:600;color:var(--accent2);opacity:0;transform:translateX(-4px);transition:opacity .16s,transform .16s}
.card:hover .go,.card:focus-visible .go{opacity:1;transform:none}
.empty{grid-column:1/-1;padding:64px 0;text-align:center;color:var(--ink3)}
.empty .big{font-size:52px;line-height:1;margin-bottom:12px}
.empty p{font-size:16px;margin-bottom:16px}
.empty button{height:40px;padding:0 22px;border:0;border-radius:999px;background:var(--accent);color:#fff;font-size:14px;font-family:inherit;cursor:pointer}
.empty button:hover{background:var(--accent2)}
footer{padding:4px 24px 24px;font-size:13px;line-height:1.8;color:var(--ink3)}
kbd{padding:0 5px;border:1px solid #c9d5e6;border-bottom-width:2px;border-radius:5px;background:#fff;color:var(--ink2);font-family:inherit;font-size:12px}
#stage{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;background:#fff}
#stage.on{display:flex}
#stageBar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#f0f4fb;border-bottom:1px solid #dbe4f2}
#stageBar button{flex:none;height:38px;padding:0 16px;border:0;border-radius:9px;font-size:14px;font-family:inherit;cursor:pointer}
#back{background:var(--accent);color:#fff}
#back:hover{background:var(--accent2)}
#reload{border:1.5px solid var(--line);background:#fff;color:var(--ink2)}
#reload:hover{border-color:var(--accent);color:var(--accent2)}
#stageBar .n{flex:1;min-width:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stageBar .n small{margin-left:8px;font-size:13px;font-weight:normal;color:var(--ink3)}
#stageF{flex:1;width:100%;border:0;background:#fff}
#stageLoad{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);display:none;padding:10px 18px;border-radius:10px;background:#fff;color:var(--ink3);font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.1)}
#stage.loading #stageLoad{display:block}
@media (max-width:720px){header{padding:12px 14px}main{padding:14px 14px 20px;grid-template-columns:1fr}h1{font-size:18px}footer{padding:4px 14px 20px}}
</style>

var grades=Object.keys(G.reduce(function(a,g){if(g.grade)a[g.grade]=1;return a;},{})).sort();
var multi=grades.length>1;   /* 只有一个年级时筛选条没有意义，并进副标题 */
$("meta").textContent="教参游戏合集 · "+(multi?"按年级筛选，点开即玩":(grades.length?grades[0]+" · ":"")+"每个游戏对应一讲");
if(multi){
 ["全部"].concat(grades).forEach(function(g){
  var c=el("button","chip"+(g===st.grade?" on":""),g);c.type="button";
  c.onclick=function(){st.grade=g;bar.querySelectorAll(".chip").forEach(function(x){x.classList.remove("on")});c.classList.add("on");render();};
  bar.appendChild(c);});
}
var count=el("span","count");bar.appendChild(count);
/* 卡片上的讲次徽标：有「第N讲」就显示它，否则显示教参名开头的编号 */
function parts(g){
 var raw=(g.jiaocan||"").replace(/\s+/g," ").trim(),m=raw.match(/第\s*([\d一二三四五六七八九十百]+)\s*讲/),b="";
 if(m){b="第"+m[1]+"讲";}
 else{m=raw.match(/^【?(\d+)】?/);if(m)b=m[1];}
 raw=raw.replace(/^(?:【\d+】\s*)?第\s*[\d一二三四五六七八九十百]+\s*讲(?=\s|$)\s*/,"").replace(/^【\d+】\s*/,"");
 return {badge:b,lesson:raw};
}
function norm(s){return (s||"").toLowerCase().replace(/\s+/g,"");}
function render(){
 var qn=norm(st.q),filtered=!!(qn||st.grade!=="全部");
 var hit=G.filter(function(g){return (st.grade==="全部"||g.grade===st.grade)&&(!qn||norm(g.jiaocan+" "+g.name+" "+g.unit+" "+(g.kinds||[]).join(" ")).indexOf(qn)>=0);});
 count.textContent=filtered?("筛出 "+hit.length+" / "+G.length+" 个"):"";
 bar.classList.toggle("hide",!bar.querySelector(".chip")&&!filtered);
 grid.textContent="";
 if(!hit.length){
  var e=el("div","empty");e.appendChild(el("div","big","🔍"));e.appendChild(el("p",null,"没有找到匹配的游戏"));
  var b=el("button",null,"清除搜索和筛选");b.type="button";
  b.onclick=function(){st.q="";st.grade="全部";q.value="";clearBtn.classList.remove("show");bar.querySelectorAll(".chip").forEach(function(x){x.classList.toggle("on",x.textContent==="全部");});render();};
  e.appendChild(b);grid.appendChild(e);return;
 }
 var frag=document.createDocumentFragment();
 hit.forEach(function(g){
  var p=parts(g),c=el("button","card");c.type="button";c.title=g.jiaocan||g.name;
  var top=el("div","top");
  if(p.badge)top.appendChild(el("span","badge",p.badge));
  if(multi&&g.grade)top.appendChild(el("span","tag",g.grade));
  (g.kinds||[]).forEach(function(k){top.appendChild(el("span","tag",k));});
  c.appendChild(top);
  c.appendChild(el("div","t",g.name));
  c.appendChild(el("div","j",p.lesson||g.jiaocan||""));
  c.appendChild(el("div","go","▶ 开始游戏"));
  c.onclick=function(){open(g);};
  frag.appendChild(c);
 });
 grid.appendChild(frag);
}
function open(g){
 stName.textContent=g.name;
 if(g.jiaocan)stName.appendChild(el("small",null,g.jiaocan));
 stage.classList.add("on","loading");
 stageF.src=g.file;
 try{if(!(history.state&&history.state.taStage))history.pushState({taStage:1},"");}catch(e){}
}
function hideStage(){stage.classList.remove("on","loading");stageF.src="about:blank";}
$("back").onclick=function(){
 if(history.state&&history.state.taStage){history.back();return;}   /* popstate 里统一收起：鼠标后退键、Alt+← 也能关 */
 hideStage();
};
window.onpopstate=function(){if(stage.classList.contains("on"))hideStage();};
stageF.onload=function(){stage.classList.remove("loading");};
$("reload").onclick=function(){var src=stageF.getAttribute("src");if(!src)return;stage.classList.add("loading");stageF.src=src;};
q.oninput=function(){st.q=this.value.trim();clearBtn.classList.toggle("show",!!this.value);render();};
clearBtn.onclick=function(){q.value="";st.q="";clearBtn.classList.remove("show");q.focus();render();};
document.addEventListener("keydown",function(e){
 if(e.key==="Escape"){if(stage.classList.contains("on")){$("back").click();}else if(q.value){clearBtn.click();}return;}
 if(e.key==="/"&&!stage.classList.contains("on")&&!(e.target&&/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))){e.preventDefault();q.focus();}
});
render();
</script>
</body>
</html>
