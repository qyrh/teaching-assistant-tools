"“会缺少10块”——不够分是【亏】，放亏架"},{name:"方案二",per:8,perText:"每人分 8 块",cond:"如果每人分8块，会缺少24块",kind:"direct",pileVal:24,pileType:"kui",pileShow:"缺少 24 块",hint:"“会缺少24块”——不够分是【亏】，放亏架"}],signYing:1,signKui:-1,barrelNote:"分东西规律：剩下（盈）的要【加】进桶里，缺少（亏）的要从桶里【拿走】。",d:2,diff:14,n:7,total:32,totalPhrase:"巧克力总数",answer:"巧克力 32 块（分给了 7 个小朋友）。",analysis:"两种分法都是缺少巧克力，第二种比第一种多缺少：24-10=14（块）。这14块巧克力被分给所有小朋友，每人分到：8-6=2（块）。所以共有小朋友：14÷2=7（人）。乐乐老师共有巧克力：7×6-10=32（块）。"},{id:"p1",src:"练习1",tier:1,typeName:"盈盈型",unitWord:"个小朋友",unitFig:"🧒",itemName:"个礼物",itemIcon:"🎁",question:"老师给三年级(2)班的小朋友发儿童节小礼物，如果每人发5个会剩下3个；如果每人发4个会剩下9个，三年级(2)班一共有多少个小朋友？",goal:"目标：找出三年级(2)班的小朋友人数",plans:[{name:"方案一",per:5,perText:"每人发 5 个",cond:"如果每人发5个会剩下3个",kind:"direct",pileVal:3,pileType:"ying",pileShow:"剩下 3 个",hint:"“会剩下3个”——有剩余是【盈】，放盈架"},{name:"方案二",per:4,perText:"每人发 4 个",cond:"如果每人发4个会剩下9个",kind:"direct",pileVal:9,pileType:"ying",pileShow:"剩下 9 个",hint:"“会剩下9个”——有剩余是【盈】，放盈架"}],signYing:1,signKui:-1,barrelNote:"分东西规律：剩下（盈）的要【加】进桶里，缺少（亏）的要从桶里【拿走】。",d:1,diff:6,n:6,total:33,totalPhrase:"小礼物总数",answer:"三年级(2)班一共有 6 个小朋友。",analysis:"两种发法都会有剩余，第二种比第一种多剩下：9-3=6（个）。这6个礼物分给所有小朋友，每人分到：5-4=1（个）。所以共有小朋友：6÷1=6（个）。"},{id:"p2",src:"练习2",tier:1,typeName:"盈盈型",unitWord:"天",unitFig:"📅",itemName:"根萝卜",itemIcon:"🥕",question:"冬天到了，小白兔拿出一筐萝卜当作一段时间的粮食。如果每天吃2根，能剩下15根；如果每天吃4根，能剩下1根。您知道小白兔这筐萝卜有多少根吗？",goal:"目标：找出吃的天数，并装出萝卜总数",plans:[{name:"方案一",per:2,perText:"每天吃 2 根",cond:"如果每天吃2根，能剩下15根",kind:"direct",pileVal:15,pileType:"ying",pileShow:"剩下 15 根",hint:"“能剩下15根”——有剩余是【盈】，放盈架"},{name:"方案二",per:4,perText:"每天吃 4 根",cond:"如果每天吃4根，能剩下1根",kind:"direct",pileVal:1,pileType:"ying",pileShow:"剩下 1 根",hint:"“能剩下1根”——有剩余是【盈】，放盈架"}],signYing:1,signKui:-1,barrelNote:"分东西规律：剩下（盈）的要【加】进桶里，缺少（亏）的要从桶里【拿走】。",d:2,diff:14,n:7,total:29,totalPhrase:"萝卜总数",answer:"这筐萝卜有 29 根。",analysis:"两种吃法都会剩下萝卜，第一种比第二种多剩下：15-1=14（根）。这14根萝卜分到每天可以多吃：4-2=2（根）。这筐萝卜打算吃：14÷2=7（天）。所以一筐萝卜共有：4×7+1=29（根）。"},{id:"p3",src:"练习3",tier:2,typeName:"盈盈型（筹钱）",unitWord:"个小朋友",unitFig:"🧒",itemName:"元零花钱",itemIcon:"💰",question:"乐乐老师的生日快到了，田田和几位伙伴商量筹钱给乐乐老师买件礼物，若每人出5元，则多了5元；若每人出10元，则多了30元。问：小朋友们想买的礼品定价是多少？",goal:"目标：找出筹钱的人数，并装出礼品的定价",plans:[{name:"方案一",per:5,perText:"每人出 5 元",cond:"若每人出5元，则多了5元",kind:"direct",pileVal:5,pileType:"ying",pileShow:"多了 5 元",hint:"“多了5元”——筹的钱有剩余是【盈】，放盈架"},{name:"方案二",per:10,perText:"每人出 10 元",cond:"若每人出10元，则多了30元",kind:"direct",pileVal:30,pileType:"ying",pileShow:"多了 30 元",hint:"“多了30元”——筹的钱有剩余是【盈】，放盈架"}],signYing:-1,signKui:1,barrelNote:"筹钱规律（跟分东西相反！）：多出来（盈）的钱没花掉，要从总额里【拿走】才是定价。",d:5,diff:25,n:5,total:20,totalPhrase:"礼品定价",answer:"小朋友们想买的礼品定价是 20 元。",analysis:"两种筹钱方式都是钱多了，第二种比第一种多出：30-5=25（元）。这是因为每人多出：10-5=5（元）。共有小朋友：25÷5=5（人）。所以礼品定价是：5×5-5=20（元）。"},{id:"p4",src:"练习4",tier:2,typeName:"亏亏型",unitWord:"天",unitFig:"📅",itemName:"根萝卜",itemIcon:"🥕",question:"冬天到了，小白兔拿出一筐萝卜当作一段时间的粮食。如果每天吃5根，还少3根；如果每天吃6根，还少8根，你知道小白兔这筐萝卜有多少根吗？",goal:"目标：找出吃的天数，并装出萝卜总数",plans:[{name:"方案一",per:5,perText:"每天吃 5 根",cond:"如果每天吃5根，还少3根",kind:"direct",pileVal:3,pileType:"kui",pileShow:"还少 3 根",hint:"“还少3根”——不够吃是【亏】，放亏架"},{name:"方案二",per:6,perText:"每天吃 6 根",cond:"如果每天吃6根，还少8根",kind:"direct",pileVal:8,pileType:"kui",pileShow:"还少 8 根",hint:"“还少8根”——不够吃是【亏】，放亏架"}],signYing:1,signKui:-1,barrelNote:"分东西规律：剩下（盈）的要【加】进桶里，缺少（亏）的要从桶里【拿走】。",d:1,diff:5,n:5,total:22,totalPhrase:"萝卜总数",answer:"这筐萝卜有 22 根。",analysis:"两种吃法萝卜都不够吃，第二种与第一种相差：8-3=5（根）。这5根萝卜分到每天可以多吃：6-5=1（根）。这筐萝卜打算吃：5÷1=5（天）。所以一筐萝卜共有：5×5-3=22（根）。"},{id:"p5",src:"练习5",tier:2,typeName:"盈盈型（床位）",unitWord:"个帐篷",unitFig:"⛺",itemName:"个床位",itemIcon:"🛏️",question:"三年级的小朋友们去郊外参加夏令营活动，若每个帐篷住4名同学，则会剩下15个床位没人住。若每个帐篷住3名同学，则会剩下5个床位没人住。请计算出参加夏令营的同学人数。",goal:"目标：找出帐篷数，并装出参加夏令营的同学人数",plans:[{name:"方案一",per:4,perText:"每帐篷住 4 人",cond:"若每个帐篷住4名同学，则会剩下15个床位没人住",kind:"direct",pileVal:15,pileType:"ying",pileShow:"空 15 个床位",hint:"“剩下15个床位没人住”——有多余是【盈】，放盈架"},{name:"方案二",per:3,perText:"每帐篷住 3 人",cond:"若每个帐篷住3名同学，则会剩下5个床位没人住",kind:"direct",pileVal:5,pileType:"ying",pileShow:"空 5 个床位",hint:"“剩下5个床位没人住”——有多余是【盈】，放盈架"}],signYing:-1,signKui:1,barrelNote:"床位规律（跟
