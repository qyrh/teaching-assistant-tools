<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>彩虹分数工坊——分数的基本性质和约分</title>
<style>:root{--c-primary:#1976D2;--c-soft:#BBDEFB;--c-accent:#FF8F00;--c-bg:#E3F2FD;--c-card:#FFFFFF;--c-ink:#263238;--c-ok:#1B5E20;--c-bad:#B71C1C}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0}body{font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;background:var(--c-bg);color:var(--c-ink);min-height:100vh;font-size:18px}#app{max-width:920px;margin:0 auto;padding:14px}.screen{display:none;flex-direction:column;gap:14px}.screen.active{display:flex}#screen-start{align-items:center;padding-top:26px}.game-title{font-size:44px;font-weight:900;margin:6px 0 2px;letter-spacing:2px;color:var(--c-primary);text-shadow:3px 3px 0 var(--c-soft)}.game-sub{font-size:20px;margin:0 0 18px;color:var(--c-ink)}.diff-grid{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;width:100%}.diff-card{flex:1 1 240px;max-width:280px;background:var(--c-card);border:5px solid var(--c-primary);border-radius:22px;padding:20px 16px;cursor:pointer;text-align:center;color:var(--c-ink);box-shadow:0 6px 0 rgba(0,0,0,.12);transition:transform .12s}.diff-card:hover{transform:translateY(-4px)}.diff-card .d-name{font-size:26px;font-weight:900;color:var(--c-primary)}.diff-card .d-desc{font-size:17px;margin-top:8px;line-height:1.55}.diff-card .d-tag{display:inline-block;margin-top:10px;background:var(--c-accent);color:#fff;border-radius:999px;padding:3px 14px;font-size:15px;font-weight:700}.palette-tip{font-size:16px;color:#546E7A;margin-top:16px}#topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--c-card);border-radius:16px;padding:10px 14px;box-shadow:0 3px 0 rgba(0,0,0,.08)}.stat-chip{background:var(--c-soft);color:var(--c-ink);font-weight:800;font-size:18px;border-radius:999px;padding:6px 14px;white-space:nowrap}.topbar-btns{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px}.btn{border:none;border-radius:12px;padding:9px 14px;font-size:17px;font-weight:800;cursor:pointer;background:var(--c-primary);color:#fff}.btn.ghost{background:var(--c-card);color:var(--c-primary);border:3px solid var(--c-primary)}.btn.warn{background:var(--c-accent)}.btn:active{transform:translateY(2px)}#task-card{background:var(--c-card);border-left:10px solid var(--c-accent);border-radius:14px;padding:14px 18px;font-size:20px;line-height:1.65}#task-card .t-head{font-size:17px;font-weight:800;color:var(--c-accent);margin-bottom:4px}#task-card .t-know{margin-top:8px;font-size:16px;color:#546E7A}#machine{position:relative;background:var(--c-card);border:5px solid var(--c-primary);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;transition:outline-color .15s}#machine.drop-hot{outline:6px dashed var(--c-accent);outline-offset:-8px;background:#FFFDF5}.machine-top{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap}.m-block{text-align:center;min-width:120px}.m-label{font-size:17px;font-weight:800;color:#546E7A;margin-bottom:6px}.m-arrow{font-size:40px;font-weight:900;color:var(--c-accent)}.frac{display:inline-flex;flex-direction:column;align-items:center;font-weight:900;line-height:1.08}.frac .fn{font-size:40px;padding:0 10px}.frac .fd{font-size:40px;padding:0 10px 2px;border-top:5px solid currentColor;margin-top:4px}.frac.big .fn,.frac.big .fd{font-size:48px}.frac.target{color:var(--c-accent)}.frac.cur{color:var(--c-primary)}.frac-glow{animation:glowPulse .8s ease-in-out infinite alternate}@keyframes glowPulse{from{filter:drop-shadow(0 0 2px gold)}to{filter:drop-shadow(0 0 14px #FFC107);transform:scale(1.06)}}#bar-canvas{width:100%;height:128px;display:block;border-radius:10px;background:#FAFAFA}.bar-note{font-size:17px;color:#546E7A;text-align:center;margin:2px 0;line-height:1.6}.bar-wrap.morph #bar-canvas{animation:morphAnim .35s ease}@keyframes morphAnim{0%{transform:scale(.94)}55%{transform:scale(1.04)}100%{transform:scale(1)}}#machine.win-flash{animation:winFlash 1.1s ease}@keyframes winFlash{0%{box-shadow:0 0 0 rgba(255,193,7,0)}35%{box-shadow:0 0 34px 10px rgba(255,193,7,.95);transform:scale(1.02)}100%{box-shadow:0 0 0 rgba(255,193,7,0);transform:scale(1)}}.gauge-wrap{display:flex;flex-direction:column;gap:5px}.gauge-label{font-size:16px;font-weight:700;color:#546E7A}.gauge{position:relative;height:26px;background:#ECEFF1;border-radius:999px;border:3px solid #CFD8DC;overflow:visible;margin-top:8px}.gauge-fill{position:absolute;left:0;top:0;bottom:0;background:var(--c-primary);border-radius:999px;transition:width .25s}.gauge-target{position:absolute;top:-8px;bottom:-8px;width:6px;background:var(--c-accent);border-radius:3px;transform:translateX(-50%)}.gauge-target::after{content:"目标值";position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:14px;font-weight:800;color:var(--c-accent);white-space:nowrap}.gauge-scale{display:flex;justify-content:space-between;font-size:14px;color:#90A4AE}#tools-area{display:flex;flex-direction:column;gap:12px}.tools-label{font-size:17px;font-weight:800;color:#546E7A}.gem-row{display:flex;flex-wrap:wrap;gap:12px}.gem{min-width:88px;padding:13px 16px;border-radius:18px;font-size:26px;font-weight:900;color:#fff;background:var(--c-primary);border:4px solid rgba(255,255,255,.75);box-shadow:0 5px 0 rgba(0,0,0,.18);cursor:pointer;touch-action:none;user-select:none}.gem.divide{background:var(--c-accent);color:#4E342E}.gem.used{opacity:.22;pointer-events:none;box-shadow:none}.gem:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}.gem-ghost{position:fixed;z-index:120;pointer-events:none;transform:translate(-50%,-120%);padding:12px 16px;border-radius:18px;font-size:26px;font-weight:900;color:#fff;background:var(--c-primary);border:4px solid rgba(255,255,255,.75);opacity:.9}.gem-ghost.divide{background:var(--c-accent);color:#4E342E}.tools-hint{font-size:15px;color:#90A4AE}.tool-btns{display:flex;flex-wrap:wrap;gap:10px}.slider-block{background:var(--c-card);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 3px 0 rgba(0,0,0,.08)}.slider-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.slider-val{font-size:32px;font-weight:900;color:var(--c-primary);min-width:170px}input[type=range]{flex:1 1 220px;-webkit-appearance:none;appearance:none;height:16px;border-radius:999px;background:linear-gradient(90deg,var(--c-soft),var(--c-primary));outline:none}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:40px;height:40px;border-radius:50%;background:#fff;border:6px solid var(--c-accent);cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25)}input[type=range]::-moz-range-thumb{width:34px;height:34px;border-radius:50%;background:#fff;border:6px solid var(--c-accent);cursor:pointer}.lock-btn{align-self:flex-start;border:none;border-radius:14px;padding:12px 34px;font-size:24px;font-weight:900;background:var(--c-accent);color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.15)}.lock-btn:active{transform:translateY(3px)}.b-live{font-size:19px;font-weight:700}.b-live .simplified{color:var(--c-primary);font-weight:900}#feedback{min-height:58px;border-radius:14px;background:var(--c-card);border:4px solid transparent;display:flex;align-items:center;justify-content:center;text-align:center;font-size:21px;font-weight:800;padding:8px 14px;line-height:1.5}#feedback.good{color:var(--c-ok);border-color:var(--c-ok)}#feedback.bad{color:var(--c-bad);border-color:var(--c-bad)}.shake{animation:shakeAnim .4s ease}@keyframes shakeAnim{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}#screen-win{align-items:center;padding-top:40px;text-align:center}.win-title{font-size:42px;font-weight:900;color:var(--c-primary);margin:0}.win-sub{font-size:21px;margin:8px 0 4px}#win-stars{font-size:20px;color:var(--c-ink);margin:6px 0}#win-stars .wrow{margin-top:6px;letter-spacing:1px}#win-stars .wstars{color:var(--c-accent);font-size:24px;letter-spacing:5px}#win-stats{font-size:20px;color:#546E7A}.win-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:10px}.modal-mask{position:fixed;inset:0;background:rgba(38,50,56,.55);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}.modal-mask.hidden{display:none}.modal{background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:84vh;overflow:auto;padding:22px 24px;border-top:12px solid var(--c-accent)}.modal h3{margin:0 0 10px;font-size:26px;color:var(--c-primary)}.modal .m-body{font-size:18px;line-height:1.8;white-space:pre-wrap}.modal .m-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;justify-content:flex-end}#confetti{position:fixed;inset:0;z-index:110;pointer-events:none;display:none}@media(max-width:640px){.game-title{font-size:32px}.frac .fn,.frac .fd{font-size:30px}.frac.big .fn,.frac.big .fd{font-size:36px}.m-arrow{font-size:28px}.gem{min-width:70px;font-size:22px;padding:11px 12px}#task-card{font-size:18px}#topbar{gap:8px}.stat-chip{font-size:16px;padding:5px 10px}.btn{font-size:16px;padding:8px 10px}.slider-val{font-size:26px;min-width:140px}}
</style>
</head>
<body>
<div id="app">

  <!-- ============ 开始界面：三档难度选择 ============ -->
  <section id="screen-start" class="screen active">
    <h1 class="game-title">彩虹分数工坊</h1>
    <p class="game-sub">分数的基本性质 和 约分 · 五年级数学互动闯关</p>
    <div class="diff-grid">
      <button class="diff-card" data-diff="beginner" type="button">
        <div class="d-name">初级 · 折纸变形坊</div>
        <div class="d-desc">像折纸一样把分数变形：分子分母同时乘或除以相同的数，涂色面积不变！</div>
        <div class="d-tag">例题级</div>
      </button>
      <button class="diff-card" data-diff="middle" type="button">
        <div class="d-name">中级 · 约分手作台</div>
        <div class="d-desc">挑一把约分凿子，把分子分母同时除以公因数，打磨出最简分数！</div>
        <div class="d-tag">练习级</div>
      </button>
      <button class="diff-card" data-diff="advanced" type="button">
        <div class="d-name">高级 · 宝石修复台</div>
        <div class="d-desc">倒推约分记录修复分数宝石；再解开"同加同减"的神秘天平谜题！</div>
        <div class="d-tag">变式综合级</div>
      </button>
    </div>
    <button id="btn-rules-start" class="btn ghost" type="button">规则说明</button>
    <div class="palette-tip">每局工坊随机换一套彩虹色板，玩多少次都不重样！</div>
  </section>

  <!-- ============ 游戏界面 ============ -->
  <section id="screen-game" class="screen">
    <header id="topbar">
      <div class="stat-chip" id="stat-progress">任务 1/4</div>
      <div class="stat-chip">用时 <span id="stat-time">00:00</span></div>
      <div class="stat-chip">步数 <span id="stat-steps">0</span></div>
      <div class="topbar-btns">
        <button id="btn-rules" class="btn ghost" type="button">规则说明</button>
        <button id="btn-reveal" class="btn warn" type="button">揭示答案</button>
        <button id="btn-restart" class="btn ghost" type="button">重新开始</button>
        <button id="btn-back" class="btn ghost" type="button">返回难度</button>
      </div>
    </header>

    <div id="task-card"></div>
    <div id="machine"></div>
    <div id="tools-area"></div>
    <div id="feedback"></div>
  </section>

  <!-- ============ 通关界面 ============ -->
  <section id="screen-win" class="screen">
    <h2 class="win-title">恭喜通关！</h2>
    <div class="win-sub" id="win-praise"></div>
    <div id="win-stars"></div>
    <div id="win-stats"></div>
    <div class="win-btns">
      <button id="btn-again" class="btn" type="button">再玩一次</button>
      <button id="btn-back2" class="btn ghost" type="button">返回难度选择</button>
    </div>
  </section>
</div>

<!-- ============ 规则说明弹窗（进入时弹出，可随时再看） ============ -->
<div id="modal-rules" class="modal-mask hidden">
  <div class="modal">
    <h3>工坊规则与知识小卡</h3>
    <div class="m-body" id="rules-body"></div>
    <div class="m-btns">
      <button id="rules-close" class="btn" type="button">开始挑战</button>
    </div>
  </div>
</div>

<!-- ============ 揭示答案弹窗 ============ -->
<div id="modal-reveal" class="modal-mask hidden">
  <div class="modal">
    <h3>揭示答案 · 完整思路</h3>
    <div class="m-body" id="reveal-body"></div>
    <div class="m-btns">
      <button id="reveal-close" class="btn ghost" type="button">继续尝试</button>
      <button id="reveal-next" class="btn" type="button">跳到下一题</button>
    </div>
  </div>
</div>

<!-- 彩纸庆祝画布 -->
<canvas id="confetti"></canvas>

<script>"use strict";const $=s=>document.querySelector(s);const gcd=(a,b)=>b===0?a:gcd(b,a%b);const choice=arr=>arr[Math.floor(Math.random()*arr.length)];function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const tmp=a[i];a[i]=a[j];a[j]=tmp}return a}function sample(arr,n){return shuffle(arr).slice(0,n)}const fs=f=>f[0]+"/"+f[1];function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}const PALETTES=[{name:"樱花粉",primary:"#D81B60",soft:"#F8BBD0",accent:"#F57C00",bg:"#FCE4EC"},{name:"海洋蓝",primary:"#1976D2",soft:"#BBDEFB",accent:"#EF6C00",bg:"#E3F2FD"},{name:"森林绿",primary:"#2E7D32",soft:"#C5E1A5",accent:"#F9A825",bg:"#F1F8E9"},{name:"蜜橙",primary:"#E65100",soft:"#FFCC80",accent:"#00897B",bg:"#FFF3E0"},{name:"紫罗兰",primary:"#6A1B9A",soft:"#E1BEE7",accent:"#FBC02D",bg:"#F3E5F5"},{name:"青碧",primary:"#00695C",soft:"#B2DFDB",accent:"#EF6C00",bg:"#E0F2F1"}];const G={diff:null,tasks:[],idx:0,stepsTotal:0,taskSteps:0,stars:[],revealed:new Set,t0:0,timerId:null,palette:PALETTES[0],cur:null,curState:[1,2],history:[],attempts:0,finished:false};const BASE_FRACS=[[1,2],[2,3],[3,4],[3,5],[4,5],[5,6],[2,5],[3,8],[5,8],[4,7],[4,9],[5,9],[3,10],[5,12]];function minGemSteps(m){if(m===1)return 0;const vis=new Set([1]);let q=[1],steps=0;while(q.length){steps++;const nq=[];for(let i=0;i<q.length;i++){const v=q[i];for(let j=0;j<6;j++){const g=[2,3,4,5,6][j];const nv=v*g;if(nv===m)return steps;if(nv<m&&!vis.has(nv)){vis.add(nv);nq.push(nv)}}}q=nq}return 99}function genBeginnerTasks(){const cand=[];for(let i=0;i<BASE_FRACS.length;i++){const a=BASE_FRACS[i][0],b=BASE_FRACS[i][1];for(let j=0;j<10;j++){const m=[4,6,8,9,10,12,15,16,18,20][j];if(b*m<=40&&a*m<=40)cand.push({a,b,m})}}const picked=sample(cand,8);const out=[];for(let i=0;i<picked.length&&out.length<4;i++){const c=picked[i];const up=Math.random()<.55;const optimal=minGemSteps(c.m);if(up){out.push({kind:"beginner",dir:"up",s:[c.a,c.b],t:[c.a*c.m,c.b*c.m],m:c.m,optimal})}else{out.push({kind:"beginner",dir:"down",s:[c.a*c.m,c.b*c.m],t:[c.a,c.b],m:c.m,optimal})}}return out}function genMiddleTasks(){const base=[[1,2],[2,3],[3,4],[3,5],[4,5],[5,6],[2,5],[3,8],[5,8],[4,7],[5,9],[4,9],[3,10],[1,3],[2,7],[5,12]];const cand=[];for(let i=0;i<base.length;i++){for(let k=2;k<=6;k++){if(base[i][1]*k<=32)cand.push([base[i][0]*k,base[i][1]*k])}}const picked=sample(cand,4);const out=[];for(let i=0;i<picked.length;i++){out.push({kind:"middle",s:picked[i],g:gcd(picked[i][0],picked[i][1])})}return out}function genAdvATasks(){const pool=[{rec:[3,3,5],f:[2,3]},{rec:[2,4],f:[3,5]},{rec:[2,3,7],f:[2,5]},{rec:[2,2],f:[3,4]},{rec:[3,5],f:[4,7]},{rec:[2,3],f:[5,6]},{rec:[4,3],f:[2,5]},{rec:[2,2,3],f:[3,4]},{rec:[5,7],f:[2,3]},{rec:[2,6],f:[3,5]}];const picked=sample(pool,2);const out=[];for(let i=0;i<picked.length;i++){const o=picked[i];let prod=1;for(let j=0;j<o.rec.length;j++)prod*=o.rec[j];const target=[o.f[0]*prod,o.f[1]*prod];const gems=o.rec.slice();const distract=[];const pool6=shuffle([2,3,4,5,6,7]);for(let j=0;j<pool6.length&&distract.length<2;j++){if(gems.indexOf(pool6[j])<0)distract.push(pool6[j])}out.push({kind:"advA",base:o.f,records:o.rec.slice(),target,gems:shuffle(gems.concat(distract))})}return out}function genAdvBTasks(){const pool=[{mode:"add",a:5,b:23,p:2,q:3,x:31},{mode:"add",a:7,b:17,p:3,q:5,x:8},{mode:"add",a:11,b:25,p:2,q:3,x:17},{mode:"add",a:13,b:29,p:3,q:5,x:11},{mode:"add",a:9,b:19,p:2,q:3,x:11},{mode:"add",a:17,b:37,p:3,q:5,x:13},{mode:"add",a:19,b:43,p:2,q:3,x:29},{mode:"add",a:7,b:15,p:3,q:5,x:5},{mode:"sub",a:23,b:30,p:3,q:4,x:2},{mode:"sub",a:17,b:24,p:2,q:3,x:3},{mode:"sub",a:21,b:29,p:2,q:3,x:5},{mode:"sub",a:31,b:42,p:2,q:3,x:9},{mode:"sub",a:35,b:48,p:2,q:3,x:9},{mode:"sub",a:11,b:15,p:2,q:3,x:3}];const picked=sample(pool,2);const out=[];for(let i=0;i<picked.length;i++){const o=picked[i];const sliderMax=o.mode==="add"?Math.min(50,o.x+12):o.a-1;out.push({kind:"advB",mode:o.mode,a:o.a,b:o.b,p:o.p,q:o.q,x:o.x,sliderMax})}return out}function genAdvTasks(){const a=genAdvATasks(),b=genAdvBTasks();return shuffle(a.concat(b))}function applyPalette(){const r=document.documentElement.style;r.setProperty("--c-primary",G.palette.primary);r.setProperty("--c-soft",G.palette.soft);r.setProperty("--c-accent",G.palette.accent);r.setProperty("--c-bg",G.palette.bg)}function showScreen(id){const list=document.querySelectorAll(".screen");for(let i=0;i<list.length;i++)list[i].classList.remove("active");$("#"+id).classList.add("active")}function setFeedback(text,cls){const fb=$("#feedback");fb.textContent=text;fb.className=cls||"";if(cls==="bad"){fb.classList.remove("shake");void fb.offsetWidth;fb.classList.add("shake")}}function updateStats(){$("#stat-steps").textContent=G.stepsTotal;$("#stat-progress").textContent="任务 "+Math.min(G.idx+1,G.tasks.length)+"/"+G.tasks.length}function addStep(){G.taskSteps++;G.stepsTotal++;updateStats()}function fracHTML(n,d,cls){return'<div class="frac '+(cls||"")+'"><div class="fn">'+n+'</div><div class="fd">'+d+"</div></div>"}function drawBar(cv,num,den){const w=cv.clientWidth||600,h=128;const dpr=window.devicePixelRatio||1;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);const ctx=cv.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const pad=4,barTop=8,barH=72;const gap=den<=24?3:den<=40?2:1;const cw=(w-pad*2-gap*(den-1))/den;for(let i=0;i<den;i++){const x=pad+i*(cw+gap);ctx.fillStyle=i<num?G.palette.primary:"#FFFFFF";ctx.fillRect(x,barTop,cw,barH);ctx.strokeStyle="rgba(0,0,0,0.35)";ctx.lineWidth=1.5;ctx.strokeRect(x+.75,barTop+.75,cw-1.5,barH-1.5)}ctx.fillStyle="#263238";ctx.font='bold 17px "Microsoft YaHei", sans-serif';ctx.textAlign="left";ctx.fillText("涂色 "+num+" 格，共 "+den+" 格",pad,barTop+barH+27);ctx.textAlign="right";ctx.fillText("每一格同样大",w-pad,barTop+barH+27)}function machineShell(opts){const m=$("#machine");m.classList.remove("drop-hot","win-flash");let barHTML;if(opts.showBar){barHTML='<div class="bar-w unction(a,b){return a+b},0);let rows="";for(let i=0;i<G.tasks.length;i++){rows+='<div class="wrow">第'+(i+1)+"关 "+taskName(G.tasks[i])+'：<span class="wstars">'+(G.stars[i]>0?"★".repeat(G.stars[i])+"☆".repeat(3-G.stars[i]):"☆☆☆")+"</span>"+(G.stars[i]===0?"（看过答案）":"")+"</div>"}$("#win-stars").innerHTML=rows;const sec=Math.floor((Date.now()-G.t0)/1e3);$("#win-stats").textContent="总用时 "+fmt(sec)+" · 总步数 "+G.stepsTotal+" · 本局色板："+G.palette.name;let praise="完成了全部挑战！再试一次会更熟练哦！";if(total>=11)praise="三星大师！分数变形术与约分术全部掌握！";else if(total>=8)praise="太厉害了！只差一点点就是满分工匠！";else if(total>=5)praise="很棒！再来一轮冲击三星吧！";$("#win-praise").textContent=praise+"（共获得 "+total+" 颗星）";confetti()}function confetti(){const cv=$("#confetti");cv.style.display="block";const dpr=window.devicePixelRatio||1;const W=window.innerWidth,H=window.innerHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);const ctx=cv.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);const colors=[G.palette.primary,G.palette.accent,G.palette.soft,"#FFD54F","#4DD0E1","#EF5350"];const parts=[];for(let i=0;i<140;i++){parts.push({x:Math.random()*W,y:-20-Math.random()*H*.5,vx:(Math.random()-.5)*2.2,vy:2+Math.random()*3.4,rot:Math.random()*Math.PI,vr:(Math.random()-.5)*.25,w:8+Math.random()*8,h:6+Math.random()*6,color:colors[Math.floor(Math.random()*colors.length)]})}const t0=performance.now();function loop(now){const el=now-t0;ctx.clearRect(0,0,W,H);for(let i=0;i<parts.length;i++){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.02;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()}if(el<3400){requestAnimationFrame(loop)}else{cv.style.display="none"}}requestAnimationFrame(loop)}function chainUp(start,gems){let cur=start.slice();const parts=[fs(cur)];for(let i=0;i<gems.length;i++){cur=[cur[0]*gems[i],cur[1]*gems[i]];parts.push("→(×"+gems[i]+")→ "+fs(cur))}return parts.join(" ")}function factorGems(m){const out=[];let r=m;const gs=[6,5,4,3,2];for(let
