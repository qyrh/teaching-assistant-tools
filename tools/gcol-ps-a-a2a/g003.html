<title>苹果园乘法大冒险 · 趣味乘法（上）</title>
<style>:root{--primary:#4caf50;--primary-d:#2e7d32;--accent:#ffd54f;--bg1:#f1f8e9;--bg2:#ffffff;--ink:#1f3a1f;--soft:#fffde7;--line:#c5e1a5;--danger:#e53935;--ok:#43a047;--shadow:0 6px 18px rgba(0,0,0,.12)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0;height:100%}body{font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow:hidden;user-select:none;-webkit-user-select:none}h1,h2,h3{margin:0;line-height:1.25}.hidden{display:none!important}#app{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden}.screen{position:absolute;inset:0;display:flex;flex-direction:column}#menu{align-items:center;justify-content:center;padding:24px;text-align:center;gap:18px}#menu h1{font-size:clamp(28px,6vw,52px);color:var(--primary-d);text-shadow:0 3px 0 rgba(255,255,255,.7);letter-spacing:2px}#menu .subtitle{font-size:clamp(14px,2.6vw,18px);max-width:640px;line-height:1.8;color:#33691e}.difficulty-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;margin:8px 0}.diff-btn{min-width:170px;padding:22px 18px;border:3px solid var(--primary-d);background:var(--soft);border-radius:22px;cursor:pointer;font-size:22px;font-weight:800;color:var(--primary-d);transition:transform .15s,box-shadow .15s,background .2s;box-shadow:var(--shadow)}.diff-btn small{display:block;font-size:13px;font-weight:600;color:#558b2f;margin-top:6px}.diff-btn:hover{transform:translateY(-4px);background:#fff}.diff-btn:active{transform:translateY(0)}.hud{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15);flex-shrink:0;flex-wrap:wrap;gap:8px}.hud-left,.hud-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.hud-left b{font-size:18px;background:rgba(255,255,255,.25);padding:4px 12px;border-radius:14px}.hud-right span{font-size:16px;font-weight:700;background:rgba(255,255,255,.2);padding:5px 11px;border-radius:14px}.btn-mini{background:rgba(255,255,255,.95);color:var(--primary-d);border:none;border-radius:14px;padding:6px 14px;font-size:14px;font-weight:800;cursor:pointer}.btn-mini:active{transform:scale(.94)}#stage{flex:1;position:relative;overflow:hidden;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}.quest-card{width:100%;max-width:760px;background:#fff;border:3px dashed var(--primary);border-radius:18px;padding:14px 18px;margin-bottom:12px;box-shadow:var(--shadow);text-align:center}.quest-card .q-title{font-size:clamp(16px,3vw,22px);font-weight:800;color:var(--primary-d)}.quest-card .q-hint{font-size:13px;color:#666;margin-top:4px}.formula{font-size:clamp(22px,5vw,36px);font-weight:900;color:var(--primary-d);background:var(--accent);padding:8px 22px;border-radius:16px;box-shadow:var(--shadow);margin:10px auto;display:inline-block;letter-spacing:2px}.action-bar{display:flex;gap:12px;justify-content:center;padding:10px;background:rgba(255,255,255,.6);flex-shrink:0;flex-wrap:wrap}.btn{border:none;border-radius:16px;padding:12px 24px;font-size:17px;font-weight:800;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s;background:var(--primary);color:#fff}.btn:active{transform:scale(.95)}.btn-ghost{background:#fff;color:var(--primary-d);border:2px solid var(--primary)}.btn-accent{background:var(--accent);color:var(--ink)}.drag{cursor:grab;touch-action:none;transition:transform .1s;position:relative}.drag:active{cursor:grabbing}.dragging-ghost{position:fixed;z-index:9999;pointer-events:none;opacity:.95;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3));transform:scale(1.08)}.drag.used{opacity:.25;pointer-events:none}.bin-area{width:100%;max-width:760px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:14px}.bin{width:120px;min-height:90px;border:3px dashed var(--primary);border-radius:16px;background:#fff;display:flex;flex-wrap:wrap;gap:3px;padding:8px;align-content:flex-start;justify-content:center;transition:all .2s;position:relative}.bin.full{background:#e8f5e9;border-color:var(--ok);border-style:solid}.bin .bin-count{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:13px;color:var(--primary-d);font-weight:800;white-space:nowrap}.fruit-basket{width:100%;max-width:760px;background:var(--soft);border-radius:18px;padding:14px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:90px;box-shadow:var(--shadow)}.basket-label{width:100%;text-align:center;font-size:14px;color:#795548;font-weight:700;margin-bottom:4px}.fruit{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;background:#fff;border:2px solid var(--line);box-shadow:0 2px 4px rgba(0,0,0,.1)}.fruit.in-bin{width:34px;height:34px;font-size:22px}.flower-wrap{position:relative;width:min(78vw,440px);height:min(78vw,440px);margin:6px auto}.flower-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:90px;height:90px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;color:var(--ink);box-shadow:var(--shadow);border:4px solid #fff;z-index:5}.flower-center small{font-size:13px;display:block;line-height:1;margin-top:-4px;color:#555}.petal{position:absolute;width:78px;transform:translate(-50%,-50%);background:#fff;border:3px solid var(--primary);border-radius:50% 50% 50% 0;padding:8px 4px;text-align:center;box-shadow:var(--shadow);touch-action:none}.petal .slot{width:42px;height:42px;margin:0 auto 4px;border-radius:50%;background:#f1f8e9;border:2px dashed var(--primary-d);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:var(--primary-d)}.petal.filled{background:#fff9c4;border-color:var(--accent)}.petal.filled .slot{background:var(--accent);border-style:solid}.petal .prod{font-size:14px;font-weight:800;color:#555;min-height:16px}.num-pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:14px;background:var(--soft);border-radius:18px;width:100%;max-width:560px;box-shadow:var(--shadow)}.num-card{width:54px;height:54px;border-radius:14px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;box-shadow:var(--shadow);touch-action:none;cursor:grab}.scale-wrap{position:relative;width:min(90vw,560px);height:260px;margin:6px auto}.scale-base{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:160px;height:0;border-left:80px solid transparent;border-right:80px solid transparent;border-bottom:90px solid var(--primary-d);border-radius:0 0 8px 8px}.scale-base::after{content:"";position:absolute;left:-100px;bottom:-90px;width:200px;height:14px;background:var(--primary-d);border-radius:8px}.scale-beam{position:absolute;left:50%;top:60px;width:90%;height:14px;background:var(--primary-d);border-radius:8px;transform:translateX(-50%) rotate(0deg);transform-origin:center;transition:transform .4s}.scale-pan{position:absolute;top:14px;width:120px;height:80px;background:#fffde7;border:3px solid var(--primary);border-radius:0 0 60px 60px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:var(--primary-d);box-shadow:var(--shadow);transition:transform .4s}.scale-pan .pan-tag{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:13px;background:var(--primary);color:#fff;padding:2px 8px;border-radius:8px;white-space:nowrap}.scale-pan .drop-slot{width:48px;height:48px;border-radius:12px;border:3px dashed var(--accent);background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:var(--danger)}.scale-pan .drop-slot.filled{background:var(--accent);border-style:solid;color:var(--ink)}.slider-wrap{width:min(92vw,680px);margin:10px auto;text-align:center}.slider-readout{font-size:clamp(20px,4.5vw,30px);font-weight:900;background:var(--soft);border:3px solid var(--primary);border-radius:14px;padding:10px 16px;margin-bottom:10px;display:inline-block}.slider-readout.bad{background:#ffebee;border-color:var(--danger);color:var(--danger)}.slider-readout.good{background:#e8f5e9;border-color:var(--ok);color:var(--ok)}.slider-track{position:relative;height:70px;background:linear-gradient(90deg,#e8f5e9,#fffde7 60%,#ffebee);border-radius:18px;border:3px solid var(--primary);margin:0 28px}.slider-track canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:15px;pointer-events:none}.slider-knob{position:absolute;top:50%;left:0;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;box-shadow:var(--shadow);border:4px solid #fff;touch-action:none;cursor:grab;z-index:3}.slider-knob:active{cursor:grabbing}.slider-knob.locked{background:var(--ok)}.slider-labels{display:flex;justify-content:space-between;padding:0 18px;font-size:13px;color:#555;font-weight:700;margin-top:4px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}.modal-card{background:#fff;border-radius:22px;padding:24px;max-width:560px;width:100%;max-height:85vh;overflow:auto;box-shadow:var(--shadow)}.modal-card h2{color:var(--primary-d);margin-bottom:12px;font-size:26px}.modal-card .rule-item{display:flex;gap:10px;margin:10px 0;font-size:15px;line-height:1.6}.modal-card .rule-item b{color:var(--primary-d);flex-shrink:0}.modal-card .tip{background:var(--soft);border-left:4px solid var(--accent);padding:10px 14px;margin-top:12px;font-size:14px;border-radius:8px}#celebrate{position:fixed;inset:0;pointer-events:none;z-index:2000}.win-banner{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.3);background:linear-gradient(135deg,var(--accent),#ffb300);color:var(--ink);padding:28px 44px;border-radius:24px;text-align:center;box-shadow:var(--shadow);z-index:2001;animation:popIn .5s cubic-bezier(.18,1.4,.5,1) forwards;border:5px solid #fff}.win-banner h2{font-size:30px;margin-bottom:6px}.win-banner p{font-size:16px;margin:0}@keyframes popIn{to{transform:translate(-50%,-50%) scale(1)}}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 24px;border-radius:24px;font-size:16px;font-weight:700;opacity:0;transition:all .3s;z-index:1500;pointer-events:none;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.ok{background:var(--ok)}.toast.bad{background:var(--danger)}@media(max-width:600px){.diff-btn{min-width:140px;padding:16px 12px;font-size:18px}.fruit{width:40px;height:40px;font-size:24px}.fruit.in-bin{width:30px;height:30px;font-size:18px}.bin{width:100px;min-height:78px}.num-card{width:46px;height:46px;font-size:22px}.petal{width:66px}.petal .slot{width:36px;height:36px;font-size:18px}.flower-center{width:74px;height:74px;font-size:32px}.hud{padding:8px 10px}.hud-left b,.hud-right span{font-size:14px}}

<body>
<div id="app">

  <!-- ===== 难度选择菜单 ===== -->
  <div id="menu" class="screen">
    <h1>🍎 苹果园乘法大冒险</h1>
    <p class="subtitle">
      欢迎来到苹果园！小动物们需要你帮忙：<br>
      把水果<strong>分组装箱</strong>、给<strong>花朵授粉</strong>、让<strong>天平平衡</strong>、在<strong>数轴上定位</strong>。<br>
      每一次拖动，都是在和乘法交朋友哦～
    </p>
    <div class="difficulty-row">
      <button class="diff-btn" data-diff="easy">初级<small>认识乘法 · 分组装箱</small></button>
      <button class="diff-btn" data-diff="mid">中级<small>乘法口诀 · 花朵与天平</small></button>
      <button class="diff-btn" data-diff="hard">高级<small>求乘数 · 最大填几</small></button>
    </div>
    <button id="btnRulesFromMenu" class="btn btn-ghost">📖 先看看游戏规则</button>
  </div>

  <!-- ===== 游戏主屏 ===== -->
  <div id="game" class="screen hidden">
    <div class="hud">
      <div class="hud-left">
        <b id="diffLabel">初级</b>
        <b id="levelLabel">第 1 关 / 共 3 关</b>
      </div>
      <div class="hud-right">
        <span id="timer">⏱ 00:00</span>
        <span id="steps">👣 0 步</span>
        <button id="btnRules" class="btn-mini">规则</button>
        <button id="btnBack" class="btn-mini">返回</button>
      </div>
    </div>
    <div id="stage"></div>
    <div class="action-bar">
      <button id="btnReveal" class="btn btn-accent">💡 揭示答案</button>
      <button id="btnRestart" class="btn btn-ghost">🔄 重新开始本关</button>
    </div>
  </div>

  <!-- ===== 规则弹窗 ===== -->
  <div id="rulesModal" class="modal hidden">
    <div class="modal-card">
      <h2>📖 游戏规则</h2>
      <div id="rulesBody"></div>
      <div style="text-align:center;margin-top:18px;">
        <button id="btnCloseRules" class="btn">明白啦，开始！</button>
      </div>
    </div>
  </div>

  <!-- ===== 庆祝层 ===== -->
  <canvas id="celebrate"></canvas>
  <div id="toast" class="toast"></div>
</div>

<script>"use strict";var PALETTES=[{primary:"#4caf50",primaryD:"#2e7d32",accent:"#ffd54f",bg1:"#f1f8e9",bg2:"#ffffff",ink:"#1f3a1f",soft:"#fffde7",line:"#c5e1a5"},{primary:"#1e88e5",primaryD:"#1565c0",accent:"#ffd54f",bg1:"#e3f2fd",bg2:"#ffffff",ink:"#0d2c54",soft:"#fff8e1",line:"#90caf9"},{primary:"#ec407a",primaryD:"#ad1457",accent:"#fff176",bg1:"#fce4ec",bg2:"#ffffff",ink:"#4a0d2e",soft:"#fffde7",line:"#f48fb1"},{primary:"#ff8f00",primaryD:"#e65100",accent:"#aed581",bg1:"#fff3e0",bg2:"#ffffff",ink:"#3e2723",soft:"#fff8e1",line:"#ffcc80"},{primary:"#8e24aa",primaryD:"#5e35b1",accent:"#fff176",bg1:"#f3e5f5",bg2:"#ffffff",ink:"#2a0e3a",soft:"#fffde7",line:"#ce93d8"},{primary:"#00897b",primaryD:"#004d40",accent:"#ffd54f",bg1:"#e0f2f1",bg2:"#ffffff",ink:"#003d33",soft:"#fffde7",line:"#80cbc4"}];function applyPalette(){var p=PALETTES[Math.floor(Math.random()*PALETTES.length)];var r=document.documentElement.style;r.setProperty("--primary",p.primary);r.setProperty("--primary-d",p.primaryD);r.setProperty("--accent",p.accent);r.setProperty("--bg1",p.bg1);r.setProperty("--bg2",p.bg2);r.setProperty("--ink",p.ink);r.setProperty("--soft",p.soft);r.setProperty("--line",p.line)}var POOL_GROUP=[{total:12,per:3,item:"🍎",name:"苹果"},{total:15,per:5,item:"🍌",name:"香蕉"},{total:20,per:4,item:"🍊",name:"橘子"},{total:18,per:6,item:"🍇",name:"葡萄"},{total:16,per:4,item:"🍓",name:"草莓"},{total:24,per:6,item:"🍅",name:"番茄"},{total:21,per:7,item:"🍐",name:"梨子"}];var POOL_FLOWER=[{center:9,count:9},{center:8,count:8},{center:7,count:7},{center:6,count:6}];var POOL_BALANCE=[{a:8,c:24},{a:7,c:14},{a:5,c:40},{a:9,c:36},{a:6,c:42},{a:8,c:56},{a:7,c:35},{a:6,c:48},{a:9,c:45},{a:5,c:35}];var POOL_MAXFILL=[{a:8,c:24},{a:7,c:31},{a:7,c:50},{a:6,c:25},{a:9,c:50},{a:5,c:44},{a:8,c:50},{a:6,c:38},{a:9,c:60}];var LEVEL_PLAN={easy:["group","group","group"],mid:["flower","balance","flower"],hard:["balance","maxfill","balance"]};var DIFF_NAME={easy:"初级",mid:"中级",hard:"高级"};var MODE_NAME={group:"分组装箱",flower:"花朵授粉",
