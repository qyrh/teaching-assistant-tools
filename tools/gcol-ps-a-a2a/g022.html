<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>巧算工坊 · 凑整大挑战（第11讲 巧算加减法进阶(1)（下））</title>
<style>
/* ========== 主题变量（每局随机换色，G8） ========== */
:root{
  --main:#e65100;      /* 主色 */
  --accent:#ff9800;    /* 强调色 */
  --bg:#fff8e1;        /* 页面底色 */
  --deep:#bf360c;      /* 深色（标题/描边） */
  --ink:#3e2723;       /* 正文墨色 */
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  font-size:18px; line-height:1.5;
  user-select:none; -webkit-user-select:none;
  min-height:100vh;
}
.hidden{display:none !important;}

/* ========== 顶栏 ========== */
header{
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap;
  gap:8px; padding:10px 16px;
  background:var(--main); color:#fff;
  box-shadow:0 3px 10px rgba(0,0,0,.18);
  position:sticky; top:0; z-index:100;
}
#hdTitle{font-size:22px; font-weight:bold; letter-spacing:1px; text-shadow:0 2px 0 rgba(0,0,0,.15);}
#hdRight{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.stat{
  background:rgba(255,255,255,.22); border-radius:10px; padding:4px 12px;
  font-size:17px; font-weight:bold; white-space:nowrap;
}
.btn{
  border:none; border-radius:12px; padding:8px 16px;
  font-size:17px; font-weight:bold; cursor:pointer;
  background:var(--accent); color:#fff;
  box-shadow:0 3px 0 rgba(0,0,0,.22);
  transition:transform .08s;
  font-family:inherit;
}
.btn:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.22);}
.btn-ghost{background:rgba(255,255,255,.25);}
.btn-warn{background:#fff; color:var(--deep);}
.btn-big{font-size:20px; padding:12px 26px;}
body.at-home #btnReveal, body.at-home #btnRestart{display:none;}

/* ========== 主区域 ========== */
main{max-width:1080px; margin:0 auto; padding:14px 14px 60px;}

/* ---- 首页 ---- */
.hero{text-align:center; margin:18px 0 10px;}
.heroSub{display:inline-block; background:var(--accent); color:#fff; font-weight:bold;
  border-radius:999px; padding:4px 18px; font-size:16px;}
.heroTitle{font-size:clamp(30px,6vw,46px); color:var(--deep); margin:12px 0 8px;
  text-shadow:2px 2px 0 rgba(255,255,255,.7);}
.heroDesc{font-size:18px; max-width:640px; margin:0 auto; color:var(--ink);}
.tierRow{display:flex; flex-wrap:wrap; gap:18px; justify-content:center; margin:22px 0;}
.tierCard{
  width:280px; min-height:170px; border:4px solid var(--main); border-radius:18px;
  background:#fff; cursor:pointer; padding:16px 14px; text-align:center;
  box-shadow:0 5px 0 var(--main); transition:transform .1s;
  font-family:inherit;
}
.tierCard:hover{transform:translateY(-4px);}
.tierName{font-size:22px; font-weight:bold; color:var(--deep); margin-bottom:8px;}
.tierDesc{font-size:16px; min-height:72px;}
.tierMeta{display:inline-block; margin-top:6px; background:var(--bg); border:2px dashed var(--main);
  color:var(--deep); border-radius:999px; padding:2px 12px; font-size:15px; font-weight:bold;}
.homeFoot{text-align:center;}

/* ---- 游戏页 ---- */
#lvBar{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:10px;}
#lvTag{background:var(--deep); color:#fff; font-weight:bold; border-radius:10px; padding:5px 14px; font-size:18px;}
#lvHint{background:#fff; border:2px dashed var(--main); color:var(--deep);
  border-radius:10px; padding:5px 12px; font-size:15px; flex:1; min-width:220px;}
#exprRow{
  text-align:center; background:#fff; border:4px solid var(--main); border-radius:16px;
  padding:12px 8px; margin-bottom:12px;
  font-size:clamp(24px,4.6vw,38px); font-weight:bold; color:var(--deep); letter-spacing:1px;
}
#exprRow .q{color:var(--accent);}
#workbench{display:flex; flex-wrap:wrap; gap:18px; justify-content:center; margin-bottom:12px;}
.benchRow{display:flex; flex-wrap:wrap; gap:18px; justify-content:center; margin-bottom:12px; width:100%;}
.bench{
  background:#fff; border:3px solid var(--accent); border-radius:16px;
  padding:10px 14px 14px; text-align:center; min-width:250px; flex:1;
}
.bench.wide{flex-basis:100%;}
.benchTitle{font-size:17px; font-weight:bold; color:var(--deep); margin-bottom:8px;}
.zone{
  display:flex; align-items:center; justify-content:center; gap:8px;
  min-height:64px; border:3px dashed var(--main); border-radius:14px;
  background:var(--bg); padding:8px; transition:box-shadow .15s, background .15s;
}
.zone.zone-hot{background:#fff; box-shadow:0 0 0 4px var(--accent); border-style:solid;}
.zone.zDone{border-style:solid; background:#f1f8e9; border-color:#7cb342;}
.zLabel{font-size:20px; font-weight:bold; color:var(--ink);}
.zExpr{font-size:24px; font-weight:bold; color:var(--deep);}
.slot{
  display:inline-flex; align-items:center; justify-content:center;
  min-width:64px; min-height:48px; border:3px dotted var(--accent); border-radius:10px;
  background:#fff; font-size:24px; font-weight:bold; color:#bbb;
}
.slot.filled{border-style:solid; color:var(--deep);}
.chipChip{
  display:inline-flex; align-items:center; justify-content:center;
  background:var(--main); color:#fff; border-radius:10px;
  min-width:56px; min-height:44px; padding:2px 10px;
  font-size:22px; font-weight:bold; animation:popIn .3s;
}
.remRow{margin-top:10px; display:flex; align-items:center; justify-content:center; gap:8px;}
.strip{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; padding:6px 0;}
.plat{
  width:70px; border:3px dashed var(--main); border-radius:12px; background:var(--bg);
  padding:6px 2px; text-align:center; transition:box-shadow .15s;
}
.plat.plat-zero{border-color:var(--accent);}
.plat.zone-hot{background:#fff; box-shadow:0 0 0 4px var(--accent); border-style:solid;}
.plat.zDone{border-style:solid; background:#f1f8e9; border-color:#7cb342;}
.platNum{font-size:20px; font-weight:bold; color:var(--deep);}
.platSub{font-size:16px; color:#777; font-weight:bold; min-height:22px;}
.plat.zDone .platSub{color:#558b2f;}
.towerBig{
  font-size:28px; font-weight:bold; color:var(--deep); background:var(--bg);
  border:3px solid var(--main); border-radius:12px; padding:4px 18px; margin-bottom:8px;
  display:inline-block;
}
#msgBar{
  min-height:34px; text-align:center; font-size:18px; font-weight:bold;
  color:var(--deep); background:#fff; border:3px solid var(--accent); border-radius:12px;
  padding:6px 10px; margin-bottom:12px;
}
#msgBar.bad{color:#c62828; border-color:#e57373; animation:wob .35s;}
#msgBar.good{color:#2e7d32; border-color:#7cb342;}
.secTitle{font-size:16px; font-weight:bold; color:var(--deep); margin:4px 0 6px; text-align:center;}
#tray{
  display:flex; flex-wrap:wrap; gap:14px; justify-content:center; align-items:center;
  background:#fff; border:3px solid var(--accent); border-radius:16px;
  min-height:86px; padding:12px; margin-bottom:12px;
}
.card{
  display:flex; align-items:center; justify-content:center;
  min-width:88px; min-height:60px; padding:6px 12px;
  background:#fff; border:3px solid var(--main); border-radius:14px;
  font-size:26px; font-weight:bold; color:var(--deep);
  box-shadow:0 4px 0 var(--main); cursor:grab; touch-action:none;
  transition:transform .08s;
}
.card:active{transform:scale(1.05);}
.card.chipCard{min-width:48px; min-height:48px; font-size:20px; border-radius:50%;
  background:var(--accent); color:#fff; border-color:var(--deep); box-shadow:0 3px 0 var(--deep);}
.card.drag-src{opacity:.25;}
.card.gone{display:none;}
/* 拖拽幽灵：固定定位挂在 body 上，与原元素布局方式完全解耦，杜绝定位错位问题 */
.ghost{
  position:fixed; z-index:9999; pointer-events:none; margin:0;
  display:flex; align-items:center; justify-content:center;
  background:#fff; border:3px solid var(--deep); border-radius:14px;
  font-size:26px; font-weight:bold; color:var(--deep); box-shadow:0 8px 18px rgba(0,0,0,.3);
}
.ghost.chipG{border-radius:50%; background:var(--accent); color:#fff; font-size:20px;}
.ghost-no{outline:4px solid #e57373;}
.ghost-sink{opacity:.9; transform:scale(.92);}
#stepsBox{display:flex; flex-direction:column; gap:8px; margin-top:4px;}
.stepLine{
  background:#fff; border-left:8px solid var(--accent); border-radius:8px;
  padding:8px 14px; font-size:20px; font-weight:bold; color:var(--ink);
  animation:popIn .35s;
}
/* ---- 结算页 ---- */
#screenEnd{text-align:center; margin-top:30px;}
.endTitle{font-size:clamp(30px,6vw,44px); color:var(--deep);}
.endStars{font-size:52px; color:#ffb300; letter-spacing:8px; margin:10px 0;}
.endStats{font-size:22px; font-weight:bold; background:#fff; display:inline-block;
  border:3px solid var(--main); border-radius:16px; padding:14px 26px; margin-bottom:20px;}
.endBtns{display:flex; gap:16px; justify-content:center; flex-wrap:wrap;}

/* ---- 弹窗（规则 / 揭示答案） ---- */
#modal{position:fixed; inset:0; background:rgba(40,20,0,.55); z-index:1000;
  display:flex; align-items:center; justify-content:center; padding:16px;}
#modalPanel{
  background:#fff; border:5px solid var(--main); border-radius:20px;
  max-width:640px; width:100%; max-height:86vh; overflow:auto; padding:20px 22px;
}
#modalTitle{font-size:24px; font-weight:bold; color:var(--deep); margin:0 0 12px;}
#modalBody{font-size:17px;}
#modalBody h3{color:var(--deep); font-size:18px; margin:14px 0 6px;}
#modalBody p{margin:6px 0;}
#modalBody .rl{background:var(--bg); border-radius:10px; padding:8px 12px; margin:8px 0; font-weight:bold;}
#modalBtns{text-align:center; margin-top:16px;}

/* ---- 彩纸画布 ---- */
#confetti{position:fixed; inset:0; pointer-events:none; z-index:9998;}

@keyframes popIn{0%{transform:scale(.3); opacity:0;} 100%{transform:scale(1); opacity:1;}}
@keyframes wob{0%{transform:translateX(-6px);} 30%{transform:translateX(6px);} 60%{transform:translateX(-4px);} 100%{transform:translateX(0);}}

/* ---- 小屏适配（G11） ---- */
@media (max-width:720px){
  body{font-size:16px;}
  #hdTitle{font-size:18px;}
  .card{min-width:72px; min-height:54px; font-size:22px;}
  .stepLine{font-size:17px;}
  .tierCard{width:100%; max-width:340px;}
  .plat{width:58px;}
  .platSub{font-size:16px;}
}
</style>
</head>

<script>
'use strict';
/* =====================================================================
   巧算工坊 · 凑整大挑战
   对应教参：第11讲 巧算加减法进阶(1)（下）
   三大数学方法（游戏机制与方法本质深度绑定，G2）：
     初级 好方法4：带括号的加减混合 —— 先算小括号里的；若能凑整，则拆开括号
     中级 好方法5：基准数法连加求和 —— 找每个数都接近的整十整百数作基准
     高级 拆补法连加求和 —— 拆最小的数，补给大数凑整百；终极挑战拆"多8"结构
   拖拽引擎说明（上轮复核教训）：拖动时克隆一张 position:fixed 的"幽灵卡片"
   挂到 body 上跟随指针，投放判定用 getBoundingClientRect 对注册好的投放区
   做命中测试；原元素始终留在卡片架（flex 布局），绝不向布局元素写入 left/top，
   从根上避免 relative/static 定位导致的坐标错位死局。
   ===================================================================== */

/* ---------------- 小工具 ---------------- */
function $(id){ return document.getElementById(id); }
function el(tag, cls, html){
  var d = document.createElement(tag);
  if (cls) d.className = cls;
  if (html != null) d.innerHTML = html;
  return d;
}
function shuffle(arr){           /* Fisher-Yates 洗牌：每局随机化（反重复） */
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function shuffleCopy(arr){ return shuffle(arr.slice()); }

/* ---------------- 配色随机（G8） ---------------- */
var PALETTES = [
  { main:'#e65100', accent:'#ff9800', bg:'#fff8e1', deep:'#bf360c' },
  { main:'#1b5e20', accent:'#66bb6a', bg:'#e8f5e9', deep:'#2e7d32' },
  { main:'#0d47a1', accent:'#42a5f5', bg:'#e3f2fd', deep:'#1565c0' },
  { main:'#4a148c', accent:'#ab47bc', bg:'#f3e5f5', deep:'#6a1b9a' },
  { main:'#b71c1c', accent:'#ef5350', bg:'#ffebee', deep:'#c62828' },
  { main:'#006064', accent:'#26c6da', bg:'#e0f7fa', deep:'#00838f' }
];
var pal = PALETTES[0];
function pickPalette(){
  pal = PALETTES[Math.floor(Math.random() * PALETTES.length)];
  var rs = document.documentElement.style;
  rs.setProperty('--main', pal.main);
  rs.setProperty('--accent', pal.accent);
  rs.setProperty('--bg', pal.bg);
  rs.setProperty('--deep', pal.deep);
}

/* ---------------- 轻音效（WebAudio 本地合成，无外部依赖，G10） ---------------- */
var actx = null;
function beep(freq, dur, type, delay){
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    o.connect(g); g.connect(actx.destination);
    var t = actx.currentTime + (delay || 0);
    g.gain.setValueAtTime(0.12, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.start(t); o.stop(t + dur);
  } catch (err) { /* 音频不可用时静默跳过，不影响游戏 */ }
}
function sndPick(){ beep(520, .08, 'sine', 0); }
function sndOk(){ beep(660, .12); beep(880, .18, 'sine', .1); }
function sndNo(){ beep(170, .2, 'square', 0); }
function sndWin(){ [523, 659, 784, 1047].forEach(function(f, i){ beep(f, .22, 'triangle', i * .13); }); }

/* ---------------- 彩纸庆祝（G5，Canvas 实现） ---------------- */
var cvs = $('confetti'), ctx = cvs.getContext('2d');
var parts = [], rafOn = false;
function sizeCvs(){ cvs.width = window.innerWidth; cvs.height = window.innerHeight; }
window.addEventListener('resize', sizeCvs); sizeCvs();
function confetti(n){
  var cols = [pal.main, pal.accent, pal.deep, '#ffd54f', '#4dd0e1', '#aed581'];
  for (var i = 0; i < n; i++) {
    parts.push({
      x: Math.random() * cvs.width, y: -20 - Math.random() * 90,
      vx: (Math.random() - 0.5) * 3.2, vy: 2.2 + Math.random() * 3.6,
      s: 6 + Math.random() * 9, r: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.25, c: cols[i % cols.length]
    });
  }
  if (!rafOn) { rafOn = true; window.requestAnimationFrame(tickConfetti); }
}
function tickConfetti(){
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  parts = parts.filter(function(p){ return p.y < cvs.height + 40; });
  parts.forEach(function(p){
    p.x += p.vx; p.y += p.vy; p.r += p.vr;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
    ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.62);
    ctx.restore();
  });
  if (parts.length) { window.requestAnimationFrame(tickConfetti); }
  else { rafOn = false; ctx.clearRect(0, 0, cvs.width, cvs.height); }
}

/* ---------------- 拖拽引擎（Pointer 事件，鼠标/触摸通用，G1/G11） ---------------- */
var dragGhost = null, dragSrc = null, dragOffX = 0, dragOffY = 0;
var zones = [];   /* 当前关卡注册的所有投放区 */

function makeDraggable(elm){
  elm.addEventListener('pointerdown', function(e){
    if (elm.classList.contains('gone') || dragGhost) return;
    e.preventDefault();
    var r = elm.getBoundingClientRect();
    dragSrc = elm;
    dragOffX = e.clientX - r.left; dragOffY = e.clientY - r.top;
    dragGhost = elm.cloneNode(true);
    dragGhost.className = 'ghost' + (elm.classList.contains('chipCard') ? ' chipG' : '');
    dragGhost.style.width = r.width + 'px';
    dragGhost.style.height = r.height + 'px';
    dragGhost.style.left = r.left + 'px';
    dragGhost.style.top = r.top + 'px';
    document.body.appendChild(dragGhost);
    elm.classList.add('drag-src');
    sndPick();
  });
}
document.addEventListener('pointermove', function(e){
  if (!dragGhost) return;
  e.preventDefault();
  dragGhost.style.left = (e.clientX - dragOffX) + 'px';
  dragGhost.style.top = (e.clientY - dragOffY) + 'px';
  /* 高亮指针正下方的投放区，给学生实时反馈 */
  zones.forEach(function(z){ z.classList.remove('zone-hot'); });
  var z = zoneAt(e.clientX, e.clientY);
  if (z) z.classList.add('zone-hot');
});
document.addEventListener('pointerup', function(e){
  if (!dragGhost) return;
  var z = zoneAt(e.clientX, e.clientY);
  var src = dragSrc, ghost = dragGhost;
  dragSrc = null; dragGhost = null;
  zones.forEach(function(zz){ zz.classList.remove('zone-hot'); });
  if (z && !state.lvDone && z.__onDrop) { addStep(); z.__onDrop(src, ghost); }
  else { bounceBack(src, ghost); }
});
document.addEventListener('pointercancel', function(){
  if (dragGhost) { bounceBack(dragSrc, dragGhost); dragSrc = null; dragGhost = null; }
});
function zoneAt(x, y){
  for (var i = 0; i < zones.length; i++) {
    var r = zones[i].getBoundingClientRect();
    if (x >= r.left - 4 && x <= r.right + 4 && y >= r.top - 4 && y <= r.bottom + 4) return zones[i];
  }
  return null;
}
function addZone(elm, handler){ elm.__onDrop = handler; zones.push(elm); }
function dropZoneOf(elm){ zones = zones.filter(function(z){ return z !== elm; }); }

/* 幽灵卡片退回卡片架 */
function bounceBack(src, ghost){
  if (!ghost) return;
  var r = src ? src.getBoundingClientRect() : { left: 20, top: 20 };
  ghost.style.transition = 'left .25s ease, top .25s ease';
  ghost.style.left = r.left + 'px'; ghost.style.top = r.top + 'px';
  setTimeout(function(){
    if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
    if (src) src.classList.remove('drag-src');
  }, 270);
}
/* 失败弹回：提示 + 提示音 + 失误计数 */
function failBounce(src, ghost, msg){
  sndNo(); setMsg(msg, 'bad');
  ghost.classList.add('ghost-no');
  state.wrong++;
  bounceBack(src, ghost);
}
/* 成功锁定：幽灵飞向投放区中心后被吸收，原卡片隐藏 */
function lockIn(src, ghost, zone){
  var zr = zone.getBoundingClientRect(), r = src.getBoundingClientRect();
  ghost.style.transition = 'left .22s ease, top .22s ease, opacity .22s';
  ghost.style.left = (zr.left + zr.width / 2 - r.width / 2) + 'px';
  ghost.style.top = (zr.top + zr.height / 2 - r.height / 2) + 'px';
  ghost.classList.add('ghost-sink');
  setTimeout(function(){ if (ghost.parentNode) ghost.parentNode.removeChild(ghost); }, 240);
  src.classList.remove('drag-src');
  src.classList.add('gone');
  sndOk();
}

/* 每局随机抽样，并保证"括号里凑整"与"拆开括号"两种题型都出现 */
function pickKuoLevels(){
  var pool = POOL_KUO.map(function(p){
    return { p:p, inR: ((p.b + p.c) % 10 === 0) };
  });
  var sel = shuffleCopy(pool).slice(0, 4);
  var hasR = sel.some(function(x){ return x.inR; });
  var hasB = sel.some(function(x){ return !x.inR; });
  if (!hasR) {
    var candR = pool.filter(function(x){ return x.inR && sel.indexOf(x) < 0; });
    sel[3] = candR[Math.floor(Math.random() * candR.length)];
  }
  if (!hasB) {
    var candB = pool.filter(function(x){ return !x.inR && sel.indexOf(x) < 0; });
    sel[2] = candB[Math.floor(Math.random() * candB.length)];
  }
  return sel.map(function(x){ return { kind:'kuo', prob:{ a:x.p.a, b:x.p.b, c:x.p.c } }; });
}
function pickBaseLevels(){
  return shuffleCopy(POOL_BASE).slice(0, 3).map(function(p){
    return { kind:'base', prob:{ nums:p.nums.slice(), base:p.base } };
  });
}
function pickChaiLevels(){
  var arr = shuffleCopy(POOL_CHAI).slice(0, 2).map(function(p){
    return { kind:'chai', prob:{ s:p.s, b:p.b, c:p.c } };
  });
  arr.push({ kind:'boss', prob:{ nums:BOSS_NUMS.slice() } });
  return arr;
}
function buildLevels(tier){
  if (tier === 'kuo')  return pickKuoLevels();
  if (tier === 'base') return pickBaseLevels();
  return pickChaiLevels();
}

/* ================= 初级：a − ( b + c ) 带括号巧算 ================= */
function buildKuo(lv){
  var p = lv.prob;
  renderExpr(p.a + ' − ( ' + p.b + ' + ' + p.c + ' ) = <span class="q">?</span>');

  var benchRow = el('div', 'benchRow');

  /* 工作台一：拆开括号，和大数手拉手凑整 */
  var b1 = el('div', 'bench');
  b1.appendChild(el('div', 'benchTitle', '工作台一 · 和 ' + p.a + ' 手拉手（拆开括号先凑整）'));
  var soloZone = el('div', 'zone');
  soloZone.innerHTML = '<span class="zExpr">' + p.a + ' −</span><span class="slot">□</span>';
  b1.appendChild(soloZone);

  /* 工作台二：括号里两个数先凑整 */
  var b2 = el('div', 'bench');
  b2.appendChild(el('div', 'benchTitle', '工作台二 · 括号里先凑整'));
  var pairZone = el('div', 'zone');
  pairZone.innerHTML = '<span class="slot pairSlot">□</span><span class="zExpr">+</span><span class="slot pairSlot">□</span>';
  b2.appendChild(pairZone);

  benchRow.appendChild(b1); benchRow.appendChild(b2);
  $('workbench').appendChild(benchRow);

  /* 卡片架：括号内两个数字（顺序随机） */
  var cards = shuffleCopy([p.b, p.c]).map(function(v){ return mkCard(v); });
  cards.forEach(function(c){ $('tray').appendChild(c); });
  var cardOf = {};
  cards.forEach(function(c){ cardOf[Number(c.dataset.val)] = c; });

  var pairVals = [];   /* 已放进凑整框的数 */
  function renderPairSlots(){
    var slots = pairZone.querySelectorAll('.pairSlot');
    for (var i = 0; i < slots.length; i++) {
      var filled = i < pairVals.length;
      slots[i].textContent = filled ? String(pairVals[i]) : '□';
      slots[i].classList.toggle('filled', filled);
    }
  }
  function returnPairChips(){
    pairVals = [];
    renderPairSlots();
    pairZone.classList.remove('zDone');
  }
  function restoreCard(v){ if (cardOf[v]) cardOf[v].classList.remove('gone'); }

  /* 投放：工作台一（和大数手拉手 → 拆开括号先凑整） */
  addZone(soloZone, function(src, ghost){
    var v = Number(src.dataset.val);
    if ((p.a - v) % 10 === 0) {
      returnPairChips();                       /* 若凑整框里有半成品，先退回 */
      lockIn(src, ghost, soloZone);
      soloZone.innerHTML = '<span class="zExpr">' + p.a + ' −</span><span class="chipChip">' + v + '</span>';
      soloZone.classList.add('zDone');
      dropZoneOf(soloZone); dropZoneOf(pairZone);
      var other = (v === p.b) ? p.c : p.b;
      var remRow = el('div', 'remRow');
      remRow.innerHTML = '<span class="zExpr">' + (p.a - v) + ' −</span><span class="slot">□</span>';
      b1.appendChild(remRow);
      setTimeout(function(){
        remRow.innerHTML = '<span class="zExpr">' + (p.a - v) + ' −</span><span class="chipChip">' + other + '</span>';
        if (cardOf[other]) cardOf[other].classList.add('gone');
      }, 500);
      pushSteps([
        '拆开括号：' + p.a + ' − ' + p.b + ' − ' + p.c,
        '调换顺序先算凑整：' + p.a + ' − ' + v + ' = ' + (p.a - v),
        '再算：' + (p.a - v) + ' − ' + other + ' = ' + (p.a - v - other),
        '所以 ' + p.a + ' − (' + p.b + ' + ' + p.c + ') = ' + (p.a - p.b - p.c)
      ]);
      setMsg(p.a + ' 和 ' + v + ' 手拉手凑成 ' + (p.a - v) + '，太妙了！', 'good');
      setTimeout(levelDone, 2700);
    } else {
      failBounce(src, ghost, p.a + ' − ' + v + ' = ' + (p.a - v) + '，凑不成整十整百，换它的括号伙伴试试！');
    }
  });

  /* 投放：工作台二（括号里先凑整） */
  addZone(pairZone, function(src, ghost){
    if (pairVals.length >= 2) { bounceBack(src, ghost); return; }
    var v = Number(src.dataset.val);
    lockIn(src, ghost, pairZone);
    pairVals.push(v);
    renderPairSlots();
    if (pairVals.length === 2) {
      var s2 = pairVals[0] + pairVals[1];
      if (s2 % 10 === 0) {
        pairZone.classList.add('zDone');
        dropZoneOf(pairZone); dropZoneOf(soloZone);
        pushSteps([
          '先算括号里：' + pairVals[0] + ' + ' + pairVals[1] + ' = ' + s2 + '（正好凑整！）',
          '再算：' + p.a + ' − ' + s2 + ' = ' + (p.a - s2),
          '所以 ' + p.a + ' − (' + p.b + ' + ' + p.c + ') = ' + (p.a - s2)
        ]);
        setMsg('括号里凑成 ' + s2 + '，一步到位！', 'good');
        setTimeout(levelDone, 2500);
      } else {
        setMsg(pairVals[0] + ' + ' + pairVals[1] + ' = ' + s2 + '，凑不成整十整百，试试拆开括号配对吧！', 'bad');
        sndNo(); state.wrong++;
        setTimeout(function(){
          restoreCard(pairVals[0]); restoreCard(pairVals[1]);
          returnPairChips();
        }, 550);
      }
    } else {
      setMsg('再拖一个数进来，看看这两个数能不能凑整～', '');
    }
  });
}

/* ================= 中级：基准数法连加 ================= */
function buildBase(lv){
  var p = lv.prob, nums = p.nums, base = p.base;
  renderExpr(nums.join(' + ') + ' = <span class="q">?</span>');

  var b1 = el('div', 'bench');
  b1.appendChild(el('div', 'benchTitle', '第一步 · 数字灯塔：拖一个整十数牌子当基准数'));
  var baseZone = el('div', 'zone');
  baseZone.innerHTML = '<span class="zLabel">基准数</span><span class="slot">□</span>';
  b1.appendChild(baseZone);
  $('workbench').appendChild(b1);
  addZone(baseZone, function(src, ghost){
    var v = Number(src.dataset.val);
    if (v === base) {
      lockIn(src, ghost, baseZone);
      baseZone.innerHTML = '<span class="zLabel">基准数</span><span class="chipChip">' + v + '</span>';
      baseZone.classList.add('zDone');
      dropZoneOf(baseZone);
      setMsg('基准数站上灯塔啦！第二步：把每个数字卡放到数轴的正确格子里', 'good');
      setTimeout(function(){ buildLine(); }, 450);
    } else {
      failBounce(src, ghost, '这些数并不都靠近 ' + v + '，找一个大家都靠近的整十数吧！');
    }
  });

  /* 基准数候选牌子：基准±10（互不相同，顺序随机） */
  shuffleCopy([base - 10, base, base + 10]).forEach(function(v){
    $('tray').appendChild(mkCard(v));
  });

  /* 第二步：数轴平台（基准±6 共 13 格），每个数字卡要"站回"自己的格子 */
  var lockedNums = 0;
  function buildLine(){
    var b2 = el('div', 'bench wide');
    b2.appendChild(el('div', 'benchTitle', '第二步 · 数轴平台：每个数离基准数几格，就站哪格'));
    var strip = el('div', 'strip');
    for (var off = -6; off <= 6; off++) {
      (function(off){
        var plat = el('div', 'plat' + (off === 0 ? ' plat-zero' : ''));
        plat.dataset.val = base + off;
        plat.innerHTML = '<div class="platNum">' + (base + off) + '</div>' +
                         '<div class="platSub">' + (off === 0 ? '基准' : '&nbsp;') + '</div>';
        addZone(plat, function(src, ghost){
          var v = Number(src.dataset.val), t = Number(plat.dataset.val);
          if (v === t) {
            var o = v - base;
            lockIn(src, ghost, plat);
            plat.innerHTML = '<div class="platNum">' + v + '</div>' +
                             '<div class="platSub">' + base + (o < 0 ? '−' : '+') + Math.abs(o) + '</div>';
            plat.classList.add('zDone');
            dropZoneOf(plat);
            lockedNums++;
            if (lockedNums === nums.length) finishBase();
            else setMsg('安家成功！还剩 ' + (nums.length - lockedNums) + ' 个数字卡', 'good');
          } else {
            failBounce(src, ghost, '从 ' + base + ' 出发数一数，' + v + ' 应该站在哪一格？');
          }
        });
        strip.appendChild(plat);
      })(off);
    }
    b2.appendChild(strip);
    $('workbench').appendChild(b2);
    /* 卡片架换成数字卡（顺序随机） */
    $('tray').innerHTML = '';
    shuffleCopy(nums).forEach(function(n){ $('tray').appendChild(mkCard(n)); });
  }
  function finishBase(){
    var offs = nums.map(function(n){ return n - base; });
    var offSum = offs.reduce(function(a, c){ return a + c; }, 0);
    var bn = base * nums.length;
    var sum = nums.reduce(function(a, c){ return a + c; }, 0);
    var offStr = offs.map(function(o){
      return o < 0 ? '−' + Math.abs(o) : (o === 0 ? '0' : '+' + o);
    }).join(' ');
    var formStr = nums.map(function(n){
      var o = n - base;
      return '(' + base + (o < 0 ? '−' : '+') + Math.abs(o) + ')';
    }).join(' + ');
    pushSteps([
      '每个数都写成基准数加减几：' + formStr,
      base + ' × ' + nums.length + ' = ' + bn,
      '偏差合在一起：' + offStr + ' = ' + (offSum >= 0 ? '+' + offSum : '−' + Math.abs(offSum)),
      bn + (offSum < 0 ? ' − ' : ' + ') + Math.abs(offSum) + ' = ' + sum,
      '所以原式 = ' + sum
    ]);
    setMsg('基准数法大成功！', 'good');
    setTimeout(levelDone, 3100);
  }
}

/* ================= 高级：拆补法连加 + 终极挑战 ================= */
function buildChai(lv){
  var p = lv.prob, s = p.s, B = p.b, C = p.c;
  renderExpr(s + ' + ' + B + ' + ' + C + ' = <span class="q">?</span>');

  var benchRow = el('div', 'benchRow');

  /* 拆分台：把最小的数拖上来拆成一堆"1"小方块 */
  var bA = el('div', 'bench');
  bA.appendChild(el('div', 'benchTitle', '第一步 · 拆分台（把最小的数拖上来拆开）'));
  var splitZone = el('div', 'zone');
  splitZone.innerHTML = '<span class="zLabel">拆分台</span><span class="slot">□</span>';
  bA.appendChild(splitZone);

  /* 两座城堡 + 补数口（天平式喂养：喂到正好整百才平衡锁定） */
  function makeCastle(t){
    var b = el('div', 'bench');
    b.appendChild(el('div', 'benchTitle', '城堡 ' + t + '（补数口：喂到正好整百）'));
    b.appendChild(el('div', 'towerBig', String(t)));
    var fz = el('div', 'zone');
    fz.innerHTML = '<span class="zLabel">' + t + ' +</span><span class="slot">0</span>';
    b.appendChild(fz);
    return { box:b, zone:fz, fed:0, num:t };
  }
  var castleB = makeCastle(B), castleC = makeCastle(C);

  benchRow.appendChild(bA); benchRow.appendChild(castleB.box); benchRow.appendChild(castleC.box);
  $('workbench').appendChild(benchRow);

  /* 卡片架：最小的数 */
  $('tray').appendChild(mkCard(s));

  addZone(splitZone, function(src, ghost){
    lockIn(src, ghost, splitZone);
    splitZone.innerHTML = '<span class="zLabel">拆分台</span><span class="chipChip">' + s + ' 拆成 ' + s + ' 个小方块</span>';
    splitZone.classList.add('zDone');
    dropZoneOf(splitZone);
    $('tray').innerHTML = '';
    for (var i = 0; i < s; i++) $('tray').appendChild(mkCard(1, 'chipCard'));
    setMsg('拆好啦！把小方块喂进两个补数口，喂到正好整百为止！', 'good');
    addZone(castleB.zone, makeFeeder(castleB));
    addZone(castleC.zone, makeFeeder(castleC));
  });

  function makeFeeder(castle){
    return function(src, ghost){
      castle.fed++;
      lockIn(src, ghost, castle.zone);
      var now = castle.fed, t = castle.num;
      castle.zone.innerHTML = '<span class="zLabel">' + t + ' +</span><span class="chipChip">' + now + ' = ' + (t + now) + '</span>';
      if ((t + now) % 100 === 0) {
        castle.zone.classList.add('zDone');
        dropZoneOf(castle.zone);
        setMsg(t + ' 凑成 ' + (Math.ceil(t / 100) * 100) + ' 啦！', 'good');
        if ((B + castleB.fed) % 100 === 0 && castleB.fed > 0 &&
            (C + castleC.fed) % 100 === 0 && castleC.fed > 0) {
          finishChai();
        }
      } else {
        setMsg(t + ' + ' + now + ' = ' + (t + now) + '，还差一点点才到整百，继续喂！', '');
      }
    };
  }
  function finishChai(){
    var tB = Math.ceil(B / 100) * 100, tC = Math.ceil(C / 100) * 100;
    var x = tB - B, y = tC - C;
    var left = s - castleB.fed - castleC.fed;
    /* 剩余小方块依次收进剩余盒 */
    Array.prototype.slice.call($('tray').querySelectorAll('.card')).forEach(function(c, i){
      setTimeout(function(){ c.classList.add('gone'); }, i * 60);

    var remRow = el('div', 'remRow');
    remRow.innerHTML = '<span class="zExpr">' + s + ' 拆出 ' + x + ' 和 ' + y + '，还剩</span><span class="slot">□</span>';
    bA.appendChild(remRow);
    setTimeout(function(){
      remRow.innerHTML = '<span class="zExpr">' + s + ' 拆出 ' + x + ' 和 ' + y + '，还剩</span><span class="chipChip">' + left + '</span>';
    }, s * 60 + 250);
    pushSteps([
      B + ' + ' + x + ' = ' + tB + '（凑成整百）',
      C + ' + ' + y + ' = ' + tC + '（凑成整百）',
      s + ' 拆出 ' + x + ' 和 ' + y + '，还剩 ' + left,
      left + ' + ' + tB + ' + ' + tC + ' = ' + (s + B + C),
      '所以原式 = ' + (s + B + C)
    ]);
    setMsg('拆补法大成功！', 'good');
    setTimeout(levelDone, 3300);
  }
}

/* 终极挑战：28 + 208 + 2008 + 20008 = 22252（每个数 = 整的部分 + 8） */
function buildBoss(lv){
  var nums = lv.prob.nums;
  var plates = shuffleCopy(BOSS_PLATES.slice());
  renderExpr(nums.join(' + ') + ' = <span class="q">?</span>');

  var benchRow = el('div', 'benchRow');
  var locked = 0;

  nums.forEach(function(num){
    var b = el('div', 'bench');
    b.appendChild(el('div', 'benchTitle', '积木塔'));
    b.appendChild(el('div', 'towerBig', String(num)));
    var bz = el('div', 'zone');
    bz.innerHTML = '<span class="zLabel">底座</span><span class="slot">□</span>';
    b.appendChild(bz);
    benchRow.appendChild(b);
    addZone(bz, function(src, ghost){
      var v = Number(src.dataset.val);
      if (num - v === 8) {
        lockIn(src, ghost, bz);
        bz.innerHTML = '<span class="chipChip">' + num + ' = ' + v + ' + 8</span>';
        bz.classList.add('zDone');
        dropZoneOf(bz);
        locked++;
        if (locked === nums.length) {
          pushSteps([
            '每个数都拆成「整的部分 + 8」：' +
              nums.map(function(n){ return n + '=' + (n - 8) + '+8'; }).join('、'),
            (nums[0] - 8) + ' + ' + (nums[1] - 8) + ' + ' + (nums[2] - 8) + ' + ' + (nums[3] - 8) + ' = 22220',
            '8 × 4 = 32',
            '22220 + 32 = 22252',
            '所以原式 = 22252'
          ]);
          setMsg('终极挑战完成！你就是巧算之星！', 'good');
          setTimeout(levelDone, 3300);
        } else {
          setMsg('配对成功！还剩 ' + (nums.length - locked) + ' 座积木塔', 'good');
        }
      } else {
        failBounce(src, ghost, num + ' − ' + v + ' = ' + (num - v) + '，不是刚好多 8 哦，再试试！');
      }
    });
  });
  $('workbench').appendChild(benchRow);
  plates.forEach(function(v){ $('tray').appendChild(mkCard(v)); });
}

/* 每种题型的标准巧算过程（揭示答案用，答案与过程严格自洽） */
function revealLines(lv){
  if (lv.kind === 'kuo') {
    var p = lv.prob;
    if ((p.b + p.c) % 10 === 0) {
      return [
        '第1步 先算括号里：' + p.b + ' + ' + p.c + ' = ' + (p.b + p.c) + '（正好凑整）',
        '第2步 再算：' + p.a + ' − ' + (p.b + p.c) + ' = ' + (p.a - p.b - p.c),
        '答案：' + p.a + ' − (' + p.b + ' + ' + p.c + ') = ' + (p.a - p.b - p.c)
      ];
    }
    var x = ((p.a - p.b) % 10 === 0) ? p.b : p.c;
    var y = (x === p.b) ? p.c : p.b;
    return [
      '括号里 ' + p.b + ' + ' + p.c + ' = ' + (p.b + p.c) + '，不凑整，拆开括号：' + p.a + ' − ' + p.b + ' − ' + p.c,
      '调换顺序先算凑整：' + p.a + ' − ' + x + ' = ' + (p.a - x),
      '再算：' + (p.a - x) + ' − ' + y + ' = ' + (p.a - p.b - p.c),
      '答案：' + p.a + ' − (' + p.b + ' + ' + p.c + ') = ' + (p.a - p.b - p.c)
    ];
  }
  if (lv.kind === 'base') {
    var nums = lv.prob.nums, base = lv.prob.base;
    var offs = nums.map(function(n){ return n - base; });
    var offSum = offs.reduce(function(a, c){ return a + c; }, 0);
    var bn = base * nums.length;
    var sum = nums.reduce(function(a, c){ return a + c; }, 0);
    var formStr = nums.map(function(n){
      var o = n - base;
      return '(' + base + (o < 0 ? '−' : '+') + Math.abs(o) + ')';
    }).join(' + ');
    return [
      '第1步 每个数都靠近 ' + base + '，把它当基准数',
      '第2步 ' + base + ' × ' + nums.length + ' = ' + bn,
      '第3步 每个数写成基准数加减几：' + formStr,
      '第4步 偏差合在一起：' + offs.map(function(o){
        return o < 0 ? '−' + Math.abs(o) : (o === 0 ? '0' : '+' + o);
      }).join(' ') + ' = ' + (offSum >= 0 ? '+' + offSum : '−' + Math.abs(offSum)),
      '第5步 ' + bn + (offSum < 0 ? ' − ' : ' + ') + Math.abs(offSum) + ' = ' + sum
    ];
  }
  if (lv.kind === 'chai') {
    var s = lv.prob.s, B = lv.prob.b, C = lv.prob.c;
    var tB = Math.ceil(B / 100) * 100, tC = Math.ceil(C / 100) * 100;
    var xb = tB - B, yc = tC - C, left = s - xb - yc;
    return [
      '第1步 把最小的 ' + s + ' 拆开，拿出 ' + xb + ' 补给 ' + B + '：' + B + ' + ' + xb + ' = ' + tB,
      '第2步 再拿出 ' + yc + ' 补给 ' + C + '：' + C + ' + ' + yc + ' = ' + tC,
      '第3步 ' + s + ' 拆出 ' + xb + ' 和 ' + yc + '，还剩 ' + left,
      '第4步 ' + left + ' + ' + tB + ' + ' + tC + ' = ' + (s + B + C)
    ];
  }
  return [
    '第1步 每个数都拆成「整的部分 + 8」：' +
      lv.prob.nums.map(function(n){ return n + '=' + (n - 8) + '+8'; }).join('、'),
    '第2步 整的部分合起来：20 + 200 + 2000 + 20000 = 22220',
    '第3步 8 × 4 = 32',
    '第4步 22220 + 32 = 22252'
  ];
}
