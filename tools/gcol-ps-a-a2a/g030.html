<!DOCTYPE html>
<html lang="zh-CN">

<title>时间魔法师·合理安排大挑战</title>
<style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;min-height:100vh;font-family:"PingFang SC","Microsoft YaHei","Heiti SC","Source Han Sans",sans-serif;background:#f0f4f8;color:#2c3e50;overflow-x:hidden;-webkit-user-select:none;user-select:none}.screen{width:100%;min-height:100vh;padding:14px}.hidden{display:none!important}button{font-family:inherit;cursor:pointer;border:none;outline:none}.topbar{text-align:center;padding:18px 10px 8px;position:relative}.topbar h1{font-size:2.3rem;color:#fff;letter-spacing:2px;text-shadow:0 3px 0 rgba(0,0,0,.12),0 6px 18px rgba(0,0,0,.18)}.subtitle{color:#fff;font-size:1.05rem;margin-top:6px;opacity:.96;text-shadow:0 1px 3px rgba(0,0,0,.2)}#rulesBtnTop{position:absolute;top:18px;right:14px}.ghost-btn{background:rgba(255,255,255,.92);color:var(--accent,#4A90E2);padding:9px 16px;border-radius:22px;font-size:.95rem;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.1);transition:transform .1s}.ghost-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.1)}.action-btn{background:var(--accent,#4A90E2);color:#fff;padding:13px 18px;border-radius:14px;font-size:1.05rem;font-weight:700;box-shadow:0 4px 0 var(--accent-dark,#357ABD);transition:transform .1s,box-shadow .1s;flex:1;min-width:120px}.action-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-dark,#357ABD)}.action-btn.secondary{background:#fff;color:var(--accent,#4A90E2)}#startScreen{background:linear-gradient(160deg,var(--accent,#4A90E2) 0%,var(--accent-dark,#357ABD) 100%);display:flex;flex-direction:column;justify-content:center}.cards{display:flex;flex-direction:column;gap:16px;max-width:460px;margin:12px auto;width:92%}.diff-card{background:#fff;border-radius:20px;padding:22px 18px;text-align:left;display:flex;align-items:center;gap:16px;position:relative;box-shadow:0 8px 22px rgba(0,0,0,.15);transition:transform .15s}.diff-card:active{transform:scale(.97)}.diff-card .icon{font-size:2.6rem;width:60px;height:60px;display:flex;align-items:center;justify-content:center;background:var(--accent,#4A90E2);border-radius:16px;flex-shrink:0}.diff-card .icon{background:#eef4fb}.diff-card[data-level=queue] .icon{background:#e8f5e9}.diff-card[data-level=river] .icon{background:#e3f2fd}.diff-card[data-level=bridge] .icon{background:#f3e5f5}.diff-card h2{font-size:1.4rem;color:#2c3e50}.diff-card p{color:#7f8c8d;font-size:.95rem;margin-top:3px}.diff-card .badge{position:absolute;top:14px;right:16px;background:var(--accent,#4A90E2);color:#fff;padding:4px 12px;border-radius:12px;font-size:.8rem;font-weight:700}.diff-card[data-level=queue] .badge{background:#52C41A}.diff-card[data-level=river] .badge{background:#1890ff}.diff-card[data-level=bridge] .badge{background:#722ED1}#gameScreen{background:#f0f4f8;padding-bottom:20px}.gamebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent,#4A90E2);color:#fff;padding:10px 12px;border-radius:16px;margin-bottom:10px;box-shadow:0 4px 14px rgba(0,0,0,.12)}.gameinfo{flex:1;min-width:140px;display:flex;align-items:center;gap:8px}.gameinfo #levelTitle{font-size:1.15rem;font-weight:700}.tag{background:rgba(255,255,255,.25);padding:3px 10px;border-radius:10px;font-size:.85rem;font-weight:700}.stats{display:flex;gap:10px}.stat{background:rgba(255,255,255,.2);padding:5px 11px;border-radius:10px;font-size:.9rem;font-weight:600}.stat b{font-size:1rem}.goalmeta{display:flex;justify-content:space-between;gap:10px;background:#fff;padding:10px 14px;border-radius:12px;margin-bottom:10px;font-size:1rem;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.06)}#curTotal{color:#2c3e50}#optTotal{color:#e67e22}.story{background:#fff;border-left:6px solid var(--accent,#4A90E2);padding:12px 14px;border-radius:10px;margin-bottom:12px;font-size:1rem;line-height:1.7;color:#34495e;box-shadow:0 2px 8px rgba(0,0,0,.05)}.stage{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;min-height:280px;box-shadow:0 4px 14px rgba(0,0,0,.08)}.tap-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px}.tap-icon{font-size:3rem}.tap-label{font-size:1rem;font-weight:700;color:var(--accent,#4A90E2)}.water-stream{width:14px;height:26px;margin:0 auto;background:linear-gradient(180deg,rgba(74,144,226,.6),rgba(74,144,226,.15));border-radius:0 0 8px 8px;position:relative;overflow:hidden}.water-stream::after{content:"";position:absolute;left:-10%;top:0;width:120%;height:40%;background:repeating-linear-gradient(135deg,rgba(255,255,255,.5) 0 6px,transparent 6px 12px);animation:flow 0.7s linear infinite}@keyframes flow{from{transform:translateY(-100%)}to{transform:translateY(250%)}}.queue-area{display:flex;gap:10px;padding:14px 8px;min-height:130px;align-items:flex-start;justify-content:center;flex-wrap:wrap;background:#fafbfc;border-radius:12px;border:2px dashed #d5dde5;touch-action:none}.qcard{background:var(--card-bg,#fff);border:3px solid var(--card-bd,#4A90E2);border-radius:14px;padding:10px 8px;width:78px;text-align:center;box-shadow:0 3px 0 var(--card-bd,#4A90E2);transition:transform .12s,box-shadow .12s;flex-shrink:0;touch-action:none}.qcard .avatar{font-size:1.8rem}.qcard .pname{font-size:.85rem;font-weight:700;color:#2c3e50;margin-top:2px}.qcard .ptime{font-size:.95rem;font-weight:800;color:var(--card-bd,#4A90E2);margin-top:2px}.qcard .pfinish{font-size:.72rem;color:#95a5a6;margin-top:3px;min-height:14px}.qcard.dragging{transform:scale(1.12) rotate(-3deg);box-shadow:0 10px 24px rgba(0,0,0,.25);opacity:.96;z-index:50}.qcard .grip{font-size:.7rem;color:#bdc3c7;margin-bottom:2px}.timeline{margin-top:14px;display:flex;gap:6px;align-items:flex-end;justify-content:center;flex-wrap:wrap;min-height:70px}.tbar{background:var(--card-bg,#4A90E2);border-radius:8px 8px 0 0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:6px 4px;color:#fff;min-height:30px;min-width:46px;transition:height .25s;border:2px solid var(--card-bd,#4A90E2);border-bottom:none}.tbar .tval{font-size:.8rem;font-weight:800}.tbar .tname{font-size:.7rem;opacity:.9}.tl-label{text-align:center;font-size:.85rem;color:#7f8c8d;margin-top:6px}.river-stage{display:flex;flex-direction:column;gap:10px}.banks{display:flex;justify-content:space-between;gap:8px;align-items:stretch}.bank{flex:1;min-height:110px;border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;justify-content:center;border:2px solid}.bank.start{background:#eaf6ea;border-color:#8bc34a}.bank.goal{background:#fff4e6;border-color:#ffa940}.bank-label{width:100%;text-align:center;font-size:.85rem;font-weight:700;color:#555;margin-bottom:4px}.person{background:var(--card-bg,#fff);border:3px solid var(--card-bd,#4A90E2);border-radius:50%;width:62px;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--card-bd,#4A90E2);cursor:pointer;transition:transform .12s;flex-shrink:0}.person:active{transform:scale(.92)}.person .pavatar{font-size:1.5rem;line-height:1}.person .ptime{font-size:.7rem;font-weight:800;color:var(--card-bd,#4A90E2)}.person.boarded{opacity:.3;pointer-events:none}.person.disabled{opacity:.35;pointer-events:none}.boat-zone{background:linear-gradient(180deg,#e3f2fd,#bbdefb);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;border:2px solid #64b5f6}.boat-cap-label{font-size:.82rem;color:#1976d2;font-weight:700}.boat-svg-wrap{position:relative;width:150px;height:70px}.boat-load{display:flex;gap:6px;min-height:56px;align-items:center;justify-content:center}.boat-load .person{width:50px;height:50px}.boat-load .person .pavatar{font-size:1.2rem}.depart-btn{background:#ff7043;color:#fff;padding:12px 28px;border-radius:30px;font-size:1.1rem;font-weight:800;box-shadow:0 4px 0 #d84315;align-self:center;transition:transform .1s}.depart-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d84315}.depart-btn:disabled{background:#ccc;box-shadow:0 4px 0 #aaa}.trip-log{background:#f7f9fb;border-radius:10px;padding:10px;margin-top:8px;font-size:.9rem;max-height:110px;overflow-y:auto;line-height:1.6}.trip-log .log-item{padding:3px 0;border-bottom:1px dashed #e0e6ed}.trip-log .log-item:last-child{border-bottom:none}.log-empty{color:#bdc3c7;text-align:center}.feedback{min-height:40px}.msg{padding:12px 14px;border-radius:12px;font-size:1rem;font-weight:700;text-align:center;animation:pop .3s}.msg.good{background:#d4edda;color:#155724;border:2px solid #c3e6cb}.msg.bad{background:#f8d7da;color:#721c24;border:2px solid #f5c6cb}.msg.info{background:#d1ecf1;color:#0c5460;border:2px solid #bee5eb}@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}.controls{display:flex;gap:10px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}.modal-card{background:#fff;border-radius:20px;padding:22px;max-width:460px;width:100%;max-height:86vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}.modal-card h2{color:var(--accent,#4A90E2);margin-bottom:12px;font-size:1.4rem;text-align:center}.modal-card #rulesContent{font-size:.98rem;line-height:1.8;color:#34495e;margin-bottom:16px}.modal-card #rulesContent p{margin-bottom:8px}.modal-card #rulesContent b{color:var(--accent,#4A90E2)}#confettiCanvas{position:fixed;inset:0;pointer-events:none;z-index:300;display:none}@media(max-width:480px){.topbar h1{font-size:1.8rem}.diff-card{padding:16px 12px}.qcard{width:68px;padding:8px 6px}.person{width:54px;height:54px}.boat-svg-wrap{width:120px}}
</style>
</head>
<body>

<!-- ========== 开始界面 ========== -->
<div id="startScreen" class="screen">
  <header class="topbar">
    <h1>⏰ 时间魔法师</h1>
    <p class="subtitle">合理安排大挑战 · 小学数学第15讲</p>
    <button id="rulesBtnTop" class="ghost-btn">📋 规则</button>
  </header>
  <div class="cards">
    <button class="diff-card" data-level="queue">
      <div class="icon">💧</div>
      <div>
        <h2>彩虹水站</h2>
        <p>排队打水 · 先快后慢</p>
      </div>
      <span class="badge">初级</span>
    </button>
    <button class="diff-card" data-level="river">
      <div class="icon">🚣</div>
      <div>
        <h2>小船渡河</h2>
        <p>3人过河 · 快者来回</p>
      </div>
      <span class="badge">中级</span>
    </button>
    <button class="diff-card" data-level="bridge">
      <div class="icon">🌉</div>
      <div>
        <h2>星光之桥</h2>
        <p>4人夜桥 · 慢者结伴</p>
      </div>
      <span class="badge">高级</span>
    </button>
  </div>
  <p style="text-align:center;color:#fff;margin-top:18px;opacity:.85;font-size:.9rem;">
    点一个挑战开始吧！每一关都在玩中学会合理安排的智慧 ✨
  </p>
</div>

<!-- ========== 游戏界面 ========== -->
<div id="gameScreen" class="screen hidden">
  <header class="gamebar">
    <button id="backBtn" class="ghost-btn">← 返回</button>
    <div class="gameinfo">
      <span id="levelTag" class="tag">初级</span>
      <span id="levelTitle">彩虹水站</span>
    </div>
    <div class="stats">
      <span class="stat">⏱ <b id="timer">00:00</b></span>
      <span class="stat">📝 <b id="steps">0</b>步</span>
    </div>
  </header>
  <div class="goalmeta">
    <span id="curTotal">当前总时间：—</span>
    <span id="optTotal">最优目标：—</span>
  </div>
  <div id="story" class="story"></div>
  <div id="stage" class="stage"></div>
  <div id="feedback" class="feedback"></div>
  <div class="controls">
    <button id="revealBtn" class="action-btn secondary">💡 揭示答案</button>
    <button id="restartBtn" class="action-btn secondary">🔄 重新开始</button>
    <button id="rulesBtn" class="action-btn secondary">📋 规则说明</button>
  </div>
</div>

<!-- ========== 规则弹窗 ========== -->
<div id="rulesModal" class="modal hidden">
  <div class="modal-card">
    <h2 id="rulesTitle">📋 游戏规则</h2>
    <div id="rulesContent"></div>
    <button id="closeRules" class="action-btn">明白了，开始闯关！</button>
  </div>
</div>

<!-- ========== 庆祝画布 ========== -->
<canvas id="confettiCanvas"></canvas>

<script>"use strict";var PALETTES=[{name:"海洋蓝",accent:"#4A90E2",dark:"#357ABD",confetti:["#4A90E2","#7BB3F0","#52C41A","#FFC107","#E91E63"]},{name:"森林绿",accent:"#52C41A",dark:"#389E0D",confetti:["#52C41A","#95DE64","#1890FF","#FAAD14","#722ED1"]},{name:"阳光橙",accent:"#FA8C16",dark:"#D46B08",confetti:["#FA8C16","#FFC069","#13C2C2","#EB2F96","#7CB305"]},{name:"梦幻紫",accent:"#722ED1",dark:"#531DAB",confetti:["#722ED1","#B37FEB","#FA541C","#52C41A","#1890FF"]},{name:"青柠清新",accent:"#13C2C2",dark:"#08979C",confetti:["#13C2C2","#5CDBD3","#FAAD14","#F5222D","#722ED1"]},{name:"樱花粉",accent:"#EB2F96",dark:"#C41D7F",confetti:["#EB2F96","#FF85C0","#52C41A","#1890FF","#FAAD14"]}];var PROBLEMS={queue:[{story:"下课啦！丁丁、阿普、田田、牛牛拿着大小不同的水桶到彩虹水站接水。水站只有一个水龙头，怎样排队才能让大家等候的时间总和最短呢？",people:[{a:"👦",n:"丁丁",t:2},{a:"🧒",n:"阿普",t:3},{a:"👧",n:"田田",t:4},{a:"👨",n:"牛牛",t:5}],opt:30,src:"例6（2/3/4/5分）"},{story:"四位小伙伴各提一个大小不一样的桶来打水。请你帮他们排一排，让所有人等候的时间总和最短！",people:[{a:"👦",n:"甲",t:1},{a:"🧒",n:"乙",t:2},{a:"👧",n:"丙",t:3},{a:"👨",n:"丁",t:4}],opt:20,src:"练习16（1/2/3/4分）"},{story:"四个水桶注满水分别需要2分、4分、5分、6分。只有一个水龙头，怎样安排总等候时间最少？",people:[{a:"👦",n:"小桶",t:2},{a:"🧒",n:"中桶",t:4},{a:"👧",n:"大桶",t:5},{a:"👨",n:"特大桶",t:6}],opt:36,src:"练习3（2/4/5/6分）"},{story:"六位同学排队接水，注满时间分别是3、4、5、6、7、9分钟。只有1个水龙头，怎样安排最省时间？这是高级挑战哦！",people:[{a:"👦",n:"同学1",t:3},{a:"🧒",n:"同学2",t:4},{a:"👧",n:"同学3",t:5},{a:"👨",n:"同学4",t:6},{a:"👩",n:"同学5",t:7},{a:"🧑",n:"同学6",t:9}],opt:99,src:"练习9（3/4/5/6/7/9分）"}],river:[{story:"春游啦！牛牛、丁丁、田田要划小船过河野餐。小船每次最多坐2人，'谁来划船，过河时间就按谁的速度算'——船上更快的人来划更省时。牛牛划船2分、丁丁3分、田田5分。怎样让3人全部过河用时最短？",people:[{a:"👦",n:"牛牛",t:2},{a:"🧒",n:"丁丁",t:3},{a:"👧",n:"田田",t:5}],opt:6,src:"例4（船，2/3/5分）",mode:"min"},{story:"牛牛、丁丁、田田骑车去公园，只有1辆自行车（除骑车人外还能载1人）。骑车速度：牛牛30分、丁丁35分、田田40分。'谁来骑车就按谁的速度'，3人怎样最快全部到达公园？",people:[{a:"👦",n:"牛牛",t:30},{a:"🧒",n:"丁丁",t:35},{a:"👧",n:"田田",t:40}],opt:90,src:"练习10（骑车，30/35/40分）",mode:"min"}],bridge:[{story:"夜晚的星光之桥真美！牛牛、丁丁、田田、乐乐老师要过桥去看星星。桥每次最多走2人，必须带唯一的魔法灯笼。两人一起走时，时间按走得慢的那个人算。4人速度：牛牛1分、丁丁2分、田田5分、乐乐10分。怎样让所有人最快过桥？提示：让最慢的两人一起走，会更省时间哦！",people:[{a:"👦",n:"牛牛",t:1},{a:"🧒",n:"丁丁",t:2},{a:"👧",n:"田田",t:5},{a:"👩‍🏫",n:"乐乐",t:10}],opt:17,src:"练习13（夜桥，1/2/5/10分）",mode:"max"},{story:"安全演习！牛牛、丁丁、田田、乐乐老师4人要通过一座木桥到达安全区。桥每次最多2人，必须用唯一的防护披风。两人同行按慢的算。4人速度：牛牛1分、丁丁2分、田田5分、乐乐8分。怎样安排才能让所有人最快全部安全通过？",people:[{a:"👦",n:"牛牛",t:1},{a:"🧒",n:"丁丁",t:2},{a:"👧",n:"田田",t:5},{a:"👩‍🏫",n:"乐乐",t:8}],opt:15,src:"例5（演习桥，1/2/5/8分）",mode:"max"}]};var state={levelKey:null,difficulty:"",title:"",problem:null,palette:null,startTime:0,steps:0,timerId:null,solved:false,queueOrder:[],banks:[[],[]],boatBank:0,boatLoad:[],totalTime:0,log:[]};function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=a[i];a[i]=a[j];a[j]=tmp}return a}function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}function applyPalette(){var p=state.palette;document.documentElement.style.setProperty("--accent",p.accent);document.documentElement.style.setProperty("--accent-dark",p.dark)}function showStart(){document.getElementById("startScreen").classList.remove("hidden");document.getElementById("gameScreen").classList.add("hidden");stopTimer()}function showGame(){document.getElementById("startScreen").classList.add("hidden");document.getElementById("gameScreen").classList.remove("hidden")}function startTimer(){state.startTime=Date.now();state.steps=0;document.getElementById("steps").textContent="0";stopTimer();state.timerId=setInterval(function(){var sec=Math.floor((Date.now()-state.startTime)/1e3);var m=String(Math.floor(sec/60)).padStart(2,"0");var s=String(sec%60).padStart(2,"0");document.getElementById("timer").textContent=m+":"+s},500)}function stopTimer(){if(state.timerId){clearInterval(state.timerId);state.timerId=null}}function addStep(){state.steps++;document.getElementById("steps").textContent=state.steps}function startLevel(levelKey){state.levelKey=levelKey;state.palette=pick(PALETTES);applyPalette();state.problem=pick(PROBLEMS[levelKey]);state.solved=false;state.totalTime=0;state.log=[];state.boatLoad=[];state.boatBank=0;var map={queue:{difficulty:"初级",title:"彩虹水站·排队打水"},river:{difficulty:"中级",title:"小船渡河·快者来回"},bridge:{difficulty:"高级",title:"星光之桥·慢者结伴"}};state.difficulty=map[levelKey].difficulty;state.title=map[levelKey].title;document.getElementById("levelTag").textContent=state.difficulty;document.getElementById("levelTitle").textContent=state.title;document.getElementById("story").textContent=state.problem.story;document.getElementById("optTotal").textContent="最优目标："+state.problem.opt+"（"+unitWord()+"）";document.getElementById("feedback").innerHTML="";showGame();startTimer();if(levelKey==="queue"){renderQueue()}else{renderRiver()}}function unitWord(){return state.levelKey==="queue"?"总等候时间":"总过河时间"}function renderQueue(){var stage=document.getElementById("stage");var prob=state.problem;state.queueOrder=shuffle(prob.people.map(function(p,i){return i}));var html="";html+='<div class="tap-row"><span class="tap-icon">🚰</span><span class="tap-label">彩虹水龙头（只有1个）</span></div>';html+='<div class="water-stream"></div>';html+='<div class="queue-area" id="queueArea"></div>';html+='<div class="tl-label">↑ 第1个接水（最先）  ·  拖动小伙伴改变排队顺序  ·  越靠后越晚接水 ↑</div>';html+='<div class="timeline" id="timeline"></div>';html+='<div class="tl-label">每个人"等候+接水"的总用时（条越高=等得越久）</div>';stage.innerHTML=html;fillQueueCards();updateQueueStats();makeSortable(document.getElementById("queueArea"),function(){addStep();updateQueueStats();checkQueueWin()})}function fillQueueCards(){var area=document.getElementById("queueArea");area.innerHTML="";var prob=state.problem;state.queueOrder.forEach(function(idx){var p=prob.people[idx];var card=document.createElement("div");card.className="qcard";card.setAttribute("data-idx",idx);card.style.setProperty("--card-bg",shade(state.palette.accent,.85));card.style.setProperty("--card-bd",state.palette.accent);card.innerHTML='<div class="grip">⠿ 拖</div><div class="avatar">'+p.a+'</div><div class="pname">'+p.n+'</div><div class="ptime">⏱'+p.t+'分</div><div class="pfinish" data-role="finish"></div>';area.appendChild(card)})}function updateQueueStats(){var prob=state.problem;var cumulative=0,total=0;var cards=document.querySelectorAll("#queueArea .qcard");var heights=[];state.queueOrder.forEach(function(idx,pos){cumulative+=prob.people[idx].t;total+=cumulative;heights.push({idx,finish:cumulative})});cards.forEach(function(card){var idx=parseInt(card.getAttribute("data-idx"),10);var pos=state.queueOrder.indexOf(idx);var fin=heights[pos].finish;card.querySelector('[data-role="finish"]').textContent="第"+(pos+1)+"位 · "+fin+"分结束"});document.getElementById("curTotal").textContent="当前总时间："+total+"（"+unitWord()+"）";renderTimeline(heights)}function renderTimeline(heights){var tl=document.getElementById("timeline");if(!tl)return;tl.innerHTML="";var maxFin=Math.max.apply(Math,heights.map(function(h){return h.finish}));heights.forEach(function(h){var bar=document.createElement("div");bar.className="tbar";var p=state.problem.people[h.idx];bar.style.setProperty("--card-bg",state.palette.accent);bar.style.setProperty("--card-bd",state.palette.dark);var ratio=maxFin>0?h.finish/maxFin:0;bar.style.height=Math.round(30+ratio*80)+"px";bar.innerHTML='<div class="tval">'+h.finish+'</div><div class="tname">'+p.n+"</div>";tl.appendChild(bar)})}function makeSortable(container,onChange){var dragEl=null,pid=null;container.addEventListener("pointerdown",function(e){var card=e.target.closest(".qcard");if(!card)return;e.preventDefault();dragEl=card;pid=e.pointerId;try{card.setPointerCapture(pid)}catch(_){}card.classList.add("dragging");card.addEventListener("pointermove",onMove);card.addEventListener("pointerup",onUp);card.addEventListener("pointercancel",onUp)});function onMove(e){if(!dragEl||e.pointerId!==pid)return;var x=e.clientX,y=e.clientY;var sibs=Array.prototype.filter.call(container.querySelectorAll(".qcard:not(.dragging)"),function(){return true});sibs=Array.prototype.filter.call(container.querySelectorAll(".qcard"),function(c){return c!==dragEl});for(var i=0;i<sibs.length;i++){var r=sibs[i].getBoundingClientRect();if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom){var mid=r.left+r.width/2;if(x<mid){if(sibs[i].previousElementSibling!==dragEl){container.insertBefore(dragEl,sibs[i]);syncQueueOrder();onChange()}}else{if(sibs[i].nextElementSibling!==dragEl){container.insertBefore(dragEl,sibs[i].nextElementSibling);syncQueueOrder();onChange()}}break}}}function onUp(e){if(!dragEl)return;dragEl.classList.remove("dragging");dragEl.removeEventListener("pointermove",onMove);dragEl.removeEventListener("pointerup",onUp);dragEl.removeEventListener("pointercancel",onUp);syncQueueOrder();onChange();dragEl=null}}function syncQueueOrder(){var cards=document.querySelectorAll("#queueArea .qcard");var order=[];for(var i=0;i<cards.length;i++){order.push(parseInt(cards[i].getAttribute("data-idx"),10))}state.queueOrder=order}function checkQueueWin(){if(state.solved)return;var total=computeQueueTotal(state.queueOrder);if(total===state.problem.opt){state.solved=true;stopTimer();showFeedback("good","太棒了！🎉 总等候时间最短只要 "+total+" 分！你掌握了「先快后慢」的智慧！");celebrate()}}function computeQueueTotal(order){var prob=state.problem,cum=0,total=0;order.forEach(function(idx){cum+=prob.people[idx].t;total+=cum});return total}function renderRiver(){var stage=document.getElementById("stage");var prob=state.problem;state.banks=[prob.people.map(function(p,i){return i}),[]];state.boatBank=0;state.boatLoad=[];state.totalTime=0;state.log=[];state.solved=false;var cap=2;var html='<div class="river-stage">';html+='  <div class="banks">';html+='    <div class="bank start" id="bank0"><div class="bank-label">🌟 此岸（出发地）</div></div>';html+='    <div class="bank goal" id="bank1"><div class="bank-label">🌈 对岸（目的地）</div></div>';html+="  </div>";html+='  <div class="boat-zone">';html+='    <div class="boat-cap-label" id="boatLabel">小船在此岸 · 每次最多'+cap+"人 · 当前0人</div>";html+='    <div class="boat-svg-wrap" id="boatWrap"></div>';html+='    <div class="boat-load" id="boatLoad"></div>';html+='    <button class="depart-btn" id="departBtn">⛵ 出发过河</button>';html+="  </div>";html+='  <div class="trip-log" id="tripLog"><div class="log-empty">还没有过河记录，点小伙伴上船开始吧～</div></div>';html+="</div>";stage.innerHTML=html;drawBoatSVG();renderBanks();renderBoat();document.getElementById("departBtn").addEventListener("click",departBoat)}function drawBoatSVG(){var wrap=document.getElementById("boatWrap");if(!wrap)return;var atLeft=state.boatBank===0;wrap.innerHTML='<svg viewBox="0 0 150 70" width="100%" height="100%"><path d="M15 45 Q75 70 135 45 L125 60 Q75 80 25 60 Z" fill="'+state.palette.accent+'" opacity=".9"/><path d="M20 45 L130 45 L120 58 Q75 75 30 58 Z" fill="'+shade(state.palette.accent,.7)+'" stroke="'+state.palette.dark+'" stroke-width="2"/><line x1="75" y1="45" x2="75" y2="12" stroke="'+state.palette.dark+'" stroke-width="3" stroke-linecap="round"/><path d="M75 14 L110 28 L75 34 Z" fill="'+shade(state.palette.accent,.6)+'" stroke="'+state.palette.dark+'" stroke-width="1.5"/><text x="75" y="50" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">船</text></svg>';wrap.style.transition="transform .4s ease";wrap.style.transform=atLeft?"translateX(0)":"translateX(0)"}function renderBanks(){var prob=state.problem;for(var b=0;b<2;b++){var bankEl=document.getElementById("bank"+b);var labels=bankEl.querySelectorAll(".bank-label");bankEl.innerHTML="";var lbl=document.createElement("div");lbl.className="bank-label";lbl.textContent=b===0?"🌟 此岸（出发地）":"🌈 对岸（目的地）";bankEl.appendChild(lbl);state.banks[b].forEach(function(idx){var p=prob.people[idx];var el=document.createElement("div");el.className="person";el.setAttribute("data-idx",idx);el.setAttribute("data-bank",b);el.style.setProperty("--card-bg",shade(state.palette.accent,.85));el.style.setProperty("--card-bd",state.palette.accent);el.innerHTML='<div class="pavatar">'+p.a+'</div><div class="ptime">'+p.t+"分</div>";el.title=p.n+"（"+p.t+"分）";if(b!==state.boatBank){el.classList.add("disabled")}else{el.addEventListener("click",function(){boardPerson(idx)})}bankEl.appendChild(el)});if(state.banks[b].length===0){var empty=document.createElement("div");empty.style.cssText="color:#bbb;font-size:.85rem;align-self:center;";empty.textContent=b===0?"（此岸已空）":"（还没人到）";bankEl.appendChild(empty)}}}function renderBoat(){var prob=state.problem;var loadEl=document.getElementById("boatLoad");loadEl.innerHTML="";state.boatLoad.forEach(function(idx){var p=prob.people[idx];var el=document.createElement("div");el.className="person";el.setAttribute("data-idx",idx);el.style.setProperty("--card-bg","#fff");el.style.setProperty("--card-bd",state.palette.dark);el.innerHTML='<div class="pavatar">'+p.a+'</div><div class="ptime">'+p.t+"</div>";el.addEventListener("click",function(){unboardPerson(idx)});loadEl.appendChild(el)});var cap=2;var lbl=document.getElementById("boatLabel");var where=state.boatBank===0?"此岸":"对岸";lbl.textContent="小船在"+where+" · 每次最多"+cap+"人 · 当前"+state.boatLoad.length+"人";var btn=document.getElementById("departBtn");btn.disabled=state.boatLoad.length===0;drawBoatSVG()}function boardPerson(idx){if(state.solved)return;var from=state.boatBank;var pos=state.banks[from].indexOf(idx);if(pos<0)return;if(state.boatLoad.length>=2){showFeedback("info","小船最多坐2人哦！先点船里的人下船，再换人吧～");return}state.banks[from].splice(pos,1);state.boatLoad.push(idx);addStep();renderBanks();renderBoat();clearFeedback()}function unboardPerson(idx){if(state.solved)return;var pos=state.boatLoad.indexOf(idx);if(pos<0)return;state.boatLoad.splice(pos,1);state.banks[state.boatBank].push(idx);addStep();renderBanks();renderBoat();clearFeedback()}function departBoat(){if(state.solved)return;if(state.boatLoad.length===0){showFeedback("info","船上至少要上1个人才能出发哦！");return}var prob=state.problem;var mode=prob.mode;var times=state.boatLoad.map(function(idx){return prob.people[idx].t});var tripTime=mode==="min"?Math.min.apply(Math,times):Math.max.apply(Math,times);var names=state.boatLoad.map(function(idx){return prob.people[idx].n}).join(" + ");state.totalTime+=tripTime;state.boatBank=1-state.boatBank;state.boatLoad.forEach(function(idx){state.banks[state.boatBank].push(idx)});state.boatLoad=[];var verb=mode==="max"?"过桥":"过河";var why=mode==="min"?"（船上更快者划船）":"（按走得慢的算）";state.log.push({names,time:tripTime,verb,why});addStep();renderBanks();renderBoat();renderLog();document.getElementById("curTotal").textContent="当前总时间："+state.totalTime+"（"+unitWord()+"）";clearFeedback();checkRiverWin()}function renderLog(){var logEl=document.getElementById("tripLog");if(!logEl)return;if(state.log.length===0){logEl.innerHTML='<div class="log-empty">还没有过河记录，点小伙伴上船开始吧～</div>';return}var html="";state.log.forEach(function(it,i){html+='<div class="log-item">第'+(i+1)+"趟："+it.names+" "+it.verb+" · 用时 <b>"+it.time+"分</b>"+it.why+"</div>"});html+='<div class="log-item" style="color:'+state.palette.dark+';">累计总时间：<b>'+state.totalTime+"分</b></div>";logEl.innerHTML=html}function checkRiverWin(){if(state.solved)return;if(state.banks[1].length===state.problem.people.length){state.solved=true;stopTimer();if(state.totalTime===state.problem.opt){showFeedback("good","完美！🎉 所有人都过河了，总用时 "+state.totalTime+" 分，正是最短时间！"+secretTip());celebrate()}else{showFeedback("info","大家都过河啦！用时 "+state.totalTime+" 分。最优只要 "+state.problem.opt+" 分，再想想能不能更省？点「揭示答案」看看秘诀～")}}}function secretTip(){if(state.levelKey==="river")return"秘诀：让最快的人当'小船长'来回接送。";if(state.levelKey==="bridge")return"秘诀：让最慢的两人一起过，时间只算一次。";return""}function revealAnswer(){var prob=state.problem;if(state.levelKey==="queue"){var sorted=prob.people.slice().sort(function(a,b){return a.t-b.t});var orderStr=sorted.map(function(p){return p.n+"("+p.t+"分)"}).join(" → ");var calc=sorted.map(function(p,i){return p.t+"×"+(sorted.length-i)}).join(" + ");var msg="【最优排法】让打水用时最短的人排最前面（从短到长）：\n"+orderStr+"\n总等候时间 = "+calc+" = "+prob.opt+"分。\n秘诀：先快后慢——用时短的人先接水，后面等人就少等一些！";showFeedback("info",msg.replace(/\n/g,"<br>"));autoArrangeQueue(sorted)}else{var steps=optimalRiverSteps(prob,state.levelKey);var html="【最优方案】总用时 <b>"+prob.opt+"分</b>：";steps.forEach(function(s,i){html+="<br>第"+(i+1)+"趟："+s.desc+"（"+s.time+"分）"});html+="<br>"+secretTip();showFeedback("info",html)}}function autoArrangeQueue(sortedPeople){var area=document.getElementById("queueArea");if(!area)return;var cards=Array.prototype.slice.call(area.querySelectorAll(".qcard"));var nameToCard={};cards.forEach(function(c){var idx=parseInt(c.getAttribute("data-idx"),10);nameToCard[prob_people(idx).n]=c});area.innerHTML="";sortedPeople.forEach(function(p){if(nameToCard[p.n])area.appendChild(nameToCard[p.n])});syncQueueOrder();updateQueueStats()}function prob_people(idx){return state.problem.people[idx]}function optimalRiverSteps(prob,levelKey){var ps=prob.people.slice().sort(function(a2,b2){return a2.t-b2.t});var steps=[];if(levelKey==="river"){var a=ps[0],b=ps[1],c=ps[2];steps.push({desc:a.n+"+"+b.n+" 划船过河",time:a.t});steps.push({desc:a.n+" 划船回来",time:a.t});steps.push({desc:a.n+"+"+c.n+" 划船过河",time:a.t})}else{var a=ps[0],b=ps[1],c=ps[2],d=ps[3];steps.push({desc:a.n+"+"+b.n+" 带灯笼过桥",time:b.t});steps.push({desc:a.n+" 带灯笼返回",time:a.t});steps.push({desc:c.n+"+"+d.n+" 带灯笼过桥",time:d.t});steps.push({desc:b.n+" 带灯笼返回",time:b.t});steps.push({desc:a.n+"+"+b.n+" 带灯笼过桥",time:b.t})}return steps}function showFeedback(type,html){var fb=document.getElementById("feedback");fb.innerHTML='<div class="msg '+type+'">'+html+"</div>"}function clearFeedback(){}function celebrate(){var canvas=document.getElementById("confettiCanvas");canvas.width=window.innerWidth;canvas.height=window.innerHeight;canvas.style.display="block";var ctx=canvas.getContext("2d");var colors=state.palette.confetti;var particles=[];for(var i=0;i<160;i++){particles.push({x:Math.random()*canvas.width,y:-20-Math.random()*canvas.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*5,size:6+Math.random()*9,color:colors[Math.floor(Math.random()*colors.length)],rot:Math.random()*Math.PI*2,vr:(Math.random()-.5)*.25,shape:Math.random()>.5?"rect":"circle"})}var
