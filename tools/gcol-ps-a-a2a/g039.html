pool{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:18px;min-height:70px}.banner{background:#fff;border:3px solid var(--accent);border-radius:14px;padding:12px 22px;font-size:20px;font-weight:900;cursor:grab;box-shadow:0 4px 0 rgba(0,0,0,.10);touch-action:none}.done-panel{text-align:center;padding:26px 10px}.done-note{font-size:22px;font-weight:900;margin:10px 0 14px}.done-review{font-size:17px;line-height:1.8;background:var(--panel);border:2px solid var(--accent2);border-radius:12px;padding:10px 16px;margin:0 auto 20px;max-width:640px;text-align:left}.victory{text-align:center;padding:30px 10px 10px}.victory-star{font-size:46px;letter-spacing:8px;color:#F5A623;margin-bottom:6px}.victory-star .off{color:#D8D8D8}.victory h2{font-size:30px;margin:8px 0}.victory-stats{font-size:19px;margin:10px 0 22px}.victory-btns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}.btn{font-family:inherit;font-size:17px;font-weight:bold;color:#fff;background:var(--accent);border:none;border-radius:999px;padding:10px 20px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}.btn-big{font-size:20px;padding:13px 30px}.btn-ghost{background:var(--panel);color:var(--ink);border:3px solid var(--accent)}#ctrlbar{position:fixed;left:0;right:0;bottom:0;z-index:800;background:var(--panel);border-top:3px solid var(--accent2);display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:10px 12px;box-shadow:0 -4px 14px rgba(0,0,0,.08)}.overlay{position:fixed;inset:0;background:rgba(30,20,10,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}.modal{background:#fff;border:4px solid var(--accent);border-radius:20px;max-width:660px;width:100%;max-height:86vh;overflow:auto;padding:22px 24px;font-size:17px;line-height:1.8;color:var(--ink)}.modal h2{margin:0 0 12px;font-size:24px;color:var(--accent);display:flex;align-items:center;gap:8px;flex-wrap:wrap}.modal ul, <div id="wrap">

      <div>

</footer>

<script>"use strict";var PROBLEMS=[{id:"L1A",lv:1,method:"排除干扰条件",src:"例1",story:"水果店里有30千克苹果和25千克香蕉，卖了13千克香蕉，还有多少千克香蕉？",cards:[{t:"水果店里有30千克苹果",k:"bad",h:'题目问的是"还剩多少千克香蕉"，苹果的数量和这个问题没有关系，它就是干扰条件。'},{t:"水果店里有25千克香蕉",k:"good"},{t:"卖出了13千克香蕉",k:"good"}],hidden:null,steps:[{label:"还剩多少千克香蕉",tokens:["25","−","13","=","12"],unit:"千克",tip:"用香蕉的总数减去卖出的千克数。"}],final:null,reveal:'"30千克苹果"是干扰条件：问的是香蕉，与苹果无关。\n列式：25−13=12（千克）。\n答：还有12千克香蕉。'},{id:"L1B",lv:1,method:"排除干扰条件",src:"练习1",story:"二年级一班活动室有42个皮球和35个篮球，把皮球平均分给7个小组的同学玩，每个小组可以分到几个皮球？",cards:[{t:"活动室里有42个皮球",k:"good"},{t:"皮球平均分给7个小组",k:"good"},{t:"活动室里有35个篮球",k:"bad",h:'要分的是皮球，篮球的个数与"每组分到几个皮球"无关。'}],hidden:null,steps:[{label:"每个小组分到几个皮球",tokens:["42","÷","7","=","6"],unit:"个",tip:"把42个皮球平均分成7份，用除法。"}],final:null,reveal:'"35个篮球"是干扰条件。\n列式：42÷7=6（个）。\n答：每个小组可以分到6个皮球。'},{id:"L1C",lv:1,method:"排除干扰条件",src:"练习2",story:"18个男同学和4个女同学一起做花。男同学做的红花一共30朵，男同学做的红花比黄花少9朵，你知道男同学做的红花和黄花一共多少朵吗？",cards:[{t:"男同学做了30朵红花",k:"good"},{t:"红花比黄花少9朵",k:"good"},{t:"有18个男同学",k:"bad",h:"求的是花朵总数，不需要人数。"},{t:"有4个女同学",k:"bad",h:"花都是男同学做的，女同学人数与问题无关。"}],hidden:null,steps:[{label:"黄花有多少朵",tokens:["30","+","9","=","39"],unit:"朵",tip:"红花比黄花少9朵，说明黄花比红花多9朵。"},{label:"红花和黄花一共多少朵",tokens:["39","+","30","=","69"],unit:"朵",tip:"把红花朵数和黄花朵数合起来。"}],final:null,reveal:'"18个男同学""4个女同学"都是干扰条件。\n黄花：30+9=39（朵）；一共：30+39=69（朵）。\n答：红花和黄花一共69朵。'},{id:"L2A",lv:2,method:"找到隐藏条件",src:"例2",story:"牛牛家喂了2只大公鸡，喂的老母鸡比大公鸡多6只，每个星期平均一只老母鸡下4个鸡蛋，牛牛喂的这些鸡一个星期能下多少个蛋？",cards:[{t:"大公鸡有2只",k:"good"},{t:"老母鸡比大公鸡多6只",k:"good"},{t:"一只老母鸡一星期下4个鸡蛋",k:"good"}],hidden:{q:"题目没有直接说出来：到底谁会下蛋呢？把正确的常识卡拖进雷达接收口！",choices:["只有老母鸡会下蛋","大公鸡也会下蛋","公鸡母鸡都会下蛋","小公鸡也会下蛋"],correct:"只有老母鸡会下蛋",hint:"想一想：生活里下蛋的是公鸡还是母鸡？"},steps:[{label:"老母鸡有几只",tokens:["2","+","6","=","8"],unit:"只",tip:"老母鸡比大公鸡多6只，用加法。"},{label:"这些鸡一星期下多少个蛋",tokens:["4","×","8","=","32"],unit:"个",tip:"8只老母鸡，每只每星期下4个蛋，用乘法。"}],final:null,reveal:"隐藏线索：只有老母鸡会下蛋，大公鸡不下蛋。\n老母鸡：2+6=8（只）；鸡蛋：4×8=32（个）。\n答：这些鸡一星期能下32个蛋。"},{id:"L2B",lv:2,method:"找到隐藏条件",src:"练习4",story:"田田家养了5只小狗以及一些鸭子，已知鸭子比小狗多5只，每个星期平均一只鸭子下2个鸭蛋，则这些鸭子一个星期能下多少个鸭蛋？",cards:[{t:"小狗有5只",k:"good"},{t:"鸭子比小狗多5只",k:"good"},{t:"一只鸭子一星期下2个鸭蛋",k:"good"}],hidden:null,steps:[{label:"鸭子有几只",tokens:["5","+","5","=","10"],unit:"只",tip:"鸭子比小狗多5只。"},{label:"这些鸭子一星期下多少鸭蛋",tokens:["10","×","2","=","20"],unit:"个",tip:"10只鸭子，每只每星期下2个蛋。"}],final:null,reveal:"鸭子：5+5=10（只）；鸭蛋：10×2=20（个）。\n答：这些鸭子一星期能下20个鸭蛋。"},{id:"L2C",lv:2,method:"找到隐藏条件",src:"练习5",story:"师傅每小时生产16个零件，比徒弟每小时多生产10个。徒弟一天（工作8小时）能生产多少个零件？",cards:[{t:"师傅每小时生产16个零件",k:"good"},{t:"师傅比徒弟每小时多生产10个",k:"good"},{t:"徒弟一天工作8小时",k:"good"}],hidden:null,steps:[{label:"徒弟每小时生产多少个",tokens:["16","−","10","=","6"],unit:"个",tip:"师傅比徒弟每小时多10个，徒弟用减法求。"},{label:"徒弟一天生产多少个",tokens:["6","×","8","=","48"],unit:"个",tip:"每小时6个，一天工作8小时。"}],final:null,reveal:"徒弟每小时：16−10=6（个）；一天：6×8=48（个）。\n答：徒弟一天能生产48个零件。"},{id:"L2D",lv:2,method:"找到隐藏条件",src:"练习7",story:"牛牛和丁丁每天上学都学习写大字，已知牛牛每天在学校写8个大字，比丁丁每天在学校多写2个，牛牛和丁丁一星期在学校一共写了多少个大字？",cards:[{t:"牛牛每天在学校写8个大字",k:"good"},{t:"牛牛比丁丁每天多写2个",k:"good"}],hidden:{q:'题目说"一星期在学校"，一星期在学校上课几天呢？把正确的常识卡拖进雷达接收口！',choices:["一星期在学校上5天课","一星期一共有7天","一个月有30天","一天有24小时"],correct:"一星期在学校上5天课",hint:'注意问的是"在学校"写的大字，星期六和星期天不上学哦。'},steps:[{label:"丁丁每天写几个大字",tokens:["8","−","2","=","6"],unit:"个",tip:"牛牛比丁丁每天多写2个。"},{label:"两人每天一共写几个",tokens:["8","+","6","=","14"],unit:"个",tip:"把两人每天写的合起来。"},{label:"一星期一共写几个",tokens:["14","×","5","=","70"],unit:"个",tip:"隐藏条件：一星期在学校上5天课。"}],final:null,reveal:"隐藏条件：一星期在学校上5天课。\n丁丁每天：8−2=6（个）；每天共：8+6=14（个）；一星期：14×5=70（个）。\n答：一星期在学校一共写了70个大字。"},{id:"L2E",lv:2,method:"找到隐藏条件",src:"练习8",story:"菜市场里原来青菜比萝卜多7筐，现在又运来14筐萝卜和11筐青菜。现在是青菜多还是萝卜多？多几筐？",cards:[{t:"原来青菜比萝卜多7筐",k:"good"},{t:"又运来了14筐萝卜",k:"good"},{t:"又运来了11筐青菜",k:"good"}],hidden:null,steps:[{label:"萝卜比青菜多运来几筐",tokens:["14","−","11","=","3"],unit:"筐",tip:"运来的萝卜比青菜多，差距在缩小。"},{label:"现在青菜还多几筐",tokens:["7","−","3","=","4"],unit:"筐",tip:"原来多的7筐，被追回了3筐。"}],final:{type:"pick",q:"现在哪种菜更多？把正确的结论牌拖上领奖台！",choices:["现在青菜多","现在萝卜多","现在一样多"],correct:"现在青菜多"},reveal:"萝卜多运来：14−11=3（筐）；青菜还多：7−3=4（筐）。\n答：现在青菜多，多4筐。"},{id:"L3A",lv:3,method:"综合挑战",src:"例3",story:"同学们开展剪羊毛活动，已知牛牛每小时剪4只羊的羊毛，丁丁每小时比牛牛多剪2只，假设他们两个一整天不休息，一共能剪多少只羊的羊毛？",cards:[{t:"牛牛每小时剪4只羊",k:"good"},{t:"丁丁比牛牛每小时多剪2只",k:"good"},{t:"两人剪了一整天，不休息",k:"good"}],hidden:{q:'"一整天"到底有多长呢？把正确的常识卡拖进雷达接收口！',choices:["1天=24小时","1天=12小时","1星期=7天","1小时=60分钟"],correct:"1天=24小时",hint:"从凌晨0点到深夜24点，一整天有多少小时？"},steps:[{label:"两人每小时一共剪几只",tokens:["4","+","2","+","4","=","10"],unit:"只",tip:"先算丁丁每小时剪几只，再加牛牛的。"},{label:"一整天一共剪几只",tokens:["10","×","24","=","240"],unit:"只",tip:"隐藏条件：1天=24小时。"}],final:null,reveal:"隐藏条件：1天=24小时。\n每小时共剪：4+2+4=10（只）；一整天：10×24=240（只）。\n答：一整天一共能剪240只羊的羊毛。"},{id:"L3B",lv:3,method:"综合挑战",src:"练习6",story:"牛牛的力气很大，要去粮店搬运粮食。粮店老板说：粮店里原来大米比面粉多20袋，卖掉30袋大米和16袋面粉后，现在是大米多还是面粉多？多多少袋？",cards:[{t:"原来大米比面粉多20袋",k:"good"},{t:"卖掉了30袋大米",k:"good"},{t:"卖掉了16袋面粉",k:"good"}],hidden:null,steps:[{label:"大米比面粉多卖几袋",tokens:["30","−","16","=","14"],unit:"袋",tip:"大米卖得更多，差距在缩小。"},{label:"现在大米比面粉多几袋",tokens:["20","−","14","=","6"],unit:"袋",tip:"原来多的20袋，被追回了14袋。"}],final:{type:"pick",q:"现在哪种粮食多？把正确的结论牌拖上领奖台！",choices:["现在大米多","现在面粉多","现在一样多"],correct:"现在大米多"},reveal:"大米比面粉多卖出：30−16=14（袋）；现在还多：20−14=6（袋）。\n答：现在大米多，多6袋。"},{id:"L3C",lv:3,method:"综合挑战",src:"练习9",story:"水果店有三筐西瓜一共39个，红筐比粉筐少7个西瓜，红筐比绿筐少2个西瓜，你知道三筐各有多少个西瓜吗？",cards:[{t:"三筐西瓜一共39个",k:"good"},{t:"红筐比粉筐少7个",k:"good"},{t:"红筐比绿筐少2个",k:"good"}],hidden:null,steps:[{label:"都看成和红筐同样多，共几个",tokens:["39","−","7","−","2","=","30"],unit:"个",tip:"粉筐拿出7个、绿筐拿出2个，三筐就都和红筐一样多。"},{label:"红筐有多少个",tokens:["30","÷","3","=","10"],unit:"个",tip:"三筐同样多，平均分。"},{label:"粉筐有多少个",tokens:["10","+","7","=","17"],unit:"个",tip:"粉筐=红筐+7。"},{label:"绿筐有多少个",tokens:["10","+","2","=","12"],unit:"个",tip:"绿筐=红筐+2。"}],final:null,reveal:"都看成红筐：39−7−2=30（个）；红筐：30÷3=10（个）；粉筐：10+7=17（个）；绿筐：10+2=12（个）。\n答：红筐10个，粉筐17个，绿筐12个。"},{id:"L3D",lv:3,method:"综合挑战",src:"同款变式（练习17同型）",story:"今年妈妈35岁，小牛7岁。再过8年，妈妈比小牛大多少岁？",cards:[{t:"妈妈今年35岁",k:"good"},{t:"小牛今年7岁",k:"good"},{t:"再过8年",k:"bad",h:"两人的年龄同时变大，年龄差永远不变，过几年都不影
