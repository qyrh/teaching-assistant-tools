<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>除法魔法工坊 · 趣味除法（下）</title>
<style>
/* ================= 全局 ================= */
:root{--p:#e8613c;--s:#f7b32b;--bg:#fff6ea;--ink:#4a2c1a;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;background:var(--bg);color:var(--ink);user-select:none;-webkit-user-select:none;}
#app{max-width:1020px;margin:0 auto;padding:10px 12px 40px;}
.screen.hidden{display:none;}
b{color:var(--p);}
button{font-family:inherit;}
.clear{clear:both;}

/* ================= 难度选择屏 ================= */
.sel-head{text-align:center;padding:26px 10px 10px;}
.sel-head h1{font-size:44px;margin:0 0 6px;letter-spacing:2px;}
.sel-head .sub{font-size:20px;margin:0;color:var(--ink);opacity:.85;}
.levels{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;margin:26px 0 10px;}
.level-card{flex:1 1 240px;max-width:300px;background:#fff;border:4px solid var(--p);border-radius:20px;padding:22px 16px;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.12);transition:transform .15s;}
.level-card:hover{transform:translateY(-6px);}
.level-card .lc-name{font-size:30px;font-weight:900;}
.level-card .lc-sub{font-size:20px;font-weight:700;color:var(--s);margin:4px 0 10px;}
.level-card .lc-desc{font-size:16px;line-height:1.7;opacity:.9;}
.sel-tip{text-align:center;font-size:16px;opacity:.75;}

/* ================= HUD ================= */
#hud{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;background:#fff;border:3px solid var(--p);border-radius:16px;padding:8px 14px;gap:8px;}
#hud .lvname{font-size:20px;font-weight:900;}
#hud .taskidx{font-size:16px;font-weight:700;margin-left:10px;color:var(--p);}
.hud-r{display:flex;gap:8px;flex-wrap:wrap;}
.chip{background:var(--bg);border:2px solid var(--p);border-radius:999px;padding:4px 12px;font-size:17px;font-weight:700;}
#ctrlbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0;}
.btn{font-size:17px;padding:9px 16px;border-radius:12px;border:3px solid var(--p);background:#fff;color:var(--ink);font-weight:800;cursor:pointer;}
.btn.primary{background:var(--p);color:#fff;}
.btn:hover{filter:brightness(1.06);}

/* ================= 通用元素 ================= */
.task-title{font-size:26px;font-weight:900;margin:8px 0 6px;padding-left:12px;border-left:10px solid var(--s);}
.story{font-size:20px;line-height:1.8;margin:8px 2px;}
.ophint{font-size:17px;line-height:1.7;background:#fff;border:2px dashed var(--s);border-radius:12px;padding:8px 12px;margin:8px 0;}
.tile{min-width:64px;height:64px;border-radius:14px;background:#fff;border:3px solid var(--p);display:inline-flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;cursor:grab;touch-action:none;box-shadow:0 3px 0 rgba(0,0,0,.12);margin:5px;}
.tile.op{min-width:58px;background:var(--s);border-color:#b97f06;}
.draggable{touch-action:none;}
.drag-src{opacity:.35;}
.selected{outline:4px dashed var(--s);animation:pulse 1s infinite;}
.ghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-58%) scale(1.15);opacity:.93;filter:drop-shadow(0 8px 10px rgba(0,0,0,.28));}
.slot{min-width:64px;height:64px;border:3px dashed var(--p);border-radius:14px;display:inline-flex;align-items:center;justify-content:center;background:#fffdf4;font-size:24px;font-weight:900;color:#c2a37a;margin:4px;vertical-align:middle;}
.slot.filled{border-style:solid;color:var(--ink);}
.droptarget.hover{border-color:var(--s) !important;background:#fff1cf !important;box-shadow:0 0 0 4px rgba(247,179,43,.4);}
.tray{min-height:82px;background:#fff;border:3px solid var(--s);border-radius:16px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;padding:6px;margin:12px 0;}
.locked{pointer-events:none;opacity:.88;}
.msg{min-height:34px;text-align:center;font-size:20px;font-weight:800;margin:6px;}
.msg.bad{color:#c0392b;}
.msg.good{color:#2e7d32;}
.pstat{text-align:center;font-size:19px;font-weight:700;margin:6px;}
.ansline{font-size:32px;font-weight:900;text-align:center;margin:14px 0 6px;}
.ansline .slot{vertical-align:middle;}
.eqbar{font-size:36px;font-weight:900;text-align:center;margin:12px 0;}
.eqbar .slot{vertical-align:middle;}
.shake{animation:shake .5s;}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px);}40%{transform:translateX(7px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}
@keyframes pulse{0%,100%{outline-offset:2px;}50%{outline-offset:6px;}}

/* ================= 口诀工坊 ================= */
.cjbox{font-size:44px;font-weight:900;text-align:center;margin:20px 0;background:#fff;border:3px solid var(--p);border-radius:18px;padding:16px;}
.frames{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:12px 0;}
.frame{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;background:#fff;border:3px solid var(--p);border-radius:16px;padding:10px;gap:4px;}
.frame .fop,.frame .feq{font-size:32px;font-weight:900;margin:0 6px;}
.frame.bad{border-color:#c0392b;background:#fdeceb;animation:shake .5s;}

/* ================= 分果盘 ================= */
.plates{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;min-height:120px;margin:10px 0;}
.plate{min-width:132px;min-height:106px;border:3px dashed var(--p);border-radius:16px;background:#fff;position:relative;padding:20px 6px 6px;display:flex;flex-wrap:wrap;gap:2px;align-content:flex-start;justify-content:center;}
.plate .pcnt{position:absolute;top:2px;left:6px;font-size:15px;font-weight:800;color:var(--p);}
.plate.sealed{border-style:solid;border-color:#3d8b4f;background:#e9f9ee;pointer-events:none;animation:pop .45s;}
.plate.sealed .pcnt{color:#2e7d32;}
@keyframes pop{0%{transform:scale(.7);}60%{transform:scale(1.12);}100%{transform:scale(1);}}
.basketwrap{margin:10px 0;}
.basket{min-height:104px;border:3px solid var(--s);border-radius:16px;background:#fff;padding:8px;display:flex;flex-wrap:wrap;gap:2px;justify-content:center;}
.fruit{font-size:33px;width:46px;height:46px;display:inline-flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;}

/* ================= 童谣 ================= */
.songcard{text-align:center;font-size:21px;line-height:2;background:#fff;border:3px solid var(--p);border-radius:16px;padding:12px;margin:10px 0;}
.cardpool{min-height:64px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;background:#fff;border:2px dashed var(--s);border-radius:14px;padding:10px;margin:10px 0;}
.lcard{font-size:20px;font-weight:800;padding:8px 14px;border:3px solid var(--p);background:#fff;border-radius:12px;cursor:grab;touch-action:none;}
.bins{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0;}
.bin{flex:1 1 260px;min-height:150px;border:3px dashed var(--p);border-radius:16px;background:#fff;padding:8px;}
.binhead{font-size:19px;font-weight:900;text-align:center;margin-bottom:6px;}
.binbody{min-height:76px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.bin.okbin{border-style:solid;border-color:#3d8b4f;background:#e9f9ee;}

/* ================= 天平 ================= */
.balwrap{display:flex;justify-content:center;margin:8px 0;}
#balSvg{width:min(420px,96%);height:auto;}
.beam{stroke:var(--p);stroke-width:9;stroke-linecap:round;}
.hang{stroke:var(--ink);stroke-width:4;}
.pan{fill:#fff;stroke:var(--p);stroke-width:5;}
.pantxt{font-size:17px;font-weight:900;fill:var(--ink);text-anchor:middle;}
.fulcrum{fill:var(--s);stroke:#b97f06;stroke-width:2;}
.pivot{fill:var(--ink);}
.blabel{font-size:15px;font-weight:800;fill:var(--ink);text-anchor:middle;}
.hintline{text-align:center;font-size:19px;font-weight:800;color:var(--p);min-height:30px;}

/* ================= 抵消魔术 ================= */
.crow{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px 0;}
.ocard{font-size:24px;font-weight:900;padding:12px 14px;border-radius:14px;border:3px solid var(--p);background:#fff;cursor:pointer;}
.ocard.start{background:var(--p);color:#fff;font-size:27px;}
.ocard.picked{outline:5px dashed var(--s);transform:translateY(-5px);}
.ocard.poof{animation:poof .55s forwards;}
@keyframes poof{to{transform:scale(1.5) rotate(12deg);opacity:0;}}
.exprline{text-align:center;font-size:24px;font-weight:900;margin:8px 0;min-height:34px;}

/* ================= 符号谜题 ================= */
.symboard{display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;gap:16px;margin:12px 0;}
.symside{background:#fff;border:3px solid var(--p);border-radius:16px;padding:12px;}
.symrow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;}
.snum{font-size:33px;font-weight:900;}
.sideval{text-align:center;font-size:20px;font-weight:900;margin-top:8px;color:var(--p);}
.symeq{font-size:46px;font-weight:900;align-self:center;}

/* ================= 除法寻宝 ================= */
.gems{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;min-height:70px;background:#fff;border:3px solid var(--s);border-radius:16px;padding:10px;margin:10px 0;}
.gem{color:var(--s);font-size:26px;text-shadow:0 0 2px #b97f06;}
.ggroup{border:3px solid var(--s);border-radius:12px;padding:4px 6px;margin:3px;display:flex;flex-wrap:wrap;justify-content:center;max-width:100%;animation:pop .4s;}
.shelfhead{font-size:19px;font-weight:900;margin:8px 0 4px;}
.shelf{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;background:#fff;border:2px dashed #3d8b4f;border-radius:14px;padding:8px;}
.chipf{background:#e9f9ee;border:3px solid #3d8b4f;color:#2e7d32;border-radius:12px;padding:6px 12px;font-weight:900;font-size:19px;animation:pop .4s;}

/* ================= 弹窗 / 彩纸 ================= */
#modal{position:fixed;inset:0;background:rgba(40,20,10,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;}
#modal.hidden{display:none;}
.mbox{background:#fff;border-radius:20px;max-width:640px;width:94%;max-height:86vh;overflow:auto;padding:20px 22px;border-top:12px solid var(--p);animation:rise .3s;}
@keyframes rise{from{transform:translateY(30px);opacity:0;}to{transform:none;opacity:1;}}
.mbox h3{font-size:26px;margin:0 0 10px;}
.mbox .mbody{font-size:18px;line-height:1.9;}
.mbox ul{padding-left:22px;margin:8px 0;}
.mbody h4{margin:10px 0 4px;color:var(--p);}
#mbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
.stars-big{font-size:52px;text-align:center;letter-spacing:8px;}
.done-detail{background:var(--bg);border-radius:12px;padding:10px 14px;font-size:18px;line-height:1.9;}
.reveal-box{background:#fff8e6;border:2px dashed var(--s);border-radius:12px;padding:10px 14px;font-size:19px;line-height:1.9;}
#fx{position:fixed;inset:0;pointer-events:none;z-index:1200;}

/* ================= 响应式 ================= */
@media (max-width:640px){
  .sel-head h1{font-size:32px;}
  .tile,.slot{min-width:52px;height:52px;font-size:21px;}
  .frames{grid-template-columns:1fr;}
  .eqbar{font-size:28px;}
  .ansline{font-size:26px;}
  .fruit{font-size:27px;width:38px;height:38px;}
  .plate{min-width:104px;min-height:92px;}
  .snum{font-size:26px;}
  .ocard{font-size:20px;padding:9px 10px;}
  .symeq{font-size:34px;}
  .story{font-size:18px;}
  .task-title{font-size:22px;}
}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="app">

  <!-- ============ 难度选择屏 ============ -->
  <section id="scr-select" class="screen">
    <div class="sel-head">
      <h1>🪄 除法魔法工坊</h1>
      <p class="sub">第3讲 · 趣味除法（下）：乘除法关系 · 做除法想乘法 · 抵消巧算</p>
    </div>
    <div class="levels">
      <button class="level-card" data-level="easy">
        <div class="lc-name">初级</div><div class="lc-sub">🌟 星光花园</div>
        <div class="lc-desc">补口诀 · 拼出算式一家亲<br>爱心分果盘 · 童谣小侦探</div>
      </button>
      <button class="level-card" data-level="med">
        <div class="lc-name">中级</div><div class="lc-sub">🌈 彩虹桥</div>
        <div class="lc-desc">乘除天平 · 让等式平衡<br>抵消魔术 · 轻松巧算</div>
      </button>
      <button class="level-card" data-level="hard">
        <div class="lc-name">高级</div><div class="lc-sub">🗼 智慧之塔</div>
        <div class="lc-desc">长链抵消 · 符号谜题<br>除法寻宝 · 枚举所有算式</div>
      </button>
    </div>
    <p class="sel-tip">每局颜色随机 · 拖一拖、点一点就能玩 · 适合课堂投影</p>
  </section>

  <!-- ============ 游戏屏 ============ -->
  <section id="scr-game" class="screen hidden">
    <header id="hud">
      <div class="hud-l"><span class="lvname" id="lvname"></span><span class="taskidx" id="taskidx"></span></div>
      <div class="hud-r">
        <span class="chip">⏱ <b id="time">00:00</b></span>
        <span class="chip">👣 步数 <b id="steps">0</b></span>
        <span class="chip">⭐ <b id="stars">0</b>/3</span>
      </div>
    </header>
    <div id="ctrlbar">
      <button class="btn" id="btnRules">规则说明</button>
      <button class="btn" id="btnReveal">揭示答案</button>
      <button class="btn" id="btnRestart">重新开始</button>
      <button class="btn" id="btnBack">返回难度选择</button>
    </div>
    <main id="stage"></main>
    <div id="msg" class="msg"></div>
  </section>
</div>

<!-- ============ 通用弹窗 ============ -->
<div id="modal" class="hidden">
  <div class="mbox">
    <h3 id="mtitle"></h3>
    <div class="mbody" id="mbody"></div>
    <div id="mbtns"></div>
  </div>
</div>

<script>
'use strict';
/* ==========================================================
   除法魔法工坊 · 依据《第3讲 趣味除法（下）》教参制作
   核心题型：乘除法关系 / 做除法想乘法 / 加减乘除抵消
   全部交互为拖拽构造式操作（非选择题）
   ========================================================== */

/* ---------------- 基础工具 ---------------- */
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(arguments.length>2)e.innerHTML=html;return e;}
function shuffle(a){var r=a.slice(),i,j,t;for(i=r.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=r[i];r[i]=r[j];r[j]=t;}return r;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function fmt(sec){var m=Math.floor(sec/60),s=sec%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function shake(e){e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake');}
/* 生成互不重复的候选数字（正确答案 + n 个干扰项） */
function numChoices(ans,n,cands){
  var out=[ans],i,v;
  if(cands&&cands.length){
    cands=shuffle(cands.slice());
    for(i=0;i<cands.length&&out.length<n+1;i++){v=cands[i];if(v>0&&out.indexOf(v)<0)out.push(v);}
  }
  if(out.length<n+1){
    var offs=shuffle([2,-2,3,-3,1,-1,4,-4,5,-5,6,-6,7,10]);
    for(i=0;i<offs.length&&out.length<n+1;i++){v=ans+offs[i];if(v>0&&out.indexOf(v)<0)out.push(v);}
  }
  return shuffle(out);
}

/* ---------------- 随机色板（每局随机） ---------------- */
var PALETTES=[
  {p:'#e8613c',s:'#f7b32b',bg:'#fff6ea',ink:'#4a2c1a'},
  {p:'#0f8a8a',s:'#f4a259',bg:'#eefaf6',ink:'#123c3c'},
  {p:'#7b5ea7',s:'#ffb84d',bg:'#f6f1fb',ink:'#3a2a55'},
  {p:'#3d8b4f',s:'#f2c14e',bg:'#f0faf0',ink:'#1e3a24'},
  {p:'#2f6db3',s:'#ff9f68',bg:'#eef5fd',ink:'#1b3050'},
  {p:'#d8436e',s:'#7ec8a9',bg:'#fdf0f4',ink:'#4d1f30'}
];
function applyPalette(){
  var c=pick(PALETTES),st=document.documentElement.style;
  st.setProperty('--p',c.p);st.setProperty('--s',c.s);st.setProperty('--bg',c.bg);st.setProperty('--ink',c.ink);
}

/* ---------------- 音效（本地合成，无外部依赖） ---------------- */
var AC=null;
function tone(f,d,type){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.value=f;g.gain.value=.12;
    o.connect(g);g.connect(AC.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d);
  }catch(e){}
}
function tone1(){tone(660,.15);}
function tone2(){tone(523,.12);setTimeout(function(){tone(659,.12);},120);setTimeout(function(){tone(784,.22);},240);}
function toneBad(){tone(210,.2,'square');}

/* ---------------- 通用拖拽核心（Pointer Events，支持触屏） ----------------
   拖动：按住瓦片移动到目标松手；
   点选：点一下瓦片选中（虚线高亮），再点目标放置；
   失败：瓦片留在原处，不惩罚。 */
var DD={ghost:null,cur:null,h:null,moved:false,sx:0,sy:0,selected:null};
var DRAG_HANDLERS=new Map(),TARGET_HANDLERS=new Map();
function makeDraggable(elm,h){
  elm.classList.add('draggable');DRAG_HANDLERS.set(elm,h||{});
  elm.addEventListener('pointerdown',function(e){
    var hd=DRAG_HANDLERS.get(elm);
    if(hd&&hd.canDrag&&!hd.canDrag())return;
    e.preventDefault();e.stopPropagation();
    DD.cur=elm;DD.h=hd;DD.moved=false;DD.sx=e.clientX;DD.sy=e.clientY;
    var g=elm.cloneNode(true);g.classList.add('ghost');g.classList.remove('selected');g.classList.remove('drag-src');
    document.body.appendChild(g);DD.ghost=g;DD.moveGhost(e);elm.classList.add('drag-src');
    window.addEventListener('pointermove',DD.onMove);
    window.addEventListener('pointerup',DD.onUp,{once:true});
    window.addEventListener('pointercancel',DD.onCancel,{once:true});
  });
}
DD.moveGhost=function(e){if(DD.ghost){DD.ghost.style.left=e.clientX+'px';DD.ghost.style.top=e.clientY+'px';}};
DD.onMove=function(e){
  if(!DD.cur)return;
  if(Math.abs(e.clientX-DD.sx)>8||Math.abs(e.clientY-DD.sy)>8)DD.moved=true;
  if(DD.moved){DD.moveGhost(e);DD.clearHover();var t=DD.targetAt(e);if(t)t.classList.add('hover');}
};
DD.targetAt=function(e){
  var elt=document.elementFromPoint(e.clientX,e.clientY);
  return elt&&elt.closest?elt.closest('.droptarget'):null;
};
DD.clearHover=function(){$$('.droptarget.hover').forEach(function(x){x.classList.remove('hover');});};
DD.cleanup=function(){
  DD.clearHover();
  if(DD.ghost){DD.ghost.remove();DD.ghost=null;}
  if(DD.cur)DD.cur.classList.remove('drag-src');
};
DD.onUp=function(e){
  window.removeEventListener('pointermove',DD.onMove);
  window.removeEventListener('pointercancel',DD.onCancel);
  var cur=DD.cur,h=DD.h;DD.cur=null;DD.h=null;
  if(!cur){DD.cleanup();return;}
  DD.cleanup();
  if(!DD.moved){ /* 点按：选中 / 自定义点击行为 */
    if(h&&h.onTap){h.onTap(cur);return;}
    if(DD.selected===cur){cur.classList.remove('selected');DD.selected=null;return;}
    if(DD.selected)DD.selected.classList.remove('selected');
    DD.selected=cur;cur.classList.add('selected');return;
  }
  var t=DD.targetAt(e),ok=false;
  if(t){var th=TARGET_HANDLERS.get(t);if(th&&th.onDrop)ok=(th.onDrop(cur,t,e)!==false);}
};
DD.onCancel=function(){
  window.removeEventListener('pointermove',DD.onMove);
  window.removeEventListener('pointerup',DD.onUp);
  DD.cur=null;DD.h=null;DD.cleanup();
};
function makeTarget(elm,h){
  elm.classList.add('droptarget');TARGET_HANDLERS.set(elm,h);
  elm.addEventListener('pointerup',function(e){
    if(DD.selected&&!DD.moved){
      var t=DD.selected;
      if(!t||!t.isConnected)return;
      DD.selected=null;t.classList.remove('selected');

var FX={cv:null,ctx:null,ps:[],raf:0};
function confetti(){
  var cv=$('#fx');FX.cv=cv;FX.ctx=cv.getContext('2d');
  cv.width=window.innerWidth;cv.height=window.innerHeight;FX.ps=[];
  var colors=['#e8613c','#f7b32b','#3d8b4f','#2f6db3','#d8436e','#7b5ea7','#0f8a8a'],i;
  for(i=0;i<170;i++){
    FX.ps.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.6,
      vx:(Math.random()-.5)*3,vy:2+Math.random()*3.4,r:5+Math.random()*7,
      c:pick(colors),rot:Math.random()*6.28,vr:(Math.random()-.5)*.3});
  }
  if(!FX.raf)FX.tick();
}
FX.tick=function(){
  var ctx=FX.ctx,cv=FX.cv;
  ctx.clearRect(0,0,cv.width,cv.height);
  FX.ps=FX.ps.filter(function(p){return p.y<cv.height+40;});
  if(!FX.ps.length){FX.raf=0;return;}
  FX.ps.forEach(function(p){
    p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.62);ctx.restore();
  });
  FX.raf=requestAnimationFrame(FX.tick);
};

/* ==========================================================
   模块一：口诀工坊（例4 / 练习10 / 练习14）
   操作：先拖数字补口诀，再把 12 块数字石拼进 4 个算式框架
   ========================================================== */
function renderKoujue(root,d){
  /* —— 第一步：补口诀 —— */
  root.innerHTML='<div class="task-title">🌈 口诀工坊</div>'
    +'<p class="story">魔法口诀石缺了一块！把正确的<b>数字宝石</b>拖进括号里，把口诀补充完整。</p>'
    +'<div class="cjbox">'+d.cj.charAt(0)+' '+d.cj.charAt(1)+' （<span class="slot" id="kjSlot"></span>）</div>'
    +'<div class="tray" id="tray"></div>';
  var tray=$('#tray'),slot=$('#kjSlot');
  d.tiles.forEach(function(v){tray.appendChild(mkTile(v));});
  makeTarget(slot,{onDrop:function(t){
    if(slot.dataset.lock)return;
    api.step();
    if(+t.dataset.v===d.p){
      slot.appendChild(t);slot.classList.add('filled');slot.dataset.lock='1';
      tray.classList.add('locked');tone1();
      api.msg('口诀点亮：'+d.full+'！',true);
      setTimeout(phase2,900);
    }else{
      shake(slot);toneBad();
      api.msg('这块宝石不对哦，再想想：'+d.cj+'得多少？');
    }
  }});
  /* —— 第二步：拼算式一家亲 —— */
  function phase2(){
    root.innerHTML='<div class="task-title">🌈 口诀工坊 · 算式一家亲</div>'
      +'<p class="story">口诀"<b>'+d.full+'</b>"点亮啦！用数字石拼出算式一家亲：<b>2 个乘法算式</b>和<b>2 个除法算式</b>。</p>'
      +'<div class="frames" id="frames"></div><div class="tray" id="tray"></div>'
      +'<p class="ophint">小提示：乘法算式交换两个因数的位置；除法算式用 积 ÷ 因数。拖错的数字石可以拖回托盘。</p>';
    var frames=$('#frames'),tray2=$('#tray');
    makeTarget(tray2,{onDrop:function(t){if(t.classList.contains('tile'))tray2.appendChild(t);}});
    ['×','×','÷','÷'].forEach(function(op){
      var f=el('div','frame');f.dataset.op=op;
      f.innerHTML='<span class="slot fslot"></span><span class="fop">'+op+'</span>'
        +'<span class="slot fslot"></span><span class="feq">=</span><span class="slot fslot"></span>';
      frames.appendChild(f);
      $$('.fslot',f).forEach(function(s){
        makeTarget(s,{onDrop:function(t){
          if(!t.classList.contains('tile'))return;
          api.step();
          var old=s.querySelector('.tile');if(old)tray2.appendChild(old);
          s.appendChild(t);s.classList.add('filled');
          setTimeout(check,250);
        }});
      });
    });
    var bag=[];
    [d.a,d.b,d.p].forEach(function(v){for(var k=0;k<4;k++)bag.push(v);});
    shuffle(bag).forEach(function(v){tray2.appendChild(mkTile(v));});
    function check(){
      if($$('.fslot.filled',frames).length<12)return;
      var fr=$$('.frame',frames);
      var triples=fr.map(function(f){return $$('.fslot .tile',f).map(function(t){return +t.dataset.v;});});
      var allOk=true,dupMsg='';
      fr.forEach(function(f,i){
        var n=triples[i],ok=f.dataset.op==='×'?(n[0]*n[1]===n[2]):(n[0]%n[1]===0&&n[0]/n[1]===n[2]);
        f.classList.toggle('bad',!ok);if(!ok)allOk=false;
      });
      if(triples[0].join()===triples[1].join()){allOk=false;fr[0].classList.add('bad');fr[1].classList.add('bad');dupMsg='两个乘法算式不能相同：交换因数的位置再拼一个！';}
      if(triples[2].join()===triples[3].join()){allOk=false;fr[2].classList.add('bad');fr[3].classList.add('bad');dupMsg='两个除法算式不能相同：交换除数和商的位置！';}
      if(!allOk){
        toneBad();
        api.msg(dupMsg||'有算式还不成立（红框），拖动数字石调整一下吧！');
        return;
      }
      frames.classList.add('locked');tray2.classList.add('locked');
      api.msg('算式一家亲拼好啦！',true);tone2();
      setTimeout(function(){
        api.done('口诀：'+d.full+'。乘法：'+d.a+'×'+d.b+'='+d.p+'，'+d.b+'×'+d.a+'='+d.p
          +'；除法：'+d.p+'÷'+d.a+'='+d.b+'，'+d.p+'÷'+d.b+'='+d.a+'。');
      },900);
    }
  }
}

/* ==========================================================
   模块二：爱心分果盘（练习11）
   操作：把水果逐个拖进盘子，体会"平均分用除法"
   ========================================================== */
function renderPear(root,d){
  round1();
  function lockAll(){var pl=$('#plates'),bk=$('#basket');if(pl)pl.classList.add('locked');if(bk)bk.classList.add('locked');}
  /* —— 第(1)问：每人吃 per 个，够几个人 —— */
  function round1(){
    root.innerHTML='<div class="task-title">🍐 爱心分果盘 · 第(1)问</div>'
      +'<p class="story">果篮里一共有 <b>'+d.total+'</b> 个'+d.fruit+'。问题(1)：每人吃 <b>'+d.per+'</b> 个，这些'+d.fruit+'够<b>几个人</b>吃？</p>'
      +'<p class="ophint">把'+d.fruit+'拖进盘子（点一下'+d.fruit+'，它会跳进正在装的盘子）。每盘正好装 <b>'+d.per+'</b> 个就会点亮，看看能点亮几盘！</p>'
      +'<div class="pstat" id="pstat"></div><div class="plates" id="plates"></div>'
      +'<div class="basketwrap"><div class="basket" id="basket"></div></div><div id="parea"></div>';
    var plates=$('#plates'),basket=$('#basket'),sealedN=0;
    makeTarget(basket,{onDrop:function(t){if(t.classList.contains('fruit')){basket.appendChild(t);refresh1();}}});
    function addPlate(){
      var p=el('div','plate');p.innerHTML='<div class="pcnt">0/'+d.per+'</div>';
      plates.appendChild(p);
      makeTarget(p,{onDrop:function(t){
        if(!t.classList.contains('fruit'))return;
        if(p.classList.contains('sealed')){api.msg('这一盘已经装满点亮啦，试试新盘子～');return;}
        p.appendChild(t);refresh1();
      }});
      return p;
    }
    addPlate();
    for(var i=0;i<d.total;i++){
      var f=el('span','fruit',d.emoji);
      makeDraggable(f,{onTap:function(tk){
        var p=$$('.plate',plates).filter(function(x){return !x.classList.contains('sealed');})[0];
        if(p){p.appendChild(tk);refresh1();}
      }});
      basket.appendChild(f);
    }
    function refresh1(){
      var changed=true;
      while(changed){
        changed=false;
        $$('.plate',plates).forEach(function(p){
          if(!p.classList.contains('sealed')&&$$('.fruit',p).length>=d.per){
            p.classList.add('sealed');p.querySelector('.pcnt').textContent=d.per+'个 ✓';
            sealedN++;changed=true;tone1();
          }
        });
        if($$('.plate',plates).every(function(x){return x.classList.contains('sealed');}))addPlate();
      }
      var remain=$$('.fruit',basket).length;
      $('#pstat').innerHTML='篮子里还剩 <b>'+remain+'</b> 个'+d.fruit+' · 已点亮 <b>'+sealedN+'</b> 盘';
      if(remain===0){
        $$('.plate',plates).forEach(function(p){if(!p.querySelector('.fruit'))p.remove();});
        finish1();
      }
    }
    function finish1(){
      lockAll();
      var area=$('#parea');
      area.innerHTML='<div class="ansline">'+d.total+' ÷ '+d.per+' = <span class="slot" id="pslot"></span>（人）</div><div class="tray" id="ptray"></div>';
      var s=$('#pslot'),tr=$('#ptray');
      makeTarget(tr,{onDrop:function(t){tr.appendChild(t);}});
      numChoices(d.ans1,3).forEach(function(v){tr.appendChild(mkTile(v));});
      makeTarget(s,{onDrop:function(t){
        if(s.dataset.lock)return;
        api.step();
        if(+t.dataset.v===d.ans1){
          s.appendChild(t);s.classList.add('filled');s.dataset.lock='1';tr.classList.add('locked');tone2();
          setTimeout(function(){
            showModal({title:'第(1)问完成！',
              body:'<p>'+d.total+' ÷ '+d.per+' = '+d.ans1+'（人）：每人吃 '+d.per+' 个，'+d.total+' 个'+d.fruit+'正好够 <b>'+d.ans1+'</b> 个人吃。</p>',
              buttons:[{label:'继续第(2)问',primary:true,fn:round2}]});
          },600);
        }else{shake(s);toneBad();api.msg('数一数点亮了几盘？');}
      }});
    }
    refresh1();
  }
  /* —— 第(2)问：平均分给 ppl 个人 —— */
  function round2(){
    root.innerHTML='<div class="task-title">🍐 爱心分果盘 · 第(2)问</div>'
      +'<p class="story">问题(2)：如果把 '+d.total+' 个'+d.fruit+'<b>平均分给 '+d.ppl+' 个人</b>，每人吃到几个？</p>'
      +'<p class="ophint">桌上摆好 <b>'+d.ppl+'</b> 个盘子，把'+d.fruit+'分下去——<b>每盘一样多</b>才是平均分！分完会自动检查。</p>'
      +'<div class="pstat" id="pstat2"></div><div class="plates" id="plates"></div>'
      +'<div class="basketwrap"><div class="basket" id="basket"></div></div><div id="parea"></div>';
    var plates=$('#plates'),basket=$('#basket'),announced=false,doneFlag=false;
    makeTarget(basket,{onDrop:function(t){if(t.classList.contains('fruit')){basket.appendChild(t);refresh2();}}});
    for(var i=0;i<d.ppl;i++){
      var p=el('div','plate');p.innerHTML='<div class="pcnt">0 个</div>';
      plates.appendChild(p);
      makeTarget(p,{onDrop:function(t){if(t.classList.contains('fruit')){p.appendChild(t);refresh2();}}});
    }
    for(var j=0;j<d.total;j++){
      var f=el('span','fruit',d.emoji);
      makeDraggable(f,{onTap:function(tk){
        var best=null,bc=1e9;
        $$('.plate',plates).forEach(function(pp){
          var c=$$('.fruit',pp).length;if(c<bc){bc=c;best=pp;}
        });
        if(best){best.appendChild(tk);refresh2();}
      }});
      basket.appendChild(f);
    }
    function refresh2(){
      $$('.plate',plates).forEach(function(pp){pp.querySelector('.pcnt').textContent=$$('.fruit',pp).length+' 个';});
      var remain=$$('.fruit',basket).length;
      $('#pstat2').innerHTML='篮子里还剩 <b>'+remain+'</b> 个'+d.fruit;
      if(remain>0){announced=false;return;}
      if(doneFlag)return;
      var counts=$$('.plate',plates).map(function(pp){return $$('.fruit',pp).length;});
      var even=counts.every(function(c){return c===counts[0];});
      if(even){
        doneFlag=true;lockAll();api.msg('每盘一样多，是平均分！',true);
        var area=$('#parea');
        area.innerHTML='<div class="ansline">'+d.total+' ÷ '+d.ppl+' = <span class="slot" id="pslot"></span>（个）</div><div class="tray" id="ptray"></div>';
        var s=$('#pslot'),tr=$('#ptray');
        makeTarget(tr,{onDrop:function(t){tr.appendChild(t);}});
        numChoices(d.ans2,3).forEach(function(v){tr.appendChild(mkTile(v));});
        makeTarget(s,{onDrop:function(t){
          if(s.dataset.lock)return;
          api.step();
          if(+t.dataset.v===d.ans2){
            s.appendChild(t);s.classList.add('filled');s.dataset.lock='1';tr.classList.add('locked');tone2();
            setTimeout(function(){
              api.done('平均分用除法：(1) '+d.total+'÷'+d.per+'='+d.ans1+'（人）；(2) '+d.total+'÷'+d.ppl+'='+d.ans2
                +'（个）。每盘 '+d.ans2+' 个，正好 '+d.ppl+' 盘一样多。');
            },600);
          }else{shake(s);toneBad();api.msg('看看每盘分到了几个？');}
        }});
      }else if(!announced){
        announced=true;toneBad();
        api.msg('每盘不一样多，还不是平均分——拖动'+d.fruit+'调整一下吧！');
      }
    }
    refresh2();
  }
}

/* ==========================================================
   模块三：童谣小侦探（练习12）
   操作：把歌词行卡分类进字数箱，再拼出乘加算式
   ========================================================== */
function renderSong(root,d){
  root.innerHTML='<div class="task-title">🎵 童谣小侦探</div>'
    +'<p class="story">丁丁挑战成功，兴趣更浓啦！你还记得这首歌吗？<b>去掉标点后</b>，这首歌谣一共有几个字？</p>'
    +'<div class="songcard">'+d.raw.map(function(r){return r+'<br>';}).join('')+'</div>'
    +'<p class="ophint">数一数每行几个字，把歌词卡拖进对应的<b>字数收集箱</b>（先点卡片、再点箱子也行）。全部放对，就能拼出总字数算式！</p>'
    +'<div class="cardpool" id="pool"></div>'
    +'<div class="bins">'
    +'<div class="bin" id="binA"><div class="binhead">每行 '+d.la+' 个字（<b id="ca">0</b> 行）</div><div class="binbody"></div></div>'
    +'<div class="bin" id="binB"><div class="binhead">每行 '+d.lb+' 个字（<b id="cb">0</b> 行）</div><div class="binbody"></div></div>'
    +'</div><div id="sanswer"></div>';
  var pool=$('#pool'),binA=$('#binA'),binB=$('#binB');
  var bodyA=binA.querySelector('.binbody'),bodyB=binB.querySelector('.binbody');
  makeTarget(pool,{onDrop:function(t){if(t.classList.contains('lcard')){pool.appendChild(t);counts();}}});
  makeTarget(binA,{onDrop:function(t){if(t.classList.contains('lcard')){api.step();bodyA.appendChild(t);counts();}}});
  makeTarget(binB,{onDrop:function(t){if(t.classList.contains('lcard')){api.step();bodyB.appendChild(t);counts();}}});
  shuffle(d.lines).forEach(function(L){
    var c=el('div','lcard',L.t);c.dataset.n=L.n;makeDraggable(c,{});pool.appendChild(c);
  });
  var answered=false;
  function counts(){
    var a=$$('.lcard',bodyA).length,b=$$('.lcard',bodyB).length;
    $('#ca').textContent=a;$('#cb').textContent=b;
    if(answered)return;
    if($$('.lcard',pool).length>0)return;
    /* 全部分完：校验分类是否正确 */
    var wrong=[];
    $$('.lcard',bodyA).forEach(function(c){if(+c.dataset.n!==d.la)wrong.push(c);});
    $$('.lcard',bodyB).forEach(function(c){if(+c.dataset.n!==d.lb)wrong.push(c);});
    if(wrong.length){
      toneBad();
      wrong.forEach(function(c){shake(c);});
      api.msg('「'+wrong[0].textContent+'」有 '+wrong[0].dataset.n+' 个字，放错箱子啦，挪一挪！');
      setTimeout(function(){wrong.forEach(function(c){pool.appendChild(c);});counts();},900);
      return;
    }
    answered=true;binA.classList.add('okbin');binB.classList.add('okbin');tone1();
    var area=$('#sanswer');
    area.innerHTML='<div class="ansline">'+d.la+' × '+a+' + '+d.lb+' × '+b+' = <span class="slot" id="sslot"></span></div><div class="tray" id="stray"></div>';
    var s=$('#sslot'),tr=$('#stray');
    makeTarget(tr,{onDrop:function(t){tr.appendChild(t);}});
    d.tiles.forEach(function(v){tr.appendChild(mkTile(v));});
    makeTarget(s,{onDrop:function(t){
      if(s.dataset.lock)return;
      api.step();
      if(+t.dataset.v===d.ans){
        s.appendChild(t);s.classList.add('filled');s.dataset.lock='1';tr.classList.add('locked');tone2();
        setTimeout(function(){
          api.done('前六行每行'+d.la+'个字，后两行每行'+d.lb+'个字：'+d.la+'×6+'+d.lb+'×2='+d.ans+'（个字）。');
        },700);
      }else{shake(s);toneBad();api.msg('分类对啦！再算一算 '+d.la+'×6+'+d.lb+'×2。');}
    }});
  }
}

/* ==========================================================
   模块四：乘除天平（例5 / 练习13）
   操作：拖数字石让天平平衡 —— 除数×商=被除数 的具象化
   ========================================================== */
function renderBalance(root,d){
  var eqHtml = d.f==='div' ? (d.a+' ÷ <span class="slot" id="bslot"></span> = '+d.b)
             : d.f==='div2'? ('<span class="slot" id="bslot"></span> ÷ '+d.a+' = '+d.b)
             : (d.a+' × <span class="slot" id="bslot"></span> = '+d.b);
  root.innerHTML='<div class="task-title">⚖️ 乘除天平</div>'
    +'<p class="story">天平两边一样重，等式就成立！<b>被除数 ÷ 除数 = 商</b>，也就是 <b>除数 × 商 = 被除数</b>。拖数字石进方框，让天平平衡。</p>'
    +'<div class="eqbar">'+eqHtml+'</div>'
    +'<div class="balwrap"><svg id="balSvg" viewBox="0 0 380 232" xmlns="http://www.w3.org/2000/svg">'
      +'<g id="balG" style="transform-origin:190px 70px;transition:transform .5s;">'
      +'<line x1="40" y1="70" x2="340" y2="70" class="beam"/>'
      +'<line x1="70" y1="70" x2="70" y2="108" class="hang"/><line x1="310" y1="70" x2="310" y2="108" class="hang"/>'
      +'<circle cx="70" cy="140" r="34" class="pan"/><circle cx="310" cy="140" r="34" class="pan"/>'
      +'<text x="70" y="147" class="pantxt" id="panL"></text><text x="310" y="147" class="pantxt" id="panR"></text></g>'
      +'<polygon points="190,70 156,202 224,202" class="fulcrum"/><circle cx="190" cy="70" r="8" class="pivot"/>'
      +'<text x="70" y="224" class="blabel" id="labL"></text><text x="310" y="224" class="blabel" id="labR"></text>'
    +'</svg></div>'
    +'<div class="hintline" id="bhint">拖一块数字石放进方框试试～</div>'
    +'<div class="tray" id="tray"></div>';
  var slot=$('#bslot'),tray=$('#tray');
  d.tiles.forEach(function(v){tray.appendChild(mkTile(v));});
  function setPan(side,txt){$('#pan'+side).textContent=txt;}
  function setLab(side,txt){$('#lab'+side).textContent=txt;}
  function tilt(ang){$('#balG').style.transform='rotate('+ang+'deg)';}
  function reset(){
    tilt(0);
    if(d.f==='div'){setPan('R','□×'+d.b);setLab('R','右盘：□×'+d.b);}
    if(d.f==='div2'){setPan('L','□');setLab('L','左盘：□');}
    if(d.f==='mul'){setPan('R',d.a+'×□');setLab('R','右盘：'+d.a+'×□');}
  }
  if(d.f==='div'){setPan('L',String(d.a));setLab('L','左盘：'+d.a);reset();}
  if(d.f==='div2'){setPan('R',d.a+'×'+d.b);setLab('R','右盘：'+d.a+'×'+d.b+'='+(d.a*d.b));reset();}
  if(d.f==='mul'){setPan('L',String(d.b));setLab('L','左盘：'+d.b);reset();}
  makeTarget(slot,{onDrop:function(t){
    if(slot.dataset.lock)return;
    api.step();
    var v=+t.dataset.v,L,R,ok;
    if(d.f==='div'){R=v*d.b;L=d.a;ok=(R===L);setPan('R',v+'×'+d.b);setLab('R','右盘：'+v+'×'+d.b+'='+R);}
    else if(d.f==='div2'){L=v;R=d.a*d.b;ok=(L===R);setPan('L',String(v));setLab('L','左盘：'+v);}
    else{L=d.b;R=d.a*v;ok=(R===L);setPan('R',d.a+'×'+v);setLab('R','右盘：'+d.a+'×'+v+'='+R);}
    tilt(ok?0:(R>L?10:-10));
    if(ok){
      slot.appendChild(t);slot.classList.add('filled');slot.dataset.lock='1';
      tray.classList.add('locked');tone2();
      $('#bhint').textContent='平衡啦！想乘法口诀：'+d.hint+' ✓';
      var eqDone = d.f==='div' ? (d.a+'÷'+d.ans+'='+d.b) : d.f==='div2' ? (d.ans+'÷'+d.a+'='+d.b) : (d.a+'×'+d.ans+'='+d.b);
      setTimeout(function(){
        api.done('想乘法口诀'+d.hint+'：'+eqDone+'。（被除数÷除数=商，除数×商=被除数，做除法想乘法。）');
      },1200);
    }else{
      toneBad();
      api.msg('不平衡：左盘 '+L+'，右盘 '+R+'。换一块数字石再试！');
      setTimeout(reset,1000);
    }
  }});
}

/* ==========================================================
   模块五：抵消魔术（例6 / 练习16）
   操作：点两张"数字相同、符号相反"的牌配对抵消
   ========================================================== */
function renderCancel(root,d){
  root.innerHTML='<div class="task-title">✨ 抵消魔术</div>'
    +'<p class="story">加一个数又减去<b>同一个数</b>，等于没加没减；乘一个数又除以<b>同一个数</b>，等于没乘没除。点两张牌，把它们配对抵消！</p>'
    +'<div class="crow" id="crow"></div><div class="exprline" id="eline"></div>'
    +'<p class="ophint">找<b>数字相同、符号相反</b>的一对（比如 +18 和 −18，或 ×5 和 ÷5），全部抵消后算出结果。</p>'
    +'<div id="canswer"></div>';
  var crow=$('#crow'),eline=$('#eline'),live=[],picked=null;
  function sym(o){return o==='-'?'−':o;}
  crow.appendChild(el('div','ocard start',String(d.s)));
  d.ops.forEach(function(op){
    var c=el('div','ocard',sym(op[0])+op[1]);
    c.dataset.n=op[1];c.dataset.o=op[0];c.dataset.live='1';
    live.push(c);crow.appendChild(c);
  });
  function opposite(o1,o2){
    return (o1==='+'&&o2==='-')||(o1==='-'&&o2==='+')||(o1==='×'&&o2==='÷')||(o1==='÷'&&o2==='×');
  }
  function exprStr(){
    return d.s+live.map(function(c){return ' '+sym(c.dataset.o)+c.dataset.n;}).join('');
  }
  function hasPair(){
    var i,j;
    for(i=0;i<live.length;i++)for(j=i+1;j<live.length;j++){
      if(+live[i].dataset.n===+live[j].dataset.n&&opposite(live[i].dataset.o,live[j].dataset.o))return true;
    }
    return false;
  }
  function value(){
    var v=d.s;
    live.forEach(function(c){
      var o=c.dataset.o,n=+c.dataset.n;
      if(o==='+')v+=n;else if(o==='-')v-=n;else if(o==='×')v*=n;else v/=n;
    });
    return v;
  }
  function fullDetail(){
    var orig=d.s+d.ops.map(function(o){return ' '+sym(o[0])+o[1];}).join('');
    return orig+' = '+value()+'（把数字相同、符号相反的对子抵消，剩下的从左往右算）';
  }
  crow.addEventListener('click',function(e){
    var c=e.target.closest('.ocard');
    if(!c||!c.dataset.live)return;
    if(picked===c){c.classList.remove('picked');picked=null;return;}
    if(!picked){picked=c;c.classList.add('picked');return;}
    var a=picked,b=c;a.classList.remove('picked');picked=null;
    var n1=+a.dataset.n,n2=+b.dataset.n;
    if(n1===n2&&opposite(a.dataset.o,b.dataset.o)){
      api.step();tone1();
      a.dataset.live='';b.dataset.live='';
      a.classList.add('poof');b.classList.add('poof');
      live.splice(live.indexOf(a),1);live.splice(live.indexOf(b),1);
      setTimeout(function(){a.remove();b.remove();},550);
      refresh();
    }else{
      api.step();shake(a);shake(b);toneBad();
      api.msg('这一对不能抵消：要数字相同、符号相反（例如 +6 和 −6、×5 和 ÷5）。');
    }
  });
  function refresh(){
    eline.textContent='当前算式：'+exprStr();
    if(hasPair())return;
    crow.classList.add('locked');
    var val=value();
    if(live.length===0){
      eline.textContent='全部抵消！结果 = '+val;tone2();
      setTimeout(function(){api.done(fullDetail());},1000);
    }else{
      eline.textContent='没有能抵消的对子啦！算出剩下的结果：';
      var area=$('#canswer');
      area.innerHTML='<div class="ansline">'+exprStr()+' = <span class="slot" id="cslot"></span></div><div class="tray" id="ctry"></div>';
      var cs=$('#cslot'),ct=$('#ctry');
      makeTarget(ct,{onDrop:function(t){ct.appendChild(t);}});
      numChoices(val,3).forEach(function(v){ct.appendChild(mkTile(v));});
      makeTarget(cs,{onDrop:function(t){
        if(cs.dataset.lock)return;
        api.step();
        if(+t.dataset.v===val){
          cs.appendChild(t);cs.classList.add('filled');cs.dataset.lock='1';ct.classList.add('locked');tone2();
          setTimeout(function(){api.done(fullDetail());},800);
        }else{shake(cs);toneBad();api.msg('再算一算：抵消后剩下的算式从左往右算。');}
      }});
    }
  }
  refresh();
}

/* ==========================================================
   模块六：符号谜题（练习17）
   操作：把 + − × ÷ 各用一次拖进圆圈，实时显示两边结果
   ========================================================== */
function apply2(a,o,b){return o==='+'?a+b:o==='-'?a-b:o==='×'?a*b:a/b;}
function evalSeq(nums,ops){
  var ns=nums.slice(),os=ops.slice(),i;
  for(i=0;i<os.length;){
    if(os[i]==='×'||os[i]==='÷'){ns[i]=apply2(ns[i],os[i],ns[i+1]);ns.splice(i+1,1);os.splice(i,1);}
    else i++;
  }
  var v=ns[0];
  for(i=0;i<os.length;i++)v=apply2(v,os[i],ns[i+1]);
  return v;
}
function fmtVal(v){return (isFinite(v)&&Math.abs(v-Math.round(v))<1e-9)?String(Math.round(v)):v.toFixed(1);}
function renderSymbol(root,d){
  var n=d.nums;
  root.innerHTML='<div class="task-title">🔮 符号谜题</div>'
    +'<p class="story">把 <b>+ − × ÷</b> 四张符号卡<b>各用一次</b>填进圆圈，让等式两边相等（先算乘除，后算加减）。</p>'
    +'<div class="symboard">'
    +'<div class="symside"><div class="symrow" id="rowL"></div><div class="sideval" id="valL">值：？</div></div>'
    +'<div class="symeq">=</div>'
    +'<div class="symside"><div class="symrow" id="rowR"></div><div class="sideval" id="valR">值：？</div></div>'
    +'</div><div class="tray" id="tray"></div>'
    +'<p class="ophint">拖符号卡进圆圈；点一下已放好的符号卡可以取回重换。两边数值实时显示在卡片下方。</p>';
  var tray=$('#tray');
  makeTarget(tray,{onDrop:function(t){if(t.classList.contains('tile')){tray.appendChild(t);recompute();}}});
  ['+','-','×','÷'].forEach(function(op){
    var label=op==='-'?'−':op;
    var t=el('div','tile op',label);t.dataset.v=op;
    makeDraggable(t,{onTap:function(tk){
      if(tk.parentElement&&tk.parentElement.classList.contains('opslot')){tray.appendChild(tk);recompute();}
    }});
    tray.appendChild(t);
  });
  function buildRow(rowId,nums){
    var row=$('#'+rowId);
    nums.forEach(function(num,i){
      if(i>0){
        var s=el('span','slot opslot');
        makeTarget(s,{onDrop:function(t){
          if(!t.classList.contains('tile'))return;
          api.step();
          var old=s.querySelector('.tile');if(old)tray.appendChild(old);
          s.appendChild(t);s.classList.add('filled');recompute();
        }});
        row.appendChild(s);
      }
      row.appendChild(el('span','snum',String(num)));
    });
  }
  buildRow('rowL',[n[0],n[1],n[2]]);
  buildRow('rowR',[n[3],n[4],n[5]]);
  function opsOf(row){return $$('.opslot .tile',row).map(function(t){return t.dataset.v;});}
  function recompute(){
    var L=opsOf($('#rowL')),R=opsOf($('#rowR')),lv=null,rv=null;
    if(L.length<2)$('#valL').textContent='值：？';
    else{lv=evalSeq([n[0],n[1],n[2]],L);$('#valL').textContent='值：'+fmtVal(lv);}
    if(R.length<2)$('#valR').textContent='值：？';
    else{rv=evalSeq([n[3],n[4],n[5]],R);$('#valR').textContent='值：'+fmtVal(rv);}
    if(L.length===2&&R.length===2&&lv!==null&&rv!==null){
      if(Math.abs(lv-rv)<1e-9){
        $('.symboard').classList.add('locked');tray.classList.add('locked');
        tone2();api.msg('两边都是 '+fmtVal(lv)+'，等式成立！',true);
        setTimeout(function(){api.done('参考答案：'+d.ref+'。（四种符号各用一次，先算乘除后算加减。）');},900);
      }else{
        toneBad();
        api.msg('左边 '+fmtVal(lv)+'，右边 '+fmtVal(rv)+'，还不相等——点符号卡取回重换。');
      }
    }
  }
}

/* ==========================================================
   模块七：除法寻宝（练习18）
   操作：把数字箱拖进除数框，整除的收进宝贝算式架
   ========================================================== */
function renderHunt(root,d){
  var valid=d.crates.filter(function(c){return d.n%c===0;}).sort(function(x,y){return x-y;});
  root.innerHTML='<div class="task-title">💎 除法寻宝</div>'
    +'<p class="story">符合要求的除法算式能写出多少道？把<b>数字箱</b>拖进方框：<b>'+d.n+'</b> 个宝石能正好平均分完的，就是一道宝贝算式！</p>'
    +'<div class="eqbar">'+d.n+' ÷ <span class="slot" id="hslot"></span> = <b id="hq">?</b></div>'
    +'<div class="gems" id="gems"></div><div class="tray" id="tray"></div>'
    +'<div class="shelfhead">宝贝算式架（已找到 <b id="hcnt">0</b> / '+valid.length+' 道）</div><div class="shelf" id="shelf"></div>';
  var gems=$('#gems'),tray=$('#tray'),slot=$('#hslot'),shelf=$('#shelf'),found=0;
  function loose(){
    gems.className='gems';gems.innerHTML='';
    for(var i=0;i<d.n;i++)gems.appendChild(el('span','gem','◆'));
  }
  function regroup(q,per){
    gems.className='gems';gems.innerHTML='';
    for(var g=0;g<q;g++){
      var b=el('div','ggroup');
      for(var k=0;k<per;k++)b.appendChild(el('span','gem','◆'));
      gems.appendChild(b);
    }
  }
  loose();
  shuffle(d.crates).forEach(function(v){tray.appendChild(mkTile(v));});
  makeTarget(slot,{onDrop:function(t){
    if(slot.dataset.lock)return;
    api.step();
    var v=+t.dataset.v;
    if(d.n%v===0){
      var q=d.n/v;
      slot.dataset.lock='1';
      found++;$('#hcnt').textContent=found;$('#hq').textContent=q;
      slot.appendChild(t);slot.classList.add('filled');tone1();
      api.msg(d.n+'÷'+v+'='+q+' ✓ 每份 '+v+' 个，正好分成 '+q+' 份！',true);
      regroup(q,v);
      shelf.appendChild(el('div','chipf',d.n+'÷'+v+'='+q+' ✓'));
      setTimeout(function(){
        t.remove();slot.classList.remove('filled');delete slot.dataset.lock;$('#hq').textContent='?';
        if(found===valid.length){
          tone2();
          var list=valid.map(function(x){return d.n+'÷'+x+'='+(d.n/x);}).join('、');
          setTimeout(function(){
            api.done(list+'，一共 '+valid.length+' 道。倒着想乘法：几×几='+d.n+'，按顺序枚举就不会漏。');
          },700);
        }
      },900);
    }else{
      shake(slot);toneBad();
      api.msg(d.n+' ÷ '+v+' 分不完（还余 '+d.n%v+' 个），不是宝贝算式，换一个试试！');
    }
  }});
}

  koujue:{render:renderKoujue,

      +'；两个除法算式：'+d.p+'÷'+d.a+'='+d.b+'、'+d.p+'÷'+d.b+'='+d.a+'。';}},
  pear:{render:renderPear,
    reveal:function(d){return '平均分用除法。(1) '+d.total+'÷'+d.per+'='+d.ans1+'（人）；(2) '+d.total+'÷'+d.ppl+'='+d.ans2+'（个）。';}},
  song:{render:renderSong,
    reveal:function(d){return '前六行每行'+d.la+'个字，后两行每行'+d.lb+'个字：'+d.la+'×6+'+d.lb+'×2='+d.ans+'（个字）。';}},
  balance:{render:renderBalance,
    reveal:function(d){
      var eq = d.f==='div' ? (d.a+'÷'+d.ans+'='+d.b) : d.f==='div2' ? (d.ans+'÷'+d.a+'='+d.b) : (d.a+'×'+d.ans+'='+d.b);
      return eq+'。被除数÷除数=商，除数×商=被除数。做除法想乘法口诀：'+d.hint+'。';}},
  cancel:{render:renderCancel,
    reveal:function(d){
      var orig=d.s+d.ops.map(function(o){return (o[0]==='-'?'−':o[0])+o[1];}).join('');
      return orig+'：把数字相同、符号相反的对子抵消，剩下的从左往右算，结果 = '+d.ans+'。';}},
  symbol:{render:renderSymbol,
    reveal:function(d){return '参考：'+d.ref+'。（四种符号各用一次；混合运算先算乘除后算加减。）';}},
  hunt:{render:renderHunt,
    reveal:function(d){
      var valid=d.crates.filter(function(c){return d.n%c===0;}).sort(function(x,y){return x-y;});
      return valid.map(function(x){return d.n+'÷'+x+'='+(d.n/x);}).join('、')+'，共 '+valid.length
        +' 道。倒着想乘法：几乘几等于'+d.n+'。';}}
};
