<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天平小镇·代换大冒险（第6讲 代换综合·上）</title>
<style>
/* ============ 主题变量（每局随机换色） ============ */
:root{
  --bg:#EAF4FF; --bg2:#D7E9FF; --panel:#FFFFFF; --ink:#1C2733; --muted:#5B6B7B;
  --acc:#1976D2; --acc2:#FFB300; --soft:#E3F0FC;
  --beam:#795548; --panBg:#FFF8E1; --panEdge:#795548;
  --good:#2E7D32; --bad:#C62828; --gold:#F9A825;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;
  background:linear-gradient(160deg,var(--bg),var(--bg2));
  color:var(--ink); min-height:100vh; font-size:18px;
}
body.dragging{cursor:grabbing;}
body.dragging *{cursor:grabbing!important;}

/* ============ 顶栏 HUD ============ */
#hud{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:10px 16px; background:var(--panel); box-shadow:0 3px 10px rgba(20,40,60,.14);
  position:sticky; top:0; z-index:50;
}
#hud .hud-left{display:flex;align-items:center;gap:10px;min-width:0;}
#hud .logo{font-size:34px;line-height:1;}
#hud b{font-size:20px;display:block;}
#hud #hud-sub{font-size:14px;color:var(--muted);display:block;}
.hud-btns{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto;}
.hud-right{display:flex;gap:14px;align-items:center;font-weight:700;font-size:17px;color:var(--acc);}
#hud-time{background:var(--soft);padding:6px 12px;border-radius:20px;}
#hud-steps{background:var(--soft);padding:6px 12px;border-radius:20px;}

/* ============ 通用按钮 ============ */
.btn{
  border:none; cursor:pointer; font-family:inherit; font-weight:700;
  background:var(--acc); color:#fff; font-size:17px;
  padding:10px 18px; border-radius:14px; box-shadow:0 3px 0 rgba(0,0,0,.18);
  transition:transform .08s ease, filter .15s;
}
.btn:hover{filter:brightness(1.08);}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18);}
.btn.sm{font-size:15px;padding:8px 13px;border-radius:11px;}
.btn.warn{background:var(--bad);}
.btn.plain{background:var(--soft);color:var(--acc);}
.btn.big{font-size:21px;padding:13px 30px;border-radius:16px;}
.btn.magic{background:var(--acc2);color:#4E342E;animation:pulse 1s infinite;}
.btn.ghostb{background:transparent;color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc);}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}

/* ============ 首页 ============ */
#screen{max-width:960px;margin:0 auto;padding:18px 14px 60px;}
.home{text-align:center;padding-top:26px;}
.home-logo{font-size:84px;line-height:1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18));}
.home h1{font-size:34px;margin:10px 0 6px;}
.home-sub{font-size:19px;color:var(--muted);margin:0 0 8px;}
.home-tip{font-size:16px;color:var(--muted);max-width:620px;margin:0 auto 22px;line-height:1.7;
  background:var(--panel);padding:12px 16px;border-radius:14px;border:2px dashed var(--acc);}
.diff-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:20px;}
.diff-card{
  flex:1 1 200px;max-width:270px;border:none;cursor:pointer;font-family:inherit;
  background:var(--panel);border-radius:20px;padding:22px 16px;
  box-shadow:0 6px 16px rgba(20,40,60,.14);display:flex;flex-direction:column;align-items:center;gap:8px;
  border-bottom:8px solid var(--acc);transition:transform .12s;
}
.diff-card:hover{transform:translateY(-4px);}
.diff-card .d-ic{font-size:52px;}
.diff-card b{font-size:24px;color:var(--acc);}
.diff-card .d-desc{font-size:15px;color:var(--muted);line-height:1.6;}

/* ============ 关卡卡片 ============ */
.level-card{
  background:var(--panel);border-radius:22px;padding:18px 18px 24px;
  box-shadow:0 8px 22px rgba(20,40,60,.14);position:relative;overflow:visible;
}
.lv-head{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.lv-badge{background:var(--acc);color:#fff;font-weight:800;border-radius:12px;padding:5px 12px;font-size:16px;}
.lv-head b{font-size:23px;}
.lv-task{background:var(--soft);border-radius:14px;padding:11px 14px;font-size:17.5px;line-height:1.75;margin-bottom:14px;}
.lv-stage{display:flex;flex-direction:column;align-items:center;gap:14px;min-height:120px;}
.lv-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
.lv-note{font-size:17px;color:var(--muted);text-align:center;}

/* ============ 关系小卡（小天平等式） ============ */
.relbar{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
.relcard{
  background:var(--soft);border:2px solid var(--acc);border-radius:16px;
  display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:20px;
}
.relcard .rel-eq{font-size:26px;font-weight:900;color:var(--acc);}
.relcard i{font-style:normal;font-size:16px;color:var(--muted);vertical-align:middle;}

/* ============ 天平 ============ */
/* 76vw：给左右悬挂的秤盘预留悬出空间，保证手机上不出横向滚动 */
.bal{position:relative;width:min(600px,76vw);height:250px;margin:6px auto;touch-action:none;}
.bal-base{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:200px;height:16px;background:var(--beam);border-radius:8px;}
.bal-pillar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:16px;height:110px;background:var(--beam);border-radius:8px;}
.bal-cap{position:absolute;left:50%;top:34px;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;background:var(--acc2);border:4px solid var(--beam);z-index:3;}
.bal-beam{
  position:absolute;left:5%;right:5%;top:48px;height:16px;background:var(--beam);border-radius:8px;
  transform-origin:50% 50%;transition:transform .55s cubic-bezier(.3,1.5,.5,1);z-index:2;
}
.bal-pan{position:absolute;top:6px;width:46%;display:flex;flex-direction:column;align-items:center;transform-origin:50% 0;transition:transform .55s cubic-bezier(.3,1.5,.5,1);}
.bal-pan.pl{left:-23%;}
.bal-pan.pr{right:-23%;}
.pan-pin{width:12px;height:12px;border-radius:50%;background:var(--beam);margin-bottom:-2px;}
.pan-rope{width:4px;height:20px;background:var(--beam);}
.pan-tray{
  min-height:92px;min-width:170px;max-width:240px;background:var(--panBg);
  border:4px solid var(--panEdge);border-radius:14px 14px 44px 44px;
  padding:10px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.06);
}
.pan-big{font-size:44px;line-height:1.1;text-align:center;}
.pan-big i{font-style:normal;font-size:22px;color:var(--muted);font-weight:800;}
.pan-big span{display:block;font-size:16px;color:var(--muted);}
.pan-count{font-size:17px;font-weight:800;color:var(--acc);}
.pan-drop{
  min-width:150px;min-height:56px;border:3px dashed var(--acc2);border-radius:12px;
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:6px 8px;
}
.drop-hint{font-size:16px;color:var(--muted);}

/* ============ 拖拽与投放 ============ */
.draggable{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;}
.zone{touch-action:none;}
.zone.hover{outline:4px solid var(--acc);outline-offset:2px;border-radius:14px;background:rgba(25,118,210,.10);}
.ghost{
  position:fixed;z-index:9999;pointer-events:none;opacity:.88;transform:translate(-50%,-60%) scale(1.08) rotate(-4deg);
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.25));
}
.tray-row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;width:100%;min-height:64px;}
.tray-card{
  background:var(--panel);border:3px solid var(--acc);border-radius:16px;padding:10px 16px;
  display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 10px rgba(20,40,60,.16);
}
.tray-card .tc-ic{font-size:30px;letter-spacing:2px;}
.tray-card .tc-lb{font-size:16px;font-weight:800;color:var(--acc);}
.tray-card.pack{border-color:var(--acc2);}
.tray-card.pack .tc-lb{color:#B26A00;}

/* ============ 小圆片（水果/物品） ============ */
.chip{
  display:inline-flex;align-items:center;justify-content:center;gap:2px;
  width:40px;height:40px;border-radius:50%;font-size:19px;font-weight:900;color:#fff;
  box-shadow:0 3px 6px rgba(0,0,0,.18);user-select:none;
}
.chip.wide{width:auto;min-width:40px;padding:0 10px;border-radius:20px;font-size:17px;}
.c-plum{background:#8E44AD;}
.c-apple{background:#E53935;}
.c-peach{background:#F06292;}
.chip.off{opacity:0;transform:scale(.4);transition:all .3s;}
.chip.emoji-chip{background:var(--soft);border:2px solid var(--acc);font-size:22px;width:48px;height:48px;}
.pan-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:240px;}
/* 秤盘里的计数小圆片：成排换行，避免叠成一根高塔 */
.pan-chips .chip:not(.wide){width:38px;height:38px;font-size:18px;}

/* ============ 砝码 ============ */
.wt-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:flex-end;min-height:80px;}
.wt{
  background:linear-gradient(180deg,#90A4AE,#607D8B);color:#fff;border-radius:8px 8px 12px 12px;
  display:flex;align-items:center;justify-content:center;font-weight:900;cursor:grab;touch-action:none;
  border:3px solid #455A64;box-shadow:0 4px 8px rgba(0,0,0,.22);user-select:none;
}
.wt.s{width:46px;height:40px;font-size:16px;}
.wt.m{width:62px;height:52px;font-size:17px;}
.wt.l{width:80px;height:64px;font-size:19px;}
.wt.xl{width:96px;height:76px;font-size:21px;}

/* ============ 领奖台 ============ */
.podium{display:flex;gap:16px;align-items:flex-end;justify-content:center;}
.pod-slot{
  width:130px;border:3px dashed var(--acc);border-radius:14px 14px 0 0;background:var(--soft);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
}
.pod-slot.p1{height:150px;}
.pod-slot.p2{height:116px;}
.pod-slot.p3{height:92px;}
.pod-slot .pod-rank{font-weight:900;font-size:17px;color:var(--acc);}
.pod-slot .pod-note{font-size:16px;color:var(--muted);}
.a-card{
  background:var(--panel);border:3px solid var(--acc);border-radius:14px;padding:8px 12px;
  display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 8px rgba(20,40,60,.15);
}
.a-card .ac-e{font-size:36px;line-height:1.1;}
.a-card .ac-n{font-size:16px;font-weight:800;}
.animal-row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;width:100%;min-height:78px;border:3px dashed transparent;border-radius:14px;}
.shake{animation:shake .5s;}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-9px);}40%{transform:translateX(9px);}60%{transform:translateX(-6px);}80%{transform:translateX(6px);}}

/* ============ 抵消滑块 ============ */
.cslider{width:min(560px,94vw);display:flex;flex-direction:column;gap:6px;align-items:center;}
.cs-track{position:relative;width:100%;height:26px;border-radius:14px;background:var(--soft);border:3px solid var(--acc);touch-action:none;cursor:pointer;}
.cs-fill{position:absolute;left:0;top:0;bottom:0;border-radius:11px;background:var(--acc2);width:0%;}
.cs-knob{
  position:absolute;top:50%;left:0%;transform:translate(-50%,-50%);
  width:44px;height:44px;border-radius:50%;background:var(--acc);border:4px solid #fff;
  box-shadow:0 4px 10px rgba(0,0,0,.3);cursor:grab;touch-action:none;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:20px;font-weight:900;
}
.cs-lab{font-size:17px;font-weight:800;color:var(--acc);}

/* ============ 兑换卡 / 二人卡 ============ */
.sub-card{
  background:linear-gradient(180deg,#FFF3E0,#FFE0B2);border:3px solid #F57C00;border-radius:16px;
  padding:10px 16px;font-size:18px;font-weight:800;color:#5D4037;box-shadow:0 4px 10px rgba(20,40,60,.16);
}
.pair-card{
  background:var(--soft);border:3px solid var(--acc);border-radius:16px;padding:10px 14px;
  display:flex;align-items:center;gap:8px;font-size:19px;font-weight:800;box-shadow:0 4px 8px rgba(20,40,60,.14);
}
.pair-card .pv{color:var(--acc);font-size:21px;}
.pair-card.used{opacity:.25;filter:grayscale(1);}
.pair-card.cancel-mode{border-color:var(--acc2);background:#FFF8E1;}
.merge-hint{font-size:17px;font-weight:800;color:var(--acc);text-align:center;}

/* ============ 商店 ============ */
.shop-cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
.shop-card{
  background:linear-gradient(180deg,#E8F5E9,#C8E6C9);border:3px solid #2E7D32;border-radius:18px;
  padding:12px 16px;min-width:190px;text-align:center;box-shadow:0 4px 10px rgba(20,40,60,.16);
}
.shop-card .sc-t{font-size:18px;font-weight:900;color:#1B5E20;}
.shop-card .sc-s{font-size:16px;color:#33691E;margin-top:4px;}
.stack-chip{
  background:var(--panel);border:3px solid var(--acc);border-radius:16px;padding:9px 14px;
  font-size:18px;font-weight:800;box-shadow:0 4px 8px rgba(20,40,60,.15);display:flex;align-items:center;gap:6px;
}
.stack-chip.money{border-color:var(--gold);background:#FFFDE7;}
.money-bar{
  font-size:20px;font-weight:900;color:var(--good);background:#E8F5E9;border:3px solid var(--good);
  border-radius:16px;padding:10px 20px;
}

/* ============ 完成横幅 ============ */
.done-banner{
  position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
  background:var(--panel);border:5px solid var(--acc2);border-radius:22px;
  padding:22px 30px;text-align:center;z-index:20;box-shadow:0 14px 34px rgba(0,0,0,.28);
  animation:pop .45s cubic-bezier(.3,1.6,.5,1);max-width:92%;
}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.4);opacity:0;}100%{transform:translate(-50%,-50%) scale(1);opacity:1;}}
.done-stars{font-size:42px;letter-spacing:6px;}
.done-text{font-size:20px;margin:10px 0 14px;line-height:1.6;}

/* ============ 结算页 ============ */
.final{text-align:center;padding-top:30px;}
.final .f-ic{font-size:90px;}
.final h1{font-size:36px;color:var(--acc);}
.final-stats{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:18px 0;}
.fstat{background:var(--panel);border-radius:18px;padding:16px 26px;box-shadow:0 6px 14px rgba(20,40,60,.14);}
.fstat b{display:block;font-size:34px;color:var(--acc);}
.fstat span{font-size:16px;color:var(--muted);}

/* ============ 弹窗 ============ */
#overlay{
  position:fixed;inset:0;background:rgba(15,30,45,.55);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:16px;
}
#overlay[hidden]{display:none;}
.modal{
  background:var(--panel);border-radius:20px;max-width:640px;width:100%;max-height:86vh;overflow:auto;
  padding:22px 24px;box-shadow:0 18px 44px rgba(0,0,0,.35);
}
.modal h2{margin:0 0 12px;color:var(--acc);}
.modal ul,.modal p{line-height:1.85;font-size:17px;}
.modal .mrow{display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap;}
.modal .m-tip{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:16px;color:var(--muted);}

/* ============ 特效画布 ============ */
#fx{position:fixed;inset:0;pointer-events:none;z-index:150;}

/* ============ 响应式 ============ */
@media (max-width:760px){
  body{font-size:16.5px;}
  #hud b{font-size:17px;}
  .bal{height:260px;}
  .pan-tray{min-width:130px;min-height:80px;padding:8px;}
  .pan-big{font-size:34px;}
  .home h1{font-size:27px;}
  .diff-card{flex:1 1 150px;}
  .pod-slot{width:96px;}
  .wt.xl{width:78px;height:64px;}
}
</style>
</head>
<body>

<header id="hud">
  <div class="hud-left">
    <span class="logo">⚖️</span>
    <div>
      <b>天平小镇 · 代换大冒险</b>
      <span id="hud-sub">第6讲 代换综合（上） · 等量代换</span>
    </div>
  </div>
  <div class="hud-btns">
    <button class="btn sm" id="btn-rules">规则说明</button>
    <button class="btn sm" id="btn-reveal">揭示答案</button>
    <button class="btn sm warn" id="btn-restart">重新开始</button>
    <button class="btn sm ghostb" id="btn-home">返回难度选择</button>
  </div>
  <div class="hud-right">
    <span id="hud-time">⏱ 00:00</span>
    <span id="hud-steps">🖐 0 步</span>
  </div>
</header>

<main id="screen"></main>

<div id="overlay" hidden><div class="modal" id="modal"></div></div>
<canvas id="fx"></canvas>

<script>
"use strict";
/* ==================================================================
   天平小镇 · 代换大冒险
   核心玩法：等量代换（相等的量可以互相替换）
   全部操作为真交互：拖动物上天平、拖砝码、兑换卡替换、
   滑块两边一起拿走（等式性质）、交换砝码、合成大天平。
   ================================================================== */

/* ---------- 基础工具 ---------- */
function $(s){ return document.querySelector(s); }
function mkEl(tag, cls, html){
  const d = document.createElement(tag);
  if(cls){ d.className = cls; }
  if(html != null){ d.innerHTML = html; }
  return d;
}
function shuffle(a){
  const b = a.slice();
  for(let i = b.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = b[i]; b[i] = b[j]; b[j] = t;
  }
  return b;
}
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

/* ---------- 全局状态 ---------- */
const state = {
  diff: "", diffCN: "", run: [], lvIndex: 0, steps: 0,
  locked: false, t0: 0, timerId: 0, elapsed: 0, current: null
};

/* ---------- 主题色板（每局随机） ---------- */
const THEMES = [
  { vars:{ "--bg":"#EAF4FF","--bg2":"#CFE6FB","--acc":"#1976D2","--acc2":"#FFB300","--soft":"#E3F0FC","--panel":"#FFFFFF","--ink":"#1C2733","--muted":"#5B6B7B" }, fxs:["#1976D2","#FFB300","#4FC3F7","#FFF176","#81C784"] },
  { vars:{ "--bg":"#EFF7EA","--bg2":"#D8ECCB","--acc":"#2E7D32","--acc2":"#FF7043","--soft":"#E4F2DC","--panel":"#FFFFFF","--ink":"#1B2B1C","--muted":"#5C6E5D" }, fxs:["#2E7D32","#FF7043","#AED581","#FFD54F","#4DD0E1"] },
  { vars:{ "--bg":"#FFF3E0","--bg2":"#FFE0B2","--acc":"#E65100","--acc2":"#0288D1","--soft":"#FFE8CC","--panel":"#FFFFFF","--ink":"#33261A","--muted":"#7A6A58" }, fxs:["#E65100","#0288D1","#FFB74D","#4FC3F7","#FF8A65"] },
  { vars:{ "--bg":"#F3EFFF","--bg2":"#E1D5F7","--acc":"#5E35B1","--acc2":"#FFB300","--soft":"#EBE3F9","--panel":"#FFFFFF","--ink":"#291F3D","--muted":"#6B5E85" }, fxs:["#5E35B1","#FFB300","#BA68C8","#4DD0E1","#F06292"] },
  { vars:{ "--bg":"#FDEFF4","--bg2":"#F8D7E4","--acc":"#C2185B","--acc2":"#00897B","--soft":"#FBE3EC","--panel":"#FFFFFF","--ink":"#3A2130","--muted":"#83606F" }, fxs:["#C2185B","#00897B","#F48FB1","#80DEEA","#FFD54F"] },
  { vars:{ "--bg":"#E6FAF8","--bg2":"#C6F0EA","--acc":"#00796B","--acc2":"#F57C00","--soft":"#D9F2EE","--panel":"#FFFFFF","--ink":"#17332F","--muted":"#54756F" }, fxs:["#00796B","#F57C00","#4DB6AC","#FFD54F","#F06292"] }
];
let THEME = THEMES[0];
function applyTheme(){
  THEME = pick(THEMES);
  const map = THEME.vars;
  Object.keys(map).forEach(k => document.documentElement.style.setProperty(k, map[k]));
}

/* ---------- 彩纸 / 星星特效（Canvas） ---------- */
const FX = (function(){
  const cv = document.getElementById("fx");
  const ctx = cv.getContext("2d");
  let ps = [], running = false, bigUntil = 0;
  function resize(){ cv.width = innerWidth; cv.height = innerHeight; }
  addEventListener("resize", resize); resize();
  function burst(x, y, n){
    const colors = THEME.fxs;
    for(let i = 0; i < n; i++){
      ps.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 9, vy: -Math.random() * 8 - 2,
        g: 0.22, s: Math.random() * 8 + 5,
        r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3,
        c: colors[i % colors.length],
        life: 70 + Math.random() * 45,
        shape: Math.random() < 0.32 ? "star" : "rect"
      });
    }
    loop();
  }
  function celebrate(){ bigUntil = performance.now() + 3400; loop(); }
  function drawStar(c, s){
    c.beginPath();
    for(let i = 0; i < 5; i++){
      const a1 = i * 2 * Math.PI / 5 - Math.PI / 2, a2 = a1 + Math.PI / 5;
      c.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      c.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    c.closePath(); c.fill();
  }
  function step(){
    ctx.clearRect(0, 0, cv.width, cv.height);
    const now = performance.now();
    if(now < bigUntil){
      if(Math.random() < 0.4){ burst(Math.random() * cv.width, cv.height * 0.92, 13); }
      if(Math.random() < 0.22){ burst(Math.random() * cv.width, Math.random() * cv.height * 0.4 + 40, 18); }
    }
    ps = ps.filter(p => p.life > 0 && p.y < cv.height + 40);
    for(const p of ps){
      p.x += p.vx; p.y += p.vy; p.vy += p.g; p.r += p.vr; p.life--;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.globalAlpha = clamp(p.life / 40, 0, 1);
      if(p.shape === "star"){ drawStar(ctx, p.s); }
      else { ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.62); }
      ctx.restore();
    }
    if(ps.length || now < bigUntil){ requestAnimationFrame(step); }
    else { running = false; ctx.clearRect(0, 0, cv.width, cv.height); }
  }
  function loop(){
    if(running){ return; }
    running = true; requestAnimationFrame(step);
  }
  return { burst: burst, celebrate: celebrate };
})();

/* ---------- 指针拖拽引擎（鼠标 + 触摸通用） ---------- */
const Drag = {
  zones: [], lastDragEnd: 0,
  add(el, cfg){
    el.classList.add("zone");
    this.zones.push({ el: el, accept: cfg.accept, drop: cfg.drop });
  },
  reset(){ this.zones.length = 0; },
  justDragged(){ return performance.now() - this.lastDragEnd < 350; },
  make(el, payloadFn){
    el.classList.add("draggable");
    el.addEventListener("pointerdown", (e) => { this.begin(e, el, payloadFn); });
  },
  begin(e, el, payloadFn){
    if(state.locked || (typeof e.button === "number" && e.button > 0)){ return; }
    const p = payloadFn();
    if(!p){ return; }
    e.preventDefault();
    const g = mkEl("div", "ghost");
    g.innerHTML = el.getAttribute("data-ghost") || el.innerHTML;
    document.body.appendChild(g);
    document.body.classList.add("dragging");
    const put = (ev) => { g.style.left = ev.clientX + "px"; g.style.top = ev.clientY + "px"; };
    put(e);
    const zoneAt = (x, y) => {
      for(const z of this.zones){
        if(!z.el.isConnected){ continue; } /* 跳过已从页面移除的投放区 */
        const r = z.el.getBoundingClientRect();
        if(x >= r.left - 6 && x <= r.right + 6 && y >= r.top - 6 && y <= r.bottom + 6 && z.accept(p)){ return z; }
      }
      return null;
    };
    const mv = (ev) => {
      put(ev);
      const z = zoneAt(ev.clientX, ev.clientY);
      this.zones.forEach(zz => zz.el.classList.toggle("hover", zz === z));
    };
    const finish = (ev, ok) => {
      window.removeEventListener("pointermove", mv);
      window.removeEventListener("pointerup", up);
      window.removeEventListener("pointercancel", cancelUp);
      document.body.classList.remove("dragging");
      this.zones.forEach(zz => zz.el.classList.remove("hover"));
      g.remove();
      this.lastDragEnd = performance.now();
      if(ok){
        const z = zoneAt(ev.clientX, ev.clientY);
        if(z){ z.drop(p, ev); }
      }
    };
    const up = (ev) => { finish(ev, true); };
    const cancelUp = (ev) => { finish(ev, false); };
    window.addEventListener("pointermove", mv);
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", cancelUp);
  }
};

/* ---------- 天平组件（横梁随两边重量倾斜） ---------- */
function makeBalance(){
  const root = mkEl("div", "bal");
  const beam = mkEl("div", "bal-beam");
  const panL = mkEl("div", "bal-pan pl");
  const pinL = mkEl("div", "pan-pin"), ropeL = mkEl("div", "pan-rope"), trayL = mkEl("div", "pan-tray");
  panL.append(pinL, ropeL, trayL);
  const panR = mkEl("div", "bal-pan pr");
  const pinR = mkEl("div", "pan-pin"), ropeR = mkEl("div", "pan-rope"), trayR = mkEl("div", "pan-tray");
  panR.append(pinR, ropeR, trayR);
  beam.append(panL, panR);
  const cap = mkEl("div", "bal-cap"), pillar = mkEl("div", "bal-pillar"), base = mkEl("div", "bal-base");
  root.append(cap, pillar, base, beam);
  function setTilt(diff, scale){
    const t = clamp((diff / (scale || 1)) * 16, -16, 16);
    beam.style.transform = "rotate(" + t + "deg)";
    panL.style.transform = "rotate(" + (-t) + "deg)";
    panR.style.transform = "rotate(" + (-t) + "deg)";
  }
  return { root: root, trayL: trayL, trayR: trayR, setTilt: setTilt };
}

/* ---------- 组卷：每难度随机抽3关 ---------- */
function buildRun(diff){
  let pool = [];
  if(diff === "easy"){
    const ws = shuffle(WEIGH_EASY);
    pool = [ ws[0], ws[1], pick(PODIUMS), mkWeights(pick([7,15,19,23])) ];
  } else if(diff === "mid"){
    const ws = shuffle(WEIGH_MID);
    pool = [ ws[0], ws[1], pick(CANCELS_FRUIT), pick(CANCELS_PEN), mkWeights(pick([29,37,42,46,50])) ];
  } else {
    const sw = shuffle(SWAPS);
    pool = [ pick(TRIPLES), sw[0], sw[1], pick(SHOPS) ];
  }
  return shuffle(pool).slice(0, 3);
}

/* ==================================================================
   关卡完成流程
   ================================================================== */
function levelDone(summaryHTML){
  if(state.locked){ return; }
  state.locked = true;
  Drag.reset();
  FX.burst(innerWidth / 2, innerHeight * 0.42, 70);
  const wrap = $("#stage-wrap");
  const last = state.lvIndex >= state.run.length - 1;
  const banner = mkEl("div", "done-banner");
  banner.innerHTML = '<div class="done-stars">⭐⭐⭐</div><div class="done-text">' + summaryHTML +
    '</div><button class="btn big" id="btn-next">' + (last ? "查看成绩" : "继续下一关") + "</button>";
  wrap.appendChild(banner);
  $("#btn-next").addEventListener("click", () => {
    if(last){ showFinal(); } else { startLevel(state.lvIndex + 1); }
  });
}

function showFinal(){
  if(state.timerId){ clearInterval(state.timerId); state.timerId = 0; }
  Drag.reset();
  FX.celebrate();
  const sc = $("#screen");
  sc.innerHTML = "";
  const d = mkEl("div", "final");
  d.innerHTML = '<div class="f-ic">🏆</div><h1>闯关成功！你是代换小达人！</h1>' +
    '<p style="font-size:18px;">记住口诀：相等的量可以互相替换；等式两边同时加减同样的量，天平依然平衡！</p>';
  const stats = mkEl("div", "final-stats");
  stats.innerHTML =
    '<div class="fstat"><b>' + state.diffCN + '</b><span>难度</span></div>' +
    '<div class="fstat"><b>3</b><span>过关数</span></div>' +
    '<div class="fstat"><b>' + fmtT(state.elapsed) + "</b><span>总用时</span></div>" +
    '<div class="fstat"><b>' + state.steps + "</b><span>总步数</span></div>";
  d.appendChild(stats);
  const row = mkEl("div", "lv-actions");
  const b1 = mkEl("button", "btn big", "🔁 再玩一次（关卡重新随机）");
  b1.addEventListener("click", () => startRun(state.diff));
  const b2 = mkEl("button", "btn big plain", "🏠 返回难度选择");
  b2.addEventListener("click", goHome);
  row.append(b1, b2);
  d.appendChild(row);
  sc.appendChild(d);
}

/* ==================================================================
   关卡类型一：称重链条（拖动物上右盘，天平实时倾斜）
   ================================================================== */
function buildWeigh(item, stage){
  const relbar = mkEl("div", "relbar");
  item.rels.forEach(r => relbar.appendChild(relcard(r)));
  stage.appendChild(relbar);
  stage.appendChild(mkEl("div", "lv-note", "小天平是平衡的 → 两边一样重"));
  const bal = makeBalance();
  stage.appendChild(bal.root);

  bal.trayL.appendChild(mkEl("div", "pan-big",
    item.left.e + (item.left.n > 1 ? "<i>×" + item.left.n + "</i>" : "") +
    "<span>" + item.left.n + "只" + item.left.name + "</span>"));

  const drop = mkEl("div", "pan-drop");
  const lab = mkEl("div", "pan-count", "右盘：0 只" + item.unit.name);
  bal.trayR.append(drop, lab);

  const placed = [];
  function sumPlaced(){ return placed.reduce((a, c) => a + c.v, 0); }
  function renderPan(){
    drop.innerHTML = "";
    placed.forEach((p, i) => {
      const c = mkEl("div", "chip emoji-chip", item.unit.e + (p.v > 1 ? "×" + p.v : ""));
      c.title = "点一下，放回" + p.v + "只" + item.unit.name;
      c.addEventListener("click", () => {
        if(state.locked || Drag.justDragged()){ return; }
        placed.splice(i, 1);
        after();
      });
      drop.appendChild(c);
    });
    if(!placed.length){ drop.appendChild(mkEl("div", "drop-hint", "把" + item.unit.name + "拖到这里")); }
    lab.textContent = "右盘：" + sumPlaced() + " 只" + item.unit.name;
  }
  function tilt(){
    bal.setTilt(sumPlaced() - item.answer, Math.max(item.answer, 3));
  }
  Drag.add(drop, {
    accept: (p) => !state.locked && p && p.kind === "unit",
    drop: (p) => { placed.push({ v: p.v }); addStep(); after(); }
  });

  const tray = mkEl("div", "tray-row");
  const single = mkEl("div", "tray-card");
  single.innerHTML = '<span class="tc-ic">' + item.unit.e + '</span><span class="tc-lb">1只' + item.unit.name + "</span>";
  Drag.make(single, () => ({ kind: "unit", v: 1 }));
  tray.appendChild(single);
  if(item.bundle){
    const b = mkEl("div", "tray-card pack");
    b.innerHTML = '<span class="tc-ic">' + item.unit.e.repeat(3) + '</span><span class="tc-lb">' + item.bundle + "只一组</span>";
    Drag.make(b, () => ({ kind: "unit", v: item.bundle }));
    tray.appendChild(b);
  }
  stage.appendChild(tray);

  const bar = mkEl("div", "lv-actions");
  const clr = mkEl("button", "btn sm warn", "🧹 清空右盘");
  clr.addEventListener("click", () => {
    if(state.locked){ return; }
    placed.length = 0;
    after();
  });
  bar.appendChild(clr);
  stage.appendChild(bar);

  function after(){
    renderPan();
    tilt();
    if(!state.locked && sumPlaced() === item.answer){
      levelDone("天平平衡啦！<b>1" + item.left.name + " = " + item.answer + " 只" + item.unit.name + "</b>");
    }
  }
  after();
}

/* ==================================================================
   关卡类型二：跷跷板比轻重 + 领奖台（比较天平试称 + 排序）
   ================================================================== */
function buildPodium(item, stage){
  const relbar = mkEl("div", "relbar");
  item.rels.forEach(r => relbar.appendChild(relcard(r)));
  stage.appendChild(relbar);
  stage.appendChild(mkEl("div", "lv-note", "跷跷板平衡 → 两边一样重。先用下面的比较天平称一称！"));
  const bal = makeBalance();
  stage.appendChild(bal.root);
  const cmpL = mkEl("div", "pan-drop"), cmpR = mkEl("div", "pan-drop");
  bal.trayL.appendChild(cmpL);
  bal.trayR.appendChild(cmpR);

  const row = mkEl("div", "animal-row");
  const wMap = {};
  item.animals.forEach(a => { wMap[a.key] = a.w; });
  item.animals.forEach(a => {
    const c = mkEl("div", "a-card");
    c.innerHTML = '<span class="ac-e">' + a.e + '</span><span class="ac-n">' + a.name + "</span>";
    c.dataset.key = a.key;
    Drag.make(c, () => ({ kind: "animal", key: a.key, card: c }));
    row.appendChild(c);
  });
  stage.appendChild(row);

  const podium = mkEl("div", "podium");
  const slots = [];
  const ranks = ["第1名 · 最重", "第2名", "第3名 · 最轻"];
  const notes = ["重", "中", "轻"];
  for(let i = 0; i < 3; i++){
    const s = mkEl("div", "pod-slot p" + (i + 1));
    s.innerHTML = '<span class="pod-rank">' + ranks[i] + '</span><span class="pod-note">放' + notes[i] + "的</span>";
    podium.appendChild(s);
    slots.push(s);
  }
  stage.appendChild(podium);
  const hint = mkEl("div", "lv-note", "提示：重的会沉下去，先两两比较再上台！");
  stage.appendChild(hint);

  function updCmp(){
    const ca = cmpL.querySelector(".a-card"), cb = cmpR.querySelector(".a-card");
    if(ca && cb){ bal.setTilt(wMap[cb.dataset.key] - wMap[ca.dataset.key], Math.max(wMap[ca.dataset.key], wMap[cb.dataset.key])); }
    else { bal.setTilt(0, 1); }
  }
  function place(zoneEl, p){
    const prev = zoneEl.querySelector(".a-card");
    if(prev === p.card){ return; }
    if(prev){ row.appendChild(prev); }
    zoneEl.appendChild(p.card);
  }
  [cmpL, cmpR].forEach(z => Drag.add(z, {
    accept: (p) => !state.locked && p && p.kind === "animal",
    drop: (p) => { place(z, p); addStep(); updCmp(); }
  }));
  slots.forEach(s => Drag.add(s, {
    accept: (p) => !state.locked && p && p.kind === "animal",
    drop: (p) => { place(s, p); addStep(); updCmp(); checkPodium(); }
  }));
  Drag.add(row, {
    accept: (p) => p && p.kind === "animal",
    drop: (p) => { row.appendChild(p.card); updCmp(); checkPodium(); }
  });

  function checkPodium(){
    const filled = slots.filter(s => s.querySelector(".a-card"));
    if(filled.length < 3){ return; }
    const ws = slots.map(s => wMap[s.querySelector(".a-card").dataset.key]);
    if(ws[0] > ws[1] && ws[1] > ws[2]){
      const orderNames = slots.map(s => {
        const k = s.querySelector(".a-card").dataset.key;
        const a = item.animals.find(x => x.key === k);
        return a.name;
      });
      levelDone("排名正确！<b>" + orderNames[0] + " &gt; " + orderNames[1] + " &gt; " + orderNames[2] + "</b>，最重的是" + orderNames[0] + "！");
    } else {
      podium.classList.remove("shake");
      void podium.offsetWidth;
      podium.classList.add("shake");
      hint.textContent = "再想想哦～不确定谁重，就把它们放到比较天平上称一称！";
    }
  }
  updCmp();
}

/* ==================================================================
   关卡类型三：砝码拼重（拖砝码组合出目标克数，搭配唯一）
   ================================================================== */
function buildWeights(item, stage){
  stage.appendChild(mkEl("div", "lv-note", "把右盘凑到 " + item.target + " 克，天平就平衡啦"));
  const bal = makeBalance();
  stage.appendChild(bal.root);
  bal.trayL.appendChild(mkEl("div", "pan-big", "🎁<span>重 " + item.target + " 克</span>"));
  const drop = mkEl("div", "pan-drop");
  const lab = mkEl("div", "pan-count", "右盘合计：0 克");
  bal.trayR.append(drop, lab);

  stage.appendChild(mkEl("div", "lv-note", "砝码架（每种只有一个）："));
  const shelf = mkEl("div", "wt-row");
  stage.appendChild(shelf);

  function sizeCls(v){ return v >= 32 ? "xl" : v >= 16 ? "l" : v >= 8 ? "m" : "s"; }
  const onPan = [];
  function sumPan(){ return onPan.reduce((a, c) => a + c.v, 0); }
  /* rec 记录砝码状态：onShelf=true 才能被拖上右盘；在右盘时点一下放回架子 */
  function makeBlock(v){
    const b = mkEl("div", "wt " + sizeCls(v), v + "克");
    const rec = { v: v, el: b, onShelf: true };
    Drag.make(b, () => (rec.onShelf ? { kind: "wt", rec: rec } : null));
    b.addEventListener("click", () => {
      if(state.locked || Drag.justDragged() || rec.onShelf){ return; }
      const idx = onPan.indexOf(rec);
      if(idx >= 0){
        onPan.splice(idx, 1);
        b.remove();
        shelf.appendChild(b);
        rec.onShelf = true;
        after();
      }
    });
    return rec;
  }
  shuffle([1, 2, 4, 8, 16, 32]).forEach(v => {
    const rec = makeBlock(v);
    shelf.appendChild(rec.el);
  });

  Drag.add(drop, {
    accept: (p) => !state.locked && p && p.kind === "wt" && p.rec && p.rec.onShelf,
    drop: (p) => {
      drop.appendChild(p.rec.el);
      p.rec.onShelf = false;
      onPan.push(p.rec);
      addStep();
      after();
    }
  });

  function after(){
    lab.textContent = "右盘合计：" + sumPan() + " 克";
    bal.setTilt(sumPan() - item.target, Math.max(item.target, sumPan(), 10));
    if(!state.locked && sumPan() === item.target){
      const combo = onPan.map(x => x.v).sort((a, b) => b - a).join(" + ");
      levelDone("天平平衡！<b>" + item.target + " 克 = " + combo + "</b>");
    }
  }
  after();
}

/* ==================================================================
   关卡类型四：抵消魔法（兑换卡替换 + 滑块两边同时拿走）
   ================================================================== */
function buildCancel(item, stage){
  const bal = makeBalance();
  stage.appendChild(bal.root);

  function makeChip(k){
    const m = item.meta[k];
    const c = mkEl("div", "chip " + (m.cls ? m.cls : "emoji-chip"), m.e ? m.e : m.short);
    c.dataset.k = k;
    return c;
  }
  const leftArr = [], rightArr = [];
  item.left.forEach(g => { for(let i = 0; i < g.n; i++){ leftArr.push({ k: g.k, el: makeChip(g.k) }); } });
  item.right.forEach(g => { for(let i = 0; i < g.n; i++){ rightArr.push({ k: g.k, el: makeChip(g.k) }); } });
  const labL = mkEl("div", "pan-count", ""), labR = mkEl("div", "pan-count", "");
  /* 圆片放进会换行的容器，数量多时按行排列，不遮挡下方内容 */
  const wrapL = mkEl("div", "pan-chips"), wrapR = mkEl("div", "pan-chips");
  leftArr.forEach(x => wrapL.appendChild(x.el));
  rightArr.forEach(x => wrapR.appendChild(x.el));
  bal.trayL.append(wrapL, labL);
  bal.trayR.append(wrapR, labR);
  bal.root.style.height = "285px";

  /* 兑换卡：拖到右盘可替换的物品上（如：苹果 ← 4个李子） */
  const subRow = mkEl("div", "tray-row");
  const subCard = mkEl("div", "sub-card");
  const fm = item.meta[item.sub.fromK], tm = item.meta[item.sub.toK];
  subCard.innerHTML = "兑换卡：" + item.sub.fromN + (fm.e ? "支" + fm.label : "个" + fm.label) + " ⇄ " +
    item.sub.toN + (tm.e ? "支" + tm.label : "个" + tm.label) +
    "<div style='font-size:16px;font-weight:400'>拖到右盘的" + tm.label + "上</div>";
  Drag.make(subCard, () => ({ kind: "sub" }));
  subRow.appendChild(subCard);
  stage.appendChild(subRow);
  stage.appendChild(mkEl("div", "lv-note", "换好后，拖动下面的滑块：两边一起拿走同样多的" + item.unitName + "（等式两边减去同样的量）"));

  rightArr.forEach(x => {
    if(x.k !== item.sub.toK){ return; }
    Drag.add(x.el, {
      accept: (p) => !state.locked && p && p.kind === "sub",
      drop: () => {
        const idx = rightArr.indexOf(x);
        x.el.remove();
        const fresh = [];
        for(let i = 0; i < item.sub.fromN; i++){
          fresh.push({ k: item.sub.fromK, el: makeChip(item.sub.fromK) });
        }
        rightArr.splice(idx, 1);
        fresh.forEach(f => rightArr.push(f));
        fresh.forEach(f => wrapR.appendChild(f.el));
        addStep();
        after();
      }
    });
  });

  /* 滑块：两边同时拿走 n 个基准物品 */
  const slider = mkEl("div", "cslider");
  const track = mkEl("div", "cs-track");
  const fill = mkEl("div", "cs-fill");
  const knob = mkEl("div", "cs-knob", "🍋");
  track.append(fill, knob);
  const csLab = mkEl("div", "cs-lab", "两边一起拿走：0 个");
  slider.append(track, csLab);
  stage.appendChild(slider);

  let slid = 0, lastSlid = 0;
  function maxN(){
    const a = leftArr.filter(x => x.k === item.sub.fromK).length;
    const b = rightArr.filter(x => x.k === item.sub.fromK).length;
    return Math.min(a, b);
  }
  function applyVis(){
    const m = maxN();
    const n = Math.min(slid, m);
    leftArr.forEach(x => x.el.classList.remove("off"));
    rightArr.forEach(x => x.el.classList.remove("off"));
    let cnt = 0;
    for(let i = leftArr.length - 1; i >= 0 && cnt < n; i--){
      if(leftArr[i].k === item.sub.fromK){ leftArr[i].el.classList.add("off"); cnt++; }
    }
    cnt = 0;
    for(let i = rightArr.length - 1; i >= 0 && cnt < n; i--){
      if(rightArr[i].k === item.sub.fromK){ rightArr[i].el.classList.add("off"); cnt++; }
    }
    const pct = m > 0 ? (n / m * 100) : 0;
    fill.style.width = pct + "%";
    knob.style.left = pct + "%";
    csLab.textContent = "两边一起拿走：" + n + " 个（最多 " + m + " 个）";
    const uWord = item.unitName === "李子" ? "个" : "支";
    labL.textContent = "左盘可见：" + leftArr.filter(x => !x.el.classList.contains("off")).length + uWord;
    labR.textContent = "右盘可见：" + rightArr.filter(x => !x.el.classList.contains("off")).length + uWord;
  }
  function setFromRatio(t){
    slid = Math.round(clamp(t, 0, 1) * maxN());
    applyVis();
  }
  function knobDrag(ev){
    if(state.locked){ return; }
    ev.stopPropagation();
    ev.preventDefault();
    const r = track.getBoundingClientRect();
    const mv = (e) => setFromRatio((e.clientX - r.left) / r.width);
    const up = () => {
      window.removeEventListener("pointermove", mv);
      window.removeEventListener("pointerup", up);
      if(slid !== lastSlid){ lastSlid = slid; addStep(); }
      after();
    };
    window.addEventListener("pointermove", mv);
    window.addEventListener("pointerup", up);
  }
  knob.addEventListener("pointerdown", knobDrag);
  track.addEventListener("pointerdown", (e) => {
    if(state.locked){ return; }
    const r = track.getBoundingClientRect();
    setFromRatio((e.clientX - r.left) / r.width);
    knobDrag(e);
  });

  function visCount(arr){
    return arr.filter(x => x.k === item.sub.fromK && !x.el.classList.contains("off")).length;
  }
  function after(){
    applyVis();
    const targetVisible = rightArr.filter(x => x.k === item.targetK && !x.el.classList.contains("off"));
    const baseVisible = visCount(rightArr);
    const otherVisible = rightArr.filter(x => x.k !== item.targetK && x.k !== item.sub.fromK && !x.el.classList.contains("off"));
    if(!state.locked && targetVisible.length === 1 && baseVisible === 0 && otherVisible.length === 0){
      const leftVis = visCount(leftArr);
      const tm2 = item.meta[item.targetK];
      const tName = tm2.e ? "1支" + tm2.label : "1个" + tm2.label;
      const uName = item.unitName === "李子" ? "个李子" : "支铅笔";
      bal.setTilt(0, 1);
      levelDone("抵消成功！<b>" + tName + " = " + leftVis + uName + "</b>");
    }
  }
  applyVis();
}

/* ==================================================================
   关卡类型五：交换砝码（两边各拖一个砝码过去，和相等即平衡）
   ================================================================== */
function buildSwap(item, stage){
  stage.appendChild(mkEl("div", "lv-note", "从一边拖一个砝码放到另一边，两边各换一个，让天平平衡！"));
  const bal = makeBalance();
  stage.appendChild(bal.root);
  const labL = mkEl("div", "pan-count", ""), labR = mkEl("div", "pan-count", "");
  const dropL = mkEl("div", "pan-drop"), dropR = mkEl("div", "pan-drop");
  bal.trayL.append(dropL, labL);
  bal.trayR.append(dropR, labR);

  const L = item.L.slice(), R = item.R.slice();
  function sizeCls(v){ return v >= 10 ? "l" : v >= 5 ? "m" : "s"; }
  function makeBlock(v, side){
    const b = mkEl("div", "wt " + sizeCls(v), v + "克");
    Drag.make(b, () => ({ kind: "wt", v: v, blk: b, side: side }));
    return b;
  }
  L.forEach(v => dropL.appendChild(makeBlock(v, "L")));
  R.forEach(v => dropR.appendChild(makeBlock(v, "R")));
  const sum = (arr) => arr.reduce((a, c) => a + c, 0);

  function wire(zone, own, mine, other){
    Drag.add(zone, {
      accept: (p) => !state.locked && p && p.kind === "wt" && p.side && p.side !== own,
      drop: (p) => {
        zone.appendChild(p.blk);
        p.side = own;
        mine.push(p.v);
        const i = other.indexOf(p.v);
        if(i >= 0){ other.splice(i, 1); }
        addStep();
        after();
      }
    });
  }
  wire(dropL, "L", L, R);
  wire(dropR, "R", R, L);

  function after(){
    const sl = sum(L), sr = sum(R);
    labL.textContent = "左盘：" + sl + " 克";
    labR.textContent = "右盘：" + sr + " 克";
    bal.setTilt(sr - sl, Math.max(sl, sr, 6));
    if(!state.locked && sl === sr){
      levelDone("交换成功！两边都是 <b>" + sl + " 克</b>，天平平衡！");
    }
  }
  after();
}

/* ==================================================================
   关卡类型六：合成大天平（三式相加 → 对半分 → 逐张抵消）
   ================================================================== */
function buildTriple(item, stage){
  const bal = makeBalance();
  stage.appendChild(bal.root);
  const aggL = mkEl("div", "pan-chips"), aggR = mkEl("div", "pan-big", "0元");
  bal.trayL.appendChild(aggL);
  bal.trayR.appendChild(aggR);

  const used = [false, false, false];
  const counts = [0, 0, 0];
  const revealed = [0, 0, 0];
  let aggV = 0, phase = 0, totalV = 0;

  const hint = mkEl("div", "merge-hint", "第一步：把三张两人卡都拖到大天平上（合起来）");
  stage.appendChild(hint);

  const row = mkEl("div", "tray-row");
  const pairEls = [];
  item.pairs.forEach((p, i) => {
    const c = mkEl("div", "pair-card");
    c.innerHTML = item.kids[p.x].e + item.kids[p.x].name + " + " + item.kids[p.y].e + item.kids[p.y].name +
      ' <span class="pv">= ' + p.v + "元</span>";
    Drag.make(c, () => (used[i] ? null : { kind: "pair", i: i, el: c }));
    pairEls.push(c);
    row.appendChild(c);
  });
  stage.appendChild(row);

  const bar = mkEl("div", "lv-actions");
  const halfBtn = mkEl("button", "btn big magic", "✨ 对半分（两边同时除以2）");
  halfBtn.style.display = "none";
  halfBtn.addEventListener("click", () => {
    if(state.locked || phase !== 0){ return; }
    for(let i = 0; i < 3; i++){ counts[i] = counts[i] / 2; }
    aggV = aggV / 2;
    totalV = aggV; /* 记住“三人总数”，之后每张两人卡都用它来抵消 */
    phase = 1;
    addStep();
    render();
    hint.textContent = "第三步：把两人卡一张张拖到大天平上，抵消对应的两个人和钱数！";
    pairEls.forEach(c => {
      c.classList.add("cancel-mode");
      c.classList.remove("used");
    });
    used[0] = used[1] = used[2] = false;
  });
  bar.appendChild(halfBtn);
  stage.appendChild(bar);

  const log = mkEl("div", "lv-note", "");
  stage.appendChild(log);

  Drag.add(bal.root, {
    accept: (p) => !state.locked && p && p.kind === "pair" && !used[p.i],
    drop: (p) => {
      used[p.i] = true;
      if(phase === 0){
        counts[item.pairs[p.i].x]++;
        counts[item.pairs[p.i].y]++;
        aggV += item.pairs[p.i].v;
        p.el.classList.add("used");
        addStep();
        render();
        if(used.every(u => u)){
          halfBtn.style.display = "inline-block";
          hint.textContent = "第二步：点亮了对半分按钮！两边同时除以2（等式两边除以同一个数，等式不变）";
        }
      } else {
        /* 抵消：从三人总数里减去这张两人卡，剩下那个人 = totalV - 两人之和 */
        const pr = item.pairs[p.i];
        const kidIdx = pr.x === 0 && pr.y === 1 ? 2 : (pr.x === 0 && pr.y === 2 ? 1 : 0);
        const val = totalV - pr.v;
        for(let i2 = 0; i2 < 3; i2++){ counts[i2] = 0; }
        counts[kidIdx] = 1;
        aggV = val;
        revealed[kidIdx] = val;
        p.el.classList.add("used");
        addStep();
        render();
        const found = [];
        revealed.forEach((v2, i3) => { if(v2 > 0){ found.push(item.kids[i3].e + item.kids[i3].name + " = " + v2 + "元"); } });
        log.textContent = "已发现：" + (found.length ? found.join("，") : "还没有单独剩下的人");
        if(revealed.every(v2 => v2 > 0)){
          const parts = item.kids.map((k, i4) => k.e + k.name + item.answers[i4] + "元");
          levelDone("全部解出！<b>" + parts.join("，") + "</b>");
        }
      }
    }
  });

  function render(){
    aggL.innerHTML = "";
    counts.forEach((c, i) => {
      if(c > 0){
        aggL.appendChild(mkEl("div", "chip wide emoji-chip", item.kids[i].e + "×" + c));
      }
    });
    aggR.innerHTML = aggV + "元";
    bal.setTilt(0, 1);
  }
  render();
}

/* ==================================================================
   关卡类型七：传话员商店（把商品沿等式一路换成钱）
   ================================================================== */
function buildShop(item, stage){
  const stacks = item.stacks.map(s => ({ k: s.k, n: s.n }));

  stage.appendChild(mkEl("div", "lv-note", "要买的东西（把它们拖到兑换台上换一换）："));
  const goodsRow = mkEl("div", "tray-row");
  stage.appendChild(goodsRow);

  stage.appendChild(mkEl("div", "lv-note", "兑换台（平衡的等式）："));
  const cardsRow = mkEl("div", "shop-cards");
  shuffle(item.cards).forEach(c => {
    const cd = mkEl("div", "shop-card");
    cd.innerHTML = '<div class="sc-t">⚖️ ' + c.text + '</div><div class="sc-s">把商品拖到我身上试试</div>';
    Drag.add(cd, {
      accept: (p) => !state.locked && p && p.kind === "stack" && matchRule(c, stacks[p.i]) !== null,
      drop: (p) => {
        const rule = matchRule(c, stacks[p.i]);
        if(!rule){ return; }
        const times = stacks[p.i].n / rule.fn;
        stacks[p.i] = { k: rule.tk, n: rule.tn * times };
        addStep();
        render();
        after();
      }
    });
    cardsRow.appendChild(cd);
  });
  stage.appendChild(cardsRow);

  const money = mkEl("div", "money-bar", "收银台：0 元");
  stage.appendChild(money);
  stage.appendChild(mkEl("div", "lv-note", "小提示：先想想哪个等式能用上，把商品一步步换成钱！"));

  function matchRule(card, st){
    if(!st){ return null; }
    for(const r of card.rules){
      if(r.fk === st.k && st.n % r.fn === 0){ return r; }
    }
    return null;
  }
  function render(){
    goodsRow.innerHTML = "";
    stacks.forEach((s, i) => {
      const m = item.meta[s.k];
      const chip = mkEl("div", "stack-chip" + (s.k === "yuan" ? " money" : ""));
      chip.innerHTML = (m.e ? '<span style="font-size:24px">' + m.e + "</span>" : "") + "<span>" + m.label + " × " + s.n + "</span>";
      chip.setAttribute("data-ghost", chip.innerHTML);
      Drag.make(chip, () => ({ kind: "stack", i: i }));
      goodsRow.appendChild(chip);
    });
    const total = stacks.filter(s => s.k === "yuan").reduce((a, c) => a + c.n, 0);
    money.textContent = "收银台：" + total + " 元";
  }
  function after(){
    if(!state.locked && stacks.every(s => s.k === "yuan")){
      const total = stacks.reduce((a, c) => a + c.n, 0);
      levelDone("全部换成钱啦！一共 <b>" + total + " 元</b>。传话员帮你把关系一路换到底！");
    }
  }
  render();
}
