<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>认识图形（二）· 图形欢乐工坊</title>
<style>:root{--c1:#1d6fd1;--c2:#ffb703;--c3:#e8f2ff;--c4:#ffffff;--ink:#1c2b3a;--good:#2e9e5b;--bad:#e0564f}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0;height:100%}body{font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;background:var(--c3);color:var(--ink);font-size:19px;line-height:1.55;overflow-x:hidden}button{font-family:inherit}#topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:var(--c4);border-bottom:5px solid var(--c1);position:sticky;top:0;z-index:50}#brand{font-size:24px;font-weight:bold;color:var(--c1)}#brand small{font-size:15px;color:var(--ink);font-weight:normal;margin-left:10px}#stats{font-size:19px;font-weight:bold;white-space:nowrap}#stats span{color:var(--c1)}.btn{display:inline-block;border:none;cursor:pointer;border-radius:14px;padding:12px 22px;font-size:19px;font-weight:bold;color:#fff;background:var(--c1);box-shadow:0 4px 0 rgba(0,0,0,.18);margin:4px;touch-action:manipulation}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}.btn.warn{background:var(--c2);color:#5a3b00}.btn.ghost{background:var(--c4);color:var(--c1);border:3px solid var(--c1)}.btn.mini{padding:8px 14px;font-size:17px;border-radius:10px}#app{max-width:1020px;margin:0 auto;padding:14px 14px 130px}#stageHead{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin:10px 0 4px}#stageTitle{font-size:23px;font-weight:bold}#stageDots{display:flex;gap:8px;align-items:center}.dot{width:18px;height:18px;border-radius:50%;background:#cfd8e3;border:3px solid #9fb0c2}.dot.now{background:var(--c2);border-color:#b37800;transform:scale(1.2)}.dot.done{background:var(--good);border-color:#1f7a43}#stageBox{background:var(--c4);border-radius:18px;padding:16px;box-shadow:0 6px 20px rgba(30,60,100,.12);min-height:430px}.taskBanner{font-size:21px;font-weight:bold;color:#fff;background:var(--c1);border-radius:12px;padding:10px 16px;margin-bottom:10px}.taskBanner .sub{display:block;font-size:17px;font-weight:normal;opacity:.95;margin-top:2px}#msgBar{min-height:52px;margin-top:10px;border-radius:12px;padding:10px 16px;font-size:19px;font-weight:bold;background:#eef3f8;border:3px solid #c8d6e4}#msgBar.good{background:#e5f7ec;border-color:var(--good);color:#1f7a43}#msgBar.bad{background:#fdeceb;border-color:var(--bad);color:#b03a34}#ctrlBar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:center;flex-wrap:wrap;background:rgba(255,255,255,.96);border-top:4px solid var(--c1);padding:8px 6px}#menuScreen{position:fixed;inset:0;z-index:200;background:var(--c3);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;overflow:auto}#menuScreen h1{font-size:40px;color:var(--c1);margin:8px 0 4px}#menuScreen h2{font-size:20px;font-weight:normal;margin:0 0 22px}.lvRow{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}.lvCard{width:270px;border:none;border-radius:20px;padding:22px 16px;cursor:pointer;background:var(--c4);box-shadow:0 8px 24px rgba(30,60,100,.16);font-size:20px;font-weight:bold;color:var(--ink);transition:transform .15s}.lvCard:hover{transform:translateY(-6px)}.lvCard .stars{font-size:26px}.lvCard .desc{font-size:16px;font-weight:normal;margin-top:6px;color:#4a5b6c}.lvCard .lvname{font-size:26px;color:var(--c1)}#menuTip{margin-top:24px;font-size:16px;color:#4a5b6c}.modalMask{position:fixed;inset:0;z-index:300;background:rgba(20,35,55,.55);display:flex;align-items:center;justify-content:center;padding:16px}.modal{background:var(--c4);border-radius:18px;max-width:720px;width:100%;max-height:86vh;overflow:auto;padding:22px 26px;font-size:18px}.modal h3{margin:2px 0 10px;color:var(--c1);font-size:24px}.modal ul{padding-left:22px;margin:8px 0}.modal li{margin:7px 0}.modal .closeRow{text-align:center;margin-top:14px}#winOverlay{position:fixed;inset:0;z-index:250;display:none;align-items:center;justify-content:center;background:rgba(20,35,55,.55)}#winBox{background:var(--c4);border-radius:22px;padding:30px 36px;text-align:center;max-width:560px;width:92%;box-shadow:0 10px 40px rgba(0,0,0,.3)}#winBox h1{color:var(--c1);font-size:38px;margin:6px 0}#winStars{font-size:52px;color:var(--c2);letter-spacing:8px}#winStats{font-size:20px;margin:10px 0 16px}#confettiHost{position:fixed;inset:0;z-index:240;pointer-events:none;overflow:hidden;display:none}.confetto{position:absolute;top:-6vh;display:block;animation:confFall linear forwards}@keyframes confFall{0%{transform:translate3d(0,-6vh,0) rotate(0deg)}100%{transform:translate3d(var(--dx),108vh,0) rotate(var(--rot))}}@keyframes winPop{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}#winBox{animation:winPop .55s ease}.stampWrap{display:flex;gap:18px;flex-wrap:wrap}.paperZone{flex:1.2;min-width:300px}.shelfZone{flex:1;min-width:260px}#paper{background:#fff;border:4px dashed var(--c1);border-radius:14px;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;position:relative;transition:box-shadow .2s}#paper.hot{box-shadow:0 0 0 8px rgba(255,183,3,.55);border-color:var(--c2)}#paper svg{max-width:100%}.shelf{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;padding:8px;background:#f2f6fb;border-radius:14px;min-height:120px}.blk{background:#fff;border:3px solid var(--c1);border-radius:14px;padding:8px;cursor:grab;touch-action:none;user-select:none;transition:transform .12s;width:128px;text-align:center}.blk:hover{transform:translateY(-4px)}.blk.hintRing{animation:pulse 1s infinite;border-color:var(--c2);border-width:5px}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,183,3,.7)}70%{box-shadow:0 0 0 14px rgba(255,183,3,0)}100%{box-shadow:0 0 0 0 rgba(255,183,3,0)}}.drag-ghost{position:fixed;z-index:999;pointer-events:none;opacity:.92;transform:scale(1.07) rotate(-3deg);box-shadow:0 10px 24px rgba(0,0,0,.25)}.drag-src{opacity:.35}.featTip{font-size:17px;color:#4a5b6c;margin-top:8px;text-align:center}.tray{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;background:#f2f6fb;border-radius:14px;padding:12px;min-height:130px}.figCard{background:#fff;border:3px solid var(--c1);border-radius:12px;padding:6px;cursor:grab;touch-action:none;user-select:none}.figCard .tag{display:none;font-size:15px;font-weight:bold;color:var(--c1);text-align:center}.figCard.hintTag .tag{display:block}.bins{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:14px}.bin{border:4px dashed var(--c1);border-radius:14px;background:#fff;width:150px;min-height:150px;padding:8px;text-align:center;transition:box-shadow .15s}.bin.hot{box-shadow:0 0 0 8px rgba(255,183,3,.55)}.bin h4{margin:2px 0 6px;font-size:20px;color:var(--c1)}.bin .got{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:44px}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.shake{animation:shake .35s}.canvasStage{text-align:center}canvas.gameCanvas{width:100%;max-width:760px;background:#fff;border-radius:14px;border:4px solid var(--c1);touch-action:none;display:block;margin:0 auto}.canvasBtns{margin-top:10px;text-align:center}.liveInfo{font-size:18px;color:#4a5b6c;margin-top:6px;text-align:center}@media(max-width:720px){body{font-size:17px}#brand{font-size:19px}#brand small{display:none}.taskBanner{font-size:18px}#winBox h1{font-size:30px}.bin{width:132px;min-height:132px}}
</style>
</head>
<body>

<!-- 顶部信息栏 -->
<div id="topbar">
  <div id="brand">图形欢乐工坊<small>认识图形（二）：长方形 · 正方形 · 三角形 · 圆</small></div>
  <div id="stats">用时 <span id="timeVal">00:00</span>　步数 <span id="stepVal">0</span></div>
</div>

<!-- 主舞台 -->
<div id="app">

    <div id="stageTitle">欢迎来到图形欢乐工坊</div>
    <div id="stageDots"></div>
  </div>
  <div id="stageBox">
    <div class="taskBanner" id="taskBanner">请先选择难度</div>

<!-- 底部控制按钮 -->
<div id="ctrlBar">

  <button class="btn" id="btnRestart">重新开始</button>

  <button class="btn ghost" id="btnRules">规则说明</button>
</div>

<!-- 难度选择菜单 -->
<div id="menuScreen">
  <h1>图形欢乐工坊</h1>
  <h2>认识图形（二）· 长方形、正方形、三角形和圆（对应课本 P16~17）</h2>
  <div class="lvRow">
    <button class="lvCard" data-lv="初级">
      <div class="stars">★☆☆</div>
      <div class="lvname">初级 · 小试身手</div>
      <div class="desc">印一印：拖积木画出平面图形<br>分一分：送图形宝宝回家</div>
    </button>
    <button class="lvCard" data-lv="中级">
      <div class="stars">★★☆</div>
      <div class="lvname">中级 · 稳步进阶</div>
      <div class="desc">画一画：在点子图上围图形<br>数一数：编号法数组合图形</div>
    </button>
    <button class="lvCard" data-lv="高级">
      <div class="stars">★★★</div>
      <div class="lvname">高级 · 勇攀高峰</div>
      <div class="desc">折一折：折痕变变变<br>组合挑战与大幅数图</div>
    </button>
  </div>
  <div id="menuTip">每局主题色、题目和图案都会随机变化，玩多少次都不重样！</div>
  <div style="margin-top:14px;"><button class="btn ghost" id="menuRules">规则说明</button></div>
</div>

<!-- 胜利结算弹窗 -->
<div id="winOverlay">
  <div id="winBox">
    <div id="winStars">★★★</div>
    <h1>闯关成功！</h1>
    <div id="winStats"></div>
    <button class="btn" id="btnAgain">再玩一次（全新题目）</button>
    <button class="btn ghost" id="btnBackMenu">返回难度选择</button>
  </div>
</div>

<!-- 庆祝彩纸（纯 CSS 动画） -->
<div id="confettiHost"></div>

<!-- 规则说明弹窗（内容用 JS 填充，方便复用） -->
<div class="modalMask" id="rulesMask" style="display:none;">
  <div class="modal">
    <h3>规则说明 · 图形欢乐工坊</h3>
    <div id="rulesBody"></div>
    <div class="closeRow"><button class="btn" id="rulesClose">我知道了，开始玩！</button></div>
  </div>
</div>

<script>
"use strict";
/* ==================================================================
   图形欢乐工坊 —— 认识图形（二）互动游戏
   内容来源：教材解读 docx（认识长方形、正方形、三角形和圆）
   关卡类型：
     印一印（拖积木描画平面图形）、分一分（拖拽图形分类）、
     画一画（点子图上点击顶点围图形）、数一数（点击计数+编号法）、
     折一折（拖出折痕对折纸，折出相同的图形）
   ================================================================== */

/* ---------------- 基础工具 ---------------- */
function $(id){ return document.getElementById(id); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function sample(arr,n){ return shuffle(arr).slice(0,n); }
function shade(hex,p){ // 颜色加深/提亮：p 为 -100~100
  var n=parseInt(hex.slice(1),16), r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  function ch(c){ c=Math.round(c+255*p/100); return Math.max(0,Math.min(255,c)); }
  r=ch(r); g=ch(g); b=ch(b);
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
var _uid=0; function uid(){ return "u"+(_uid++); }

/* ---------------- 随机主题色板（G8：每局随机换色） ---------------- */
var PALETTES=[
  {name:"海洋蓝", c1:"#1d6fd1", c2:"#ffb703", c3:"#e8f2ff"},
  {name:"草地绿", c1:"#2e8b57", c2:"#ff8c42", c3:"#eefaf0"},
  {name:"樱桃粉", c1:"#d6336c", c2:"#ffc94d", c3:"#fff0f5"},
  {name:"葡萄紫", c1:"#7048c8", c2:"#5fd0a6", c3:"#f3effe"},
  {name:"蜜橙黄", c1:"#d97706", c2:"#3ba7e0", c3:"#fff6e8"}
];
function applyRandomPalette(){
  var p=pick(PALETTES);
  var root=document.documentElement.style;
  root.setProperty("--c1",p.c1);
  root.setProperty("--c2",p.c2);
  root.setProperty("--c3",p.c3);
  root.setProperty("--c4","#ffffff");
  $("brand").innerHTML='图形欢乐工坊<small>主题色：'+p.name+' · 认识图形（二）</small>';
}

/* ---------------- 简单音效（WebAudio，无外部资源） ---------------- */
var audioCtx=null;
function tone(freq,dur,type){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    var o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type||"sine"; o.frequency.value=freq;
    g.gain.value=0.12; o.connect(g); g.connect(audioCtx.destination);
    var t=audioCtx.currentTime;
    g.gain.setValueAtTime(0.12,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.start(t); o.stop(t+dur);
  }catch(e){ /* 无声环境忽略 */ }
}
function chimeGood(){ tone(660,.12); setTimeout(function(){tone(880,.18);},110); }
function chimeWin(){ tone(523,.12); setTimeout(function(){tone(659,.12);},120); setTimeout(function(){tone(784,.25);},240); }
function chimeBad(){ tone(220,.2,"triangle"); }

/* ---------------- 图形知识表（来自教参“归纳”） ---------------- */
var FEAT={
  "长方形":"四条边都是直直的，上下两条边一样长，左右两条边一样长",
  "正方形":"四条直直的边都一样长，方方正正",
  "三角形":"三条直直的边，首尾顺次连在一起",
  "圆":"由一条弯弯的曲线围成，没有棱角"
};
var BLOCK_FACE={
  "长方体":"长方体的面是长方形，按紧它就能沿边画出长方形",
  "正方体":"正方体的每个面都是正方形，按紧它就能画出正方形",
  "三棱柱":"三棱柱有两个面是三角形，按紧它就能画出三角形",
  "圆柱":"圆柱上、下两个面是圆，按紧它就能画出圆",
  "球":"球的面是弯弯的曲面，没有平平的面，画不出平面图形"
};
var CAN_DRAW={"长方体":"长方形","正方体":"正方形","三棱柱":"三角形","圆柱":"圆"};
var DRAW_BLOCK={"长方形":"长方体","正方形":"正方体","三角形":"三棱柱","圆":"圆柱"};

/* ---------------- 立体积木 SVG（伪 3D，粗线条适合投影） ---------------- */
function blockSVG(kind){
  var W="0 0 132 112", s='stroke="#1c2b3a" stroke-width="4" stroke-linejoin="round"';
  var c1=getCssVar("--c1"), lt=shade(c1,32), dk=shade(c1,-24);
  var inner="";
  if(kind==="长方体"){
    inner='<polygon points="25,44 47,26 119,26 97,44" fill="'+lt+'" '+s+'/>'
         +'<polygon points="97,44 119,26 119,82 97,98" fill="'+dk+'" '+s+'/>'
         +'<rect x="25" y="44" width="72" height="54" fill="'+c1+'" '+s+'/>';
  }else if(kind==="正方体"){
    inner='<polygon points="36,36 58,18 114,18 92,36" fill="'+lt+'" '+s+'/>'
         +'<polygon points="92,36 114,18 114,74 92,90" fill="'+dk+'" '+s+'/>'
         +'<rect x="36" y="36" width="56" height="54" fill="'+c1+'" '+s+'/>';
  }else if(kind==="三棱柱"){
    inner='<polygon points="28,34 96,96 52,16 120,78 96,96 120,78" fill="none"/>'
         +'<polygon points="28,34 52,16 120,78 96,96" fill="'+dk+'" '+s+'/>'
         +'<polygon points="28,96 96,96 120,78 52,78" fill="'+lt+'" '+s+'/>'
         +'<polygon points="28,96 96,96 28,34" fill="'+c1+'" '+s+'/>';
  }else if(kind==="圆柱"){
    inner='<path d="M29,32 L29,86 A34,14 0 0 0 97,86 L97,32" fill="'+c1+'" '+s+'/>'
         +'<ellipse cx="63" cy="32" rx="34" ry="14" fill="'+lt+'" '+s+'/>';
  }else if(kind==="球"){
    var gid="gr"+uid();
    inner='<defs><radialGradient id="'+gid+'" cx="0.38" cy="0.34" r="0.85">'
         +'<stop offset="0" stop-color="'+lt+'"/><stop offset="1" stop-color="'+dk+'"/></radialGradient></defs>'
         +'<circle cx="66" cy="58" r="40" fill="url(#'+gid+')" '+s+'/>';
  }
  return '<svg viewBox="'+W+'" width="108" height="92" aria-label="'+kind+'">'+inner+'</svg>';
}
function getCssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim()||"#1d6fd1";
}

/* ---------------- 平面图形 SVG（用于目标展示 / 分类卡片） ---------------- */
function shapeSVG(kind, opt){
  opt=opt||{};
  var col=opt.color||getCssVar("--c2");
  var rot=opt.rot||0;
  var s='stroke="#1c2b3a" stroke-width="5" stroke-linejoin="round"';
  var body="";
  if(kind==="长方形"){
    var w=opt.w||120,h=opt.h||68;
    body='<rect x="'+(150-w)/2+'" y="'+(120-h)/2+'" width="'+w+'" height="'+h+'" rx="4" fill="'+col+'" '+s+'/>';
  }else if(kind==="正方形"){
    var a=opt.a||88;
    body='<rect x="'+(150-a)/2+'" y="'+(120-a)/2+'" width="'+a+'" height="'+a+'" rx="4" fill="'+col+'" '+s+'/>';
  }else if(kind==="三角形"){
    var p1=opt.pts||[[75,16],[132,106],[18,106]];
    body='<polygon points="'+p1.map(function(q){return q.join(",");}).join(" ")+'" fill="'+col+'" '+s+'/>';
  }else if(kind==="圆"){
    var r=opt.r||46;
    body='<circle cx="75" cy="60" r="'+r+'" fill="'+col+'" '+s+'/>';
  }
  var g=rot?(' transform="rotate('+rot+' 75 60)"'):"";
  return '<svg viewBox="0 0 150 120" width="106" height="85"><g'+g+'>'+body+'</g></svg>';
}

/* ---------------- 全局状态 ---------------- */
var G={
  level:"", stages:[], idx:0,
  steps:0, mistakes:0, hints:0,
  t0:0, timerId:null, playing:false,
  current:null  // 当前关卡对象 {title, build, reveal}
};

/* ---------------- 计时与步数（G7） ---------------- */
function fmtTime(sec){
  var m=Math.floor(sec/60), s=sec%60;
  return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}
function startTimer(){
  G.t0=Date.now(); G.playing=true;
  stopTicker();
  G.timerId=setInterval(function(){
    $("timeVal").textContent=fmtTime(Math.floor((Date.now()-G.t0)/1000));
  },1000);
  $("timeVal").textContent="00:00";
}
function stopTicker(){ if(G.timerId){ clearInterval(G.timerId); G.timerId=null; } }
function addStep(){ G.steps++; $("stepVal").textContent=G.steps; }

/* ---------------- 消息条 ---------------- */
function setMsg(text,kind){
  var bar=$("msgBar");
  bar.textContent=text;
  bar.className=kind==="good"?"good":(kind==="bad"?"bad":"");
}

/* ---------------- 通用指针拖拽（兼容鼠标与触摸，G11） ---------------- */
function attachDrag(elm, dropHandler){
  var ghost=null, ox=0, oy=0, active=false;
  function moveGhost(x,y){
    ghost.style.left=(x-ox)+"px"; ghost.style.top=(y-oy)+"px";
  }
  function cleanup(){
    if(ghost&&ghost.parentNode){ ghost.parentNode.removeChild(ghost); }
    ghost=null; active=false;
    elm.classList.remove("drag-src");
  }
  elm.addEventListener("pointerdown",function(ev){
    if(elm.dataset.locked==="1"){ return; }
    ev.preventDefault();
    var r=elm.getBoundingClientRect();
    ghost=elm.cloneNode(true);
    ghost.className=elm.className+" drag-ghost";
    ghost.style.width=r.width+"px"; ghost.style.height=r.height+"px";
    ghost.dataset.locked="1";
    document.body.appendChild(ghost);
    ox=ev.clientX-r.left; oy=ev.clientY-r.top;
    moveGhost(ev.clientX,ev.clientY);
    elm.classList.add("drag-src");
    active=true;
    try{ elm.setPointerCapture(ev.pointerId); }catch(e){}
  });
  elm.addEventListener("pointermove",function(ev){
    if(active&&ghost){ moveGhost(ev.clientX,ev.clientY); }
  });
  elm.addEventListener("pointerup",function(ev){
    if(!active){ return; }
    cleanup();
    dropHandler(ev.clientX,ev.clientY,elm);
  });
  elm.addEventListener("pointercancel",function(){ cleanup(); });
}

/* ---------------- 画布工具：固定逻辑分辨率 + 事件坐标换算 ---------------- */
function setupCanvas(cv, lw, lh){
  var Q=1.6;
  cv.width=Math.round(lw*Q); cv.height=Math.round(lh*Q);
  cv.style.maxWidth=Math.min(760, lw)+"px";
  var ctx=cv.getContext("2d");
  ctx.setTransform(Q,0,0,Q,0,0);
  cv._lw=lw; cv._lh=lh;
  return ctx;
}
function canvasPos(cv,ev){
  var r=cv.getBoundingClientRect();
  return {
    x:(ev.clientX-r.left)*cv._lw/r.width,
    y:(ev.clientY-r.top)*cv._lh/r.height
  };
}

/* ==================================================================
   关卡一：印一印 —— 拖动能画出目标图形的积木到白纸上
   来源：教参“举一反三1”与“易错探究3”（球不能画圆）
   ================================================================== */
function stampStage(target){
  var stage={ title:"印一印 · 画出"+target, done:false };
  var blockKinds=["长方体","正方体","三棱柱","圆柱"];
  if(target==="圆"){ blockKinds.push("球"); } // 经典易错干扰项：球没有平面
  var correct=DRAW_BLOCK[target];
  var body=$("stageBody");
  stage.reveal=function(){
    G.hints++;
    var card=body.querySelector('[data-blk="'+correct+'"]');
    if(card){ card.classList.add("hintRing"); }
    setMsg("提示："+BLOCK_FACE[correct]+"。把"+correct+"拖到白纸上吧！","good");
  };
  stage.build=function(){
    $("taskBanner").innerHTML="第 "+(G.idx+1)+" 关 · 印一印：哪块积木能画出"
      +'<span style="color:#ffe08a"> '+target+" </span>呢？把它拖到白纸上！"
      +'<span class="sub">'+target+"的特征："+FEAT[target]+"。</span>";
    body.innerHTML="";
    var wrap=document.createElement("div");
    wrap.className="stampWrap";
    wrap.innerHTML=
      '<div class="paperZone"><div id="paper"></div><div class="featTip">用积木画平面图形时，一定要按紧积木，让纸不动，沿着积木平平的面的边缘描。</div></div>'
      +'<div class="shelfZone"><div style="text-align:center;font-weight:bold;margin-bottom:6px;">积木货架（拖到左边的白纸上）</div><div class="shelf" id="shelf"></div></div>';
    body.appendChild(wrap);

    var paper=$("paper");
    // 白纸上先画出目标图形（虚线轮廓，等待被“印”出来）
    paper.innerHTML='<div style="font-size:18px;color:#4a5b6c;">要画出的图形：'+target+'</div>'
      +shapeSVG(target,{color:shade(getCssVar("--c1"),55)})
      +'<div style="font-size:17px;color:#4a5b6c;">把合适的积木拖到这里</div>';

    var shelf=wrap.querySelector("#shelf");
    shuffle(blockKinds).forEach(function(k){
      var card=document.createElement("div");
      card.className="blk";
      card.dataset.blk=k;
      card.innerHTML=blockSVG(k);
      shelf.appendChild(card);
      attachDrag(card,function(x,y,el){
        addStep();
        var pr=paper.getBoundingClientRect();
        var inside=(x>=pr.left&&x<=pr.right&&y>=pr.top&&y<=pr.bottom);
        if(!inside){ setMsg("要把积木拖到左边的白纸上哦，再试一次！",""); return; }
        if(k===correct){
          // 正确：描边动画 —— 目标图形自己“画”出来
          var draw=CAN_DRAW[k];
          setMsg("太棒了！"+BLOCK_FACE[k]+"，看，"+draw+"被描出来啦！","good");
          chimeGood();
          card.dataset.locked="1";
          var svg=paper.querySelector("svg");
          var outline=svg.querySelector("rect,polygon,circle");
          if(outline){
            var len=600;
            try{
              outline.style.strokeDasharray=len;
              outline.style.strokeDashoffset=len;
              outline.style.transition="stroke-dashoffset 1.1s ease, fill-opacity .6s .9s";
              outline.style.fillOpacity=0;
              setTimeout(function(){ outline.style.strokeDashoffset=0; },30);
              setTimeout(function(){ outline.style.fillOpacity=1; },950);
            }catch(e){}
          }
          paper.classList.add("hot");
          stage.done=true;
          setTimeout(nextStage,1600);
        }else{
          G.mistakes++;
          chimeBad();
          paper.classList.remove("hot");
          paper.classList.add("shake");
          setTimeout(function(){ paper.classList.remove("shake"); },380);
          var why=BLOCK_FACE[k];
          var extra=(k==="球")?"球没有平平的面，所以画不出"+target+"。":why+"，画不出"+target+"。";
          setMsg("再想想："+extra,"bad");
        }
      });
    });
    setMsg("观察每块积木上平平的面是什么形状，再把能画出"+target+"的那块拖到白纸上。","");
  };
  return stage;
}

/* ==================================================================
   关卡二：分一分 —— 把图形卡片拖进对应的“图形屋”
   ================================================================== */
function sortStage(){
  var stage={ title:"分一分 · 送图形宝宝回家", done:false };
  var types=["长方形","正方形","三角形","圆"];
  var chosen=types.slice().concat([pick(types),pick(types)]); // 4 类各一 + 随机 2 张
  var cards=shuffle(chosen);
  var placed=0, total=cards.length;
  var body=$("stageBody");

  // 为每种类型生成一张略有变化的卡片（含斜放正方形等易错变式）
  function makeVariant(t){
    var col=pick([getCssVar("--c2"), shade(getCssVar("--c2"),-18), shade(getCssVar("--c1"),42)]);
    if(t==="长方形"){
      return shapeSVG(t,{w:110+Math.floor(Math.random()*40), h:52+Math.floor(Math.random()*30), rot:pick([0,0,10,-12]), color:col});
    }
    if(t==="正方形"){
      return shapeSVG(t,{a:84, rot:pick([0,0,45]), color:col}); // 45° 斜放仍是正方形
    }
    if(t==="三角形"){
      var pts=pick([ [[75,14],[134,106],[16,106]], [[30,20],[122,70],[30,106]], [[20,60],[128,24],[100,108]] ]);
      return shapeSVG(t,{pts:pts, color:col});
    }
    return shapeSVG(t,{r:38+Math.floor(Math.random()*16), color:col});
  }
  stage.reveal=function(){
    G.hints++;
    var cs=body.querySelectorAll(".figCard");
    for(var i=0;i<cs.length;i++){ cs[i].classList.add("hintTag"); }
    setMsg("提示：卡片下方已经亮出图形的名字啦。想一想它们的样子，再拖进对应的图形屋！","good");
  };
  stage.build=function(){
    $("taskBanner").innerHTML="第 "+(G.idx+1)+" 关 · 分一分：把图形宝宝送回自己的家"
      +'<span class="sub">先看图形的边和角：数数有几条边？边一样长吗？有没有角？</span>';
    body.innerHTML="";
    var tray=document.createElement("div");
    tray.className="tray";
    var binsWrap=document.createElement("div");
    binsWrap.className="bins";
    body.appendChild(tray); body.appendChild(binsWrap);
    var binEls={};
    types.forEach(function(t){
      var bin=document.createElement("div");
      bin.className="bin";
      bin.innerHTML='<h4>'+t+'之家</h4>'+shapeSVG(t,{a:44,w:64,h:36,r:24,color:shade(getCssVar("--c1"),62)})+'<div class="got"></div>';
      binsWrap.appendChild(bin);
      binEls[t]=bin;
    });
    cards.forEach(function(t){
      var card=document.createElement("div");
      card.className="figCard";
      card.dataset.type=t;
      card.innerHTML=makeVariant(t)+'<div class="tag">'+t+'</div>';
      tray.appendChild(card);
      attachDrag(card,function(x,y,el){
        addStep();
        var hit=null;
        types.forEach(function(t2){
          var r=binEls[t2].getBoundingClientRect();
          if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom){ hit=t2; }
        });
        if(!hit){ setMsg("要把图形拖进下面的图形屋里哦！",""); return; }
        if(hit===t){
          chimeGood();
          el.dataset.locked="1";
          el.style.display="none";
          var mini=document.createElement("span");
          mini.style.fontSize="26px";
          mini.textContent="◆";
          binEls[t].querySelector(".got").appendChild(mini);
          placed++;
          setMsg("答对啦！"+FEAT[t]+"——它是"+t+"。还剩 "+(total-placed)+" 张卡片。","good");
          if(placed>=total){
            stage.done=true;
            setMsg("全部送对啦！记住：看边、看角、比长短，就能认出图形。","good");
            setTimeout(nextStage,1400);
          }
        }else{
          G.mistakes++;
          chimeBad();
          binEls[hit].classList.add("shake");
          setTimeout(function(){ binEls[hit].classList.remove("shake"); },380);
          setMsg("再看看这张卡片："+FEAT[t]+"。它应该回"+t+"之家。","bad");
        }
      });
    });
    setMsg("斜着放的图形也是一样的图形哦！关键是看边的条数和长短。","");
  };
  return stage;
}

/* ==================================================================
   关卡三：画一画 —— 在点子图上点击顶点，围出要求的图形
   来源：教参“举一反三3”（点子图上画长方形/正方形/三角形）
   ================================================================== */
var DOT_COLS=10, DOT_ROWS=7;
function drawStage(subtasks, stageLabel){
  var stage={ title:"画一画", done:false };
  var sub=0, pts=[], doneShapes=[], usedDots={};
  var cv,ctx;
  var body=$("stageBody");
  var MX=64,MY=56,GX=(840-2*MX)/(DOT_COLS-1),GY=(560-2*MY)/(DOT_ROWS-1);

  function dotXY(c,r){ return {x:MX+c*GX, y:MY+r*GY}; }
  function xyDot(x,y){
    var c=Math.round((x-MX)/GX), r=Math.round((y-MY)/GY);
    if(c<0||c>=DOT_COLS||r<0||r>=DOT_ROWS){ return null; }
    var p=dotXY(c,r);
    if(Math.hypot(p.x-x,p.y-y)<=GX*0.42){ return {c:c,r:r}; }
    return null;
  }
  function key(d){ return d.c+","+d.r; }

  function currentTask(){ return subtasks[sub]; }

  function render(){
    ctx.clearRect(0,0,840,560);
    // 背景点阵
    ctx.fillStyle="#9fb0c2";
    for(var c=0;c<DOT_COLS;c++)for(var r=0;r<DOT_ROWS;r++){
      var p=dotXY(c,r);
      ctx.beginPath(); ctx.arc(p.x,p.y,5.5,0,Math.PI*2); ctx.fill();
    }
    // 已完成图形
    doneShapes.forEach(function(sh){
      ctx.beginPath();
      sh.verts.forEach(function(d,i){
        var p=dotXY(d.c,d.r);
        if(i===0){ctx.moveTo(p.x,p.y);}else{ctx.lineTo(p.x,p.y);}
      });
      ctx.closePath();
      ctx.fillStyle=sh.fill; ctx.fill();
      ctx.strokeStyle=getCssVar("--c1"); ctx.lineWidth=6; ctx.stroke();
    });
    // 当前折线
    if(pts.length){
      ctx.beginPath();
      pts.forEach(function(d,i){
        var p=dotXY(d.c,d.r);
        if(i===0){ctx.moveTo(p.x,p.y);}else{ctx.lineTo(p.x,p.y);}
      });
      ctx.strokeStyle=getCssVar("--c2"); ctx.lineWidth=7; ctx.lineJoin="round"; ctx.stroke();
      pts.forEach(function(d){
        var p=dotXY(d.c,d.r);
        ctx.beginPath(); ctx.arc(p.x,p.y,11,0,Math.PI*2);
        ctx.fillStyle=getCssVar("--c2"); ctx.fill();
        ctx.strokeStyle="#1c2b3a"; ctx.lineWidth=3; ctx.stroke();
      });
    }
    // 揭示答案的示例幽灵图
    if(stage._ghost&&stage._ghost.sub===sub){
      ctx.beginPath();
      stage._ghost.verts.forEach(function(d,i){
        var p=dotXY(d.c,d.r);
        if(i===0){ctx.moveTo(p.x,p.y);}else{ctx.lineTo(p.x,p.y);}
      });
      ctx.closePath();
      ctx.fillStyle="rgba(255,183,3,.30)"; ctx.fill();
      ctx.strokeStyle="#e09b00"; ctx.lineWidth=6; ctx.setLineDash([14,10]); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  function needVerts(){ return currentTask().kind==="三角形"?3:4; }

  // 校验四边形：边必须横竖交替（长方形/正方形的一年级画法）
  function checkQuad(d){
    var dirs=[];
    for(var i=0;i<4;i++){
      var a=d[i], b=d[(i+1)%4];
      var dx=b.c-a.c, dy=b.r-a.r;
      if(dx===0&&dy===0){ return {ok:false,why:"两个点重复了，四个顶点要不一样。"}; }
      if(dx!==0&&dy!==0){ return {ok:false,why:"长方形和正方形的边要沿着点子的横线、竖线走哦——挨着的点要在同一行或同一列。"}; }
      dirs.push(dx===0?"v":"h");
    }
    for(var j=0;j<4;j++){
      if(dirs[j]===dirs[(j+1)%4]){ return {ok:false,why:"每转过一个顶点都要拐直角弯，要按顺序一个顶点挨一个顶点地点。"}; }
    }
    // 计算横边格数与竖边格数
    var hw=0,vh=0;
    for(var k=0;k<4;k++){
      var a2=d[k],b2=d[(k+1)%4];
      if(a2.r===b2.r){ hw=Math.abs(b2.c-a2.c); }
      if(a2.c===b2.c){ vh=Math.abs(b2.r-a2.r); }
    }
    return {ok:true,w:hw,h:vh};
  }

  function validate(d){
    var t=currentTask();
    if(t.kind==="三角形"){
      var A=d[0],B=d[1],C=d[2];
      var cross=(B.c-A.c)*(C.r-A.r)-(B.r-A.r)*(C.c-A.c);
      if(cross===0){ return {ok:false,why:"三个点在同一条线上就围不成三角形啦，换一个点试试。"}; }
      return {ok:true,note:"三条直直的边首尾相连，三角形画好啦！"};
    }
    var q=checkQuad(d);
    if(!q.ok){ return q; }
    if(t.kind==="正方形"){
      if(q.w!==q.h){ return {ok:false,why:"上下两条边占 "+q.w+" 格，左右两条边占 "+q.h+" 格——正方形四条边要一样长哦！"}; }
      return {ok:true,note:"四条边都占 "+q.w+" 格，一样长！正方形画好啦！"};
    }
    if(t.kind==="长方形"){
      if(t.ratio){
        var mx=Math.max(q.w,q.h), mn=Math.min(q.w,q.h);
        if(mx!==mn*2){ return {ok:false,why:"现在长 "+mx+" 格、宽 "+mn+" 格。要求长正好是宽的 2 倍，比如横 6 格竖 3 格、横 8 格竖 4 格。"}; }
        return {ok:true,note:"长 "+mx+" 格、宽 "+mn+" 格，长正好是宽的 2 倍，对边一样长！"};
      }
      if(q.w===q.h){ return {ok:false,why:"四条边都一样长——这是正方形！长方形要长一点或扁一点（长和宽不一样）。"}; }
      return {ok:true,note:"上下两条边各占 "+q.w+" 格，左右两条边各占 "+q.h+" 格，对边一样长！"};
    }
    return {ok:false,why:"未知任务"};
  }

  stage.reveal=function(){
    G.hints++;
    var t=currentTask();
    var samples;
    if(t.kind==="长方形"){ samples=t.ratio? [[1,1,7,4],[1,2,9,6],[0,1,6,4]] : [[1,1,6,4],[2,1,8,5],[1,2,7,6],[3,1,8,4]]; }
    else if(t.kind==="正方形"){ samples=[[2,2,5,5],[1,1,4,4],[3,2,6,5],[5,3,8,6]]; }
    else{ samples=[[1,5,8,5,4,1],[1,1,3,6,7,2],[2,4,9,4,5,1]]; }
    var found=null;
    for(var i=0;i<samples.length&&!found;i++){
      var s=samples[i];
      var verts;
      if(t.kind==="三角形"){ verts=[{c:s[0],r:s[1]},{c:s[2],r:s[3]},{c:s[4],r:s[5]}]; }
      else{ verts=[{c:s[0],r:s[1]},{c:s[2],r:s[1]},{c:s[2],r:s[3]},{c:s[0],r:s[3]}]; }
      var clash=verts.some(function(d){ return usedDots[key(d)]; });
      if(!clash){ found=verts; }
    }
    if(found){
      stage._ghost={sub:sub, verts:found};
      render();
      setMsg("示例答案已经亮出来啦（黄色虚线）。照着它的顶点点一点，你就也能画出一样的图形！","good");
    }else{
      setMsg("提示：先想好每条边占几格。"+(t.kind==="三角形"?"任选不在一条线上的 3 个点。":"顶点要点在同一行、同一列的点上，对边格数相同。"),"good");
    }
  };

  stage.build=function(){
    function banner(){
      var t=currentTask();
      var txt;
      if(t.kind==="长方形"){ txt=t.ratio?"画一个长方形，长正好是宽的 2 倍（比如横 6 格、竖 3 格）":"画一个长方形（上下两条边一样长，左右两条边一样长）"; }
      else if(t.kind==="正方形"){ txt="画一个正方形（四条边都一样长）"; }
      else{ txt="画一个三角形（任选 3 个不在同一条线上的点）"; }
      var extra=subtasks.length>1?("（第 "+(sub+1)+" 个 / 共 "+subtasks.length+" 个）"):"";
      $("taskBanner").innerHTML="第 "+(G.idx+1)+" 关 · 画一画"+(stageLabel?(" · "+stageLabel):"")+extra
        +'<span class="sub">'+txt+'。按顺序点击点子作为顶点，点满 '+needVerts()+' 个自动检查。</span>';
    }
    banner();
    body.innerHTML="";
    var wrap=document.createElement("div");
    wrap.className="canvasStage";
    cv=document.createElement("canvas");
    cv.className="gameCanvas";
    wrap.appendChild(cv);
    var info=document.createElement("div");
    info.className="liveInfo";
    wrap.appendChild(info);
    var btns=document.createElement("div");
    btns.className="canvasBtns";
    btns.innerHTML='<button class="btn mini ghost" id="dUndo">撤销一步</button><button class="btn mini ghost" id="dClear">清空重画</button>';
    wrap.appendChild(btns);
    body.appendChild(wrap);
    ctx=setupCanvas(cv,840,560);
    pts=[]; stage._ghost=null;
    info.textContent="已点 0 个顶点";
    render();

    cv.addEventListener("pointerdown",function(ev){
      ev.preventDefault();
      var pos=canvasPos(cv,ev);
      var d=xyDot(pos.x,pos.y);
      if(!d){ return; }
      if(usedDots[key(d)]){
        setMsg("这个点已经用过啦，换一个点子。","bad");
        return;
      }
      var dupInShape=pts.some(function(q){ return q.c===d.c&&q.r===d.r; });
      if(dupInShape){
        setMsg("这个顶点已经点过啦，换一个点子。","bad");
        return;
      }
      addStep();
      pts.push(d);
      info.textContent="已点 "+pts.length+" 个顶点（需要 "+needVerts()+" 个）";
      chimeTiny();
      render();
      if(pts.length===needVerts()){
        var res=validate(pts);
        if(res.ok){
          chimeGood();
          doneShapes.push({verts:pts.slice(), fill:"rgba(29,111,209,.18)"});
          pts.forEach(function(dd){ usedDots[key(dd)]=true; });
          setMsg(res.note,"good");
          pts=[];
          sub++;
          stage._ghost=null;
          if(sub>=subtasks.length){
            stage.done=true;
            setTimeout(nextStage,1500);
          }else{
            banner();
            info.textContent="已点 0 个顶点";
            setTimeout(render,700);
          }
        }else{
          G.mistakes++;
          chimeBad();
          setMsg(res.why,"bad");
          setTimeout(function(){ pts=[]; render(); info.textContent="已点 0 个顶点"; },1100);
        }
      }
    });
    $("dUndo").addEventListener("click",function(){
      if(pts.length){ pts.pop(); render(); info.textContent="已点 "+pts.length+" 个顶点"; }
    });
    $("dClear").addEventListener("click",function(){
      pts=[]; render(); info.textContent="已点 0 个顶点";
    });
    setMsg("先想好图形的边各占几格、顶点在哪里，再动手点。画错了可以撤销或清空。","");
    function chimeTiny(){ tone(520,.05,"square"); }
  };
  return stage;
}

/* ==================================================================
   关卡四：数一数 —— 点击组合图中的目标图形，点一个标一个号（编号法）
   来源：教参“易错探究1 / 强化训练4”（有序数数、编号不重不漏）
   ================================================================== */
function pieceRect(x,y,w,h){ return {type:"长方形", x:x,y:y,w:w,h:h}; }
function pieceSq(x,y,a){ return {type:"正方形", x:x,y:y,w:a,h:a}; }
function pieceCir(cx,cy,r){ return {type:"圆", cx:cx,cy:cy,r:r}; }
function pieceTri(pts){ return {type:"三角形", pts:pts}; }

function countStage(scenePool){
  var stage={ title:"数一数", done:false };
  var sceneDef=pick(scenePool);
  var scene={ name:sceneDef.name, pieces:sceneDef.pieces() };
  // 统计各类数量，选一种作为目标（保证至少 2 个，数起来才有味道）
  var counts={};
  scene.pieces.forEach(function(p){ counts[p.type]=(counts[p.type]||0)+1; });
  var usable=Object.keys(counts).filter(function(t){ return counts[t]>=2; });
  var target=pick(usable.length?usable:Object.keys(counts));
  var targetTotal=counts[target];
  var marked=[]; // 已标记的图形下标
  var cv,ctx;

  function centroid(p){
    if(p.type==="圆"){ return {x:p.cx,y:p.cy}; }
    if(p.type==="三角形"){
      var s={x:0,y:0};
      p.pts.forEach(function(q){ s.x+=q[0]; s.y+=q[1]; });
      return {x:s.x/3,y:s.y/3};
    }
    return {x:p.x+p.w/2,y:p.y+p.h/2};
  }
  function inPiece(p,x,y){
    if(p.type==="圆"){ return Math.hypot(x-p.cx,y-p.cy)<=p.r+6; }
    if(p.type==="三角形"){
      var A=p.pts[0],B=p.pts[1],C=p.pts[2];
      function sign(a,b){ return (x-a[0])*(b[1]-a[1])-(y-a[1])*(b[0]-a[0]); }
      var d1=sign(A,B),d2=sign(B,C),d3=sign(C,A);
      var neg=(d1<0)||(d2<0)||(d3<0), pos=(d1>0)||(d2>0)||(d3>0);
      return !(neg&&pos);
    }
    return x>=p.x-4&&x<=p.x+p.w+4&&y>=p.y-4&&y<=p.y+p.h+4;
  }
  function pieceColor(i){
    var base=getCssVar("--c1"), base2=getCssVar("--c2");
    var arr=[base,shade(base,38),shade(base2,10),shade(base2,-22),shade(base,-15),shade(base,58)];
    return arr[i%arr.length];
  }
  function render(revealAll){
    ctx.clearRect(0,0,1000,640);
    ctx.lineJoin="round";
    scene.pieces.forEach(function(p,i){
      ctx.beginPath();
      ctx.fillStyle=pieceColor(i);
      ctx.strokeStyle="#1c2b3a"; ctx.lineWidth=5;
      if(p.type==="圆"){ ctx.arc(p.cx,p.cy,p.r,0,Math.PI*2); }
      else if(p.type==="三角形"){
        p.pts.forEach(function(q,j){ if(j===0){ctx.moveTo(q[0],q[1]);}else{ctx.lineTo(q[0],q[1]);} });
      }else{ ctx.rect(p.x,p.y,p.w,p.h); }
      ctx.fill(); ctx.stroke();
      var m=marked.indexOf(i);
      if(m>=0){
        var c=centroid(p);
        ctx.beginPath(); ctx.arc(c.x,c.y,17,0,Math.PI*2);
        ctx.fillStyle=getCssVar("--c2"); ctx.fill();
        ctx.strokeStyle="#7a5200"; ctx.lineWidth=3; ctx.stroke();
        ctx.fillStyle="#3a2a00"; ctx.font="bold 20px sans-serif";
        ctx.textAlign="center"; ctx.textBaseline="middle";
        ctx.fillText(String(m+1),c.x,c.y+1);
      }else if(revealAll&&p.type===target){
        var c2=centroid(p);
        ctx.beginPath(); ctx.arc(c2.x,c2.y,17,0,Math.PI*2);
        ctx.fillStyle="#ffd76a"; ctx.fill();
        ctx.strokeStyle="#8a6a00"; ctx.lineWidth=3; ctx.stroke();
        ctx.fillStyle="#4a3600"; ctx.font="bold 20px sans-serif";
        ctx.textAlign="center"; ctx.textBaseline="middle";
        ctx.fillText(String(revealAll.idx++),c2.x,c2.y+1);
      }
    });
  }

  stage.reveal=function(){
    G.hints++;
    render({idx:1});
    setMsg("答案亮出来啦：图中一共有 "+targetTotal+" 个"+target+"（金色号码标出的）。照着把没有点过的补点上吧！","good");
  };

  stage.build=function(){
    $("taskBanner").innerHTML="第 "+(G.idx+1)+" 关 · 数一数："+scene.name+"里藏着几个"+target+"？"
      +'<span class="sub">点一个，标一个号（编号数数法）。从上到下、从左到右有序地点，不重复、不遗漏。只数画面里描了边的小图形。</span>';
    body0();
    function body0(){
      var body=$("stageBody");
      body.innerHTML="";
      var wrap=document.createElement("div");
      wrap.className="canvasStage";
      cv=document.createElement("canvas");
      cv.className="gameCanvas";
      wrap.appendChild(cv);
      var info=document.createElement("div");
      info.className="liveInfo";
      info.id="cntInfo";
      wrap.appendChild(info);
      body.appendChild(wrap);
      ctx=setupCanvas(cv,1000,640);
      marked=[];
      info.textContent="已标出 0 个"+target;
      render(null);

      cv.addEventListener("pointerdown",function(ev){
        ev.preventDefault();
        if(stage.done){ return; }
        var pos=canvasPos(cv,ev);
        // 从最上层图形开始检测（数组末尾画在最上面）
        var hit=-1;
        for(var i=scene.pieces.length-1;i>=0;i--){
          if(inPiece(scene.pieces[i],pos.x,pos.y)){ hit=i; break; }
        }
        if(hit<0){ return; }
        addStep();
        var p=scene.pieces[hit];
        var m=marked.indexOf(hit);
        if(m>=0){
          marked.splice(m,1); // 再点一次取消标记
          render(null);
          info.textContent="已标出 "+marked.length+" 个"+target;
          return;
        }
        if(p.type===target){
          marked.push(hit);
          tone(600,.07,"square");
          render(null);
          info.textContent="已标出 "+marked.length+" 个"+target;
          if(marked.length===targetTotal){
            stage.done=true;
            chimeGood();
            setMsg("全部找对啦！图中共有 "+targetTotal+" 个"+target+"。有序点数 + 编号，就不重复、不遗漏！","good");
            setTimeout(nextStage,1600);
          }else{
            setMsg("不错！继续找，还有 "+(targetTotal-marked.length)+" 个"+target+"躲着呢。","good");
          }
        }else{
          G.mistakes++;
          chimeBad();
          setMsg("这个是"+p.type+"（"+FEAT[p.type]+"），不是"+target+"。再找找！","bad");
        }
      });
    }
    setMsg("小提示：先认清"+target+"的样子——"+FEAT[target]+"。然后按从上到下的顺序找，找到就点它！","");
  };
  return stage;
}

/* ==================================================================
   关卡五：折一折 —— 拖出折痕，把纸对折出一样的图形
   来源：教参“举一反三4”（长方形/正方形纸对折，折出相同的图形）
   ================================================================== */
var FOLD_TASKS={
  rect2rect:{paper:"rect", creases:1, need:["V","H"], target:"长方形", pieces:2, text:"把长方形纸对折一次，折出两个一样的长方形"},
  rect2tri:{paper:"rect", creases:1, need:["D1","D2"], target:"三角形", pieces:2, text:"把长方形纸对折一次，折出两个一样的三角形"},
  sq2rect:{paper:"sq", creases:1, need:["V","H"], target:"长方形", pieces:2, text:"把正方形纸对折一次，折出两个一样的长方形"},
  sq2tri:{paper:"sq", creases:1, need:["D1","D2"], target:"三角形", pieces:2, text:"把正方形纸对折一次，折出两个一样的三角形"},
  sq4sq:{paper:"sq", creases:2, need:["V","H"], target:"正方形", pieces:4, text:"把正方形纸对折两次，折出四个一样的正方形"},
  sq4tri:{paper:"sq", creases:2, need:["D1","D2"], target:"三角形", pieces:4, text:"把正方形纸对折两次，折出四个一样的三角形"},
  rect4rect:{paper:"rect", creases:2, need:["V","H"], target:"长方形", pieces:4, text:"把长方形纸对折两次，折出四个一样的长方形"}
};

function foldStage(taskKeys){
  var stage={ title:"折一折", done:false };
  var tasks=taskKeys.map(function(k){ return FOLD_TASKS[k]; });
  var sub=0, locked=[], drawing=null, cv, ctx;
  var CANVAS_W=700, CANVAS_H=560;

  function paperGeom(){
    var t=tasks[sub];
    var W=(t.paper==="rect")?330:260, H=(t.paper==="rect")?220:260;
    return {W:W,H:H,x:(CANVAS_W-W)/2,y:(CANVAS_H-H)/2-10};
  }
  function creaseLine(id){
    var g=paperGeom();
    var cx=g.x+g.W/2, cy=g.y+g.H/2, hw=g.W/2, hh=g.H/2;
    if(id==="V"){ return {a:{x:cx,y:cy-hh}, b:{x:cx,y:cy+hh}}; }
    if(id==="H"){ return {a:{x:cx-hw,y:cy}, b:{x:cx+hw,y:cy}}; }
    if(id==="D1"){ return {a:{x:cx-hw,y:cy-hh}, b:{x:cx+hw,y:cy+hh}}; }
    return {a:{x:cx+hw,y:cy-hh}, b:{x:cx-hw,y:cy+hh}};
  }
  var CREASE_IDS=["V","H","D1","D2"];

  function drawPaperBase(){
    var g=paperGeom();
    ctx.fillStyle="#fffdf5";
    ctx.strokeStyle="#1c2b3a"; ctx.lineWidth=5;
    ctx.fillRect(g.x,g.y,g.W,g.H);
    ctx.strokeRect(g.x,g.y,g.W,g.H);
  }
  function drawCrease(id,color,dash){
    var L=creaseLine(id);
    ctx.beginPath();
    ctx.moveTo(L.a.x,L.a.y); ctx.lineTo(L.b.x,L.b.y);
    ctx.strokeStyle=color; ctx.lineWidth=5;
    ctx.setLineDash(dash||[16,12]);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  function render(){
    ctx.clearRect(0,0,CANVAS_W,CANVAS_H);
    drawPaperBase();
    locked.forEach(function(id){ drawCrease(id,getCssVar("--c2")); });
    if(stage._revealIds){
      stage._revealIds.forEach(function(id){ if(locked.indexOf(id)<0) drawCrease(id,"#ffb703"); });
    }
    if(drawing){
      ctx.beginPath();
      ctx.moveTo(drawing.a.x,drawing.a.y); ctx.lineTo(drawing.b.x,drawing.b.y);
      ctx.strokeStyle="rgba(28,43,58,.55)"; ctx.lineWidth=4; ctx.setLineDash([10,8]);
      ctx.stroke(); ctx.setLineDash([]);
    }
  }

  // 半平面裁剪（Sutherland-Hodgman 简化版：直线 f(p)>=0 保留）
  function clipPoly(poly,f){
    var out=[], n=poly.length;
    for(var i=0;i<n;i++){
      var A=poly[i], B=poly[(i+1)%n];
      var fa=f(A), fb=f(B);
      if(fa>=0){ out.push(A); }
      if((fa>=0&&fb<0)||(fa<0&&fb>=0)){
        var t=fa/(fa-fb);
        out.push({x:A.x+t*(B.x-A.x), y:A.y+t*(B.y-A.y)});
      }
    }
    return out;
  }
  function creaseFunc(id){
    var L=creaseLine(id);
    var dx=L.b.x-L.a.x, dy=L.b.y-L.a.y;
    return function(p){ return dx*(p.y-L.a.y)-dy*(p.x-L.a.x); };
  }

  // 画“翻折到一半”的单帧画面：s 为沿折痕法线方向的压缩比（1=平铺，-1=完全翻过来）
  function drawFoldFrame(g,corners,movePoly,alpha,s,id,t01){
    ctx.clearRect(0,0,CANVAS_W,CANVAS_H);
    drawPaperBase();
    // 静止半张
    ctx.save();
    ctx.beginPath();
    corners.forEach(function(p,i){ if(i===0){ctx.moveTo(p.x,p.y);}else{ctx.lineTo(p.x,p.y);} });
    ctx.clip();
    ctx.fillStyle="#fffdf5"; ctx.fillRect(g.x,g.y,g.W,g.H);
    ctx.restore();
    ctx.strokeStyle="#1c2b3a"; ctx.lineWidth=5;
    ctx.strokeRect(g.x,g.y,g.W,g.H);
    // 翻转半张：压缩比太小（纸片侧对视线）时这一帧先不画
    if(movePoly.length>=3&&Math.abs(s)>=0.3){
      ctx.save();
      var cx=g.x+g.W/2, cy=g.y+g.H/2;
      ctx.translate(cx,cy);
      ctx.rotate(alpha);
      ctx.scale(1,s);
      ctx.rotate(-alpha);
      ctx.translate(-cx,-cy);
      ctx.beginPath();
      movePoly.forEach(function(p,i){ if(i===0){ctx.moveTo(p.x,p.y);}else{ctx.lineTo(p.x,p.y);} });
      ctx.closePath();
      ctx.fillStyle="rgba(255,183,3,"+(0.4+0.5*t01)+")";
      ctx.fill();
      ctx.strokeStyle="#b37800"; ctx.lineWidth=4; ctx.stroke();
      ctx.restore();
    }
    drawCrease(id,"rgba(28,43,58,.5)");
  }
  // 翻折过程：用少量分步画面呈现（立起→翻过来），不使用高频动画循环，
  // 低性能设备与投影仪也能流畅播放
  function flipAnim(id, onDone){
    var g=paperGeom();
    var f=creaseFunc(id);
    var corners=[{x:g.x,y:g.y},{x:g.x+g.W,y:g.y},{x:g.x+g.W,y:g.y+g.H},{x:g.x,y:g.y+g.H}];
    var movePoly=clipPoly(corners,function(p){return f(p);});
    var L=creaseLine(id);
    var alpha=Math.atan2(L.b.y-L.a.y, L.b.x-L.a.x);
    var seq=[{s:0.6,t:0.2},{s:0.32,t:0.5},{s:-0.32,t:0.8},{s:-1,t:1}];
    var k=0;
    function step(){
      drawFoldFrame(g,corners,movePoly,alpha,seq[k].s,id,seq[k].t);
      k++;
      if(k<seq.length){ setTimeout(step,180); }
      else{ setTimeout(onDone,600); }
    }
    step();
  }

  // 成功后：小块分步散开展示（同样是分步画面）
  function burstPieces(task,onDone){
    var g=paperGeom();
    var cx=g.x+g.W/2, cy=g.y+g.H/2;
    var polys=[{x:g.x,y:g.y},{x:g.x+g.W,y:g.y},{x:g.x+g.W,y:g.y+g.H},{x:g.x,y:g.y+g.H}];
    locked.forEach(function(id){
      var f=creaseFunc(id);
      var next=[];
      polys.forEach(function(p){
        var a=clipPoly(p,function(q){return f(q);});
        var b=clipPoly(p,function(q){return -f(q);});
        if(a.length>=3){ next.push(a); }
        if(b.length>=3){ next.push(b); }
      });
      polys=next;
    });
    var cols=[getCssVar("--c1"),getCssVar("--c2"),shade(getCssVar("--c1"),35),shade(getCssVar("--c2"),-18)];
    function drawBurst(scale){
      ctx.clearRect(0,0,CANVAS_W,CANVAS_H);
      polys.forEach(function(p,i){
        var mx=0,my=0;
        p.forEach(function(q){ mx+=q.x; my+=q.y; });
        mx/=p.length; my/=p.length;
        var dx=(mx-cx)*0.55*scale, dy=(my-cy)*0.55*scale;
        ctx.beginPath();
        p.forEach(function(q,j){ if(j===0){ctx.moveTo(q.x+dx,q.y+dy);}else{ctx.lineTo(q.x+dx,q.y+dy);} });
        ctx.closePath();
        ctx.fillStyle=cols[i%cols.length]; ctx.fill();
        ctx.strokeStyle="#1c2b3a"; ctx.lineWidth=4; ctx.stroke();
      });
    }
    var fr=[0.18,0.38,0.55];
    var k=0;
    function step(){
      drawBurst(fr[k]);
      k++;
      if(k<fr.length){ setTimeout(step,240); }
      else{ setTimeout(onDone,800); }
    }
    step();
  }

  // 手势折痕匹配到四条标准折线
  function snapCrease(a,b){
    var g=paperGeom();
    var cx=g.x+g.W/2, cy=g.y+g.H/2;
    var dx=b.x-a.x, dy=b.y-a.y;
    var len=Math.hypot(dx,dy);
    if(len<Math.min(g.W,g.H)*0.45){ return null; } // 拖得太短
    var ux=dx/len, uy=dy/len;
    var best=null,bestScore=1e9;
    CREASE_IDS.forEach(function(id){
      var L=creaseLine(id);
      var vx=L.b.x-L.a.x, vy=L.b.y-L.a.y;
      var vl=Math.hypot(vx,vy);
      var dot=Math.abs(ux*vx/vl+uy*vy/vl);
      if(dot<0.92){ return; } // 方向差超过 23° 不匹配
      var off=Math.abs(ux*(cy-a.y)-uy*(cx-a.x)); // 画线离纸中心的垂直距离
      var score=off+(1-dot)*200;
      if(off<70&&score<bestScore){ best=id; bestScore=score; }
    });
    return best;
  }

  function curTask(){ return tasks[sub]; }

  stage.reveal=function(){
    G.hints++;
    stage._revealIds=sample(curTask().need,curTask().creases);
    render();
    setMsg("答案折痕用金色虚线亮出来啦！照着它的方向，在纸上拖出一样的折痕吧。","good");
  };

  stage.build=function(){
    function banner(){
      var t=curTask();
      $("taskBanner").innerHTML="第 "+(G.idx+1)+" 关 · 折一折"+(tasks.length>1?"（第 "+(sub+1)+" 个 / 共 "+tasks.length+" 个）":"")
        +'<span class="sub">'+t.text+'。在纸上按住并拖动画出折痕（虚线），松手后纸就会沿折痕折起来。</span>';
    }
    banner();
    var body=$("stageBody");
    body.innerHTML="";
    var wrap=document.createElement("div");
    wrap.className="canvasStage";
    cv=document.createElement("canvas");
    cv.className="gameCanvas";
    wrap.appendChild(cv);
    var info=document.createElement("div");
    info.className="liveInfo";
    info.id="foldInfo";
    wrap.appendChild(info);
    body.appendChild(wrap);
    ctx=setupCanvas(cv,CANVAS_W,CANVAS_H);
    locked=[]; drawing=null; stage._revealIds=null;
    info.textContent="已画出 0 / "+curTask().creases+" 条折痕";
    render();

    function finishCheck(){
      var t=curTask();
      if(locked.length>=t.creases){
        stage._revealIds=null;
        chimeWin();
        burstPieces(t,function(){
          setMsg("成功！对折后得到 "+t.pieces+" 个一样的小"+t.target+"。折痕用虚线表示，这条虚线就是“对折后完全重合”的位置。","good");
          sub++;
          locked=[];
          if(sub>=tasks.length){
            stage.done=true;
            setTimeout(nextStage,1700);
          }else{
            banner();
            info.textContent="已画出 0 / "+curTask().creases+" 条折痕";
            setTimeout(render,900);
          }
        });
        return true;
      }
      return false;
    }

    cv.addEventListener("pointerdown",function(ev){
      ev.preventDefault();
      if(stage.done){ return; }
      var p=canvasPos(cv,ev);
      drawing={a:p,b:p};
      try{ cv.setPointerCapture(ev.pointerId); }catch(e){}
      render();
    });
    cv.addEventListener("pointermove",function(ev){
      if(!drawing){ return; }
      drawing.b=canvasPos(cv,ev);
      render();
    });
    cv.addEventListener("pointerup",function(ev){
      if(!drawing){ return; }
      var a=drawing.a, b=canvasPos(cv,ev);
      drawing=null;
      var id=snapCrease(a,b);
      addStep();
      if(!id){
        setMsg("折痕要把纸对折才整齐：试试竖着的中线、横着的中线，或者连着两个对角的斜线，拖长一点更准哦。","bad");
        render(); return;
      }
      var t=curTask();
      if(locked.indexOf(id)>=0){
        setMsg("这条折痕已经画过啦，再画一条不同的折痕。","");
        render(); return;
      }
      var good=t.need.indexOf(id)>=0;
      flipAnim(id,function(){
        if(good){
          chimeGood();
          locked.push(id);
          stage._revealIds=null;
          render();
          info.textContent="已画出 "+locked.length+" / "+t.creases+" 条折痕";
          if(!finishCheck()){
            setMsg("这条折痕对啦！折出的两半完全重合。"+(t.creases>1?"再画一条折痕，折出"+t.pieces+"个一样的小"+t.target+"。":""),"good");
          }
        }else{
          G.mistakes++;
          chimeBad();
          var wrongName=(id==="V"||id==="H")?"小长方形":"小三角形";
          setMsg("这样折出来的是两个"+wrongName+"，不是"+t.target+"哦。"+(t.target==="三角形"?"要折出三角形，试试连接对角的斜折痕。":"要折出"+t.target+"，试试横着或竖着把纸对半分的中线。"),"bad");
          render();
        }
      });
    });
    setMsg("对折的秘诀：折痕两边的图形要完全一样（能完全重合）。中线对中线、角对角，多试几次！","");
  };
  return stage;
}

/* ==================================================================
   难度组装（G3 + 反重复随机抽题）
   ================================================================== */
function buildStages(level){
  if(level==="初级"){
    // 印一印：从 4 种图形随机抽 2 种；圆题自动带出“球”干扰项
    var targets=sample(["长方形","正方形","三角形","圆"],2);
    var st=targets.map(function(t){ return stampStage(t); });
    st.push(sortStage());
    return st;
  }
  if(level==="中级"){
    // 画一画：长方形、正方形各一关（顺序打乱）+ 数一数（随机场景）
    var draws=shuffle([
      drawStage([{kind:"长方形"}]),
      drawStage([{kind:"正方形"}])
    ]);
    draws.push(countStage(MID_SCENES));
    return draws;
  }
  // 高级：折一折（两条任务）+ 组合画图（2倍长方形+三角形）+ 大场景数图
  var first=pick(["sq4sq","sq4tri","rect4rect"]);
  var second=pick(["rect2tri","sq2tri","rect2rect","sq2rect"]);
  return [
    foldStage([first,second]),
    drawStage([{kind:"长方形",ratio:true},{kind:"三角形"}],"组合挑战"),
    countStage(HARD_SCENES)
  ];
}

/* ==================================================================
   流程控制 ---------------- */
function renderDots(){
  var box=$("stageDots");
  box.innerHTML="";
  G.stages.forEach(function(s,i){
    var d=document.createElement("span");
    d.className="dot"+(i===G.idx?" now":(i<G.idx?" done":""));
    box.appendChild(d);
  });
}
function nextStage(){
  G.idx++;
  if(G.idx>=G.stages.length){ showWin(); return; }
  runStage();
}
function runStage(){
  G.current=G.stages[G.idx];
  $("stageTitle").textContent=G.level+" · "+G.current.title;
  renderDots();
  G.current.build();
}
function startLevel(level){
  G.level=level; G.idx=0; G.steps=0; G.mistakes=0; G.hints=0;
  $("stepVal").textContent="0";
  applyRandomPalette();
  G.stages=buildStages(level);
  $("menuScreen").style.display="none";
  $("winOverlay").style.display="none";
  startTimer();
  runStage();
  openRules(); // 每次进入难度弹出规则（G6），可随时再打开
}
function showWin(){
  G.playing=false; stopTicker();
  chimeWin();
  var stars=3;
  if(G.mistakes>3){ stars--; }
  if(G.hints>0){ stars--; }
  if(stars<1){ stars=1; }
  var starTxt="";
  for(var si=0;si<3;si++){ starTxt+= si<stars?"★":"☆"; }
  $("winStars").textContent=starTxt;
  $("winStats").innerHTML="难度："+G.level+"<br>用时 <b>"+$("timeVal").textContent
    +"</b>　操作 <b>"+G.steps+"</b> 步　失误 <b>"+G.mistakes+"</b> 次　提示 <b>"+G.hints+"</b> 次";
  $("winOverlay").style.display="flex";
  launchConfetti();
}

/* ---------------- 庆祝彩纸（G5，纯 CSS 动画实现） ---------------- */
function launchConfetti(){
  var host=$("confettiHost");
  host.innerHTML="";
  host.style.display="block";
  var cols=[getCssVar("--c1"),getCssVar("--c2"),"#e0564f","#2e9e5b","#7048c8","#5fd0a6"];
  var n=110;
  for(var i=0;i<n;i++){
    var el=document.createElement("i");
    el.className="confetto";
    el.style.left=(Math.random()*100)+"vw";
    el.style.width=(7+Math.random()*8)+"px";
    el.style.height=(5+Math.random()*6)+"px";
    el.style.background=cols[i%cols.length];
    el.style.setProperty("--dx",((Math.random()-0.5)*28).toFixed(1)+"vw");
    el.style.setProperty("--rot",Math.round(Math.random()*720-360)+"deg");
    el.style.animationDuration=(2.6+Math.random()*1.6).toFixed(2)+"s";
    el.style.animationDelay=(Math.random()*0.9).toFixed(2)+"s";
    host.appendChild(el);
  }
  // 动画结束后清场
  setTimeout(function(){
    host.style.display="none";
    host.innerHTML="";
  },5000);
}

/* ---------------- 规则说明（G6） ---------------- */
function openRules(){
  $("rulesBody").innerHTML=
    '<p style="margin:4px 0;">今天我们是<b>小小图形设计师</b>！工坊里有五种好玩的任务：</p>'
    +'<ul>'
    +'<li><b>印一印</b>：想一想哪块积木上平平的面能画出目标图形，把那块积木<b>拖</b>到白纸上。（悄悄记住：球的面是弯弯的曲面，画不出平面图形哦）</li>'
    +'<li><b>分一分</b>：把图形卡片<b>拖</b>进对应的“图形屋”。斜着放的正方形也是正方形！</li>'
    +'<li><b>画一画</b>：在点子图上<b>按顺序点出顶点</b>，围出要求的图形。长方形、正方形的边要沿着点子的横线竖线走。</li>'
    +'<li><b>数一数</b>：找出图中所有指定的图形，<b>点一个标一个号</b>（编号数数法），从上到下有序地点，不重复、不遗漏。</li>'
    +'<li><b>折一折</b>：在纸上<b>按住拖出折痕</b>，松手纸就会折起来。折痕两边的图形要完全一样才算对。</li>'
    +'</ul>'
    +'<p><b>图形小档案</b>（很重要，贴在工坊墙上）：</p>'
    +'<ul>'
    +'<li>长方形：'+FEAT["长方形"]+'。</li>'
    +'<li>正方形：'+FEAT["正方形"]+'。</li>'
    +'<li>三角形：'+FEAT["三角形"]+'。</li>'
    +'<li>圆：'+FEAT["圆"]+'。</li>'
    +'</ul>'
    +'<p>遇到困难可以点「揭示答案」，通关后还有彩纸庆祝哟！</p>';
  $("rulesMask").style.display="flex";
}

/* ---------------- 初始化与事件绑定 ---------------- */
function init(){
  var lvCards=document.querySelectorAll(".lvCard");
  for(var i=0;i<lvCards.length;i++){
    lvCards[i].addEventListener("click",function(){ startLevel(this.dataset.lv); });
  }
  $("menuRules").addEventListener("click",openRules);
  $("btnRules").addEventListener("click",openRules);
  $("rulesClose").addEventListener("click",function(){ $("rulesMask").style.display="none"; });
  $("btnRestart").addEventListener("click",function(){
    if(G.level){ startLevel(G.level); }
  });
  $("btnMenu").addEventListener("click",function(){
    stopTicker(); G.playing=false;
    $("winOverlay").style.display="none";
    $("menuScreen").style.display="flex";
    setMsg("回到难度选择啦，随时可以再来一局！","");
  });
  $("btnReveal").addEventListener("click",function(){
    if(G.current&&G.current.reveal){ G.current.reveal(); }
  });
  $("btnAgain").addEventListener("click",function(){ if(G.level){ startLevel(G.level); } });
  $("btnBackMenu").addEventListener("click",function(){
    $("winOverlay").style.display="none";
    $("menuScreen").style.display="flex";
  });
  applyRandomPalette();
}
init();
</script>
