<div id="app">

  <!-- ========== 难度选择屏 ========== -->
  <section id="scr-menu" class="scr">
    <h1>图形魔法工坊</h1>

    <div class="intro">你是图形魔法师! 每一关都要<b>亲手操作</b>: 拖动旋转图形、拖标尺量长度、拼合拼板、画辅助线、涂色、调节滑块…… 操作正确, 算式就会自动点亮。无需输入答案, 动手就是思考!</div>
    <div class="diffs">
      <button class="diff" data-d="easy"><b>初级 · 旋转初体验</b><span>3 个小关卡(例题级)<br>转一转, 量一量</span></button>
      <button class="diff" data-d="mid"><b>中级 · 拼合小行家</b><span>2 个小关卡(练习级)<br>旋转拼方 + 巧克力拼图</span></button>
      <button class="diff" data-d="hard"><b>高级 · 模型大师</b><span>3 个小关卡(变式综合)<br>沙漏 · 金字塔 · 双高模型</span></button>
    </div>
    <button id="btn-rules-menu">规则说明</button>
    <div id="pal-chip"></div>
  </section>

  <!-- ========== 游戏屏 ========== -->
  <section id="scr-game" class="scr hidden">
    <div id="hud">
      <span id="lv-tag"></span>
      <span id="hud-right">用时 <b id="t-time">00:00</b> · 操作 <b id="t-steps">0</b> 次</span>
    </div>
    <div id="qbar" title="点击查看小提示"></div>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="extras"></div>
    </div>
    <div id="instr"></div>
    <div id="eqbar"></div>
    <div id="ctrl">
      <button id="btn-rules">规则说明</button>
      <button id="btn-reveal">揭示答案</button>
      <button id="btn-restart">重新开始</button>
      <button id="btn-back">返回难度选择</button>
    </div>
  </section>

  <!-- ========== 弹层 / 提示 / 彩纸画布 ========== -->
  <div id="modal" class="hidden"><div id="modal-card"><h2 id="m-title"></h2><div id="m-body"></div><div id="m-btns"></div></div></div>
  <div id="toast"></div>
  <canvas id="fx"></canvas>
</div>
