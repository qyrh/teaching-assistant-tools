<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>纸盒工坊 · 表面积公式的基本应用（第11讲 秘籍1）</title>
<style>
/* ============ 全局样式（主色由 JS 从预设色板随机注入 CSS 变量） ============ */
:root{--main:#e05e0b;--deep:#9c3f04;--tint:#ffead9;--accent:#14907a;--stage:#f6dfc8;--bg:#fdf8f2;--panel:#ffffff;--text:#2a2723;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;}
body{font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","SimHei",sans-serif;background:var(--bg);color:var(--text);font-size:18px;line-height:1.6;overflow-x:hidden;}
button{font-family:inherit;}
.screen{display:none;}
.screen.on{display:block;}

/* ---------- 菜单界面 ---------- */
.hero{text-align:center;padding:26px 10px 6px;}
.hero .badge{display:inline-block;background:var(--tint);color:var(--deep);border:2px solid var(--main);border-radius:999px;padding:4px 18px;font-size:18px;font-weight:700;}
.hero h1{font-size:40px;color:var(--main);letter-spacing:2px;margin-top:12px;}
.hero .sub{font-size:20px;margin-top:6px;}
.diff-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;margin:26px 0 10px;}
.diff-card{flex:1 1 270px;max-width:380px;background:var(--panel);border:3px solid var(--main);border-radius:20px;padding:22px 20px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.10);transition:transform .12s ease,box-shadow .12s ease;}
.diff-card:hover{transform:translateY(-4px);box-shadow:0 10px 22px rgba(0,0,0,.16);}
.diff-card .dname{font-size:26px;font-weight:800;color:var(--main);}
.diff-card .dsub{display:inline-block;margin-top:6px;background:var(--tint);color:var(--deep);border-radius:8px;padding:1px 10px;font-size:17px;font-weight:700;}
.diff-card p{margin-top:10px;font-size:18px;}
.diff-card .dgo{margin-top:12px;font-size:19px;font-weight:800;color:#fff;background:var(--main);border-radius:10px;padding:6px 10px;}
.menu-btns{text-align:center;margin:22px 0 30px;}
.menu-btns .btn{margin:0 8px;}

/* ---------- 通用按钮 ---------- */
.btn{display:inline-block;border:none;cursor:pointer;border-radius:12px;padding:10px 20px;min-height:46px;font-size:18px;font-weight:700;color:#fff;background:var(--main);box-shadow:0 3px 0 rgba(0,0,0,.18);transition:transform .08s ease;}
.btn:active{transform:translateY(2px);box-shadow:none;}
.btn.ghost{background:#fff;color:var(--main);border:2.5px solid var(--main);}
.btn.small{padding:6px 14px;min-height:40px;font-size:17px;}
.btn.accent{background:var(--accent);}
.btn.on{background:var(--deep);color:#fff;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* ---------- 游戏界面：顶栏 ---------- */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.10);margin-bottom:12px;}
.topbar .title{font-size:22px;font-weight:800;color:var(--main);flex:1 1 200px;min-width:180px;}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--tint);color:var(--deep);border-radius:999px;padding:4px 14px;font-weight:700;font-size:18px;white-space:nowrap;}
.chip b{font-size:21px;}
.card{background:var(--panel);border-radius:16px;padding:14px 16px;box-shadow:0 3px 10px rgba(0,0,0,.10);}

/* ---------- 订单卡 ---------- */
.order{margin-bottom:12px;border-left:10px solid var(--main);}
.order-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:4px;}
.order .ot{font-size:24px;font-weight:800;color:var(--main);}
.badge{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:2px 14px;font-size:17px;font-weight:700;}
.order-text{font-size:22px;line-height:1.7;}
.order-text .blank{display:inline-block;min-width:150px;border-bottom:3px solid var(--main);color:var(--main);font-weight:800;text-align:center;line-height:1.1;}
.order-goal{margin-top:8px;font-size:18px;background:var(--tint);border-radius:10px;padding:6px 12px;}

/* ---------- 游戏主区域布局 ---------- */
.game-grid{display:grid;gap:14px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);grid-template-areas:"canvas ops" "report ops" "foot ops";align-items:start;}
.a-canvas{grid-area:canvas;}
.a-ops{grid-area:ops;}
.a-report{grid-area:report;}
.a-foot{grid-area:foot;}
@media (max-width:900px){.game-grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"canvas" "ops" "report" "foot";}}

/* ---------- 3D 工作台画布 ---------- */
.canvas-wrap{position:relative;}
#cv3d{display:block;width:100%;height:clamp(300px,44vh,470px);border-radius:12px;background:var(--stage);touch-action:none;cursor:grab;}
#cv3d:active{cursor:grabbing;}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(40,40,40,.88);color:#fff;padding:6px 16px;border-radius:999px;font-size:17px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s ease;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;}
.toast.on{opacity:1;}
.view-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.legend{margin-top:8px;font-size:17px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;}
.sw{display:inline-block;width:22px;height:16px;border:2px solid #555;border-radius:4px;vertical-align:-2px;margin-right:4px;}
.sw.paper{background:#cfe5ff;background-image:repeating-linear-gradient(0deg,transparent 0 5px,rgba(95,140,200,.6) 5px 6px),repeating-linear-gradient(90deg,transparent 0 5px,rgba(95,140,200,.6) 5px 6px);}
.sw.band{background:#c3ec84;}
.sw.cut{background:#ffbd4a;}
.sw.glue{background:#fff;border:3px solid #ec4d8d;height:14px;}
.tri{display:none;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:12px;}
.tri.on{display:flex;}
.tri .tv{text-align:center;background:var(--tint);border-radius:12px;padding:8px 10px;}
.tri .tv canvas{display:block;background:#fff;border-radius:6px;}
.tri .tv .cap{font-size:17px;font-weight:800;margin-top:4px;}

/* ---------- 操作台 ---------- */
.ops h3{font-size:21px;color:var(--main);margin-bottom:6px;}
.ops .sec{margin-top:16px;}
.hint{font-size:18px;}
.tray{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0;}
.item{cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;background:#fff;border:2.5px dashed var(--main);border-radius:14px;padding:10px 12px;min-width:96px;text-align:center;transition:transform .1s ease,box-shadow .1s ease;}
.item:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.12);}
.item.dragging{opacity:0;}
.item .lab{font-size:19px;font-weight:800;margin-top:6px;}
.item .sub{font-size:16px;color:#5a5a5a;}
.shape{margin:0 auto;background:#cfe5ff;border:2px solid #4f86cf;border-radius:4px;background-image:repeating-linear-gradient(0deg,transparent 0 7px,rgba(95,140,200,.5) 7px 8px),repeating-linear-gradient(90deg,transparent 0 7px,rgba(95,140,200,.5) 7px 8px);}
.item.strip .shape{background:#c3ec84;border-color:#6a9a1f;background-image:none;}
.item.cube .shape{width:46px;height:46px;border-radius:8px;border:2.5px solid rgba(0,0,0,.35);background-image:none;}
.item.disabled{opacity:.4;pointer-events:none;}
.count{font-size:19px;}
.count b{color:var(--main);font-size:24px;}
.empty{color:#6b6b6b;font-size:18px;padding:6px;}
.board{display:flex;justify-content:center;gap:6px;margin:10px 0 6px;padding:8px;background:#f4efe3;border-radius:12px;min-height:76px;}
.slot{width:92px;height:58px;border:2.5px dashed #b9a98a;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;color:#5a7a1a;background:#fff;}
.slot.hover{border-color:var(--main);background:var(--tint);color:var(--deep);}
.slot.filled{border-style:solid;border-color:#6a9a1f;background:#c3ec84;color:#36520c;}
.board-cap{text-align:center;font-size:18px;margin-top:2px;}
.log{padding-left:26px;font-size:18px;}
.log li{margin:4px 0;}
.saw-row{display:grid;grid-template-columns:96px 1fr;gap:4px 12px;align-items:center;margin:10px 0;}
.saw-row .saw-name{font-weight:800;font-size:18px;}
.saw-row input[type=range]{width:100%;height:34px;accent-color:var(--main);cursor:pointer;}
.saw-row .saw-val{grid-column:2;font-size:18px;}
.saw-row .saw-val b{color:var(--main);font-size:22px;}
.ref{margin-top:12px;text-align:center;}
.ref .ref-lab{font-size:18px;font-weight:800;margin-bottom:4px;}
#cvRef{display:block;width:100%;height:250px;background:var(--stage);border-radius:12px;}
.ref .ref-text{font-size:17px;margin-top:6px;text-align:left;}
.ops-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}

/* ---------- 报数区 ---------- */
.report h3{font-size:21px;color:var(--main);display:flex;align-items:center;flex-wrap:wrap;gap:10px;}
.unit-chip{background:var(--tint);color:var(--deep);border-radius:999px;padding:1px 12px;font-size:17px;font-weight:700;}
.dial-row{display:flex;justify-content:center;gap:18px;margin:10px 0;}
.dial{display:flex;flex-direction:column;align-items:center;gap:4px;}
.dial-btn{width:74px;height:38px;font-size:18px;font-weight:800;border:2px solid var(--main);background:#fff;color:var(--main);border-radius:10px;cursor:pointer;}
.dial-btn:active{background:var(--tint);}
.dial-num{width:74px;height:74px;border:3px solid var(--main);border-radius:14px;background:var(--tint);color:var(--deep);font-size:44px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:ns-resize;user-select:none;-webkit-user-select:none;touch-action:none;}
.dial-lab{font-size:18px;font-weight:700;}
.report-btns{text-align:center;margin-top:6px;}
.report-btns .btn{font-size:21px;padding:12px 34px;}
.feedback{display:none;margin-top:10px;font-size:18px;border-radius:12px;padding:8px 12px;}
.feedback.on{display:block;}
.feedback.bad{background:#fdecec;border:2.5px solid #d9363e;color:#8c1d22;}
.feedback .sk{margin-top:6px;background:#fff;border-radius:8px;padding:4px 8px;font-weight:800;}
.foot-btns{display:flex;flex-wrap:wrap;gap:10px;}
.shake{animation:shakeAnim .4s ease;}
@keyframes shakeAnim{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-6px);}80%{transform:translateX(6px);}}

/* ---------- 弹窗 ---------- */
.modal-mask{position:fixed;inset:0;background:rgba(30,30,40,.55);z-index:100;display:none;align-items:center;justify-content:center;padding:16px;}
.modal-mask.on{display:flex;}
.modal{background:#fff;border-radius:20px;max-width:780px;width:100%;max-height:88vh;overflow-y:auto;padding:22px 26px;box-shadow:0 10px 40px rgba(0,0,0,.3);}
.modal h2{color:var(--main);font-size:28px;margin-bottom:10px;}
.modal h3{color:var(--main);font-size:21px;margin:14px 0 6px;}
.modal p,.modal li{font-size:18px;}
.modal ul,.modal ol{padding-left:26px;}
.modal .btn-row{text-align:center;margin-top:18px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
.modal .stars{font-size:44px;color:#f5a623;text-align:center;letter-spacing:6px;margin:4px 0;}
.modal .stars .off{color:#d9d9d9;}
.modal .ansline{font-size:24px;font-weight:800;color:var(--main);text-align:center;margin:6px 0;}
.modal .kp{background:var(--tint);border-radius:12px;padding:8px 12px;margin-top:10px;}
.modal .sum{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;font-size:20px;margin:10px 0;}
.modal .sum b{color:var(--main);font-size:30px;}
.formula{background:var(--tint);border-radius:12px;padding:8px 14px;margin:6px 0;font-size:19px;}

/* ---------- 拖动时的"跟手小卡片"与庆祝礼花层 ---------- */
.drag-ghost{position:fixed;left:0;top:0;z-index:300;pointer-events:none;transform:translate(-50%,-60%);display:none;align-items:center;justify-content:center;background:#fff;border:3px solid var(--main);border-radius:14px;padding:10px 14px;font-weight:800;font-size:18px;box-shadow:0 8px 20px rgba(0,0,0,.25);}
#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:400;display:none;}
</style>
</head>
<body>
<div id="app">

  <!-- ================= 菜单界面 ================= -->
  <section id="scrMenu" class="screen on">
    <div class="hero">
      <div class="badge">第11讲 长方体、正方体的表面积 · 秘籍1 表面积公式的基本应用</div>
      <h1>纸盒工坊 · 表面积大挑战</h1>
      <p class="sub">包纸盒、加加高、切一切、粘一粘、搭积木——动手做一做，表面积一目了然！</p>
    </div>
    <div class="diff-row" id="diffRow"></div>
    <div class="menu-btns">
      <button class="btn ghost" id="btnMenuRules">规则说明</button>
    </div>
  </section>

  <!-- ================= 游戏界面 ================= -->
  <section id="scrGame" class="screen">
    <div class="topbar">
      <button class="btn small ghost" id="btnBack">返回难度选择</button>
      <div class="title" id="gTitle"></div>
      <div class="chip">订单 <b id="gNo">1</b> / 3</div>
      <div class="chip">时间 <b id="gTime">00:00</b></div>
      <div class="chip">步数 <b id="gSteps">0</b></div>
      <button class="btn small ghost" id="btnRules">规则说明</button>
    </div>

    <div class="card order">
      <div class="order-head"><span class="ot">订单 <span id="oNo">1</span></span><span class="badge" id="oSrc"></span></div>
      <p class="order-text" id="oText"></p>
      <div class="order-goal" id="oGoal"></div>
    </div>

    <div class="game-grid">
      <div class="card a-canvas">
        <div class="canvas-wrap">
          <canvas id="cv3d"></canvas>
          <div class="toast" id="toast"></div>
        </div>
        <div class="view-btns" id="viewBtns"></div>
        <div class="legend" id="legend"></div>
        <div class="tri" id="triWrap"></div>
      </div>

      <div class="card ops a-ops" id="opsCard"></div>

      <div class="card report a-report">
        <h3>报数区 <span class="unit-chip" id="unitChip"></span></h3>
        <p class="hint">算出答案后，拨动数位器（点上下按钮，或按住数字上下拖动）。</p>
        <div class="dial-row" id="dialRow"></div>
        <div class="report-btns"><button class="btn" id="btnCommit">完成这一单</button></div>
        <div class="feedback" id="fb"></div>
      </div>

      <div class="foot-btns a-foot">
        <button class="btn ghost" id="btnReveal">揭示答案</button>
        <button class="btn ghost" id="btnRestart">重新开始</button>
        <button class="btn ghost" id="btnBack2">返回难度选择</button>
      </div>
    </div>
  </section>
</div>

<!-- 通用弹窗（规则说明 / 过关 / 揭示答案 / 通关庆祝） -->
<div class="modal-mask" id="modalMask"><div class="modal" id="modalBox"></div></div>
<div class="drag-ghost" id="dragGhost"></div>
<canvas id="fx"></canvas>

<script>
(function () {
'use strict';

/* ======================================================================
   0. 通用小工具
   ====================================================================== */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const FONT = '"Microsoft YaHei","PingFang SC","Hiragino Sans GB","SimHei",sans-serif';

/* 洗牌：返回打乱后的新数组 */
function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function fmtTime(s) { return pad2(Math.floor(s / 60)) + ':' + pad2(s % 60); }
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
/* 按亮度系数调暗一个十六进制颜色 */
function shade(h, f) { const c = hexRgb(h); return 'rgb(' + Math.round(c[0] * f) + ',' + Math.round(c[1] * f) + ',' + Math.round(c[2] * f) + ')'; }
function rgba(h, a) { const c = hexRgb(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

/* ======================================================================
   1. 配色随机化：每局从色板里随机选一套主色
   ====================================================================== */
const PALETTES = [
  { main: '#e05e0b', deep: '#9c3f04', tint: '#ffead9', stage: '#f6dfc8', accent: '#14907a', cubes: ['#8ecbfa', '#f9a8c9', '#bfe393', '#cdb6f7'] },
  { main: '#1869c9', deep: '#0e4489', tint: '#dceafd', stage: '#cfe1f6', accent: '#e8791c', cubes: ['#f7b26b', '#9ad58a', '#f49ac1', '#b9a8f2'] },
  { main: '#178a4c', deep: '#0d5c31', tint: '#d9f2e2', stage: '#c9e8d5', accent: '#e0662c', cubes: ['#f6c453', '#8fc7f5', '#f5a0be', '#c2abf3'] },
  { main: '#7439bd', deep: '#4e2385', tint: '#eadcfb', stage: '#ddd0f3', accent: '#e08a12', cubes: ['#8fd0f7', '#f8ad6c', '#a5dc8c', '#f6a3c5'] },
  { main: '#c92a3d', deep: '#8c1a29', tint: '#fbdde1', stage: '#f5cdd2', accent: '#138a72', cubes: ['#8ecbfa', '#f9d06b', '#a9db8f', '#c7b0f5'] },
  { main: '#0b8a86', deep: '#075c59', tint: '#d6f3f1', stage: '#c4e8e5', accent: '#d95f1e', cubes: ['#f9b26a', '#f7a3c4', '#b3e08c', '#a9b8f5'] },
  { main: '#a07200', deep: '#6d4c00', tint: '#fbf0cf', stage: '#f1e4b9', accent: '#1f7fae', cubes: ['#8ecbfa', '#f7a3c4', '#9fd98c', '#c3aef5'] },
  { main: '#c0246e', deep: '#831649', tint: '#fbdcea', stage: '#f3cfe0', accent: '#1a86a8', cubes: ['#f9c85c', '#8fd0a8', '#9ec6f7', '#c9b2f5'] }
];
let PAL = PALETTES[0];
function applyPalette() {
  PAL = PALETTES[Math.floor(Math.random() * PALETTES.length)];
  const r = document.documentElement.style;
  r.setProperty('--main', PAL.main);
  r.setProperty('--deep', PAL.deep);
  r.setProperty('--tint', PAL.tint);
  r.setProperty('--accent', PAL.accent);
  r.setProperty('--stage', PAL.stage);
}
/* 含义固定的语义色（不随主色变化，保证"纸/新截面/加高/粘合"始终一眼可认） */
const C = {
  line: '#2d2d2d', body: '#fffdf6',
  paper: '#cfe5ff', paperLine: '#4f86cf', paperText: '#123f7a',
  band: '#c3ec84', bandLine: '#3f7d0a',
  cut: '#ffbd4a', cutLine: '#c2410c',
  glue: '#ec4d8d',
  ok: '#1c9a52', bad: '#d9363e'
};

/* ======================================================================
   2. 音效：用 WebAudio 现场合成，零外部文件
   ====================================================================== */
const SND = {
  ac: null, on: true,
  init() {
    if (!this.ac) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) this.ac = new AC();
      } catch (e) { this.ac = null; }
    }
    if (this.ac && this.ac.state === 'suspended') this.ac.resume();
  },
  tone(freq, start, dur, type, vol) {
    const a = this.ac, t0 = a.currentTime + start;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  },
  play(kind) {
