<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>观察与思考 · 图形迷阵闯关</title>
<style>
/* ================= 主题色板（每局随机换色，保证常玩常新） ================= */
:root{
  --p:#2563eb; --bg:#eaf2ff; --a:#f59e0b; --soft:#d7e4ff; --ink:#1f2937;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:"Microsoft YaHei","PingFang SC","SimHei",sans-serif;
  background:var(--bg); color:var(--ink); font-size:20px; line-height:1.5;
  min-height:100vh; overscroll-behavior:none;
}
body.noselect{user-select:none; -webkit-user-select:none;}
#wrap{max-width:1150px;margin:0 auto;padding:10px 14px 40px;}

/* ================= 顶部信息条 ================= */
#hud{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  background:#fff;border:4px solid var(--p);border-radius:18px;padding:8px 14px;margin-bottom:12px;
  box-shadow:0 4px 0 rgba(0,0,0,.08);
}
#hud .title{font-weight:900;font-size:24px;color:var(--p);}
#hud .lv{font-weight:900;font-size:22px;background:var(--a);color:#fff;border-radius:12px;padding:2px 12px;}
#hud .right{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;}
.chip{background:var(--soft);border:3px solid var(--p);border-radius:12px;padding:2px 12px;font-weight:900;font-size:20px;}
.dots{display:flex;gap:6px;align-items:center;}
.dot{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #cbd5e1;}
.dot.ok{background:var(--a);border-color:var(--a);}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;}
button{
  font-family:inherit;font-size:20px;font-weight:900;color:#fff;background:var(--p);
  border:none;border-radius:14px;padding:8px 18px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.18);
}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18);}
button.warn{background:#d97706;}
button.ghost{background:#64748b;}
button.big{font-size:24px;padding:12px 30px;}

/* ================= 舞台 ================= */
#stage{
  background:#fff;border:4px solid var(--p);border-radius:20px;padding:16px;min-height:520px;position:relative;
  box-shadow:0 6px 0 rgba(0,0,0,.06);
}
.story{font-size:22px;font-weight:700;margin:2px 0 6px;}
.instr{
  background:var(--soft);border-left:10px solid var(--a);border-radius:10px;padding:8px 14px;margin:8px 0 14px;font-size:20px;
}
.tipbar{
  margin-top:16px;background:#fffbe8;border:3px dashed var(--a);border-radius:12px;padding:8px 12px;font-size:18px;
}
.msg{min-height:34px;font-size:20px;font-weight:900;color:var(--p);margin:6px 0;}
.msg.bad{color:#dc2626;}

/* 标题屏 */
.titleScreen{text-align:center;padding:30px 10px;}
.titleScreen h1{font-size:44px;color:var(--p);margin:8px 0;}
.titleScreen p{font-size:22px;}
.diffRow{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:24px 0;}
.diffCard{
  width:230px;background:#fff;border:5px solid var(--p);border-radius:20px;padding:16px 10px;cursor:pointer;
  box-shadow:0 6px 0 rgba(0,0,0,.12);transition:transform .15s;
}
.diffCard:hover{transform:translateY(-6px);}
.diffCard h2{margin:4px 0;color:var(--p);font-size:30px;}
.diffCard .stars{color:var(--a);font-size:26px;}
.diffCard p{font-size:18px;margin:6px 0 0;}

/* 关卡1：卡片墙 + 修补台 */
.wall{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;margin:10px 0 16px;}
.card{
  width:150px;background:#fff;border:4px solid #94a3b8;border-radius:16px;padding:8px 6px 4px;position:relative;
  cursor:grab;box-shadow:0 4px 0 rgba(0,0,0,.1);text-align:center;
}
.card svg{width:100%;height:auto;display:block;}
.card .tag{
  position:absolute;top:4px;left:6px;font-size:16px;font-weight:900;color:#fff;background:#94a3b8;border-radius:8px;padding:0 8px;
}
.card.fixed{border-color:var(--a);background:#fff7e6;}
.card.shake{animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.benchZone{display:flex;gap:20px;align-items:stretch;flex-wrap:wrap;justify-content:center;}
#bench{
  flex:1 1 420px;min-height:280px;border:5px dashed var(--p);border-radius:20px;background:var(--soft);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:14px;position:relative;text-align:center;
}
#bench.hot{background:#e7f6e7;border-color:#16a34a;}
#bench .ph{font-size:22px;font-weight:900;color:var(--p);}
#bench svg{max-width:100%;}
.sidePanel{flex:0 1 340px;display:flex;flex-direction:column;gap:10px;}
.panelBox{background:#fff;border:4px solid var(--p);border-radius:16px;padding:10px 12px;font-size:19px;}
.panelBox h3{margin:0 0 6px;color:var(--p);font-size:21px;}
.swatches{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;}
.swatch{width:52px;height:52px;border-radius:50%;border:4px solid #334155;cursor:pointer;}
.partsBox{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:8px;}
.partChip{
  width:64px;height:64px;background:#fff;border:4px solid var(--a);border-radius:14px;display:flex;align-items:center;justify-content:center;
  cursor:grab;box-shadow:0 3px 0 rgba(0,0,0,.12);font-size:16px;font-weight:900;color:#92400e;
}
.refBox{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
.refBox .mini{width:92px;background:#fff;border:3px solid #cbd5e1;border-radius:12px;padding:4px;}

/* 关卡2 */
.pairRow{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:8px 0;}
.figBox{background:#fff;border:4px solid #94a3b8;border-radius:16px;padding:10px;text-align:center;min-width:150px;}
.figBox .lab{font-size:20px;font-weight:900;color:#fff;background:var(--p);border-radius:10px;display:inline-block;padding:0 12px;margin-bottom:6px;}
.bigArrow{font-size:44px;color:var(--a);font-weight:900;}
.workRow{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:14px 0;}
.workItem{background:#fff;border:4px solid var(--a);border-radius:16px;padding:10px;cursor:pointer;transition:transform .2s;}
.workItem svg{display:block;}
.workItem.pop{animation:pop .3s;}
@keyframes pop{50%{transform:scale(1.18);}}
.seqRow{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;margin:10px 0;}
.seqCell{width:110px;height:110px;background:#fff;border:4px solid #94a3b8;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;}
.seqCell.slot{border-style:dashed;border-color:var(--a);color:var(--a);}
.charCard{
  width:104px;height:120px;background:#fff;border:4px solid var(--p);border-radius:16px;text-align:center;cursor:grab;
  box-shadow:0 4px 0 rgba(0,0,0,.1);position:relative;
}
.charCard .ch{font-size:52px;font-weight:900;line-height:1.2;}
.charCard .cnt{font-size:18px;font-weight:900;color:#0e7490;min-height:24px;}
.charCard.shake{animation:shake .4s;}
.grid9{display:grid;grid-template-columns:repeat(3,118px);gap:12px;justify-content:center;margin:8px auto;}
.g9cell{width:118px;height:100px;background:#fff;border:4px solid #94a3b8;border-radius:12px;display:flex;align-items:center;justify-content:center;}
.g9cell.que{border-style:dashed;border-color:var(--a);}
.rowLab{writing-mode:vertical-lr;font-size:17px;font-weight:900;color:#fff;background:var(--p);border-radius:8px;padding:4px 2px;margin:auto 0;}
.candRow{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:12px 0;}
.candCard{background:#fff;border:4px solid var(--p);border-radius:14px;padding:6px;cursor:grab;box-shadow:0 4px 0 rgba(0,0,0,.1);}
.toolBox{display:flex;align-items:center;gap:12px;justify-content:center;margin:8px 0;}
.magnifier{
  width:74px;height:74px;border-radius:50%;border:7px solid #0e7490;background:radial-gradient(circle,#e0f2fe 60%,#bae6fd);
  cursor:grab;position:relative;box-shadow:0 4px 8px rgba(0,0,0,.2);
}
.magnifier::after{content:"";position:absolute;right:-14px;bottom:-20px;width:16px;height:34px;background:#0e7490;border-radius:8px;transform:rotate(-40deg);}
.verdict{font-size:20px;font-weight:900;color:#0e7490;background:#e0f2fe;border:3px solid #0e7490;border-radius:12px;padding:4px 14px;}

/* 关卡3 */
.buildRow{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:8px 0;}
.bCell{width:150px;height:150px;background:#fff;border:4px solid #94a3b8;border-radius:16px;padding:6px;}
.bCell.target{border:5px dashed var(--a);background:#fffbeb;}
.bCell svg{width:100%;height:100%;}
.sliderRow{display:flex;align-items:center;gap:14px;justify-content:center;margin:14px 0;flex-wrap:wrap;}
input[type=range]{width:300px;height:14px;-webkit-appearance:none;appearance:none;background:var(--soft);border-radius:8px;border:3px solid var(--p);outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:var(--a);border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);cursor:pointer;}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--a);border:4px solid #fff;cursor:pointer;}

/* 拖拽幽灵 */
#ghost{position:fixed;pointer-events:none;z-index:99;opacity:.9;transform:translate(-50%,-50%) scale(1.05);}
/* 弹层 */
.overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px;
}
.modal{
  background:#fff;border:6px solid var(--p);border-radius:22px;max-width:760px;width:100%;padding:22px 26px;max-height:86vh;overflow:auto;
}
.modal h2{color:var(--p);margin:0 0 10px;font-size:30px;}
.modal p,.modal li{font-size:20px;}
.modal .close{margin-top:14px;}
/* 通关庆祝 */
#fx{position:fixed;inset:0;pointer-events:none;z-index:70;}
#winScreen{text-align:center;padding:20px 0;}
#winScreen h1{font-size:46px;color:var(--a);}
#winScreen .stat{font-size:26px;font-weight:900;margin:6px 0;}
.starline{font-size:40px;color:var(--a);letter-spacing:6px;margin:10px 0;}
/* 过场 */
.interlude{text-align:center;padding:60px 10px;}
.interlude h1{font-size:40px;color:var(--p);}
.toast{
  position:fixed;left:50%;top:14%;transform:translateX(-50%);z-index:90;pointer-events:none;
  background:var(--a);color:#fff;font-size:26px;font-weight:900;border-radius:18px;padding:12px 30px;box-shadow:0 6px 14px rgba(0,0,0,.25);
}
@media (max-width:760px){
  body{font-size:18px;}
  #hud .title{font-size:20px;}
  .card{width:118px;}
  .bCell{width:120px;height:120px;}
  .grid9{grid-template-columns:repeat(3,96px);}
  .g9cell{width:96px;height:84px;}
  .charCard{width:86px;height:104px;}
  .charCard .ch{font-size:42px;}
}
</style>
</head>
<body>
<div id="wrap">
  <div id="app"></div>
</div>
<canvas id="fx"></canvas>

<script>
/* =========================================================================
   观察与思考 · 图形迷阵闯关
   内容依据：E1b一下《十大数学能力》第10讲
     第1关 找不同图形（点与阴影的位置关系 / 边数 / 朝向 / 数量 / 颜色）
     第2关 找图形特征（回形针大小互换 / 旋转 / 换位 / 汉字笔画数 / 曲直线与笔画数）
     第3关 找规律（小乌龟各部位依次增加 / 位置循环 / 颜色循环 / 大小递增 / 旋转规律）
   所有关卡都以“动手操作”为核心：拖拽、旋转、涂色、增减、拼搭，操作本身就是思考。
   ========================================================================= */
"use strict";

/* ---------------- 小工具 ---------------- */
function $(s){return document.querySelector(s);}
function el(tag,cls,html){var d=document.createElement(tag);if(cls)d.className=cls;if(html!=null)d.innerHTML=html;return d;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function ri(n){return Math.floor(Math.random()*n);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
/* 点是否在三角形内（向量同侧法） */
function ptInTri(px,py,ax,ay,bx,by,cx,cy){
  var d1=(px-bx)*(ay-by)-(ax-bx)*(py-by);
  var d2=(px-cx)*(by-cy)-(bx-cx)*(py-cy);
  var d3=(px-ax)*(cy-ay)-(cx-ax)*(py-ay);
  var neg=(d1<0)||(d2<0)||(d3<0);
  var pos=(d1>0)||(d2>0)||(d3>0);
  return !(neg&&pos);
}

/* ---------------- 主题色板（G8 每局随机） ---------------- */
var PALETTES=[
  {p:"#2563eb",bg:"#eaf2ff",a:"#f59e0b",soft:"#d7e4ff"},
  {p:"#16a34a",bg:"#eefdf3",a:"#f97316",soft:"#cdeeda"},
  {p:"#ea580c",bg:"#fff3e8",a:"#0e7490",soft:"#ffdcc2"},
  {p:"#7c3aed",bg:"#f4f0ff",a:"#ec4899",soft:"#e2d6fb"},
  {p:"#0e7490",bg:"#e8fbff",a:"#e11d48",soft:"#c5effa"}
];
function applyTheme(){
  var t=pick(PALETTES);
  var r=document.documentElement.style;
  r.setProperty("--p",t.p);r.setProperty("--bg",t.bg);r.setProperty("--a",t.a);r.setProperty("--soft",t.soft);
}

/* ---------------- 通用拖拽（鼠标 + 触摸，G11） ---------------- */
/* ghostDrag：拖动一个节点的“幽灵副本”，松手时回调 onDrop(x,y,ghost) */
function ghostDrag(node,onDrop,onMove){
  function begin(x,y){
    var g=node.cloneNode(true);g.id="ghost";
    g.style.width=Math.min(node.offsetWidth,140)+"px";
    document.body.appendChild(g);move(x,y);
    document.body.classList.add("noselect");
    function move(mx,my){g.style.left=mx+"px";g.style.top=my+"px";if(onMove)onMove(mx,my,g);}
    function end(mx,my){
      document.removeEventListener("mousemove",mm);document.removeEventListener("mouseup",mu);
      document.removeEventListener("touchmove",tm);document.removeEventListener("touchend",tu);
      document.body.classList.remove("noselect");
      var ok=false; if(onDrop)ok=onDrop(mx,my,g);
      if(!ok){g.remove();}else{g.remove();}
    }
    function mm(e){move(e.clientX,e.clientY);}
    function mu(e){end(e.clientX,e.clientY);}
    function tm(e){if(e.touches.length>0){e.preventDefault();move(e.touches[0].clientX,e.touches[0].clientY);}}
    function tu(e){var t=e.changedTouches[0];end(t.clientX,t.clientY);}
    document.addEventListener("mousemove",mm);document.addEventListener("mouseup",mu);
    document.addEventListener("touchmove",tm,{passive:false});document.addEventListener("touchend",tu);
  }
  node.addEventListener("mousedown",function(e){e.preventDefault();begin(e.clientX,e.clientY);});
  node.addEventListener("touchstart",function(e){if(e.touches.length>0){e.preventDefault();begin(e.touches[0].clientX,e.touches[0].clientY);}},{passive:false});
}
/* dropOn：指针处是否落在某节点内 */
function dropOn(x,y,node){
  var r=node.getBoundingClientRect();
  return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;
}

/* ---------------- SVG 图形库 ---------------- */
function svgWrap(inner,vb){return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="'+vb+'">'+inner+'</svg>';}
/* 五角星路径 */
function starPath(cx,cy,r){
  var pts=[],i,a;for(i=0;i<10;i++){a=-Math.PI/2+i*Math.PI/5;var rr=i%2===0?r:r*0.45;
  pts.push((cx+rr*Math.cos(a)).toFixed(1)+","+(cy+rr*Math.sin(a)).toFixed(1));}
  return pts.join(" ");
}
/* 关1类型A：正方形分成4个一样的三角形，其中一个有阴影、另一个里有一个点 */
var SQ_TRI=[[0,0],[100,0],[100,100],[0,100]],CENTER=[50,50];
function triPoly(i){ /* 0上 1右 2下 3左 的三角形顶点 */
  if(i===0)return "0,0 100,0 50,50";
  if(i===1)return "100,0 100,100 50,50";
  if(i===2)return "0,100 100,100 50,50";
  return "0,0 0,100 50,50";
}
function triCen(i){return [[50,26],[74,50],[50,74],[26,50]][i];}
function figSquareDot(shadow,dot,r){
  var s='<rect x="3" y="3" width="94" height="94" fill="#fff" stroke="#1f2937" stroke-width="5"/>';
  s+='<line x1="3" y1="3" x2="97" y2="97" stroke="#1f2937" stroke-width="4"/>';
  s+='<line x1="97" y1="3" x2="3" y2="97" stroke="#1f2937" stroke-width="4"/>';
  s+='<polygon points="'+triPoly(shadow)+'" fill="#9ca3af" stroke="#4b5563" stroke-width="2"/>';
  var c=triCen(dot);
  s+='<circle cx="'+c[0]+'" cy="'+c[1]+'" r="'+(r||8)+'" fill="#111827"/>';
  return svgWrap(s,"0 0 100 100");
}
function oppTri(i){return (i+2)%4;}
/* 箭头（朝上） */
function figArrow(rot,fill){
  return svgWrap('<g transform="rotate('+(rot||0)+' 50 50)"><polygon points="50,8 72,46 58,46 58,90 42,90 42,46 28,46" fill="'+(fill||"#e11d48")+'" stroke="#1f2937" stroke-width="4"/></g>',"0 0 100 100");
}
/* 小旗（旗杆+旗面，朝向清晰） */
function figFlag(rot,color){
  return svgWrap('<g transform="rotate('+(rot||0)+' 50 50)"><line x1="30" y1="12" x2="30" y2="88" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/><polygon points="34,16 82,30 34,46" fill="'+(color||"#2563eb")+'" stroke="#1f2937" stroke-width="4"/></g>',"0 0 100 100");
}
/* 数量卡：n 个星星/爱心/花点 */
function figCount(n,kind,color){
  var s="",i,x,y,w=100,col=5,rw=(100-12*col)/(col>5?col:5);
  var per=Math.min(n,5),rows=Math.ceil(n/5),k=0;
  var rr=clamp(90/Math.max(per,rows)/2.6,7,15);
  for(var row=0;row<rows;row++){
    var cnt=Math.min(n-k,5);
    for(i=0;i<cnt;i++){
      x=50+(i-(cnt-1)/2)*((90-rr)/Math.max(cnt-1,1)||0);
      if(cnt===1)x=50;
      y=50+(row-(rows-1)/2)*34;
      if(kind==="star")s+='<polygon points="'+starPath(x,y,rr+3)+'" fill="'+color+'" stroke="#1f2937" stroke-width="2.5"/>';
      else if(kind==="heart")s+='<path d="M '+x+' '+(y+rr)+' C '+(x-rr*1.8)+' '+(y-rr)+' '+(x-rr*0.7)+' '+(y-rr*1.5)+' '+x+' '+(y-rr*0.4)+' C '+(x+rr*0.7)+' '+(y-rr*1.5)+' '+(x+rr*1.8)+' '+(y-rr)+' '+x+' '+(y+rr)+' Z" fill="'+color+'" stroke="#1f2937" stroke-width="2.5"/>';
      else s+='<circle cx="'+x+'" cy="'+y+'" r="'+(rr+1)+'" fill="'+color+'" stroke="#1f2937" stroke-width="2.5"/><circle cx="'+x+'" cy="'+y+'" r="'+(rr*0.35)+'" fill="#fff" stroke="none"/>';
      k++;
    }
  }
  return svgWrap('<rect x="3" y="3" width="94" height="94" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="3"/>'+s,"0 0 100 100");
}
/* 嵌套图形：外形 + 内部小图形（颜色可变） */
var NEST_OUT={
  tri:"50,8 92,86 8,86", sq:"12,12 88,12 88,88 12,88", hex:"50,8 88,29 88,71 50,92 12,71 12,29",
  cir:null
};
function figNest(outer,innerColor){
  var s="";
  if(outer==="cir")s+='<circle cx="50" cy="50" r="44" fill="#fdba74" stroke="#1f2937" stroke-width="4"/>';
  else s+='<polygon points="'+NEST_OUT[outer]+'" fill="#fdba74" stroke="#1f2937" stroke-width="4"/>';
  s+='<circle cx="50" cy="50" r="14" fill="'+innerColor+'" stroke="#1f2937" stroke-width="3"/>';
  return svgWrap(s,"0 0 100 100");
}
/* 多边形家族（第3类：边数找不同） */
var POLYS={
  triangle:"50,10 90,85 10,85",
  rect:"14,28 86,28 86,72 14,72",
  square:"16,16 84,16 84,84 16,84",
  para:"24,22 88,22 76,78 12,78",
  trap:"22,26 78,26 92,80 8,80"
};
function figPoly(kind,fill){

/* ---------------- 游戏流程 ---------------- */
function startGame(diff){
  G.diff=diff;G.level=0;G.ridx=0;G.stars=0;G.steps=0;G.wrong=0;G.revealed=false;
  app.innerHTML="";renderShell();$("#btnReveal").style.display="";
  startTimer();
  startLevel(0);
}
function levelRounds(li){
  var d=DIFFS[G.diff],t,i,out=[];
  if(li===0){
    t=d.l1.slice();
    for(i=0;i<t.length;i++){
      if(t[i]==="cntcol")t[i]=pick(["cnt","col"]);
      out.push(makeL1(t[i],d.cards));
    }
  }else if(li===1){
    t=d.l2.slice();
    for(i=0;i<t.length;i++){
      out.push(makeL2(t[i]));
    }
  }else{
    t=d.l3.slice();
    for(i=0;i<t.length;i++)out.push(makeL3(t[i]));
  }
  return out;
}
function startLevel(li){
  G.level=li;G.ridx=0;G.rounds=levelRounds(li);G.wrong=0;G.revealed=false;hud();
  var stage=$("#stage");
  var story=[
   "迷阵守护者说：“先把墙上那张与众不同的图形找出来，修补好它，第一道门就开啦！”",
   "当心，第二道关卡来啦！看看图形们是“怎样变化”的，再让 C 也照着变身吧！",
   "最后一道关卡！观察前面图形的规律，亲手搭出下一个图形吧！"
  ][li];
  stage.innerHTML='<div class="interlude"><h1>'+LV_NAMES[li]+' · '+LV_SUB[li]+'</h1><p style="font-size:24px">'+story+'</p>'+
    '<button class="big" id="goBtn">开始闯关</button></div>';
  $("#goBtn").onclick=nextRound;
}
function nextRound(){
  if(G.ridx>=G.rounds.length){
    if(G.level<2){G.level++;startLevel(G.level);}

  G.wrong=0;G.revealed=false;
  G.round=G.rounds[G.ridx];
  var stage=$("#stage");
  stage.innerHTML='<div class="story">'+LV_NAMES[G.level]+' · '+LV_SUB[G.level]+'</div>'+
    '<div class="instr">'+G.round.instr+'</div><div class="msg" id="msg"></div><div id="roundBody"></div>'+

/* 小闪光：用 DOM + CSS 过渡实现的彩色碎星迸发（不占用 canvas，稳定流畅） */
function sparkleAt(x,y){
  var i,cols=["#f59e0b","#e11d48","#2563eb","#16a34a"];
  for(i=0;i<16;i++){
    var d=document.createElement("div");
    var ang=Math.random()*Math.PI*2,dist=70+Math.random()*90;
    d.style.cssText="position:fixed;z-index:95;pointer-events:none;border-radius:3px;"+
      "width:"+(7+Math.random()*8).toFixed(0)+"px;height:"+(7+Math.random()*8).toFixed(0)+"px;"+
      "background:"+cols[ri(cols.length)]+";left:"+x+"px;top:"+y+"px;opacity:1;"+
      "transition:transform .8s cubic-bezier(.2,.7,.3,1),opacity .8s ease-out;";
    document.body.appendChild(d);
    (function(dd,dx,dy,rot){
      requestAnimationFrame(function(){
        dd.style.transform="translate("+dx.toFixed(0)+"px,"+dy.toFixed(0)+"px) rotate("+rot+"deg) scale(.6)";
        dd.style.opacity="0";

function fxLoop(){
  if(!fxRun){fxc.clearRect(0,0,fx.width,fx.height);parts=[];return;}
  fxc.clearRect(0,0,fx.width,fx.height);
  var keep=[],i,p;
  for(i=0;i<parts.length;i++){
    p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.02;p.a+=p.va;
    if(p.y<fx.height+30){
      fxc.save();fxc.translate(p.x,p.y);fxc.rotate(p.a);
      fxc.fillStyle=p.c;
      fxc.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.62);
      fxc.restore();keep.push(p);
    }
  }
  parts=keep;
  if(parts.length===0){fxRun=false;fxc.clearRect(0,0,fx.width,fx.height);return;}
  requestAnimationFrame(fxLoop);
}

/* =========================================================================
   第1关：找不同图形 · 图形修补馆
   卡片墙 + 修补台。拖对“与众不同”的图形上台，再动手修补它。
   ========================================================================= */
function makeL1(type,nCards){
  var R={type:"l1_"+type};
  var cards=[],i,oddIdx=ri(nCards),meta={};
  var why="";
  if(type==="dot"){
    /* 题卡复刻：点与阴影“相对”，与众不同的那张是“相邻” */
    for(i=0;i<nCards;i++){
      var sh=ri(4),dt;
      if(i===oddIdx){dt=(sh+1)%4;if(Math.random()<0.5)dt=(sh+3)%4;}
      else dt=oppTri(sh);
      cards.push({svg:figSquareDot(sh,dt),odd:i===oddIdx});
    }
    meta.shShadow=ri(4);meta.shDot=oppTri(meta.shShadow);
    meta.oddShadow=ri(4);var adj=[(meta.oddShadow+1)%4,(meta.oddShadow+3)%4];meta.oddDot=pick(adj);
    cards[oddIdx].svg=figSquareDot(meta.oddShadow,meta.oddDot);
    why="大家都是“点和阴影相对”，只有左起第"+CN_NUM[oddIdx]+"张是“点和阴影相邻”。";
    R.instr="每张卡片都是一个正方形，被分成了四个一样的三角形：其中一个三角形有阴影，另一个三角形里有一个点。先找出大家相同的特征，再找出与众不同的那一张，把它拖到修补台上，然后把点拖到正确的三角形里。";
    R.explainStr=why+"修补方法：按住黑色的点，把它拖到阴影<b>对面</b>的三角形里，让点和阴影相对。";
  }else if(type==="vertex"){
    /* 边数找不同：大家是三角形，它多了一条边（四边形）；修补=把闪光顶点拖到旁边顶点合并 */
    var famFills=["#a7f3d0","#bfdbfe","#fed7aa","#ddd6fe","#fbcfe8"];
    var triKinds=["triangle"];
    for(i=0;i<nCards;i++){
      if(i===oddIdx){cards.push({svg:figPoly(pick(["rect","square","para","trap"]),"#fef08a"),odd:true});}
      else{
        var f=famFills[i%famFills.length];
        var ang=ri(4)*90;
        cards.push({svg:svgWrap('<g transform="rotate('+ang+' 50 50)"><polygon points="'+POLYS.triangle+'" fill="'+f+'" stroke="#1f2937" stroke-width="5"/></g>',"0 0 100 100"),odd:false});
      }
    }
    why="数一数边数：大家都是三角形（3条边），只有左起第"+CN_NUM[oddIdx]+"张是四边形（4条边）。";
    R.instr="先数一数每张图形的边数，找出和伙伴们不一样的那一张，把它拖到修补台上，再按住闪光的顶点，把它拖到旁边的顶点上合在一起，变成三角形。";
    R.explainStr=why+"修补方法：抓住闪光的顶点，拖到旁边的顶点上合并，四条边就变回三条边啦。";
  }else if(type==="rot"){
    /* 朝向找不同：大家都朝同一方向，它转了向 */
    var base=pick([0,90,180,270]);
    var off=pick([90,270]);
    var figKind=pick(["arrow","flag"]);
    var fill=pick(COLS);
    meta.base=base;meta.off=off;meta.fill=fill;meta.kind=figKind;
    for(i=0;i<nCards;i++){
      var rot=i===oddIdx?(base+off)%360:base;
      cards.push({svg:figKind==="arrow"?figArrow(rot,fill):figFlag(rot,fill),odd:i===oddIdx});
    }
    meta.base=base;meta.off=off;
    why="看看方向：大家都朝“"+cnDir(base)+"”，只有左起第"+CN_NUM[oddIdx]+"张朝“"+cnDir((base+off)%360)+"”。";
    R.instr="看一看每张图形的朝向，找出转向不同的那一张，把它拖到修补台上，再按住图形转动它，转到和大家朝同一个方向。";
    R.explainStr=why+"修补方法：按住图形拖动旋转，让它转回朝“"+cnDir(base)+"”。";
  }else if(type==="cnt"){
    /* 数量找不同：大家个数相同，它多/少一个 */
    var n=3+ri(3);var m=Math.random()<0.5?n+1:n-1;m=clamp(m,2,7);
    var kind=pick(["star","heart","flower"]);var col=pick(COLS);
    for(i=0;i<nCards;i++){
      cards.push({svg:figCount(i===oddIdx?m:n,kind,col),odd:i===oddIdx});
    }
    meta.n=n;meta.m=m;meta.kind=kind;meta.col=col;
    why="数一数个数：大家都是"+n+"个，只有左起第"+CN_NUM[oddIdx]+"张是"+m+"个。";
    R.instr="数一数每张卡片里图形的个数，找出个数不同的那一张，拖到修补台上。点一点空的地方可以增加图形，点图形本身可以减少图形，把它增减到和大家一样多。";
    R.explainStr=why+"修补方法：点空白处增加，点图形减少，变成"+n+"个。";
  }else{ /* col 颜色找不同：外形各不相同做“掩护”，只有内部小圆的颜色是共同特征 */
    var outs=["tri","sq","hex","cir"];var ci=ri(4);var cc=COLS[ci];
    var ci2=(ci+1+ri(3))%4;var cc2=COLS[ci2];
    var order=shuffle([0,1,2,3]);
    for(i=0;i<nCards;i++){
      var useC=i===oddIdx?cc2:cc;
      if(i===oddIdx)meta.oddOuter=outs[order[i%4]];
      cards.push({svg:figNest(outs[order[i%4]],useC),odd:i===oddIdx});
    }
    meta.cc=cc;meta.cc2=cc2;
    var cnColor=function(c){return {"#e11d48":"红色","#2563eb":"蓝色","#16a34a":"绿色","#f59e0b":"黄色"}[c];};
    why="比一比颜色：大家里面的小圆都是"+cnColor(cc)+"，只有左起第"+CN_NUM[oddIdx]+"张是"+cnColor(cc2)+"。";
    R.instr="每张卡片里都有一个橙色大图形，里面藏着一个小圆。比一比小圆的颜色，找出颜色不同的那一张，拖到修补台上，再点击下面的色盘，把它刷成正确的颜色。";
    R.explainStr=why+"修补方法：点击色盘中"+cnColor(cc)+"的圆点，刷成一样的颜色。";
  }
  R.cards=cards;R.oddIdx=oddIdx;R.meta=meta;
  R.explain=function(){return R.explainStr;};
  R.mount=function(box){
    /* 卡片墙 */
    var wall=el("div","wall");
    cards.forEach(function(c,i){
      var card=el("div","card",'<span class="tag">第'+CN_NUM[i]+'张</span>'+c.svg);
      card._idx=i;
      ghostDrag(card,function(x,y,g){
        step();
        var bench=$("#bench");
        if(bench&&dropOn(x,y,bench)){
          if(c.fixed){setMsg("这张已经修补好啦！",false);return false;}
          if(!c.odd){
            oops();card.classList.add("shake");
            setTimeout(function(){card.classList.remove("shake");},450);
            setMsg("左起第"+CN_NUM[i]+"张和大家的特征一致，先送它回去，再仔细比一比！",true);
            return false;
          }
          card.classList.add("fixed");
          openBench(box,R,i,card);
          return false;
        }
        return false;
      });
      wall.appendChild(card);
    });
    box.appendChild(wall);
    /* 修补台 */
    var bz=el("div","benchZone");
    bz.innerHTML='<div id="bench"><div class="ph">修补台</div><div style="font-size:19px">把“与众不同”的图形拖到这里，再动手修补它</div></div>'+
      '<div class="sidePanel" id="sidePanel"></div>';
    box.appendChild(bz);
    setMsg("先观察：大家相同的地方在哪里？哪一张不一样？");
  };
  return R;
}

/* 参考面板：展示几张"和大家一致"的卡片，方便对照修补 */

function openBench(box,R,idx,card){

    var done=false;
    var curDot=meta.oddDot;
    function localPt(x,y){

    }
    function relText(){

    function onDown(e){

        var p=evPos(ev),pt=localPt(p[0],p[1]),hit=-1,t;
        for(t=0;t<4;t++){
          var a=[[0,0],[100,0],[100,100],[0,100]][t];
          var b=[[0,0],[100,0],[100,100],[0,100]][(t+1)%4];

    relText();
  }else if(R.type==="l1_vertex"){

    bench.appendChild(el("div","",'<div style="font-size:20px;font-weight:900;color:#166534">按住闪光的顶点，拖到旁边绿圈顶点上，合成一个三角形</div>'));

/* 通用：按住拖动旋转的绑定（返回持有者） */
function bindRotate(holder,getRot,setRot,onSnap){
  function down(e){
    e.preventDefault();
    var svg=holder.querySelector("svg"),r=svg.getBoundingClientRect();
    var cx=r.left+r.width/2,cy=r.top+r.height/2;
    var sx=e.touches&&e.touches.length>0?e.touches[0].clientX:e.clientX;
    var sy=e.touches&&e.touches.length>0?e.touches[0].clientY:e.clientY;
    var startA=Math.atan2(sy-cy,sx-cx)*180/Math.PI,startR=getRot();
    function mv(ev){
      var x=ev.touches&&ev.touches.length>0?ev.touches[0].clientX:ev.clientX;
      var y=ev.touches&&ev.touches.length>0?ev.touches[0].clientY:ev.clientY;
      var a=Math.atan2(y-cy,x-cx)*180/Math.PI;
      setRot(Math.round((startR+a-startA)/15)*15);
      if(holder._onchange)holder._onchange();
    }
    function up(ev){
      document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);
      document.removeEventListener("touchmove",mvT);document.removeEventListener("touchend",up);
      step();
      onSnap(((Math.round(getRot()/45)*45)%360+360)%360);
    }
    var mvT=function(ev){if(ev.touches.length>0){ev.preventDefault();mv(ev.touches[0]);}};
    document.addEventListener("mousemove",mv);document.addEventListener("mouseup",up);
    document.addEventListener("touchmove",mvT,{passive:false});document.addEventListener("touchend",up);
  }
  holder.addEventListener("mousedown",down);
  holder.addEventListener("touchstart",function(e){e.preventDefault();down(e);},{passive:false});
  holder.style.cursor="grab";
  return holder;
}

  box.appendChild(replay);
  var wb=el("div");wb.id="workArea";
  box.appendChild(wb);
  R.work(wb);
}

/* =========================================================================
   第3关：找规律 · 规律搭建台
   观察前三个图形的规律，动手搭出第四个。
   ========================================================================= */
function makeL3(type){
  var R={type:"l3_"+type};
  R.explain=function(){return R.explainStr;};

  if(type==="count"||type==="countB"){
    /* 题卡复刻：小乌龟（或小鱼）身上点的数量依次多1；高级版腿也依次增加 */
    var creature=pick(["turtle","fish"]);
    var start=1+ri(2); /* 第一格的点数 */
    var stepN=type==="countB"?1:1;
    var tDots=start+3*stepN; /* 第四格点数 */
    var withLegs=(type==="countB"&&creature==="turtle");
    var tLegs=4;
    R.instr=(creature==="turtle"
      ?"小乌龟的头和身体一直都在。看一看：身上点的个数是怎样变化的？"+(withLegs?"腿又有什么变化？":"")+"再从零件盒里拖出点点"+(withLegs?"和腿腿":"")+"，搭出第四只小乌龟！点一下已放好的零件可以收回。"
      :"小鱼的头和尾巴一直都在。看一看：身边的泡泡是怎样变化的？再从零件盒里拖出泡泡，搭出第四条小鱼！点一下已放好的泡泡可以收回。");
    R.explainStr=(creature==="turtle"
      ?"规律：身上的点每次多"+CN_NUM[stepN]+"个（"+start+"、"+(start+1)+"、"+(start+2)+"），第四只应该有"+tDots+"个点"+(withLegs?"；腿每次多一条，第四只应该长齐"+tLegs+"条腿，还会长出小尾巴":"")+"."
      :"规律：泡泡每次多"+CN_NUM[stepN]+"个（"+start+"、"+(start+1)+"、"+(start+2)+"），第四条鱼应该有"+tDots+"个泡泡。").replace(".","。");
    R.mount=function(box){
      var row=el("div","buildRow");
      function cellFig(dots,legs){
        if(creature==="turtle")return figTurtle(dots,legs||0,legs>=4);
        return figFish(dots);
      }
      row.appendChild(el("div","bCell",cellFig(start,withLegs?1:0)));
      row.appendChild(el("div","bCell",cellFig(start+1,withLegs?2:0)));
      row.appendChild(el("div","bCell",cellFig(start+2,withLegs?3:0)));
      var target=el("div","bCell target");target.id="buildTarget";
      target.innerHTML='<div style="height:100%;display:flex;align-items:center;justify-content:center">'+cellFig(0,0)+'</div><div style="text-align:center;font-size:17px;color:var(--a);font-weight:900">搭出第四个</div>';
      row.appendChild(target);
      box.appendChild(row);
      var caption=el("div","", '<div style="text-align:center;font-size:21px;font-weight:900" id="cntCap"></div>');
      box.appendChild(caption);
      var pb=el("div","panelBox");
      pb.innerHTML='<h3>零件盒（拖到上面的虚线格里）</h3><div class="partsBox" id="partsBox"></div>';
      box.appendChild(pb);
      var cur={dots:0,legs:0},done=false;
      var dotPlaced=[]; /* 已放置的点坐标 */
      function cap(){
        var s=(creature==="turtle"?"小乌龟身上现在有 "+cur.dots+" 个点":"小鱼身边现在有 "+cur.dots+" 个泡泡");
        if(withLegs)s+="，有 "+cur.legs+" 条腿";
        $("#cntCap").textContent=s;
      }
      function redraw(){
        var inner=target.querySelector("div");
        if(creature==="turtle")inner.innerHTML=figTurtle(dotPlaced.length,cur.legs,cur.legs>=4&&dotPlaced.length>=tDots);
        else inner.innerHTML=figFish(dotPlaced.length);
        /* 给已放置的点和腿绑定“点一下收回” */
        var svg=target.querySelector("svg");
        if(svg){
          var dots=svg.querySelectorAll("circle");
          /* 找到点（小圆且不在腿位）：乌龟最后 dotPlaced.length 个实心小圆是点 */
          var allC=svg.querySelectorAll("circle");
          /* 简化：通过标题层提示，点任意实心小圆收回一个点 */
          allC.forEach(function(c){
            if(c.getAttribute("fill")==="#15803d"||c.getAttribute("fill")==="#e0f2fe"){
              c.style.cursor="pointer";
              c.onclick=function(ev){ev.stopPropagation();if(done)return;if(cur.dots>0){cur.dots--;dotPlaced.pop();step();redraw();cap();}};
            }
          });
          var rects=svg.querySelectorAll("rect");
          rects.forEach(function(rc){
            rc.style.cursor="pointer";
            rc.onclick=function(ev){ev.stopPropagation();if(done||!withLegs)return;if(cur.legs>0){cur.legs--;step();redraw();cap();}};
          });
        }
      }
      /* 零件盒 */
      var pbox=$("#partsBox");
      function makeChip(kind){
        var chip=el("div","partChip");
        chip.innerHTML=kind==="dot"
          ?svgWrap('<circle cx="30" cy="30" r="12" fill="#166534"/>',"0 0 60 60")
          :svgWrap('<rect x="22" y="14" width="16" height="32" rx="8" fill="#4ade80" stroke="#166534" stroke-width="3"/>',"0 0 60 60");
        chip._kind=kind;
        ghostDrag(chip,function(x,y){
          if(done)return false;
          if(!dropOn(x,y,target))return false;
          step();
          if(kind==="dot"){
            if(cur.dots>=7){setMsg("最多放 7 个点啦",true);return false;}
            cur.dots++;dotPlaced.push(true);
          }else{
            if(!withLegs){setMsg("这一轮不需要腿腿哦",true);return false;}
            if(cur.legs>=4){setMsg("腿已经长齐 4 条啦",true);return false;}
            cur.legs++;
          }
          redraw();cap();
          var okD=cur.dots===tDots;
          var okL=!withLegs||cur.legs===tLegs;
          if(okD&&okL){
            done=true;
            setMsg("搭好啦！"+(creature==="turtle"?"第四只小乌龟长出了 "+tDots+" 个点"+(withLegs?"和 4 条腿，还有小尾巴！":"！"):"第四条小鱼有 "+tDots+" 个泡泡！"));
            sparkleAt(window.innerWidth/2,window.innerHeight*0.5);
            setTimeout(roundDone,900);
          }else{
            setMsg("继续观察前面三个的规律，看还差什么。");
          }
          return false;
        });
        return chip;
      }
      pbox.appendChild(makeChip("dot"));
      if(withLegs)pbox.appendChild(makeChip("leg"));
      pbox.appendChild(el("div","",'<div style="font-size:16px;color:#64748b;width:130px">点一下已放好的零件<br>可以把它收回来</div>'));
      cap();redraw();
      setMsg("先数一数前面三个：点的个数是怎样变化的？");
    };
  }else if(type==="posc"){
    /* 位置循环：星星沿四个角按同一方向移动 */
    var corners=["tl","tr","br","bl"];
    var startI=ri(4),dir=pick([1,3]); /* 1顺时针 3逆时针 */
    var seqC=[corners[startI],corners[(startI+dir)%4],corners[(startI+2*dir)%4]];
    var tgt=corners[(startI+3*dir)%4];
    R.instr="看一看：小星星在四个角之间是怎样移动的（顺着同一个方向转圈圈）？再把下面的星星拖到第四格里它应该到的角落。";
    R.explainStr="规律：星星每次按"+(dir===1?"顺时针":"逆时针")+"方向移动一个角。第四格它应该走到“"+cornerCN(tgt)+"”角。";
    R.mount=function(box){
      var row=el("div","buildRow");
      seqC.forEach(function(cnr){row.appendChild(el("div","bCell",figCornerStar(cnr)));});
      var t=el("div","bCell target");t.id="posTarget";
      t.innerHTML='<div id="posInner" style="width:100%;height:100%"></div>';
      row.appendChild(t);
      box.appendChild(row);
      var pb=el("div","panelBox");
      pb.innerHTML='<h3>零件盒</h3><div class="partsBox" id="partsBox2"></div>';
      box.appendChild(pb);
      function drawT(){
        $("#posInner").innerHTML=svgWrap(
          '<rect x="4" y="4" width="104" height="104" rx="12" fill="#fffbeb" stroke="#94a3b8" stroke-width="4"/>'+
          cornerMark(22,22)+cornerMark(84,22)+cornerMark(22,84)+cornerMark(84,84)+
          '<polygon id="posStar" points="'+starPath(56,56,20)+'" fill="#f59e0b" stroke="#1f2937" stroke-width="3"/>',
          "0 0 112 112");
      }
      drawT();
      var chip=el("div","partChip");
      chip.innerHTML=svgWrap('<polygon points="'+starPath(30,30,18)+'" fill="#f59e0b" stroke="#1f2937" stroke-width="3"/>',"0 0 60 60");
      $("#partsBox2").appendChild(chip);
      var done=false,placed=false;
      ghostDrag(chip,function(x,y){
        if(done||!dropOn(x,y,t))return false;
        var svg=$("#posInner").querySelector("svg"),r=svg.getBoundingClientRect();
        var px=(x-r.left)/r.width*112,py=(y-r.top)/r.height*112;
        var zones={tl:[22,22],tr:[84,22],br:[84,84],bl:[22,84]};
        var best=null,bd=1e9;
        for(var k in zones){var d=Math.hypot(px-zones[k][0],py-zones[k][1]);if(d<bd){bd=d;best=k;}}
        if(bd>34){setMsg("拖到四个角的虚线框里",true);return false;}
        step();
        var star=$("#posStar");
        star.setAttribute("points",starPath(zones[best][0],zones[best][1],20));
        if(best===tgt){
          done=true;
          star.setAttribute("fill","#16a34a");
          setMsg("放对啦！星星走到了"+cornerCN(tgt)+"角。");
          sparkleAt(window.innerWidth/2,window.innerHeight*0.5);
          setTimeout(roundDone,800);
        }else{
          oops();
          setMsg("再看看它转圈圈的方向，下一个角是哪一个？",true);
          setTimeout(function(){star.setAttribute("points",starPath(56,56,20));},700);
        }
        return false;
      });
      setMsg("提示：盯住星星每次移动的方向。");
    };
  }else if(type==="colorc"){
    /* 颜色循环：红→黄→蓝 循环出现 */
    var cyc=shuffle(COLS).slice(0,3);
    var cnC=function(c){return {"#e11d48":"红色","#2563eb":"蓝色","#16a34a":"绿色","#f59e0b":"黄色"}[c];};
    var tgt=cyc[0];
    var distract=COLS.filter(function(c){return cyc.indexOf(c)<0;})[0];
    R.instr="看一看：爱心的颜色是按固定顺序一圈一圈循环出现的。给第四颗爱心涂上正确的颜色（点一下色盘里的颜色）。";
    R.explainStr="规律：颜色按“"+cnC(cyc[0])+"→"+cnC(cyc[1])+"→"+cnC(cyc[2])+"”的顺序循环，第四个又回到"+cnC(tgt)+"。";
    R.mount=function(box){
      var row=el("div","buildRow");
      cyc.forEach(function(cc){row.appendChild(el("div","bCell",figHeart(cc)));});
      var t=el("div","bCell target");t.id="colorTarget";
      row.appendChild(t);
      box.appendChild(row);
      var curC="#d1d5db",done=false;
      function drawT(){
        t.innerHTML=figHeart(curC);
      }
      drawT();
      var sw=el("div","swatches");sw.style.justifyContent="center";
      shuffle(cyc.concat([distract])).forEach(function(cc){
        var s=el("div","swatch");s.style.background=cc;
        s.onclick=function(){
          if(done)return;
          step();curC=cc;drawT();
          if(cc===tgt){
            done=true;setMsg("涂对啦！颜色又循环回"+cnC(tgt)+"。");
            sparkleAt(window.innerWidth/2,window.innerHeight*0.5);
            setTimeout(roundDone,800);
          }else{
            setMsg("再想一想：三个颜色是按什么顺序循环的？",true);
          }
        };
        sw.appendChild(s);
      });
      box.appendChild(el("div","",'<div style="text-align:center;font-size:19px">点击颜色，给第四颗爱心涂色</div>'));
      box.appendChild(sw);
      setMsg("看前三个颜色的顺序：谁在最前面？");
    };
  }else if(type==="sizegrow"){
    /* 大小递增：星星一次比一次大，用滑块调出最大的 */
    R.instr="看一看：星星一次比一次大。拖动滑块，把第四颗星星调到“下一个大小”。";
    R.explainStr="规律：星星每次都变大一些（小→中→大），第四个应该是最大的一颗。把滑块拉到最右边就对了。";
    R.mount=function(box){
      var row=el("div","buildRow");
      [0.5,0.75,1.0].forEach(function(sc){
        row.appendChild(el("div","bCell",figStarScale(sc)));
      });
      var t=el("div","bCell target");t.id="sizeTarget";
      row.appendChild(t);
      box.appendChild(row);
      function drawT(v){
        t.innerHTML=figStarScale(v/100);
      }
      var sr=el("div","sliderRow");
      sr.innerHTML='<span style="font-weight:900">小</span><input type="range" id="sizeSlider" min="30" max="130" value="30" step="1"><span style="font-weight:900">大</span>';
      box.appendChild(sr);
      var slider=sr.querySelector("input");
      var done=false;
      slider.addEventListener("input",function(){drawT(+slider.value);});
      var chk=setInterval(function(){
        if(done){clearInterval(chk);return;}
        var v=+slider.value;
        if(v>=118){
          done=true;step();
          setMsg("调好啦！第四颗星星最大，正好是下一个大小。");
          sparkleAt(window.innerWidth/2,window.innerHeight*0.5);
          setTimeout(roundDone,800);
        }
      },200);
      drawT(30);
      setMsg("拖动滑块，星星会跟着变大变小。");
    };
  }else{ /* rotc 旋转规律 */
    var dirR=pick([1,3]); /* 1顺 3逆 */
    var startR=ri(4)*90;
    var seqR=[startR,(startR+dirR*90)%360,(startR+2*dirR*90)%360];
    var tgtR=((startR+3*dirR*90)%360+360)%360;
    R.instr="看一看：箭头每次转动同样的角度（都是朝同一个方向转）。按住第四格的箭头拖动旋转，转到它下一个应该指向的方向。";
    R.explainStr="规律：箭头每次"+(dirR===1?"顺时针":"逆时针")+"转90度，第四个应该指向“"+cnDir(tgtR)+"”。";
    R.mount=function(box){
      var row=el("div","buildRow");
      var inner='<polygon points="50,8 72,46 58,46 58,90 42,90 42,46 28,46" fill="#e11d48" stroke="#1f2937" stroke-width="4"/>';
      seqR.forEach(function(rt){
        row.appendChild(el("div","bCell",svgWrap('<g transform="rotate('+((rt%360)+360)%360+' 50 50)">'+inner+'</g>',"0 0 100 100")));
      });
      var t=el("div","bCell target");t.id="rotTarget";
      t.innerHTML='<div id="rotHolder" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center"></div>';
      row.appendChild(t);
      box.appendChild(row);
      var cur=startR,done=false;
      var holder=$("#rotHolder");
      function drawT(){
        holder.innerHTML=svgWrap('<g opacity="0.22" transform="rotate('+tgtR+' 50 50)">'+inner+'</g><g transform="rotate('+cur+' 50 50)">'+inner+'</g><circle cx="50" cy="50" r="5" fill="#1f2937"/>',"0 0 100 100");
        holder.querySelector("svg").style.width="92%";
      }
      drawT();
      bindRotate(holder,function(){return cur;},function(v){cur=v;drawT();},function(snapped){
        if(done)return;
        if(snapped===tgtR){
          done=true;setMsg("转对啦！箭头指向"+cnDir(tgtR)+"。");
          sparkleAt(window.innerWidth/2,window.innerHeight*0.5);
          setTimeout(roundDone,800);
        }else{
          setMsg("现在指向"+cnDir(snapped)+"，再想想转的方向和角度",true);
        }
      });
      setMsg("注意：每次转的方向相同、角度相同。");
    };
  }
  return R;
}
