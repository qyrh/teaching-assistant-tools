<style>:root{--bg:#eaf4ff;--panel:#ffffff;--primary:#1976d2;--primary-d:#0d47a1;--accent:#ffb300;--odd:#e8641c;--even:#1e6fd9;--ink:#1c2733;--line:#c9d6e2}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0}body{font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;background:var(--bg);color:var(--ink);font-size:20px;line-height:1.5;user-select:none;-webkit-user-select:none;touch-action:manipulation}#app{max-width:1120px;margin:0 auto;padding:10px 14px 40px}#topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border:3px solid var(--primary);border-radius:18px;padding:10px 16px;margin-bottom:14px;box-shadow:0 4px 0 var(--primary-d)}#topbar .title{font-size:26px;font-weight:900;color:var(--primary-d);letter-spacing:2px}#hud{margin-left:auto;display:flex;align-items:center;gap:16px;font-weight:700;font-size:20px}#hud .pill{background:var(--bg);border:2px solid var(--primary);border-radius:999px;padding:4px 14px;white-space:nowrap}#hud .stars{color:var(--accent);letter-spacing:3px}.btn{font-family:inherit;font-size:20px;font-weight:700;color:#fff;background:var(--primary);border:none;border-radius:14px;padding:10px 20px;cursor:pointer;box-shadow:0 4px 0 var(--primary-d);transition:transform .08s}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--primary-d)}.btn.warn{background:var(--odd);box-shadow:0 4px 0 #a8430e}.btn.ghost{background:var(--panel);color:var(--primary-d);border:3px solid var(--primary);box-shadow:0 4px 0 var(--line)}.btn.small{font-size:17px;padding:7px 14px;border-radius:11px}.btn:disabled{opacity:.45;cursor:default}.screen{display:none;animation:fadeIn .35s}.screen.on{display:block}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}#screen-title{text-align:center;padding:40px 10px}#screen-title h1{font-size:52px;margin:18px 0 6px;color:var(--primary-d);text-shadow:0 3px 0 rgba(0,0,0,.08)}#screen-title .sub{font-size:24px;color:var(--ink);margin-bottom:8px}#screen-title .tip{font-size:18px;color:#5b6b7b;margin-bottom:26px}.crown{width:130px;height:130px}.diff-row{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:26px}.diff-card{flex:1 1 240px;max-width:300px;background:var(--panel);border:4px solid var(--primary);border-radius:22px;padding:22px 16px;text-align:center;cursor:pointer;box-shadow:0 6px 0 var(--primary-d);transition:transform .12s}.diff-card:hover{transform:translateY(-6px)}.diff-card h2{margin:8px 0 4px;font-size:28px;color:var(--primary-d)}.diff-card .dname{font-size:22px;font-weight:800;color:var(--odd)}.diff-card p{font-size:17px;color:#54626f;margin:10px 0 0}.diff-card svg{width:70px;height:70px}#mapGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:18px}.map-card{background:var(--panel);border:4px solid var(--primary);border-radius:20px;padding:18px 14px;text-align:center;cursor:pointer;box-shadow:0 5px 0 var(--primary-d);transition:transform .12s;position:relative}.map-card:hover{transform:translateY(-5px)}.map-card h3{margin:8px 0 4px;font-size:22px;color:var(--primary-d)}.map-card p{font-size:16px;color:#54626f;margin:6px 0 12px}.map-card .badge{font-size:20px;font-weight:800}.map-card .badge.got{color:#2e9e44}.map-card .badge.not{color:#9aa7b2}.map-card svg{width:64px;height:64px}.map-card.done{border-color:#2e9e44;box-shadow:0 5px 0 #1d6e30}h2.sec{font-size:30px;color:var(--primary-d);text-align:center;margin:10px 0}p.sec-sub{text-align:center;font-size:18px;color:#54626f;margin:0 0 8px}.station{background:var(--panel);border:4px solid var(--primary);border-radius:22px;padding:18px;margin-top:6px;position:relative;overflow:hidden}.station .mission{background:var(--bg);border:3px dashed var(--primary);border-radius:16px;padding:12px 16px;font-size:21px;font-weight:700;margin-bottom:16px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 16px}.tag{display:inline-block;font-size:16px;font-weight:800;border-radius:999px;padding:2px 12px;color:#fff;vertical-align:middle}.tag.odd{background:var(--odd)}.tag.even{background:var(--even)}.tag.ok{background:#2e9e44}.draggable{cursor:grab;touch-action:none}.draggable:active{cursor:grabbing}.drag-src{opacity:.25}.drag-ghost{position:fixed;z-index:500;pointer-events:none;margin:0;transform:rotate(-4deg) scale(1.06);box-shadow:0 10px 24px rgba(0,0,0,.28)}.dropzone{transition:box-shadow .15s,border-color .15s}.dropzone.hot{box-shadow:0 0 0 6px var(--accent) inset}@keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}.shaking{animation:shakeX .4s}.house-row{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin:36px 0 18px}.house{width:290px;border:4px solid;border-radius:18px;padding:60px 14px 16px;text-align:center;position:relative;background:var(--panel)}.house::before{content:"";position:absolute;top:-26px;left:50%;transform:translateX(-50%);border-left:141px solid transparent;border-right:141px solid transparent;border-bottom:52px solid}.house.oddhouse{border-color:var(--odd)}.house.oddhouse::before{border-bottom-color:var(--odd)}.house.evenhouse{border-color:var(--even)}.house.evenhouse::before{border-bottom-color:var(--even)}.house h3{margin:0 0 6px;font-size:26px}.house .hcount{font-size:20px;font-weight:800}.house .rack{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:40px;margin-top:8px}.numcard{display:inline-flex;align-items:center;justify-content:center;min-width:100px;height:74px;padding:0 14px;border-radius:14px;font-size:33px;font-weight:900;background:#fff;border:4px solid var(--primary);color:var(--ink);margin:6px;box-shadow:0 4px 0 var(--line)}.numcard .unit{font-size:40px}.numcard .unit.o{color:var(--odd)}.numcard .unit.e{color:var(--even)}.tray{min-height:90px;background:var(--bg);border:3px solid var(--line);border-radius:16px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;padding:8px;gap:4px}.legend{font-size:18px;font-weight:700;margin:2px 0 12px;display:flex;gap:18px;flex-wrap:wrap;align-items:center}.dot{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:-3px;margin-right:4px}.dot.o{background:var(--odd)}.dot.e{background:var(--even)}.belt-col{display:flex;flex-direction:column;gap:16px}.belt{border:4px solid;border-radius:16px;padding:12px;min-height:96px;position:relative;overflow:hidden}.belt h3{margin:0 0 6px;font-size:24px}.belt.obelt{border-color:var(--odd);background:#fff4ec}.belt.ebelt{border-color:var(--even);background:#ecf4ff}.belt .strip{height:22px;border-radius:11px;margin-top:8px;background:repeating-linear-gradient(115deg,rgba(0,0,0,.12) 0 18px,rgba(0,0,0,0) 18px 36px);animation:beltrun 1.1s linear infinite}.belt.obelt .strip{background-color:var(--odd)}.belt.ebelt .strip{background-color:var(--even)}@keyframes beltrun{from{background-position:0 0}to{background-position:51px 0}}.exprcard{display:inline-flex;flex-direction:column;align-items:center;background:#fff;border:4px solid var(--primary);border-radius:14px;padding:8px 14px;margin:6px;box-shadow:0 4px 0 var(--line);min-width:120px}.exprcard .ctx{font-size:16px;color:#54626f;max-width:300px;text-align:center}.exprcard .expr{font-size:28px;font-weight:900}.exprcard .dots{display:flex;gap:7px;margin-top:4px}.exprcard .dots .dot{width:15px;height:15px}.belt .exprcard{border-color:transparent;box-shadow:none;animation:flyoff 1.6s ease-in forwards}@keyframes flyoff{0%{transform:translateX(0);opacity:1}70%{opacity:1}100%{transform:translateX(560px) rotate(6deg);opacity:0}}.two-col{display:flex;gap:22px;flex-wrap:wrap}.two-col>div{flex:1 1 380px}.partbox{border:3px solid var(--line);border-radius:18px;padding:14px;background:#fff}.partbox h3{margin:2px 0 8px;font-size:23px;color:var(--primary-d)}.poolzone{border:4px solid var(--primary);border-radius:16px;overflow:hidden;background:#dff2ff}.bank{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff7e0;border-bottom:3px solid var(--line);padding:10px 14px;min-height:66px}.bank.last{border-top:3px solid var(--line);border-bottom:none}.bank .bname{font-size:22px;font-weight:900;color:#8a6100}.bank .frack{display:flex;gap:8px;flex-wrap:wrap}.bank .frack .mini{font-size:16px;font-weight:800;border-radius:10px;padding:3px 10px;color:#fff;animation:pop .3s}.pool-water{position:relative;height:150px;background:linear-gradient(180deg,#9fd8ff,#5db6f0)}.pool-water .wave{position:absolute;left:0;right:0;height:10px;background:radial-gradient(circle at 10px -6px,transparent 12px,#7ec8f5 13px);background-size:34px 20px;opacity:.7}.pool-water .wave.w2{bottom:0;transform:scaleX(-1)}.pool-water .swimmer{position:absolute;left:50%;transform:translateX(-50%);transition:top .5s ease-in-out;width:96px;text-align:center}.pool-water .swimmer .nm{font-size:17px;font-weight:800;color:#fff;background:rgba(0,0,0,.35);border-radius:8px;padding:1px 6px}.pool-btns{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}.swim-stat{font-size:20px;font-weight:800}.flagrow{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0}.flag-token{display:flex;align-items:center;gap:8px;background:#fff;border:4px solid var(--odd);border-radius:14px;padding:8px 14px;font-size:19px;font-weight:800;box-shadow:0 4px 0 var(--line)}.flag-token.y{border-color:var(--even)}@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}.seat-row{display:flex;gap:16px;justify-content:center;margin:14px 0 8px;flex-wrap:wrap}.seat{width:138px;height:128px;border:4px solid var(--line);border-radius:16px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;cursor:pointer;transition:border-color .15s,transform .12s;font-family:inherit}.seat .slabel{font-size:22px;font-weight:900;color:var(--ink)}.seat.near{border-color:var(--accent);box-shadow:0 0 0 4px rgba(255,179,0,.35)}.seat.lit{border-color:#2e9e44;box-shadow:0 0 0 5px rgba(46,158,68,.4);animation:pop .4s}.seat .dog{width:74px;height:74px;transition:transform .18s}.seat-count{font-size:20px;font-weight:800;text-align:center}.mission-switch{font-size:19px;font-weight:800;color:var(--primary-d);margin-bottom:8px}.token-tray{min-height:86px;background:var(--bg);border:3px dashed var(--line);border-radius:16px;display:flex;flex-wrap:wrap;gap:8px;padding:10px;align-items:center;justify-content:center}.token{width:46px;height:46px;border-radius:12px;background:#fff;border:3px solid var(--primary);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--line)}.token svg{width:30px;height:30px}.basket-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px}.basket{flex:1 1 150px;min-height:150px;border:4px solid var(--primary);border-radius:16px;background:#fff;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:stretch}.basket h4{margin:0;font-size:20px;text-align:center;color:var(--primary-d)}.basket .binfo{display:flex;justify-content:space-around;align-items:center;font-size:19px;font-weight:800}.basket .btokens{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:40px}.basket .btokens .token{width:34px;height:34px;border-width:2px}.basket .btokens .token svg{width:22px;height:22px}.basket.full-bad{border-color:#d93838;box-shadow:0 0 0 4px rgba(217,56,56,.25)}.verdict-lane{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:16px}.vslot{flex:1 1 180px;min-height:84px;border:4px dashed var(--primary);border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:22px;font-weight:900;color:var(--primary-d);background:var(--bg);padding:8px}.concl-card{display:flex;align-items:center;gap:8px;background:#fff;border:4px solid var(--accent);border-radius:14px;padding:10px 16px;font-size:20px;font-weight:900;box-shadow:0 4px 0 #c78a00}.clearmask{position:absolute;inset:0;background:rgba(255,255,255,.94);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;animation:fadeIn .3s;border-radius:18px}.clearmask h2{font-size:34px;color:#2e9e44;margin:8px 0}.clearmask .medal{width:110px;height:110px;animation:pop .5s}.clearmask .why{font-size:19px;max-width:640px;color:#41505d;margin:6px 0 14px;text-align:left}.modal-mask{position:fixed;inset:0;background:rgba(20,32,45,.55);z-index:800;display:flex;align-items:center;justify-content:center;padding:16px}.modal{background:var(--panel);border:4px solid var(--primary);border-radius:20px;max-width:760px;width:100%;max-height:84vh;overflow:auto;padding:20px 22px;box-shadow:0 8px 0 var(--primary-d)}.modal h2{margin:0 0 10px;color:var(--primary-d);font-size:28px}.modal .mbody{font-size:19px}.modal .mbody .rli{margin:8px 0;padding:8px 12px;background:var(--bg);border-radius:12px;border-left:8px solid var(--accent)}.modal .mfoot{display:flex;justify-content:center;gap:12px;margin-top:16px;flex-wrap:wrap}#toast{position:fixed;left:50%;bottom:38px;transform:translateX(-50%);z-index:900;background:var(--ink);color:#fff;font-size:20px;font-weight:700;border-radius:14px;padding:12px 22px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:86vw;text-align:center}#toast.show{opacity:1}#screen-win{text-align:center;padding:30px 10px}#screen-win h1{font-size:46px;color:var(--primary-d)}#screen-win .stats{font-size:24px;font-weight:800;margin:12px 0 20px}#fx{position:fixed;inset:0;pointer-events:none;z-index:950}@media(max-width:760px){body{font-size:18px}#topbar .title{font-size:21px}.numcard{min-width:82px;height:62px;font-size:27px}.exprcard .expr{font-size:23px}.seat{width:118px;height:118px}.house{width:100%;max-width:330px}.house::before{border-left-width:130px;border-right-width:130px}.pool-water{height:120px}}

<body>
<canvas id="fx"></canvas>
<div id="toast"></div>
<div id="app">

  <!-- 顶栏：标题 + 计时/步数 + 徽章 + 全局按钮 -->
  <div id="topbar">
    <div class="title">单双王国探险记</div>
    <div id="hud">
      <span class="pill">徽章 <span class="stars" id="hudStars">☆☆☆☆</span></span>
      <span class="pill" id="hudTime">用时 00:00</span>
      <span class="pill" id="hudSteps">操作 0 步</span>
      <button class="btn small ghost" id="btnRules">规则说明</button>
      <button class="btn small ghost" id="btnBackDiff">返回难度选择</button>
    </div>
  </div>

  <!-- 标题屏 -->
  <div class="screen on" id="screen-title">
    <svg class="crown" viewBox="0 0 100 100">
      <polygon points="50,12 62,34 82,22 76,58 24,58 18,22 38,34" fill="#ffb300" stroke="#c78a00" stroke-width="3"/>
      <rect x="24" y="60" width="52" height="12" rx="4" fill="#ffb300" stroke="#c78a00" stroke-width="3"/>
      <circle cx="50" cy="86" r="7" fill="#e8641c"/><circle cx="30" cy="84" r="5" fill="#1e6fd9"/><circle cx="70" cy="84" r="5" fill="#1e6fd9"/>
      <circle cx="50" cy="40" r="5" fill="#fff" /><circle cx="33" cy="45" r="4" fill="#fff"/><circle cx="67" cy="45" r="4" fill="#fff"/>
    </svg>
    <h1>单双王国探险记</h1>
    <div class="sub">单数双数 · 第22周 练习闯关</div>
    <div class="tip">拖一拖、摆一摆、点一点 —— 玩着玩着就掌握了单数双数的秘密！</div>
    <button class="btn" id="btnStart" style="font-size:26px;padding:14px 44px;">开始探险</button>
  </div>

  <!-- 难度选择 -->
  <div class="screen" id="screen-diff">
    <h2 class="sec">选择探险难度</h2>
    <p class="sec-sub">难度不同，数字大小和任务数量会变化，玩法一致</p>
    <div class="diff-row">
      <div class="diff-card" data-diff="easy">
        <svg viewBox="0 0 80 80"><path d="M40 8l8 18 20 2-15 13 5 20-18-11-18 11 5-20-15-13 20-2z" fill="#ffd54f" stroke="#c78a00" stroke-width="3"/></svg>
        <h2>初级</h2>
        <div class="dname">星星小径</div>
        <p>两位数分拣 · 两个数的加减 · 小次数摆渡与分装</p>
      </div>
      <div class="diff-card" data-diff="mid">
        <svg viewBox="0 0 80 80"><path d="M8 52c10-26 22-26 32-13C50 26 62 26 72 52" fill="none" stroke="#2e9e44" stroke-width="8" stroke-linecap="round"/><path d="M8 62c10-26 22-26 32-13 10-13 22-13 32 13" fill="none" stroke="#1976d2" stroke-width="8" stroke-linecap="round" opacity=".6"/></svg>
        <h2>中级</h2>
        <div class="dname">彩虹桥</div>
        <p>三位数分拣 · 连加算式 · 经典分拖把问题</p>
      </div>
      <div class="diff-card" data-diff="hard">
        <svg viewBox="0 0 80 80"><path d="M14 66V30l26-18 26 18v36" fill="none" stroke="#e8641c" stroke-width="6"/><path d="M30 66V44h20v22" fill="none" stroke="#e8641c" stroke-width="6"/><circle cx="40" cy="24" r="5" fill="#ffb300"/></svg>
        <h2>高级</h2>
        <div class="dname">勇者试炼</div>
        <p>多位数分拣 · 长算式与情境题 · 换座位与分跳绳挑战</p>
      </div>
    </div>
  </div>

  <!-- 地图 -->
  <div class="screen" id="screen-map">
    <h2 class="sec">探险地图</h2>
    <p class="sec-sub">完成 4 座驿站的任务，收集 4 枚徽章，点亮单双王国！</p>
    <div id="mapGrid"></div>
  </div>

  <!-- 站点 -->
  <div class="screen" id="screen-station">
    <div class="station" id="stationBox"></div>
  </div>

  <!-- 胜利 -->
  <div class="screen" id="screen-win">
    <svg class="crown" viewBox="0 0 100 100">
      <polygon points="50,12 62,34 82,22 76,58 24,58 18,22 38,34" fill="#ffd54f" stroke="#c78a00" stroke-width="3"/>
      <rect x="24" y="60" width="52" height="12" rx="4" fill="#ffd54f" stroke="#c78a00" stroke-width="3"/>
      <circle cx="50" cy="40" r="6" fill="#e8641c"/><circle cx="32" cy="46" r="5" fill="#1e6fd9"/><circle cx="68" cy="46" r="5" fill="#1e6fd9"/>
    </svg>
    <h1>全部通关，王国点亮啦！</h1>
    <div class="stats" id="winStats"></div>
    <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;">
      <button class="btn" id="btnAgain">再玩一次</button>
      <button class="btn ghost" id="btnWinDiff">返回难度选择</button>
    </div>
  </div>

<script>"use strict";function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1))}function pick(arr){return arr[randInt(0,arr.length-1)]}function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=randInt(0,i);const t=a[i];a[i]=a[j];a[j]=t}return a}function parOf(n){return Math.abs(n)%2}function parName(p){return p===1?"单数":"双数"}function parTag(p){return'<span class="tag '+(p===1?"odd":"even")+'">'+parName(p)+"</span>"}function fmtTime(sec){const m=Math.floor(sec/60),s=sec%60;return(m<10?"0"+m:""+m)+":"+(s<10?"0"+s:""+s)}function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._h);toast._h=setTimeout(function(){t.classList.remove("show")},2100)}function bump(){G.steps+=1;document.getElementById("hudSteps").textContent="操作 "+G.steps+" 步"}const PALETTES=[{bg:"#eaf4ff",primary:"#1976d2",primaryD:"#0d47a1",accent:"#ffb300",line:"#c9d6e2"},{bg:"#eefaf0",primary:"#2e7d32",primaryD:"#1b5e20",accent:"#ff8f00",line:"#bfe0c4"},{bg:"#fff0f5",primary:"#c2185b",primaryD:"#880e4f",accent:"#00897b",line:"#f0c3d5"},{bg:"#f3efff",primary:"#5e35b1",primaryD:"#311b92",accent:"#fbc02d",line:"#d5cbf2"},{bg:"#fff6ec",primary:"#e65100",primaryD:"#a33c00",accent:"#0288d1",line:"#f2d4b8"},{bg:"#ecfbfa",primary:"#00838f",primaryD:"#005662",accent:"#f4511e",line:"#bfe6e6"}];function applyPalette(){const p=pick(PALETTES);const r=document.documentElement.style;r.setProperty("--bg",p.bg);r.setProperty("--primary",p.primary);r.setProperty("--primary-d",p.primaryD);r.setProperty("--accent",p.accent);r.setProperty("--line",p.line)}const G={diff:null,badges:{s1:false,s2:false,s3:false,s4:false},cur:null,steps:0,t0:0,elapsed:0,timerId:null,running:false};function startTimer(){stopTimer();G.t0=Math.floor(Date.now()/1e3);G.elapsed=0;G.running=true;G.timerId=setInterval(function(){if(!G.running)return;G.elapsed=Math.floor(Date.now()/1e3)-G.t0;document.getElementById("hudTime").textContent="用时 "+fmtTime(G.elapsed)},1 top+"px";el.style.zIndex="450";el.style.margin="0";el.style.transition="all .45s ease-in";requestAnimationFrame(function(){el.style.left=r2.left+r2.width/2-r1.width/2+"px";el.style.top=r2.top+r2.height/2-r1.height/2+"px";el.style.transform="scale(.15) rotate(10deg)";el.style.opacity="0"});setTimeout(function(){el.remove();if(done)done()},480)}function shake(el){el.classList.remove("shaking");void el.offsetWidth;el.classList.add("shaking")}function handleDrop(el,zone){bump();const k=G.cur.key;if(k==="s1")dropS1(el,zone);else if(k==="s2")dropS2(el,zone);else if(k==="s3")dropS3(el,zone);else if(k==="s4")dropS4(el,zone)}function genS1(){const cfg={easy:{count:8,lo:10,hi:99},mid:{count:12,lo:100,hi:999},hard:{count:14,lo:1e3,hi:9999}}[G.diff];const want=cfg.count/2;const odds=[],evens=[],used={};while(odds.length<want){const n=randInt(cfg.lo,cfg.hi);if(!used[n]&&parOf(n)===1){used[n]=1;odds.push(n)}}while(evens.length<want){const n=randInt(cfg.lo,cfg.hi);if(!used[n]&&parOf(n)===0){used[n]=1;evens.push(n)}}return{cards:shuffle(odds.concat(evens)).map(function(n){return{n,par:parOf(n)}})}}function twoTermCard(){const a=randInt(11,98),b=randInt(11,98);let x=a,y=b,op=Math.random()<.5?"+":"-";if(op==="-"&&y>=x){const t=x;x=y;y=t}const val=op==="+"?x+y:x-y;return{expr:x+op+y,terms:[x,y],par:parOf(val),reason:x+"是"+parName(parOf(x))+"，"+y+"是"+parName(parOf(y))+"；"+(parOf(x)===parOf(y)?"同单双相加减得双数":"单双相加减得单数")+"，所以得数是"+parName(parOf(val))+"。"}}function multiTermCard(nTerm){const terms=[];const used={};while(terms.length<nTerm){const n=randInt(11,98);if(!used[n]){used[n]=1;terms.push(n)}}let val=0,expr="";for(let i=0;i<terms.length;i++){if(i===0){val=terms[0];expr=""+terms[0]}else if(i===1||Math.random()<.6||val<terms[i]){val+=terms[i];expr+="+"+terms[i]}else{val-=terms[i];expr+="-"+terms[i]}}const oddCnt=terms.filter(function(t){return parOf(t)===1}).length;return{expr,terms:terms.slice(),par:parOf(val),reason:"式子里单数有 "+oddCnt+" 个（"+parName(oddCnt%2===1?1:0)+"个单数）；单数两两凑成双数，剩下看单数的
