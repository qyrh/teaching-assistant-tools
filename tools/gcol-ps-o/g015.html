<body>

<!-- 顶部栏：标题 + 状态仪表 + 功能按钮 -->
<header id="topbar">
  <div class="brand">小镇商店大老板<small>·经济探险｜第19周 经济问题（一）</small></div>
  <div id="hud">
    <span class="hud-chip" id="hud-level">未开始</span>
    <span class="hud-chip" id="hud-timer">00:00</span>
    <span class="hud-chip" id="hud-steps">步数 0</span>
  </div>
  <div id="topbtns">
    <button class="tbtn" id="btn-rules">游戏规则</button>
    <button class="tbtn" id="btn-reveal">揭示答案</button>
    <button class="tbtn" id="btn-restart">重新开始</button>
    <button class="tbtn" id="btn-back">返回难度</button>
  </div>
</header>

<main id="main">
  <!-- 难度选择屏 -->
  <section id="screen-diff">
    <div class="diff-head">
      <h1>欢迎来到商店经营挑战！</h1>
      <p>拖价格牌、调定价滑块、凑金币……用你的双手解开折扣与利润的秘密！</p>
    </div>
    <div class="diff-cards" id="diff-cards"></div>
    <p class="diff-tip">每局任务随机抽取、主题色随机变化，多玩几次也不重样。课堂投影推荐全屏展示。</p>
  </section>

  <!-- 游戏屏：左任务卷轴 + 右操作台 -->
  <section id="screen-game" class="hidden">
    <aside>
      <div class="panel">
        <h3 id="task-title">任务书</h3>
        <div class="qtext" id="task-question"></div>
        <div class="cond-list" id="task-conds"></div>
        <div class="goal-box" id="task-goal"></div>
      </div>
    </aside>
    <div>
      <div class="panel" id="stage-panel">
        <div id="stage-body"></div>
        <div id="lamp-zone">
          <div id="lamp"></div>
          <div id="lamp-text">动手操作，让绿灯亮起吧！</div>
          <button id="btn-finish">完成挑战</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 总结屏 -->
  <section id="screen-end" class="hidden"></section>
</main>

<!-- 弹窗（规则 / 揭示答案 / 结算 复用） -->
<div id="modal-mask" class="hidden"><div id="modal"></div></div>
<!-- 彩纸画布 -->
<canvas id="fx"></canvas>

t:"九折",k:.9},{t:"九五折",k:.95}]);var kv2=kvRow(stage);var vPri=kv2.add("乙每件售价"),vY=kv2.add("乙 270 件利润"),vT=kv2.add("第二次总利润");tags.forEach(function(d){var el=mk("div","tag",d.t+'<span class="sub">售价 '+f1(40*d.k)+" 元</span>");shelf.appendChild(el);makeDraggable(el,{zones:function(){return[dz]},onDrop:function(){dz.innerHTML='<b style="color:var(--c1d)">乙商品按 '+d.t+" 销售</b>";GAME.api.step();var p=40*d.k,yi=270*(p-30),tot=1050+yi;vPri.set(f1(p)+" 元");vY.set(yi+" 元",yi<0?"bad":"");vT.set(tot+" 元");var ok=Math.abs(tot-2130)<.01;GAME.api.light(ok,ok?"第二次总利润恰好 2130 元！乙商品按 "+d.t+" 销售。点「完成挑战」！":"按 "+d.t+" 卖，第二次总利润 "+tot+" 元，不是 2130 元。换一张牌试试！")}})});GAME.api.light(false,"拖折扣牌，盯住「第二次总利润」！")}GAME.api.light(false,"先完成第一步：找到甲、乙的数量！")}var LEVELS={easy:[{name:"奇妙价格链",base:3,build:LE1,question:"一个无线鼠标的原价是 40 元，先提价 25%，再打八折出售，现价是多少元？",conds:["原价：40 元","变化规则：先提价，再打折（顺序你来定）"],goal:"把货架上的两张价格牌拖进演变链（顺序自选），让<b>现价恰好等于 40 元</b>！放好两张牌后现价会实时算出来。",answer:"现价是 40 元。有趣的是：提价 25% 再打八折，现价和原价一样！",explain:"提价 25% 后：40×(1＋25%)＝50（元）；再打八折：50×80%＝40（元）。涨 1.25 倍又乘 0.8，1.25×0.8＝1，正好回到原价。（先八折再提价 25% 结果相同，你可以两种顺序都试试！）"},{name:"优惠卡书屋",base:5,build:LE2,question:"读者购买通达书城的图书凭优惠卡可打八折，依依用优惠卡买了一套书，省了 8.4 元。这套书的原价是多少元？",conds:["优惠卡：一律打八折（付原价的 80%）","依依买书节省了：8.4 元"],goal:"拖动「原价」滑块，让<b>节省的钱恰好等于 8.4 元</b>。仔细观察：节省的钱和原价之间有什么关系？",answer:"这套书的原价是 42 元。",explain:"打八折即付原价的 80%，节省的部分是原价的 1−80%＝20%。量率对应：8.4 元对应 20%，所以原价＝8.4÷20%＝42（元）。拖滑块时你会发现：原价每增加 1 元，节省就增加 0.2 元。"},{name:"电商进货秤",base:6,build:LE3,question:"某电商平台将商品 A 按标价的六折出售，仍可获利润 20%。若该商品 A 的标价为 600 元，那么该商品的进货价为多少元？",conds:["标价：600 元","按标价的六折出售","仍可获利润 20%（利润率按进货价算）"],goal:"第一步：把<b>六折</b>牌拖到商品 A 上，让售价亮出来；第二步：拖「进货价」滑块，让<b>利润率恰好 20%</b>！",answer:"该商品的进货价是 300 元。",explain:"标价的六折：600×60%＝360（元），这就是售价。获利 20% 指利润是进货价的 20%，所以 进货价×(1＋20%)＝售价，进货价＝360÷(1＋20%)＝300（元）。"},{name:"会员价签台",base:5,build:LE4,question:"某母婴店销售一种玩具，按规定会员购买打八折，非会员购买打九折。同样购买一件玩具，梦梦用会员卡比多多不用会员卡购买少花了 18 元钱，则这种玩具用会员卡购买的价格是多少元？",conds:["会员价：标价的八折","非会员价：标价的九折","会员比非会员少花：18 元"],goal:"拖动「玩具标价」滑块，让<b>会员价与非会员价的差恰好是 18 元</b>。这时读出会员价是多少元！",answer:"用会员卡购买的价格是 144 元。",explain:"九折与八折相差标价的 90%−80%＝10%，这 10% 正好是 18 元。量率对应：标价＝18÷10%＝180（元），会员价＝180×80%＝144（元）。"}],mid:[{name:"聪明购物节",base:20,build:M1,question:"某超市“五一小长假”大酬宾：若一次性购物不超过 300 元不优惠，满 300 元以及超过 300 元时按全额九折优惠。一位顾客第一次购物付款 180 元，第二次购物付款 268 元，若这两次购物合并成一次付款可节省多少元？",conds:["规则：一次购物满 300 元，全额按九折","第一次付款：180 元（不足 300 元，没优惠）","第二次付款：268 元（不足 300 元，没优惠）"],goal:"第一步：把两张小票拖进<b>合并结算机</b>并结算；第二步：把<b>省下的钱</b>用金币（10元、1元、1角）拖进钱袋，金额凑对即过关！",answer:"合并付款可节省 44.8 元。",explain:"180 元、268 元都不到 300 元，所以两次分开付款都没有优惠。合并后总额 180＋268＝448（元）＞300 元，按九折实付 448×90%＝403.2（元），节省 448−403.2＝44.8（元），也就是 448×(1−90%)＝44.8（元）。"},{name:"西瓜运输队",base:8,build:M2,question:"某批发商到水果产地收购西瓜，收购价为 1.2 元/千克，从产地到销售地的距离是 200 千米，运费为每吨货物每运 1 千米收 1.5 元。西瓜在运输和销售过程中损耗较大，预计将损耗 25%。该批发商要想实现 25% 的利润率，批发价应定为多少元/千克？（按收购 1000 千克，即 1 吨计算）",conds:["收购价 1.2 元/千克 × 1000 千克＝1200 元","运费 1.5 元/吨·千米 × 200 千米 × 1 吨＝300 元","损耗 25%：1000 千克只剩 750 千克可卖","目标利润率：25%（按总成本 1500 元算）"],goal:"第一步：点「发车运输」看成本账；第二步：拖<b>批发价</b>滑块，让<b>利润率恰好 25%</b>！",answer:"批发价应定为 2.5 元/千克。",explain:"总成本＝1200＋300＝1500（元）。要实现 25% 的利润率，销售额应为 1500×(1＋25%)＝1875（元）。损耗 25% 后实际可售 1000×(1−25%)＝750（千克），所以批发价＝1875÷750＝2.5（元/千克）。"},{name:"衬衣换季特惠",base:6,build:M3,question:"商店新购进一批衬衣共 120 件，每件的进货价是 80 元，按 25% 的期望利润定价出售。卖出这批衬衣的 80% 后，决定进行换季打折销售，卖完这批衬衣共获利 2040 元。则剩下的这批衬衣打几折出售？",conds:["共 120 件，每件进货价 80 元","按 25% 的期望利润定价（先算出定价）","已卖出 120×80%＝96 件（按定价卖）","全部卖完共获利 2040 元"],goal:"第一步：拖「每件定价」滑块到<b>定价利润率 25%</b> 并锁定；第二步：给剩下的 24 件拖折扣牌，让<b>总利润恰好 2040 元</b>！",answer:"剩下的衬衣按八五折出售。",explain:"定价＝80×(1＋25%)＝100（元/件），每件赚 20 元。前 96 件已赚 96×20＝1920（元），后 24 件还要赚 2040−1920＝120（元），每件赚 120÷24＝5（元），售价＝80＋5＝85（元）。85÷100＝85%，即打八五折。"},{name:"赛车成本档案",base:6,build:M4,question:"一种儿童双人遥控轨道玩具赛车的成本价为 200 元，若按定价的 80% 出售，能获得 20% 的利润。由于今年降低成本，按去年定价的 70% 出售，仍能获得 50% 的利润，今年这种玩具赛车的成本是多少元？",conds:["去年成本：200 元","去年按定价的 80% 出售，获利 20%","今年按去年定价的 70% 出售，仍获利 50%"],goal:"第一步：翻开两页<b>去年账本</b>（点卡片），求出去年定价；第二步：拖「今年成本」滑块，让<b>利润率恰好 50%</b>！",answer:"今年这种玩具赛车的成本是 140 元。",explain:"去年：成本 200 元获利 20%，售价＝200×(1＋20%)＝240（元）；它等于去年定价的 80%，所以去年定价＝240÷80%＝300（元）。今年售价＝300×70%＝210（元），仍获利 50%，今年成本＝210÷(1＋50%)＝140（元）。"}],hard:[{name:"双超会比价台",base:6,build:H1,question:"元旦，A 超市与 B 超市都开展了优惠活动。A 超市的优惠方案是：购物满 100 元的，超过 100 元的部分打七折；B 超市的优惠方案是：所有商品一律打八五折。当购物多少元时，在两个超市支付的实际金额相同？",conds:["A 超市：100 元＋超过 100 元部分×70%","B 超市：全额×85%"],goal:"拖动「购物金额」滑块，观察两家超市的<b>实付柱子</b>，找到让<b>两根柱子一样高（差价为 0）</b>的购物金额！",answer:"当购物 200 元时，两个超市实付金额相同（都是 170 元）。",explain:"设购物 x 元：100＋(x−100)×70%＝85%x，化简得 100＋0.7x−70＝0.85x，即 30＝0.15x，x＝200。检验：A 超市 100＋100×70%＝170（元），B 超市 200×85%＝170（元），确实相同。"},{name:"食品进货大账本",base:8,build:H2,question:"某商场购进某种食品 300 件进行销售。由于销售良好，过了一段时间又购进这款食品，所购数量是第一次购进数量的 2 倍，每件价格比第一次购进价格便宜了 3 元，但购进款增加了 4500 元。（1）该商场第一次购进这种食品的价格是多少元/件？（2）如果两次购买的食品按相同标价销售，最后剩下的 150 件食品按标价的六折销售，且两次购进的食品全部售完，要使利润不低于 6000 元，这种食品的标价至少是多少元/件？",conds:["第一次：300 件，每件 x 元","第二次：600 件，每件 (x−3) 元，购进款多 4500 元","两次共 900 件；售出时 750 件按标价、150 件按标价六折","目标：总利润不低于 6000 元"],goal:"第一步：拖「第一次进价」滑块，让第二次购进款<b>恰好多 4500 元</b>并锁定；第二步：拖「标价」滑块进入<b>绿色达标区</b>（利润不低于 6000 元）！",answer:"（1）第一次购进价格是 21 元/件；（2）标价至少是 27.5 元/件。",explain:"（1）设第一次进价 x 元/件：600(x−3)−300x＝4500，化简 300x−1800＝4500，x＝21。（2）两次总成本＝21×300＋18×600＝6300＋10800＝17100（元）。900 件中 750 件全价、150 件六折（相当于 90 件全价），收入＝(750＋90)x＝840x。要 840x−17100≥6000，解得 x≥27.5，所以标价至少 27.5 元/件。"},{name:"社区超市双商品",base:18,build:H3,question:"某社区超市第一次用 6000 元购进甲、乙两种商品，其中乙商品的数量比甲商品数量的二分之一多 15 件，进价和售价见表格。（1）两种商品各购进多少件？（2）全部卖完一共可获得多少元利润？（3）第二次以同样的进价再购进：甲数量不变，乙数量是第一次的 3 倍；甲按原价销售，乙打折销售，第二次总利润比第一次多 180 元。第二次乙商品按原价打几折销售？",conds:["第一次总花费 6000 元；乙数量＝甲数量×1/2＋15 件","甲：进价 22 元/件，售价 29 元/件","乙：进价 30 元/件，售价 40 元/件","第二次：甲 150 件利润不变，乙 270 件打折卖","第二次总利润＝第一次＋180 元"],goal:"三步走：① 调「甲数量」滑块让总花费＝6000 元并锁定；② 用金币（500/100/50/10 元）把第一次的<b>总利润</b>装进钱袋；③ 给乙商品拖折扣牌，让<b>第二次总利润＝2130 元</b>！",answer:"（1）甲 150 件、乙 90 件；（2）第一次利润 1950 元；（3）第二次乙商品按八五折销售。",explain:"（1）设甲 x 件：22x＋30(x/2＋15)＝6000，即 37x＋450＝6000，x＝150，乙＝150×1/2＋15＝90（件）。（2）利润＝(29−22)×150＋(40−30)×90＝1050＋900＝1950（元）。（3）第二次甲利润仍 1050 元，乙要赚 1950＋180−1050＝1080（元），270 件每件赚 1080÷270＝4（元），售价＝30＋4＝34（元）＝40×85%，即打八五折。"}]};var GAME={diff:null,levels:[],idx:0,steps:0,revealed:0,t0:0,timerId:null,api:null,playing:false,stars:[]};function hud(){$("hud-steps").textContent="步数 "+GAME.steps}function startTimer(){GAME.t0=Date.now();GAME.timerId=setInterval(function(){var s=Math.floor((Date.now()-GAME.t0)/1e3);var m=Math.floor(s/60);s=s%60;$("hud-timer").textContent=(m<10?"0":"")+m+":"+(s<10?"0":"")+s},500)}function stopTimer(){if(GAME.timerId){clearInterval(GAME.timerId);GAME.timerId=null}}function enterDiff(diff){GAME.diff=diff;GAME.levels=shuffle(LEVELS[diff].slice()).slice(0,3);GAME.idx=0;GAME.steps=0;GAME.stars=[];$("screen-diff").classList.add("hidden");$("screen-end").classList.add("hidden");$("screen-game").classList.remove("hidden");GAME.playing=true;startTimer();hud();renderLevel()}function renderLevel(){var lv=GAME.levels[GAME.idx];GAME.revealed=0;$("task-title").textContent="任务 "+(GAME.idx+1)+"/"+GAME.levels.length+"："+lv.name;$("task-question").textContent=lv.question;var cl=$("task-conds");cl.innerHTML="";lv.conds.forEach(function(c){cl.appendChild(mk("div","cond-item",c))});$("task-goal").innerHTML="<b>操作目标：</b>"+lv.goal;$("hud-level").textContent={easy:"初级",mid:"中级",hard:"高级"}[GAME.diff]+" · 任务 "+(GAME.idx+1)+"/"+GAME.levels.length;var stage=$("stage-body");stage.innerHTML="";var lampT=$("lamp-text");lampT.textContent="动手操作，让绿灯亮起吧！";$("lamp").className="";$("btn-finish").classList.remove("ready");GAME.api={step:function(){GAME.steps++;hud()},light:function(on,txt){$("lamp").className=on?"on":"";$("btn-finish").classList.toggle("ready",on);lampT.textContent=txt||""}};lv.build(stage);stage.scrollIntoView({behavior:"smooth",block:"nearest"})}function starsFor(lv){var s=3;if(GAME.steps>lv.base*3)s=2;if(GAME.revealed>0)s=Math.max(1,s-1);return s}function levelClear(){var lv=GAME.levels[GAME.idx];var s=starsFor(lv);GAME.stars.push(s);confetti(2600);showModal('<div class="stars-big">'+"★".repeat(s)+"☆".repeat(3-s)+'</div><h2>本关挑战成功！</h2><div class="m-body"><b>答案：'+lv.answer+"</b>\n\n【解析】"+lv.explain+"</div>",[{label:GAME.idx===GAME.levels.length-1?"查看总成果":"下一任务",fn:function(){hideModal();if(GAME.idx===GAME.levels.length-1)gameEnd();else{GAME.idx++;renderLevel()}}}])}function gameEnd(){GAME.playing=false;stopTimer();var total=GAME.stars.reduce(function(a,b){return a+b},0);var secs=Math.floor((Date.now()-GAME.t0)/1e3);var mm=Math.floor(secs/60),ss=secs%60;$("screen-game").classList.add("hidden");var end=$("screen-end");end.classList.remove("hidden");end.innerHTML='<h1>全部任务完成，你是金牌大老板！</h1><div class="stat">获得星星：'+"★".repeat(total)+"（"+total+" / "+GAME.levels.length*3+'）</div><div class="stat">总用时：'+mm+" 分 "+(ss<10?"0":"")+ss+" 秒　·　总步数："+GAME.steps+' 步</div><div class="m-btns" style="justify-content:center;display:flex;gap:14px;margin-top:22px;flex-wrap:wrap;"><button class="m-btn" id="again">再玩一次（重新抽任务）</button><button class="m-btn ghost" id="todiff">返回难度选择</button></div>';confetti(4200);$("again").addEventListener("click",function(){applyPalette();enterDiff(GAME.diff)});$("todiff").addEventListener("click",function(){toDiffScreen()})}function toDiffScreen(){GAME.playing=false;stopTimer();$("screen-game").classList.add("hidden");$("screen-end").classList.add("hidden");$("screen-diff").classList.remove("hidden");$("hud-level").textContent="未开始"}function showModal(html,btns){var m=$("modal");m.innerHTML=html+'<div class="m-btns" id="m-btns"></div>';(btns||[]).forEach(function(b){var bt=mk("button","m-btn",b.label);bt.addEventListener("click",b.fn);$("m-btns").appendChild(bt)});$("modal-mask").classList.remove("hidden")}function hideModal(){$("modal-mask").classList.add("hidden")}var RULE_TEXT="【怎么玩】\n1. 选择难度（初级·商店新手村 / 中级·精明小掌柜 / 高级·金牌大掌柜），每局随机抽取 3 个经营任务。\n2. 每个任务：左边是任务书（完整题目和条件），右边动手操作——拖价格牌、调滑块、拖小票、凑金币，让操作台上的绿灯亮起。\n3. 绿灯亮起后，点「完成挑战」过关，还能看到完整解析。\n4. 右上角有计时器和步数；卡住了可以点「揭示答案」看思路（本关最多只能得 2 颗星哦）。\n5. 「重新开始」重摆当前任务，「返回难度」回到选择界面。每局主题色随机，玩几次都不重样！\n\n【数学锦囊】\n· 打几折就是按原价的百分之几十出售（八折＝80%）；\n· 利润＝售价−成本，利润率＝利润÷成本；\n· “省了/多花了多少元”往往对应“两个百分数的差”，找准量率对应是关键！";function buildDiffCards(){var defs=[{k:"easy",t:"初级 · 商店新手村",s:"★★☆",p:"提价打折、优惠卡、进货价……热热身，感受价格的变化！"},{k:"mid",t:"中级 · 精明小掌柜",s:"★★★",p:"合并小票、西瓜运输、衬衣换季、赛车成本，真实经营大考验！"},{k:"hard",t:"高级 · 金牌大掌柜",s:"★★★",p:"双超市比价、进货大账本、双商品三连问，综合挑战等你来！"}];var box=$("diff-cards");box.innerHTML="";defs.forEach(function(d){var c=mk("div","diff-card","<h2>"+d.t+'</h2><div class="stars">'+d.s+"</div><p>"+d.p+'</p><div class="go">开始挑战</div>');c.addEventListener("click",function(){enterDiff(d.k)});box.appendChild(c)})}$("btn-rules").addEventListener("click",function(){showModal('<h2>游戏规则</h2><div class="m-body">'+RULE_TEXT+"</div>",[{label:"知道啦，出发！",fn:hideModal}])});$("btn-reveal").addEventListener("click",function(){if(!GAME.playing){toast("先选择难度开始游戏哦！");return}GAME.revealed++;var lv=GAME.levels[GAME.idx];showModal('<h2>偷偷看一眼思路</h2><div class="m-body"><b>答案：'+lv.answer+"</b>\n\n【解析】"+lv.explain+"</div>",[{label:"继续挑战（本关最多 2 星）",fn:hideModal}])});$("btn-restart").addEventListener("click",function(){if(!GAME.playing){toast("先选择难度开始游戏哦！");return}GAME.revealed=0;renderLevel();toast("当前任务重新摆好，再来一次！")});$("btn-back").addEventListener("click",function(){toDiffScreen()});$("btn-finish").addEventListener("click",function(){if(!GAME.playing)return;if($("lamp").className.indexOf("on")>=0)levelClear();else toast("绿灯还没亮哦！按任务目标继续操作。")});var palName=applyPalette();buildDiffCards();setTimeout(function(){showModal('<h2>欢迎来到「小镇商店大老板·经济探险」！</h2><div class="m-body">本局主题色：【'+palName+"】\n\n"+RULE_TEXT+"</div>",[{label:"知道啦，出发！",fn:hideModal}])},300);window.addEventListener("resize",function(){fxCanvas.width=innerWidth;fxCanvas.height=innerHeight});
