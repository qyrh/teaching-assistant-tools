<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>尾数与余数 · 数字魔法工坊（第19周）</title>
<style>
/* ================= 全局配色变量（每局随机换装） ================= */
:root{
  --c-bg:#FFF6EA; --c-panel:#FFFFFF; --c-main:#FF7043; --c-main2:#E85325;
  --c-soft:#FFE3D4; --c-acc:#FFB300; --c-ink:#3A2417; --c-line:#E8C9B5;
  --c-good:#2E9E5B; --c-bad:#D84315;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;
  background:var(--c-bg); color:var(--c-ink); font-size:18px; line-height:1.55;
  min-height:100vh; overscroll-behavior:none;
}
#app{max-width:1120px;margin:0 auto;padding:10px 12px 30px;display:flex;flex-direction:column;gap:12px;}

/* ================= 顶栏 ================= */
#topbar{background:var(--c-panel);border:3px solid var(--c-main);border-radius:18px;padding:12px 16px;
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;box-shadow:0 4px 0 var(--c-soft);}
#gameTitle{font-size:26px;font-weight:900;color:var(--c-main2);letter-spacing:1px;}
#levelName{font-size:17px;font-weight:700;color:var(--c-ink);opacity:.85;}
#hud{margin-left:auto;font-size:19px;font-weight:800;background:var(--c-soft);border-radius:12px;padding:6px 14px;white-space:nowrap;}
#menu{display:flex;flex-wrap:wrap;gap:8px;width:100%;}
.btn{font-size:18px;font-weight:700;color:#fff;background:var(--c-main);border:none;border-radius:12px;
  padding:9px 16px;cursor:pointer;box-shadow:0 3px 0 var(--c-main2);transition:transform .08s;}
.btn:active{transform:translateY(2px);box-shadow:none;}
.btn.alt{background:#fff;color:var(--c-main2);border:3px solid var(--c-main);box-shadow:0 3px 0 var(--c-soft);}
.btn.big{font-size:22px;padding:12px 26px;}
.btn:disabled{opacity:.45;cursor:default;}

/* ================= 主舞台 ================= */
#stageArea{min-height:420px;}
.card{background:var(--c-panel);border:3px solid var(--c-line);border-radius:16px;padding:14px 16px;margin:12px 0;}
.taskCard{border-color:var(--c-main);font-size:20px;font-weight:700;line-height:1.7;}
.taskCard .tk{display:inline-block;background:var(--c-main);color:#fff;border-radius:999px;padding:2px 12px;font-size:17px;margin-right:8px;vertical-align:2px;}
.stageTag{display:inline-block;background:var(--c-main);color:#fff;border-radius:999px;padding:4px 16px;font-size:18px;font-weight:800;margin-bottom:8px;}
.stageTitle{font-size:21px;font-weight:800;margin:2px 0 6px;}
.subNote{font-size:17px;color:#6b4c3a;}
.flexRow{display:flex;flex-wrap:wrap;gap:14px;align-items:stretch;}
.grow{flex:1 1 320px;}

/* 首页难度卡 */
#homeWrap{display:flex;flex-direction:column;gap:14px;}
.diffCard{background:var(--c-panel);border:4px solid var(--c-main);border-radius:20px;padding:18px 20px;cursor:pointer;
  transition:transform .12s, box-shadow .12s; text-align:left;}
.diffCard:hover{transform:translateY(-3px);box-shadow:0 8px 0 var(--c-soft);}
.diffCard h3{margin:0 0 6px;font-size:24px;color:var(--c-main2);}
.diffCard p{margin:4px 0;font-size:17px;}
.knCard{display:flex;flex-wrap:wrap;gap:12px;}
.knCard .card{flex:1 1 260px;margin:0;font-size:17px;}

/* 摩天轮 */
#wheelBox{position:relative;width:min(480px,100%);margin:0 auto;}
#wheelBox svg{width:100%;height:auto;display:block;}
.seatDrop circle{fill:#fff;stroke:var(--c-main);stroke-width:4;transition:all .15s;cursor:pointer;}
.seatDrop .sdig{font-size:36px;font-weight:900;fill:var(--c-ink);text-anchor:middle;}
.seatDrop .sord{font-size:16px;font-weight:700;fill:#9a7c66;text-anchor:middle;}
.seatDrop.dropHot circle{stroke:var(--c-acc);stroke-width:7;fill:#FFF8E1;}
.seatDrop.flash circle{fill:var(--c-soft);}
.seatDrop.winRing circle{stroke:var(--c-acc);stroke-width:9;fill:#FFF3C4;}
#wheelToken{font-size:34px;text-anchor:middle;transition:transform .35s cubic-bezier(.3,1.4,.5,1);opacity:0;}
.wheelCenter .wc1{font-size:24px;font-weight:900;fill:var(--c-main2);text-anchor:middle;}
.wheelCenter .wc2{font-size:17px;font-weight:700;fill:var(--c-ink);text-anchor:middle;}
.goldStar{position:absolute;right:8px;bottom:8px;font-size:44px;cursor:grab;user-select:none;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.25)); touch-action:none;}
.histBox{font-size:17px;max-height:190px;overflow:auto;background:var(--c-soft);border-radius:12px;padding:8px 12px;}
.histBox div{padding:2px 0;border-bottom:1px dashed rgba(0,0,0,.12);}

/* 宝石合成台 */
.gemDock{display:flex;flex-wrap:wrap;gap:12px;min-height:96px;}
.gem{width:104px;border-radius:16px;padding:8px 6px;text-align:center;color:#fff;cursor:grab;user-select:none;
  background:linear-gradient(160deg,var(--c-main),var(--c-main2));box-shadow:0 4px 0 rgba(0,0,0,.18);touch-action:none;}
.gem .gn{font-size:22px;font-weight:900;line-height:1.2;}
.gem .gr{font-size:16px;font-weight:700;background:rgba(255,255,255,.25);border-radius:8px;margin-top:4px;}
.gem.selGem{outline:5px solid var(--c-acc);}
.gem.newGem{background:linear-gradient(160deg,#8E6BE0,#6C47C9);}
.synthRow{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:10px 0;}
.bslot{width:116px;height:112px;border:4px dashed var(--c-line);border-radius:16px;display:flex;align-items:center;justify-content:center;
  background:#fff;font-size:17px;font-weight:700;color:#b09580;text-align:center;padding:4px;}
.bslot.filled{border-style:solid;border-color:var(--c-main);}
.bslot .gem{cursor:pointer;transform:scale(.92);}
.opSym{font-size:46px;font-weight:900;color:var(--c-main2);}
.chipZone{min-height:78px;border:3px solid var(--c-line);border-radius:14px;background:#FFFDF8;
  display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center;padding:10px;position:relative;}
.chipZone .cd{width:14px;height:14px;border-radius:50%;background:var(--c-acc);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);}
.chipZone .cnt{position:absolute;right:10px;bottom:4px;font-size:17px;font-weight:800;color:var(--c-main2);}
.chipZone.dropHot{outline:5px dashed var(--c-acc);}
.tray{display:inline-flex;flex-direction:column;align-items:center;gap:4px;background:var(--c-soft);border:3px solid var(--c-main);
  border-radius:14px;padding:8px 12px;cursor:grab;user-select:none;touch-action:none;}
.tray .slots{display:flex;gap:3px;flex-wrap:wrap;max-width:300px;justify-content:center;}
.tray .slots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--c-main2);display:block;}
.tray .tl{font-size:16px;font-weight:800;color:var(--c-main2);}
.packRow{font-size:18px;font-weight:800;}
.answerBox{min-height:88px;border:4px dashed var(--c-main);border-radius:16px;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--c-main2);gap:10px;padding:8px;text-align:center;}
.answerBox.dropHot{outline:5px dashed var(--c-acc);background:#FFF8E1;}
.answerBox.ok{border-style:solid;border-color:var(--c-good);color:var(--c-good);}
.resultGemRow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;}

/* 长数字小火车 */
.cTools{display:flex;flex-wrap:wrap;gap:12px;}
.probePanel{flex:1 1 300px;font-size:18px;font-weight:700;background:var(--c-soft);border-radius:14px;padding:10px 14px;min-height:84px;}
.groupPanel{flex:1 1 300px;background:#fff;border:3px solid var(--c-line);border-radius:14px;padding:10px 14px;font-size:17px;}
.sliderWrap{margin-top:8px;}
.sliderLabel{font-size:19px;font-weight:900;color:var(--c-main2);}
.sliderTrack{position:relative;height:14px;background:var(--c-soft);border-radius:999px;margin:14px 6px 6px;}
.sliderKnob{position:absolute;top:50%;width:34px;height:34px;border-radius:50%;background:var(--c-main);
  border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transform:translate(-50%,-50%);cursor:grab;touch-action:none;}
.trainWrap{background:#fff;border:3px solid var(--c-line);border-radius:14px;padding:10px;}
.train{display:flex;flex-wrap:wrap;gap:3px;touch-action:none;cursor:crosshair;}
.tcell{width:24px;height:32px;line-height:28px;text-align:center;font-size:18px;font-weight:800;
  background:#fff;border:2px solid var(--c-line);border-radius:6px;}
.tcell.sel{background:var(--c-acc);border-color:var(--c-acc);color:#fff;}
.tcell.gB{background:#EFE9FF;border-color:#C9B8F5;}
.tcell.tail{border-color:var(--c-main);border-width:3px;background:#FFF6DE;animation:pulse 1s infinite;}
.tcell.gemcell{background:var(--c-good);border-color:var(--c-good);color:#fff;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}
.banner{background:#FFF3C4;border:3px solid var(--c-acc);border-radius:12px;padding:8px 14px;font-size:18px;font-weight:800;margin-top:10px;}

/* 除数灯泡工厂 */
.lampRow{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;}
.lamp{width:78px;height:78px;border-radius:50%;border:4px solid #CFCFCF;background:#F4F4F4;color:#BBB;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:800;}
.lamp .lv{font-size:21px;font-weight:900;line-height:1;}
.lamp.on{border-color:var(--c-acc);background:#FFE591;color:var(--c-main2);box-shadow:0 0 16px var(--c-acc);animation:pop .4s;}
.cardTray{display:flex;flex-wrap:wrap;gap:10px;min-height:78px;align-items:center;}
.fcard{width:70px;height:70px;border:3px solid var(--c-main);border-radius:12px;background:#fff;color:var(--c-main2);
  font-size:26px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:grab;user-select:none;touch-action:none;
  box-shadow:0 3px 0 var(--c-soft);}
.dSlot{min-height:92px;border:4px dashed var(--c-line);border-radius:14px;background:#FFFDF8;display:flex;flex-wrap:wrap;gap:8px;
  align-items:center;justify-content:center;padding:8px;}
.dSlot .fcard{cursor:pointer;}
.dSlot.dropHot{outline:5px dashed var(--c-acc);}
.prodLine{font-size:21px;font-weight:900;color:var(--c-main2);text-align:center;margin-top:6px;}
.msgLine{font-size:18px;font-weight:800;margin-top:8px;min-height:28px;}
.msgLine.bad{color:var(--c-bad);}
.msgLine.good{color:var(--c-good);}

/* 通关脚注 */
#stageFoot .winCard{background:#EAF7EE;border:3px solid var(--c-good);border-radius:16px;padding:14px 16px;font-size:18px;}
#stageFoot .winCard .wt{font-size:23px;font-weight:900;color:var(--c-good);margin-bottom:4px;}
#stageFoot .winCard .ex{background:#fff;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:17px;}
.footBtns{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;}

/* 提示条 */
#hintBar{position:sticky;bottom:0;background:var(--c-ink);color:#fff;border-radius:14px 14px 0 0;
  padding:10px 16px;font-size:19px;font-weight:800;min-height:44px;z-index:20;}
#hintBar.flash{animation:hflash .5s;}
@keyframes hflash{0%{background:var(--c-acc);}100%{background:var(--c-ink);}}

/* 弹窗 */
#modalMask{position:fixed;inset:0;background:rgba(30,15,5,.5);display:flex;align-items:center;justify-content:center;z-index:80;padding:14px;}
#modalCard{background:#fff;border-radius:18px;max-width:760px;width:100%;max-height:84vh;overflow:auto;padding:22px 24px;
  border:4px solid var(--c-main);font-size:18px;}
#modalCard h2{margin:0 0 10px;color:var(--c-main2);font-size:26px;}
#modalCard h3{margin:14px 0 6px;font-size:20px;color:var(--c-main2);}
#modalCard .btnRow{display:flex;gap:12px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;}
.starBig{font-size:46px;text-align:center;letter-spacing:8px;}
.statLine{font-size:20px;font-weight:800;text-align:center;margin:8px 0;}

/* 拖拽幽灵与通用动效 */
.dragGhost{opacity:.88;pointer-events:none;transform:rotate(-3deg) scale(1.04);z-index:999;}
.dropHot{outline:5px dashed var(--c-acc);}
.shake{animation:shk .4s;}
@keyframes shk{0%,100%{transform:translateX(0);}25%{transform:translateX(-7px);}75%{transform:translateX(7px);}}
@keyframes pop{0%{transform:scale(.3);}70%{transform:scale(1.25);}100%{transform:scale(1);}}
.popIn{animation:pop .45s;}

/* 彩纸画布 */
#fxCanvas{position:fixed;inset:0;pointer-events:none;z-index:70;}

/* 响应式 */
@media (max-width:760px){
  #gameTitle{font-size:21px;}
  #hud{font-size:16px;}
  .btn{font-size:16px;padding:8px 12px;}
  .taskCard{font-size:18px;}
  .goldStar{font-size:38px;}
  .tcell{width:22px;height:30px;line-height:26px;font-size:17px;}
  .lamp{width:64px;height:64px;}
}
</style>
</head>
<body>
<div id="app">
  <!-- 顶栏：标题 / 计时步数 / 全局按钮 -->
  <header id="topbar">
    <div>
      <div id="gameTitle">尾数与余数 · 数字魔法工坊</div>
      <div id="levelName">第19周 尾数和余数 · 专题互动闯关</div>
    </div>
    <div id="hud">时间 00:00 · 操作 0 步 · 关卡 -</div>
    <nav id="menu">
      <button class="btn alt" id="btnRules">玩法说明</button>
      <button class="btn alt" id="btnReveal">揭示答案</button>
      <button class="btn alt" id="btnRestart">重新开始</button>
      <button class="btn alt" id="btnHome">返回难度选择</button>
    </nav>
  </header>

  <!-- 主舞台 -->
  <main id="stageArea"></main>

  <!-- 本关通关区 -->
  <section id="stageFoot"></section>

  <!-- 底部提示条 -->
  <div id="hintBar">欢迎来到数字魔法工坊！先看看玩法说明，再选一个难度出发吧。</div>
</div>

<!-- 弹窗 -->
<div id="modalMask" style="display:none;"><div id="modalCard"></div></div>
<!-- 彩纸特效画布 -->
<canvas id="fxCanvas"></canvas>

<script>
'use strict';
/* =====================================================================
   尾数与余数 · 数字魔法工坊
   内容来源：第19周《尾数和余数》教参（尾数循环 / 长数除法 / 除数反推 / 余数传递）
   四类操作式小游戏：
   A 尾数摩天轮（连乘尾数周期）   B 余数宝石合成台（余数和差积打包）
   C 长数字小火车（重复数字分组除） D 除数灯泡工厂（质因数拼除数）
   ===================================================================== */

/* ---------------- 基础工具 ---------------- */
function $(id){ return document.getElementById(id); }
function mk(tag, cls, html){
  var e = document.createElement(tag);
  if(cls){ e.className = cls; }
  if(html){ e.innerHTML = html; }
  return e;
}
function svgEl(tag, attrs){
  var e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for(var k in attrs){ e.setAttribute(k, attrs[k]); }
  return e;
}
function shuffleArr(a){
  var b = a.slice();
  for(var i = b.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = b[i]; b[i] = b[j]; b[j] = t;
  }
  return b;
}
function pickOne(a){ return a[Math.floor(Math.random() * a.length)]; }
/* 由 k 个 d 组成的多位数对 m 取余（逐位模，支持超大 k） */
function repMod(d, k, m){
  var r = 0;
  for(var i = 0; i < k; i++){ r = (r * 10 + d) % m; }
  return r;
}
function digitCount(x){ return String(x).length; }
function fmt2(x){ return x < 10 ? '0' + x : '' + x; }
/* 求 d 的连乘尾数循环序列（个位循环） */
function lastDigitCycle(d){
  var seq = [d], cur = d;
  while(true){
    cur = (cur * d) % 10;
    if(cur === d){ break; }
    seq.push(cur);
    if(seq.length > 4){ break; }
  }
  return seq;
}

/* ---------------- 随机色板（G8：每局换装） ---------------- */
var PALETTES = [
  {bg:'#FFF6EA', main:'#FF7043', main2:'#D8481D', soft:'#FFE3D4', acc:'#FFB300', ink:'#3A2417', line:'#EBCBB4'},
  {bg:'#EAF8F0', main:'#00897B', main2:'#00695C', soft:'#C9EFE5', acc:'#FFB300', ink:'#173B33', line:'#B2DDD2'},
  {bg:'#E9F3FD', main:'#1E88E5', main2:'#125C9E', soft:'#CBE5FA', acc:'#FB8C00', ink:'#152E46', line:'#B5D5F0'},
  {bg:'#F3ECFD', main:'#7C4DFF', main2:'#5533BB', soft:'#E3D5FB', acc:'#FFB300', ink:'#2B1C4E', line:'#CFBDF2'},
  {bg:'#FFFCE5', main:'#C79100', main2:'#8A6400', soft:'#FFF1B8', acc:'#E4581B', ink:'#3D3410', line:'#EBD98F'},
  {bg:'#FCE9F1', main:'#D81B60', main2:'#A01046', soft:'#FBD3E2', acc:'#F57F17', ink:'#43182C', line:'#F0BED1'}
];
function applyPalette(){
  var p = pickOne(PALETTES);
  var root = document.documentElement.style;
  root.setProperty('--c-bg', p.bg);
  root.setProperty('--c-main', p.main);
  root.setProperty('--c-main2', p.main2);
  root.setProperty('--c-soft', p.soft);
  root.setProperty('--c-acc', p.acc);
  root.setProperty('--c-ink', p.ink);
  root.setProperty('--c-line', p.line);
}

/* ---------------- 全局状态 ---------------- */
var G = {
  diff: null,        // 当前难度
  queue: [],         // 本局关卡队列
  idx: 0,            // 当前关索引
  steps: 0,          // 操作步数
  sec: 0,            // 计时秒数
  timerId: null,     // 计时器
  revealed: false,   // 本局是否用过“揭示答案”
  stageClearGuard: false // 防止重复结算
};
function updateHUD(){
  $('hud').textContent = '时间 ' + fmt2(Math.floor(G.sec / 60)) + ':' + fmt2(G.sec % 60) +
    ' · 操作 ' + G.steps + ' 步 · 关卡 ' + (G.queue.length ? (G.idx + 1) + '/' + G.queue.length : '-');
}
function addStep(){ G.steps++; updateHUD(); }
function startTimer(){
  stopTimer();
  G.timerId = setInterval(function(){ G.sec++; updateHUD(); }, 1000);
}
function stopTimer(){ if(G.timerId){ clearInterval(G.timerId); G.timerId = null; } }
function hint(msg, flash){
  var h = $('hintBar');
  h.textContent = msg;
  h.classList.remove('flash');
  if(flash){ void h.offsetWidth; h.classList.add('flash'); }
}

/* ---------------- 弹窗系统 ---------------- */
function showModal(html){ $('modalCard').innerHTML = html; $('modalMask').style.display = 'flex'; }
function closeModal(){ $('modalMask').style.display = 'none'; }
$('modalMask').addEventListener('pointerdown', function(ev){
  if(ev.target === $('modalMask')){ closeModal(); }
});

/* ---------------- 玩法说明（G6：随时可看） ---------------- */
function showRules(){
  showModal(
    '<h2>玩法说明 · 数字魔法工坊</h2>' +
    '<h3>目标</h3><p>通过四种“动手操作”的小游戏，玩转<b>尾数规律</b>和<b>余数性质</b>，闯过全部关卡！</p>' +
    '<h3>小游戏一：尾数摩天轮</h3><p>拉动拉杆，小火车每拉一次就多乘一个数，停在“尾数座位”上。多拉几次找出<b>周期</b>，再把金星拖到“第 n 次连乘”应落座的座位上。</p>' +
    '<h3>小游戏二：余数宝石合成台</h3><p>把两颗余数宝石拖进合成槽，合成出一堆“余数币”。每当币数够一整盘（= 除数 m），就把<b>托盘拖到币堆上</b>整盘打包带走；最后剩下的币就是余数！若还有宝石，带着新宝石继续合成。最后把余数宝石拖进<b>答案宝盒</b>。</p>' +
    '<h3>小游戏三：长数字小火车</h3><p>在车厢数字上<b>按住拖动</b>框选开头连续几节，看看余数；再拖动<b>分组滑条</b>找出“几节一组正好整除”；分完组后，把探照框<b>正好框住剩下的尾巴</b>车厢，读出余数，装进宝石送进宝盒。</p>' +

/* ---------------- 拖拽引擎（指针事件，兼容触摸） ---------------- */
function hitDrop(x, y, sel){
  var list = document.querySelectorAll(sel);
  for(var i = 0; i < list.length; i++){
    var r = list[i].getBoundingClientRect();
    if(x >= r.left - 8 && x <= r.right + 8 && y >= r.top - 8 && y <= r.bottom + 8){ return list[i]; }
  }
  return null;
}
function markDrops(sel, active){
  var list = document.querySelectorAll(sel);
  for(var i = 0; i < list.length; i++){ list[i].classList.toggle('dropHot', list[i] === active); }
}
/* 标记“刚刚完成了一次真实拖拽”，供点击备选路径避开拖拽后的连带 click 事件 */
var JUST_DRAGGED = false;
function enableDrag(elm, cfg){
  elm.style.touchAction = 'none';
  elm.addEventListener('pointerdown', function(ev){
    if(cfg.can && !cfg.can()){ return; }
    ev.preventDefault();
    var rect = elm.getBoundingClientRect();
    var ghost = elm.cloneNode(true);
    ghost.classList.add('dragGhost');
    ghost.style.position = 'fixed';
    ghost.style.left = rect.left + 'px';
    ghost.style.top = rect.top + 'px';
    ghost.style.width = rect.width + 'px';
    ghost.style.margin = '0';
    document.body.appendChild(ghost);
    var ox = ev.clientX - rect.left, oy = ev.clientY - rect.top;
    var sx = ev.clientX, sy = ev.clientY, moved = false;
    function mv(e){
      if(Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) > 8){ moved = true; }
      ghost.style.left = (e.clientX - ox) + 'px';
      ghost.style.top = (e.clientY - oy) + 'px';
      markDrops(cfg.dropSel, hitDrop(e.clientX, e.clientY, cfg.dropSel));
    }
    function up(e){
      document.removeEventListener('pointermove', mv);
      document.removeEventListener('pointerup', up);
      markDrops(cfg.dropSel, null);
      ghost.remove();
      JUST_DRAGGED = moved;
      var t = hitDrop(e.clientX, e.clientY, cfg.dropSel);
      addStep();
      cfg.onDrop(t, elm);
    }
    document.addEventListener('pointermove', mv);
    document.addEventListener('pointerup', up);
  });
}
/* 点击备选路径统一先检查本标记 */
function clickAfterDrag(){
  if(JUST_DRAGGED){ JUST_DRAGGED = false; return true; }
  return false;
}
function shakeEl(el){
  el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
}

/* ---------------- 彩纸庆祝（G5） ---------------- */
var FX = { parts: [], running: false };
function fxResize(){
  var c = $('fxCanvas');
  c.width = window.innerWidth; c.height = window.innerHeight;
}
window.addEventListener('resize', fxResize); fxResize();
function fxColors(){
  var p = getComputedStyle(document.documentElement);
  return [p.getPropertyValue('--c-main'), p.getPropertyValue('--c-acc'),
          p.getPropertyValue('--c-main2'), '#2E9E5B', '#1E88E5', '#E91E63'];
}
function fxBurst(cx, cy, n){
  var cols = fxColors();
  for(var i = 0; i < n; i++){
    FX.parts.push({
      x: cx, y: cy,
      vx: (Math.random() - 0.5) * 11,
      vy: -Math.random() * 9 - 3,
      w: 7 + Math.random() * 8, h: 5 + Math.random() * 6,
      rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3,
      col: cols[Math.floor(Math.random() * cols.length)],
      life: 90 + Math.random() * 50
    });
  }
  fxLoop();
}
function fxRain(){
  var cols = fxColors();
  for(var i = 0; i < 130; i++){
    FX.parts.push({
      x: Math.random() * window.innerWidth,
      y: -20 - Math.random() * window.innerHeight * 0.6,
      vx: (Math.random() - 0.5) * 2.4,
      vy: 2.4 + Math.random() * 3.4,
      w: 7 + Math.random() * 8, h: 5 + Math.random() * 6,
      rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3,
      col: cols[Math.floor(Math.random() * cols.length)],
      life: 260
    });
  }
  fxLoop();
}
function fxLoop(){
  if(FX.running){ return; }
  FX.running = true;
  var ctx = $('fxCanvas').getContext('2d');
  function frame(){
    ctx.clearRect(0, 0, $('fxCanvas').width, $('fxCanvas').height);
    for(var i = FX.parts.length - 1; i >= 0; i--){
      var p = FX.parts[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.16; p.rot += p.vr; p.life--;
      if(p.life <= 0 || p.y > window.innerHeight + 30){ FX.parts.splice(i, 1); continue; }
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    if(FX.parts.length){ requestAnimationFrame(frame); }
    else { FX.running = false; ctx.clearRect(0, 0, $('fxCanvas').width, $('fxCanvas').height); }
  }
  requestAnimationFrame(frame);
}

  $('stageArea').appendChild(box);
  var no = '第 ' + (G.idx + 1) + ' 关 / 共 ' + G.queue.length + ' 关 · ';
  if(st.kind === 'A'){ stageA(box, st.cfg, no); }
  else if(st.kind === 'B'){ stageB(box, st.cfg, no); }
  else if(st.kind === 'C'){ stageC(box, st.cfg, no); }
  else if(st.kind === 'CB'){ stageCB(box, st.cfg, no); }
  else if(st.kind === 'D'){ stageD(box, st.cfg, no); }
  updateHUD();
}

/* 通关结算 */
function finishStage(winTitle, explain){
  if(G.stageClearGuard){ return; }
  G.stageClearGuard = true;
  var r = $('stageArea').getBoundingClientRect();
  fxBurst(r.left + r.width / 2, Math.max(80, r.top + 120), 60);
  var foot = $('stageFoot');
  foot.innerHTML = '';
  var c = mk('div', 'winCard');
  c.appendChild(mk('div', 'wt', '★ ' + winTitle + ' ★'));
  c.appendChild(mk('div', '', explain ? '【本题解析】' + explain : ''));
  var btns = mk('div', 'footBtns');
  if(G.idx + 1 < G.queue.length){
    var nb = mk('button', 'btn big', '下一关 ▶');
    nb.addEventListener('click', function(){ G.idx++; renderStage(); });
    btns.appendChild(nb);
  } else {
    var lb = mk('button', 'btn big', '查看通关成绩 🏆');
    lb.addEventListener('click', levelComplete);
    btns.appendChild(lb);
  }
  c.appendChild(btns);
  foot.appendChild(c);
  foot.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  hint('太棒了，这一关完成！' + (G.idx + 1 < G.queue.length ? '点“下一关”继续。' : '点“查看通关成绩”。'), true);
}

function levelComplete(){
  stopTimer();
  var stars = G.revealed ? 2 : 3;
  var starStr = '';
  for(var i = 0; i < 3; i++){ starStr += i < stars ? '★' : '☆'; }
  fxRain();
  showModal(
    '<h2>通关啦！</h2>' +
    '<div class="starBig">' + starStr + '</div>' +
    '<div class="statLine">' + LEVEL_NAME[G.diff] + ' 全部完成！</div>' +
    '<div class="statLine">用时 ' + fmt2(Math.floor(G.sec / 60)) + ' 分 ' + fmt2(G.sec % 60) + ' 秒 · 共操作 ' + G.steps + ' 步</div>' +
    (G.revealed ? '<p style="text-align:center;">这一局看过答案提示，下次试试自己闯出 3 颗星！</p>' : '<p style="text-align:center;">完全靠自己通关，你已经是尾数与余数小达人啦！</p>') +
    '<div class="btnRow" style="justify-content:center;">' +
    '<button class="btn big" id="againBtn">再玩一次（题目会换新）</button>' +
    '<button class="btn big alt" id="backHomeBtn">返回难度选择</button></div>'
  );

  $('backHomeBtn').addEventListener('click', function(){ closeModal(); renderHome(); });
}

/* 揭示答案（G4） */
function revealStage(){
  if(!G.queue.length){
    hint('请先选择一个难度开始闯关哦。', true);
    return;
  }
  var st = G.queue[G.idx];
  G.revealed = true;
  var txt = '';
  if(st.kind === 'A' && !st.cfg.double){ txt = '正确答案：尾数是 <b>' + st.cfg.answer + '</b>。'; }
  else if(st.kind === 'A'){ txt = '两串的尾数分别是 ' + st.cfg.p1.answer + ' 和 ' + st.cfg.p2.answer + '，相乘的尾数是 <b>' + st.cfg.answer + '</b>。'; }
  else { txt = '正确答案：余数是 <b>' + st.cfg.answer + '</b>。'; }
  if(st.kind === 'D'){ txt = '要拼出的除数是：<b>' + st.cfg.targets.join('、') + '</b>。'; }
  showModal('<h2>揭示答案</h2><p>' + txt + '</p><p style="background:var(--c-soft);border-radius:10px;padding:10px;">【解析】' +
    st.cfg.explain + '</p><div class="btnRow"><button class="btn big" onclick="closeModal()">明白了，继续闯关</button></div>');
}

/* =====================================================================
   小游戏 A：尾数摩天轮
   ===================================================================== */
function stageA(box, cfg, no){
  if(cfg.double){ stageADouble(box, cfg, no); return; }
  box.appendChild(stageHead(no + '尾数摩天轮', '拉一拉拉杆，让尾数坐上摩天轮', cfg.task,
    '先把小火车多拉几站，看看尾数座位亮起的顺序（周期），再把右下角的金星拖到“第 ' + cfg.n + ' 次连乘”应落座的座位上。'));
  var body = mk('div', 'card');
  var row = mk('div', 'flexRow');
  var wheelBox = mk('div', 'wheelBox grow');
  row.appendChild(wheelBox);
  var side = mk('div', 'grow');
  var lever = mk('button', 'btn big', '🚂 再乘一个 ' + cfg.last);
  side.appendChild(lever);
  side.appendChild(mk('div', 'subNote', '每拉一次，就多乘一个 ' + cfg.base + '（只看个位）。'));
  var hist = mk('div', 'histBox');
  hist.appendChild(mk('div', '', '连乘记录：'));
  side.appendChild(hist);
  var tipC = mk('div', 'card');
  tipC.style.margin = '10px 0';
  tipC.appendChild(mk('div', '', '<b>口诀</b>：个位相乘看尾数，尾数排队找周期；总个数除以周期数，余几就看第几站（余 0 看最后一站）。'));
  side.appendChild(tipC);
  row.appendChild(side);
  body.appendChild(row);
  box.appendChild(body);

  /* 构建摩天轮 */
  var seq = lastDigitCycle(cfg.last);
  var period = seq.length;
  var svg = svgEl('svg', { viewBox: '0 0 440 440' });
  var CX = 220, CY = 220, R = 150;
  var seatEls = [];
  for(var i = 0; i < period; i++){
    var ang = -Math.PI / 2 + i * 2 * Math.PI / period;
    var x = CX + R * Math.cos(ang), y = CY + R * Math.sin(ang);
    var g = svgEl('g', { 'class': 'seatDrop' });
    g.dataset.d = seq[i];
    g.appendChild(svgEl('circle', { cx: x, cy: y, r: 46 }));
    var t1 = svgEl('text', { x: x, y: y + 8, 'class': 'sdig' });
    t1.textContent = seq[i];
    g.appendChild(t1);
    var t2 = svgEl('text', { x: x, y: y + 28, 'class': 'sord' });
    t2.textContent = '第' + (i + 1) + '次';
    g.appendChild(t2);
    svg.appendChild(g);
    seatEls.push(g);
  }
  var wc = svgEl('g', { 'class': 'wheelCenter' });
  var w1 = svgEl('text', { x: CX, y: CY - 12, 'class': 'wc1' }); w1.textContent = '尾数 ' + cfg.last;
  var w2 = svgEl('text', { x: CX, y: CY + 16, 'class': 'wc2' }); w2.textContent = '已连乘 0 个';
  wc.appendChild(w1); wc.appendChild(w2);
  svg.appendChild(wc);
  var token = svgEl('text', { id: 'wheelToken', x: CX, y: CY + 60 });
  token.textContent = '🚂';
  svg.appendChild(token);
  wheelBox.appendChild(svg);
  var star = mk('div', 'goldStar', '⭐');
  star.title = '金星：第' + cfg.n + '次连乘的尾数座位';
  wheelBox.appendChild(star);
  function seatCenter(i){
    var ang = -Math.PI / 2 + i * 2 * Math.PI / period;
    return { x: CX + R * Math.cos(ang), y: CY + R * Math.sin(ang) };
  }
  var k = 0;
  lever.addEventListener('click', function(){
    k++;
    var idx = (k - 1) % period;
    var p = seatCenter(idx);
    token.style.opacity = '1';
    token.style.transform = 'translate(' + (p.x - CX) + 'px,' + (p.y - CY - 8) + 'px)';
    seatEls[idx].classList.remove('flash'); void seatEls[idx].getBoundingClientRect();
    seatEls[idx].classList.add('flash');
    w2.textContent = '已连乘 ' + k + ' 个';
    hist.insertBefore(mk('div', '', '第 ' + k + ' 次连乘 → 尾数 <b>' + seq[idx] + '</b>'), hist.firstChild.nextSibling);
    if(k === period + 1){
      hint('发现了吗？尾数转圈圈啦！周期是 ' + period + '：' + seq.join('、') + '。现在用 ' + cfg.n + ' ÷ ' + period + ' 算算落在第几站，把金星拖过去！', true);
    }
    addStep();
  });
  enableDrag(star, {
    dropSel: '.seatDrop',
    can: function(){ return true; },
    onDrop: function(t){
      if(!t){ hint('要把金星放到座位圈上哦。'); return; }
      var d = parseInt(t.dataset.d, 10);
      if(d === cfg.answer){
        t.classList.add('winRing');
        finishStage('尾数是 ' + cfg.answer, cfg.explain);
      } else {
        shakeEl(t);
        hint('再想想：' + cfg.n + ' ÷ ' + period + ' = ' + Math.floor(cfg.n / period) + ' 余 ' + (cfg.n % period) +
          '，对应周期里的第几站呢？（余 0 就是第 ' + period + ' 站）', true);
      }
    }
  });
  hint('先拉几次拉杆，观察尾数座位的顺序，找出周期！');
}

/* A4：双转盘（0.3 与 2.5 分开转，再相乘） */

  box.appendChild(stageHead(no + '双转盘尾数挑战', '两串数分开转，再把尾数相乘', cfg.task,

    side.appendChild(hist);
    row.appendChild(side);

    var seq = lastDigitCycle(pcfg.last), period = seq.length;
    var svg = svgEl('svg', { viewBox: '0 0 440 440' });
    var CX = 220, CY = 220, R = 150, seatEls = [];
    for(var i = 0; i < period; i++){
      var ang = -Math.PI / 2 + i * 2 * Math.PI / period;
      var x = CX + R * Math.cos(ang), y = CY + R * Math.sin(ang);
      var g = svgEl('g', { 'class': 'seatDrop' });
      g.dataset.d = seq[i];
      g.appendChild(svgEl('circle', { cx: x, cy: y, r: 46 }));
      var t1 = svgEl('text', { x: x, y: y + 8, 'class': 'sdig' }); t1.textContent = seq[i]; g.appendChild(t1);
      var t2 = svgEl('text', { x: x, y: y + 28, 'class': 'sord' }); t2.textContent = '第' + (i + 1) + '次'; g.appendChild(t2);
      svg.appendChild(g); seatEls.push(g);
    }
    var w2 = svgEl('text', { x: CX, y: CY + 16, 'class': 'wc2' }); w2.textContent = '已连乘 0 个';
    var w1 = svgEl('text', { x: CX, y: CY - 12, 'class': 'wc1' }); w1.textContent = '尾数 ' + pcfg.last;

    svg.appendChild(token);
    wheelBox.appendChild(svg);
    var star = mk('div', 'goldStar', '⭐');
    wheelBox.appendChild(star);
    function seatCenter(i){
      var ang = -Math.PI / 2 + i * 2 * Math.PI / period;
      return { x: CX + R * Math.cos(ang), y: CY + R * Math.sin(ang) };
    }
    var k = 0;
    lever.addEventListener('click', function(){
      k++;
      var idx = (k - 1) % period;
      var p = seatCenter(idx);
      token.style.opacity = '1';
      token.style.transform = 'translate(' + (p.x - CX) + 'px,' + (p.y - CY - 8) + 'px)';

          t.classList.add('winRing');

        else { shakeEl(t); hint('再想想：' + res[0] + ' × ' + res[1] + ' = ' + (res[0] * res[1]) + '，个位是几？', true); }
      }
    });
  }
  runWheel(cfg.p1);
  hint('双转盘挑战！先拉几次拉杆找出周期，再用金星答题。');
}

/* =====================================================================
   小游戏 B：余数宝石合成台（宝石 → 余数币 → 整盘打包 → 结果宝石 → 宝盒）
   ===================================================================== */
function gemEl(gem, mod){
  var e = mk('div', 'gem');
  e.appendChild(mk('div', 'gn', gem.name));
  e.appendChild(mk('div', 'gr', '÷' + mod + ' 余 ' + gem.r));
  e.dataset.r = gem.r;
  return e;
}
/* 共用的合成台视图（也供 CB 关卡复用）：gems:[{name,r}] */
function buildSynthView(box, scfg, finalAnswer, onWin, headNote){
  var dock = [];      /* 待合成宝石 [{name,r,el}] */
  var slotGems = [];  /* 已放入槽的宝石 */
  var chipsV = 0, packs = 0;
  var phaseS = 'combine'; /* combine | pack | submit */

  var wrap = mk('div');
  if(headNote){ wrap.appendChild(mk('div', 'subNote', headNote)); }
  /* 宝石码头 */
  var dockCard = mk('div', 'card');
  dockCard.appendChild(mk('h3', '', '<b>余数宝石码头</b>（把宝石拖进下面的合成槽）'));
  var dockBox = mk('div', 'gemDock');
  dockCard.appendChild(dockBox);
  /* 合成槽 */
  var synthCard = mk('div', 'card');
  synthCard.appendChild(mk('h3', '', '<b>合成台</b>（两颗一合，先算余数的' + scfg.opName + '，得到“余数币”）'));
  var srow = mk('div', 'synthRow');
  var slot1 = mk('div', 'bslot', '宝石槽 1');
  var slot2 = mk('div', 'bslot', '宝石槽 2');
  var opSymEl = mk('div', 'opSym', scfg.opSym);
  srow.appendChild(slot1); srow.appendChild(opSymEl); srow.appendChild(slot2);
  synthCard.appendChild(srow);
  var eqLine = mk('div', 'prodLine', '');
  synthCard.appendChild(eqLine);
  /* 余数币区 */
  var chipCard = mk('div', 'card');
  chipCard.appendChild(mk('h3', '', '<b>余数币区</b>'));
  var chipZone = mk('div', 'chipZone');
  chipCard.appendChild(chipZone);
  /* 托盘 */
  var trayCard = mk('div', 'card');
  var trayRow = mk('div', 'flexRow');
  trayRow.style.alignItems = 'center';
  var tray = mk('div', 'tray');
  var slotIcons = mk('div', 'slots');
  for(var si = 0; si < scfg.mod; si++){ slotIcons.appendChild(document.createElement('i')); }
  tray.appendChild(slotIcons);
  tray.appendChild(mk('div', 'tl', '整盘 = ' + scfg.mod + ' 枚 · 拖我到币堆打包'));
  trayRow.appendChild(tray);
  var packInfo = mk('div', 'packLine grow', '已打包 0 盘（共 0 枚）。规则：每凑满 ' + scfg.mod + ' 枚就装走一整盘，剩下的才是余数！');
  trayRow.appendChild(packInfo);
  trayCard.appendChild(trayRow);
  /* 结晶按钮 + 宝盒 */
  var crystalCard = mk('div', 'card');
  crystalCard.appendChild(mk('h3', '', '<b>最后的余数</b>'));
  var cryRow = mk('div', 'resultGemRow');
  var cryBtn = mk('button', 'btn big', '💎 结出余数宝石');
  cryBtn.style.display = 'none';
  cryRow.appendChild(cryBtn);
  crystalCard.appendChild(cryRow);
  var aboxCard = mk('div', 'card');
  aboxCard.appendChild(mk('h3', '', '<b>答案宝盒</b>'));
  var abox = mk('div', 'answerBox', '🎁 把最后的余数宝石拖进这里');
  abox.id = 'answerBox';
  aboxCard.appendChild(abox);

  wrap.appendChild(dockCard); wrap.appendChild(synthCard); wrap.appendChild(chipCard);
  wrap.appendChild(trayCard); wrap.appendChild(crystalCard); wrap.appendChild(aboxCard);
  box.appendChild(wrap);

  function renderDock(){
    dockBox.innerHTML = '';
    for(var i = 0; i < dock.length; i++){
      (function(gm){
        var e = gemEl(gm, scfg.mod);
        gm.el = e;
        enableDrag(e, {
          dropSel: '.bslot',
          can: function(){ return phaseS === 'combine'; },
          onDrop: function(t){
            if(!t){ hint('把宝石拖到合成槽里。'); return; }
            placeGem(t, gm);
          }
        });
        /* 点击备选：先选中，再点槽 */
        e.addEventListener('click', function(){
          if(clickAfterDrag()){ return; }
          if(phaseS !== 'combine'){ return; }
          var all = dockBox.querySelectorAll('.gem');
          for(var q = 0; q < all.length; q++){ all[q].classList.remove('selGem'); }
          e.classList.add('selGem');
          hint('已选中宝石“' + gm.name + '”，点一下合成槽放进去。');
        });
        dockBox.appendChild(e);
      })(dock[i]);
    }
  }
  slot1.addEventListener('click', function(){ tryClickPlace(slot1); });
  slot2.addEventListener('click', function(){ tryClickPlace(slot2); });
  function tryClickPlace(slotEl){
    if(phaseS !== 'combine'){ return; }
    var sel = dockBox.querySelector('.selGem');
    if(!sel){ return; }
    for(var i = 0; i < dock.length; i++){
      if(dock[i].el === sel){ placeGem(slotEl, dock[i]); return; }
    }
  }
  function placeGem(slotEl, gm){
    /* 该槽已有宝石则先退回 */
    for(var i = 0; i < slotGems.length; i++){
      if(slotGems[i].slot === slotEl){ backToDock(slotGems[i]); }
    }
    var idx = dock.indexOf(gm);
    if(idx < 0){ return; }
    dock.splice(idx, 1);
    slotGems.push({ gm: gm, slot: slotEl });
    slotEl.classList.add('filled');
    slotEl.innerHTML = '';
    slotEl.appendChild(gm.el);
    gm.el.classList.remove('selGem');
    /* 点击槽内宝石可退回码头 */
    gm.el.addEventListener('click', function(ev){
      ev.stopPropagation();
      if(clickAfterDrag()){ return; }
      if(phaseS !== 'combine'){ return; }
      backToDock({ gm: gm, slot: slotEl });
    });
    if(slotGems.length === 2){ doCombine(); }
    else { hint('再放一颗宝石，就开始合成。'); }
  }
  function backToDock(pair){
    var i = slotGems.indexOf(pair);
    if(i >= 0){ slotGems.splice(i, 1); }
    pair.slot.classList.remove('filled');
    pair.slot.innerHTML = '宝石槽';
    dock.push(pair.gm);
    renderDock();
    eqLine.textContent = '';
  }
  function doCombine(){
    var a = slotGems[0].gm.r, b = slotGems[1].gm.r;
    var v;
    var hi = Math.max(a, b), lo = Math.min(a, b);
    if(scfg.op === 'sum'){ v = a + b; }
    else if(scfg.op === 'prod'){ v = a * b; }
    else { v = hi - lo; }
    /* 展示算式：减法按大数减小数（甲数大于乙数） */
    var left = (scfg.op === 'diff') ? hi : a;
    var right = (scfg.op === 'diff') ? lo : b;
    eqLine.textContent = '余数算式：' + left + ' ' + scfg.opSym + ' ' + right + ' = ' + v + ' 枚余数币';
    chipsV = v; packs = 0;
    phaseS = 'pack';
    slotGems = [];
    slot1.classList.remove('filled'); slot1.innerHTML = '宝石槽';
    slot2.classList.remove('filled'); slot2.innerHTML = '宝石槽';
    renderChips();
    if(chipsV >= scfg.mod){
      hint('得到 ' + chipsV + ' 枚余数币！够整盘啦，把托盘拖到币堆上打包（每盘 ' + scfg.mod + ' 枚）。', true);
    } else {
      afterPackCheck();
    }
  }
  function renderChips(){
    chipZone.innerHTML = '';
    var show = Math.min(chipsV, 160);
    for(var i = 0; i < show; i++){ chipZone.appendChild(mk('i', 'cd')); }
    var cnt = mk('div', 'cnt', chipsV + ' 枚');
    chipZone.appendChild(cnt);
    if(chipsV > 160){
      chipZone.appendChild(mk('div', 'subNote', '（币太多画不下，以数字为准：' + chipsV + ' 枚）'));
    }
  }
  /* 打包：托盘拖到币堆 / 或点击托盘一次装一盘 */
  function packOnce(){
    if(phaseS !== 'pack'){ hint('现在不用打包哦。'); return; }
    if(chipsV >= scfg.mod){
      chipsV -= scfg.mod; packs++;
      packInfo.textContent = '已打包 ' + packs + ' 盘（共 ' + (packs * scfg.mod) + ' 枚）。规则：每凑满 ' + scfg.mod + ' 枚就装走一整盘，剩下的才是余数！';
      renderChips();
      addStep();
      if(chipsV >= scfg.mod){ hint('还剩 ' + chipsV + ' 枚，继续打包！'); }
      else { afterPackCheck(); }
    } else {
      hint('不够一整盘啦（要 ' + scfg.mod + ' 枚）。', true);
    }
  }
  enableDrag(tray, { dropSel: '.chipZone', can: function(){ return phaseS === 'pack'; }, onDrop: function(t){ if(t){ packOnce(); } else { hint('把托盘拖到余数币堆上打包。'); } } });
  tray.addEventListener('click', function(){ if(clickAfterDrag()){ return; } packOnce(); });
  chipZone.id = 'chipZone';
  function afterPackCheck(){
    if(chipsV < scfg.mod){
      cryBtn.style.display = 'inline-block';
      hint('剩下 ' + chipsV + ' 枚，不够一整盘了——剩下的就是余数！点“结出余数宝石”。', true);
    }
  }
  cryBtn.addEventListener('click', function(){
    cryBtn.style.display = 'none';
    addStep();
    var remain = chipsV;
    phaseS = 'combine';
    chipZone.innerHTML = '';
    chipZone.appendChild(mk('div', 'cnt', '余数币已结晶成宝石'));
    if(dock.length >= 1){
      /* 还有宝石没合：新宝石回码头继续 */
      dock.push({ name: '新宝石', r: remain });
      renderDock();
      hint('结晶出新宝石（余 ' + remain + '）！把它和剩下的宝石继续合成。', true);
    } else {
      /* 全部合完：进入提交阶段 */
      phaseS = 'submit';
      var fg = { name: '余数宝石', r: remain };
      var fe = gemEl(fg, scfg.mod);
      fe.classList.add('newGem', 'popIn');
      cryRow.innerHTML = '';
      cryRow.appendChild(mk('div', 'subNote', '这就是最终答案的余数（' + remain + '）！把它拖进答案宝盒。'));
      cryRow.appendChild(fe);
      enableDrag(fe, {
        dropSel: '#answerBox',
        can: function(){ return phaseS === 'submit'; },
        onDrop: function(t){
          if(!t){ hint('把余数宝石拖进答案宝盒！'); return; }
          if(fg.r === finalAnswer){
            abox.classList.add('ok');
            abox.innerHTML = '🎁 余数是 <b>' + fg.r + '</b>，答对啦！';
            onWin();
          } else {
            shakeEl(abox);
            hint('再核对一下：打包整盘后剩下的枚数才是余数哦。', true);
          }
        }
      });
      hint('最后一步：把余数宝石拖进答案宝盒！', true);
    }
  });
  /* 初始化码头 */
  for(var gi = 0; gi < scfg.gems.length; gi++){
    dock.push({ name: scfg.gems[gi].name, r: scfg.gems[gi].r });
  }
  renderDock();
}

    '性质：几个数的' + cfg.opName + '除以 ' + cfg.mod + ' 的余数，等于各数余数的' + cfg.opName + '再除以 ' + cfg.mod + ' 的余数。'));

/* =====================================================================
   小游戏 C：长数字小火车（探框 → 分组 → 尾巴 → 宝石 → 宝盒）
   ===================================================================== */
function buildTrainView(box, tcfg, collectMode, onGem){
  /* tcfg: {digit,n,mod,answer,anySuffix} collectMode: 宝石收集（不入宝盒） */
  var explored = {};     /* 已探究过的长度 */
  var exploredCount = 0;
  var gCur = 0;          /* 当前分组长度 */
  var bannerShown = false;

  var wrap = mk('div');
  /* 引导 */
  wrap.appendChild(mk('div', 'subNote',
    '第 1 步：<b>探一探</b>——在小火车上按住并拖动，框选开头连续几节，看“几个一组”的余数；' +
    '第 2 步：<b>分一分</b>——拖动分组滑条，找到“正好整除”的每组节数；' +
    '第 3 步：<b>框尾巴</b>——把探照框正好框住剩下的尾巴车厢，读出余数！'));
  /* 工具区 */
  var tools = mk('div', 'cTools');
  var probe = mk('div', 'probePanel', '<b>探照框结果</b><br>先在小火车上按住拖动框选几节车厢试试。');
  var groupP = mk('div', 'groupPanel', '<b>分组滑条</b>：每组 <span class="sliderLabel" id="gLabel">?</span> 节');
  tools.appendChild(probe); tools.appendChild(groupP);
  wrap.appendChild(tools);
  var banner = mk('div', 'banner'); banner.style.display = 'none';
  wrap.appendChild(banner);
  /* 小火车 */
  var twrap = mk('div', 'trainWrap');
  var train = mk('div', 'train');
  twrap.appendChild(mk('div', 'subNote', '共 <b>' + tcfg.n + '</b> 节“' + tcfg.digit + '”车厢（框选最多 40 节来找规律）'));
  twrap.appendChild(train);
  wrap.appendChild(twrap);
  /* 收集 / 宝盒 */
  var gemTray = mk('div', 'card');
  gemTray.appendChild(mk('h3', '', '<b>宝石收集处</b>'));
  var trayBox = mk('div', 'gemDock');
  gemTray.appendChild(trayBox);
  var aboxCard = mk('div', 'card');
  aboxCard.appendChild(mk('h3', '', '<b>答案宝盒</b>'));
  var abox = mk('div', 'answerBox', '🎁 把尾巴的余数宝石拖进这里');
  abox.id = 'answerBox';
  aboxCard.appendChild(abox);
  if(collectMode){ wrap.appendChild(gemTray); } else { wrap.appendChild(aboxCard); }
  box.appendChild(wrap);

  /* 生成车厢 */
  var frag = document.createDocumentFragment();
  for(var i = 0; i < tcfg.n; i++){
    var c = mk('div', 'tcell', String(tcfg.digit));
    c.dataset.i = i;
    frag.appendChild(c);
  }
  train.appendChild(frag);
  var cells = train.querySelectorAll('.tcell');
  function cellAt(i){ return cells[i]; }

  /* 分组滑条（自制，指针拖动） */
  var gLabel = groupP.querySelector('#gLabel');
  var track = mk('div', 'sliderTrack');
  var knob = mk('div', 'sliderKnob');
  track.appendChild(knob);
  groupP.appendChild(mk('div', '', '拖动圆钮选择每组的节数（1~8 节）'));
  groupP.appendChild(track);
  var gInfo = mk('div', '', '尚未分组。');
  groupP.appendChild(gInfo);
  function setKnob(g, commit){
    gCur = g;
    gLabel.textContent = g;
    var ratio = (g - 1) / 7;
    knob.style.left = (ratio * 100) + '%';
    applyGroup();
    if(commit){ addStep(); }
  }
  function applyGroup(){
    /* 重置样式并按 gCur 分组 */
    var q = Math.floor(tcfg.n / gCur);
    var t = tcfg.n - q * gCur;
    for(var i = 0; i < tcfg.n; i++){
      var c = cellAt(i);
      c.className = 'tcell';
      if(i < q * gCur){ if(Math.floor(i / gCur) % 2 === 1){ c.classList.add('gB'); } }
      else { c.classList.add('tail'); }
    }
    var rem = repMod(tcfg.digit, gCur, tcfg.mod);
    gInfo.innerHTML = '每 ' + gCur + ' 个' + tcfg.digit + ' 一组：' + new Array(gCur + 1).join(String(tcfg.digit)) +
      ' ÷ ' + tcfg.mod + ' 余 <b>' + rem + '</b>' + (rem === 0 ? ' —— <b>正好整除！可以这样分组</b>' : '（不整除，换一组试试）') +
      '<br>' + tcfg.n + ' ÷ ' + gCur + ' = ' + q + ' 组 …… 剩 <b>' + t + '</b> 节尾巴车厢（已高亮）。';
    if(rem === 0){
      if(t === 0){
        gInfo.innerHTML += ' 正好分完，没有尾巴！余数是 0。';
        spawnGem(0);
      } else {
        hint('分组成功！现在把探照框<b>正好框住最后 ' + t + ' 节尾巴</b>（从第 ' + (tcfg.n - t + 1) + ' 节到最后一节）。', true);
      }
    }
  }
  /* 滑条拖动 */
  knob.addEventListener('pointerdown', function(ev){
    ev.preventDefault();
    function mv(e){
      var r = track.getBoundingClientRect();
      var ratio = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
      var g = 1 + Math.round(ratio * 7);
      if(g !== gCur){ setKnob(g, false); }
    }
    function up(){
      document.removeEventListener('pointermove', mv);
      document.removeEventListener('pointerup', up);
      addStep();
    }
    document.addEventListener('pointermove', mv);
    document.addEventListener('pointerup', up);
  });

  /* 探照框（橡皮筋框选） */
  var selStart = -1, selEnd = -1;
  function clearSel(){
    for(var i = 0; i < tcfg.n; i++){ cellAt(i).classList.remove('sel'); }
  }
  function applySel(a, b){
    clearSel();
    for(var i = a; i <= b; i++){ cellAt(i).classList.add('sel'); }
  }
  train.addEventListener('pointerdown', function(ev){
    ev.preventDefault();
    var tgt = ev.target.closest ? ev.target.closest('.tcell') : null;
    if(!tgt){ return; }
    selStart = parseInt(tgt.dataset.i, 10);
    selEnd = selStart;
    function mv(e){
      var el2 = document.elementFromPoint(e.clientX, e.clientY);
      var c2 = el2 && el2.closest ? el2.closest('.tcell') : null;
      if(c2){
        var idx = parseInt(c2.dataset.i, 10);
        /* 限制框选最多 40 节，便于试规律 */
        if(idx >= selStart){
          selEnd = Math.min(idx, selStart + 39);
        } else {
          selEnd = selStart;
          selStart = Math.max(idx, selEnd - 39);
        }
        applySel(selStart, selEnd);
      }
    }
    function up(){
      document.removeEventListener('pointermove', mv);
      document.removeEventListener('pointerup', up);
      if(selEnd < selStart){ var tmp = selStart; selStart = selEnd; selEnd = tmp; }
      finalizeSel(selStart, selEnd);
    }
    document.addEventListener('pointermove', mv);
    document.addEventListener('pointerup', up);
  });
  function finalizeSel(a, b){
    var k = b - a + 1;
    if(k <= 0){ return; }
    addStep();
    var r = repMod(tcfg.digit, k, tcfg.mod);
    probe.innerHTML = '<b>探照框结果</b><br>框住开头连续 <b>' + k + '</b> 节：由 ' + k + ' 个 ' + tcfg.digit +
      ' 组成的数 ÷ ' + tcfg.mod + ' → 余 <b>' + r + '</b>' + (r === 0 ? '（<b>整除！</b>）' : '（不整除）');
    if(!explored[k]){ explored[k] = true; exploredCount++; }
    /* 特殊路径：无论如何都除不尽，但每次余数相同 → 看末尾即可 */
    if(tcfg.anySuffix && exploredCount >= 3 && !bannerShown){
      var allSame = true;
      for(var kk in explored){ if(repMod(tcfg.digit, parseInt(kk, 10), tcfg.mod) !== r){ allSame = false; } }
      if(allSame){
        bannerShown = true;
        banner.style.display = 'block';
        banner.innerHTML = '🔎 小侦探发现：试了 ' + exploredCount + ' 种长度，余数都是 <b>' + r + '</b>！那整列火车除以 ' +
          tcfg.mod + ' 的余数一定也是它。现在<b>框住“到最后一节”的任意一段</b>，装出余数宝石吧！';
        hint('大发现！余数全都一样——框住任意一段“到末尾”的车厢试试！', true);
      }
    }
    /* 正常路径：正好框住分组后的尾巴 */
    if(gCur > 0){
      var q = Math.floor(tcfg.n / gCur);
      var t = tcfg.n - q * gCur;
      var remg = repMod(tcfg.digit, gCur, tcfg.mod);
      if(remg === 0 && t > 0 && a === tcfg.n - t && b === tcfg.n - 1){
        for(var i = a; i <= b; i++){ cellAt(i).classList.add('gemcell'); }
        spawnGem(r);
      } else if(remg === 0 && t > 0){
        hint('这段的余数是 ' + r + '，但它不是分组后的尾巴哦——尾巴是<b>最后 ' + t + ' 节</b>。');
      }
    }
    /* 特殊路径提交：框住“到最后一节”的任意一段，即可直接装出余数宝石 */
    if(tcfg.anySuffix && bannerShown && b === tcfg.n - 1){
      spawnGem(r);
    }
  }
  /* 结晶宝石：collectMode → 收集处；否则 → 宝盒 */
  var gemDone = false;
  var lastRow = null;
  function spawnGem(r){
    if(gemDone){
      if(collectMode){ return; } /* 收集模式只收一次 */
      /* 非收集模式：若宝盒处答错会重置 gemDone，重新结晶并替换旧宝石行 */
    }
    gemDone = true;
    var gm = { name: '余数宝石', r: r };
    var e = gemEl(gm, tcfg.mod);
    e.classList.add('newGem', 'popIn');
    if(collectMode){
      trayBox.innerHTML = '';
      trayBox.appendChild(e);
      hint('收到余数宝石（余 ' + r + '）！', true);
      onGem(r);
    } else {
      if(lastRow && lastRow.parentNode === aboxCard){ aboxCard.removeChild(lastRow); }
      var rowC = mk('div', 'resultGemRow');
      rowC.appendChild(mk('div', 'subNote', '尾巴的余数是 ' + r + '！把它拖进答案宝盒。'));
      rowC.appendChild(e);
      lastRow = rowC;
      aboxCard.insertBefore(rowC, abox);
      enableDrag(e, {
        dropSel: '#answerBox',
        onDrop: function(t){
          if(!t){ hint('把余数宝石拖进答案宝盒！'); return; }
          if(r === tcfg.answer){
            abox.classList.add('ok');
            abox.innerHTML = '🎁 余数是 <b>' + r + '</b>，答对啦！';
            onGem(r);
          } else {
            gemDone = false;
            shakeEl(abox);
            hint('再想想：分组要选“正好整除”的每组节数，尾巴才是决定余数的部分哦。', true);
          }
        }
      });
      hint('尾巴余数宝石出炉！拖进答案宝盒。', true);
    }
  }
  return { setGroup: function(g){ setKnob(g, true); } };
}

function stageC(box, cfg, no){
  box.appendChild(stageHead(no + '长数字小火车', '长数除法：几节一组正好整除？', cfg.task,
    '商是整数时，余数由“分组后剩下的尾巴”决定。先探一探，再分组，最后框住尾巴！'));

  buildTrainView(body, cfg, false, function(){
    finishStage('余数是 ' + cfg.answer, cfg.explain);
  });

/* CB：双火车联合探险（两列火车分别取余，再进合成台相乘） */
function stageCB(box, cfg, no){
  box.appendChild(stageHead(no + '双火车联合探险', '两列长火车分别取余，再把余数相乘', cfg.task,
    '先分别探出两列火车除以 ' + cfg.synth.mod + ' 的余数宝石，再把两颗宝石送进合成台相乘！'));
  var body = mk('div');
  box.appendChild(body);
  var got = [];
  var phaseT = 0;
  function runTrain(i){
    body.innerHTML = '';
    var tc = { digit: cfg.trains[i].digit, n: cfg.trains[i].n, mod: cfg.trains[i].mod, answer: cfg.trains[i].gemVal, anySuffix: false };
    body.appendChild(mk('div', 'stageTitle', cfg.trains[i].task));
    buildTrainView(body, tc, true, function(r){
      got.push(r);

        runTrain(phaseT);
      } else {
        body.innerHTML = '';
        body.appendChild(mk('div', 'stageTitle', '两颗余数宝石（' + got[0] + ' 和 ' + got[1] +
          '）相乘，再除以 ' + cfg.synth.mod + '，余数是多少？'));
        buildSynthView(body, { mod: cfg.synth.mod, op: cfg.synth.op, opSym: cfg.synth.opSym, opName: cfg.synth.opName,
          gems: [{ name: '火车A余数', r: got[0] }, { name: '火车B余数', r: got[1] }] },
          cfg.answer, function(){ finishStage('余数是 ' + cfg.answer, cfg.explain); },
          '把两颗火车余数宝石拖进合成槽，余数币每满 ' + cfg.synth.mod + ' 枚打包一盘！');
      }
    });
  }
  runTrain(0);
  hint('双火车探险开始！先框选试余数，再分组找尾巴。');
}

/* =====================================================================
   小游戏 D：除数灯泡工厂（质因数卡片拼除数）
   ===================================================================== */
function stageD(box, cfg, no){
  box.appendChild(stageHead(no + '除数灯泡工厂', '除数 × 商 = 被除数 − 余数', cfg.task,
    '提示：除数必须整除 ' + (cfg.dividend - cfg.rem) + '，并且要<b>大于余数 ' + cfg.rem + '</b>。'));
  var body = mk('div', 'card');
  box.appendChild(body);
  /* 线索卡 */
  var clue = mk('div', 'prodLine',
    cfg.dividend + ' − ' + cfg.rem + ' = ' + (cfg.dividend - cfg.rem) + ' = ' + cfg.cards.join(' × '));
  body.appendChild(clue);
  body.appendChild(mk('div', 'subNote', '要点的灯：' + cfg.targets.length + ' 盏。用下面的质因数卡片拼出' + cfg.desc + '除数。'));
  /* 灯泡行 */
  var lampRow = mk('div', 'lampRow');
  lampRow.style.margin = '14px 0';
  var lamps = [];
  for(var i = 0; i < cfg.targets.length; i++){
    var L = mk('div', 'lamp', '<div class="lv">?</div><div>待点亮</div>');
    lampRow.appendChild(L); lamps.push(L);
  }
  body.appendChild(lampRow);
  /* 拼装槽 + 卡片 */
  var slotRow = mk('div', 'flexRow');
  var slotCol = mk('div', 'grow');
  slotCol.appendChild(mk('h3', '', '<b>拼装槽</b>（把卡片拖进来，再点“点亮灯泡”）'));
  var dslot = mk('div', 'dSlot');
  dslot.appendChild(mk('div', 'subNote', '把质因数卡片拖到这里'));
  slotCol.appendChild(dslot);
  var prodLineEl = mk('div', 'prodLine', '当前拼的数：1');
  slotCol.appendChild(prodLineEl);
  var msg = mk('div', 'msgLine', '');
  slotCol.appendChild(msg);
  var bRow = mk('div', 'footBtns');
  var clearBtn = mk('button', 'btn alt', '退回全部卡片');
  var lightBtn = mk('button', 'btn big', '💡 点亮灯泡');
  bRow.appendChild(clearBtn); bRow.appendChild(lightBtn);
  slotCol.appendChild(bRow);
  var trayCol = mk('div', 'grow');
  trayCol.appendChild(mk('h3', '', '<b>质因数卡片库</b>'));
  var ctray = mk('div', 'cardTray');
  trayCol.appendChild(ctray);
  slotRow.appendChild(slotCol); slotRow.appendChild(trayCol);
  body.appendChild(slotRow);

  /* 卡片数据 */
  var cards = [];       /* {p, el, used} */
  for(var ci = 0; ci < cfg.cards.length; ci++){
    (function(p){
      var c = { p: p, used: false, el: mk('div', 'fcard', String(p)) };
      enableDrag(c.el, {
        dropSel: '.dSlot',
        onDrop: function(t){
          if(!t){ hint('把卡片拖到拼装槽里。'); return; }
          if(c.used){ hint('这张卡片已经在槽里啦。'); return; }
          c.used = true;
          ctray.removeChild(c.el);
          dslot.appendChild(c.el);
          refreshProd();
        }
      });
      c.el.addEventListener('click', function(){
        if(clickAfterDrag()){ return; }
        if(!c.used){
          c.used = true;
          if(c.el.parentNode === ctray){ ctray.removeChild(c.el); }
          dslot.appendChild(c.el);
        } else {
          c.used = false;
          if(c.el.parentNode === dslot){ dslot.removeChild(c.el); }
          ctray.appendChild(c.el);
        }
        refreshProd();
        addStep();
      });
      /* 槽内卡片点击退回 */
      cards.push(c);
    })(cfg.cards[ci]);
  }
  function renderTray(){
    ctray.innerHTML = '';
    for(var i = 0; i < cards.length; i++){
      if(!cards[i].used){ ctray.appendChild(cards[i].el); }
    }
  }
  renderTray();
  var placedCount = function(){
    var n = 0;
    for(var i = 0; i < cards.length; i++){ if(cards[i].used){ n++; } }
    return n;
  };
  function curProduct(){
    var v = 1;
    for(var i = 0; i < cards.length; i++){ if(cards[i].used){ v *= cards[i].p; } }
    return v;
  }
  function refreshProd(){
    var v = curProduct();
    prodLineEl.textContent = '当前拼的数：' + (placedCount() ? v : 1) + (placedCount() ? '' : '（空槽）');
    renderTray();
  }
  clearBtn.addEventListener('click', function(){
    for(var i = 0; i < cards.length; i++){ cards[i].used = false; }
    renderTray(); refreshProd();
    addStep();
    msg.className = 'msgLine'; msg.textContent = '卡片已全部退回。';
  });
  var litVals = [];
  lightBtn.addEventListener('click', function(){
    if(placedCount() === 0){ msg.className = 'msgLine bad'; msg.textContent = '先拖几张卡片进拼装槽哦。'; shakeEl(dslot); return; }
    addStep();
    var v = curProduct();
    if(litVals.indexOf(v) >= 0){
      msg.className = 'msgLine bad'; msg.textContent = v + ' 已经点亮过啦，换一种拼法。'; shakeEl(msg); return;
    }
    if(v <= cfg.rem){
      msg.className = 'msgLine bad'; msg.textContent = '除数必须大于余数 ' + cfg.rem + '，' + v + ' 太小啦。'; shakeEl(msg); return;
    }
    if(cfg.targets.indexOf(v) >= 0){
      /* 点亮！ */
      litVals.push(v);
      var idx = litVals.length - 1;
      lamps[idx].classList.add('on');
      lamps[idx].innerHTML = '<div class="lv">' + v + '</div><div>已点亮</div>';
      for(var i = 0; i < cards.length; i++){ cards[i].used = false; }
      renderTray(); refreshProd();
      msg.className = 'msgLine good'; msg.textContent = '太棒了！' + v + ' 是符合条件的除数，点亮第 ' + litVals.length + ' 盏灯！';
      var r = lampRow.getBoundingClientRect();
      fxBurst(r.left + r.width / 2, r.top + 40, 22);
      if(litVals.length === cfg.targets.length){
        finishStage('全部 ' + cfg.targets.length + ' 盏灯点亮', cfg.explain);
      } else {
        hint('还差 ' + (cfg.targets.length - litVals.length) + ' 盏灯，继续拼！');
      }
    } else {
      /* 拼出的数不是目标 */
      var Bv = cfg.dividend - cfg.rem;
      if(Bv % v === 0){
        if(cfg.digitFilter > 0 && digitCount(v) !== cfg.digitFilter){
          msg.className = 'msgLine bad';
          msg.textContent = v + ' 能整除 ' + Bv + '，但它不是' + cfg.desc + '（要 ' + cfg.digitFilter + ' 位数），再拼拼。';
        } else {
          msg.className = 'msgLine bad'; msg.textContent = v + ' 不符合本关条件，换一种拼法。';
        }
      } else {
        msg.className = 'msgLine bad'; msg.textContent = v + ' 不能整除 ' + Bv + '，检查一下卡片组合。';
      }
      shakeEl(msg);
    }
  });
  hint('先把质因数卡片拖进拼装槽，拼出一个除数试试！');
}

/* ---------------- 全局按钮 ---------------- */
$('btnRules').addEventListener('click', showRules);

});

/* ---------------- 启动 ---------------- */
applyPalette();
renderHome();

setTimeout(showRules, 350);
