<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>生活趣题欢乐营（第14周 生活趣题二 · 互动闯关）</title>
<style>
/* ================= 全局主题变量（每局随机换色） ================= */
:root{
  --c-main:#1e88e5; --c-dark:#0d47a1; --c-soft:#e3f2fd; --c-accent:#fbc02d; --c-bg:#f6f9fd;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:"Microsoft YaHei","PingFang SC","SimHei",sans-serif;
  background:var(--c-bg); color:#253243; font-size:18px; line-height:1.6;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;}

/* ================= 顶栏：标题 + 计时器/步数（右上角）+ 全局按钮 ================= */
#topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 16px;color:#fff;box-shadow:0 2px 10px rgba(10,30,60,.25);
  background:linear-gradient(100deg,var(--c-main),var(--c-dark));
}
.brand{font-size:21px;font-weight:bold;letter-spacing:1px;}
.hud{
  margin-left:auto;display:flex;gap:14px;font-size:18px;font-weight:bold;
  background:rgba(255,255,255,.2);padding:5px 14px;border-radius:999px;white-space:nowrap;
}
.topbtns{display:flex;gap:8px;flex-wrap:wrap;}

/* ================= 按钮体系（大按钮，适合课堂投影与触屏） ================= */
.btn{
  border:3px solid var(--c-dark);border-radius:14px;background:#fff;color:var(--c-dark);
  font-size:18px;font-weight:bold;padding:9px 18px;cursor:pointer;
  box-shadow:0 4px 0 var(--c-dark);transition:transform .12s, box-shadow .12s;touch-action:manipulation;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--c-dark);}
.btn.primary{background:var(--c-main);color:#fff;}
.btn.good{background:var(--c-accent);color:#4a3200;border-color:#8d6400;box-shadow:0 4px 0 #8d6400;}
.btn.big{font-size:22px;padding:13px 28px;border-radius:16px;}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;align-items:center;}

/* ================= 通用卡片与版面 ================= */
#stage{max-width:1000px;margin:0 auto;padding:18px 14px 80px;}
.card{
  background:#fff;border:2px solid #e2e9f4;border-radius:18px;padding:16px;margin-top:14px;
  box-shadow:0 2px 10px rgba(30,60,110,.07);
}
.guide{background:linear-gradient(120deg,#fffef2,#fff8e1);border:2px dashed var(--c-accent);font-size:18px;}
.row-label{font-size:19px;font-weight:bold;color:var(--c-dark);margin-bottom:10px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid2>.card{margin-top:14px;}
@media (max-width:640px){ .grid2{grid-template-columns:1fr;} }

/* ================= 题目卡 ================= */
.prob-card{
  background:var(--c-soft);border:3px solid var(--c-main);border-radius:16px;
  padding:14px 18px;margin-top:14px;
}
.prob-tag{font-weight:bold;color:var(--c-dark);font-size:17px;}
.prob-card p{font-size:20px;line-height:1.8;margin-top:4px;}

/* ================= 难度选择 ================= */
.screen-title{text-align:center;font-size:30px;font-weight:bold;color:var(--c-dark);margin:26px 0 6px;}
.screen-sub{text-align:center;font-size:18px;color:#5a6b80;margin-bottom:22px;}
.diff-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;max-width:860px;margin:0 auto;}
.diff-card{
  background:#fff;border:4px solid var(--c-main);border-radius:22px;padding:26px 16px;text-align:center;
  cursor:pointer;transition:transform .15s, box-shadow .15s;box-shadow:0 4px 0 var(--c-main);
}
.diff-card:hover{transform:translateY(-4px);}
.diff-card h3{font-size:26px;color:var(--c-dark);}
.diff-card .d-ico{font-size:44px;}
.diff-card p{font-size:17px;color:#5a6b80;margin-top:8px;}

/* ================= 地图 ================= */
.map-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;}
.st-card{
  background:#fff;border:3px solid var(--c-main);border-radius:20px;padding:18px 12px;text-align:center;
  cursor:pointer;transition:transform .15s;box-shadow:0 3px 0 var(--c-main);position:relative;
}
.st-card:hover{transform:translateY(-3px);}
.st-card .s-ico{font-size:40px;}
.st-card h4{font-size:20px;color:var(--c-dark);margin-top:6px;}
.st-card .s-star{font-size:24px;margin-top:6px;letter-spacing:2px;}
.st-card.done{background:var(--c-soft);}
.map-top{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:6px 0 16px;}
.chip{background:#fff;border:2px solid var(--c-main);color:var(--c-dark);border-radius:999px;padding:4px 14px;font-size:16px;font-weight:bold;}

/* ================= 站点页头 ================= */
.st-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px;}
.st-title{font-size:24px;font-weight:bold;color:var(--c-dark);}
.st-btns{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;}
#fb{margin-top:14px;}
.win-banner{
  background:linear-gradient(120deg,#fff9c4,#ffe082);border:3px solid #b8860b;border-radius:18px;
  padding:18px;font-size:20px;text-align:center;animation:pop .4s;
}
@keyframes pop{0%{transform:scale(.7);opacity:0;}100%{transform:scale(1);opacity:1;}}
.sol-box{background:#f4faf4;border:2px dashed #4caf50;border-radius:14px;padding:12px 16px;margin-top:10px;text-align:left;font-size:19px;line-height:2;}

/* ================= 拖拽与放置区 ================= */
.token{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;}
.dz{
  border:4px dashed var(--c-main);border-radius:16px;min-height:70px;padding:10px;
  display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
  background:rgba(255,255,255,.65);text-align:center;font-size:17px;color:#5a6b80;transition:all .15s;
}
.dz-hot{background:var(--c-soft);border-color:var(--c-accent);transform:scale(1.03);color:var(--c-dark);}
.ghost{
  position:fixed;z-index:95;pointer-events:none;opacity:.94;
  transform:scale(1.15) rotate(-4deg);box-shadow:0 10px 22px rgba(0,0,0,.28);border-radius:10px;
}
.shake{animation:shk .4s;}
@keyframes shk{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}

/* ================= 标尺 + 小旗（数轴定位交互） ================= */
.ruler{position:relative;height:56px;margin:34px 8px 8px;border-bottom:4px solid var(--c-dark);
  background:repeating-linear-gradient(90deg,var(--c-dark) 0 3px,transparent 3px 12px);background-position:bottom;background-size:100% 14px;background-repeat:no-repeat;}
.rul-num{position:absolute;bottom:-26px;transform:translateX(-50%);font-size:16px;color:var(--c-dark);font-weight:bold;}
.flag{position:absolute;bottom:0;left:0;transform:translateX(-50%);font-size:26px;cursor:grab;touch-action:none;user-select:none;z-index:5;}
.flag .fbub{
  position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:var(--c-main);color:#fff;
  font-size:16px;font-weight:bold;border-radius:10px;padding:2px 10px;white-space:nowrap;
}
.flagNote{margin-top:34px;font-size:16px;color:#5a6b80;text-align:center;}

/* ================= 食堂站：人物行 + 分组框 ================= */
.taskStrip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.tchip{border:3px solid #b9c6d8;border-radius:12px;padding:6px 14px;font-size:17px;background:#f2f5fa;color:#5a6b80;font-weight:bold;}
.tchip.cur{border-color:var(--c-main);background:var(--c-soft);color:var(--c-dark);box-shadow:0 0 0 3px rgba(30,136,229,.2);}
.tchip.ok{border-color:#43a047;background:#e8f5e9;color:#1b5e20;}
.peopleWrap{position:relative;padding:8px 34px 6px 2px;margin-top:20px;overflow-x:auto;}
.pRow{display:flex;gap:8px;justify-content:flex-start;align-items:flex-end;}
.person{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8e1,#ffd54f);border:3px solid #ef6c00;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.groupBox{position:absolute;border:4px dashed var(--c-main);border-radius:14px;background:rgba(30,136,229,.08);top:2px;pointer-events:none;}
.grip{
  position:absolute;right:-22px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;
  background:var(--c-accent);border:3px solid #8d6400;color:#4a3200;font-size:18px;font-weight:bold;
  display:flex;align-items:center;justify-content:center;cursor:ew-resize;pointer-events:auto;touch-action:none;user-select:none;
  box-shadow:0 3px 6px rgba(0,0,0,.25);
}
.grpRow{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
.grp{border:3px solid var(--c-main);border-radius:12px;padding:6px;background:var(--c-soft);display:flex;flex-direction:column;align-items:center;gap:2px;}
.grp .gp{display:flex;gap:2px;}
.mini-p{width:16px;height:16px;border-radius:50%;background:#ffd54f;border:2px solid #ef6c00;}
.bowlIco{width:38px;height:22px;background:var(--c-main);border:3px solid var(--c-dark);border-radius:0 0 20px 20px;}
.sum-line{font-size:24px;font-weight:bold;color:var(--c-dark);margin-top:12px;text-align:center;}
.calc-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:20px;margin-top:8px;}
.bigRange{width:100%;height:40px;accent-color:var(--c-main);cursor:pointer;}
.val-bub{display:inline-block;background:var(--c-main);color:#fff;font-size:20px;font-weight:bold;border-radius:12px;padding:4px 16px;}
.ok-tag{color:#1b5e20;font-weight:bold;}
.bad-tag{color:#b71c1c;font-weight:bold;}
.chickWrap{position:relative;padding:22px 4px 6px;}
.chickWrap .pRow{gap:4px;justify-content:center;flex-wrap:nowrap;}
.chick{font-size:34px;cursor:default;}
.chick.hen{filter:hue-rotate(-25deg) saturate(1.6);}
.fence{position:absolute;top:-14px;bottom:-6px;width:10px;background:repeating-linear-gradient(45deg,#8d6e63 0 6px,#d7ccc8 6px 12px);border:3px solid #5d4037;border-radius:6px;cursor:ew-resize;touch-action:none;z-index:6;}
.fence::after{content:"⇔";position:absolute;top:-30px;left:50%;transform:translateX(-50%);color:#5d4037;font-size:18px;font-weight:bold;}

/* ================= 球场站 ================= */
.courtArea{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin:10px 0;}
.tableT{background:linear-gradient(180deg,#66bb6a,#388e3c);border:4px solid #1b5e20;border-radius:14px;width:260px;height:176px;position:relative;box-shadow:inset 0 0 20px rgba(255,255,255,.25);}
.tableT::after{content:"";position:absolute;left:0;right:0;top:50%;height:5px;background:#fafafa;box-shadow:0 0 6px rgba(0,0,0,.4);}
.slotDz{
  position:absolute;width:66px;height:66px;border-radius:50%;border:4px dashed #fafafa;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:15px;text-align:center;background:rgba(0,0,0,.12);
}
.slotDz.s0{left:16px;top:12px;} .slotDz.s1{right:16px;top:12px;}
.slotDz.s2{left:16px;bottom:12px;} .slotDz.s3{right:16px;bottom:12px;}
.tableT.t2 .slotDz.s0{top:52px;} .tableT.t2 .slotDz.s1{top:52px;}
.slotDz.full{border-style:solid;background:#fafafa;color:#1b5e20;font-weight:bold;}
.kid-chip{
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:66px;height:66px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fffde7,#fff59d);border:3px solid #f9a825;font-size:14px;font-weight:bold;
  color:#5d4037;cursor:grab;touch-action:none;user-select:none;
}
.kid-chip .ke{font-size:24px;line-height:1;}
.kid-chip.playing{animation:bnc .5s infinite alternate;}
@keyframes bnc{from{transform:translateY(0);}to{transform:translateY(-8px);}}
.bench{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:74px;padding:8px;border:3px dashed #90a4ae;border-radius:14px;margin-top:12px;}
.clockBig{font-size:26px;font-weight:bold;color:var(--c-dark);text-align:center;}
.poolbar{height:26px;background:#eceff1;border-radius:999px;border:3px solid var(--c-dark);overflow:hidden;margin-top:8px;}
.poolbar>div{height:100%;width:0%;background:linear-gradient(90deg,var(--c-accent),#ff6f00);transition:width .08s;}
.tubes{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:12px;}
.tubeCol{display:flex;flex-direction:column;align-items:center;gap:6px;}
.tubeName{font-size:17px;font-weight:bold;color:var(--c-dark);}
.tubeVal{font-size:18px;font-weight:bold;background:var(--c-soft);padding:2px 10px;border-radius:8px;color:var(--c-dark);}
.tube{position:relative;width:46px;height:170px;background:#eceff1;border:3px solid var(--c-dark);border-radius:12px;overflow:visible;}
.tube .fill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,var(--c-accent),#ff8f00);border-radius:0 0 8px 8px;}
.tube .tHandle{
  position:absolute;left:50%;transform:translate(-50%,50%);bottom:0;width:56px;height:26px;background:var(--c-main);
  border:3px solid var(--c-dark);border-radius:8px;cursor:ns-resize;touch-action:none;user-select:none;
  box-shadow:0 2px 6px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;
}

/* ================= 空瓶站 ================= */
.holes{display:flex;gap:10px;justify-content:center;margin:8px 0;}
.hole{width:42px;height:42px;border-radius:50%;border:4px dashed #90a4ae;background:#fafafa;display:flex;align-items:center;justify-content:center;}
.hole.filled{border-style:solid;border-color:var(--c-main);background:var(--c-soft);font-size:20px;}
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;align-items:center;padding:6px;border-radius:12px;background:#f7f9fb;}
.bottle{
  position:relative;width:30px;height:52px;border:3px solid #37474f;border-radius:7px 7px 12px 12px;
  display:flex;align-items:flex-end;justify-content:center;cursor:grab;touch-action:none;user-select:none;
}
.bottle::before{content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:10px;height:9px;background:#37474f;border-radius:3px 3px 0 0;}
.bottle.empty{background:linear-gradient(180deg,#fafafa 65%,#cfd8dc 65%);}
.bottle.full{background:linear-gradient(180deg,#ffd54f 18%,#fb8c00 18%,#fb8c00 100%);border-color:#e65100;}
.drink{min-height:96px;font-size:18px;}
.loglist{max-height:150px;overflow:auto;font-size:16px;line-height:1.9;background:#fafcf7;border-radius:10px;padding:8px 12px;border:2px solid #e0e8dc;}
.scoreRow{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:19px;}
.scoreRow b{font-size:24px;color:var(--c-main);}

/* ================= 超市站 ================= */
.bagToken{
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:96px;height:96px;border-radius:18px;
  background:linear-gradient(160deg,#ffe0b2,#ffb74d);border:4px solid #e65100;cursor:grab;touch-action:none;user-select:none;
  font-weight:bold;color:#5d2f00;font-size:15px;text-align:center;line-height:1.35;
}
.bagToken .be{font-size:28px;}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;margin-top:8px;}
.itemIco{
  height:44px;border-radius:10px;border:3px solid var(--c-main);background:var(--c-soft);color:var(--c-dark);
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;cursor:grab;touch-action:none;user-select:none;
}
.cartRow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px;min-height:50px;}
.cartBag,.cartSingle{
  display:inline-flex;align-items:center;justify-content:center;border-radius:10px;font-weight:bold;cursor:pointer;font-size:16px;
  padding:6px 10px;border:3px solid #e65100;background:#fff3e0;color:#5d2f00;
}
.cartSingle{border-color:var(--c-main);background:var(--c-soft);color:var(--c-dark);}
.payline{font-size:22px;font-weight:bold;color:var(--c-dark);margin-top:10px;}
.shopCard{border:4px solid var(--c-main);border-radius:18px;background:#fff;padding:14px;transition:all .15s;position:relative;}
.shopCard h4{color:var(--c-dark);font-size:20px;margin-bottom:6px;}
.orderToken{
  display:inline-flex;align-items:center;gap:8px;border:4px solid #4e342e;background:#fff8e1;border-radius:14px;
  padding:12px 20px;font-size:20px;font-weight:bold;color:#4e342e;cursor:grab;touch-action:none;user-select:none;
}

/* ================= 蜗牛站 ================= */
.sceneWrap{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;align-items:flex-start;}
.snailInfo{min-width:200px;font-size:19px;line-height:2.1;}
.snailInfo b{color:var(--c-main);font-size:24px;}
#snailG{transition:transform .55s ease;}
.hopTrack{display:grid;grid-template-columns:repeat(16,1fr);gap:4px;margin-top:12px;}
.hopCell{
  height:56px;border:3px solid #b0bec5;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:bold;color:#607d8b;background:#f5f8fa;position:relative;
}
.hopCell.goall{border-color:#43a047;background:#e8f5e9;color:#1b5e20;}
.hopCell.mark{background:#fff3cd;}
.hopTok{font-size:30px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;}

/* ================= 弹窗 / 提示 / 庆典 ================= */
#modalRoot .mask{position:fixed;inset:0;background:rgba(12,24,40,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:18px;}
.modal{
  background:#fff;border-radius:20px;max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:24px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .3s;
}
.modal h3{color:var(--c-dark);font-size:24px;margin-bottom:12px;}
.modal .m-body{font-size:19px;line-height:2;}
.modal .m-body ol{padding-left:26px;}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(28,40,60,.94);color:#fff;
  padding:12px 24px;border-radius:14px;font-size:19px;z-index:99;animation:tin .25s;max-width:88vw;text-align:center;
}
@keyframes tin{from{opacity:0;transform:translate(-50%,14px);}to{opacity:1;transform:translate(-50%,0);}}
#fxCanvas{position:fixed;inset:0;pointer-events:none;z-index:70;}
.celebrate{position:fixed;inset:0;z-index:85;display:flex;align-items:center;justify-content:center;background:rgba(255,250,230,.9);padding:20px;}
.cel-card{background:#fff;border:5px solid var(--c-accent);border-radius:26px;padding:36px 30px;text-align:center;max-width:560px;box-shadow:0 24px 70px rgba(180,120,0,.35);}
.cel-star{font-size:44px;letter-spacing:6px;}
.cel-card h2{color:var(--c-dark);font-size:30px;margin:10px 0;}
.cel-stats{font-size:20px;color:#5a6b80;margin-top:6px;}
.dim{color:#9aa7b5;font-size:16px;}
@media (max-width:560px){
  body{font-size:16px;}
  .brand{font-size:17px;} .hud{font-size:15px;gap:8px;}
  .prob-card p{font-size:18px;} .screen-title{font-size:24px;}
  .hopTrack{grid-template-columns:repeat(8,1fr);}
  .chick{font-size:26px;}
}
</style>
</head>
<body>
<div id="topbar">
  <div class="brand">🎡 生活趣题欢乐营</div>
  <div class="hud">⏱ <span id="timer">00:00</span> ｜ 👣 <span id="steps">0</span> 步</div>
  <div class="topbtns">
    <button class="btn" id="btnRules">📜 玩法规则</button>
    <button class="btn" id="btnHome">🏠 返回难度选择</button>
  </div>
</div>
<main id="stage"></main>
<div id="modalRoot"></div>
<canvas id="fxCanvas"></canvas>

<script>
'use strict';
/* =====================================================================
 * 生活趣题欢乐营（第14周 生活趣题·二）
 * 题型来源：教参 docx《第14周 生活趣题(二)》
 *   1) 合用碗问题（分组除法） 2) 轮流打球（总时间平均分）
 *   3) 空瓶换购（逐步兑换）   4) 买赠促销（最省钱方案） 5) 蜗牛爬井（进退问题）
 * 五个基地全部用“亲手操作”来解题：拖拽分组、拖人上场、拖瓶换购、

/* ---------------- 全局状态 ---------------- */
var S={ level:1, pal:PALS[0], probs:{}, stars:{}, revealed:{}, steps:0, t0:0, timer:null, celebrated:false };
var STAGE=$('#stage');

function stopTimer(){ if(S.timer){ clearInterval(S.timer); S.timer=null; } }
function tickTimer(){
  var sec=Math.floor((Date.now()-S.t0)/1000);
  var m=Math.floor(sec/60), s=sec%60;
  var el=$('#timer'); if(el) el.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}

/* ---------------- 开局：随机抽题 + 随机配色 ---------------- */
function startRound(level){
  S.level=level; S.steps=0; S.stars={}; S.revealed={}; S.celebrated=false;
  $('#steps').textContent='0'; $('#timer').textContent='00:00';
  S.pal=pick(PALS); applyPal(S.pal);
  BANK.forEach(function(st){ S.probs[st.key]=pick(st.pools[level]); });
  S.t0=Date.now(); stopTimer(); S.timer=setInterval(tickTimer,500);
  renderMap();
}

function closeModal(){ $('#modalRoot').innerHTML=''; }
function modal(title, bodyHTML, buttons){
  var root=$('#modalRoot');
  var btnHtml='';
  (buttons||[]).forEach(function(b,i){ btnHtml+='<button class="btn '+(b.cls||'primary')+(i===0?' big':'')+'" data-mi="'+i+'">'+b.label+'</button>'; });
  root.innerHTML='<div class="mask"><div class="modal"><h3>'+title+'</h3><div class="m-body">'+bodyHTML+'</div>'+
    '<div class="btnrow" style="justify-content:center">'+btnHtml+'</div></div></div>';
  root.querySelectorAll('[data-mi]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var b=(buttons||[])[parseInt(btn.dataset.mi,10)];
      if(b && b.cb) b.cb(closeModal); else closeModal();
    });
  });
}

/* ---------------- 彩纸特效（Canvas 实现） ---------------- */
var FX={ cv:null, ctx:null, parts:[], running:false };
function fxInit(){
  FX.cv=$('#fxCanvas'); FX.ctx=FX.cv.getContext('2d');
  var rs=function(){ FX.cv.width=window.innerWidth; FX.cv.height=window.innerHeight; };
  rs(); window.addEventListener('resize', rs);
}
function burst(n){
  if(!FX.ctx) fxInit();
  var MAX_PARTS=240;                       /* 粒子上限，保证低配设备流畅 */
  var colors=[S.pal.main,S.pal.accent,S.pal.dark,'#ff5252','#66bb6a','#ab47bc','#ffa726'];
  for(var i=0;i<n && FX.parts.length<MAX_PARTS;i++){
    FX.parts.push({
      x:Math.random()*FX.cv.width, y:-20-Math.random()*FX.cv.height*0.25,
      vx:(Math.random()-0.5)*3.4, vy:2+Math.random()*3.6,
      w:8+Math.random()*8, h:12+Math.random()*10,
      color:colors[Math.floor(Math.random()*colors.length)], life:130+Math.random()*80
    });
  }
  if(!FX.running) fxLoop();
}
function fxLoop(){
  FX.running=true;
  var c=FX.ctx, alive=[];
  c.clearRect(0,0,FX.cv.width,FX.cv.height);
  for(var i=0;i<FX.parts.length;i++){
    var p=FX.parts[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.045; p.life-=1;
    if(p.life>0 && p.y<FX.cv.height+40){
      c.globalAlpha=Math.min(1,p.life/60);
      c.fillStyle=p.color;
      c.fillRect(p.x-p.w/2, p.y-p.h/2, p.w, p.h);
      alive.push(p);
    }
  }
  c.globalAlpha=1;
  FX.parts=alive;
  if(FX.parts.length>0){ requestAnimationFrame(fxLoop); }
  else { FX.running=false; c.clearRect(0,0,FX.cv.width,FX.cv.height); }
}

/* ---------------- 拖拽核心（Pointer Events，鼠标/触摸通用） ---------------- */
function accepts(zone,kind){ return (zone.dataset.accept||'').split(' ').indexOf(kind)>=0; }
function beginTokenDrag(t, ev, opts){
  ev.preventDefault();
  var r=t.getBoundingClientRect();
  var ghost=t.cloneNode(true);
  ghost.className=ghost.className+' ghost';
  ghost.style.width=r.width+'px'; ghost.style.height=r.height+'px';
  ghost.style.margin='0';
  document.body.appendChild(ghost);
  var ox=ev.clientX-r.left, oy=ev.clientY-r.top;
  var hotEl=null, moved=false;
  var place=function(e){
    if(Math.abs(e.clientX-ev.clientX)+Math.abs(e.clientY-ev.clientY)>10) moved=true;
    ghost.style.left=(e.clientX-ox)+'px'; ghost.style.top=(e.clientY-oy)+'px';
    if(hotEl) hotEl.classList.remove('dz-hot');
    var el=document.elementFromPoint(e.clientX,e.clientY);
    hotEl=(el&&el.closest('.dz')&&accepts(el.closest('.dz'),opts.kind))?el.closest('.dz'):null;
    if(hotEl) hotEl.classList.add('dz-hot');
  };
  place(ev);
  var mv=function(e){ place(e); };
  var up=function(e){
    document.removeEventListener('pointermove',mv);
    document.removeEventListener('pointerup',up);
    if(hotEl) hotEl.classList.remove('dz-hot');
    ghost.remove();
    var el=document.elementFromPoint(e.clientX,e.clientY);
    var z=el?el.closest('.dz'):null;
    opts.onDrop((z&&accepts(z,opts.kind))?z:null, t, e, moved);
  };
  document.addEventListener('pointermove',mv);
  document.addEventListener('pointerup',up);
}
function delegateToken(container, selector, kind, onDrop, canDrag){
  container.addEventListener('pointerdown', function(ev){
    var t=ev.target.closest(selector);
    if(!t) return;
    if(canDrag && !canDrag(t,ev)) return;
    beginTokenDrag(t, ev, {kind:kind, onDrop:function(z,tok){ onDrop(z,tok); }});
  });
}
/* 标尺小旗拖动（数轴定位） */
function dragRulerFlag(handle, track, min, max, onChange, onEnd){
  handle.addEventListener('pointerdown', function(ev){
    ev.preventDefault();
    if(track.dataset.lock==='1'){ toast('小旗已锁定，专注操作吧！'); return; }
    var rect=track.getBoundingClientRect();
    var set=function(x){
      var t=Math.min(1,Math.max(0,(x-rect.left)/rect.width));
      var v=Math.round(min+t*(max-min));
      handle.style.left=(t*100)+'%';
      onChange(v);
    };
    set(ev.clientX);
    var mv=function(e){ set(e.clientX); };
    var up=function(){
      document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up);
      if(onEnd) onEnd();
    };
    document.addEventListener('pointermove',mv);
    document.addEventListener('pointerup',up);
  });
}
/* 垂直管子滑块拖动（时间分配） */
function dragVHandle(handle, tube, max, onChange, onEnd){
  handle.addEventListener('pointerdown', function(ev){
    ev.preventDefault();
    var rect=tube.getBoundingClientRect();
    var set=function(y){
      var t=1-Math.min(1,Math.max(0,(y-rect.top)/rect.height));
      var v=Math.round(t*max);
      handle.style.bottom=(t*100)+'%';
      onChange(v);
    };
    set(ev.clientY);
    var mv=function(e){ set(e.clientY); };
    var up=function(){
      document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up);
      if(onEnd) onEnd();
    };
    document.addEventListener('pointermove',mv);
    document.addEventListener('pointerup',up);
  });
}
/* 标尺刻度数字 */
function rulerNums(track,min,max){
  var stepN=Math.max(1,Math.ceil((max-min)/8));
  var html='';
  for(var v=min;v<=max;v+=stepN){
    html+='<div class="rul-num" style="left:'+((v-min)/(max-min)*100)+'%">'+v+'</div>';
  }
  if((max-min)%stepN!==0){
    html+='<div class="rul-num" style="left:100%">'+max+'</div>';
  }
  track.insertAdjacentHTML('beforeend',html);
}

/* ---- 1A 拖框分组：一共要多少个碗 ---- */
function bodyBowl(p){
  var persons='';
  for(var i=0;i<p.people;i++){ persons+='<div class="person">🧑</div>'; }
  return '<div class="card guide">🎯 玩法：拖动虚线框右边的<b>圆把手 ⇔</b>，改变“框里几个人”，让每个框里的人数正好等于题目中“几人共用 1 个碗”，再按〔✔ 确认分组〕。三种碗都分对，碗架上就会算出总数！</div>'+
  '<div class="card"><div class="taskStrip" id="taskStrip"></div>'+
  '<div class="row-label" id="boxLabel"></div>'+
  '<div class="peopleWrap" id="peopleWrap"><div class="pRow" id="pRow">'+persons+'</div>'+
  '<div class="groupBox" id="groupBox"><div class="grip" id="grip">⇔</div></div></div>'+
  '<div class="btnrow"><button class="btn primary big" id="btnGrp">✔ 确认分组</button></div></div>'+
  '<div class="card"><div class="row-label">🥣 碗架（分好组会出现碗）</div><div id="bowlShelf"><span class="dim">还没分好组……</span></div><div class="sum-line" id="sumLine"></div></div>';
}
function initBowl(p){
  var st={ task:0, k:1, fails:0, counts:[], locked:false };
  var tasks=p.names.map(function(n,i){ return {name:n, per:p.per[i]}; });
  var wrap=$('#peopleWrap'), row=$('#pRow'), box=$('#groupBox'), grip=$('#grip');
  var persons=$$('#pRow .person');
  /* 自适应人物图标大小，保证一行放下、互不遮挡 */
  function sizePeople(){
    var W=wrap.clientWidth-30;
    var sz=Math.max(24,Math.min(54,Math.floor((W-(persons.length-1)*8)/persons.length)));
    persons.forEach(function(el){ el.style.width=sz+'px'; el.style.height=sz+'px'; el.style.fontSize=Math.floor(sz*0.5)+'px'; });
    wrap.style.height=(sz+16)+'px';
    return sz;
  }
  var SZ=sizePeople();
  function strip(){
    var html='当前任务：';
    tasks.forEach(function(t,i){
      html+='<span class="tchip'+(i<st.task?' ok':(i===st.task?' cur':''))+'">'+
        (i<st.task?'✔ ':'')+t.name+'（每'+t.per+'人1个）</span>';
    });
    $('#taskStrip').innerHTML=html;
  }
  function updBox(){
    var k=st.k;
    var a=persons[0], b=persons[k-1];
    var L=a.offsetLeft-3, R=b.offsetLeft+b.offsetWidth+3;
    box.style.left=L+'px'; box.style.width=(R-L)+'px'; box.style.top='-6px'; box.style.height=(SZ+14)+'px';
    var t=tasks[st.task];
    var exact=(p.people%k===0);
    $('#boxLabel').innerHTML='每个框里 <b class="val-bub">'+k+'</b> 人 → '+
      (exact?(p.people+'÷'+k+'=<b>'+ (p.people/k) +'</b>（个'+t.name+'）'):(p.people+'÷'+k+' 除不尽，分不均哦'));
  }
  /* 拖把手：横向拖动改变每组人数（用元素实际位置判定，横向滚动也准确） */
  grip.addEventListener('pointerdown', function(ev){
    ev.preventDefault();
    var mv=function(e){
      var k=1;
      for(var i=0;i<persons.length;i++){
        var r=persons[i].getBoundingClientRect();
        if(e.clientX>=r.left+r.width/2) k=i+1;
      }
      st.k=Math.min(Math.max(k,1),Math.min(10,p.people));
      updBox();
    };
    var up=function(){ document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up); step(1); };
    document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
  });
  $('#btnGrp').addEventListener('click', function(){
    if(st.locked) return;
    step(1);
    var t=tasks[st.task];
    if(st.k===t.per && p.people%t.per===0){
      var cnt=p.people/t.per;
      st.counts.push(cnt);
      var grpHtml='<div class="grpRow">';
      for(var g=0;g<cnt;g++){
        grpHtml+='<div class="grp"><div class="gp">';
        for(var d=0;d<t.per;d++){ grpHtml+='<span class="mini-p"></span>'; }
        grpHtml+='</div><div class="bowlIco"></div><div style="font-size:15px;">'+t.name+'</div></div>';
      }
      grpHtml+='</div>';
      var shelf=$('#bowlShelf');
      if(st.task===0) shelf.innerHTML='';
      shelf.insertAdjacentHTML('beforeend','<div class="row-label" style="margin-top:12px;">'+t.name+'：'+p.people+'÷'+t.per+'='+cnt+'（个）</div>'+grpHtml);
      toast('太棒了！'+t.name+'需要 '+cnt+' 个。');
      st.task++;
      if(st.task>=tasks.length){
        st.locked=true;
        var sum=st.counts.reduce(function(a,b){ return a+b; },0);
        var formula=st.counts.join(' + ')+' = '+sum;
        $('#sumLine').innerHTML='🥣 一共：'+formula+'（个）';
        box.style.display='none';
        winStation('canteen', p.sol.join('；')+'<br><b>【答】'+p.ansText+'</b>');
      } else {
        st.k=1; strip(); updBox();
      }
    } else {
      st.fails++; step(1);
      box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
      toast(st.fails>=2 ? ('提示：题目说 '+t.per+' 人共用 1 个'+t.name+'哦！') : '分组不对，再读读题目试一次！');
    }
  });
  strip(); updBox();
  window.addEventListener('resize', function(){ SZ=sizePeople(); updBox(); });
}

function initInv(p){
  var sl=$('#invSlider');
  function upd(){
    var n=parseInt(sl.value,10);
    $('#invN').textContent=n+' 人';
    var s=0, allOk=true, i;
    var arr=[n, n/2, n/3];
    var ids=['c1','c2','c3'];
    for(i=0;i<3;i++){

    }

    step(1);

    winStation('canteen', r.n+'÷1+'+r.n+'÷2+'+r.n+'÷3 = '+(r.n)+'+'+(r.n/2)+'+'+(r.n/3)+' = '+p.total+'（个）✔<br><b>【答】'+p.ansText+'</b>');
  });
  upd();
}

function bodyChicken(p){

  '<div class="card" id="ckP2" style="display:none;">'+

  '<div class="chickWrap" id="ckWrap" style="height:86px;"><div class="pRow" id="ckRow">'+chicks+'</div>'+
  '<div class="fence" id="fence"></div></div>'+
  '<div class="calc-row">母鸡 <b id="henN">0</b> 只：3天下蛋 <b id="eggN">0</b> 个（要 '+p.eggs+' 个）｜ 公鸡 <b id="cockN">9</b> 只</div>'+
  '<div class="btnrow"><button class="btn primary big" id="ckGo">🐔 确认鸡舍</button></div></div>';
}
function initChicken(p){
  var locked=false, m=4;
  var sl=$('#ckSlider');
  function upd1(){
    var c=parseInt(sl.value,10);
    $('#ckN').textContent=c+' 只';
    $('#ckRice').innerHTML=(3*c)+' 把'+(3*c===p.rice?' <span class="ok-tag">✔</span>':'');
    return c;
  }
  sl.addEventListener('input', upd1);
  sl.addEventListener('change', function(){ step(1); });
  upd1();
  $('#ckLock').addEventListener('click', function(){
    step(1);
    var c=upd1();
    if(3*c!==p.rice){ toast('3 天吃 '+(3*c)+' 把米，不是 '+p.rice+' 把，再调调总数！'); return; }
    locked=true;
    $('#ckP2').style.display='block';
    toast('鸡舍准备好了！一共 '+c+' 只鸡（'+p.rice+'÷3='+c+'），接下来分母鸡和公鸡。');
    placeFence(4);
  });
  var chicks=$$('#ckRow .chick'), fence=$('#fence'), wrap=$('#ckWrap');
  function placeFence(mm){
    m=Math.min(8,Math.max(1,mm));
    var ref=chicks[m-1];
    var x=ref.offsetLeft+ref.offsetWidth+5;
    fence.style.left=x+'px';
    chicks.forEach(function(ch,i){ ch.classList.toggle('hen', i<m); });
    $('#henN').textContent=m; $('#eggN').textContent=3*m; $('#cockN').textContent=(9-m);
  }
  fence.addEventListener('pointerdown', function(ev){
    ev.preventDefault();
    if(!locked){ toast('先完成第一步，锁定鸡的总数！'); return; }
    var mv=function(e){
      var mm=1;
      for(var i=0;i<9;i++){
        var r=chicks[i].getBoundingClientRect();
        if(e.clientX>r.left+r.width/2) mm=i+1;
      }
      placeFence(mm);
    };
    var up=function(){ document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up); step(1); };
    document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
  });
  $('#ckGo').addEventListener('click', function(){
    step(1);
    if(!locked){ toast('先完成第一步！'); return; }
    if(3*m!==p.eggs){ toast('母鸡 '+m+' 只，3 天只下 '+(3*m)+' 个蛋，题目说 '+p.eggs+' 个哦！'); return; }
    winStation('canteen', '鸡：'+p.rice+'÷3=9（只）；母鸡：'+p.eggs+'÷3=7（只）；公鸡：9-7=2（只）<br><b>【答】'+p.ansText+'</b>');
  });
}

function bodyCourt(p){
  var kids='';
  for(var i=0;i<p.kids;i++){
    kids+='<div class="kid-chip token" data-kind="kid" data-i="'+i+'"><span class="ke">🧒</span>'+NAMES[i]+'</div>';
  }

    var slots='';

    }
    tables+='<div class="tableT'+(p.slotsPer===2?' t2':'')+'">'+slots+'<div style="position:absolute;bottom:2px;width:100%;text-align:center;color:#e8f5e9;font-size:15px;font-weight:bold;">'+p.mode+'·'+(t+1)+'号场地</div></div>';
  }

  '<div class="card"><div class="row-label">🏟️ 球场（共 '+p.tables+' 张球桌，'+(p.slotsPer===2?'单打每桌 2 人':'双打每桌 4 人')+'）</div>'+
  '<div class="courtArea" id="courtArea">'+tables+'</div>'+
  '<div class="row-label" style="margin-top:14px;">🪑 板凳席（把队员拖到球场的圆圈里）</div>'+
  '<div class="bench" id="bench">'+kids+'</div></div>'+
  '<div class="card" id="ctlCard"><div class="clockBig" id="clockTxt">⏱ 训练时长：0 / '+p.mins+' 分</div>'+
  '<div class="poolbar"><div id="poolFill"></div></div>'+
  '<div class="btnrow" style="justify-content:center;"><button class="btn primary big" id="btnTrain">▶ 开始训练（'+p.mins+' 分）</button></div></div>';
}
function initCourt(p){
  var st={ phase:1, vals:{}, pool:0 };
  var bench=$('#bench');
  /* 拖队员上场 */
  delegateToken(document, '.kid-chip', 'kid', function(zone, tok){
    if(st.phase!==1){ toast('训练已经结束啦，去分时间吧！'); return; }
    if(!zone){ toast('要把队员拖到球场的“上场位”圆圈里哦！'); return; }
    if(zone.querySelector('.kid-chip')){ toast('这个位置已经有人啦！'); return; }
    var from=tok.parentElement;
    if(from.classList.contains('slotDz')) from.classList.remove('full');
    zone.appendChild(tok);
    zone.classList.add('full');
    step(1);
    toast(tok.textContent.replace('🧒','')+' 上场！');
    var total=$$('#courtArea .slotDz').length;
    var filled=$$('#courtArea .slotDz .kid-chip').length;
    if(filled===total){
      $('#btnTrain').disabled=false;
      toast('人员到齐！按“开始训练”看看全队一共打了多久。');
    }
  });
  $('#btnTrain').disabled=true;
  $('#btnTrain').addEventListener('click', function(){
    step(1);
    st.phase=1.5;
    var total=$$('#courtArea .slotDz').length;
    $$('#courtArea .slotDz .kid-chip').forEach(function(k){ k.classList.add('playing'); });
    $('#btnTrain').disabled=true;
    var dur=3400, t0=Date.now();
    var iv=setInterval(function(){
      var e=Math.min(1,(Date.now()-t0)/dur);
      var cur=Math.round(e*p.mins);
      $('#clockTxt').textContent='⏱ 训练进行中：'+cur+' / '+p.mins+' 分（场上 '+total+' 人）';
      $('#poolFill').style.width=(e*100)+'%';
      if(e>=1){
        clearInterval(iv);
        st.pool=p.mins*total;
        $$('#courtArea .slotDz .kid-chip').forEach(function(k){ k.classList.remove('playing'); });
        phase2(total);
      }
    }, 50);
  });
  function phase2(total){
    st.phase=2;
    $('#clockTxt').innerHTML='📊 全队上场总时间：<b>'+p.mins+'分 × '+total+'人 = '+st.pool+'（人·分）</b>——现在公平地分给 '+p.kids+' 个人！';
    var tubs='<div class="tubes">';
    for(var i=0;i<p.kids;i++){
      tubs+='<div class="tubeCol"><div class="tubeName">'+NAMES[i]+'</div><div class="tubeVal" id="tv'+i+'">0分</div>'+
        '<div class="tube" id="tb'+i+'"><div class="fill" id="tf'+i+'" style="height:0%;"></div>'+
        '<div class="tHandle" id="th'+i+'">≡</div></div></div>';
    }
    tubs+='</div>';
    $('#ctlCard').insertAdjacentHTML('beforeend',
      '<div class="row-label" style="margin-top:16px;">⚖️ 时间分配台（拖蓝色滑块，让大家打得一样多，正好分完 '+st.pool+' 分）</div>'+tubs+
      '<div class="clockBig" id="sumTxt" style="margin-top:10px;">时间之和：0 / '+st.pool+' 分</div>');
    for(var j=0;j<p.kids;j++){
      (function(idx){
        var tube=$('#tb'+idx);
        dragVHandle($('#th'+idx), tube, st.pool, function(v){
          st.vals[idx]=v;
          $('#tf'+idx).style.height=(v/st.pool*100)+'%';
          $('#tv'+idx).textContent=v+'分';
          var sum=0, vs=[];
          for(var q=0;q<p.kids;q++){ sum+=(st.vals[q]||0); vs.push(st.vals[q]||0); }
          $('#sumTxt').textContent='时间之和：'+sum+' / '+st.pool+' 分'+(sum>st.pool?'（超啦！）':'');
        }, function(){
          step(1);
          var sum=0, vs=[], q;
          for(q=0;q<p.kids;q++){ sum+=(st.vals[q]||0); vs.push(st.vals[q]||0); }
          if(sum!==st.pool){ if(sum<st.pool) toast('还剩 '+(st.pool-sum)+' 分没分完！'); return; }
          var same=vs.every(function(v){ return v===vs[0]; });
          if(!same){ toast('分完了，但有人打得多有人打得少——题目要求平均分哦！'); return; }
          $('#sumTxt').innerHTML='🎉 '+st.pool+'÷'+p.kids+'=<b>'+vs[0]+'</b>（分），平均每人打 '+vs[0]+' 分钟！';
          winStation('court', p.sol.join('；')+'<br><b>【答】'+p.ansText+'</b>');
        });
      })(j);
    }
  }
}

function bodyBottle(p){
  return '<div class="card guide">🎯 玩法：先把 <b>🚩 预测小旗</b>拖到标尺上（猜猜最多喝几瓶），然后开始换购：把空瓶<b>拖进回收机</b>（或直接点空瓶），集满 '+p.need+' 个按〔🔄 换一瓶〕；新饮料<b>拖到畅饮区</b>（或直接点饮料）喝掉，又会得到 1 个空瓶……一直到换不动为止！'+

  '<div class="grid2">'+

  '<div class="holes" id="holes"></div>'+
  '<div class="dz" id="intake" data-accept="b-empty">🧃 把空瓶拖到这里<br>（点空瓶也行）</div>'+
  '<div class="btnrow"><button class="btn" id="btnFeed">⚡ 一键喂满</button>'+
  '<button class="btn primary" id="btnEx">🔄 换一瓶！</button></div></div>'+

  '<div class="dz drink" id="drinkZ" data-accept="b-full">🥤 把饮料拖到这里喝掉<br>（点饮料也行）</div>'+
  '<div class="btnrow"><button class="btn" id="btnDrinkAll">🥤 全部喝掉</button></div></div>'+
  '</div>'+
  '<div class="grid2">'+
  '<div class="card"><div class="row-label">📦 空瓶托盘 ×<b id="cntE">0</b></div><div class="tray" id="trayE"></div></div>'+
  '<div class="card"><div class="row-label">🧊 待喝饮料 ×<b id="cntF">'+p.start+'</b>（刚买回来的）</div><div class="tray" id="trayF"></div></div>'+
  '</div>'+
  '<div class="card scoreRow"><span>🎉 已喝：<b id="cntD">0</b> 瓶</span><span>（买了 '+p.start+' 瓶 + 换来 <b id="cntX">0</b> 瓶）</span>'+
  (p.borrow?'<span>🤝 已借空瓶：<b id="cntB">0</b> 个</span>'+
  '<button class="btn" id="btnBorrow">🤝 借 1 个空瓶</button>'+
  '<button class="btn" id="btnReturn">↩ 还回空瓶</button>':'')+'</div>'+
  '<div class="card"><div class="row-label">📜 换购记录</div><div class="loglist" id="blog"><span class="dim">还没有记录……</span></div></div>';

function initBottle(p){
  var st={ fulls:p.start, empties:0, drank:0, machine:0, debt:0, borrowed:false, done:false, started:false, flag:0 };
  var ruler=$('#flRuler');
  rulerNums(ruler,0,p.flagMax);
  dragRulerFlag($('#flFlag'), ruler, 0, p.flagMax, function(v){
    st.flag=v; $('#flTxt').textContent='预测 '+v+' 瓶';
  }, function(){ step(1); });
  function log(msg){
    var b=$('#blog');
    if(b.querySelector('.dim')) b.innerHTML='';
    b.insertAdjacentHTML('afterbegin','<div>· '+msg+'</div>');
  }
  function bottleHTML(cls){ return '<div class="bottle '+cls+'" data-kind="b-'+(cls==='full'?'full':'empty')+'"></div>'; }
  function render(){
    var i, holes='';
    for(i=0;i<p.need;i++){ holes+='<div class="hole '+(i<st.machine?'filled':'')+'">'+(i<st.machine?'瓶':'')+'</div>'; }
    $('#holes').innerHTML=holes;
    $('#intake').innerHTML='🧃 把空瓶拖到这里<br>（回收机内 '+st.machine+' / '+p.need+'）';
    $('#trayE').innerHTML = st.empties===0 ? '<span class="dim">空空如也</span>' : Array(st.empties+1).join('.').split('.').slice(1).map(function(){ return bottleHTML('empty'); }).join('');
    $('#trayF').innerHTML = st.fulls===0 ? '<span class="dim">待喝区空空</span>' : Array(st.fulls+1).join('.').split('.').slice(1).map(function(){ return bottleHTML('full'); }).join('');
    $('#cntE').textContent=st.empties; $('#cntF').textContent=st.fulls;
    $('#cntD').textContent=st.drank; $('#cntX').textContent=Math.max(0,st.drank-p.start);
    if(p.borrow) $('#cntB').textContent=st.debt;
    $('#btnEx').disabled=(st.machine<p.need);
  }
  /* 拖拽 + 轻点都能操作（触摸友好）：轻点瓶子=直接执行 */
  delegateToken($('#trayE'), '.bottle.empty', 'b-empty', function(zone, tok, e, moved){
    if(zone && zone.id==='intake'){ feedOne(); }
    else if(!zone && !moved){ feedOne(); }
    else { toast('空瓶要拖进回收机（或轻点空瓶）哦！'); }
  });
  delegateToken($('#trayF'), '.bottle.full', 'b-full', function(zone, tok, e, moved){
    if(zone && zone.id==='drinkZ'){ drinkOne(); }
    else if(!zone && !moved){ drinkOne(); }
    else { toast('饮料要拖到畅饮区（或轻点饮料）哦！'); }
  });
  $('#intake').addEventListener('click', function(){ feedOne(); });
  $('#drinkZ').addEventListener('click', function(){
    if(st.fulls>0){ drinkOne(); } else { toast('待喝区没有饮料啦！'); }
  });
  function guardStart(){
    if(st.started) return true;
    if(st.flag<1){ toast('先把预测小旗拖到标尺上，再开始换购！'); return false; }
    st.started=true;
    ruler.dataset.lock='1';
    $('#flNote').textContent='小旗已锁定：你的预测是 '+st.flag+' 瓶。开始换购吧！';
    return true;
  }
  function feedOne(){
    if(st.done) return;
    if(st.machine>=p.need){ toast('回收机满啦，先按〔换一瓶〕！'); return; }
    if(st.empties<1){ toast('没有空瓶了——先去畅饮区喝一瓶！'); return; }
    if(!st.started){ toast('先放好预测小旗！'); return; }
    st.empties--; st.machine++; step(1); render(); log('放入 1 个空瓶（机内 '+st.machine+'/'+p.need+'）');
  }
  $('#btnFeed').addEventListener('click', function(){
    if(st.done) return;
    if(!guardStart()){ return; }
    var moved=0;
    while(st.machine<p.need && st.empties>0){ st.empties--; st.machine++; moved++; }
    if(moved>0){ step(1); render(); log('一键喂满：放入 '+moved+' 个空瓶（机内 '+st.machine+'/'+p.need+'）'); }
    else { toast('空瓶不够喂满回收机！'); }
  });
  $('#btnEx').addEventListener('click', function(){
    if(st.done) return;
    if(st.machine<p.need){ toast('空瓶还没集满 '+p.need+' 个！'); return; }
    st.machine=0; st.fulls++; step(1); render();
    log('用 '+p.need+' 个空瓶换到 1 瓶新饮料 🎉');
    toast('换到 1 瓶新饮料！把它拖到畅饮区喝掉吧。');
  });
  function drinkOne(){
    if(st.done) return;
    if(st.fulls<1){ toast('待喝区没有饮料啦！'); return; }
    if(!guardStart()){ return; }
    st.fulls--; st.empties++; st.drank++; step(1); render();
    log('喝掉 1 瓶（已喝 '+st.drank+' 瓶，现有空瓶 '+st.empties+' 个）');
    checkStuck();
  }
  $('#btnDrinkAll').addEventListener('click', function(){
    if(st.done) return;
    if(!guardStart()){ return; }
    if(st.fulls<1){ toast('待喝区没有饮料啦！'); return; }
    var n=st.fulls, i=0;
    var iv=setInterval(function(){
      if(i>=n || st.fulls===0){ clearInterval(iv); checkStuck(); return; }
      drinkOne(); i++;
    }, 140);
  });
  if(p.borrow){
    $('#btnBorrow') && $('#btnBorrow').addEventListener('click', function(){
      if(st.done || st.debt>0 || st.borrowed){ toast('现在不能借啦（借过一次要用完还清）！'); return; }
      step(1); st.debt=1; st.borrowed=true; st.empties++; render();
      log('向商店借 1 个空瓶（喝完要还）');
      toast('借到 1 个空瓶！凑一凑，再换一瓶！');
    });
    $('#btnReturn') && $('#btnReturn').addEventListener('click', function(){
      if(st.done || st.debt<1){ toast('现在没有欠空瓶哦！'); return; }
      if(st.empties<1){ toast('手上没有空瓶可还，先喝一瓶！'); return; }
      step(1); st.debt=0; st.empties--; render();
      log('还回 1 个借来的空瓶 ✔');
      checkStuck();
    });
  }
  function checkStuck(){
    if(st.done) return;
    var stuck=(st.fulls===0 && st.machine<p.need && st.empties<p.need);
    if(!stuck) return;
    if(p.borrow && st.debt===0 && !st.borrowed){
      modal('💡 换不动了？', '<p>现在剩 '+st.empties+' 个空瓶，不够 '+p.need+' 个换一瓶。</p><p>题目说<b>可以先借空瓶</b>——试试借 1 个回来凑一凑，喝完记得还哦！</p>',
        [{label:'去借 1 个空瓶', cls:'primary', cb:function(c){ c(); $('#btnBorrow').click(); }},
         {label:'我自己想想', cls:''}]);
      return;
    }
    if(p.borrow && st.debt>0){
      toast('还欠商店 1 个空瓶——按〔↩ 还回空瓶〕还清就能结算啦！');
      return;
    }
    finish();
  }
  function finish(){
    st.done=true;
    var exchanged=st.drank-p.start;
    var flagMsg = st.flag===st.drank ? '🚩 预测正确，太厉害了！' : '🚩 你的预测是 '+st.flag+' 瓶，实际是 '+st.drank+' 瓶，下次再试试！';
    var extra = p.kidsCheck ? ('<p>王老师带了 <b>'+p.kidsCheck+'</b> 个小朋友，最多只能喝到 <b>'+st.drank+'</b> 瓶：'+st.drank+' &lt; '+p.kidsCheck+'，<b>不能保证</b>每个小朋友都喝到 1 瓶。</p>') : '';
    if(st.drank<p.best){
      modal('💪 还能喝到更多！',
        '<p>这一轮你喝到了 <b>'+st.drank+'</b> 瓶，但最聪明的换法还能喝到 <b>'+p.best+'</b> 瓶哦！</p>'+
        '<p>小提示：每次都要用最多的空瓶去换'+(p.borrow?'；卡住时别忘了“先借后还”的小妙招':'')+'。</p>',
        [{label:'再试一次', cls:'primary', cb:function(c){ c(); renderStation('bottle'); }},
         {label:'看看解析', cls:'', cb:function(c){ c(); $('#btnReveal').click(); }}]);
      return;
    }
    modal('🎉 换购完成！',
      '<p>你一共喝到了 <b style="font-size:30px;color:var(--c-main)">'+st.drank+'</b> 瓶，这就是最多的喝法！</p>'+
      '<p>（自己买了 '+p.start+' 瓶 + 空瓶换来 '+exchanged+' 瓶）</p>'+extra+
      '<p>'+flagMsg+'</p>',
      [{label:'确认领取星星 ⭐', cls:'primary', cb:function(c){
        c();
        winStation('bottle', p.sol.join('；')+'<br><b>【答】'+p.ansText+'</b>');
      }}]);
  }
  render();
}

/* =====================================================================
 * 基地四：促销小超市（买赠最省钱 / 商场比价）
 * ===================================================================== */
function bodyPromo(p){
  var g=p.b+p.f;
  var shelf='';
  for(var i=0;i<p.T;i++){ shelf+='<div class="itemIco token" data-kind="item">'+p.ico+'</div>'; }
  return '<div class="card guide">🎯 玩法：促销规则是“<b>买'+p.b+'赠'+p.f+'</b>”——1 个礼包 = '+g+' 个'+p.item+'，只需付 '+p.b+' 个的钱。把<b>礼包袋</b>或<b>货架上的单品</b>拖进购物车，让全班 '+p.T+' 位同学人手一个，而且<b>付钱最少</b>，再按〔💰 结账〕！</div>'+
  '<div class="grid2">'+
  '<div class="card"><div class="row-label">🎁 促销台（礼包袋可以一直拿）</div>'+
  '<div style="text-align:center;"><div class="bagToken token" data-kind="bag"><span class="be">🎁</span>礼包·买'+p.b+'赠'+p.f+'<br>（'+g+'个'+p.unit+'付'+p.b+'个钱）</div></div></div>'+
  '<div class="card"><div class="row-label">📦 货架（单品：拖到购物车单独付钱）</div><div class="shelf">'+shelf+'</div></div>'+
  '</div>'+
  '<div class="card"><div class="row-label">🛒 购物车</div>'+
  '<div class="dz" id="cart" data-accept="bag item" style="min-height:96px;">把礼包袋 / 单品拖到这里<br>（点购物车里的东西可以退回）</div>'+
  '<div class="cartRow" id="cartRow"></div>'+
  '<div class="payline" id="payLine"></div>'+
  '<div class="btnrow"><button class="btn primary big" id="btnPay">💰 结账</button>'+
  '<button class="btn" id="btnClear">🧹 清空购物车</button></div></div>';
}
function initPromo(p){
  var g=p.b+p.f;
  var q=Math.floor(p.T/g), r=p.T-q*g;
  var optimal=Math.min(p.b*q+r, p.b*(q+1));   /* 最省钱方案（整组买 vs 剩太多时多买一组） */
  var st={ groups:0, singles:0 };
  delegateToken(document, '.bagToken', 'bag', function(zone){
    if(!zone || zone.id!=='cart'){ toast('礼包袋要拖进购物车哦！'); return; }
    st.groups++; step(1); renderCart();
  });
  delegateToken(document, '.shelf .itemIco', 'item', function(zone){
    if(!zone || zone.id!=='cart'){ toast('单品要拖进购物车哦！'); return; }
    st.singles++; step(1); renderCart();
  });
  function covered(){ return st.groups*g+st.singles; }
  function paid(){ return st.groups*p.b+st.singles; }
  function renderCart(){
    var html='';
    if(st.groups>0) html+='<span class="cartBag" data-a="g">🎁×'+st.groups+'</span>';
    if(st.singles>0) html+='<span class="cartSingle" data-a="s">'+p.ico+'×'+st.singles+'</span>';
    $('#cartRow').innerHTML=html||'<span class="dim">购物车空空的……</span>';
    $$('#cartRow .cartBag').forEach(function(b){ b.addEventListener('click', function(){ st.groups--; step(1); renderCart(); toast('退回 1 个礼包'); }); });
    $$('#cartRow .cartSingle').forEach(function(b){ b.addEventListener('click', function(){ st.singles--; step(1); renderCart(); toast('退回 1 个单品'); }); });
    var money=(p.price>0)?(' = '+p.price+'×'+paid()+' = <b>'+(p.price*paid())+' 元</b>'):('');
    $('#payLine').innerHTML='已备齐 '+covered()+' / '+p.T+' '+p.unit+' ｜ 需付：<b>'+paid()+'</b> '+p.unit+'的钱'+money;
  }
  $('#btnClear').addEventListener('click', function(){ step(1); st.groups=0; st.singles=0; renderCart(); });
  $('#btnPay').addEventListener('click', function(){
    step(1);
    if(covered()<p.T){ toast('还差 '+(p.T-covered())+' '+p.unit+'没备齐，同学们还等着呢！'); return; }
    if(paid()>optimal){ toast('能备齐，但多付了钱！提示：先用礼包凑整，剩下的零头再单买～'); return; }
    var lines=p.T+'÷'+g+'='+q+'（组）……'+r+'（'+p.unit+'）；需付：'+p.b+'×'+q+'+'+r+'='+optimal+'（'+p.unit+'）';
    if(p.price>0){ lines+='；花钱：'+p.price+'×'+optimal+'='+(p.price*optimal)+'（元）'; }
    winStation('market', lines+'<br><b>【答】'+p.ansText+'</b>');
  });
  renderCart();
}

/* ---- 4B 商场比价：组装乙商场方案，把采购单拖给更省的商场 ---- */
function bodyShop(p){
  return '<div class="card guide">🎯 玩法：甲商场“每个优惠'+p.discA+'元”，乙商场“每买'+p.bB+'个送'+p.fB+'个”。先按甲商场的〔🧮 算一算〕，再拖乙商场的滑块配好组数（每组 '+(p.bB+p.fB)+' 个只需付 '+p.bB+' 个钱），最后把<b>采购单拖给更省钱的商场</b>！</div>'+
  '<div class="grid2">'+
  '<div class="card"><div class="shopCard dz" id="shopA" data-accept="order"><h4>🏬 甲商场</h4>'+
  '<p>每个优惠 '+p.discA+' 元 → 单价 '+(p.price-p.discA)+' 元</p>'+
  '<div class="btnrow"><button class="btn" id="calcA">🧮 算一算总价</button></div>'+
  '<div id="resA" style="font-size:20px;font-weight:bold;margin-top:8px;"></div></div></div>'+
  '<div class="card"><div class="shopCard dz" id="shopB" data-accept="order"><h4>🏬 乙商场</h4>'+
  '<p>每买 '+p.bB+' 个送 '+p.fB+' 个（1组='+(p.bB+p.fB)+' 个，付 '+p.bB+' 个的钱）</p>'+
  '<div class="row-label" style="margin-top:8px;">组数：<span class="val-bub" id="gN">1 组</span></div>'+
  '<input type="range" class="bigRange" id="gSlider" min="1" max="8" step="1" value="1">'+
  '<div id="resB" style="font-size:19px;line-height:1.9;"></div></div></div>'+
  '</div>'+
  '<div class="card" style="text-align:center;"><div class="row-label">🧾 把采购单拖给更省钱的商场</div>'+
  '<div class="orderToken token" data-kind="order">🧾 采购单：'+p.T+' 个足球</div></div>';
}
function initShop(p){
  var gB=p.bB+p.fB;
  var st={ calcA:false, g:1 };
  function updB(){
    var cov=st.g*gB, pay=st.g*p.bB, total=pay*p.price;
    $('#gN').textContent=st.g+' 组';
    $('#resB').innerHTML='覆盖：'+cov+' / '+p.T+' 个'+(cov>=p.T?' <span class="ok-tag">✔够啦</span>':' <span class="bad-tag">还不够</span>')+
      '<br>只需付：'+pay+' 个 × '+p.price+'元 = <b>'+total+' 元</b>';
  }
  $('#gSlider').addEventListener('input', function(){ st.g=parseInt(this.value,10); updB(); });
  $('#gSlider').addEventListener('change', function(){ step(1); });
  $('#calcA').addEventListener('click', function(){
    step(1); st.calcA=true;
    $('#resA').innerHTML=(p.price-p.discA)+'×'+p.T+' = <b>'+((p.price-p.discA)*p.T)+' 元</b>';
  });
  updB();
  var optG=Math.ceil(p.T/gB);           /* 乙商场最省钱的组数（刚好够用） */
  var optPay=optG*p.bB, optTotal=optPay*p.price;
  delegateToken(document, '.orderToken', 'order', function(zone){
    if(!zone){ toast('把采购单拖到商场卡片上！'); return; }
    step(1);
    var totalA=(p.price-p.discA)*p.T;
    if(zone.id==='shopA'){
      if(!st.calcA){ st.calcA=true; $('#resA').innerHTML=(p.price-p.discA)+'×'+p.T+' = <b>'+totalA+' 元</b>'; }
      toast('甲商场要 '+totalA+' 元；乙商场配好组数只要 '+optTotal+' 元，再去乙商场看看！');
      return;
    }
    var cov=st.g*gB, total=st.g*p.bB*p.price;
    if(cov<p.T){ toast('乙商场现在只覆盖 '+cov+' 个，不够 '+p.T+' 个，加组数！'); return; }
    if(st.g>optG){ toast('覆盖够了，但要付 '+total+' 元，买多了——试试刚好够用的组数！'); return; }
    winStation('market','甲商场：'+(p.price-p.discA)+'×'+p.T+'='+totalA+'（元）；乙商场：'+p.T+'÷'+gB+'='+optG+'（组），只需付 '+p.bB+'×'+optG+'='+optPay+'（个），'+p.price+'×'+optPay+'='+optTotal+'（元）<br>'+totalA+' &gt; '+optTotal+'，乙商场更省钱！<br><b>【答】'+p.ansText+'</b>');
  });
}

/* =====================================================================
 * 基地五：蜗牛登高塔（蜗牛爬井 / 上台阶 / 跳房子）
 * ===================================================================== */
function bodyClimb(p){
  var isStairs=(p.scene==='stairs');
  return '<div class="card guide">🎯 玩法：先把 <b>🚩 小旗</b>拖到天数标尺上（预测第几'+p.uName+'到顶），再按〔☀️ 过一'+p.uName+'〕陪它爬：白天'+(isStairs?'上':'爬')+' '+p.up+' '+p.unit+'、'+(isStairs?'退':'滑')+' '+p.down+' '+p.unit+'——注意观察，到顶的那一'+p.uName+'就不用再下滑啦！</div>'+
  '<div class="card"><div class="row-label">🚩 我的预测：第几'+p.uName+'到顶？</div>'+
  '<div class="ruler" id="dayRuler"><div class="flag" id="dayFlag">🚩<span class="fbub" id="dayTxt">拖我！</span></div></div>'+
  '<div class="flagNote" id="dayNote">（开始爬后小旗锁定）</div></div>'+
  '<div class="card"><div class="sceneWrap">'+
  '<svg id="snailSvg" width="320" height="360" viewBox="0 0 320 360"></svg>'+
  '<div class="snailInfo" id="snailInfo"></div></div>'+
  '<div class="btnrow" style="justify-content:center;">'+
  '<button class="btn primary big" id="btnDay">☀️ 过一'+p.uName+'（+'+p.up+p.unit+' 后 '+(isStairs?'退':'滑')+' '+p.down+p.unit+'）</button>'+
  '<button class="btn" id="btnAuto">⏩ 自动演示</button></div></div>'+
  '<div class="card"><div class="row-label">📜 爬行记录</div><div class="loglist" id="slog"><span class="dim">还没有开始……</span></div></div>';
}
function initClimb(p){
  var st={ h:0, day:0, done:false, started:false, flag:0, busy:false };
  var isStairs=(p.scene==='stairs');
  var ruler=$('#dayRuler');
  rulerNums(ruler,1,p.daysMax);
  dragRulerFlag($('#dayFlag'), ruler, 1, p.daysMax, function(v){
    st.flag=v; $('#dayTxt').textContent='第'+v+p.uName;
  }, function(){ step(1); });
  /* 画井 / 楼梯场景（SVG 重绘，数字标注齐全） */
  var svg=$('#snailSvg');
  var TOP=40, BOT=300, L=100, R=240;
  var scale=(BOT-TOP)/p.depth;
  function yOf(h){ return BOT-h*scale; }
  var s='';
  s+='<rect x="0" y="'+BOT+'" width="320" height="60" fill="#a5d6a7"/>';
  s+='<text x="160" y="26" font-size="18" font-weight="bold" text-anchor="middle" fill="#5d4037">'+(isStairs?'2 楼（第 '+p.depth+' 级台阶）':'井口（深 '+p.depth+' 米）')+'</text>';
  if(isStairs){
    s+='<rect x="'+(L-14)+'" y="'+TOP+'" width="'+((R-L)+28)+'" height="'+(BOT-TOP)+'" fill="#fff8e1" stroke="#cfa64b" stroke-width="2" rx="6"/>';
    var n=p.depth, sw=(R-L)/n, sh=(BOT-TOP)/n;
    var d='M'+L+' '+BOT;
    for(var i2=1;i2<=n;i2++){
      d+=' L'+(L+i2*sw)+' '+(BOT-(i2-1)*sh);
      d+=' L'+(L+i2*sw)+' '+(BOT-i2*sh);
    }
    s+='<path d="'+d+'" fill="none" stroke="#8d6e63" stroke-width="3"/>';
  } else {
    s+='<rect x="'+L+'" y="'+TOP+'" width="'+(R-L)+'" height="'+(BOT-TOP)+'" fill="#e1f5fe" stroke="#0277bd" stroke-width="4" rx="8"/>';
    var rungs=Math.min(p.depth,14), rh=(BOT-TOP)/rungs;
    for(var i3=1;i3<rungs;i3++){
      s+='<line x1="'+L+'" y1="'+(BOT-i3*rh)+'" x2="'+R+'" y2="'+(BOT-i3*rh)+'" stroke="#81d4fa" stroke-width="3"/>';
    }
  }
  /* 左侧刻度尺：每个刻度标注高度数字 */
  var labEvery=(p.depth>12?3:2);
  for(var m=0;m<=p.depth;m++){
    var yy=yOf(m);
    s+='<line x1="'+(L-26)+'" y1="'+yy+'" x2="'+(L-6)+'" y2="'+yy+'" stroke="#37474f" stroke-width="2"/>';
    if(m%labEvery===0||m===p.depth){
      s+='<text x="'+(L-30)+'" y="'+(yy+6)+'" font-size="16" text-anchor="end" fill="#37474f" font-weight="bold">'+m+'</text>';
    }
  }
  s+='<line x1="'+(L-26)+'" y1="'+TOP+'" x2="'+(L-26)+'" y2="'+BOT+'" stroke="#37474f" stroke-width="3"/>';
  s+='<text x="'+(L-30)+'" y="'+(TOP-12)+'" font-size="16" text-anchor="end" fill="#37474f" font-weight="bold">'+p.unit+'</text>';
  s+='<g id="snailG"><circle cx="0" cy="0" r="13" fill="#ff8f00" stroke="#e65100" stroke-width="3"/>'+
     '<line x1="6" y1="-8" x2="12" y2="-18" stroke="#e65100" stroke-width="3"/><circle cx="12" cy="-19" r="3.5" fill="#e65100"/>'+
     '<line x1="0" y1="-11" x2="1" y2="-21" stroke="#e65100" stroke-width="3"/><circle cx="1" cy="-22" r="3.5" fill="#e65100"/></g>';
  s+='<text id="snailH" x="170" y="330" font-size="18" font-weight="bold" fill="#e65100">现在：0 '+p.unit+'</text>';
  svg.innerHTML=s;
  var G=svg.querySelector('#snailG'), HTXT=svg.querySelector('#snailH');
  function place(anim){
    if(!anim) G.style.transition='none';
    var cx=(L+R)/2;
    if(isStairs){ cx=L+ (st.h/p.depth)*(R-L); }
    G.style.transform='translate('+cx+'px,'+(yOf(st.h)-14)+'px)';
    if(!anim){ void G.offsetWidth; G.style.transition='transform .55s ease'; }
    HTXT.textContent='现在：'+st.h+' '+p.unit+'（'+p.depth+' '+p.unit+'到顶）';
    $('#snailInfo').innerHTML='📍 当前高度：<b>'+st.h+'</b> / '+p.depth+' '+p.unit+
      '<br>📅 已过：<b>'+st.day+'</b> '+p.uName+
      '<br>☀️ 每天'+(isStairs?'上':'爬')+'：+'+p.up+' '+p.unit+
      '<br>🌙 '+(isStairs?'退':'滑')+'：−'+p.down+' '+p.unit+
      '<br>📈 每天净'+(isStairs?'上':'爬')+'：'+(p.up-p.down)+' '+p.unit;
  }
  place(false);
  function log(msg){
    var b=$('#slog');
    if(b.querySelector('.dim')) b.innerHTML='';
    b.insertAdjacentHTML('afterbegin','<div>· '+msg+'</div>');
  }
  function guardStart(){
    if(st.started) return true;
    if(st.flag<1){ toast('先把预测小旗拖到标尺上！'); return false; }
    st.started=true; ruler.dataset.lock='1';
    $('#dayNote').textContent='小旗已锁定：你预测第 '+st.flag+' '+p.uName+'到顶。出发！';
    return true;
  }
  function oneDay(){
    if(st.done||st.busy) return false;
    if(!guardStart()) return false;
    st.busy=true; step(1);
    st.h=Math.min(st.h+p.up, p.depth);
    if(st.h>=p.depth){
      st.day++;
      place(true);
      log('第'+st.day+p.uName+'：'+p.upWord+' +'+p.up+p.unit+' → 到顶啦！这'+p.uName+'不用再下滑 ✔');
      finish();
      return;
    }
    place(true);
    setTimeout(function(){
      var before=st.h;
      st.h=Math.max(st.h-p.down,0);
      place(true);
      setTimeout(function(){
        st.day++;
        place(false);
        log('第'+st.day+p.uName+'：'+p.upWord+'+'+p.up+p.unit+' 到 '+before+p.unit+'，'+p.downWord+'−'+p.down+p.unit+' → 现在 '+st.h+p.unit+'（净+'+(p.up-p.down)+'）');
        st.busy=false;
      }, 620);
    }, 620);
    return true;
  }
  $('#btnDay').addEventListener('click', oneDay);
  $('#btnAuto').addEventListener('click', function(){
    if(st.done) return;
    if(!guardStart()) return;
    var iv=setInterval(function(){
      if(st.done){ clearInterval(iv); return; }
      oneDay();
    }, 1400);
  });
  function finish(){
    st.done=true;
    var good=(st.flag===st.day);
    var flagMsg=good?'🚩 预测正确，真有眼光！':('🚩 你预测第 '+st.flag+' '+p.uName+'，实际第 '+st.day+' '+p.uName+'到顶。');
    modal('🎉 到顶啦！',
      '<p>它在第 <b style="font-size:30px;color:var(--c-main)">'+st.day+'</b> '+p.uName+'到达顶端！</p><p>'+flagMsg+'</p>',
      [{label:'确认领取星星 ⭐', cls:'primary', cb:function(c){
        c();
        winStation('snail', p.sol.join('；')+'<br><b>【答】'+p.ansText+'</b>');
      }}]);
  }
}

/* ---- 5B 跳房子：调“后退格数”，模拟验证第 7 次刚好到 ---- */
function bodyHop(p){
  var cells='';
  for(var i=0;i<=p.target;i++){
    cells+='<div class="hopCell'+(i===p.target?' goall':'')+'" data-c="'+i+'">'+(i===p.target?i+'🏁':i)+'</div>';
  }
  return '<div class="card guide">🎯 玩法：婷婷每次向前跳 '+p.fwd+' 格、再后退几格，第 '+p.times+' 次向前跳后<b>刚好</b>到第 '+p.target+' 格。拖滑块选“每次后退几格”，按〔▶ 自动演示〕看看是不是第 '+p.times+' 次刚好到——试到对为止！</div>'+
  '<div class="card"><div class="row-label">↩️ 每次后退：<span class="val-bub" id="bkN">2 格</span></div>'+
  '<input type="range" class="bigRange" id="bkSlider" min="0" max="3" step="1" value="2">'+
  '<div class="hopTrack" id="hopTrack">'+cells+'</div>'+
  '<div class="btnrow" style="justify-content:center;"><button class="btn primary big" id="btnHopRun">▶ 自动演示</button></div>'+
  '<div class="clockBig" id="hopMsg">选好后格数，开始演示吧！</div></div>';
}
function initHop(p){
  var busy=false;
  var sl=$('#bkSlider');
  sl.addEventListener('input', function(){ $('#bkN').textContent=this.value+' 格'; });
  sl.addEventListener('change', function(){ step(1); });
  $('#btnHopRun').addEventListener('click', function(){
    if(busy) return;
    step(1); busy=true;
    var back=parseInt(sl.value,10);
    var track=$('#hopTrack');
    var tok=document.createElement('div'); tok.className='hopTok'; tok.textContent='👧';
    var cells=$$('#hopTrack .hopCell');
    cells.forEach(function(c){ c.classList.remove('mark'); });
    cells[0].appendChild(tok);
    var pos=0, tries=0;
    $('#hopMsg').textContent='演示中……';
    function jump(){
      tries++;
      pos+=p.fwd;
      if(pos>=p.target){
        pos=p.target;
        cells[Math.min(pos,p.target)].appendChild(tok);
        setTimeout(function(){ result(tries); }, 420);
        return;
      }
      cells[pos].appendChild(tok);
      cells[pos].classList.add('mark');
      setTimeout(function(){
        pos-=back;
        cells[Math.max(pos,0)].appendChild(tok);
        if(tries>=20){ result(-1); return; }
        setTimeout(jump, 380);
      }, 420);
    }
    function result(k){
      busy=false;
      if(k===p.times){
        $('#hopMsg').innerHTML='🎉 完美！后退 '+back+' 格时，正好第 '+k+' 次跳到终点！每次实际向前 '+(p.fwd-back)+' 格。';
        winStation('snail', p.sol.join('；')+'<br><b>【答】'+p.ansText+'</b>');
      } else if(k<0){
        $('#hopMsg').textContent='跳了 20 次还没到终点……换个后退格数再试试！';
      } else if(k<p.times){
        $('#hopMsg').textContent='第 '+k+' 次就到了，比题目说的第 '+p.times+' 次早——每次后退得不够，把后退格数调大一点！';
      } else {
        $('#hopMsg').textContent='第 '+k+' 次才到，比第 '+p.times+' 次晚——每次后退太多，把后退格数调小一点！';
      }
    }
    setTimeout(jump, 300);
  });
}

/* ---------------- 启动 ---------------- */
$('#btnRules').addEventListener('click', function(){ step(1); showRules(); });
$('#btnHome').addEventListener('click', function(){ closeModal(); renderDifficulty(); });
renderWelcome();
</script>
