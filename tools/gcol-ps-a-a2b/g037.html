<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>彩虹水坊奇妙之旅 · 动手操作大冒险</title>
<style>
/* ========== 全局基础样式 ========== */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root{
  /* 主色变量，由 JS 在每局开始时随机覆盖，保证多次游玩不腻 */
  --main:#4A90E9;
  --main-dark:#2E6BB0;
  --accent:#F5A623;
  --accent-dark:#C8830E;
  --ink:#22303C;
  --paper:#FFFDF7;
  --good:#2ECC71;
  --bad:#E74C3C;
  --soft:#EAF2FB;
}
html,body{ height:100%; }
body{
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
  background:linear-gradient(160deg,var(--soft) 0%,#F7F1E3 100%);
  color:var(--ink);
  min-height:100%;
  overflow-x:hidden;
  user-select:none;
}
button{ font-family:inherit; cursor:pointer; border:none; outline:none; }
.hidden{ display:none !important; }

/* ========== 顶部状态栏 ========== */
#topbar{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 16px;
  background:linear-gradient(90deg,var(--main),var(--main-dark));
  color:#fff; box-shadow:0 3px 10px rgba(0,0,0,.15);
}
#topbar .title{ font-size:20px; font-weight:bold; letter-spacing:1px; }
#topbar .stats{ display:flex; gap:14px; font-size:16px; font-weight:bold; }
#topbar .stats span{ background:rgba(255,255,255,.22); padding:6px 12px; border-radius:20px; }
#btnHelpTop{ background:rgba(255,255,255,.25); color:#fff; padding:8px 14px; border-radius:20px; font-weight:bold; font-size:15px; }

/* ========== 通用面板 ========== */
.screen{ padding:18px 16px 90px; max-width:980px; margin:0 auto; }
.bigTitle{ text-align:center; font-size:30px; font-weight:bold; color:var(--main-dark); margin:10px 0 6px; text-shadow:2px 2px 0 #fff; }
.subTitle{ text-align:center; font-size:16px; color:var(--ink); opacity:.8; margin-bottom:18px; }

/* ========== 难度选择卡片 ========== */
.diffGrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:18px; margin-top:10px; }
.diffCard{
  background:var(--paper); border-radius:22px; padding:26px 20px; text-align:center;
  box-shadow:0 8px 22px rgba(0,0,0,.10); border:4px solid var(--main);
  transition:transform .15s, box-shadow .15s; position:relative; overflow:hidden;
}
.diffCard:hover{ transform:translateY(-6px); box-shadow:0 14px 30px rgba(0,0,0,.18); }
.diffCard .badge{ font-size:42px; line-height:1; margin-bottom:8px; }
.diffCard h3{ font-size:24px; color:var(--main-dark); margin-bottom:6px; }
.diffCard .tag{ display:inline-block; background:var(--accent); color:#fff; padding:4px 14px; border-radius:14px; font-size:14px; font-weight:bold; margin-bottom:10px; }
.diffCard p{ font-size:15px; line-height:1.6; color:var(--ink); opacity:.85; }
.diffCard .goBtn{ margin-top:14px; background:var(--main); color:#fff; font-size:18px; font-weight:bold; padding:12px 26px; border-radius:30px; width:100%; }
.diffCard .goBtn:active{ transform:scale(.97); }
.diffCard.c2{ border-color:var(--accent); }
.diffCard.c2 h3{ color:var(--accent-dark); }
.diffCard.c2 .goBtn{ background:var(--accent); }
.diffCard.c3{ border-color:#9B59B6; }
.diffCard.c3 h3{ color:#7D3C98; }
.diffCard.c3 .goBtn{ background:#9B59B6; }

/* ========== 关卡选择条 ========== */
.levelBar{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:14px; }
.levelBar .lvChip{ background:var(--paper); border:3px solid var(--main); color:var(--main-dark); font-weight:bold; font-size:16px; padding:10px 20px; border-radius:30px; }
.levelBar .lvChip.active{ background:var(--main); color:#fff; }
.levelBar .lvChip.done{ background:var(--good); border-color:var(--good); color:#fff; }
.levelBar .lvChip.done::after{ content:" ✓"; }

/* ========== 故事/题目面板 ========== */
.storyCard{
  background:var(--paper); border-radius:18px; padding:16px 18px; margin-bottom:14px;
  box-shadow:0 4px 14px rgba(0,0,0,.08); border-left:8px solid var(--accent);
}
.storyCard .storyTag{ display:inline-block; background:var(--accent); color:#fff; font-size:13px; font-weight:bold; padding:3px 12px; border-radius:12px; margin-bottom:8px; }
.storyCard h4{ font-size:19px; color:var(--main-dark); margin-bottom:6px; }
.storyCard p{ font-size:16px; line-height:1.7; }
.storyCard .goal{ margin-top:10px; background:var(--soft); border-radius:12px; padding:10px 14px; font-size:16px; font-weight:bold; color:var(--main-dark); }

/* ========== 操作舞台（倒水） ========== */
#pourStage{ position:relative; }
.tapArea{ display:flex; justify-content:center; align-items:flex-end; gap:18px; flex-wrap:wrap; min-height:300px; padding:14px; background:linear-gradient(180deg,#E8F4FF 0%,#CFE8FB 100%); border-radius:20px; box-shadow:inset 0 2px 8px rgba(0,0,0,.06); }
.containerBox{ position:relative; width:120px; display:flex; flex-direction:column; align-items:center; }
.containerBox .vname{ font-size:15px; font-weight:bold; color:var(--ink); margin-bottom:4px; }
.bottle{
  position:relative; width:96px; height:180px; border:5px solid var(--main-dark);
  border-top:none; border-radius:0 0 26px 26px; background:rgba(255,255,255,.5);
  overflow:hidden; cursor:pointer; transition:transform .12s, box-shadow .12s;
}
.bottle::before{ content:""; position:absolute; top:-14px; left:50%; transform:translateX(-50%); width:44px; height:18px; background:var(--main-dark); border-radius:6px 6px 0 0; }
.bottle:hover{ transform:translateY(-3px); }
.bottle.selected{ box-shadow:0 0 0 5px var(--accent), 0 8px 18px rgba(0,0,0,.18); transform:translateY(-3px); }
.water{ position:absolute; left:0; right:0; bottom:0; background:linear-gradient(180deg,var(--main) 0%,var(--main-dark) 100%); transition:height .45s cubic-bezier(.3,.7,.4,1); }
.water::before{ content:""; position:absolute; top:-6px; left:0; right:0; height:12px; background:radial-gradient(ellipse at center, rgba(255,255,255,.5) 0%, transparent 70%); }
.bottle .scaleLabel{ position:absolute; right:6px; top:6px; font-size:12px; color:var(--main-dark); font-weight:bold; background:rgba(255,255,255,.7); padding:1px 5px; border-radius:6px; }
.bottle .amount{ position:absolute; left:0; right:0; bottom:8px; text-align:center; color:#fff; font-size:18px; font-weight:bold; text-shadow:0 1px 3px rgba(0,0,0,.5); z-index:2; }
.bottle.targetCup{ border-color:var(--accent); }
.bottle.targetCup .water{ background:linear-gradient(180deg,var(--accent) 0%,var(--accent-dark) 100%); }
.bottle.targetCup .amount{ color:#fff; }
/* 大桶（水源）特殊样式 */
.bottle.bigSrc{ width:130px; height:200px; border-color:#5D6D7E; }
.bottle.bigSrc::before{ background:#5D6D7E; }
.bottle.bigSrc .water{ background:linear-gradient(180deg,#7FB3D5 0%,#5D6D7E 100%); }

/* 水龙头/排水口图标按钮区 */
.opPanel{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:14px; }
.opBtn{ background:var(--paper); border:3px solid var(--main); color:var(--main-dark); font-weight:bold; font-size:15px; padding:11px 18px; border-radius:26px; box-shadow:0 3px 8px rgba(0,0,0,.08); }
.opBtn:active{ transform:scale(.95); }
.opBtn.danger{ border-color:var(--bad); color:var(--bad); }
.opBtn.warn{ border-color:var(--accent); color:var(--accent-dark); }
.opBtn.tip{ background:var(--main); color:#fff; }

.pourHint{ text-align:center; margin-top:10px; font-size:15px; color:var(--main-dark); font-weight:bold; min-height:22px; }

/* ========== 天平舞台 ========== */
#balanceStage{ position:relative; }
.pearlPool{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; padding:16px; background:var(--soft); border-radius:18px; min-height:80px; margin-bottom:14px; }
.pearlPool .poolTitle{ width:100%; text-align:center; font-weight:bold; color:var(--main-dark); font-size:15px; margin-bottom:4px; }
.pearl{
  width:52px; height:52px; border-radius:50%;
  background:radial-gradient(circle at 32% 30%, #fff 0%, var(--accent) 45%, var(--accent-dark) 100%);
  box-shadow:0 4px 8px rgba(0,0,0,.25), inset -4px -6px 10px rgba(0,0,0,.2);
  cursor:grab; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:bold; font-size:18px; text-shadow:0 1px 2px rgba(0,0,0,.5);
  touch-action:none; transition:transform .1s;
}
.pearl:active{ cursor:grabbing; transform:scale(1.08); }
.pearl.guess{ animation:wiggle .4s; }
@keyframes wiggle{ 0%,100%{transform:rotate(0)} 25%{transform:rotate(-12deg)} 75%{transform:rotate(12deg)} }

.balanceWrap{ display:flex; justify-content:center; align-items:flex-end; gap:0; margin:10px auto; max-width:560px; position:relative; }
.panCol{ display:flex; flex-direction:column; align-items:center; width:42%; }
.panDrop{
  width:90%; min-height:120px; border:3px dashed var(--main); border-radius:16px;
  display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center;
  padding:10px; background:rgba(255,255,255,.55); transition:background .15s, border-color .15s;
}
.panDrop.hover{ background:var(--soft); border-color:var(--accent); border-style:solid; }
.panDrop .panLabel{ font-size:14px; color:var(--main-dark); font-weight:bold; opacity:.6; }
.beamCol{ width:16%; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:140px; }
#beam{ transition:transform .6s cubic-bezier(.3,.7,.4,1); transform-origin:50% 100%; }
.pillar{ width:18px; height:60px; background:linear-gradient(180deg,#B07C4A,#8B5A2B); border-radius:4px; margin-top:-6px; }
.baseTri{ width:0; height:0; border-left:40px solid transparent; border-right:40px solid transparent; border-bottom:0; border-top:34px solid #8B5A2B; }

#weighResult{ text-align:center; font-size:18px; font-weight:bold; margin:8px 0; min-height:26px; color:var(--main-dark); }
.balanceOps{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

/* ========== 底部按钮栏 ========== */
.bottomBar{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  display:flex; gap:8px; justify-content:center; padding:10px 12px;
  background:linear-gradient(0deg,rgba(255,253,247,.96),rgba(255,253,247,.7));
  box-shadow:0 -3px 10px rgba(0,0,0,.08); flex-wrap:wrap;
}
.bottomBar button{ background:var(--paper); border:3px solid var(--main); color:var(--main-dark); font-weight:bold; font-size:15px; padding:11px 16px; border-radius:24px; }
.bottomBar button:active{ transform:scale(.95); }
.bottomBar button.acc{ background:var(--accent); color:#fff; border-color:var(--accent); }
.bottomBar button.gh{ background:var(--good); color:#fff; border-color:var(--good); }

/* ========== 模态层（规则/答案/庆祝） ========== */
.mask{ position:fixed; inset:0; background:rgba(20,30,40,.6); z-index:100; display:flex; align-items:center; justify-content:center; padding:18px; }
.modal{ background:var(--paper); border-radius:20px; max-width:560px; width:100%; max-height:86vh; overflow-y:auto; padding:22px 20px; box-shadow:0 16px 40px rgba(0,0,0,.3); }
.modal h3{ font-size:23px; color:var(--main-dark); margin-bottom:12px; text-align:center; }
.modal .closeBtn{ display:block; margin:18px auto 0; background:var(--main); color:#fff; font-size:17px; font-weight:bold; padding:12px 30px; border-radius:30px; }
.modal .ruleSec{ margin-bottom:14px; }
.modal .ruleSec h4{ color:var(--accent-dark); font-size:17px; margin-bottom:4px; }
.modal .ruleSec p, .modal .ruleSec li{ font-size:15px; line-height:1.7; color:var(--ink); }
.modal .ruleSec ul{ padding-left:22px; }
.answerStep{ background:var(--soft); border-radius:12px; padding:10px 14px; margin:6px 0; font-size:15px; line-height:1.6; }
.answerStep b{ color:var(--main-dark); }

/* ========== 庆祝彩带画布 ========== */
#celebCanvas{ position:fixed; inset:0; z-index:200; pointer-events:none; }

/* ========== 通关庆祝弹窗 ========== */
.winBox{ text-align:center; }
.winBox .crown{ font-size:64px; }
.winBox h3{ font-size:26px; color:var(--good); }
.winBox p{ font-size:16px; margin:8px 0 4px; line-height:1.7; }
.winBox .nextBtns{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
.winBox .nextBtns button{ font-size:16px; font-weight:bold; padding:12px 22px; border-radius:28px; border:none; color:#fff; }

/* ========== 提示气泡 ========== */
.toast{ position:fixed; left:50%; top:18%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 22px; border-radius:26px; font-size:16px; font-weight:bold; z-index:300; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; box-shadow:0 6px 18px rgba(0,0,0,.3); }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
.toast.good{ background:var(--good); }
.toast.bad{ background:var(--bad); }

/* ========== 响应式 ========== */
@media (max-width:560px){
  #topbar .title{ font-size:16px; }
  #topbar .stats{ gap:8px; font-size:13px; }
  #topbar .stats span{ padding:5px 9px; }
  .bigTitle{ font-size:24px; }
  .bottle{ width:80px; height:150px; }
  .bottle.bigSrc{ width:100px; height:170px; }
  .containerBox{ width:100px; }
  .pearl{ width:46px; height:46px; font-size:16px; }
  .diffCard{ padding:20px 14px; }
  .bottomBar button{ font-size:13px; padding:10px 12px; }
}
</style>
</head>
<body>

<!-- ====== 顶部状态栏：标题 + 计时 + 步数 + 规则 ====== -->
<div id="topbar">
  <div class="title">🌈 彩虹水坊奇妙之旅</div>
  <div class="stats">
    <span id="timer">⏱ 00:00</span>
    <span id="stepCnt">👣 0 步</span>
  </div>
  <button id="btnHelpTop" onclick="showRules()">📖 规则</button>
</div>

<!-- ====== 难度选择屏 ====== -->
<div id="screenHome" class="screen">
  <div class="bigTitle">动手操作大冒险</div>
  <div class="subTitle">本讲核心：用“凑数法”量出想要的水、用“三分法”找出较轻的珍珠。选一个难度开始吧！</div>
  <div class="diffGrid">
    <div class="diffCard c1">
      <div class="badge">💧</div>
      <h3>初级 · 小试身手</h3>
      <div class="tag">倒水凑数</div>
      <p>有两个量杯和一个收集杯。装满、倒来倒去，凑出指定水量。练的是“加减凑数”的本领。</p>
      <button class="goBtn" onclick="enterDiff('easy')">开始挑战</button>
    </div>
    <div class="diffCard c2">
      <div class="badge">🛢️</div>
      <h3>中级 · 勇者试炼</h3>
      <div class="tag">分油巧匠</div>
      <p>大桶里的油总量有限，要在几个桶之间来回倒，分出指定的份数。考的是“列表凑数”的巧思。</p>
      <button class="goBtn" onclick="enterDiff('medium')">开始挑战</button>
    </div>
    <div class="diffCard c3">
      <div class="badge">⚖️</div>
      <h3>高级 · 大师之路</h3>
      <div class="tag">天平寻真</div>
      <p>把珍珠拖上托盘称一称，用“三分法”找出较轻的那一颗。每次称重都要动脑筋缩小范围！</p>
      <button class="goBtn" onclick="enterDiff('hard')">开始挑战</button>
    </div>
  </div>
</div>

<!-- ====== 关卡游玩屏 ====== -->
<div id="screenPlay" class="screen hidden">
  <div id="levelBar" class="levelBar"></div>
  <div id="storyArea"></div>
  <div id="pourStage" class="hidden"></div>
  <div id="balanceStage" class="hidden"></div>
</div>

<!-- ====== 底部固定按钮栏 ====== -->
<div id="bottomBar" class="bottomBar hidden">
  <button onclick="revealAnswer()">💡 揭示答案</button>
  <button onclick="restartLevel()">🔄 重新开始</button>
  <button onclick="backToDiff()">🏠 返回难度</button>
  <button onclick="showRules()">📖 规则说明</button>
</div>

<!-- ====== 模态层容器 ====== -->
<div id="modalRoot"></div>

<!-- ====== 庆祝彩带画布 ====== -->
<canvas id="celebCanvas"></canvas>

<!-- ====== 提示气泡 ====== -->
<div id="toast" class="toast"></div>

<script>
"use strict";
/* ========================================================
   彩虹水坊奇妙之旅 —— 第19讲《动手操作（上）》互动游戏
   核心题型绑定：
     · 倒油/水问题 → 凑数法（装满 / 互倒 / 倒空 三种操作凑出目标量）
     · 找次品问题 → 三分法（把珍珠尽量三等分，用天平缩小范围）
   全程操作型交互：点击容器选择源/目标执行倒水、拖拽珍珠上天平、
   画布彩带庆祝。绝无“换皮选择题”。
======================================================== */

/* ---------- 主题色板（每局随机抽一个，G8 配色随机化） ---------- */
const THEMES = [
  { main:'#4A90E9', mainDark:'#2E6BB0', accent:'#F5A623', accentDark:'#C8830E', soft:'#EAF2FB' },
  { main:'#2ECC71', mainDark:'#1E8C4C', accent:'#FF6B9D', accentDark:'#C03E6F', soft:'#E7F8EE' },
  { main:'#9B59B6', mainDark:'#6C3483', accent:'#F1C40F', accentDark:'#B7950B', soft:'#F4ECF7' },
  { main:'#FF6B6B', mainDark:'#C0392B', accent:'#4ECDC4', accentDark:'#239B92', soft:'#FDECEC' },
  { main:'#5C6BC0', mainDark:'#3949AB', accent:'#66BB6A', accentDark:'#388E3C', soft:'#EAEEFB' },
  { main:'#16A085', mainDark:'#0E6655', accent:'#E67E22', accentDark:'#AF640C', soft:'#E6F5F1' },
];
function applyRandomTheme(){
  const t = THEMES[Math.floor(Math.random()*THEMES.length)];
  const r = document.documentElement.style;
  r.setProperty('--main', t.main);
  r.setProperty('--main-dark', t.mainDark);
  r.setProperty('--accent', t.accent);
  r.setProperty('--accent-dark', t.accentDark);
  r.setProperty('--soft', t.soft);
}

/* ---------- 全局状态 ---------- */
const G = {
  diff: null,          // 当前难度 'easy'/'medium'/'hard'
  levelIdx: 0,         // 当前关卡序号
  levels: [],          // 当前难度的关卡数组
  cur: null,           // 当前关卡数据对象
  steps: 0,            // 步数
  startTs: 0,          // 计时起点
  timerId: null,
  done: new Set(),     // 已通关的难度.关卡标识
  // 倒水状态
  pour: null,
  // 天平状态
  bal: null,
};

/* ========================================================
   一、倒水 / 分油 题库
   每题字段：
     id, title, story, goalDesc,
     source: 'infinite'（水龙头无限水源）| 'limited'（大桶总量固定）
     caps: {容器id: 容量}（含大桶、目标杯）
     init: {容器id: 初始水量}
     hasTarget: 是否有独立收集杯（target）
     goal: 目标判定对象
       {kind:'cup', val}            收集杯水量 == val
       {kind:'anyHas', val}         任一非源非目标容器 == val
       {kind:'allOf', list:[{c,val}]} 指定多个容器各等于val
       {kind:'sum', list:[c,c], val} 指定容器水量之和 == val
     solution: [步骤字符串数组]（揭示答案用）
   数据来自 docx 例1/例2 与 练习2/4/6，并补充同题型变式。
======================================================== */
const POUR_BANK = {
  easy: [
    {
      id:'e1', title:'彩虹小溪 · 第一关',
      story:'大勺子一次能装 250 克彩虹水，小勺子一次能装 150 克。收集杯是空的，你能用这两把勺子，量出 350 克彩虹水吗？',
      goalDesc:'让收集杯里正好有 350 克彩虹水。',
      source:'infinite', hasTarget:true,
      caps:{ a:250, b:150, target:9999 },
      init:{ a:0, b:0, target:0 },
      goal:{ kind:'cup', val:350 },
      solution:[
        '把大勺装满（大勺=250）。',
        '大勺倒入小勺：小勺装满 150，大勺剩下 250−150=100。',
        '把小勺倒空。',
        '把大勺里的 100 克倒入收集杯（收集杯=100）。',
        '再次把大勺装满（大勺=250）。',
        '把大勺里的 250 克倒入收集杯（100+250=350）。'
      ]
    },
    {
      id:'e2', title:'彩虹小溪 · 第二关',
      story:'有两个量杯，分别能装 10 毫升和 7 毫升。收集杯是空的，请量出 13 毫升的水。',
      goalDesc:'让收集杯里正好有 13 毫升水。',
      source:'infinite', hasTarget:true,

/* ========================================================
   三、计时器 & 步数
======================================================== */
function fmtTime(s){
  const m = String(Math.floor(s/60)).padStart(2,'0');
  const ss = String(s%60).padStart(2,'0');
  return m+':'+ss;
}
function startTimer(){
  G.startTs = Date.now();
  if(G.timerId) clearInterval(G.timerId);
  G.timerId = setInterval(()=>{
    const s = Math.floor((Date.now()-G.startTs)/1000);
    document.getElementById('timer').textContent = '⏱ '+fmtTime(s);
  },1000);
}
function stopTimer(){ if(G.timerId){ clearInterval(G.timerId); G.timerId=null; } }
function addStep(n){
  G.steps += (n||1);
  document.getElementById('stepCnt').textContent = '👣 '+G.steps+' 步';
}
function resetStep(){ G.steps = 0; document.getElementById('stepCnt').textContent = '👣 0 步'; }

/* ========================================================
   四、提示气泡
======================================================== */
let toastTimer = null;
function toast(msg, kind){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (kind?(' '+kind):'');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.className='toast'; }, 1500);
}

/* ========================================================
   七、流程：进入难度 / 关卡
======================================================== */
function enterDiff(d){
  G.diff = d;
  G.levelIdx = 0;
  if(d==='hard'){
    // 天平题：随机打乱顺序，增加重玩变化
    G.levels = shuffle(BAL_BANK.slice());
  } else {
    G.levels = POUR_BANK[d].slice();
    // 每局打乱关卡顺序（反重复机制）
    G.levels = shuffle(G.levels);
  }
  document.getElementById('screenHome').classList.add('hidden');
  document.getElementById('screenPlay').classList.remove('hidden');
  document.getElementById('bottomBar').classList.remove('hidden');
  applyRandomTheme();   // 每次进难度换主题色
  buildLevelBar();
  loadLevel(0);
  startTimer();
  resetStep();
}
function backToDiff(){
  stopTimer();
  G.diff=null; G.cur=null;
  document.getElementById('screenHome').classList.remove('hidden');
  document.getElementById('screenPlay').classList.add('hidden');
  document.getElementById('bottomBar').classList.add('hidden');
  document.getElementById('timer').textContent='⏱ 00:00';
  resetStep();
}
function buildLevelBar(){
  const bar = document.getElementById('levelBar');
  bar.innerHTML = '';
  G.levels.forEach((lv,i)=>{
    const chip = document.createElement('button');
    chip.className = 'lvChip';
    chip.textContent = '第 '+(i+1)+' 关';
    if(i===G.levelIdx) chip.classList.add('active');
    const key = G.diff+'.'+lv.id;
    if(G.done.has(key)) chip.classList.add('done');
    chip.onclick = ()=>{ loadLevel(i); resetStep(); startTimer(); };
    bar.appendChild(chip);
  });
}
function loadLevel(i){
  G.levelIdx = i;
  G.cur = G.levels[i];
  buildLevelBar();
  // 隐藏两个舞台
  document.getElementById('pourStage').classList.add('hidden');
  document.getElementById('balanceStage').classList.add('hidden');
  // 渲染故事
  const sa = document.getElementById('storyArea');
  const cur = G.cur;
  let tagText = G.diff==='easy'?'倒水凑数':(G.diff==='medium'?'分油巧匠':'天平寻真');
  sa.innerHTML = `
    <div class="storyCard">
      <span class="storyTag">${tagText} · 第 ${(i+1)} 关</span>
      <h4>${cur.title}</h4>
      <p>${cur.story}</p>
      <div class="goal">🎯 目标：${cur.goalDesc}</div>
    </div>`;
  if(G.diff==='hard'){ renderBalance(); }
  else { renderPour(); }
  resetStep();
}

function restartLevel(){
  if(!G.cur) return;
  loadLevel(G.levelIdx);
  startTimer();
  toast('已重置，再试一次！','good');
}

/* ========================================================
   八、倒水舞台渲染与逻辑
======================================================== */
function renderPour(){
  const stage = document.getElementById('pourStage');
  stage.classList.remove('hidden');
  const cur = G.cur;
  // 拷贝初始状态
  G.pour = {
    caps: Object.assign({}, cur.caps),
    state: Object.assign({}, cur.init),
    selected: null,
  };
  // 渲染容器（水源大桶放最前，目标杯放最后）
  const order = [];
  if(cur.source==='limited'){ order.push('big'); }
  Object.keys(cur.caps).forEach(k=>{ if(k!=='big' && order.indexOf(k)<0) order.push(k); });
  // 把 target 放最后
  if(cur.hasTarget){ order.splice(order.indexOf('target'),1); order.push('target'); }

  const nameMap = { big:'大桶', a: G.diff==='medium'?'中桶':'大勺', b: G.diff==='medium'?'小桶':'小勺', target:'收集杯' };
  if(cur.id==='m2'){ nameMap.a='5升瓶'; nameMap.b='3升瓶'; nameMap.big='8升瓶'; }
  if(cur.id==='m3'){ nameMap.a='5千克桶'; nameMap.b='7千克桶'; }

  let html = '<div class="tapArea">';
  order.forEach(k=>{
    const cap = cur.caps[k];
    const isBig = (k==='big');
    const isTarget = (k==='target');
    const capLabel = cap>=9999 ? '' : ('容量 '+cap);
    html += `
      <div class="containerBox">
        <div class="vname">${nameMap[k]||k}</div>
        <div class="bottle ${isBig?'bigSrc':''} ${isTarget?'targetCup':''}" data-c="${k}" onclick="selectContainer('${k}')">
          ${capLabel?`<div class="scaleLabel">${capLabel}</div>`:''}
          <div class="water" id="water-${k}" style="height:0%"></div>
          <div class="amount" id="amt-${k}">0</div>
        </div>
      </div>`;
  });
  html += '</div>';

  // 操作按钮
  html += `
    <div class="opPanel">
      <button class="opBtn tip" onclick="opFill()">🚰 装满选中</button>
      <button class="opBtn warn" onclick="opEmpty()">🗑 倒空选中</button>
      <button class="opBtn danger" onclick="clearSelect()">✖ 取消选择</button>
    </div>
    <div class="pourHint" id="pourHint">先点一个容器选中，再点另一个容器倒水过去～</div>`;
  stage.innerHTML = html;
  refreshPour();
}

function selectContainer(k){
  const p = G.pour;
  if(p.selected===null){
    p.selected = k;
    refreshPour();
    setPourHint('已选中「'+containerName(k)+'」，再点一个容器把水倒过去。');
  } else if(p.selected===k){
    // 再次点同一个=取消
    p.selected=null;
    refreshPour();
    setPourHint('先点一个容器选中，再点另一个容器倒水过去～');
  } else {
    // 执行倒水：从 selected 倒入 k
    pourFromTo(p.selected, k);
    p.selected=null;
  }
}
function clearSelect(){ if(G.pour){ G.pour.selected=null; refreshPour(); setPourHint('先点一个容器选中，再点另一个容器倒水过去～'); } }
function containerName(k){
  const cur=G.cur;
  const nameMap = { big:'大桶', a:'容器甲', b:'容器乙', target:'收集杯' };
  if(cur.id==='e1'){ nameMap.a='大勺'; nameMap.b='小勺'; }
  if(cur.id==='e2'){ nameMap.a='10毫升杯'; nameMap.b='7毫升杯'; }
  if(cur.id==='e3'){ nameMap.a='5毫升杯'; nameMap.b='3毫升杯'; }
  if(cur.id==='m1'){ nameMap.a='9千克桶'; nameMap.b='5千克桶'; }
  if(cur.id==='m2'){ nameMap.big='8升瓶'; nameMap.a='5升瓶'; nameMap.b='3升瓶'; }
  if(cur.id==='m3'){ nameMap.a='5千克桶'; nameMap.b='7千克桶'; }
  return nameMap[k]||k;
}
function setPourHint(t){ const el=document.getElementById('pourHint'); if(el) el.textContent=t; }

function pourFromTo(from, to){
  const p=G.pour, cur=G.cur;
  if(from===to) return;
  if((cur.caps[to]||0)>=9999){
    // 目标是收集杯（无限容量）
    if(p.state[from]<=0){ toast('源容器是空的哦','bad'); return; }
  }
  const space = (cur.caps[to]>=9999? 99999 : (cur.caps[to]-p.state[to]));
  if(space<=0){ toast('目标容器已经满啦','bad'); return; }
  if(p.state[from]<=0){ toast('「'+containerName(from)+'」是空的，没法倒','bad'); return; }
  const amount = Math.min(p.state[from], space);
  p.state[from]-=amount;
  p.state[to]+=amount;
  addStep(1);
  refreshPour();
  setPourHint('从「'+containerName(from)+'」倒入「'+containerName(to)+'」'+amount+'，继续～');
  checkPourGoal();
}

function opFill(){
  const p=G.pour, cur=G.cur;
  if(!p.selected){ toast('先点一个容器选中','bad'); return; }
  const k=p.selected;
  if(k==='target'){ toast('收集杯不能直接装水哦','bad'); return; }
  if(cur.source==='infinite'){
    // 无限水源：直接装满（不计入大桶）
    if(p.state[k]>=cur.caps[k]){ toast('已经满啦','bad'); return; }
    p.state[k]=cur.caps[k];
  } else {
    // 有限大桶：从大桶取
    if(k==='big'){ toast('大桶就是水源，不能再装','bad'); return; }
    if(p.state['big']<=0){ toast('大桶里没有油了','bad'); return; }
    if(p.state[k]>=cur.caps[k]){ toast('已经满啦','bad'); return; }
    const need=cur.caps[k]-p.state[k];
    const got=Math.min(need, p.state['big']);
    p.state['big']-=got; p.state[k]+=got;
  }
  addStep(1);
  refreshPour();
  checkPourGoal();
}
function opEmpty(){
  const p=G.pour, cur=G.cur;
  if(!p.selected){ toast('先点一个容器选中','bad'); return; }
  const k=p.selected;
  if(p.state[k]<=0){ toast('本来就是空的','bad'); return; }
  if(cur.source==='limited' && k!=='big'){
    // 倒回大桶
    const space=cur.caps['big']-p.state['big'];
    const back=Math.min(p.state[k], space);
    p.state['big']+=back;
    p.state[k]-=back;
    if(p.state[k]>0){
      // 大桶装不下剩下的，直接丢弃（视为排走）
      p.state[k]=0;
    }
  } else if(k==='big'){
    toast('大桶不能倒空','bad'); return;
  } else {
    p.state[k]=0;
  }
  addStep(1);
  refreshPour();
  checkPourGoal();
}

function refreshPour(){
  const p=G.pour, cur=G.cur;
  // 更新水位与数字
  Object.keys(cur.caps).forEach(k=>{
    const amt=p.state[k]||0;
    const cap=cur.caps[k];
    const w=document.getElementById('water-'+k);
    const a=document.getElementById('amt-'+k);
    if(w){ const pct = cap>=9999? Math.min(100, amt/4) : Math.min(100, amt/cap*100); w.style.height=pct+'%'; }
    if(a){ a.textContent = (cap>=9999? amt : (amt+'/'+cap)); }
    const bottle = document.querySelector('.bottle[data-c="'+k+'"]');
    if(bottle){
      if(p.selected===k) bottle.classList.add('selected');
      else bottle.classList.remove('selected');
    }
  });
}

function checkPourGoal(){
  const cur=G.cur, st=G.pour.state;
  let ok=false;
  const g=cur.goal;
  if(g.kind==='cup'){ ok = (st['target']===g.val); }
  else if(g.kind==='anyHas'){
    ok = Object.keys(st).some(k=> (k!=='target') && st[k]===g.val );
  } else if(g.kind==='allOf'){
    ok = g.list.every(it=> st[it.c]===it.val);
  } else if(g.kind==='sum'){
    ok = (g.list.reduce((s,k)=>s+(st[k]||0),0)===g.val);
  }
  if(ok) winLevel();
}

/* —— 珍珠拖拽：pointer 事件统一处理鼠标 + 触摸 —— */
function attachPearlDrag(el){
  el.addEventListener('pointerdown', onPearlDown);
}
function onPearlDown(e){
  const el = e.currentTarget;
  if(G.bal && G.bal.done) return;
  e.preventDefault();
  const rect = el.getBoundingClientRect();
  dragPearl = {
    id: parseInt(el.dataset.pid,10),
    el: el,
    offX: e.clientX - rect.left,
    offY: e.clientY - rect.top,
    startParent: el.parentNode,
  };
  // 提升到 body 顶层做自由拖动
  el.setPointerCapture(e.pointerId);
  el.style.position='fixed';
  el.style.left = (e.clientX - dragPearl.offX)+'px';
  el.style.top = (e.clientY - dragPearl.offY)+'px';
  el.style.zIndex = 500;
  el.addEventListener('pointermove', onPearlMove);
  el.addEventListener('pointerup', onPearlUp);
  el.addEventListener('pointercancel', onPearlUp);
}
function onPearlMove(e){
  if(!dragPearl) return;
  const el = dragPearl.el;
  el.style.left = (e.clientX - dragPearl.offX)+'px';
  el.style.top = (e.clientY - dragPearl.offY)+'px';
  // 检测悬停托盘高亮
  const pan = findPanUnder(e.clientX, e.clientY);
  document.getElementById('panLeft').classList.toggle('hover', pan==='left');
  document.getElementById('panRight').classList.toggle('hover', pan==='right');
}
function findPanUnder(x,y){
  ['left','right'].forEach(p=>{
    const el=document.getElementById(p==='left'?'panLeft':'panRight');
    if(el) el.classList.remove('hover');
  });
  const L=document.getElementById('panLeft').getBoundingClientRect();
  const R=document.getElementById('panRight').getBoundingClientRect();
  if(x>=L.left&&x<=L.right&&y>=L.top&&y<=L.bottom) return 'left';
  if(x>=R.left&&x<=R.right&&y>=R.top&&y<=R.bottom) return 'right';
  return null;
}
function onPearlUp(e){
  if(!dragPearl) return;
  const el=dragPearl.el, id=dragPearl.id;
  const pan = findPanUnder(e.clientX, e.clientY);
  // 复位样式
  el.style.position='';
  el.style.left='';
  el.style.top='';
  el.style.zIndex='';
  el.removeEventListener('pointermove', onPearlMove);
  el.removeEventListener('pointerup', onPearlUp);
  el.removeEventListener('pointercancel', onPearlUp);
  document.getElementById('panLeft').classList.remove('hover');
  document.getElementById('panRight').classList.remove('hover');
  // 重新归位
  const pearl = G.bal.pearls.find(p=>p.id===id);
  // 从原位置移除计数
  removeFromPan(pearl);
  if(pan==='left'){ document.getElementById('panLeft').appendChild(el); pearl.loc='left'; G.bal.left.push(id); }
  else if(pan==='right'){ document.getElementById('panRight').appendChild(el); pearl.loc='right'; G.bal.right.push(id); }
  else { document.getElementById('pearlPool').appendChild(el); pearl.loc='pool'; }
  dragPearl=null;
  // 重置上一次称重结果（盘子变了，旧结果失效）
  G.bal.beamTilt=0; setBeamTilt(0);
  document.getElementById('weighResult').textContent='珍珠有变化，记得重新“称一称”哦。';
}
function removeFromPan(pearl){
  if(!pearl) return;
  G.bal.left = G.bal.left.filter(x=>x!==pearl.id);
  G.bal.right = G.bal.right.filter(x=>x!==pearl.id);
}
function resetBalancePans(){
  G.bal.pearls.forEach(p=>{
    document.getElementById('pearlPool').appendChild(p.el);
    p.loc='pool';
  });
  G.bal.left=[]; G.bal.right=[];
  G.bal.beamTilt=0; setBeamTilt(0);
  document.getElementById('weighResult').textContent='珍珠都收回堆啦，重新分一分吧。';
}

function doWeigh(){
  const b=G.bal;
  if(b.left.length===0 || b.right.length===0){
    toast('两边托盘都要放珍珠哦','bad'); return;
  }
  if(b.left.length!==b.right.length){
    toast('两边珍珠数量要一样多，天平才能比较！','bad'); return;
  }
  b.weighCnt++;
  addStep(1);
  // 判断假珍珠是否在左/右
  const fakeInLeft = b.left.indexOf(b.fake)>=0;
  const fakeInRight = b.right.indexOf(b.fake)>=0;
  let tilt=0, msg='';
  if(fakeInLeft && !fakeInRight){ tilt=-1; msg='左边翘起来了，左边更轻！较轻的在左盘里。'; }
  else if(fakeInRight && !fakeInLeft){ tilt=1; msg='右边翘起来了，右边更轻！较轻的在右盘里。'; }
  else { tilt=0; msg='天平平衡！较轻的不在托盘上，在旁边的珍珠堆里。'; }
  b.beamTilt=tilt;
  setBeamTilt(tilt);
  document.getElementById('weighResult').textContent = '第 '+b.weighCnt+' 次称重：'+msg;
}

function setBeamTilt(tilt){
  const beam=document.getElementById('beam');
  if(!beam) return;
  // tilt=-1 左轻（左翘高 → 左端向上 → 负角度）；1 右轻
  const deg = (tilt<0? -14 : (tilt>0? 14 : 0));
  beam.style.transform='rotate('+deg+'deg)';
}

/* ========================================================
   十一、彩带庆祝动画（Canvas）
======================================================== */
const celebCanvas = document.getElementById('celebCanvas');
const cctx = celebCanvas.getContext('2d');
function resizeCeleb(){ celebCanvas.width=window.innerWidth; celebCanvas.height=window.innerHeight; }
window.addEventListener('resize', resizeCeleb);
resizeCeleb();

let celebParticles = [];
let celebRAF = null;
function launchCeleb(){
  // 读取当前主题色作为彩带色之一
  const cs = getComputedStyle(document.documentElement);
  const colors = ['#F5A623','#4A90E9','#2ECC71','#FF6B9D','#9B59B6','#F1C40F', cs.getPropertyValue('--main').trim()||'#4A90E9'];
  celebParticles = [];
  for(let i=0;i<140;i++){
    celebParticles.push({
      x: Math.random()*celebCanvas.width,
      y: -20 - Math.random()*celebCanvas.height*0.5,
      vx: (Math.random()-0.5)*3,
      vy: 2+Math.random()*4,
      size: 6+Math.random()*8,
      rot: Math.random()*Math.PI,
      vr: (Math.random()-0.5)*0.2,
      color: colors[Math.floor(Math.random()*colors.length)],
      shape: Math.random()<0.5?'rect':'circle',
    });
  }
  if(celebRAF) cancelAnimationFrame(celebRAF);
  animateCeleb();
  // 4 秒后自动停止
  setTimeout(()=>{ if(celebRAF){ cancelAnimationFrame(celebRAF); celebRAF=null; cctx.clearRect(0,0,celebCanvas.width,celebCanvas.height); } }, 4000);
}
function animateCeleb(){
  cctx.clearRect(0,0,celebCanvas.width,celebCanvas.height);
  celebParticles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.rot+=p.vr;
    if(p.y>celebCanvas.height+20){ p.y=-20; p.x=Math.random()*celebCanvas.width; }
    cctx.save();
    cctx.translate(p.x,p.y);
    cctx.rotate(p.rot);
    cctx.fillStyle=p.color;
    if(p.shape==='rect'){ cctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6); }
    else { cctx.beginPath(); cctx.arc(0,0,p.size/2,0,Math.PI*2); cctx.fill(); }
    cctx.restore();
  });
  celebRAF = requestAnimationFrame(animateCeleb);
}

/* ========================================================
   十二、工具：洗牌（反重复，每局关卡顺序随机）
======================================================== */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
