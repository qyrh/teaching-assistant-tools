<style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}:root{--main:#4A90E9;--main-dark:#2E6BB0;--accent:#F5A623;--accent-dark:#C8830E;--ink:#22303C;--paper:#FFFDF7;--good:#2ECC71;--bad:#E74C3C;--soft:#EAF2FB}html,body{height:100%}body{font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;background:linear-gradient(160deg,var(--soft) 0%,#F7F1E3 100%);color:var(--ink);min-height:100%;overflow-x:hidden;user-select:none}button{font-family:inherit;cursor:pointer;border:none;outline:none}.hidden{display:none!important}#topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:linear-gradient(90deg,var(--main),var(--main-dark));color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.15)}#topbar .title{font-size:20px;font-weight:bold;letter-spacing:1px}#topbar .stats{display:flex;gap:14px;font-size:16px;font-weight:bold}#topbar .stats span{background:rgba(255,255,255,.22);padding:6px 12px;border-radius:20px}#btnHelpTop{background:rgba(255,255,255,.25);color:#fff;padding:8px 14px;border-radius:20px;font-weight:bold;font-size:15px}.screen{padding:18px 16px 90px;max-width:980px;margin:0 auto}.bigTitle{text-align:center;font-size:30px;font-weight:bold;color:var(--main-dark);margin:10px 0 6px;text-shadow:2px 2px 0 #fff}.subTitle{text-align:center;font-size:16px;color:var(--ink);opacity:.8;margin-bottom:18px}.diffGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:10px}.diffCard{background:var(--paper);border-radius:22px;padding:26px 20px;text-align:center;box-shadow:0 8px 22px rgba(0,0,0,.10);border:4px solid var(--main);transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}.diffCard:hover{transform:translateY(-6px);box-shadow:0 14px 30px rgba(0,0,0,.18)}.diffCard .badge{font-size:42px;line-height:1;margin-bottom:8px}.diffCard h3{font-size:24px;color:var(--main-dark);margin-bottom:6px}.diffCard .tag{display:inline-block;background:var(--accent);color:#fff;padding:4px 14px;border-radius:14px;font-size:14px;font-weight:bold;margin-bottom:10px}.diffCard p{font-size:15px;line-height:1.6;color:var(--ink);opacity:.85}.diffCard .goBtn{margin-top:14px;background:var(--main);color:#fff;font-size:18px;font-weight:bold;padding:12px 26px;border-radius:30px;width:100%}.diffCard .goBtn:active{transform:scale(.97)}.diffCard.c2{border-color:var(--accent)}.diffCard.c2 h3{color:var(--accent-dark)}.diffCard.c2 .goBtn{background:var(--accent)}.diffCard.c3{border-color:#9B59B6}.diffCard.c3 h3{color:#7D3C98}.diffCard.c3 .goBtn{background:#9B59B6}.levelBar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}.levelBar .lvChip{background:var(--paper);border:3px solid var(--main);color:var(--main-dark);font-weight:bold;font-size:16px;padding:10px 20px;border-radius:30px}.levelBar .lvChip.active{background:var(--main);color:#fff}.levelBar .lvChip.done{background:var(--good);border-color:var(--good);color:#fff}.levelBar .lvChip.done::after{content:" ✓"}.storyCard{background:var(--paper);border-radius:18px;padding:16px 18px;margin-bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,.08);border-left:8px solid var(--accent)}.storyCard .storyTag{display:inline-block;background:var(--accent);color:#fff;font-size:13px;font-weight:bold;padding:3px 12px;border-radius:12px;margin-bottom:8px}.storyCard h4{font-size:19px;color:var(--main-dark);margin-bottom:6px}.storyCard p{font-size:16px;line-height:1.7}.storyCard .goal{margin-top:10px;background:var(--soft);border-radius:12px;padding:10px 14px;font-size:16px;font-weight:bold;color:var(--main-dark)}#pourStage{position:relative}.tapArea{display:flex;justify-content:center;align-items:flex-end;gap:18px;flex-wrap:wrap;min-height:300px;padding:14px;background:linear-gradient(180deg,#E8F4FF 0%,#CFE8FB 100%);border-radius:20px;box-shadow:inset 0 2px 8px rgba(0,0,0,.06)}.containerBox{position:relative;width:120px;display:flex;flex-direction:column;align-items:center}.containerBox .vname{font-size:15px;font-weight:bold;color:var(--ink);margin-bottom:4px}.bottle{position:relative;width:96px;height:180px;border:5px solid var(--main-dark);border-top:none;border-radius:0 0 26px 26px;background:rgba(255,255,255,.5);overflow:hidden;cursor:pointer;transition:transform .12s,box-shadow .12s}.bottle::before{content:"";position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:44px;height:18px;background:var(--main-dark);border-radius:6px 6px 0 0}.bottle:hover{transform:translateY(-3px)}.bottle.selected{box-shadow:0 0 0 5px var(--accent),0 8px 18px rgba(0,0,0,.18);transform:translateY(-3px)}.water{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,var(--main) 0%,var(--main-dark) 100%);transition:height .45s cubic-bezier(.3,.7,.4,1)}.water::before{content:"";position:absolute;top:-6px;left:0;right:0;height:12px;background:radial-gradient(ellipse at center,rgba(255,255,255,.5) 0%,transparent 70%)}.bottle .scaleLabel{position:absolute;right:6px;top:6px;font-size:12px;color:var(--main-dark);font-weight:bold;background:rgba(255,255,255,.7);padding:1px 5px;border-radius:6px}.bottle .amount{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#fff;font-size:18px;font-weight:bold;text-shadow:0 1px 3px rgba(0,0,0,.5);z-index:2}.bottle.targetCup{border-color:var(--accent)}.bottle.targetCup .water{background:linear-gradient(180deg,var(--accent) 0%,var(--accent-dark) 100%)}.bottle.targetCup .amount{color:#fff}.bottle.bigSrc{width:130px;height:200px;border-color:#5D6D7E}.bottle.bigSrc::before{background:#5D6D7E}.bottle.bigSrc .water{background:linear-gradient(180deg,#7FB3D5 0%,#5D6D7E 100%)}.opPanel{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}.opBtn{background:var(--paper);border:3px solid var(--main);color:var(--main-dark);font-weight:bold;font-size:15px;padding:11px 18px;border-radius:26px;box-shadow:0 3px 8px rgba(0,0,0,.08)}.opBtn:active{transform:scale(.95)}.opBtn.danger{border-color:var(--bad);color:var(--bad)}.opBtn.warn{border-color:var(--accent);color:var(--accent-dark)}.opBtn.tip{background:var(--main);color:#fff}.pourHint{text-align:center;margin-top:10px;font-size:15px;color:var(--main-dark);font-weight:bold;min-height:22px}#balanceStage{position:relative}.pearlPool{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding:16px;background:var(--soft);border-radius:18px;min-height:80px;margin-bottom:14px}.pearlPool .poolTitle{width:100%;text-align:center;font-weight:bold;color:var(--main-dark);font-size:15px;margin-bottom:4px}.pearl{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff 0%,var(--accent) 45%,var(--accent-dark) 100%);box-shadow:0 4px 8px rgba(0,0,0,.25),inset -4px -6px 10px rgba(0,0,0,.2);cursor:grab;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:18px;text-shadow:0 1px 2px rgba(0,0,0,.5);touch-action:none;transition:transform .1s}.pearl:active{cursor:grabbing;transform:scale(1.08)}.pearl.guess{animation:wiggle .4s}@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}.balanceWrap{display:flex;justify-content:center;align-items:flex-end;gap:0;margin:10px auto;max-width:560px;position:relative}.panCol{display:flex;flex-direction:column;align-items:center;width:42%}.panDrop{width:90%;min-height:120px;border:3px dashed var(--main);border-radius:16px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:10px;background:rgba(255,255,255,.55);transition:background .15s,border-color .15s}.panDrop.hover{background:var(--soft);border-color:var(--accent);border-style:solid}.panDrop .panLabel{font-size:14px;color:var(--main-dark);font-weight:bold;opacity:.6}.beamCol{width:16%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:140px}#beam{transition:transform .6s cubic-bezier(.3,.7,.4,1);transform-origin:50% 100%}.pillar{width:18px;height:60px;background:linear-gradient(180deg,#B07C4A,#8B5A2B);border-radius:4px;margin-top:-6px}.baseTri{width:0;height:0;border-left:40px solid transparent;border-right:40px solid transparent;border-bottom:0;border-top:34px solid #8B5A2B}#weighResult{text-align:center;font-size:18px;font-weight:bold;margin:8px 0;min-height:26px;color:var(--main-dark)}.balanceOps{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.bottomBar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:8px;justify-content:center;padding:10px 12px;background:linear-gradient(0deg,rgba(255,253,247,.96),rgba(255,253,247,.7));box-shadow:0 -3px 10px rgba(0,0,0,.08);flex-wrap:wrap}.bottomBar button{background:var(--paper);border:3px solid var(--main);color:var(--main-dark);font-weight:bold;font-size:15px;padding:11px 16px;border-radius:24px}.bottomBar button:active{transform:scale(.95)}.bottomBar button.acc{background:var(--accent);color:#fff;border-color:var(--accent)}.bottomBar button.gh{background:var(--good);color:#fff;border-color:var(--good)}.mask{position:fixed;inset:0;background:rgba(20,30,40,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}.modal{background:var(--paper);border-radius:20px;max-width:560px;width:100%;max-height:86vh;overflow-y:auto;padding:22px 20px;box-shadow:0 16px 40px rgba(0,0,0,.3)}.modal h3{font-size:23px;color:var(--main-dark);margin-bottom:12px;text-align:center}.modal .closeBtn{display:block;margin:18px auto 0;background:var(--main);color:#fff;font-size:17px;font-weight:bold;padding:12px 30px;border-radius:30px}.modal .ruleSec{margin-bottom:14px}.modal .ruleSec h4{color:var(--accent-dark);font-size:17px;margin-bottom:4px}.modal .ruleSec p,.modal .ruleSec li{font-size:15px;line-height:1.7;color:var(--ink)}.modal .ruleSec ul{padding-left:22px}.answerStep{background:var(--soft);border-radius:12px;padding:10px 14px;margin:6px 0;font-size:15px;line-height:1.6}.answerStep b{color:var(--main-dark)}#celebCanvas{position:fixed;inset:0;z-index:200;pointer-events:none}.winBox{text-align:center}.winBox .crown{font-size:64px}.winBox h3{font-size:26px;color:var(--good)}.winBox p{font-size:16px;margin:8px 0 4px;line-height:1.7}.winBox .nextBtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}.winBox .nextBtns button{font-size:16px;font-weight:bold;padding:12px 22px;border-radius:28px;border:none;color:#fff}.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:26px;font-size:16px;font-weight:bold;z-index:300;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.3)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.good{background:var(--good)}.toast.bad{background:var(--bad)}@media(max-width:560px){#topbar .title{font-size:16px}#topbar .stats{gap:8px;font-size:13px}#topbar .stats span{padding:5px 9px}.bigTitle{font-size:24px}.bottle{width:80px;height:150px}.bottle.bigSrc{width:100px;height:170px}.containerBox{width:100px}.pearl{width:46px;height:46px;font-size:16px}.diffCard{padding:20px 14px}.bottomBar button{font-size:13px;padding:10px 12px}}
</style>
</head>
<body>

<!-- ====== 顶部状态栏：标题 + 计时 + 步数 + 规则 ====== -->
<div id="topbar">
  <div class="title">🌈 彩虹水坊奇妙之旅</div>
  <div class="stats">
    <span id="timer">⏱ 00:00</span>
    <span id="stepCnt">👣 0 步</span>
  </div>
  <button id="btnHelpTop" onclick="showRules()">📖 规则</button>
</div>

<!-- ====== 难度选择屏 ====== -->
<div id="screenHome" class="screen">
  <div class="bigTitle">动手操作大冒险</div>
  <div class="subTitle">本讲核心：用“凑数法”量出想要的水、用“三分法”找出较轻的珍珠。选一个难度开始吧！</div>
  <div class="diffGrid">
    <div class="diffCard c1">
      <div class="badge">💧</div>
      <h3>初级 · 小试身手</h3>
      <div class="tag">倒水凑数</div>
      <p>有两个量杯和一个收集杯。装满、倒来倒去，凑出指定水量。练的是“加减凑数”的本领。</p>
      <button class="goBtn" onclick="enterDiff('easy')">开始挑战</button>
    </div>
    <div class="diffCard c2">
      <div class="badge">🛢️</div>
      <h3>中级 · 勇者试炼</h3>
      <div class="tag">分油巧匠</div>
      <p>大桶里的油总量有限，要在几个桶之间来回倒，分出指定的份数。考的是“列表凑数”的巧思。</p>
      <button class="goBtn" onclick="enterDiff('medium')">开始挑战</button>
    </div>
    <div class="diffCard c3">
      <div class="badge">⚖️</div>
      <h3>高级 · 大师之路</h3>
      <div class="tag">天平寻真</div>
      <p>把珍珠拖上托盘称一称，用“三分法”找出较轻的那一颗。每次称重都要动脑筋缩小范围！</p>
      <button class="goBtn" onclick="enterDiff('hard')">开始挑战</button>
    </div>
  </div>
</div>

<!-- ====== 关卡游玩屏 ====== -->
<div id="screenPlay" class="screen hidden">
  <div id="levelBar" class="levelBar"></div>
  <div id="storyArea"></div>
  <div id="pourStage" class="hidden"></div>
  <div id="balanceStage" class="hidden"></div>
</div>

<!-- ====== 底部固定按钮栏 ====== -->
<div id="bottomBar" class="bottomBar hidden">
  <button onclick="revealAnswer()">💡 揭示答案</button>
  <button onclick="restartLevel()">🔄 重新开始</button>
  <button onclick="backToDiff()">🏠 返回难度</button>
  <button onclick="showRules()">📖 规则说明</button>
</div>

<!-- ====== 模态层容器 ====== -->
<div id="modalRoot"></div>

<!-- ====== 庆祝彩带画布 ====== -->
<canvas id="celebCanvas"></canvas>

<!-- ====== 提示气泡 ====== -->
<div id="toast" class="toast"></div>

<script>"use strict";const THEMES=[{main:"#4A90E9",mainDark:"#2E6BB0",accent:"#F5A623",accentDark:"#C8830E",soft:"#EAF2FB"},{main:"#2ECC71",mainDark:"#1E8C4C",accent:"#FF6B9D",accentDark:"#C03E6F",soft:"#E7F8EE"},{main:"#9B59B6",mainDark:"#6C3483",accent:"#F1C40F",accentDark:"#B7950B",soft:"#F4ECF7"},{main:"#FF6B6B",mainDark:"#C0392B",accent:"#4ECDC4",accentDark:"#239B92",soft:"#FDECEC"},{main:"#5C6BC0",mainDark:"#3949AB",accent:"#66BB6A",accentDark:"#388E3C",soft:"#EAEEFB"},{main:"#16A085",mainDark:"#0E6655",accent:"#E67E22",accentDark:"#AF640C",soft:"#E6F5F1"}];function applyRandomTheme(){const t=THEMES[Math.floor(Math.random()*THEMES.length)];const r=document.documentElement.style;r.setProperty("--main",t.main);r.setProperty("--main-dark",t.mainDark);r.setProperty("--accent",t.accent);r.setProperty("--accent-dark",t.accentDark);r.setProperty("--soft",t.soft)}const G={diff:null,levelIdx:0,levels:[],cur:null,steps:0,startTs:0,timerId:null,done:new Set,pour:null,bal:null};const POUR_BANK={easy:[{id:"e1",title:"彩虹小溪 · 第一关",story:"大勺子一次能装 250 克彩虹水，小勺子一次能装 150 克。收集杯是空的，你能用这两把勺子，量出 350 克彩虹水吗？",goalDesc:"让收集杯里正好有 350 克彩虹水。",source:"infinite",hasTarget:true,caps:{a:250,b:150,target:9999},init:{a:0,b:0,target:0},goal:{kind:"cup",val:350},solution:["把大勺装满（大勺=250）。","大勺倒入小勺：小勺装满 150，大勺剩下 250−150=100。","把小勺倒空。","把大勺里的 100 克倒入收集杯（收集杯=100）。","再次把大勺装满（大勺=250）。","把大勺里的 250 克倒入收集杯（100+250=350）。"]},{id:"e2",title:"彩虹小溪 · 第二关",story:"有两个量杯，分别能装 10 毫升和 7 毫升。收集杯是空的，请量出 13 毫升的水。",goalDesc:"让收集杯里正好有 13 毫升水。",source:"infinite",hasTarget:true,caps:{a:10,b:7,target:9999},init:{a:0,b:0,target:0},goal:{kind:"cup",val:13},solution:["把 10 毫升量杯装满，倒入收集杯（收集杯=10）。","再次把 10 毫升量杯装满。","把 10 毫升量杯倒入 7 毫升量杯：7 毫升杯装满，10 毫升杯剩 10−7=3。","把 10 毫升量杯里剩下的 3 毫升倒入收集杯（10+3=13）。"]},{id:"e3",title:"彩虹小溪 · 第三关（变式）",story:"有两个量杯，分别能装 5 毫升和 3 毫升。收集杯是空的，请量出 4 毫升水。",goalDesc:"让收集杯里正好有 4 毫升水。",source:"infinite",hasTarget:true,caps:{a:5,b:3,target:9999},init:{a:0,b:0,target:0},goal:{kind:"cup",val:4},solution:["把 5 毫升量杯装满。","5 毫升杯倒入 3 毫升杯：3 毫升杯满，5 毫升杯剩 2。","把 3 毫升杯倒空。","把 5 毫升杯里的 2 毫升倒入 3 毫升杯。","再次把 5 毫升杯装满。","把 5 毫升杯倒入 3 毫升杯（3 毫升杯已有 2，只能再装 1），5 毫升杯剩 4。","把 5 毫升杯里的 4 毫升倒入收集杯。"]}],medium:[{id:"m1",title:"分油巧匠 · 第一关",story:"12 千克的一大桶油，要平均分给两个人，也就是每人 6 千克。身边只有能装 9 千克和 5 千克的两只空桶，怎样倒才能分出 6 千克？",goalDesc:"让 9 千克桶或 5 千克桶里出现 6 千克油。",source:"limited",hasTarget:false,caps:{big:12,a:9,b:5},init:{big:12,a:0,b:0},goal:{kind:"anyHas",val:6},solution:["关键：5+1=6，先想办法倒出 1 千克。","5 千克桶装满（来自大桶）：大桶=7，9桶=0，5桶=5。","5 千克桶倒入 9 千克桶：大桶=7，9桶=5，5桶=0。","5 千克桶再次装满：大桶=2，9桶=5，5桶=5。","5 千克桶倒入 9 千克桶至满（9桶已有5，再装4满），5桶剩1：大桶=2，9桶=9，5桶=1。","把 9 千克桶全部倒回大桶：大桶=11，9桶=0，5桶=1。","把 5 千克桶里的 1 千克倒入 9 千克桶：大桶=11，9桶=1，5桶=0。","5 千克桶装满（来自大桶）：大桶=6，9桶=1，5桶=5。","5 千克桶倒入 9 千克桶（9桶已有1，再装5到6）：大桶=6，9桶=6，5桶=0。分成功！"]},{id:"m2",title:"分油巧匠 · 第二关",story:"有一瓶 8 升的果汁，要用 5 升和 3 升的瓶子，把它分成两份 4 升的果汁，该怎样分？",goalDesc:"让 8 升瓶和 5 升瓶里都各有 4 升（得到两份 4 升）。",source:"limited",hasTarget:false,caps:{big:8,a:5,b:3},init:{big:8,a:0,b:0},goal:{kind:"allOf",list:[{c:"big",val:4},{c:"a",val:4}]},solution:["8 升瓶倒入 5 升瓶至满：8瓶=3，5瓶=5，3瓶=0。","5 升瓶倒入 3 升瓶至满：8瓶=3，5瓶=2，3瓶=3。","3 升瓶倒回 8 升瓶：8瓶=6，5瓶=2，3瓶=0。","5 升瓶里的 2 升倒入 3 升瓶：8瓶=6，5瓶=0，3瓶=2。","8 升瓶倒入 5 升瓶至满：8瓶=1，5瓶=5，3瓶=2。","5 升瓶倒入 3 升瓶至满（3瓶已有2，再装1），5瓶剩4：8瓶=1，5瓶=4，3瓶=3。","3 升瓶倒回 8 升瓶：8瓶=4，5瓶=4。两份 4 升分好了！"]},{id:"m3",title:"分油巧匠 · 第三关（变式）",story:"小溪边有两只空桶，一只能盛 5 千克水，另一只能盛 7 千克水。水是无限的，现在要一共取回 8 千克水，应该怎样取？",goalDesc:"让两只桶里的水加起来正好是 8 千克。",source:"infinite",hasTarget:false,caps:{a:5,b:7},init:{a:0,b:0},goal:{kind:"sum",list:["a","b"],val:8},solution:["5 千克桶装满，倒入 7 千克桶：5桶=0，7桶=5。","5 千克桶再次装满，倒入 7 千克桶（7桶已有5，再装2满），5桶剩3：5桶=3，7桶=7。","把 7 千克桶倒空。","把 5 千克桶里的 3 千克倒入 7 千克桶：5桶=0，7桶=3。","5 千克桶装满：5桶=5，7桶=3，合计 3+5=8 千克！"]}]};const BAL_BANK=[{id:"h1",title:"天平寻真 · 第一关",story:"有 3 颗亮晶晶的珍珠，其中有一颗比较轻。它们看上去一模一样。你能用天平找出较轻的那颗吗？",goalDesc:"称一称，再点出较轻的那颗珍珠。",total:3,minWeigh:1,solution:["把 3 颗珍珠尽量平均分。天平左右各放 1 颗，剩 1 颗在旁边。","如果天平平衡：旁边没称的那颗就是较轻的。","如果天平不平衡：翘高（较轻）的那一边托盘里的珍珠就是较轻的。","所以只需称 1 次就能找出。"]},{id:"h2",title:"天平寻真 · 第二关",story:"有 6 颗亮晶晶的珍珠，其中有一颗比较轻。请用“三分法”，用尽量少的次数找出它。",goalDesc:"分一分、称一称，再点出较轻的那颗珍珠。",total:6,minWeigh:2,solution:["把 6 颗珍珠三等分：每份 2 颗（2、2、2）。","第一次：天平左右各放 2 颗。平衡则较轻的在剩下的 2 颗里；不平衡则在较轻的那 2 颗里。","第二次：把含较轻的 2 颗分放天平两边，翘高的一边就是较轻的。","所以最少称 2 次就能找出。"]},{id:"h3",title:"天平寻真 · 第三关",story:"有 9 颗亮晶晶的珍珠，其中有一颗比较轻。你能只用 2 次天平，就找出较轻的那颗吗？",goalDesc:"用三分法分一分、称一称，再点出较轻的那颗珍珠。",total:9,minWeigh:2,solution:["把 9 颗珍珠三等分：每份 3 颗（3、3、3）。","第一次：天平左右各放 3 颗。平衡则较轻的在剩下的 3 颗里；不平衡则在较轻的那 3 颗里。","第二次：从含较轻的 3 颗中任取 2 颗分放天平两边。平衡则剩下那颗较轻；不平衡则翘高的那颗较轻。","所以最少称 2 次就能找出。"]}];function fmtTime(s){const m=String(Math.floor(s/60)).padStart(2,"0");const ss=String(s%60).padStart(2,"0");return m+":"+ss}function startTimer(){G.startTs=Date.now();if(G.timerId)clearInterval(G.timerId);G.timerId=setInterval(()=>{const s=Math.floor((Date.now()-G.startTs)/1e3);document.getElementById("timer").textContent="⏱ "+fmtTime(s)},1e3)}function stopTimer(){if(G.timerId){clearInterval(G.timerId);G.timerId=null}}function addStep(n){G.steps+=n||1;document.getElementById("stepCnt").textContent="👣 "+G.steps+" 步"}function resetStep(){G.steps=0;document.getElementById("stepCnt").textContent="👣 0 步"}let toastTimer=null;function toast(msg,kind){const el=document.getElementById("toast");el.textContent=msg;el.className="toast show"+(kind?" "+kind:"");if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.className="toast"},1500)}function showRules(){const html=`
    <div class="mask" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h3>📖 游戏规则</h3>
        <div class="ruleSec">

            <li><b>选源 → 选目标</b>：先点一个容器（高亮选中），再点另一个容器，水就会从源倒进目标，直到目标装满或源倒空。</li>
            <li><b>装满</b>：点下方“装满”按钮，可把选中的容器从水源装满。</li>
            <li><b>倒空</b>：点“倒空”按钮，可把选中容器的水倒回水源（或排走）。</li>
            <li>达成题目要求的水量，就点亮这一关！</li>
          </ul>
        </div>
        <div class="ruleSec">

          <ul>
            <li>把珍珠<b>拖到</b>左边或右边的托盘里。</li>
            <li>点“称一称”，天平会显示哪边轻、还是平衡。</li>
            <li>根据结果缩小范围，最后<b>点击</b>你认为较轻的那颗珍珠。</li>
            <li>小提示：尽量把珍珠<b>三等分</b>，称的次数最少！</li>
          </ul>
        </div>
        <div class="ruleSec">
          <h4>🎯 通用</h4>
          <ul>
            <li>右上角显示用时和步数，越少越棒。</li>
            <li>卡住了可以点“💡 揭示答案”看思路。</li>
            <li>“🔄 重新开始”重置当前关，“🏠 返回难度”回到选择。</li>
          </ul>
        </div>
        <button class="closeBtn" onclick="closeModal()">明白啦，去玩！</button>
      </div>
    </div>`;document.getElementById("modalRoot").innerHTML=html}function closeModal(){document.getElementById("modalRoot").innerHTML=""}function revealAnswer(){const cur=G.cur;if(!cur){return}let steps;if(G.diff==="hard"){steps=cur.solution}else{steps=cur.solution}const html=`
    <div class="mask" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h3>💡 思路揭晓</h3>
        <p style="text-align:center;color:var(--ink);opacity:.8;margin-bottom:10px;">这只是一种参考方法，也许你找到了更巧妙的办法呢！</p>
        ${steps.map((s,i)=>`<div class="answerStep"><b>第 ${i+1} 步：</b>${s}</div>`).join("")}
        <button class="closeBtn" onclick="closeModal()">继续挑战</button>
      </div>
    </div>`;document.getElementById("modalRoot").innerHTML=html}function enterDiff(d){G.diff=d;G.levelIdx=0;if(d==="hard"){G.levels=shuffle(BAL_BANK.slice())}else{G.levels=POUR_BANK[d].slice();G.levels=shuffle(G.levels)}document.getElementById("screenHome").classList.add("hidden");document.getElementById("screenPlay").classList.remove("hidden");document.getElementById("bottomBar").classList.remove("hidden");applyRandomTheme();buildLevelBar();loadLevel(0);startTimer();resetStep()}function backToDiff(){stopTimer();G.diff=null;G.cur=null;document.getElementById("screenHome").classList.remove("hidden");document.getElementById("screenPlay").classList.add("hidden");document.getElementById("bottomBar").classList.add("hidden");document.getElementById("timer").textContent="⏱ 00:00";resetStep()}function buildLevelBar(){const bar=document.getElementById("levelBar");bar.innerHTML="";G.levels.forEach((lv,i)=>{const chip=document.createElement("button");chip.className="lvChip";chip.textContent="第 "+(i+1)+" 关";if(i===G.levelIdx)chip.classList.add("active");const key=G.diff+"."+lv.id;if(G.done.has(key))chip.classList.add("done");chip.onclick=()=>{loadLevel(i);resetStep();startTimer()};bar.appendChild(chip)})}function loadLevel(i){G.levelIdx=i;G.cur=G.levels[i];buildLevelBar();document.getElementById("pourStage").classList.add("hidden");document.getElementById("balanceStage").classList.add("hidden");const sa=document.getElementById("storyArea");const cur=G.cur;let tagText=G.diff==="easy"?"倒水凑数":G.diff==="medium"?"分油巧匠":"天平寻真";sa.innerHTML=`
    <div class="storyCard">
      <span class="storyTag">${tagText} · 第 ${i+1} 关</span>
      <h4>${cur.title}</h4>
      <p>${cur.story}</p>
      <div class="goal">🎯 目标：${cur.goalDesc}</div>
    </div>`;if(G.diff==="hard"){renderBalance()}else{renderPour()}resetStep()}function restartLevel(){if(!G.cur)return;loadLevel(G.levelIdx);startTimer();toast("已重置，再试一次！","good")}function renderPour(){const stage=document.getElementById("pourStage");stage.classList.remove("hidden");const cur=G.cur;G.pour={caps:Object.assign({},cur.caps),state:Object.assign({},cur.init),selected:null};const order=[];if(cur.source==="limited"){order.push("big")}Object.keys(cur.caps).forEach(k=>{if(k!=="big"&&order.indexOf(k)<0)order.push(k)});if(cur.hasTarget){order.splice(order.indexOf("target"),1);order.push("target")}const nameMap={big:"大桶",a:G.diff==="medium"?"中桶":"大勺",b:G.diff==="medium"?"小桶":"小勺",target:"收集杯"};if(cur.id==="m2"){nameMap.a="5升瓶";nameMap.b="3升瓶";nameMap.big="8升瓶"}if(cur.id==="m3"){nameMap.a="5千克桶";nameMap.b="7千克桶"}let html='<div class="tapArea">';order.forEach(k=>{const cap=cur.caps[k];const isBig=k==="big";const isTarget=k==="target";const capLabel=cap>=9999?"":"容量 "+cap;html+=`
      <div class="containerBox">
        <div class="vname">${nameMap[k]||k}</div>
        <div class="bottle ${isBig?"bigSrc":""} ${isTarget?"targetCup":""}" data-c="${k}" onclick="selectContainer('${k}')">
          ${capLabel?`<div class="scaleLabel">${capLabel}</div>`:""}
          <div class="water" id="water-${k}" style="height:0%"></div>
          <div class="amount" id="amt-${k}">0</div>
        </div>
      </div>`});html+="</div>";html+=`
    <div class="opPanel">
      <button class="opBtn tip" onclick="opFill()">🚰 装满选中</button>
      <button class="opBtn warn" onclick="opEmpty()">🗑 倒空选中</button>
      <button class="opBtn danger" onclick="clearSelect()">✖ 取消选择</button>
    </div>
    <div class="pourHint" id="pourHint">先点一个容器选中，再点另一个容器倒水过去～</div>`;stage.innerHTML=html;refreshPour()}function selectContainer(k){const p=G.pour;if(p.selected===null){p.selected=k;refreshPour();setPourHint("已选中「"+containerName(k)+"」，再点一个容器把水倒过去。")}else if(p.selected===k){p.selected=null;refreshPour();setPourHint("先点一个容器选中，再点另一个容器倒水过去～")}else{pourFromTo(p.selected,k);p.selected=null}}function clearSelect(){if(G.pour){G.pour.selected=null;refreshPour();setPourHint("先点一个容器选中，再点另一个容器倒水过去～")}}function containerName(k){const cur=G.cur;const nameMap={big:"大桶",a:"容器甲",b:"容器乙",target:"收集杯"};if(cur.id==="e1"){nameMap.a="大勺";nameMap.b="小勺"}if(cur.id==="e2"){nameMap.a="10毫升杯";nameMap.b="7毫升杯"}if(cur.id==="e3"){nameMap.a="5毫升杯";nameMap.b="3毫升杯"}if(cur.id==="m1"){nameMap.a="9千克桶";nameMap.b="5千克桶"}if(cur.id==="m2"){nameMap.big="8升瓶";nameMap.a="5升瓶";nameMap.b="3升瓶"}if(cur.id==="m3"){nameMap.a="5千克桶";nameMap.b="7千克桶"}return nameMap[k]||k}function setPourHint(t){const el=document.getElementById("pourHint");if(el)el.textContent=t}function pourFromTo(from,to){const p=G.pour,cur=G.cur;if(from===to)return;if((cur.caps[to]||0)>=9999){if(p.state[from]<=0){toast("源容器是空的哦","bad");return}}const space=cur.caps[to]>=9999?99999:cur.caps[to]-p.state[to];if(space<=0){toast("目标容器已经满啦","bad");return}if(p.state[from]<=0){toast("「"+containerName(from)+"」是空的，没法倒","bad");return}const amount=Math.min(p.state[from],space);p.state[from]-=amount;p.state[to]+=amount;addStep(1);refreshPour();setPourHint("从「"+containerName(from)+"」倒入「"+containerName(to)+"」"+amount+"，继续～");checkPourGoal()}function opFill(){const p=G.pour,cur=G.cur;if(!p.selected){toast("先点一个容器选中","bad");return}const k=p.selected;if(k==="target"){toast("收集杯不能直接装水哦","bad");return}if(cur.source==="infinite"){if(p.state[k]>=cur.caps[k]){toast("已经满啦","bad");return}p.state[k]=cur.caps[k]}else{if(k==="big"){toast("大桶就是水源，不能再装","bad");return}if(p.state["big"]<=0){toast("大桶里没有油了","bad");return}if(p.state[k]>=cur.caps[k]){toast("已经满啦","bad");return}const need=cur.caps[k]-p.state[k];const got=Math.min(need,p.state["big"]);p.state["big"]-=got;p.state[k]+=got}addStep(1);refreshPour();checkPourGoal()}function opEmpty(){const p=G.pour,cur=G.cur;if(!p.selected){toast("先点一个容器选中","bad");return}const k=p.selected;if(p.state[k]<=0){toast("本来就是空的","bad");return}if(cur.source==="limited"&&k!=="big"){const space=cur.caps["big"]-p.state["big"];const back=Math.min(p.state[k],space);p.state["big"]+=back;p.state[k]-=back;if(p.state[k]>0){p.state[k]=0}}else if(k==="big"){toast("大桶不能倒空","bad");return}else{p.state[k]=0}addStep(1);refreshPour();checkPourGoal()}function refreshPour(){const p=G.pour,cur=G.cur;Object.keys(cur.caps).forEach(k=>{const amt=p.state[k]||0;const cap=cur.caps[k];const w=document.getElementById("water-"+k);const a=document.getElementById("amt-"+k);if(w){const pct=cap>=9999?Math.min(100,amt/4):Math.min(100,amt/cap*100);w.style.height=pct+"%"}if(a){a.textContent=cap>=9999?amt:amt+"/"+cap}const bottle=document.querySelector('.bottle[data-c="'+k+'"]');if(bottle){if(p.selected===k)bottle.classList.add("selected");else bottle.classList.remove("selected")}})}function checkPourGoal(){const cur=G.cur,st=G.pour.state;let ok=false;const g=cur.goal;if(g.kind==="cup"){ok=st["target"]===g.val}else if(g.kind==="anyHas"){ok=Object.keys(st).some(k=>k!=="target"&&st[k]===g.val)}else if(g.kind==="allOf"){ok=g.list.every(it=>st[it.c]===it.val)}else if(g.kind==="sum"){ok=g.list.reduce((s,k)=>s+(st[k]||0),0)===g.val}if(ok)winLevel()}let dragPearl=null;function renderBalance(){const stage=document.getElementById("balanceStage");stage.classList.remove("hidden");const cur=G.cur;const fakeIdx=1+Math.floor(Math.random()*cur.total);G.bal={total:cur.total,fake:fakeIdx,pearls:[],left:[],right:[],weighCnt:0,beamTilt:0,done:false};let html=`
    <div class="pearlPool" id="pearlPool">
      <div class="poolTitle">珍珠堆（把珍珠拖到下面的托盘上）</div>
    </div>
    <div class="balanceWrap">
      <div class="panCol">
