<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>等式天平乐园 · 第18讲 等式加减法（下）</title>
<style>:root{--pri:#1976D2;--pri-deep:#0D47A1;--pri-light:#BBDEFB;--bg:#F0F7FF;--card:#FFFFFF;--ink:#263238;--line:#90CAF9;--gold:#F9A825;--ok:#43A047;--bad:#E53935}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}body{font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.5;-webkit-tap-highlight-color:transparent}.hidden{display:none!important}button{font-family:inherit;font-size:17px;font-weight:700;cursor:pointer;border:2px solid var(--pri-deep);border-radius:10px;background:var(--card);color:var(--pri-deep);padding:8px 14px;transition:transform .08s,box-shadow .08s}button:active{transform:scale(.96)}button.primary{background:var(--pri);color:#fff}button.mini{font-size:16px;padding:5px 12px;border-radius:8px}b{color:var(--pri-deep)}.screen{max-width:1180px;margin:0 auto;padding:14px}#scr-diff{text-align:center;padding-top:6vh}.big-title{font-size:44px;color:var(--pri-deep);letter-spacing:2px}.sub{font-size:22px;margin-top:6px;color:var(--pri);font-weight:700}.intro{font-size:19px;margin:18px auto 30px;color:var(--ink)}.diff-row{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}.diff-card{width:260px;min-height:190px;border-radius:18px;padding:20px 14px;display:flex;flex-direction:column;justify-content:center;gap:8px;font-size:22px;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25);box-shadow:0 8px 20px rgba(0,0,0,.15)}.diff-card small{font-size:17px;font-weight:700;text-shadow:none;opacity:.95}.diff-card:nth-child(1){background:#43A047}.diff-card:nth-child(2){background:#1976D2}.diff-card:nth-child(3){background:#F57C00}.diff-card:hover{transform:translateY(-4px)}.hud{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;background:var(--card);border:3px solid var(--line);border-radius:14px;padding:10px 14px}.hud-left{font-size:20px;font-weight:900;color:var(--pri-deep)}.hud-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.hud-right .stat{background:var(--pri-light);border-radius:10px;padding:6px 12px;font-size:18px;font-weight:700;color:var(--pri-deep)}.qcard{margin-top:14px;background:var(--card);border:3px solid var(--line);border-radius:14px;padding:14px 18px}.qcard h2{font-size:22px;color:var(--pri-deep);margin-bottom:6px}.qcard p{font-size:20px;line-height:1.7}.game-grid{margin-top:14px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px;align-items:start}.panel{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:12px 14px}.panel h3{font-size:19px;color:var(--pri-deep);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.shelf{display:flex;flex-wrap:wrap;gap:12px;min-height:120px;max-height:430px;overflow-y:auto;padding:4px 2px;align-content:flex-start}.shelf-empty{color:#90A4AE;font-size:17px}.balcard{width:225px;background:#FFFDF7;border:3px solid var(--line);border-radius:14px;padding:8px 10px;cursor:grab;user-select:none;touch-action:none;box-shadow:0 3px 8px rgba(0,0,0,.08);flex:none}.balcard:active{cursor:grabbing}.balcard.derived{border-style:dashed;border-color:var(--gold);background:#FFFBEF}.balcard.in-use{opacity:.45}.balcard.splittable{outline:4px solid var(--gold);outline-offset:2px}.bal-top{display:flex;justify-content:space-between;align-items:center;gap:6px}.bal-tag{font-size:16px;font-weight:900;color:var(--pri)}.split-badge{font-size:16px;font-weight:900;color:#fff;background:var(--gold);border-radius:8px;padding:1px 8px;animation:pulse 1.2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}.bal-body{display:flex;align-items:stretch;gap:6px;margin-top:4px}.pan{flex:1;border:3px dashed var(--line);border-radius:12px;background:#fff;min-height:78px;padding:5px 4px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;justify-content:center;align-content:center}.eq{align-self:center;font-size:30px;font-weight:900;color:var(--pri-deep)}.itemgrp{display:flex;flex-direction:column;align-items:center;gap:1px}.gl-row{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;max-width:100px}.gl{font-size:24px;line-height:1.15}.glc{font-weight:900}.cnt{font-size:16px;color:#546E7A;font-weight:700}.wt{font-size:23px;font-weight:900;color:var(--pri-deep);background:var(--pri-light);border-radius:10px;padding:2px 10px;white-space:nowrap}.wt i{font-style:normal;font-size:16px;margin-left:1px}.bal-line{margin-top:5px;font-size:16px;font-weight:700;color:#37474F;border-top:2px dotted var(--line);padding-top:4px;text-align:center}.balcard.pop{animation:pop .45s}@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}.machine{display:flex;flex-direction:column;gap:8px}.slot{min-height:64px;border:3px dashed var(--pri);border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;color:#78909C;font-size:17px;padding:6px 10px;background:#FAFDFF}.slot.filled{color:var(--ink);border-style:solid}.slot .tagname{color:var(--pri);font-weight:900;margin-right:4px}.ops{display:flex;gap:10px;justify-content:center;align-items:center}.opbtn{width:64px;height:48px;font-size:30px;font-weight:900;border-radius:12px;background:#ECEFF1;color:#607D8B;border:3px solid #CFD8DC}.opbtn.on{background:var(--pri);color:#fff;border-color:var(--pri-deep);transform:scale(1.06)}.combine-preview{text-align:center;font-size:17px;color:var(--pri-deep);font-weight:700;min-height:24px}.machine-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.machine-btns .big{font-size:20px;padding:10px 26px}.splitzone{margin-top:10px;min-height:66px;border:3px dashed var(--gold);border-radius:12px;background:#FFFBEF;display:flex;align-items:center;justify-content:center;text-align:center;color:#8D6E00;font-size:17px;font-weight:700;padding:6px 10px}.dz-hot{box-shadow:0 0 0 5px rgba(249,168,37,.9) inset,0 0 0 3px #F9A825;background:#FFF8E1!important}.label-panel{margin-top:14px}#labelRow{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}.tagslot{width:150px;min-height:150px;border:3px dashed var(--pri);border-radius:14px;background:#FAFDFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px}.tl-g{font-size:38px;line-height:1.1}.tl-name{font-size:18px;font-weight:900;color:var(--pri-deep)}.tl-q{font-size:26px;font-weight:900;color:#B0BEC5}.tile{min-width:72px;padding:6px 14px;background:var(--pri);color:#fff;border-radius:10px;font-size:26px;font-weight:900;cursor:grab;user-select:none;touch-action:none;box-shadow:0 3px 6px rgba(0,0,0,.2)}.tile.placed{background:var(--ok)}.tile.wrong{background:var(--bad);animation:shake .4s}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}.tile-title{margin:14px 0 8px;font-size:17px;font-weight:700;color:#546E7A;text-align:center}#tileTray{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:56px}#scr-end{text-align:center;padding-top:5vh}#scr-end h1{font-size:36px;color:var(--pri-deep)}.result-list{margin:20px auto;max-width:560px;display:flex;flex-direction:column;gap:10px}.result-item{background:var(--card);border:3px solid var(--line);border-radius:12px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;font-size:19px;flex-wrap:wrap;gap:6px}.result-item .stars{color:var(--gold);font-size:24px;font-weight:900}.end-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:10px}#modalMask{position:fixed;inset:0;background:rgba(38,50,56,.55);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px}#modalBox{background:var(--card);border-radius:16px;border:4px solid var(--pri);max-width:640px;width:100%;max-height:84vh;overflow-y:auto;padding:20px 22px;box-shadow:0 16px 40px rgba(0,0,0,.3)}#modalBox h2{font-size:24px;color:var(--pri-deep);margin-bottom:12px;text-align:center}#modalBody{font-size:18px;line-height:1.8}#modalBody ol{padding-left:24px}#modalBody .ans-line{margin-top:10px;background:var(--pri-light);border-radius:10px;padding:8px 12px;font-weight:900;color:var(--pri-deep);font-size:19px}#modalBody .star-big{text-align:center;font-size:52px;color:var(--gold);margin:6px 0}.modal-btns{display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap}#toastBox{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:600;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,560px);pointer-events:none}.toast{background:var(--pri-deep);color:#fff;font-size:18px;font-weight:700;border-radius:12px;padding:10px 18px;box-shadow:0 6px 16px rgba(0,0,0,.3);animation:toastIn .25s;text-align:center}@keyframes toastIn{from{transform:translateY(-16px);opacity:0}to{transform:translateY(0);opacity:1}}.ghost{position:fixed;z-index:1000;pointer-events:none;opacity:.93;transform:scale(1.05) rotate(2deg);box-shadow:0 14px 30px rgba(0,0,0,.3);margin:0}#fxCanvas{position:fixed;inset:0;z-index:900;pointer-events:none}@media(max-width:880px){.game-grid{grid-template-columns:1fr}.big-title{font-size:32px}.qcard p{font-size:18px}.balcard{width:100%;max-width:320px}.hud{justify-content:center}}
</style>
</head>
<body>

<!-- 庆祝彩纸画布（透明覆盖层，不挡操作） -->
<canvas id="fxCanvas"></canvas>
<!-- 全局提示条 -->
<div id="toastBox"></div>

<!-- ============ 屏幕一：难度选择 ============ -->
<section id="scr-diff" class="screen">
  <h1 class="big-title">⚖️ 等式天平乐园</h1>
  <p class="sub">第18讲 · 等式加减法（下）</p>
  <p class="intro">
    每道题都是几架小天平：把式子拖进<b>合并机</b>，加一加、减一减，<br>
    再把个数相同的式子拖去<b>平均分组</b>，找出每样物品的秘密数值，<br>
    给它们贴对<b>数字牌</b>就能点亮通关！
  </p>
  <div class="diff-row">
    <button class="diff-card" data-diff="easy">初级<br>小小天平手<small>两个式子 · 相减请走小伙伴</small></button>
    <button class="diff-card" data-diff="mid">中级<br>天平小工匠<small>式子相加 · 两边一起拿走</small></button>
    <button class="diff-card" data-diff="hard">高级<br>天平大师<small>三个式子 · 合并找总和</small></button>
  </div>
</section>

<!-- ============ 屏幕二：游戏 ============ -->
<section id="scr-game" class="screen hidden">
  <header class="hud">
    <div class="hud-left" id="hudLevel">…</div>
    <div class="hud-right">
      <span class="stat">👣 步数 <b id="hudSteps">0</b></span>
      <span class="stat">⏱ 用时 <b id="hudTime">00:00</b></span>
      <button class="mini" id="btnRules">玩法说明</button>
      <button class="mini" id="btnHint">提示</button>
      <button class="mini" id="btnReveal">揭示答案</button>
      <button class="mini" id="btnRestart">重新开始</button>
      <button class="mini" id="btnBack">返回难度</button>
    </div>
  </header>

  <div class="qcard">
    <h2 id="qTitle">题目</h2>
    <p id="qStory">…</p>
  </div>

  <div class="game-grid">
    <div class="panel shelf-panel">
      <h3>🧺 式子台面（按住卡片拖动）<button class="mini" id="btnTidy">整理台面</button></h3>
      <div id="shelf" class="shelf"></div>
    </div>
    <div class="panel machine-panel">
      <h3>🔧 等式合并机</h3>
      <div class="machine">
        <div class="slot dropzone" data-zone="slotA" data-accept="card">把式子拖到这里（上面的式子）</div>
        <div class="ops">
          <button class="opbtn on" id="opPlus" title="相加">＋</button>
          <button class="opbtn" id="opMinus" title="相减">－</button>
        </div>
        <div class="slot dropzone" data-zone="slotB" data-accept="card">把式子拖到这里（下面的式子）</div>
        <div class="combine-preview" id="combinePreview">上式 ＋ 下式</div>
        <div class="machine-btns">
          <button class="mini" id="btnSwap">交换上下</button>
          <button class="primary big" id="btnCombine">启动合并</button>
          <button class="mini" id="btnClear">清空</button>
        </div>
      </div>
      <div class="splitzone dropzone" data-zone="split" data-accept="card">
        🍰 分组台：把“每种物品<b>个数相同</b>”的式子拖到这里，平均分组
      </div>
    </div>
  </div>

  <div class="panel label-panel">
    <h3>🏷️ 贴标签台（把数字牌拖到正确的位置）</h3>
    <div id="labelRow"></div>
    <div class="tile-title">数字牌（点一下已贴好的牌可以拿回来）</div>
    <div id="tileTray"></div>
  </div>
</section>

<!-- ============ 屏幕三：结算 ============ -->
<section id="scr-end" class="screen hidden">
  <h1>🎉 全部通关啦！</h1>
  <div class="result-list" id="resultList"></div>
  <div class="end-btns">
    <button class="primary" id="btnAgain">再玩一次（换一批题）</button>
    <button id="btnBack2">返回难度选择</button>
  </div>
</section>

<!-- ============ 通用弹窗 ============ -->
<div id="modalMask" class="hidden">
  <div id="modalBox">
    <h2 id="modalTitle">标题</h2>
    <div id="modalBody">内容</div>
    <div class="modal-btns" id="modalBtns"></div>
  </div>
