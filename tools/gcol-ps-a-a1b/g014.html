<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>巧算小镇 · 凑百之旅 — 第7讲 巧算加减法初步(2)（下）</title>
<style>
/* =====================================================================
   巧算小镇 · 凑百之旅（第7讲 巧算加减法初步(2)（下））
   核心方法：拆小补大凑整百 / 带符号搬家 / 加减分组速算
   主题色由 :root 变量控制，每局开局 JS 随机覆盖一套色板
   ===================================================================== */
:root{
  --main:#f57c00; --main2:#ffb74d; --bg1:#fff8ee; --bg2:#ffe7c4; --ink:#4a3520;
  --good:#2e7d32; --bad:#c62828;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  color:var(--ink);
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  min-height:100vh; overflow-x:hidden;
}
#app{max-width:980px; margin:0 auto; padding:10px 12px 30px;}
.screen{display:none; flex-direction:column; gap:14px;}
.screen.active{display:flex;}

/* ============ 首页：难度选择 ============ */
.home-head{text-align:center; padding:26px 10px 6px;}
.home-head h1{
  font-size:44px; letter-spacing:4px; color:var(--main);
  text-shadow:0 3px 0 rgba(0,0,0,.08);
}
.home-head .sub{font-size:19px; margin-top:10px; opacity:.85;}
.home-head .tagline{
  display:inline-block; margin-top:14px; font-size:19px; background:#fff;
  border:3px solid var(--main); border-radius:40px; padding:8px 22px; font-weight:bold;
}
.diff-list{display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-top:14px;}
.diff-card{
  flex:1 1 240px; max-width:290px; cursor:pointer; text-align:left;
  background:#fff; border:4px solid var(--main); border-radius:22px;
  padding:20px 18px; font-size:18px; line-height:1.65; color:var(--ink);
  box-shadow:0 8px 0 rgba(0,0,0,.10); transition:transform .15s, box-shadow .15s;
  font-family:inherit;
}
.diff-card:hover{transform:translateY(-4px); box-shadow:0 12px 0 rgba(0,0,0,.12);}
.diff-card b{display:block; font-size:26px; color:var(--main); margin-bottom:6px;}
.diff-card .d-desc{font-size:17px; opacity:.9;}
.diff-card .d-skill{
  margin-top:10px; display:inline-block; font-size:15px; background:var(--bg2);
  border-radius:14px; padding:4px 12px;
}
.home-tip{text-align:center; font-size:16px; opacity:.75;}

/* ============ 游戏顶栏（计时器 / 步数 右上角实时显示） ============ */
.topbar{
  display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;
  background:#fff; border-radius:16px; padding:10px 16px;
  border:3px solid var(--main); box-shadow:0 4px 0 rgba(0,0,0,.08);
}
.tb-left{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.tb-right{display:flex; gap:14px; align-items:center; font-weight:bold; font-size:19px;}
.pill{background:var(--bg2); border-radius:20px; padding:5px 14px; font-size:18px; font-weight:bold;}
.pill.p-main{background:var(--main); color:#fff;}

/* ============ 舞台通用 ============ */
#stage{
  background:#fff; border-radius:20px; padding:16px;
  border:3px solid var(--main); box-shadow:0 6px 0 rgba(0,0,0,.08);
  display:flex; flex-direction:column; gap:14px; min-height:380px;
}
.story{
  font-size:19px; line-height:1.7; background:var(--bg1); border-left:8px solid var(--main2);
  border-radius:10px; padding:10px 14px;
}
.expr-banner{
  text-align:center; font-size:32px; font-weight:bold; letter-spacing:2px;
  background:var(--ink); color:#fff; border-radius:16px; padding:12px 10px;
  font-family:Consolas,"Microsoft YaHei",monospace;
}
.expr-banner .qm{color:var(--main2);}
.hint-bar{
  font-size:18px; text-align:center; background:var(--bg2);
  border-radius:12px; padding:9px 12px; line-height:1.55; min-height:42px;
}
.hint-bar b{color:var(--main);}

/* ============ 玩法A：补给站卡片 ============ */
.fill-zone{display:flex; gap:18px; justify-content:center; flex-wrap:wrap; padding:6px 0;}
.numcard{
  width:176px; min-height:182px; background:#fff; border-radius:18px;
  border:4px solid #b8b8b8; padding:12px 10px; text-align:center; position:relative;
  transition:transform .2s, border-color .3s, box-shadow .3s;
}
.numcard .nc-role{
  position:absolute; top:-16px; left:50%; transform:translateX(-50%);
  font-size:15px; font-weight:bold; color:#fff; border-radius:14px; padding:3px 12px; white-space:nowrap;
}
.numcard.is-src .nc-role{background:#757575;}
.numcard.is-dst{border-color:var(--main);}
.numcard.is-dst .nc-role{background:var(--main);}
.numcard.is-dst.done{border-color:var(--good); box-shadow:0 0 0 5px rgba(46,125,50,.25); transform:scale(1.04);}
.numcard .nc-goal{font-size:16px; margin-top:2px; color:var(--main); font-weight:bold;}
.numcard .nc-num{font-size:46px; font-weight:900; line-height:1.15; margin-top:4px;
  font-family:Consolas,"Microsoft YaHei",monospace;}
.numcard .nc-num.bump{animation:bump .45s;}
@keyframes bump{30%{transform:scale(1.35); color:var(--good);}}
.nc-cells{display:flex; gap:5px; justify-content:center; margin-top:8px; min-height:22px; flex-wrap:wrap;}
.nc-cells .cell{
  width:20px; height:20px; border-radius:6px; border:2px solid #cfcfcf; background:#f4f4f4;
  transition:background .25s, transform .25s;
}
.nc-cells .cell.on{background:var(--main); border-color:var(--main); transform:scale(1.12);}
.split-btns{display:flex; gap:6px; justify-content:center; margin-top:10px; flex-wrap:wrap;}
.split-btns button{
  font-size:17px; font-weight:bold; padding:7px 12px; border-radius:12px; cursor:pointer;
  border:2px solid #757575; background:#f1f1f1; color:#444; font-family:inherit;
}
.split-btns button:not(:disabled):hover{background:#e2e2e2;}
.split-btns button:disabled{opacity:.35; cursor:not-allowed;}
.numcard.bag{border-style:dashed; border-color:var(--main); background:var(--bg1);}
.numcard.bag .nc-num{font-size:40px;}
.numcard.bag .bag-count{font-size:17px; margin-top:6px; font-weight:bold; color:var(--bad);}

/* 托盘（手里的数字块） */
.tray{
  min-height:96px; border:3px dashed var(--main2); border-radius:16px;
  display:flex; align-items:center; justify-content:center; gap:14px; background:var(--bg1);
  padding:10px; flex-wrap:wrap;
}
.tray .tray-tip{font-size:17px; opacity:.7;}
.block{
  width:96px; height:66px; border-radius:14px; background:var(--main); color:#fff;
  font-size:32px; font-weight:900; display:flex; align-items:center; justify-content:center;
  cursor:grab; touch-action:none; box-shadow:0 5px 0 rgba(0,0,0,.18);
  font-family:Consolas,"Microsoft YaHei",monospace; user-select:none; position:relative;
}
.block small{font-size:14px; font-weight:normal; position:absolute; bottom:3px; right:8px; opacity:.85;}
.block.ghost{position:fixed; z-index:1000; pointer-events:none; transform:scale(1.15) rotate(-3deg); cursor:grabbing;}

/* ============ 玩法B：符号小火车 ============ */
.rail-wrap{position:relative; padding:14px 4px 8px;}
.rail-line{height:10px; background:repeating-linear-gradient(90deg,#9e9e9e 0 26px,#e0e0e0 26px 40px);
  border-radius:6px; margin-top:-4px;}
#rail{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; min-height:112px; align-items:flex-end;}
.car{
  min-width:106px; background:#fff; border:4px solid var(--main); border-radius:14px 14px 8px 8px;
  padding:8px 10px 12px; position:relative; cursor:grab; touch-action:none; user-select:none;
  box-shadow:0 5px 0 rgba(0,0,0,.14); transition:box-shadow .2s;
  display:flex; flex-direction:column; align-items:center; gap:2px;
}
.car .car-sign{
  font-size:26px; font-weight:900; line-height:1; padding:1px 10px; border-radius:10px; color:#fff;
}
.car.plus .car-sign{background:var(--good);}
.car.minus .car-sign{background:var(--bad);}
.car .car-num{font-size:34px; font-weight:900; font-family:Consolas,"Microsoft YaHei",monospace;}
.car .car-hat{
  position:absolute; top:-15px; left:50%; transform:translateX(-50%);
  font-size:14px; font-weight:bold; color:#fff; background:#616161; padding:1px 10px; border-radius:10px;
  white-space:nowrap;
}
.car.dragging{opacity:.92; z-index:50; box-shadow:0 14px 22px rgba(0,0,0,.28); cursor:grabbing;}
.car.merging{animation:glowmerge .5s 2; border-color:var(--main2);}
@keyframes glowmerge{50%{box-shadow:0 0 0 8px rgba(255,183,77,.55); transform:scale(1.08);}}
.car.pop{animation:popin .45s;}
@keyframes popin{0%{transform:scale(.3); opacity:0;}70%{transform:scale(1.15);}100%{transform:scale(1);}}
.car.counted{outline:5px solid var(--main2); outline-offset:3px;}
.badge{
  position:absolute; z-index:60; width:66px; height:66px; border-radius:50%;
  background:radial-gradient(circle at 32% 30%,#ffe082,#ffb300); border:4px solid #fff;
  color:#5d4037; font-size:17px; font-weight:900; line-height:1.1; cursor:pointer;
  transform:translate(-50%,-50%); text-align:center; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  box-shadow:0 4px 10px rgba(0,0,0,.25); animation:pulseb 1s infinite;
}
@keyframes pulseb{50%{transform:translate(-50%,-50%) scale(1.12); box-shadow:0 6px 16px rgba(255,179,0,.6);}}
.train-ctrl{display:flex; gap:14px; justify-content:center; flex-wrap:wrap;}
.btn-depart{
  font-size:23px; font-weight:900; padding:12px 40px; border-radius:40px; cursor:pointer;
  border:4px solid var(--ink); background:var(--ink); color:#fff; font-family:inherit;
  box-shadow:0 6px 0 rgba(0,0,0,.25); transition:transform .15s;
}
.btn-depart:not(:disabled):hover{transform:translateY(-2px);}
.btn-depart:disabled{opacity:.4; cursor:not-allowed; box-shadow:none;}

/* ============ 玩法C：星光月台 ============ */
.dock{
  display:flex; gap:10px; flex-wrap:wrap; justify-content:center; min-height:76px;
  background:var(--bg1); border-radius:14px; padding:12px;
}
.chip{
  min-width:76px; background:#fff; border:3px solid var(--main); border-radius:12px;
  padding:6px 10px; font-size:24px; font-weight:900; cursor:grab; touch-action:none; user-select:none;
  display:flex; align-items:center; gap:4px; box-shadow:0 4px 0 rgba(0,0,0,.12);
  font-family:Consolas,"Microsoft YaHei",monospace;
}
.chip .cs{font-size:19px; border-radius:7px; color:#fff; padding:0 6px;}
.chip.plus .cs{background:var(--good);}
.chip.minus .cs{background:var(--bad);}
.chip.dragging{opacity:.9; z-index:50; box-shadow:0 10px 18px rgba(0,0,0,.3); cursor:grabbing;}
.chip.landed{animation:popin .4s;}
.platforms{display:flex; gap:18px; flex-wrap:wrap;}
.platform{
  flex:1 1 260px; min-height:150px; border:4px dashed var(--main); border-radius:18px;
  background:var(--bg1); padding:12px; text-align:center; transition:background .2s, transform .2s;
}
.platform h4{font-size:21px; margin-bottom:8px;}
.platform.plus-plat h4{color:var(--good);}
.platform.minus-plat h4{color:var(--bad);}
.platform .plat-chips{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; min-height:52px;}
.platform.shakebad{animation:shakex .4s; background:#ffe3e3;}
@keyframes shakex{25%{transform:translateX(-7px);}75%{transform:translateX(7px);}}
.platform.glowgood{background:#e8f5e9;}
.plat-sum{font-size:24px; font-weight:900; margin-top:8px; color:var(--main); min-height:32px;}

/* ============ 结算区 / 通关 ============ */
.settle{
  text-align:center; font-size:28px; font-weight:900; letter-spacing:2px; padding:12px;
  border-radius:14px; background:var(--bg2); line-height:1.7;
  font-family:Consolas,"Microsoft YaHei",monospace;
}
.settle .s-final{color:var(--main); font-size:34px; display:inline-block; animation:bump .6s;}
.clear-banner{
  text-align:center; font-size:26px; font-weight:900; color:var(--good);
  animation:popin .5s; padding:4px;
}
.next-wrap{display:flex; justify-content:center;}

/* ============ 底栏按钮 ============ */
.bottombar{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
.btn{
  font-size:18px; font-weight:bold; padding:10px 18px; border-radius:14px; cursor:pointer;
  border:3px solid var(--main); background:#fff; color:var(--ink); font-family:inherit;
  box-shadow:0 4px 0 rgba(0,0,0,.12); transition:transform .12s;
}
.btn:hover{transform:translateY(-2px);}
.btn.btn-main{background:var(--main); color:#fff;}

/* ============ 结果屏 ============ */
#result{text-align:center; padding-top:30px;}
#result h2{font-size:40px; color:var(--main);}
.stars{font-size:64px; color:#ffb300; letter-spacing:14px; margin:14px 0;}
.stars span{display:inline-block; animation:popin .6s both;}
.stars span:nth-child(2){animation-delay:.25s;}
.stars span:nth-child(3){animation-delay:.5s;}
.stars span.off{color:#d7d7d7;}
.r-stat{font-size:24px; font-weight:bold; margin:12px 0;}
.r-say{font-size:19px; opacity:.85; margin-bottom:22px;}
.r-btns{display:flex; gap:16px; justify-content:center; flex-wrap:wrap;}
.r-btns .btn{font-size:21px; padding:13px 30px;}

/* ============ 弹窗（规则说明 / 揭示答案） ============ */
.mask{
  position:fixed; inset:0; background:rgba(30,20,10,.55); z-index:800;
  display:flex; align-items:center; justify-content:center; padding:16px;
}
.mask.hidden{display:none;}
.modal{
  background:#fff; border-radius:20px; border:4px solid var(--main);
  max-width:560px; width:100%; padding:22px 24px; max-height:86vh; overflow-y:auto;
  animation:popin .35s;
}
.modal h3{font-size:26px; color:var(--main); margin-bottom:12px; text-align:center;}
.modal .m-body{font-size:18px; line-height:1.8;}
.modal .m-body ul{padding-left:22px;}
.modal .m-body li{margin-bottom:6px;}
.modal .m-body ol{padding-left:24px;}
.modal .m-secret{font-size:15px; color:#888; margin-bottom:8px;}
.modal .m-btns{display:flex; gap:12px; justify-content:center; margin-top:18px; flex-wrap:wrap;}
.modal .tip-good{background:var(--bg1); border-radius:10px; padding:8px 12px; margin-bottom:10px;}

/* ============ 彩纸画布（庆祝动画） ============ */
#fx{position:fixed; inset:0; pointer-events:none; z-index:900;}

/* ============ 响应式（移动端 / 课堂投影均适配） ============ */
@media (max-width:640px){
  .home-head h1{font-size:32px;}
  .expr-banner{font-size:24px;}
  .numcard{width:46%; min-width:150px;}
  .numcard .nc-num{font-size:36px;}
  .car{min-width:84px;}
  .car .car-num{font-size:26px;}
  .chip{font-size:20px; min-width:62px;}
  .settle{font-size:20px;}
  .topbar{padding:8px 10px;}
  .tb-right{font-size:16px;}
  .pill{font-size:15px; padding:4px 10px;}
}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="app">

  <!-- ============ 首页：难度选择 ============ -->
  <section id="home" class="screen active">
    <header class="home-head">
      <h1>巧算小镇 · 凑百之旅</h1>
      <p class="sub">第7讲 巧算加减法初步(2)（下） · 拆数凑整 + 带符号搬家</p>
      <div class="tagline">凑整百、搬符号，大数变小算得快！</div>
    </header>
    <div class="diff-list">
      <button class="diff-card" data-diff="easy">
        <b>初级 · 彩虹补给站</b>
        <span class="d-desc">拆小补大凑整百：把数字块拖到目标卡上，点亮整百！</span>
        <span class="d-skill">练习：98、99 这样接近 100 的数先补整</span>
      </button>
      <button class="diff-card" data-diff="mid">
        <b>中级 · 符号小火车</b>
        <span class="d-desc">拖动车厢带符号搬家，凑整合并再发车！</span>
        <span class="d-skill">练习：46+18−26 型加减混合巧算</span>
      </button>
      <button class="diff-card" data-diff="hard">
        <b>高级 · 星光月台</b>
        <span class="d-desc">大数长式也不怕：分拣月台 + 长长的小火车！</span>
        <span class="d-skill">练习：997+156+3−56 与加减长式分组速算</span>
      </button>
    </div>
    <div class="home-tip">每局随机换主题色、随机抽题，越玩越新鲜！</div>
  </section>

  <!-- ============ 游戏屏 ============ -->
  <section id="game" class="screen">
    <div class="topbar">
      <div class="tb-left">
        <span class="pill p-main" id="lvTag">第 1 / 3 关</span>
        <span class="pill" id="diffTag">初级</span>
        <span class="pill" id="palTag">阳光橙</span>
      </div>
      <div class="tb-right">
        <span class="pill p-time" id="timer">用时 00:00</span>
        <span class="pill p-step" id="stepTag">步数 0</span>
      </div>
    </div>
    <div id="stage"></div>
    <div class="bottombar">
      <button class="btn" id="btnRules">规则说明</button>
      <button class="btn" id="btnReveal">揭示答案</button>
      <button class="btn" id="btnRestart">重新开始</button>
      <button class="btn" id="btnHome">返回难度选择</button>
    </div>
  </section>

  <!-- ============ 结果屏 ============ -->
  <section id="result" class="screen">
    <h2>全部通关，太棒了！</h2>
    <div class="stars" id="rStars"></div>
    <div class="r-stat" id="rStat"></div>
    <div class="r-say">带着符号搬家、拆小补大凑整——巧算秘诀都学会啦！</div>
    <div class="r-btns">
      <button class="btn btn-main" id="btnAgain">再玩一次</button>
      <button class="btn" id="btnBackHome">返回难度选择</button>
    </div>
  </section>
</div>

<!-- 通用弹窗（规则说明 / 揭示答案） -->
<div class="mask hidden" id="mask">
  <div class="modal" id="modal"></div>
</div>

<script>
'use strict';
/* =====================================================================
 * 巧算小镇 · 凑百之旅
 * 对应教参：第7讲 巧算加减法初步(2)（下）
 * 核心方法：拆小补大凑整百 / 带符号搬家 / 加减分组速算
 * 三种玩法：
 *   A 补给站（初级）：点击拆出数字块 -> 拖到目标卡补成整百整十
 *   B 小火车（中级）：拖动车厢带符号搬家，相邻凑整点亮合并徽章
 *   C 月台（高级）：按符号分拣车厢到两个站台，分组求和再相减
 * 全部拖拽采用 Pointer Events（鼠标 / 触摸 / 触控笔通吃）
 * ===================================================================== */

/* ---------- 小工具 ---------- */
function $(s){ return document.querySelector(s); }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
/* 带符号数字格式化：26 -> "+26"，-26 -> "−26" */
function fmtSign(v){ return v>=0 ? '+'+v : '−'+(-v); }
/* 算式横幅（首个数不带加号） */
function fmtExpr(ops){
  var s = '' + ops[0];
  for(var i=1;i<ops.length;i++){ s += ' ' + fmtSign(ops[i]); }
  return s;
}
function mmss(sec){
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}

/* ---------- 主题色板（每局随机一套，多次游玩不重样） ---------- */
var PALETTES = [
  {name:'阳光橙', main:'#f57c00', main2:'#ffb74d', bg1:'#fff8ee', bg2:'#ffe7c4', ink:'#4a3520'},
  {name:'海洋蓝', main:'#0277bd', main2:'#4fc3f7', bg1:'#eef8ff', bg2:'#cfe9f8', ink:'#0d3c61'},
  {name:'森林绿', main:'#2e7d32', main2:'#81c784', bg1:'#f1faf2', bg2:'#d4ecd6', ink:'#1b3d1e'},
  {name:'葡萄紫', main:'#7b1fa2', main2:'#ce93d8', bg1:'#f9f0fc', bg2:'#ecd5f2', ink:'#3c1a4d'},
  {name:'樱桃红', main:'#c62828', main2:'#ef9a9a', bg1:'#fff4f4', bg2:'#ffd9d9', ink:'#4a1010'},

/* ---------- 全局状态 ---------- */
var S = {
  diff:null, levels:[], cur:0, steps:0, startAt:0, timerId:null,
  palName:'', busy:false, fill:null, train:null, group:null
};

/* ---------- 屏幕切换 ---------- */
function show(id){
  document.querySelectorAll('.screen').forEach(function(sc){ sc.classList.remove('active'); });
  $('#' + id).classList.add('active');
}

/* ---------- 计时器与步数（顶栏实时显示） ---------- */
function startTimer(){
  S.startAt = Math.floor(Date.now()/1000);
  stopTimer();
  S.timerId = setInterval(tickTimer, 1000);
  tickTimer();
}
function stopTimer(){ if(S.timerId){ clearInterval(S.timerId); S.timerId = null; } }
function tickTimer(){
  var el = $('#timer'); if(!el){ return; }
  var sec = Math.floor(Date.now()/1000) - S.startAt;
  el.textContent = '用时 ' + mmss(Math.max(0,sec));
}
function addStep(){
  S.steps++;
  var st = $('#stepTag'); if(st){ st.textContent = '步数 ' + S.steps; }
}

/* ---------- 开始游戏（随机抽题 + 随机色板 + 弹规则说明） ---------- */
function startGame(diff){
  S.diff = diff;
  S.levels = shuffle(BANK[diff]).slice(0,3);
  S.cur = 0; S.steps = 0; S.busy = false;
  S.fill = null; S.train = null; S.group = null;
  var st = $('#stepTag'); if(st){ st.textContent = '步数 0'; }
  applyPalette();
  var names = {easy:'初级', mid:'中级', hard:'高级'};
  var dt = $('#diffTag'); if(dt){ dt.textContent = names[diff]; }
  show('game');
  startTimer();
  showRules(true);
}

/* ---------- 关卡调度 ---------- */
function curLevel(){ return S.levels[S.cur]; }
function renderLevel(){
  S.busy = false;
  var lt = $('#lvTag'); if(lt){ lt.textContent = '第 ' + (S.cur+1) + ' / ' + S.levels.length + ' 关'; }
  var q = curLevel();
  if(q.mode === 'fill'){ renderFill(q); }
  else if(q.mode === 'train'){ renderTrain(q); }
  else { renderGroup(q); }
}
/* 小关通关后的流转（庆祝 + 下一关按钮） */
async function levelClear(){
  S.busy = true;
  burstConfetti(70);
  var stage = $('#stage');
  var b = document.createElement('div');
  b.className = 'clear-banner';
  b.textContent = '第 ' + (S.cur+1) + ' 关完成，摘到一颗星！';
  stage.appendChild(b);
  var wrap = document.createElement('div');
  wrap.className = 'next-wrap';
  var last = (S.cur >= S.levels.length-1);
  var btn = document.createElement('button');
  btn.className = 'btn btn-main';
  btn.style.fontSize = '22px';
  btn.textContent = last ? '查看成绩' : '下一关';
  btn.addEventListener('click', function(){
    S.cur++;
    if(S.cur >= S.levels.length){ showResult(); } else { renderLevel(); }
  });
  wrap.appendChild(btn);
  stage.appendChild(wrap);
  wrap.scrollIntoView({behavior:'smooth', block:'end'});
}
function showResult(){
  stopTimer();
  var sec = Math.floor(Date.now()/1000) - S.startAt;
  var stars = sec < 90 ? 3 : (sec < 180 ? 2 : 1);
  var box = $('#rStars'); box.textContent = '';
  for(var i=1;i<=3;i++){
    var sp = document.createElement('span');
    sp.textContent = '★';
    if(i>stars){ sp.className = 'off'; }
    box.appendChild(sp);
  }
  $('#rStat').textContent = '用时 ' + mmss(sec) + ' · 共操作 ' + S.steps + ' 步 · 摘得 ' + stars + ' 颗星';
  show('result');
  rainConfetti(4200);
}

/* =====================================================================
 * 玩法A：彩虹补给站（拆小补大凑整百）
 * ===================================================================== */
function renderFill(q){
  S.fill = {
    q:q,
    cards: q.nums.map(function(n,i){
      return { start:n, v:n, goal:q.goals[i], role: q.goals[i]===null ? 'src':'dst' };
    }),
    bag:0, tray:null
  };
  var stage = $('#stage');
  var exprStr = q.nums.join(' + ');
  var zoneHtml = '';
  if(q.kind === 'iou'){
    zoneHtml += '<div class="numcard bag" id="bagCard">' +
      '<div class="nc-role">欠条袋</div>' +
      '<div class="nc-num" id="bagNum">0</div>' +
      '<div class="bag-count" id="bagTip">已借 0 张</div>' +
      '<div class="split-btns" id="bagBtns"></div></div>';
  }
  q.nums.forEach(function(n,i){
    var g = q.goals[i];
    if(g === null){
      zoneHtml += '<div class="numcard is-src" data-i="' + i + '">' +
        '<div class="nc-role">可拆卡</div>' +
        '<div class="nc-goal" style="color:#757575;">拆我去帮忙</div>' +
        '<div class="nc-num" id="cn' + i + '">' + n + '</div>' +
        '<div class="split-btns" id="sb' + i + '"></div></div>';
    } else {
      var cells = '';
      for(var k=0;k<g-n;k++){ cells += '<div class="cell"></div>'; }
      zoneHtml += '<div class="numcard is-dst" data-i="' + i + '">' +
        '<div class="nc-role">目标卡</div>' +
        '<div class="nc-goal">补到 ' + g + '</div>' +
        '<div class="nc-num" id="cn' + i + '">' + n + '</div>' +
        '<div class="nc-cells" id="cs' + i + '">' + cells + '</div></div>';
    }
  });
  stage.innerHTML =
    '<div class="story">' + q.story + '</div>' +
    '<div class="expr-banner">' + exprStr + ' = <span class="qm">?</span></div>' +
    '<div class="hint-bar" id="hint"></div>' +
    '<div class="fill-zone">' + zoneHtml + '</div>' +
    '<div class="tray" id="tray"></div>' +
    '<div class="settle" id="settle" style="display:none;"></div>';
  setFillHint(q.kind === 'iou'
    ? '点击欠条袋上的「借 1 / 借 2」取数字块，<b>拖</b>到目标卡上补成整百整十，最后记得归还哦！'
    : '点击可拆卡上的「拆 1 / 拆 2」取数字块，把块<b>拖</b>到戴星星的目标卡上！');
  renderFillBtns();
  renderTray();
}
function setFillHint(html){ var h = $('#hint'); if(h){ h.innerHTML = html; } }
function cardElOf(i){ return document.querySelector('.numcard[data-i="' + i + '"]'); }

/* 渲染每张可拆卡/欠条袋上的拆出按钮（块在手时全部禁用，一次只拿一块） */
function renderFillBtns(){
  var f = S.fill;
  if(!f){ return; }
  var hold = !!f.tray;
  f.cards.forEach(function(c,i){
    if(c.role !== 'src'){ return; }
    var box = $('#sb' + i);
    if(!box){ return; }
    box.textContent = '';
    [1,2,3,4].forEach(function(k){
      var b = document.createElement('button');
      b.textContent = '拆 ' + k;
      b.disabled = hold || (c.v - k < 0);
      b.addEventListener('click', function(){ takeBlock(i, k); });
      box.appendChild(b);
    });
  });
  var bagBox = $('#bagBtns');
  if(bagBox){
    bagBox.textContent = '';
    [1,2,3].forEach(function(k){
      var b = document.createElement('button');
      b.textContent = '借 ' + k;
      b.disabled = hold;
      b.addEventListener('click', function(){ takeBlock('bag', k); });
      bagBox.appendChild(b);
    });
  }
}
/* 取块：来源为可拆卡下标或 'bag'（欠条袋） */
function takeBlock(from, k){
  var f = S.fill;
  if(!f || f.tray || S.busy){ return; }
  if(from === 'bag'){
    f.bag += k;
    var bn = $('#bagNum'), bt = $('#bagTip');
    if(bn){ bn.textContent = f.bag; }
    if(bt){ bt.textContent = '已借 ' + f.bag + ' 张'; }
    f.tray = { val:k, from:'bag' };
  } else {
    var c = f.cards[from];
    c.v -= k;
    var el = $('#cn' + from);
    if(el){
      el.textContent = c.v;
      el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
    }
    f.tray = { val:k, from:from };
  }
  addStep();
  renderFillBtns();
  renderTray();
  setFillHint('把数字块 <b>' + k + '</b> 拖到目标卡上；放不下就拖到空白处收回去。');
}
/* 渲染托盘与数字块 */
function renderTray(){
  var tray = $('#tray');
  if(!tray){ return; }
  var f = S.fill;
  tray.textContent = '';
  if(!f.tray){
    var tip = document.createElement('span');
    tip.className = 'tray-tip';
    tip.textContent = f.q.kind === 'iou' ? '点击欠条袋上的「借」按钮，数字块会出现在这里' : '点击可拆卡上的「拆」按钮，数字块会出现在这里';
    tray.appendChild(tip);
    return;
  }
  var bl = document.createElement('div');
  bl.className = 'block';
  bl.textContent = '+' + f.tray.val;
  var sm = document.createElement('small');
  sm.textContent = '拖我';
  bl.appendChild(sm);
  bindBlockDrag(bl);
  tray.appendChild(bl);
}
/* 数字块拖拽：ghost 跟随指针，松手用 elementFromPoint 命中目标卡 */
function bindBlockDrag(bl){
  bl.addEventListener('pointerdown', function(ev){
    ev.preventDefault();
    if(S.busy || !S.fill || !S.fill.tray){ return; }
    bl.setPointerCapture(ev.pointerId);
    var ghost = null, sx = ev.clientX, sy = ev.clientY, moved = false;
    function mkGhost(){
      ghost = bl.cloneNode(true);
      ghost.classList.add('ghost');
      ghost.style.width = bl.offsetWidth + 'px';
      ghost.style.left = (sx - bl.offsetWidth/2) + 'px';
      ghost.style.top = (sy - bl.offsetHeight/2) + 'px';
      document.body.appendChild(ghost);
      bl.style.visibility = 'hidden';
    }
    function onMove(e){
      if(!moved && Math.hypot(e.clientX-sx, e.clientY-sy) > 6){
        moved = true; mkGhost();
      }
      if(moved && ghost){
        ghost.style.left = (e.clientX - bl.offsetWidth/2) + 'px';
        ghost.style.top = (e.clientY - bl.offsetHeight/2) + 'px';
      }
    }
    function onUp(e){
      bl.removeEventListener('pointermove', onMove);
      bl.removeEventListener('pointerup', onUp);
      bl.removeEventListener('pointercancel', onUp);
      if(!moved){ return; }
      if(ghost){ ghost.remove(); }
      bl.style.visibility = '';
      var under = document.elementFromPoint(e.clientX, e.clientY);
      var cardEl = under ? under.closest('.numcard.is-dst') : null;
      if(cardEl){
        tryPlaceBlock(parseInt(cardEl.getAttribute('data-i'), 10));
      } else {
        returnBlock('块收回去啦，再想一想：谁最需要它？');
      }
    }
    bl.addEventListener('pointermove', onMove);
    bl.addEventListener('pointerup', onUp);
    bl.addEventListener('pointercancel', onUp);
  });
}
/* 尝试把托盘中的块放到目标卡 idx 上 */
function tryPlaceBlock(idx){
  var f = S.fill, c = f.cards[idx], val = f.tray.val;
  if(c.v >= c.goal){
    setFillHint('它已经是 <b>' + c.goal + '</b> 啦，换个目标试试！');
    renderTray();
    return;
  }
  if(c.v + val > c.goal){
    setFillHint('呀，' + c.start + ' 只要再补 <b>' + (c.goal - c.v) + '</b> 就到 ' + c.goal + ' 啦，' + val + ' 太多了！');
    renderTray();
    return;
  }
  c.v += val;
  f.tray = null;
  addStep();
  var numEl = $('#cn' + idx);
  if(numEl){
    numEl.textContent = c.v;
    numEl.classList.remove('bump'); void numEl.offsetWidth; numEl.classList.add('bump');
  }
  var lit = c.v - c.start;
  var cells = document.querySelectorAll('#cs' + idx + ' .cell');
  cells.forEach(function(cell, k){
    if(k < lit){ cell.classList.add('on'); }
  });
  if(c.v === c.goal){
    var ce = cardElOf(idx);
    if(ce){ ce.classList.add('done'); }
    setFillHint('太棒了：<b>' + c.start + ' → ' + c.goal + '</b>，凑整成功！');
  } else {
    setFillHint('有进步！' + c.v + ' 再补 ' + (c.goal - c.v) + ' 就到 ' + c.goal + ' 啦。');
  }
  renderFillBtns();
  renderTray();
  var allOk = f.cards.every(function(x){ return x.role!=='dst' || x.v === x.goal; });
  if(allOk){ settleFill(); }
}

/* 判断相邻两节车厢能否凑整：和的个位为 0（个位凑十/个位相同），排除双整十的无意义合并 */
function canMergeCars(a, b){
  var s = a.v + b.v;
  if(s === 0){ return false; }
  if(Math.abs(s) % 10 !== 0){ return false; }
  if(Math.abs(a.v) % 10 === 0 && Math.abs(b.v) % 10 === 0){ return false; }
  return true;
}
/* 扫描相邻对渲染合并徽章；更新发车按钮状态 */
function detectTrain(){
  var t = S.train, rail = $('#rail');
  if(!rail || !t){ return; }
  document.querySelectorAll('.badge').forEach(function(b){ b.remove(); });
  var els = rail.querySelectorAll('.car');
  if(!S.busy){
    for(var i=0;i+1<t.cars.length;i++){
      (function(idx){
        if(canMergeCars(t.cars[idx], t.cars[idx+1])){
          var bd = document.createElement('div');
          bd.className = 'badge';
          bd.textContent = '合并go!';
          bd.addEventListener('click', function(){ mergeCars(idx); });
          $('#railZone').appendChild(bd);
          placeBadge(bd, els[idx], els[idx+1]);
        }
      })(i);
    }
  }
  var dep = $('#btnDepart');
  if(dep){
    var ok = (t.cars.length <= 2) && !S.busy;
    dep.disabled = !ok;
    if(!ok){
      setTrainHint('还有 <b>' + t.cars.length + '</b> 节车厢。拖一拖，让能凑整的伙伴排到一起！');
    } else {
      setTrainHint('小火车准备好啦，点击<b>发车</b>看结算！');

  }
}

/* 徽章定位：两节车厢的中缝（跨行时放在前节车厢上方） */
function placeBadge(bd, el1, el2){
  var zone = $('#railZone');
  if(!zone){ return; }
  var r1 = el1.getBoundingClientRect(), r2 = el2.getBoundingClientRect(), rz = zone.getBoundingClientRect();
  var x, y;
  if(Math.abs(r1.top - r2.top) > 30){
    x = r1.left + r1.width/2 - rz.left;
    y = r1.top - rz.top - 6;
  } else {
    x = (Math.min(r1.right, r2.right) + Math.max(r1.left, r2.left))/2 - rz.left;
    y = r1.top + r1.height/2 - rz.top;
  }
  bd.style.left = x + 'px';
  bd.style.top = y + 'px';
}
/* 车厢拖拽：跟随指针 + 实时插入重排（elementFromPoint 决定插入位置） */
function bindCarDrag(carEl){
  carEl.addEventListener('pointerdown', function(ev){
    ev.preventDefault();
    if(S.busy){ return; }
    carEl.setPointerCapture(ev.pointerId);
    var sx = ev.clientX, sy = ev.clientY, moved = false;
    document.querySelectorAll('.badge').forEach(function(b){ b.style.display = 'none'; });
    function onMove(e){
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if(!moved && Math.hypot(dx,dy) > 6){
        moved = true;
        carEl.classList.add('dragging');
        carEl.style.pointerEvents = 'none';
      }
      if(moved){
        carEl.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(1.07) rotate(-2deg)';
        var under = document.elementFromPoint(e.clientX, e.clientY);
        var other = under ? under.closest('.car') : null;
        if(other && other !== carEl && other.parentNode === carEl.parentNode){
          var or_ = other.getBoundingClientRect();
          if(e.clientX < or_.left + or_.width/2){
            carEl.parentNode.insertBefore(carEl, other);
          } else {
            carEl.parentNode.insertBefore(carEl, other.nextSibling);
          }
          sx = e.clientX; sy = e.clientY;
          carEl.style.transform = 'translate(0,0) scale(1.07)';
        }
      }
    }
    function onUp(){
      carEl.removeEventListener('pointermove', onMove);
      carEl.removeEventListener('pointerup', onUp);
      carEl.removeEventListener('pointercancel', onUp);
      if(!moved){
        document.querySelectorAll('.badge').forEach(function(b){ b.style.display = ''; });
        return;
      }
      carEl.classList.remove('dragging');
      carEl.style.pointerEvents = '';
      carEl.style.transform = '';
      addStep();
      syncTrainOrder();
      detectTrain();
    }
    carEl.addEventListener('pointermove', onMove);
    carEl.addEventListener('pointerup', onUp);
    carEl.addEventListener('pointercancel', onUp);
  });
}
/* 依据 DOM 顺序同步数据数组（车厢重组后调用） */
function syncTrainOrder(){
  var rail = $('#rail'), t = S.train;
  if(!rail || !t){ return; }
  var vals = [];
  rail.querySelectorAll('.car').forEach(function(el){
    var sign = (el.querySelector('.car-sign').textContent.trim() === '+') ? 1 : -1;
    var num = parseInt(el.querySelector('.car-num').textContent, 10);
    vals.push(sign * num);
  });
  t.cars = vals.map(function(v){ return { v:v }; });
}
/* 合并第 idx 与 idx+1 节车厢（带符号相加） */
async function mergeCars(idx){
  var t = S.train;
  if(!t || S.busy || idx+1 >= t.cars.length){ return; }
  if(!canMergeCars(t.cars[idx], t.cars[idx+1])){ return; }
  S.busy = true;
  var rail = $('#rail');
  var els = rail.querySelectorAll('.car');
  var e1 = els[idx], e2 = els[idx+1];
  var a = t.cars[idx].v, b = t.cars[idx+1].v, s = a + b;
  document.querySelectorAll('.badge').forEach(function(bd){ bd.remove(); });
  e1.classList.add('merging'); e2.classList.add('merging');
  setTrainHint('<b>' + mergeText(a,b,s) + '</b>');
  await sleep(620);
  var nu = document.createElement('div');
  nu.className = 'car pop ' + (s>=0?'plus':'minus');
  nu.innerHTML = '<div class="car-hat">' + (s>=0?'加号车厢':'减号车厢') + '</div>' +
    '<div class="car-sign">' + (s>=0?'+':'−') + '</div>' +
    '<div class="car-num">' + Math.abs(s) + '</div>';
  rail.insertBefore(nu, e1);
  e1.remove(); e2.remove();
  t.cars.splice(idx, 2, { v:s });
  addStep();
  bindCarDrag(nu);
  burstConfetti(14);
  await sleep(320);
  S.busy = false;
  detectTrain();
}
/* 合并时的解说词（按符号组合给出凑整话术） */
function mergeText(a, b, s){
  var A = Math.abs(a), B = Math.abs(b);
  if(a>=0 && b>=0){ return A + ' + ' + B + ' = ' + s + '，个位凑十，合体成功！'; }
  if(a<0 && b<0){ return A + ' + ' + B + ' = ' + Math.abs(s) + '，同号相连凑整，变成 ' + fmtSign(s) + '！'; }
  var big = Math.abs(a) >= Math.abs(b) ? A : B;
  var small = Math.abs(a) >= Math.abs(b) ? B : A;
  return big + ' − ' + small + ' = ' + Math.abs(s) + '，个位相同，合并成 ' + fmtSign(s) + '！';
}

/* =====================================================================
 * 彩纸庆祝（Canvas 粒子系统，通关时撒花）
 * ===================================================================== */
var FX = { cv:null, ctx:null, parts:[], running:false };
function initFx(){
  FX.cv = $('#fx');
  FX.ctx = FX.cv.getContext('2d');
  resizeFx();
  window.addEventListener('resize', resizeFx);
}
function resizeFx(){
  if(!FX.cv){ return; }
  FX.cv.width = window.innerWidth;
  FX.cv.height = window.innerHeight;
}
function burstConfetti(n){
  for(var i=0;i<n;i++){
    FX.parts.push({
      x: Math.random()*window.innerWidth,
      y: -20 - Math.random()*120,
      vx: (Math.random()-0.5)*2.2,
      vy: 2 + Math.random()*3.4,
      w: 8 + Math.random()*10,
      h: 6 + Math.random()*8,
      rot: Math.random()*Math.PI,
      vr: (Math.random()-0.5)*0.25,
      color: pickConfettiColor(),
      life: 130 + Math.random()*90
    });
  }
  runFx();
}
function rainConfetti(ms){
  burstConfetti(120);
  var t0 = Date.now();
  var iv = setInterval(function(){
    if(Date.now() - t0 > ms){ clearInterval(iv); return; }
    burstConfetti(14);
  }, 380);
}
function pickConfettiColor(){
  var cs = ['#f57c00','#ffb74d','#0277bd','#4fc3f7','#2e7d32','#81c784','#7b1fa2','#ce93d8','#c62828','#ef9a9a','#ffb300','#00838f'];
  return cs[Math.floor(Math.random()*cs.length)];
}
function runFx(){
  if(FX.running){ return; }
  FX.running = true;
  requestAnimationFrame(stepFx);
}
function stepFx(){
  var ctx = FX.ctx;
  ctx.clearRect(0, 0, FX.cv.width, FX.cv.height);
  FX.parts = FX.parts.filter(function(p){ return p.life > 0 && p.y < FX.cv.height + 40; });
  FX.parts.forEach(function(p){
    p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= 1;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life/60));
    ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    ctx.restore();
  });
  if(FX.parts.length){ requestAnimationFrame(stepFx); }
  else { FX.running = false; ctx.clearRect(0,0,FX.cv.width,FX.cv.height); }
}

      '<li>每节车厢都戴着<b>符号帽子</b>：绿 + 号、红 − 号。</li>' +
      '<li><b>按住车厢拖动</b>可以改变顺序（这就是带符号搬家）。</li>' +
      '<li>相邻两节的个位能凑十（46 和 24）或相同（46 和 26）时，中间亮起<b>合并徽章</b>，点击它合体！</li>' +
      '<li>车厢合并到只剩 <b>2 节</b>，「发车」按钮点亮，点击看结算动画。</li>' +
      '</ul>';
  } else {
    body = '<div class="tip-good">高级挑战有两种玩法，都是巧算好帮手！</div>' +
      '<ul>' +
      '<li><b>符号小火车</b>：拖车厢、点徽章合并凑整，合并到 2 节后发车（如 997+3=1000，156−56=100）。</li>' +
      '<li><b>星光月台</b>：把车厢按符号拖进对应站台——加号进加号、减号进减号，放错会弹回。</li>' +
      '<li>月台装满后点「点亮计算」：两个站台各自求和，再大数减小数！</li>' +
      '</ul>';
  }
  openModal('<h3>规则说明</h3><div class="m-body">' + body + '</div>' +
    '<div class="m-btns"><button class="btn btn-main" id="mOk">' + (firstTime ? '开始挑战' : '知道了') + '</button></div>');
  $('#mOk').addEventListener('click', function(){
    closeModal();
    renderLevel();
  });
}
function showReveal(){
  var q = curLevel();
  if(!q){ return; }
  var lis = q.reveal.map(function(r){ return '<li>' + r + '</li>'; }).join('');
  openModal('<h3>揭示答案</h3><div class="m-body"><div class="m-secret">先看思路再动手，也是好办法！</div>' +
    '<ol>' + lis + '</ol>' +
    '<p>最终答案是 <b style="font-size:24px;color:var(--main)">' + q.result + '</b>。看完快去动手试一试吧！</p></div>' +
    '<div class="m-btns"><button class="btn btn-main" id="mOk">继续挑战</button></div>');
  $('#mOk').addEventListener('click', closeModal);
}

/* =====================================================================
 * 全局事件绑定与启动
 * ===================================================================== */
function bindGlobal(){
  document.querySelectorAll('.diff-card').forEach(function(c){
    c.addEventListener('click', function(){ startGame(c.getAttribute('data-diff')); });
  });
  $('#btnRules').addEventListener('click', function(){ showRules(false); });
  $('#btnReveal').addEventListener('click', showReveal);
  $('#btnRestart').addEventListener('click', function(){
    if(S.diff){ startGame(S.diff); }
  });
  $('#btnHome').addEventListener('click', function(){
    stopTimer();
    show('home');
  });
  $('#btnAgain').addEventListener('click', function(){ startGame(S.diff); });
  $('#btnBackHome').addEventListener('click', function(){ show('home'); });
  /* 点遮罩空白处关闭弹窗（不误触正文内容） */
  $('#mask').addEventListener('click', function(ev){
    if(ev.target === $('#mask')){ closeModal(); }
  });
  /* 窗口尺寸变化时重摆火车合并徽章位置 */
  window.addEventListener('resize', repositionBadges);
}
function repositionBadges(){
  var t = S.train, zone = $('#railZone');
  if(!t || !zone){ return; }
  var els = zone.querySelectorAll('.car');
  var bds = zone.querySelectorAll('.badge');
  var bi = 0;
  for(var i=0;i+1<t.cars.length && bi<bds.length;i++){
    if(canMergeCars(t.cars[i], t.cars[i+1])){
      placeBadge(bds[bi], els[i], els[i+1]);
      bi++;
    }
  }
}

initFx();
bindGlobal();
</script>
