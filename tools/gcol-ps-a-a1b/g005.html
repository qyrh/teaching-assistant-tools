<script>
(function(){
'use strict';
/* =====================================================================
   剪拼魔法工坊 —— 互动教学游戏（单文件、零外部依赖）
   题型来源：《第3讲 剪拼图形(1)（上）》
     好方法1：图形的二等分 / 四等分（先二等分，再对每一部分二等分）
     好方法2：图形的拼接(1)——观察每一部分的宽窄和高矮，画一画找答案
     好方法3：图形的拼接(2)——画出目的图形，边对边拼接
     剪拼综合：把多出来的部分剪下来补到缺口（割补思想）
     七巧板：5个三角形、1个正方形、1个平行四边形
   操作方式（真交互，不是选择题）：
     · 拖动剪刀线两端的小圆点，摆好位置后“咔嚓剪开”，动画真把图形剪开并重叠对比
     · 点一下图块旋转、拖进轮廓自动吸附
     · 把剪下来的部分拖到缺口处“割补”
   ===================================================================== */

/* ---------------- 基础常量 ---------------- */
var CW = 960, CH = 640;            // 逻辑画布尺寸
var TOL_CENTER = 13;               // 剪刀线过中心的判定误差（像素）
var TOL_ANGLE  = 7;                // 角度判定误差（度）
var SNAP_DIST  = 50;               // 拼图吸附距离（像素）

/* ---------------- 小工具函数 ---------------- */
function $(id){ return document.getElementById(id); }
function dist2(a,b){ var dx=a[0]-b[0], dy=a[1]-b[1]; return Math.sqrt(dx*dx+dy*dy); }
/* 多边形面积重心 */
function polyCentroid(pts){
  var a=0,cx=0,cy=0,i,p,q,c;
  for(i=0;i<pts.length;i++){ p=pts[i]; q=pts[(i+1)%pts.length];
    c=p[0]*q[1]-q[0]*p[1]; a+=c; cx+=(p[0]+q[0])*c; cy+=(p[1]+q[1])*c; }
  a*=0.5;
  if(Math.abs(a)<1e-6){ var sx=0,sy=0; for(i=0;i<pts.length;i++){sx+=pts[i][0];sy+=pts[i][1];}
    return [sx/pts.length, sy/pts.length]; }
  return [cx/(6*a), cy/(6*a)];
}
/* 点绕中心旋转（角度制，屏幕坐标系顺时针为正） */
function rotPt(p,c,deg){
  var r=deg*Math.PI/180, cs=Math.cos(r), sn=Math.sin(r);
  var dx=p[0]-c[0], dy=p[1]-c[1];
  return [c[0]+dx*cs-dy*sn, c[1]+dx*sn+dy*cs];
}
/* 射线法：点是否在多边形内 */
function inPoly(p,pts){
  var n=pts.length,i,j,ins=false;
  for(i=0,j=n-1;i<n;j=i++){
    var xi=pts[i][0],yi=pts[i][1],xj=pts[j][0],yj=pts[j][1];
    if(((yi>p[1])!=(yj>p[1])) && (p[0] < (xj-xi)*(p[1]-yi)/(yj-yi)+xi)) ins=!ins;
  }
  return ins;
}
/* 点到无限直线的距离 */
function distToLine(p,a,b){
  var dx=b[0]-a[0], dy=b[1]-a[1], L=Math.sqrt(dx*dx+dy*dy);
  if(L<1e-6) return dist2(p,a);
  return Math.abs(dy*(p[0]-a[0])-dx*(p[1]-a[1]))/L;
}
/* 线段方向角，归一到 0~180 */
function lineAngle(a,b){
  var d=Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI;
  return ((d%180)+180)%180;
}
function angDiff180(a,b){
  var d=Math.abs(((a%180)+180)%180-((b%180)+180)%180);
  return Math.min(d,180-d);
}
/* 两个点集是否在容差内一一匹配（判断旋转后能否重合） */
function setsMatch(A,B,tol){
  if(A.length!==B.length) return false;
  var used=[],i,j;
  for(i=0;i<A.length;i++){
    var f=-1;
    for(j=0;j<B.length;j++){ if(!used[j] && dist2(A[i],B[j])<tol){ f=j; break; } }
    if(f<0) return false; used[f]=1;
  }
  return true;
}
/* 计算模板多边形旋转多少度（45度步进）能贴合目标槽位 */
function findReqRot(local,slot){
  var cL=polyCentroid(local), cS=polyCentroid(slot), i;
  var nL=[],nS=[];
  for(i=0;i<local.length;i++) nL.push([local[i][0]-cL[0], local[i][1]-cL[1]]);
  for(i=0;i<slot.length;i++)  nS.push([slot[i][0]-cS[0], slot[i][1]-cS[1]]);
  for(var deg=0;deg<360;deg+=45){
    var r=deg*Math.PI/180, pts=[];
    for(i=0;i<nL.length;i++)
      pts.push([nL[i][0]*Math.cos(r)-nL[i][1]*Math.sin(r), nL[i][0]*Math.sin(r)+nL[i][1]*Math.cos(r)]);
    if(setsMatch(pts,nS,3)) return deg;
  }
  return 0;
}
/* 多边形屏幕变换：绕自身重心旋转 + 缩放 + 平移到 pos */
function xformPoly(poly,pos,rot,scale,c){
  var out=[],i, r=rot*Math.PI/180, cs=Math.cos(r), sn=Math.sin(r);
  for(i=0;i<poly.length;i++){
    var px=(poly[i][0]-c[0])*scale, py=(poly[i][1]-c[1])*scale;
    out.push([ pos[0]+px*cs-py*sn, pos[1]+px*sn+py*cs ]);
  }
  return out;
}
function bboxOf(poly){
  var x1=1e9,y1=1e9,x2=-1e9,y2=-1e9,i;
  for(i=0;i<poly.length;i++){
    if(poly[i][0]<x1)x1=poly[i][0]; if(poly[i][0]>x2)x2=poly[i][0];
    if(poly[i][1]<y1)y1=poly[i][1]; if(poly[i][1]>y2)y2=poly[i][1];
  }
  return {x1:x1,y1:y1,x2:x2,y2:y2,w:x2-x1,h:y2-y1};
}

/* ---------------- 简易音效（WebAudio，无外部依赖） ---------------- */
var AC=null;
function tone(f,dur,type,g){
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(), gn=AC.createGain();
    o.type=type||'sine'; o.frequency.value=f;
    gn.gain.setValueAtTime(g||0.12, AC.currentTime);
    gn.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+dur);
    o.connect(gn); gn.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}
function sndOk(){ tone(523,.15,'sine',.14); setTimeout(function(){tone(659,.15,'sine',.14);},100); setTimeout(function(){tone(784,.25,'sine',.14);},200); }
function sndSnap(){ tone(660,.09,'triangle',.13); }
function sndRot(){ tone(440,.06,'triangle',.08); }
function sndNo(){ tone(200,.2,'square',.05); }

/* ---------------- 配色方案（每局随机挑一个，保证多次玩不腻） ---------------- */
var PALETTES=[
 {bg:'#e8f4fd',ink:'#123a5c',main:'#1f7fd1',mainDark:'#155a99',accent:'#ff9d2e',soft:'#cfe8fa',paper:'#ffffff'},
 {bg:'#fff3e6',ink:'#5c3312',main:'#ef8f2b',mainDark:'#b96a13',accent:'#2fa3c9',soft:'#ffe0bd',paper:'#ffffff'},
 {bg:'#edfbee',ink:'#1d4a24',main:'#3d9e4a',mainDark:'#2a7235',accent:'#e86fa0',soft:'#cdeecf',paper:'#ffffff'},
 {bg:'#f5edfd',ink:'#3f2a5e',main:'#8f5fd6',mainDark:'#6c44aa',accent:'#ffb02e',soft:'#e2d2f7',paper:'#ffffff'},
 {bg:'#fdeef2',ink:'#5e2338',main:'#e2618c',mainDark:'#b4436a',accent:'#3bb2a5',soft:'#f9d3e0',paper:'#ffffff'},
 {bg:'#e8f7f6',ink:'#0f4440',main:'#159e93',mainDark:'#0c7269',accent:'#f2a03d',soft:'#c6ece8',paper:'#ffffff'}
];
var PIECE_COLORS=['#ffd166','#7bdff2','#b5e48c','#f4a6c0','#a9def9','#f9c74f','#90dbf4','#b8f2a6','#fcc2d7','#c3f0e8'];
var PAL=PALETTES[0];
function applyPalette(){
  PAL=PALETTES[Math.floor(Math.random()*PALETTES.length)];
  var root=document.body, p=PAL;
  root.style.setProperty('--bg',p.bg);   root.style.setProperty('--ink',p.ink);
  root.style.setProperty('--main',p.main);root.style.setProperty('--mainDark',p.mainDark);
  root.style.setProperty('--accent',p.accent);root.style.setProperty('--soft',p.soft);
  root.style.setProperty('--paper',p.paper);
}

/* ---------------- 全局状态 ---------------- */
var S={
  screen:'select',        // select | game
  level:1,                // 1初级 2中级 3高级
  rounds:[],              // 本局的关卡列表（随机抽取）
  idx:0,                  // 当前关下标
  round:null,             // 当前关数据
  steps:0,                // 操作步数
  startTime:0, timeBase:0, paused:true, pausedAt:0,   // 计时
  revealed:false,         // 本关是否看过答案
  draggingObj:null,       // 正在拖拽的对象（线端点/线身/图块）
  particles:[]            // 星星粒子
};

/* ---------------- 画布初始化 ---------------- */
var cv=$('stage'), ctx=cv.getContext('2d');
function fitCanvas(){
  var dpr=window.devicePixelRatio||1;
  cv.width=CW*dpr; cv.height=CH*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
fitCanvas();
window.addEventListener('resize',fitCanvas);

/* =====================================================================
   一、剪一剪 关卡（二等分 / 四等分）
   ===================================================================== */
var CUT_SHAPES={
  square:{key:'square',name:'正方形',type:'rect',w:210,h:210,centerSym:true},
  rect  :{key:'rect',  name:'长方形',type:'rect',w:252,h:150,centerSym:true},
  circle:{key:'circle',name:'圆形',  type:'circle',r:106,centerSym:true},
  hex   :{key:'hex',   name:'六边形',type:'hex',r:100,centerSym:true},
  tri   :{key:'tri',   name:'三角形',type:'tri',s:216,centerSym:false}   /* 等边三角形：只能沿中线剪 */
};
/* 生成形状的多边形顶点（中心在 cx,cy） */
function shapePoly(sh,cx,cy){
  var pts=[],i;
  if(sh.type==='rect'){
    pts=[[cx-sh.w/2,cy-sh.h/2],[cx+sh.w/2,cy-sh.h/2],[cx+sh.w/2,cy+sh.h/2],[cx-sh.w/2,cy+sh.h/2]];
  }else if(sh.type==='circle'){
    for(i=0;i<48;i++){ var a=i/48*Math.PI*2; pts.push([cx+sh.r*Math.cos(a), cy+sh.r*Math.sin(a)]); }
  }else if(sh.type==='hex'){
    for(i=0;i<6;i++){ var b=-Math.PI/2+i*Math.PI/3; pts.push([cx+sh.r*Math.cos(b), cy+sh.r*Math.sin(b)]); }
  }else if(sh.type==='tri'){
    var h=sh.s*Math.sqrt(3)/2;
    pts=[[cx,cy-2*h/3],[cx+sh.s/2,cy+h/3],[cx-sh.s/2,cy+h/3]];
  }
  return pts;
}
/* 构建剪一剪关卡：level=1 二等分（一条线），level=2 四等分（两条线） */
function buildCutRound(sh,level){
  var C=[480,240];
  var lines=[];
  if(level===1){
    /* 初始线故意偏离中心（约 38 像素），促使学生动手调整 */
    lines.push({a:[C[0]-170,C[1]+58],b:[C[0]+170,C[1]+18],col:'#e8443a'});
  }else{
    lines.push({a:[C[0]-170,C[1]-46],b:[C[0]+170,C[1]-46],col:'#e8443a'});

  var i,j;
  /* 每组第一个图块作为形状模板，用于计算槽位所需旋转角 */
  var tmpl={};
  for(i=0;i<r.pieces.length;i++){
    var g=r.pieces[i].group;
    if(!tmpl[g]) tmpl[g]=r.pieces[i].local;
  }
  for(i=0;i<r.slots.length;i++){
    var s=r.slots[i];
    s.reqRot = tmpl[s.group] ? findReqRot(tmpl[s.group], s.poly) : 0;
    s.c=polyCentroid(s.poly);
    s.filled=false;
  }
  /* 颜色随机打乱（不泄露哪块是答案） */
  var cols=PIECE_COLORS.slice();
  for(i=cols.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); var c=cols[i];cols[i]=cols[j];cols[j]=c; }
  for(i=0;i<r.pieces.length;i++) r.pieces[i].color=cols[i%cols.length];
  if(r.trayMode==='grid'){
    /* 七巧板托盘：两行格子，打乱顺序与朝向 */
    var homes=[[168,462],[402,462],[636,462],[870,462],[285,566],[519,566],[753,566]];
    var order=r.pieces.map(function(_,k){return k;});
    for(i=order.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); var t2=order[i];order[i]=order[j];order[j]=t2; }
    for(i=0;i<r.pieces.length;i++){
      var pc=r.pieces[order[i]], home=homes[i];
      pc.home={x:home[0],y:home[1],scale:0.62};
      pc.pos=[home[0],home[1]]; pc.scale=0.62; pc.snapped=false; pc.wob=0;
      /* 初始朝向：保证至少要点一下才能放进任何槽位 */
      var cands=[],k;
      for(k=1;k<360/pc.step;k++){
        var rot=k*pc.step,bad=false,m;
        for(m=0;m<r.slots.length;m++){
          if(r.slots[m].group!==pc.group) continue;
          var sym=r.slots[m].sym||360;
          if(((rot-r.slots[m].reqRot)%sym+sym)%sym===0){ bad=true; break; }
        }
        if(!bad) cands.push(rot);
      }
      pc.rot=cands.length?cands[Math.floor(Math.random()*cands.length)]:45;
    }
  }else if(r.trayMode==='row'){
    layoutTray(r);
    var idxs=r.pieces.map(function(_,k){return k;});
    for(i=idxs.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); var t3=idxs[i];idxs[i]=idxs[j];idxs[j]=t3; }
    var homes2=r.pieces.map(function(p){return p.home;});
    for(i=0;i<idxs.length;i++) r.pieces[idxs[i]].home=homes2[i];
    for(i=0;i<r.pieces.length;i++){
      var p2=r.pieces[i];
      p2.pos=[p2.home.x,p2.home.y]; p2.scale=p2.home.scale; p2.snapped=false; p2.wob=0;
      var cands2=[],k2;
      for(k2=0;k2<360/p2.step;k2++){
        var rot2=k2*p2.step,bad2=false,m2;
        if(p2.distract){ bad2=(rot2===0); }
        else{
          for(m2=0;m2<r.slots.length;m2++){
            if(r.slots[m2].group!==p2.group) continue;
            var sym2=r.slots[m2].sym||360;
            if(((rot2-r.slots[m2].reqRot)%sym2+sym2)%sym2===0){ bad2=true; break; }
          }
        }
        if(!bad2) cands2.push(rot2);
      }
      p2.rot=cands2.length?cands2[Math.floor(Math.random()*cands2.length)]:p2.step;
    }
  }else{
    /* attached：剪拼补缺口，图块初始贴在“剪下来”的位置 */
    for(i=0;i<r.pieces.length;i++){
      r.pieces[i].home={x:r.pieces[i].pos[0], y:r.pieces[i].pos[1], scale:1};
      r.pieces[i].snapped=false; r.pieces[i].wob=0;
    }
  }
  r.done=false;
}
/* 托盘布局：自动缩放并排列（保证图块之间留足间距，不重叠） */
function layoutTray(r){
  var scales=[1,0.72,0.56], si, i;
  for(si=0;si<scales.length;si++){
    var sc=scales[si], x=95, y=518, rowW=870, ok=true;
    for(i=0;i<r.pieces.length;i++){
      var pc=r.pieces[i], bb=bboxOf(pc.local), w=Math.max(bb.w,bb.h)*sc+30;
      if(x+w>95+rowW){
        x=95; y+=(si===0?175:132);
        if(y>608){ ok=false; break; }
      }
      pc.home={x:x+w/2, y:y, scale:sc};
      x+=w;
    }
    if(ok) return;
  }
}
/* 尝试把图块吸附进槽位 */
function trySnap(pc){
  var r=S.round, i, over=false;
  for(i=0;i<r.slots.length;i++){
    var s=r.slots[i];
    if(s.filled) continue;
    if(dist2(pc.pos,s.c)<SNAP_DIST){
      over=true;
      if(s.group===pc.group){
        var sym=s.sym||360;
        var diff=((pc.rot-s.reqRot)%sym+sym)%sym;
        if(diff===0){
          s.filled=true; pc.snapped=true;
          pc.pos=[s.c[0],s.c[1]]; pc.rot=s.reqRot; pc.scale=1;
          sndSnap(); S.steps++; updateHud();
          if(allFilled(r)) setTimeout(function(){ completeRound(); },500);
          else setMsg('拼对啦！继续保持～ 🎯');
          return 'ok';
        }else{
          setMsg('形状选对了，可是方向不对：点它转一转再放！🔄');
          return 'rot';
        }
      }
    }
  }
  if(over && pc.distract) setMsg('这一块拼不进去哦，它的形状对不上，换一块试试吧！');
  else if(over) setMsg('这里放不下这一块哦，换个位置试试！');
  return null;
}
function allFilled(r){
  for(var i=0;i<r.slots.length;i++) if(!r.slots[i].filled) return false;
  return true;
}
/* 揭示答案（拼组）：依次把剩余图块飞进槽位 */
function revealSnap(r){
  var list=[],i,j;
  for(i=0;i<r.slots.length;i++){
    if(r.slots[i].filled) continue;
    for(j=0;j<r.pieces.length;j++){
      var pc=r.pieces[j];
      if(!pc.snapped && pc.group===r.slots[i].group){ list.push({slot:r.slots[i],pc:pc}); break; }
    }
  }
  if(!list.length){ completeRound(); return; }
  setMsg('看老师演示：这些块应该放在这里～');
  var k=0;
  function fly(){
    if(k>=list.length){ setTimeout(function(){ completeRound(); },420); return; }
    var it=list[k++], s=it.slot, p=it.pc;
    s.filled=true; p.snapped=true;
    p.pos=[s.c[0],s.c[1]]; p.rot=s.reqRot; p.scale=1;
    sndSnap();
    setTimeout(fly,520);
  }
  fly();
}

/* =====================================================================
   三、关卡流程控制（随机抽取题目）
   ===================================================================== */
function pickN(arr,n){
  var a=arr.slice(),i;
  for(i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; }
  return a.slice(0,n);
}
function buildRounds(level){
  var rs=[],i;
  if(level===1){
    /* 初级：5 种图形里随机抽 4 个做二等分 */
    var keys=['square','rect','circle','hex','tri'];
    var c1=pickN(keys,4);
    for(i=0;i<c1.length;i++) rs.push(buildCutRound(CUT_SHAPES[c1[i]],1));
  }else if(level===2){
    /* 中级：2 道四等分 + 3 道拼组，顺序打乱 */
    var c2=pickN(['square','rect','circle'],2);
    var am=pickN(['a1','a2','a3','a4','al'],3);
    var mix=[];
    for(i=0;i<c2.length;i++) mix.push({t:'c',k:c2[i]});
    for(i=0;i<am.length;i++) mix.push({t:'a',k:am[i]});
    for(i=mix.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=mix[i];mix[i]=mix[j];mix[j]=t; }
    for(i=0;i<mix.length;i++) rs.push(mix[i].t==='c'?buildCutRound(CUT_SHAPES[mix[i].k],2):buildAsmRound(mix[i].k));
  }else{
    /* 高级：剪拼综合 + 七巧板，全部随机排序 */
    var mix3=pickN(['p1','p2','p3','tan'],4);
    for(i=0;i<mix3.length;i++) rs.push(mix3[i]==='tan'?buildTangramRound():buildPatchRound(mix3[i]));
  }
  return rs;
}
function startLevel(level){
  S.level=level; S.rounds=buildRounds(level); S.idx=0; S.steps=0;
  S.revealed=false; S.screen='game';
  $('select-screen').style.display='none';
  $('game-screen').style.display='block';
  resetTimer();
  showRules(level);
  loadRound();
}
function loadRound(){
  if(S.idx>=S.rounds.length){ finishGame(); return; }
  S.round=S.rounds[S.idx]; S.revealed=false;
  var r=S.round;
  $('task-text').textContent='【第 '+(S.idx+1)+' / '+S.rounds.length+' 关 · '+levelName()+'】'+r.text;
  $('btn-cut').style.display=(r.kind==='cut')?'inline-block':'none';
  setMsg('这一关开始啦，动手试试吧！💪');
  updateHud();
}
function levelName(){ return S.level===1?'初级':(S.level===2?'中级':'高级'); }
function completeRound(){
  if(!S.round||S.round.done) return;
  S.round.done=true;
  burst(480,300);
  sndOk();
  var isLast=(S.idx>=S.rounds.length-1);
  $('next-title').textContent=S.revealed?'看了答案，也是收获！':'本关完成！';
  $('next-stars').textContent=S.level===1?'⭐':(S.level===2?'⭐⭐':'⭐⭐⭐');
  $('next-body').innerHTML=S.revealed
    ? '看懂老师的演示了吗？点「重新开始」再自己试一次，会更厉害哦！'
    : (isLast?'太厉害了，这是最后一关！':'剪拼小魔法又进步了一点！');
  $('btn-next').textContent=isLast?'查看成绩 🏆':'下一关 ➜';
  $('next-modal').classList.add('show');
  pauseTimer();
}
function nextRound(){
  $('next-modal').classList.remove('show');
  resumeTimer();
  S.idx++;
  if(S.idx>=S.rounds.length){ finishGame(); return; }
  loadRound();
}
function finishGame(){
  /* 全部通关：彩纸庆祝 + 成绩单 */
  $('next-modal').classList.remove('show');
  confettiBurst();
  sndOk(); setTimeout(sndOk,500); setTimeout(sndOk,1000);
  $('next-title').textContent='🏆 全部通关！';
  $('next-stars').textContent='🌟 🌟 🌟 🌟 🌟';
  $('next-body').innerHTML='<div id="final-stats">难度：'+levelName()+'　⏱ 用时：<b>'+elapsed()+'</b>　👣 操作步数：<b>'+S.steps+'</b><br>你已经是剪拼图形的小魔法师啦！</div>';
  $('btn-next').textContent='返回难度选择 🏠';
  $('next-modal').classList.add('show');
  S._finalBtn=true;
}
function backToSelect(){
  stopTimer();
  S.screen='select'; S.round=null; S._finalBtn=false;
  $('next-modal').classList.remove('show');   /* 关闭可能还开着的过关/成绩弹窗 */
  $('game-screen').style.display='none';
  $('select-screen').style.display='block';
}
function restartRound(){
  if(S.screen!=='game'||!S.round) return;
  var r=S.round;
  if(r.kind==='cut'){
    S.rounds[S.idx]=buildCutRound(r.shape,r.level);
  }else{
    S.rounds[S.idx]=r._key==='tan'?buildTangramRound()
      :(r._key==='p1'||r._key==='p2'||r._key==='p3')?buildPatchRound(r._key)
      :buildAsmRound(r._key);
  }
  S.round=S.rounds[S.idx];
  loadRound();
  setMsg('重新开始这一关，再来一次！💪');
}

/* =====================================================================
   四、绘制
   ===================================================================== */
function drawPoly(poly,fill,stroke,lw,dash){
  ctx.beginPath();
  ctx.moveTo(poly[0][0],poly[0][1]);
  for(var i=1;i<poly.length;i++) ctx.lineTo(poly[i][0],poly[i][1]);
  ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){
    ctx.strokeStyle=stroke; ctx.lineWidth=lw||3; ctx.lineJoin='round'; ctx.lineCap='round';
    if(dash) ctx.setLineDash(dash);
    ctx.stroke(); ctx.setLineDash([]);
  }
}
/* 画固定图形（可用 destination-out 挖掉缺口） */
function drawFixed(f){
  ctx.save();
  function path(poly){
    ctx.beginPath();
    ctx.moveTo(poly[0][0],poly[0][1]);
    for(var i=1;i<poly.length;i++) ctx.lineTo(poly[i][0],poly[i][1]);
    ctx.closePath();
  }
  path(f.poly);
  ctx.fillStyle=PAL.soft; ctx.fill();
  if(f.cutPoly||f.cut2){
    ctx.globalCompositeOperation='destination-out';
    var holes=[];
    if(f.cutPoly) holes.push(f.cutPoly);
    if(f.cut2) holes=holes.concat(f.cut2);
    for(var i=0;i<holes.length;i++){ path(holes[i]); ctx.fill(); }
    ctx.globalCompositeOperation='source-over';
  }
  path(f.poly);
  ctx.strokeStyle=PAL.mainDark; ctx.lineWidth=4; ctx.stroke();
  ctx.restore();
}
/* 剪刀关卡绘制 */
function drawCutRound(r){
  var C=r.center, t=performance.now()/1000;
  if(r.phase==='edit'){
    drawPoly(r.poly,PAL.soft,PAL.mainDark,4);
    /* 中心红点（脉动） */
    ctx.beginPath(); ctx.arc(C[0],C[1],7+Math.sin(t*4)*2,0,7);
    ctx.fillStyle='#e8443a'; ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2.5; ctx.stroke();
    if(!r.shape.centerSym){
      /* 三角形：把三个顶点标成金色，提示“中线” */
      for(var k=0;k<3;k++){
        ctx.beginPath(); ctx.arc(r.poly[k][0],r.poly[k][1],7,0,7);
        ctx.fillStyle='#ffb02e'; ctx.fill();
        ctx.strokeStyle='#fff'; ctx.lineWidth=2.5; ctx.stroke();
      }
    }
    drawLines(r,false);
  }else if(r.piecesAnim){
    var pa=r.piecesAnim;
    /* 阶段动画：先分开（split 0→1），再重叠对比（match 0→1） */
    if(pa.split<1) pa.split=Math.min(1,pa.split+0.030);
    else if(pa.match<1) pa.match=Math.min(1,pa.match+0.026);
    var sep=pa.split*(1-pa.match), rot=pa.match;
    for(var i=0;i<pa.defs.length;i++){
      var d=pa.defs[i];
      var off=[d.off[0]*sep, d.off[1]*sep], rr=d.rot*rot;
      ctx.save();
      ctx.translate(off[0],off[1]);
      if(rr){ ctx.translate(C[0],C[1]); ctx.rotate(rr*Math.PI/180); ctx.translate(-C[0],-C[1]); }
      for(var m=0;m<d.regs.length;m++){
        var hp=halfPlane(d.regs[m][0].a,d.regs[m][0].b,d.regs[m][1]);
        ctx.beginPath();
        ctx.moveTo(hp[0][0],hp[0][1]);
        for(var q=1;q<hp.length;q++) ctx.lineTo(hp[q][0],hp[q][1]);
        ctx.closePath(); ctx.clip();
      }
      drawPoly(r.poly, i===0?PAL.soft:PIECE_COLORS[i%PIECE_COLORS.length], PAL.mainDark, 3.5);
      ctx.restore();
    }
    /* 原位置轮廓虚线 */
    drawPoly(r.poly,null,'rgba(0,0,0,.22)',2,[8,7]);
    if(pa.match>=1 && !pa.doneMsg){
      pa.doneMsg=true;
    }
    if(pa.match>=1){
      ctx.font='900 62px "Microsoft YaHei",sans-serif';
      ctx.textAlign='center';
      if(r.verdict){ ctx.fillStyle='#2fae4f'; ctx.fillText('✔',C[0],C[1]+158); }
      else{ ctx.fillStyle='#e8443a'; ctx.fillText('✘',C[0],C[1]+158); }
    }
    drawLines(r,true);
  }
}
function drawLines(r,dim){
  for(var i=0;i<r.lines.length;i++){
    var l=r.lines[i];
    ctx.beginPath(); ctx.moveTo(l.a[0],l.a[1]); ctx.lineTo(l.b[0],l.b[1]);
    ctx.strokeStyle=dim?'rgba(140,140,140,.55)':l.col; ctx.lineWidth=5; ctx.lineCap='round'; ctx.stroke();
    if(!dim){
      ctx.beginPath(); ctx.arc(l.a[0],l.a[1],16,0,7); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=l.col; ctx.lineWidth=4; ctx.stroke();
      ctx.beginPath(); ctx.arc(l.b[0],l.b[1],16,0,7); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=l.col; ctx.lineWidth=4; ctx.stroke();
    }
  }
}
/* 拼图关卡绘制 */
function drawSnapRound(r){
  var i,t=performance.now()/1000;
  for(i=0;i<r.targetPolys.length;i++)
    drawPoly(r.targetPolys[i],'rgba(255,255,255,.6)',PAL.mainDark,4,[12,9]);
  /* 目标轮廓内的单位网格点（帮助比较宽窄高矮） */
  if(r.gridTarget){
    var bb=bboxOf(r.gridTarget), u=r._gu||(r._gu=guessUnit(r));
    ctx.fillStyle='rgba(0,0,0,.18)';
    for(var gx=bb.x1+u;gx<bb.x2-2;gx+=u){
      for(var gy=bb.y1+u;gy<bb.y2-2;gy+=u){
        if(inPoly([gx,gy],r.gridTarget)){ ctx.beginPath(); ctx.arc(gx,gy,2.6,0,7); ctx.fill(); }
      }
    }
  }
  if(r.targetLabel){
    ctx.font='700 21px "Microsoft YaHei",sans-serif'; ctx.fillStyle=PAL.mainDark; ctx.textAlign='center';
    ctx.fillText(r.targetLabel,480,84);
  }
  for(i=0;i<r.fixedPolys.length;i++) drawFixed(r.fixedPolys[i]);
  /* 未填槽位：脉动虚线 */
  ctx.save();
  ctx.setLineDash([9,7]); ctx.lineDashOffset=-t*32;
  for(i=0;i<r.slots.length;i++){
    if(r.slots[i].filled) continue;
    drawPoly(r.slots[i].poly,null,PAL.accent,3.5);
  }
  ctx.restore();
  /* 已吸附的块 */
  for(i=0;i<r.pieces.length;i++) if(r.pieces[i].snapped) drawPiece(r.pieces[i],true,false);
  /* 未吸附的块（拖动中的最后画，在最上层） */
  for(i=0;i<r.pieces.length;i++){
    var p2=r.pieces[i];
    if(p2.snapped||p2===S.draggingObj) continue;
    drawPiece(p2,false,false);
  }
  if(S.draggingObj&&S.draggingObj.local) drawPiece(S.draggingObj,false,true);
}
function guessUnit(r){
  if(!r.slots||!r.slots.length) return 40;
  var bb=bboxOf(r.slots[0].poly);
  return Math.max(26,Math.min(bb.w,bb.h));
}
function drawPiece(pc,snapped,dragging){
  var c=polyCentroid(pc.local);
  var sc=(pc.scale==null)?1:pc.scale;   /* 未设置缩放时按 1 处理 */
  var poly=xformPoly(pc.local,pc.pos,pc.rot||0,sc,c);
  if(pc.wob){ /* 弹回时的左右抖动 */
    var rc=polyCentroid(poly), w=Math.sin(pc.wob*26)*7*pc.wob;
    poly=poly.map(function(p){ return rotPt(p,rc,w); });
  }
  ctx.save();
  if(dragging){ ctx.shadowColor='rgba(0,0,0,.35)'; ctx.shadowBlur=16; ctx.shadowOffsetY=7; }
  drawPoly(poly,pc.color,dragging?PAL.ink:PAL.mainDark,dragging?4:3);
  ctx.restore();
  if(snapped){
    var cc=polyCentroid(poly);
    ctx.font='900 25px sans-serif'; ctx.fillStyle='#2fae4f'; ctx.textAlign='center';
    ctx.fillText('✔',cc[0],cc[1]+9);
  }
}
/* 星星粒子 */
function burst(x,y){
  for(var i=0;i<26;i++){
    var a=Math.random()*Math.PI*2, v=2+Math.random()*4;
    S.particles.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,life:1,
      col:PIECE_COLORS[i%PIECE_COLORS.length],star:Math.random()<0.5});
  }
}
function drawParticles(){
  for(var i=S.particles.length-1;i>=0;i--){
    var p=S.particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.life-=0.014;
    if(p.life<=0){ S.particles.splice(i,1); continue; }
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.col;
    if(p.star){
      ctx.font='700 20px sans-serif'; ctx.textAlign='center';
      ctx.fillText('★',p.x,p.y);
    }else{
      ctx.beginPath(); ctx.arc(p.x,p.y,5*p.life+1,0,7); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
}
/* 主渲染循环 */
function render(){
  ctx.clearRect(0,0,CW,CH);
  if(S.screen==='game'&&S.round){
    if(S.round.kind==='cut') drawCutRound(S.round);
    else drawSnapRound(S.round);
  }
  drawParticles();
  requestAnimationFrame(render);
}

/* =====================================================================
   五、交互（指针事件：拖线 / 拖块 / 点按旋转；鼠标触摸都支持）
   ===================================================================== */
function evtPos(e){
  var r=cv.getBoundingClientRect();
  return [ (e.clientX-r.left)*CW/r.width, (e.clientY-r.top)*CH/r.height ];
}
var down=null;
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();
  if(S.screen!=='game'||!S.round||S.round.done) return;
  var p=evtPos(e);
  down={p:p,t:performance.now(),moved:false};
  if(S.round.kind==='cut'){
    if(S.round.phase!=='edit'){ down=null; return; }
    var grab=null, L=S.round.lines, i;
    for(i=0;i<L.length;i++){                       /* 优先抓端点 */
      if(dist2(p,L[i].a)<28) grab={type:'end',li:i,ei:'a'};
      else if(dist2(p,L[i].b)<28) grab={type:'end',li:i,ei:'b'};
    }
    if(!grab){                                     /* 其次抓线身（整体平移） */
      for(i=0;i<L.length;i++){
        if(distToLine(p,L[i].a,L[i].b)<18 && inSegRange(p,L[i].a,L[i].b)){ grab={type:'line',li:i}; break; }
      }
    }
    S.draggingObj=grab;
  }else{
    var pc=null;
    for(var k=S.round.pieces.length-1;k>=0;k--){   /* 从上层往下找可拖的块 */
      var q=S.round.pieces[k];
      if(q.snapped) continue;
      var c=polyCentroid(q.local);
      var lp=[ (p[0]-q.pos[0])/(q.scale||1), (p[1]-q.pos[1])/(q.scale||1) ];
      lp=rotPt(lp,[0,0],-(q.rot||0));
      lp=[lp[0]+c[0], lp[1]+c[1]];
      if(inPoly(lp,q.local)){ pc=q; break; }
    }
    S.draggingObj=pc;
    if(pc){ pc._off=[p[0]-pc.pos[0], p[1]-pc.pos[1]]; pc._grow=true; }
  }
  if(S.draggingObj){ try{ cv.setPointerCapture(e.pointerId); }catch(err){} }
});
function inSegRange(p,a,b){
  return p[0]>Math.min(a[0],b[0])-30 && p[0]<Math.max(a[0],b[0])+30 &&
         p[1]>Math.min(a[1],b[1])-30 && p[1]<Math.max(a[1],b[1])+30;
}
cv.addEventListener('pointermove',function(e){
  if(!down||!S.draggingObj) return;
  var p=evtPos(e);
  if(dist2(p,down.p)>6) down.moved=true;
  var g=S.draggingObj;
  if(S.round.kind==='cut'){
    var L=S.round.lines[g.li];
    if(g.type==='end'){ L[g.ei][0]=p[0]; L[g.ei][1]=p[1]; }
    else{
      var dx=p[0]-down.p[0], dy=p[1]-down.p[1];
      L.a[0]+=dx; L.a[1]+=dy; L.b[0]+=dx; L.b[1]+=dy;
      down.p=p;
    }
  }else if(g.local){
    g.pos[0]=p[0]-g._off[0]; g.pos[1]=p[1]-g._off[1];
    if(g._grow&&g.scale<1) g.scale=Math.min(1,g.scale+0.07);
  }
});
cv.addEventListener('pointerup',function(e){
  if(!down) return;
  var g=S.draggingObj;
  var quick=(performance.now()-down.t)<400 && !down.moved;
  if(S.round&&S.round.kind==='snap'&&g&&g.local){
    if(quick){
      /* 点按 = 旋转一步 */
      g.rot=((g.rot||0)+g.step)%360;
      sndRot();
      setMsg('转了一小圈！方向对了吗？🤔');
      S.steps++; updateHud();
    }else{
      if(trySnap(g)!=='ok') flyBack(g);
    }
  }
  S.draggingObj=null; down=null;
});
cv.addEventListener('pointercancel',function(){
  if(S.round&&S.round.kind==='snap'&&S.draggingObj&&S.draggingObj.local) flyBack(S.draggingObj);
  S.draggingObj=null; down=null;
});
/* 图块飞回托盘（带小抖动） */
function flyBack(pc){
  var hx=pc.home.x, hy=pc.home.y, hs=pc.home.scale;
  var sx=pc.pos[0], sy=pc.pos[1], sr=pc.scale||1;
  var t0=performance.now();
  function st(now){
    var k=Math.min(1,(now-t0)/350), e=k*k*(3-2*k);
    pc.pos[0]=sx+(hx-sx)*e; pc.pos[1]=sy+(hy-sy)*e; pc.scale=sr+(hs-sr)*e;
    if(k<1) requestAnimationFrame(st);
    else{
      pc.wob=1;
      var iv=setInterval(function(){ pc.wob-=0.07; if(pc.wob<=0){ pc.wob=0; clearInterval(iv); } },33);
    }
  }
  requestAnimationFrame(st);
}

/* =====================================================================
   六、UI 胶水（计时/步数/规则/按钮）
   ===================================================================== */
function setMsg(t){ $('msg').textContent=t; }
function updateHud(){ $('hud-steps').textContent=S.steps; }
function resetTimer(){ S.startTime=Date.now(); S.timeBase=0; S.paused=true; S.pausedAt=Date.now(); showTimer(0); }
function pauseTimer(){ if(!S.paused){ S.paused=true; S.pausedAt=Date.now(); } }
function resumeTimer(){ if(S.paused&&S.screen==='game'){ S.timeBase+=Date.now()-S.pausedAt; S.paused=false; } }
function stopTimer(){ S.paused=true; }
function elapsedMs(){
  if(!S.startTime) return 0;
  var running=S.paused?0:(Date.now()-S.pausedAt);
  return S.timeBase+running;
}
function fmt(ms){
  var s=Math.floor(ms/1000), m=Math.floor(s/60); s=s%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function elapsed(){ return fmt(elapsedMs()); }
function showTimer(ms){ $('hud-timer').textContent=fmt(ms); }
setInterval(function(){ if(S.screen==='game') showTimer(elapsedMs()); },500);

/* 规则说明（进入时弹出，可随时再看） */
var RULES={
  1:'<ul>\
      <li>✂️ <b>拖动红线两端的白色小圆点</b>，摆好魔法剪刀线的位置（拖线中间可以整条移动）。</li>\
      <li>中心的<b>小红点</b>是图形的中心：让线正好穿过它，剪出的两块就会<b>完全一样</b>！</li>\
      <li>摆好后点<b>「咔嚓剪开」</b>，工坊会真的把图形剪开，还会把两块叠在一起比一比。</li>\
      <li>三角形的秘密：让线<b>同时穿过中心红点和一个金色顶点</b>（这就是“中线”）。</li>\
      <li>卡住了可以点<b>「揭示答案」</b>看老师演示；点「重新开始」可以重玩本关。</li>\
    </ul>',
  2:'<ul>\
      <li>✂️ <b>四等分</b>：摆好<b>两条线</b>再点「咔嚓剪开」。两条线都要穿过中心点，还要像“十”字一样<b>互相垂直</b>（长方形要一刀横、一刀竖）。</li>\
      <li>🧩 <b>拼组</b>：<b>点一下</b>托盘里的图块让它转一转，再<b>拖到</b>虚线轮廓里松手，放对了会自动吸附并打上绿色对勾。</li>\
      <li>先观察每块图形的<b>宽窄和高矮</b>，想一想哪几块能拼成目标图形（轮廓里的小圆点是一个格子的大小）。</li>\
      <li>放错的块会被弹回托盘，换一块再试就好啦。</li>\
    </ul>',
  3:'<ul>\
      <li>✂️ <b>剪拼补缺口</b>：图形多出来的部分已经沿虚线剪下来了，把它<b>拖到缺口处</b>补一补，就能变出正方形或长方形（这就是“割补”的魔法！）。</li>\
      <li>🧩 <b>七巧板</b>：7 块小板（5 个三角形、1 个正方形、1 个平行四边形），<b>点一下旋转</b>，全部拼进大正方形轮廓就胜利！</li>\
      <li>小窍门：先摆最大、最特殊的块，再慢慢调整其他块的位置和方向。</li>\
    </ul>'
};
function showRules(level){
  $('rules-title').textContent='玩法说明 · '+ (level===1?'初级':level===2?'中级':'高级') +'关';
  $('rules-body').innerHTML=RULES[level]||RULES[1];

}

(function(){

/* =====================================================================
   七、全屏彩纸庆祝（通关用）
   ===================================================================== */
var cf=$('confetti'), cfx=cf.getContext('2d');
var cfParts=[], cfRun=false;
function confettiBurst(){
  cf.style.display='block';
  cf.width=window.innerWidth; cf.height=window.innerHeight;
  cfParts=[];
  for(var i=0;i<220;i++){
    cfParts.push({x:Math.random()*cf.width, y:-30-Math.random()*cf.height*0.5,
      vx:(Math.random()-0.5)*2.4, vy:2+Math.random()*3.4, s:7+Math.random()*8,
      rot:Math.random()*360, vr:(Math.random()-0.5)*12,
      col:PIECE_COLORS[i%PIECE_COLORS.length]});
  }
  if(!cfRun){ cfRun=true; cfLoop(); }
}
function cfLoop(){
  cfx.clearRect(0,0,cf.width,cf.height);
  var alive=false,i;
  for(i=0;i<cfParts.length;i++){
    var p=cfParts[i];
    p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.vy+=0.02;
    if(p.y<cf.height+40){
      alive=true;
      cfx.save(); cfx.translate(p.x,p.y); cfx.rotate(p.rot*Math.PI/180);
      cfx.fillStyle=p.col; cfx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
      cfx.restore();
    }
  }
  if(alive) requestAnimationFrame(cfLoop);
  else{ cfRun=false; cf.style.display='none'; }
}

/* =====================================================================

applyPalette();          /* 每局随机配色 */
updateHud();
requestAnimationFrame(render);
})();
