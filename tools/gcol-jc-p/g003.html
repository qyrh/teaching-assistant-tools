<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>正负探险岛 · 2.1 正数与负数</title>
<style>
/* ================= 主题配色（每局从预设色板随机抽取，见 applyTheme） ================= */
:root{
  --c-main:#1565d8; --c-deep:#0d47a1; --c-bg:#eef4fd; --c-card:#ffffff;
  --c-accent:#ff9800; --c-ok:#2e9e5b; --c-bad:#e53935; --c-ink:#22303f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  background:var(--c-bg); color:var(--c-ink); font-size:clamp(15px,1.9vw,18px);
}
#app{max-width:1060px;margin:0 auto;padding:10px 14px 40px;}
/* ================= 顶栏：标题 + 计时 + 步数（右上角实时显示） ================= */
header{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
  gap:8px;padding:10px 14px;background:var(--c-main);color:#fff;border-radius:16px;
  box-shadow:0 4px 14px rgba(20,40,80,.18);
}
.logo{font-size:clamp(20px,2.6vw,26px);font-weight:900;letter-spacing:1px;}
.hud{display:flex;gap:14px;flex-wrap:wrap;font-weight:800;font-size:clamp(15px,1.9vw,18px);}
.hud b{background:rgba(255,255,255,.22);padding:3px 10px;border-radius:10px;}
/* ================= 工具条按钮 ================= */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.btn{
  border:none;border-radius:12px;padding:10px 18px;font-size:clamp(15px,1.9vw,17px);
  font-weight:800;cursor:pointer;background:var(--c-card);color:var(--c-main);
  border:3px solid var(--c-main); transition:transform .12s;
}
.btn:active{transform:scale(.96);}
.btn.primary{background:var(--c-main);color:#fff;}
.btn.warn{border-color:var(--c-accent);color:#c66a00;background:#fff6e8;}
.btn.hollow{background:transparent;}
/* ================= 舞台 ================= */
.stage{background:var(--c-card);border-radius:18px;padding:14px;box-shadow:0 3px 12px rgba(20,40,80,.10);min-height:480px;}
.lv-head{
  font-size:clamp(19px,2.4vw,24px);font-weight:900;color:var(--c-deep);
  border-left:10px solid var(--c-accent);padding-left:12px;margin-bottom:8px;
}
.ctx-card{
  background:var(--c-bg);border:2px dashed var(--c-main);border-radius:14px;
  padding:10px 14px;line-height:1.7;margin-bottom:12px;
}
.ctx-card b{color:var(--c-deep);}
/* ================= 通用卡片（可拖物体） ================= */
.mcard{
  width:86px;height:62px;border-radius:12px;background:#fff;border:3px solid var(--c-main);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:900;font-size:24px;cursor:grab;touch-action:none;user-select:none;position:relative;
}
.mcard small{font-size:13px;color:#68788a;font-weight:700;line-height:1;}
.mcard.dragging{position:fixed;z-index:999;pointer-events:none;margin:0;box-shadow:0 10px 24px rgba(0,0,0,.25);}
.mcard.locked{cursor:default;border-color:var(--c-ok);background:#e9f9ef;}
.mcard .tag{
  position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--c-accent);
  color:#fff;font-size:12px;padding:1px 8px;border-radius:8px;white-space:nowrap;font-weight:800;
}
.drag-ph{border:2px dashed #b8c4d4;border-radius:12px;background:rgba(180,200,230,.15);}
/* ================= 第1关：数轴调度 ================= */
.axis-wrap{position:relative;width:100%;}
.axis-wrap svg{display:block;width:100%;height:auto;}
#ghost,#mover,#starMark{position:absolute;transform:translateX(-50%);pointer-events:none;transition:left .55s ease;}
#ghost{opacity:.38;font-size:34px;top:12%;}
#mover{font-size:40px;top:9%;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25));z-index:3;}
#starMark{top:1.5%;text-align:center;color:#f2a900;}
.slots-row{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0 6px;align-items:center;}
.slot{
  width:94px;height:70px;border:3px dashed var(--c-accent);border-radius:14px;
  display:flex;align-items:center;justify-content:center;background:#fffaf0;
}
.slot .mcard{width:88px;height:62px;}
.pool-row{
  display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;padding:12px;
  background:var(--c-bg);border-radius:14px;min-height:88px;
}
/* ================= 第2关：集合圈 ================= */
.venv-wrap{position:relative;width:100%;}
.venv-wrap svg{display:block;width:100%;height:auto;}
.venv-wrap .mcard{width:74px;height:54px;font-size:20px;}
.venv-wrap .mcard.placed{position:absolute;transform:translate(-50%,-50%);margin:0;}
.pool2{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;padding:12px;background:var(--c-bg);border-radius:14px;min-height:88px;}
/* ================= 第3关：基准插旗 ================= */
.l3flex{display:flex;gap:14px;align-items:flex-start;}
.l3scene{flex:1 1 640px;min-width:0;}
.scene-wrap{position:relative;width:100%;}
.scene-wrap svg{display:block;width:100%;height:auto;}
#flag{
  position:absolute;left:30%;width:46px;height:52px;cursor:grab;touch-action:none;user-select:none;z-index:5;
}
#flag .pole{position:absolute;left:8px;top:2px;width:5px;height:46px;background:#5a3e1b;border-radius:3px;}
#flag .cloth{
  position:absolute;left:13px;top:2px;width:0;height:0;
  border-top:12px solid transparent;border-bottom:12px solid transparent;border-left:30px solid var(--c-bad);
}
#flag .base{position:absolute;left:2px;top:42px;width:17px;height:10px;background:#5a3e1b;border-radius:50%;}
.task-panel{flex:0 0 300px;display:flex;flex-direction:column;gap:10px;}
.task-card{
  border:3px solid #c6d2e2;border-radius:14px;padding:10px 12px;line-height:1.55;background:#fff;
}
.task-card.cur{border-color:var(--c-accent);background:#fff8ec;box-shadow:0 3px 10px rgba(240,150,30,.25);}
.task-card.done{border-color:var(--c-ok);background:#eefbf2;color:#1d7a44;}
.task-card .hint{color:#c66a00;font-size:14px;font-weight:700;}
/* ================= 第4关：符号规律 ================= */
.seq-wrap{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px;}
.seq-pill{
  min-width:64px;text-align:center;padding:8px 10px;border-radius:12px;font-weight:900;font-size:20px;
  background:#eef4fd;border:2px solid var(--c-main);color:var(--c-deep);
}
.seq-pill.neg{background:#fdeeee;border-color:var(--c-bad);color:#b3271f;}
.blank{
  width:110px;height:92px;border:3px dashed var(--c-accent);border-radius:14px;background:#fffaf0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;touch-action:none;
}
.blank .q{font-size:15px;font-weight:800;color:#68788a;}
.blank .s{font-size:36px;font-weight:900;line-height:1;color:#b9c4d2;}
.blank.filled .s{color:var(--c-deep);}
.blank.ok{border:3px solid var(--c-ok);background:#eefbf2;}
.blank.ok .s{color:var(--c-ok);}
.blank.bad{border:3px solid var(--c-bad);background:#fdecec;}
.blank.bad .s{color:var(--c-bad);}
.signsrc{
  width:74px;height:74px;border-radius:16px;background:#fff;border:4px solid var(--c-main);
  display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;color:var(--c-main);
  cursor:grab;touch-action:none;user-select:none;
}
.sign-row{display:flex;gap:20px;align-items:center;margin-top:8px;flex-wrap:wrap;}
/* ================= 难度选择 ================= */
.diff-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;}
.diff-card{
  flex:1 1 220px;border:4px solid var(--c-main);border-radius:18px;background:#fff;padding:18px 16px;
  cursor:pointer;text-align:center;transition:transform .15s;
}
.diff-card:hover{transform:translateY(-4px);}
.diff-card h3{margin:6px 0;font-size:24px;color:var(--c-deep);}
.diff-card .stars{font-size:22px;color:#f2a900;}
.diff-card p{color:#57677a;line-height:1.6;font-size:15px;}
.intro-list{line-height:1.9;}
/* ================= 弹窗 / 提示 / 覆盖层 ================= */
.modal{
  position:fixed;inset:0;background:rgba(20,35,60,.55);display:flex;align-items:center;justify-content:center;
  z-index:100;padding:16px;
}
.modal .box{
  background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:86vh;overflow:auto;
  padding:22px 26px;line-height:1.8;box-shadow:0 12px 40px rgba(0,0,0,.3);
}
.modal h2{margin:0 0 10px;color:var(--c-deep);font-size:26px;}
#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(30,40,60,.92);
  color:#fff;padding:10px 20px;border-radius:14px;font-size:16px;font-weight:700;z-index:200;
  opacity:0;pointer-events:none;transition:opacity .25s;max-width:86vw;text-align:center;
}
#toast.show{opacity:1;}
.overlay{
  position:fixed;inset:0;background:rgba(18,32,58,.66);display:flex;align-items:center;justify-content:center;
  z-index:150;padding:16px;
}
.overlay .box{background:#fff;border-radius:20px;padding:30px 34px;text-align:center;max-width:520px;width:100%;box-shadow:0 14px 44px rgba(0,0,0,.35);}
.overlay h2{margin:0 0 8px;font-size:30px;color:var(--c-deep);}
.overlay .bigstars{font-size:44px;letter-spacing:8px;color:#f2a900;}
.overlay .meta{margin:10px 0 18px;font-size:18px;color:#57677a;line-height:1.7;}
.overlay .btnrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
#confettiCvs{position:fixed;inset:0;pointer-events:none;z-index:300;}
@media (max-width:760px){
  .l3flex{flex-direction:column;}
  .task-panel{flex-direction:row;flex-wrap:wrap;width:100%;}
  .task-card{flex:1 1 240px;}
  .mcard{width:74px;height:56px;font-size:20px;}
  .slot{width:82px;height:64px;}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">🧭 正负探险岛</div>
    <div class="hud">
      <span>⏱ <b id="timer">00:00</b></span>
      <span>👣 <b id="steps">0</b> 步</span>
      <span>🏔️ <b id="lvlname">—</b></span>
    </div>
  </header>
  <div class="toolbar" id="toolbar" style="display:none;">
    <button class="btn" id="btnRules">📖 规则</button>
    <button class="btn warn" id="btnReveal">💡 揭示答案</button>
    <button class="btn" id="btnRestart">🔄 重新开始</button>
    <button class="btn hollow" id="btnBack">🏠 返回难度选择</button>
  </div>
  <div class="stage" id="stage"></div>
</div>
<div id="toast"></div>
<canvas id="confettiCvs"></canvas>

<script>
/* =====================================================================
   正负探险岛 —— 初中数学《2.1 正数与负数》互动游戏
   四个关卡全部围绕本章核心方法设计：
   第1关 方向调度站：用正负数表示相反方向的运动，拖卡组合凑目标（正负数加法）
   第2关 数字分拣湾：有理数分类，把数字卡拖进集合圈 / 交集 / 圈外
   第3关 基准插旗峰：改变基准（参照标准）后读数实时变化，理解"基准决定正负"
   第4关 符号星光路：符号规律探究，把 + / − 符号牌拖到数列空位
   ===================================================================== */

/* ---------------- 基础工具 ---------------- */
function $(s){return document.querySelector(s);}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s));}
function el(tag,cls,html){var d=document.createElement(tag);if(cls)d.className=cls;if(html!=null)d.innerHTML=html;return d;}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
/* 带符号格式化：+7 / -4.5 / 0 */
function fmt(v){
  if(Math.abs(v-Math.round(v))<1e-9){v=Math.round(v);}else{v=Math.round(v*10)/10;}
  if(v===0)return '0';
  return v>0?('+'+v):(''+v);
}
function round1(v){return Math.round(v*10)/10;}

/* ---------------- 全局状态 ---------------- */
var state={
  diff:0,        /* 0初级 1中级 2高级 */
  level:1,       /* 当前关卡 1..4 */
  steps:0,       /* 步数 */
  startTs:0,     /* 开始时间戳 */
  timerId:null,  /* 计时器 */
  running:false, /* 是否计时中 */
  q1:null,q2:null,q3:null,q4:null,   /* 各关题目数据 */
  busy:false,
  revealed:false
};
var DIFF_NAMES=['初级','中级','高级'];
function levelName(n){return ['第 1 关 · 方向调度站','第 2 关 · 数字分拣湾','第 3 关 · 基准插旗峰','第 4 关 · 符号星光路'][n-1];}

/* ---------------- 随机色板（G8：每局随机主色） ---------------- */
var PALETTES=[
  {main:'#1565d8',deep:'#0d47a1',bg:'#e9f1fd',accent:'#ff9800'},
  {main:'#2e7d32',deep:'#1b5e20',bg:'#eaf6ea',accent:'#ff7043'},
  {main:'#ef6c00',deep:'#b55300',bg:'#fdf0e2',accent:'#5c6bc0'},
  {main:'#7b1fa2',deep:'#4a148c',bg:'#f4e9f9',accent:'#26a69a'},
  {main:'#00838f',deep:'#005662',bg:'#e4f4f6',accent:'#f06292'}
];
function applyTheme(){
  var p=pick(PALETTES);
  var r=document.documentElement.style;
  r.setProperty('--c-main',p.main);
  r.setProperty('--c-deep',p.deep);
  r.setProperty('--c-bg',p.bg);
  r.setProperty('--c-accent',p.accent);
}

/* ---------------- 计时器与步数 ---------------- */
function startTimer(){
  state.startTs=Date.now();state.running=true;
  if(state.timerId)clearInterval(state.timerId);
  state.timerId=setInterval(function(){
    var s=Math.floor((Date.now()-state.startTs)/1000);
    var m=Math.floor(s/60);s=s%60;
    $('#timer').textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  },500);
}
function stopTimer(){state.running=false;if(state.timerId)clearInterval(state.timerId);}
function addStep(){state.steps++;$('#steps').textContent=state.steps;}

/* ---------------- 提示气泡 ---------------- */
var toastId=null;
function toast(msg){
  var t=$('#toast');t.textContent=msg;t.classList.add('show');
  if(toastId)clearTimeout(toastId);
  toastId=setTimeout(function(){t.classList.remove('show');},2200);
}

/* =====================================================================
   通用拖拽引擎（Pointer Events，鼠标 / 触摸统一）
   startDrag：拖动已有卡片（在原处留一个影子框，未落位时自动归还）
   startDragClone：从"符号源"拖出克隆卡片
   ===================================================================== */
var dragCtx=null;
function startDrag(e,card,onDrop){
  if(card.classList.contains('locked'))return;
  e.preventDefault();
  var r=card.getBoundingClientRect();
  var offX=e.clientX-r.left,offY=e.clientY-r.top;
  var parent=card.parentNode;
  var ph=el('div','drag-ph');ph.style.width=r.width+'px';ph.style.height=r.height+'px';
  if(parent)parent.insertBefore(ph,card);
  document.body.appendChild(card);
  card.classList.add('dragging');
  card.style.left=(e.clientX-offX)+'px';card.style.top=(e.clientY-offY)+'px';
  dragCtx={card:card,ph:ph,parent:parent,offX:offX,offY:offY,onDrop:onDrop,clone:false};
  window.addEventListener('pointermove',onDragMove);
  window.addEventListener('pointerup',onDragUp);
  window.addEventListener('pointercancel',onDragUp);
}
function startDragClone(e,proto,makeCard,onDrop){
  e.preventDefault();
  var r=proto.getBoundingClientRect();
  var card=makeCard();
  card.classList.add('dragging');
  document.body.appendChild(card);
  var offX=e.clientX-r.left,offY=e.clientY-r.top;
  card.style.left=(e.clientX-offX)+'px';card.style.top=(e.clientY-offY)+'px';
  dragCtx={card:card,ph:null,parent:null,offX:offX,offY:offY,onDrop:onDrop,clone:true};
  window.addEventListener('pointermove',onDragMove);
  window.addEventListener('pointerup',onDragUp);
  window.addEventListener('pointercancel',onDragUp);
}
function onDragMove(e){
  if(!dragCtx)return;
  e.preventDefault();
  dragCtx.card.style.left=(e.clientX-dragCtx.offX)+'px';
  dragCtx.card.style.top=(e.clientY-dragCtx.offY)+'px';
}
function onDragUp(e){
  if(!dragCtx)return;
  window.removeEventListener('pointermove',onDragMove);
  window.removeEventListener('pointerup',onDragUp);
  window.removeEventListener('pointercancel',onDragUp);
  var c=dragCtx;dragCtx=null;
  var t=document.elementFromPoint(e.clientX,e.clientY);
  var zone=t?t.closest('[data-drop]'):null;
  if(c.clone){                       /* 克隆卡：先判目标再消失 */
    var okClone=false;
    try{if(zone&&c.onDrop)okClone=c.onDrop(zone,e,c.card);}catch(err){okClone=false;}
    c.card.remove();return;
  }
  /* 先复位样式，再交给落点处理器重新安置（避免覆盖处理器设置的定位） */
  c.card.classList.remove('dragging');
  c.card.style.left='';c.card.style.top='';
  var handled=false;
  try{
    if(zone&&c.onDrop)handled=c.onDrop(zone,e,c.card);
  }catch(err){handled=false;}
  if(handled){
    if(c.ph&&c.ph.parentNode)c.ph.parentNode.removeChild(c.ph);
  }else{                             /* 归还原位 */
    if(c.ph&&c.ph.parentNode)c.ph.parentNode.replaceChild(c.card,c.ph);
    else if(c.parent)c.parent.appendChild(c.card);
  }
}

/* =====================================================================
   难度选择屏
   ===================================================================== */
function showDifficulty(){
  stopTimer();
  state.level=1;state.steps=0;state.running=false;lockClear=false;
  $('#steps').textContent='0';$('#timer').textContent='00:00';
  $('#lvlname').textContent='—';
  $('#toolbar').style.display='none';
  applyTheme();
  var st=$('#stage');st.innerHTML='';
  st.appendChild(el('div','lv-head','🏔️ 正负探险岛 · 2.1 正数与负数'));
  st.appendChild(el('div','ctx-card',
    '欢迎来到<b>正负探险岛</b>！本游戏改编自教材《2.1 正数与负数》：<b>用正、负数表示具有相反意义的量</b>、'+
    '<b>有理数的分类</b>、<b>基准（参照标准）的选取</b>、<b>符号规律探究</b>。'+
    '全岛共 4 个关卡，全部靠<b>拖一拖、插一插、放一放</b>来闯关，选出你的难度出发吧！'));
  var intro=el('div','intro-list',
    '🗺️ 探险路线：<b>① 方向调度站</b>（拖行动卡，让探险家停在目标位置）→ '+
    '<b>② 数字分拣湾</b>（把数字卡拖进集合圈）→ '+
    '<b>③ 基准插旗峰</b>（拖基准旗改变基准，完成读数任务）→ '+
    '<b>④ 符号星光路</b>（找出符号规律，拖符号牌补全数列）。');
  intro.style.marginTop='6px';
  st.appendChild(intro);
  var row=el('div','diff-row');
  var data=[
    {n:'初级',s:'⭐',d:'例题级 · 热身探险<br>卡片少、数字小、任务基础',c:'#2e9e5b'},
    {n:'中级',s:'⭐⭐',d:'练习级 · 进阶挑战<br>卡片变多、出现交叉集合圈',c:'#f2a900'},
    {n:'高级',s:'⭐⭐⭐',d:'变式级 · 巅峰试炼<br>小数与分数、四线基准、双规律',c:'#e53935'}
  ];
  data.forEach(function(d,i){
    var c=el('div','diff-card');
    c.style.borderColor=d.c;
    c.innerHTML='<div class="stars">'+d.s+'</div><h3>'+d.n+'</h3><p>'+d.d+'</p>';
    c.onclick=function(){chooseDiff(i);};
    row.appendChild(c);
  });
  st.appendChild(row);
}
function chooseDiff(i){
  state.diff=i;
  applyTheme();               /* 每局重新抽色板 */
  state.level=1;state.steps=0;$('#steps').textContent='0';
  openRules(true);            /* 进入时弹出规则面板（G6） */
  startTimer();
  renderLevel(1);
}

/* ---------------- 规则面板 ---------------- */
function openRules(first){

/* ---------------- 关卡渲染入口 ---------------- */
function renderLevel(n){
  state.level=n;state.revealed=false;state.busy=false;lockClear=false;
  $('#lvlname').textContent='第 '+n+'/4 关（'+DIFF_NAMES[state.diff]+'）';
  $('#toolbar').style.display='flex';
  if(n===1)setupL1();
  else if(n===2)setupL2();
  else if(n===3)setupL3();
  else setupL4();
}

/* =====================================================================
   第 1 关 · 方向调度站
   题源：教材"小蚂蚁爬行 +6,-10,+3"类问题及相反意义运动量的变式
   ===================================================================== */
var L1_CTX=[
  {mover:'🐜',obj:'米粒',dirPos:'向右',dirNeg:'向左',unit:'厘米',
   text:'小蚂蚁从出发点出发去捡米粒，<b>向右</b>爬行的路程记为<b>正数</b>，<b>向左</b>爬行记为<b>负数</b>（单位：厘米）。'},
  {mover:'🧗',obj:'宝箱',dirPos:'向东',dirNeg:'向西',unit:'米',
   text:'探险家从营地出发去寻宝，<b>向东</b>行走记为<b>正数</b>，<b>向西</b>行走记为<b>负数</b>（单位：米）。'},
  {mover:'🐟',obj:'新家',dirPos:'向前',dirNeg:'向后',unit:'米',
   text:'小鱼从珊瑚礁出发游向新家，<b>向前</b>游记为<b>正数</b>，<b>向后</b>游记为<b>负数</b>（单位：米）。'}
];
function setupL1(){
  var d=state.diff;
  var nSol=(d===0)?2:3;
  var vals,target,guard=0;
  do{ /* 随机生成一组互不相同的解卡片，保证目标不为 0 */
    vals=[];
    while(vals.length<nSol){
      var v;
      if(d<2)v=ri(1,9)*(Math.random()<0.5?1:-1);
      else v=ri(1,15)/2*(Math.random()<0.5?1:-1);
      if(vals.indexOf(v)<0)vals.push(v);
    }
    target=vals.reduce(function(a,b){return a+b;},0);
    guard++;
  }while((target===0)&&guard<80);
  /* 干扰卡：与解卡不同值 */
  var nd=(d===0)?1:2;
  var extra=[],g2=0;
  while(extra.length<nd&&g2<200){
    g2++;
    var w;
    if(d<2)w=ri(1,9)*(Math.random()<0.5?1:-1);
    else w=ri(1,15)/2*(Math.random()<0.5?1:-1);
    if(vals.concat(extra).indexOf(w)<0)extra.push(w);
  }
  var ctx=pick(L1_CTX);
  var cards=shuffle(vals.concat(extra).map(function(v){return {v:v};}));
  /* 数轴范围：覆盖所有可能的部分和与目标 */
  var min=0,max=0,run=0;
  cards.forEach(function(c){run+=c.v;min=Math.min(min,run);max=Math.max(max,run);});
  min=Math.min(min,target);max=Math.max(max,target);
  var lo=Math.floor(min-2),hi=Math.ceil(max+2);
  var step=Math.max(1,Math.ceil((hi-lo)/26));
  state.q1={ctx:ctx,cards:cards,n:nSol,target:target,lo:lo,hi:hi,step:step,sol:vals.slice()};
  /* --- 渲染界面 --- */
  var st=$('#stage');st.innerHTML='';
  st.appendChild(el('div','lv-head','🚩 '+levelName(1)+'（'+DIFF_NAMES[d]+'）'));
  st.appendChild(el('div','ctx-card',ctx.text+
    ' 请从下方行动卡中选出 <b>'+nSol+' 张</b>拖入卡槽（多余的卡是干扰卡），从 <b>0</b> 出发，'+
    '让'+ctx.mover+'恰好停在 <b>'+fmt(target)+'</b>（★ '+ctx.obj+'）的位置！'));
  /* 数轴（SVG 底图 + HTML 动态层） */
  var wrap=el('div','axis-wrap');wrap.id='axisWrap';
  wrap.appendChild(axisSVG(lo,hi,step));
  var ghost=el('div','','👻');ghost.id='ghost';ghost.style.display='none';
  var star=el('div','','⭐');star.id='starMark';
  star.innerHTML='<div style="text-align:center;font-size:30px;line-height:1">⭐</div>'+
    '<div style="font-weight:900;font-size:16px;color:#a06a00;white-space:nowrap;margin-top:4px">'+fmt(target)+' '+ctx.unit+'</div>';
  var mover=el('div','',ctx.mover);mover.id='mover';
  wrap.appendChild(ghost);wrap.appendChild(star);wrap.appendChild(mover);
  st.appendChild(wrap);
  /* 卡槽 */
  var row=el('div','slots-row');
  row.appendChild(el('span','','<b>卡槽（'+nSol+' 张）：</b>'));
  for(var i=0;i<nSol;i++){
    var s=el('div','slot');s.setAttribute('data-drop','slot');
    row.appendChild(s);
  }
  var go=el('button','btn primary','🚀 出发！');
  go.id='goBtn';go.onclick=l1Go;
  row.appendChild(go);
  st.appendChild(row);
  /* 候选卡池 */
  var pool=el('div','pool-row');pool.setAttribute('data-drop','pool');
  pool.appendChild(el('span','','<b>行动卡池：</b>'));
  cards.forEach(function(c,i){
    var cd=el('div','mcard',fmt(c.v)+'<small>'+(c.v>0?ctx.dirPos:ctx.dirNeg)+Math.abs(c.v)+'</small>');
    cd.dataset.v=c.v;cd.dataset.label=fmt(c.v);
    cd.addEventListener('pointerdown',function(e){startDrag(e,cd,l1Drop);});
    pool.appendChild(cd);
  });
  st.appendChild(pool);
  st.appendChild(el('div','',' '));
  /* 定位动态元素 */
  setTimeout(function(){setL1Pos(star,'star');setL1Pos(mover,'mover');l1Preview();},0);
}
/* 数轴 SVG 生成：0 右侧浅绿（正）、左侧浅橙（负） */
function axisSVG(lo,hi,step){
  var W=1000,H=150,pad=56,y=74;
  function x(v){return pad+(v-lo)/(hi-lo)*(W-2*pad);}
  var s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  s+='<text x="16" y="34" font-size="17" fill="#b3541e" font-weight="700">← 反方向（负）</text>';
  s+='<text x="'+(W-16)+'" y="34" font-size="17" fill="#1d7a44" font-weight="700" text-anchor="end">正方向（正）→</text>';
  s+='<rect x="'+x(0)+'" y="'+(y+6)+'" width="'+(x(hi)-x(0))+'" height="7" fill="#bfe8cd" rx="3"/>';
  s+='<rect x="'+x(lo)+'" y="'+(y+6)+'" width="'+(x(0)-x(lo))+'" height="7" fill="#f7d9c4" rx="3"/>';
  s+='<line x1="'+(pad-26)+'" y1="'+y+'" x2="'+(W-pad+30)+'" y2="'+y+'" stroke="#3a4a5c" stroke-width="4"/>';
  s+='<polygon points="'+(W-pad+30)+','+y+' '+(W-pad+16)+','+(y-8)+' '+(W-pad+16)+','+(y+8)+'" fill="#3a4a5c"/>';
  for(var v=Math.ceil(lo);v<=hi;v+=step){
    var is0=(v===0);
    s+='<line x1="'+x(v)+'" y1="'+(y-10)+'" x2="'+x(v)+'" y2="'+(y+10)+'" stroke="'+(is0?'#1565d8':'#7c8aa0')+'" stroke-width="'+(is0?5:3)+'"/>';
    s+='<text x="'+x(v)+'" y="'+(y+34)+'" font-size="17" text-anchor="middle" fill="'+(is0?'#1565d8':'#4a5a70')+'" font-weight="'+(is0?'900':'700')+'">'+v+'</text>';
  }
  s+='</svg>';
  var d=el('div');d.innerHTML=s;return d.firstChild;
}
function l1X(v){var q=state.q1;return (56+(v-q.lo)/(q.hi-q.lo)*(1000-112))/1000*100;}
function setL1Pos(elm){
  var v=arguments.length>1?arguments[1]:null;
  if(elm.id==='starMark')elm.style.left=l1X(state.q1.target)+'%';
  else if(elm.id==='mover')elm.style.left=l1X(0)+'%';
}
/* 实时预览：卡槽内卡片之和 → 虚影位置 */
function l1Preview(){
  var g=$('#ghost');if(!g)return;
  var vs=$$('.slot .mcard').map(function(c){return parseFloat(c.dataset.v);});
  if(vs.length===0){g.style.display='none';return;}
  var sum=vs.reduce(function(a,b){return a+b;},0);
  g.style.display='block';g.style.left=l1X(sum)+'%';
  g.title=fmt(sum);
}
/* 第1关拖放目标处理 */
function l1Drop(zone,e,card){
  var kind=zone.getAttribute('data-drop');
  if(kind==='slot'){
    if(zone.querySelector('.mcard')){toast('这个卡槽已经有卡片啦，换一个试试');return false;}
    zone.appendChild(card);addStep();l1Preview();return true;
  }
  if(kind==='pool'){
    zone.appendChild(card);addStep();l1Preview();return true;
  }
  return false;
}
/* 出发：按卡槽顺序依次移动 */
function l1Go(){
  if(state.busy)return;
  var q=state.q1;
  var cards=$$('.slot .mcard');
  if(cards.length<q.n){toast('先把 '+q.n+' 张行动卡装进卡槽，再出发！');return;}
  state.busy=true;addStep();
  var mover=$('#mover');
  mover.style.transition='none';mover.style.left=l1X(0)+'%';
  void mover.offsetWidth;mover.style.transition='left .55s ease';
  var pos=0,i=0;
  function stepMove(){
    if(i<cards.length){
      pos+=parseFloat(cards[i].dataset.v);i++;
      mover.style.left=l1X(pos)+'%';
      setTimeout(stepMove,600);
    }else{
      setTimeout(function(){
        state.busy=false;
        if(Math.abs(pos-q.target)<1e-9){levelClear();}
        else toast('停在了 '+fmt(pos)+'，目标是 '+fmt(q.target)+'。把卡拖回卡池换一换组合，再出发！');
      },320);
    }
  }
  stepMove();
}
/* 第1关揭示答案：给出一组可行组合 */
function revealL1(){
  var q=state.q1;
  var txt='💡 一组可行方案：'+q.sol.map(function(v){return fmt(v);}).join(' 和 ')+
    '（'+q.sol.map(function(v){return (v>0?q.ctx.dirPos:q.ctx.dirNeg)+Math.abs(v)+q.ctx.unit;}).join('，再')+'，合计停在 '+fmt(q.target)+'）';
  showRevealBox(txt);
}

/* =====================================================================
   第 2 关 · 数字分拣湾
   题源：教材典例3/典例4/典例6、练习4/练习6/练习8 及同型变式
   ===================================================================== */
var L2_BANK={
  0:[ /* 初级：正数集合圈 / 负数集合圈（0 在两圈之外） */
    [['+7',7],['-9',-9],['3',3],['-4.5',-4.5],['998',998],['0',0]],
    [['+8',8],['-3',-3],['2026',2026],['-4.1',-4.1],['-5%',-0.05],['0',0]],
    [['+40000',40000],['-80.97',-80.97],['1.7',1.7],['-6',-6],['0',0]]
  ],
  1:[ /* 中级：负有理数集合 ∩ 分数集合（负整数 / 负分数 / 正分数 / 圈外） */
    [['-0.6',-0.6],['-8',-8],['+2.1',2.1],['-809',-809],['89.9',89.9],['0',0]],
    [['-1/2',-0.5],['-15',-15],['0.75',0.75],['-2.05',-2.05],['+100',100],['0',0]],
    [['-30%',-0.3],['0.08',0.08],['-77',-77],['5/6',5/6],['-0.9',-0.9],['3',3]]
  ],
  2:[ /* 高级：正有理数集合 ∩ 分数集合（正整数 / 正分数 / 负分数 / 圈外） */
    [['11',11],['0.314',0.314],['-2',-2],['25%',0.25],['0',0],['-0.3',-0.3]],
    [['-35',-35],['0.1',0.1],['0',0],['1',1],['22',22],['-0.3',-0.3]],
    [['-50',-50],['+10',10],['1',1],['51.2',51.2],['-3.06',-3.06],['0.2',0.2]]
  ]
};
var L2_GEO={
  0:{A:{cx:280,cy:150,rx:195,ry:128},B:{cx:720,cy:150,rx:195,ry:128},
     labA:'正数集合',labB:'负数集合',
     slots:{A:[[220,115],[220,192],[330,115],[330,192]],
            B:[[660,115],[660,192],[770,115],[770,192]],
            AB:[[280,150]],out:[[260,320],[400,320],[540,320],[680,320]]}},
  1:{A:{cx:290,cy:150,rx:195,ry:128},B:{cx:560,cy:150,rx:195,ry:128},
     labA:'负有理数集合',labB:'分数集合',
     slots:{A:[[200,115],[200,192],[285,115],[285,192]],
            AB:[[425,120],[425,198]],
            B:[[620,115],[620,192],[700,115],[700,192]],
            out:[[260,320],[400,320],[540,320],[680,320]]}},
  2:{A:{cx:290,cy:150,rx:195,ry:128},B:{cx:560,cy:150,rx:195,ry:128},
     labA:'正有理数集合',labB:'分数集合',
     slots:{A:[[200,115],[200,192],[285,115],[285,192]],
            AB:[[425,120],[425,198]],
            B:[[620,115],[620,192],[700,115],[700,192]],
            out:[[260,320],[400,320],[540,320],[680,320]]}}
};
function isIntNum(v){return Math.abs(v-Math.round(v))<1e-9;}
/* 按模式判定数值应属区域：A=只左圈 AB=交集 B=只右圈 out=两圈之外 */
function l2Classify(v,mode){
  if(mode===0){return v>0?'A':(v<0?'B':'out');}
  if(mode===1){ /* 负有理数 ∩ 分数 */
    if(v<0&&isIntNum(v))return 'A';
    if(v<0&&!isIntNum(v))return 'AB';
    if(v>0&&!isIntNum(v))return 'B';
    return 'out';                      /* 正整数与 0 在两圈之外 */
  }
  /* 正有理数 ∩ 分数 */
  if(v>0&&isIntNum(v))return 'A';
  if(v>0&&!isIntNum(v))return 'AB';
  if(v<0&&!isIntNum(v))return 'B';
  return 'out';                        /* 负整数与 0 在两圈之外 */
}
function l2ZoneName(zone,mode){
  var m={0:{A:'正数集合（左圈）',B:'负数集合（右圈）',AB:'两圈交集',out:'两圈之外'},
         1:{A:'负整数区（只属负有理数）',AB:'负分数区（两圈交集）',B:'正分数区（只属分数）',out:'两圈之外'},
         2:{A:'正整数区（只属正有理数）',AB:'正分数区（两圈交集）',B:'负分数区（只属分数）',out:'两圈之外'}};
  return m[mode][zone];
}
function setupL2(){
  var mode=state.diff;
  var bank=pick(L2_BANK[mode]);
  var cards=shuffle(bank.map(function(p){return {label:p[0],v:p[1]};}));
  state.q2={mode:mode,cards:cards,placed:0,total:cards.length,geo:L2_GEO[mode],counts:{A:0,B:0,AB:0,out:0}};
  var st=$('#stage');st.innerHTML='';
  st.appendChild(el('div','lv-head','🚩 '+levelName(2)+'（'+DIFF_NAMES[mode]+'）'));
  st.appendChild(el('div','ctx-card',
    '把下面的数字卡片<b>拖进正确的位置</b>：只属于左圈的放左圈内、只属于右圈的放右圈内、'+
    '两个集合都满足的放<b>两圈交叉的部分</b>，两个集合都不属于的放进下方<b>"两圈之外"盒</b>。放错会自动弹回。'+
    '<br>📌 小提示：<b>有限小数、循环小数、百分数都可以看作分数</b>；<b>0 既不是正数，也不是负数</b>。'));
  var wrap=el('div','venv-wrap');wrap.id='venvWrap';wrap.setAttribute('data-drop','venv');
  wrap.appendChild(vennSVG(mode));
  st.appendChild(wrap);
  var pool=el('div','pool2');pool.setAttribute('data-drop','pool2');
  pool.appendChild(el('span','','<b>数字卡池：</b>'));
  cards.forEach(function(c){
    var cd=el('div','mcard',c.label);
    cd.dataset.v=c.v;cd.dataset.label=c.label;
    cd.addEventListener('pointerdown',function(e){startDrag(e,cd,l2Drop);});
    pool.appendChild(cd);
  });
  st.appendChild(pool);
}
function vennSVG(mode){
  var g=L2_GEO[mode];
  var s='<svg viewBox="0 0 1000 356" xmlns="http://www.w3.org/2000/svg">';
  s+='<ellipse cx="'+g.A.cx+'" cy="'+g.A.cy+'" rx="'+g.A.rx+'" ry="'+g.A.ry+'" fill="rgba(100,160,255,.16)" stroke="#1565d8" stroke-width="4"/>';
  s+='<ellipse cx="'+g.B.cx+'" cy="'+g.B.cy+'" rx="'+g.B.rx+'" ry="'+g.B.ry+'" fill="rgba(255,170,60,.16)" stroke="#e08a00" stroke-width="4"/>';
  /* 集合名称标签：置于本圈正上方内侧，加白色底板避免与椭圆弧线贴边混淆 */
  function vLabel(cx,txt,color){
    var w=txt.length*21+22;
    return '<rect x="'+(cx-w/2)+'" y="46" width="'+w+'" height="28" rx="8" fill="#ffffff" stroke="'+color+'" stroke-width="2"/>'+
           '<text x="'+cx+'" y="67" font-size="20" font-weight="900" fill="'+color+'" text-anchor="middle">'+txt+'</text>';
  }
  s+=vLabel(g.A.cx,g.labA,'#0d47a1');
  s+=vLabel(g.B.cx,g.labB,'#a05e00');
  s+='<rect x="150" y="294" width="700" height="52" rx="12" fill="#f2f5fa" stroke="#7c8aa0" stroke-width="3" stroke-dasharray="10 7"/>';
  s+='<text x="500" y="327" font-size="18" font-weight="800" fill="#5a6a7e" text-anchor="middle">两圈之外（不属于任何圈的数放这里）</text>';
  s+='</svg>';
  var d=el('div');d.innerHTML=s;return d.firstChild;
}
function inEll(px,py,e){var dx=(px-e.cx)/e.rx,dy=(py-e.cy)/e.ry;return dx*dx+dy*dy<=1;}
function l2Drop(zone,e,card){
  if(zone.getAttribute('data-drop')==='pool2'){zone.appendChild(card);return true;} /* 放回卡池 */
  if(zone.getAttribute('data-drop')!=='venv')return false;
  var q=state.q2,g=q.geo;
  var wrap=$('#venvWrap');var r=wrap.getBoundingClientRect();
  var vx=(e.clientX-r.left)/r.width*1000,vy=(e.clientY-r.top)/r.height*356;
  var v=parseFloat(card.dataset.v);
  var ans=l2Classify(v,q.mode);
  /* 判断松手落点区域 */
  var dropZone=null;
  if(vx>=150&&vx<=850&&vy>=294&&vy<=346)dropZone='out';
  else{
    var a=inEll(vx,vy,g.A),b=inEll(vx,vy,g.B);
    if(a&&b)dropZone='AB';else if(a)dropZone='A';else if(b)dropZone='B';
  }
  if(!dropZone){toast('要放到集合圈内或"两圈之外"盒里哦');return false;}
  addStep();
  if(dropZone!==ans){
    toast(pick(['再想想：这个数的符号和类型分别是什么？','注意：'+card.dataset.label+' 化简后是 '+fmt2(v)+'，先判断正负，再判断是不是分数','整数包括正整数、0、负整数；分数包括正分数、负分数','有限小数、循环小数、百分数都可以看作分数哦']));
    return false;
  }
  /* 正确：安放到该区域的下一个槽位 */
  var slots=g.slots[ans],idx=q.counts[ans];
  if(idx>=slots.length){toast('这个区域已经放满啦');return false;}
  var pt=slots[idx];q.counts[ans]++;
  card.classList.add('placed','locked');
  wrap.appendChild(card);
  card.style.left=(pt[0]/1000*100)+'%';card.style.top=(pt[1]/356*100)+'%';
  q.placed++;
  if(q.placed>=q.total)setTimeout(levelClear,420);
  return true;
}
function fmt2(v){
  if(isIntNum(v))return ''+Math.round(v);

}

/* 场景纵向布局：返回每条线的 y 坐标（viewBox 高 400） */
function l3Layout(def){
  if(def.type==='room'){ /* scale 55px/m，地面 y=330 */

  }
  if(def.type==='mount'){ /* scale 0.7px/m，海平面 y=340 */
    return {sea:340,foot:305,peak:95};
  }
  return {sea:340,foot:305,peak:95,tower:60}; /* mount2：塔顶海拔400m → y=60 */
}
function sceneSVG(def){

  }else{
    s+='<rect x="200" y="340" width="620" height="42" fill="#bcdcf5"/>';

    }
  }
  /* 参考虚线（贯穿）+ 右端名称标签 + 线上读数框（相邻线交错左右摆放，避免互相遮挡） */
  def.lines.forEach(function(L,i){
    s+='<line x1="60" y1="'+L.vy+'" x2="860" y2="'+L.vy+'" stroke="#54627a" stroke-width="3" stroke-dasharray="12 9"/>';
    s+='<text x="988" y="'+(L.vy+6)+'" font-size="17" font-weight="800" fill="#33465e" text-anchor="end">'+L.label+'（'+L.sub+'）</text>';

    s+='<text x="95" y="-19" font-size="15" font-weight="700" fill="#57677a" text-anchor="middle">'+L.label+' 的读数</text>';

/* 旗拖拽 + 吸附 + 任务检查 */
function setupFlagDrag(flag,wrap){
  flag.addEventListener('pointerdown',function(e){
    e.preventDefault();
    var r=wrap.getBoundingClientRect();
    var startY=e.clientY,startTop=flag.offsetTop;
    var moved=false;
    function mv(ev){
      ev.preventDefault();moved=true;
      var t=startTop+(ev.clientY-startY);
      t=Math.max(20,Math.min(t,r.height-56));
      flag.style.top=t+'px';
    }
    function up(ev){
      window.removeEventListener('pointermove',mv);
      window.removeEventListener('pointerup',up);
      if(!moved)return;
      /* 用旗杆底端位置换算 viewBox 坐标 */
      var vy=(flag.offsetTop+48)/r.height*400;
      var best=null,bd=46;
      state.q3.def.lines.forEach(function(L){
        var d2=Math.abs(vy-L.vy);
        if(d2<bd){bd=d2;best=L;}
      });
      if(!best){toast('把旗插到一条虚线参考线上才会生效哦');return;}
      snapFlag(best);
    }
    window.addEventListener('pointermove',mv);
    window.addEventListener('pointerup',up);
  });
}
function snapFlag(L){
  var q=state.q3,flag=$('#flag'),wrap=$('#sceneWrap');
  var rh=wrap.getBoundingClientRect().height;
  flag.style.top=(L.vy/400*rh-48)+'px';
  q.base=L.h;q.curLine=L.k;
  addStep();
  l3Refresh();
  l3Check();
}
/* 刷新线上的读数框（读数 = 该处高度 − 基准高度） */
function l3Refresh(){
  var q=state.q3;
  q.def.lines.forEach(function(L){
    var rv=document.getElementById('rv_'+L.k),rb=document.getElementById('rb_'+L.k);
    if(!rv)return;
    if(q.base===null){
      rv.textContent='—';rv.setAttribute('fill','#57677a');
      rb.setAttribute('stroke','#54627a');rb.setAttribute('stroke-width','2.5');
    }else{
      var v=round1(L.h-q.base);
      rv.textContent=(v===0?'0 m':fmt(v)+' m');
      var isBase=(L.k===q.curLine);
      rb.setAttribute('stroke',isBase?'#e08a00':'#54627a');
      rb.setAttribute('stroke-width',isBase?'4.5':'2.5');
      rv.setAttribute('fill',isBase?'#a05e00':(v>0?'#1d7a44':(v<0?'#b3271f':'#57677a')));
    }
  });
  renderL3Tasks();
}
function renderL3Tasks(){
  var q=state.q3,panel=state.q3.panel;
  $$('.task-card').forEach(function(c){c.remove();});
  var firstUndone=true;
  q.def.tasks.forEach(function(t){
    var L=q.def.lines.filter(function(x){return x.k===t.line;})[0];
    var c=el('div','task-card'+(t.done?' done':(firstUndone?' cur':'')));
    firstUndone=false;
    var hint='';
    if(state.revealed&&!t.done){
      var baseV=round1(L.h-t.val);
      var bl=q.def.lines.filter(function(x){return Math.abs(x.h-baseV)<1e-9;})[0];
      if(bl)hint='<div class="hint">💡 旗插在【'+bl.label+'】</div>';
    }
    c.innerHTML=(t.done?'✅ ':'🔹 ')+'让【'+L.label+'】的读数变为 <b>'+fmt(t.val)+' m</b>'+hint;
    panel.appendChild(c);
  });
}
/* 完成任务判定（宽松：任何未完成任务被满足即点亮） */
function l3Check(){
  var q=state.q3;
  if(q.base===null)return;
  var all=true;
  q.def.tasks.forEach(function(t){
    if(t.done)return;
    var L=q.def.lines.filter(function(x){return x.k===t.line;})[0];
    if(Math.abs(round1(L.h-q.base)-t.val)<1e-9){t.done=true;toast('🎉 任务完成：'+L.label+'的读数变成了 '+fmt(t.val)+' m');}
    if(!t.done)all=false;
  });
  renderL3Tasks();
  if(all)setTimeout(levelClear,500);
}

/* =====================================================================
   第 4 关 · 符号星光路
   题源：教材典例9（1,2,-3,-4,5,6,… 符号"++--"循环）、练习10（奇正偶负）及变式
   ===================================================================== */
var L4_PATS={
  PPNN:{sign:function(n){return ((n-1)%4<2)?1:-1;},desc:'正、正、负、负，四个一循环'},
  ALT:{sign:function(n){return (n%2===1)?1:-1;},desc:'奇数项为正、偶数项为负'},
  NNPP:{sign:function(n){return ((n-1)%4<2)?-1:1;},desc:'负、负、正、正，四个一循环'}
};
var L4_BANK={
  0:[{pat:'PPNN',K:12,pool:[13,14,15,16,17,18,21,22,23,24],pick:4}],
  1:[{pat:'PPNN',K:16,pool:[97,98,99,100,101,102,199,200,999,2024,2025],pick:6}],
  2:[{pat:'ALT',K:16,pool:[45,46,58,77,100,333,500,777,1000,2024,2025],pick:6},
     {pat:'NNPP',K:16,pool:[51,52,63,64,99,100,101,505,2023,2024,3000],pick:6}]
};
function setupL4(){
  var cfg=pick(L4_BANK[state.diff]);
  var ns=shuffle(cfg.pool.slice()).slice(0,cfg.pick).sort(function(a,b){return a-b;});
  state.q4={pat:cfg.pat,K:cfg.K,ns:ns,done:0,total:ns.length};
  var pat=L4_PATS[cfg.pat];
  var st=$('#stage');st.innerHTML='';
  st.appendChild(el('div','lv-head','🚩 '+levelName(4)+'（'+DIFF_NAMES[state.diff]+'）'));
  st.appendChild(el('div','ctx-card',
    '数列按规律一直排下去（<b>不考虑符号时第 n 个数就是 n</b>）。观察前 '+cfg.K+' 个亮起的数，找出<b>符号变化的规律</b>（'+pat.desc+'），'+
    '把 <b>＋</b> / <b>−</b> 符号牌<b>拖到</b>下方空位上，全部放对即过关！提示：想想 n 除以循环长度的余数。'));
  /* 序列展示 */
  var seq=el('div','seq-wrap');
  for(var i=1;i<=cfg.K;i++){
    var sg=pat.sign(i);
    var p=el('div','seq-pill'+(sg<0?' neg':''),(sg>0?'+':'−')+i);
    seq.appendChild(p);
  }
  var dots=el('div','seq-pill','…');
  seq.appendChild(dots);
  st.appendChild(seq);
  /* 谜题空位 */
  var row=el('div','seq-wrap');
  ns.forEach(function(n){
    var b=el('div','blank');
    b.setAttribute('data-drop','blank');b.dataset.n=n;
    b.innerHTML='<div class="q">第 '+n+' 个</div><div class="s">？</div>';
    row.appendChild(b);
  });
  st.appendChild(row);
  /* 符号源（拖出克隆） */
  var sr=el('div','sign-row');
  var plus=el('div','signsrc','＋'),minus=el('div','signsrc','−');
  plus.addEventListener('pointerdown',function(e){
    startDragClone(e,plus,function(){
      var c=el('div','mcard','＋');c.style.width='64px';c.style.height='64px';c.style.fontSize='34px';return c;
    },l4Drop);
  });
  minus.addEventListener('pointerdown',function(e){
    startDragClone(e,minus,function(){
      var c=el('div','mcard','−');c.style.width='64px';c.style.height='64px';c.style.fontSize='34px';return c;
    },l4Drop);
  });
  sr.appendChild(plus);sr.appendChild(minus);
  sr.appendChild(el('span','','⬆ 从这两块符号牌上<b>按住拖出</b>符号（可以反复取用）'));
  st.appendChild(sr);
}
function l4Drop(zone,e,card){
  if(zone.getAttribute('data-drop')!=='blank')return false;
  if(zone.classList.contains('filled'))return false;
  var n=parseInt(zone.dataset.n,10);
  var want=L4_PATS[state.q4.pat].sign(n);
  var got=(card.textContent.indexOf('＋')>=0)?1:-1;
  addStep();
  zone.classList.add('filled');
  zone.querySelector('.s').textContent=(got>0?'+':'−');
  if(got===want){
    zone.classList.add('ok');
    state.q4.done++;
    if(state.q4.done>=state.q4.total)setTimeout(levelClear,400);
  }else{
    zone.classList.add('bad');
    toast('第 '+n+' 个的符号不对，再观察一下规律（看看除以循环长度的余数）');
    setTimeout(function(){
      zone.classList.remove('filled','bad');
      zone.querySelector('.s').textContent='？';
    },650);
  }
  return true;
}
/* 第4关揭示答案：空位上显示正确符号 */

/* ---------------- 彩纸庆祝动画（Canvas，G5） ---------------- */
function confettiBurst(ms){
  var cvs=$('#confettiCvs'),ctx=cvs.getContext('2d');
  cvs.width=window.innerWidth;cvs.height=window.innerHeight;
  var colors=['#f44336','#ff9800','#ffeb3b','#66bb6a','#42a5f5','#ab47bc','#ec407a'];
  var ps=[];
  for(var i=0;i<120;i++){
    ps.push({
      x:Math.random()*cvs.width,y:-30-Math.random()*cvs.height*0.5,
      w:6+Math.random()*8,h:8+Math.random()*10,
      vy:2+Math.random()*3.5,vx:-1.6+Math.random()*3.2,
      rot:Math.random()*Math.PI*2,vr:-0.12+Math.random()*0.24,
      c:colors[Math.floor(Math.random()*colors.length)]
    });
  }
  var t0=Date.now();
  function frame(){
    ctx.clearRect(0,0,cvs.width,cvs.height);
    ps.forEach(function(p){
      p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
      if(p.y>cvs.height+30){p.y=-20;p.x=Math.random()*cvs.width;}
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    });
    if(Date.now()-t0<ms)requestAnimationFrame(frame);
    else ctx.clearRect(0,0,cvs.width,cvs.height);
  }
  frame();
}
