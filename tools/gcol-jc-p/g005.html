<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>星环圆境 · 圆周角修理工坊（3.4 圆周角）</title>
<style>:root{--bg:#101c3f;--panel:#182a55;--main:#5db0ff;--accent:#ffd257;--ink:#f4f8ff;--sub:#9db4e6}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{height:100%}body{background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;overflow:hidden;transition:background .5s}#app{height:100%;display:flex;flex-direction:column}.hidden{display:none!important}#menu{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:20px;overflow:auto}#menuTitle{text-align:center}#menuTitle h1{font-size:44px;letter-spacing:6px;color:var(--accent);text-shadow:0 0 24px rgba(255,210,87,.45)}#menuTitle p{font-size:19px;color:var(--sub);margin-top:10px;letter-spacing:2px}#diffRow{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}.diffCard{width:250px;padding:24px 20px;border-radius:18px;cursor:pointer;background:var(--panel);border:3px solid var(--main);box-shadow:0 8px 26px rgba(0,0,0,.35);text-align:center;transition:transform .15s,box-shadow .15s,border-color .15s}.diffCard:hover{transform:translateY(-6px);box-shadow:0 14px 34px rgba(0,0,0,.5);border-color:var(--accent)}.diffCard .dIcon{width:74px;height:74px;margin:0 auto 12px;border-radius:50%;border:4px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:bold;color:var(--accent)}.diffCard h2{font-size:26px;margin-bottom:8px;color:var(--ink)}.diffCard p{font-size:16px;color:var(--sub);line-height:1.55}#menuFoot{font-size:16px;color:var(--sub)}#gameScreen{flex:1;display:flex;flex-direction:column;min-height:0}#hud{height:56px;flex:none;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--panel);border-bottom:3px solid var(--main)}#hudTitle{font-size:20px;font-weight:bold;color:var(--accent);letter-spacing:1px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#hudRight{display:flex;gap:10px;align-items:center;flex:none}.hudChip{background:rgba(0,0,0,.30);border:2px solid var(--main);border-radius:12px;padding:5px 12px;font-size:17px;color:var(--ink);font-weight:bold;white-space:nowrap}#gameMain{flex:1;display:flex;min-height:0;gap:14px;padding:12px}#problemPane{width:308px;flex:none;background:var(--panel);border-radius:16px;border:2px solid var(--main);padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}#challengeTag{font-size:15px;color:var(--sub)}#challengeTitle{font-size:21px;font-weight:bold;color:var(--accent);line-height:1.4}#problemText{font-size:17px;line-height:1.7;color:var(--ink);background:rgba(0,0,0,.22);border-radius:12px;padding:12px}#stageGoal{font-size:17px;line-height:1.65;color:#10240a;background:var(--accent);border-radius:12px;padding:12px;font-weight:bold}#progressRow{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:16px;color:var(--sub);flex-wrap:wrap}#progressRow svg{display:block}#canvasWrap{flex:1;position:relative;min-width:0;border-radius:16px;background:rgba(0,0,0,.25);border:2px solid var(--main);overflow:hidden}#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}#ctrlBar{height:62px;flex:none;display:flex;gap:12px;align-items:center;justify-content:center;background:var(--panel);border-top:3px solid var(--main);padding:0 12px;flex-wrap:wrap}.btn{font-family:inherit;font-size:18px;font-weight:bold;color:var(--ink);background:var(--main);border:none;border-radius:12px;padding:10px 18px;cursor:pointer;letter-spacing:1px}.btn:active{transform:scale(.96)}.btn.warn{background:#e07840}.btn.gold{background:var(--accent);color:#2b1d00}#modalMask{position:fixed;inset:0;background:rgba(4,8,20,.78);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}#modalCard{width:min(620px,94vw);max-height:84vh;overflow-y:auto;background:var(--panel);border:3px solid var(--accent);border-radius:18px;padding:22px;box-shadow:0 16px 50px rgba(0,0,0,.55)}#modalCard h2{color:var(--accent);font-size:24px;margin-bottom:12px;letter-spacing:2px}#modalBody{font-size:17px;line-height:1.75;color:var(--ink);white-space:pre-wrap}#modalBtns{margin-top:18px;display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap}#celebrate{position:fixed;inset:0;z-index:60;background:rgba(6,10,26,.88);display:flex;align-items:center;justify-content:center}#confettiCv{position:absolute;inset:0;width:100%;height:100%}#celebratePanel{position:relative;text-align:center;padding:30px 40px;border-radius:20px;background:var(--panel);border:3px solid var(--accent);max-width:92vw;animation:popIn .6s ease .25s both}#celebratePanel h1{font-size:38px;color:var(--accent);letter-spacing:5px;margin-bottom:14px}#celebratePanel p{font-size:19px;line-height:1.8;color:var(--ink)}#celebratePanel .btnRow{margin-top:20px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}@keyframes popIn{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}@keyframes flash{0%{filter:brightness(1)}50%{filter:brightness(1.8)}100%{filter:brightness(1)}}@media(max-width:900px){#gameMain{flex-direction:column;padding:8px;gap:8px}#problemPane{width:auto;max-height:34%;order:2}#canvasWrap{order:1;min-height:44%}#hudTitle{font-size:16px}#menuTitle h1{font-size:32px}.hudChip{font-size:14px;padding:4px 8px}#ctrlBar{height:auto;padding:8px}.btn{font-size:16px;padding:9px 12px}}
</style>
</head>
<body>
<div id="app">

  <!-- ============ 菜单屏（难度选择） ============ -->
  <section id="menu">
    <div id="menuTitle">
      <h1>星环圆境 · 圆周角修理工坊</h1>
      <p>初中数学 · 九年级上册 · 3.4 圆周角 —— 拖动星标、旋转手柄，亲手点亮每一个角</p>
    </div>
    <div id="diffRow">
      <div class="diffCard" data-tier="1">
        <div class="dIcon">初</div>
        <h2>初级 · 星光小径</h2>
        <p>圆周角定理初体验：同弧等角、圆周角是圆心角的一半、弧的度量</p>
      </div>
      <div class="diffCard" data-tier="2">
        <div class="dIcon">中</div>
        <h2>中级 · 彩虹桥畔</h2>
        <p>直径所对的圆周角是直角、圆内接四边形对角互补的妙用</p>
      </div>
      <div class="diffCard" data-tier="3">
        <div class="dIcon">高</div>
        <h2>高级 · 隐圆寻宝</h2>
        <p>隐圆模型与综合挑战：定点定长、定角定弦、分类讨论</p>
      </div>
    </div>
    <div id="menuFoot">每一局题目随机抽取 · 配色随机变幻 · 适合课堂投影与学生自玩</div>
  </section>

  <!-- ============ 游戏屏 ============ -->
  <section id="gameScreen" class="hidden">
    <header id="hud">
      <button class="btn warn" id="btnBack">返回难度选择</button>
      <div id="hudTitle">星环圆境</div>
      <div id="hudRight">
        <span class="hudChip" id="timerBox">时间 00:00</span>
        <span class="hudChip" id="stepBox">操作 0</span>
      </div>
    </header>
    <main id="gameMain">
      <aside id="problemPane">
        <div>
          <div id="challengeTag">初级 · 第 1 / 4 关</div>
          <div id="challengeTitle">关卡名</div>
        </div>
        <div id="problemText">题目载入中……</div>
        <div id="stageGoal">目标</div>
        <div id="progressRow"></div>
      </aside>
      <div id="canvasWrap"><canvas id="cv"></canvas></div>
    </main>
    <footer id="ctrlBar">
      <button class="btn" id="btnRules">规则说明</button>
      <button class="btn gold" id="btnReveal">揭示答案</button>
      <button class="btn warn" id="btnRestart">重新开始</button>
      <button class="btn warn" id="btnMenu2">返回难度选择</button>
    </footer>
  </section>

  <!-- ============ 通用弹窗 ============ -->
  <div id="modalMask" class="hidden">
    <div id="modalCard">
      <h2 id="modalTitle">标题</h2>
      <div id="modalBody">内容</div>
      <div id="modalBtns"></div>
    </div>
  </div>

  <!-- ============ 通关庆祝层 ============ -->
  <div id="celebrate" class="hidden">
    <canvas id="confettiCv"></canvas>
    <div id="celebratePanel">
      <h1>星环全部点亮！</h1>
      <p id="celebrateStats"></p>
      <div class="btnRow">
        <button class="btn gold" id="btnAgain">再玩一次（重新抽题）</button>
        <button class="btn warn" id="btnMenu3">返回难度选择</button>
      </div>
    </div>
  </div>
</div>

<script>"use strict";var W=640,H=520;var RAD=Math.PI/180;function norm(d){return(d%360+360)%360}function angdiff(a,b){return((a-b)%360+540)%360-180}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function P(c,d){return{x:c.cx+c.r*Math.cos(d*RAD),y:c.cy+c.r*Math.sin(d*RAD)}}function dist(p,q){return Math.hypot(p.x-q.x,p.y-q.y)}function angBetween(a,v,b){var ux=a.x-v.x,uy=a.y-v.y,wx=b.x-v.x,wy=b.y-v.y;var m=Math.hypot(ux,uy)*Math.hypot(wx,wy);if(m<1e-9)return 0;return Math.acos(clamp((ux*wx+uy*wy)/m,-1,1))/RAD}function fmt1(x){return(Math.round(x*10)/10).toFixed(1)}var PALETTES=[{bg:"#101c3f",panel:"#182a55",main:"#5db0ff",accent:"#ffd257",sub:"#9db4e6",ink:"#f4f8ff"},{bg:"#12291f",panel:"#1a3a2c",main:"#4fd6a5",accent:"#ffe08a",sub:"#a4cbb8",ink:"#f2fff8"},{bg:"#291538",panel:"#3a2052",main:"#c07bff",accent:"#8affc1",sub:"#c8a8e0",ink:"#f9f2ff"},{bg:"#33170f",panel:"#48231a",main:"#ff9a62",accent:"#ffe27a",sub:"#dcae94",ink:"#fff6ee"},{bg:"#0e2f3a",panel:"#154452",main:"#54c8e8",accent:"#ffb3d1",sub:"#9ec4d0",ink:"#f0fbff"},{bg:"#2a1414",panel:"#3d2020",main:"#ff7b8a",accent:"#ffd257",sub:"#d8a5a5",ink:"#fff4f4"}];var COL=null;function safeCol(p){var q={};["bg","panel","main","accent","sub","ink"].forEach(function(k){q[k]=p[k]||"#f4f8ff"});return q}var AC=null;function beep(freq,delay,dur,type){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext);if(AC.state==="suspended")AC.resume();var t=AC.currentTime+(delay||0);var o=AC.createOscillator(),g2=AC.createGain();o.type=type||"sine";o.frequency.value=freq;g2.gain.setValueAtTime(1e-4,t);g2.gain.exponentialRampToValueAtTime(.22,t+.02);g2.gain.exponentialRampToValueAtTime(1e-4,t+(dur||.18));o.connect(g2);g2.connect(AC.destination);o.start(t);o.stop(t+(dur||.18)+.05)}catch(e){}}function chimeSmall(){beep(660,0,.14,"triangle");beep(990,.09,.16,"triangle")}function chimeBig(){beep(523,0,.16,"sine");beep(659,.12,.16,"sine");beep(784,.24,.18,"sine");beep(1047,.38,.3,"sine")}var elMenu=document.getElementById("menu");var elGame=document.getElementById("gameScreen");var elHudTitle=document.getElementById("hudTitle");var elTimer=document.getElementById("timerBox");var elStep=document.getElementById("stepBox");var elTag=document.getElementById("challengeTag");var elTitle=document.getElementById("challengeTitle");var elProblem=document.getElementById("problemText");var elGoal=document.getElementById("stageGoal");var elProgress=document.getElementById("progressRow");var elModalMask=document.getElementById("modalMask");var elModalTitle=document.getElementById("modalTitle");var elModalBody=document.getElementById("modalBody");var elModalBtns=document.getElementById("modalBtns");var elCelebrate=document.getElementById("celebrate");var cv=document.getElementById("cv");var g=cv.getContext("2d");var confCv=document.getElementById("confettiCv");var viewScale=1,viewOx=0,viewOy=0,dpr=1;function fitCanvas(){var wrap=document.getElementById("canvasWrap");var rect=wrap.getBoundingClientRect();dpr=window.devicePixelRatio||1;cv.width=Math.max(2,Math.round(rect.width*dpr));cv.height=Math.max(2,Math.round(rect.height*dpr));viewScale=Math.min(rect.width/W,rect.height/H);viewOx=(rect.width-W*viewScale)/2;viewOy=(rect.height-H*viewScale)/2}window.addEventListener("resize",fitCanvas);function toDesign(e){var rect=cv.getBoundingClientRect();return{x:(e.clientX-rect.left-viewOx)/viewScale,y:(e.clientY-rect.top-viewOy)/viewScale}}function drawBoard(now){g.clearRect(0,0,W,H);g.fillStyle="rgba(0,0,0,0.16)";g.fillRect(0,0,W,H);for(var i=0;i<24;i++){var sx=i*137.5%(W-40)+20,sy=i*89.7%(H-40)+20;var tw=.35+.3*Math.sin(now/700+i*1.7);g.fillStyle="rgba(255,255,255,"+tw.toFixed(2)+")";g.beginPath();g.arc(sx,sy,i%4===0?2.2:1.3,0,7);g.fill()}}function drawCircle(c,color,w){g.strokeStyle=color||COL.main;g.lineWidth=w||3;g.beginPath();g.arc(c.cx,c.cy,c.r,0,7);g.stroke()}function drawArc(c,d1,d2,color,w){g.strokeStyle=color||COL.accent;g.lineWidth=w||6;g.beginPath();g.arc(c.cx,c.cy,c.r,d1*RAD,d2*RAD,false);g.s
