a(15,23,42,.4)}.panel h2{font-size:26px;margin-bottom:14px;color:var(--primaryDark)}.panel .winExpr{font-size:30px;font-weight:900;text-align:center;margin:12px 0;color:var(--ink);background:var(--light);border-radius:14px;padding:14px}.panel .starsBig{font-size:38px;text-align:center;margin:8px 0;letter-spacing:6px}.starOff{color:#cbd5e1}.starOn{color:#f59e0b;text-shadow:0 0 10px rgba(245,158,11,.55)}.explain{background:#f8fafc;border:3px solid #e2e8f0;border-radius:14px;padding:14px 16px;margin:12px 0}.explain .eTitle{font-weight:900;font-size:18px;margin-bottom:8px;color:var(--primaryDark)}.explain p{font-size:17px;line-height:1.8;margin:4px 0}.rulesList p{font-size:17px;line-height:1.9;margin:6px 0}.rulesList .kb{background:var(--light);border-radius:10px;padding:4px 10px;font-weight:800;color:var(--primaryDark)}.panelBtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}.statRow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:10px 0}.statRow .badge{font-size:18px}#fx{position:fixed;inset:0;z-index:1000;pointer-events:none}@media(max-width:860px){body{font-size:16px}.brand h1{font-size:18px}.machineBox{gap:12px;padding:12px}.coefBox{width:100%}.coefBox .zone{min-height:70px}.outWrap{width:100%}.outWrap .zone{min-height:76px}.radWrap{min-width:100%}.radSym{font-size:56px}.tile{width:48px;height:48px;font-size:22px}.chip{font-size:20px;padding:8px 12px}.stageGoal{font-size:17px}.btn{font-size:16px;padding:8px 14px}.btn.big{font-size:18px;padding:10px 20px}.diffCard{width:100%;max-width:340px}}

<body>
<canvas id="fx"></canvas>

<!-- 顶栏：标题 + 计时/步数/星星 + 功能按钮 -->
<header id="topBar">
  <div class="brand">
    <div class="logo">√</div>
    <div><h1>根号工坊</h1><p>二次根式的乘除 · 互动闯关</p></div>
  </div>
  <div class="hud">
    <span class="badge">用时 <b id="hudTime">00:00</b></span>
    <span class="badge">步数 <b id="hudSteps">0</b></span>
    <span class="badge">星星 <b id="hudStars">0</b></span>
  </div>
  <div class="topBtns">
    <button class="btn" id="btnRules">规则说明</button>
    <button class="btn hidden" id="btnBack">返回难度选择</button>
  </div>
</header>

<!-- 难度选择界面 -->
<main id="menuScreen">
  <div class="menuTitle">选择你的挑战车间</div>
  <div class="menuSub">拆一拆、配一配、开根号 —— 把二次根式的乘除算式化成最简二次根式！</div>
  <div class="diffRow">
    <button class="diffCard" data-diff="basic">
      <div class="dName">初级 · 热身车间</div>
      <div class="dDesc">单个二次根式的化简，学会「配对开方」</div>
      <div class="dEg">例如：√18 → 3√2</div>
    </button>
    <button class="diffCard" data-diff="mid">
      <div class="dName">中级 · 进阶车间</div>
      <div class="dDesc">两个根式相乘相除，还要学会「约分」</div>
      <div class="dEg">例如：√12 ÷ √27 → 2/3</div>
    </button>
    <button class="diffCard" data-diff="hard">
      <div class="dName">高级 · 大师车间</div>
      <div class="dDesc">三连乘除、带系数、平方差变形</div>
      <div class="dEg">例如：√12 ÷ √27 × √18 → 2√2</div>
    </button>
  </div>
  <div class="menuTip">每次进入都会随机换色、随机抽题，玩多少局都不重样！</div>
</main>

<!-- 游戏界面 -->
<main id="gameScreen" class="hidden">
  <div class="stageHead">
    <div class="stageNo" id="stageNo">第 1 关</div>
    <div class="stageGoal" id="stageGoal"></div>
  </div>

  <div class="exprBoard">
    <div class="exprTitle">算式卡片（按从左到右的顺序，把它们拖进下面的开方机）</div>
    <div class="exprRow" id="exprRow"></div>
  </div>

  <div class="machineBox" id="machineBox">
    <div class="zoneCol coefBox">
      <div class="zlabel">系数口 · 系数相乘</div>
      <div class="zone" data-zone="coef" id="zoneCoef"><div class="ph">把系数卡片<br>拖到这里</div></div>
    </div>
    <div class="zoneCol outWrap">
      <div class="zlabel">根号外 · 成对出根</div>
      <div class="zone" data-zone="outTop" id="zoneOutTop"><div class="ph">根号内相同的两个<br>因数，拖到这里配对</div></div>
      <div class="fracBar hidden" id="outBar"></div>
      <div class="zone hidden" data-zone="outBottom" id="zoneOutBottom"><div class="ph">分母的成对因数<br>拖到这里</div></div>
    </div>
    <div class="multSign hidden" id="multSign">×</div>
    <div class="zoneCol radWrap">
      <div class="zlabel">根号内 · 因数分解区</div>
      <div class="radRow">
        <div class="radSym">√</div>
        <div class="radBody">
          <div class="zone" data-zone="top" id="zoneTop"><div class="ph">分子区：放 √卡片、×√卡片<br>（被开方数相乘）</div></div>
          <div class="fracBar hidden" id="inBar"></div>
          <div class="zone hidden" data-zone="bottom" id="zoneBottom"><div class="ph">分母区：放 ÷√卡片<br>（被开方数相除）</div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="previewLine" id="previewLine"></div>

  <div class="controls">
    <button class="btn primary big" id="btnCheck">启动机器 · 检验</button>
    <button class="btn warn" id="btnReveal">揭示答案</button>
    <button class="btn" id="btnRestart">重新开始</button>
  </div>
</main>

<div id="toast" class="hidden"></div>
<div id="overlay" class="hidden"><div class="panel" id="panelBody"></div></div>
