<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>周长面积魔法工坊 · 长方形和正方形（第7讲）</title>
<style>
/* ================= 全局样式（课堂投影：大字号、高对比、粗线条） ================= */
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body{
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
  background:var(--bg); color:var(--ink);
  font-size:18px; line-height:1.55;
  -webkit-user-select:none; user-select:none;
}
:root{
  --bg:#eaf4ff; --panel:#ffffff; --ink:#1c2b3a; --p:#1d6fd1; --pd:#155a9e;
  --accent:#ff9f1c; --soft:#cfe5ff;
}
#app{ display:flex; flex-direction:column; height:100%; max-width:1280px; margin:0 auto; padding:8px 12px; }
header#topbar{
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;
  padding:10px 16px; border-radius:16px; background:var(--panel);
  box-shadow:0 3px 10px rgba(30,60,100,.12); margin-bottom:10px;
}
.brand{ font-size:26px; font-weight:900; color:var(--pd); letter-spacing:1px; }
.brand small{ font-size:16px; color:var(--ink); font-weight:600; margin-left:8px; }
.hud{ display:flex; gap:10px; flex-wrap:wrap; }
.hud span{
  background:var(--soft); color:var(--pd); font-weight:800; font-size:18px;
  padding:6px 14px; border-radius:999px; border:2px solid var(--p);
}
main{ flex:1; min-height:0; }
.screen{ height:100%; }
.hidden{ display:none !important; }

/* ---------- 难度选择 ---------- */
#scr-select{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:10px; }
#scr-select h1{ font-size:40px; font-weight:900; color:var(--pd); text-align:center; }
#scr-select .subtitle{ font-size:20px; color:var(--ink); text-align:center; }
.lv-cards{ display:flex; gap:22px; flex-wrap:wrap; justify-content:center; }
.lv-card{
  width:290px; padding:26px 20px; border-radius:22px; border:none; cursor:pointer;
  background:var(--panel); box-shadow:0 6px 18px rgba(30,60,100,.15);
  transition:transform .15s, box-shadow .15s; text-align:center; color:var(--ink);
}
.lv-card:hover{ transform:translateY(-6px) scale(1.03); box-shadow:0 12px 26px rgba(30,60,100,.22); }
.lv-card .stars{ font-size:26px; letter-spacing:3px; }
.lv-card h2{ font-size:27px; margin:10px 0 8px; color:var(--p); }
.lv-card p{ font-size:17px; color:var(--ink); }
.lv-card .tag{ display:inline-block; margin-top:10px; padding:4px 14px; border-radius:999px; background:var(--soft); color:var(--pd); font-weight:800; font-size:16px; }

/* ---------- 游戏界面 ---------- */
#scr-game{ display:flex; flex-direction:column; gap:10px; min-height:0; }
.game-head{
  display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  background:var(--panel); border-radius:14px; padding:10px 14px; box-shadow:0 3px 10px rgba(30,60,100,.10);
}
#g-title{ font-size:22px; font-weight:900; color:var(--pd); }
.g-btns{ display:flex; gap:8px; flex-wrap:wrap; }
.btn{
  border:none; cursor:pointer; font-family:inherit; font-size:17px; font-weight:800;
  padding:9px 16px; border-radius:12px; background:var(--soft); color:var(--pd);
  border:2px solid var(--p); transition:filter .12s, transform .12s;
}
.btn:hover{ filter:brightness(1.05); transform:translateY(-2px); }
.btn.primary{ background:var(--p); color:#fff; }
.btn.warn{ background:var(--accent); border-color:var(--accent); color:#fff; }
.game-body{ flex:1; min-height:0; display:flex; gap:10px; }
.stage-panel{
  flex:1; min-width:0; background:var(--panel); border-radius:16px; padding:8px;
  box-shadow:0 3px 10px rgba(30,60,100,.10); display:flex;
}
#stage{ width:100%; height:100%; touch-action:none; border-radius:10px; cursor:grab; }
.side-panel{
  width:330px; flex-shrink:0; background:var(--panel); border-radius:16px; padding:14px;
  box-shadow:0 3px 10px rgba(30,60,100,.10); overflow-y:auto; display:flex; flex-direction:column; gap:10px;
}
.side-panel h3{ font-size:19px; color:var(--pd); border-bottom:3px solid var(--soft); padding-bottom:6px; }
.tip-box{ background:var(--soft); border-radius:12px; padding:10px 12px; font-size:16.5px; }
.tip-box b{ color:var(--pd); }
.big-read{ text-align:center; font-size:20px; font-weight:800; }
.big-read .num{ display:block; font-size:44px; color:var(--p); }
.chip{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  border:2.5px solid var(--p); border-radius:12px; padding:8px 12px; margin-top:8px; font-weight:800; font-size:17px;
}
.chip .st{ font-size:16px; padding:2px 10px; border-radius:999px; background:#eee; color:#777; }
.chip.hit{ border-color:#1f9d55; background:rgba(31,157,85,.12); }
.chip.hit .st{ background:#1f9d55; color:#fff; }
.chip.near{ border-color:var(--accent); }
.slider-row{ margin-top:6px; }
.slider-row label{ font-size:18px; font-weight:800; color:var(--pd); }
.slider-row .val{ color:var(--p); font-size:20px; font-weight:900; margin-left:8px; }
input[type=range]{ width:100%; height:34px; cursor:pointer; accent-color:var(--p); }
.progress-line{ font-size:18px; font-weight:800; color:var(--pd); }
.formula{ background:var(--soft); border-radius:12px; padding:10px 12px; font-size:17px; font-weight:700; }
.next-btn{ margin-top:6px; }

/* ---------- 弹窗 ---------- */
#modal-mask{
  position:fixed; inset:0; background:rgba(15,35,60,.55); z-index:50;
  display:flex; align-items:center; justify-content:center; padding:16px;
}
#modal-box{
  background:var(--panel); color:var(--ink); border-radius:18px; max-width:720px; width:100%;
  max-height:86vh; overflow-y:auto; padding:22px 26px; box-shadow:0 10px 40px rgba(0,0,0,.3);
}
#modal-title{ font-size:24px; color:var(--pd); margin-bottom:12px; border-bottom:3px solid var(--soft); padding-bottom:8px; }
#modal-body{ font-size:18px; white-space:pre-wrap; }
#modal-body .qa{ color:#1f9d55; font-weight:900; }
#modal-close{ margin-top:16px; }
.win-stars{ text-align:center; font-size:40px; letter-spacing:6px; color:var(--accent); margin:6px 0; }

/* ---------- 提示条 / 彩纸 ---------- */
#toast{
  position:fixed; left:50%; top:14%; transform:translateX(-50%) scale(.9); z-index:70;
  background:var(--pd); color:#fff; font-size:20px; font-weight:800;
  padding:12px 26px; border-radius:999px; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
  box-shadow:0 6px 20px rgba(0,0,0,.25); max-width:86vw; text-align:center;
}
#toast.show{ opacity:1; transform:translateX(-50%) scale(1); }
#fx{ position:fixed; inset:0; z-index:60; pointer-events:none; }

/* ---------- 响应式 ---------- */
@media (max-width:900px){
  .game-body{ flex-direction:column; }
  .stage-panel{ min-height:52vh; }
  .side-panel{ width:100%; }
  #scr-select h1{ font-size:30px; }
  .brand{ font-size:20px; }
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">📐 周长面积魔法工坊<small>第7讲 · 长方形和正方形</small></div>
    <div class="hud">
      <span id="hud-round">驿站待选</span>
      <span id="hud-timer">⏱ 00:00</span>
      <span id="hud-steps">👣 0 步</span>
    </div>
  </header>
  <main>
    <!-- 难度选择界面 -->
    <section id="scr-select" class="screen">
      <h1>长方形和正方形 · 三大闯关驿站</h1>
      <p class="subtitle">平移边线 · 动手剪纸 · 调节拼图，玩着玩着就懂了！每局配色随机刷新哦</p>
      <div class="lv-cards">
        <button class="lv-card" data-lv="1">
          <div class="stars" style="color:#f4a259">★★</div>
          <h2>初级 · 彩虹闯关园</h2>
          <p>平移法求周长、动手剪一剪、正方形长个儿——例题级热身</p>
          <span class="tag">共 3 关</span>
        </button>
        <button class="lv-card" data-lv="2">
          <div class="stars" style="color:#e07a1f">★★★</div>
          <h2>中级 · 巧手匠心坊</h2>
          <p>机器零件平移、剪纸找三种情况、水池草地拼图——练习级挑战</p>
          <span class="tag">共 3 关</span>
        </button>
        <button class="lv-card" data-lv="3">
          <div class="stars" style="color:#c94f60">★★★★</div>
          <h2>高级 · 智多星学院</h2>
          <p>双图对比、和差拼大方框、两刀截木板——变式综合级试炼</p>
          <span class="tag">共 3 关</span>
        </button>
      </div>
    </section>
    <!-- 游戏界面 -->
    <section id="scr-game" class="screen hidden">
      <div class="game-head">
        <div id="g-title">…</div>
        <div class="g-btns">
          <button class="btn" id="btn-task">📜 任务卷轴</button>
          <button class="btn" id="btn-rules">📖 规则说明</button>
          <button class="btn warn" id="btn-reveal">💡 揭示答案</button>
          <button class="btn" id="btn-restart">🔄 重新开始</button>
          <button class="btn" id="btn-back">🏠 返回难度选择</button>
        </div>
      </div>
      <div class="game-body">
        <div class="stage-panel"><canvas id="stage"></canvas></div>
        <aside class="side-panel" id="side-panel"></aside>
      </div>
    </section>
  </main>
</div>

<!-- 弹窗 -->
<div id="modal-mask" class="hidden">
  <div id="modal-box">
    <h3 id="modal-title">标题</h3>
    <div id="modal-body"></div>
    <button class="btn primary" id="modal-close">知道啦</button>
  </div>
</div>
<canvas id="fx"></canvas>
<div id="toast"></div>

<script>
'use strict';
/* =====================================================================
   周长面积魔法工坊（第7讲 长方形和正方形）
   —— 三个驿站九个关卡，全部取自本讲教参原题
   初级：题1 平移求周长 / 题3 剪正方形 / 题9 正方形长个儿
   中级：题13 机器零件 / 题16 剪长方形 / 题10 水池草地
   高级：题14 双图比周长 / 题4 和差拼方框 / 题18 两刀截木板
   ===================================================================== */

/* ---------------- 小工具 ---------------- */
const $s = function(sel){ return document.querySelector(sel); };
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
let toastTimer = 0;
function toast(msg){
  const el = $s('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 1800);
}
function openModal(title, html){ $s('#modal-title').textContent = title; $s('#modal-body').innerHTML = html; $s('#modal-mask').classList.remove('hidden'); }
function closeModal(){ $s('#modal-mask').classList.add('hidden'); }

/* ---------------- 随机色板（每局换新衣） ---------------- */
const PALETTES = [
  { bg:'#eaf4ff', panel:'#ffffff', ink:'#1c2b3a', p:'#1d6fd1', pd:'#124d8c', accent:'#ff9f1c', soft:'#d7e9ff' },
  { bg:'#eefaf0', panel:'#ffffff', ink:'#1e2f24', p:'#1f9d55', pd:'#12693a', accent:'#ff8c42', soft:'#d5f2de' },
  { bg:'#fff0ef', panel:'#ffffff', ink:'#3a2222', p:'#e0566b', pd:'#a93346', accent:'#f6b352', soft:'#ffe1e4' },
  { bg:'#f3edff', panel:'#ffffff', ink:'#2c2340', p:'#7a5cc8', pd:'#513a94', accent:'#f4a259', soft:'#e6dcff' },
  { bg:'#fff6e8', panel:'#ffffff', ink:'#3d2a16', p:'#e07a1f', pd:'#a5560c', accent:'#2e9aa8', soft:'#ffe6c7' },
  { bg:'#e8fbfa', panel:'#ffffff', ink:'#12332f', p:'#0e9594', pd:'#085f5e', accent:'#f25c54', soft:'#cdf1ef' }
];
let PAL = PALETTES[0];
function applyPalette(){
  PAL = PALETTES[Math.floor(Math.random() * PALETTES.length)];
  const r = document.documentElement.style;
  r.setProperty('--bg', PAL.bg); r.setProperty('--panel', PAL.panel);
  r.setProperty('--ink', PAL.ink); r.setProperty('--p', PAL.p); r.setProperty('--pd', PAL.pd);
  r.setProperty('--accent', PAL.accent); r.setProperty('--soft', PAL.soft);
}

/* ---------------- 全局状态 ---------------- */
const G = {
  lv: 0,            // 当前驿站 1/2/3
  order: [],        // 本局随机排序后的关卡键名
  idx: 0,           // 当前第几关
  steps: 0,         // 操作步数
  sec: 0,           // 计时秒数
  timerId: 0,       // 计时器
  round: null       // 当前关卡控制器
};

/* ---------------- 画布与世界坐标 ---------------- */
const cv = $s('#stage');
const ctx = cv.getContext('2d');
const VIEW = { w: 0, h: 0, dpr: 1, scale: 1, ox: 0, oy: 0, worldW: 100, worldH: 100, pad: 16 };
function resizeCanvas(){
  const r = cv.parentElement.getBoundingClientRect();
  VIEW.dpr = window.devicePixelRatio || 1;
  VIEW.w = Math.max(200, r.width - 16); VIEW.h = Math.max(200, r.height - 16);
  cv.width = Math.round(VIEW.w * VIEW.dpr); cv.height = Math.round(VIEW.h * VIEW.dpr);
  cv.style.width = VIEW.w + 'px'; cv.style.height = VIEW.h + 'px';
  applyWorld();
}
function setWorld(w, h){ VIEW.worldW = w; VIEW.worldH = h; applyWorld(); }
function applyWorld(){
  const aw = VIEW.w - VIEW.pad * 2, ah = VIEW.h - VIEW.pad * 2;
  VIEW.scale = Math.min(aw / VIEW.worldW, ah / VIEW.worldH);
  VIEW.ox = (VIEW.w - VIEW.scale * VIEW.worldW) / 2;
  VIEW.oy = (VIEW.h - VIEW.scale * VIEW.worldH) / 2;
}
function X(x){ return VIEW.ox + x * VIEW.scale; }
function Y(y){ return VIEW.oy + y * VIEW.scale; }
function toWorld(ev){
  const r = cv.getBoundingClientRect();
  return { x: (ev.clientX - r.left - VIEW.ox) / VIEW.scale, y: (ev.clientY - r.top - VIEW.oy) / VIEW.scale };
}

/* ---------------- 绘图小助手 ---------------- */
function drawPoly(pts, opt){
  const o = opt || {};
  ctx.beginPath();
  ctx.moveTo(X(pts[0][0]), Y(pts[0][1]));
  for (let i = 1; i < pts.length; i++) ctx.lineTo(X(pts[i][0]), Y(pts[i][1]));
  ctx.closePath();
  if (o.fill){ ctx.fillStyle = o.fill; ctx.fill(); }
  if (o.stroke !== false){
    ctx.lineWidth = o.lw || Math.max(3, VIEW.scale * 0.55);
    ctx.strokeStyle = o.stroke || PAL.ink;
    ctx.lineJoin = 'round';
    if (o.dash) ctx.setLineDash(o.dash);
    ctx.stroke(); ctx.setLineDash([]);
  }
}
function seg(a, b, opt){
  const o = opt || {};
  ctx.beginPath();
  ctx.moveTo(X(a[0]), Y(a[1])); ctx.lineTo(X(b[0]), Y(b[1]));
  ctx.lineWidth = o.lw || Math.max(4, VIEW.scale * 0.7);
  ctx.strokeStyle = o.color || PAL.p; ctx.lineCap = 'round';
  if (o.dash) ctx.setLineDash(o.dash);
  ctx.stroke(); ctx.setLineDash([]);
}
function txt(s, x, y, opt){
  const o = opt || {};
  const size = o.size || Math.max(16, Math.round(VIEW.scale * 1.5));
  ctx.font = (o.bold === false ? '' : 'bold ') + size + 'px "Microsoft YaHei","PingFang SC",sans-serif';
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle';
  if (o.halo !== false){
    ctx.lineWidth = Math.max(3, size / 5); ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.strokeText(s, X(x), Y(y));
  }
  ctx.fillStyle = o.color || PAL.ink; ctx.fillText(s, X(x), Y(y));
}
function distToSeg(px, py, ax, ay, bx, by){
  const dx = bx - ax, dy = by - ay; const L2 = dx * dx + dy * dy;
  let t = L2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / L2 : 0;
  t = clamp(t, 0, 1);
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}
/* 闪现圆环特效 */
const flashes = [];
function flash(x, y, color){ flashes.push({ x: x, y: y, t0: performance.now(), color: color }); }
function drawFlashes(now){
  for (let i = flashes.length - 1; i >= 0; i--){
    const f = flashes[i]; const k = (now - f.t0) / 500;
    if (k > 1){ flashes.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.arc(X(f.x), Y(f.y), 12 + 46 * k, 0, Math.PI * 2);
    ctx.lineWidth = 5 * (1 - k) + 1; ctx.strokeStyle = f.color;
    ctx.globalAlpha = 1 - k; ctx.stroke(); ctx.globalAlpha = 1;
  }
}
/* 简单补间（用于弹性归位） */
const tweens = [];
function tween(obj, prop, to, dur){
  tweens.push({ obj: obj, prop: prop, from: obj[prop], to: to, t0: performance.now(), dur: dur });
}
function tickTweens(now){
  for (let i = tweens.length - 1; i >= 0; i--){
    const t = tweens[i]; let k = (now - t.t0) / t.dur;
    if (k >= 1){ t.obj[t.prop] = t.to; tweens.splice(i, 1); continue; }
    k = 1 - (1 - k) * (1 - k);   // 减速缓动
    t.obj[t.prop] = t.from + (t.to - t.from) * k;
  }
}

/* ---------------- 彩纸庆祝 ---------------- */
const fx = $s('#fx'); const fctx = fx.getContext('2d');
let parts = [], fxRun = false;
function fxResize(){ fx.width = window.innerWidth; fx.height = window.innerHeight; }
function confetti(n){
  fxResize();
  const colors = [PAL.p, PAL.accent, PAL.pd, '#ffd166', '#06d6a0', '#ef476f'];
  for (let i = 0; i < n; i++){
    parts.push({
      x: Math.random() * fx.width, y: -20 - Math.random() * fx.height * 0.3,
      vx: (Math.random() - 0.5) * 3, vy: 2 + Math.random() * 4,
      w: 6 + Math.random() * 8, h: 8 + Math.random() * 10,
      rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.25,
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
  if (!fxRun){ fxRun = true; fxLoop(); }
}
function fxLoop(){
  fctx.clearRect(0, 0, fx.width, fx.height);
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.rot += p.vr;
    if (p.y > fx.height + 30){ parts.splice(i, 1); continue; }
    fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.rot);
    fctx.fillStyle = p.color; fctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    fctx.restore();
  }
  if (parts.length){ requestAnimationFrame(fxLoop); }
  else { fxRun = false; fctx.clearRect(0, 0, fx.width, fx.height); }
}

/* ---------------- HUD：计时与步数 ---------------- */
function fmtTime(s){ const m = Math.floor(s / 60), r = s % 60; return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r; }
function startTimer(){
  stopTimer(); G.sec = 0; $s('#hud-timer').textContent = '⏱ 00:00';
  G.timerId = setInterval(function(){ G.sec++; $s('#hud-timer').textContent = '⏱ ' + fmtTime(G.sec); }, 1000);
}
function stopTimer(){ if (G.timerId){ clearInterval(G.timerId); G.timerId = 0; } }
function addStep(){
  G.steps++; $s('#hud-steps').textContent = '👣 ' + G.steps + ' 步';
}

/* =====================================================================
   关卡类型一：平移驿站（拖动高亮边线到虚线缺口，把图形“补”成长方形）
   用于 题1 / 题13 / 题14
   ===================================================================== */
function makeTranslateRound(cfg){
  const st = {
    cfg: cfg,
    drag: null,
    done: false,
    winAt: 0,
    /* 边片与缺口（运行时深拷贝，重开时互不影响） */
    pieces: cfg.pieces.map(function(p, i){
      return { ax: p.a[0], ay: p.a[1], bx: p.b[0], by: p.b[1], orient: p.orient, len: p.len,
               home: { ax: p.a[0], ay: p.a[1], bx: p.b[0], by: p.b[1] }, idx: i, filled: false };
    }),
    gaps: cfg.gaps.map(function(g){
      return { ax: g.a[0], ay: g.a[1], bx: g.b[0], by: g.b[1], orient: g.orient, len: g.len, filled: false };
    }),
    start: function(){
      setWorld(cfg.world[0], cfg.world[1]);
      this.renderSide();
    },
    filledCount: function(){ return this.gaps.filter(function(g){ return g.filled; }).length; },
    renderSide: function(){
      const c = this.filledCount(), n = this.gaps.length;
      let html = '<h3>🖐 动手平移</h3>'
        + '<div class="tip-box">' + cfg.howto + '</div>'
        + '<div class="progress-line" style="margin-top:10px">已归位：<span style="color:var(--p)">' + c + '</span> / ' + n + ' 条边</div>'
        + '<div class="progress-line" style="font-size:15px;color:var(--ink)">提示：方向要相同、长度要正好对上才会吸附哦</div>';
      if (this.done){
        html += '<div class="formula" style="margin-top:10px">' + cfg.formula + '</div>'
          + '<button class="btn primary next-btn" id="btn-next">➡ 下一关</button>';
      }
      $s('#side-panel').innerHTML = html;
      const nb = document.getElementById('btn-next');
      if (nb) nb.onclick = nextRound;
    },
    hit: function(p){
      const snap = 16 / VIEW.scale;
      for (let i = 0; i < this.pieces.length; i++){
        const q = this.pieces[i];
        if (q.filled) continue;
        if (distToSeg(p.x, p.y, q.ax, q.ay, q.bx, q.by) < snap){
          return { piece: q, off: { x: (q.ax + q.bx) / 2 - p.x, y: (q.ay + q.by) / 2 - p.y }, moved: false, sx: p.x, sy: p.y };
        }
      }
      return null;
    },
    move: function(p){
      const d = this.drag; if (!d) return;
      const cx = p.x + d.off.x, cy = p.y + d.off.y;
      const q = d.piece, w = q.bx - q.ax, h = q.by - q.ay;
      q.ax = cx - w / 2; q.bx = cx + w / 2; q.ay = cy - h / 2; q.by = cy + h / 2;
      if (Math.hypot(p.x - d.sx, p.y - d.sy) > 2 / VIEW.scale) d.moved = true;
    },
    up: function(){
      const d = this.drag; this.drag = null;
      if (!d || !d.moved) return;
      addStep();
      const q = d.piece, snap = 30 / VIEW.scale;
      let best = null, bd = 1e9;
      for (let i = 0; i < this.gaps.length; i++){
        const g = this.gaps[i];
        if (g.filled || g.orient !== q.orient || Math.abs(g.len - q.len) > 0.01) continue;
        const dist = Math.hypot((g.ax + g.bx) / 2 - (q.ax + q.bx) / 2, (g.ay + g.by) / 2 - (q.ay + q.by) / 2);
        if (dist < snap && dist < bd){ bd = dist; best = g; }
      }
      if (best){
        q.filled = true; best.filled = true;
        flash((best.ax + best.bx) / 2, (best.ay + best.by) / 2, '#1f9d55');
        toast('✨ 平移成功！这条边找到了新家');
        if (this.filledCount() === this.gaps.length){ this.win(); return; }
      } else {
        /* 弹性归位动画 */
        tween(q, 'ax', q.home.ax, 260); tween(q, 'ay', q.home.ay, 260);
        tween(q, 'bx', q.home.bx, 260); tween(q, 'by', q.home.by, 260);
        toast('💪 再试试：拖到【同方向】的虚线缺口旁边');
      }
      this.renderSide();
    },
    win: function(){
      this.done = true; this.winAt = performance.now();
      confetti(90);
      this.renderSide();
      const c = cfg;
      setTimeout(function(){
        openModal('🎉 本关点亮！',
          '<div class="win-stars">★★★</div><p><b>题目：</b>' + c.task + '</p>'
          + '<p class="qa">✔ ' + c.answer + '</p><p><b>解析：</b>' + c.solution + '</p>'
          + '<button class="btn primary" id="btn-next2">➡ 下一关</button>');
        document.getElementById('btn-next2').onclick = function(){ closeModal(); nextRound(); };
      }, 500);
    },
    draw: function(now){
      ctx.setTransform(VIEW.dpr, 0, 0, VIEW.dpr, 0, 0);
      ctx.clearRect(0, 0, VIEW.w, VIEW.h);
      /* 浅色点阵背景 */
      ctx.fillStyle = 'rgba(120,150,190,.16)';
      for (let gx = 20; gx < VIEW.w; gx += 34)
        for (let gy = 20; gy < VIEW.h; gy += 34) ctx.fillRect(gx, gy, 2, 2);
      /* 原图形（支持双图：shapes 数组） */
      const shapes = cfg.shapes || [{ pts: cfg.pts }];
      for (let s = 0; s < shapes.length; s++){
        drawPoly(shapes[s].pts, { fill: PAL.soft + 'cc', stroke: PAL.ink });
      }
      /* 图内数字标注 */
      (cfg.labels || []).forEach(function(L){ txt(L.t, L.x, L.y, L.opt); });
      /* 缺口（虚线 / 完成后绿色实线） */
      this.gaps.forEach(function(g){
        if (g.filled) seg([g.ax, g.ay], [g.bx, g.by], { color: '#1f9d55', lw: Math.max(5, VIEW.scale * 0.8) });
        else seg([g.ax, g.ay], [g.bx, g.by], { color: PAL.accent, dash: [10, 8], lw: Math.max(4, VIEW.scale * 0.6) });
      });
      /* 未归位的可拖边片（高亮 + 呼吸光） */
      const glow = 0.55 + 0.45 * Math.sin(now / 300);
      const S = this;
      this.pieces.forEach(function(q){
        if (q.filled) return;
        ctx.save(); ctx.shadowColor = PAL.accent; ctx.shadowBlur = 14 * glow;
        seg([q.ax, q.ay], [q.bx, q.by], { color: PAL.accent, lw: Math.max(6, VIEW.scale * 0.95) });
        ctx.restore();
        /* 被拖离原位时显示长度数字，方便对位 */
        if (Math.hypot(q.ax - q.home.ax, q.ay - q.home.ay) > 0.6){
          const offY = q.orient === 'h' ? -2.4 : 0;
          const offX = q.orient === 'v' ? 2.4 : 0;
          txt(String(q.len), (q.ax + q.bx) / 2 + offX, (q.ay + q.by) / 2 + offY,
            { color: '#a05a00', size: Math.max(16, Math.round(VIEW.scale * 1.05)) });
        }
      });
      /* 通关后：完整长方形浮现 + 额外边 + 结论 */
      if (this.done){
        const k = clamp((now - this.winAt) / 900, 0, 1);
        ctx.globalAlpha = 0.35 + 0.4 * k;
        const rects = cfg.rects || [cfg.rect];
        for (let r = 0; r < rects.length; r++){
          drawPoly(rects[r], { fill: '#ffffff', stroke: PAL.p, lw: Math.max(4, VIEW.scale * 0.6) });
        }
        ctx.globalAlpha = 1;
        if (k >= 0.6){
          (cfg.stubs || []).forEach(function(sg){ seg(sg.a, sg.b, { color: '#e4572e', lw: Math.max(4, VIEW.scale * 0.6) }); });
          (cfg.winLabels || []).forEach(function(L){ txt(L.t, L.x, L.y, L.opt); });
        }
        txt(cfg.winCaption, cfg.world[0] / 2, cfg.world[1] - 4, { size: Math.max(17, Math.round(VIEW.scale * 1.35)), color: PAL.pd });
      }
      drawFlashes(now);
    }
  };
  return st;
}

/* =====================================================================
   关卡类型二：剪纸工坊（拖动半透明剪纸框，实时观察周长变化）
   用于 题3 / 题16
   ===================================================================== */
function makeCutRound(cfg){
  const starts = [[0, 0], [cfg.W - cfg.a, 0], [0, cfg.H - cfg.b], [cfg.W - cfg.a, cfg.H - cfg.b]];
  const s0 = starts[Math.floor(Math.random() * starts.length)];
  const st = {
    cfg: cfg,
    cutter: { x: s0[0], y: s0[1], a: cfg.a, b: cfg.b },
    drag: null, moved: false,
    targets: cfg.targets.map(function(t){ return { v: t.v, tag: t.tag, hit: false }; }),
    done: false,
    start: function(){
      setWorld(cfg.world[0], cfg.world[1]);
      this.renderSide();
    },
    caseOf: function(){
      /* 判断剪纸框位置属于哪种剪法，并返回周长增量 */
      const c = this.cutter, e = 0.02;
      const L = Math.abs(c.x) < e, R = Math.abs(c.x - (cfg.W - c.a)) < e;
      const T = Math.abs(c.y) < e, B = Math.abs(c.y - (cfg.H - c.b)) < e;
      if ((L && T) || (L && B) || (R && T) || (R && B)) return { d: 0, name: '角上剪：周长不变' };
      if (L || R) return { d: 2 * c.a, name: '沿边剪：比原来多 2×' + c.a };
      if (T || B) return { d: 2 * c.b, name: '沿边剪：比原来多 2×' + c.b };
      return { d: 2 * (c.a + c.b), name: '中间剪：多 2×(' + c.a + '+' + c.b + ')' };
    },
    clampC: function(){
      /* 剪纸框必须完全在图形内，且至少贴住一条边（剪下的部分要连着边） */
      const c = this.cutter;
      c.x = clamp(c.x, 0, cfg.W - c.a); c.y = clamp(c.y, 0, cfg.H - cfg.b);
      const inner = c.x > 0.01 && c.x < cfg.W - c.a - 0.01 && c.y > 0.01 && c.y < cfg.H - cfg.b - 0.01;
      if (inner){
        const dl = c.x, dr = cfg.W - c.a - c.x, dtp = c.y, db = cfg.H - c.b - c.y;
        const m = Math.min(dl, dr, dtp, db);
        if (m === dl) c.x = 0; else if (m === dr) c.x = cfg.W - c.a;
        else if (m === dtp) c.y = 0; else c.y = cfg.H - c.b;
      }
      /* 磁吸：靠近某条边就精准贴住，避免“看起来贴住了却差一点点” */
      const MAG = 0.45;
      if (Math.abs(c.x) < MAG) c.x = 0;
      if (Math.abs(c.x - (cfg.W - c.a)) < MAG) c.x = cfg.W - c.a;
      if (Math.abs(c.y) < MAG) c.y = 0;
      if (Math.abs(c.y - (cfg.H - c.b)) < MAG) c.y = cfg.H - cfg.b;
    },
    curPerimeter: function(){ return cfg.base + this.caseOf().d; },
    renderSide: function(){
      let chips = '';
      this.targets.forEach(function(t, i){
        chips += '<div class="chip' + (t.hit ? ' hit' : '') + '" id="chip' + i + '"><span>🎯 ' + t.v + ' 厘米</span><span class="st">' + (t.hit ? '已达成' : '待达成') + '</span></div>';
      });
      let html = '<h3>✂ 剪纸挑战</h3>'
        + '<div class="tip-box">' + cfg.howto + '</div>'
        + '<div class="big-read" style="margin-top:8px">当前剩下图形的周长<span class="num" id="peri-num">' + this.curPerimeter() + '</span><span style="font-size:16px">厘米</span></div>'
        + '<div class="progress-line" style="margin-top:4px;color:var(--ink);font-size:16px" id="case-line">' + this.caseOf().name + '</div>'
        + '<h3 style="margin-top:10px">🎯 目标档案</h3>' + chips;
      if (this.done){
        html += '<div class="formula" style="margin-top:10px">' + cfg.formula + '</div>'
          + '<button class="btn primary next-btn" id="btn-next">➡ 下一关</button>';
      }
      $s('#side-panel').innerHTML = html;
      const nb = document.getElementById('btn-next');
      if (nb) nb.onclick = nextRound;
    },
    hit: function(p){
      /* 指针是世界坐标，剪纸框是图形内局部坐标：先换算再比对 */
      const lx = p.x - cfg.ox, ly = p.y - cfg.oy;
      const c = this.cutter, pad = 1.5;
      if (lx >= c.x - pad && lx <= c.x + c.a + pad && ly >= c.y - pad && ly <= c.y + c.b + pad){
        return { off: { x: c.x - lx, y: c.y - ly }, sx: lx, sy: ly };
      }
      return null;
    },
    move: function(p){
      if (!this.drag) return;
      const lx = p.x - cfg.ox, ly = p.y - cfg.oy;
      this.cutter.x = lx + this.drag.off.x; this.cutter.y = ly + this.drag.off.y;
      this.clampC();
      if (Math.hypot(lx - this.drag.sx, ly - this.drag.sy) > 2 / VIEW.scale) this.moved = true;
      const pn = document.getElementById('peri-num'), cl = document.getElementById('case-line');
      if (pn) pn.textContent = String(this.curPerimeter());
      if (cl) cl.textContent = this.caseOf().name;
    },
    up: function(){
      if (!this.drag) return;
      this.drag = null;
      if (!this.moved) return;
      this.moved = false; addStep();
      const cur = this.curPerimeter(), S = this;
      this.targets.forEach(function(t){
        if (!t.hit && cur === t.v){
          t.hit = true; flash(S.cfg.ox + S.cutter.x + S.cutter.a / 2, S.cfg.oy + S.cutter.y + S.cutter.b / 2, '#1f9d55');
          toast('🎯 目标达成：周长 ' + t.v + ' 厘米！');
        }
      });
      this.renderSide();
      if (this.targets.every(function(t){ return t.hit; })) this.win();
    },
    win: function(){
      this.done = true;
      confetti(90);
      this.renderSide();
      const c = cfg;
      setTimeout(function(){
        openModal('🎉 本关点亮！',
          '<div class="win-stars">★★★</div><p><b>题目：</b>' + c.task + '</p>'
          + '<p class="qa">✔ ' + c.answer + '</p><p><b>解析：</b>' + c.solution + '</p>'
          + '<button class="btn primary" id="btn-next2">➡ 下一关</button>');
        document.getElementById('btn-next2').onclick = function(){ closeModal(); nextRound(); };
      }, 500);
    },
    draw: function(now){
      ctx.setTransform(VIEW.dpr, 0, 0, VIEW.dpr, 0, 0);
      ctx.clearRect(0, 0, VIEW.w, VIEW.h);
      ctx.fillStyle = 'rgba(120,150,190,.16)';
      for (let gx = 20; gx < VIEW.w; gx += 34)
        for (let gy = 20; gy < VIEW.h; gy += 34) ctx.fillRect(gx, gy, 2, 2);
      const c = { x: cfg.ox, y: cfg.oy };
      /* 底图大图形 */
      drawPoly([[c.x, c.y], [c.x + cfg.W, c.y], [c.x + cfg.W, c.y + cfg.H], [c.x, c.y + cfg.H]], { fill: PAL.soft + 'cc', stroke: PAL.ink });
      /* 尺寸标注 */
      txt(String(cfg.W), c.x + cfg.W / 2, c.y + cfg.H + 3.4, { size: Math.max(16, VIEW.scale), color: PAL.pd });
      txt(String(cfg.H), c.x - 3.4, c.y + cfg.H / 2, { size: Math.max(16, VIEW.scale), color: PAL.pd });
      /* 剪刀框 */
      const k = this.cutter;
      ctx.save();
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.fillRect(X(c.x + k.x), Y(c.y + k.y), k.a * VIEW.scale, k.b * VIEW.scale);
      ctx.strokeStyle = '#e4572e'; ctx.lineWidth = Math.max(4, VIEW.scale * 0.6);
      ctx.setLineDash([12, 7]);
      ctx.strokeRect(X(c.x + k.x), Y(c.y + k.y), k.a * VIEW.scale, k.b * VIEW.scale);
      ctx.setLineDash([]); ctx.restore();
      txt('剪纸框 ' + cfg.a + '×' + cfg.b, c.x + k.x + k.a / 2, c.y + k.y + k.b / 2, { size: Math.max(15, Math.round(VIEW.scale * 1.05)), color: '#a33327' });
      /* 当前剪法提示牌 + 实时周长 */
      const info = this.caseOf();
      txt(info.name, c.x + cfg.W / 2, c.y - 3.4, { size: Math.max(16, Math.round(VIEW.scale * 1.2)), color: '#a05a00' });
      txt('剩下图形周长 = ' + this.curPerimeter() + ' 厘米', c.x + cfg.W / 2, c.y + cfg.H + 9, { size: Math.max(17, Math.round(VIEW.scale * 1.3)), color: PAL.p });
      if (this.done){
        txt(cfg.winCaption, c.x + cfg.W / 2, c.y + cfg.H + 15, { size: Math.max(17, Math.round(VIEW.scale * 1.3)), color: '#1f9d55' });
      }
      drawFlashes(now);
    }
  };
  return st;
}

/* =====================================================================
   关卡类型三：滑块探秘（拖动滑块，画面实时生长，寻找目标数值）
   用于 题4 / 题9 / 题10 / 题18
   ===================================================================== */
function makeSliderRound(cfg){
  const st = {
    cfg: cfg,
    vals: {},
    done: false,
    start: function(){
      setWorld(cfg.world[0], cfg.world[1]);
      /* 随机初始值，且避开正确答案 */
      const S = this;
      cfg.sliders.forEach(function(sl){
        let v = sl.min + Math.floor(Math.random() * (sl.max - sl.min + 1));
        if (sl.avoid && v === sl.avoid) v = sl.avoid > sl.min ? sl.avoid - 1 : sl.avoid + 1;
        S.vals[sl.key] = v;
      });
      if (cfg.afterInit) cfg.afterInit(S);
      this.renderSide();
    },
    renderSide: function(){
      const S = this;
      let slidersHtml = '';
      cfg.sliders.forEach(function(sl){
        slidersHtml += '<div class="slider-row"><label>' + sl.name
          + '<span class="val" id="v-' + sl.key + '">' + S.vals[sl.key] + '</span></label>'
          + '<input type="range" id="s-' + sl.key + '" min="' + sl.min + '" max="' + sl.max + '" step="1" value="' + S.vals[sl.key] + '"></div>';
      });
      let chips = '';
      cfg.targets.forEach(function(t, i){
        chips += '<div class="chip" id="chip' + i + '"><span>' + t.name + '</span><span class="st" id="st' + i + '">…</span></div>';
      });
      let html = '<h3>🎚 探秘调节台</h3>'
        + '<div class="tip-box">' + cfg.howto + '</div>'
        + slidersHtml
        + '<h3 style="margin-top:10px">🎯 目标档案</h3>' + chips;
      if (this.done){
        html += '<div class="formula" style="margin-top:10px">' + cfg.formula + '</div>'
          + '<button class="btn primary next-btn" id="btn-next">➡ 下一关</button>';
      }
      $s('#side-panel').innerHTML = html;
      cfg.sliders.forEach(function(sl){
        const el = document.getElementById('s-' + sl.key);
        el.addEventListener('input', function(){
          if (S.done) return;
          S.vals[sl.key] = parseInt(el.value, 10);
          if (cfg.onSlide) cfg.onSlide(S);
          const lbl = document.getElementById('v-' + sl.key);
          if (lbl) lbl.textContent = el.value;
          S.updateChips();
        });
        el.addEventListener('change', function(){ addStep(); });
      });
      const nb = document.getElementById('btn-next');
      if (nb) nb.onclick = nextRound;
      this.updateChips();
    },
    updateChips: function(){
      const S = this;
      cfg.targets.forEach(function(t, i){
        const el = document.getElementById('chip' + i), stEl = document.getElementById('st' + i);
        if (!el || !stEl) return;
        stEl.textContent = String(t.get(S)) + (t.ok(S) ? ' ✔' : '');
        el.classList.toggle('hit', t.ok(S));
        el.classList.toggle('near', !t.ok(S) && t.near && t.near(S));
      });
    },
    checkWin: function(){
      if (this.done) return;
      const S = this;
      if (cfg.targets.every(function(t){ return t.ok(S); })) this.win();
    },
    win: function(){
      this.done = true;
      cfg.sliders.forEach(function(sl){
        const el = document.getElementById('s-' + sl.key);
        if (el) el.disabled = true;
      });
      confetti(90);
      this.renderSide();
      const c = cfg;
      setTimeout(function(){
        openModal('🎉 本关点亮！',
          '<div class="win-stars">★★★</div><p><b>题目：</b>' + c.task + '</p>'
          + '<p class="qa">✔ ' + c.answer + '</p><p><b>解析：</b>' + c.solution + '</p>'
          + '<button class="btn primary" id="btn-next2">➡ 下一关</button>');
        document.getElementById('btn-next2').onclick = function(){ closeModal(); nextRound(); };
      }, 500);
    },
    draw: function(now){
      ctx.setTransform(VIEW.dpr, 0, 0, VIEW.dpr, 0, 0);
      ctx.clearRect(0, 0, VIEW.w, VIEW.h);
      ctx.fillStyle = 'rgba(120,150,190,.16)';
      for (let gx = 20; gx < VIEW.w; gx += 34)
        for (let gy = 20; gy < VIEW.h; gy += 34) ctx.fillRect(gx, gy, 2, 2);
      cfg.draw(this, now);
      drawFlashes(now);
    }
  };
  return st;
}

/* —— 题1：阶梯图形求周长（平移法） —— */
function roundQ1(){

  const P = function(a){ return [a[0] + off[0], a[1] + off[1]]; };
  const pts = [[0,0],[80,0],[80,40],[95,40],[95,80],[0,80]].map(P);
  const rect = [[0,0],[95,0],[95,80],[0,80]].map(P);
  return makeTranslateRound({
    world: [132, 116],
    shapes: [{ pts: pts }],
    rects: [rect],
    labels: [
      { t: '80', x: 58, y: 9 }, { t: '80', x: 11, y: 56 },
      { t: '40', x: 94, y: 36, opt: { align: 'right' } },
      { t: '15', x: 105.5, y: 63 }, { t: '40', x: 122, y: 76 }
    ],
    pieces: [
      { a: P([80,40]), b: P([95,40]), orient: 'h', len: 15 },
      { a: P([80,0]),  b: P([80,40]), orient: 'v', len: 40 }
    ],
    gaps: [
      { a: P([80,0]), b: P([95,0]), orient: 'h', len: 15 },
      { a: P([95,0]), b: P([95,40]), orient: 'v', len: 40 }
    ],
    stubs: [],
    winLabels: [
      { t: '长 = 80+15 = 95', x: 66, y: 6 },
      { t: '宽 = 40+40 = 80', x: 66, y: 104 }
    ],
    winCaption: '周长 = (95+80)×2 = 350 厘米',
    howto: '图中两条<b>发亮的边</b>可以拖动。想一想：把它们平移到哪里，图形就能变成长 95、宽 80 的长方形？拖到<b>橙色虚线</b>处即可吸附！',

      if (S.vals.W >= S.vals.L) S.vals.W = S.vals.L - 1;
      if (S.vals.L === 8 && S.vals.W === 3) S.vals.W = 2;   /* 避免开局即通关 */
    },
    onSlide: function(S){
      if (S.vals.W >= S.vals.L){ S.vals.W = S.vals.L - 1; }
      const el = document.getElementById('s-W');
      if (el && parseInt(el.value, 10) !== S.vals.W) el.value = String(S.vals.W);
      const lbl = document.getElementById('v-W');
      if (lbl) lbl.textContent = String(S.vals.W);
      S.checkWin();
    },
    targets: [
      { name: '🎯 大正方形面积 = 121',
        get: function(S){ const s = S.vals.L + S.vals.W; return s * s; },
        ok: function(S){ const s = S.vals.L + S.vals.W; return s * s === 121; },
        near: function(S){ const s = S.vals.L + S.vals.W; return Math.abs(s * s - 121) <= 20; } },
      { name: '🎯 小正方形面积 = 25',
        get: function(S){ const d = S.vals.L - S.vals.W; return d * d; },
        ok: function(S){ const d = S.vals.L - S.vals.W; return d * d === 25; },
        near: function(S){ const d = S.vals.L - S.vals.W; return Math.abs(d * d - 25) <= 12; } }
    ],
    draw: function(S){
      const L = S.vals.L, W = S.vals.W, SS = L + W;
      const ox = (40 - SS) / 2, oy2 = (40 - SS) / 2 + 2;
      const R = function(x1, y1, x2, y2, fill){ drawPoly([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], { fill: fill, stroke: PAL.ink }); };
      /* 回字形四块：下、左、上、右 */
      R(ox, oy2 + SS - W, ox + L, oy2 + SS, PAL.p);
      R(ox, oy2 + W, ox + W, oy2 + SS, '#7fb3e8');
      R(ox + W, oy2 + L, ox + SS, oy2 + SS, '#7fb3e8');
      R(ox + L, oy2, ox + SS, oy2 + L, '#7fb3e8');
      /* 中间小正方形（孔） */
      drawPoly([[ox + W, oy2 + W], [ox + L, oy2 + W], [ox + L, oy2 + L], [ox + W, oy2 + L]], { fill: '#ffffff', stroke: '#e4572e' });
      /* 标注 */
      txt('长 ' + L, ox + L / 2, oy2 + SS - W / 2, { size: Math.max(15, Math.round(VIEW.scale * 1.05)), color: '#ffffff' });
      txt('宽 ' + W, ox + W / 2, oy2 + W + (SS - W) / 2, { size: Math.max(15, Math.round(VIEW.scale * 1.05)), color: '#0d3c60' });
      txt('大边长 ' + SS + '，面积 ' + SS * SS, ox + SS / 2, oy2 - 3.4, { size: Math.max(16, Math.round(VIEW.scale * 1.15)), color: '#124d8c' });
      txt('孔边长 ' + (L - W) + '，面积 ' + (L - W) * (L - W), ox + SS / 2, oy2 + (W + L) / 2, { size: Math.max(15, Math.round(VIEW.scale * 1.0)), color: '#a33327' });
      if (S.done) txt('长 = 8 厘米，宽 = 3 厘米', ox + SS / 2, oy2 + SS + 4, { size: Math.max(17, Math.round(VIEW.scale * 1.2)), color: '#1f9d55' });
    }
  });
}

/* —— 题18：正方形截去两刀（滑块） —— */
function roundQ18(){
  return makeSliderRound({
    world: [48, 50],
    sliders: [ { key: 's', name: '原正方形边长（分米）', min: 15, max: 30, avoid: 21 } ],
    howto: '木板上截去<b>宽 11 分米</b>和<b>宽 7 分米</b>的两条！拖动滑块，当<b>减少的面积恰好是 301 平方分米</b>时，原正方形的面积就出现了。',
    task: '如图所示，在一个正方形上先截去宽11分米的长方形，再截去宽7分米的长方形，所得图形的面积比原正方形减少301平方分米。求原正方形的面积。',
    answer: '441平方分米',
    solution: '把截去的两个长方形拼在一起，再补上长 11 分米、宽 7 分米的小长方形，得到的大长方形面积 = 301+11×7 = 378（平方分米），它的宽 = 11+7 = 18（分米），长 = 原正方形边长 = 378÷18 = 21（分米），所以原正方形面积 = 21×21 = 441（平方分米）。',
    formula: '301+11×7=378 → 378÷(11+7)=21 → 21×21=441（平方分米）',
    targets: [
      { name: '🎯 减少面积 = 301 平方分米',
        get: function(S){ const s = S.vals.s; return 11 * s + 7 * s - 11 * 7; },
        ok: function(S){ const s = S.vals.s; return 11 * s + 7 * s - 11 * 7 === 301; },
        near: function(S){ const s = S.vals.s; return Math.abs(11 * s + 7 * s - 77 - 301) <= 36; } }
    ],
    onSlide: function(S){ S.checkWin(); },
    draw: function(S){
      const s = S.vals.s, ox = (48 - s) / 2, oy2 = (50 - s) / 2 + 3;
      /* 原正方形 */
      drawPoly([[ox, oy2], [ox + s, oy2], [ox + s, oy2 + s], [ox, oy2 + s]], { fill: PAL.soft, stroke: PAL.ink });
      /* 截去宽 11 的竖条（贴左边） */
      ctx.globalAlpha = 0.8;
      drawPoly([[ox, oy2], [ox + 11, oy2], [ox + 11, oy2 + s], [ox, oy2 + s]], { fill: '#f2b8c6', stroke: '#a93346' });
      /* 截去宽 7 的横条（贴下边） */
      drawPoly([[ox, oy2 + s - 7], [ox + s, oy2 + s - 7], [ox + s, oy2 + s], [ox, oy2 + s]], { fill: '#f9d9a8', stroke: '#a5560c' });
      /* 重叠角 */
      drawPoly([[ox, oy2 + s - 7], [ox + 11, oy2 + s - 7], [ox + 11, oy2 + s], [ox, oy2 + s]], { fill: '#e4572e', stroke: '#8c2f1c' });
      ctx.globalAlpha = 1;
      txt('宽 11', ox + 5.5, oy2 + s / 2, { size: Math.max(15, Math.round(VIEW.scale * 1.0)), color: '#8c2f1c' });
      txt('宽 7', ox + s / 2 + 6, oy2 + s - 3.5, { size: Math.max(15, Math.round(VIEW.scale * 1.0)), color: '#a5560c' });
      txt('边长 ' + s, ox + s / 2, oy2 - 3.4, { size: Math.max(16, Math.round(VIEW.scale * 1.15)), color: '#124d8c' });
      const cut = 11 * s + 7 * s - 77;
      txt('减少面积 = 11×' + s + ' + 7×' + s + ' − 11×7 = ' + cut + ' 平方分米', 24, 3, { size: Math.max(16, Math.round(VIEW.scale * 1.15)), color: PAL.p });
      if (S.done) txt('原正方形面积 = 21×21 = 441 平方分米', 24, 47, { size: Math.max(16, Math.round(VIEW.scale * 1.15)), color: '#1f9d55' });

  });
}

cv.addEventListener('pointerdown', function(e){
  if (!G.round || G.round.done || !G.round.hit) return;
  const p = toWorld(e);
  const hit = G.round.hit(p);
  if (hit){
    G.round.drag = hit;
    cv.style.cursor = 'grabbing';
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* 捕获失败不影响拖动 */ }
  }
});
cv.addEventListener('pointermove', function(e){
  if (!G.round || !G.round.drag || !G.round.move) return;
  e.preventDefault();
  G.round.move(toWorld(e));
});
cv.addEventListener('pointerup', function(){
  if (!G.round) return;
  cv.style.cursor = 'grab';
  if (G.round.drag && G.round.up) G.round.up();
});
cv.addEventListener('pointercancel', function(){
  if (G.round && G.round.drag) G.round.drag = null;
});

  var body="【游戏】"+M.name+"\n【标识】"+M.id+" v"+M.ver+"\n【教参】"+M.jiaocan+"\n【学段/年级】"+M.stage+" / "+(M.grade||"通用")+"\n【系列】"+M.series
   +"\n【问题类型】"+cat+"\n【问题描述】"+txt+"\n【联系】"+(ct.value.trim()||"无")+"\n【时间】"+new Date().toLocaleString()+"\n【环境】"+navigator.userAgent;
  return {title:title,body:body,plain:body};
 }
 var row=el("div","tafb-row");
 var cp=el("button","tafb-cp","复制反馈内容");
 cp.onclick=function(){
  var p=payload();
  var done=function(){cp.textContent="已复制 ✔";setTimeout(function(){cp.textContent="复制反馈内容";},1600);};
  function fallback(){var t=el("textarea");t.value=p.plain;document.body.appendChild(t);t.select();try{document.execCommand("copy");done();}catch(e){}t.remove();}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(p.plain).then(done,fallback);}else{fallback();}
 };
 var ok=el("a","tafb-ok","提交（打开网页）");ok.target="_blank";ok.rel="noopener";ok.href="#";
 ok.onclick=function(e){e.preventDefault();var p=payload();
  var u=ISS+encodeURIComponent(p.title)+"&body="+encodeURIComponent(p.body);
  var a=el("a");a.href=u;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();};
 row.appendChild(cp);row.appendChild(ok);box.appendChild(row);
 var tip=el("div","g","「提交」会用系统浏览器打开 GitHub 反馈页（需登录），提交即建一条带游戏标识的建议；不方便登录就「复制反馈内容」发给作者。");
 tip.style.marginTop="10px";box.appendChild(tip);
 mask.appendChild(box);mask.onclick=function(e){if(e.target===mask)mask.remove();};
 document.documentElement.appendChild(mask);
}
