<div id="app">
  <!-- 顶栏：标题 + 计时/步数（右上角实时显示） -->
  <header>
    <div>
      <div class="g-title">数论智慧环游记</div>
      <div class="g-sub" id="gsub">第9讲 数论综合（二） · 互动挑战</div>
    </div>
    <div class="hud">
      <div class="hud-chip" id="hud-time" title="用时">时间 <b>00:00</b></div>
      <div class="hud-chip" id="hud-step" title="操作步数">步数 <b>0</b></div>
      <button class="btn small ghost" id="btn-rules">玩法说明</button>
      <button class="btn small gray" id="btn-home" style="display:none">返回难度选择</button>
    </div>
  </header>

  <!-- 首页：难度选择 -->
  <section class="screen on" id="scr-home">
    <div class="home-head">
      <h2>选择你的冒险难度</h2>
      <p>四个互动站：转身广场 · 圆圈舞会 · 魔法茶杯 · 同余集市</p>
    </div>
    <div class="lv-grid" id="lv-grid"></div>
  </section>

  <!-- 关卡地图 -->
  <section class="screen" id="scr-map">
    <div class="map-head" id="map-head"></div>
    <div class="map-tip">点击任意一站开始挑战（顺序自由），四站全部完成会有大惊喜！</div>
    <div class="st-grid" id="st-grid"></div>
    <div class="map-progress" id="map-progress"></div>
  </section>

  <!-- 挑战页 -->
  <section class="screen" id="scr-play">
    <div class="play-top">
      <div class="play-title" id="play-title"></div>
    </div>
    <div class="panel problem-card" id="problem-card"></div>
    <div class="stage" id="stage"></div>
    <div class="hint-bar" id="hint-bar"></div>
    <div class="action-bar">
      <button class="btn gold" id="btn-reveal">揭示答案</button>
      <button class="btn blue" id="btn-restart">重新开始</button>
      <button class="btn gray" id="btn-tomap">返回难度选择</button>
    </div>
  </section>
</div>

<!-- 规则弹窗 -->
<div class="overlay" id="ov-rules">
  <div class="modal">
    <h3 id="rules-title">玩法说明</h3>
    <div class="mbody" id="rules-body"></div>
    <div class="mrow"><button class="btn" id="rules-ok">我知道啦，出发！</button></div>
  </div>
</div>

<!-- 胜利/结算弹窗 -->
<div class="overlay" id="ov-win">
  <div class="modal">
    <div class="win-star" id="win-star">★</div>
    <h3 id="win-title"></h3>
    <div class="mbody" id="win-body"></div>
    <div class="mrow" id="win-btns"></div>
  </div>
</div>
