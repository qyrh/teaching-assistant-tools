<script>(function(){"use strict";function $(s){return document.querySelector(s)}function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}function ri(a,b){return a+Math.floor(Math.random()*(b-a+1))}function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function fmtTime(sec){const m=Math.floor(sec/60),s=sec%60;return(m<10?"0":"")+m+":"+(s<10?"0":"")+s}function nearSeg(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,L2=dx*dx+dy*dy;let t=L2>0?((p.x-a.x)*dx+(p.y-a.y)*dy)/L2:0;t=Math.max(0,Math.min(1,t));const q={x:a.x+t*dx,y:a.y+t*dy};return{p:q,d:dist(p,q)}}const PALETTES=[{bg:"#EAF3FF",panel:"#FFFFFF",ink:"#1B3A5C",muted:"#5F7C9C",accent:"#1E6FE0",accent2:"#FF9F1C",good:"#17A05E",bad:"#E2483D",fig:"#CFE6FF",figLine:"#2B5E9E"},{bg:"#FFF2E6",panel:"#FFFFFF",ink:"#5A2E14",muted:"#A9785C",accent:"#E0731F",accent2:"#F2B705",good:"#0E8F55",bad:"#D63B2F",fig:"#FFE0C7",figLine:"#B25B2B"},{bg:"#E9FBF1",panel:"#FFFFFF",ink:"#14493B",muted:"#5F9083",accent:"#0E9F6E",accent2:"#FF8A3D",good:"#0B8A5C",bad:"#E2483D",fig:"#C9F2DF",figLine:"#1D7A5F"},{bg:"#F4EFFF",panel:"#FFFFFF",ink:"#3A2566",muted:"#8273AD",accent:"#7A4FE0",accent2:"#FFB020",good:"#17A05E",bad:"#E2483D",fig:"#E3D6FF",figLine:"#6C4BBF"},{bg:"#FFEDF2",panel:"#FFFFFF",ink:"#66183B",muted:"#A96B84",accent:"#E5397A",accent2:"#18AFAF",good:"#17A05E",bad:"#D63B2F",fig:"#FFD9E5",figLine:"#C24B7C"},{bg:"#FDF8DE",panel:"#FFFFFF",ink:"#5C4A10",muted:"#9A8A4A",accent:"#C07C00",accent2:"#3BA7A0",good:"#2E8B57",bad:"#D63B2F",fig:"#FBEFC1",figLine:"#A68819"}];const state={palIdx:ri(0,PALETTES.length-1),P:PALETTES[0],levels:[],idx:0,steps:0,startT:0,timerIv:null,stars:[],revealed:false,diff:"",token:0};let cur=null;function applyPalette(){const p=PALETTES[state.pal
