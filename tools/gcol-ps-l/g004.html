<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>图形运动 · 方格探险队</title>
<style>
/* ============ 全局与配色变量（每局随机换色板） ============ */
:root{
  --c1:#2563eb;        /* 主色 */
  --c2:#f59e0b;        /* 辅色 */
  --bg:#eff6ff;        /* 页面底色 */
  --ink:#1e293b;       /* 文字主色 */
  --grid:#b9c6d6;      /* 格线颜色 */
  --gold:#f59e0b;
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
  display:flex; flex-direction:column; align-items:center;
  min-height:100vh; overflow-x:hidden;
}

/* ============ 顶部栏 ============ */
#topBar{
  width:100%; max-width:1080px; display:flex; align-items:center; gap:12px;
  padding:10px 14px; flex-wrap:wrap;
}
#gameTitle{ font-size:26px; font-weight:900; color:var(--c1); letter-spacing:1px; }
#hud{
  display:flex; gap:10px; margin-left:auto; align-items:center; flex-wrap:wrap;
}
.hudChip{
  background:#fff; border:3px solid var(--c1); color:var(--c1);
  border-radius:14px; padding:6px 14px; font-size:20px; font-weight:800;
  min-width:120px; text-align:center;
}
#btns{ display:flex; gap:8px; flex-wrap:wrap; }
.tbtn{
  border:3px solid var(--c1); background:#fff; color:var(--c1);
  font-size:18px; font-weight:800; padding:8px 14px; border-radius:14px;
  cursor:pointer; transition:transform .12s, background .12s;
}
.tbtn:hover{ background:var(--c1); color:#fff; transform:translateY(-2px); }
.tbtn:active{ transform:translateY(0); }
.tbtn.warn{ border-color:var(--c2); color:var(--c2); }
.tbtn.warn:hover{ background:var(--c2); color:#fff; }

/* ============ 主菜单 ============ */
#menu{ width:100%; max-width:1080px; padding:10px 16px 40px; }
#menuIntro{
  background:#fff; border-radius:18px; padding:16px 20px; font-size:20px; line-height:1.7;
  border:3px dashed var(--c1); margin-bottom:22px;
}
#menuIntro b{ color:var(--c1); }
.diffRow{ display:flex; gap:18px; flex-wrap:wrap; justify-content:center; }
.diffCard{
  flex:1; min-width:250px; max-width:330px; background:#fff; border-radius:20px;
  border:4px solid var(--c1); padding:22px 18px; cursor:pointer; text-align:center;
  transition:transform .15s, box-shadow .15s;
}
.diffCard:hover{ transform:translateY(-6px); box-shadow:0 12px 24px rgba(30,41,59,.18); }
.diffCard h2{ font-size:24px; color:var(--c1); margin-bottom:8px; }
.diffCard .dsub{ font-size:17px; color:#475569; line-height:1.6; }
.diffCard .icon{ margin-bottom:10px; }
.diffCard.mid{ border-color:var(--c2); }
.diffCard.mid h2{ color:var(--c2); }
.diffCard.hard{ border-color:#0d9488; }
.diffCard.hard h2{ color:#0d9488; }

/* ============ 游戏区 ============ */
#gameWrap{ width:100%; max-width:1080px; padding:0 14px 40px; display:none; }
#levelInfo{ background:#fff; border-radius:16px; border:3px solid var(--c1); padding:12px 18px; }
#levelName{ font-size:22px; font-weight:900; color:var(--c1); margin-bottom:6px; }
#levelDesc{ font-size:19px; line-height:1.65; }
#stageTip{
  margin:12px 0; background:#fffbe8; border:3px solid var(--gold);
  border-radius:14px; padding:10px 16px; font-size:19px; font-weight:700; color:#92600a;
  display:none; min-height:64px;
}
#boardWrap{
  position:relative; margin:0 auto; width:fit-content; max-width:100%;
}
#board{
  position:relative; background:#fff; border:4px solid var(--ink); border-radius:6px;
  overflow:hidden; touch-action:none; box-shadow:0 8px 20px rgba(30,41,59,.12);
}
#overlay{ position:absolute; left:0; top:0; pointer-events:none; z-index:60; }

/* 画布内元素 */
.cell{ position:absolute; border-radius:4px; }
.cell.target{
  background:rgba(148,163,184,.16); border:2.5px dashed #94a3b8; z-index:1;
}
.cell.targetColor{ /* 带颜色的目标格（图案关） */
  background:rgba(255,255,255,.35); border:2.5px dashed #64748b; z-index:1;
  display:flex; align-items:center; justify-content:center;
}
.cell.block{
  background:var(--pc,#2563eb); border:2.5px solid rgba(255,255,255,.85);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.14); z-index:10; cursor:grab;
}
.cell.block.locked{ cursor:default; box-shadow:0 0 0 3px var(--gold) inset; }
.cell.block.sel{ outline:3px solid var(--ink); outline-offset:1px; }
.cell.given{
  background:var(--pc,#2563eb); border:2.5px solid rgba(255,255,255,.85);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.14); z-index:5;
}
.cell.painted{
  background:var(--c2); border:2.5px solid rgba(255,255,255,.85);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.14); z-index:6; cursor:pointer;
}
.cell.painted.wrong{ background:#f87171; animation:shakeX .35s; }
@keyframes shakeX{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-3px)} 75%{transform:translateX(3px)} }
.cell.revealGold{
  background:rgba(245,158,11,.45); border:3px solid var(--gold); z-index:8;
  animation:pulseGold 1s infinite;
}
@keyframes pulseGold{ 0%,100%{ box-shadow:0 0 0 0 rgba(245,158,11,.7);} 50%{ box-shadow:0 0 0 6px rgba(245,158,11,0);} }

/* 对称轴 */
.axisV, .axisH{ position:absolute; z-index:4; pointer-events:none; }
.axisV{
  width:4px;
  background:repeating-linear-gradient(135deg,#e11d48 0 10px,#fff 10px 20px);
  border-left:1px solid #e11d48; border-right:1px solid #e11d48;
}
.axisH{
  height:4px;
  background:repeating-linear-gradient(135deg,#e11d48 0 10px,#fff 10px 20px);
  border-top:1px solid #e11d48; border-bottom:1px solid #e11d48;
}

/* 旋转中心圆点 */
.centerDot{
  position:absolute; width:22px; height:22px; border-radius:50%;
  background:#fff; border:4px solid var(--c1); z-index:30; cursor:pointer;
  transition:transform .12s;
}
.centerDot:hover{ transform:scale(1.25); }
.centerDot.chosen{ background:var(--gold); border-color:#b45309; transform:scale(1.35); }
.centerDot.revealDot{ background:var(--gold); animation:pulseGold 1s infinite; }
.centerDot .lab{
  position:absolute; left:24px; top:-6px; font-size:16px; font-weight:900; color:#b45309;
  background:rgba(255,255,255,.9); padding:0 3px; border-radius:4px;
}

/* ============ 控制按钮区 ============ */
#controlBar{
  display:flex; gap:10px; margin:14px auto 0; justify-content:center; flex-wrap:wrap;
  max-width:1080px;
}
.dpad{ display:grid; grid-template-columns:repeat(3,64px); grid-template-rows:repeat(2,58px); gap:8px; }
.dbtn{
  border:3px solid var(--c1); background:#fff; color:var(--c1); border-radius:12px;
  font-size:24px; font-weight:900; cursor:pointer;
}
.dbtn:hover{ background:var(--c1); color:#fff; }
.rotBtns{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
.rbtn{
  border:3px solid var(--c2); background:#fff; color:var(--c2); border-radius:14px;
  font-size:19px; font-weight:800; padding:12px 18px; cursor:pointer;
}
.rbtn:hover{ background:var(--c2); color:#fff; }
.rbtn:disabled{ opacity:.45; cursor:not-allowed; }
.piecePick{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
.ppick{
  border:3px solid var(--c1); background:#fff; color:var(--c1); border-radius:14px;
  font-size:18px; font-weight:800; padding:10px 16px; cursor:pointer;
}
.ppick.on{ background:var(--c1); color:#fff; }
.ctlNote{ font-size:17px; color:#475569; align-self:center; }

/* ============ 模态层 ============ */
#modalMask{
  position:fixed; inset:0; background:rgba(15,23,42,.55); z-index:200;
  display:none; align-items:center; justify-content:center; padding:16px;
}
#modalBox{
  background:#fff; border-radius:20px; border:5px solid var(--c1);
  max-width:640px; width:100%; max-height:86vh; overflow:auto; padding:24px 26px;
}
#modalBox h3{ font-size:24px; color:var(--c1); margin-bottom:12px; }
#modalBox .mbody{ font-size:19px; line-height:1.75; }
#modalBox .mbody b{ color:var(--c1); }
#modalBox .mrow{ margin-top:18px; text-align:center; }
.mbtn{
  border:3px solid var(--c1); background:var(--c1); color:#fff; border-radius:14px;
  font-size:20px; font-weight:800; padding:12px 26px; cursor:pointer; margin:0 8px;
}
.mbtn.ghost{ background:#fff; color:var(--c1); }
.mbtn:hover{ transform:translateY(-2px); }
.ruleSec{ margin:10px 0; padding:10px 14px; background:var(--bg); border-radius:12px; }
.starRow{ display:flex; justify-content:center; gap:8px; margin:10px 0 4px; }
.starRow svg{ width:56px; height:56px; }
.starOn{ fill:var(--gold); stroke:#b45309; stroke-width:1.5; }
.starOff{ fill:#e2e8f0; stroke:#94a3b8; stroke-width:1.5; }

/* ============ 彩纸画布 ============ */
#confettiCv{ position:fixed; inset:0; pointer-events:none; z-index:300; display:none; }

/* ============ 响应式 ============ */
@media (max-width:720px){
  #gameTitle{ font-size:20px; }
  .hudChip{ font-size:16px; min-width:96px; padding:4px 8px; }
  .tbtn{ font-size:15px; padding:6px 10px; }
  #levelDesc{ font-size:17px; }
  #levelName{ font-size:19px; }
  #stageTip{ font-size:16px; }
  #modalBox .mbody{ font-size:17px; }
}
</style>
</head>
<body>

<!-- ===== 顶部栏：标题 / 计时步数 / 功能按钮 ===== -->
<div id="topBar">
  <div id="gameTitle">图形运动 · 方格探险队</div>
  <div id="hud">
    <div class="hudChip" id="hudTime">时间 00:00</div>
    <div class="hudChip" id="hudSteps">步数 0</div>
  </div>
  <div id="btns">
    <button class="tbtn" id="btnRules">玩法说明</button>
    <button class="tbtn warn" id="btnReveal">揭示答案</button>
    <button class="tbtn" id="btnRestart">重新开始</button>
    <button class="tbtn" id="btnBack">返回难度</button>
  </div>
</div>

<!-- ===== 主菜单：难度选择 ===== -->
<div id="menu">
  <div id="menuIntro">
    欢迎来到<b>方格探险队</b>！这里的一切图形都会"运动"：<b>平移</b>、<b>旋转</b>、<b>轴对称</b>。
    选择一个难度开始闯关吧——每一局的关卡和配色都会随机变化，多玩几局也不会腻哦！
  </div>
  <div class="diffRow">
    <div class="diffCard easy" data-diff="easy">
      <div class="icon">
        <svg width="64" height="44" viewBox="0 0 64 44">
          <rect x="4" y="14" width="20" height="16" rx="3" fill="#2563eb"/>
          <rect x="38" y="14" width="20" height="16" rx="3" fill="#f59e0b" opacity=".55"/>
          <path d="M27 22 h7 m-3 -3 l3 3 l-3 3" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <h2>初级 · 平移驿站</h2>
      <div class="dsub">拖一拖、移一移，<br>掌握平移的方向和距离，<br>用最少步数运送图形。</div>
    </div>
    <div class="diffCard mid" data-diff="mid">
      <div class="icon">
        <svg width="64" height="44" viewBox="0 0 64 44">
          <rect x="10" y="8" width="14" height="14" rx="3" fill="#f59e0b"/>
          <rect x="10" y="24" width="14" height="14" rx="3" fill="#f59e0b"/>
          <rect x="26" y="8" width="14" height="14" rx="3" fill="#f59e0b"/>
          <rect x="26" y="24" width="14" height="14" rx="3" fill="#f59e0b"/>
          <circle cx="25" cy="23" r="4" fill="#1e293b"/>
          <path d="M46 22 a9 9 0 1 1 -3 -7" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M43 11 l0 5 l5 0" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <h2>中级 · 旋转殿堂</h2>
      <div class="dsub">选中心、定方向、转角度，<br>玩转旋转三要素，<br>把图形转到目标位置。</div>
    </div>
    <div class="diffCard hard" data-diff="hard">
      <div class="icon">
        <svg width="64" height="44" viewBox="0 0 64 44">
          <rect x="8" y="12" width="10" height="18" rx="2" fill="#0d9488"/>
          <rect x="46" y="12" width="10" height="18" rx="2" fill="#0d9488" opacity=".55"/>
          <line x1="32" y1="4" x2="32" y2="40" stroke="#e11d48" stroke-width="3" stroke-dasharray="6 4"/>
          <circle cx="20" cy="17" r="2.5" fill="#1e293b"/>
          <circle cx="44" cy="17" r="2.5" fill="#1e293b"/>
        </svg>
      </div>
      <h2>高级 · 对称星河</h2>
      <div class="dsub">涂一涂、补一补，<br>点亮轴对称之美，<br>再送图形去旅行。</div>
    </div>
  </div>
</div>

<!-- ===== 游戏区 ===== -->
<div id="gameWrap">
  <div id="levelInfo">
    <div id="levelName"></div>
    <div id="levelDesc"></div>
  </div>
  <div id="stageTip"></div>
  <div id="boardWrap">
    <div id="board"></div>
    <svg id="overlay"></svg>
  </div>
  <div id="controlBar"></div>
</div>

<!-- ===== 模态层 ===== -->
<div id="modalMask">
  <div id="modalBox"></div>
</div>

<!-- ===== 彩纸 ===== -->
<canvas id="confettiCv"></canvas>

<script>
(function(){
'use strict';
/* ==================================================================
   图形运动 · 方格探险队
   核心玩法：方格画布上通过 拖拽平移 / 逐格移动 / 选中心旋转 / 涂色补对称
   来完成苏教版五年级上册第一单元《图形的运动》的核心题型。
   全部逻辑内联，无外部依赖。
   ================================================================== */

/* ---------------- 小工具 ---------------- */
function $(id){ return document.getElementById(id); }
function shuffle(arr){                        // 洗牌（返回新数组）
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function keyOf(cells){                        // 格子集合 -> 排序字符串（用于集合比较）
  return cells.map(function(c){ return c[0]+','+c[1]; }).sort().join(';');
}
function pad2(n){ return (n<10?'0':'')+n; }

/* ---------------- 随机色板（每局随机，保证多玩不腻） ---------------- */
var PALETTES = [
  { c1:'#2563eb', c2:'#f59e0b', bg:'#eff6ff' },   /* 蓝天 */
  { c1:'#059669', c2:'#ea580c', bg:'#ecfdf5' },   /* 薄荷 */
  { c1:'#7c3aed', c2:'#e11d48', bg:'#f5f3ff' },   /* 葡萄 */
  { c1:'#0891b2', c2:'#ca8a04', bg:'#ecfeff' },   /* 海洋 */
  { c1:'#dc2626', c2:'#2563eb', bg:'#fef2f2' },   /* 樱桃 */
  { c1:'#16a34a', c2:'#db2777', bg:'#f0fdf4' }    /* 森林 */
];
function applyPalette(p){
  var r = document.documentElement.style;
  r.setProperty('--c1', p.c1);
  r.setProperty('--c2', p.c2);
  r.setProperty('--bg', p.bg);
}

/* ---------------- 图案关的四种固定颜色（不随色板变，便于辨认） ---------------- */
var QUAD_COLORS = ['#ef4444','#facc15','#3b82f6','#22c55e'];

/* ---------------- 旋转数学：格子绕“格点”旋转 ----------------
   格子 (r,c) 的中心是 (c+0.5, r+0.5)；格点 (px,py) 是格线交点。
   屏幕坐标 y 向下：
     顺时针90度  (dx,dy) -> (-dy,dx)
     逆时针90度  (dx,dy) -> (dy,-dx)
     180度       (dx,dy) -> (-dx,-dy)                                */
function rotateCell(r, c, px, py, dir){
  var x = c + 0.5, y = r + 0.5;
  var nx, ny;
  if(dir === 'cw'){ nx = px - (y - py); ny = py + (x - px); }
  else if(dir === 'ccw'){ nx = px + (y - py); ny = py - (x - px); }
  else { nx = 2*px - x; ny = 2*py - y; }
  return [ Math.round(ny - 0.5), Math.round(nx - 0.5) ];
}

/* ---------------- 镜像数学：格子关于格线对称 ---------------- */
function mirrorC(c, axisX){ return 2*axisX - 1 - c; }   /* 竖直对称轴 x=axisX */
function mirrorR(r, axisY){ return 2*axisY - 1 - r; }   /* 水平对称轴 y=axisY */

/* ==================================================================
   关卡数据（全部由教材题型提炼；目标位置在加载时动态计算，保证自洽）
   ================================================================== */
var LEVELS = {

  easy: [
    /* —— 蜡烛拼装：对应操作题“图形块平移拼成蜡烛，再整体平移” —— */
    {
      id:'candle', type:'translate', title:'蜡烛拼装',
      desc:'方格纸上有两块图形：火焰块和烛身块。请把它们分别平移到中间的虚线轮廓处，拼成一支完整的蜡烛；拼好后，再把整支蜡烛一起平移到右侧的虚线框里。（每个小方格的边长表示1厘米）',
      cols:16, rows:8, best:18,
      pieces:[
        { id:'flame', name:'火焰块', color:'c2', anchor:[1,0],
          shape:[[0,1],[1,0],[1,1],[1,2]] },
        { id:'body',  name:'烛身块', color:'c1', anchor:[0,11],
          shape:[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2],[3,0],[3,1],[3,2]] }
      ],
      stages:[
        { tip:'第一步：拼成蜡烛。火焰块要向右平移；烛身块要向下平移再向左平移，移到火焰块正下方。',
          targets:{ flame:[1,6], body:[3,6] }, group:false },
        { tip:'第二步：整支蜡烛向右平移。拖动其中任意一块，两块会一起移动到虚线框。',
          targets:{ flame:[1,10], body:[3,10] }, group:true }
      ],
      explain:'平移口诀：找顶点 → 移顶点 → 连点成图。平移前后图形的形状、大小和方向完全相同，只有位置发生变化。'
    },

    /* —— 最短路线挑战：对应“每次只能水平或竖直平移1格，次数少者胜” —— */
    {
      id:'shortest', type:'stepmove', title:'最短路线挑战',
      desc:'晨晨和亮亮在玩平移比拼：把彩色积木块移到虚线车位里，每次只能向上、向下、向左或向右平移1格，用的步数最少的人获胜。请你用下方的方向按钮移动积木块，挑战用最少的步数到达虚线车位！（悄悄告诉你：最少步数 = 水平方向的格数 + 竖直方向的格数）',
      cols:10, rows:8,
      variants:[
        { start:[5,0], goal:[1,4] },
        { start:[2,2], goal:[6,7] },
        { start:[6,1], goal:[0,6] }
      ],
      shape:[[0,0],[0,1],[1,0]],
      explain:'每次只能水平或竖直平移1格，所以从起点到终点，水平方向要走的格数和竖直方向要走的格数一格都不能少：最少步数 = 水平格数 + 竖直格数。走“斜线”是不允许的哦。'
    },

    /* —— 小船启航：平移方向与距离的变式练习 —— */
    {
      id:'boat', type:'translate', title:'小船启航',
      desc:'把小船图形拖到右下方的虚线轮廓处。拖到位后，会告诉你小船向哪个方向平移了几格。（每个小方格的边长表示1米）',
      cols:14, rows:7, best:9,
      pieces:[
        { id:'boat', name:'小船', color:'c1', anchor:[2,1],
          shape:[[0,0],[0,1],[0,2],[1,1],[2,0],[2,1],[2,2]] }
      ],
      stages:[
        { tip:'拖动小船（也可以点选小船后用方向按钮一格一格移），让它的每条边都和虚线轮廓对齐。',
          targets:{ boat:[4,8] }, group:false }

var DIFF_NAMES = { easy:'初级 · 平移驿站', mid:'中级 · 旋转殿堂', hard:'高级 · 对称星河' };
var CENTER_LABELS = ['O','P','Q','R'];

/* ==================================================================
   全局状态
   ================================================================== */
var G = {
  diff:null,          /* 当前难度 */
  queue:[],           /* 本局抽到的关卡 id 列表 */
  qi:0,               /* 当前第几关 */
  lv:null,            /* 当前关数据（含运行时状态） */
  steps:0,            /* 步数 */
  startTs:0,          /* 本关开始时间 */
  timerId:null,
  usedReveal:false,   /* 本关是否用过揭示答案 */
  inGame:false
};
var CELL = 40;        /* 单格像素（随窗口自适应） */

/* ==================================================================
   计时器与步数
   ================================================================== */
function fmtTime(sec){
  return pad2(Math.floor(sec/60)) + ':' + pad2(sec%60);
}
function tick(){
  if(!G.inGame) return;
  var s = Math.floor((Date.now() - G.startTs)/1000);
  $('hudTime').textContent = '时间 ' + fmtTime(s);
}
function addSteps(n){
  G.steps += n;
  $('hudSteps').textContent = '步数 ' + G.steps;
}
function resetHud(){
  G.steps = 0;
  $('hudSteps').textContent = '步数 0';
  $('hudTime').textContent = '时间 00:00';
  G.startTs = Date.now();
}

/* ==================================================================
   画布尺寸与渲染
   ================================================================== */
function calcCell(){
  var lv = G.lv;
  var wrap = $('boardWrap');
  var avail = Math.min(window.innerWidth - 36, 960);
  CELL = Math.floor(avail / lv.cols);
  if(CELL > 46) CELL = 46;
  if(CELL < 22) CELL = 22;
  var board = $('board');
  board.style.width  = (lv.cols * CELL) + 'px';
  board.style.height = (lv.rows * CELL) + 'px';
  /* 格线背景 */
  board.style.backgroundImage =
    'linear-gradient(to right, var(--grid) 1.5px, transparent 1.5px),' +
    'linear-gradient(to bottom, var(--grid) 1.5px, transparent 1.5px)';
  board.style.backgroundSize = CELL + 'px ' + CELL + 'px';
  var ov = $('overlay');
  ov.setAttribute('width',  lv.cols * CELL);
  ov.setAttribute('height', lv.rows * CELL);
  ov.style.width  = (lv.cols * CELL) + 'px';
  ov.style.height = (lv.rows * CELL) + 'px';
}

/* 创建一个格子 div（board 内绝对定位） */
function mkCell(r, c, cls, bg){
  var d = document.createElement('div');
  d.className = 'cell ' + cls;
  d.style.left = (c * CELL) + 'px';
  d.style.top  = (r * CELL) + 'px';
  d.style.width  = (CELL - 2) + 'px';
  d.style.height = (CELL - 2) + 'px';
  if(bg) d.style.setProperty('--pc', bg);
  return d;
}
function colorOf(token){
  if(token === 'c1') return getPallet().c1;
  if(token === 'c2') return getPallet().c2;
  return token;
}
function getPallet(){
  return G.pallet;
}

/* 画对称轴 */
function drawAxes(){
  var board = $('board');
  (G.lv.axes || []).forEach(function(ax){
    var d = document.createElement('div');
    if(ax.t === 'v'){
      d.className = 'axisV';
      d.style.left = (ax.x * CELL - 2) + 'px';
      d.style.top = 0;
      d.style.height = (G.lv.rows * CELL) + 'px';
    }else{
      d.className = 'axisH';
      d.style.top = (ax.y * CELL - 2) + 'px';
      d.style.left = 0;
      d.style.width = (G.lv.cols * CELL) + 'px';
    }
    board.appendChild(d);
  });
}

/* 画虚线目标轮廓 */
function drawTargets(cells, withColor){
  var board = $('board');
  cells.forEach(function(rc){
    var d;
    if(withColor){
      d = mkCell(rc[0], rc[1], 'targetColor');
      var dot = document.createElement('div');
      dot.style.width = '60%';
      dot.style.height = '60%';
      dot.style.borderRadius = '4px';
      dot.style.background = QUAD_COLORS[rc.ci];
      dot.style.opacity = '.5';
      d.appendChild(dot);
    }else{
      d = mkCell(rc[0], rc[1], 'target');
    }
    board.appendChild(d);
  });
}

/* ==================================================================
   关卡加载与初始化
   ================================================================== */
function startDiff(diff){
  G.diff = diff;
  G.pallet = PALETTES[Math.floor(Math.random()*PALETTES.length)];
  applyPalette(G.pallet);
  G.queue = shuffle(LEVELS[diff].map(function(l){ return l.id; })).slice(0, 2);
  G.qi = 0;
  $('menu').style.display = 'none';
  $('gameWrap').style.display = 'block';
  G.inGame = true;
  loadLevel();
}

function findLevel(id){
  return LEVELS[G.diff].filter(function(l){ return l.id === id; })[0];
}

function loadLevel(){
  var src = findLevel(G.queue[G.qi]);
  var lv = JSON.parse(JSON.stringify(src));   /* 深拷贝一份做运行时状态 */
  G.lv = lv;
  G.usedReveal = false;
  resetHud();
  $('levelName').textContent = (G.qi+1) + '/' + G.queue.length + '　' + lv.title + '　（' + DIFF_NAMES[G.diff] + '）';
  $('levelDesc').textContent = lv.desc;

  /* 按类型初始化运行时状态 */
  if(lv.type === 'translate'){
    lv.stageIdx = 0;
    lv.pieces.forEach(function(p){ p.cur = p.anchor.slice(); p.locked = false; });
  }
  else if(lv.type === 'stepmove'){
    var v = lv.variants[Math.floor(Math.random()*lv.variants.length)];
    lv.variant = v;
    lv.best = Math.abs(v.goal[0]-v.start[0]) + Math.abs(v.goal[1]-v.start[1]);
    lv.cur = v.start.slice();
  }
  else if(lv.type === 'rotate' || lv.type === 'rotateColor'){
    lv.centersShown = shuffle(lv.centers);
    lv.chosen = null;
    if(lv.type === 'rotate'){
      lv.cells = lv.piece.shape.map(function(s){
        return [ lv.piece.anchor[0]+s[0], lv.piece.anchor[1]+s[1] ];
      });
    }else{
      /* 4×4 四象限四色图案 */
      lv.cells = [];
      for(var r=0;r<4;r++) for(var c=0;c<4;c++){
        var ci = (r<2 ? 0 : 2) + (c<2 ? 0 : 1);
        lv.cells.push({ 0:lv.piece.anchor[0]+r, 1:lv.piece.anchor[1]+c, ci:ci });
      }
    }
    /* 目标 = 正确旋转的结果（动态计算，保证自洽） */
    var ans = lv.answer;
    lv.targets = lv.cells.map(function(cell){
      var t = rotateCell(cell[0], cell[1], ans.center[0], ans.center[1], ans.dir);
      if(typeof cell.ci === 'number') t.ci = cell.ci;
      return t;
    });
    /* 旋转中心字母标签 */
    lv.labels = {};
    lv.centersShown.forEach(function(pt, i){
      lv.labels[pt[0]+','+pt[1]] = CENTER_LABELS[i];
    });
  }
  else if(lv.type === 'paint' || lv.type === 'paintMulti'){
    lv.stageIdx = 0;
    lv.painted = {};                        /* 已涂格 'r,c' -> 'good' 或 'bad' */
    lv.groupOff = { dr:0, dc:0 };           /* 第二阶段整体平移的累计位移 */
    /* 计算涂色目标集合：把每个已给格沿每条对称轴反复镜像，得到闭包 */
    var target = {};
    lv.given.forEach(function(rc){
      var set = [ rc ];
      lv.axes.forEach(function(a){
        if(a.t === 'v'){
          set = set.concat( set.map(function(p){ return [ p[0], mirrorC(p[1], a.x) ]; }) );
        }else{
          set = set.concat( set.map(function(p){ return [ mirrorR(p[0], a.y), p[1] ]; }) );
        }
      });
      set.forEach(function(p){ target[ p[0]+','+p[1] ] = true; });
    });
    /* 去掉已给出的格子 */
    lv.given.forEach(function(rc){ delete target[ rc[0]+','+rc[1] ]; });
    lv.paintTargets = Object.keys(target).map(function(k){
      var a = k.split(',');
      return [ +a[0], +a[1] ];
    });
    lv.best = lv.paintTargets.length + (lv.stage2 ? Math.abs(lv.stage2.dr)+Math.abs(lv.stage2.dc) : 0);
    /* 第二阶段整体平移的起终点 */
    if(lv.stage2){
      lv.allCells = function(){
        var all = lv.given.concat(lv.paintTargets);
        return all;
      };
    }
  }
  renderLevel();
}

/* ==================================================================
   渲染当前关（全量重绘；拖拽过程中只改内联坐标，不动状态）
   ================================================================== */
function renderLevel(){
  calcCell();
  clearBoard();
  var lv = G.lv;

  if(lv.type === 'translate'){
    renderTranslate();
  }else if(lv.type === 'stepmove'){
    renderStepmove();
  }else if(lv.type === 'rotate' || lv.type === 'rotateColor'){
    renderRotate();
  }else if(lv.type === 'paint' || lv.type === 'paintMulti'){
    renderPaint();
  }
}
/* 清空画布、提示条与控制区（每次重绘前必须调用，防止元素重复堆叠） */
function clearBoard(){
  $('board').innerHTML = '';
  $('overlay').innerHTML = '';
  $('controlBar').innerHTML = '';
  $('stageTip').style.display = 'none';
}

/* ---------- 平移关（蜡烛 / 小船） ---------- */
function renderTranslate(){
  var lv = G.lv;
  clearBoard();
  var board = $('board');
  var st = lv.stages[lv.stageIdx];
  /* 画目标虚线 */
  lv.pieces.forEach(function(p){
    p.shape.forEach(function(s){
      board.appendChild( mkCell(st.targets[p.id][0]+s[0], st.targets[p.id][1]+s[1], 'target') );
    });
  });
  /* 画图形块（每块一个容器，便于整体拖动） */
  lv.pieces.forEach(function(p){
    var box = document.createElement('div');
    box.className = 'pieceBox';
    box.dataset.pid = p.id;
    box.style.position = 'absolute';
    box.style.left = (p.cur[1] * CELL) + 'px';
    box.style.top  = (p.cur[0] * CELL) + 'px';
    box.style.width  = ((maxC(p.shape)+1) * CELL) + 'px';
    box.style.height = ((maxR(p.shape)+1) * CELL) + 'px';
    box.style.zIndex = 10;
    p.shape.forEach(function(s){
      var d = mkCell(s[0], s[1], 'block' + (p.locked ? ' locked' : ''), colorOf(p.color));
      if(G.selected === p.id) d.classList.add('sel');
      box.appendChild(d);
    });
    board.appendChild(box);
  });
  /* 提示条 */
  showTip(st.tip);
  /* 控制区：块选择 + 方向按钮 */
  var bar = $('controlBar');
  var pick = document.createElement('div');
  pick.className = 'piecePick';
  lv.pieces.forEach(function(p){
    var b = document.createElement('button');
    b.className = 'ppick' + (G.selected === p.id ? ' on' : '');
    b.textContent = '选中' + p.name;
    b.onclick = function(){ G.selected = p.id; renderTranslate(); };
    pick.appendChild(b);
  });
  bar.appendChild(pick);
  buildDpad();
  var note = document.createElement('div');
  note.className = 'ctlNote';
  note.textContent = '可以直接拖动图形，也可以点选后用方向按钮逐格平移';
  bar.appendChild(note);
}
function maxR(shape){ return shape.reduce(function(m,s){ return Math.max(m,s[0]); },0); }
function maxC(shape){ return shape.reduce(function(m,s){ return Math.max(m,s[1]); },0); }
function showTip(t){
  var el = $('stageTip');
  el.textContent = t;
  el.style.display = 'block';
}

/* ---------- 逐格移动关（最短路线） ---------- */
function renderStepmove(){
  var lv = G.lv;
  clearBoard();
  var board = $('board');
  /* 目标车位 */
  lv.shape.forEach(function(s){
    board.appendChild( mkCell(lv.variant.goal[0]+s[0], lv.variant.goal[1]+s[1], 'target') );
  });
  /* 积木块 */
  var box = document.createElement('div');
  box.className = 'pieceBox';
  box.dataset.pid = 'mover';
  box.style.position = 'absolute';
  box.style.left = (lv.cur[1]*CELL) + 'px';
  box.style.top  = (lv.cur[0]*CELL) + 'px';
  box.style.zIndex = 10;
  lv.shape.forEach(function(s){
    box.appendChild( mkCell(s[0], s[1], 'block', getPallet().c1) );
  });
  board.appendChild(box);
  showTip('当前位置到虚线车位：水平相差 ' + Math.abs(lv.variant.goal[1]-lv.cur[1]) +
          ' 格，竖直相差 ' + Math.abs(lv.variant.goal[0]-lv.cur[0]) + ' 格。用方向按钮出发吧！');
  var bar = $('controlBar');
  var note = document.createElement('div');
  note.className = 'ctlNote';
  note.textContent = '本关只能用方向按钮逐格平移（每次1格记1步）';
  bar.appendChild(note);
  buildDpad();
}

/* ---------- 旋转关（图标 / 图案 / 车库） ---------- */
function renderRotate(){
  var lv = G.lv;
  clearBoard();
  var board = $('board');
  var withColor = (lv.type === 'rotateColor');
  /* 目标 */
  drawTargets(lv.targets, withColor);
  /* 图形格子（独立 div，便于旋转飞行动画） */
  lv.cells.forEach(function(cell, i){
    var bg = withColor ? QUAD_COLORS[cell.ci] : colorOf(lv.piece.color);
    var d = mkCell(cell[0], cell[1], 'block', bg);
    d.style.transition = 'left .45s ease, top .45s ease';
    d.dataset.ridx = i;
    board.appendChild(d);
  });
  /* 旋转中心候选圆点 */
  lv.centersShown.forEach(function(pt){
    var d = document.createElement('div');
    d.className = 'centerDot' + (lv.chosen && lv.chosen[0]===pt[0] && lv.chosen[1]===pt[1] ? ' chosen' : '');
    d.style.left = (pt[0]*CELL - 11) + 'px';
    d.style.top  = (pt[1]*CELL - 11) + 'px';
    var lab = document.createElement('span');
    lab.className = 'lab';
    lab.textContent = lv.labels[ pt[0]+','+pt[1] ];
    d.appendChild(lab);
    d.dataset.cx = pt[0]; d.dataset.cy = pt[1];
    board.appendChild(d);
  });
  showTip(lv.chosen
    ? '已选择点' + lv.labels[ lv.chosen[0]+','+lv.chosen[1] ] + '作为旋转中心，请选择方向和角度执行旋转。'
    : '先点击一个圆点，选择旋转中心。');
  /* 控制区 */
  var bar = $('controlBar');
  var rb = document.createElement('div');
  rb.className = 'rotBtns';
  [ ['cw','顺时针旋转 90°'], ['ccw','逆时针旋转 90°'], ['180','旋转 180°'] ].forEach(function(it){
    var b = document.createElement('button');
    b.className = 'rbtn';
    b.textContent = it[1];
    b.disabled = !lv.chosen;
    b.onclick = function(){ doRotate(it[0]); };
    rb.appendChild(b);
  });
  bar.appendChild(rb);
  var note = document.createElement('div');
  note.className = 'ctlNote';
  note.textContent = '转错了不要紧：绕同一个点再转就能回来，也可以点“重新开始”';
  bar.appendChild(note);
}

/* 执行一次旋转 */
function doRotate(dir){
  var lv = G.lv;
  if(!lv.chosen) return;
  var px = lv.chosen[0], py = lv.chosen[1];
  lv.cells = lv.cells.map(function(cell){
    var t = rotateCell(cell[0], cell[1], px, py, dir);
    if(typeof cell.ci === 'number') t.ci = cell.ci;
    return t;
  });
  addSteps(1);
  /* 动画更新每个格子的位置 */
  var board = $('board');
  var blocks = board.querySelectorAll('.cell.block');
  for(var i=0;i<blocks.length;i++){
    var cell = lv.cells[i];
    blocks[i].style.left = (cell[1]*CELL) + 'px';
    blocks[i].style.top  = (cell[0]*CELL) + 'px';
  }
  /* 出界提示 */
  var out = lv.cells.some(function(c){ return c[0]<0 || c[0]>=lv.rows || c[1]<0 || c[1]>=lv.cols; });
  if(out){
    showTip('呀，图形转到画布外面去了！再选一选中心和方向，或点“重新开始”回到最初的样子。');
    return;
  }
  /* 判定：位置（与颜色）是否与目标完全一致 */
  var ok;
  if(lv.type === 'rotateColor'){
    ok = keyOf(lv.cells) === keyOf(lv.targets) &&
         lv.cells.every(function(c){ return c.ci === cellCiAt(lv.targets, c); });
  }else{
    ok = keyOf(lv.cells) === keyOf(lv.targets);
  }
  if(ok){
    setTimeout(function(){ levelClear(); }, 480);
  }else{
    showTip('还没有和虚线轮廓重合，换个旋转中心或方向再试一次！');
  }
}
function cellCiAt(list, c){
  for(var i=0;i<list.length;i++){
    if(list[i][0]===c[0] && list[i][1]===c[1]) return list[i].ci;
  }
  return -1;
}

/* ---------- 涂色关（火箭 / 花圃 / 徽章） ---------- */
function renderPaint(){
  var lv = G.lv;
  clearBoard();
  var board = $('board');
  drawAxes();
  /* 已给出的一半 */
  lv.given.forEach(function(rc){
    board.appendChild( mkCell(rc[0], rc[1], 'given', getPallet().c1) );
  });
  if(lv.stageIdx === 0){
    /* 阶段一：涂色补全（画已涂格） */
    Object.keys(lv.painted).forEach(function(k){
      var a = k.split(',');
      var d = mkCell(+a[0], +a[1], 'painted' + (lv.painted[k]==='bad' ? ' wrong' : ''), getPallet().c2);
      board.appendChild(d);
    });
    showTip('请点击空格涂色，补全图形的另一半。每涂一格，会闪现它到对称轴的距离提示；涂错了再点一下即可擦掉。');
    var bar = $('controlBar');
    var note = document.createElement('div');
    note.className = 'ctlNote';
    note.textContent = '涂色格数目标：' + lv.paintTargets.length + ' 格（右侧/下侧空格里涂）';
    bar.appendChild(note);
  }else{
    /* 阶段二：整体平移到虚线框 */
    var s2 = lv.stage2;
    var all = lv.allCells();
    /* 目标虚线（整体平移后的位置） */
    all.forEach(function(rc){
      board.appendChild( mkCell(rc[0]+s2.dr, rc[1]+s2.dc, 'target') );
    });
    /* 整个图形作为一个可拖组（按累计位移 groupOff 定位） */
    var box = document.createElement('div');
    box.className = 'pieceBox';
    box.dataset.pid = 'groupAll';
    box.style.position = 'absolute';
    box.style.left = ((minCOf(all) + lv.groupOff.dc) * CELL) + 'px';
    box.style.top  = ((minROf(all) + lv.groupOff.dr) * CELL) + 'px';
    box.style.width  = ((maxC(all)-minCOf(all)+1) * CELL) + 'px';
    box.style.height = ((maxR(all)-minROf(all)+1) * CELL) + 'px';
    box.style.zIndex = 10;
    all.forEach(function(rc){
      box.appendChild( mkCell(rc[0]-minROf(all), rc[1]-minCOf(all), 'block', getPallet().c1) );
    });
    board.appendChild(box);
    showTip('补全成功！现在把整个图形拖到虚线框里（目标：' + offText(s2.dr, s2.dc) + '）。');
    var bar2 = $('controlBar');
    var note2 = document.createElement('div');
    note2.className = 'ctlNote';
    note2.textContent = '拖动图形的任意位置即可整体平移';
    bar2.appendChild(note2);
  }
}
function minROf(cells){ return cells.reduce(function(m,c){ return Math.min(m,c[0]); }, 999); }
function minCOf(cells){ return cells.reduce(function(m,c){ return Math.min(m,c[1]); }, 999); }
function maxROf(cells){ return cells.reduce(function(m,c){ return Math.max(m,c[0]); }, -1); }
function maxCOf(cells){ return cells.reduce(function(m,c){ return Math.max(m,c[1]); }, -1); }

/* 涂色点击处理（阶段一） */
function paintAt(r, c){
  var lv = G.lv;
  if(lv.type !== 'paint' && lv.type !== 'paintMulti') return;
  if(lv.stageIdx !== 0) return;
  /* 点在已给格子上：忽略 */
  var onGiven = lv.given.some(function(g){ return g[0]===r && g[1]===c; });
  if(onGiven) return;
  var k = r + ',' + c;
  if(lv.painted[k]){
    delete lv.painted[k];        /* 擦除 */
    addSteps(1);
    renderPaint();
    return;
  }
  var good = lv.paintTargets.some(function(t){ return t[0]===r && t[1]===c; });
  lv.painted[k] = good ? 'good' : 'bad';
  addSteps(1);
  /* 先重绘画布，再闪现提示（避免被重绘覆盖） */
  renderPaint();
  if(good) flashMirrorHint(r, c);
  else flashWrongNote(r, c);
  /* 判定是否补全：好格全部到位，且没有涂错的格子 */
  var goods = [];
  var hasBad = false;
  Object.keys(lv.painted).forEach(function(key){
    if(lv.painted[key] === 'good'){
      var a = key.split(',');
      goods.push([ +a[0], +a[1] ]);
    }else{
      hasBad = true;
    }
  });
  if(!hasBad && keyOf(goods) === keyOf(lv.paintTargets)){
    if(lv.stage2){
      showTip('完全正确！图形补全啦！准备进入平移挑战……');
      lv.stageIdx = 1;
      setTimeout(renderPaint, 600);
    }else{
      setTimeout(levelClear, 400);
    }
  }
}

/* 涂错提示（文字气泡在提示条里说明） */
function flashWrongNote(r, c){
  var ax = G.lv.axes[0];
  var sep;
  if(ax.t === 'v') sep = Math.abs( (c+0.5) - ax.x ) - 0.5;
  else             sep = Math.abs( (r+0.5) - ax.y ) - 0.5;
  showTip('这一格和对称轴之间隔着 ' + sep + ' 格，好像不在对称位置上——在对称轴另一侧同样隔着 ' + sep + ' 格的地方才是它的对称点，再想想！');
}

/* 涂对时：闪现 原格→对称轴→对称格 的连线提示 */
function flashMirrorHint(r, c){
  var lv = G.lv;
  var ov = $('overlay');
  /* 双对称轴关卡：用文字引导两次镜像 */
  if(lv.type === 'paintMulti'){
    showTip('很好！这一格放对了。想一想：以画好的一份为“种子”，先沿竖直对称轴左右镜像，再沿水平对称轴上下镜像，四份完全一样才成功。');
    return;
  }
  var ax = lv.axes[0];
  var cx = (c+0.5)*CELL, cy = (r+0.5)*CELL;
  var lines = '';
  var dotAt = function(x,y,col,rad){
    return '<circle cx="'+x+'" cy="'+y+'" r="'+rad+'" fill="'+col+'" stroke="#fff" stroke-width="2"/>';
  };
  if(ax.t === 'v'){
    var mx = ax.x * CELL;
    var mc = mirrorC(c, ax.x);
    var nx = (mc+0.5)*CELL;
    var sep = Math.abs( (c+0.5) - ax.x ) - 0.5;
    lines += '<line x1="'+cx+'" y1="'+cy+'" x2="'+mx+'" y2="'+cy+'" stroke="#e11d48" stroke-width="3" stroke-dasharray="6 4"/>';
    lines += '<line x1="'+mx+'" y1="'+cy+'" x2="'+nx+'" y2="'+cy+'" stroke="#0d9488" stroke-width="3" stroke-dasharray="6 4"/>';
    lines += dotAt(cx, cy, '#e11d48', 5) + dotAt(nx, cy, '#0d9488', 5);
    showTip('这一格和对称轴之间隔着 ' + sep + ' 格；在对称轴另一侧同样隔着 ' + sep + ' 格的绿点处，就是它的对称点！');
  }else{
    var my = ax.y * CELL;
    var mr = mirrorR(r, ax.y);
    var ny = (mr+0.5)*CELL;
    var sep2 = Math.abs( (r+0.5) - ax.y ) - 0.5;
    lines += '<line x1="'+cx+'" y1="'+cy+'" x2="'+cx+'" y2="'+my+'" stroke="#e11d48" stroke-width="3" stroke-dasharray="6 4"/>';
    lines += '<line x1="'+cx+'" y1="'+my+'" x2="'+cx+'" y2="'+ny+'" stroke="#0d9488" stroke-width="3" stroke-dasharray="6 4"/>';
    lines += dotAt(cx, cy, '#e11d48', 5) + dotAt(cx, ny, '#0d9488', 5);
    showTip('这一格和对称轴之间隔着 ' + sep2 + ' 格；在对称轴另一侧同样隔着 ' + sep2 + ' 格的绿点处，就是它的对称点！');
  }
  ov.innerHTML = lines;
  clearTimeout(G.hintTid);
  G.hintTid = setTimeout(function(){ ov.innerHTML = ''; }, 1400);
}

/* ==================================================================
   方向按钮（逐格平移）
   ================================================================== */
function buildDpad(){
  var bar = $('controlBar');
  var pad = document.createElement('div');
  pad.className = 'dpad';
  var defs = [
    { txt:'←', dr:0,  dc:-1, col:'1 / 2', row:'2 / 3' },
    { txt:'↑', dr:-1, dc:0,  col:'2 / 3', row:'1 / 2' },
    { txt:'↓', dr:1,  dc:0,  col:'2 / 3', row:'2 / 3' },
    { txt:'→', dr:0,  dc:1,  col:'3 / 4', row:'2 / 3' }
  ];
  defs.forEach(function(d){
    var b = document.createElement('button');
    b.className = 'dbtn';
    b.textContent = d.txt;
    b.style.gridColumn = d.col;
    b.style.gridRow = d.row;
    b.onclick = function(){ stepMove(d.dr, d.dc); };
    pad.appendChild(b);
  });
  bar.appendChild(pad);
}

/* 逐格移动一块图形 */
function stepMove(dr, dc){
  var lv = G.lv;
  if(lv.type === 'stepmove'){
    var nr = lv.cur[0] + dr, nc = lv.cur[1] + dc;
    if(canPlace(lv.shape, nr, nc, lv.rows, lv.cols)){
      lv.cur = [nr, nc];
      addSteps(1);
      renderStepmove();
      if(keyOf(absCells(lv.shape, lv.cur)) === keyOf(absCells(lv.shape, lv.variant.goal))){
        setTimeout(levelClear, 250);
      }
    }
  }else if(lv.type === 'translate'){
    var pid = G.selected || lv.pieces[0].id;
    var st = lv.stages[lv.stageIdx];
    var piecesToMove = st.group ? lv.pieces : lv.pieces.filter(function(p){ return p.id === pid; });
    var okAll = piecesToMove.every(function(p){
      return canPlace(p.shape, p.cur[0]+dr, p.cur[1]+dc, lv.rows, lv.cols);
    });
    if(okAll){
      piecesToMove.forEach(function(p){ p.cur = [ p.cur[0]+dr, p.cur[1]+dc ]; });
      addSteps(piecesToMove.length);
      renderTranslate();
      checkTranslateStage();
    }
  }
}
function absCells(shape, anchor){
  return shape.map(function(s){ return [ anchor[0]+s[0], anchor[1]+s[1] ]; });
}
function canPlace(shape, ar, ac, rows, cols){
  return shape.every(function(s){
    var r = ar + s[0], c = ac + s[1];
    return r >= 0 && r < rows && c >= 0 && c < cols;
  });
}

/* 平移关阶段判定 */
function checkTranslateStage(){
  var lv = G.lv;
  var st = lv.stages[lv.stageIdx];
  var done = lv.pieces.every(function(p){
    return keyOf(absCells(p.shape, p.cur)) === keyOf(absCells(p.shape, st.targets[p.id]));
  });
  if(done){
    if(lv.stageIdx < lv.stages.length - 1){
      /* 还有下一阶段：先报喜，再进入下一阶段 */
      showTip('太棒了！拼合成功，马上进入下一步挑战……');
      setTimeout(function(){
        lv.stageIdx++;
        renderTranslate();
      }, 500);
    }else{
      setTimeout(levelClear, 250);
    }
  }
}

/* ==================================================================
   拖拽（平移关 / 涂色关第二阶段）
   ================================================================== */
var drag = null;    /* { boxEls:[], baseL, baseT, startX, startY, mode } */

function onPointerDown(ev){
  var lv = G.lv;
  if(!lv) return;
  var t = ev.target;
  /* 旋转中心圆点 */
  if(t.classList && t.classList.contains('centerDot')){
    lv.chosen = [ +t.dataset.cx, +t.dataset.cy ];
    renderRotate();
    return;
  }
  /* 涂色：点击画布空白/已涂格 */
  if((lv.type === 'paint' || lv.type === 'paintMulti') && lv.stageIdx === 0){
    var rect = $('board').getBoundingClientRect();
    var c = Math.floor((ev.clientX - rect.left) / CELL);
    var r = Math.floor((ev.clientY - rect.top) / CELL);
    if(r >= 0 && r < lv.rows && c >= 0 && c < lv.cols) paintAt(r, c);
    return;
  }
  /* 图形块拖拽 */
  var box = null;
  var el = t;
  while(el && el !== $('board')){
    if(el.classList && el.classList.contains('pieceBox')){ box = el; break; }
    el = el.parentNode;
  }
  if(!box) return;
  if(lv.type === 'translate'){
    var st = lv.stages[lv.stageIdx];
    var pid = box.dataset.pid;
    G.selected = pid;
    var boxes;
    if(st.group){
      boxes = Array.prototype.slice.call($('board').querySelectorAll('.pieceBox'));
    }else{
      boxes = [ box ];
    }
    drag = {
      boxes: boxes, group: st.group,
      baseL: boxes.map(function(b){ return parseFloat(b.style.left) || 0; }),
      baseT:  boxes.map(function(b){ return parseFloat(b.style.top)  || 0; }),
      startX: ev.clientX, startY: ev.clientY,
      startAnchor: lv.pieces.map(function(p){ return p.cur.slice(); })
    };
  }else if(lv.type === 'paint' && lv.stageIdx === 1){
    drag = {
      boxes: [ box ], group: true,
      baseL: [ parseFloat(box.style.left) || 0 ],
      baseT:  [ parseFloat(box.style.top)  || 0 ],
      startX: ev.clientX, startY: ev.clientY,
      startAnchor: null
    };
  }else{
    return;
  }
  ev.preventDefault();
  try{ $('board').setPointerCapture(ev.pointerId); }catch(e){}
}
function onPointerMove(ev){
  if(!drag) return;
  var dx = ev.clientX - drag.startX;
  var dy = ev.clientY - drag.startY;
  drag.boxes.forEach(function(b, i){
    b.style.left = (drag.baseL[i] + dx) + 'px';
    b.style.top  = (drag.baseT[i] + dy) + 'px';
  });
}
function onPointerUp(ev){
  if(!drag) return;
  var lv = G.lv;
  var d = drag;
  drag = null;
  var dx = ev.clientX - d.startX;
  var dy = ev.clientY - d.startY;
  var dc = Math.round(dx / CELL);
  var dr = Math.round(dy / CELL);
  if(lv.type === 'translate'){
    var st = lv.stages[lv.stageIdx];
    if(st.group){
      /* 整组一起吸附；任何一块会出界就整组弹回原位 */
      var canAll = lv.pieces.every(function(p, i){
        return canPlace(p.shape, d.startAnchor[i][0]+dr, d.startAnchor[i][1]+dc, lv.rows, lv.cols);
      });
      if(canAll){
        if(dr !== 0 || dc !== 0){
          addSteps(Math.abs(dr) + Math.abs(dc));
          lv.pieces.forEach(function(p, i){
            p.cur = [ d.startAnchor[i][0]+dr, d.startAnchor[i][1]+dc ];
          });
        }
        renderTranslate();
        checkTranslateStage();
      }else{
        renderTranslate();   /* 出界：弹回原位 */
      }
    }else{
      /* 单块：找到拖的是哪块 */
      var pid = d.boxes[0].dataset.pid;
      var p = null, pi = -1;
      lv.pieces.forEach(function(q, i){ if(q.id === pid){ p = q; pi = i; } });
      if(p){
        var base = d.startAnchor[pi];
        var can = canPlace(p.shape, base[0]+dr, base[1]+dc, lv.rows, lv.cols);
        if(can && (dr !== 0 || dc !== 0)){
          addSteps(Math.abs(dr) + Math.abs(dc));
          p.cur = [ base[0]+dr, base[1]+dc ];
        }
        renderTranslate();
        if(can && (dr !== 0 || dc !== 0)) reportMove(p, base, p.cur);
        checkTranslateStage();
      }
    }
  }else if(lv.type === 'paint' && lv.stageIdx === 1){
    /* 第二阶段：累计整体位移并吸附 */
    var s2 = lv.stage2;
    var all = lv.allCells();
    var minR = minROf(all), minC = minCOf(all);
    var ndr = lv.groupOff.dr + dr, ndc = lv.groupOff.dc + dc;
    var inBound = all.every(function(rc){
      var rr = rc[0] + ndr;
      var cc = rc[1] + ndc;
      return rr >= 0 && rr < lv.rows && cc >= 0 && cc < lv.cols;
    });
    if(inBound && (dr !== 0 || dc !== 0)){
      addSteps(Math.abs(dr) + Math.abs(dc));
      lv.groupOff = { dr: ndr, dc: ndc };
      var hit = (ndr === s2.dr && ndc === s2.dc);
      renderPaint();
      if(hit){
        setTimeout(levelClear, 250);
      }else{
        showTip('整体已平移：' + offText(ndr, ndc) +
                '。目标：' + offText(s2.dr, s2.dc) + '，继续拖动吧！');
      }
    }else{
      renderPaint();
    }
  }
}
/* 把位移 (dr,dc) 说成人话 */
function offText(dr, dc){
  var parts = [];
  if(dr < 0) parts.push('向上 ' + Math.abs(dr) + ' 格');
  if(dr > 0) parts.push('向下 ' + dr + ' 格');
  if(dc < 0) parts.push('向左 ' + Math.abs(dc) + ' 格');
  if(dc > 0) parts.push('向右 ' + dc + ' 格');
  return parts.length ? parts.join('、') : '原地不动';
}

/* 单块拖动后的方向距离汇报（写进提示条） */
function reportMove(p, from, to){
  var dr = to[0] - from[0], dc = to[1] - from[1];
  var parts = [];
  if(dc < 0) parts.push('向左平移 ' + Math.abs(dc) + ' 格');
  if(dc > 0) parts.push('向右平移 ' + dc + ' 格');
  if(dr < 0) parts.push('向上平移 ' + Math.abs(dr) + ' 格');
  if(dr > 0) parts.push('向下平移 ' + dr + ' 格');
  if(parts.length) showTip(p.name + '：' + parts.join('，') + '。');
}

/* ==================================================================
   过关结算
   ================================================================== */
function starCount(){
  var lv = G.lv;
  var best = lv.best || 1;
  var s;
  if(G.steps <= best) s = 3;
  else if(G.steps <= Math.ceil(best * 1.4) + 3) s = 2;
  else s = 1;
  if(G.usedReveal && s > 2) s = 2;   /* 用过提示最高两星 */
  return s;
}
function levelClear(){
  var lv = G.lv;
  confetti();
  var stars = starCount();
  var starHtml = '<div class="starRow">';
  for(var i=0;i<3;i++){
    starHtml += '<svg viewBox="0 0 24 24"><path class="' + (i < stars ? 'starOn' : 'starOff') +
      '" d="M12 2l2.9 6.2 6.8.8-5 4.6 1.3 6.7-6-3.4-6 3.4 1.3-6.7-5-4.6 6.8-.8z"/></svg>';
  }
  starHtml += '</div>';
  var isLast = (G.qi >= G.queue.length - 1);
  var extra = '';
  if(lv.type === 'stepmove'){
    extra = '<p>你用了 <b>' + G.steps + '</b> 步，最少需要 <b>' + lv.best + '</b> 步（水平格数 + 竖直格数）。</p>';
  }else{
    extra = '<p>本关共 <b>' + G.steps + '</b> 步' + (lv.best ? '，参考步数 ' + lv.best + ' 步' : '') + '。</p>';
  }
  showModal('<h3>' + (isLast ? '全部通关，太厉害啦！' : '本关完成！') + '</h3>' + starHtml +
    '<div class="mbody">' + extra + '<p style="margin-top:8px">' + lv.explain + '</p></div>' +
    '<div class="mrow"><button class="mbtn" id="mNext">' + (isLast ? '再玩一局' : '下一关') + '</button>' +
    '<button class="mbtn ghost" id="mMenu">返回难度</button></div>');
  $('mNext').onclick = function(){
    hideModal();
    if(isLast){
      /* 再玩一局：同难度重新随机抽关、换色板 */
      startDiff(G.diff);
    }else{
      G.qi++;
      loadLevel();
    }
  };
  $('mMenu').onclick = function(){ hideModal(); backToMenu(); };
}

/* ==================================================================
   揭示答案 / 重新开始 / 返回
   ================================================================== */
function revealAnswer(){
  var lv = G.lv;
  if(!lv) return;
  G.usedReveal = true;
  var board = $('board');
  var gold = [];
  var text = '';
  if(lv.type === 'translate'){
    var st = lv.stages[lv.stageIdx];
    lv.pieces.forEach(function(p){
      p.shape.forEach(function(s){
        gold.push([ st.targets[p.id][0] + s[0], st.targets[p.id][1] + s[1] ]);
      });
    });
    text = '平移口诀：找顶点 → 移顶点 → 连点成图。看金色闪烁的虚线框位置，把图形拖到与轮廓完全重合即可。' + lv.explain;
  }else if(lv.type === 'stepmove'){
    lv.shape.forEach(function(s){ gold.push([ lv.variant.goal[0]+s[0], lv.variant.goal[1]+s[1] ]); });
    text = '最少步数 = 水平格数 + 竖直格数 = ' +
           Math.abs(lv.variant.goal[1]-lv.variant.start[1]) + ' + ' +
           Math.abs(lv.variant.goal[0]-lv.variant.start[0]) + ' = ' + lv.best + ' 步。';
  }else if(lv.type === 'rotate' || lv.type === 'rotateColor'){
    lv.targets.forEach(function(t){ gold.push([ t[0], t[1] ]); });
    var ans = lv.answer;
    var dirTxt, degTxt = '90度';
    if(ans.dir === 'cw'){ dirTxt = '按顺时针方向旋转'; }
    else if(ans.dir === 'ccw'){ dirTxt = '按逆时针方向旋转'; }
    else{ dirTxt = '旋转'; degTxt = '180度（顺时针、逆时针都一样）'; }
    var lab = lv.labels[ ans.center[0] + ',' + ans.center[1] ];
    /* 高亮正确中心点 */
    var dots = board.querySelectorAll('.centerDot');
    for(var i=0;i<dots.length;i++){
      if(+dots[i].dataset.cx === ans.center[0] && +dots[i].dataset.cy === ans.center[1]){
        dots[i].classList.add('revealDot');
      }
    }
    text = '绕点' + lab + '，' + dirTxt + degTxt + '，图形就能与虚线轮廓完全重合。' + lv.explain;
  }else{
    if(lv.stageIdx === 0){
      lv.paintTargets.forEach(function(t){ gold.push(t); });
      text = '对称点到对称轴的距离相等：数一数每个给出的格子离对称轴几格，在另一侧同样远的位置涂色。金色闪烁的就是答案位置。';
    }else{
      var s2 = lv.stage2;
      lv.allCells().forEach(function(rc){ gold.push([ rc[0]+s2.dr, rc[1]+s2.dc ]); });
      text = '把整个图形向上平移 ' + Math.abs(s2.dr) + ' 格、向右平移 ' + s2.dc + ' 格，就到了虚线框。';
    }
  }
  gold.forEach(function(rc){
    board.appendChild( mkCell(rc[0], rc[1], 'revealGold') );

    '<div class="mrow"><button class="mbtn" id="mClose">继续挑战</button></div>');

function restartLevel(){
  if(!G.lv) return;

}
function backToMenu(){
  G.inGame = false;

}

    '<div class="ruleSec"><b>中级 · 旋转殿堂</b><br>先<b>点击圆点</b>选择旋转中心，再按“顺时针90° / 逆时针90° / 180°”按钮执行旋转。想清楚：绕哪个点？往哪边转？转多少度？</div>' +
    '<div class="ruleSec"><b>高级 · 对称星河</b><br><b>点击空格涂色</b>，补全轴对称图形的另一半（再点一下可擦掉）。涂对时会闪现“到对称轴的距离”提示：对称点到对称轴的距离相等。补全后还要把图形整体平移到虚线框。</div>' +
    '<div class="ruleSec"><b>小锦囊</b><br>· 平移口诀：找顶点 → 移顶点 → 连点成图。<br>· 旋转三要素：旋转中心、旋转方向、旋转角度。<br>· 轴对称：对称点到对称轴的距离相等。<br>· 每一局的关卡和颜色都会随机变化；步数越少星越多；用“揭示答案”最高两星。</div>' +
    '</div><div class="mrow"><button class="mbtn" id="mGo">开始闯关</button></div>';
}

/* ==================================================================
   彩纸庆祝（Canvas 实现）
   ================================================================== */
var confettiState = null;
function confetti(){
  var cv = $('confettiCv');
  cv.style.display = 'block';
  cv.width = window.innerWidth;
  cv.height = window.innerHeight;
  var colors = [ getPallet().c1, getPallet().c2, '#ef4444', '#22c55e', '#facc15', '#a855f7' ];
  var parts = [];
  for(var i=0;i<130;i++){
    parts.push({
      x: Math.random() * cv.width,
      y: -20 - Math.random() * cv.height * 0.4,
      w: 8 + Math.random() * 8,
      h: 6 + Math.random() * 8,
      vx: (Math.random() - 0.5) * 2.4,
      vy: 2 + Math.random() * 3.2,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.24,
      col: colors[ Math.floor(Math.random() * colors.length) ]
    });
  }
  var startT = Date.now();
  confettiState = { cv: cv, parts: parts, startT: startT };
  requestAnimationFrame(confettiFrame);
}
function confettiFrame(){
  var st = confettiState;
  if(!st) return;
  var ctx = st.cv.getContext('2d');
  ctx.clearRect(0, 0, st.cv.width, st.cv.height);
  st.parts.forEach(function(p){
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.045;
    p.rot += p.vr;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.col;
    ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    ctx.restore();
  });
  if(Date.now() - st.startT < 3200){
    requestAnimationFrame(confettiFrame);
  }else{
    ctx.clearRect(0, 0, st.cv.width, st.cv.height);
    st.cv.style.display = 'none';
    confettiState = null;
  }
}

/* ==================================================================
   事件绑定与启动
   ================================================================== */
function bindEvents(){
  /* 难度卡片 */
  var cards = document.querySelectorAll('.diffCard');
  for(var i=0;i<cards.length;i++){
    cards[i].addEventListener('click', function(){
      startDiff(this.dataset.diff);
    });
  }
  /* 顶部按钮 */
  $('btnRules').onclick = function(){
    showModal(rulesHtml());
    var go = $('mGo');
    if(go) go.onclick = hideModal;
  };
  $('btnReveal').onclick = function(){ if(G.inGame) revealAnswer(); };
  $('btnRestart').onclick = function(){ if(G.inGame) restartLevel(); };
  $('btnBack').onclick = function(){ backToMenu(); };
  /* 画布交互 */
  var board = $('board');
  board.addEventListener('pointerdown', onPointerDown);
  board.addEventListener('pointermove', onPointerMove);
  board.addEventListener('pointerup', onPointerUp);
  board.addEventListener('pointercancel', onPointerUp);
  /* 窗口缩放：重算格子尺寸并重绘 */
  var resizeTid = null;
  window.addEventListener('resize', function(){
    if(!drag && G.lv){
      clearTimeout(resizeTid);
      resizeTid = setTimeout(renderLevel, 120);
    }
  });
  /* 计时 */
  G.timerId = setInterval(tick, 1000);
}

/* 启动：随机色板 + 弹出规则 */
function init(){
  G.pallet = PALETTES[ Math.floor(Math.random() * PALETTES.length) ];
  applyPalette(G.pallet);
  bindEvents();
  showModal(rulesHtml());
  $('mGo').onclick = hideModal;
}
init();

})();
</script>
