<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>图形运动 · 方格探险队</title>
<style>:root{--c1:#2563eb;--c2:#f59e0b;--bg:#eff6ff;--ink:#1e293b;--grid:#b9c6d6;--gold:#f59e0b}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{height:100%}body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow-x:hidden}#topBar{width:100%;max-width:1080px;display:flex;align-items:center;gap:12px;padding:10px 14px;flex-wrap:wrap}#gameTitle{font-size:26px;font-weight:900;color:var(--c1);letter-spacing:1px}#hud{display:flex;gap:10px;margin-left:auto;align-items:center;flex-wrap:wrap}.hudChip{background:#fff;border:3px solid var(--c1);color:var(--c1);border-radius:14px;padding:6px 14px;font-size:20px;font-weight:800;min-width:120px;text-align:center}#btns{display:flex;gap:8px;flex-wrap:wrap}.tbtn{border:3px solid var(--c1);background:#fff;color:var(--c1);font-size:18px;font-weight:800;padding:8px 14px;border-radius:14px;cursor:pointer;transition:transform .12s,background .12s}.tbtn:hover{background:var(--c1);color:#fff;transform:translateY(-2px)}.tbtn:active{transform:translateY(0)}.tbtn.warn{border-color:var(--c2);color:var(--c2)}.tbtn.warn:hover{background:var(--c2);color:#fff}#menu{width:100%;max-width:1080px;padding:10px 16px 40px}#menuIntro{background:#fff;border-radius:18px;padding:16px 20px;font-size:20px;line-height:1.7;border:3px dashed var(--c1);margin-bottom:22px}#menuIntro b{color:var(--c1)}.diffRow{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}.diffCard{flex:1;min-width:250px;max-width:330px;background:#fff;border-radius:20px;border:4px solid var(--c1);padding:22px 18px;cursor:pointer;text-align:center;transition:transform .15s,box-shadow .15s}.diffCard:hover{transform:translateY(-6px);box-shadow:0 12px 24px rgba(30,41,59,.18)}.diffCard h2{font-size:24px;color:var(--c1);margin-bottom:8px}.diffCard .dsub{font-size:17px;color:#475569;line-height:1.6}.diffCard .icon{margin-bottom:10px}.diffCard.mid{border-color:var(--c2)}.diffCard.mid h2{color:var(--c2)}.diffCard.hard{border-color:#0d9488}.diffCard.hard h2{color:#0d9488}#gameWrap{width:100%;max-width:1080px;padding:0 14px 40px;display:none}#levelInfo{background:#fff;border-radius:16px;border:3px solid var(--c1);padding:12px 18px}#levelName{font-size:22px;font-weight:900;color:var(--c1);margin-bottom:6px}#levelDesc{font-size:19px;line-height:1.65}#stageTip{margin:12px 0;background:#fffbe8;border:3px solid var(--gold);border-radius:14px;padding:10px 16px;font-size:19px;font-weight:700;color:#92600a;display:none;min-height:64px}#boardWrap{position:relative;margin:0 auto;width:fit-content;max-width:100%}#board{position:relative;background:#fff;border:4px solid var(--ink);border-radius:6px;overflow:hidden;touch-action:none;box-shadow:0 8px 20px rgba(30,41,59,.12)}#overlay{position:absolute;left:0;top:0;pointer-events:none;z-index:60}.cell{position:absolute;border-radius:4px}.cell.target{background:rgba(148,163,184,.16);border:2.5px dashed #94a3b8;z-index:1}.cell.targetColor{background:rgba(255,255,255,.35);border:2.5px dashed #64748b;z-index:1;display:flex;align-items:center;justify-content:center}.cell.block{background:var(--pc,#2563eb);border:2.5px solid rgba(255,255,255,.85);box-shadow:inset 0 -4px 0 rgba(0,0,0,.14);z-index:10;cursor:grab}.cell.block.locked{cursor:default;box-shadow:0 0 0 3px var(--gold) inset}.cell.block.sel{outline:3px solid var(--ink);outline-offset:1px}.cell.given{background:var(--pc,#2563eb);border:2.5px solid rgba(255,255,255,.85);box-shadow:inset 0 -4px 0 rgba(0,0,0,.14);z-index:5}.cell.painted{background:var(--c2);border:2.5px solid rgba(255,255,255,.85);box-shadow:inset 0 -4px 0 rgba(0,0,0,.14);z-index:6;cursor:pointer}.cell.painted.wrong{background:#f87171;animation:shakeX .35s}@keyframes shakeX{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}.cell.revealGold{background:rgba(245,158,11,.45);border:3px solid var(--gold);z-index:8;animation:pulseGold 1s infinite}@keyframes pulseGold{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.7)}50%{box-shadow:0 0 0 6px rgba(245,158,11,0)}}.axisV,.axisH{position:absolute;z-index:4;pointer-events:none}.axisV{width:4px;background:repeating-linear-gradient(135deg,#e11d48 0 10px,#fff 10px 20px);border-left:1px solid #e11d48;border-right:1px solid #e11d48}.axisH{height:4px;background:repeating-linear-gradient(135deg,#e11d48 0 10px,#fff 10px 20px);border-top:1px solid #e11d48;border-bottom:1px solid #e11d48}.centerDot{position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--c1);z-index:30;cursor:pointer;transition:transform .12s}.centerDot:hover{transform:scale(1.25)}.centerDot.chosen{background:var(--gold);border-color:#b45309;transform:scale(1.35)}.centerDot.revealDot{background:var(--gold);animation:pulseGold 1s infinite}.centerDot .lab{position:absolute;left:24px;top:-6px;font-size:16px;font-weight:900;color:#b45309;background:rgba(255,255,255,.9);padding:0 3px;border-radius:4px}#controlBar{display:flex;gap:10px;margin:14px auto 0;justify-content:center;flex-wrap:wrap;max-width:1080px}.dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,58px);gap:8px}.dbtn{border:3px solid var(--c1);background:#fff;color:var(--c1);border-radius:12px;font-size:24px;font-weight:900;cursor:pointer}.dbtn:hover{background:var(--c1);color:#fff}.rotBtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.rbtn{border:3px solid var(--c2);background:#fff;color:var(--c2);border-radius:14px;font-size:19px;font-weight:800;padding:12px 18px;cursor:pointer}.rbtn:hover{background:var(--c2);color:#fff}.rbtn:disabled{opacity:.45;cursor:not-allowed}.piecePick{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.ppick{border:3px solid var(--c1);background:#fff;color:var(--c1);border-radius:14px;font-size:18px;font-weight:800;padding:10px 16px;cursor:pointer}.ppick.on{background:var(--c1);color:#fff}.ctlNote{font-size:17px;color:#475569;align-self:center}#modalMask{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}#modalBox{background:#fff;border-radius:20px;border:5px solid var(--c1);max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:24px 26px}#modalBox h3{font-size:24px;color:var(--c1);margin-bottom:12px}#modalBox .mbody{font-size:19px;line-height:1.75}#modalBox .mbody b{color:var(--c1)}#modalBox .mrow{margin-top:18px;text-align:center}.mbtn{border:3px solid var(--c1);background:var(--c1);color:#fff;border-radius:14px;font-size:20px;font-weight:800;padding:12px 26px;cursor:pointer;margin:0 8px}.mbtn.ghost{background:#fff;color:var(--c1)}.mbtn:hover{transform:translateY(-2px)}.ruleSec{margin:10px 0;padding:10px 14px;background:var(--bg);border-radius:12px}.starRow{display:flex;justify-content:center;gap:8px;margin:10px 0 4px}.starRow svg{width:56px;height:56px}.starOn{fill:var(--gold);stroke:#b45309;stroke-width:1.5}.starOff{fill:#e2e8f0;stroke:#94a3b8;stroke-width:1.5}#confettiCv{position:fixed;inset:0;pointer-events:none;z-index:300;display:none}@media(max-width:720px){#gameTitle{font-size:20px}.hudChip{font-size:16px;min-width:96px;padding:4px 8px}.tbtn{font-size:15px;padding:6px 10px}#levelDesc{font-size:17px}#levelName{font-size:19px}#stageTip{font-size:16px}#modalBox .mbody{font-size:17px}}
</style>
</head>
<body>

<!-- ===== 顶部栏：标题 / 计时步数 / 功能按钮 ===== -->
<div id="topBar">
  <div id="gameTitle">图形运动 · 方格探险队</div>
  <div id="hud">
    <div class="hudChip" id="hudTime">时间 00:00</div>
    <div class="hudChip" id="hudSteps">步数 0</div>
  </div>
  <div id="btns">
    <button class="tbtn" id="btnRules">玩法说明</button>
    <button class="tbtn warn" id="btnReveal">揭示答案</button>
    <button class="tbtn" id="btnRestart">重新开始</button>
    <button class="tbtn" id="btnBack">返回难度</button>
  </div>
</div>

<!-- ===== 主菜单：难度选择 ===== -->
<div id="menu">
  <div id="menuIntro">
    欢迎来到<b>方格探险队</b>！这里的一切图形都会"运动"：<b>平移</b>、<b>旋转</b>、<b>轴对称</b>。
    选择一个难度开始闯关吧——每一局的关卡和配色都会随机变化，多玩几局也不会腻哦！
  </div>
  <div class="diffRow">
    <div class="diffCard easy" data-diff="easy">
      <div class="icon">
        <svg width="64" height="44" viewBox="0 0 64 44">
          <rect x="4" y="14" width="20" height="16" rx="3" fill="#2563eb"/>
          <rect x="38" y="14" width="20" height="16" rx="3" fill="#f59e0b" opacity=".55"/>
          <path d="M27 22 h7 m-3 -3 l3 3 l-3 3" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <h2>初级 · 平移驿站</h2>
      <div class="dsub">拖一拖、移一移，<br>掌握平移的方向和距离，<br>用最少步数运送图形。</div>
    </div>
    <div class="diffCard mid" data-diff="mid">
      <div class="icon">
        <svg width="64" height="44" viewBox="0 0 64 44">
          <rect x="10" y="8" width="14" height="14" rx="3" fill="#f59e0b"/>
          <rect x="10" y="24" width="14" height="14" rx="3" fill="#f59e0b"/>
          <rect x="26" y="8" width="14" height="14" rx="3" fill="#f59e0b"/>
          <rect x="26" y="24" width="14" height="14" rx="3" fill="#f59e0b"/>
          <circle cx="25" cy="23" r="4" fill="#1e293b"/>
          <path d="M46 22 a9 9 0 1 1 -3 -7" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M43 11 l0 5 l5 0" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <h2>中级 · 旋转殿堂</h2>
      <div class="dsub">选中心、定方向、转角度，<br>玩转旋转三要素，<br>把图形转到目标位置。</div>
    </div>
    <div class="diffCard hard" data-diff="hard">
      <div class="icon">
        <svg width="64" height="44" viewBox="0 0 64 44">
          <rect x="8" y="12" width="10" height="18" rx="2" fill="#0d9488"/>
          <rect x="46" y="12" width="10" height="18" rx="2" fill="#0d9488" opacity=".55"/>
          <line x1="32" y1="4" x2="32" y2="40" stroke="#e11d48" stroke-width="3" stroke-dasharray="6 4"/>
          <circle cx="20" cy="17" r="2.5" fill="#1e293b"/>
          <circle cx="44" cy="17" r="2.5" fill="#1e293b"/>
        </svg>
      </div>
      <h2>高级 · 对称星河</h2>
      <div class="dsub">涂一涂、补一补，<br>点亮轴对称之美，<br>再送图形去旅行。</div>
    </div>
  </div>
</div>

<!-- ===== 游戏区 ===== -->
<div id="gameWrap">
  <div id="levelInfo">
    <div id="levelName"></div>
    <div id="levelDesc"></div>
  </div>
  <div id="stageTip"></div>
  <div id="boardWrap">
    <div id="board"></div>
    <svg id="overlay"></svg>
  </div>
  <div id="controlBar"></div>
</div>

<!-- ===== 模态层 ===== -->
<div id="modalMask">
  <div id="modalBox"></div>
</div>

<!-- ===== 彩纸 ===== -->
<canvas id="confettiCv"></canvas>

<script>(function(){"use strict";function $(id){return document.getElementById(id)}function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}function keyOf(cells){return cells.map(function(c){return c[0]+","+c[1]}).sort().join(";")}function pad2(n){return(n<10?"0":"")+n}var PALETTES=[{c1:"#2563eb",c2:"#f59e0b",bg:"#eff6ff"},{c1:"#059669",c2:"#ea580c",bg:"#ecfdf5"},{c1:"#7c3aed",c2:"#e11d48",bg:"#f5f3ff"},{c1:"#0891b2",c2:"#ca8a04",bg:"#ecfeff"},{c1:"#dc2626",c2:"#2563eb",bg:"#fef2f2"},{c1:"#16a34a",c2:"#db2777",bg:"#f0fdf4"}];function applyPalette(p){var r=document.documentElement.style;r.setProperty("--c1",p.c1);r.setProperty("--c2",p.c2);r.setProperty("--bg",p.bg)}var QUAD_COLORS=["#ef4444","#facc15","#3b82f6","#22c55e"];function rotateCell(r,c,px,py,dir){var x=c+.5,y=r+.5;var nx,ny;if(dir==="cw"){nx=px-(y-py);ny=py+(x-px)}else if(dir==="ccw"){nx=px+(y-py);ny=py-(x-px)}else{nx=2*px-x;ny=2*py-y}return[Math.round(ny-.5),Math.round(nx-.5)]}function mirrorC(c,axisX){return 2*axisX-1-c}function mirrorR(r,axisY){return 2*axisY-1-r}var LEVELS={easy:[{id:"candle",type:"translate",title:"蜡烛拼装",desc:"方格纸上有两块图形：火焰块和烛身块。请把它们分别平移到中间的虚线轮廓处，拼成一支完整的蜡烛；拼好后，再把整支蜡烛一起平移到右侧的虚线框里。（每个小方格的边长表示1厘米）",cols:16,rows:8,best:18,pieces:[{id:"flame",name:"火焰块",color:"c2",anchor:[1,0],shape:[[0,1],[1,0],[1,1],[1,2]]},{id:"body",name:"烛身块",color:"c1",anchor:[0,11],shape:[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2],[3,0],[3,1],[3,2]]}],stages:[{tip:"第一步：拼成蜡烛。火焰块要向右平移；烛身块要向下平移再向左平移，移到火焰块正下方。",targets:{flame:[1,6],body:[3,6]},group:false},{tip:"第二步：整支蜡烛向右平移。拖动其中任意一块，两块会一起移动到虚线框。",targets:{flame:[1,10],body:[3,10]},group:true}],explain:"平移口诀：找顶点 → 移顶点 → 连点成图。平移前后图形的形状、大小和方向完全相同，只有位置发生变化。"},{id:"shortest",type:"stepmove",title:"最短路线挑战",desc:"晨晨和亮亮在玩平移比拼：把彩色积木块移到虚线车位里，每次只能向上、向下、向左或向右平移1格，用的步数最少的人获胜。请你用下方的方向按钮移动积木块，挑战用最少的步数到达虚线车位！（悄悄告诉你：最少步数 = 水平方向的格数 + 竖直方向的格数）",cols:10,rows:8,variants:[{start:[5,0],goal:[1,4]},{start:[2,2],goal:[6,7]},{start:[6,1],goal:[0,6]}],shape:[[0,0],[0,1],[1,0]],explain:"每次只能水平或竖直平移1格，所以从起点到终点，水平方向要走的格数和竖直方向要走的格数一格都不能少：最少步数 = 水平格数 + 竖直格数。走“斜线”是不允许的哦。"},{id:"boat",type:"translate",title:"小船启航",desc:"把小船图形拖到右下方的虚线轮廓处。拖到位后，会告诉你小船向哪个方向平移了几格。（每个小方格的边长表示1米）",cols:14,rows:7,best:9,pieces:[{id:"boat",name:"小船",color:"c1",anchor:[2,1],shape:[[0,0],[0,1],[0,2],[1,1],[2,0],[2,1],[2,2]]}],stages:[{tip:"拖动小船（也可以点选小船后用方向按钮一格一格移），让它的每条边都和虚线轮廓对齐。",targets:{boat:[4,8]},group:false}],explain:"先在小船上找一个顶点，数一数它到虚线轮廓对应顶点横向隔几格、竖向隔几格；再把整个图形按同样的方向和距离平移过去。"}],mid:[{id:"icon",type:"rotate",title:"社团图标设计师",desc:"创客社团要设计一枚图标：请把图形块旋转到虚线轮廓的位置。先点击图中的圆点选择旋转中心，再点击方向按钮执行旋转。图形与虚线轮廓完全重合就成功啦！圆点旁边标了字母，方便你观察。",cols:9,rows:8,piece:{anchor:[2,2],color:"c1",shape:[[0,0],[1,0],[1,1],[1,2]]},answer:{center:[2,4],dir:"ccw"},centers:[[2,4],[4,2],[2,2]],best:1,explain:"旋转三要素：旋转中心、旋转方向（顺时针或逆时针）、旋转角度。先确定中心，再找与中心相连的线段，画出旋转后的对应线段（格线上的线段最好找），最后按原图补齐。"},{id:"pattern",type:"rotateColor",title:"图案转转转",desc:"正方形图案由四块不同颜色的方格组成（红、黄、蓝、绿）。请把整个图案绕中心旋转，使每一块颜色都与虚线目标里的颜色位置完全一致。想一想：绕哪个点转？转多少度？（虚线目标里画的是每一格应有的颜色）",cols:10,rows:10,piece:{anchor:[3,3],quad4:true},answer:{center:[5,5],dir:"180"},centers:[[5,5],[3,3],[7,7]],best:1,explain:"绕图案中心的点顺时针（或逆时针）旋转180度，图案位置不变，但每块颜色都换到对角位置——旋转180度也就是中心对称。只转90度的话，颜色只会到相邻位置，是对不上的哦。"},{id:"garage",type:"rotate",title:"车库转向",desc:"小香画的房屋平面图里，车库的方向画错啦！请把车库图形旋转到虚线轮廓处。先点击圆点选择旋转中心，再选方向和角度执行旋转。",cols:8,rows:8,piece:{anchor:[3,3],color:"c1",shape:[[0,0],[0,1],[0,2],[1,0],[2,0]]},answer:{center:[3,3],dir:"ccw"},centers:[[3,3],[5,5],[3,5],[5,3]],best:1,explain:"车库要绕左上角的圆点，按逆时针方向旋转90度：与旋转中心相连的横边旋转后变成竖边，竖边变成横边，长短都不变。旋转前后图形的形状和大小完全相同，方向和位置发生变化。"}],hard:[{id:"rocket",type:"paint",title:"火箭设计师",desc:"鑫鑫是航天迷，他在方格纸上画了轴对称图形“火箭”的一半，竖直的玫红虚线是对称轴。请点击右侧的空格涂色，补全火箭的另一半（涂错了再点一下就能擦掉）。补全后，再把整支火箭平移到虚线框里。",cols:16,rows:11,axes:[{t:"v",x:8}],given:[[1,6],[2,5],[2,6],[3,4],[3,5],[3,6],[4,4],[4,5],[4,6],[5,4],[5,5],[5,6],[6,4],[6,5],[6,6],[7,4],[7,5],[7,6],[6,3],[7,2],[7,3],[8,5],[8,6],[9,6]],stage2:{dr:-1,dc:2},best:27,explain:"补全轴对称图形：对称轴两侧的对称点到对称轴的距离相等。先数每个关键格（顶点）到对称轴有几格，再在对称轴另一侧同样远的地方找到对称格，最后依次连成图形。"},{id:"flower",type:"paintMulti",title:"花圃设计师",desc:"小香家新房的平面图里，花圃只画出了四分之一！图中的横、竖两条玫红虚线都是对称轴。请点击空格涂色补全花圃，使它成为一个有两条对称轴的轴对称图形。",cols:12,rows:12,axes:[{t:"v",x:6},{t:"h",y:6}],given:[[1,8],[2,7],[2,8],[2,9],[3,8]],best:15,explain:"有两条对称轴的图形，既要左右对称，又要上下对称。以画好的一份为“种子”：先沿竖直对称轴左右镜像，再沿水平对称轴上下镜像，就得到四份完全一样的图案，像一朵四瓣花。"},{id:"gem",type:"paint",title:"宝石徽章",desc:"小香还设计了一枚宝石徽章，可是只画出了上半部分！水平的玫红虚线是对称轴。请点击空格涂色补全下半部分，让徽章成为轴对称图形。",cols:13,rows:10,axes:[{t:"h",y:5}],given:[[0,6],[1,5],[1,6],[1,7],[2,4],[2,5],[2,6],[2,7],[2,8],[3,6],[4,6]],best:11,explain:"水平对称轴上、下的对称点到对称轴的距离相等。先数每一格离对称轴有几格，再在对称轴另一侧同样距离的位置涂色；中线上的格子里，对称点就是它自己所在的竖列。"}]};var DIFF_NAMES={easy:"初级 · 平移驿站",mid:"中级 · 旋转殿堂",hard:"高级 · 对称星河"};var CENTER_LABELS=["O","P","Q","R"];var G={diff:null,queue:[],qi:0,lv:null,steps:0,startTs:0,timerId:null,usedReveal:false,inGame:false};var CELL=40;function fmtTime(sec){return pad2(Math.floor(sec/60))+":"+pad2(sec%60)}function tick(){if(!G.inGame)return;var s=Math.floor((Date.now()-G.startTs)/1e3);$("hudTime").textContent="时间 "+fmtTime(s)}function addSteps(n){G.steps+=n;$("hudSteps").textContent="步数 "+G.steps}function resetHud(){G.steps=0;$("hudSteps").textContent="步数 0";$("hudTime").textContent="时间 00:00";G.startTs=Date.now()}function calcCell(){var lv=G.lv;var wrap=$("boardWrap");var avail=Math.min(window.innerWidth-36,960);CELL=Math.floor(avail/lv.cols);if(CELL>46)CELL=46;if(CELL<22)CELL=22;var board=$("board");board.style.width=lv.cols*CELL+"px";board.style.height=lv.rows*CELL+"px";board.style.backgroundImage="linear-gradient(to right, var(--grid) 1.5px, transparent 1.5px),linear-gradient(to bottom, var(--grid) 1.5px, transparent 1.5px)";board.style.backgroundSize=CELL+"px "+CELL+"px";var ov=$("overlay");ov.setAttribute("width",lv.cols*CELL);ov.setAttribute("height",lv.rows*CELL);ov.style.width=lv.cols*CELL+"px";ov.style.height=lv.rows*CELL+"px"}function mkCell(r,c,cls,bg){var d=document.createElement("div");d.className="cell "+cls;d.style.left=c*CELL+"px";d.style.top=r*CELL+"px";d.style.width=CELL-2+"px";d.style.height=CELL-2+"px";if(bg)d.style.setProperty("--pc",bg);return d}function colorOf(token){if(token==="c1")return getPallet().c1;if(token==="c2")return getPallet().c2;return token}function getPallet(){return G.pallet}function drawAxes(){var board=$("board");(G.lv.axes||[]).forEach(function(ax){var d=document.createElement("div");if(ax.t==="v"){d.className="axisV";d.style.left=ax.x*CELL-2+"px";d.style.top=0;d.style.height=G.lv.rows*CELL+"px"}else{d.className="axisH";d.style.top=ax.y*CELL-2+"px";d.style.left=0;d.style.width=G.lv.cols*CELL+"px"}board.appendChild(d)})}function drawTargets(cells,withColor){var board=$("board");cells.forEach(function(rc){var d;if(withColor){d=mkCell(rc[0],rc[1],"targetColor");var dot=document.createElement("div");dot.style.width="60%";dot.style.height="60%";dot.style.borderRadius="4px";dot.style.background=QUAD_COLORS[rc.ci];dot.style.opacity=".5";d.appendChild(dot)}else{d=mkCell(rc[0],rc[1],"target")}board.appendChild(d)})}function startDiff(diff){G.diff=diff;G.pallet=PALETTES[Math.floor(Math.random()*PALETTES.length)];applyPalette(G.pallet);G.queue=shuffle(LEVELS[diff].map(function(l){return l.id})).slice(0,2);G.qi=0;$("menu").style.display="none";$("gameWrap").style.display="block";G.inGame=true;loadLevel()}function findLevel(id){return LEVELS[G.diff].filter(function(l){return l.id===id})[0]}function loadLevel(){var src=findLevel(G.queue[G.qi]);var lv=JSON.parse(JSON.stringify(src));G.lv=lv;G.usedReveal=false;resetHud();$("levelName").textContent=G.qi+1+"/"+G.queue.length+"　"+lv.title+"　（"+DIFF_NAMES[G.diff]+"）";$("levelDesc").textContent=lv.desc;if(lv.type==="translate"){lv.stageIdx=0;lv.pieces.forEach(function(p){p.cur=p.anchor.slice();p.locked=false})}else if(lv.type==="stepmove"){var v=lv.variants[Math.floor(Math.random()*lv.variants.length)];lv.variant=v;lv.best=Math.abs(v.goal[0]-v.start[0])+Math.abs(v.goal[1]-v.start[1]);lv.cur=v.start.slice()}else if(lv.type==="rotate"||lv.type==="rotateColor"){lv.centersShown=shuffle(lv.centers);lv.chosen=null;if(lv.type==="rotate"){lv.cells=lv.piece.shape.map(function(s){return[lv.piece.anchor[0]+s[0],lv.piece.anchor[1]+s[1]]})}else{lv.cells=[];for(var r=0;r<4;r++)for(var c=0;c<4;c++){var ci=(r<2?0:2)+(c<2?0:1);lv.cells.push({0:lv.piece.anchor[0]+r,1:lv.piece.anchor[1]+c,ci})}}var ans=lv.answer;lv.targets=lv.cells.map(function(cell){var t=rotateCell(cell[0],cell[1],ans.center[0],ans.center[1],ans.dir);if(typeof cell.ci==="number")t.ci=cell.ci;return t});lv.labels={};lv.centersShown.forEach(function(pt,i){lv.labels[pt[0]+","+pt[1]]=CENTER_LABELS[i]})}else if(lv.type==="paint"||lv.type==="paintMulti"){lv.stageIdx=0;lv.painted={};lv.groupOff={dr:0,dc:0};var target={};lv.given.forEach(function(rc){var set=[rc];lv.axes.forEach(function(a){if(a.t==="v"){set=set.concat(set.map(function(p){return[p[0],mirrorC(p[1],a.x)]}))}else{set=set.concat(set.map(function(p){return[mirrorR(p[0],a.y),p[1]]}))}});set.forEach(function(p){target[p[0]+","+p[1]]=true})});lv.given.forEach(function(rc){delete target[rc[0]+","+rc[1]]});lv.paintTargets=Object.keys(target).map(function(k){var a=k.split(",");return[+a[0],+a[1]]});lv.best=lv.paintTargets.length+(lv.stage2?Math.abs(lv.stage2.dr)+Math.abs(lv.stage2.dc):0);if(lv.stage2){lv.allCells=function(){var all=lv.given.concat(lv.paintTargets);return all}}}renderLevel()}function renderLevel(){calcCell();clearBoard();var lv=G.lv;if(lv.type==="translate"){renderTranslate()}else if(lv.type==="stepmove"){renderStepmove()}else if(lv.type==="rotate"||lv.type==="rotateColor"){renderRotate()}else if(lv.type==="paint"||lv.type==="paintMulti"){renderPaint()}}function clearBoard(){$("board").innerHTML="";$("overlay").innerHTML="";$("controlBar").innerHTML="";$("stageTip").style.display="none"}function renderTranslate(){var lv=G.lv;clearBoard();var board=$("board");var st=lv.stages[lv.stageIdx];lv.pieces.forEach(function(
