<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>彩虹水实验室 · 认识毫升（升与毫升）</title>
<style>
/* ===================== 全局样式（课堂投影：高对比、大字号） ===================== */
:root{
  --c1:#1976d2;      /* 主色 */
  --c2:#64b5f6;      /* 辅色 */
  --bg:#e3f2fd;      /* 背景色 */
  --liquid:#42a5f5;  /* 液体色 */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;
  background:var(--bg);
  color:#222;
  font-size:17px;
  user-select:none;
  -webkit-user-select:none;
  min-height:100vh;
  touch-action:manipulation;
}
#app{max-width:1060px;margin:0 auto;padding:12px 14px 30px;}
.hidden{display:none !important;}

/* ===================== 顶栏 ===================== */
header{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;
  background:linear-gradient(120deg,var(--c1),var(--c2));
  color:#fff;border-radius:16px;padding:10px 16px;box-shadow:0 4px 14px rgba(0,0,0,.15);
}
.logo{font-size:23px;font-weight:800;letter-spacing:1px;}
.hdr-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.hud{display:flex;gap:10px;font-size:18px;font-weight:700;background:rgba(255,255,255,.22);
  padding:6px 12px;border-radius:12px;}
.hdr-btns{display:flex;gap:8px;}
button{font-family:inherit;}
.btn{
  padding:9px 20px;font-size:18px;font-weight:700;border-radius:12px;cursor:pointer;
  border:3px solid #fff;background:rgba(255,255,255,.92);color:var(--c1);
}
.btn:active{transform:scale(.96);}
.btn.big{font-size:21px;padding:12px 30px;}
.btn.warn{border-color:#ef6c00;color:#ef6c00;}

/* ===================== 首页难度选择 ===================== */
.home-head{text-align:center;margin:22px 0 6px;}
.home-head h1{color:var(--c1);font-size:32px;margin:8px 0 6px;}
.home-head p{font-size:19px;margin:4px 0;color:#444;}
.knowledge{
  margin:14px auto;max-width:760px;background:#fffbe6;border:3px dashed #f9a825;
  border-radius:14px;padding:10px 18px;font-size:20px;font-weight:700;text-align:center;color:#7a4f00;
}
.diff-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:16px;}
.diff-card{
  background:#fff;border:4px solid var(--c1);border-radius:18px;padding:18px 18px 16px;cursor:pointer;
  transition:transform .18s,box-shadow .18s;box-shadow:0 3px 10px rgba(0,0,0,.08);
}
.diff-card:hover{transform:translateY(-5px);box-shadow:0 10px 20px rgba(0,0,0,.16);}
.diff-card h2{margin:0 0 8px;font-size:24px;color:var(--c1);}
.diff-card .tag{display:inline-block;background:var(--c1);color:#fff;border-radius:10px;
  padding:3px 12px;font-size:16px;font-weight:700;margin-bottom:8px;}
.diff-card ul{margin:8px 0 0;padding-left:20px;font-size:17px;line-height:1.8;color:#333;}

/* ===================== 游戏界面 ===================== */
.play-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;}
.dots{display:flex;gap:8px;align-items:center;}
.dot{
  min-width:40px;text-align:center;background:#fff;border:3px solid var(--c2);color:#666;
  border-radius:999px;padding:4px 12px;font-size:17px;font-weight:700;
}
.dot.cur{background:var(--c1);border-color:var(--c1);color:#fff;}
.dot.done{background:var(--c2);border-color:var(--c2);color:#fff;}
.diff-name{font-size:19px;font-weight:800;color:var(--c1);}
.mission-card{
  background:#fff;border-left:12px solid var(--c2);border-radius:14px;
  padding:12px 18px;margin:12px 0;font-size:21px;line-height:1.6;box-shadow:0 2px 8px rgba(0,0,0,.07);
}
.mission-card b{color:var(--c1);}
.mission-card .mtitle{font-size:19px;color:#777;font-weight:700;margin-bottom:4px;}
#stage{
  background:#fff;border:3px solid var(--c1);border-radius:18px;padding:20px 16px;
  min-height:360px;display:flex;flex-direction:column;gap:20px;align-items:center;justify-content:center;
  box-shadow:inset 0 0 0 6px rgba(255,255,255,.6);
}
.stage-row{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-end;justify-content:center;width:100%;}
.stat{font-size:20px;font-weight:800;color:var(--c1);text-align:center;}
.stat .red{color:#e53935;}
.hint{font-size:17px;color:#666;text-align:center;max-width:640px;line-height:1.6;}
.bottom-bar{display:flex;gap:14px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
.bottom-bar .btn{border-color:var(--c1);color:var(--c1);}

/* ===================== 量杯（核心图形组件） ===================== */
.cup-wrap{position:relative;padding:0 84px 0 8px;display:flex;align-items:flex-end;}
.beaker{
  position:relative;border:5px solid var(--c1);border-top-width:3px;border-radius:0 0 20px 20px;
  background:rgba(255,255,255,.55);
}
.beaker .inner{position:absolute;left:0;right:0;bottom:0;top:0;border-radius:0 0 15px 15px;overflow:hidden;}
.beaker .fill{
  position:absolute;left:0;right:0;bottom:0;height:0%;
  background:linear-gradient(180deg,var(--c2),var(--liquid));
  transition:height .38s ease;
}
.beaker.dragging .fill{transition:none;} /* 拖动刻度时液面即时跟随 */
.tick{position:absolute;right:0;width:16px;height:0;border-top:2px solid var(--c1);z-index:3;}
.tick.major{width:26px;border-top-width:3px;}
.tick-label{
  position:absolute;left:calc(100% + 32px);transform:translateY(-50%);
  font-size:16px;font-weight:700;color:#3a3a3a;white-space:nowrap;z-index:3;
}
.target-line{position:absolute;left:0;right:0;border-top:4px dashed #e53935;z-index:4;}
.target-tag{
  position:absolute;left:6px;transform:translateY(-100%);background:#e53935;color:#fff;
  font-size:16px;font-weight:700;padding:2px 9px;border-radius:9px;z-index:5;white-space:nowrap;
}
.handle{
  position:absolute;left:-18px;right:-18px;height:20px;border-radius:10px;background:var(--c2);
  border:3px solid var(--c1);transform:translateY(-50%);cursor:grab;z-index:6;touch-action:none;
}
.handle .hbubble{
  position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);
  background:var(--c1);color:#fff;font-size:18px;font-weight:800;padding:3px 12px;
  border-radius:11px;white-space:nowrap;
}
.cup-cap{font-size:18px;font-weight:800;color:var(--c1);text-align:center;margin-top:8px;}

/* ===================== 瓶子组件 ===================== */
.bottle{width:88px;text-align:center;cursor:pointer;transition:transform .22s;}
.bottle .b-neck{width:28px;height:15px;border:4px solid var(--c1);border-bottom:none;
  margin:0 auto;border-radius:6px 6px 0 0;background:rgba(255,255,255,.7);}
.bottle .b-body{height:86px;border:4px solid var(--c1);border-radius:10px 10px 16px 16px;
  position:relative;overflow:hidden;background:rgba(255,255,255,.75);}
.bottle .b-fill{position:absolute;left:0;right:0;bottom:0;height:84%;
  background:linear-gradient(180deg,var(--c2),var(--liquid));}
.bottle .b-cap{font-size:19px;font-weight:800;color:var(--c1);margin-top:6px;}
.bottle .b-sub{font-size:16px;color:#666;margin-top:2px;}
.bottle.used{opacity:.32;pointer-events:none;}
.bottle.pouring{transform:translateY(-10px) rotate(-14deg);}
.bottle:active{transform:translateY(-4px);}
.tray{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;align-items:flex-end;min-height:130px;}

/* ===================== 滴管 / 按钮组 ===================== */
.op-btns{display:flex;flex-direction:column;gap:14px;}
.op-btn{
  display:flex;flex-direction:column;align-items:center;gap:6px;width:170px;
  border:4px solid var(--c1);border-radius:16px;background:#fff;padding:12px 10px;cursor:pointer;
  font-size:19px;font-weight:800;color:var(--c1);transition:transform .15s;
}
.op-btn:active{transform:scale(.95);}
.op-btn .ico{font-size:30px;line-height:1;}
.op-btn .desc{font-size:16px;color:#777;font-weight:600;}
.op-btn.disabled{opacity:.4;pointer-events:none;}

/* ===================== 购物篮 / 货架 ===================== */
.shelf{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:stretch;}
.shelf-item{
  width:172px;border:4px solid var(--c2);border-radius:16px;background:#fff;
  padding:10px 8px;text-align:center;cursor:pointer;transition:transform .15s;position:relative;
}
.shelf-item:active{transform:scale(.95);}
.shelf-item .s-name{font-size:18px;font-weight:800;color:var(--c1);margin-top:4px;}
.shelf-item .s-price{font-size:17px;color:#7a4f00;font-weight:700;margin-top:2px;}
.shelf-item .s-count{
  position:absolute;top:-12px;right:-10px;background:#e53935;color:#fff;font-size:16px;font-weight:800;
  border-radius:999px;padding:2px 10px;border:2px solid #fff;
}

/* ===================== 配液池 ===================== */
.pool-box{width:100%;max-width:640px;}
.pool-title{font-size:19px;font-weight:800;color:#3a3a3a;text-align:center;margin-bottom:8px;}
.pool{display:flex;border:4px solid var(--c1);border-radius:14px;overflow:hidden;height:62px;background:rgba(255,255,255,.6);}
.seg{
  flex:1;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#555;
  border-right:2px solid var(--c1);
}
.seg:last-child{border-right:none;}
.seg.on{background:linear-gradient(180deg,var(--c2),var(--liquid));color:#fff;}

/* ===================== 神奇倒水 ===================== */
.station-row{display:flex;gap:26px;align-items:flex-end;justify-content:center;flex-wrap:wrap;}
.station{
  width:132px;text-align:center;cursor:pointer;border:4px solid var(--c1);border-radius:16px;
  background:#fff;padding:10px 6px;font-size:18px;font-weight:800;color:var(--c1);
}
.station .ico{font-size:30px;line-height:1.2;}
.station.sel{background:var(--c1);color:#fff;}
.jcup-wrap{display:flex;flex-direction:column;align-items:center;}
.jcup{position:relative;border:5px solid var(--c1);border-radius:0 0 18px 18px;background:rgba(255,255,255,.55);
  cursor:pointer;margin-top:34px;}
.jcup.sel{box-shadow:0 0 0 6px var(--c2);}
.jcur{font-size:19px;font-weight:800;color:var(--c1);margin-top:8px;}
.jgoal{font-size:17px;color:#e53935;font-weight:700;text-align:center;}

/* ===================== 弹窗 / 提示 ===================== */
.modal{position:fixed;inset:0;background:rgba(20,40,60,.5);display:flex;align-items:center;
  justify-content:center;z-index:50;padding:16px;}
.modal-box{
  background:#fff;border-radius:18px;border-top:14px solid var(--c1);padding:20px 24px;
  max-width:660px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.3);
}
.modal-box h2{color:var(--c1);font-size:25px;margin:4px 0 12px;}
.modal-box .cnt{font-size:19px;line-height:1.85;color:#333;}
.modal-box .cnt b{color:var(--c1);}
.modal-box .close-row{text-align:center;margin-top:16px;}
.ok-face{font-size:52px;text-align:center;}
.stars-big{font-size:40px;color:#f9a825;text-align:center;letter-spacing:6px;margin:6px 0;}
#toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);
  background:rgba(25,45,70,.88);color:#fff;padding:10px 22px;border-radius:14px;font-size:19px;
  font-weight:700;opacity:0;transition:opacity .25s,transform .25s;z-index:70;pointer-events:none;
  max-width:88vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
/* 纯 CSS 彩纸庆祝动画（避免 Canvas 渲染在部分环境崩溃） */
#confettiBox{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden;}
.conf-piece{position:absolute;top:-32px;display:block;border-radius:3px;
  animation:confFall linear forwards;}
@keyframes confFall{
  to{transform:translate3d(var(--dx),115vh,0) rotate(720deg);opacity:.85;}
}

/* ===================== 响应式（移动端） ===================== */
@media (max-width:640px){
  .logo{font-size:19px;}
  .hud{font-size:16px;padding:4px 8px;}
  .btn{font-size:17px;padding:8px 14px;}
  .mission-card{font-size:19px;}
  #stage{padding:14px 8px;gap:14px;}
  .stage-row{gap:16px;}
  .cup-wrap{padding-right:64px;}
  .tick-label{font-size:16px;}
  .bottle{width:76px;}
  .jcup-wrap{transform:scale(.92);}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">🌈 彩虹水实验室 · 认识毫升</div>
    <div class="hdr-right">
      <div class="hud"><span id="hudTime">⏱ 用时 00:00</span><span id="hudSteps">👣 步数 0</span></div>
      <div class="hdr-btns">
        <button class="btn" id="btnRules">玩法说明</button>
        <button class="btn" id="btnHome">返回难度选择</button>
      </div>
    </div>
  </header>
  <main id="screen"></main>
</div>
<div id="confettiBox"></div>
<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<div id="toast"></div>

<script>
/* =====================================================================
   彩虹水实验室 · 认识毫升（苏教版四上 第一单元 升和毫升 第2节）
   核心知识：1升=1000毫升；升与毫升的换算、比较、配比与精明消费
   游戏机制：滴管量取 / 倒水凑量 / 刻度拖拽 / 精明购物篮 / 配比加液 / 神奇倒水
   ===================================================================== */
(function(){
'use strict';

/* ---------------- 小工具 ---------------- */
function $(s){return document.querySelector(s);}
function el(tag,cls,html){
  var d=document.createElement(tag);
  if(cls)d.className=cls;
  if(html!==undefined)d.innerHTML=html;
  return d;
}
function shuffle(a){ // 返回打乱后的新数组
  a=a.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}
function pick(arr){ // 随机取一个元素
  return arr[Math.floor(Math.random()*arr.length)];
}
function fmtTime(sec){
  var m=Math.floor(sec/60),s=sec%60;
  var mm=m<10?'0'+m:''+m, ss=s<10?'0'+s:''+s;
  return mm+':'+ss;
}
/* 毫升数 → 中文复合单位读法，如 2500 → “2升500毫升” */
function labelFor(v){
  if(v%1000===0)return (v/1000)+'升';
  var l=Math.floor(v/1000),r=v%1000;
  return (l>0? l+'升':'')+r+'毫升';
}
/* 为量杯选一个合适的刻度步长（保证刻度是整数且数量适中） */
function niceStep(max){
  var steps=[10,20,25,50,100,200,250,500,1000];
  for(var i=0;i<steps.length;i++){
    if(max%steps[i]===0 && max/steps[i]<=12)return steps[i];
  }
  return max;
}

/* ---------------- 随机色板（每局换一种主色） ---------------- */
var PALETTES=[
  {name:'海洋蓝',c1:'#1565c0',c2:'#64b5f6',bg:'#e3f2fd',liquid:'#42a5f5'},
  {name:'草地绿',c1:'#2e7d32',c2:'#81c784',bg:'#e8f5e9',liquid:'#66bb6a'},
  {name:'蜜橙橙',c1:'#e65100',c2:'#ffb74d',bg:'#fff3e0',liquid:'#ffa726'},
  {name:'葡萄紫',c1:'#6a1b9a',c2:'#ba68c8',bg:'#f3e5f5',liquid:'#ab47bc'},
  {name:'樱桃红',c1:'#b71c1c',c2:'#ef9a9a',bg:'#ffebee',liquid:'#ef5350'},
  {name:'湖水青',c1:'#00695c',c2:'#4db6ac',bg:'#e0f2f1',liquid:'#26a69a'}
];
function applyPalette(){
  var p=pick(PALETTES);
  var r=document.documentElement.style;
  r.setProperty('--c1',p.c1);
  r.setProperty('--c2',p.c2);
  r.setProperty('--bg',p.bg);
  r.setProperty('--liquid',p.liquid);
}

/* ---------------- 全局状态 ---------------- */
var S={
  diff:null,      // 当前难度：easy / mid / hard
  missions:[],    // 本局 3 个关卡实例
  mi:0,           // 当前关卡序号
  steps:0,        // 操作步数
  elapsed:0,      // 用时（秒）
  timer:null,     // 计时器句柄
  stars:[],       // 每关星级
  revealUsed:false, // 本关是否用过“揭示答案”
  overflows:0,      // 本关超量重来次数
  done:false,        // 本关是否已过关
  rulesShown:false,  // 是否已弹过规则
  toastT:null
};
var screen;

/* ---------------- 计时与步数（右上角实时显示） ---------------- */
function startTimer(){
  S.elapsed=0;updHud();
  clearInterval(S.timer);
  S.timer=setInterval(function(){S.elapsed++;updHud();},1000);
}
function stopTimer(){clearInterval(S.timer);}
function updHud(){
  $('#hudTime').textContent='⏱ 用时 '+fmtTime(S.elapsed);
  $('#hudSteps').textContent='👣 步数 '+S.steps;
}
function addStep(){S.steps++;updHud();}

/* ---------------- 弹窗 / 提示条 ---------------- */
function showModal(html){$('#modalBox').innerHTML=html;$('#modal').classList.remove('hidden');}
function closeModal(){$('#modal').classList.add('hidden');}
$('#modal').addEventListener('click',function(e){
  if(e.target===this)closeModal(); // 点背景可关闭
});
function showToast(msg){
  var t=$('#toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(S.toastT);
  S.toastT=setTimeout(function(){t.classList.remove('show');},2400);
}

/* ---------------- 彩纸庆祝动画（纯 CSS 动画实现，稳定不崩溃） ---------------- */
function celebrate(){
  var box=$('#confettiBox');
  box.innerHTML=''; // 清掉上一次的彩纸
  var p=palette();
  var colors=[p.c1,p.c2,p.liquid,'#f9a825','#e53935','#43a047'];
  for(var i=0;i<80;i++){
    var piece=document.createElement('i');
    piece.className='conf-piece';
    var w=8+Math.random()*9, h=10+Math.random()*10;
    piece.style.left=(Math.random()*100)+'vw';
    piece.style.width=w+'px';
    piece.style.height=h+'px';
    piece.style.background=colors[Math.floor(Math.random()*colors.length)];
    piece.style.setProperty('--dx',(Math.random()*160-80)+'px'); // 左右飘动距离
    piece.style.animationDuration=(2.6+Math.random()*2.2)+'s';
    piece.style.animationDelay=(Math.random()*0.9)+'s';
    box.appendChild(piece);
  }
  setTimeout(function(){box.innerHTML='';},6000); // 动画结束后清理
}
function palette(){
  var c1=getComputedStyle(document.documentElement).getPropertyValue('--c1').trim();
  var c2=getComputedStyle(document.documentElement).getPropertyValue('--c2').trim();
  var lq=getComputedStyle(document.documentElement).getPropertyValue('--liquid').trim();
  return {c1:c1,c2:c2,liquid:lq};
}

/* ---------------- 量杯组件 ----------------
   buildCup({max,width,height,tick,labelEvery,dual})
   返回 {wrap, set(毫升), addTarget(毫升,文字)} */
function buildCup(o){
  var wrap=el('div','cup-wrap');
  var cup=el('div','beaker');
  cup.style.width=o.width+'px';
  cup.style.height=o.height+'px';
  var inner=el('div','inner');
  var fill=el('div','fill');
  inner.appendChild(fill);
  cup.appendChild(inner);
  var step=o.tick||niceStep(o.max);
  var n=Math.floor(o.max/step);
  var le=o.labelEvery||Math.max(1,Math.ceil(n/6));
  for(var i=0;i<=n;i++){
    var v=i*step;
    var y=(1-v/o.max)*100;
    var t=el('div','tick');
    t.style.top=y+'%';
    if(i%le===0||i===n){
      t.classList.add('major');
      var lab=el('div','tick-label');
      lab.style.top=y+'%';
      var txt=String(v);
      if(o.dual&&v>0&&v%1000===0){txt=v+'（'+(v/1000)+'升）';}
      lab.textContent=txt;
      cup.appendChild(lab);
    }
    cup.appendChild(t);
  }
  wrap.appendChild(cup);
  if(o.cap){wrap.appendChild(el('div','cup-cap',o.cap));}
  return {
    wrap:wrap,cup:cup,
    set:function(v){fill.style.height=(v/o.max*100)+'%';},
    addTarget:function(v,txt){
      var pct=(v/o.max*100)+'%';
      var line=el('div','target-line');line.style.bottom=pct;
      var tag=el('div','target-tag',txt);tag.style.bottom='calc('+pct+' + 3px)';
      cup.appendChild(line);cup.appendChild(tag);

/* ---------------- 组装一局的 3 个关卡（随机抽样 + 打乱） ---------------- */
function buildMissions(diff){
  var ms=[];
  if(diff==='easy'){
    ms.push({type:'dropper',target:pick([3,4,5,6,7,8])});
    var p1=pick(POUR_EASY);
    ms.push({type:'pour',target:p1.target,bottles:shuffle(p1.bottles)});
    ms.push({type:'scale',v:pick(SCALE_EASY)});
  }else if(diff==='mid'){
    var p2=pick(POUR_MID);
    ms.push({type:'pour',target:p2.target,bottles:shuffle(p2.bottles)});
    ms.push({type:'scale',v:pick(SCALE_MID)});
    var bk=pick(BASKET_MID);
    ms.push({type:'basket',name:bk.name,items:shuffle(bk.items),min:bk.min});
  }else{
    var r=pick(RATIO_HARD);
    ms.push({type:'ratio',perN:r.perN,dose:r.dose,pool:r.pool});
    var bk2=pick(BASKET_HARD);
    ms.push({type:'basket',name:bk2.name,items:shuffle(bk2.items),min:bk2.min});
    ms.push({type:'jug',target:pick([100,200])});
  }
  return ms;
}

/* =====================================================================
   关卡3：刻度调一调（拖动红把手把水面调到指定刻度；升→毫升换算）
   ===================================================================== */
function runScale(stage,m){
  setMText('任务：请量出 <b>'+labelFor(m.v)+'</b> 的水。量杯上只有<b>毫升</b>刻度，先想清楚 '+labelFor(m.v)+
    ' 是多少毫升，再<b>按住红把手上下拖动</b>水面，松手时正好到位就过关！（每次吸附到 50 毫升）');
  var cup=buildCup({max:5000,width:160,height:320,tick:250,labelEvery:4,dual:true,cap:'大量杯（毫升）'});
  var MAX=5000;
  var cur=0,moved=false;
  // 红把手 + 读数气泡
  var handle=el('div','handle');
  handle.innerHTML='<div class="hbubble">0 毫升</div>';
  cup.cup.appendChild(handle);
  function place(v){
    cur=v;
    cup.set(v);
    handle.style.top=((1-v/MAX)*100)+'%';
    handle.querySelector('.hbubble').textContent=v+' 毫升';
  }
  place(0);
  var row=el('div','stage-row');
  row.appendChild(cup.wrap);
  stage.appendChild(row);
  stage.appendChild(el('div','hint','量杯最大 5000 毫升。相邻两条大刻度相差 1000 毫升，正好是 1 升。'));
  var dragging=false;
  cup.cup.style.touchAction='none'; // 拖动水面时禁止页面滚动
  function updFromEvent(e){
    var rect=cup.cup.getBoundingClientRect();
    var frac=(rect.bottom-e.clientY)/rect.height;
    if(frac<0)frac=0;if(frac>1)frac=1;
    var v=Math.round(frac*MAX/50)*50; // 吸附到 50 毫升
    if(v!==cur)moved=true;
    place(v);
  }
  cup.cup.addEventListener('pointerdown',function(e){
    if(S.done)return;
    dragging=true;moved=false;
    cup.cup.classList.add('dragging'); // 拖动时关闭液面过渡动画，跟手更流畅
    cup.cup.setPointerCapture(e.pointerId);
    updFromEvent(e);
  });
  cup.cup.addEventListener('pointermove',function(e){
    if(dragging&&!S.done)updFromEvent(e);
  });
  cup.cup.addEventListener('pointerup',function(){
    if(!dragging||S.done)return;
    dragging=false;
    cup.cup.classList.remove('dragging');
    if(moved)addStep();
    if(cur===m.v){
      missionSuccess(labelFor(m.v)+' = <b>'+m.v+' 毫升</b>，换算完全正确！');
    }else{
      showToast('现在是 '+cur+' 毫升，目标是 '+labelFor(m.v)+'（'+m.v+' 毫升），再调一调！');
    }
  });
  cup.cup.addEventListener('pointercancel',function(){
    dragging=false;
    cup.cup.classList.remove('dragging');
  });
}

      }else if(total>1000){

        showToast('篮子装不下啦：'+total+' 毫升超过了 1000 毫升。点“重新开始”重新挑！');

/* =====================================================================
   关卡5：配比小专家（按“每几升水加一瓶盖原液”的比例给水池加原液）
   ===================================================================== */
function runRatio(stage,m){
  var count=m.pool/m.perN;       // 水池能分成多少份“每N升”
  var needed=count*m.dose;       // 一共需要多少毫升原液
  setMText('使用说明：每 <b>'+m.perN+' 升</b> 水要加入 <b>1 瓶盖（'+m.dose+' 毫升）</b> 浓缩清洁原液。'+
    '水池容量是 <b>'+m.pool+' 升</b>，请点击原液瓶，把原液<b>按比例加够</b>（加到正好达标就过关）！');
  var doses=0;
  // 上方：水池（按每 perN 升分成 count 格，每加一盖点亮一格）
  var poolBox=el('div','pool-box');
  poolBox.appendChild(el('div','pool-title','水池（共 '+m.pool+' 升，每一格是 '+m.perN+' 升）'));
  var pool=el('div','pool');
  var segs=[];
  for(var i=0;i<count;i++){
    var s=el('div','seg',m.perN+'升');
    pool.appendChild(s);segs.push(s);
  }
  poolBox.appendChild(pool);
  stage.appendChild(poolBox);
  var row=el('div','stage-row');
  // 左：原液瓶（每点一次倒出一盖 dose 毫升）
  var bottle=makeBottle(0);
  bottle.style.width='104px';
  bottle.querySelector('.b-cap').textContent='浓缩原液';
  bottle.appendChild(el('div','b-sub','一盖 '+m.dose+' 毫升'));
  var left=el('div','');
  left.style.display='flex';left.style.flexDirection='column';left.style.alignItems='center';left.style.gap='8px';
  left.appendChild(bottle);

  // 右：原液量筒（达标线 = needed 毫升）
  var tube=buildCup({max:needed,width:130,height:240,cap:'原液量筒（毫升）'});
  tube.addTarget(needed,'达标线 '+needed+' 毫升');
  row.appendChild(left);row.appendChild(tube.wrap);
  stage.appendChild(row);
  var stat=el('div','stat','已加入原液：0 / '+needed+' 毫升（已点亮 0 / '+count+' 格）');

    addStep();

    segs[doses-1].classList.add('on');

      ' 毫升（已点亮 <span class="red">'+doses+'</span> / '+count+' 格）';

      missionSuccess(m.pool+'÷'+m.perN+'='+count+' 份，每份加 '+m.dose+' 毫升，共 '+count+'×'+m.dose+
        '=<b>'+needed+' 毫升</b>，比例刚刚好！');
    }
  });
}

/* =====================================================================
   关卡6：神奇倒水（300/500/700 毫升三个空杯，倒来倒去量出目标毫升数）
   操作：先点“水龙头”再点杯子=接满；先点杯子A再点杯子B=A倒入B；先点杯子再点“下水口”=倒空
   ===================================================================== */
function runJug(stage,m){
  var caps=[300,500,700];
  var water=[0,0,0];
  setMText('桌上有 <b>300、500、700 毫升</b> 三个空杯（没有刻度笔，不能直接量）。请通过<b>接水、倒水</b>，让某个杯子里恰好剩下 <b>'+
    m.target+' 毫升</b> 水！<br>点“水龙头”→点杯子＝接满；点杯子→点杯子＝倒入；点杯子→点“下水口”＝倒空。');
  var sel=null; // 当前选择：{kind:'tap'} / {kind:'drain'} / {kind:'cup',i}
  // 上排：水龙头与下水口
  var st=el('div','station-row');
  var tap=el('div','station','<span class="ico">🚰</span><br>水龙头<br><span style="font-size:16px;color:inherit;">接满一杯</span>');
  var drain=el('div','station','<span class="ico">🕳️</span><br>下水口<br><span style="font-size:16px;color:inherit;">倒空一杯</span>');
  st.appendChild(tap);st.appendChild(drain);
  stage.appendChild(st);
  // 下排：三个杯子（刻度标签隔行显示，避免拥挤）
  var cupRow=el('div','stage-row');
  var apis=[];
  caps.forEach(function(cap,i){
    var cup=buildCup({max:cap,width:112,height:200,tick:niceStep(cap),labelEvery:2});
    cup.wrap.style.padding='0 46px 0 4px'; // 右侧留出刻度文字空间
    var wrapEl=el('div','jcup-wrap');
    wrapEl.appendChild(cup.wrap);
    var cur=el('div','jcur','0 毫升');
    wrapEl.appendChild(cur);
    cupRow.appendChild(wrapEl);
    apis.push({cup:cup,cur:cur,wrap:wrapEl});
    wrapEl.addEventListener('click',function(){onCup(i);}); // 只在外层绑定，避免重复触发
  });
  stage.appendChild(cupRow);
  var goalLine=el('div','jgoal','🎯 目标：某个杯子里恰好剩下 '+m.target+' 毫升');
  stage.appendChild(goalLine);
  var hintEl=el('div','hint','先点一个“来源”（水龙头 / 某个杯子），再点目标杯子。');
  stage.appendChild(hintEl);
  tap.addEventListener('click',function(){
    if(S.done)return;
    sel={kind:'tap'};
    refresh('已选中水龙头：请点要接满的杯子');
  });
  drain.addEventListener('click',function(){
    if(S.done)return;
    sel={kind:'drain'};
    refresh('已选中下水口：请点要倒空的杯子');
  });
  function onCup(i){
    if(S.done)return;
    if(sel===null){
      sel={kind:'cup',i:i};
      refresh('已选中 '+caps[i]+' 毫升杯（现在 '+water[i]+' 毫升）：再点一个目标（杯子 / 下水口）');
      return;
    }
    if(sel.kind==='tap'){ // 水龙头接满
      if(water[i]===caps[i]){showToast('这个杯子已经接满啦');sel=null;refresh('已取消选择');return;}
      water[i]=caps[i];
      addStep();
      done('把 '+caps[i]+' 毫升杯接满了水');
    }else if(sel.kind==='drain'){ // 倒空
      if(water[i]===0){showToast('这个杯子本来就是空的哦');}
      else{water[i]=0;addStep();done('把 '+caps[i]+' 毫升杯倒空了');}
    }else if(sel.kind==='cup'){
      var j=sel.i;
      if(j===i){sel=null;refresh('已取消选择');return;}
      var space=caps[i]-water[i];
      if(space===0){showToast(caps[i]+' 毫升杯已经满啦，倒不进去');sel=null;refresh('已取消选择');return;}
      var move=Math.min(water[j],space);
      if(move===0){showToast(caps[j]+' 毫升杯是空的，没水可倒');sel=null;refresh('已取消选择');return;}
      water[j]-=move;water[i]+=move;
      addStep();
      done('把 '+caps[j]+' 毫升杯的水倒入 '+caps[i]+' 毫升杯（倒入 '+move+' 毫升）');
    }
  }
  function done(msg){
    sel=null;
    refresh(msg);
    // 检查目标：任何一杯恰好等于目标毫升数
    for(var k=0;k<3;k++){
      if(water[k]===m.target){
        missionSuccess('看！'+caps[k]+' 毫升杯里恰好剩下 <b>'+m.target+' 毫升</b> 水，量出来啦！');
        return;
      }
    }
  }
  function refresh(msg){
    for(var k=0;k<3;k++){
      apis[k].cup.set(water[k]);
      apis[k].cur.textContent=water[k]+' 毫升';
      var isSel=(sel&&sel.kind==='cup'&&sel.i===k);
      apis[k].cup.cup.classList.toggle('sel',isSel);
    }
    tap.classList.toggle('sel',!!(sel&&sel.kind==='tap'));
    drain.classList.toggle('sel',!!(sel&&sel.kind==='drain'));
    hintEl.textContent=msg||'先点一个“来源”（水龙头 / 某个杯子），再点目标杯子。';
  }
  refresh();
}

/* ---------------- 揭示答案文案 ---------------- */
function revealText(m){
  switch(m.type){
    case 'dropper':
      return '目标 '+m.target+' 毫升：点 <b>'+m.target+' 次</b>「挤出 1 毫升」就可以啦（每次正好 1 毫升）。'+
        '1毫升水在手心里只有十几滴，是不是很少？';
    case 'pour':
      return '1升=1000毫升。目标 '+m.target+' 毫升（'+labelFor(m.target)+'）。这局给的瓶子正好能凑成：<b>'+
        m.bottles.join(' + ')+' = '+m.target+'</b> 毫升，把它们一瓶一瓶都倒进去就行！';
    case 'scale':
      return labelFor(m.v)+' = <b>'+m.v+' 毫升</b>（1升=1000毫升，几百部分看毫升刻度）。把红把手拖到 <b>'+
        m.v+' 毫升</b> 的位置松手就过关！';
    case 'basket':
      var parts=m.items.map(function(it){
        var n=1000/it[0];
        var nm=it[0]>=1000?(it[0]/1000)+'升':it[0]+'毫升';
        return '用'+nm+'装凑满 1 升：'+it[1]+'×'+n+'='+(it[1]*n)+' 元';
      });
      return '都按 1升（1000毫升）来算：<br>'+parts.join('；<br>')+'。<br>最划算的是花 <b>'+m.min+
        ' 元</b> 的方案，照它装满 1000 毫升即可拿 3 颗星！';
    case 'ratio':
      var cnt=m.pool/m.perN;
      return m.pool+'÷'+m.perN+'=<b>'+cnt+'</b>（份），每份水配 '+m.dose+' 毫升原液，一共 '+cnt+'×'+m.dose+
        '=<b>'+(cnt*m.dose)+' 毫升</b>。点 <b>'+cnt+' 次</b>原液瓶就刚好达标！';
    case 'jug':
      return m.target===100
        ?'第1步：点水龙头，再点 300毫升杯 接满；第2步：把 300毫升杯 倒进 700毫升杯；'+
         '第3步：再接满 500毫升杯，往 700毫升杯 里倒到刚好满（700−300=400，还能装 400 毫升），'+
         '500毫升杯里就剩下 <b>500−400=100 毫升</b> 啦！'
        :'第1步：点水龙头，再点 500毫升杯 接满；第2步：把 500毫升杯 倒进 300毫升杯（倒到满为止），'+
         '500毫升杯里就剩下 <b>500−300=200 毫升</b> 啦！';
  }
  return '';
}

/* ---------------- 玩法说明（G6：进入弹出，可随时再看） ---------------- */
function showRules(){
  var html='<h2>🌈 彩虹水实验室 · 玩法说明</h2><div class="cnt">'+
    '<b>目标：</b>认识容量单位毫升（mL），记住 <b>1升=1000毫升</b>，会换算、会比较、会应用。<br>'+
    '<b>玩法：</b>选一个难度，每局共 <b>3 关</b>，每关都要<b>动手操作</b>（点击瓶子倒水、拖动刻度把手、点击滴管、接水倒水……）才能过关。<br>'+
    '<b>关卡种类：</b><br>'+
    '· 滴管小能手：每挤一次滴管是 1 毫升，量出目标毫升数；<br>'+
    '· 倒水凑一凑：把整瓶水倒进量杯，加法凑出目标容量；<br>'+
    '· 刻度调一调：把“几升几百毫升”换算成毫升，拖动水面到对应刻度；<br>'+
    '· 精明购物篮：买瓶子装满正好 1 升，还要花最少的钱；<br>'+
    '· 配比小专家：按“每几升水加一瓶盖原液”的比例，把大水池的原液加够；<br>'+
    '· 神奇倒水：用三个空杯接水、互相倒，量出指定毫升数。<br>'+
    '<b>小帮手：</b>右上角有用时和步数统计；「揭示答案」能看思路（星级会降低哦）；'+
    '「重新开始」重做本关；「返回难度选择」随时换难度。三关全过有彩纸庆祝！</div>'+
    '<div class="close-row"><button class="btn big" id="rClose">开始挑战！</button></div>';
  showModal(html);
  $('#rClose').addEventListener('click',closeModal);
}

/* ---------------- 启动 ---------------- */
screen=$('#screen');
$('#btnRules').addEventListener('click',showRules);
$('#btnHome').addEventListener('click',function(){stopTimer();showHome();showToast('已返回难度选择');});
applyPalette();
showHome();
if(!S.rulesShown){S.rulesShown=true;showRules();}
})();
</script>
