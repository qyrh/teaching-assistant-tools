<style>:root{--c1:#1976d2;--c2:#64b5f6;--bg:#e3f2fd;--liquid:#42a5f5}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0}body{font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;background:var(--bg);color:#222;font-size:17px;user-select:none;-webkit-user-select:none;min-height:100vh;touch-action:manipulation}#app{max-width:1060px;margin:0 auto;padding:12px 14px 30px}.hidden{display:none!important}header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(120deg,var(--c1),var(--c2));color:#fff;border-radius:16px;padding:10px 16px;box-shadow:0 4px 14px rgba(0,0,0,.15)}.logo{font-size:23px;font-weight:800;letter-spacing:1px}.hdr-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.hud{display:flex;gap:10px;font-size:18px;font-weight:700;background:rgba(255,255,255,.22);padding:6px 12px;border-radius:12px}.hdr-btns{display:flex;gap:8px}button{font-family:inherit}.btn{padding:9px 20px;font-size:18px;font-weight:700;border-radius:12px;cursor:pointer;border:3px solid #fff;background:rgba(255,255,255,.92);color:var(--c1)}.btn:active{transform:scale(.96)}.btn.big{font-size:21px;padding:12px 30px}.btn.warn{border-color:#ef6c00;color:#ef6c00}.home-head{text-align:center;margin:22px 0 6px}.home-head h1{color:var(--c1);font-size:32px;margin:8px 0 6px}.home-head p{font-size:19px;margin:4px 0;color:#444}.knowledge{margin:14px auto;max-width:760px;background:#fffbe6;border:3px dashed #f9a825;border-radius:14px;padding:10px 18px;font-size:20px;font-weight:700;text-align:center;color:#7a4f00}.diff-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:16px}.diff-card{background:#fff;border:4px solid var(--c1);border-radius:18px;padding:18px 18px 16px;cursor:pointer;transition:transform .18s,box-shadow .18s;box-shadow:0 3px 10px rgba(0,0,0,.08)}.diff-card:hover{transform:translateY(-5px);box-shadow:0 10px 20px }.beaker .inner{position:absolute;left:0;right:0;bottom:0;top:0;border-radius:0 0 15px 15px;overflow:hidden}.beaker .fill{position:absolute;left:0;right:0;bottom:0;height:0%;background:linear-gradient(180deg,var(--c2),var(--liquid));transition:height .38s ease}.beaker.dragging .fill{transition:none}.tick{position:absolute;right:0;width:16px;height:0;border-top:2px solid var(--c1);z-index:3}.tick.major{width:26px;border-top-width:3px}.tick-label{position:absolute;left:calc(100% + 32px);transform:translateY(-50%);font-size:16px;font-weight:700;color:#3a3a3a;white-space:nowrap;z-index:3}.target-line{position:absolute;left:0;right:0;border-top:4px dashed #e53935;z-index:4}.target-tag{position:absolute;left:6px;transform:translateY(-100%);background:#e53935;color:#fff;font-size:16px;font-weight:700;padding:2px 9px;border-radius:9px;z-index:5;white-space:nowrap}.handle{position:absolute;left:-18px;right:-18px;height:20px;border-radius:10px;background:var(--c2);border:3px solid var(--c1);transform:translateY(-50%);cursor:grab;z-index:6;touch-action:none}.handle .hbubble{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);background:var(--c1);color:#fff;font-size:18px;font-weight:800;padding:3px 12px;border-radius:11px;white-space:nowrap}.cup-cap{font-size:18px;font-weight:800;color:var(--c1);text-align:center;margin-top:8px}.bottle{width:88px;text-align:center;cursor:pointer;transition:transform .22s}.bottle .b-neck{width:28px;height:15px;border:4px solid var(--c1);border-bottom:none;margin:0 auto;border-radius:6px 6px 0 0;background:rgba(255,255,255,.7)}.bottle .b-body{height:86px;border:4px solid var(--c1);border-radius:10px 10px 16px 16px;position:relative;overflow:hidden;background:rgba(255,255,255,.75)}.bottle .b-fill{position:absolute;left:0;right:0;bottom:0;height:84%;background:linear-gradient(180deg,var(--c2),var(--liquid))}.bottle .b-cap{font-size:19px;font-weight:800;color:var(--c1);margin-top:6px}.bottle .b-sub{font-size:16px;color:#666;margin-top:2px}.bottle.used{opacity:.32;pointer-events:none}.bottle.pouring{transform:translateY(-10px) rotate(-14deg)}.bottle:active{transform:translateY(-4px)}.tray{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;align-items:flex-end;min-height:130px}.op-btns{display:flex;flex-direction:column;gap:14px}.op-btn{display:flex;flex-direction:column;align-items:center;gap:6px;width:170px;border:4px solid var(--c1);border-radius:16px;background:#fff;padding:12px 10px;cursor:pointer;font-size:19px;font-weight:800;color:var(--c1);transition:transform .15s}.op-btn:active{transform:scale(.95)}.op-btn .ico{font-size:30px;line-height:1}.op-btn .desc{font-size:16px;color:#777;font-weight:600}.op-btn.disabled{opacity:.4;pointer-events:none}.shelf{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:stretch}.shelf-item{width:172px;border:4px solid var(--c2);border-radius:16px;background:#fff;padding:10px 8px;text-align:center;cursor:pointer;transition:transform .15s;position:relative}.shelf-item:active{transform:scale(.95)}.shelf-item .s-name{font-size:18px;font-weight:800;color:var(--c1);margin-top:4px}.shelf-item .s-price{font-size:17px;color:#7a4f00;font-weight:700;margin-top:2px}.shelf-item .s-count{position:absolute;top:-12px;right:-10px;background:#e53935;color:#fff;font-size:16px;font-weight:800;border-radius:999px;padding:2px 10px;border:2px solid #fff}.pool-box{width:100%;max-width:640px}.pool-title{font-size:19px;font-weight:800;color:#3a3a3a;text-align:center;margin-bottom:8px}.pool{display:flex;border:4px solid var(--c1);border-radius:14px;overflow:hidden;height:62px;background:rgba(255,255,255,.6)}.seg{flex:1;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#555;border-right:2px solid var(--c1)}.seg:last-child{border-right:none}.seg.on{background:linear-gradient(180deg,var(--c2),var(--liquid));color:#fff}.station-row{display:flex;gap:26px;align-items:flex-end;justify-content:center;flex-wrap:wrap}.station{width:132px;text-align:center;cursor:pointer;border:4px solid var(--c1);border-radius:16px;background:#fff;padding:10px 6px;font-size:18px;font-weight:800;color:var(--c1)}.station .ico{font-size:30px;line-height:1.2}.station.sel{background:var(--c1);color:#fff}.jcup-wrap{display:flex;flex-direction:column;align-items:center}.jcup{position:relative;border:5px solid var(--c1);border-radius:0 0 18px 18px;background:rgba(255,255,255,.55);cursor:pointer;margin-top:34px}.jcup.sel{box-shadow:0 0 0 6px var(--c2)}.jcur{font-size:19px;font-weight:800;color:var(--c1);margin-top:8px}.jgoal{font-size:17px;color:#e53935;font-weight:700;text-align:center}.modal{position:fixed;inset:0;background:rgba(20,40,60,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.modal-box{background:#fff;border-radius:18px;border-top:14px solid var(--c1);padding:20px 24px;max-width:660px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.3)}.modal-box h2{color:var(--c1);font-size:25px;margin:4px 0 12px}.modal-box .cnt{font-size:19px;line-height:1.85;color:#333}.modal-box .cnt b{color:var(--c1)}.modal-box .close-row{text-align:center;margin-top:16px}.ok-face{font-size:52px;text-align:center}.stars-big{font-size:40px;color:#f9a825;text-align:center;letter-spacing:6px;margin:6px 0}#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);background:rgba(25,45,70,.88);color:#fff;padding:10px 22px;border-radius:14px;font-size:19px;font-weight:700;opacity:0;transition:opacity .25s,transform .25s;z-index:70;pointer-events:none;max-width:88vw;text-align:center}#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}#confettiBox{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}.conf-piece{position:absolute;top:-32px;display:block;border-radius:3px;animation:confFall linear forwards}@keyframes confFall{to{transform:translate3d(var(--dx),115vh,0) rotate(720deg);opacity:.85}}@media(max-width:640 <script>(function(){"use strict";function $(s){return document.querySelector(s)}function el(tag,cls,html){var d=document.createElement(tag);if(cls)d.className=cls;if(html!==void 0)d.innerHTML=html;return d}function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}function fmtTime(sec){var m=Math.floor(sec/60),s=sec%60;var mm=m<10?"0"+m:""+m,ss=s<10?"0"+s:""+s;return mm+":"+ss}function labelFor(v){if(v%1e3===0)return v/1e3+"升";var l=Math.floor(v/1e3),r=v%1e3;return(l>0?l+"升":"")+r+"毫升"}function niceStep(max){var steps=[10,20,25,50,100,200,250,500,1e3];for(var i=0;i<steps.length;i++){if(max%steps[i]===0&&max/steps[i]<=12)return steps[i]}return max}var PALETTES=[{name:"海洋蓝",c1:"#1565c0",c2:"#64b5f6",bg:"#e3f2fd",liquid:"#42a5f5"},{name:"草地绿",c1:"#2e7d32",c2:"#81c784",bg:"#e8f5e9",liquid:"#66bb6a"},{name:"蜜橙橙",c1:"#e65100",c2:"#ffb74d",bg:"#fff3e0",liquid:"#ffa726"},{name:"葡萄紫",c1:"#6a1b9a",c2:"#ba68c8",bg:"#f3e5f5",liquid:"#ab47bc"},{name:"樱桃红",c1:"#b71c1c",c2:"#ef9a9a",bg:"#ffebee",liquid:"#ef5350"},{name:"湖水青",c1:"#00695c",c2:"#4db6ac",bg:"#e0f2f1",liquid:"#26a69a"}];function applyPalette(){var p=pick(PALETTES);var r=document.documentElement.style;r.setProperty("--c1",p.c1);r.setProperty("--c2",p.c2);r.setProperty("--bg",p.bg);r.setProperty("--liquid",p.liquid)}var S={diff:null,missions:[],mi:0,steps:0,elapsed:0,timer:null,stars:[],revealUsed:false,overflows:0,done:false,rulesShown:false,toastT:null};var screen;function startTimer(){S.elapsed=0;updHud();clearInterval(S.timer);S.timer=setInterval(function(){S.elapsed++;updHud()},1e3)}function stopTimer(){clearInterval(S.timer)}function updHud(){$("#hudTime").textContent="⏱ 用时 "+fmtTime(S.elapsed);$("#hudSteps").textContent="👣 步数 "+S.steps}function addStep(){S.steps++;updHud()}function showModal(html){$("#modalBox").innerHTML=html;$("#modal").classList.remove("hidden")}function closeModal(){$("#modal").classList.add("hidden")}$("#modal").addEventListener("click",function(e){if(e.target===this)closeModal()});function showToast(msg){var t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(S.toastT);S.toastT=setTimeout(function(){t.classList.remove("show")},2400)}function celebrate(){var box=$("#confettiBox");box.innerHTML="";var p=palette();var colors=[p.c1,p.c2,p.liquid,"#f9a825","#e53935","#43a047"];for(var i=0;i<80;i++){var piece=document.createElement("i");piece.className="conf-piece";var w=8+Math.random()*9,h=10+Math.random()*10;piece.style.left=Math.random()*100+"vw";piece.style.width=w+"px";piece.style.height=h+"px";piece.style.background=colors[Math.floor(Math.random()*colors.length)];piece.style.setProperty("--dx",Math.random()*160-80+"px");piece.style.animationDuration=2.6+Math.random()*2.2+"s";piece.style.animationDelay=Math.random()*.9+"s";box.appendChild(piece)}setTimeout(function(){box.innerHTML=""},6e3)}function palette(){var c1=getComputedStyle(document.documentElement).getPropertyValue("--c1").trim();var c2=getComputedStyle(document.documentElement).getPropertyValue("--c2").trim();var lq=getComputedStyle(document.documentElement).getPropertyValue("--liquid").trim();return{c1,c2,liquid:lq}}function buildCup(o){var wrap=el("div","cup-wrap");var cup=el("div","beaker");cup.style.width=o.width+"px";cup.style.height=o.height+"px";var inner=el("div","inner");var fill=el("div","fill");inner.appendChild(fill);cup.appendChild(inner);var step=o.tick||niceStep(o.max);var n=Math.floor(o.max/step);var le=o.labelEvery||Math.max(1,Math.ceil(n/6));for(var i=0;i<=n;i++){var v=i*step;var y=(1-v/o.max)*100;var t=el("div","tick");t.style.top=y+"%";if(i%le===0||i===n){t.classList.add("major");var lab=el("div","tick-label");lab.style.top=y+"%";var txt=String(v);if(o.dual&&v>0&&v%1e3===0){txt=v+"（"+v/1e3+"升）"}lab.textContent=txt;cup.appendChild(lab)}cup.appendChild(t)}wrap.appendChild(cup);if(o.cap){wrap.appendChild(el("div","cu
