<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>周长探秘园——长方形和正方形互动工坊</title>
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}body{font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}.hidden{display:none!important}#menuScreen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:linear-gradient(135deg,#FFF7ED,#E0F2FE 55%,#FCE7F3);padding:22px;overflow:auto}#menuTitle{font-size:46px;font-weight:900;color:#1E293B;letter-spacing:3px;text-align:center}#menuSub{font-size:19px;color:#475569;text-align:center;line-height:1.7;margin-top:10px}.cards{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}.dcard{width:262px;border-radius:20px;padding:24px 20px;color:#fff;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.16);transition:transform .15s;border:none;text-align:left}.dcard:hover{transform:translateY(-6px)}.dcard h3{font-size:23px;margin-bottom:10px}.dcard p{font-size:15.5px;line-height:1.65;opacity:.96}.dcard .stars{font-size:21px;margin-top:12px;letter-spacing:4px;color:#FDE68A}.dcard.easy{background:linear-gradient(135deg,#F59E0B,#EA580C)}.dcard.mid{background:linear-gradient(135deg,#0EA5E9,#2563EB)}.dcard.hard{background:linear-gradient(135deg,#7C3AED,#DB2777)}#menuNote{font-size:14.5px;color:#64748B}#gameScreen{position:fixed;inset:0;display:flex;flex-direction:column}#topBar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--primary);color:#fff;flex-wrap:wrap;gap:4px 12px}#gameTitle{font-size:20px;font-weight:800}#hud{display:flex;gap:16px;font-size:17px;align-items:center}#hud b{font-variant-numeric:tabular-nums;font-size:19px}#questBar{background:var(--panel);padding:9px 18px;border-bottom:3px solid var(--primary)}#levelTag{font-size:15px;font-weight:700;color:var(--primary);margin-bottom:3px}#questText{font-size:17.5px;line-height:1.55;font-weight:600}#tipBar{margin-top:6px;font-size:16px;font-weight:700;color:var(--primary)}#canvasWrap{flex:1;min-height:300px;position:relative;background:var(--bg)}#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}#actionBtns{display:flex;gap:12px;justify-content:center;padding:9px 10px 2px;flex-wrap:wrap;min-height:50px;align-items:center}.abtn{font-size:17px;font-weight:700;padding:10px 20px;border-radius:14px;border:none;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.22)}.abtn:disabled{background:#CBD5E1;color:#64748B;cursor:not-allowed;box-shadow:none}#bottomBar{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 10px 10px;flex-wrap:wrap;background:var(--panel)}.btnRow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.gbtn{font-size:16.5px;font-weight:700;padding:9px 16px;border-radius:12px;border:2.5px solid var(--primary);background:#fff;color:var(--primary);cursor:pointer}#progressDots{display:flex;gap:9px;align-items:center;justify-content:center}.dot{width:15px;height:15px;border-radius:50%;background:#CBD5E1;display:inline-block}.dot.cur{background:var(--primary);box-shadow:0 0 0 4px rgba(0,0,0,.08)}.dot.passed{background:var(--accent)}#modalMask,#doneMask{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:40;padding:18px}.card{background:#fff;border-radius:22px;max-width:660px;width:100%;max-height:86vh;overflow:auto;padding:26px 30px;box-shadow:0 20px 60px rgba(0,0,0,.3);border-top:10px solid var(--primary)}.card h2{font-size:26px;margin-bottom:14px;color:var(--ink)}.card .body{font-size:17px;line-height:1.8}.card .body ul{padding-left:22px;margin:8px 0}.card .body li{margin:5px 0}.mbtns{display:flex;gap:14px;justify-content:center;margin-top:20px;flex-wrap:wrap}.mbtn{font-size:18px;font-weight:800;padding:12px 26px;border-radius:14px;border:none;background:var(--primary);color:#fff;cursor:pointer}.mbtn.alt{background:#fff;color:var(--primary);border:2.5px solid var(--primary)}#doneStars{font-size:40px;text-align:center;color:#F59E0B;letter-spacing:10px;margin-bottom:4px}#fxCv{position:fixed;inset:0;z-index:60;pointer-events:none}@media(max-width:720px){#menuTitle{font-size:32px}.dcard{width:88%}#questText{font-size:16px}#gameTitle{font-size:17px}.abtn{font-size:15.5px;padding:9px 14px}.gbtn{font-size:15px;padding:8px 12px}}
</style>
</head>
<body>

<!-- ============ 难度选择（主菜单）：三档难度 ============ -->
<div id="menuScreen">
  <div>
    <h1 id="menuTitle">周长探秘园</h1>
    <p id="menuSub">三年级上册 · 长方形和正方形 · 单元提升互动工坊<br>剪一剪、围一围、拖一拖——玩着玩着就懂了周长！</p>
  </div>
  <div class="cards">
    <button class="dcard easy" data-diff="easy">
      <h3>初级 · 见习小工匠</h3>
      <p>3个小关卡：剪纸量周长、铁丝围正方形、拼图比周长。例题起步，动手感受"周长就是一周边线的长"。</p>
      <div class="stars">★</div>
    </button>
    <button class="dcard mid" data-diff="mid">
      <h3>中级 · 熟练小工匠</h3>
      <p>4个关卡：三种剪法全探索、栅栏规划院、平移变身屋、铁丝围长方形。画图法与平移法大显身手！</p>
      <div class="stars">★ ★</div>
    </button>
    <button class="dcard hard" data-diff="hard">
      <h3>高级 · 首席大工匠</h3>
      <p>4个关卡：剪出正方形、靠墙省篱笆、大图形平移、接头铁丝（数形结合）。综合变式，挑战满分！</p>
      <div class="stars">★ ★ ★</div>
    </button>
  </div>
  <p id="menuNote">每局配色随机 · 支持触屏拖拽 · 适合课堂投影</p>
</div>

<!-- ============ 游戏主屏 ============ -->
<div id="gameScreen" class="hidden">
  <header id="topBar">
    <div id="gameTitle">周长探秘园</div>
    <div id="hud">
      <span>时间 <b id="timerVal">00:00</b></span>
      <span>步数 <b id="stepVal">0</b></span>
    </div>
  </header>
  <div id="questBar">
    <div id="levelTag"></div>
    <div id="questText"></div>
    <div id="tipBar"></div>
  </div>
  <div id="canvasWrap">
    <canvas id="cv"></canvas>
  </div>
  <div id="actionBtns"></div>
  <div id="bottomBar">
    <div class="btnRow">
      <button class="gbtn" id="btnRules">玩法说明</button>
      <button class="gbtn" id="btnReveal">揭示答案</button>
      <button class="gbtn" id="btnRestart">重新开始</button>
      <button class="gbtn" id="btnMenu">返回选难度</button>
    </div>
    <div id="progressDots"></div>
  </div>
</div>

<!-- ============ 通用弹窗 ============ -->
<div id="modalMask" class="hidden">
  <div class="card">
    <h2 id="modalTitle"></h2>
    <div class="body" id="modalBody"></div>
    <div class="mbtns"><button class="mbtn" id="modalBtn">知道了</button></div>
  </div>
</div>

<!-- ============ 关卡完成弹窗 ============ -->
<div id="doneMask" class="hidden">
  <div class="card">
    <div id="doneStars">★ ★ ★</div>
    <h2 id="doneTitle" style="text-align:center"></h2>
    <div class="body" id="doneBody"></div>
    <div class="mbtns" id="doneBtns"></div>
  </div>
</div>

<canvas id="fxCv"></canvas>

<script>"use strict";const $=id=>document.getElementById(id);const pick=arr=>arr[Math.floor(Math.random()*arr.length)];const clampN=(v,a,b)=>Math.max(a,Math.min(b,v));const fmt=n=>{const r=Math.round(n*10)/10;return r%1===0?String(r):r.toFixed(1)};const fmtTime=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");function distSeg(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,L2=dx*dx+dy*dy;let u=L2?((px-x1)*dx+(py-y1)*dy)/L2:0;u=clampN(u,0,1);return Math.hypot(px-(x1+u*dx),py-(y1+u*dy))}function rr(ctx2,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx2.beginPath();ctx2.moveTo(x+r,y);ctx2.arcTo(x+w,y,x+w,y+h,r);ctx2.arcTo(x+w,y+h,x,y+h,r);ctx2.arcTo(x,y+h,x,y,r);ctx2.arcTo(x,y,x+w,y,r);ctx2.closePath()}function text(ctx2,str,x,y,opt){opt=opt||{};ctx2.font=(opt.bold===false?"":"bold ")+(opt.size||18)+'px "Microsoft YaHei",sans-serif';ctx2.fillStyle=opt.color||"#1F2937";ctx2.textAlign=opt.align||"center";ctx2.textBaseline=opt.base||"alphabetic";ctx2.fillText(str,x,y)}function vtext(ctx2,str,x,y,opt){ctx2.save();ctx2.translate(x,y);ctx2.rotate(-Math.PI/2);text(ctx2,str,0,0,opt);ctx2.restore()}function drawPill(ctx2,txt,x,y,bg,fg,size){size=size||17;ctx2.font="bold "+size+'px "Microsoft YaHei",sans-serif';const w=ctx2.measureText(txt).width+22,h=size+15;rr(ctx2,x-w/2,y-h/2,w,h,h/2);ctx2.fillStyle=bg;ctx2.fill();ctx2.fillStyle=fg;ctx2.textAlign="center";ctx2.textBaseline="middle";ctx2.fillText(txt,x,y+1);ctx2.textBaseline="alphabetic"}function drawFenceSeg(ctx2,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy);if(len<2)return;const ux=dx/len,uy=dy/len,px=-uy,py=ux;ctx2.strokeStyle="#92400E";ctx2.lineWidth=5;[-3.5,3.5].forEach(function(off){ctx2.beginPath();ctx2.moveTo(x1+px*off,y1+py*off);ctx2.lineTo(x2+px*off,y2+py*off);ctx2.stroke()});const nPost=Math.max(2,Math.round(len/26));ctx2.fillStyle="#78350F";for(let i=0;i<=nPost;i++){const t=i/nPost,cx=x1+dx*t,cy=y1+dy*t;ctx2.save();ctx2.translate(cx,cy);ctx2.rotate(Math.atan2(dy,dx));ctx2.fillRect(-3,-9.5,6,19);ctx2.restore()}}function drawBrick(ctx2,x,y,w,h){ctx2.fillStyle="#9CA3AF";ctx2.fillRect(x,y,w,h);ctx2.strokeStyle="#6B7280";ctx2.lineWidth=1.5;const step=13;if(w>=h){for(let yy=y+step;yy<y+h;yy+=step){ctx2.beginPath();ctx2.moveTo(x,yy);ctx2.lineTo(x+w,yy);ctx2.stroke()}for(let yy=y,i=0;yy<y+h;yy+=step,i++){for(let xx=x+(i%2?16:6);xx<x+w;xx+=24){ctx2.beginPath();ctx2.moveTo(xx,yy);ctx2.lineTo(xx,Math.min(yy+step,y+h));ctx2.stroke()}}}else{for(let xx=x+step;xx<x+w;xx+=step){ctx2.beginPath();ctx2.moveTo(xx,y);ctx2.lineTo(xx,y+h);ctx2.stroke()}for(let xx=x,i=0;xx<x+w;xx+=step,i++){for(let yy=y+(i%2?16:6);yy<y+h;yy+=24){ctx2.beginPath();ctx2.moveTo(xx,yy);ctx2.lineTo(Math.min(xx+step,x+w),yy);ctx2.stroke()}}}ctx2.strokeStyle="#4B5563";ctx2.lineWidth=2.5;ctx2.strokeRect(x,y,w,h)}const PALETTES=[{name:"阳光橙",primary:"#EA580C",accent:"#0D9488",bg:"#FFF7ED",panel:"#FFEDD5",ink:"#1F2937"},{name:"海洋蓝",primary:"#2563EB",accent:"#D97706",bg:"#EFF6FF",panel:"#DBEAFE",ink:"#1E3A8A"},{name:"草地绿",primary:"#16A34A",accent:"#DB2777",bg:"#F0FDF4",panel:"#DCFCE7",ink:"#14532D"},{name:"葡萄紫",primary:"#7C3AED",accent:"#EA580C",bg:"#F5F3FF",panel:"#EDE9FE",ink:"#3B0764"},{name:"樱花粉",primary:"#DB2777",accent:"#0D9488",bg:"#FDF2F8",panel:"#FCE7F3",ink:"#831843"},{name:"天空青",primary:"#0891B2",accent:"#CA8A04",bg:"#ECFEFF",panel:"#CFFAFE",ink:"#164E63"}];const G={screen:"menu",diff:null,palette:PALETTES[0],defs:[],li:0,level:null,steps:0,seconds:0,timerId:null,finishing:false};class Tracer{constructor(lens,unit){this.lens=lens;this.unit=unit;this.lit=[false,false,false,false];this.path=[];this.bug=0}frontier(){const inc=[[0,3],[0,1],[1,2],[2,3]][this.bug];return inc.filter(e=>!this.lit[e])}near(px,py,r){const segs=[[r.x,r.y,r.x+r.w,r.y],[r.x+r.w,r.y,r.x+r.w,r.y+r.h],[r.x+r.w,r.y+r.h,r.x,r.y+r.h],[r.x,r.y+r.h,r.x,r.y]];let best=-1,bd=20;segs.forEach(function(s,i){const d=distSeg(px,py,s[0],s[1],s[2],s[3]);if(d<bd){bd=d;best=i}});return best}tryLight(px,py,r){const e=this.near(px,py,r);if(e<0)
