<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>周期探险岛 · 推理思维训练（三年级）</title>
<style>:root{--pri:#f97316;--deep:#c2410c;--pbg:#fff7ed;--psoft:#ffedd5;--ink:#263238;--card:#ffffff;--gold:#f59e0b;--ok:#16a34a;--bad:#dc2626}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0}body{font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;background:linear-gradient(160deg,var(--pbg) 0%,#ffffff 60%,var(--psoft) 100%);color:var(--ink);min-height:100vh;font-size:18px}#app{max-width:1080px;margin:0 auto;padding:10px 12px 40px}.hidden{display:none!important}button{font-family:inherit}#topbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--card);border:3px solid var(--pri);border-radius:18px;padding:10px 14px;box-shadow:0 4px 0 var(--deep)}.brand{font-size:26px;font-weight:900;color:var(--deep);letter-spacing:2px}.brand small{font-size:15px;color:var(--ink);font-weight:700;margin-left:6px;letter-spacing:0}#themeChip{font-size:15px;background:var(--psoft);border:2px solid var(--pri);color:var(--deep);border-radius:999px;padding:3px 12px;font-weight:700}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}.stat{background:var(--psoft);border:2px solid var(--pri);border-radius:12px;padding:4px 12px;font-size:17px;font-weight:800;color:var(--deep)}.btns{display:flex;gap:8px;flex-wrap:wrap;width:100%}.btn{border:none;border-radius:12px;padding:9px 16px;font-size:17px;font-weight:800;cursor:pointer;background:var(--psoft);color:var(--deep);border:2px solid var(--pri)}.btn:active{transform:translateY(2px)}.btn.main{background:var(--pri);color:#fff;border-color:var(--deep);box-shadow:0 4px 0 var(--deep);font-size:19px;padding:12px 26px}.btn.main:active{box-shadow:0 1px 0 var(--deep);transform:translateY(3px)}.btn.main:disabled{background:#bbb;border-color:#888;box-shadow:0 4px 0 #888;cursor:not-allowed}.btn.ghost{background:#fff}#scr-select{padding-top:18px}.sel-title{text-align:center;font-size:34px;font-weight:900;color:var(--deep);margin:16px 0 6px}.sel-sub{text-align:center;font-size:18px;color:var(--ink);margin-bottom:20px}.sel-cards{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}.sel-card{width:280px;background:var(--card);border:4px solid var(--pri);border-radius:20px;padding:20px 18px;cursor:pointer;text-align:center;box-shadow:0 6px 0 var(--deep);transition:transform .12s}.sel-card:hover{transform:translateY(-4px)}.sel-card h3{margin:0 0 8px;font-size:26px;color:var(--deep)}.sel-card .lv{font-size:15px;background:var(--psoft);border-radius:999px;display:inline-block;padding:3px 14px;font-weight:800;color:var(--pri);margin-bottom:10px}.sel-card p{margin:6px 0;font-size:16px;line-height:1.6}#qcard{margin:14px 0;background:var(--card);border:3px solid var(--pri);border-radius:16px;padding:12px 16px;box-shadow:0 3px 0 var(--deep)}.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}.qbadge{background:var(--pri);color:#fff;font-weight:900;border-radius:10px;padding:4px 12px;font-size:17px}.qask{background:var(--psoft);border:2px dashed var(--pri);color:var(--deep);border-radius:10px;padding:3px 12px;font-size:18px;font-weight:800}.qstem{font-size:20px;line-height:1.7;font-weight:700}.hintbox{margin-top:10px;background:#fffbe8;border:2px solid var(--gold);border-radius:12px;padding:8px 12px;font-size:17px;line-height:1.7;color:#7a5200}.hintbox b{color:#8a5a00}#stage-card{background:var(--card);border:3px solid var(--pri);border-radius:16px;padding:14px;box-shadow:0 3px 0 var(--deep)}.zone-label{font-size:17px;font-weight:800;color:var(--deep);margin:6px 0 4px}#strip-scroll{overflow-x:auto;overflow-y:hidden;background:var(--psoft);border:2px solid var(--pri);border-radius:14px;touch-action:pan-x pan-y}#strip-inner{position:relative;width:max-content;padding:38px 16px 42px;min-height:120px}#strip{display:flex;gap:12px;flex-wrap:nowrap}.swrap{position:relative;display:flex;flex-direction:column;align-items:center}.anchlab{position:absolute;top:calc(100% + 3px);left:50%;transform:translateX(-50%);font-size:16px;font-weight:800;color:var(--deep);background:#fff;border:2px solid var(--pri);border-radius:8px;padding:1px 6px;white-space:nowrap;z-index:4}.tok{display:inline-flex;align-items:center;justify-content:center;width:54px;height:54px;font-size:26px;font-weight:900;user-select:none;border:3px solid rgba(0,0,0,.25);flex:none}.t-circle{border-radius:50%;box-shadow:inset -4px -6px 10px rgba(0,0,0,.18),0 0 8px rgba(0,0,0,.12)}.t-card{border-radius:10px}.t-coin{border-radius:50%;border:3px dashed rgba(0,0,0,.35)}.glyph{border:none;width:54px;height:54px;line-height:54px;text-align:center;font-size:32px}.g-b{color:#37474f;text-shadow:0 1px 0 #fff}.g-w{color:#fdfdfd;text-shadow:0 0 2px #333,0 0 3px #333,0 0 2px #333,-1px 0 0 #333,1px 0 0 #333,0 -1px 0 #333,0 1px 0 #333}.gmark{position:absolute;border-top:4px solid var(--pri);border-left:4px solid var(--pri);border-right:4px solid var(--pri);border-radius:10px 10px 0 0;pointer-events:none;opacity:0;transition:opacity .4s}.gmark.show{opacity:1}.gmark .glab{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:var(--pri);color:#fff;font-size:16px;font-weight:900;border-radius:8px;padding:1px 8px;white-space:nowrap}.gmark.gpart{border-color:#aaa}.gmark.gpart .glab{background:#999}#frame{position:absolute;border:4px dashed var(--gold);border-radius:14px;pointer-events:none;background:rgba(245,158,11,.10);z-index:5}#frame.ok{border-color:#16a34a;background:rgba(22,163,74,.16);box-shadow:0 0 14px rgba(22,163,74,.45)}#frame.lock{border-style:solid;border-color:var(--gold);background:rgba(245,158,11,.18);animation:pulse 1s ease 2}@keyframes pulse{50%{box-shadow:0 0 22px var(--gold)}}#fhandle{position:absolute;right:-16px;top:50%;transform:translateY(-50%);width:32px;height:52px;background:var(--gold);border:3px solid #b45309;border-radius:10px;color:#fff;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:ew-resize;pointer-events:auto;touch-action:none;z-index:6;writing-mode:vertical-lr;letter-spacing:2px}#fhandle:active{background:#d97706}#toolbar{margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}#toolmsg{font-size:18px;font-weight:800;color:var(--deep);flex:1;min-width:220px}.shake{animation:shake .4s}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}#answer-zone{margin-top:14px;border-top:3px dashed var(--pri);padding-top:12px}.az-title{font-size:20px;font-weight:900;color:var(--deep);margin-bottom:10px;line-height:1.6}.grow{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;margin:8px 0 14px}.gwrap{display:flex;flex-direction:column;align-items:center;gap:4px}.gwrap .tok{width:62px;height:62px;font-size:28px;cursor:pointer}.gwrap .tok.hl{outline:5px solid var(--gold);outline-offset:2px}.slotlab{font-size:16px;font-weight:800;color:#555}.tray{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:8px 0}.traytip{font-size:16px;color:#777;font-weight:700}.explorer{width:52px;height:52px;border-radius:50%;background:var(--pri);color:#fff;border:4px solid #fff;box-shadow:0 0 0 3px var(--deep),0 4px 8px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;cursor:grab;touch-action:none;user-select:none}.flagchip{min-width:52px;height:52px;border-radius:10px 10px 10px 0;background:var(--pri);color:#fff;border:4px solid #fff;box-shadow:0 0 0 3px var(--deep),0 4px 8px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;cursor:grab;touch-action:none;user-select:none}.star{width:44px;height:44px;font-size:30px;color:var(--gold);text-shadow:0 0 3px #b45309;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;user-select:none}.ruler{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px;align-items:flex-end}.rchip{min-width:46px;height:46px;border:3px solid var(--pri);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;color:var(--deep);cursor:pointer}.rchip.flagged{background:var(--pri);color:#fff;transform:scale(1.12);box-shadow:0 0 0 3px var(--gold)}.rchip.truth{outline:4px solid var(--ok);outline-offset:2px;animation:pulse 1s ease 3}.rulertitle{font-size:17px;font-weight:800;color:var(--deep);width:100%}.starstick{position:absolute;top:-10px;right:-10px;font-size:24px;color:var(--gold);text-shadow:0 0 3px #b45309;pointer-events:none}.badge{position:absolute;top:-12px;right:-12px;background:var(--pri);color:#fff;font-size:15px;font-weight:900;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;pointer-events:none}.tok.litup{box-shadow:0 0 16px 4px var(--gold)}#jarzone{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:10px 0}.jar{width:130px;height:110px;border:4px solid var(--deep);border-radius:14px 14px 22px 22px;background:linear-gradient(#fff,var(--psoft));position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}.jar .jlab{font-size:17px;font-weight:900;color:var(--deep)}.jar .jval{font-size:30px;font-weight:900;color:var(--pri)}.jar .jcoin{position:absolute;font-size:20px;color:#b45309}#eq-panel{margin-top:14px;background:#fffbe8;border:3px solid var(--gold);border-radius:14px;padding:12px 16px}.eq-line{font-size:22px;font-weight:900;color:#8a5a00;line-height:1.8}.eq-line.big{font-size:26px;color:var(--ok)}#verify-stage{margin-top:14px;border-top:3px dashed var(--pri);padding-top:12px}.vline{font-size:22px;font-weight:900;color:var(--deep);line-height:1.8}.vmsg-ok{font-size:24px;font-weight:900;color:var(--ok)}.vmsg-bad{font-size:20px;font-weight:900;color:var(--bad);line-height:1.7}.vgroup{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}.vgtok{position:relative;display:flex;flex-direction:column;align-items:center}.vgtok .tok{width:56px;height:56px}.vgtok.on .tok{outline:5px solid var(--ok);outline-offset:2px}.center{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:12px}#modal-mask{position:fixed;inset:0;background:rgba(38,50,56,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}#modal{background:#fff;border:4px solid var(--pri);border-radius:18px;max-width:640px;width:100%;max-height:84vh;overflow-y:auto;padding:20px 22px;box-shadow:0 8px 0 var(--deep)}#modal h2{margin:0 0 10px;color:var(--deep);font-size:26px}#modal .mbody{font-size:18px;line-height:1.9;white-space:pre-line}#modal .mrow{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center}#scr-final{padding-top:20px;text-align:center}.fin-title{font-size:32px;font-weight:900;color:var(--deep);margin:14px 0}.fin-list{display:flex;flex-direction:column;gap:10px;max-width:560px;margin:0 auto 16px}.fin-item{background:var(--card);border:3px solid var(--pri);border-radius:12px;padding:10px 14px;font-size:18px;font-weight:800;display:flex;gap:10px;align-items:center;text-align:left}.fin-star{color:var(--gold);font-size:24px}.drag-ghost{position:fixed;z-index:99;pointer-events:none;opacity:.92;transform:scale(1.1)}#fx{position:fixed;inset:0;pointer-events:none;z-index:80}@media(max-width:640px){.brand{font-size:21px}.qstem{font-size:18px}.tok{width:44px;height:44px;font-size:21px}.glyph{width:44px;height:44px;line-height:44px;font-size:26px}.gwrap .tok{width:52px;height:52px;font-size:24px}.eq-line{font-size:19px}.eq-line.big{font-size:22px}.vline{font-size:19px}}
</style>
</head>
<body>
<div id="app">
  <!-- 顶栏：标题、计时器、操作数、功能按钮 -->
  <header id="topbar">
    <div class="brand">周期探险岛<small>推理思维训练 · 三年级</small></div>
    <span id="themeChip">本局主题：阳光橙</span>
    <div class="stats">
      <div class="stat" id="statTimer">时间 00:00</div>
      <div class="stat" id="statSteps">操作 0</div>
      <div class="stat" id="statProg">第 0/0 关</div>
    </div>
    <div class="btns">
      <button class="btn" id="btnRules">规则玩法</button>
      <button class="btn" id="btnReveal">揭示答案</button>
      <button class="btn" id="btnRestart">重新开始</button>
      <button class="btn" id="btnBack">返回难度选择</button>
    </div>
  </header>

  <main>
    <!-- 难度选择屏 -->
    <section id="scr-select">
      <div class="sel-title">周期探险岛</div>
      <div class="sel-sub">拖金框 · 定周期 · 用余数推理闯关！先选择挑战难度吧～</div>
      <div class="sel-cards">
        <div class="sel-card" data-tier="0">
          <h3>初级 · 热身小道</h3>
          <div class="lv">例题级</div>
          <p>周期不超过 5，彩色灯泡、图形和数字排队等你来发现规律，找出第 N 个是什么。</p>
        </div>
        <div class="sel-card" data-tier="1">
          <h3>中级 · 智慧山丘</h3>
          <div class="lv">练习级</div>
          <p>周期 5～7，新增星期日历推理、数一数计数挑战，还要按顺序点亮彩灯寻宝。</p>
        </div>
        <div class="sel-card" data-tier="2">
          <h3>高级 · 星空之巅</h3>
          <div class="lv">变式级</div>
          <p>周期最长 12，硬币存钱罐组合周期、数列求和挑战、跨月跨年的日期推理。</p>
        </div>
      </div>
    </section>

    <!-- 游戏屏 -->
    <section id="scr-game" class="hidden">
      <div id="qcard"></div>
      <div id="stage-card">
        <div class="zone-label">图案传送带（可以左右滑动查看更多）</div>
        <div id="strip-scroll">
          <div id="strip-inner">
            <div id="gmarks"></div>
            <div id="strip"></div>
            <div id="frame"><div id="fhandle">拖我</div></div>
          </div>
        </div>
        <div id="toolbar"></div>
        <div id="answer-zone"></div>
        <div id="verify-stage"></div>
        <div id="eq-panel" class="hidden"></div>
      </div>
    </section>

    <!-- 结算屏 -->
    <section id="scr-final" class="hidden">
      <div class="fin-title" id="finTitle">全部通关，太棒啦！</div>
      <div class="fin-list" id="finList"></div>
      <div class="center">
        <button class="btn main" id="btnAgain">再玩一次（重新抽题）</button>
        <button class="btn" id="btnBack2">返回难度选择</button>
      </div>
    </section>
  </main>
</div>

<!-- 弹窗（规则 / 揭示答案） -->
<div id="modal-mask" class="hidden"><div id="modal"></div></div>
<!-- 彩纸庆祝画布 -->
