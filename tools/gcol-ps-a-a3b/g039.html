<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>出发啦！速度·路程·时间大闯关</title>
<style>
/* ============ 基础布局与主题变量（配色每局随机） ============ */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
  background: var(--bg);
  color: #26313f;
  font-size: 17px;
  line-height: 1.6;
  transition: background .4s;
}
#app { max-width: 980px; margin: 0 auto; padding: 10px 12px 30px; }

/* ============ 顶部栏 ============ */
#topbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  background: #ffffff; border: 3px solid var(--p); border-radius: 16px;
  padding: 8px 12px; margin-bottom: 12px; box-shadow: 0 4px 0 var(--pl);
}
#brand { font-size: 20px; font-weight: 900; color: var(--pd); }
#pal-name { font-size: 13px; color: #6b7a8c; margin-left: 2px; }
#hud { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; }
.hud-chip {
  background: var(--pl); border-radius: 999px; padding: 3px 12px;
  font-weight: 800; font-size: 16px; color: var(--pd); white-space: nowrap;
}
#topbtns { display: flex; gap: 6px; }

/* ============ 按钮 ============ */
.btn {
  border: 3px solid var(--p); background: #fff; color: var(--pd);
  font-size: 17px; font-weight: 800; font-family: inherit;
  padding: 8px 16px; border-radius: 14px; cursor: pointer;
  transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(2px); }
.btn.primary { background: var(--p); color: #fff; box-shadow: 0 4px 0 var(--pd); }
.btn.primary:active { box-shadow: 0 1px 0 var(--pd); }
.btn.gold { background: #ffd76a; border-color: #d99a00; color: #6b4a00; box-shadow: 0 4px 0 #d99a00; }
.btn.ghost { border-style: dashed; }
.btn.big { font-size: 20px; padding: 12px 26px; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

/* ============ 屏幕切换 ============ */
.screen { display: none; animation: fadein .35s; }
.screen.active { display: block; }
@keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }

/* ============ 难度选择屏 ============ */
.hero-card {
  background: #fff; border: 4px solid var(--p); border-radius: 22px;
  padding: 26px 20px; text-align: center; box-shadow: 0 8px 0 var(--pl);
}
.hero-card h1 { font-size: 30px; color: var(--pd); letter-spacing: 1px; }
.hero-card .sub { color: #5b6b7d; margin: 10px 0 20px; font-size: 18px; }
.diff-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 18px; }
.diff-btn {
  border: 4px solid var(--pl); border-radius: 18px; background: var(--pl);
  padding: 18px 10px; cursor: pointer; font-family: inherit; text-align: center;
  transition: transform .1s, border-color .1s;
}
.diff-btn:hover { transform: translateY(-3px); border-color: var(--p); }
.diff-btn .d-name { font-size: 24px; font-weight: 900; color: var(--pd); }
.diff-btn .d-desc { font-size: 14px; color: #5b6b7d; margin-top: 6px; }
.diff-btn .d-emoji { font-size: 40px; }
.formula-tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 6px 0 16px; }
.formula-tags span {
  background: #fffbe8; border: 2px dashed #d9a800; color: #7a5b00;
  border-radius: 999px; padding: 4px 14px; font-weight: 800; font-size: 15px;
}

/* ============ 任务卡 ============ */
#task-card {
  background: #fff; border-left: 12px solid var(--p); border-radius: 14px;
  padding: 12px 16px; margin-bottom: 10px; box-shadow: 0 3px 0 var(--pl);
}
.tc-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 6px; }
.tc-badge {
  background: var(--p); color: #fff; border-radius: 999px;
  padding: 2px 14px; font-weight: 900; font-size: 15px;
}
.tc-diff { color: #8a97a6; font-size: 14px; font-weight: 700; }
.tc-text { font-size: 18px; font-weight: 600; }
.tc-hint { margin-top: 8px; font-size: 15px; color: #7a5b00; background: #fffbe8; border-radius: 10px; padding: 6px 10px; display: inline-block; }

/* ============ 舞台 ============ */
#stage {
  position: relative; background: #fff; border: 3px solid var(--pl);
  border-radius: 18px; overflow: hidden; box-shadow: 0 4px 0 var(--pl); margin-bottom: 10px;
}
#cv { display: block; width: 100%; touch-action: pan-y; }

/* ============ 控件区 ============ */
#controls { background: #fff; border: 3px solid var(--pl); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; }
.slider-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 6px 0; }
.slider-row label { font-weight: 900; font-size: 17px; color: var(--pd); }
.slider-val {
  background: var(--p); color: #fff; font-weight: 900; font-size: 19px;
  border-radius: 10px; padding: 4px 14px; min-width: 130px; text-align: center;
}
input[type=range] {
  -webkit-appearance: none; appearance: none; flex: 1; min-width: 170px; height: 14px;
  background: var(--pl); border-radius: 999px; outline: none; cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 34px; height: 34px; border-radius: 50%;
  background: var(--p); border: 4px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35);
}
input[type=range]::-moz-range-thumb {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--p); border: 4px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35);
}
.fixed-chip {
  background: #eef2f7; border: 2px solid #c6d2df; border-radius: 10px;
  padding: 4px 12px; font-weight: 800; font-size: 16px; color: #46586c;
}
.formula-line {
  margin-top: 8px; background: var(--pl); border-radius: 10px; padding: 8px 12px;
  font-size: 17px; font-weight: 700; color: var(--pd);
}
.formula-line b { color: #c2410c; font-size: 19px; }

/* 配对行与托盘（拖拽区） */
.assign-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 4px 0 10px; }
.walker-chip {
  display: flex; align-items: center; gap: 8px; background: var(--pl);
  border-radius: 12px; padding: 8px 10px; font-weight: 800; font-size: 16px; color: var(--pd);
}
.dropzone {
  min-width: 96px; min-height: 52px; border: 3px dashed var(--p); border-radius: 12px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 900; color: #9aa8b8; background: #fff; touch-action: none;
}
.dropzone.filled { border-style: solid; background: #fffbe8; color: #7a5b00; }
.dropzone.hot { background: #ffe9a8; border-color: #d9a800; transform: scale(1.06); }
.tray {
  background: #f4f7fb; border: 2px dashed #b9c7d6; border-radius: 12px;
  padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
}
.tray .tray-label { font-weight: 900; color: #5b6b7d; font-size: 15px; }
.draggable {
  background: #fff; border: 3px solid var(--p); border-radius: 12px;
  padding: 6px 14px; font-size: 19px; font-weight: 900; color: var(--pd);
  cursor: grab; user-select: none; touch-action: none; box-shadow: 0 3px 0 var(--pl);
}
.draggable.used { opacity: .35; pointer-events: none; }
.drag-ghost {
  position: fixed; z-index: 999; pointer-events: none; transform: translate(-50%, -50%) scale(1.1);
  background: #fff; border: 3px solid var(--pd); border-radius: 12px;
  padding: 6px 14px; font-size: 19px; font-weight: 900; color: var(--pd);
  box-shadow: 0 8px 18px rgba(0,0,0,.25);
}

/* 山坡关统计表 */
#d-stats { margin-top: 10px; border-top: 2px dashed var(--pl); padding-top: 8px; }
.stat-line { font-size: 16px; font-weight: 700; color: #46586c; padding: 2px 0; }
.stat-line b { color: var(--pd); }
.stat-line.final {
  background: var(--pl); border-radius: 10px; padding: 6px 10px; margin-top: 6px;
  font-size: 18px; color: var(--pd);
}
.stat-line.final b { color: #c2410c; font-size: 20px; }

/* ============ 反馈区 ============ */
#feedback {
  border-radius: 14px; padding: 12px 16px; margin-bottom: 10px; font-size: 17px; font-weight: 700;
  border: 3px solid; display: none;
}
#feedback.show { display: block; animation: pop .3s; }
#feedback.ok { background: #ecfdf3; border-color: #15803d; color: #14532d; }
#feedback.no { background: #fff7e6; border-color: #b45309; color: #7c2d12; }
@keyframes pop { from { transform: scale(.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ============ 操作按钮行 ============ */
#action-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

/* ============ 结算屏 ============ */
#screen-final .hero-card h1 { font-size: 32px; }
.final-stars { font-size: 40px; letter-spacing: 6px; margin: 12px 0; }
.final-stats { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 14px 0 20px; }
.final-stats .hud-chip { font-size: 18px; padding: 6px 18px; }
.level-star-list { background: var(--pl); border-radius: 12px; padding: 10px; margin-bottom: 16px; text-align: left; }
.level-star-list div { font-weight: 700; padding: 3px 6px; }

/* ============ 弹窗 ============ */
#modal-mask {
  position: fixed; inset: 0; background: rgba(25, 35, 48, .55);
  display: none; align-items: center; justify-content: center; z-index: 100; padding: 14px;
}
#modal-mask.show { display: flex; }
#modal {
  background: #fff; border-radius: 20px; border: 4px solid var(--p);
  max-width: 660px; width: 100%; max-height: 86vh; overflow-y: auto; padding: 20px 22px;
  box-shadow: 0 12px 40px rgba(0,0,0,.35); animation: pop .3s;
}
#modal h2 { color: var(--pd); font-size: 24px; margin-bottom: 12px; text-align: center; }
#modal-body h3 { color: var(--pd); margin: 12px 0 4px; font-size: 18px; }
#modal-body ul, #modal-body ol { padding-left: 22px; }
#modal-body li { margin: 4px 0; }
#modal-body .cheer { text-align: center; color: #b45309; font-weight: 900; margin-top: 12px; }
#modal .modal-btn-row { text-align: center; margin-top: 16px; }
.solve-box {
  background: var(--pl); border-radius: 12px; padding: 10px 14px; margin-top: 8px;
  font-weight: 700; color: var(--pd); font-size: 16px; line-height: 1.9;
}

/* ============ 撒花画布 ============ */
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 200; }

/* ============ 小屏适配 ============ */
@media (max-width: 640px) {
  body { font-size: 16px; }
  #brand { font-size: 17px; }
  .hero-card h1 { font-size: 24px; }
  .tc-text { font-size: 16.5px; }
  .btn { font-size: 15.5px; padding: 8px 12px; }
  .btn.big { font-size: 18px; padding: 10px 18px; }
  #hud { margin-left: 0; }
}
</style>
</head>
<body>
<div id="app">

  <!-- ======== 顶部栏：标题 + 计时器/步数/星星（右上角实时显示） ======== -->
  <header id="topbar">
    <div id="brand">🚀 小小旅行团<span id="pal-name"></span></div>
    <div id="hud">
      <span class="hud-chip" id="hud-level">—</span>
      <span class="hud-chip" id="hud-star">⭐ 0/6</span>
      <span class="hud-chip" id="hud-time">⏱ 00:00</span>
      <span class="hud-chip" id="hud-steps">👣 0</span>
    </div>
    <div id="topbtns">
      <button class="btn ghost" id="btn-rules-top">📖 规则说明</button>
      <button class="btn ghost" id="btn-back">🏠 返回难度选择</button>
    </div>
  </header>

  <!-- ======== 难度选择屏 ======== -->
  <section id="screen-diff" class="screen active">
    <div class="hero-card">
      <h1>🚗💨 出发啦！速度·路程·时间大闯关</h1>
      <p class="sub">动手调度小车与小伙伴，玩转行程三要素——每次闯关题目都会重新抽取，常玩常新！</p>
      <div class="formula-tags">
        <span>路程 = 速度 × 时间</span>
        <span>速度 = 路程 ÷ 时间</span>
        <span>时间 = 路程 ÷ 速度</span>
      </div>
      <div class="diff-grid">
        <button class="diff-btn" data-diff="初级">
          <div class="d-emoji">🚲</div>
          <div class="d-name">初级 · 轻松骑行</div>
          <div class="d-desc">公式探秘：调滑块，精准到站</div>
        </button>
        <button class="diff-btn" data-diff="中级">
          <div class="d-emoji">👫</div>
          <div class="d-name">中级 · 结伴同行</div>
          <div class="d-desc">方向调度：拖箭头 + 平均速度</div>
        </button>
        <button class="diff-btn" data-diff="高级">
          <div class="d-emoji">🗺️</div>
          <div class="d-name">高级 · 地图大师</div>
          <div class="d-desc">智慧闯关：摆地图 + 双解讨论</div>
        </button>
      </div>
      <button class="btn primary big" id="btn-rules-diff">📖 先看看规则说明</button>
    </div>
  </section>

  <!-- ======== 游戏屏 ======== -->
  <section id="screen-game" class="screen">
    <div id="task-card"></div>
    <div id="stage"><canvas id="cv"></canvas></div>
    <div id="controls"></div>
    <div id="feedback"></div>
    <div id="action-row">
      <button class="btn primary big" id="btn-run">🚦 出发！</button>
      <button class="btn gold" id="btn-reveal">💡 揭示答案</button>
      <button class="btn ghost" id="btn-restart">🔄 重新开始</button>
      <button class="btn primary big" id="btn-next" style="display:none;">➡️ 下一关</button>
    </div>
  </section>

  <!-- ======== 结算屏（通关庆祝） ======== -->
  <section id="screen-final" class="screen">
    <div class="hero-card">
      <h1>🎉 全部通关，太厉害啦！</h1>
      <div class="final-stars" id="final-stars">⭐⭐⭐</div>
      <div class="final-stats">
        <span class="hud-chip" id="final-pts">⭐ 0/6</span>
        <span class="hud-chip" id="final-time">⏱ 00:00</span>
        <span class="hud-chip" id="final-steps">👣 0</span>
      </div>
      <div class="level-star-list" id="final-list"></div>
      <div id="action-row-final" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
        <button class="btn primary big" id="btn-again">🔁 再玩一次</button>
        <button class="btn big" id="btn-change">🏠 换个难度</button>
      </div>
    </div>
  </section>
</div>

<!-- ======== 通用弹窗（规则 / 揭示答案） ======== -->
<div id="modal-mask">
  <div id="modal">
    <h2 id="modal-title">玩法说明</h2>
    <div id="modal-body"></div>
    <div class="modal-btn-row"><button class="btn primary big" id="modal-ok">明白啦</button></div>
  </div>
</div>

<!-- ======== 撒花庆祝画布 ======== -->
<canvas id="fx"></canvas>

<script>
'use strict';
/* =====================================================================
 * 《出发啦！速度·路程·时间大闯关》
 * 内容依据：第20讲 速度、路程与时间（上）
 *   好方法1 行程三要素 / 好方法2 求时间 / 好方法3 直接求路程
 *   好方法4 求两地距离（相遇）/ 好方法5 求平均速度
 * 四种深度绑定的操作玩法：
 *   A 滑块调度（构造 路程=速度×时间）
 *   B 方向箭头拖拽 + 时间滑块（相向/背向/同向：速度和 vs 速度差）
 *   C 拖动小旗摆放乙城（两地距离 = 已行路程和 ± 还相距）
 *   D 速度卡拖入路段槽（平均速度 = 总路程 ÷ 总时间）
 * ===================================================================== */

/* ---------------- 基础工具 ---------------- */
function $(id) { return document.getElementById(id); }
function mk(tag, cls, txt) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== null) e.textContent = txt;
  return e;
}
function rint(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function fmtTime(s) {
  var m = Math.floor(s / 60), r = s % 60;
  return (m < 10 ? '0' + m : '' + m) + ':' + (r < 10 ? '0' + r : '' + r);
}
/* 为 0~max 的刻度尺选一个漂亮的步长（约 4~8 格） */
function niceStep(max) {
  var cands = [1, 2, 4, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000];
  for (var i = 0; i < cands.length; i++) {
    if (max / cands[i] <= 8) return cands[i];
  }
  return 1000;
}

/* ---------------- 随机色板（G8：每局随机主色） ---------------- */
var PALETTES = [
  { name: '🍊 阳光橙', p: '#ea580c', pd: '#9a3412', pl: '#ffedd5', bg: '#fff7ed' },
  { name: '🌱 草地绿', p: '#16a34a', pd: '#14532d', pl: '#dcfce7', bg: '#f0fdf4' },
  { name: '🔷 天空蓝', p: '#2563eb', pd: '#1e3a8a', pl: '#dbeafe', bg: '#eff6ff' },
  { name: '🍇 葡萄紫', p: '#9333ea', pd: '#581c87', pl: '#f3e8ff', bg: '#faf5ff' },
  { name: '🌸 蜜桃粉', p: '#db2777', pd: '#831843', pl: '#fce7f3', bg: '#fdf2f8' },
  { name: '🌊 海洋青', p: '#0d9488', pd: '#134e4a', pl: '#ccfbf1', bg: '#f0fdfa' }
];
var pal = PALETTES[0];
function applyPaletteRandom() {
  pal = pick(PALETTES);
  var r = document.documentElement.style;
  r.setProperty('--p', pal.p);
  r.setProperty('--pd', pal.pd);
  r.setProperty('--pl', pal.pl);
  r.setProperty('--bg', pal.bg);
  $('pal-name').textContent = '（本局主题：' + pal.name + '）';
}

/* ---------------- 全局状态 ---------------- */
var state = {
  screen: 'diff', diff: '', levels: [], cur: 0,
  steps: 0, pts: 0, seconds: 0, timerId: null,
  running: false, raf: 0, ac: null
};

/* ---------------- 轻快音效（WebAudio，可容错） ---------------- */
function tone(freq, dur, delay, type) {
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!state.ac) state.ac = new AC();
    var t0 = state.ac.currentTime + (delay || 0);
    var o = state.ac.createOscillator();
    var g = state.ac.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.16, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(state.ac.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) { /* 无声环境不影响游戏 */ }
}
function soundWin() { tone(523, .16, 0); tone(659, .16, .11); tone(784, .28, .22); }
function soundNo()  { tone(233, .22, 0, 'triangle'); }
function soundTick(){ tone(880, .05, 0, 'square'); }

/* =====================================================================
 * 题库数据（docx 原题 + 每局现场生成的变式，保证反重复）
 * ===================================================================== */

/* 主角池（变式题随机换主角，界面常玩常新） */
var HEROES = [
  { e: '🚲', n: '骑行小达人牛牛' }, { e: '🚗', n: '滴滴小车' },
  { e: '🐶', n: '快递小狗' }, { e: '🚌', n: '旅行巴士' },
  { e: '🚕', n: '阳光出租车' }, { e: '🐰', n: '送信兔兔' }
];

/* ---- A 型：单人行程（构造 路程=速度×时间 / 时间=路程÷速度） ---- */
var DOCX_A = [
  /* 例1(1)：15×2=30 */
  { type: 'A', ask: 'v', hero: { e: '🚲', n: '牛牛' }, d: 30, t: 2, v: 15, du: '千米', vu: '千米/时', tu: '小时',
    story: '牛牛骑自行车去郊游，全程 30 千米，计划匀速骑行 2 小时。',
    expl: '路程=速度×时间 → 速度=路程÷时间=30÷2=15（千米/时）。出发后 15×2=30（千米），恰好到站！' },

/* ---------------- 组卷：按难度抽样（反重复核心） ---------------- */
/* A 型题滑块参数归一化：保证正确答案一定落在滑块格点上（如 46 需要步长 2） */
function normalizeA(t) {
  if (t.type !== 'A') return t;
  if (t.ask === 't') {
    if (!t.tMax) t.tMax = Math.max(12, t.t + 5);
  } else {
    var ans = t.ask === 'v' ? t.v : t.v2;
    if (!t.vStep) t.vStep = (ans % 5 === 0) ? 5 : ((ans % 2 === 0) ? 2 : 1);
    if (!t.vMax) t.vMax = Math.ceil(Math.max(ans * 1.8, ans + t.vStep) / t.vStep) * t.vStep;
  }
  return t;
}
function buildLevels(diff) {
  var levels = [];
  if (diff === '初级') {
    var poolA = shuffle(DOCX_A.concat([genA(), genA(), genA(), genA2(), genA2()]));
    var hasV = null, hasT = null, rest = [];
    for (var i = 0; i < poolA.length; i++) {
      var tk = poolA[i];
      if (!hasV && tk.ask === 'v') hasV = tk;
      else if (!hasT && tk.ask === 't') hasT = tk;
      else rest.push(tk);
    }
    levels = [hasV || poolA[0], hasT || poolA[1], rest[0] || poolA[2]];
  } else if (diff === '中级') {
    /* 方向关：从不同情景里各抽一条 */
    var scenList = shuffle(B_SCENARIOS);
    var generatedScen = null;
    var dirPool = [];
    for (var s = 0; s < scenList.length && dirPool.length < 2; s++) {
      var entries = shuffle(bDirEntries(scenList[s]));
      dirPool.push(entries[0]);
    }
    while (dirPool.length < 2) dirPool.push(genBDir());
    if (Math.random() < 0.5) dirPool[rint(0, dirPool.length - 1)] = genBDir();
    var timeFixed = [
      { sc: B_SCENARIOS[0], cfg: ['R', 'L'] },
      { sc: B_SCENARIOS[1], cfg: ['R', 'L'] },
      { sc: B_SCENARIOS[2], cfg: ['L', 'R'] }
    ];
    var tf = pick(timeFixed);
    var tEntry = bDirEntries(tf.sc).filter(function (e) { return cfgKey(e.sol) === cfgKey(tf.cfg); })[0];
    tEntry.flavor = 'time'; tEntry.tMax = 12;
    if (cfgKey(tf.cfg) === 'RL') tEntry.expl = '两人相向而行：(' + tf.sc.v1 + '+' + tf.sc.v2 + ')×' + tf.sc.t + '=' + ((tf.sc.v1 + tf.sc.v2) * tf.sc.t) + '（米）；' + tf.sc.D + '−' + ((tf.sc.v1 + tf.sc.v2) * tf.sc.t) + '=' + tEntry.target + '（米）→ 时间=' + tf.sc.t + ' 分钟。';
    else tEntry.expl = '两人背向而行：(' + tf.sc.v1 + '+' + tf.sc.v2 + ')×' + tf.sc.t + '=' + ((tf.sc.v1 + tf.sc.v2) * tf.sc.t) + '（米）；' + tf.sc.D + '+' + ((tf.sc.v1 + tf.sc.v2) * tf.sc.t) + '=' + tEntry.target + '（米）→ 时间=' + tf.sc.t + ' 分钟。';
    if (Math.random() < 0.5) tEntry = genBTime();
    levels = [dirPool[0], tEntry, genD2()];
  } else {
    /* 高级：地图关 + 三段平均速度 + 两解讨论 */
    var cPool = shuffle([finalizeC(JSON.parse(JSON.stringify(C_DOCX[0]))), finalizeC(genC(false)), finalizeC(genC(false)), finalizeC(genC(false))]);
    var cTwoPool = shuffle([finalizeC(JSON.parse(JSON.stringify(C_DOCX[1]))), finalizeC(genC(true))]);
    levels = [cPool[0], shuffle(D3_POOL.slice())[0], cTwoPool[0]];
  }
  return levels.map(function (t, idx) {
    normalizeA(t);
    return { idx: idx + 1, type: t.type, task: t, solved: false, revealed: false, pts: 0, rt: {} };
  });
}

/* =====================================================================
 * 屏幕切换与游戏流程
 * ===================================================================== */
function show(name) {
  state.screen = name;
  var map = { diff: 'screen-diff', game: 'screen-game', final: 'screen-final' };
  Object.keys(map).forEach(function (k) {
    $(map[k]).classList.toggle('active', k === name);
  });
}
function startTimer() {
  stopTimer();
  state.timerId = setInterval(function () {
    state.seconds++;
    $('hud-time').textContent = '⏱ ' + fmtTime(state.seconds);
  }, 1000);
}
function stopTimer() {
  if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }
}
function updateHud() {
  var L = state.levels[state.cur];
  $('hud-level').textContent = '📍 第 ' + (state.cur + 1) + '/' + state.levels.length + ' 关';
  $('hud-star').textContent = '⭐ ' + state.pts + '/' + (state.levels.length * 2);
  $('hud-steps').textContent = '👣 ' + state.steps;
  $('hud-time').textContent = '⏱ ' + fmtTime(state.seconds);
}
function startSession(diff) {
  applyPaletteRandom();
  state.diff = diff;
  state.levels = buildLevels(diff);
  state.cur = 0; state.steps = 0; state.pts = 0; state.seconds = 0;
  showRules(true);
}
function afterRulesStart() {
  show('game');
  startTimer();
  renderLevel();
}
function nextLevel() {
  if (state.cur >= state.levels.length - 1) { finishGame(); return; }
  state.cur++;
  renderLevel();
}
function finishGame() {
  stopTimer();
  show('final');
  var gold = 0, silver = 0;
  var listHtml = '';
  state.levels.forEach(function (L) {
    if (L.pts === 2) gold++;
    else if (L.pts === 1) silver++;
    listHtml += '<div>第 ' + L.idx + ' 关：' + (L.pts === 2 ? '⭐⭐ 自己想出来的，真棒！' : (L.pts === 1 ? '⭐ 看过提示后通关，也不错！' : '⭐ 已通关')) + '</div>';
  });
  var starStr = '';
  for (var i = 0; i < gold; i++) starStr += '⭐';
  for (var j = 0; j < silver; j++) starStr += '🌟';
  $('final-stars').textContent = starStr || '🎉';
  $('final-pts').textContent = '⭐ ' + state.pts + '/' + (state.levels.length * 2);
  $('final-time').textContent = '⏱ ' + fmtTime(state.seconds);
  $('final-steps').textContent = '👣 ' + state.steps;
  $('final-list').innerHTML = listHtml;
  celebrateBig();
  soundWin();
}

/* =====================================================================
 * 关卡渲染
 * ===================================================================== */
var LEVEL_NAME = { 初级: '轻松骑行 · 公式探秘', 中级: '结伴同行 · 方向调度', 高级: '地图大师 · 智慧闯关' };
var cv = $('cv'), ctx = cv.getContext('2d');
var cw = 900, chh = 280, DPR = 1;

function fitCanvas() {
  var stage = $('stage');
  var w = stage.clientWidth || 900;
  var h = Math.round(Math.min(320, Math.max(230, w * 0.4)));
  DPR = window.devicePixelRatio || 1;
  cw = w; chh = h;
  cv.width = Math.round(w * DPR);
  cv.height = Math.round(h * DPR);
  cv.style.height = h + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawScene(curSim());
}
window.addEventListener('resize', fitCanvas);

function curSim() {
  var L = state.levels[state.cur];
  return L && L.rt.sim ? L.rt.sim : 0;
}

/* 根据关卡类型生成任务文本 */
function taskText(L) {
  var t = L.task;
  if (t.type === 'A') {
    if (t.ask === 'v') return '【送达任务】' + t.story + '请拖动【速度滑块】，出发后让车恰好停在目标站！';
    if (t.ask === 't') return '【准时送达】' + t.story + '请拖动【时间滑块】，出发后让车恰好停在目标站！';
    return '【两段旅程】' + t.story + '请拖动【第二段速度滑块】，出发后让车恰好停在终点站！';
  }
  if (t.type === 'B') {
    if (t.flavor === 'dir') return '【方向调度】' + t.n1 + '和' + t.n2 + '的家在同一条马路旁，相距 ' + t.D + ' 米，速度分别是 ' + t.v1 + '、' + t.v2 + ' 米/分。两人同时出发走 ' + t.t + ' 分钟后，要让他们恰好相距 ' + t.target + ' 米。请把方向箭头拖到两位小伙伴身上，再按【出发】！';
    return '【时间调度】' + t.n1 + '和' + t.n2 + '的家相距 ' + t.D + ' 米，速度分别是 ' + t.v1 + '、' + t.v2 + ' 米/分。两人已按图中的箭头方向同时出发。走多少分钟后两人恰好相距 ' + t.target + ' 米？请调节【时间滑块】，再出发验证！';
  }
  if (t.type === 'C') {
    var base = '【摆放地图】甲、乙两城之间有两趟对开的列车：' + t.hero1 + ' 每小时行 ' + t.v1 + ' 千米，' + t.hero2 + ' 每小时行 ' + t.v2 + ' 千米，同时出发相向而行，行驶 ' + t.t + ' 小时后两车还相距 ' + t.gap + ' 千米。请左右拖动小旗 🚩 摆出乙城的正确位置（两地距离），再按【出发验证】！';
    if (t.two) base += ' 小提示：这道题有两种正确的摆法哦——想一想，是还没相遇，还是相遇之后又走开了？';
    return base;
  }
  if (t.type === 'D') {
    if (t.segs === 2) return '【山坡往返】乐乐老师骑着 ' + t.hero + ' 要爬 ' + t.L + ' ' + t.du + ' 的' + t.hill + '，再沿原路返回。请把速度卡拖进「去时」和「回时」两个槽，让往返的平均速度恰好等于 ' + t.target + ' ' + t.vu + '，再按【出发试跑】！';
    return '【三段旅程】从 A 地到 D 地有三段路：' + t.Larr[0] + '、' + t.Larr[1] + '、' + t.Larr[2] + ' ' + t.du + '。请把三张速度卡分配到三段路（每段一张），让全程平均速度恰好等于 ' + t.target + ' ' + t.vu + '，再按【出发试跑】！';
  }
  return '';
}
function taskHint(L) {
  var t = L.task;
  if (t.type === 'A') return '💡 路程=速度×时间 ｜ 速度=路程÷时间 ｜ 时间=路程÷速度';
  if (t.type === 'B') return '💡 相向、背向看「速度和」，同向看「速度差」';
  if (t.type === 'C') return '💡 两地距离 = 已行路程和 ＋ 还相距（也可能是 −，想想为什么）';
  return '💡 平均速度 = 总路程 ÷ 总时间（不是把速度平均哦）';
}

function renderLevel() {
  var L = state.levels[state.cur];
  var t = L.task;
  /* 重置本关运行时数据 */
  L.rt = { sim: 0, ran: false };
  if (t.type === 'A') {
    L.rt.sliderVal = (t.ask === 't') ? 1 : (t.vStep || 5);
    if (t.ask === 'v2') L.rt.sliderVal = t.vStep || 5;
  } else if (t.type === 'B') {
    L.rt.arrows = t.flavor === 'dir' ? [null, null] : t.sol.slice();
    L.rt.sliderVal = 1;
  } else if (t.type === 'C') {
    L.rt.flagKm = t.flagInit;
  } else if (t.type === 'D') {
    L.rt.slots = t.segs === 2 ? [null, null] : [null, null, null];
    /* 二段关：答案两张卡 + 三张干扰卡；三段关：恰好三张卡（排列谜题，保证解唯一） */
    L.rt.badges = (t.segs === 2 ? t.sol.concat(t.distract) : t.sol.slice()).map(function (v) { return { v: v, slot: null }; });
    L.rt.badges = shuffle(L.rt.badges);
  }

  /* 任务卡 */
  $('task-card').innerHTML =
    '<div class="tc-head"><span class="tc-badge">第 ' + L.idx + ' 关 · ' + LEVEL_NAME[state.diff] + '</span><span class="tc-diff">' + state.diff + '（共 ' + state.levels.length + ' 关）</span></div>' +
    '<p class="tc-text">' + taskText(L) + '</p>' +
    '<div class="tc-hint">' + taskHint(L) + '</div>';

  /* 控件区 */
  buildControls(L);

  /* 反馈与按钮复位（D 型的出发按钮由 updateDStats 按放卡进度控制） */
  hideFeedback();
  $('btn-run').style.display = '';
  if (L.type !== 'D') $('btn-run').disabled = false;
  $('btn-next').style.display = 'none';
  setRunLabel(L);
  updateHud();
  fitCanvas();
}

function setRunLabel(L) {
  var t = L.task;
  if (t.type === 'C') $('btn-run').textContent = '🚦 出发验证！';
  else if (t.type === 'D') $('btn-run').textContent = '🏃 出发试跑！';
  else $('btn-run').textContent = '🚦 出发！';
}

/* ---------------- 控件构建 ---------------- */
function buildControls(L) {
  var box = $('controls');
  box.innerHTML = '';
  var t = L.task;

  if (t.type === 'A') {
    var row = mk('div', 'slider-row');
    var lab = mk('label', null, '');
    var val = mk('div', 'slider-val');
    var sl = document.createElement('input');
    sl.type = 'range';
    var isV = (t.ask === 'v' || t.ask === 'v2');
    var vStep = t.vStep || 5, vMax = t.vMax || 60;
    if (isV) {
      lab.textContent = '🚀 ' + (t.ask === 'v2' ? '第二段速度滑块' : '速度滑块');
      sl.min = vStep; sl.max = vMax; sl.step = vStep; sl.value = L.rt.sliderVal;
      val.textContent = L.rt.sliderVal + ' ' + t.vu;
      var fixed = mk('div', 'fixed-chip', '⏱ 时间固定：' + (t.ask === 'v2' ? (t.t1 + '+' + t.t2) : t.t) + ' ' + t.tu);
      row.appendChild(fixed);
    } else {
      lab.textContent = '⏱ 时间滑块';
      sl.min = 1; sl.max = t.tMax || 12; sl.step = 1; sl.value = 1;
      val.textContent = '1 ' + t.tu;
      row.appendChild(mk('div', 'fixed-chip', '🚀 速度固定：' + t.v + ' ' + t.vu));
    }
    row.appendChild(lab); row.appendChild(sl); row.appendChild(val);
    box.appendChild(row);

    var line = mk('div', 'formula-line');
    line.id = 'a-formula';
    box.appendChild(line);

    sl.addEventListener('input', function () {
      L.rt.sliderVal = parseInt(sl.value, 10);
      val.textContent = L.rt.sliderVal + ' ' + (isV ? t.vu : t.tu);
      updateAFormula(L);
      if (!state.running) { L.rt.sim = 0; L.rt.ran = false; drawScene(0); }
    });
    sl.addEventListener('change', function () { state.steps++; updateHud(); soundTick(); });
    updateAFormula(L);
  }

  else if (t.type === 'B') {
    if (t.flavor === 'dir') {
      var arow = mk('div', 'assign-row');
      for (var i = 0; i < 2; i++) {
        var chip = mk('div', 'walker-chip');
        chip.appendChild(document.createTextNode((i === 0 ? t.e1 + ' ' + t.n1 + '（' + t.v1 + '米/分）方向：' : t.e2 + ' ' + t.n2 + '（' + t.v2 + '米/分）方向：')));
        var dz = mk('div', 'dropzone', '?');
        dz.setAttribute('data-drop', 'arrow');
        dz.setAttribute('data-idx', '' + i);
        chip.appendChild(dz);
        arow.appendChild(chip);
      }
      box.appendChild(arow);
      var tray = mk('div', 'tray');
      tray.appendChild(mk('span', 'tray-label', '方向牌（拖到小伙伴身上）：'));
      var ar1 = mk('span', 'draggable', '➡️ 向右出发');
      ar1.setAttribute('data-arrow', 'R');
      var ar2 = mk('span', 'draggable', '⬅️ 向左出发');
      ar2.setAttribute('data-arrow', 'L');
      tray.appendChild(ar1); tray.appendChild(ar2);
      box.appendChild(tray);
      makeDraggable(ar1, { kind: 'arrow', v: 'R' });
      makeDraggable(ar2, { kind: 'arrow', v: 'L' });
      box.appendChild(mk('div', 'formula-line', '⏱ 两人同时出发，行走时间固定为 ' + t.t + ' 分钟。安排好两个方向再出发！'));
    } else {
      var r2 = mk('div', 'slider-row');
      r2.appendChild(mk('label', null, '⏱ 时间滑块'));
      var sl2 = document.createElement('input');
      sl2.type = 'range'; sl2.min = 1; sl2.max = t.tMax || 12; sl2.step = 1; sl2.value = 1;
      var val2 = mk('div', 'slider-val', '1 分钟');
      r2.appendChild(sl2); r2.appendChild(val2);
      box.appendChild(r2);
      var arrowsTxt = (t.sol[0] === 'R' ? '➡️ 向右' : '⬅️ 向左') + '，' + t.n2 + (t.sol[1] === 'R' ? '➡️ 向右' : '⬅️ 向左');
      var dirName = CFG_NAME[cfgKey(t.sol)];
      box.appendChild(mk('div', 'formula-line', '🧭 方向已定：' + t.n1 + arrowsTxt + '（' + dirName + '）。请调节时间滑块，让两人相距 ' + t.target + ' 米！'));
      sl2.addEventListener('input', function () {
        L.rt.sliderVal = parseInt(sl2.value, 10);
        val2.textContent = L.rt.sliderVal + ' 分钟';
        if (!state.running) { L.rt.sim = 0; L.rt.ran = false; drawScene(0); }
      });
      sl2.addEventListener('change', function () { state.steps++; updateHud(); soundTick(); });
    }
  }

  else if (t.type === 'C') {
    var cline = mk('div', 'formula-line');
    cline.id = 'c-readout';
    box.appendChild(cline);
    box.appendChild(mk('div', 'formula-line', '🚩 直接用手指/鼠标按住画面里的小旗左右拖动，摆出你心目中的两地距离；拖好后按【出发验证】。'));
    updateCReadout(L);
  }

  else if (t.type === 'D') {
    var drow = mk('div', 'assign-row');
    var segCount = t.segs;
    for (var k = 0; k < segCount; k++) {
      var segChip = mk('div', 'walker-chip');
      var segLabel = t.segs === 2 ? (k === 0 ? '⛰️ 去时（上坡 ' + t.L + ' ' + t.du + '）' : '🌤️ 回时（下坡 ' + t.L + ' ' + t.du + '）') : '🛣️ 第' + (k + 1) + '段（' + t.Larr[k] + ' ' + t.du + '）';
      segChip.appendChild(document.createTextNode(segLabel + ' 速度：'));
      var dz2 = mk('div', 'dropzone', '拖入速度卡');
      dz2.setAttribute('data-drop', 'badge');
      dz2.setAttribute('data-idx', '' + k);
      segChip.appendChild(dz2);
      drow.appendChild(segChip);
    }
    box.appendChild(drow);
    var tray2 = mk('div', 'tray');
    tray2.appendChild(mk('span', 'tray-label', '速度卡（每张卡只能用一次，拖错可以点槽退回）：'));
    tray2.id = 'd-tray';
    box.appendChild(tray2);
    renderTray(L);
    var stats = mk('div');
    stats.id = 'd-stats';
    box.appendChild(stats);
    updateDStats(L);
    /* 点击已填的槽可退回速度卡 */
    box.querySelectorAll('.dropzone[data-drop="badge"]').forEach(function (dz3) {
      dz3.addEventListener('click', function () {
        var idx = parseInt(dz3.getAttribute('data-idx'), 10);
        if (state.running) return;
        if (L.rt.slots[idx] === null) return;
        var b = L.rt.badges[L.rt.slots[idx]];
        b.slot = null; L.rt.slots[idx] = null;
        state.steps++; updateHud();
        renderTray(L); updateDStats(L); drawScene(0);
      });
    });
  }
}

/* A 型：实时公式行 */
function updateAFormula(L) {
  var t = L.task, el = $('a-formula');
  if (!el) return;
  var vNow, tNow, dNow;
  if (t.ask === 'v') { vNow = L.rt.sliderVal; tNow = t.t; dNow = vNow * tNow; }
  else if (t.ask === 't') { vNow = t.v; tNow = L.rt.sliderVal; dNow = vNow * tNow; }
  else { vNow = L.rt.sliderVal; dNow = t.v1 * t.t1 + vNow * t.t2; }
  if (t.ask === 'v2') {
    el.innerHTML = '第一段 ' + t.v1 + '×' + t.t1 + '=' + (t.v1 * t.t1) + '；第二段 ' + vNow + '×' + t.t2 + '=' + (vNow * t.t2) +
      ' → 全程路程 = <b>' + dNow + ' ' + t.du + '</b>（目标 ' + t.d + ' ' + t.du + '）';
  } else {
    el.innerHTML = '路程 = 速度 × 时间 = ' + vNow + ' × ' + tNow + ' = <b>' + dNow + ' ' + t.du + '</b>（目标 ' + t.d + ' ' + t.du + '）';
  }
}
/* C 型：实时读数 */
function updateCReadout(L) {
  var t = L.task, el = $('c-readout');
  if (!el) return;
  el.innerHTML = '已行路程和 = (' + t.v1 + '+' + t.v2 + ')×' + t.t + ' = <b>' + t.walked + ' 千米</b>（固定值）　🚩 你摆放的两地距离：<b>' + L.rt.flagKm + ' 千米</b>';
}
/* D 型：托盘重绘 */
function renderTray(L) {
  var tray = $('d-tray');
  if (!tray) return;
  var label = tray.querySelector('.tray-label');
  tray.innerHTML = '';
  tray.appendChild(label);
  L.rt.badges.forEach(function (b, i) {
    var card = mk('span', 'draggable' + (b.slot !== null ? ' used' : ''), b.v + ' ' + L.task.vu);
    card.setAttribute('data-badge-idx', '' + i);
    tray.appendChild(card);
    makeDraggable(card, { kind: 'badge', idx: i });
  });
}
/* D 型：实时统计 */
function updateDStats(L) {
  var t = L.task, box = $('d-stats');
  if (!box) return;
  box.innerHTML = '';
  var filled = L.rt.slots.every(function (s) { return s !== null; });
  var totalS = 0, totalT = 0, lines = [];
  if (t.segs === 2) {
    totalS = 2 * t.L;
    for (var i = 0; i < 2; i++) {
      var v = L.rt.slots[i] !== null ? L.rt.badges[L.rt.slots[i]].v : null;
      var segName = i === 0 ? '去时' : '回时';
      lines.push(mk('div', 'stat-line', '⏱ ' + segName + '时间 = ' + t.L + ' ÷ ' + (v === null ? '?' : v) + ' = ' + (v === null ? '?' : (t.L / v)) + ' ' + (t.vu === '米/分' ? '分' : '时')));
      if (v !== null) totalT += t.L / v;
    }
    lines.push(mk('div', 'stat-line', '🛣️ 总路程 = 2 × ' + t.L + ' = ' + totalS + ' ' + t.du));
    lines.push(mk('div', 'stat-line', '⏱ 总时间 = ' + (filled ? totalT : '?') + ' ' + (t.vu === '米/分' ? '分' : '时')));
  } else {
    for (var k = 0; k < 3; k++) {
      var vk = L.rt.slots[k] !== null ? L.rt.badges[L.rt.slots[k]].v : null;
      totalS += t.Larr[k];
      lines.push(mk('div', 'stat-line', '⏱ 第' + (k + 1) + '段时间 = ' + t.Larr[k] + ' ÷ ' + (vk === null ? '?' : vk) + ' = ' + (vk === null ? '?' : (t.Larr[k] / vk)) + ' 时'));
      if (vk !== null) totalT += t.Larr[k] / vk;
    }
    lines.push(mk('div', 'stat-line', '🛣️ 总路程 = ' + t.Larr.join('+') + ' = ' + totalS + ' ' + t.du));
    lines.push(mk('div', 'stat-line', '⏱ 总时间 = ' + (filled ? totalT : '?') + ' 时'));
  }
  lines.forEach(function (ln) { box.appendChild(ln); });
  var final = mk('div', 'stat-line final');
  if (filled) {
    var avg = totalS / totalT;
    final.innerHTML = '🏁 平均速度 = 总路程 ÷ 总时间 = ' + totalS + ' ÷ ' + totalT + ' = <b>' + avg + ' ' + t.vu + '</b>（目标 ' + t.target + ' ' + t.vu + '）';
  } else {
    final.innerHTML = '🏁 平均速度 = 总路程 ÷ 总时间 = <b>把速度卡都放好再看看！</b>（目标 ' + t.target + ' ' + t.vu + '）';
  }
  box.appendChild(final);
  /* D 型没放满卡之前不能出发 */
  $('btn-run').disabled = !filled;
}

/* =====================================================================
 * 画布绘制（场景动画）
 * ===================================================================== */
function emo(e, x, y, size) {
  ctx.font = 'normal ' + size + 'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(e, x, y);
}
function textLabel(txt, x, y, size, color, bg) {
  ctx.font = 'bold ' + size + 'px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  var w = ctx.measureText(txt).width + 14;
  if (bg) {
    ctx.fillStyle = bg;
    var r = 8, h2 = size + 10;
    ctx.beginPath();
    ctx.moveTo(x - w / 2 + r, y - h2 / 2);
    ctx.arcTo(x + w / 2, y - h2 / 2, x + w / 2, y + h2 / 2, r);
    ctx.arcTo(x + w / 2, y + h2 / 2, x - w / 2, y + h2 / 2, r);
    ctx.arcTo(x - w / 2, y + h2 / 2, x - w / 2, y - h2 / 2, r);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = color || '#26313f';
  ctx.fillText(txt, x, y);
}
/* 画一条带刻度的马路 */
function drawRoad(lo, hi, y, unit) {
  var x0 = 34, x1 = cw - 34;
  ctx.strokeStyle = '#475569'; ctx.lineWidth = 10; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 3;
  ctx.setLineDash([16, 14]);
  ctx.beginPath(); ctx.moveTo(x0 + 6, y); ctx.lineTo(x1 - 6, y); ctx.stroke();
  ctx.setLineDash([]);
  var step = niceStep(hi - lo);
  ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2;
  ctx.font = 'bold 12px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#64748b'; ctx.textAlign = 'center';
  for (var v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    var x = x0 + (v - lo) / (hi - lo) * (x1 - x0);
    ctx.beginPath(); ctx.moveTo(x, y - 10); ctx.lineTo(x, y + 10); ctx.stroke();
    ctx.fillText((v >= 0 ? v : '') + (Math.abs(v) < 1 ? '' : ''), x, y + 24);
  }
  return { x0: x0, x1: x1, px: function (v) { return x0 + (v - lo) / (hi - lo) * (x1 - x0); } };
}
function drawBracket(xa, xb, y, label) {
  var a = Math.min(xa, xb), b = Math.max(xa, xb);
  ctx.strokeStyle = '#d9a800'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(a, y); ctx.lineTo(b, y);
  ctx.moveTo(a, y - 7); ctx.lineTo(a, y + 7);
  ctx.moveTo(b, y - 7); ctx.lineTo(b, y + 7);
  ctx.stroke();
  textLabel(label, (a + b) / 2, y - 18, 15, '#7a5b00', '#fff7d6');
}

function drawScene(simT) {
  var L = state.levels[state.cur];
  if (!L) return;
  ctx.clearRect(0, 0, cw, chh);
  /* 舞台背景 */
  ctx.fillStyle = pal.pl;
  ctx.fillRect(0, 0, cw, chh);
  if (L.type === 'A') drawA(L, simT);
  else if (L.type === 'B') drawB(L, simT);
  else if (L.type === 'C') drawC(L, simT);
  else if (L.type === 'D') drawD(L, simT);
}

/* ---- A 型场景 ---- */
function drawA(L, simT) {
  var t = L.task, y = chh * 0.58;
  var vNow, tNow;
  if (t.ask === 'v') { vNow = L.rt.sliderVal; tNow = t.t; }
  else if (t.ask === 't') { vNow = t.v; tNow = L.rt.sliderVal; }
  else { vNow = L.rt.sliderVal; }
  var maxDist;
  if (t.ask === 'v') maxDist = Math.max(t.d, (t.vMax || 60) * t.t);
  else if (t.ask === 't') maxDist = Math.max(t.d, t.v * (t.tMax || 12));
  else maxDist = Math.max(t.d, t.v1 * t.t1 + (t.vMax || 60) * t.t2);
  var road = drawRoad(0, maxDist, y, t.du);
  /* 起点与目标站 */
  emo('🏠', road.px(0), y - 34, 30);
  textLabel('出发站', road.px(0), y + 44, 13, '#46586c');
  emo('🏁', road.px(t.d), y - 36, 34);
  textLabel('目标站 ' + t.d + ' ' + t.du, road.px(t.d), y + 44, 13, '#c2410c');
  if (t.ask === 'v2') {
    var mid = t.v1 * t.t1;
    ctx.strokeStyle = '#8aa3b8'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(road.px(mid), y - 14); ctx.lineTo(road.px(mid), y + 14); ctx.stroke();
    textLabel('中转站 ' + mid + ' ' + t.du, road.px(mid), y - 60, 12, '#46586c');
  }
  /* 预览虚线（拖滑块实时看到“预计停在这里”） */
  var previewD;
  if (t.ask === 'v') previewD = vNow * tNow;
  else if (t.ask === 't') previewD = vNow * tNow;
  else previewD = t.v1 * t.t1 + vNow * t.t2;
  ctx.strokeStyle = 'rgba(38,49,63,.4)'; ctx.lineWidth = 3; ctx.setLineDash([8, 8]);
  ctx.beginPath(); ctx.moveTo(road.px(previewD), y - 66); ctx.lineTo(road.px(previewD), y + 18); ctx.stroke();
  ctx.setLineDash([]);
  textLabel('预计停在 ' + previewD + ' ' + t.du, road.px(previewD), y - 80, 13, '#46586c');
  /* 行驶中的车（按模拟时间推进） */
  var runD;
  if (t.ask === 'v2') {
    var leg1 = t.v1 * Math.min(simT, t.t1);
    var leg2 = simT > t.t1 ? (simT - t.t1) * vNow : 0;
    runD = Math.min(leg1 + leg2, previewD);
    emo(simT <= t.t1 ? '🚙' : t.hero.e, road.px(runD), y - 26, 32);
  } else {
    runD = Math.min(vNow * simT, previewD);
    emo(t.hero.e, road.px(runD), y - 26, 32);
  }
  if (L.rt.ran && simT > 0) {
    var final = t.ask === 'v2' ? previewD : vNow * tNow;
    var good = final === t.d;
    textLabel(good ? '😎 恰好到站！' : '停在了 ' + final + ' ' + t.du, road.px(runD), y - 96, 14, good ? '#15803d' : '#b45309', '#ffffff');
  }
}

/* ---- B 型场景 ---- */
function drawB(L, simT) {
  var t = L.task, y = chh * 0.6;
  var maxV = Math.max(t.v1, t.v2);
  var runT = t.flavor === 'time' ? L.rt.sliderVal : t.t;
  var lo = -maxV * (t.flavor === 'time' ? (t.tMax || 12) : t.t) - 40;
  var hi = t.D + maxV * (t.flavor === 'time' ? (t.tMax || 12) : t.t) + 40;
  var road = drawRoad(lo, hi, y, '米');
  /* 两座房子 */
  emo('🏠', road.px(0), y - 34, 30);
  textLabel(t.n1 + '家', road.px(0), y + 44, 13, '#46586c');
  emo('🏡', road.px(t.D), y - 34, 30);
  textLabel(t.n2 + '家（相距 ' + t.D + ' 米）', road.px(t.D), y + 44, 13, '#46586c');
  /* 两人位置 */
  var a1 = L.rt.arrows[0], a2 = L.rt.arrows[1];
  var pos = bPos(t.D, t.v1, t.v2, simT, [a1 || 'R', a2 || 'R']);
  var px1 = road.px(a1 ? pos.p1 : 0), px2 = road.px(a2 ? pos.p2 : t.D);
  /* 头顶方向箭头 */
  function arrowMark(x, a) {
    ctx.fillStyle = a ? pal.pd : '#b8c4d2';
    ctx.beginPath();
    if (!a) { ctx.arc(x, y - 78, 13, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#fff'; }
    else if (a === 'R') { ctx.moveTo(x - 14, y - 90); ctx.lineTo(x + 16, y - 78); ctx.lineTo(x - 14, y - 66); ctx.closePath(); ctx.fill(); return; }
    else { ctx.moveTo(x + 14, y - 90); ctx.lineTo(x - 16, y - 78); ctx.lineTo(x + 14, y - 66); ctx.closePath(); ctx.fill(); return; }
    ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('?', x, y - 78);
  }
  arrowMark(px1, a1); arrowMark(px2, a2);
  emo(t.e1, px1, y - 26, 34);
  emo(t.e2, px2, y - 26, 34);
  /* 距离横杆 */
  if (a1 && a2) {
    if (simT > 0) drawBracket(px1, px2, 34, '现在相距 ' + pos.dist + ' 米');
    else drawBracket(px1, px2, 34, '目标：' + t.target + ' 米');
  } else {
    textLabel('把两个方向牌都拖好，再按出发！', cw / 2, 30, 15, '#7a5b00', '#fff7d6');
  }
}

/* ---- C 型场景 ---- */
function drawC(L, simT) {
  var t = L.task, y = chh * 0.62;
  var road = drawRoad(0, t.maxKm, y, '千米');
  /* 甲城固定 */
  emo('🏙️', road.px(0), y - 40, 34);
  textLabel('甲城', road.px(0), y + 44, 13, '#46586c');
  /* 乙城（学生拖动的小旗） */
  var fx = road.px(L.rt.flagKm);
  ctx.strokeStyle = pal.pd; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(fx, y - 12); ctx.lineTo(fx, y - 76); ctx.stroke();
  emo('🚩', fx + 14, y - 74, 26);
  textLabel('乙城（可拖动）', fx, y + 44, 13, '#c2410c');
  /* 两趟列车 */
  var p1 = Math.min(t.v1 * simT, t.maxKm);
  var p2raw = L.rt.flagKm - t.v2 * simT;
  var p2 = Math.max(0, Math.min(p2raw, t.maxKm));
  emo(t.hero1, road.px(p1), y - 24, 32);
  ctx.save();
  ctx.translate(road.px(p2), y - 24);
  ctx.scale(-1, 1);
  emo(t.hero2, 0, 0, 32);
  ctx.restore();
  /* 常显信息 */
  textLabel('已行路程和 =(' + t.v1 + '+' + t.v2 + ')×' + t.t + '=' + t.walked + ' 千米', cw / 2, 22, 14, '#46586c', '#ffffff');
  if (simT > 0 && simT >= t.t - 1e-9) {
    var gapNow = L.rt.flagKm - t.walked;
    drawBracket(road.px(p1), road.px(p2), 52, '两车现在相距 ' + Math.abs(gapNow) + ' 千米（需要 ' + t.gap + ' 千米）');
  }
}

/* ---- D 型场景 ---- */
function drawD(L, simT) {
  var t = L.task;
  var filled = L.rt.slots.every(function (s) { return s !== null; });
  if (t.segs === 2) {
    /* 山坡：家 → 山顶 → 家（去回同路） */
    var yb = chh * 0.78, yp = chh * 0.3, x0 = 60, x1 = cw - 60, xm = (x0 + x1) / 2;
    ctx.strokeStyle = '#7c8794'; ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x0, yb); ctx.lineTo(xm, yp); ctx.lineTo(x1, yb); ctx.stroke();
    /* 上坡/下坡装饰箭头 */
    ctx.fillStyle = pal.pd;
    ctx.beginPath(); ctx.moveTo(xm - 26, yp + 20); ctx.lineTo(xm - 6, yp + 16); ctx.lineTo(xm - 18, yp + 4); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(xm + 26, yp + 20); ctx.lineTo(xm + 6, yp + 16); ctx.lineTo(xm + 18, yp + 4); ctx.closePath(); ctx.fill();
    emo('🏠', x0, yb + 22, 30);
    textLabel('家（起点和终点）', x0 + 6, yb + 48, 12, '#46586c');
    textLabel('⛰️ ' + t.hill + ' ' + t.L + ' ' + t.du, xm, yp - 26, 14, '#46586c');
    /* 小骑士位置：按两段速度行进 */
    var va = L.rt.slots[0] !== null ? L.rt.badges[L.rt.slots[0]].v : null;
    var vb = L.rt.slots[1] !== null ? L.rt.badges[L.rt.slots[1]].v : null;
    var wx, wy;
    if (!filled) { wx = x0; wy = yb - 18; }
    else {
      var ta = t.L / va, tb = t.L / vb, T = ta + tb;
      var tt = Math.min(simT, T);
      var f1 = Math.min(tt / ta, 1);
      var f2 = tt > ta ? (tt - ta) / tb : 0;
      if (f1 < 1) { wx = x0 + (xm - x0) * f1; wy = yb - 18 - (yb - yp - 18) * f1; }
      else { wx = xm + (x1 - xm) * f2; wy = yp - 18 + (yb - yp - 18) * f2; }
    }
    emo(t.hero, wx, wy, 32);
    textLabel('去时 ' + (va === null ? '?' : va) + ' ' + t.vu, (x0 + xm) / 2, yb + 6, 13, '#c2410c');
    textLabel('回时 ' + (vb === null ? '?' : vb) + ' ' + t.vu, (xm + x1) / 2, yb + 6, 13, '#15803d');
  } else {
    /* 三段平路 A→B→C→D */
    var y3 = chh * 0.62;
    var S = t.Larr[0] + t.Larr[1] + t.Larr[2];
    var road = drawRoad(0, S, y3, t.du);
    var marks = [0], acc = 0;
    for (var i = 0; i < 3; i++) { acc += t.Larr[i]; marks.push(acc); }
    var cityEmo = ['🏠', '🏫', '🌳', '🎪'];
    var cityName = ['A 地', 'B 地', 'C 地', 'D 地'];
    for (var c = 0; c < 4; c++) {
      emo(cityEmo[c], road.px(marks[c]), y3 - 40, 30);
      textLabel(cityName[c], road.px(marks[c]), y3 + 44, 13, '#46586c');
    }
    /* 行人位置：按各段速度推进 */
    var wx3 = road.px(0);
    if (filled) {
      var times = t.Larr.map(function (len, i2) { return len / L.rt.badges[L.rt.slots[i2]].v; });
      var T3 = times[0] + times[1] + times[2];
      var tt3 = Math.min(simT, T3), cum = 0, segIdx = 0, frac = 0;
      for (var s2 = 0; s2 < 3; s2++) {
        if (tt3 <= cum + times[s2]) { segIdx = s2; frac = (tt3 - cum) / times[s2]; break; }
        cum += times[s2];
      }
      var posKm = marks[segIdx] + t.Larr[segIdx] * frac;
      wx3 = road.px(posKm);
    }
    emo(t.hero, wx3, y3 - 24, 32);
    for (var q = 0; q < 3; q++) {
      var vq = L.rt.slots[q] !== null ? L.rt.badges[L.rt.slots[q]].v : '?';
      textLabel('第' + (q + 1) + '段 ' + vq + ' ' + t.vu, road.px((marks[q] + marks[q + 1]) / 2), y3 - 76, 13, '#c2410c');
    }
  }
}

/* =====================================================================
 * 出发动画与判定
 * ===================================================================== */
function startRun() {
  var L = state.levels[state.cur];
  var t = L.task;
  if (state.running) return;
  /* 出发前置检查 */
  if (t.type === 'B' && t.flavor === 'dir' && (L.rt.arrows[0] === null || L.rt.arrows[1] === null)) {
    showFeedback('no', '还差方向牌没安排好哦！把 ➡️ 或 ⬅️ 拖到两位小伙伴身上再出发。');
    soundNo();
    return;
  }
  if (t.type === 'D') {
    var filled = L.rt.slots.every(function (s) { return s !== null; });
    if (!filled) { showFeedback('no', '先把每一段的速度卡都放好，才能出发试跑！'); soundNo(); return; }
  }
  state.running = true;
  state.steps++; updateHud();
  $('btn-run').disabled = true;
  hideFeedback();
  var DUR = 2600;
  var t0 = performance.now();
  function frame(now) {
    var k = Math.min(1, (now - t0) / DUR);
    var sim = k * (t.type === 'B' ? (t.flavor === 'time' ? L.rt.sliderVal : t.t) : t.t);
    if (t.type === 'D') {
      var times;
      if (t.segs === 2) times = [t.L / L.rt.badges[L.rt.slots[0]].v, t.L / L.rt.badges[L.rt.slots[1]].v];
      else times = t.Larr.map(function (len, i) { return len / L.rt.badges[L.rt.slots[i]].v; });
      var T = times.reduce(function (a, b) { return a + b; }, 0);
      sim = k * T;
    }
    if (t.type === 'A' && t.ask !== 'v') {
      var totalT = t.ask === 't' ? L.rt.sliderVal : (t.t1 + t.t2);
      sim = k * totalT;
    }
    L.rt.sim = sim; L.rt.ran = true;
    drawScene(sim);
    if (k < 1) { state.raf = requestAnimationFrame(frame); }
    else { state.running = false; finishRun(); }
  }
  state.raf = requestAnimationFrame(frame);
}
function finishRun() {
  var L = state.levels[state.cur];
  var t = L.task;
  var r = evaluate(L);
  if (r.win) {
    L.solved = true;
    L.pts = L.revealed ? 1 : 2;
    state.pts += L.pts;
    updateHud();
    showFeedback('ok', '🎉 太棒了，第 ' + L.idx + ' 关通过！' + (L.revealed ? '（看过提示，获得 🌟）' : '（完全自己搞定，获得 ⭐⭐）') + '<br><b>解题思路：</b>' + t.expl);
    $('btn-run').style.display = 'none';
    $('btn-next').style.display = '';
    $('btn-next').textContent = state.cur >= state.levels.length - 1 ? '🎉 查看成绩' : '➡️ 下一关';
    burstSmall();
    soundWin();
  } else {
    $('btn-run').disabled = false;
    showFeedback('no', '再试一次！' + r.msg);
    soundNo();
  }
}
/* 各型判定（整数精确比较） */
function evaluate(L) {
  var t = L.task;
  if (t.type === 'A') {
    var finalD;
    if (t.ask === 'v') finalD = L.rt.sliderVal * t.t;
    else if (t.ask === 't') finalD = t.v * L.rt.sliderVal;
    else finalD = t.v1 * t.t1 + L.rt.sliderVal * t.t2;
    var winA = finalD === t.d;
    return { win: winA, msg: '现在车停在 ' + finalD + ' ' + t.du + '，目标是 ' + t.d + ' ' + t.du + '。' + (finalD > t.d ? '走多啦，调小一点试试！' : '还差一点，调大一点试试！') + '（路程=速度×时间）' };
  }
  if (t.type === 'B') {
    var runT = t.flavor === 'time' ? L.rt.sliderVal : t.t;
    var pos = bPos(t.D, t.v1, t.v2, runT, L.rt.arrows);
    var winB = pos.dist === t.target;
    var hintDir = (L.rt.arrows[0] === L.rt.arrows[1]) ? '你们现在是同向出发，试试想想「速度差」；' : '相向/背向都用「速度和」，同向才用「速度差」。';
    return { win: winB, msg: '走了 ' + runT + ' 分钟后两人相距 ' + pos.dist + ' 米，目标是 ' + t.target + ' 米。' + hintDir };
  }
  if (t.type === 'C') {
    var gapNow = L.rt.flagKm - t.walked;

var drag = null; /* { payload, ghost } */

}
function moveGhost(x, y) {

  drag.ghost.style.top = y + 'px';
  /* 高亮可放置的槽 */
  document.querySelectorAll('.dropzone.hot').forEach(function (d) { d.classList.remove('hot'); });

function zoneAt(x, y, kind) {

    els = document.elementsFromPoint(x, y);
  } else {
    var top = document.elementFromPoint(x, y);
    if (top) els = [top];
  }
  for (var i = 0; i < els.length; i++) {
    var el = els[i];
    if (el.getAttribute && el.getAttribute('data-drop') === kind) return el;
    if (el.closest && el.closest('[data-drop="' + kind + '"]')) return el.closest('[data-drop="' + kind + '"]');
  }

}
window.addEventListener('pointermove', function (ev) {
  if (!drag) { flagDragMove(ev); return; }
  moveGhost(ev.clientX, ev.clientY);
}, { passive: false });
window.addEventListener('pointerup', function (ev) {
  if (drag) {
    var zone = zoneAt(ev.clientX, ev.clientY, drag.payload.kind);
    document.querySelectorAll('.dropzone.hot').forEach(function (d) { d.classList.remove('hot'); });
    if (zone) dropPayload(drag.payload, zone);
    drag.ghost.remove();
    drag = null;

  }

window.addEventListener('pointercancel', function () {

function dropPayload(payload, zone) {
  var L = state.levels[state.cur];
  if (!L) return;
  var t = L.task;
  var idx = parseInt(zone.getAttribute('data-idx'), 10);
  if (payload.kind === 'arrow' && t.type === 'B') {
    L.rt.arrows[idx] = payload.v;
    zone.textContent = payload.v === 'R' ? '➡️ 向右' : '⬅️ 向左';

    var b = L.rt.badges[payload.idx];

 * ===================================================================== */
var fxc = $('fx'), fctx = fxc.getContext('2d');
var parts = [], fxUntil = 0, fxRaf = 0;
function fitFx() {
  fxc.width = window.innerWidth; fxc.height = window.innerHeight;
}
window.addEventListener('resize', fitFx);
fitFx();
var CONF_COLORS = ['#f97316', '#22c55e', '#3b82f6', '#eab308', '#ec4899', '#8b5cf6', '#14b8a6'];
function spawn(n, big) {
  var W = fxc.width, H = fxc.height;
  for (var i = 0; i < n; i++) {
    parts.push({
      x: Math.random() * W,
      y: big ? -20 - Math.random() * H * 0.3 : H * 0.35 + Math.random() * 40,
      vx: (Math.random() - 0.5) * (big ? 4 : 5),
      vy: big ? 2 + Math.random() * 3 : -(4 + Math.random() * 5),
      g: big ? 0.12 : 0.25,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.3,
      size: (big ? 8 : 6) + Math.random() * 8,
      color: pick(CONF_COLORS),
      shape: pick(['rect', 'circle', 'star'])
    });
  }
}
function starPathC(x, y, r, rot) {
  fctx.beginPath();
  for (var i = 0; i < 10; i++) {
    var ang = rot + i * Math.PI / 5 - Math.PI / 2;
    var rr = i % 2 === 0 ? r : r * 0.45;
    var px = x + Math.cos(ang) * rr, py = y + Math.sin(ang) * rr;
    if (i === 0) fctx.moveTo(px, py); else fctx.lineTo(px, py);
  }
  fctx.closePath();
}
function fxLoop(now) {
  if (now > fxUntil) {
    fctx.clearRect(0, 0, fxc.width, fxc.height);
    parts = [];
    fxRaf = 0;
    return;
  }
  fctx.clearRect(0, 0, fxc.width, fxc.height);
  parts = parts.filter(function (p) { return p.y < fxc.height + 40; });
  parts.forEach(function (p) {
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.rot += p.vr;
    fctx.fillStyle = p.color;
    if (p.shape === 'rect') {
      fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.rot);
      fctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66);
      fctx.restore();
    } else if (p.shape === 'circle') {
      fctx.beginPath(); fctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2); fctx.fill();
    } else {
      starPathC(p.x, p.y, p.size / 1.4, p.rot); fctx.fill();
    }
  });
  fxRaf = requestAnimationFrame(fxLoop);
}
function playFx(n, dur, big) {
  spawn(n, big);
  fxUntil = performance.now() + dur;
  if (!fxRaf) fxRaf = requestAnimationFrame(fxLoop);
}
