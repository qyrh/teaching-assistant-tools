<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>带余除法·宝石装袋工坊（第12讲 上）</title>
<style>
/* ============ 全局变量（每局随机换色板） ============ */
:root{
  --bg:#FFF6E9; --main:#F57C00; --soft:#FFD54F; --ink:#3E2A16; --panel:#FFFFFF;
  --ok:#1E9E5A; --warn:#E0447C;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;
  background:var(--bg); color:var(--ink); min-height:100vh; font-size:18px;
  transition:background .5s;
}
button{font-family:inherit; cursor:pointer;}
/* ============ 顶栏：标题 + 右上角计时/步数/星星 ============ */
#topbar{
  display:flex; align-items:center; flex-wrap:wrap; gap:10px;
  padding:10px 16px; background:var(--main); color:#fff;
  box-shadow:0 3px 0 rgba(0,0,0,.12); position:sticky; top:0; z-index:50;
}
#topbar .title{font-size:1.35rem; font-weight:900; letter-spacing:1px;}
#hud{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.hudpill{
  background:rgba(255,255,255,.22); border:2px solid rgba(255,255,255,.65);
  border-radius:999px; padding:4px 14px; font-weight:800; font-size:1.02rem; white-space:nowrap;
}
.topbtn{
  background:#fff; color:var(--main); border:none; border-radius:999px;
  padding:6px 14px; font-size:1rem; font-weight:800; box-shadow:0 2px 0 rgba(0,0,0,.18);
}
.topbtn:active{transform:translateY(2px); box-shadow:none;}
/* ============ 主区域 ============ */
#view{max-width:1080px; margin:0 auto; padding:14px 14px 60px;}
.card{
  background:var(--panel); border:4px solid var(--main); border-radius:22px;
  padding:18px; box-shadow:0 8px 0 var(--soft); margin-top:14px;
}
/* ============ 首页 ============ */
.home-title{text-align:center; font-size:2.2rem; font-weight:900; margin:16px 0 4px; color:var(--main);}
.home-sub{text-align:center; font-size:1.15rem; font-weight:700; opacity:.85; margin-bottom:8px;}
.diffgrid{display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-top:18px;}
.diffcard{
  flex:1 1 240px; max-width:320px; border-radius:24px; border:4px solid var(--main);
  background:linear-gradient(180deg,#fff 0%,var(--soft) 140%);
  padding:22px 16px; text-align:center; font-weight:900;
  box-shadow:0 8px 0 rgba(0,0,0,.15); transition:transform .12s;
}
.diffcard:active{transform:translateY(4px);}
.diffcard .dname{font-size:1.5rem; color:var(--main);}
.diffcard .ddesc{font-size:1rem; font-weight:700; margin-top:8px; color:var(--ink); opacity:.9;}
.diffcard svg{width:64px;height:64px;margin-bottom:6px;}
.tips{background:var(--panel); border:4px dashed var(--main); border-radius:18px; padding:14px 18px; margin-top:20px; font-weight:700; line-height:1.9;}
.tips .tt{color:var(--main); font-size:1.2rem; font-weight:900;}
/* ============ 题面 ============ */
.stagehead{display:flex; align-items:center; flex-wrap:wrap; gap:10px; margin:4px 0 10px;}
.stagetag{
  background:var(--main); color:#fff; border-radius:12px; padding:4px 14px;
  font-weight:900; font-size:1.12rem;
}
.dots{display:flex; gap:6px; margin-left:auto;}
.dot{width:16px;height:16px;border-radius:50%;border:3px solid var(--main);background:transparent;}
.dot.on{background:var(--main);}
.story{
  font-size:1.3rem; font-weight:800; line-height:1.85; background:var(--soft);
  border-radius:16px; padding:12px 18px; border:3px solid var(--main);
}
.hintbar{margin:10px 0 2px; display:flex; align-items:flex-start; gap:10px; flex-wrap:wrap;}
.hintbtn{
  border:3px solid var(--main); background:#fff; color:var(--main);
  border-radius:999px; padding:4px 14px; font-weight:800; font-size:1rem;
}
.hinttext{
  flex:1 1 320px; background:#fffbe8; border:3px dashed var(--main); border-radius:12px;
  padding:8px 14px; font-weight:700; line-height:1.8; display:none;
}
.hinttext.show{display:block;}
/* ============ 机关通用 ============ */
.machine{margin-top:12px; border:4px solid var(--main); border-radius:20px; padding:16px; background:#fff;}
.mrow{display:flex; gap:14px; flex-wrap:wrap; align-items:center; justify-content:center;}
.vault{
  min-width:220px; text-align:center; border:4px solid var(--main); border-radius:18px;
  background:linear-gradient(180deg,var(--soft),#fff); padding:10px 18px;
}
.vault .vnum{font-size:2.4rem; font-weight:900; color:var(--main); line-height:1.15;}
.vault .vlab{font-weight:800; font-size:1.05rem;}
.statline{font-size:1.18rem; font-weight:900; margin:10px 0; text-align:center;}
.statline b{color:var(--main); font-size:1.32rem;}
.bagsrow{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; min-height:66px; margin:8px 0;}
.bag{
  width:64px; height:60px; border:3px solid var(--main); border-radius:14px 14px 20px 20px;
  background:linear-gradient(180deg,#fff,var(--soft)); display:flex; flex-direction:column;
  align-items:center; justify-content:center; font-weight:900; animation:pop .25s;
}
.bag small{font-size:.78rem; opacity:.8;}
.bag span{font-size:1.15rem; color:var(--main);}
@keyframes pop{0%{transform:scale(.3);opacity:0;}100%{transform:scale(1);opacity:1;}}
.beadsrow{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; min-height:40px; align-items:center;}
.bead{
  width:32px;height:32px;border-radius:50%;border:3px solid #fff;
  background:radial-gradient(circle at 32% 30%, var(--soft), var(--main));
  box-shadow:0 2px 4px rgba(0,0,0,.25); cursor:pointer; touch-action:none;
}
/* ============ 操作按钮 ============ */
.controls{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:10px;}
.opbtn{
  border:3px solid var(--main); background:#fff; color:var(--main); border-radius:14px;
  padding:10px 18px; font-size:1.12rem; font-weight:900; box-shadow:0 4px 0 var(--soft);
}
.opbtn:active{transform:translateY(3px); box-shadow:none;}
.opbtn.gray{opacity:.45;}
.bigbtn{
  display:block; margin:16px auto 6px; border:none; border-radius:999px;
  background:linear-gradient(180deg,var(--main),var(--soft));
  color:#fff; font-size:1.4rem; font-weight:900; padding:14px 44px;
  box-shadow:0 6px 0 rgba(0,0,0,.2); text-shadow:0 1px 2px rgba(0,0,0,.3);
}
.bigbtn:disabled{filter:grayscale(.8); opacity:.5; box-shadow:none;}
.bigbtn.ready{animation:blink 1s infinite;}
@keyframes blink{50%{transform:scale(1.06);}}
.status{
  margin-top:10px; text-align:center; font-size:1.18rem; font-weight:900; min-height:1.8em;
}
.status.good{color:var(--ok);} .status.bad{color:var(--warn);} .status.info{color:var(--main);}
/* ============ 试商杆滑轨 ============ */
.railwrap{margin:14px 4px 6px; padding:0 34px;}
.rail{position:relative; height:58px; border-radius:999px; border:4px solid var(--main);
  background:linear-gradient(180deg,#fff,var(--soft)); touch-action:none;}
.rail .tick{position:absolute; top:0; bottom:0; width:3px; background:rgba(0,0,0,.14);}
.rail .ticklab{position:absolute; bottom:6px; transform:translateX(-50%); font-weight:900; font-size:.92rem;}
.handle{
  position:absolute; top:50%; transform:translate(-50%,-50%); width:66px; height:66px;
  border-radius:50%; border:4px solid #fff; background:var(--main); color:#fff;
  font-size:1.5rem; font-weight:900; display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 10px rgba(0,0,0,.3); cursor:grab;
}
.railzone{font-size:1.15rem; font-weight:900; text-align:center; margin:4px 0;}
/* ============ 余数盒 / 宝库 ============ */
.boxes{display:flex; gap:14px; justify-content:center; align-items:center; flex-wrap:wrap;}
.dropbox{
  min-width:210px; min-height:120px; border:4px dashed var(--main); border-radius:18px;
  background:#fff; text-align:center; padding:10px; transition:background .2s;
}
.dropbox.hot{background:var(--soft);}
.dropbox h4{margin:2px 0 6px; font-size:1.1rem; color:var(--main);}
.dropbox .cnt{font-size:2rem; font-weight:900;}
.dropbox .beadsrow{min-height:34px;}
.pile{
  width:120px;height:120px;border-radius:50%; border:4px solid var(--main);
  background:radial-gradient(circle at 35% 30%, var(--soft), var(--main));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;font-weight:900; cursor:grab; touch-action:none; box-shadow:0 4px 8px rgba(0,0,0,.25);
}
.pile .cnt{font-size:1.6rem;} .pile small{font-size:.85rem;}
/* ============ 钥匙墙 ============ */
.keywall{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin:10px 0;}
.key{
  width:88px; height:64px; border-radius:14px; border:4px solid var(--main);
  background:linear-gradient(180deg,#fff,var(--soft)); font-weight:900; text-align:center;
  cursor:grab; touch-action:none; box-shadow:0 4px 0 rgba(0,0,0,.15);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.key .kn{font-size:1.5rem; color:var(--main); line-height:1.1;}
.key small{font-size:.72rem; opacity:.75;}
.key.used{opacity:.28; cursor:default; filter:grayscale(1);}
.shake{animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.slot{
  width:150px; height:96px; border:5px dashed var(--main); border-radius:18px; margin:8px auto;
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  font-weight:900; font-size:1.05rem; color:var(--main); background:#fff;
  text-align:center; transition:background .2s;
}
.slot.hot{background:var(--soft);}
.ring{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:8px; min-height:56px;}
.gotkey{
  width:70px;height:52px;border-radius:12px;border:3px solid var(--ok); background:#e9fbf1;
  color:var(--ok); font-weight:900; font-size:1.3rem; display:flex;align-items:center;justify-content:center;
  animation:pop .3s;
}
/* ============ 四数之和 ============ */
.fourbox{display:flex; gap:10px; flex-wrap: wrap; justify-content:center;}
.fcell{border:3px solid var(--main); border-radius:14px; background:#fff; padding:8px 14px; text-align:center; min-width:104px;}
.fcell .fl{font-size:.95rem; font-weight:800; opacity:.75;}
.fcell .fv{font-size:1.55rem; font-weight:900; color:var(--main);}
.fcell.q .fv{color:var(--ink);}
.meterwrap{margin:14px auto 4px; max-width:640px;}
.meter{height:38px; border:4px solid var(--main); border-radius:999px; background:#fff; overflow:hidden; position:relative;}
.meterfill{height:100%; width:0%; background:linear-gradient(90deg,var(--soft),var(--main)); transition:width .5s;}
.meterlab{display:flex; justify-content:space-between; font-weight:900; font-size:1.05rem; margin-top:4px;}
/* ============ 过关面板 ============ */
.clearmask{
  position:absolute; inset:0; border-radius:20px; background:rgba(255,255,255,.94);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  z-index:20; animation:pop .35s; text-align:center; padding:14px;
}
.stagebox{position:relative;}
.stamp{
  border:5px solid var(--ok); color:var(--ok); border-radius:16px; padding:10px 26px;
  font-size:1.6rem; font-weight:900; transform:rotate(-3deg); background:#fff;
}
.ansbig{font-size:1.35rem; font-weight:900;}
/* ============ 结算 ============ */
.finish{text-align:center; padding:20px 8px;}
.finish h2{font-size:2.1rem; color:var(--main); margin:8px 0;}
.bigstars{display:flex; gap:8px; justify-content:center; margin:10px 0;}
.bigstars svg{width:58px;height:58px;}
.finstats{font-size:1.25rem; font-weight:900; margin:8px 0 16px;}
/* ============ 弹窗 ============ */
#modal{
  position:fixed; inset:0; background:rgba(30,20,5,.55); z-index:200;
  display:none; align-items:center; justify-content:center; padding:16px;
}
#modal.show{display:flex;}
.mpanel{
  background:#fff; border:5px solid var(--main); border-radius:22px; padding:20px 24px;
  max-width:680px; width:100%; max-height:84vh; overflow:auto; font-weight:700; line-height:1.95;
}
.mpanel h3{color:var(--main); font-size:1.45rem; margin:4px 0 10px;}
.mpanel .close{display:block; margin:14px auto 0; border:none; border-radius:999px; background:var(--main); color:#fff; font-size:1.2rem; font-weight:900; padding:10px 40px;}
.jiexi{background:var(--soft); border-radius:14px; padding:10px 16px; margin:8px 0; font-weight:800;}
/* ============ 拖拽幽灵层 / 特效层 ============ */
#ghostlayer{position:fixed; inset:0; pointer-events:none; z-index:300;}
#ghostlayer .ghost{position:fixed; transform:translate(-50%,-50%) scale(1.1); filter:drop-shadow(0 6px 8px rgba(0,0,0,.35));}
#fx{position:fixed; inset:0; pointer-events:none; z-index:400;}
/* ============ 响应式（移动端可玩） ============ */
@media (max-width:720px){
  body{font-size:16px;}
  .story{font-size:1.12rem;}
  #topbar .title{font-size:1.05rem;}
  .bag{width:52px;height:50px;} .bead{width:28px;height:28px;}
  .railwrap{padding:0 26px;} .handle{width:56px;height:56px;font-size:1.2rem;}
  .vault .vnum{font-size:1.9rem;}
  .key{width:76px;height:58px;} .key .kn{font-size:1.3rem;}
}
</style>
</head>
<body>

<!-- 顶栏：标题 + 计时/步数/星星 + 功能按钮（G4/G7） -->
<div id="topbar">
  <div class="title">带余除法 · 宝石装袋工坊</div>
  <div id="hud">
    <span class="hudpill" id="hudTime">时间 0:00</span>
    <span class="hudpill" id="hudSteps">步数 0</span>
    <span class="hudpill" id="hudStars">星星 0/0</span>
    <button class="topbtn" id="btnRules">规则说明</button>
    <button class="topbtn" id="btnReveal">揭示答案</button>
    <button class="topbtn" id="btnRestart">重新开始</button>
    <button class="topbtn" id="btnHome">返回难度选择</button>
  </div>
</div>

<div id="view"></div>

<!-- 拖拽幽灵层（拖动时跟随手指的影像） -->
<div id="ghostlayer"></div>
<!-- 彩纸 / 烟花特效画布（G5） -->
<canvas id="fx"></canvas>
<!-- 通用弹窗（规则 / 答案解析） -->
<div id="modal"><div class="mpanel" id="mpanel"></div></div>

<script>
"use strict";
/* ==========================================================
   带余除法进阶（上）· 宝石装袋工坊
   核心方法与机关深度绑定（G2）：
   1) 装袋机   —— 被除数 = 除数 × 商 + 余数（亲手装袋构造总数）
   2) 试商杆   —— 商 = (被除数 - 余数) ÷ 除数（拖滑杆试商，零散=余数）
   3) 钥匙墙   —— 先减余数变整除，再枚举因数找除数
   4) 勇者试炼 —— 被除数+除数+商+余数 的四数之和问题
   ========================================================== */

/* ---------- 小工具 ---------- */
function $(s){ return document.querySelector(s); }
function $$(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
function rnd(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
/* 求一个整数的全部因数（升序） */
function factors(n){
  var r=[];
  for(var i=1;i*i<=n;i++){ if(n%i===0){ r.push(i); if(i!==n/i) r.push(n/i); } }
  return r.sort(function(x,y){return x-y;});
}
/* 星星 SVG */
function starSVG(filled, size){
  var c = filled ? "var(--main)" : "#d8d8d8";
  return '<svg viewBox="0 0 24 24" width="'+(size||22)+'" height="'+(size||22)+'"><path fill="'+c+'" stroke="#fff" stroke-width="1" d="M12 1.8l3 6.3 6.9.9-5 4.7 1.3 6.8L12 17.2l-6.2 3.3L7.1 13.7l-5-4.7 6.9-.9z"/></svg>';
}

/* ---------- 随机色板（G8：每局换配色，多次玩不腻） ---------- */
var PALETTES = [
  {bg:"#FFF6E9", main:"#F57C00", soft:"#FFD54F", ink:"#3E2A16"},
  {bg:"#EDFBF3", main:"#1E9E5A", soft:"#9BDDB8", ink:"#12331F"},
  {bg:"#EAF4FF", main:"#1D7DDL", soft:"#A5CBF3", ink:"#10283F"},
  {bg:"#F4EFFB", main:"#7A4FD1", soft:"#C9B3F0", ink:"#241242"},
  {bg:"#FDEFF4", main:"#E0447C", soft:"#F6B3CB", ink:"#42101F"},
  {bg:"#FFFCE4", main:"#C79000", soft:"#F0E08A", ink:"#3A2E00"}
];
function applyPalette(){
  var p = pick(PALETTES);
  var r = document.documentElement.style;
  r.setProperty("--bg", p.bg); r.setProperty("--main", p.main);
  r.setProperty("--soft", p.soft); r.setProperty("--ink", p.ink);
}

/* ==========================================================
   题库：教参原题 + 每局随机生成的变式题（反重复机制）
   每题字段说明：
   t1: story/map/per(每袋颗数)/times(袋数)/r(零散) → 答案=per×times+r
   t2: story/map/N(总数)/bags(袋数)/r(余数)        → 答案=(N-r)÷bags
   t3: story/map/N/r/keys(候选)/valid(正确集合)/mode(list|count)
   t4: story/map/q(商)/r(余)/S(四数和)/d(除数)/keys
   ========================================================== */

/* ---------- 教参原题（【23】第12讲 带余除法进阶·上） ---------- */
function docxT1(){
  return [
    { type:"t1", src:"例1",
      story:"牛牛有一本故事书，每天读9页，读了23天之后发现还剩6页，这本故事书一共多少页？",
      map:"书的总页数=宝石总数(被除数)；读了23天=装23袋(除数)；每天读9页=每袋装9颗(商)；还剩6页=零散6颗(余数)",
      per:9, times:23, r:6 },
    { type:"t1", src:"练习1",
      story:"一个数被21除，商是9，余数是7，这个数是多少？",
      map:"这个数=宝石总数(被除数)；21=装21袋(除数)；商9=每袋装9颗；余数7=零散7颗",
      per:9, times:21, r:7 }
  ];
}
function docxT2(){
  return [
    { type:"t2", src:"例2",
      story:"丁丁有一本科普书，一共208页，他看了17天之后还剩4页，他前17天每天看多少页？",
      map:"总页数208=宝石总数(被除数)；17天=17个袋子(除数)；每天看的页数=每袋颗数(要求的商)；还剩4页=零散4颗(余数)",
      N:208, bags:17, r:4 },
    { type:"t2", src:"练习4",
      story:"316除以8，余数是4，商是多少？",
      map:"316=宝石总数(被除数)；除数8=8个袋子；商=每袋颗数(要求的)；余数4=零散4颗",
      N:316, bags:8, r:4 }
  ];
}
function docxT3(){
  return [
    { type:"t3", src:"练习3", mode:"list",
      story:"牛牛来闯第一关：50除以一个一位数，余数是2，请找出所有符合条件的一位数。",
      map:"50=宝石总数；余数2=先请出2颗零散；剩下的48颗能被哪把一位数钥匙整除、钥匙又大于2，哪把就是除数",
      N:50, r:2, keys:[2,3,4,5,6,7,8,9], valid:[3,4,6,8] },
    { type:"t3", src:"练习9", mode:"list",
      story:"田田来闯第三关：57除以一个数，余数是12，请找出所有符合条件的数。",
      map:"57=宝石总数；余数12=先请出12颗零散；剩下的45颗能被哪把钥匙整除、钥匙又大于12，哪把就是除数",
      N:57, r:12, keys:[15,45,9,5,20,30], valid:[15,45] },
    { type:"t3", src:"练习8", mode:"list",
      story:"68除以一个两位数，余数是12，请找出所有符合条件的两位数。",
      map:"68=宝石总数；余数12=先请出12颗零散；剩下的56颗能被哪把两位数钥匙整除、钥匙又大于12，哪把就是除数",

/* ---------- 变式题生成器（数值每局随机，保证重复可玩） ---------- */
var T1STORY = [
  "同学们收集智慧星，每盒装{p}颗，装满{t}盒后还剩{r}颗，一共收集了多少颗智慧星？",
  "搬运队运送小宝箱，每车装{p}个，运了{t}车后还剩{r}个，一共有多少个宝箱？",
  "图书馆整理绘本，每层放{p}本，放了{t}层后还剩{r}本，一共有多少本绘本？"
];
var T2STORY = [
  "果农摘了{N}个苹果，装进{d}个筐之后还剩{r}个，每个筐装了多少个苹果？",
  "文具店运来{N}支彩笔，平均分装到{d}个盒子里，最后还剩下{r}支，每个盒子装了多少支？",
  "小小志愿者折了{N}只纸鹤，穿成{d}串之后还剩{r}只，每串穿了多少只纸鹤？"
];
var T3STORY_LIST = [
  "{N}除以一个数，余数是{r}，请找出所有符合条件的数。",
  "闯关题：{N}除以一个数，余数是{r}，把所有符合条件的数都找出来吧！"
];
var T3STORY_COUNT = [
  "牛牛有{N}道练习题，如果每天做 a 道，第 b 天做完之后还剩{r}道，已知 a>{r}，那么 a 有多少种不同的取值？",
  "闯关题：有{N}颗宝石，每天装 a 颗进盒子，第 b 天装完后还剩{r}颗，已知 a>{r}，a 有多少种不同的取值？"
];
var T4STORY = [
  "被除数、除数、商与余数之和是{S}。已知商是{q}，余数是{r}，求被除数和除数。",
  "闯关题：一个数除以另一个数，商{q}，余数{r}，被除数、除数、商、余数的和是{S}，求被除数和除数。"
];
function fill(s, o){ return s.replace(/\{(\w+)\}/g, function(m,k){ return o[k]; }); }

/* 变式：求被除数 */
function genT1(level){
  var per = level==="easy" ? rnd(4,9) : rnd(6,12);
  var times = level==="easy" ? rnd(6,15) : rnd(15,30);
  var r = rnd(1, per-1);
  var total = per*times+r;
  return { type:"t1", src:"变式", per:per, times:times, r:r,
    story: fill(pick(T1STORY), {p:per, t:times, r:r}),
    map: "总数 = 每袋颗数"+per+" × 袋数"+times+" + 零散"+r+"；按故事把袋子装够、零散放对",
    ansText: total,
    jiexi: "宝石总数 = 每袋颗数 × 袋数 + 零散颗数 = "+per+"×"+times+"+"+r+" = "+total+"。" };
}
/* 变式：求商 */
function genT2(level){
  var n = level==="easy" ? rnd(6,14) : rnd(11,40);
  var d = level==="easy" ? rnd(4,12) : rnd(6,19);
  var r = rnd(1, Math.min(n-1,9));
  var N = d*n+r;
  return { type:"t2", src:"变式", N:N, bags:d, r:r,
    story: fill(pick(T2STORY), {N:N, d:d, r:r}),
    map: "总数"+N+" = 每袋颗数(要求的) × "+d+"袋 + 零散"+r+"；拖动滑杆让零散正好是"+r+"颗",
    ansText: n,
    jiexi: "商 = (被除数-余数) ÷ 除数 = ("+N+"-"+r+") ÷ "+d+" = "+n+"。" };
}
/* 变式：减余数后枚举因数（保证答案集合唯一） */
function genT3(level){
  var poolR = level==="easy" ? [24,36,48,40,30] : [60,72,84,90,96,120,108];
  var hi = level==="easy" ? 9 : 60;          /* 钥匙号上限，控制难度 */
  var R = pick(poolR), r = 0, valid = [], tries = 0;
  do{
    r = level==="easy" ? rnd(2,5) : rnd(9,15);
    valid = factors(R).filter(function(f){ return f>r && f<=hi; });
    tries++;
  } while(valid.length < 3 && tries < 40);   /* 确保正确钥匙不少于 3 把 */
  var N = R + r;
  /* 候选钥匙 = 全部正确钥匙 + 若干干扰项（干扰项必须真的不能整除 R） */
  var cand = valid.slice(), guard = 0;
  while(cand.length < valid.length+4 && guard < 300){
    guard++;
    var k = rnd(Math.max(2, r), hi);
    if(cand.indexOf(k) >= 0) continue;
    if(R % k === 0) continue;                /* 排除意外因数，保证答案集合唯一 */
    cand.push(k);
  }
  var mode = pick(["list","count"]);
  var q = { type:"t3", src:"变式", mode:mode, N:N, r:r, keys:shuffle(cand), valid:valid.slice(),
    story: mode==="list" ? fill(pick(T3STORY_LIST), {N:N, r:r}) : fill(pick(T3STORY_COUNT), {N:N, r:r}) };
  q.map = "先请出余数"+r+"颗，剩下"+R+"颗；能整除"+R+"、又大于"+r+"的钥匙都收集起来";
  q.ansText = mode==="list" ? valid.join("、") : valid.length + " 种（" + valid.join("、") + "）";
  q.jiexi = N+"-"+r+"="+R+"，"+R+"的因数有："+factors(R).join("、")+
    "；因为余数"+r+"必须小于除数，所以符合条件的只有："+valid.join("、")+
    (mode==="count" ? "，共 "+valid.length+" 种。" : "。");
  return q;
}
/* 变式：四数之和 */
function genT4(level){
  var q0 = rnd(12,45), r0 = rnd(6,60), d0 = rnd(23,88);
  while(r0 >= d0){ r0 = rnd(6,60); d0 = rnd(23,88); }
  var num = d0*q0+r0, S = num + d0 + q0 + r0;
  var keys = [d0], gaps = [-9,-6,-3,3,6], guard = 0;
  while(keys.length < 6 && guard < 120){
    guard++;
    var k = d0 + pick(gaps) + rnd(-2,2);
    if(k < 12 || keys.indexOf(k) >= 0) continue;
    keys.push(k);
  }
  var q = { type:"t4", src:"变式", q:q0, r:r0, S:S, d:d0, keys:shuffle(keys),
    story: fill(pick(T4STORY), {S:S, q:q0, r:r0}) };
  q.map = "除数=试的钥匙；被除数=钥匙×"+q0+"+"+r0+"；四数之和正好"+S+"就能开启宝箱";
  q.ansText = "被除数 " + num + "，除数 " + d0;
  q.jiexi = "被除数=除数×"+q0+"+"+r0+"，被除数+除数="+S+"-"+q0+"-"+r0+"="+(S-q0-r0)+
    "；所以 除数×"+(q0+1)+"+"+r0+"="+(S-q0-r0)+"，除数=("+(S-q0-r0)+"-"+r0+")÷"+(q0+1)+"="+d0+
    "，被除数="+d0+"×"+q0+"+"+r0+"="+num+"。";
  return q;
}

/* ---------- 抽样组卷：每局从题池随机抽取（不固定用前几道） ---------- */
function buildStages(diff){
  var plan = ["t1","t2","t3","t3"];
  if(diff==="hard"){ plan = ["t3","t3","t4","t4"]; }
  var pool = {
    t1: shuffle(docxT1().concat([genT1(diff), genT1(diff)])),
    t2: shuffle(docxT2().concat([genT2(diff), genT2(diff)])),
    t3: shuffle(docxT3().concat([genT3(diff), genT3(diff)])),
    t4: shuffle(docxT4().concat([genT4(diff), genT4(diff)]))
  };
  var used = {t1:0, t2:0, t3:0, t4:0};
  return plan.map(function(tp){
    var q = pool[tp][used[tp]]; used[tp]++;
    return finishQuestion(q);
  });
}
/* 补齐每题答案/算式/解析字段（教参原题按教参原文解析） */
function finishQuestion(q){
  if(q.type==="t1"){
    var total = q.per*q.times+q.r;
    q.ansText = total;
    q.formula = q.per+" × "+q.times+" + "+q.r+" = "+total;
    if(q.src==="例1"){ q.jiexi = "书的总页数相当于被除数，读书天数相当于除数，每天读的页数相当于商，剩余页数相当于余数：9×23+6=213(页)。"; }
    if(q.src==="练习1"){ q.jiexi = "被除数=除数×商+余数=21×9+7=196。"; }
  }
  if(q.type==="t2"){
    var n = (q.N - q.r) / q.bags;
    q.ansText = n;
    q.formula = "("+q.N+" - "+q.r+") ÷ "+q.bags+" = "+n;
    if(q.src==="例2"){ q.jiexi = "商=(被除数-余数)÷除数=(208-4)÷17=12(页)。"; }
    if(q.src==="练习4"){ q.jiexi = "商=(被除数-余数)÷除数=(316-4)÷8=39。"; }
  }
  if(q.type==="t3"){
    q.formula = q.N+" - "+q.r+" = "+(q.N-q.r)+"，再找 "+(q.N-q.r)+" 的因数（且大于 "+q.r+"）";
    if(q.src==="练习3"){ q.jiexi = "50-2=48，48的因数有1、2、3、4、6、8、12、16、24、48；除数是一位数且余数要小于除数，符合条件的有3、4、6、8。"; q.ansText="3、4、6、8"; }
    if(q.src==="练习9"){ q.jiexi = "57-12=45，45的因数有1、3、5、9、15、45；余数12必须小于除数，符合条件的只有15和45。"; q.ansText="15 和 45"; }
    if(q.src==="练习8"){ q.jiexi = "68-12=56，56=1×56=2×28=4×14=7×8；除数要大于12，符合条件的有14、28、56。"; q.ansText="14、28、56"; }
    if(q.src==="练习7"){ q.jiexi = "191-9=182，182的因数有1、2、7、13、14、26、91、182；其中大于9的有13、14、26、91、182，一共5种取值。"; q.ansText="5 种（13、14、26、91、182）"; }
    if(q.src==="例3"){ q.jiexi = "160-6=154，154的因数有1、2、7、11、14、22、77、154；其中大于6的有7、11、14、22、77、154，一共6种取值。"; q.ansText="6 种（7、11、14、22、77、154）"; }
    if(q.src==="练习5"){ q.jiexi = "5122-66=5056=64×79；余数66必须小于除数，64不行，所以这个两位数是79。"; q.ansText="79"; }
  }
  if(q.type==="t4"){
    var num = q.d*q.q+q.r;
    q.formula = "除数×"+(q.q+1)+"+"+q.r+" = "+(q.S-q.q-q.r);
    if(q.src==="练习2"){ q.jiexi = "被除数=除数×33+52；被除数+除数=2143-33-52=2058；所以除数×34+52=2058，除数=(2058-52)÷34=59，被除数=59×33+52=1999。"; q.ansText="被除数 1999，除数 59"; }
    if(q.src==="练习6"){ q.jiexi = "被除数=除数×18+33；被除数+除数=1034-18-33=983；所以除数×19+33=983，除数=(983-33)÷19=50，被除数=50×18+33=933。"; q.ansText="被除数 933，除数 50"; }
  }
  return q;
}

  '</div>'+
  '<button class="bigbtn" id="t1go">启动魔法封印</button>'+
  '<div class="status info" id="status">按故事把袋子装够、零散放对，再启动封印！</div>';

  var bowl = $("#t1bowl"), bagrow = $("#t1bags"), looserow = $("#t1loose");

  /* 画面刷新：袋子图标 / 零散珠子 / 碗里可拿的珠子 */
  function refresh(){
    $("#t1total").textContent = q.per*st.bags + st.loose;
    $("#t1b").textContent = st.bags;
    $("#t1l").textContent = st.loose;
    $("#bm1").classList.toggle("gray", st.bags<=0);
    var html = "", show = Math.min(st.bags, 22), i;
    for(i=0;i<show;i++){ html += '<div class="bag"><small>每袋</small><span>'+q.per+'颗</span></div>'; }
    if(st.bags > 22){ html += '<div class="bag"><small>还有</small><span>'+(st.bags-22)+'袋</span></div>'; }
    bagrow.innerHTML = html;
    /* 零散珠子（点了放回碗里） */
    var lh = "";
    for(i=0;i<st.loose;i++){ lh += '<div class="bead"></div>'; }
    looserow.innerHTML = lh;
    $$("#t1loose .bead").forEach(function(b){
      b.addEventListener("click", function(){
        st.loose--; bump(); refresh();
        setStatus("放回 1 颗零散宝石到碗里。","info");
      });
    });
    /* 碗里可拿的珠子数量 = 每袋颗数 - 零散（零散永远装不满一袋） */
    var remain = q.per - st.loose, bh = "";
    for(i=0;i<remain;i++){ bh += '<div class="bead"></div>'; }
    bowl.innerHTML = bh;
    $$("#t1bowl .bead").forEach(function(b){
      makeDraggable(b, {
        tap: function(){ addLoose(); },
        drop: function(zone){ if(zone==="vault"){ addLoose(); } }
      });
    });
  }
  /* 放一颗零散：余数必须小于每袋颗数，装到"快满一袋"就提醒 */
  function addLoose(){
    if(st.loose + 1 >= q.per){
      setStatus("零散的已经有 "+st.loose+" 颗，再放 1 颗就够装满一袋啦！先去装袋吧（余数要比每袋颗数小）。","bad");
      return;
    }
    st.loose++; bump(); refresh();
    setStatus("零散 "+st.loose+" 颗。","info");
  }
  function addBags(n){
    st.bags += n; if(st.bags<0) st.bags=0;
    bump(); refresh();
    if(st.bags>0){ setStatus("装了 "+n+" 袋（每袋 "+q.per+" 颗），现在合计 "+(q.per*st.bags+st.loose)+" 颗。","info"); }
  }
  $("#b1").addEventListener("click", function(){ addBags(1); });
  $("#b5").addEventListener("click", function(){ addBags(5); });
  $("#b10").addEventListener("click", function(){ addBags(10); });
  $("#bm1").addEventListener("click", function(){ addBags(-1); });
  /* 封印判定：袋数与零散都要和故事一致 */
  $("#t1go").addEventListener("click", function(){
    bump();
    if(st.bags !== q.times){
      setStatus("封印闪了闪：现在装了 "+st.bags+" 袋，再对照故事里的数字想想该装几袋？","bad");
      return;
    }
    if(st.loose !== q.r){
      setStatus("封印闪了闪：零散 "+st.loose+" 颗，故事里说的剩余数量是多少呢？","bad");
      return;
    }
    stageClear(q, "合计 "+q.per+" × "+q.times+" + "+q.r+" = "+q.ansText+"（颗）");
  });
  refresh();
}

/* ==========================================================
   机关二：试商杆（求商）
   拖动滑杆试"每袋装几颗"，袋子实时装珠，零散=余数；
   零散正好等于故事余数、且比每袋颗数小时才能点亮
   ========================================================== */
function renderT2(q){
  var maxN = Math.floor(q.N / q.bags) + 3;
  var st = { n: 1 };
  $("#machine").innerHTML =
  '<div class="mrow">'+
    '<div class="vault"><div class="vnum">'+q.N+'</div><div class="vlab">宝石总数（颗）</div></div>'+
    '<div style="flex:1;min-width:260px">'+
      '<div class="statline">共 <b>'+q.bags+'</b> 个袋子 ｜ 每袋 <b id="t2n">1</b> 颗 ｜ 零散 <b id="t2left">'+(q.N-q.bags)+'</b> 颗</div>'+
      '<div class="bagsrow" id="t2bags"></div>'+
      '<div class="beadsrow" id="t2dots"></div>'+
    '</div>'+
  '</div>'+
  '<div class="railzone">拖动圆把手，试试每袋装几颗 ——</div>'+
  '<div class="railwrap"><div class="rail" id="rail"><div class="handle" id="handle" style="left:0%">1</div></div></div>'+
  '<button class="bigbtn" id="t2go" disabled>点亮智慧灯</button>'+
  '<div class="status info" id="status">让袋子装走大部分宝石，零散剩下的要正好等于故事里的 '+q.r+' 颗哦！</div>';

  var rail = $("#rail"), handle = $("#handle");
  /* 画刻度：每 5 格标一个数字 */
  (function(){
    var html = "", v, p;
    for(v=1; v<=maxN; v++){
      p = (v-1)/(maxN-1)*100;
      html += '<div class="tick" style="left:'+p+'%"></div>';
      if(v%5===0 || v===1 || v===maxN){
        html += '<div class="ticklab" style="left:'+p+'%">'+v+'</div>';
      }
    }
    rail.insertAdjacentHTML("afterbegin", html);
  })();

  function refresh(){
    var i, left = q.N - q.bags*st.n;
    $("#t2n").textContent = st.n;
    $("#t2left").textContent = left < 0 ? "不够" : left;
    /* 袋子图标（袋子太多时折叠显示） */
    var html = "", show = Math.min(q.bags, 18);
    for(i=0;i<show;i++){ html += '<div class="bag"><small>每袋</small><span>'+st.n+'颗</span></div>'; }
    if(q.bags > 18){ html += '<div class="bag"><small>还有</small><span>'+(q.bags-18)+'袋</span></div>'; }
    $("#t2bags").innerHTML = html;
    /* 零散珠子点（封顶 20 个显示） */
    var dh = "", dots = Math.max(0, Math.min(left, 20));
    for(i=0;i<dots;i++){ dh += '<div class="bead"></div>'; }
    if(left > 20){ dh += '<b style="font-size:1.1rem">共 '+left+' 颗</b>'; }
    $("#t2dots").innerHTML = dh;
    /* 状态判定（把"余数<除数"和试商过程可视化） */
    var perfect = (left === q.r && st.n > q.r);
    $("#t2go").disabled = !perfect;
    $("#t2go").classList.toggle("ready", perfect);
    handle.style.left = ((st.n-1)/(maxN-1)*100) + "%";
    handle.textContent = st.n;
    if(perfect){
      setStatus("零散正好 "+q.r+" 颗，而且比每袋 "+st.n+" 颗少 —— 完美！点亮智慧灯吧！","good");
    } else if(left < 0){
      setStatus("每袋 "+st.n+" 颗要装 "+(q.bags*st.n)+" 颗，超过总数 "+q.N+" 啦，往回调一点。","bad");
    } else if(left >= st.n){
      setStatus("装完还剩 "+left+" 颗，比每袋 "+st.n+" 颗还多，说明还能再装一袋！继续调大试试。","bad");
    } else {
      setStatus("装完还剩 "+left+" 颗零散。故事里说剩 "+q.r+" 颗，再调调每袋颗数。","info");
    }
  }
  /* 滑杆拖动（指针事件，鼠标和触摸都能用） */
  var dragging = false, lastN = 1;
  function posToN(clientX){
    var r = rail.getBoundingClientRect();
    var t = (clientX - r.left) / Math.max(1, r.width);
    t = Math.max(0, Math.min(1, t));
    return 1 + Math.round(t*(maxN-1));
  }
  rail.addEventListener("pointerdown", function(e){
    dragging = true; lastN = st.n;
    st.n = posToN(e.clientX); refresh();
    e.preventDefault();
  });
  document.addEventListener("pointermove", function(e){
    if(!dragging || !rail.isConnected) return;
    var n = posToN(e.clientX);
    if(n !== st.n){ st.n = n; refresh(); }
  });
  document.addEventListener("pointerup", function(){
    if(dragging && rail.isConnected){
      dragging = false;
      if(st.n !== lastN){ bump(); }
    } else { dragging = false; }
  });
  $("#t2go").addEventListener("click", function(){
    bump();
    stageClear(q, "每袋颗数 ("+q.N+" - "+q.r+") ÷ "+q.bags+" = "+q.ansText+"（颗）");
  });
  refresh();
}

/* ==========================================================
   机关三：钥匙墙（求除数）
   第一步把余数颗宝石从宝库请进余数盒（减余数变整除）；
   第二步试钥匙：能整除剩下颗数、又大于余数的钥匙才能开宝格
   ========================================================== */
function renderT3(q){
  var st = { moved:0, got:[] };
  $("#machine").innerHTML =
  '<div class="boxes">'+
    '<div class="pile" id="pile" title="拖动宝石到余数盒，或点击移入 1 颗"><span class="cnt" id="pileCnt">'+q.N+'</span><small>宝库剩余（颗）</small></div>'+
    '<div style="display:flex;flex-direction:column;gap:8px;align-items:center">'+
      '<div class="dropbox" data-drop="box" id="box"><h4>余数盒（应放 '+q.r+' 颗）</h4>'+
        '<div class="cnt" id="boxCnt">0</div><div class="beadsrow" id="boxDots"></div></div>'+
      '<div class="controls" style="margin:0">'+
        '<button class="opbtn" id="m1">移入 1 颗</button>'+
        '<button class="opbtn" id="m10">移入 10 颗</button>'+
        '<button class="opbtn gray" id="mb1">移回 1 颗</button>'+
      '</div>'+
    '</div>'+
  '</div>'+
  '<div class="status info" id="p1status">第一步：把余数 '+q.r+' 颗从宝库请进余数盒，剩下的才能整齐装袋！</div>'+
  '<hr style="border:none;border-top:3px dashed var(--soft);margin:14px 0">'+
  '<div style="text-align:center;font-weight:900;font-size:1.15rem">钥匙墙（钥匙号 = 每袋颗数 = 除数）—— 拖到试锁孔，或直接点击试一试</div>'+
  '<div class="slot" data-drop="slot" id="slot"><span>试锁孔</span><small>把钥匙放这里</small></div>'+
  '<div class="keywall" id="keywall"></div>'+
  '<div style="text-align:center;font-weight:900">钥匙环：已收集 <span id="gotCnt" style="color:var(--main)">0</span> / '+q.valid.length+' 把</div>'+
  '<div class="ring" id="ring"></div>'+
  '<div class="status info" id="status"></div>';

  /* 钥匙卡片（顺序每局打乱） */
  var wall = $("#keywall");
  q.keys.forEach(function(k){
    var el = document.createElement("div");
    el.className = "key";
    el.innerHTML = '<div class="kn">'+k+'</div><small>号钥匙</small>';
    wall.appendChild(el);
    makeDraggable(el, {
      canDrag: function(){ return st.moved === q.r; },
      tap: function(){ testKey(k, el); },
      drop: function(zone){ if(zone==="slot"){ testKey(k, el); } }
    });
  });
  /* 宝库整堆可拖：拖到余数盒 = 移入 1 颗 */
  makeDraggable($("#pile"), {
    canDrag: function(){ return true; },
    tap: function(){ moveIn(1); },
    drop: function(zone){ if(zone==="box"){ moveIn(1); } }
  });
  $("#m1").addEventListener("click", function(){ moveIn(1); });
  $("#m10").addEventListener("click", function(){ moveIn(10); });
  $("#mb1").addEventListener("click", function(){ moveIn(-1); });

  function moveIn(n){
    st.moved += n;
    if(st.moved < 0) st.moved = 0;
    if(st.moved > q.r + 20) st.moved = q.r + 20;
    bump(); refresh();
  }
  function refresh(){
    var remain = q.N - st.moved, i;
    $("#pileCnt").textContent = remain;
    $("#boxCnt").textContent = st.moved;
    var dots = Math.min(st.moved, 20), dh = "";
    for(i=0;i<dots;i++){ dh += '<div class="bead"></div>'; }
    if(st.moved > 20){ dh += '<b>共 '+st.moved+' 颗</b>'; }
    $("#boxDots").innerHTML = dh;
    $("#gotCnt").textContent = st.got.length;
    /* 余数没请对之前，钥匙墙保持灰暗 */
    var ready = (st.moved === q.r);
    $$("#keywall .key").forEach(function(k){ k.style.opacity = ready ? "" : ".35"; });
    $("#slot").style.opacity = ready ? "" : ".4";
    if(!ready){
      var msg = st.moved < q.r
        ? "余数盒里是 "+st.moved+" 颗，还差 "+(q.r-st.moved)+" 颗，继续请！"
        : "余数盒放了 "+st.moved+" 颗，超过了 "+q.r+" 颗，移回去一些吧！";
      $("#p1status").textContent = msg;
      $("#p1status").className = "status bad";
    } else {
      $("#p1status").innerHTML = "太棒了！余数 "+q.r+" 颗请出来了，剩下 <b>"+remain+"</b> 颗正好可以整除装袋，去试钥匙吧！";
      $("#p1status").className = "status good";
    }
  }
  /* 试钥匙：余数规则 + 整除判定 */
  function testKey(k, el){
    if(st.moved !== q.r){
      $("#slot").classList.add("shake");
      setTimeout(function(){ $("#slot").classList.remove("shake"); }, 420);
      setStatus("先把余数 "+q.r+" 颗请进余数盒，钥匙墙才会亮起来哦！","bad");
      return;
    }
    bump();
    if(st.got.indexOf(k) >= 0){
      setStatus(k+" 号钥匙已经收集过啦，试试别的。","info");
      return;
    }
    var R = q.N - q.r;
    if(k <= q.r){
      el.classList.add("shake");
      setTimeout(function(){ el.classList.remove("shake"); }, 420);
      setStatus(k+" 号钥匙不大于余数 "+q.r+" —— 余数必须比除数小，这把不行！","bad");
      return;
    }
    if(R % k !== 0){
      el.classList.add("shake");
      setTimeout(function(){ el.classList.remove("shake"); }, 420);
      setStatus("用 "+k+" 颗一袋试装："+R+" ÷ "+k+" 装不平整（会余 "+(R%k)+" 颗），换一把试试！","bad");
      return;
    }
    /* 正确钥匙飞进钥匙环 */
    st.got.push(k);
    el.classList.add("used");
    el.style.opacity = "";
    var gk = document.createElement("div");
    gk.className = "gotkey";
    gk.textContent = k;
    $("#ring").appendChild(gk);
    setStatus("叮！"+k+" 号钥匙开启了一个宝格（"+R+" ÷ "+k+" = "+(R/k)+"，正好装完）！","good");
    confettiBurst(50);
    refresh();
    if(st.got.length === q.valid.length){
      setTimeout(function(){
        var ansLine = q.mode === "count"
          ? "a 共有 "+q.valid.length+" 种取值："+q.valid.join("、")
          : "符合条件的除数："+q.valid.join("、");
        stageClear(q, ansLine);
      }, 700);
    }
  }
  refresh();
}

/* ==========================================================
   机关四：勇者试炼（四数之和）
   换不同除数钥匙试锁：被除数=钥匙×商+余数，
   四数之和正好等于目标 S 时宝箱开启
   ========================================================== */
function renderT4(q){
  $("#machine").innerHTML =
  '<div class="fourbox">'+
    '<div class="fcell"><div class="fl">被除数</div><div class="fv" id="fnum">？</div></div>'+
    '<div class="fcell"><div class="fl">除数</div><div class="fv" id="fdiv">？</div></div>'+
    '<div class="fcell q"><div class="fl">商</div><div class="fv">'+q.q+'</div></div>'+
    '<div class="fcell q"><div class="fl">余数</div><div class="fv">'+q.r+'</div></div>'+
  '</div>'+
  '<div class="meterwrap">'+
    '<div class="meter"><div class="meterfill" id="mfill"></div></div>'+
    '<div class="meterlab"><span id="mnow">当前总和 0</span><span>目标总和 '+q.S+'</span></div>'+
  '</div>'+
  '<div style="text-align:center;font-weight:900;font-size:1.15rem">把「除数钥匙」放进试锁孔，让四个数的总和正好等于 '+q.S+'！</div>'+
  '<div class="slot" data-drop="slot4" id="slot4"><span>试锁孔</span><small>放除数钥匙</small></div>'+
  '<div class="keywall" id="keywall"></div>'+
  '<div class="status info" id="status">钥匙可以反复试，总和进度条会告诉你离目标还差多少。</div>';

  var wall = $("#keywall");
  q.keys.forEach(function(k){
    var el = document.createElement("div");
    el.className = "key";
    el.innerHTML = '<div class="kn">'+k+'</div><small>号除数钥匙</small>';
    wall.appendChild(el);
    makeDraggable(el, {
      tap: function(){ testKey(k); },
      drop: function(zone){ if(zone==="slot4"){ testKey(k); } }
    });
  });
  function testKey(k){
    bump();
    var num = k*q.q + q.r;
    var sum = num + k + q.q + q.r;
    $("#fnum").textContent = num;
    $("#fdiv").textContent = k;
    $("#mfill").style.width = Math.min(100, Math.round(sum/q.S*100)) + "%";
    $("#mnow").textContent = "当前总和 " + sum;
    if(sum === q.S){
      setStatus("轰隆隆……宝箱开启！除数 "+k+"，被除数 "+num+"，四数之和正好 "+q.S+"！","good");
      confettiBurst(80);
      setTimeout(function(){
        stageClear(q, "除数 "+q.d+"，被除数 "+(q.d*q.q+q.r));
      }, 800);
    } else if(sum > q.S){
      setStatus("总和 "+sum+"，比目标 "+q.S+" 大了 "+(sum-q.S)+"，换小一点的钥匙试试。","bad");
    } else {
      setStatus("总和 "+sum+"，比目标 "+q.S+" 小了 "+(q.S-sum)+"，换大一点的钥匙试试。","bad");
    }
  }
}

/* ==========================================================
   过关流程：盖章 + 答案 + 星星 + 彩纸 + 下一关（G4/G5）
   ========================================================== */
function stageClear(q, ansLine){
  state.stars++;
  updateHUD();
  confettiBurst(140);
  var last = (state.cur === state.stages.length - 1);
  var card = $("#stageCard");
  var mask = document.createElement("div");
  mask.className = "clearmask";
  mask.innerHTML =
    '<div style="font-size:1.6rem;font-weight:900;color:var(--main)">关卡点亮！ '+starSVG(true,34)+'</div>'+
    '<div class="stamp">'+q.formula+'</div>'+
    '<div class="ansbig">答案：'+ansLine+'</div>'+
    '<div style="font-weight:800;font-size:1.05rem;max-width:640px">'+(q.src==="变式"?"同题型变式":"教参"+q.src+"原题")+'解析：'+q.jiexi+'</div>'+
    '<button class="bigbtn" id="nextBtn">'+(last ? "查看闯关成果" : "进入下一关")+'</button>';
  card.appendChild(mask);
  $("#nextBtn").addEventListener("click", function(){
    if(last){ showFinish(); }
    else { state.cur++; renderStage(); }
  });
}

function showFinish(){
  state.finished = true;
  stopTimer();
  var secs = elapsedSec(), i;
  var stars = "";
  for(i=0;i<state.stages.length;i++){ stars += starSVG(true,58); }
  $("#view").innerHTML =
  '<div class="card finish stagebox">'+
    '<h2>全部关卡点亮！</h2>'+
    '<div class="bigstars">'+stars+'</div>'+
    '<div class="finstats">'+DIFF_NAME[state.diff]+' ｜ 收集 '+state.stars+' 颗星星 ｜ 用时 '+fmtTime(secs)+' ｜ 共 '+state.steps+' 步</div>'+
    '<div style="font-weight:800;font-size:1.15rem;margin-bottom:14px">你已掌握：被除数=除数×商+余数、商=(被除数-余数)÷除数、先减余数再枚举因数、四数之和妙算！</div>'+
    '<div class="controls" style="justify-content:center">'+
      '<button class="opbtn" id="againBtn">再玩一次（题目会重新抽）</button>'+
      '<button class="opbtn" id="backBtn">返回难度选择</button>'+
    '</div>'+
  '</div>';
  $("#againBtn").addEventListener("click", function(){ startGame(state.diff); });
  $("#backBtn").addEventListener("click", showHome);
  fireworks(5);   /* 通关烟花庆祝 */
}

/* ==========================================================
   通用指针拖拽系统（鼠标 + 触摸统一，G1/G11）
   轻点 = tap；拖到投放区 = drop
   ========================================================== */
var drag = { on:false, ghost:null, sx:0, sy:0, moved:false, opt:null };
function makeDraggable(el, opt){
  el.style.touchAction = "none";
  el.addEventListener("pointerdown", function(e){
    if(opt.canDrag && !opt.canDrag()){ return; }
    drag.on = true; drag.moved = false; drag.opt = opt;
    drag.sx = e.clientX; drag.sy = e.clientY;
    drag.ghost = el.cloneNode(true);
    drag.ghost.classList.add("ghost");
    drag.ghost.style.left = e.clientX + "px";
    drag.ghost.style.top = e.clientY + "px";
    $("#ghostlayer").appendChild(drag.ghost);
    e.preventDefault();
  });
}
/* 命中检测：指针正下方的投放区 */
function zoneAt(x, y){
  var els = $$("[data-drop]");
  for(var i=0;i<els.length;i++){
    var r = els[i].getBoundingClientRect();
    if(x>=r.left && x<=r.right && y>=r.top && y<=r.bottom){
      return { el: els[i], name: els[i].dataset.drop };
    }
  }
  return null;
}
document.addEventListener("pointermove", function(e){
  if(!drag.on || !drag.ghost) return;
  if(Math.abs(e.clientX-drag.sx)>6 || Math.abs(e.clientY-drag.sy)>6){ drag.moved = true; }
  drag.ghost.style.left = e.clientX + "px";
  drag.ghost.style.top = e.clientY + "px";
  $$(".hot").forEach(function(h){ h.classList.remove("hot"); });
  var z = zoneAt(e.clientX, e.clientY);
  if(z){ z.el.classList.add("hot"); }
});
document.addEventListener("pointerup", function(e){
  if(!drag.on){ return; }
  var opt = drag.opt, ghost = drag.ghost, moved = drag.moved;
  drag.on = false; drag.opt = null; drag.ghost = null;
  $$(".hot").forEach(function(h){ h.classList.remove("hot"); });
  if(ghost && ghost.parentNode){ ghost.parentNode.removeChild(ghost); }
  if(!opt){ return; }
  if(!moved){
    /* 原地轻点 */
    if(opt.tap){ opt.tap(); }
    return;
  }
  /* 拖动结束：落在投放区则触发 drop */
  var z = zoneAt(e.clientX, e.clientY);
  if(z && opt.drop){ opt.drop(z.name); }
});
document.addEventListener("pointercancel", function(){
  drag.on = false; drag.opt = null;
  if(drag.ghost && drag.ghost.parentNode){ drag.ghost.parentNode.removeChild(drag.ghost); }
  drag.ghost = null;
  $$(".hot").forEach(function(h){ h.classList.remove("hot"); });
});

/* ==========================================================
   彩纸 & 烟花（Canvas 特效，G5）
   ========================================================== */
var fx = $("#fx"), fctx = fx.getContext("2d");
var parts = [], fxRun = false;
function fxResize(){ fx.width = window.innerWidth; fx.height = window.innerHeight; }
window.addEventListener("resize", fxResize); fxResize();
var FXCOLORS = ["#F57C00","#FFD54F","#1E9E5A","#1D7DDL","#E0447C","#7A4FD1"];
function confettiBurst(n){
  var i;
  for(i=0;i<n;i++){
    parts.push({
      x: fx.width/2 + rnd(-140,140), y: fx.height*0.35,
      vx: rnd(-6,6), vy: rnd(-11,-3), g: 0.25,
      w: rnd(6,12), h: rnd(8,16), rot: Math.random()*6.28, vr: rnd(-0.2,0.2),
      c: pick(FXCOLORS), life: rnd(60,110), shape: "rect"
    });
  }
  fxLoop();
}
function fireworks(seconds){
  var t0 = Date.now();
  var iv = setInterval(function(){
    var cx = rnd(Math.round(fx.width*0.15), Math.round(fx.width*0.85));
    var cy = rnd(Math.round(fx.height*0.15), Math.round(fx.height*0.5));
    var col = pick(FXCOLORS), i, a, sp;
    for(i=0;i<36;i++){
      a = Math.random()*6.28; sp = rnd(2,5.5);
      parts.push({ x:cx, y:cy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, g:0.06,
        w:4, h:4, rot:0, vr:0, c:col, life:rnd(40,70), shape:"dot" });
    }
    fxLoop();
    if(Date.now()-t0 > seconds*1000){ clearInterval(iv); }
  }, 420);
}
function fxLoop(){
  if(fxRun){ return; }
  fxRun = true;
  requestAnimationFrame(function step(){
    fctx.clearRect(0,0,fx.width,fx.height);
    var i, p;
    for(i=parts.length-1;i>=0;i--){
      p = parts[i];
      p.x += p.vx; p.y += p.vy; p.vy += p.g; p.rot += p.vr; p.life--;
      if(p.life <= 0 || p.y > fx.height+30){ parts.splice(i,1); continue; }
      fctx.save();
      fctx.translate(p.x, p.y); fctx.rotate(p.rot);
      fctx.fillStyle = p.c;
      fctx.globalAlpha = Math.min(1, p.life/30);
      if(p.shape === "rect"){ fctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); }
      else { fctx.beginPath(); fctx.arc(0,0,p.w/2+1,0,6.29); fctx.fill(); }
      fctx.restore();
    }
    if(parts.length){ requestAnimationFrame(step); }
    else { fxRun = false; fctx.clearRect(0,0,fx.width,fx.height); }
  });
}
