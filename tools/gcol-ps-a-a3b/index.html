<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:linear-gradient(165deg,#f2f6ff,#e9f0fb);min-height:100vh;color:#2c3a52}
header{padding:18px 22px 10px;background:rgba(255,255,255,.72);border-bottom:2px solid #d5e0f0;position:sticky;top:0;z-index:10}
h1{font-size:20px}h1 small{font-size:12px;color:#7c8aa5;font-weight:normal;margin-left:8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.chip{padding:5px 12px;border-radius:14px;border:1px solid #c6d4ea;background:#fff;font-size:13px;cursor:pointer;color:#45566f}
.chip.on{background:#3a7bd5;color:#fff;border-color:#3a7bd5}
input.q{padding:6px 10px;border-radius:14px;border:1px solid #c6d4ea;font-size:13px;min-width:150px;flex:1;max-width:260px}
main{padding:16px 22px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.card{background:#fff;border-radius:12px;padding:12px 14px;border:1px solid #e3eaf5;box-shadow:0 2px 6px rgba(40,60,120,.06);cursor:pointer;transition:transform .12s}
.card:hover{transform:translateY(-2px)}
.card .t{font-size:15px;font-weight:600;margin-bottom:4px}
.card .j{font-size:12px;color:#7c8aa5;min-height:32px}
.card .tags{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}
.card .tg{font-size:11px;background:#eef3fb;color:#3a6bb5;border-radius:8px;padding:2px 8px}
.empty{grid-column:1/-1;text-align:center;color:#8b98ad;padding:40px 0}
#stage{position:fixed;inset:0;background:#fff;z-index:100;display:none;flex-direction:column}
#stage.on{display:flex}
#stageF{flex:1;border:0;width:100%}
#stageBar{display:flex;align-items:center;gap:12px;padding:8px 14px;background:#f0f4fb;border-bottom:1px solid #dbe4f2}
#stageBar button{padding:6px 14px;border:none;border-radius:8px;background:#3a7bd5;color:#fff;font-size:14px;cursor:pointer}
#stageBar .n{font-size:14px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
footer{padding:10px 22px 26px;font-size:12px;color:#93a1b7}
</style>

var st={grade:"全部",q:""};
var bar=document.getElementById("bar"),grid=document.getElementById("grid");
var grades=["全部"].concat(Object.keys(G.reduce(function(a,g){if(g.grade)a[g.grade]=1;return a;},{})).sort());
grades.forEach(function(g){var c=document.createElement("button");c.className="chip"+(g===st.grade?" on":"");c.textContent=g;
 c.onclick=function(){st.grade=g;bar.querySelectorAll(".chip").forEach(function(x){x.classList.remove("on")});c.classList.add("on");render();};bar.appendChild(c);});
var q=document.createElement("input");q.className="q";q.placeholder="搜索：讲次/游戏名/知识点";q.oninput=function(){st.q=this.value.trim();render();};bar.appendChild(q);
function render(){
 grid.innerHTML="";
 var hit=G.filter(function(g){return (st.grade==="全部"||g.grade===st.grade)&&(!st.q||(g.jiaocan+g.name+g.unit).indexOf(st.q)>=0);});
 if(!hit.length){grid.innerHTML='<div class="empty">没有匹配的游戏</div>';return;}
 hit.forEach(function(g){
  var c=document.createElement("div");c.className="card";
  var t=document.createElement("div");t.className="t";t.textContent=g.name;
  var j=document.createElement("div");j.className="j";j.textContent=g.jiaocan;
  var tg=document.createElement("div");tg.className="tags";
  [g.grade||"通用",g.unit].concat(g.kinds||[]).filter(Boolean).forEach(function(x){var s=document.createElement("span");s.className="tg";s.textContent=x;tg.appendChild(s);});
  c.appendChild(t);c.appendChild(j);c.appendChild(tg);
  c.onclick=function(){open(g);};grid.appendChild(c);});
}
var stage=document.getElementById("stage"),stageF=document.getElementById("stageF"),stName=document.getElementById("stName");
function open(g){
 stName.textContent=g.name+"（"+g.jiaocan+"）";
 stageF.src=g.file;stage.classList.add("on");
}
document.getElementById("back").onclick=function(){stage.classList.remove("on");stageF.src="about:blank";};
render();
