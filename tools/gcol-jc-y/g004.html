<script>"use strict";function rndInt(a,b){return a+Math.floor(Math.random()*(b-a+1))}function choice(arr){return arr[Math.floor(Math.random()*arr.length)]}function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}function fmt(v){return Number.isInteger(v)?String(v):v.toFixed(1)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function $(id){return document.getElementById(id)}const PALETTES=[{name:"阳光橙",main:"#F57C00",dark:"#B45309",light:"#FFF3E0",bg:"#FFFBEF",ink:"#4E342E",accent:"#1E88E5"},{name:"海洋蓝",main:"#0277BD",dark:"#01579B",light:"#E1F5FE",bg:"#F4FBFF",ink:"#263238",accent:"#F4511E"},{name:"森林绿",main:"#2E7D32",dark:"#1B5E20",light:"#E8F5E9",bg:"#F6FBF6",ink:"#1B2E1B",accent:"#8E24AA"},{name:"葡萄紫",main:"#6A1B9A",dark:"#4A148C",light:"#F3E5F5",bg:"#FCF6FD",ink:"#311B92",accent:"#00838F"},{name:"樱花粉",main:"#C2185B",dark:"#880E4F",light:"#FCE4EC",bg:"#FFF7FA",ink:"#4A148C",accent:"#00695C"},{name:"星空青",main:"#00695C",dark:"#004D40",light:"#E0F2F1",bg:"#F2FBF9",ink:"#00332B",accent:"#E65100"}];let P=PALETTES[0];const G={diff:null,levelIdx:0,level:null,stars:0,steps:0,startT:0,timerId:null,revealed:false,drag:null,tweens:[]};const CW=960,CH=430,PAD=55,DPR=Math.max(1,window.devicePixelRatio||1);const cv=$("stage"),ctx=cv.getContext("2d");cv.width=CW*DPR;cv.height=CH*DPR;cv.style.aspectRatio=CW+"/"+CH;ctx.scale(DPR,DPR);function canvasPos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*CW/r.width,y:(e.clientY-r.top)*CH/r.height}}function makeObj(o){const base={kind:"star",label:"",x:o.home.x,y:o.home.y,home:o.home,color:P.accent,hw:26,hh:26,hidden:false,locked:false,planted:false,anim:null,tip:""};return Object.assign(base,o)}function hitObj(o,p){return Math.abs(p.x-o.x)<=o.hw&&Math.abs(p.y-o.y)<=o.hh}function vx(L,v){return PAD+(v-L.lo)*L.upp}function px2v(L,x){return(x-PAD)/L.upp+L.lo}function calcUpp(L){L.upp=(CW-2*PAD)/(L.hi-L.lo)}function drawAxis(L){const y=L.axisY;ctx.strokeStyle=P.ink;ctx.lineWidth=3;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(PAD-34,y);ctx.lineTo(CW-PAD+34,y);ctx.stroke();ctx.beginPath();ctx.moveTo(CW-PAD+34,y);ctx.lineTo(CW-PAD+20,y-8);ctx.lineTo(CW-PAD+20,y+8);ctx.closePath();ctx.fillStyle=P.ink;ctx.fill();for(let k=Math.ceil(L.lo*2);k<=Math.floor(L.hi*2);k++){const v=k/2,x=vx(L,v),isInt=k%2===0;ctx.strokeStyle=P.ink;ctx.lineWidth=isInt?2.5:1.5;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+(isInt?14:8));ctx.stroke();if(isInt&&L.showNums){ctx.fillStyle=P.ink;ctx.font="bold 17px system-ui";ctx.textAlign="center";ctx.fillText(fmt(v),x,y+34)}}}function drawStarShape(x,y,r,color){ctx.beginPath();for(let i=0;i<10;i++){const ang=-Math.PI/2+i*Math.PI/5,rr=i%2===0?r:r*.45;const px2=x+rr*Math.cos(ang),py=y+rr*Math.sin(ang);if(i===0)ctx.moveTo(px2,py);else ctx.lineTo(px2,py)}ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.strokeStyle="rgba(0,0,0,.35)";ctx.lineWidth=1.5;ctx.stroke()}function drawFlagShape(x,baseY,label,color){ctx.strokeStyle=P.ink;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,baseY);ctx.lineTo(x,baseY-40);ctx.stroke();ctx.beginPath();ctx.moveTo(x,baseY-40);ctx.lineTo(x+34,baseY-32);ctx.lineTo(x,baseY-24);ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.strokeStyle="rgba(0,0,0,.3)";ctx.lineWidth=1.5;ctx.stroke();if(label){ctx.fillStyle="#fff";ctx.font="bold 15px system-ui";ctx.textAlign="center";ctx.fillText(label,x+12,baseY-28)}}function drawCarShape(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle="#FDD835";ctx.strokeStyle="#333";ctx.lineWidth=2;roundRect(-24,-14,48,18,5);ctx.fill();ctx.stroke();roundRect(-14,-24,24,12,4);ctx.fill();ctx.stroke();ctx.fillStyle="#1565C0";roundRect(-9,-21,14,8,2);ctx.fill();ctx.fillStyle="#333";ctx.beginPath();ctx.arc(-13,6,6,0,7);ctx.fill();ctx.beginPath();ctx.arc(13,6,6,0,7);ctx.fill();ctx.fillStyle="#fff";ctx.font="bold 9px system-ui";ctx.textAlign="center";ctx.fillText("TAXI",6,-2);ctx.restore()}function roundRect(x,y,w,h,r){ctx.beginP -this.a+" 个单位长度处，再数数格。")}}else if(this.stage===2&&o===this.ansStar){if(Math.abs(val-this.bVal)<=.3){this.marks.push({kind:"star",val:this.bVal,color:"#F9A825"});toast("完全正确！点 B 表示的数是 "+this.bVal+"。");bounce(o);completeLevel()}else{bounce(o);toast("从原点 0 出发数一数：B 离 0 有几格？在正方向一侧还是负方向一侧？")}}},draw(){drawAxis(this);drawMark({kind:"dot",val:this.a,label:"A",color:"#E53935"},this);if(this.stage>=1)drawMark({kind:"dot",val:this.bVal,label:"B",color:"#1E88E5"},this)},answerLine(){return"原点在 A 右边 "+-this.a+" 个单位处；B 在 A 右边 "+this.d+" 个单位处，B = "+this.a+" + "+this.d+" = "+this.bVal+"。"},final(){return"知道一个点表示的数，就能确定原点：A 表示 "+this.a+"，说明原点在 A 右边 "+-this.a+" 个单位长度处。再数格读 B：从 "+this.a+" 向右数 "+this.d+" 格，得 B = "+this.bVal+"。标好原点、认清正方向，读数就有底气！"}};const L3={id:"L3",title:"出租车去哪儿",src:"改编自本讲「刷基础」第 3 题（点平移后表示的数）",axisY:300,showNums:true,build(){this.lo=-6;this.hi=8;calcUpp(this);this.a0=choice([3,4,5,6]);this.marks=[];this.done=false;this.cpTotal=1;this.pVal=null;this.car=makeObj({kind:"car",home:{x:vx(this,this.a0),y:this.axisY-26},hw:30,hh:26});this.objs=[this.car]},panel(){return{prompt:"点 A 表示的数是 <b>"+this.a0+"</b>，出租车就停在 A 处。将点 A 沿数轴<b>向左移动 a 个单位长度（a &gt; "+this.a0+"）</b>得到点 P。请把出租车拖到「<b>点 P 可能的位置</b>」上（只要位置可能，停下就算挑战成功）。<span class='hint'>提示：P = "+this.a0+" − a，而 a 比 "+this.a0+" 大，那 P 是正数还是负数呢？</span>",status:"把出租车拖到点 P 可能的位置"}},onDrop(o,val){if(o!==this.car||this.done)return;if(val<-.4){this.pVal=Math.round(val*2)/2;glide(this.car,this,this.pVal,26);toast("很好！P = "+this.a0+" − a < 0，只要是负数位置都可能。");completeLevel()}else if(val>this.a0){bounce(o);toast("题目是向左移动哦，别忘了 a 比 "+this.a0+" 大！")}else{bounce(o);toast("再想想：a > "+this.a0+"，P = "+this.a0+" − a 一定小于几？")}},draw(){drawAxis(this);ctx.fillStyle="#E53935";ctx.beginPath();ctx.arc(vx(this,this.a0),this.axisY,7,0,7);ctx.fill();ctx.fillStyle="#E53935";ctx.font="bold 18px system-ui";ctx.textAlign="center";ctx.fillText("A",vx(this,this.a0),this.axisY-16);if(this.pVal!==null){const x1=vx(this,this.a0),x2=vx(this,this.pVal),y=this.axisY+52;ctx.s ;i<=hi;i++)ints.push(i);break}}if(ints.length===0){a=-5;b=3.5;for(let i=Math.ceil(a);i<=Math.floor(b);i++)ints.push(i)}this.a=a;this.b=b;this.ints=ints;this.found=[];this.lo=-7;this.hi=7;calcUpp(this);this.done=false;this.cpTotal=ints.length;this.sparkles=[];this.cloth=makeObj({kind:"cloth",home:{x:CW/2,y:130},hw:40,hh:30});this.objs=[this.cloth]},panel(){return{prompt:"李想写作业时不慎把墨水滴在了数轴上，深色墨迹盖住了一段（数轴的单位长度是 1）。请拖动 <b>抹布</b> 在墨迹上来回擦一擦，把被盖住的 <b>整数</b> 一个个找出来！<span class='hint'>把抹布拖到刻度线附近（对准整数点），该整数就会显现。把全部整数找齐就通关。</span>",status:"已找到 "+this.found.length+" / "+this.ints.length+" 个整数"}},onDragMove(o,val){if(o!==this.cloth||this.done)return;for(let i=0;i<this.ints.length;i++){const n=this.ints[i];if(this.found.indexOf(n)<0&&Math.abs(val-n)<.45){this.found.push(n);this.sparkles.push({val:n,t:0});toast("找到一个整数："+n+"！");refreshPanel();if(this.found.length>=this.ints.length){toast("全部找到！被墨迹盖住的整数共 "+this.ints.length+" 个。");completeLevel();return}}}},onDrop(){},draw(){drawAxis(this);const x1=vx(this,this.a),x2=vx(this,this.b),y=this.axisY;ctx.fillStyle="#37474F";ctx.beginPath();ctx.moveTo(x1-6,y-26);ctx.bezierCurveTo(x1+30,y-46,x2-60,y-48,x2+8,y-28);ctx.bezierCurveTo(x2+16,y-6,x2-20,y+12,x2-6,y+30);ctx.bezierCurveTo(x1+40,y+40,x1-10,y+34,x1-8,y+14);ctx.closePath();ctx.fill();ctx.fillStyle="#455A64";ctx.beginPath();ctx.arc((x1+x2)/2,y-32,12,0,7);ctx.fill();ctx.beginPath();ctx.arc(x1+(x2-x1)*.25,y+22,9,0,7);ctx.fill();this.found.forEach(n=>{const x=vx(this,n);ctx.strokeStyle="#66BB6A";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,y-30);ctx.lineTo(x,y+20);ctx.stroke();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x,y-44,15,0,7);ctx.fill();ctx.strokeStyle="#2E7D32";ctx.lineWidth=3;ctx.stroke();ctx.fillStyle="#2E7D32";ctx.font="bold 16px system-ui";ctx.textAlign="center";ctx.fillText(String(n),x,y-38)});for(let i=this.sparkles.length-1;i>=0;i--){const s=this.sparkles[i];s.t++;if(s.t>40){this.sparkles.splice(i,1);continue}ctx.globalAlpha=1-s.t/40;drawStarShape(vx(this,s.val),this.axisY s.ans,color:"#00ACC1"});toast("正确！"+this.k+" 与 "+this.ans+" 关于折痕对称，折叠后重合。");bounce(o);completeLevel()}else{bounce(o);toast("与 "+this.k+" 重合的点在折痕另一侧同样远的地方：2 × "+this.mid+" − "+this.k+" = ？")}}},draw(){drawAxis(this);const y=this.axisY,mk=this.mergeK;const xm=vx(this,this.m),xn=vx(this,this.n),xf=vx(this,this.mid);const mx=xm+(xf-xm)*mk,nx=xn+(xf-xn)*mk;ctx.globalAlpha=1-mk*.5;ctx.fillStyle="#E53935";ctx.beginPath();ctx.arc(mx,y,7,0,7);ctx.fill();ctx.font="bold 18px system-ui";ctx.textAlign="center";ctx.fillText(String(this.m),mx,y-16);ctx.fillStyle="#1E88E5";ctx.beginPath();ctx.arc(nx,y,7,0,7);ctx.fill();ctx.fillText(String(this.n),nx,y-16);ctx.globalAlpha=1;if(mk>.95){ctx.fillStyle="#C62828";ctx.beginPath();ctx.arc(xf,y,9,0,7);ctx.fill();ctx.strokeStyle="rgba(198,40,40,"+(1-mk)+")";ctx.lineWidth=3;ctx.beginPath();ctx.arc(xf,y,9+(mk-.95)*400,0,7);ctx.stroke()}if(this.stage===2){const xk=vx(this,this.k);ctx.fillStyle="#6A1B9A";ctx.beginPath();ctx.arc(xk,y,7,0,7);ctx.fill();ctx.fillStyle="#6A1B9A";ctx.font="bold 18px system-ui";ctx.textAlign="center";ctx.fillText(String(this.k),xk,y-16)}},answerLine(){return"折痕表示的数 = ("+this.m+" + "+this.n+") ÷ 2 = "+this.mid+"；与 "+this.k+" 重合的数 = 2 × "+this.mid+" − "+this.k+" = "+this.ans+"。"},final(){return"折叠重合的原理：折痕是对称轴，重合的两点到折痕的距离相等。先求折痕（中点）：("+this.m+" + "+this.n+") ÷ 2 = "+this.mid+"；再利用对称性：与 "+this.k+" 重合的数 = 2 × "+this.mid+" − "+this.k+" = "+this.ans+"。（原题：−2 与 6 重合时折痕是 2，与 3 重合的数 = 2×2 − 3 = 1。）"}};const L8={id:"L8",title:"中点关系三兄弟",src:"改编自本讲「刷提升」第 4 题（「中点关系」分类讨论）",axisY:300,showNums:true,build(){this.k=choice([2,3]);this.A=-this.k;this.B=this.k;this.sols=[0,3*this.k,-3*this.k];this.lo=-3*this.k-3;this.hi=3*this.k+3;calcUpp(this);this.got=[];this.marks=[];this.done=false;this.cpTotal=3;this.cflag=makeObj({kind:"flag",label:"C",tip:"C 旗",home:{x:CW/2,y:382},color:"#FB8C00",hw:30,hh:34});this.objs=[this.cflag]},panel(){return{prompt:"规定：三个点中，若<b>恰好有一个点到另外两个点的距离相等</b>，就称这三点满足「<b>中点关系</b>」。已知点 A、B 表示的数分别为 <b>"+this.A+"</b>、<b>"+t
