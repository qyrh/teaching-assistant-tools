ackground:var(--pl);border-radius:12px;padding:14px 18px;margin-top:14px;font-size:20px;line-height:1.9}.analysis .big{font-size:26px;font-weight:800;color:var(--pd)}.checkline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.flag{border-radius:999px;padding:3px 14px;font-size:18px;font-weight:800}.flag.ok{background:#2E7D32;color:#fff}.flag.no{background:#E53935;color:#fff}.term-badges{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:14px 0}.tbadge{background:#fff;border:3px solid var(--pm);border-radius:12px;padding:10px 14px;font-size:20px;font-weight:700;text-align:center}.tbadge .d{display:block;font-size:24px;color:#C05600;font-weight:900;margin-top:4px}.tbadge.eq{border-color:#2E7D32;background:#EAF7EB}.collection{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:10px;min-height:56px}.cpill{background:#EAF7EB;border:3px solid #2E7D32;color:#1B5E20;border-radius:12px;padding:8px 14px;font-size:24px;font-weight:800}.cpill sup{font-size:.62em}.answer-banner{background:#FFF3CD;border:3px solid #C05600;border-radius:12px;padding:12px 16px;font-size:19px;line-height:1.8;margin:12px 0;color:#5D3A00}.seq-line{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}.seq-item{background:#fff;border:2px solid var(--pd);border-radius:10px;padding:8px 12px;font-size:22px;font-weight:700;color:var(--pd)}.seq-item sup{font-size:.6em}.done-star{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:46px;font-weight:900;color:#C05600;background:#fff;border:5px solid var(--pa);border-radius:20px;padding:20px 40px;z-index:600;animation:pop .45s ease;box-shadow:0 10px 30px rgba(0,0,0,.25)}@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}70%{transform:translate(-50%,-50%) scale(1.15)}100%{transform:translate(-50%,-50%) scale(1)}}.shake{animation:shake .45s}@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform: <body>
<div id="app">

  <!-- ============ 难度选择页 ============ -->
  <section id="screen-diff">
    <div class="diff-title">整式魔法工坊</div>
    <div class="diff-sub">苏科版七年级上册 · 3.3 整式的加减 · 课时1 整式</div>
    <div class="diff-tip">全程拖动操作：按住卡片或数字块拖进虚线框；也可以先点亮数字块，再点虚线框放入。</div>
    <div class="diff-list">
      <button class="diff-btn" data-level="1">
        <span class="tag">初级</span>
        <h2>分拣小屋</h2>
        <p>把代数式卡片拖进正确的收纳箱，认清单项式、多项式与"不是整式"。</p>
      </button>
      <button class="diff-btn" data-level="2">
        <span class="tag">中级</span>
        <h2>装配车间</h2>
        <p>拖动指数块与系数块，亲手装配出符合次数、系数要求的单项式。</p>
      </button>
      <button class="diff-btn" data-level="3">
        <span class="tag">高级</span>
        <h2>调参塔</h2>
        <p>调节字母指数，让多项式同时满足次数、项数、系数的苛刻要求。</p>
      </button>
    </div>
  </section>

  <!-- ============ 游戏页 ============ -->
  <section id="screen-game" class="hidden">
    <header id="hud">
      <div id="hud-title">整式魔法工坊</div>
      <div id="hud-stats">用时 <span id="timer">00:00</span> · 步数 <span id="steps">0</span></div>
      <div id="hud-btns">
        <button class="hbtn ghostb" id="btn-rules">规则</button>
        <button class="hbtn" id="btn-reveal">揭示答案</button>
        <button class="hbtn ghostb" id="btn-restart">重新开始</button>
        <button class="hbtn ghostb" id="btn-back">返回难度选择</button>
      </div>
    </header>
    <main id="stage"></main>
  </section>

  <!-- ============ 规则弹窗 ============ -->
  <div id="modal-rules" class="modal hidden">
    <div class="modal-card">
      <h2 id="rules-title">玩法说明</h2>
      <div class="rule-body" id="rules-body"></div>
      <div class="ops"><button class="btn" id="btn-rules-start">开始闯关</button></div>
    </div>
  </div>

  <!-- ============ 通关弹窗 ============ -->
  <div id="modal-win" class="modal hidden">
    <div class="modal-card">
      <canvas id="confetti"></canvas>
      <h2 style="position:relative;">闯关成功！</h2>
      <div class="win-stars" style="position:relative;"><span>★</span><span>★</span><span>★</span></div>
      <div class="win-stats" style="position:relative;" id="win-stats"></div>
      <div class="ops" style="position:relative;">
        <button class="btn" id="btn-win-again">再来一局（同难度）</button>
        <button class="btn alt" id="btn-win-back">返回难度选择</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script>(function(){"use strict";function $(s){return document.querySelector(s)}function $all(s){return Array.prototype.slice.call(document.querySelectorAll(s))}function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}function pick(a){return a[Math.floor(Math.random()*a.length)]}function el(html){var d=document.createElement("div");d.innerHTML=html.trim();return d.firstChild}function sup(n){return n===1?"":"<sup>"+n+"</sup>"}function getCss(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}var PALETTES=[{main:"#1565C0",dark:"#0D47A1",light:"#DCEBFB",accent:"#FFB300",bg:"#F2F8FF",text:"#12263A"},{main:"#2E7D32",dark:"#1B5E20",light:"#DFF2E0",accent:"#FF7043",bg:"#F4FBF4",text:"#14301B"},{main:"#D84315",dark:"#8F2500",light:"#FFE4D5",accent:"#0288D1",bg:"#FFF7F2",text:"#3A1B10"},{main:"#6A1B9A",dark:"#4A148C",light:"#EFE1F7",accent:"#FFA726",bg:"#FAF4FD",text:"#2E1044"},{main:"#00695C",dark:"#004D40",light:"#D6F0EC",accent:"#EC407A",bg:"#F1FBF9",text:"#0B2E29"},{main:"#AD1457",dark:"#77003E",light:"#FBE0EB",accent:"#26A69A",bg:"#FEF5F9",text:"#3D0A24"}];function applyPalette(){var p=pick(PALETTES);var r=document.documentElement.style;r.setProperty("--pm",p.main);r.setProperty("--pd",p.dark);r.setProperty("--pl",p.light);r.setProperty("--pa",p.accent);r.setProperty("--pg",p.bg);r.setProperty("--pt",p.text)}var G={level:null,timer:0,timerId:null,steps:0,won:false};var currentReveal=null;function fmtTime(t){var m=Math.floor(t/60),s=t%60;return(m<10?"0":"")+m+":"+(s<10?"0":"")+s}function startTimer(){stopTimer();G.timer=0;$("#timer").textContent="00:00";G.timerId=setInterval(function(){G.timer++;$("#timer").textContent=fmtTime(G.timer)},1e3)}function stopTimer(){if(G.timerId){clearInterval(G.timerId);G.timerId=null}}function addStep(){G.steps++;$("#steps").textContent=String(G.steps)}var toastTid=null;function toast(msg,kind){var t=$("#toast");t.textContent=msg;t.
