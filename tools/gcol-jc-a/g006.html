<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>不等式的应用·智慧调度站</title>
<style>
/* ============ 全局与主题变量 ============ */
:root{
  --primary:#1976d2; --primary-dark:#0d47a1; --accent:#ffb300;
  --bg:#eaf4fb; --card:#ffffff; --ink:#1a2b3c; --line:#d7e3ee;
  --ok:#2e7d32; --bad:#c62828; --okbg:#e8f5e9; --badbg:#fdecea;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  background:var(--bg); color:var(--ink); font-size:17px; line-height:1.6;
}
#app{ max-width:1020px; margin:0 auto; padding:10px 12px 60px; }
.hidden{ display:none !important; }

/* ============ 顶栏 ============ */
#topbar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--card); border:3px solid var(--primary); border-radius:16px;
  padding:10px 14px; margin-bottom:12px; box-shadow:0 4px 0 var(--primary-dark);
}
#topbar .logo{ font-size:22px; font-weight:800; color:var(--primary-dark); white-space:nowrap; }
#topbar .sub{ font-size:15px; color:#607080; flex:1 1 160px; min-width:140px; }
.stat-chip{
  background:var(--primary); color:#fff; border-radius:12px; padding:4px 12px;
  font-size:17px; font-weight:700; white-space:nowrap;
}
.btn{
  border:none; border-radius:12px; padding:10px 16px; font-size:17px; font-weight:700;
  cursor:pointer; background:#eceff1; color:var(--ink); min-height:46px;
}
.btn:active{ transform:translateY(2px); }
.btn.primary{ background:var(--primary); color:#fff; box-shadow:0 4px 0 var(--primary-dark); }
.btn.primary:active{ box-shadow:0 1px 0 var(--primary-dark); }
.btn.warn{ background:var(--accent); color:#4a3200; }
.btn.big{ font-size:20px; padding:12px 26px; }

/* ============ 难度菜单 ============ */
#scene-menu{ text-align:center; }
#scene-menu h1{
  font-size:34px; color:var(--primary-dark); margin:18px 0 6px; letter-spacing:2px;
}
#scene-menu .tagline{ font-size:18px; color:#5a6a7a; margin-bottom:22px; }
.diff-cards{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
.diff-card{
  flex:1 1 240px; max-width:300px; background:var(--card); border:4px solid var(--primary);
  border-radius:18px; padding:22px 16px; cursor:pointer; transition:transform .15s;
  box-shadow:0 6px 0 var(--primary-dark);
}
.diff-card:hover{ transform:translateY(-4px); }
.diff-card .icon{ font-size:44px; }
.diff-card h2{ margin:8px 0 4px; font-size:24px; color:var(--primary-dark); }
.diff-card .dname{ display:inline-block; background:var(--primary); color:#fff; border-radius:10px; padding:2px 12px; font-size:16px; margin-bottom:8px; }
.diff-card p{ margin:6px 0 0; font-size:16px; color:#4a5a6a; }
.menu-note{ margin-top:22px; font-size:16px; color:#7a8a9a; }

/* ============ 游戏场景通用 ============ */
#level-head{
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;
  margin-bottom:10px;
}
#level-head .lv-title{ font-size:22px; font-weight:800; color:var(--primary-dark); }
#level-head .lv-step{ font-size:17px; color:#5a6a7a; }
.progress-outer{ background:#cfd8dc; border-radius:10px; height:14px; margin-bottom:12px; overflow:hidden; }
.progress-inner{ background:linear-gradient(90deg,var(--primary),var(--accent)); height:100%; width:0; border-radius:10px; transition:width .4s; }
#qcard{
  background:var(--card); border:3px solid var(--primary); border-radius:14px;
  padding:14px 16px; margin-bottom:12px; font-size:18px; line-height:1.75;
}
#qcard .qtag{ display:inline-block; background:var(--accent); color:#4a3200; font-weight:700; border-radius:8px; padding:1px 10px; margin-right:8px; font-size:16px; }
#stage{ background:var(--card); border:3px dashed var(--primary); border-radius:14px; padding:16px; margin-bottom:12px; }
#feedback{ min-height:52px; border-radius:12px; padding:10px 14px; margin-bottom:12px; font-size:18px; font-weight:700; background:#eceff1; }
#feedback.good{ background:var(--okbg); color:var(--ok); border:2px solid var(--ok); }
#feedback.bad{ background:var(--badbg); color:var(--bad); border:2px solid var(--bad); }
#feedback.info{ background:#e3f2fd; color:var(--primary-dark); border:2px solid var(--primary); }
#btnrow{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }

/* ============ A类：得分调度台 ============ */
.plate-row{ display:grid; grid-template-columns:repeat(auto-fill,minmax(46px,1fr)); gap:6px; margin:10px 0 14px; }
.plate{
  aspect-ratio:1/1; border-radius:10px; display:flex; align-items:center; justify-content:center;
  font-size:16px; font-weight:800; color:#fff; background:#b0bec5; border:2px solid #90a4ae;
}
.plate.ok{ background:var(--ok); border-color:#1b5e20; }
.score-panel{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin:6px 0 10px; }
.score-num{ font-size:40px; font-weight:800; color:var(--primary-dark); min-width:120px; }
.score-num.pass{ color:var(--ok); }
.formula{ font-size:18px; color:#4a5a6a; }
.gauge{ position:relative; height:36px; background:#eceff1; border-radius:10px; border:2px solid #b0bec5; margin:8px 0 4px; }
.gauge .fill{ position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg,#64b5f6,var(--primary)); border-radius:8px; transition:width .15s; }
.gauge .fill.pass{ background:linear-gradient(90deg,#81c784,var(--ok)); }
.gauge .goal{ position:absolute; top:-8px; bottom:-8px; width:5px; background:var(--bad); border-radius:3px; }
.gauge .goal-label{ position:absolute; top:-30px; transform:translateX(-50%); font-size:16px; font-weight:800; color:var(--bad); white-space:nowrap; }

/* ============ 滑块 ============ */
.slider{ position:relative; height:64px; margin:10px 0 4px; touch-action:none; }
.slider .rail{ position:absolute; left:0; right:0; top:26px; height:12px; background:#cfd8dc; border-radius:8px; }
.slider .fill2{ position:absolute; left:0; top:26px; height:12px; background:var(--primary); border-radius:8px; }
.slider .handle{
  position:absolute; top:8px; width:48px; height:48px; border-radius:50%;
  background:var(--card); border:5px solid var(--primary); box-shadow:0 3px 6px rgba(0,0,0,.25);
  cursor:grab; touch-action:none; display:flex; align-items:center; justify-content:center;
  font-size:16px; font-weight:800; color:var(--primary-dark);
}
.slider .cap{ position:absolute; top:0; font-size:16px; color:#5a6a7a; font-weight:700; }
.slider .cap.left{ left:0; } .slider .cap.right{ right:0; }
.slider-label{ font-size:18px; font-weight:800; color:var(--primary-dark); }

/* ============ B类：租车调度场 ============ */
.spec-row{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
.spec-card{ flex:1 1 220px; border:3px solid var(--primary); border-radius:12px; padding:8px 12px; font-size:17px; background:#f4faff; }
.spec-card b{ color:var(--primary-dark); }
.supply-row{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-bottom:14px; }
.supply{
  border:3px solid var(--primary); border-radius:14px; background:#f4faff; padding:8px 14px;
  text-align:center; cursor:grab; touch-action:none; user-select:none; min-width:150px;
}
.supply:active{ transform:scale(.96); }
.supply .veh{ font-size:40px; line-height:1.1; }
.supply .vname{ font-size:18px; font-weight:800; color:var(--primary-dark); }
.supply .vinfo{ font-size:16px; color:#4a5a6a; }
.lane{
  display:grid; grid-template-columns:repeat(6,1fr); gap:10px; margin:6px 0 14px;
  border:3px dotted var(--primary); border-radius:12px; padding:10px; background:#fbfdff;
}
@media (max-width:640px){ .lane{ grid-template-columns:repeat(4,1fr); } }
.slot{
  aspect-ratio:1/1; min-height:64px; border:3px dashed #90a4ae; border-radius:12px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:34px; background:#fff; touch-action:none; cursor:pointer;
}
.slot.hl{ border-color:var(--accent); background:#fff8e1; }
.slot .stxt{ font-size:14px; color:#90a4ae; }
.slot.filled{ border-style:solid; border-color:var(--primary); }
.meters{ display:flex; gap:16px; flex-wrap:wrap; }
.meter{ flex:1 1 240px; }
.meter .mtitle{ font-size:17px; font-weight:800; margin-bottom:4px; }
.meter .mbar{ position:relative; height:30px; background:#eceff1; border-radius:8px; border:2px solid #b0bec5; overflow:visible; }
.meter .mfill{ position:absolute; left:0; top:0; bottom:0; border-radius:6px; transition:width .25s; }
.meter .mgoal{ position:absolute; top:-6px; bottom:-6px; width:4px; background:var(--bad); }
.meter .mval{ font-size:16px; margin-top:4px; color:#4a5a6a; }
#drag-ghost{
  position:fixed; z-index:99; pointer-events:none; font-size:44px; filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));
  transform:translate(-50%,-60%);
}

/* ============ C/D类：可行区间锁 ============ */
.axis-wrap{ overflow-x:auto; padding:6px 2px; }
.axis-inner{ position:relative; height:150px; min-width:660px; margin:0 auto; touch-action:none; }
.axis-line{ position:absolute; left:2%; right:2%; top:74px; height:8px; background:#b0bec5; border-radius:4px; }
.band{ position:absolute; top:38px; height:80px; background:var(--primary); opacity:.22; border-left:4px solid var(--primary); border-right:4px solid var(--primary); }
.tick{ position:absolute; top:0; width:60px; margin-left:-30px; height:150px; text-align:center; pointer-events:none; }
.tick .t-val{ font-size:16px; color:#37474f; margin-top:10px; font-weight:700; }
.tick .t-dot{ width:20px; height:20px; border-radius:50%; background:#fff; border:4px solid #78909c; margin:2px auto 0; }
.tick .t-x{ font-size:16px; font-weight:800; color:#37474f; margin-top:4px; }
.tick.in .t-dot{ background:var(--accent); border-color:var(--primary-dark); transform:scale(1.25); }
.tick.in .t-val{ color:var(--primary-dark); }
.knob{
  position:absolute; top:60px; width:34px; height:34px; border-radius:50%; margin-left:-17px;
  background:var(--card); border:5px solid var(--primary-dark); cursor:grab; touch-action:none;
  box-shadow:0 3px 5px rgba(0,0,0,.3); z-index:5;
}
.knob::after{ content:"↔"; font-size:15px; line-height:24px; color:var(--primary-dark); font-weight:800; }
.axis-legend{ text-align:center; font-size:16px; color:#4a5a6a; margin-top:2px; }
.range-info{ text-align:center; font-size:18px; font-weight:800; color:var(--primary-dark); margin-top:8px; }

/* ============ E类：水费阶梯站 ============ */
.bill-row{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin:8px 0; }
.bill{
  flex:1 1 260px; max-width:330px; border:3px solid var(--primary); border-radius:14px; padding:10px 14px; background:#f4faff;
}
.bill h3{ margin:0 0 6px; font-size:18px; color:var(--primary-dark); }
.bill .expr{ font-size:17px; }
.bill .big{ font-size:30px; font-weight:800; margin:4px 0; }
.bill .match{ color:var(--ok); } .bill .mismatch{ color:var(--bad); }
.bill.ok-bill{ border-color:var(--ok); background:var(--okbg); }
.stack-bar{ position:relative; height:44px; border-radius:10px; overflow:hidden; border:2px solid #90a4ae; display:flex; margin:10px 0 2px; }
.stack-seg{ height:100%; transition:width .2s; }
.seg-legend{ display:flex; gap:12px; flex-wrap:wrap; font-size:16px; margin-bottom:8px; }
.seg-legend span{ display:inline-flex; align-items:center; gap:4px; }
.seg-legend i{ width:16px; height:16px; border-radius:4px; display:inline-block; }
.budget-line{ position:absolute; top:-8px; bottom:-8px; width:5px; background:var(--bad); z-index:3; }
.stack-wrap{ position:relative; }
.water-num{ font-size:36px; font-weight:800; color:var(--primary-dark); }
.water-num.over{ color:var(--bad); }
.step-tag{ display:inline-block; background:var(--primary); color:#fff; border-radius:10px; padding:2px 14px; font-size:17px; font-weight:800; margin-bottom:6px; }
.price-table{ border-collapse:collapse; margin:8px auto; font-size:16px; background:#fff; }
.price-table th,.price-table td{ border:2px solid var(--primary); padding:5px 12px; text-align:center; }
.price-table th{ background:#e3f2fd; color:var(--primary-dark); }

/* ============ 弹层 ============ */
.modal-mask{
  position:fixed; inset:0; background:rgba(20,40,60,.55); z-index:200;
  display:flex; align-items:center; justify-content:center; padding:16px;
}
.modal{
  background:var(--card); border:4px solid var(--primary); border-radius:18px;
  max-width:640px; width:100%; max-height:86vh; overflow:auto; padding:20px 22px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
.modal h2{ margin:0 0 10px; color:var(--primary-dark); font-size:24px; }
.modal .mbody{ font-size:17px; line-height:1.8; }
.modal .mrow{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:16px; }
.stars{ text-align:center; font-size:52px; letter-spacing:8px; margin:6px 0; }
.stars span{ display:inline-block; animation:starpop .55s both; }
.stars span:nth-child(2){ animation-delay:.25s; }
.stars span:nth-child(3){ animation-delay:.5s; }
@keyframes starpop{ 0%{ transform:scale(0) rotate(-40deg); opacity:0;} 70%{ transform:scale(1.3);} 100%{ transform:scale(1); opacity:1;} }
.rules-block{ margin:8px 0; padding:8px 12px; border-left:5px solid var(--accent); background:#fffdf5; border-radius:6px; }
#fx-canvas{ position:fixed; inset:0; z-index:300; pointer-events:none; }
.result-grid{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:10px 0; }
.result-item{ background:#f2f7fc; border:2px solid var(--primary); border-radius:12px; padding:8px 18px; text-align:center; }
.result-item .k{ font-size:15px; color:#5a6a7a; }
.result-item .v{ font-size:26px; font-weight:800; color:var(--primary-dark); }
@media (max-width:700px){
  body{ font-size:16px; }
  #topbar .logo{ font-size:19px; }
  #scene-menu h1{ font-size:26px; }
  #qcard{ font-size:17px; }
  .score-num{ font-size:32px; }
}
</style>
</head>
<body>
<div id="app">
  <!-- 顶栏：标题 + 计时 + 步数 + 功能按钮 -->
  <header id="topbar">
    <span class="logo">🚦 不等式探险队 · 智慧调度站</span>
    <span class="sub">第15讲 不等式的应用 · 互动闯关</span>
    <span class="stat-chip" id="timer">⏱ 00:00</span>
    <span class="stat-chip" id="stepcount">👣 0 步</span>
    <button class="btn" id="btn-rules">规则说明</button>
    <button class="btn" id="btn-exit">返回选择</button>
  </header>

  <!-- 场景一：难度选择 -->
  <section id="scene-menu">
    <h1>勇 者 调 度 场</h1>
    <p class="tagline">拖一拖、调一调，用操作解锁不等式的临界点与最优方案！</p>
    <div class="diff-cards">
      <div class="diff-card" data-diff="初级">
        <div class="icon">🌱</div>
        <h2>热身营地</h2>
        <div class="dname">初级 · 3 关</div>
        <p>得分调度台 + 调度小车 + 区间锁，找到"至少 / 至多"的临界点。</p>
      </div>
      <div class="diff-card" data-diff="中级">
        <div class="icon">🚀</div>
        <h2>进阶挑战</h2>
        <div class="dname">中级 · 3 关</div>
        <p>双约束调度、方案区间探索，练透"不低于、不超过、分不到"。</p>
      </div>
      <div class="diff-card" data-diff="高级">
        <div class="icon">🏔️</div>
        <h2>巅峰试炼</h2>
        <div class="dname">高级 · 3 关</div>
        <p>综合方案设计 + 阶梯水价校准，方程与不等式联手解题。</p>
      </div>
    </div>
    <p class="menu-note">✨ 每一局的关卡题目与界面配色都会随机刷新，越玩越新鲜！</p>
  </section>

  <!-- 场景二：游戏进行 -->
  <section id="scene-game" class="hidden">
    <div id="level-head">
      <span class="lv-title" id="lv-title">第 1 关</span>
      <span class="lv-step" id="lv-step"></span>
    </div>
    <div class="progress-outer"><div class="progress-inner" id="progress"></div></div>
    <div id="qcard"></div>
    <div id="stage"></div>
    <div id="feedback" class="info">先读题，再动手操作，加油！</div>
    <div id="btnrow"></div>
  </section>
</div>

<div id="modal-root"></div>
<canvas id="fx-canvas"></canvas>

<script>
'use strict';
/* =========================================================
 * 不等式探险队 · 智慧调度站
 * 核心玩法：滑块连续调节 / 车辆拖拽调度 / 数轴区间拖动 / 阶梯计费校准
 * 题目来源：《第15讲 不等式的应用（提升篇）》教参（例1-例5、融会贯通、练习）
 * ========================================================= */

/* ---------- 小工具 ---------- */
function $(s){ return document.querySelector(s); }
function el(tag, cls, html){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html != null) e.innerHTML = html;
  return e;
}
function randInt(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
function fmt1(v){ return (Math.round(v * 10) / 10).toFixed(1); }
function pad2(n){ return (n < 10 ? '0' : '') + n; }

/* ---------- 随机主题色板 ---------- */
var THEMES = [
  { name:'海洋蓝', primary:'#1976d2', dark:'#0d47a1', accent:'#ffb300', bg:'#eaf4fb' },
  { name:'森林绿', primary:'#2e7d32', dark:'#1b5e20', accent:'#ff8f00', bg:'#eef7ee' },
  { name:'晨曦橙', primary:'#ef6c00', dark:'#b53d00', accent:'#00897b', bg:'#fdf3e7' },
  { name:'葡萄紫', primary:'#7b1fa2', dark:'#4a148c', accent:'#fbc02d', bg:'#f5eefa' },
  { name:'青碧色', primary:'#00838f', dark:'#005661', accent:'#f57f17', bg:'#e8f6f7' },
  { name:'珊瑚红', primary:'#d81b60', dark:'#a01047', accent:'#00acc1', bg:'#fdeef4' }
];
function applyRandomTheme(){
  var t = pick(THEMES);
  var r = document.documentElement;
  r.style.setProperty('--primary', t.primary);
  r.style.setProperty('--primary-dark', t.dark);
  r.style.setProperty('--accent', t.accent);
  r.style.setProperty('--bg', t.bg);
  return t;
}

/* =========================================================
 * 题库（全部取自教参原题或同考法变式，答案与解析均人工验算）
 * kind: A=得分调度台  B=租车调度场  CD=可行区间锁  E=水费阶梯站
 * ========================================================= */
var BANK = {
  /* ---- A 类：计分临界值（对应考法：和差倍分 / 计分问题）---- */
  A1: { kind:'A', diff:'初级', title:'得分调度台',
    total:16, right:6, wrong:-2, target:72, rel:'>=', answer:13, relText:'不低于',
    text:'某次数学测验，共有 16 道选择题，评分标准为：答对一道题给 6 分，答错或不答一道题扣 2 分。小明希望自己的分数不低于 72 分，他至少要答对多少道题？请拖动滑块找到能达标的最少答对题数，再点击下方"锁定方案"。',
    solution:'设答对 x 道题，则答错或不答 (16-x) 道，得分 = 6x - 2(16-x) = 8x - 32。由"不低于 72 分"得 8x - 32 ≥ 72，解得 x ≥ 13。因为 x 为整数，所以至少要答对 13 道题，此时得分 8×13-32 = 72 分，恰好达标（答对 12 道时只有 64 分，不达标）。' },
  A2: { kind:'A', diff:'初级', title:'得分调度台',
    total:12, right:5, wrong:-1, target:52, rel:'>=', answer:11, relText:'不低于',
    text:'班级抢答赛共有 12 道题，答对一道得 5 分，答错或不答扣 1 分。小星的得分要不低于 52 分，她至少要答对多少道题？请拖动滑块寻找临界点，然后"锁定方案"。',
    solution:'设答对 x 道题，得分 = 5x - (12-x) = 6x - 12。由 6x - 12 ≥ 52 得 6x ≥ 64，x ≥ 32/3 ≈ 10.7。因为 x 为整数，所以至少要答对 11 道题，此时得分 6×11-12 = 54 分达标（答对 10 道只有 48 分）。' },

/* ---------- 各难度的关卡池（同类多题随机抽，保证每局不同）---------- */
var LEVEL_PLANS = {
  '初级': [ ['A1','A2'], ['B3'], ['C1','D1'] ],
  '中级': [ ['A3','A4'], ['B1','B2'], ['C2','C3','D2'] ],
  '高级': [ ['A5','A6'], ['B4','D3'], ['E1'] ]
};
function buildLevels(diff){
  return LEVEL_PLANS[diff].map(function(pool){ return BANK[pick(pool)]; });
}

/* ---------- 全局状态 ---------- */
var state = {
  diff: null,        // 当前难度
  levels: [],        // 本局关卡（3 关）
  levelIdx: 0,       // 当前关卡序号
  steps: 0,          // 操作步数
  startTs: 0,        // 开始时间戳
  timerId: null,     // 计时器
  cleared: false,    // 当前关是否已通过
  resetFn: null      // 当前关"重新开始"回调
};

function addStep(){
  state.steps++;
  $('#stepcount').textContent = '👣 ' + state.steps + ' 步';
}
function startTimer(){
  stopTimer();
  state.startTs = Date.now();
  state.timerId = setInterval(function(){
    var s = Math.floor((Date.now() - state.startTs) / 1000);
    $('#timer').textContent = '⏱ ' + pad2(Math.floor(s / 60)) + ':' + pad2(s % 60);
  }, 500);
}
function stopTimer(){
  if(state.timerId){ clearInterval(state.timerId); state.timerId = null; }
}
function elapsedText(){
  var s = Math.floor((Date.now() - state.startTs) / 1000);
  return pad2(Math.floor(s / 60)) + ':' + pad2(s % 60);
}

/* ---------- 弹层 ---------- */
function showModal(innerHTML){
  var mask = el('div', 'modal-mask');
  var box = el('div', 'modal', innerHTML);
  mask.appendChild(box);
  mask.addEventListener('pointerdown', function(ev){ if(ev.target === mask) ev.stopPropagation(); });
  $('#modal-root').appendChild(mask);
  return { mask: mask, box: box, close: function(){ mask.remove(); } };
}

/* =========================================================
 * 通用组件：横向滑块（pointer 拖动，兼容触摸）
 * ========================================================= */
function createSlider(opt){
  // opt: {min,max,step,init,minLabel,maxLabel,onInput,onRelease,valueText}
  var wrap = el('div', 'slider');
  var rail = el('div', 'rail');
  var fill = el('div', 'fill2');
  var handle = el('div', 'handle', '●');
  var capL = el('div', 'cap left', opt.minLabel || String(opt.min));
  var capR = el('div', 'cap right', opt.maxLabel || String(opt.max));
  wrap.appendChild(rail); wrap.appendChild(fill); wrap.appendChild(handle);
  wrap.appendChild(capL); wrap.appendChild(capR);
  var val = opt.init;
  function toPos(v){ return (v - opt.min) / (opt.max - opt.min) * 100; }
  function snap(v){
    v = Math.round((v - opt.min) / opt.step) * opt.step + opt.min;
    v = Math.max(opt.min, Math.min(opt.max, v));
    return parseFloat(v.toFixed(4));
  }
  function paint(){
    var p = toPos(val);
    fill.style.width = p + '%';
    handle.style.left = 'calc(' + p + '% - 24px)';
    handle.textContent = opt.valueText ? opt.valueText(val) : String(val);
  }
  var dragging = false;
  function fromEvent(ev){
    var r = wrap.getBoundingClientRect();
    var t = (ev.clientX - r.left) / r.width;
    t = Math.max(0, Math.min(1, t));
    var nv = snap(opt.min + t * (opt.max - opt.min));
    if(nv !== val){ val = nv; paint(); if(opt.onInput) opt.onInput(val); }
  }
  wrap.addEventListener('pointerdown', function(ev){
    dragging = true;
    try{ wrap.setPointerCapture(ev.pointerId); }catch(e){}
    fromEvent(ev);
    ev.preventDefault();
  });
  wrap.addEventListener('pointermove', function(ev){ if(dragging) fromEvent(ev); });
  wrap.addEventListener('pointerup', function(){
    if(dragging){ dragging = false; addStep(); if(opt.onRelease) opt.onRelease(val); }
  });
  wrap.addEventListener('pointercancel', function(){ dragging = false; });
  paint();
  if(opt.onInput) opt.onInput(val);
  return {
    el: wrap,
    get value(){ return val; },
    set value(v){ val = snap(v); paint(); if(opt.onInput) opt.onInput(val); }
  };
}

/* =========================================================
 * A 类关卡：得分调度台
 * ========================================================= */
function renderA(q){
  var stage = $('#stage');
  stage.innerHTML = '';

  // 答题格盘
  var row = el('div', 'plate-row');
  var plates = [];
  for(var i = 0; i < q.total; i++){
    var p = el('div', 'plate', '');
    row.appendChild(p); plates.push(p);
  }
  // 得分面板
  var panel = el('div', 'score-panel');
  var num = el('div', 'score-num', '0');
  var formula = el('div', 'formula', '');
  panel.appendChild(num); panel.appendChild(formula);
  // 得分仪表条
  var gauge = el('div', 'gauge');
  var gfill = el('div', 'fill');
  var goal = el('div', 'goal');
  var goalLabel = el('div', 'goal-label', '目标 ' + q.target + ' 分');
  gauge.appendChild(gfill); gauge.appendChild(goal); gauge.appendChild(goalLabel);
  var gaugeMax = q.right * q.total;

  // 滑块
  var sl = createSlider({
    min: 0, max: q.total, step: 1, init: 0,
    minLabel: '答对 0 道', maxLabel: '答对 ' + q.total + ' 道',
    valueText: function(v){ return String(v); },
    onInput: function(v){ paintAll(v); }
  });

  function score(v){ return q.right * v + q.wrong * (q.total - v); }
  function pass(v){ return q.rel === '>=' ? score(v) >= q.target : score(v) > q.target; }
  function paintAll(v){
    for(var i = 0; i < q.total; i++){
      if(i < v){ plates[i].className = 'plate ok'; plates[i].textContent = '+' + q.right; }
      else { plates[i].className = 'plate'; plates[i].textContent = q.wrong; }
    }
    var s = score(v);
    num.textContent = s + ' 分';
    num.className = 'score-num' + (pass(v) ? ' pass' : '');
    formula.innerHTML = '得分 = ' + q.right + '×' + v + ' ' + (q.wrong < 0 ? '-' : '+') + ' ' + Math.abs(q.wrong) + '×(' + q.total + '-' + v + ') = ' + s + ' 分';
    gfill.style.width = Math.max(0, s / gaugeMax * 100) + '%';
    gfill.className = 'fill' + (pass(v) ? ' pass' : '');
    var gp = q.target / gaugeMax * 100;
    goal.style.left = 'calc(' + gp + '% - 2px)';
    goalLabel.style.left = gp + '%';
  }

  var tip = el('div', 'axis-legend', '绿色格 = 答对的题（每道 +' + q.right + ' 分）；灰色格 = 答错或不答（每道 ' + q.wrong + ' 分）');

  stage.appendChild(el('div', 'slider-label', '👇 拖动圆钮：调节"答对题数"'));
  stage.appendChild(sl.el);
  stage.appendChild(row);
  stage.appendChild(panel);
  stage.appendChild(gauge);
  stage.appendChild(tip);
  paintAll(0);

  // 按钮排
  var btnrow = $('#btnrow');
  btnrow.innerHTML = '';
  var lockBtn = el('button', 'btn primary big', '🔒 锁定方案');
  lockBtn.addEventListener('click', function(){
    if(state.cleared) return;
    addStep();
    var v = sl.value;
    if(!pass(v)){
      badFeedback('当前得分 ' + score(v) + ' 分，还没有' + (q.rel === '>=' ? '达到' : '超过') + '目标 ' + q.target + ' 分。向右拖动，增加答对的题数再试！');
      return;
    }
    if(v > q.answer){
      badFeedback('得分达标了！不过还有更少的答对题数也能达标，向左拖动，找一找"至少"的临界点～');
      return;
    }
    passFeedback('完全正确！答对 ' + v + ' 道时得分恰好 ' + score(v) + ' 分' + (score(v) === q.target ? '' : '') + '，是最少的达标答对数。');
    onLevelClear();
  });
  btnrow.appendChild(lockBtn);
  appendCommonButtons(q);
  state.resetFn = function(){
    sl.value = 0;
    infoFeedback('已重置滑块，重新探索临界点吧！');
  };
}

/* =========================================================
 * B 类关卡：租车调度场（拖放车辆）
 * ========================================================= */
function renderB(q){
  var stage = $('#stage');
  stage.innerHTML = '';

  // 规格卡
  var spec = el('div', 'spec-row');
  spec.appendChild(el('div', 'spec-card', '🚌 <b>' + q.jiaName + '</b>：每辆最多载 <b>' + q.jiaP + ' 人</b>、<b>' + q.jiaL + ' 件</b>行李'));
  spec.appendChild(el('div', 'spec-card', '🚚 <b>' + q.yiName + '</b>：每辆最多载 <b>' + q.yiP + ' 人</b>、<b>' + q.yiL + ' 件</b>行李'));
  stage.appendChild(spec);

  // 车库（供应卡）
  var supply = el('div', 'supply-row');
  var jiaCard = el('div', 'supply', '<div class="veh">🚌</div><div class="vname">' + q.jiaName + '</div><div class="vinfo">载 ' + q.jiaP + '人 / ' + q.jiaL + '件 · 点击或拖入车道</div>');
  var yiCard = el('div', 'supply', '<div class="veh">🚚</div><div class="vname">' + q.yiName + '</div><div class="vinfo">载 ' + q.yiP + '人 / ' + q.yiL + '件 · 点击或拖入车道</div>');
  supply.appendChild(jiaCard); supply.appendChild(yiCard);
  stage.appendChild(supply);

  // 车道
  var lane = el('div', 'lane');
  var slots = [];
  for(var i = 0; i < q.total; i++){
    (function(idx){
      var s = el('div', 'slot', '<span class="stxt">空位</span>');
      s.dataset.veh = '';
      lane.appendChild(s); slots.push(s);
    })(i);
  }
  stage.appendChild(lane);

  // 计量条
  var meters = el('div', 'meters');
  var mP = el('div', 'meter');
  mP.appendChild(el('div', 'mtitle', '👦 载客量（目标 ≥ ' + q.needP + ' 人）'));
  var barP = el('div', 'mbar'); var fillP = el('div', 'mfill'); fillP.style.background = 'var(--primary)';
  var goalP = el('div', 'mgoal'); goalP.style.left = (q.needP / (q.jiaP * q.total) * 100) + '%';
  barP.appendChild(fillP); barP.appendChild(goalP);
  var valP = el('div', 'mval', '0 人');
  mP.appendChild(barP); mP.appendChild(valP);
  var mL = el('div', 'meter');
  mL.appendChild(el('div', 'mtitle', '📦 载货量（目标 ≥ ' + q.needL + ' 件）'));
  var barL = el('div', 'mbar'); var fillL = el('div', 'mfill'); fillL.style.background = 'var(--accent)';
  var goalL = el('div', 'mgoal'); goalL.style.left = (q.needL / (q.yiL * q.total) * 100) + '%';
  barL.appendChild(fillL); barL.appendChild(goalL);
  var valL = el('div', 'mval', '0 件');
  mL.appendChild(barL); mL.appendChild(valL);
  meters.appendChild(mP); meters.appendChild(mL);
  stage.appendChild(meters);

  var maxP = q.jiaP * q.total, maxL = q.yiL * q.total;

  function currentP(){ var n = 0; slots.forEach(function(s){ if(s.dataset.veh === 'jia') n += q.jiaP; else if(s.dataset.veh === 'yi') n += q.yiP; }); return n; }
  function currentL(){ var n = 0; slots.forEach(function(s){ if(s.dataset.veh === 'jia') n += q.jiaL; else if(s.dataset.veh === 'yi') n += q.yiL; }); return n; }
  function countPlaced(){ return slots.filter(function(s){ return s.dataset.veh; }).length; }
  function paint(){
    var p = currentP(), l = currentL(), c = countPlaced();
    fillP.style.width = Math.min(100, p / maxP * 100) + '%';
    fillL.style.width = Math.min(100, l / maxL * 100) + '%';
    valP.textContent = p + ' 人 / 目标 ' + q.needP + ' 人' + (p >= q.needP ? ' ✓' : '');
    valL.textContent = l + ' 件 / 目标 ' + q.needL + ' 件' + (l >= q.needL ? ' ✓' : '');
    if(c === q.total && p >= q.needP && l >= q.needL){
      passFeedback('调度成功！安排满 ' + q.total + ' 辆车，载客 ' + p + ' 人、载货 ' + l + ' 件，全部装得下！');
      onLevelClear();
    }
  }

  function place(idx, type){
    var s = slots[idx];
    if(s.dataset.veh) return false;
    s.dataset.veh = type;
    s.classList.add('filled');
    s.innerHTML = type === 'jia' ? '🚌' : '🚚';
    addStep();
    paint();
    return true;
  }
  function firstEmpty(){
    for(var i = 0; i < slots.length; i++){ if(!slots[i].dataset.veh) return i; }
    return -1;
  }

  // 拖放实现（pointer 事件，兼容触摸；轻点=快速放入第一个空位）
  var ghost = null, dragType = '', startX = 0, startY = 0, moved = false, suppressClick = false;
  function beginDrag(ev, type){
    if(state.cleared) return;
    ev.preventDefault();
    dragType = type; startX = ev.clientX; startY = ev.clientY; moved = false;
    ghost = el('div'); ghost.id = 'drag-ghost';
    ghost.textContent = type === 'jia' ? '🚌' : '🚚';
    ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
    document.body.appendChild(ghost);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }
  function onMove(ev){
    if(!ghost) return;
    if(Math.abs(ev.clientX - startX) + Math.abs(ev.clientY - startY) > 8) moved = true;
    ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
    slots.forEach(function(s){ s.classList.remove('hl'); });
    var t = document.elementFromPoint(ev.clientX, ev.clientY);
    var slot = t ? t.closest('.slot') : null;
    if(slot && !slot.dataset.veh) slot.classList.add('hl');
  }
  function onUp(ev){
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    if(!ghost) return;
    ghost.remove(); ghost = null;
    slots.forEach(function(s){ s.classList.remove('hl'); });
    suppressClick = true;
    setTimeout(function(){ suppressClick = false; }, 60);
    if(!moved){
      // 轻点：放入第一个空位
      var fe = firstEmpty();
      if(fe >= 0){ place(fe, dragType); infoFeedback('已放入一辆' + (dragType === 'jia' ? q.jiaName : q.yiName) + '，也可以直接拖到指定车位！'); }
      else badFeedback('车道已经放满啦！点车道上的车可以移走重排。');
      return;
    }
    var t = document.elementFromPoint(ev.clientX, ev.clientY);
    var slot = t ? t.closest('.slot') : null;
    if(slot && !slot.dataset.veh){
      place(slots.indexOf(slot), dragType);
    } else if(slot && slot.dataset.veh){
      badFeedback('这个车位已经有车啦，放到空位上试试。');
    } else {
      infoFeedback('要把车放到车道空位上才有效哦。');
    }
  }
  jiaCard.addEventListener('pointerdown', function(ev){ beginDrag(ev, 'jia'); });
  yiCard.addEventListener('pointerdown', function(ev){ beginDrag(ev, 'yi'); });

  // 点击车道上的车 = 移走
  slots.forEach(function(s){
    s.addEventListener('click', function(){
      if(suppressClick) return;
      if(!s.dataset.veh) return;
      s.dataset.veh = '';
      s.classList.remove('filled');
      s.innerHTML = '<span class="stxt">空位</span>';
      addStep();
      paint();
      infoFeedback('已移走一辆车，重新安排吧！');
    });
  });

  paint();

  var btnrow = $('#btnrow');
  btnrow.innerHTML = '';
  appendCommonButtons(q);
  state.resetFn = function(){
    slots.forEach(function(s){ s.dataset.veh = ''; s.classList.remove('filled'); s.innerHTML = '<span class="stxt">空位</span>'; });
    paint();
    infoFeedback('车道已清空，重新开始安排车辆！');
  };
}

/* =========================================================
 * C / D 类关卡：可行区间锁
 * ========================================================= */
function renderCD(q){
  var stage = $('#stage');
  stage.innerHTML = '';

  var wrap = el('div', 'axis-wrap');
  var inner = el('div', 'axis-inner');
  wrap.appendChild(inner);
  var band = el('div', 'band');
  var line = el('div', 'axis-line');
  inner.appendChild(line); inner.appendChild(band);

  var from = q.from, to = q.to;
  var feas = [];
  for(var x = from; x <= to; x++){ if(q.feasible(x)) feas.push(x); }

  // 初始区间：随机（且一定与正确答案不同或有偏移，促使学生操作）
  var L = randInt(from, to - 2);
  var R = randInt(L + 1, to);

  var ticks = {};
  function pct(x){ return 6 + (x - from) / (to - from) * 88; } // 映射到 6%~94%
  for(var xi = from; xi <= to; xi++){
    (function(x){
      var t = el('div', 'tick');
      t.style.left = pct(x) + '%';
      t.innerHTML = '<div class="t-val">' + q.value(x) + '</div><div class="t-dot"></div><div class="t-x">' + x + '</div>';
      inner.appendChild(t);
      ticks[x] = t;
    })(xi);
  }
  var knobL = el('div', 'knob'); var knobR = el('div', 'knob');
  inner.appendChild(knobL); inner.appendChild(knobR);

  var info = el('div', 'range-info', '');
  var legend = el('div', 'axis-legend', '上排数字：' + q.valName + ' ｜ 下排数字：' + q.xName + ' ｜ 判定条件：' + q.condText);
  stage.appendChild(wrap);
  stage.appendChild(legend);
  stage.appendChild(info);

  function paint(){
    band.style.left = pct(L) + '%';
    band.style.width = (pct(R) - pct(L)) + '%';
    knobL.style.left = pct(L) + '%';
    knobR.style.left = pct(R) + '%';
    for(var x = from; x <= to; x++){
      ticks[x].classList.toggle('in', x >= L && x <= R);
    }
    info.textContent = '已罩住 x = ' + L + ' ～ ' + R + '（共 ' + (R - L + 1) + ' 个点），确认无误后点"锁定区间"';
  }
  paint();

  // 拖把手
  function bindKnob(knob, isRight){
    var drag = false;
    knob.addEventListener('pointerdown', function(ev){
      drag = true;
      try{ knob.setPointerCapture(ev.pointerId); }catch(e){}
      ev.preventDefault();
    });
    knob.addEventListener('pointermove', function(ev){
      if(!drag) return;
      var r = inner.getBoundingClientRect();
      var t = (ev.clientX - r.left) / r.width * 100;
      var v = Math.round(from + (t - 6) / 88 * (to - from));
      v = Math.max(from, Math.min(to, v));
      if(isRight){ if(v > L) R = v; } else { if(v < R) L = v; }
      paint();
    });
    function done(){ if(drag){ drag = false; addStep(); } }
    knob.addEventListener('pointerup', done);
    knob.addEventListener('pointercancel', function(){ drag = false; });
  }
  bindKnob(knobL, false);
  bindKnob(knobR, true);

  // 按钮排
  var btnrow = $('#btnrow');
  btnrow.innerHTML = '';
  var lockBtn = el('button', 'btn primary big', '🔒 锁定区间');
  lockBtn.addEventListener('click', function(){
    if(state.cleared) return;
    addStep();
    var selected = [];
    for(var x = from; x <= to; x++){ if(x >= L && x <= R) selected.push(x); }
    var extra = selected.filter(function(x){ return feas.indexOf(x) < 0; });
    var missing = feas.filter(function(x){ return x < L || x > R; });
    if(extra.length === 0 && missing.length === 0){
      passFeedback('完美！x = ' + feas[0] + '～' + feas[feas.length - 1] + ' 共 ' + feas.length + ' 个点全部找到，一个不多一个不少！');
      onLevelClear();
      return;
    }
    if(extra.length > 0){
      var badX = extra[0];
      badFeedback('罩多了：x = ' + badX + ' 这一点的数值是 ' + q.value(badX) + '，对照条件"' + q.condText + '"检查一下，它真的符合吗？');
      return;
    }
    badFeedback('还有符合条件的点没被罩住哦！再仔细核对每个点的数值与条件：' + q.condText + '。');
  });
  btnrow.appendChild(lockBtn);
  appendCommonButtons(q);
  state.resetFn = function(){
    L = randInt(from, to - 2); R = randInt(L + 1, to);
    paint();
    infoFeedback('区间已重置到新位置，重新锁定正确的范围吧！');
  };
}

/* =========================================================
 * E 类关卡：水费阶梯站（两步）
 * ========================================================= */
function renderE(q){
  var stage = $('#stage');
  stage.innerHTML = '';
  var step = 1;
  var AV = null, BV = null; // 第二步用的锁定水价

  function buildStep1(){
    step = 1;
    stage.innerHTML = '';
    stage.appendChild(el('div', 'step-tag', '第一步 · 校准水价 a 和 b'));

    var bill1 = el('div', 'bill');
    bill1.innerHTML = '<h3>📒 4 月账单（用水 20 吨 · 实缴 66 元）</h3><div class="expr b1e"></div><div class="big b1v"></div><div class="b1d"></div>';
    var bill2 = el('div', 'bill');
    bill2.innerHTML = '<h3>📒 5 月账单（用水 25 吨 · 实缴 91 元）</h3><div class="expr b2e"></div><div class="big b2v"></div><div class="b2d"></div>';
    var row = el('div', 'bill-row');
    row.appendChild(bill1); row.appendChild(bill2);
    stage.appendChild(row);

    var slA = createSlider({
      min: 1.6, max: 3.0, step: 0.1, init: 2.6,
      minLabel: 'a=1.6', maxLabel: 'a=3.0', valueText: function(v){ return fmt1(v); },
      onInput: function(){ paintBill(); }
    });
    var slB = createSlider({
      min: 3.4, max: 5.0, step: 0.1, init: 4.6,
      minLabel: 'b=3.4', maxLabel: 'b=5.0', valueText: function(v){ return fmt1(v); },
      onInput: function(){ paintBill(); }
    });
    var labA = el('div', 'slider-label', '👇 第一档单价 a（元/吨）：17 吨及以下部分');
    var labB = el('div', 'slider-label', '👇 第二档单价 b（元/吨）：超过 17 吨不超过 30 吨的部分');
    stage.appendChild(labA); stage.appendChild(slA.el);
    stage.appendChild(labB); stage.appendChild(slB.el);

    var tipBtn = el('button', 'btn warn', '🧠 小锦囊');
    var tipDiv = el('div', 'axis-legend', '');
    tipDiv.style.minHeight = '30px';
    tipBtn.addEventListener('click', function(){
      tipDiv.innerHTML = '两张账单都含有 17a：把 91 - 66 = 25 元拆开看，正好是 5 吨第二档水费 5b 加上 5 吨污水处理费 5×0.8 = 4 元，所以 5b = 21，先定 b 再定 a！';
    });
    stage.appendChild(tipBtn);
    stage.appendChild(tipDiv);

    var okMsg = el('div', 'range-info', '');
    stage.appendChild(okMsg);

    function calcBill(tons, a, b){ // tons=用水吨数：一档17吨、二档至30吨、三档6元、另加污水费
      var t2 = Math.min(tons, 30) - 17;
      var money = 17 * a + t2 * b + (tons - 30 > 0 ? (tons - 30) * 6 : 0) + tons * 0.8;
      return money;
    }
    function paintBill(){
      var a = slA.value, b = slB.value;
      var m1 = calcBill(20, a, b), m2 = calcBill(25, a, b);
      bill1.querySelector('.b1e').innerHTML = '17×' + fmt1(a) + ' + 3×' + fmt1(b) + ' + 污水 20×0.8';
      var v1 = bill1.querySelector('.b1v');
      v1.textContent = '= ' + fmt1(m1) + ' 元';
      var d1 = bill1.querySelector('.b1d');
      var diff1 = 66 - m1;
      bill1.classList.toggle('ok-bill', Math.abs(diff1) < 0.05);
      if(Math.abs(diff1) < 0.05){ v1.className = 'big match'; d1.innerHTML = '<b class="match">✔ 与实缴 66 元吻合！</b>'; }
      else { v1.className = 'big mismatch'; d1.innerHTML = '<b class="mismatch">' + (diff1 > 0 ? '比 66 元少 ' + fmt1(diff1) : '比 66 元多 ' + fmt1(-diff1)) + '，继续调</b>'; }
      bill2.querySelector('.b2e').innerHTML = '17×' + fmt1(a) + ' + 8×' + fmt1(b) + ' + 污水 25×0.8';
      var v2 = bill2.querySelector('.b2v');
      v2.textContent = '= ' + fmt1(m2) + ' 元';
      var d2 = bill2.querySelector('.b2d');
      var diff2 = 91 - m2;
      bill2.classList.toggle('ok-bill', Math.abs(diff2) < 0.05);
      if(Math.abs(diff2) < 0.05){ v2.className = 'big match'; d2.innerHTML = '<b class="match">✔ 与实缴 91 元吻合！</b>'; }
      else { v2.className = 'big mismatch'; d2.innerHTML = '<b class="mismatch">' + (diff2 > 0 ? '比 91 元少 ' + fmt1(diff2) : '比 91 元多 ' + fmt1(-diff2)) + '，继续调</b>'; }
      if(Math.abs(diff1) < 0.05 && Math.abs(diff2) < 0.05){
        okMsg.textContent = '🎉 校准成功！a = ' + fmt1(a) + ' 元/吨，b = ' + fmt1(b) + ' 元/吨。';
        AV = a; BV = b;
        if(!stage.querySelector('.go2')){
          var go2 = el('button', 'btn primary big', '➜ 进入第二步：控水挑战');
          go2.className = 'btn primary big go2';
          go2.addEventListener('click', function(){ buildStep2(); });
          stage.appendChild(go2);
        }
      } else {
        okMsg.textContent = '';
        AV = null;
      }
    }
    paintBill();
  }

  function buildStep2(){
    step = 2;
    stage.innerHTML = '';
    stage.appendChild(el('div', 'step-tag', '第二步 · 找出预算内最大用水量（a=' + fmt1(AV) + '，b=' + fmt1(BV) + ' 已锁定）'));
    // 题面切换
    $('#qcard').innerHTML = '<span class="qtag">💧 例4·阶梯计费</span>' + q.text2;

    var head = el('div', 'score-panel');
    var wnum = el('div', 'water-num', '40 吨');
    head.appendChild(wnum);
    head.appendChild(el('div', 'formula', '预算红线：184 元（= 月收入 9200 元 × 2%）'));
    stage.appendChild(head);

    // 堆叠条
    var maxCost = 6.8 * 48 - 88; // x=48 时的水费 238.4

    var s3 = el('div', 'stack-seg'); s3.style.background = '#e57373';
    var s4 = el('div', 'stack-seg'); s4.style.background = '#90a4ae';
    stack.appendChild(s1); stack.appendChild(s2); stack.appendChild(s3); stack.appendChild(s4);
    var budget = el('div', 'budget-line'); budget.style.left = (184 / maxCost * 100) + '%';
    stackWrap.appendChild(stack); stackWrap.appendChild(budget);
    var legend = el('div', 'seg-legend',
      '<span><i style="background:#4fc3f7"></i>第一档 17吨×2.2=37.4元</span>' +
      '<span><i style="background:#ffb74d"></i>第二档 13吨×4.2=54.6元</span>' +
      '<span><i style="background:#e57373"></i>第三档 (x-30)吨×6元</span>' +
      '<span><i style="background:#90a4ae"></i>污水处理 x吨×0.8元</span>');
    var costLine = el('div', 'range-info', '');
    stage.appendChild(stackWrap);
    stage.appendChild(legend);
    stage.appendChild(costLine);

    var sl = createSlider({
      min: 31, max: 48, step: 1, init: 31,
      minLabel: '31 吨', maxLabel: '48 吨',
      valueText: function(v){ return String(v); },
      onInput: function(v){ paint2(v); }
    });
    var lab = el('div', 'slider-label', '👇 拖动圆钮：调节 6 月用水量 x（吨）');
    stage.insertBefore(lab, head.nextSibling);
    stage.insertBefore(sl.el, lab.nextSibling);

    function cost(v){ return 6.8 * v - 88; }
    function paint2(v){
      wnum.textContent = v + ' 吨';
      var c = cost(v);
      wnum.className = 'water-num' + (c > 184 + 1e-9 ? ' over' : '');
      s1.style.width = (37.4 / maxCost * 100) + '%';
      s2.style.width = (54.6 / maxCost * 100) + '%';
      s3.style.width = (6 * (v - 30) / maxCost * 100) + '%';
      s4.style.width = (0.8 * v / maxCost * 100) + '%';
      costLine.innerHTML = '预计水费 = 37.4 + 54.6 + 6×' + (v - 30) + ' + 0.8×' + v + ' = <b>' + fmt1(c) + ' 元</b>' + (c <= 184 ? '（未超预算 ✓）' : '（超出预算 ' + fmt1(c - 184) + ' 元 ✗）');
    }
    paint2(31);

    var btnrow = $('#btnrow');
    btnrow.innerHTML = '';
    var lockBtn = el('button', 'btn primary big', '🔒 锁定最大用水量');
    lockBtn.addEventListener('click', function(){
      if(state.cleared) return;
      addStep();
      var v = sl.value, c = cost(v);
      if(c > 184 + 1e-9){
        badFeedback('水费 ' + fmt1(c) + ' 元超过了预算 184 元，向左调调看。');
        return;
      }

    btnrow.appendChild(lockBtn);
    appendCommonButtons(q);
    state.resetFn = function(){ buildStep1(); $('#qcard').innerHTML = '<span class="qtag">💧 例4·阶梯计费</span>两步挑战：先校准水价，再控制水费。<br>' + q.text1 + '<br>' + q._tbl; infoFeedback('已回到第一步，重新校准水价！'); };
  }

  // 价目表存到题目对象里，方便"重新开始"时恢复题面
  var tbl =
    '<table class="price-table">' +
    '<tr><th>每户每月用水量</th><th>自来水单价（元/吨）</th><th>污水处理价（元/吨）</th></tr>' +

  var btnrow = $('#btnrow');

  appendCommonButtons(q);

/* ---------- 每关共用的按钮：揭示答案 / 重新开始 ---------- */

}

function renderStage(){

}

/* =========================================================
 * 通关庆祝：全屏彩纸 + 烟花（Canvas）
 * ========================================================= */
function launchConfetti(){
  var cvs = $('#fx-canvas');
  var ctx = cvs.getContext('2d');
  cvs.width = window.innerWidth; cvs.height = window.innerHeight;
  var colors = [ $('#app') && getComputedStyle(document.documentElement).getPropertyValue('--primary').trim() || '#1976d2',
                 getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#ffb300',
                 '#e91e63', '#4caf50', '#2196f3', '#ff9800' ];
  var parts = [];
  for(var i = 0; i < 160; i++){
    parts.push({
      x: Math.random() * cvs.width,
      y: -20 - Math.random() * cvs.height * 0.5,
      w: 6 + Math.random() * 8, h: 8 + Math.random() * 10,
      vy: 2 + Math.random() * 3, vx: -1.5 + Math.random() * 3,
      rot: Math.random() * Math.PI, vr: -0.1 + Math.random() * 0.2,
      c: colors[Math.floor(Math.random() * colors.length)]
    });
  }
  var rings = [];
  for(var f = 0; f < 4; f++){
    rings.push({ x: 100 + Math.random() * (cvs.width - 200), y: 120 + Math.random() * (cvs.height * 0.5), r: 6, vr: 2.6 + Math.random(), a: 1, c: colors[Math.floor(Math.random() * colors.length)] });
  }
  var t0 = Date.now();
  function frame(){
    var t = Date.now() - t0;
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    // 彩纸
    parts.forEach(function(p){
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    // 烟花圆环
    rings.forEach(function(r){
      if(t > 300){ r.r += r.vr; r.a -= 0.012; }
      if(r.a > 0){
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
        ctx.strokeStyle = r.c;
        ctx.globalAlpha = Math.max(0, r.a);
        ctx.lineWidth = 5;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    });
    if(t < 4200){ requestAnimationFrame(frame); }
    else { ctx.clearRect(0, 0, cvs.width, cvs.height); }
  }
  requestAnimationFrame(frame);
}

 var ct=el("input");ct.placeholder="联系方式（可选，方便回访）";box.appendChild(ct);
 function payload(){
  var cat=sel.value,txt=ta.value.trim()||"（未填写具体内容）";
  var title="[反馈]["+M.id+" v"+M.ver+"] "+cat+"："+txt.slice(0,40);
  var body="【游戏】"+M.name+"\n【标识】"+M.id+" v"+M.ver+"\n【教参】"+M.jiaocan+"\n【学段/年级】"+M.stage+" / "+(M.grade||"通用")+"\n【系列】"+M.series
   +"\n【问题类型】"+cat+"\n【问题描述】"+txt+"\n【联系】"+(ct.value.trim()||"无")+"\n【时间】"+new Date().toLocaleString()+"\n【环境】"+navigator.userAgent;
  return {title:title,body:body,plain:body};
 }
 var row=el("div","tafb-row");
 var cp=el("button","tafb-cp","复制反馈内容");
 cp.onclick=function(){
  var p=payload();
  var done=function(){cp.textContent="已复制 ✔";setTimeout(function(){cp.textContent="复制反馈内容";},1600);};
  function fallback(){var t=el("textarea");t.value=p.plain;document.body.appendChild(t);t.select();try{document.execCommand("copy");done();}catch(e){}t.remove();}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(p.plain).then(done,fallback);}else{fallback();}
 };
 var ok=el("a","tafb-ok","提交（打开网页）");ok.target="_blank";ok.rel="noopener";ok.href="#";
 ok.onclick=function(e){e.preventDefault();var p=payload();
  var u=ISS+encodeURIComponent(p.title)+"&body="+encodeURIComponent(p.body);
  var a=el("a");a.href=u;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();};
 row.appendChild(cp);row.appendChild(ok);box.appendChild(row);
 var tip=el("div","g","「提交」会用系统浏览器打开 GitHub 反馈页（需登录），提交即建一条带游戏标识的建议；不方便登录就「复制反馈内容」发给作者。");
 tip.style.marginTop="10px";box.appendChild(tip);
 mask.appendChild(box);mask.onclick=function(e){if(e.target===mask)mask.remove();};
 document.documentElement.appendChild(mask);
}
})();
</script></body>
