<style>:root{--c1:#ea580c;--c2:#0d9488;--bg:#fff7ed;--panel:#ffffff;--ink:#3b2f2f;--soft:#ffe8d1;--good:#16a34a;--bad:#dc2626}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.55}#app{max-width:1080px;margin:0 auto;padding:10px 14px 60px}header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:8px 2px}.logo{font-size:30px;font-weight:900;color:var(--c1);text-shadow:2px 2px 0 rgba(0,0,0,.08);line-height:1.15}.logo small{display:block;font-size:15px;color:var(--c2);font-weight:700;letter-spacing:2px}.hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.hud-chip{background:var(--panel);border:3px solid var(--c1);border-radius:14px;padding:5px 14px;font-weight:800;font-size:18px;box-shadow:2px 2px 0 rgba(0,0,0,.12);white-space:nowrap}button{font-family:inherit;touch-action:manipulation}.btn{cursor:pointer;border:3px solid var(--ink);border-radius:14px;padding:10px 18px;font-size:18px;font-weight:800;background:var(--panel);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .06s}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}.btn.primary{background:var(--c1);color:#fff}.btn.ghost{background:var(--soft)}.btn.small{padding:6px 12px;font-size:16px}.btn:disabled{opacity:.45;cursor:not-allowed}#screen-menu{display:none}.menu-hero{text-align:center;padding:18px 8px 8px}.menu-hero .big{font-size:44px;font-weight:900;color:var(--c1);letter-spacing:4px}.menu-hero .sub{font-size:19px;color:var(--c2);font-weight:700;margin-top:6px}.tier-row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:22px}.tier-card{flex:1 1 260px;max-width:320px;background:var(--panel);border:4px solid var(--ink);border-radius:20px;padding:20px 18px;cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.2);transitio ;justify-content:center;background:#fffdf7;position:relative}.socket .sock-tip{font-size:16px;color:#999;font-weight:700;text-align:center}.gear{position:relative;width:112px;height:112px}.gear.small{width:78px;height:78px}.gear-ring{position:absolute;inset:0;border-radius:50%}.gear-base{position:absolute;inset:11%;border-radius:50%;background:var(--panel);border:4px solid var(--ink);box-shadow:inset 0 0 0 3px rgba(0,0,0,.08)}.gear.small .gear-base{border-width:3px}.gear-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;color:var(--c1)}.gear.small .gear-label{font-size:19px}.gear-card{display:flex;flex-direction:column;align-items:center;gap:2px}.gear-card .g-tip{font-size:15px;font-weight:800;color:#555}.counter-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}.counter-box{background:var(--soft);border:3px solid var(--ink);border-radius:12px;padding:6px 16px;text-align:center;min-width:120px}.counter-box .c-name{font-weight:900;font-size:17px}.counter-box .c-val{font-size:26px;font-weight:900;color:var(--c1);font-variant-numeric:tabular-nums}.lamp{display:inline-flex;align-items:center;gap:8px;border:3px solid var(--ink);border-radius:12px;padding:6px 14px;font-weight:800;background:#f3f4f6}.lamp .dot{width:20px;height:20px;border-radius:50%;background:#cbd5e1;border:2px solid var(--ink)}.lamp.on{background:#dcfce7}.lamp.on .dot{background:var(--good);box-shadow:0 0 10px #22c55e}.lamp.miss{background:#fee2e2}.lamp.miss .dot{background:var(--bad)}.race-wrap{display:flex;flex-direction:column;gap:12px}.runner-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.runner-card{background:var(--soft);border:3px solid var(--ink);border-radius:14px;padding:10px 14px;text-align:center;min-width:170px}.runner-card .r-name{font-weight:900;font-size:19px}.runner-card .r-emoji{font-size:40px;line-height:1.1}.slot-chip{margin:6px auto;width:120px;border:3px dashed var(--c1);border-radiu :6px;border:3px solid var(--ink);border-radius:8px}.brick{height:12px;background:#e7e5e4;border-radius:2px}.brick.a{background:var(--c1)}.brick.b{background:var(--c2)}.diff-banner{text-align:center;font-size:22px;font-weight:900;padding:8px;border-radius:12px;background:var(--soft)}.diff-banner.good{background:#dcfce7;color:var(--good)}#modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}#modal{background:var(--panel);border:4px solid var(--ink);border-radius:20px;max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:22px 24px;box-shadow:0 10px 0 rgba(0,0,0,.3)}#modal h2{margin:0 0 10px;color:var(--c1);font-size:26px;text-align:center}#modal .m-body{font-size:18px}#modal .m-body p{margin:8px 0}#modal .m-btns{display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap}.star-row{text-align:center;font-size:34px;letter-spacing:6px}@keyframes confetti-fly{0%{transform:translate(0,0) rotate(0deg);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}.confetti-bit{position:fixed;z-index:2000;pointer-events:none;border-radius:3px;animation:confetti-fly var(--dur) ease-out forwards}@media(max-width:640px){body{font-size:16px}.logo{font-size:22px}.menu-hero .big{font-size:32px}.task-card h2{font-size:20px}.gear{width:92px;height:92px}.gear.small{width:64px;height:64px}.socket{width:104px;height:104px}.wall{grid-template-columns:repeat(14,1fr)}}

<body>
<div id="app">
  <header>
    <div class="logo">比例小镇·奇妙工坊大冒险<small>正比例 · 反比例 · 玩着玩着就懂了</small></div>
    <div class="hud">
      <div class="hud-chip" id="hud-time">⏱ 00:00</div>
      <div class="hud-chip" id="hud-steps">🧭 操作 0 次</div>
      <button class="btn small ghost" id="btn-rules">📖 规则说明</button>
    </div>
  </header>

  <!-- 难度选择页 -->
  <section id="screen-menu">
    <div class="menu-hero">
      <div class="big">比例小镇·奇妙工坊</div>
      <div class="sub">拖一拖 · 滑一滑 · 转一转，用双手发现正反比例的秘密！</div>
    </div>
    <div class="tier-row" id="tier-row">
      <div class="tier-card" data-tier="p">
        <div class="t-icon">🌱</div>
        <div class="t-name">初级·学徒工坊</div>
        <div class="t-desc">例题级，温柔上手：水果钱袋、旅程表格、双齿轮咬合、赛跑发令台。</div>
        <div class="t-go">点这里出发 ▶</div>
      </div>
      <div class="tier-card" data-tier="m">
        <div class="t-icon">🔨</div>
        <div class="t-name">中级·工匠工坊</div>
        <div class="t-desc">练习级，稳步进阶：三齿轮咬合、可乐小卖部、大巴车费站、羊村赛跑会。</div>
        <div class="t-go">点这里出发 ▶</div>
      </div>
      <div class="tier-card" data-tier="h">
        <div class="t-icon">⭐</div>
        <div class="t-name">高级·大师工坊</div>
        <div class="t-desc">变式综合，挑战自我：工程砌墙队、机器工地、往返上学路、步行骑车、齿轮观察台。</div>
        <div class="t-go">点这里出发 ▶</div>
      </div>
    </div>
    <div class="menu-tip">每一局的关卡和配色都会随机变化，多玩几次也不会腻哦！</div>
  </section>

  <!-- 游戏页 -->
  <section id="screen-game">
    <div class="mission-top">
      <div class="mission-prog">任务 <span id="mission-idx">1</span>/3 <span class="star" id="mission-stars">☆☆☆</span></div>
      <div class="mission-prog" id="mission-tier-name" style="color:var(--c2);"></div>
    </div>
    <div class="task-card">
      <h2 id="task-title"></h2>
      <div class="story" id="task-story"></div>
      <div class="goal" id="task-goal"></div>
    </div>
    <div id="stage"></div>
    <div class="game-controls">
      <button class="btn" id="btn-reveal">💡 揭示答案</button>
      <button class="btn ghost" id="btn-restart">🔄 重新开始</button>
      <button class="btn ghost" id="btn-back">🏠 返回难度选择</button>
    </div>
  </section>
</div>

<!-- 模态框 -->
<div id="modal-mask"><div id="modal"></div></div>

2:this.tip2})},discovery:'<p>每人 40元 时上了 <b>7 队（56人）</b>，每人 35元 时上了 <b>8 队（64人）</b>——正好多了 8 人！</p><p>总租车费不变，每人车费与人数成<b>反比例</b>：40:35 = 8:7，人数比就是 7:8，相差 1 份 = 8 人。</p><p style="font-weight:800;">总租车费 = 40×56 = 35×64 = <b>2240元</b>。</p>',reveal:"总租车费不变，每人车费与人数成反比。40:35 = 8:7 → 人数比 7:8，1 份 = 8 人：原来 56 人、后来 64 人。总租车费 40×56 = 2240元。"},m4:{tier:"m",icon:"🐑",title:"羊村赛跑会",story:"小灰灰和喜羊羊同时从羊村出发去狼堡（这里用 48 米的模拟道）。小灰灰的速度为 <b>16米/秒</b>，喜羊羊的速度为 <b>12米/秒</b>。",goal:"速度积木有 16米/秒、12米/秒，还有干扰积木 8米/秒、24米/秒。把积木拖给两位选手，按下出发钮——秒表必须正好显示 3 秒和 4 秒！这时的<b>时间比</b>就是原题的答案！",build:function(stage,api){buildRace(stage,api,{track:48,speedUnit:"米/秒",timeUnit:"秒",runners:[{name:"小灰灰",emoji:"🐕",target:3},{name:"喜羊羊",emoji:"🐑",target:4}],chips:[16,12,8,24]})},discovery:'<p>小灰灰 16米/秒 → 48÷16 = <b>3秒</b>；喜羊羊 12米/秒 → 48÷12 = <b>4秒</b>。</p><p>路程相同，时间比 = 速度比反过来：12:16 = <b>3:4</b>——这就是原题"所用时间比"的答案！</p>',reveal:"路程相同，时间比 = 速度反比：12:16 = 3:4。小灰灰 3 秒、喜羊羊 4 秒，时间比 3:4。"},h1:{tier:"h",icon:"🧱",title:"工程砌墙队",story:"【变式挑战】一面工程墙共 <b>126 块砖</b>（工作量固定）。有 <b>16 名工人</b>要分给甲、乙两个施工队，每人效率相同：每队每天砌的砖数 = 队里的人数。甲、乙各自独立砌完一整面墙。",goal:"把 16 名工人拖进甲、乙两队（点队里的工人可放回），让甲队比乙队<b>恰好早 4 天</b>完工！分好后墙体会自动开工演示。",build:function(stage,api){buildWorker(stage,api,{bricks:126,workers:16,targetDiff:4})},discovery:"<p>甲队 <b>9 人</b>：126÷9 = 14 天；乙队 <b>7 人</b>：126÷7 = 18 天——恰好早 4 天！</p><p>工作量一定，效率×时间乘积不变：效率比 9:7，时间比就是反过来 <b>7:9</b>。</p><p>回到原题：甲的效率比乙高 2/7（效率比 9:7），时间比 7:9，1 份 = 4天÷2 = 2 天，乙要 9 份 = <b>18 天</b>单独完成。</p>",reveal:"工作量一定，效率与时间成反比。效率比 9:7 → 时间比 7:9，差 2 份 = 4 天，1 份 = 2 天，乙单独做 9 份 = 18 天。"},h2:{tier:"h",icon:"🏗️",title:"机器工地",story:'【原题变式】一项工程的工作总量是 <b>84 个"机器·时"</b>（1 台机器干 1 小时 = 1 个机器·时）。工地的标准机器台数藏在滑块里！如果<b>增加 2 台</b>机器，用时恰好变成规定时间的 <b>7/8</b>；如果<b>减少 2 台</b>，就要<b>推迟 1 小时</b>做完。',goal:'拖动台数滑块，观察三个时钟：让"加 2 台"的用时条恰好亮 7 格（8 格制）且百分比恰好 87.5%，同时"减 2 台"恰好推迟 1.00 小时——两个条件同时达成！台数与用时成什么比例呢？',build:function(stage,api){buildMachine(stage,api,{minM:8,maxM:20,total:84,answerM:14})},discovery:"<p>答案是 <b>14 台</b>：规定用时 84÷14 = 6 小时。</p><p>加 2 台 → 16 台，84÷16 = 5.25 小时 = 6×7/8 ✓；减 2 台 → 12 台，84÷12 = 7 小时 = 6+1 ✓。</p><p>工作总量一定，机器台数×时间乘积不变，台数与时间成<b>反比例</b>。若由 1 台机器独自完成：14×6 = <b>84 小时</b>。</p>",reveal:"台数与时间成反比。加2台时间×7/8 → 台数比 7:8，2 台 = 1 份 → 原来 14 台、6 小时；验证减 2 台：12 台 7 小时恰好推迟 1 小时。1 台机器需 84 小时。"},h3:{tier:"h",icon:"🚶",title:"往返上学路",story:"小东每天步行上下学。去的时候每秒走 <b>2 米</b>，回来的时候每秒走 <b>1.2 米</b>，上下学<b>共用时 24 分钟</b>。家到学校是同一段固定的路。",goal:'拖动滑块，把 24 分钟分给"去程"和"回程"。看两条距离条——只有当去程距离 = 回程距离（同一段路！）时，平衡灯才会亮！',build:function(stage,api){buildSplit(stage,api,{answerT:9})},discovery:'<p>分对了：<b>去程 9 分钟、回程 15 分钟</b>，去程距离 = 2×60×9 = 1080 米 = 回程 1.2×60×15 = 1080 米！</p><p>路程相同，速度比 2:1.2 = 5:3，时间比就是反过来 <b>3:5</b>；24 分钟 = 8 份，1 份 3 分钟。</p><p style="font-weight:800;">家到学校的距离 = 2米/秒 × 540秒 = <b>1080 米</b>。</p>',reveal:"去回路程相同，速度比 2:1.2 = 5:3 → 时间比 3:5。24 分成 9 分和 15 分，距离 = 2×60×9 = 1080 米。"},h4:{tier:"h",icon:"🚴",title:"步行骑车对对碰",story:"【原题变式】小高从家去高思学校，可以骑车也可以步行。骑车比步行<b>每分钟快 150 米</b>；这段路固定，骑车所用的时间是步行的 <b>2/5</b>（时间比 2:5）。",goal:'拖动"步行速度"滑块：屏幕上步行小人走 5 刻、骑车小人走 2 刻（刻数比等于时间比 5:2）。两条距离条一样长（= 同一段路）时就成功！',build:function(stage,api){buildSpeed(stage,api,{answerV:100})},discovery:'<p>分对了：步行 <b>100米/分</b>，骑车 250米/分。步行 5×100 = 500 米 = 骑车 2×250 = 500 米！</p><p>路程相同，时间比 2:5 → 速度比 <b>5:2</b>（反比例）。骑车比步行快的 150米/分 = 5−2 = 3 份，1 份 = 50米/分。</p><p style="font-weight:800;">原题答案：步行速度 = 2 份 = <b>100 米/分</b>。</p>',reveal:"路程一定，时间比 2:5 → 速度比 5:2。快 150米/分 = 3 份 → 1 份 50米/分，步行 2 份 = 100米/分，骑车 250米/分。"},h5:{tier:"h",icon:"🔍",title:"齿轮观察台",story:"A、B、C 三个齿轮，A 和 B 相互咬合，B 和 C 相互咬合，三个齿轮的<b>齿数之比是 3:4:5</b>（齿轮图为示意，以标注齿数为准）。",goal:"从货架选齿轮按 3:4:5 装上三根轴（同比例的都算对），按启动钮——机器会一直转到 <b>A、C 两齿轮共转满 64 圈</b>时停下，读出 B 齿轮转了多少圈！",build:function(stage,api){buildGear(stage,api,{mode:"observe",sockets:["A","B","C"],shelf:[3,4,5,6,8,10],shelfTitle:"⚙️ 齿轮货架（齿数比 3:4:5 的组合不止一组哦）",runLabel:"🚀 启动机器"})},discovery:'<p>齿数比 3:4:5 → 圈数比 = 反过来：1/3 : 1/4 : 1/5 = <b>20:15:12</b>。</p><p>A、C 共 64 圈 = 20+12 = 32 份，1 份 = 2 圈，所以 B 转了 15×2 = <b>30 圈</b>！</p><p>齿数×圈数乘积一定——反比例让"大齿轮转得慢、小齿轮转得快"。</p>',reveal:"齿数比 3:4:5 → 圈数比 20:15:12。A+C = 32 份 = 64 圈 → 1 份 2 圈，B = 15 份 = 30 圈。"}};var POOLS={p:["p1","p2","p3","p4","p5"],m:["m1","m2","m3","m4"],h:["h1","h2","h3","h4","h5"]};var TIER_NAMES={p:"初级·学徒工坊",m:"中级·工匠工坊",h:"高级·大师工坊"};function gotoMenu(){stopTimer();runCleanups();S.tier=null;$("#screen-game").style.display="none";$("#screen-menu").style.display="block"}function startGame(tier){applyPaletteRandom();S.tier=tier;S.list=shuffle(POOLS[tier]).slice(0,3);S.idx=0;S.steps=0;S.revealed=0;$("#hud-steps").textContent="🧭 操作 0 次";$("#hud-time").textContent="⏱ 00:00";$("#screen-menu").style.display="none";$("#screen-game").style.display="block";startTimer();renderMission()}function currentMission(){return MISSIONS[S.list[S.idx]]}function renderMission(){runCleanups();S.successLock=false;var m=currentMission();$("#mission-idx").textContent=String(S.idx+1);$("#mission-stars").textContent="★".repeat(S.idx)+"☆".repeat(3-S.idx);$("#mission-tier-name").textContent=TIER_NAMES[S.tier];$("#task-title").textContent=m.icon+" "+m.title;$("#task-story").innerHTML=m.story;$("#task-goal").innerHTML="🎯 "+m.goal;var stage=$("#stage");stage.innerHTML="";var api={success:function(){if(S.successLock)return;S.successLock=true;FX.burst(90,false);var last=S.idx===S.list.length-1;showModal({title:"任务完成！",stars:"★".repeat(S.idx+1)+"☆".repeat(3-S.idx-1),html:'<p style="font-weight:800;color:var(--c2);">🪄 发现卡</p>'+m.discovery,buttons:[{label:last?"🎉 查看成果":"下一个任务 ▶",primary:true,cb:function(){if(last){finishGame()}else{S.idx++;renderMission()}}}]})}};m.build(stage,api)}function finishGame(){stopTimer();var sec=Math.floor(Date.now()/1e3)-S.startTs;FX.burst(160,true);setTimeout(function(){FX.burst(120,true)},600);setTimeout(function(){FX.burst(120,true)},1200);showModal({title:"🎉 全部通关，太厉害啦！",stars:"★★★",html:"<p>你在<b>"+TIER_NAMES[S.tier]+"</b>里完成了全部 3 个任务！</p><p>⏱ 用时：<b>"+fmtTime(Math.max(0,sec))+"</b>　🧭 操作：<b>"+S.steps+"</b> 次　💡 揭示答案：<b>"+S.revealed+"</b> 次</p><p>正比例：比值一定，一起变大；反比例：乘积一定，一个变大另一个变小。带着这个秘诀去挑战别的难度吧！</p>",buttons:[{label:"🔁 再玩一次（重新随机）",primary:true,cb:function(){startGame(S.tier)}},{label:"🏠 换个难度",cb:function(){gotoMenu()}}]})}document.querySelectorAll(".tier-card").forEach(function(card){card.addEventListener("click",function(){startGame(card.dataset.tier)})});$("#btn-reveal").addEventListener("click",function(){if(!S.tier)return;S.revealed++;var m=currentMission();showModal({title:"💡 揭秘时间",html:"<p>"+m.reveal+'</p><p style="color:#666;">看完思路可以继续操作哦，胜利还是属于你！</p>'})});$("#btn-restart").addEventListener("click",function(){if(!S.tier)return;renderMission()});$("#btn-back").addEventListener("click",function(){gotoMenu()});$("#btn-rules").addEventListener("click",openRules);function openRules(){showModal({title:"📖 比例小镇游戏规则",html:'<p><b>正比例</b>：两个量的<b>比值</b>一定（例如 路程÷时间=速度 不变），一个变大，另一个也跟着变大。</p><p><b>反比例</b>：两个量的<b>乘积</b>一定（例如 速度×时间=路程 不变），一个变大，另一个反而变小。</p><p><b>玩法</b>：选一个难度开始闯关，每个难度随机抽 3 个小任务。用<b>拖一拖、滑一滑、转一转</b>的方式完成任务目标——比如装满钱袋、装配齿轮、给选手发速度积木、分派工人。</p><p><b>右上角</b>有计时器和操作次数。卡住了点"💡 揭示答案"看思路；"🔄 重新开始"重玩当前任务；"🏠 返回难度选择"换个难度。</p><p><b>过关秘诀</b>：钱数、路程、工作量固定时，另外两个量往往成反比例；单价、速度固定时，就成正比例。</p><p style="font-weight:800;color:var(--c1);">祝你在比例小镇玩得开心！</p>'})}gotoMenu();openRules();
