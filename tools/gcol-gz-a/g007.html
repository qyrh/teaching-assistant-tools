<style>:root{--c-bg:#FFF6EA;--c-card:#FFFFFF;--c-primary:#D95D0E;--c-sub:#8A4B14;--c-accent:#0E7C5A;--c-ink:#33241A;--c-soft:#FFE4C8;--c-line:#E8D5BC}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}body{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;background:var(--c-bg);color:var(--c-ink);font-size:17px;line-height:1.65}#app{max-width:1020px;margin:0 auto;padding:12px 14px 30px;display:flex;flex-direction:column;min-height:100%}#topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--c-primary);color:#fff;border-radius:16px;padding:12px 18px;box-shadow:0 4px 14px rgba(0,0,0,.12);flex-wrap:wrap}#brand{font-size:22px;font-weight:800;letter-spacing:1px}#brand small{display:block;font-size:13px;font-weight:400;opacity:.92;letter-spacing:0}#hud{display:flex;gap:10px;flex-wrap:wrap}.hud-chip{background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.55);padding:4px 14px;border-radius:999px;font-size:17px;font-weight:700;min-width:112px;text-align:center}#stage{flex:1;margin-top:14px}.intro-title{text-align:center;margin:18px 0 6px;font-size:30px;font-weight:800;color:var(--c-primary)}.intro-sub{text-align:center;margin-bottom:20px;font-size:17px;color:var(--c-sub)}.diff-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}.diff-card{flex:1;min-width:250px;max-width:320px;background:var(--c-card);border:3px solid var(--c-primary);border-radius:20px;padding:22px 18px;cursor:pointer;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.08);transition:transform .15s ease,box-shadow .15s ease;margin-bottom:12px}.diff-card:hover{transform:translateY(-5px);box-shadow:0 10px 22px rgba(0,0,0,.14)}.diff-card h3{font-size:24px;color:var(--c-primary);margin-bottom:8px}.diff-card .stars{color:#E8A200;font-size:21px;letter-spacing:3px;margin-bottom:8px}.diff-card p{font-size:15.5px;color:var(--c-sub)}.pal-note{text-align:center;margin-top:14px;font-size:15px;color:var(--c-sub)}.level-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}.lv-chip{background:var(--c-accent);color:#fff;font-weight:700;padding:4px 14px;border-radius:999px;font-size:16px}.lv-name{font-size:24px;font-weight:800;color:var(--c-primary)}.q-card{background:var(--c-card);border:2.5px solid var(--c-line);border-left:10px solid var(--c-primary);border-radius:14px;padding:14px 18px;margin-bottom:12px;box-shadow:0 3px 10px rgba(0,0,0,.05)}.q-title{font-weight:800;color:var(--c-sub);font-size:16px;margin-bottom:4px}.q-body{font-size:18px}.goal-bar{background:var(--c-soft);border-radius:12px;padding:9px 16px;margin-bottom:12px;font-size:17px;color:var(--c-sub);font-weight:600}.canvas-wrap{position:relative;background:var(--c-card);border:2.5px solid var(--c-line);border-radius:14px;padding:6px;margin-bottom:12px;box-shadow:0 3px 10px rgba(0,0,0,.05)}#cv{display:block;width:100%;height:480px;touch-action:none;border-radius:10px}#burst-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:14px}.burst-dot{position:absolute;width:12px;height:12px;border-radius:50%;animation:burst-fly 1s ease-out forwards}@keyframes burst-fly{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.35);opacity:0}}.ruler-box{background:var(--c-card);border:2.5px solid var(--c-line);border-radius:14px;padding:12px 18px;margin-bottom:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}.ruler-name{font-weight:800;font-size:19px;color:var(--c-sub);min-width:64px}.ruler-track{flex:1;min-width:220px;height:40px;position:relative;touch-action:none}.ruler-rail{position:absolute;left:0;right:0;top:15px;height:10px;border-radius:6px;background:var(--c-soft);border:2px solid var(--c-line)}.ruler-knob{position:absolute;top:1px;width:30px;height:38px;border-radius:10px;background:var(--c-primary);border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.25);cursor:grab}.ruler-knob::after{content:"↔";color:#fff;font-size:16px;display:block;text-align:center;line-height:32px;font-weight:800}.ruler-val{font-size:20px;font-weight:800;color:var(--c-primary);min-width:120px;text-align:right}#live{background:var(--c-card);border:2.5px solid var(--c-line);border-radius:14px;padding:10px 16px;margin-bottom:12px;font-size:17.5px;min-height:46px}#live .ok{color:var(--c-accent);font-weight:800}#live .bad{color:#C0392B;font-weight:800}#live .warn{color:#B34A00;font-weight:800}#live .hint-txt{color:var(--c-sub);font-style:italic}.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}button{font-family:inherit;font-size:17.5px;font-weight:700;padding:10px 20px;border-radius:12px;border:none;cursor:pointer;transition:transform .12s ease,opacity .12s;color:#fff}button:active{transform:scale(.95)}button:disabled{opacity:.45;cursor:not-allowed}.btn-main{background:var(--c-primary)}.btn-mid{background:var(--c-accent)}.btn-ghost{background:#8A7968}.btn-warn{background:#B34A00}.btn-big{font-size:20px;padding:13px 30px}#answer-panel{background:#FFFBEF;border:2.5px solid #E8A200;border-radius:14px;padding:14px 18px;margin-bottom:12px}#answer-panel h4{color:#B34A00;font-size:18px;margin-bottom:4px}#answer-panel .ans-line{font-size:20px;font-weight:800;color:var(--c-accent);margin-bottom:8px}#answer-panel p{font-size:16.5px}#podium{background:var(--c-card);border:2.5px solid var(--c-line);border-radius:14px;padding:14px 18px;margin-bottom:12px}.pod-title{font-size:18px;font-weight:800;color:var(--c-primary);margin-bottom:10px}.pod-main{display:flex;gap:14px;flex-wrap:wrap}.pod-bars{flex:1;min-width:230px;display:flex;align-items:flex-end;gap:16px;height:170px;border-bottom:3px solid var(--c-line);padding:0 8px}.pbar{flex:1;border-radius:8px 8px 0 0;background:var(--c-primary);opacity:.85;position:relative}.pbar span{position:absolute;top:-24px;left:0;right:0;text-align:center;font-weight:800;font-size:15px;color:var(--c-sub)}.pod-slots{flex:1;min-width:230px;display:flex;flex-direction:c <script>"use strict";const $=s=>document.querySelector(s);const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));const fmt=(v,d=2)=>{if(!isFinite(v))return"∞";const p=Math.pow(10,d);return(Math.round(v*p)/p).toString()};function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function initCanvas(cv2){const dpr=window.devicePixelRatio||1;const rect=cv2.getBoundingClientRect();cv2.width=Math.round(rect.width*dpr);cv2.height=Math.round(rect.height*dpr);const ctx=cv2.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);return{ctx,W:rect.width,H:rect.height}}function makeView(env,x0,x1,y0,y1,padL=52,padR=18,padT=18,padB=44){const{W,H}=env;const X=x=>padL+(x-x0)/(x1-x0)*(W-padL-padR);const Y=y=>H-padB-(y-y0)/(y1-y0)*(H-padT-padB);const iX=px=>x0+(px-padL)/(W-padL-padR)*(x1-x0);const iY=py=>y0+(H-padB-py)/(H-padT-padB)*(y1-y0);return{x0,x1,y0,y1,X,Y,iX,iY,W,H,padL,padR,padT,padB,ctx:env.ctx}}function drawStar(ctx,px,py,r,fill,stroke){ctx.save();ctx.beginPath();for(let i=0;i<5;i++){const a1=-Math.PI/2+i*2*Math.PI/5;const a2=a1+Math.PI/5;ctx.lineTo(px+Math.cos(a1)*r,py+Math.sin(a1)*r);ctx.lineTo(px+Math.cos(a2)*r*.45,py+Math.sin(a2)*r*.45)}ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=stroke;ctx.stroke();ctx.restore()}function glowDot(ctx,px,py,r,color){ctx.save();ctx.shadowColor=color;ctx.shadowBlur=14;ctx.fillStyle=color;ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fill();ctx.restore()}function chip(ctx,px,py,text,bg,fg="#fff",font='bold 16px "Microsoft YaHei",sans-serif'){ctx.save();ctx.font=font;const w=ctx.measureText(text).width+18;const h=26;ctx.fillStyle=bg;ctx.beginPath();const r=8,x=px-w/2,y=py-h/2;ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();ctx.fill();ctx.fillStyle=fg;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(text,px,py+1);ctx.restore()}function drawAxes(V,xTicks,yTicks,xName="x",yName="y"){const ctx=V.ctx;ctx.save();ctx.lineWidth=2.5;ctx.strokeStyle="#6B5E52";ctx.font='16px "Microsoft YaHei",sans-serif';ctx.fillStyle="#6B5E52";ctx.textAlign="center";ctx.textBaseline="top";const y0px=V.Y(clamp(0,V.y0,V.y1));const x0px=V.X(clamp(0,V.x0,V.x1));ctx.beginPath();ctx.moveTo(V.padL-10,y0px);ctx.lineTo(V.W-V.padR+4,y0px);ctx.stroke();ctx.beginPath();ctx.moveTo(V.W-V.padR+10,y0px);ctx.lineTo(V.W-V.padR,y0px-6);ctx.lineTo(V.W-V.padR,y0px+6);ctx.closePath();ctx.fill();ctx.fillText(xName,V.W-V.padR-4,y0px-26);ctx.beginPath();ctx.moveTo(x0px,V.H-V.padB+10);ctx.lineTo(x0px,V.padT-4);ctx.stroke();ctx.beginPath();ctx.moveTo(x0px,V.padT-10);ctx.lineTo(x0px-6,V.padT);ctx.lineTo(x0px+6,V.padT);ctx.closePath();ctx.fill();ctx.fillText(yName,x0px+16,V.padT-6);ctx.textBaseline="top";for(const t of xTicks){if(t<V.x0||t>V.x1||t===0)continue;const p=V.X(t);ctx.beginPath();ctx.moveTo(p,y0px-5);ctx.lineTo(p,y0px+5);ctx.stroke();ctx.fillText(fmt(t,Math.abs(t)<1?1:0),p,y0px+7)}ctx.textAlign="right";ctx.textBaseline="middle";for(const t of yTicks){if(t<V.y0||t>V.y1||t===0)continue;const p=V.Y(t);ctx.beginPath();ctx.moveTo(x0px-5,p);ctx.lineTo(x0px+5,p);ctx.stroke();ctx.fillText(fmt(t,Math.abs(t)<1?1:0),x0px-8,p)}ctx.textAlign="right";ctx.textBaseline="top";ctx.fillText("O",x0px-6,y0px+5);ctx.restore()}function drawCurve(V,fn,color,width=4,dash=null){const ctx=V.ctx;ctx.save();ctx.lineWidth=width;ctx.strokeStyle=color;ctx.lineJoin="round";ctx.lineCap="round";if(dash)ctx.setLineDash(dash);const n=700,R=V.y1-V.y0;ctx.beginPath();let pen=false,lastY=null;for(let i=0;i<=n;i++){const x=V.x0+(V.x1-V.x0)*i/n;const y=fn(x);if(!isFinite(y)||Math.abs(y)>R*50){pen=false;lastY=null;continue}const jump=lastY!==null&&Math.abs(y-lastY)>R*1.5;const yc=clamp(y,V.y0-R*2,V.y1+R*2);if(!pen||jump){ctx.moveTo(V.X(x),V.Y(yc));pen=true}else ctx.lineTo(V.X(x),V.Y(yc));lastY=y}ctx.stroke();ctx.restore()}function findRoots(fn,k,doms,touchTol=.004,n=1500){const roots=[];const near=r=>roots.some(s=>Math.abs(s-r)<.06);for(const[a,b]of doms){if(b<=a)continue;const step=(b-a)/n;let px=a,pv=fn(a)-k;for(let i=1;i<=n;i++){const x=a+i*step,v=fn(x)-k;if(pv<0&&v>0||pv>0&&v<0){let lo=px,hi=x,fl=pv;for(let j=0;j<48;j++){const m=(lo+hi)/2,fm=fn(m)-k;if(fl*fm<=0)hi=m;else{lo=m;fl=fm}}const r=(lo+hi)/2;if(!near(r))roots.push(r)}px=x;pv=v}let bestX=a,bestV=Math.abs(fn(a)-k),desc=false;for(let i=1;i<n;i++){const x=a+i*step,av=Math.abs(fn(x)-k);if(av<bestV){bestV=av;bestX=x;desc=true}else{if(desc&&bestV<=touchTol&&bestX!==null&&!near(bestX))roots.push(bestX);bestV=av;bestX=x;desc=false}}}roots.sort((p,q)=>p-q);return roots}const PALETTES=[{name:"晨曦橙",bg:"#FFF6EA",card:"#FFFFFF",primary:"#D95D0E",sub:"#8A4B14",accent:"#0E7C5A",ink:"#33241A",soft:"#FFE4C8",line:"#E8D5BC"},{name:"湖畔青",bg:"#ECF7F4",card:"#FFFFFF",primary:"#0B7A75",sub:"#0A5A56",accent:"#C25E00",ink:"#12332F",soft:"#C9EDE7",line:"#BFE0DA"},{name:"晴空蓝",bg:"#EDF3FE",card:"#FFFFFF",primary:"#1D5FD6",sub:"#17479E",accent:"#B34A00",ink:"#1B2A4A",soft:"#D3E2FC",line:"#C2D4F2"},{name:"蜜桃粉",bg:"#FDF0F2",card:"#FFFFFF",primary:"#C43E6B",sub:"#8E2C4E",accent:"#0E7C5A",ink:"#3A2130",soft:"#FBD6DF",line:"#F0C3CE"},{name:"田园绿",bg:"#F1F9E8",card:"#FFFFFF",primary:"#4C8A0E",sub:"#37660A",accent:"#B34A00",ink:"#24361A",soft:"#E2F3C8",line:"#CFE5B0"},{name:"葡萄紫",bg:"#F4EFFB",card:"#FFFFFF",primary:"#6C3FC0",sub:"#4E2C8B",accent:"#0E7C5A",ink:"#2B2140",soft:"#E3D8F8",line:"#D2C4EE"}];const GOLD="#E8A200";let PAL=null;function applyPalette(p){PAL=p;const r=document.documentElement.style;r.setProperty("--c-bg",p.bg);r.setProperty("--c-card",p.card);r.setProperty("--c-primary",p.primary);r.setProperty("--c-sub",p.sub);r.setProperty("--c-accent",p.accent);r.setProperty("--c-ink",p.ink);r.setProperty("--c-soft",p.soft);r.setProperty("--c-line",p.line)}const state={difficulty:null,levels:[],idx:0,steps:0,stars:0,t0:0,timerId:null,finished:false};let cur=null;let cv=null;function tickTimer(){const s=Math.floor((Date.now()-state.t0)/1e3);const mm=String(Math.floor(s/60)).padStart(2,"0");const ss=String(s%60).padStart(2,"0");$("#hud-time").textContent="用时 "+mm+":"+ss}function addStep(n=1){state.steps+=n;$("#hud-step").textContent="步数 "+state.steps}function showSelect(){stopRun();state.finished=false;$("#stage").innerHTML=`
    <div class="intro-title">欢迎来到数形结合探险岛</div>
    <div class="intro-sub">方程的根藏在曲线的交点里，参数的范围藏在临界的瞬间里 —— 动手调一调，亲眼看到数学！</div>
    <div class="diff-row">

        <h3>高级 · 综合挑战</h3>

th>=2?`相交 ${roots.length} 点（还不相切）`:roots.length===1?"恰好经过同一点":"相离，没有公共点";chip(ctx,V.W/2,V.padT+14,`a = ${fmt(rt.a,2)}：${st}`,tang?PAL.accent:PAL.primary,"#fff",'bold 17px "Microsoft YaHei",sans-serif');rt.live(`拖动滑杆改变 <b>a</b>：观察两曲线由<b>相离</b> → <b>相切</b> → <b>相交两点</b>。调到"恰好相切"（切点会亮圈）再【锁定】。`)};rt.init=function(){this.render();makeRuler($("#ruler-area"),{name:"a",min:.05,max:3,value:rt.a,fmtFn:v=>`a = ${fmt(v,2)}`,onInput:v=>{rt.a=v;rt.render()}})};rt.lock=function(){this.attempts++;if(this.done)return;if(Math.abs(this.a-1)<=.06)doPass();else doFail(this.a<1?"两曲线还相离着呢，把 a 调大一点。":'两曲线已经相交出两个交点了，往回一点，找"恰好碰到"的瞬间。')};return rt}function makeRing2(def){const rt=baseRT(def);rt.h=2+Math.random()*2.5;rt.render=function(){rt.env=initCanvas(cv);const V=rt.V=makeView(rt.env,-6.6,6.6,-7.6,3.7);const ctx=V.ctx;ctx.fillStyle=PAL.card;ctx.fillRect(0,0,V.W,V.H);const h=rt.h,L=Math.sqrt(4+h*h),r=L/2;ctx.save();ctx.strokeStyle=PAL.line;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(V.padL,V.Y(0));ctx.lineTo(V.W-V.padR,V.Y(0));ctx.stroke();ctx.restore();ctx.save();ctx.strokeStyle=PAL.accent;ctx.lineWidth=5;ctx.shadowColor=PAL.accent;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(V.X(0),V.Y(-2),V.X(r)-V.X(0),0,Math.PI*2);ctx.stroke();ctx.restore();ctx.save();ctx.strokeStyle=PAL.primary;ctx.lineWidth=7;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(V.X(-L/2),V.Y(0));ctx.lineTo(V.X(L/2),V.Y(0));ctx.stroke();ctx.restore();ctx.save();ctx.setLineDash([6,6]);ctx.strokeStyle=PAL.sub;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(V.X(0),V.Y(-2));ctx.lineTo(V.X(0),V.Y(0));ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=PAL.sub;ctx.font='bold 16px "Microsoft YaHei",sans-serif';ctx.textAlign="left";ctx.fillText("球心 M（BG 中点）",V.X(.25),V.Y(-2));ctx.fillText("距离恒为 2",V.X(.25),V.Y(-1));ctx.textAlign="center";ctx.fillText("D",V.X(-L/2)-2,V.Y(0)+24);ctx.fillText("E",V.X(L/2)+2,V.Y(0)+24);ctx.fillText("线段 DE（长度 √(h²+4)）",V.X(0),V.Y(0)+44);ctx.restore();glowDot(ctx,V.X(0),V.Y(-2),9,PAL.sub);const touch=r>=2;if(touch){const dx=Math.sqrt(Math.max(0,r*r-4));for(const s of[-dx,dx])drawStar(ctx,V.X(s),V.Y(0),15,GOLD,"#8A5A00")}chip(ctx,V.W/2,V.padT+14,`h = CG = ${fmt(h,2)}，光环半径 = √(h²+4)/2 = ${fmt(r,2)}${touch?" ≥ 2 触到 DE":" < 2 够不到"}`,touch?PAL.accent:PAL.primary,"#fff",'bold 17px "Microsoft YaHei",sans-serif');rt.live(`拖动滑杆改变 <b>h</b>（边 CG 的长度）。GP⊥PB ⇔ P 在以 BG 为直径的球面上；球心到 DE 的距离恒为 2，半径随 h 增大。任务：找光环<b>恰好够到</b> DE 的最小 h。${Math.abs(h-2*Math.sqrt(3))<.18?' <span class="ok">就在这个位置附近！</span>':""}`)};rt.init=function(){this.render();makeRuler($("#ruler-area"),{name:"h",min:.3,max:8,value:rt.h,fmtFn:v=>`h = ${fmt(v,2)}`,onInput:v=>{rt.h=v;rt.render()}})};rt.lock=function(){this.attempts++;if(this.done)return;const t=2*Math.sqrt(3);if(Math.abs(this.h-t)<=.18)doPass();else if(this.h>t)doFail(`h=${fmt(this.h,2)} 光环已经能碰到 DE，但不是"最小"。往左回调到恰好触线的瞬间。`);else doFail(`h=${fmt(this.h,2)} 光环半径还不足 2，够不到 DE。继续调大。`)};return rt}const LEVELS={L1:{name:"对数山峰取宝",diff:"初级",question:`<b>例1</b> · 若 a = ln2 / 2，b = ln3 / 3，c = ln5 / 5，比较 a、b、c 的大小。<br>
      <b>操作</b>：曲线 y = ln x / x 已经画好。先把 x = 2、3、5 处的三颗<b>取值珠</b>沿虚线拖到曲线上（靠近会吸附点亮），再把 a、b、c 三个名牌拖上领奖台按大小排队，【锁定】。`,goal:"三颗取值珠吸到曲线上，名牌排出正确的大小顺序",hint:'观察曲线：先升后降，峰顶在 x = e ≈ 2.72。三处的"海拔"谁高谁低？',answer:"c < a < b（b 最大，a 次之，c 最小）",analysis:`构造 f(x) = ln x / x，f′(x) = (1 − ln x)/x²：在 (0, e) 递增、(e, +∞) 递减。f(2) ≈ 0.347、f(3) ≈ 0.366、f(5) ≈ 0.322。也可交叉同乘：3ln2 = ln8 < ln9 = 2ln3 ⇒ a < b；5ln3 = ln243 > ln125 = 3ln5 ⇒ b > c；5ln2 = ln32 > ln25 = 2ln5 ⇒ a > c。故 c < a < b。`,make:makePod},L2:{name:"水平光线摘星台",diff:"初级",question:`<b>例7</b> · 已知函数 f(x) = |3<sup>x</sup> − 2| − m 有两个不同的零点，则实数 m 的取值范围是____。<br>
      <b>操作</b>：零点个数 = 直线 y = m 与曲线 y = |3<sup>x</sup> − 2| 的交点数。拖动<b>水平光线</b>，让曲线恰好亮起 <b>2 颗星</b>，【锁定】。`,goal:"拖动水平光线，使交点（星星）恰好为 2 个",hint:'曲线最低点值是 0，左边远处贴着高度 2 的"地板"走。光线要放在 0 和 2 之间。',answer:"m ∈ (0, 2)",analysis:`y = m 与 y = |3^x − 2| 有两个交点 ⇔ 0 < m < 2。因为曲线在 x = log₃2 处取最小值 0；x → −∞ 时 |3^x − 2| → 2（贴线不相交）；x → +∞ 时 → +∞。m ≤ 0 时至多 1 个交点，m ≥ 2 时只有 1 个交点。`,make:def=>makeLight(def,{cfg:{kName:"m",target:2,fn:x=>Math.abs(Math.pow(3,x)-2),fnName:"y = |3ˣ − 2|",fnLabelY:5,vx0:-4,vx1:4,vy0:-.4,vy1:5.5,xTicks:[-3,-2,-1,1,2,3],yTicks:[1,2,3,4,5],doms:[[-10,4]],touchTol:.004,kInit:()=>3+Math.random()*1.8}})},L3:{name:"零点列队",diff:"初级",question:`<b>测试2</b> · 已知函数 f(x) = x + 2<sup>x</sup>，g(x) = x + ln x，h(x) = x − √x − 1 的零点分别为 x₁，x₂，x₃。<br>
      <b>操作</b>：x + 2<sup>x</sup> = 0 ⇔ 2<sup>x</sup> = −x（找 <b>y = 2<sup>x</sup></b> 与虚线 <b>y = −x</b> 的交点）；x + ln x = 0 ⇔ ln x = −x；x − √x − 1 = 0 ⇔ √x = x − 1。把甲、乙、丙三枚星标沿数轴拖到<b>对应交点</b>的正下方，【锁定】。`,goal:"甲乙丙三枚星标吸附在三个正确的交点位置上",hint:'甲找"指数曲线与下坡虚线"的交点；乙找"对数曲线与同一条下坡虚线"的交点；丙找"根号曲线与缓坡虚线 y = x−1"的交点。原点和 (1,0) 处的"擦边"接触是迷惑项，要排除。',answer:"x₁ ≈ −0.64，x₂ ≈ 0.57，x₃ = (3+√5)/2 ≈ 2.62，故 x₁ < x₂ < x₃",analysis:`把每个零点方程改写成"两曲线相交"：2^x = −x 的交点在第三象限附近 x₁ ∈ (−1, 0)；ln x = −x 的交点 x₂ ∈ (0, 1)；√x = x − 1（需 x ≥ 1）两边平方得 x² − 3x + 1 = 0，取大根 x₃ = (3+√5)/2 ≈ 2.62。于是 x₁ < 0 < x₂ < 1 < x₃。`,make:def=>makeTokens(def,{cfg:{vx0:-2.6,vx1:4.2,vy0:-3.2,vy1:4.6,xTicks:[-2,-1,1,2,3,4],yTicks:[-2,-1,1,2,3,4],lines:[{fn:x=>-x,name:"y = −x（虚线）"},{fn:x=>x-1,name:"y = x − 1（虚线）"}],curves:[{fn:x=>Math.pow(2,x),color:"#C25E9A",name:"y = 2ˣ"},{fn:x=>x>.02?Math.log(x):NaN,color:"#5A78C8",name:"y = ln x"},{fn:x=>x>=0?Math.sqrt(x):NaN,color:"#2E8B57",name:"y = √x"}],tokens:[{label:"甲(x₁)",color:"#C25E9A",target:-.6412,initX:1.6},{label:"乙(x₂)",color:"#5A78C8",target:.5671,initX:-1.8},{label:"丙(x₃)",color:"#2E8B57",target:2.618,initX:.9}]}})},V1:{name:"摘星台 · 变式训练",diff:"初级",question:`<b>变式（同型自编）</b> · 已知函数 f(x) = |2<sup>x</sup> − 1| − m 有两个不同的零点，则实数 m 的取值范围是____。<br>
      <b>操作</b>：同上一关——拖动水平光线到"恰好 2 颗星"的位置，【锁定】。注意这条曲线左边远处的"地板"高度和上一关不同。`,goal:"拖动水平光线，使交点恰好为 2 个",hint:"|2^x − 1| 的最小值是 0（x = 0 处），而 x → −∞ 时它贴着高度 1 走。",answer:"m ∈ (0, 1)",analysis:`y = m 与 y = |2^x − 1| 有两个交点 ⇔ 0 < m < 1：曲线在 x = 0 取最小值 0，左端无限贴近 1 但不相交，右端趋于 +∞。m ≥ 1 时左边没有交点，只剩右侧 1 个；m ≤ 0 时至多 1 个。`,make:def=>makeLight(def,{cfg:{kName:"m",target:2,fn:x=>Math.abs(Math.pow(2,x)-1),fnName:"y = |2ˣ − 1|",fnLabelY:3.4,vx0:-4,vx1:4,vy0:-.3,vy1:4,xTicks:[-3,-2,-1,1,2,3],yTicks:[1,2,3],doms:[[-16,4]],touchTol:.004,kInit:()=>2.2+Math.random()*1.4}})},L5:{name:"解集扫描带",diff:"中级",question:`<b>例2</b> · 不等式 8/(x+1)³ + 10/(x+1) − x³ − 5x > 0 的解集是____（原题选项 D）。<br>
      <b>操作</b>：构造 f(x) = x³ + 5x（奇函数且一直上升），则原式 ⇔ f( 2/(x+1) ) > f(x) ⇔ 比较曲线上 P、Q 两点谁高。先拖<b>探针</b>（x 轴上的方块）扫出成立区段（P 在上=成立），再拖下方两根<b>解集亮带</b>的手柄框出完整解集，【锁定】。`,goal:"两条亮带精确框住不等式的全部解集",hint:"f 一直上升，所以 f(P) > f(Q) ⇔ P 的横坐标 2/(x+1) > x。移项解 2/(x+1) − x > 0，注意分母变号要分类；解集是两段，且 x = −1 处断开。",answer:"(−∞, −2) ∪ (−1, 1)",analysis:`设 f(x) = x³ + 5x，f′ = 3x² + 5 > 0 严格递增。原不等式 ⇔ f(2/(x+1)) > f(x) ⇔ 2/(x+1) > x。当 x > −1：2 > x² + x ⇔ (x+2)(x−1) < 0，取 (−1, 1)；当 x < −1：2 < x² + x ⇔ x < −2 或 x > 1，取 x < −2。故解集 (−∞, −2) ∪ (−1, 1)。`,make:makeScan},L6:{name:"指数滑轨摘星",diff:"中级",question:`<b>例5</b> · 已知方程 x·e<sup>−2x</sup> + k = 0 在区间 (−2, 2) 内恰有两个实根，则 k 的取值范围是____。<br>
      <b>操作</b>：把方程改写成 k = −x·e<sup>−2x</sup>，根的个数 = 水平光线 y = k 与曲线在<b>亮窗 (−2, 2) 内</b>的交点数（窗外不算！）。拖动光线到"窗内恰好 2 颗星"，【锁定】。`,goal:"亮窗 (−2,2) 内交点恰好 2 个",hint:"曲线在 x = 1/2 处有最低点 −1/(2e) ≈ −0.184，右端 x→2 时趋向 −2/e⁴ ≈ −0.037（开区间取不到）。光线要夹在这两个值之间。",answer:"k ∈ ( −1/(2e) , −2/e⁴ )，约 (−0.184, −0.037)",analysis:`k = −x·e^(−2x) = g(x)。g′(x) = e^(−2x)(2x − 1)：x < 1/2 递减、x > 1/2 递增，g(1/2) = −1/(2e)；g(2) = −2/e⁴，但 (−2,2) 是开区间，右端值取不到。所以左支必有 1 个根，右支再要 1 个根 ⇔ −1/(2e) < k < −2/e⁴。`,make:def=>makeLight(def,{cfg:{kName:"k",target:2,fn:x=>-x*Math.exp(-2*x),fnName:"y = −x·e^(−2x)",fnLabelY:.32,vx0:-2.5,vx1:2.5,vy0:-.26,vy1:.38,xTicks:[-2,-1,1,2],yTicks:[-.2,-.1,.1,.2,.3],win:[-2,2],doms:[[-1.996,1.996]],touchTol:.002,kInit:()=>.2+Math.random()*.12}})},L7:{name:"参数炼成炉",diff:"中级",question:`<b>例8</b> · 若函数 f(x) = 4<sup>x</sup> − m·2<sup>x</sup> + m + 3 有两个不同的零点 x₁，x₂，且 x₁ ∈ (0, 1)，x₂ ∈ (2, +∞)，则实数 m 的取值范围为____（原题选项 C）。<br>
      <b>操作</b>：令 t = 2<sup>x</sup>，方程化为 t² − mt + m + 3 = 0；条件即两根 t₁ ∈ (1, 2)、t₂ ∈ (4, +∞)。拖动下方滑杆改变 <b>m</b>，把抛物线与 t 轴的两颗根珠送进两条亮带，【锁定】。`,goal:"小根落入 (1,2) 亮带，大根落入 (4,+∞) 亮带",hint:"g(1) = 4 恒正；让 g(2) = 7 − m 变负就能把一根压进 (1,2)；此时大根 = m − 小根，自然超过 4。",answer:"m ∈ (7, +∞)",analysis:`t = 2^x：x₁∈(0,1) ⇒ t₁∈(1,2)；x₂∈(2,+∞) ⇒ t₂∈(4,+∞)。g(t)=t²−mt+m+3，g(1)=4>0，g(2)=7−m<0 ⇒ m>7（恰一根在 (1,2)）。此时大根 t₂ = m − t₁ > m − 2 > 5 > 4 ✓。故 m ∈ (7, +∞)。`,make:def=>makeRootRuler(def,{cfg:{pName:"m",pMin:0,pMax:12,init:3+Math.random()*2,t0:0,t1:7,y0:-7.5,y1:15,tTicks:[1,2,3,4,5,6],yTicks:[-5,5,10],zones:[{from:1,to:2,color:"#5A78C8",label:"t₁ ∈ (1,2)"},{from:4,to:7.1,color:"#C25E9A",label:"t₂ ∈ (4,+∞)"}],quadA:1,quadB:p=>-p,quadC:p=>p+3,parabolaName:p=>`y = t² − ${fmt(p,2)}·t + ${fmt(p+3,2)}`,rootsInfo:p=>{const d=p*p-4*(p+3);if(d<=0)return{roots:[]};return{roots:[(p-Math.sqrt(d))/2,(p+Math.sqrt(d))/2]}},rootOK:r=>r>1&&r<2,pass:(p,info)=>info.roots.length===2&&info.roots[0]>1&&info.roots[0]<2&&info.roots[1]>4,failMsg:(p,info)=>{if(info.roots.length===0)return`m=${fmt(p,2)} 时判别式 m²−4m−12 ≤ 0，抛物线碰不到 t 轴。把 m 调过 6 试试。`;return`当前小根 t₁=${fmt(info.roots[0],2)}、大根 t₂=${fmt(info.roots[1],2)}，还没分别落进蓝色带 (1,2) 与粉色带 (4,+∞)。`},live:(p,info)=>info.roots.length===2?`m = <b>${fmt(p,2)}</b>，两根 t₁ = <b>${fmt(info.roots[0],2)}</b>、t₂ = <b>${fmt(info.roots[1],2)}</b>。${info.roots[0]>1&&info.roots[0]<2&&info.roots[1]>4?'<span class="ok">两颗根珠都进带了，锁定！</span>':"继续拖滑杆……"}`:`m = <b>${fmt(p,2)}</b>，抛物线与 t 轴没有交点（无实根）。`}})},L8:{name:"参数炼成炉 · 二号",diff:"中级",question:`<b>例9</b> · 方程 4<sup>x</sup> − a·2<sup>x+1</sup> + 1 = 0 在 x ∈ [−1, 1] 上有解，则实数 a 的取值范围是____。<br>
      <b>操作</b>：令 t = 2<sup>x</sup> ∈ [1/2, 2]，方程化为 t² − 2at + 1 = 0，"有解" ⇔ 抛物线与 t 轴<b>至少一个交点</b>落在亮带 [1/2, 2] 内。拖动滑杆改变 <b>a</b>，【锁定】。`,goal:"至少一个根落在亮带 [1/2, 2] 内",hint:"也可以反解：a = (t + 1/t)/2，让 t 在 [1/2, 2] 上走一圈，看 a 能取哪些值（对勾函数的值域）。",answer:"a ∈ [1, 5/4]",analysis:`t = 2^x ∈ [1/2, 2]，t² − 2at + 1 = 0 有解 ⇔ a = (t + 1/t)/2 对某 t ∈ [1/2, 2] 成立。对勾函数在 t = 1 取最小 1，在端点 t = 1/2（或 2）取最大 (1/2 + 2)/2 = 5/4。故 a ∈ [1, 5/4]。`,make:def=>makeRootRuler(def,{cfg:{pName:"a",pMin:0,pMax:3,init:.4+Math.random()*.5,t0:0,t1:3.6,y0:-8.5,y1:6,tTicks:[1,2,3],yTicks:[-5,5],zones:[{from:.5,to:2,color:"#5A78C8",label:"t ∈ [1/2, 2] 亮带"}],quadA:1,quadB:p=>-2*p,quadC:()=>1,parabolaName:p=>`y = t² − ${fmt(2*p,2)}·t + 1`,rootsInfo:p=>{const d=4*(p*p-1);if(d<0)return{roots:[]};return{roots:[p-Math.sqrt(p*p-1),p+Math.sqrt(p*p-1)]}},rootOK:r=>r>=.5-1e-9&&r<=2+1e-9,pass:(p,info)=>info.roots.some(r=>r>=.5-1e-9&&r<=2+1e-9),failMsg:(p,info)=>info.roots.length===0?`a=${fmt(p,2)} < 1，判别式还是负的，抛物线悬在 t 轴上方。`:`两根 ${fmt(info.roots[0],2)} 和 ${fmt(info.roots[1],2)} 都在亮带外面。提示：a=(t+1/t)/2，亮带内的 t 对应 a∈[1, 1.25]。`,live:(p,info)=>{if(info.roots.length===0)return`a = <b>${fmt(p,2)}</b>，无实根（a < 1 时对勾够不到）。`;const ok=info.roots.some(r=>r>=.5-1e-9&&r<=2+1e-9);return`a = <b>${fmt(p,2)}</b>，两根 t = ${fmt(info.roots[0],2)}、${fmt(info.roots[1],2)}。${ok?'<span class="ok">有根落在亮带里，可以锁定！</span>':"根都在带外，继续调。"}`}}})},L9:{name:"直角光环俯瞰",diff:"中级",question:`<b>例11</b> · 四棱锥 S−ABCD 的底面是矩形，AB = a，AD = 2，SA = 1，且 SA ⊥ 底面 ABCD。若线段 BC 上存在异于 B、C 的一点 P，使得 PS ⊥ PD，则 a 的最大值为____。<br>
      <b>操作</b>：俯视图里藏着机关——满足 PS ⊥ PD 的点 P 的轨迹是<b>直角光环</b>（以 SD 为直径的球面与底面的交线，是个恰好经过 A、D 的圆）。左右拖动画布改变矩形宽 <b>a</b>，让 BC <b>恰好还能</b>穿过光环，在最大临界处【锁定】。`,goal:'把 a 拖到"BC 恰好碰到光环"的最大值处',hint:"光环是以 (0,1) 为圆心、半径 1 的圆。BC 是竖线 x = a，与圆有公共点 ⇔ a ≤ 1。",answer:"a 的最大值为 1",analysis:`PS ⊥ PD ⇔ P 在以 SD 为直径的球面上。俯视（底面 xOy，A 为原点，AD 方向为 y 轴）：S 投影到 A，球面截底面得圆 x² + (y−1)² = 1，恰过 A(0,0) 与 D(0,2)。BC 即直线 x = a（0 < y < 2），与圆有公共点 ⇔ a ≤ 1（相切于 (1,1)）。故 a 最大为 1。`,make:makeRing},L10:{name:"三线摘星挑战",diff:"高级",question:`<b>例6</b> · 已知函数 f(x) = ax³ − 3x² + 1，若 f(x) 存在三个零点，则 a 的取值范围是____（原题选项 D）。<br>
      <b>操作</b>：方程化为 a = (3x² − 1)/x³ = h(x)（x ≠ 0），零点个数 = 水平光线 y = a 与曲线 y = h(x) 的交点数（窗口外的星用箭头计数）。拖动光线到"恰好 3 颗星"，【锁定】。`,goal:"与曲线 y=h(x) 的交点恰好 3 个",hint:"h(x) = 3/x − 1/x³：右支最高点 h(1) = 2；左支最低点 h(−1) = −2；两支在远处都贴着 0。光线放在 (0,2) 或 (−2,0) 内。",answer:"a ∈ (−2, 0) ∪ (0, 2)",analysis:`f(x)=0 ⇔ a = (3x²−1)/x³（x≠0）。h(x)=3/x−1/x³：在 (0,1) 增、(1,+∞) 减，最大 h(1)=2；在 (−∞,−1) 减、(−1,0) 增，最小 h(−1)=−2；两支远处趋于 0 但取不到 0。y=a 与 h 有 3 个交点 ⇔ 0 < a < 2 或 −2 < a < 0（a=0、a=±2 时只有 2 个不同零点）。`,make:def=>makeLight(def,{cfg:{kName:"a",target:3,fn:x=>3/x-1/(x*x*x),fnName:"y = h(x) = (3x²−1)/x³",fnLabelY:2.6,vx0:-4,vx1:4,vy0:-3,vy1:3,xTicks:[-3,-2,-1,1,2,3],yTicks:[-2,-1,1,2],doms:[[-6e3,-.02],[.02,6e3]],touchTol:.004,nSamples:7e3,kInit:()=>(Math.random()<.5?-1:1)*(2.2+Math.random()*.6)}})},L11:{name:"切线瞭望塔",diff:"高级",question:`<b>例12</b> · 已知函数 f(x) = x³ − 3x，若过点 M(2, t) 可作曲线 y = f(x) 的<b>两条</b>切线，则实数 t 的值为____。<br>
      <b>操作</b>：上下拖动 <b>M 点</b>（横坐标固定为 2），塔上会实时画出从 M 出发的所有切线。把 M 调到"其中两条切线恰好重合"的临界高度（出现"临界！"标记），【锁定】。这样的高度有两个。`,goal:"把 M 调到使切线恰好为 2 条的临界高度（t=2 或 t=−6 附近）",hint:'切点横坐标 x₀ 满足 t = −2x₀³ + 6x₀² − 6。这个函数在 x₀=0 取最小 −6、x₀=2 取最大 2。"恰有两条切线"发生在 t 正好等于这两个临界值的瞬间。',answer:"t = 2 或 t = −6",analysis:`切线过 M(2,t) ⇔ t = f(x₀)+f′(x₀)(2−x₀) = −2x₀³+6x₀²−6 = G(x₀)。G′=−6x₀(x₀−2)：x₀=0 取极小值 −6，x₀=2 取极大值 2。t<−6 或 t>2 时 G(x₀)=t 只有 1 解（1 条切线）；−6<t<2 时有 3 解（3 条）；恰好 2 条 ⇔ t 等于临界值：t=−6（x₀=0 二重、3）或 t=2（x₀=2 二重、−1）。`,make:makeTangent},L12:{name:"双线相切之约",diff:"高级",question:`<b>例13</b> · 若曲线 y = x²/(2e) 与曲线 y = a·ln x 在它们的公共点 P(s, t) 处具有<b>公共切线</b>，则实数 a =____。<br>
      <b>操作</b>：拖动滑杆改变 <b>a</b>：a 偏小时两曲线相离，调到某个值它们恰好碰到并共用一条切线（切点亮起金圈），再大就相交两点。在"恰好相切"处【锁定】。`,goal:"调到两曲线恰好相切（切点出现金色亮圈）",hint:"相切 = 公共点 + 斜率相等：s²/(2e) = a·ln s 且 s/e = a/s。两式联立先解出 s。",answer:"a = 1（切点为 (√e, 1/2)）",analysis:`公共切线要求两曲线在同一点相交且斜率相等：s²/(2e) = a·ln s 且 s/e = a/s。由第二式 a = s²/e，代入第一式得 1/2 = ln s，s = √e，于是 a = (√e)²/e = 1。此时切点 (√e, 1/2)，公切线斜率 √e/e = 1/√e。`,make:makeCtan},L13:{name:"空间光环触线",diff:"高级",question:`<b>例10</b> · 矩形 ADFE、矩形 CDFG、正方形 ABCD 两两垂直（围成墙角），且 AB = 2。若线段 DE 上存在点 P 使得 GP ⊥ BP，则边 CG 长度的最小值为____（原题选项 D）。<br>
      <b>操作</b>：GP ⊥ PB ⇔ P 在以 BG 为直径的球面上。示意图在"DE 与球心 M 所决定的平面"内观察：球心 M 到直线 DE 的距离<b>恒为 2</b>（垂足恰为 DE 中点），光环半径 = √(h²+4)/2（h = CG）。拖动滑杆改变 h，让光环<b>恰好够到</b>线段 DE，在最小临界处【锁定】。`,goal:"把 h 调到光环恰好碰到 DE 的最小值（约 3.46 附近）",hint:"半径 √(h²+4)/2 要 ≥ 距离 2，解出 h² ≥ 12。",answer:"CG 最小值为 2√3（约 3.46）",analysis:`设 CG = h，则 |BG| = √(h²+4)，球（以 BG 为直径）半径 r = √(h²+4)/2，球心 M 为 BG 中点。计算知 M 到直线 DE 的距离恒为 2，垂足恰为 DE 中点（在段内）。存在 P ⇔ r ≥ 2 ⇔ √(h²+4) ≥ 4 ⇔ h² ≥ 12 ⇔ h ≥ 2√3。故最小值 2√3。`,make:makeRing2},V2:{name:"山巅摘星 · 变式训练",diff:"高级",question:`<b>变式（同型自编）</b> · 已知方程 |x² − 2x| − m = 0 有三个不同的实根，则 m =____。<br>
      <b>操作</b>：曲线 y = |x² − 2x| 中间是一座"山"。拖动水平光线，让曲线恰好亮起 <b>3 颗星</b>（光线与山顶擦肩而过的瞬间），【锁定】。`,goal:"交点恰好 3 个（光线擦过山顶）",hint:"在 (0,2) 上曲线是倒抛物线，最高点 (1, 1)。左右两支各贡献 1 颗星，山顶再贡献 1 颗才行。",answer:"m = 1",analysis:`y = |x²−2x| 在 (0,2) 上为 2x−x²，最高点 (1,1)；两外侧 x²−2x → +∞。y=m：m<0 无根；m=0 两根；0<m<1 四根；m=1 时外侧两根 + 山顶相切 1 个 = 3 根；m>1 两根。故恰有三根 ⇔ m=1。`,make:def=>makeLight(def,{cfg:{kName:"m",target:3,fn:x=>Math.abs(x*x-2*x),fnName:"y = |x² − 2x|",fnLabelY:3.6,vx0:-3.2,vx1:3.2,vy0:-.45,vy1:4.2,xTicks:[-2,-1,1,2],yTicks:[1,2,3,4],doms:[[-6,6]],touchTol:.1,kInit:()=>.3+Math.random()*.5}})}};const POOL={初级:["L1","L2","L3","V1"],中级:["L5","L6","L7","L8","L9"],高级:["L10","L11","L12","L13","V2"]};applyPalette(PALETTES[Math.floor(Math.random()*PALETTES.length)]);showSelect();
