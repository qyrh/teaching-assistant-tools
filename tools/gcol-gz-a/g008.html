<body>

<!-- ===== 顶栏：返回 / 标题 / 右上角计时与步数 / 规则 ===== -->
<header id="topbar">
  <button class="btn ghosty hidden" id="btnBackMenu">返回难度选择</button>
  <div id="hdrTitle">计数问题的基本方法 · 互动实验室</div>
  <div class="hud">
    <span id="hudTimer">用时 00:00</span>
    <span id="hudSteps">步数 0</span>
  </div>
  <button class="btn ghosty" id="btnRules">规则</button>
</header>

<main>
  <!-- ===== 难度选择菜单 ===== -->
  <section id="menuScreen">
    <h1>计数问题的基本方法 · 互动实验室</h1>
    <p class="sub">对应《第17讲 计数问题的基本方法（提升篇）》<br>先动手摆一摆，再数一数——玩着玩着，计数方法就懂了！</p>
    <p class="methods">
      <b>分类加法</b><b>分步乘法</b><b>捆绑法</b><b>插空法</b><b>定序倍缩</b><b>特元特位优先</b>
    </p>
    <div class="menuGrid" id="menuGrid"></div>
    <p class="sub" style="margin-top:22px; color:#6b7a92;">每次进入难度会随机抽取 3 个关卡，并随机换一套配色，常玩常新。</p>
  </section>

  <!-- ===== 关卡界面 ===== -->
  <section id="gameScreen" class="hidden">
    <div id="stmtPanel">
      <span id="stmtTag"></span><span id="revealBadge" class="hidden">已看过解析</span>
      <p id="stmtText"></p>
      <p id="stmtHint"></p>
    </div>

    <div id="stage"></div>
    <div id="lamps"></div>

    <div class="collectBar">
      <button class="btn alt big" id="btnCollect">收藏这个排法</button>
      <span id="collectInfo"></span>
    </div>

    <div id="galleryWrap">
      <h3>收藏墙（不同方案自动去重）</h3>
      <div id="gallery"></div>
    </div>

    <div id="odoArea">
      <p id="odoTitle">拨动数字滚轮，报出本题总数</p>
      <div id="wheels"></div>
      <div id="odoBtns"><button class="btn big" id="btnConfirm">确认总数</button></div>
      <div id="odoLock"></div>
    </div>

    <div id="footerBtns">
      <button class="btn alt" id="btnReveal">揭示答案</button>
      <button class="btn ghosty" id="btnRestart">重新开始</button>
    </div>
  </section>
</main>

<!-- ===== 通用弹窗 ===== -->
<div id="modalMask" class="hidden"><div id="modalBox"></div></div>
<!-- ===== 提示条 ===== -->
<div id="toastBox"></div>
