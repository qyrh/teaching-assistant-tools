<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>轮转数摩天轮 · 巧算挑战</title>
<style>
/* ============================================================
   轮转数摩天轮 · 巧算挑战（第27讲 轮转数求和）
   单文件自包含：纯内联 CSS + JS，零外部依赖
   ============================================================ */
:root{
  --p:#1565C0;            /* 主色（随机色板切换） */
  --a:#FFCA28;            /* 强调色 */
  --bg:#E3F2FD;           /* 背景色 */
  --ink:#263238;          /* 正文墨色 */
  --card:#FFFFFF;
  --pos0:#E53935;         /* 数位颜色：第1位（最高位） */
  --pos1:#FB8C00;
  --pos2:#43A047;
  --pos3:#1E88E5;
  --pos4:#8E24AA;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:"PingFang SC","Microsoft YaHei","Source Han Sans SC",sans-serif;
  background:linear-gradient(165deg,var(--bg) 0%,#FFFFFF 72%);
  background-attachment:fixed;
  color:var(--ink);
  min-height:100vh;
  touch-action:manipulation;
}
body.in-menu #topbar{display:none;}
#app{max-width:1020px;margin:0 auto;padding:12px 14px 46px;}

/* ---------- 顶栏 ---------- */
#topbar{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  background:var(--card);border-radius:18px;padding:10px 16px;
  box-shadow:0 4px 14px rgba(38,50,56,.10);margin-bottom:14px;
}
#logo{font-size:22px;font-weight:800;color:var(--p);display:flex;align-items:center;gap:8px;}
#logo .wheel-ico{width:30px;height:30px;border-radius:50%;border:4px solid var(--a);
  border-top-color:var(--p);animation:spin 5s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
#stats{display:flex;gap:14px;font-weight:700;font-size:16px;color:var(--ink);flex-wrap:wrap;}
#stats span{background:var(--bg);padding:4px 12px;border-radius:999px;white-space:nowrap;}
#tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;}
.tbtn{
  border:none;border-radius:12px;padding:9px 14px;font-size:16px;font-weight:700;
  background:var(--bg);color:var(--p);cursor:pointer;min-height:42px;
}
.tbtn:active{transform:scale(.96);}
.tbtn.warn{background:#FFF3CD;color:#8a6d00;}

/* ---------- 难度菜单 ---------- */
#screen-menu{padding-top:16px;}
.menu-title{font-size:clamp(26px,5vw,40px);font-weight:900;color:var(--p);text-align:center;margin:10px 0 6px;}
.menu-sub{font-size:18px;text-align:center;color:var(--ink);margin:0 0 22px;}
.menu-cards{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;}
.menu-card{
  flex:1 1 240px;max-width:300px;border:none;border-radius:20px;cursor:pointer;
  padding:22px 18px;text-align:left;background:var(--card);color:var(--ink);
  box-shadow:0 6px 16px rgba(38,50,56,.12);border-top:8px solid var(--p);
  transition:transform .15s ease, box-shadow .15s ease;min-height:190px;
}
.menu-card:hover{transform:translateY(-4px);box-shadow:0 10px 22px rgba(38,50,56,.18);}
.menu-card h3{font-size:24px;margin:0 0 8px;color:var(--p);}
.menu-card .lv{font-size:15px;font-weight:800;color:#fff;background:var(--p);
  display:inline-block;padding:3px 12px;border-radius:999px;margin-bottom:10px;}
.menu-card p{font-size:16px;line-height:1.6;margin:0;}
.menu-tip{
  margin:26px auto 0;max-width:760px;background:var(--card);border-radius:18px;
  padding:16px 20px;box-shadow:0 4px 14px rgba(38,50,56,.08);font-size:17px;line-height:1.8;
}
.menu-tip b{color:var(--p);}

/* ---------- 游戏界面通用 ---------- */
#screen-game{display:flex;flex-direction:column;gap:14px;}
#taskcard{background:var(--card);border-radius:18px;padding:14px 20px;
  box-shadow:0 4px 14px rgba(38,50,56,.10);border-left:10px solid var(--a);}
#task-head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
  font-size:16px;font-weight:700;color:var(--p);}
#task-goal{color:#8a6d00;}
#task-expr{font-size:clamp(24px,4.6vw,36px);font-weight:900;letter-spacing:1px;margin-top:6px;word-break:break-all;}
#task-note{margin-top:8px;font-size:15px;background:#FFF8E1;border-radius:10px;padding:8px 12px;color:#7a5c00;}
#progress{display:flex;gap:10px;align-items:center;font-weight:700;font-size:16px;}
.dot{width:38px;height:38px;border-radius:50%;background:var(--card);border:3px solid #cfd8dc;
  display:flex;align-items:center;justify-content:center;font-size:15px;color:#90a4ae;}
.dot.current{border-color:var(--p);color:var(--p);box-shadow:0 0 0 4px rgba(21,101,192,.15);}
.dot.done{border-color:#43A047;background:#E8F5E9;color:#2e7d32;}
#msg{
  background:var(--card);border-radius:14px;padding:12px 18px;font-size:18px;font-weight:700;
  color:var(--p);box-shadow:0 3px 10px rgba(38,50,56,.08);min-height:48px;
}
#msg.bump{animation:bump .35s ease;}
@keyframes bump{0%{transform:scale(.97);}55%{transform:scale(1.02);}100%{transform:scale(1);}}

/* ---------- 探索区（摩天轮 / 方阵） ---------- */
#stage{display:flex;flex-direction:column;gap:16px;}
.explore-row{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start;justify-content:center;}
.wheel-wrap{position:relative;width:min(340px,88vw);height:min(340px,88vw);padding:34px;flex:0 0 auto;}
.wheel{
  position:absolute;inset:34px;border-radius:50%;
  background:radial-gradient(circle at 50% 42%,#ffffff 0%,#f4f7fa 70%);
  border:10px solid var(--p);box-shadow:inset 0 0 0 6px var(--a),0 10px 24px rgba(38,50,56,.16);
  touch-action:none;cursor:grab;
}
.wheel:active{cursor:grabbing;}
.seat{position:absolute;left:50%;top:50%;width:0;height:0;}
.bub{
  position:absolute;left:-27px;top:-27px;width:54px;height:54px;border-radius:50%;
  background:var(--a);color:#4e4000;font-size:27px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
  border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.18);
}
.hub{
  position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;
  background:var(--p);color:#fff;font-size:24px;font-weight:900;
  display:flex;align-items:center;justify-content:center;border:5px solid #fff;
  box-shadow:0 3px 10px rgba(0,0,0,.25);pointer-events:none;
}
.mark{
  position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;
}
.mark span{
  position:absolute;left:-30px;top:-14px;width:60px;height:28px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;
}
.mark.pos0 span{background:var(--pos0);}
.mark.pos1 span{background:var(--pos1);}
.mark.pos2 span{background:var(--pos2);}
.mark.pos3 span{background:var(--pos3);}
.mark.pos4 span{background:var(--pos4);}
.side{flex:1 1 300px;min-width:280px;display:flex;flex-direction:column;gap:14px;}
.panel{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:0 3px 10px rgba(38,50,56,.08);}
.panel h4{margin:0 0 10px;font-size:17px;color:var(--p);}
#read-slots{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.rslot{display:flex;flex-direction:column;align-items:center;gap:5px;}
.rslot .pl{font-size:14px;font-weight:800;padding:2px 10px;border-radius:999px;color:#fff;}
.rslot.p0 .pl{background:var(--pos0);}
.rslot.p1 .pl{background:var(--pos1);}
.rslot.p2 .pl{background:var(--pos2);}
.rslot.p3 .pl{background:var(--pos3);}
.rslot.p4 .pl{background:var(--pos4);}
.rslot .dv{
  width:56px;height:64px;border-radius:12px;background:#f4f7fa;border:3px solid #b0bec5;
  font-size:34px;font-weight:900;display:flex;align-items:center;justify-content:center;
}
.rslot .dv.lead0{color:#b0bec5;border-style:dashed;}
#read-note{font-size:15px;color:#7a5c00;margin-top:8px;min-height:20px;}
.shelf{display:flex;gap:12px;flex-wrap:wrap;}
.shelf-item{
  min-width:86px;text-align:center;padding:10px 12px;border-radius:14px;background:#eceff1;
  border:3px dashed #b0bec5;font-size:24px;font-weight:900;color:#b0bec5;
}
.shelf-item.lit{
  background:#E8F5E9;border:3px solid #43A047;color:#2e7d32;
  animation:pop .4s ease;
}
@keyframes pop{0%{transform:scale(.6);}60%{transform:scale(1.12);}100%{transform:scale(1);}}
.wheel-btn-row{display:flex;gap:12px;flex-wrap:wrap;}
.btn-main{
  border:none;border-radius:14px;background:var(--p);color:#fff;font-size:19px;font-weight:800;
  padding:13px 26px;cursor:pointer;box-shadow:0 5px 12px rgba(21,101,192,.3);min-height:50px;
}
.btn-main:disabled{background:#b0bec5;box-shadow:none;cursor:not-allowed;}
.btn-main:not(:disabled):active{transform:scale(.97);}

/* ---------- 中级：轮转方阵 ---------- */
.lgrid-wrap{display:flex;flex-direction:column;gap:14px;align-items:center;}
.lgrid{display:grid;gap:10px;}
.lg-head{display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;border-radius:8px;}
.lg-corner{display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:var(--p);}
.cell{
  width:62px;height:62px;border-radius:12px;background:#f4f7fa;border:3px solid #b0bec5;
  font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center;
  touch-action:none;
}
.cell.fixed{background:var(--p);color:#fff;border-color:var(--p);}
.cell.hint{background:#FFF8E1;border-color:var(--a);color:#7a5c00;}
.cell.filled{background:#fff;border-color:var(--p);color:var(--ink);}
.cell .lead0cell{color:#b0bec5;}
.cell.bad{animation:shake .4s ease;border-color:var(--pos0);background:#FFEBEE;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
.cell.rowdone{border-color:#43A047;}
.colglow{outline:4px solid var(--a);outline-offset:2px;}
/* hidden 属性兜底：防止 display:flex 覆盖隐藏 */
[hidden]{display:none !important;}

/* ---------- 拖拽芯片与托盘 ---------- */
.tray-row{display:flex;gap:16px;flex-wrap:wrap;}
.tray{flex:1 1 260px;background:var(--card);border-radius:16px;padding:12px 14px;
  box-shadow:0 3px 10px rgba(38,50,56,.08);}
.tray-title{font-size:16px;font-weight:800;color:var(--p);margin-bottom:10px;}
.tray-chips{display:flex;gap:12px;flex-wrap:wrap;min-height:64px;}
.chip{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border-radius:14px;font-weight:900;cursor:grab;touch-action:none;user-select:none;
  -webkit-user-select:none;box-shadow:0 3px 8px rgba(38,50,56,.15);
}
.chip-digit{width:56px;height:56px;font-size:28px;background:var(--a);color:#4e4000;border:3px solid #fff;}
.chip-tower{padding:8px 14px;font-size:22px;background:#E8F5E9;color:#2e7d32;border:3px solid #43A047;flex-direction:column;gap:2px;}
.chip-tower .tstack{display:flex;flex-direction:column;gap:2px;}
.chip-tower .tstack i{display:block;width:26px;height:9px;border-radius:3px;background:#43A047;}
.chip-div{padding:10px 16px;font-size:24px;background:#EDE7F6;color:#4527a0;border:3px solid #8E24AA;}
.ghost{position:fixed;z-index:999;opacity:.9;pointer-events:none;margin:0;transform:scale(1.06);}
.dropzone{transition:box-shadow .15s ease, background .15s ease;}
.dz-hot{outline:4px dashed var(--p);outline-offset:3px;background:#E3F2FD !important;}

/* ---------- 分解表 ---------- */
#breakdown{background:var(--card);border-radius:18px;padding:16px 18px;box-shadow:0 4px 14px rgba(38,50,56,.10);}
#breakdown h3{margin:0 0 12px;color:var(--p);font-size:20px;}
.bk-scroll{overflow-x:auto;padding-bottom:6px;}
table.bk{border-collapse:separate;border-spacing:8px 6px;}
table.bk th{font-size:16px;font-weight:800;color:#fff;border-radius:8px;padding:6px 12px;}
table.bk th.h0{background:var(--pos0);}
table.bk th.h1{background:var(--pos1);}
table.bk th.h2{background:var(--pos2);}
table.bk th.h3{background:var(--pos3);}
table.bk th.h4{background:var(--pos4);}
table.bk th.corner{background:#cfd8dc;color:var(--ink);}
table.bk td{
  min-width:56px;text-align:center;font-size:26px;font-weight:900;background:#f4f7fa;
  border-radius:10px;padding:8px 10px;border:3px solid transparent;
}
table.bk td.lead0{color:#b0bec5;}
table.bk td.sumrow{background:#E8F5E9;color:#2e7d32;font-size:22px;}
table.bk td.on{border-color:var(--a);animation:pop .4s ease;}
.bk-banner{
  margin-top:12px;background:#FFF8E1;border:3px solid var(--a);border-radius:14px;
  padding:12px 16px;font-size:19px;font-weight:800;color:#7a5c00;line-height:1.7;
}

/* ---------- 拼装区 ---------- */
#assembly{display:flex;flex-direction:column;gap:16px;background:var(--card);
  border-radius:18px;padding:16px 18px;box-shadow:0 4px 14px rgba(38,50,56,.10);}
#assembly h3{margin:0;color:var(--p);font-size:20px;}
.asm-bar{display:flex;gap:16px;align-items:stretch;flex-wrap:wrap;}
.bag{
  flex:1 1 220px;min-height:120px;border:4px dashed var(--p);border-radius:18px;
  background:#F3F8FF;padding:10px 14px;text-align:center;
}
.bag-title{font-size:16px;font-weight:800;color:var(--p);margin-bottom:8px;}
.bag-expr{font-size:26px;font-weight:900;color:var(--ink);min-height:36px;line-height:1.4;word-break:break-all;}
.bag.sealed{border-style:solid;background:#E8F5E9;border-color:#43A047;}
.bag.sealed .bag-expr{color:#2e7d32;}
.asm-op{display:flex;align-items:center;font-size:44px;font-weight:900;color:var(--p);}
.slot{
  flex:1 1 180px;min-height:120px;border:4px dashed #8E24AA;border-radius:18px;
  background:#F7F3FF;padding:10px 14px;text-align:center;
}
.slot-title{font-size:16px;font-weight:800;color:#8E24AA;margin-bottom:8px;}
.slot-body{font-size:24px;font-weight:900;color:var(--ink);min-height:36px;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:center;}
.slot.filled{border-style:solid;background:#EDE7F6;border-color:#8E24AA;}
.slot-body .tstack{display:flex;flex-direction:column;gap:3px;}
.slot-body .tstack i{display:block;width:34px;height:12px;border-radius:4px;background:#8E24AA;}
.slot-body .lead0{color:#b0bec5;}
#formula{background:#F3F8FF;border-radius:16px;padding:14px 18px;font-size:clamp(20px,3.6vw,28px);
  font-weight:900;color:var(--ink);line-height:2;text-align:center;word-break:break-all;}
#formula .hl{color:var(--p);}
#formula .vf{font-size:18px;color:#2e7d32;font-weight:800;}

/* ---------- 高级工作台 ---------- */
.wb-strip{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap;justify-content:center;}
.wb-cell{
  flex:1 1 170px;min-height:104px;border:4px dashed var(--p);border-radius:16px;
  background:#F3F8FF;padding:8px 12px;text-align:center;
}
.wb-cell-t{font-size:15px;font-weight:800;color:var(--p);margin-bottom:6px;}
.wb-cell-b{font-size:24px;font-weight:900;min-height:32px;word-break:break-all;line-height:1.35;}
.wb-cell.sealed{border-style:solid;background:#E8F5E9;border-color:#43A047;}
.wb-op{display:flex;align-items:center;font-size:38px;font-weight:900;color:var(--p);}
.wb-socket{
  flex:0 1 130px;min-height:104px;border:4px dashed #8E24AA;border-radius:16px;background:#F7F3FF;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font-size:15px;font-weight:800;color:#8E24AA;padding:6px;text-align:center;
}
.wb-socket .placed{
  font-size:26px;font-weight:900;color:#4527a0;background:#fff;border-radius:12px;
  padding:8px 16px;border:3px solid #8E24AA;cursor:pointer;
}
.wb-socket.off{opacity:.35;}
#machine-log{display:flex;flex-direction:column;gap:10px;}
.mstep{
  background:#F3F8FF;border-radius:14px;padding:12px 18px;font-size:clamp(20px,3.4vw,26px);
  font-weight:900;color:var(--ink);border-left:8px solid var(--a);animation:pop .4s ease;word-break:break-all;
}
.mstep.final{background:#E8F5E9;border-left-color:#43A047;color:#2e7d32;font-size:clamp(24px,4.4vw,32px);}

/* ---------- 下一轮 / 结算 ---------- */
#nextwrap{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;}

/* ---------- 弹窗 ---------- */
#modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;}
#modal[hidden]{display:none;}
.modal-mask{position:absolute;inset:0;background:rgba(38,50,56,.45);}
.modal-card{
  position:relative;background:#fff;border-radius:22px;max-width:620px;width:100%;
  max-height:86vh;overflow-y:auto;padding:24px 26px;box-shadow:0 18px 44px rgba(0,0,0,.28);
  animation:pop .3s ease;
}
.modal-card h2{color:var(--p);font-size:24px;margin:0 0 14px;}
.modal-card .m-body{font-size:17px;line-height:1.9;}
.modal-card .m-body ol{padding-left:22px;margin:8px 0;}
.modal-card .m-body li{margin-bottom:6px;}
.modal-card .m-body b{color:var(--p);}
.sol-line{background:#F3F8FF;border-radius:12px;padding:10px 14px;margin:8px 0;font-weight:800;
  font-size:18px;word-break:break-all;border-left:6px solid var(--a);}
.modal-btns{display:flex;gap:12px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;}

/* ---------- 庆祝 ---------- */
#celebrate{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:16px;}
#celebrate[hidden]{display:none;}
.cel-mask{position:absolute;inset:0;background:rgba(38,50,56,.5);}
.cel-card{
  position:relative;background:#fff;border-radius:26px;padding:34px 30px;text-align:center;
  max-width:520px;width:100%;box-shadow:0 18px 44px rgba(0,0,0,.3);animation:pop .5s ease;
}
.cel-stars{font-size:56px;letter-spacing:8px;color:#FFB300;text-shadow:0 3px 0 #e6a100;}
.cel-card h2{color:var(--p);font-size:28px;margin:10px 0 6px;}
#cel-stats{font-size:19px;font-weight:700;line-height:1.9;}
.cel-btns{display:flex;gap:14px;justify-content:center;margin-top:20px;flex-wrap:wrap;}

/* ---------- 彩纸画布 ---------- */
#fx{position:fixed;inset:0;z-index:80;pointer-events:none;}

@media (max-width:640px){
  .cell{width:52px;height:52px;font-size:25px;}
  .bub{width:46px;height:46px;left:-23px;top:-23px;font-size:23px;}
  #tools{margin-left:0;width:100%;justify-content:space-between;}
  .asm-op,.wb-op{width:100%;justify-content:center;}
}
</style>
</head>
<body class="in-menu">
<div id="app">
  <!-- ============ 顶栏：标题 + 统计 + 功能按钮 ============ -->
  <header id="topbar">
    <div id="logo"><span class="wheel-ico"></span>轮转数摩天轮</div>
    <div id="stats">
      <span id="st-time">时间 00:00</span>
      <span id="st-steps">步数 0</span>
      <span id="st-stars">星星 0</span>
    </div>
    <div id="tools">
      <button class="tbtn" id="btn-rules">规则说明</button>
      <button class="tbtn warn" id="btn-reveal">揭示答案</button>
      <button class="tbtn" id="btn-restart">重新开始</button>
      <button class="tbtn" id="btn-back">返回难度</button>
    </div>
  </header>

  <main>
    <!-- ============ 难度选择菜单 ============ -->
    <section id="screen-menu">
      <h1 class="menu-title">轮转数摩天轮 · 巧算挑战</h1>
      <p class="menu-sub">第27讲 · 轮转数求和（专题六 特殊数的计算）</p>
      <div class="menu-cards">
        <button class="menu-card" data-diff="easy">
          <h3>摩天轮启航</h3>
          <span class="lv">初级</span>
          <p>三位数轮转家族：转动摩天轮，收集 235、352、523 这样的轮转数，发现每一列藏着的规律，拼出巧算公式！</p>
        </button>
        <button class="menu-card" data-diff="mid">
          <h3>轮转方阵</h3>
          <span class="lv">中级</span>

        <b>轮转数小秘诀：</b>几个数字轮流当排头，就得到一组轮转数（如 235、352、523）。<br/>
        转一圈你会发现：<b>每个数字在百位、十位、个位都恰好各出现一次</b>，所以每一列的和都等于数字和。<br/>
        于是 <b>总和 = 数字和 × 111</b>（三位数乘 111，四位数乘 1111，五位数乘 11111）。

<script>
'use strict';
/* ============================================================
   一、基础工具
   ============================================================ */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const mod = (x, n) => ((x % n) + n) % n;
function el(tag, cls, html){
  const e = document.createElement(tag);
  if (cls)  { e.className = cls; }
  if (html) { e.innerHTML = html; }
  return e;
}
function shuffle(arr){
  const b = arr.slice();
  for (let i = b.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = b[i]; b[i] = b[j]; b[j] = t;
  }
  return b;
}
const sample = (arr, k) => shuffle(arr).slice(0, k);

/* ============================================================
   二、随机色板（每局随机换主色，玩不腻）
   ============================================================ */
const PALETTES = [
  { p:'#E65100', a:'#FFB300', bg:'#FFF3E0' },  // 蜜桃橙
  { p:'#00695C', a:'#FFB300', bg:'#E0F2F1' },  // 薄荷绿
  { p:'#1565C0', a:'#FFCA28', bg:'#E3F2FD' },  // 晴空蓝
  { p:'#5E35B1', a:'#FFA726', bg:'#EDE7F6' },  // 葡萄紫
  { p:'#AD1457', a:'#26C6DA', bg:'#FCE4EC' },  // 樱花粉
  { p:'#9E9D24', a:'#E53935', bg:'#F9FBE7' }   // 青柠黄
];
function applyPalette(){
  const c = PALETTES[Math.floor(Math.random() * PALETTES.length)];
  const r = document.documentElement.style;
  r.setProperty('--p',  c.p);
  r.setProperty('--a',  c.a);
  r.setProperty('--bg', c.bg);
}

/* ============================================================
   三、题库数据（源自教参 docx + 同题型变式）
   核心方法：轮转数之和 = 数字和 × 111…1（1 的个数 = 位数）
   ============================================================ */
const POOLS = {
  // 初级：三位轮转（教参基础练习1 + 例1 + 变式）
  easy: [
    [1,2,3],   // 123+231+312 = 6×111 = 666
    [5,1,4],   // 514+145+451 = 10×111 = 1110
    [2,3,5],   // 235+352+523 = 10×111 = 1110（例1）
    [3,4,5],   // 变式 345+453+534 = 12×111 = 1332
    [9,8,7],   // 变式 987+879+798 = 24×111 = 2664
    [2,6,8]    // 变式 268+682+826 = 16×111 = 1776
  ],
  // 中级：四位轮转（教参基础练习2、3 + 变式）
  mid: [
    [1,8,6,5], // 1865+8651+6518+5186 = 20×1111 = 22220
    [6,7,4,3], // 6743+7436+4367+3674 = 20×1111 = 22220
    [1,2,0,4], // 1204+2041+412+4120 = 7×1111 = 7777（注意 0412 写作 412）
    [3,5,6,8], // 变式 3568+5683+6835+8356 = 22×1111 = 24442
    [2,7,6,1], // 变式 2761+7612+6127+1276 = 16×1111 = 17776
    [4,0,9,2]  // 变式 4092+924+9240+2409 = 15×1111 = 16665（0924 写作 924）
  ],
  // 高级：轮转求和再除（教参例2 + 进阶练习 + 变式，数字和都能被除数整除）
  hard: [
    { ds:[1,2,3,4],   d:5  },  // (1234+2341+3412+4123)÷5 = 2×1111 = 2222
    { ds:[2,8,6,3,5], d:3  },  // (28635+…)÷3 = 8×11111 = 88888
    { ds:[5,8,3,0],   d:16 },  // (5830+8305+3058+583)÷16 = 1×1111 = 1111
    { ds:[8,4,6,9,7], d:17 },  // (84697+…)÷17 = 2×11111 = 22222（例2）
    { ds:[1,2,3,4,5], d:5  },  // 变式 = 3×11111 = 33333
    { ds:[1,3,5,6,9], d:4  },  // 变式 = 6×11111 = 66666
    { ds:[2,7,6,1],   d:8  }   // 变式 = 2×1111 = 2222
  ]
};

/* 生成一个数的全部左轮转排法：rot[k] 表示排头后移 k 位 */
function rotationsOf(ds){
  const n = ds.length, out = [];
  for (let k = 0; k < n; k++){
    const r = [];
    for (let i = 0; i < n; i++){ r.push(ds[(k + i) % n]); }
    out.push(r);
  }
  return out;
}
/* 数字数组转字符串：开头的 0 去掉（0412 → 412） */
function numStr(arr){
  const s = arr.join('').replace(/^0+/, '');
  return s === '' ? '0' : s;
}
/* 数位名称：n=3 → 百位/十位/个位 */
function placeNames(n){
  return ['个位','十位','百位','千位','万位'].slice(0, n).reverse();
}
/* 由数字组构造一轮回合数据（表达式、数字和、1塔、结果全部派生，保证自洽） */
function buildRound(def, diff){
  const ds = def.ds || def;
  const n  = ds.length;
  const rots = rotationsOf(ds);
  const nums = rots.map(numStr);
  const expr = nums.join('+');
  const S = ds.reduce((a, b) => a + b, 0);
  const R = Number('1'.repeat(n));
  const sum = S * R;
  const round = { ds, n, rots, nums, expr, S, R, sum, lead0: rots.some(r => r[0] === 0) };
  if (diff === 'hard'){
    round.d = def.d;
    round.divExpr = '(' + expr + ')÷' + def.d;
    round.final = sum / def.d;   // 题库保证整除
  }
  return round;
}

/* ============================================================
   四、全局状态
   ============================================================ */
const G = {
  diff: null, rounds: [], ri: 0, round: null,
  phase: '',                 // explore / breakdown / assemble / workbench / done
  collected: {},             // 已点亮的轮转数索引
  wheelK: 0, wheelAngle: 0,
  grid: null,                // 中级方阵状态
  bagDigits: [], rPlaced: false, divOrder: 0, // divOrder: 0未放 1先除 2后除
  steps: 0, stars: 0, awarded: [],
  revealed: false, running: false,
  t0: 0, timer: null, zones: []
};

/* ============================================================
   五、计时 / 步数 / 星星
   ============================================================ */
function fmtTime(s){
  const m = Math.floor(s / 60), r = s % 60;
  return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
}
function tickTimer(){
  const s = Math.floor((Date.now() - G.t0) / 1000);
  $('#st-time').textContent = '时间 ' + fmtTime(s);
}
function startTimer(){
  G.t0 = Date.now();
  if (G.timer) { clearInterval(G.timer); }
  G.timer = setInterval(tickTimer, 1000);
  tickTimer();
}
function stopTimer(){ if (G.timer) { clearInterval(G.timer); G.timer = null; } }
function addStep(){ G.steps++; $('#st-steps').textContent = '步数 ' + G.steps; }
function addStars(n){ G.stars += n; $('#st-stars').textContent = '星星 ' + G.stars; }
function setMsg(t){
  const m = $('#msg');
  m.textContent = t;
  m.classList.remove('bump');
  void m.offsetWidth;           // 触发重排以重启动画
  m.classList.add('bump');
}

/* ============================================================
   六、通用弹窗
   ============================================================ */
function showModal(html){
  $('#modal-card').innerHTML = html;
  $('#modal').hidden = false;
}
function hideModal(){ $('#modal').hidden = true; }
$('#modal-card').addEventListener('click', (e) => {
  if (e.target.closest('[data-close]')) { hideModal(); }
});

/* ============================================================
   七、拖拽引擎（Pointer 事件，鼠标 / 触摸通吃）
   ============================================================ */
let DRAG = null;
document.addEventListener('pointerdown', (e) => {
  const chip = e.target.closest('.drag-chip');
  if (!chip || chip.classList.contains('chip-locked')) { return; }
  e.preventDefault();
  const r = chip.getBoundingClientRect();
  const ghost = chip.cloneNode(true);
  ghost.classList.add('ghost');
  ghost.classList.remove('chip-locked');
  ghost.style.width  = r.width + 'px';
  ghost.style.height = r.height + 'px';
  document.body.appendChild(ghost);
  DRAG = {
    chip, ghost,
    ox: e.clientX - r.left, oy: e.clientY - r.top,
    home: { x: r.left, y: r.top }
  };
  moveGhost(e.clientX, e.clientY);
});
function moveGhost(x, y){
  DRAG.ghost.style.left = (x - DRAG.ox) + 'px';
  DRAG.ghost.style.top  = (y - DRAG.oy) + 'px';
}
document.addEventListener('pointermove', (e) => {
  if (!DRAG) { return; }
  e.preventDefault();
  moveGhost(e.clientX, e.clientY);
  const z = zoneAt(e.clientX, e.clientY);
  G.zones.forEach(g => g.el.classList.toggle('dz-hot', g === z && g.accepts(DRAG.chip)));
});
function endDrag(e, cancelled){
  if (!DRAG) { return; }
  const d = DRAG; DRAG = null;
  G.zones.forEach(g => g.el.classList.remove('dz-hot'));
  const z = cancelled ? null : zoneAt(e.clientX, e.clientY);
  if (z && z.accepts(d.chip)){
    d.ghost.remove();
    z.drop(d.chip, d);
  } else {
    // 没放对位置：积木轻轻弹回托盘
    d.ghost.style.transition = 'left .25s ease, top .25s ease';
    d.ghost.style.left = d.home.x + 'px';
    d.ghost.style.top  = d.home.y + 'px';
    setTimeout(() => { d.ghost.remove(); }, 260);
    if (!cancelled) { setMsg('这块积木放在这里不合适哦，再试一试～'); }
  }
}
document.addEventListener('pointerup',    (e) => endDrag(e, false));
document.addEventListener('pointercancel',(e) => endDrag(e, true));

/* 掉落区注册与查找 */
function regZone(elm, accepts, drop){
  elm.classList.add('dropzone');
  G.zones.push({ el: elm, accepts, drop });
}
function clearZones(){
  G.zones = [];
  $$('.dropzone').forEach(z => z.classList.remove('dz-hot', 'dropzone'));
}
function zoneAt(x, y){
  const t = document.elementFromPoint(x, y);
  if (!t) { return null; }
  const z = t.closest('.dropzone');
  if (!z) { return null; }
  return G.zones.find(g => g.el === z) || null;
}

/* ============================================================
   八、彩纸庆祝引擎（Canvas）
   ============================================================ */
const FX = { cv: null, ctx: null, parts: [], raf: 0 };
function fxInit(){
  FX.cv  = $('#fx');
  FX.ctx = FX.cv.getContext('2d');
  const fit = () => {
    FX.cv.width  = window.innerWidth;
    FX.cv.height = window.innerHeight;
  };
  fit();
  window.addEventListener('resize', fit);
}
function fxColors(){
  const cs = getComputedStyle(document.documentElement);
  return [cs.getPropertyValue('--p'), cs.getPropertyValue('--a'),
          '#43A047', '#E53935', '#1E88E5', '#8E24AA'];
}
function fxSpawn(x, y, n, spread){
  const cols = fxColors();
  for (let i = 0; i < n; i++){
    FX.parts.push({
      x, y,
      vx: (Math.random() - 0.5) * (spread || 7),
      vy: -Math.random() * 8 - 3,
      w: 6 + Math.random() * 7,
      h: 4 + Math.random() * 6,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.3,
      c: cols[Math.floor(Math.random() * cols.length)],
      life: 90 + Math.random() * 50
    });
  }
  if (!FX.raf) { FX.raf = requestAnimationFrame(fxLoop); }
}
function fxRain(n){
  const cols = fxColors();
  for (let i = 0; i < n; i++){
    FX.parts.push({
      x: Math.random() * FX.cv.width,
      y: -20 - Math.random() * FX.cv.height * 0.5,
      vx: (Math.random() - 0.5) * 2,
      vy: 2 + Math.random() * 3,
      w: 6 + Math.random() * 8,
      h: 5 + Math.random() * 7,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.25,
      c: cols[Math.floor(Math.random() * cols.length)],
      life: 260 + Math.random() * 80
    });
  }
  if (!FX.raf) { FX.raf = requestAnimationFrame(fxLoop); }
}
function fxLoop(){
  const c = FX.ctx;
  c.clearRect(0, 0, FX.cv.width, FX.cv.height);
  FX.parts = FX.parts.filter(p => p.life > 0 && p.y < FX.cv.height + 30);
  FX.parts.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.rot += p.vr; p.life--;
    c.save();
    c.translate(p.x, p.y);
    c.rotate(p.rot);
    c.fillStyle = p.c;
    c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    c.restore();
  });
  if (FX.parts.length){
    FX.raf = requestAnimationFrame(fxLoop);
  } else {
    FX.raf = 0;
    c.clearRect(0, 0, FX.cv.width, FX.cv.height);
  }
}
function burstAt(elm, n){
  if (!elm) { fxSpawn(FX.cv.width / 2, FX.cv.height / 3, n, 9); return; }
  const r = elm.getBoundingClientRect();
  fxSpawn(r.left + r.width / 2, r.top + r.height / 2, n, 9);
}

/* ============================================================
   九、流程控制：开始游戏 / 回合
   ============================================================ */
function startGame(diff){
  applyPalette();
  G.diff = diff;
  G.rounds = sample(POOLS[diff], 3).map(def => buildRound(def, diff));
  G.ri = 0; G.steps = 0; G.stars = 0; G.awarded = [false, false, false];
  $('#st-steps').textContent = '步数 0';
  $('#st-stars').textContent = '星星 0';
  document.body.classList.remove('in-menu');
  $('#screen-menu').hidden = true;
  $('#screen-game').hidden = false;
  $('#celebrate').hidden = true;
  startTimer();
  startRound();
  showModal(rulesHtml(diff, true));
}
function startRound(){
  const R = G.rounds[G.ri];
  G.round = R;
  G.phase = 'explore';
  G.collected = {};
  G.bagDigits = []; G.rPlaced = false; G.divOrder = 0;
  G.revealed = false; G.running = false;
  clearZones();
  $('#breakdown').hidden = true;
  $('#assembly').hidden = true;
  $('#nextwrap').hidden = true;
  $('#nextwrap').innerHTML = '';
  renderTaskCard();
  renderProgress();
  $('#stage').innerHTML = '';
  if (G.diff === 'easy'){
    G.collected = { 0: true };   // 排头数一开始就点亮
    buildWheelStage();
    setMsg('排头数已经点亮啦！拖动摩天轮（或点「转动一格」），找出剩下的轮转伙伴！');
  } else if (G.diff === 'mid'){
    buildGridStage();
    setMsg('把数字卡拖进方阵，让每一行都由同样的数字轮转组成！');
  } else {
    G.phase = 'workbench';
    buildWorkbench();
    setMsg('先装满「数字和袋子」，再挑一座正确的「1」塔，最后把「÷' + R.d + '」积木放到更轻松的位置！');
  }
}
function renderTaskCard(){
  const R = G.round;
  $('#task-title').textContent = '第 ' + (G.ri + 1) + ' 轮 / 共 ' + G.rounds.length + ' 轮';
  if (G.diff === 'hard'){
    $('#task-goal').textContent = '挑战目标：巧算出商';
    $('#task-expr').textContent = R.divExpr + ' = ?';
  } else {
    $('#task-goal').textContent = '挑战目标：巧算出这组轮转数的和';
    $('#task-expr').textContent = R.expr + ' = ?';
  }
  const note = $('#task-note');
  if (R.lead0){
    note.hidden = false;
    note.textContent = '小贴士：有的轮转数开头是 0，写出来会变短（如 0412 写成 412），但它依然占着 4 个数位哦！';
  } else {
    note.hidden = true;
  }
}
function renderProgress(){
  const box = $('#progress');
  box.innerHTML = '';
  G.rounds.forEach((r, i) => {
    const d = el('div', 'dot' + (i === G.ri ? ' current' : '') + (G.awarded[i] ? ' done' : ''));
    d.textContent = G.awarded[i] ? '★' : String(i + 1);
    box.appendChild(d);
  });
  const lab = el('span', '', '');
  lab.textContent = { easy:'初级 · 摩天轮启航', mid:'中级 · 轮转方阵', hard:'高级 · 巧算机器' }[G.diff];
  box.appendChild(lab);
}

/* ============================================================
   十、初级：摩天轮探索区
   ============================================================ */
function buildWheelStage(){
  const R = G.round, n = R.n;
  const row = el('div', 'explore-row');
  const wrap = el('div', 'wheel-wrap');
  const wheel = el('div', 'wheel');
  wheel.id = 'wheel';
  for (let i = 0; i < n; i++){
    const s = el('div', 'seat');
    const b = el('div', 'bub');
    b.textContent = R.ds[i];
    s.appendChild(b);
    wheel.appendChild(s);
  }
  const hub = el('div', 'hub');
  hub.textContent = '转';
  wheel.appendChild(hub);
  wrap.appendChild(wheel);
  const marks = el('div', 'marks');
  const places = placeNames(n);
  for (let p = 0; p < n; p++){
    const m = el('div', 'mark pos' + p);
    m.innerHTML = '<span>' + places[p] + '</span>';
    marks.appendChild(m);
  }
  wrap.appendChild(marks);
  row.appendChild(wrap);

  const side = el('div', 'side');
  const readPanel = el('div', 'panel');
  readPanel.innerHTML = '<h4>当前转到的数（各数位）</h4>';
  const slots = el('div', '');
  slots.id = 'read-slots';
  for (let p = 0; p < n; p++){
    const s = el('div', 'rslot p' + p);
    s.innerHTML = '<span class="pl">' + places[p] + '</span><span class="dv">?</span>';
    slots.appendChild(s);
  }
  readPanel.appendChild(slots);
  const rn = el('div', '');
  rn.id = 'read-note';
  rn.textContent = '拖住轮盘转圈圈，松手它会稳稳卡到位～';
  readPanel.appendChild(rn);
  side.appendChild(readPanel);

  const shelfPanel = el('div', 'panel');
  shelfPanel.innerHTML = '<h4>轮转数收集墙（挑战卡上的每一个数）</h4>';
  const shelf = el('div', 'shelf');
  R.nums.forEach((num, i) => {
    const it = el('div', 'shelf-item');
    it.textContent = G.collected[i] ? num : '?';
    if (G.collected[i]) { it.classList.add('lit'); }
    shelf.appendChild(it);
  });
  shelfPanel.appendChild(shelf);
  side.appendChild(shelfPanel);

  const btnRow = el('div', 'wheel-btn-row');
  const btnStep = el('button', 'btn-main');
  btnStep.textContent = '转动一格';
  btnStep.addEventListener('click', () => {
    if (G.phase !== 'explore' || G.running) { return; }
    const step = 360 / n;
    const target = (Math.round(G.wheelAngle / step) + 1) * step;
    animWheelTo(target, () => applyWheelK(mod(Math.round(target / step), n)));
  });
  btnRow.appendChild(btnStep);
  side.appendChild(btnRow);
  row.appendChild(side);

  $('#stage').appendChild(row);
  G.wheelK = 0; G.wheelAngle = 0;
  attachWheelDrag(wheel);
  requestAnimationFrame(() => { layoutWheel(0); updateReadingUI(); });
}
/* 舱位与位置标记的几何排布（数字始终正立） */
function layoutWheel(angle){
  const wheel = $('#wheel');
  if (!wheel) { return; }
  const n = G.round.n;
  const step = 360 / n;
  const rect = wheel.getBoundingClientRect();
  const radius = rect.width / 2 - 34;
  $$('.seat', wheel).forEach((s, i) => {
    const a = i * step + angle;
    s.style.transform = 'rotate(' + a + 'deg) translateY(' + (-radius) + 'px) rotate(' + (-a) + 'deg)';
  });
  $$('.mark').forEach((m, p) => {
    const a = p * step;
    m.style.transform = 'rotate(' + a + 'deg) translateY(' + (-(radius + 26)) + 'px) rotate(' + (-a) + 'deg)';
  });
}
function animWheelTo(target, done){
  const from = G.wheelAngle, t0 = performance.now(), dur = 420;
  G.running = true;
  function frame(t){
    const u = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - u, 3);
    G.wheelAngle = from + (target - from) * e;
    layoutWheel(G.wheelAngle);
    if (u < 1) { requestAnimationFrame(frame); }
    else { G.running = false; if (done) { done(); } }
  }
  requestAnimationFrame(frame);
}
/* 摩天轮拖拽旋转 */
function attachWheelDrag(wheel){
  let wd = null;
  const angleOf = (x, y, cx, cy) => Math.atan2(x - cx, -(y - cy)) * 180 / Math.PI;
  wheel.addEventListener('pointerdown', (e) => {
    if (G.phase !== 'explore') { return; }
    e.preventDefault();
    const r = wheel.getBoundingClientRect();
    wd = {
      cx: r.left + r.width / 2, cy: r.top + r.height / 2,
      a0: angleOf(e.clientX, e.clientY, r.left + r.width / 2, r.top + r.height / 2),
      start: G.wheelAngle, moved: false
    };
    /* 捕获指针：手指滑出轮盘也能继续拖动 */
    if (wheel.setPointerCapture){ wheel.setPointerCapture(e.pointerId); }
  });
  wheel.addEventListener('pointermove', (e) => {
    if (!wd || G.phase !== 'explore') { return; }
    wd.moved = true;
    const a = angleOf(e.clientX, e.clientY, wd.cx, wd.cy);
    G.wheelAngle = wd.start + (a - wd.a0);
    layoutWheel(G.wheelAngle);
  });
  const finish = () => {
    if (!wd) { return; }
    const had = wd.moved; wd = null;
    if (!had) { setMsg('拖住轮盘转圈圈，或者点「转动一格」也可以哦～'); return; }
    const step = 360 / G.round.n;
    const target = Math.round(G.wheelAngle / step) * step;
    animWheelTo(target, () => applyWheelK(mod(Math.round(target / step), G.round.n)));
  };
  wheel.addEventListener('pointerup', finish);
  wheel.addEventListener('pointercancel', finish);
}
/* 应用轮位 k：更新读数并尝试收集 */
function applyWheelK(k){
  G.wheelK = k;
  updateReadingUI();
  tryCollectReading();
}
function currentReading(){
  const R = G.round, n = R.n;
  const arr = [];
  for (let p = 0; p < n; p++){ arr.push(R.ds[(p - G.wheelK + n) % n]); }
  return arr;
}
function updateReadingUI(){
  const rd = currentReading();
  $$('#read-slots .rslot').forEach((s, p) => {
    const dv = $('.dv', s);
    dv.textContent = rd[p];

  });

  } else {

}
function tryCollectReading(){
  if (G.phase !== 'explore') { return; }
  const val = parseInt(currentReading().join(''), 10);
  const idx = G.round.rots.findIndex(r => parseInt(r.join(''), 10) === val);
  if (idx < 0) { return; }
  if (G.collected[idx]) { setMsg('这个排法已经收集过啦，再转一转试试别的排法～'); return; }
  G.collected[idx] = true;
  addStep();
  const items = $$('.shelf-item');
  if (items[idx]){
    items[idx].textContent = G.round.nums[idx];
    items[idx].classList.add('lit');

  }
  const got = Object.keys(G.collected).length;
  if (got >= G.round.n){
    setMsg('太棒了！轮转数全部集齐，看看每一列藏着的规律～');
    setTimeout(() => showBreakdown(false), 700);
  } else {
    setMsg('点亮了 ' + G.round.nums[idx] + '！还差 ' + (G.round.n - got) + ' 个，继续转～');

/* ============================================================
   十一、中级：轮转方阵
   ============================================================ */
function buildGridStage(){
  const R = G.round, n = R.n;
  const wrap = el('div', 'lgrid-wrap');
  const grid = el('div', 'lgrid');
  grid.id = 'lgrid';
  grid.style.gridTemplateColumns = '92px repeat(' + n + ', auto)';
  const places = placeNames(n);
  const corner = el('div', 'lg-corner');
  corner.textContent = '轮转方阵';
  grid.appendChild(corner);
  for (let c = 0; c < n; c++){
    const h = el('div', 'lg-head');
    h.textContent = places[c];
    h.style.background = 'var(--pos' + c + ')';
    grid.appendChild(h);
  }
  G.grid = { values: [], fixed: [], rowDone: [] };
  for (let r = 0; r < n; r++){
    G.grid.values.push(R.rots[r].slice());
    G.grid.fixed.push([]);
    G.grid.rowDone.push(false);
    for (let c = 0; c < n; c++){
      const isBase = (r === 0);
      let isHint = false;
      if (!isBase){ isHint = Math.random() < 0.45; }
      const cell = el('div', 'cell');
      cell.dataset.r = r; cell.dataset.c = c;
      if (isBase){
        cell.classList.add('fixed');
        cell.textContent = R.rots[r][c];
        G.grid.fixed[r].push(true);
      } else if (isHint){
        cell.classList.add('hint');
        cell.textContent = R.rots[r][c];
        G.grid.fixed[r].push(true);
      } else {
        G.grid.values[r][c] = null;      // 学生要填的格子
        G.grid.fixed[r].push(false);
        const rr = r, cc = c;            // 闭包记录坐标
        regZone(cell,
          (chip) => chip.dataset.kind === 'digit' && G.phase === 'explore' && G.grid.values[rr][cc] === null,
          (chip) => gridDrop(cell, chip)
        );
      }
      grid.appendChild(cell);
    }
  }
  wrap.appendChild(grid);
  /* 极少数情况：某一行被提示格全部填满，直接标记完成 */
  let preDone = 0;
  for (let r = 0; r < n; r++){
    if (!G.grid.values[r].some(v => v === null)){
      G.grid.rowDone[r] = true;
      preDone++;
      $$('#lgrid .cell').forEach(cell => {
        if (Number(cell.dataset.r) === r){ cell.classList.add('rowdone'); }
      });
    }
  }
  if (preDone >= n){ setTimeout(() => gridColumnCheck(), 500); }

  const tray = el('div', 'tray');
  tray.style.width = '100%';
  tray.innerHTML = '<div class="tray-title">数字卡托盘（每张卡可以反复取用）</div>';
  const chips = el('div', 'tray-chips');
  shuffle(R.ds.slice()).forEach(d => {
    const c = el('div', 'chip chip-digit drag-chip');
    c.dataset.kind = 'digit';
    c.dataset.val = String(d);
    c.textContent = String(d);
    chips.appendChild(c);
  });
  tray.appendChild(chips);
  wrap.appendChild(tray);
  $('#stage').appendChild(wrap);
}
function renderCell(r, c){
  const cell = $$('#lgrid .cell').find(x => Number(x.dataset.r) === r && Number(x.dataset.c) === c);
  if (!cell) { return; }
  const v = G.grid.values[r][c];
  if (v === null){
    cell.textContent = '';
    cell.classList.remove('filled', 'bad');
  } else {
    cell.innerHTML = (c === 0 && v === 0) ? '<span class="lead0cell">0</span>' : String(v);
    cell.classList.add('filled');
    cell.classList.remove('bad');
  }
}
function gridDrop(cell, chip){
  const r = Number(cell.dataset.r), c = Number(cell.dataset.c);
  G.grid.values[r][c] = Number(chip.dataset.val);
  renderCell(r, c);
  addStep();
  checkGridRow(r);
}
function checkGridRow(r){
  const n = G.round.n;
  const vals = G.grid.values[r];
  if (vals.some(v => v === null)) { return; }
  const sorted = vals.slice().sort((a, b) => a - b).join(',');
  const target = G.round.ds.slice().sort((a, b) => a - b).join(',');
  if (sorted !== target){
    rowShake(r, '这一行用的数字和排头数不一样哦——轮转伙伴必须由完全相同的数字组成，再想想～');
    return;
  }
  const dup = G.grid.rowDone.some((done, i) => done && i !== r && G.grid.values[i].join('') === vals.join(''));
  if (dup){
    rowShake(r, '这一行和前面的行重复啦——轮转家族的每个成员都不相同！');
    return;
  }
  G.grid.rowDone[r] = true;
  for (let c = 0; c < n; c++){
    const cell = $$('#lgrid .cell').find(x => Number(x.dataset.r) === r && Number(x.dataset.c) === c);
    if (cell){ cell.classList.add('rowdone'); }
  }
  const doneCount = G.grid.rowDone.filter(Boolean).length;
  if (doneCount >= n){
    setMsg('方阵完成！现在观察每一列——每个数字是不是恰好出现一次？');
    setTimeout(() => gridColumnCheck(), 600);
  } else {
    setMsg('第 ' + (r + 1) + ' 行拼好啦！还差 ' + (n - doneCount) + ' 行。');
  }
}
function rowShake(r, msg){
  setMsg(msg);
  $$('#lgrid .cell').forEach(cell => {
    if (Number(cell.dataset.r) === r){
      cell.classList.add('bad');
      setTimeout(() => {
        if (!G.grid.fixed[r][Number(cell.dataset.c)]){
          G.grid.values[r][Number(cell.dataset.c)] = null;
        }
        cell.classList.remove('bad');
        renderCell(r, Number(cell.dataset.c));
      }, 550);
    }
  });
}
function gridColumnCheck(){
  const n = G.round.n;
  let ci = 0;
  const step = () => {
    if (ci >= n){
      setTimeout(() => showBreakdown(false), 800);
      return;
    }
    $$('#lgrid .cell').forEach(cell => {
      if (Number(cell.dataset.c) === ci){ cell.classList.add('colglow'); }
    });
    ci++;
    setTimeout(step, 500);
  };
  step();
}
function fillGridInstant(){
  const n = G.round.n;
  for (let r = 0; r < n; r++){
    for (let c = 0; c < n; c++){
      G.grid.values[r][c] = G.round.rots[r][c];
      G.grid.rowDone[r] = true;
      renderCell(r, c);
    }
  }
}

/* ============================================================
   十二、竖式分解表（通用：揭示“每列和=数字和”的规律）
   ============================================================ */
function showBreakdown(instant){
  G.phase = 'breakdown';
  clearZones();
  const R = G.round, n = R.n;
  const places = placeNames(n);
  const box = $('#breakdown');
  box.hidden = false;
  box.innerHTML = '<h3>竖式分解：每个数字在每一列恰好出现一次！</h3>';
  const scroll = el('div', 'bk-scroll');
  const tb = el('table', 'bk');
  let head = '<tr><th class="corner">各轮转数</th>';
  for (let c = 0; c < n; c++){ head += '<th class="h' + c + '">' + places[c] + '</th>'; }
  head += '</tr>';
  tb.innerHTML = head;
  R.rots.forEach(rot => {
    let tr = '<tr><td class="sumrow" style="font-size:20px;">' + numStr(rot) + '</td>';
    rot.forEach((d, c) => {
      tr += '<td data-col="' + c + '"' + (c === 0 && d === 0 ? ' class="lead0"' : '') + '>' + d + '</td>';
    });
    tr += '</tr>';
    tb.innerHTML += tr;
  });
  let sum = '<tr><td class="sumrow" style="font-size:16px;">每列的和</td>';
  for (let c = 0; c < n; c++){ sum += '<td class="sumrow" data-col="' + c + '">' + R.S + '</td>'; }
  sum += '</tr>';
  tb.innerHTML += sum;
  scroll.appendChild(tb);
  box.appendChild(scroll);
  const banner = el('div', 'bk-banner');
  const pv = [];
  for (let i = n - 1; i >= 0; i--){ pv.push(Math.pow(10, i)); }
  banner.innerHTML = '每一列的和都是 <b>' + R.S + '</b> → 总和 = ' + R.S + '×(' + pv.join(' + ') +
                     ') = <b>' + R.S + ' × ' + R.R + '</b>';
  box.appendChild(banner);

  if (instant){
    finishBreakdown();
    return;
  }
  /* 逐列点亮动画：先亮数字行，再亮“每列的和”，最后亮横幅 */
  const tds = $$('td[data-col]', tb);
  const cols = n;
  let ci = 0;
  const step = () => {
    if (ci >= cols){
      banner.style.visibility = 'visible';
      setTimeout(finishBreakdown, 900);
      return;
    }
    tds.forEach(td => { if (Number(td.dataset.col) === ci) { td.classList.add('on'); } });
    ci++;
    setTimeout(step, 480);
  };
  banner.style.visibility = 'hidden';
  setTimeout(step, 300);
}
function finishBreakdown(){
  if (G.diff === 'hard'){ return; }   // 高级不走拼装区
  renderAssembly();
  $('#assembly').hidden = false;
  $('#assembly').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  setMsg('规律找到啦！现在把数字卡拖进袋子、挑一座正确的「1」塔，拼出巧算公式！');
}

function towerChipsHtml(R){
  /* 生成互不相同的「1」塔候选（含正确答案 + 干扰项） */
  const all = [111, 1111, 11111, 111111].filter(v => v !== R.R);
  const picks = sample(all, 2);
  return shuffle([R.R].concat(picks));
}
function towerInner(v){
  const ones = String(v).length;

  cDiv.textContent = '÷ ' + R.d;
  chipsV.appendChild(cDiv);
  trayV.appendChild(chipsV);
  trayRow.appendChild(trayV);
  box.appendChild(trayRow);

  const log = el('div', '');
  log.id = 'machine-log';
  box.appendChild(log);

  const btn = el('button', 'btn-main');
  btn.id = 'btn-machine';
  btn.textContent = '启动机器';
  btn.disabled = true;
  btn.addEventListener('click', () => runMachine(false));
  const btnWrap = el('div', '');
  btnWrap.style.display = 'flex';
  btnWrap.style.justifyContent = 'center';
  btnWrap.appendChild(btn);
  box.appendChild(btnWrap);

  regZone(cellS,
    (chip) => chip.dataset.kind === 'digit' && G.bagDigits.length < R.n && G.phase === 'workbench',
    (chip) => bagDrop(chip)
  );
  regZone(cellR,
    (chip) => chip.dataset.kind === 'tower' && !G.rPlaced && G.phase === 'workbench',
    (chip, d) => towerDropHard(chip, d, cellR)
  );
  regZone(sockA,
    (chip) => chip.dataset.kind === 'divop' && G.divOrder === 0 && G.phase === 'workbench',
    (chip, d) => divDrop(chip, d, sockA, 1)
  );
  regZone(sockB,
    (chip) => chip.dataset.kind === 'divop' && G.divOrder === 0 && G.phase === 'workbench',
    (chip, d) => divDrop(chip, d, sockB, 2)
  );
}
function towerDropHard(chip, drag, cellR){
  const R = G.round;
  const v = Number(chip.dataset.val);
  if (v !== R.R){
    setMsg('这座塔有 ' + String(v).length + ' 层，可这是 ' + R.n + ' 位数，要 ' + R.n + ' 层的「1」塔（' + R.R + '）哦！');
    return;
  }
  G.rPlaced = true;
  addStep();
  if (drag){ drag.chip.remove(); }
  const body = $('#wb-r-b');
  if (body){ body.textContent = String(R.R); }
  cellR.classList.add('sealed');
  setMsg('「1」塔放好啦！');
  checkMachineReady();
}
function divDrop(chip, drag, sock, which){
  const R = G.round;
  G.divOrder = which;
  addStep();
  if (drag){ drag.chip.remove(); }
  const placed = el('div', 'placed');
  placed.textContent = '÷ ' + R.d;
  placed.title = '点一下可以拿回去重放';
  sock.appendChild(placed);
  const other = which === 1 ? $('#sock-b') : $('#sock-a');
  if (other){ other.classList.add('off'); }
  /* 点击已放置的积木可取回重放 */
  placed.addEventListener('click', () => {
    if (G.phase !== 'workbench' || G.running) { return; }
    G.divOrder = 0;
    placed.remove();
    if (other){ other.classList.remove('off'); }
    if (!$('#chip-div')){
      const c = el('div', 'chip chip-div drag-chip');
      c.dataset.kind = 'divop';
      c.dataset.val = String(R.d);
      c.id = 'chip-div';
      c.textContent = '÷ ' + R.d;
      const holder = $('#tray-div-chips');
      if (holder){ holder.appendChild(c); }
    }
    setMsg('把「÷' + R.d + '」积木拿回来了，再选一个位置放放看！');
    checkMachineReady();
  });
  setMsg(which === 1
    ? '放在乘塔前面：先除后乘。看看机器是不是跑得更轻松！'
    : '放在乘塔后面：先乘出一个大数再除。按下机器试试，再比较一下另一种放法～');
  checkMachineReady();
}
function checkMachineReady(){
  const R = G.round;
  const btn = $('#btn-machine');
  if (!btn) { return; }
  btn.disabled = !(G.bagDigits.length >= R.n && G.rPlaced && G.divOrder !== 0);
  if (!btn.disabled){ setMsg('一切就绪！按下「启动机器」，看看巧算的威力！'); }
}
function runMachine(instant){
  const R = G.round;
  if (!instant && G.running) { return; }
  G.phase = 'done';
  G.running = true;
  clearZones();
  const btn = $('#btn-machine');
  if (btn) { btn.disabled = true; }
  addStep();
  const log = $('#machine-log');
  const smart = G.divOrder === 1;      // 先除后乘 = 巧算
  const steps = smart
    ? [ R.S + ' ÷ ' + R.d + ' = ' + (R.S / R.d),
        (R.S / R.d) + ' × ' + R.R + ' = ' + R.final ]
    : [ R.S + ' × ' + R.R + ' = ' + R.sum,
        R.sum + ' ÷ ' + R.d + ' = ' + R.final ];
  const fin = el('div', 'mstep final');
  fin.textContent = (R.divExpr) + ' = ' + R.final;
  if (instant){
    steps.forEach(s => { const d2 = el('div', 'mstep'); d2.textContent = s; log.appendChild(d2); });
    log.appendChild(fin);
    finishRound(G.revealed ? 1 : (smart ? 3 : 2));
    return;
  }
  let i = 0;
  const step = () => {
    if (i < steps.length){
      const d2 = el('div', 'mstep');
      d2.textContent = steps[i];
      log.appendChild(d2);
      burstAt(d2, 14);
      i++;
      setTimeout(step, 750);
    } else {
      log.appendChild(fin);
      burstAt(fin, 46);
      if (smart){
        setMsg('先除后乘，一路轻轻松松——巧算高手就是你！商 = ' + R.final);
      } else {
        setMsg('结果正确！不过先乘出了大数 ' + R.sum + ' 再除有点费劲。能整除时先除后乘会更轻松，下次试试～');
      }
      finishRound(smart ? 3 : 2);
    }
  };
  step();
}

/* ============================================================
   十五、回合收尾与庆祝
   ============================================================ */
function finishRound(stars){
  G.running = false;
  if (!G.awarded[G.ri]){
    G.awarded[G.ri] = true;
    addStars(stars);
  }
  renderProgress();
  const wrap = $('#nextwrap');
  wrap.hidden = false;
  wrap.innerHTML = '';
  const last = (G.ri >= G.rounds.length - 1);
  const btn = el('button', 'btn-main');
  btn.textContent = last ? '查看成绩' : '下一轮';
  btn.addEventListener('click', () => {
    if (last) { celebrate(); }
    else { G.ri++; startRound(); }
  });
  wrap.appendChild(btn);
}
function celebrate(){
  stopTimer();
  const s = Math.floor((Date.now() - G.t0) / 1000);
  $('#cel-stats').innerHTML =
    '获得星星：<b>' + G.stars + '</b> 颗　·　用时 <b>' + fmtTime(s) + '</b>　·　操作 <b>' + G.steps + '</b> 步<br/>' +
    '你已经掌握轮转数求和的巧算秘诀：数字和 × 111…1！';
  $('#celebrate').hidden = false;
  fxRain(160);
  setTimeout(() => fxRain(120), 900);
}

/* ============================================================
   十六、规则说明与揭示答案
   ============================================================ */
function rulesHtml(diff, starting){
  const base = '<div class="m-body"><p><b>轮转数小秘诀：</b>几个数字轮流当排头，转出一组轮转数（如 235、352、523）。' +
    '每个数字在每一个数位上恰好各出现一次，所以每一列的和都等于数字和，' +
    '<b>总和 = 数字和 × 111…1（1 的个数 = 位数）</b>。</p>';
  let body = '';
  if (diff === 'easy'){
    body = '<ol>' +
      '<li><b>转一转：</b>拖动摩天轮（或点「转动一格」），转出新的排法。</li>' +
      '<li><b>集一集：</b>每转出一个轮转数，收集墙上对应的数就被点亮，集齐全部过关。</li>' +
      '<li><b>拼一拼：</b>把数字卡拖进「数字和袋子」算出数字和，再挑一座层数正确的「1」塔放到乘号后面。</li>' +
      '<li>公式拼对，巧算机器自动算出总和！</li></ol>';
  } else if (diff === 'mid'){
    body = '<ol>' +
      '<li><b>补方阵：</b>把数字卡拖进空格，让每一行都由和排头数完全相同的数字组成（轮转伙伴）。</li>' +
      '<li>每一行不能重复；开头的 0 也要占一格哦（0412 写作 412，但方阵里还是 4 格）。</li>' +
      '<li>方阵完成后观察每一列：每个数字恰好出现一次！</li>' +
      '<li><b>拼一拼：</b>装数字和袋子 + 挑「1」塔，拼出巧算公式。</li></ol>';
  } else {
    body = '<ol>' +
      '<li><b>装袋子：</b>把组成轮转数的数字卡拖进「数字和袋子」，得到数字和。</li>' +
      '<li><b>挑塔：</b>拖入层数等于位数的「1」塔。</li>' +
      '<li><b>放积木：</b>把「÷' + (G.round ? G.round.d : '') + '」积木放到一个插槽——放在乘塔前面是先除后乘，放在后面是先乘后除。能整除时先除更轻松（三星奥秘）！</li>' +
      '<li>按「启动机器」完成巧算！</li></ol>';
  }
  const btn = starting ? '开始挑战' : '知道了';
  return '<h2>玩法规则</h2>' + base + body + '</div>' +
         '<div class="modal-btns"><button class="btn-main" data-close="1">' + btn + '</button></div>';
}
function solutionHtml(){
  const R = G.round;
  let lines = '';
  if (G.diff === 'hard'){
    lines =
      '<div class="sol-line">' + R.divExpr + '</div>' +
      '<div class="sol-line">= (' + R.ds.join('+') + ') × ' + R.R + ' ÷ ' + R.d + '</div>' +
      '<div class="sol-line">= ' + R.S + ' × ' + R.R + ' ÷ ' + R.d + '</div>' +
      '<div class="sol-line">= ' + R.S + ' ÷ ' + R.d + ' × ' + R.R + '　（能整除，先除后乘更轻松）</div>' +
      '<div class="sol-line">= ' + (R.S / R.d) + ' × ' + R.R + '</div>' +
      '<div class="sol-line">= <b>' + R.final + '</b></div>';
  } else {
    lines =
      '<div class="sol-line">' + R.expr + ' 中每个数字在每个数位上恰好出现一次</div>' +
      '<div class="sol-line">和 = (' + R.ds.join('+') + ') × ' + R.R + '</div>' +
      '<div class="sol-line">= ' + R.S + ' × ' + R.R + '</div>' +
      '<div class="sol-line">= <b>' + R.sum + '</b></div>';
  }
  return '<h2>本关完整解法</h2><div class="m-body">' + lines +
         '<p>小提示：自己动手转一转、拼一拼，会发现更多规律哦！</p></div>' +
         '<div class="modal-btns"><button class="btn-main" data-close="1">知道了</button></div>';
}
function revealRound(){
  if (!G.round) { return; }
  if (G.phase === 'done'){
    showModal(solutionHtml());
    return;
  }
  G.revealed = true;
  if (G.diff === 'easy'){
    /* 点亮收集墙全部轮转数 */
    for (let i = 0; i < G.round.n; i++){ G.collected[i] = true; }
    $$('.shelf-item').forEach((it, i) => { it.textContent = G.round.nums[i]; it.classList.add('lit'); });
    showBreakdown(true);                 // 内部会完成分解表并渲染拼装区
    G.bagDigits = G.round.ds.slice();
    updateBagDisplay();
    G.rPlaced = true;
    const body = $('#slot-r-body');
    if (body){ body.innerHTML = towerInner(G.round.R); }
    const sl = $('.slot');
    if (sl){ sl.classList.add('filled'); }
    runFormula(true);
  } else if (G.diff === 'mid'){
    fillGridInstant();
    showBreakdown(true);                 // 内部会完成分解表并渲染拼装区
    G.bagDigits = G.round.ds.slice();
    updateBagDisplay();
    G.rPlaced = true;
    const body = $('#slot-r-body');
    if (body){ body.innerHTML = towerInner(G.round.R); }
    const sl = $('.slot');
    if (sl){ sl.classList.add('filled'); }
    runFormula(true);
  } else {
    G.bagDigits = G.round.ds.slice();
    updateBagDisplay();
    G.rPlaced = true;
    const rb = $('#wb-r-b');
    if (rb){ rb.textContent = String(G.round.R); }
    const cr = $('#wb-r');
    if (cr){ cr.classList.add('sealed'); }

    const sa = $('#sock-a');

      sa.appendChild(placed);
    }
    const sb = $('#sock-b');
    if (sb){ sb.classList.add('off'); }
    runMachine(true);
  }
  showModal(solutionHtml());
}

$$('.menu-card').forEach(card => {
