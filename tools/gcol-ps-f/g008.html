<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>火柴棒算式大探险（第28讲 假设法）</title>
<style>
/* ===== 火柴棒算式大探险 · 样式（课堂投影友好：大字号、粗线条、一屏放下） =====
   主题色由脚本在开局时换上（--primary / --primary2 / --bg / --ink），这里先给一套默认值。 */
:root{--primary:#1565c0;--primary2:#42a5f5;--bg:#eaf3fd;--ink:#0d2b4e;--panel:#fff;--ok:#2e9e4f;--bad:#e53935}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  background:var(--bg);color:var(--ink);font-size:18px;line-height:1.5;overflow:hidden;
  transition:background .4s;-webkit-tap-highlight-color:transparent;
}
.hidden{display:none!important}
/* 庆祝彩纸：盖满全屏的固定层，不拦截鼠标 */
#fxCanvas{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:900}
.wrap{max-width:1180px;height:100%;margin:0 auto;padding:14px 22px 16px}
.wrap>section{height:100%;display:flex;flex-direction:column}
/* ---------- 难度选择页 ---------- */
#screenMenu{align-items:center;justify-content:center;text-align:center}
#screenMenu::before{content:"";margin-top:auto}   /* 与页脚的 margin-top:auto 配合：内容垂直居中，页脚贴底 */
#screenMenu::after{content:"";margin-top:auto}
.title-big{font-size:46px;font-weight:900;letter-spacing:3px;color:var(--primary);text-shadow:0 3px 0 rgba(0,0,0,.07)}
.sub{font-size:20px;opacity:.82;margin-top:2px}
#paletteName{font-size:15px;font-weight:800;color:var(--primary2);margin-top:4px}
.cards{display:flex;gap:22px;width:100%;justify-content:center;margin:20px 0 14px}
.card{
  flex:1 1 0;max-width:340px;text-align:left;font-family:inherit;color:var(--ink);cursor:pointer;
  background:var(--panel);border:3px solid var(--primary2);border-radius:24px;padding:18px 20px 16px;
  box-shadow:0 7px 0 var(--primary2),0 12px 26px rgba(0,0,0,.10);
  transition:transform .12s,box-shadow .12s,border-color .12s;
}
.card:hover,.card:focus-visible{transform:translateY(-4px);border-color:var(--primary);box-shadow:0 11px 0 var(--primary),0 18px 30px rgba(0,0,0,.15);outline:none}
.card.pressing,.card:active{transform:translateY(5px);box-shadow:0 2px 0 var(--primary)}
.card .tag{display:inline-block;font-size:14px;font-weight:800;color:#fff;background:var(--primary2);border-radius:999px;padding:2px 13px}
.card h2{font-size:25px;color:var(--primary);margin:9px 0 6px}
.card p{font-size:16.5px;line-height:1.6;opacity:.9}
.footNote{margin-top:auto;padding-top:10px;font-size:14px;opacity:.6}
/* ---------- 按钮 ---------- */
.btnRow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
.btn{
  font-family:inherit;font-size:19px;font-weight:800;color:var(--ink);cursor:pointer;
  background:var(--panel);border:3px solid var(--primary2);border-radius:16px;padding:11px 24px;min-height:50px;
  box-shadow:0 4px 0 var(--primary2);transition:transform .1s,box-shadow .1s,border-color .1s,background .15s;
}
.btn:hover,.btn:focus-visible{border-color:var(--primary);box-shadow:0 4px 0 var(--primary);outline:none}
.btn.pressing,.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--primary)}
.btn.primary,.btn.go{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 4px 0 var(--primary2)}
.btn.primary:hover,.btn.go:hover{box-shadow:0 4px 0 var(--primary2);filter:brightness(1.08)}
.btnGhost{background:var(--panel);color:var(--primary)}
.btnGhost.small{background:transparent;border-color:transparent;box-shadow:none}   /* 顶栏里的小按钮做成文字样式 */
.btnGhost:hover,.btnGhost:focus-visible{border-color:var(--primary);box-shadow:0 4px 0 var(--primary);filter:none}
.btn.small{font-size:16px;padding:7px 14px;min-height:42px;border-radius:12px;border-width:2px}
/* ---------- 游戏页 ---------- */
.topbar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--panel);border-radius:16px;padding:8px 12px;box-shadow:0 2px 8px rgba(0,0,0,.06);
}
.chip{background:var(--primary);color:#fff;font-weight:800;border-radius:999px;padding:4px 14px;font-size:16px;white-space:nowrap}
.hud{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;font-weight:800;font-size:17px;white-space:nowrap}
.hud span{background:var(--bg);border-radius:10px;padding:4px 11px}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.banner{font-size:25px;font-weight:900;color:var(--primary);text-align:center;line-height:1.35}
.bannerSub{font-size:15px;opacity:.62;text-align:center}
/* 算式盘面是视觉中心：每个数字是 100×170 的 SVG，运算符窄一些；大小同时受窗口宽、高约束，一屏放下 */
.eqRow{--tokW:clamp(62px,min(13.2vw,22vh),168px);display:flex;align-items:center;justify-content:center;gap:calc(var(--tokW)*.08);margin:6px 0}
.eqRow.shake{animation:shake .45s}
.tokBox{width:var(--tokW);height:calc(var(--tokW)*1.7);flex:none}
.tokBox.op{width:calc(var(--tokW)*.56)}
.tokBox svg{width:100%;height:100%;display:block;overflow:visible}
.stickLine{stroke:var(--ink);stroke-width:12;stroke-linecap:round;transition:stroke .15s}
.head{fill:var(--primary2);stroke:var(--ink);stroke-width:2;transition:fill .15s}
.hit{stroke:transparent;stroke-width:36;stroke-linecap:round;pointer-events:stroke}   /* 透明加粗：好点 */
.slotLine{stroke:var(--primary2);stroke-width:9;stroke-linecap:round;stroke-dasharray:11 15;opacity:.5;transition:opacity .15s,stroke .15s}
.stk,.slotG{cursor:default;transition:transform .12s,opacity .12s}
.stk.pressing{transform:scale(.9)}
.stk.lifted{transform:translateY(-9px) scale(1.1);filter:drop-shadow(0 5px 4px rgba(0,0,0,.35))}
.stk.lifted .stickLine{stroke:var(--primary)}
/* 只有当前玩法下能动的部分才显示手型，并高亮 */
.eqRow.mode-add .slotG,.eqRow.mode-remove .stk,.eqRow.mode-move .stk,.eqRow.mode-move .slotG{cursor:pointer}
.eqRow.mode-add .slotG:hover .slotLine,.eqRow.mode-move .slotG:hover .slotLine{opacity:1;stroke:var(--primary)}
.eqRow.mode-remove .stk:hover .stickLine,.eqRow.mode-move .stk:hover .stickLine{stroke:var(--primary)}
.tokBox.solved .stickLine{stroke:var(--ok)}.tokBox.solved .head{fill:var(--ok);stroke:var(--ok)}
.eqRow:not(.shake).tokSolved,.eqRow.solved{animation:winPop .5s}
.flashStick .stickLine{stroke:var(--bad);animation:blink .5s ease-in-out 3}
.flashSlot .slotLine{stroke:var(--bad);opacity:1;animation:blink .5s ease-in-out 3}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(4px)}}
@keyframes winPop{0%{transform:scale(1)}45%{transform:scale(1.06)}100%{transform:scale(1)}}
.feedback{min-height:54px;font-size:19px;font-weight:800;color:var(--bad);text-align:center;display:flex;align-items:center;justify-content:center;padding:0 10px}
#screenGame>.btnRow{margin:4px 0 6px}
/* ---------- 弹层（玩法说明 / 通关 / 答案揭晓） ---------- */
.overlay{position:fixed;inset:0;z-index:1000;background:rgba(20,30,50,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.panelBox{
  background:var(--panel);border-radius:24px;width:100%;max-width:660px;max-height:88vh;overflow:auto;
  padding:26px 32px 24px;font-size:18px;line-height:1.7;box-shadow:0 22px 50px rgba(0,0,0,.3);
  animation:popIn .22s ease-out;
}
@keyframes popIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.panelBox h2{font-size:29px;color:var(--primary);text-align:center;margin-bottom:12px;line-height:1.3}
.panelBox h3{font-size:20px;color:var(--primary);margin:16px 0 6px}
.panelBox p{margin:8px 0}
.panelBox ul{margin:4px 0 8px 24px}
.panelBox code{font-family:"Cambria Math","Times New Roman",serif;font-size:1.1em;background:var(--bg);border-radius:6px;padding:1px 7px}
.panelBox .btnRow{margin-top:20px}
.panelBox .btn{min-width:200px}
.ruleBox{background:var(--bg);border-radius:14px;padding:12px 16px;margin:10px 0}
.pvTitle{font-size:32px;color:var(--primary);text-align:center;line-height:1.3}
.stars{font-size:42px;color:#f9a825;text-align:center;letter-spacing:8px;margin:4px 0 8px}
.pvEq{font-family:"Cambria Math","Times New Roman",serif;font-size:38px;font-weight:900;text-align:center;background:var(--bg);border-radius:16px;padding:10px 12px;margin:12px 0;line-height:1.3}
.pvText{font-size:18.5px;line-height:1.8}
.pvStats{color:var(--primary2);font-weight:800;text-align:center}
.pvTip{background:var(--bg);border-left:6px solid var(--primary2);border-radius:8px;padding:8px 14px}
.stepHead{font-weight:900;color:var(--primary);margin-top:12px}
/* ---------- 提示条 ---------- */
#toast{
  position:fixed;left:50%;bottom:96px;transform:translate(-50%,16px);z-index:1100;
  background:var(--ink);color:#fff;font-size:19px;font-weight:800;line-height:1.45;text-align:center;
  padding:12px 26px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.28);
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;max-width:min(760px,90vw);
}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* ---------- 窄窗口 ---------- */
@media (max-width:900px){
  .cards{flex-direction:column;gap:12px;margin:12px 0 10px}
  .card{max-width:none;padding:12px 16px}
  .card p{display:none}
  .title-big{font-size:34px}
  .hud{width:100%;margin-left:0}
  .eqRow{--tokW:clamp(44px,10.5vw,80px)}
}
</style>
<!--
  教学游戏：火柴棒算式大探险
  对应教参：第28讲 假设法（专题六 火柴棒算式）
  核心方法：在错误的火柴棒算式中，通过添加或拿走一根火柴棒，使错误的算式变正确。
  巧算秘诀：假设某个数出错，算出正确应是几，尝试是否可实现。
  玩法：学生在算式盘面上直接添一根 / 拿一根 / 移一根火柴棒（真操作探索，非选择题）。
  三档难度：初级=添一根（10以内）、中级=拿一根（20以内）、高级=移一根（20以内）。
  单文件自包含，零外部依赖。题库由程序在运行时从"正确算式"反向生成并逐一校验，每局随机抽题。
-->
</head>
<body>
<canvas id="fxCanvas"></canvas>

<div class="wrap">
  <!-- ========== 难度选择页（三档难度） ========== -->
  <section id="screenMenu">
    <h1 class="title-big">火柴棒算式大探险</h1>
    <p class="sub">用「假设法」修好每一个算式 · 适合小学一年级</p>
    <p class="paletteName" id="paletteName"></p>
    <div class="cards">
      <button class="card" onclick="startDiff('easy')">
        <span class="tag">10以内 · 共3关</span>
        <h2>初级 · 添一根</h2>
        <p>算式少了一根火柴棒！想一想哪个数字「应该是几」，点虚线空位把火柴棒放上去。</p>
      </button>
      <button class="card" onclick="startDiff('mid')">
        <span class="tag">20以内 · 共3关</span>
        <h2>中级 · 拿一根</h2>
        <p>算式多了一根火柴棒！找出那个「多吃了一根」的数字，点它一下拿走。</p>
      </button>
      <button class="card" onclick="startDiff('hard')">
        <span class="tag">20以内 · 共3关</span>
        <h2>高级 · 移一根</h2>
        <p>先点一根火柴棒拿在手里，再点虚线空位给它搬个新家，让算式两边相等。</p>
      </button>
    </div>
    <div class="btnRow center">
      <button class="btn btnGhost" onclick="showRules()">玩法说明</button>
    </div>
    <p class="footNote">教参同步：第28讲 假设法（专题六 火柴棒算式）</p>
  </section>

  <!-- ========== 游戏页 ========== -->
  <section id="screenGame" class="hidden">
    <div class="topbar">
      <button class="btn btnGhost small" onclick="showMenu()">返回难度选择</button>
      <span class="chip" id="diffChip">初级</span>
      <button class="btn btnGhost small" onclick="showRules()">玩法</button>
      <div class="hud">
        <span id="hudDots"></span>
        <span id="hudLevel"></span>
        <span id="hudTime"></span>
        <span id="hudSteps"></span>
      </div>
    </div>
    <div class="stage">
      <div class="banner" id="banner"></div>
      <div class="bannerSub">先算一算哪里不对，再用「假设法」想想那个数字应该是几，然后动手！</div>
      <div class="eqRow" id="eqRow"></div>
      <div class="feedback" id="feedback"></div>
    </div>
    <div class="btnRow center">
      <button class="btn" onclick="showHint()">提示</button>
      <button class="btn" onclick="revealAnswer()">揭示答案</button>
      <button class="btn btnGhost" onclick="loadLevel()">重新开始</button>
    </div>
  </section>
</div>

<!-- 通用弹层（玩法说明 / 通关 / 答案揭晓） -->
<div class="overlay hidden" id="overlay"><div class="panelBox" id="panelBox"></div></div>
<div id="toast"></div>

<script>
"use strict";

/* ============================================================
 * 第一部分：纯逻辑核心（无 DOM，可独立校验）
 * ============================================================ */

/*LOGIC-START*/
// ---- 七段式火柴棒数字：每个数字由哪些"段位"的火柴棒组成 ----
// a=上横, g=中横, d=下横, f=左上竖, b=右上竖, e=左下竖, c=右下竖
var SEG_OF_DIGIT = {
  '0': ['a','b','c','d','e','f'],
  '1': ['b','c'],
  '2': ['a','b','d','e','g'],
  '3': ['a','b','c','d','g'],
  '4': ['b','c','f','g'],
  '5': ['a','c','d','f','g'],
  '6': ['a','c','d','e','f','g'],
  '7': ['a','b','c'],
  '8': ['a','b','c','d','e','f','g'],
  '9': ['a','b','c','d','f','g']
};
// 反查表：段位集合 -> 数字
var DIGIT_OF_SEGKEY = {};
(function(){
  for (var d in SEG_OF_DIGIT){
    DIGIT_OF_SEGKEY[SEG_OF_DIGIT[d].slice().sort().join('')] = d;
  }
})();
var SEGS7 = ['a','b','c','d','e','f','g'];

// ---- 各段位在 SVG（viewBox 100 x 170）中的几何位置 [x1,y1,x2,y2] ----
var GEO = {
  a: [14, 10, 86, 10],
  g: [14, 85, 86, 85],
  d: [14, 160, 86, 160],
  f: [10, 16, 10, 76],
  b: [90, 16, 90, 76],
  e: [10, 94, 10, 154],
  c: [90, 94, 90, 154]
};
// 运算符/等号的火柴棒几何：v=中间竖棒，h=中间横棒，h1/h2=等号上下两横
var OP_GEO = {
  v:  [50, 18, 50, 152],
  h:  [16, 85, 84, 85],
  h1: [14, 58, 86, 58],
  h2: [14, 112, 86, 112]
};

// ---- 盘面令牌：pos='digit' 数字位（7个槽位），pos='op' 符号位（+/=/-） ----
// segs 是当前该位置上有的火柴棒集合；字符由 segs 推导出来
function cloneTokens(ts){
  var out = [];
  for (var i = 0; i < ts.length; i++){ out.push({ pos: ts[i].pos, segs: new Set(ts[i].segs) }); }
  return out;
}
function digitCh(segs){
  var k = Array.from(segs).sort().join('');
  return DIGIT_OF_SEGKEY.hasOwnProperty(k) ? DIGIT_OF_SEGKEY[k] : null;
}
function opCh(segs){
  var has = function(s){ return segs.has(s); };
  if (has('h1') && has('h2') && !has('v') && !has('h')) return '=';
  if (has('v') && has('h') && !has('h1') && !has('h2')) return '+';
  if (has('h') && !has('v') && !has('h1') && !has('h2')) return '-';
  return null; // 形状不完整（例如加号被拿走竖棒后只剩一竖）
}
function tokenCh(t){ return t.pos === 'digit' ? digitCh(t.segs) : opCh(t.segs); }
function toStr(ts){
  var s = '';
  for (var i = 0; i < ts.length; i++){ s += (tokenCh(ts[i]) || '?'); }
  return s;
}
// 把 "10-1=9" 这样的算式串变成盘面令牌
function makeTokens(str){
  var out = [];
  for (var i = 0; i < str.length; i++){
    var ch = str[i];
    if (ch >= '0' && ch <= '9'){
      out.push({ pos: 'digit', segs: new Set(SEG_OF_DIGIT[ch]) });
    } else if (ch === '+'){
      out.push({ pos: 'op', segs: new Set(['v','h']) });
    } else if (ch === '-'){
      out.push({ pos: 'op', segs: new Set(['h']) });
    } else if (ch === '='){
      out.push({ pos: 'op', segs: new Set(['h1','h2']) });
    }
  }
  return out;
}
function val(s){
  if (s === null || !/^[0-9]+$/.test(s)) return null;
  if (s.length > 1 && s.charAt(0) === '0') return null; // 不允许前导零
  return parseInt(s, 10);
}
// 解析盘面：必须形如 [数, +/-, 数, =, 数] 且每个字符形状完整，否则返回 null
function analyze(ts){
  var seq = [], buf = '';
  for (var i = 0; i < ts.length; i++){
    var ch = tokenCh(ts[i]);
    if (ch === null) return null;
    if (ts[i].pos === 'digit'){ buf += ch; }
    else { if (buf){ seq.push({ n: buf }); buf = ''; } seq.push({ op: ch }); }
  }
  if (buf) seq.push({ n: buf });
  if (seq.length !== 5) return null;
  if (!seq[1].op || (seq[1].op !== '+' && seq[1].op !== '-')) return null;
  if (seq[3].op !== '=') return null;
  var a = val(seq[0].n), b = val(seq[2].n), c = val(seq[4].n);
  if (a === null || b === null || c === null) return null;
  var left = (seq[1].op === '+') ? (a + b) : (a - b);
  return { a: a, b: b, c: c, op: seq[1].op, left: left, correct: left === c };
}
function isCorrect(ts){
  var an = analyze(ts);
  return !!(an && an.correct);
}

// ---- 枚举"可以拿走的一根火柴棒"（拿走后必须仍是合法字符） ----
function forEachRemovable(ts, fn){
  ts.forEach(function(t, i){
    if (t.pos === 'digit'){
      t.segs.forEach(function(s){
        var ns = new Set(t.segs); ns.delete(s);
        if (digitCh(ns) !== null) fn(i, s, ns);
      });
    } else {
      // 只有加号上的竖棒可以拿走（变减号）；减号/等号不能拿
      if (t.segs.has('v')){
        var ns = new Set(t.segs); ns.delete('v');
        fn(i, 'v', ns);
      }
    }
  });
}
// ---- 枚举"可以放上去的空位"（放上去后必须形成合法字符） ----
function forEachAddable(ts, fn){
  ts.forEach(function(t, i){
    if (t.pos === 'digit'){
      SEGS7.forEach(function(s){
        if (!t.segs.has(s)){
          var ns = new Set(t.segs); ns.add(s);
          if (digitCh(ns) !== null) fn(i, s, ns);
        }
      });
    } else {
      if (t.segs.has('h1') || t.segs.has('h2')) return; // 等号不能动
      if (!t.segs.has('v')){ // 减号添一根竖棒变加号
        var ns = new Set(t.segs); ns.add('v');
        fn(i, 'v', ns);
      }
    }
  });
}
// ---- 执行一次操作，返回新盘面 ----
function applyOp(ts, op){
  var nt = cloneTokens(ts);
  if (op.type === 'add'){ nt[op.ti].segs.add(op.seg); }
  else if (op.type === 'remove'){ nt[op.ti].segs.delete(op.seg); }
  else { nt[op.ti].segs.delete(op.seg); nt[op.ti2].segs.add(op.seg2); }
  return nt;
}
// ---- 找出一个盘面在某玩法下的全部"一次操作就正确"的答案 ----
function findSolutions(ts, mode){
  var res = [];
  if (mode === 'add'){
    forEachAddable(ts, function(ti, seg){
      var nt = applyOp(ts, { type: 'add', ti: ti, seg: seg });
      if (isCorrect(nt)) res.push({ type: 'add', ti: ti, seg: seg, tokens: nt });
    });
  } else if (mode === 'remove'){
    forEachRemovable(ts, function(ti, seg){
      var nt = applyOp(ts, { type: 'remove', ti: ti, seg: seg });
      if (isCorrect(nt)) res.push({ type: 'remove', ti: ti, seg: seg, tokens: nt });
    });
  } else {
    forEachRemovable(ts, function(i1, s1, ns1){
      var t1 = cloneTokens(ts); t1[i1].segs = ns1;
      forEachAddable(t1, function(i2, s2){
        if (i1 === i2 && s1 === s2) return; // 放回原位等于没动
        var nt = cloneTokens(t1); nt[i2].segs.add(s2);
        if (isCorrect(nt)) res.push({ type: 'move', ti: i1, seg: s1, ti2: i2, seg2: s2, tokens: nt });
      });
    });
  }
  return res;
}

// ---- 由"正确算式清单"反向生成谜面题库（保证每题确实有错且有解） ----
function buildPool(mode, correctList){
  var out = [], seen = new Set();
  function pushIf(shownTs, src){
    var s = toStr(shownTs);
    if (seen.has(s)) return;
    if (s.charAt(0) === '0') return;      // 谜面不以 0 开头
    if (s.length > 11) return;            // 谜面不要太长
    var an = analyze(shownTs);
    if (!an || an.correct) return;        // 谜面必须能解析且确实错误
    var sols = findSolutions(shownTs, mode);
    if (!sols.length) return;             // 必须至少有一个答案
    seen.add(s);
    out.push({ mode: mode, shownStr: s, shown: cloneTokens(shownTs), solutions: sols, src: src });
  }
  correctList.forEach(function(expr){
    var t = makeTokens(expr);
    if (mode === 'add'){
      // 添一根玩法：谜面 = 正确算式被拿走一根火柴棒
      forEachRemovable(t, function(ti, seg, ns){
        var nt = cloneTokens(t); nt[ti].segs = ns;
        pushIf(nt, expr);
      });
    } else if (mode === 'remove'){
      // 拿一根玩法：谜面 = 正确算式被添上一根火柴棒
      forEachAddable(t, function(ti, seg){
        pushIf(applyOp(t, { type: 'add', ti: ti, seg: seg }), expr);
      });
    } else {
      // 移一根玩法：谜面 = 正确算式里一根火柴棒被挪了位置
      forEachRemovable(t, function(i1, s1, ns1){
        var t1 = cloneTokens(t); t1[i1].segs = ns1;
        forEachAddable(t1, function(i2, s2){
          if (i1 === i2 && s1 === s2) return;
          var nt = cloneTokens(t1); nt[i2].segs.add(s2);
          pushIf(nt, expr);
        });
      });
    }
  });
  return out;
}

// ---- 生成"叙述"：把玩家的操作翻译成教参的假设法语言 ----
function seqGroups(ts){
  var gs = [], cur = [];
  ts.forEach(function(t, i){
    if (t.pos === 'digit'){ cur.push(i); }
    else { if (cur.length){ gs.push({ type: 'num', idxs: cur.slice() }); cur = []; } gs.push({ type: 'op', idx: i }); }
  });
  if (cur.length) gs.push({ type: 'num', idxs: cur });
  return gs;
}
function roleName(ts, idx){
  var an = analyze(ts);
  if (!an) return '数字';
  var gs = seqGroups(ts), gi = -1;
  gs.forEach(function(g, i){
    if (g.type === 'num'){ if (g.idxs.indexOf(idx) >= 0) gi = i; }
    else if (g.idx === idx){ gi = i; }
  });
  if (gi === 0) return an.op === '+' ? '第一个加数' : '被减数';
  if (gi === 2) return an.op === '+' ? '第二个加数' : '减数';
  if (gi === 4) return an.op === '+' ? '和' : '差';
  if (gi === 1 || gi === 3) return '符号';
  return '数字';
}
function buildNarration(shown, won, op){
  var s = toStr(shown), w = toStr(won);
  if (op.type === 'add' || op.type === 'remove'){
    if (op.seg === 'v'){
      return op.type === 'add'
        ? '假设「符号」出错了！给减号添上一根竖火柴棒，减号变加号，算式就成立啦！正确算式：' + w
        : '假设「符号」出错了！拿走加号上的竖火柴棒，加号变减号，算式就成立啦！正确算式：' + w;
    }
    var role = roleName(won, op.ti);
    var bch = tokenCh(shown[op.ti]), ach = tokenCh(won[op.ti]);
    return op.type === 'add'
      ? '用假设法想一想：' + s + ' 不成立。假设「' + role + '」出错了——添上一根火柴棒，' + bch + ' 正好变成 ' + ach + '！正确算式：' + w
      : '用假设法想一想：' + s + ' 不成立。假设「' + role + '」出错了——拿走一根火柴棒，' + bch + ' 变成 ' + ach + '！正确算式：' + w;
  }
  var r1 = roleName(won, op.ti), r2 = roleName(won, op.ti2);
  return '把这根火柴棒从「' + r1 + '」搬到「' + r2 + '」，算式两边就相等啦！正确算式：' + w;
}

function shuffle(arr){
  for (var i = arr.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
// ---- 每局随机抽 3 题：教参例题权重更高，其余随机，不重复 ----
function pickPuzzles(mode){
  var pool = POOLS[mode];
  var docxList = (DOCX_SHOWN[mode] || []).map(function(s){
    for (var i = 0; i < pool.length; i++){ if (pool[i].shownStr === s) return pool[i]; }
    return null;
  }).filter(Boolean);
  var cand = pool.concat(docxList, docxList, docxList);
  shuffle(cand);
  var out = [], seen = new Set();
  for (var i = 0; i < cand.length; i++){
    if (!seen.has(cand[i].shownStr)){
      seen.add(cand[i].shownStr);
      out.push(cand[i]);
      if (out.length === 3) break;
    }
  }
  return out;
}

// ---- 点击处理（状态机：添一根 / 拿一根 / 移一根） ----
function onBoardClick(ti, seg, kind){
  if (G.lock || !G.cur || G.cur.solved) return;
  var mode = G.cur.mode;
  var tok = G.tokens[ti];
  if (kind === 'stick'){
    if (tok.pos === 'op' && tok.segs.has('h1')){ showToast('等号是公平的小裁判，不能动哦！'); return; }
    if (mode === 'remove'){ commit({ type: 'remove', ti: ti, seg: seg }); return; }
    if (mode === 'move'){
      if (G.holding){
        if (G.holding.ti === ti && G.holding.seg === seg){ cancelHold(); }
        else { showToast('先把手里的火柴棒放好，再去拿别的哦！'); }
      } else {
        G.holding = { ti: ti, seg: seg };
        renderBoard();
        $('banner').textContent = '火柴棒已在手！点虚线空位放下它；点回原处可以放回去。';
      }
      return;
    }
    showToast('这一关要「添一根」：请点虚线空位，把火柴棒放上去！');
  } else {
    if (mode === 'add'){ commit({ type: 'add', ti: ti, seg: seg }); return; }
    if (mode === 'move'){
      if (!G.holding){ showToast('先点一根火柴棒，把它拿在手里！'); return; }
      commit({ type: 'move', ti: G.holding.ti, seg: G.holding.seg, ti2: ti, seg2: seg });

  }

// ---- 提交一次操作：步数+1，对则通关，错则弹回 ----
function commit(op){
  if (G.lock || !G.cur || G.cur.solved) return;
  G.steps++; updateHud();
  var nt = applyOp(G.shownTokens, op);
  G.tokens = nt; G.holding = null;
  renderBoard();
  if (isCorrect(nt)){ onWin(op, nt); return; }
  G.lock = true;
  $('eqRow').classList.add('shake');
  $('feedback').textContent = wrongFeedback(nt);
  setTimeout(function(){
    $('eqRow').classList.remove('shake');
    $('feedback').textContent = '';
    G.tokens = cloneTokens(G.shownTokens);
    G.lock = false;
    renderBoard();
  }, 1000);
}

  }

    var nt = applyOp(G.shownTokens, sol);
    G.tokens = nt; G.holding = null;
    G.cur.solved = true;
    stopTimer();
    renderBoard();
    showPanel(
      '<h2 class="pvTitle">答案揭晓</h2>' +
      '<div class="pvEq">' + prettyEq(toStr(nt)) + '</div>' +
      '<p class="pvText">' + buildNarration(G.shownTokens, nt, sol) + '</p>' +
      '<p class="pvTip">看懂了吗？下一关自己动手试一试！</p>' +
      '<div class="btnRow center"><button class="btn" onclick="nextLevel()">我学会啦，下一关</button></div>'
    );
    G.lock = false;
  }, 1500);
}

// ---- 提示（分两步，逐步引导假设法） ----
function showHint(){
  if (G.lock || !G.cur || G.cur.solved) return;
  var hs = HINTS[G.cur.mode];
  showToast(hs[G.hintStage % hs.length], 4200);
  G.hintStage++;
}

// ---- 关卡与流程 ----
function showScreen(id){
  $('screenMenu').classList.toggle('hidden', id !== 'screenMenu');
  $('screenGame').classList.toggle('hidden', id !== 'screenGame');
}
function startDiff(diff){
  G.diff = diff;
  G.puzzles = pickPuzzles(diff);
  G.levelIdx = 0;
  showScreen('screenGame');
  loadLevel();
}
function loadLevel(){
  var p = G.puzzles[G.levelIdx];
  G.cur = { mode: p.mode, solved: false };
  G.shownTokens = cloneTokens(p.shown);
  G.tokens = cloneTokens(p.shown);
  G.solutions = p.solutions;
  G.steps = 0; G.timeSec = 0;
  G.holding = null; G.revealed = false; G.lock = false; G.hintStage = 0;
  applyPalette(PALETTES[Math.floor(Math.random() * PALETTES.length)]);
  $('banner').textContent = BANNERS[p.mode];
  $('diffChip').textContent = DIFF_NAMES[G.diff] + ' · 第' + (G.levelIdx + 1) + '关';
  renderBoard();
  startTimer();
  hideOverlay();
}
function nextLevel(){
  hideOverlay();
  if (G.levelIdx < G.puzzles.length - 1){ G.levelIdx++; loadLevel(); }
  else { showMenu(); }
}
function showMenu(){
  hideOverlay();
  stopTimer();
  showScreen('screenMenu');
}

// ---- 计时器与步数（G7） ----
function fmtTime(s){
  var m = Math.floor(s / 60), r = s % 60;
  return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r;
}
function updateHud(){
  $('hudLevel').textContent = '第 ' + (G.levelIdx + 1) + ' / ' + G.puzzles.length + ' 关';
  $('hudTime').textContent = '用时 ' + fmtTime(G.timeSec);
  $('hudSteps').textContent = '步数 ' + G.steps;
  var d = '';
  for (var i = 0; i < G.puzzles.length; i++){
    d += (i < G.levelIdx ? '●' : (i === G.levelIdx ? '◐' : '○'));
  }
  $('hudDots').textContent = d;
}
function startTimer(){
  stopTimer();
  G.timeSec = 0;
  updateHud();
  G.timerId = setInterval(function(){
    if (!G.paused){ G.timeSec++; updateHud(); }
  }, 1000);
}
function stopTimer(){
  if (G.timerId){ clearInterval(G.timerId); G.timerId = null; }
}

// ---- 弹层与轻提示 ----
function showPanel(html){
  $('panelBox').innerHTML = html;

}
function hideOverlay(){
  $('overlay').classList.add('hidden');

var toastTimer = null;
function showToast(msg, dur){
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, dur || 1900);
}

// ---- 庆祝彩纸（G5，Canvas 实现） ----
var fx = $('fxCanvas'), fctx = fx.getContext('2d');
var particles = [], fxRunning = false;
function sizeFx(){ fx.width = window.innerWidth; fx.height = window.innerHeight; }
window.addEventListener('resize', sizeFx);
sizeFx();
function celebrate(level){
  var colors = [
    G.palette ? G.palette.primary : '#e65100',
    G.palette ? G.palette.primary2 : '#fb8c00',
    '#f6b93b', '#e74c3c', '#2ecc71', '#3498db', '#9b59b6'
  ];
  var n = (level === 2) ? 220 : 130;
  for (var k = 0; k < n; k++){
    particles.push({
      x: Math.random() * fx.width,
      y: -20 - Math.random() * fx.height * 0.4,
      vx: (Math.random() - 0.5) * 3.2,
      vy: 2 + Math.random() * 3.5,
      w: 6 + Math.random() * 8,
      h: 8 + Math.random() * 10,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.25,
      color: colors[k % colors.length],
      shape: k % 3,
      life: 1
    });
  }
  if (!fxRunning){ fxRunning = true; requestAnimationFrame(fxLoop); }
}
function fxLoop(){
  fctx.clearRect(0, 0, fx.width, fx.height);
  particles.forEach(function(p){
    p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.rot += p.vr;
    if (p.y > fx.height + 30) p.life = 0;
  });
  particles = particles.filter(function(p){ return p.life > 0; });
  particles.forEach(function(p){
    fctx.save();
    fctx.translate(p.x, p.y);
    fctx.rotate(p.rot);
    fctx.fillStyle = p.color;
    if (p.shape === 0){ fctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); }
    else if (p.shape === 1){ fctx.beginPath(); fctx.arc(0, 0, p.w / 2, 0, Math.PI * 2); fctx.fill(); }
    else { fctx.beginPath(); fctx.moveTo(0, -p.h / 2); fctx.lineTo(p.w / 2, p.h / 2); fctx.lineTo(-p.w / 2, p.h / 2); fctx.closePath(); fctx.fill(); }
    fctx.restore();
  });
  if (particles.length){ requestAnimationFrame(fxLoop); }
  else { fxRunning = false; fctx.clearRect(0, 0, fx.width, fx.height); }
}
