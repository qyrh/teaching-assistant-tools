<style>:root{--c1:#0E7FD6;--c2:#54C0F0;--bg:#EDF9FF;--ink:#12314B;--panel:#FFFFFF;--ok:#1E9E5A;--okbg:#E2F7EA;--bad:#E23D3D;--badbg:#FDEAEA;--gold:#F5A623;--road:#B9C6D2;--shadow:0 4px 14px rgba(20,40,60,.14)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0}body{font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.55;min-height:100vh;overflow-x:hidden}#app{max-width:1080px;margin:0 auto;padding:10px 12px 30px}.hidden{display:none!important}#screen-start{text-align:center;padding-top:4vh}#screen-start h1{font-size:clamp(26px,4.6vw,44px);margin:12px 0 6px;letter-spacing:2px;color:var(--c1);text-shadow:0 2px 0 rgba(255,255,255,.9)}#screen-start .sub{font-size:clamp(15px,2.4vw,21px);color:var(--ink);opacity:.85;margin:0 0 26px}.diff-cards{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}.diff-btn{flex:1 1 220px;max-width:300px;min-height:150px;border:none;border-radius:20px;background:linear-gradient(160deg,var(--c2),var(--c1));color:#fff;cursor:pointer;font-size:clamp(19px,2.6vw,24px);font-weight:bold;padding:18px 12px;box-shadow:var(--shadow);transition:transform .15s ease,box-shadow .15s ease}.diff-btn small{display:block;font-size:14px;font-weight:normal;margin-top:8px;opacity:.95}.diff-btn:hover{transform:translateY(-4px) scale(1.02)}.diff-btn:active{transform:scale(.97)}.legend{background:var(--panel);border-radius:16px;padding:14px 18px;max-width:760px;margin:0 auto;box-shadow:var(--shadow);font-size:15px;text-align:left}.legend b{color:var(--c1)}#topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel);border-radius:14px;padding:8px 12px;box-shadow:var(--shadow);position:sticky;top:6px;z-index:50;margin-bottom:10px}#topbar .brand{font-weight:bold;color:var(--c1);font-size:17px;margin-right:auto}.stat{background:var(--bg);border-radius:10px;padding:4px 12px;font-size:17px;font-weight:bold;border:2px solid var(--c2);white-space:nowrap}.stat small{font-size:12px;font-weight:normal;opacity:.7;margin-right:2px}#qcard{background:var(--panel);border-radius:16px;padding:14px 18px;box-shadow:var(--shadow);border-left:10px solid var(--c1);margin-bottom:12px}#qcard .lvtag{display:inline-block;background:var(--c1);color:#fff;border-radius:999px;padding:3px 14px;font-size:15px;font-weight:bold;margin-bottom:8px}#qcard .story{font-size:clamp(17px,2.5vw,21px);margin:0}#qcard .task{margin-top:8px;font-weight:bold;color:var(--c1)}#stage{position:relative;height:270px;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}@media(max-width:640px){#stage{height:225px}}.track{position:absolute;top:158px;left:4%;width:92%;height:10px;border-radius:6px;background:var(--road)}.track:after{content:"";position:absolute;inset:2px 0;background:repeating-linear-gradient(90deg,#fff 0 26px,transparent 26px 52px);opacity:.75;border-radius:4px}.city{position:absolute;top:158px;transform:translate(-50%,-88%);text-align:center;font-size:13px;font-weight:bold;width:70px}.city .ico{font-size:30px;display:block;line-height:1}.gapband{position:absolute;top:128px;height:14px;border-radius:8px;background:repeating-linear-gradient(45deg,var(--gold) 0 10px,#ffe3a3 10px 20px);opacity:.95;transition:all .06s linear}.gaptext{position:absolute;top:98px;transform:translateX(-50%);font-size:15px;font-weight:bold;color:#9a6b00;background:#fff7e3;border:2px solid var(--gold);border-radius:999px;padding:1px 12px;white-space:nowrap;transition:all .06s linear}.lane{position:absolute;height:8px;border-radius:5px;transition:all .05s linear}.lane.dim{opacity:.28}.lane-label{position:absolute;font-size:13px;font-weight:bold;transform:translateX(-50%)}.car{position:absolute;top:158px;transform:translate(-50%,-52%);text-align:center;width:86px;pointer-events:none;user-select:none}.car .ico{font-size:38px;display:block;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}.car .tag{font-size:13px;font-weight:bold;border-radius:8px;padding:0 8px;display:inline-block;margin-top:1px;background:#ffe1e1;color:#b03030;border:1.5px solid #b03030}.car.b .tag{background:#e1ecff;color:#1d4fa0;border-color:#1d4fa0}.car .badge{display:block;font-size:12px;color:#fff;background:var(--gold);border-radius:6px;padding:0 6px;margin-top:2px}.flagm{position:absolute;top:118px;transform:translate(-50%,-100%);text-align:center;width:70px;user-select:none}.flagm .ico{font-size:30px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}.flagm .tag{font-size:12px;font-weight:bold;background:#fff;border:2px solid var(--gold);border-radius:999px;padding:0 8px;color:#9a6b00}#flag-silver{cursor:grab;touch-action:none}#flag-silver:active{cursor:grabbing}#flag-silver .ico{animation:bob 1.2s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.swallow{position:absolute;top:60px;transform:translate(-50%,-50%);font-size:26px;pointer-events:none;transition:left .05s linear}.meet-glow{position:absolute;top:158px;transform:translate(-50%,-50%);font-size:34px;pointer-events:none;animation:pop .5s ease}@keyframes pop{0%{transform:translate(-50%,-50%) scale(0)}70%{transform:translate(-50%,-50%) scale(1.3)}100%{transform:translate(-50%,-50%) scale(1)}}#deck{background:var(--panel);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}.deck-title{font-size:15px;font-weight:bold;color:var(--c1);margin-bottom:6px}.time-big{font-size:34px;font-weight:bold;color:var(--c1);text-align:center;margin-bottom:2px}.time-big small{font-size:16px;color:var(--ink);opacity:.7}input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:46px;background:transparent;cursor:pointer}input[type=range]::-webkit-slider-runnable-track{height:14px;border-radius:8px;background:linear-gradient(90deg,var(--c2),var(--c1))}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:38px;border-radius:50%;background:#fff;border:6px solid var(--c1);margin-top:-12px;box-shadow:0 3px 8px rgba(0,0,0,.3)}input[type=range]::-moz-range-track{height:14px;border-radius:8px;background:linear-gradient(90deg,var(--c2),var(--c1))}input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fff;border:6px solid var(--c1);box-shadow:0 3px 8px rgba(0,0,0,.3)}.ticks{display:flex;justify-content:space-between;font-size:13px;opacity:.65;padding:0 14px;margin-bottom:8px}.statusline{text-align:center;font-size:clamp(16px,2.4vw,20px);font-weight:bold;border-radius:12px;padding:8px 10px;margin:6px 0 10px;background:var(--bg);border:2px dashed var(--c2)}.statusline.near{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.statusline.over{background:var(--badbg);border-color:var(--bad);color:var(--bad)}.axis-wrap{margin:4px 0 10px}.axis-line{position:relative;height:10px;border-radius:6px;background:var(--bg);border:2px solid var(--c2);margin:26px 14px 30px}.axis-pin{position:absolute;top:50%;transform:translate(-50%,-50%);cursor:grab;touch-action:none;background:linear-gradient(160deg,var(--gold),#ffcf70);color:#6b4a00;font-weight:bold;border-radius:12px;padding:5px 12px;font-size:15px;box-shadow:0 3px 8px rgba(0,0,0,.25);border:2px solid #fff;white-space:nowrap;user-select:none}.axis-pin:active{cursor:grabbing}.axis-hint{text-align:center;font-size:13px;opacity:.7;margin-top:2px}.cardpool{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:8px 0 14px;min-height:64px}.pcard{min-width:86px;padding:10px 16px;border-radius:14px;font-size:24px;font-weight:bold;color:#fff;background:linear-gradient(160deg,var(--c2),var(--c1));box-shadow:0 4px 10px rgba(0,0,0,.2);cursor:grab;user-select:none;touch-action:none;text-align:center}.pcard.sel{outline:4px solid var(--gold);transform:scale(1.06)}.pcard.locked{cursor:default;opacity:.95}.slotrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}.slot{flex:1 1 190px;max-width:250px;min-height:86px;border:3px dashed var(--c2);border-radius:14px;background:var(--bg);padding:8px;text-align:center;transition:all .15s;cursor:pointer}.slot .slot-label{font-size:14px;font-weight:bold;opacity:.85;margin-bottom:5px}.slot .hole{font-size:22px;font-weight:bold;color:var(--c1);min-height:34px;display:flex;align-items:center;justify-content:center}.slot.okk{border:3px solid var(--ok);background:var(--okbg)}.slot.shake{animation:shake .4s}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-5px)}}.slot.hl{outline:4px solid var(--gold)}.puzboard{padding:4px 6px 10px}.puz-bar{position:relative;height:34px;border-radius:10px;background:var(--bg);border:2px solid var(--road);overflow:hidden;display:flex}.puz-bar .seg{height:100%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold;color:#fff;white-space:nowrap;overflow:hidden;transition:width .4s ease}.puz-cap{display:flex;justify-content:space-between;font-size:14px;font-weight:bold;margin:2px 6px 6px}.puz-sum{text-align:center;font-size:17px;font-weight:bold;margin-top:8px;color:var(--c1)}.meter{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:6px 0 12px}.meter .cell{background:var(--bg);border-radius:12px;padding:8px 16px;text-align:center;border:2px solid var(--c2)}.meter .cell b{font-size:26px;color:var(--c1);display:block}.meter .cell span{font-size:13px;opacity:.75}.lamp{border-radius:999px;padding:8px 20px;font-size:17px;font-weight:bold;background:#eee;color:#888;border:2px solid #bbb}.lamp.on{background:var(--okbg);color:var(--ok);border-color:var(--ok);animation:pop .4s ease}.btn{border:none;border-radius:14px;padding:12px 20px;font-size:17px;font-weight:bold;cursor:pointer;color:#fff;background:linear-gradient(160deg,var(--c2),var(--c1));box-shadow:0 3px 8px rgba(0,0,0,.2);transition:transform .12s;touch-action:manipulation}.btn:active{transform:scale(.96)}.btn:disabled{opacity:.6;cursor:default}.btn.big{font-size:20px;padding:14px 34px;display:block;margin:6px auto}.btn.green{background:linear-gradient(160deg,#4cc47e,var(--ok))}.btn.orange{background:linear-gradient(160deg,#ffc25c,var(--gold));color:#6b4a00}.btn.gray{background:linear-gradient(160deg,#9fb3c8,#7a93ad)}#btnrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}#modal-mask{position:fixed;inset:0;background:rgba(15,35,55,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}#modal{background:var(--panel);border-radius:20px;max-width:640px;width:100%;max-height:86vh;overflow-y:auto;padding:22px 24px;box-shadow:0 10px 40px rgba(0,0,0,.35)}#modal h2{margin:0 0 10px;color:var(--c1);font-size:24px}#modal .body{font-size:17px;white-space:pre-wrap}#modal .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}.stars{font-size:44px;text-align:center;letter-spacing:6px;margin:6px 0}.sol-box{background:var(--bg);border-radius:12px;padding:12px 14px;margin-top:10px;border-left:6px solid var(--gold)}.sol-box b{color:var(--c1)}#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-16px);z-index:300;background:rgba(20,40,60,.92);color:#fff;padding:10px 22px;border-radius:999px;font-size:17px;opacity:0;transition:all .25s;pointer-events:none;max-width:86vw;text-align:center}#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}#confetti{position:fixed;inset:0;pointer-events:none;z-index:400}.ghost{position:fixed;z-index:500;pointer-events:none;transform:translate(-50%,-50%) scale(1.08);opacity:.92}@media(max-width:640px){.car .ico{font-size:30px}.car{width:70px}.time-big{font-size:28px}#btnrow .btn{flex:1 1 40%}}
</style>
</head>
<body>
<div id="app">

  <!-- ============ 开始屏 ============ -->
  <section id="screen-start">
    <h1>🚗 相遇小镇 · 时光调度站 🚙</h1>
    <p class="sub">拨动时光表盘，调度红车甲甲和蓝车乙乙，一起见证完美相遇！</p>
    <div class="diff-cards">
      <button class="diff-btn" data-diff="easy">🚀 初级 · 启程站<small>同时出发 · 拨表盘找相遇 · 拼路程</small></button>
      <button class="diff-btn" data-diff="mid">🚂 中级 · 换乘站<small>不同时出发 · 提前出发牌 · 精准停靠</small></button>
      <button class="diff-btn" data-diff="hard">✈️ 高级 · 环游站<small>第二次相遇 · 相遇银旗 · 信使小燕子</small></button>
    </div>
    <div class="legend">
      <b>调度员须知：</b>你将通过 <b>拖动时光表盘</b>、<b>拖出提前出发牌</b>、<b>拖卡片拼路程</b>、<b>拖银旗找相遇点</b> 等操作，
      亲手"演出"每一道相遇问题的过程。操作本身就是思考——拨对了，两车才会完美相遇！
      每局的主题色和题目都会随机变化，多玩几次也不会腻哦。
    </div>
    <div style="margin-top:16px;">
      <button class="btn orange" id="btn-rules0">📖 游戏规则说明</button>
    </div>
  </section>

  <!-- ============ 游戏屏 ============ -->
  <section id="screen-game" class="hidden">
    <header id="topbar">
      <span class="brand">🚗 相遇小镇 · 时光调度站</span>
      <span class="stat"><small>难度</small><span id="t-diff">初级</span></span>
      <span class="stat"><small>关卡</small><span id="t-lv">1/3</span></span>
      <span class="stat"><small>⏱ 时间</small><span id="t-time">00:00</span></span>
      <span class="stat"><small>👣 步数</small><span id="t-steps">0</span></span>
    </header>

    <div id="qcard">
      <span class="lvtag" id="q-tag">第 1 关</span>
      <p class="story" id="q-story"></p>
      <p class="task" id="q-task"></p>
    </div>

    <div id="stage"></div>
    <div id="deck"></div>

    <div id="btnrow">
      <button class="btn orange" id="btn-reveal">💡 揭示答案</button>
      <button class="btn gray"  id="btn-restart">🔄 重新开始本关</button>
      <button class="btn gray"  id="btn-back">🏠 返回难度选择</button>
      <button class="btn gray"  id="btn-rules">📖 规则说明</button>
    </div>
  </section>
</div>

<!-- 弹窗与彩纸 -->
<div id="modal-mask" class="hidden">
  <div id="modal">
    <h2 id="modal-title"></h2>
    <div class="body" id="modal-body"></div>
    <div class="actions" id="modal-actions"></div>
  </div>
</div>
<canvas id="confetti"></canvas>
