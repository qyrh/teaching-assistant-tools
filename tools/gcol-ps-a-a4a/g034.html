<style>:root{--bg:#f6f9ff;--panel:#ffffff;--ink:#1f2a44;--c1:#3b6ef5;--c2:#ff7a45;--c3:#19b28b;--soft:#e8eefc}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.65}button{font-family:inherit;cursor:pointer;border:none;border-radius:12px}#headerBar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;background:var(--panel);box-shadow:0 2px 10px rgba(30,40,80,.12);position:sticky;top:0;z-index:20;flex-wrap:wrap}#headerBar h1{font-size:21px;color:var(--c1)}#hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap}#hud .pill{background:var(--soft);color:var(--ink);border-radius:999px;padding:5px 14px;font-weight:bold;font-size:16px}.smallBtn{background:var(--soft);color:var(--c1);padding:8px 14px;font-size:16px;font-weight:bold}.smallBtn:hover{filter:brightness(.95)}#menuScreen{max-width:960px;margin:0 auto;padding:28px 16px 48px}#menuScreen .intro{background:var(--panel);border-radius:18px;padding:18px 20px;margin-bottom:20px;box-shadow:0 3px 14px rgba(30,40,80,.10)}#menuScreen .intro h2{color:var(--c1);font-size:24px;margin-bottom:8px}.diffRow{display:flex;gap:16px;flex-wrap:wrap}.diffCard{flex:1 1 260px;min-width:250px;background:var(--panel);border-radius:18px;padding:20px;box-shadow:0 3px 14px rgba(30,40,80,.10);border-top:8px solid var(--c1);transition:transform .15s ease;text-align:left}.diffCard:hover{transform:translateY(-4px)}.diffCard h3{font-size:22px;margin-bottom:8px;color:var(--c1)}.diffCard p{font-size:16px;color:#44506e}.diffCard .tag{display:inline-block;margin:10px 6px 0 0;background:var(--soft);border-radius:8px;padding:3px 10px;font-size:16px}#gameScreen{display:none;max-width:1180px;margin:0 auto;padding:14px 14px 40px}#topRow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}#topRow .badge{background:var(--c1);color:#fff;border-radius:10px;padding:5px 14px;font-weight:bold;font-size:17px}#topRow .sub{font-size:17px;font-weight:bold}#dots{display:flex;gap:12px;margin-left:auto}#dots .dot{width:16px;height:16px;border-radius:50%;background:#c9d3ea;border:3px solid #c9d3ea}#dots .dot.now{background:#fff;border-color:var(--c1)}#dots .dot.done{background:var(--c1);border-color:var(--c1)}#mainCols{display:flex;gap:18px;align-items:flex-start}#leftCol{flex:0 0 46%;max-width:560px}#canvasWrap{background:var(--panel);border-radius:18px;padding:12px;box-shadow:0 3px 14px rgba(30,40,80,.10)}#trackCv{display:block;width:100%;aspect-ratio:1/1;touch-action:none}#legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:16px}#legend .chip{background:var(--soft);border-radius:9px;padding:4px 12px;font-weight:bold}#rightCol{flex:1 1 400px;display:flex;flex-direction:column;gap:14px;min-width:0}#missionCard{background:var(--panel);border-radius:18px;padding:16px 18px;box-shadow:0 3px 14px rgba(30,40,80,.10)}#missionCard .mTitle{font-size:19px;color:var(--c1);font-weight:bold;margin-bottom:6px}#missionCard .mQ{font-size:17px}#missionCard .mNote{font-size:16px;color:#5a6a8f;margin-top:6px}#missionCard .mGoal{margin-top:12px;background:color-mix(in srgb,var(--c1) 12%,white);border-left:6px solid var(--c1);border-radius:8px;padding:10px 12px;font-size:16.5px;font-weight:bold}#ctrlBox{background:var(--panel);border-radius:18px;padding:16px 18px;box-shadow:0 3px 14px rgba(30,40,80,.10)}.ctrlGroup{display:flex;flex-direction:column;gap:13px}.rowLabel{font-size:17px;font-weight:bold}.rowLabel .hint{font-weight:normal;font-size:16px}input[type=range]{width:100%;height:38px;accent-color:var(--c1)}.btnRow2{display:flex;gap:12px;flex-wrap:wrap}.actBtn{background:var(--soft);color:var(--ink);padding:10px 16px;font-size:17px;font-weight:bold}.actBtn:hover{filter:brightness(.95)}.primaryBtn{background:var(--c1);color:#fff;padding:12px 26px;font-size:19px;font-weight:bold;box-shadow:0 3px 0 rgba(0,0,0,.15)}.primaryBtn:hover{filter:brightness(1.08)}.primaryBtn:disabled{background:#aab6d3;cursor:not-allowed;box-shadow:none}.statGrid{display:flex;gap:12px;flex-wrap:wrap}.statGrid .st{background:var(--soft);border-radius:10px;padding:6px 12px;font-size:16.5px}.feedback{background:#fff8e6;border-left:6px solid #f0a800;border-radius:8px;padding:10px 12px;font-size:16.5px;min-height:52px}.feedback.good{background:#e6fcf1;border-left-color:var(--c3)}.gauge{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--soft);border-radius:10px;padding:8px 12px;font-size:17px}.lamp{width:20px;height:20px;border-radius:50%;background:#c9d3ea;display:inline-block;flex:0 0 auto}.lamp.ok{background:#12b886;box-shadow:0 0 10px #12b886}.toggle{background:var(--soft);padding:7px 14px;font-size:16px;font-weight:bold;color:var(--ink)}.toggle.on{background:var(--c1);color:#fff}.counterRow{font-size:17px;font-weight:bold;background:var(--soft);border-radius:10px;padding:8px 12px}#starsBox{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border-radius:18px;padding:12px 18px;box-shadow:0 3px 14px rgba(30,40,80,.10)}.starSlot{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:84px;background:var(--soft);border-radius:12px;padding:8px 10px}.starSlot .sIcon{font-size:30px;color:#c9d3ea}.starSlot.lit .sIcon{color:#f5b301;text-shadow:0 0 12px #ffd43b}.starSlot .sLab{font-size:16px;font-weight:bold;text-align:center}#btnRow{display:flex;gap:12px;flex-wrap:wrap}#btnRow button{background:var(--panel);color:var(--c1);border:2px solid var(--c1);padding:10px 16px;font-size:17px;font-weight:bold;border-radius:12px}#btnRow button:hover{background:var(--soft)}.rulerBlock{margin-top:4px}.rulerBlock .rLab{font-size:17px;font-weight:bold;margin-bottom:4px}canvas.rulerCv{display:block;width:100%;height:80px;touch-action:none;background:#fbfcff;border-radius:10px;border:2px solid var(--soft)}#modalMask{position:fixed;inset:0;background:rgba(20,28,55,.55);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}#modalMask.show{display:flex}#modalPanel{background:#fff;border-radius:20px;max-width:720px;width:100%;max-height:86vh;overflow:auto;padding:24px 26px;box-shadow:0 12px 40px rgba(0,0,0,.3)}#modalPanel h2{color:var(--c1);margin-bottom:12px;font-size:24px}#modalPanel .mSection{margin:12px 0;font-size:17px}#modalPanel .mSection b.tag{color:var(--c1)}#modalPanel .btns{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}#fxCanvas{position:fixed;inset:0;pointer-events:none;z-index:80}@media(max-width:920px){#mainCols{flex-direction:column}#leftCol{flex:1 1 auto;max-width:100%;width:100%}#rightCol{flex:1 1 auto;width:100%}body{font-size:16px}}

</head>
<body>

<!-- 顶栏：标题 + 计时器/步数（G7）+ 规则入口（G6） -->
<div id="headerBar">
  <h1>环环相扣 · 环形跑道大闯关</h1>
  <div id="hud">
    <span class="pill">时间 <span id="hudTime">00:00</span></span>
    <span class="pill">步数 <span id="hudSteps">0</span></span>
    <button class="smallBtn" id="btnRulesTop">规则说明</button>
  </div>
</div>

<!-- 难度选择页（G3：三档难度） -->
<div id="menuScreen">
  <div class="intro">
    <h2>欢迎来到环形跑道运动会！</h2>
    <p>你将成为<b>跑道小指挥</b>。这里没有选择题——你要亲手拖动时间滑块、调节速度旋钮、指挥选手击掌掉头、在米尺上拖出游标，在操作中掌握"追上 n 次就多跑 n 圈""速度和与速度差的和差妙招"。每局题目与配色都会随机刷新，快来点亮属于你的星星吧！</p>
  </div>
  <div class="diffRow">
    <button class="diffCard" data-diff="easy">
      <h3>初级 · 追及探秘</h3>
      <p>拖动时间滑块，让两位选手在环形跑道上跑起来，在他们第1、2、3次追上的准确时刻点"击掌"，点亮星星！</p>
      <span class="tag">时间滑块</span><span class="tag">击掌判定</span><span class="tag">多跑n圈</span>
    </button>
    <button class="diffCard" data-diff="mid">
      <h3>中级 · 速度指挥官</h3>
      <p>拖动两个速度滑块，让"背向相遇周期"和"同向追及周期"两块仪表同时变绿，和差公式用起来！</p>
      <span class="tag">速度滑块</span><span class="tag">周期仪表</span><span class="tag">和差公式</span>
    </button>
    <button class="diffCard" data-diff="hard">
      <h3>高级 · 巅峰调度</h3>
      <p>设置击掌掉头旋钮看完整比赛，在米尺上拖游标标出路程；还有先出发挑战与周长侦探等你来闯！</p>
      <span class="tag">击掌掉头</span><span class="tag">米尺拖游标</span><span class="tag">分阶段调度</span>
    </button>
  </div>
</div>

<!-- 游戏主界面 -->
<div id="gameScreen">
  <div id="topRow">
    <span class="badge" id="diffBadge">初级</span>
    <span class="sub" id="missionNo">第1题 / 共3题</span>
    <div id="dots"></div>
  </div>
  <div id="mainCols">
    <div id="leftCol">
      <div id="canvasWrap">
        <canvas id="trackCv"></canvas>
        <div id="legend"></div>
      </div>
    </div>
    <div id="rightCol">
      <div id="missionCard"></div>
      <div id="starsBox"></div>
      <div id="ctrlBox"></div>
      <div id="btnRow">
        <button id="btnReveal">揭示答案</button>
        <button id="btnRestart">重新开始</button>
        <button id="btnBack">返回难度选择</button>
        <button id="btnRules">规则说明</button>
      </div>
    </div>
  </div>
</div>

<!-- 通用弹窗（规则 / 答案 / 过关庆祝） -->
<div id="modalMask"><div id="modalPanel"></div></div>
<!-- 彩纸庆祝画布（G5） -->
<canvas id="fxCanvas"></canvas>

<script>"use strict";function $(id){return document.getElementById(id)}function mod(a,n){const r=a%n;return r<0?r+n:r}function circDist(C,a,b){const d=Math.abs(mod(a,C)-mod(b,C));return Math.min(d,C-d)}function fmt(x){return String(Math.round(x*100)/100)}function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}function pickN(pool,n){return shuffle(pool).slice(0,n)}function mmss(sec){const m=Math.floor(sec/60),s=sec%60;return(m<10?"0":"")+m+":"+(s<10?"0":"")+s}function esc(t){return String(t)}function snap(min,max,step,val){const v=Math.max(min,Math.min(max,val));return min+Math.round((v-min)/step)*step}const PALETTES=[{bg:"#f6f9ff",ink:"#1f2a44",c1:"#3b6ef5",c2:"#ff7a45",c3:"#19b28b",soft:"#e8eefc"},{bg:"#fff8f0",ink:"#3a2a1a",c1:"#e8590c",c2:"#2f9e44",c3:"#7048e8",soft:"#ffeee0"},{bg:"#f2fbf5",ink:"#173a2a",c1:"#0ca678",c2:"#e8590c",c3:"#4263eb",soft:"#e0f5ec"},{bg:"#fdf2ff",ink:"#3d1f4e",c1:"#9c36b5",c2:"#f08c00",c3:"#0b7285",soft:"#f8e8fd"},{bg:"#f0f7ff",ink:"#17305e",c1:"#1c7ed6",c2:"#eb2f6b",c3:"#f59f00",soft:"#e3edfb"},{bg:"#fffdf0",ink:"#4a3b00",c1:"#e67700",c2:"#1098ad",c3:"#5f3dc4",soft:"#fff3d6"}];let PAL=PALETTES[0];function applyPalette(){const p=PALETTES[Math.floor(Math.random()*PALETTES.length)];const r=document.documentElement.style;r.setProperty("--bg",p.bg);r.setProperty("--ink",p.ink);r.setProperty("--c1",p.c1);r.setProperty("--c2",p.c2);r.setProperty("--c3",p.c3);r.setProperty("--soft",p.soft);document.body.style.background=p.bg;document.body.style.color=p.ink;PAL=p}const A_POOL=[{id:"ex4",engine:"A",mode:"chase",C:400,dir:1,v:[5,4],names:["甲","乙"],startArc:[0,100],arcLabel:"A→B 顺时针100米",tMax:1e3,unit:"秒",speedUnit:"米/秒",note:"从A沿跑步方向（顺时针）到B是100米。",q:"在400米的环形跑道上，A、B 两地相距100米（从A沿跑步方向到B为100米）。甲、乙二人分别从A、B两点同时出发，甲每秒跑5米，乙每秒跑4米，按顺时针方向跑。(1) 经过多长时间甲第一次追上乙？(2) 到第二次追上乙经过多长时间？第三次呢？",ans:"(1) 100秒；(2) 500秒；(3) 900秒。",sol:"第一步通过同向判断出是追及问题；第二步确定出发地点：异地相距100米；第三步运用公式：路程差÷速度差=追及时间，100÷(5-4)=100(秒)。第二次及以后每追上一次要多跑一圈400米：100+400÷(5-4)=500(秒)；第三次：100+400×2=900(秒)。"},{id:"lx10",engine:"A",mode:"chase",C:400,dir:-1,v:[5,4],names:["甲","乙"],startArc:[0,100],arcLabel:"A→B 顺时针100米",tMax:1200,unit:"秒",speedUnit:"米/秒",note:"本题按逆时针方向跑：从A沿跑步方向（逆时针）到B是 400-100=300 米（图中虚线短弧100米是顺时针那段）。",q:"在400米的环形跑道上，A、B 两地相距100米（从A沿顺时针方向到B为100米）。甲、乙二人分别从A、B两点同时出发，甲每秒跑5米，乙每秒跑4米，按逆时针方向跑。(1) 经过多长时间甲第一次追上乙？(2) 到第二次追上乙经过多长时间？第三次呢？",ans:"(1) 300秒；(2) 700秒；(3) 1100秒。",sol:"按逆时针跑，甲要追的弧长是400-100=300(米)：300÷(5-4)=300(秒)；第二次：300+400÷(5-4)=700(秒)；第三次：300+400×2=1100(秒)。以后每追上一次多跑一圈，变成周期问题。"},{id:"lx11",engine:"A",mode:"chase",C:20,dir:1,v:[4,3],names:["甲","乙"],startArc:[0,10],arcLabel:"A→B 沿跑道10米(半圈)",tMax:70,unit:"秒",speedUnit:"米/秒",note:"A、B 正好在圆的一条直径上，沿跑道相距半圈 20÷2=10 米。",q:"一圆形跑道，甲从A点出发，乙从B点出发，都按顺时针方向跑。A、B正好在圆的一条直径上，圆周长为20米，甲每秒跑4米，乙每秒跑3米。当甲第一次追上乙时，甲跑了几圈？（游戏中请点亮第1、2、3次追上三颗星）",ans:"甲跑了2圈。",sol:"A、B在直径两端，沿跑道相距20÷2=10(米)：10÷(4-3)=10(秒)第一次追上；甲共跑4×10=40(米)，40÷20=2(圈)。"},{id:"lx12",engine:"A",mode:"chase",C:200,dir:1,v:[6,4],names:["田田","丁丁"],startArc:[0,0],arcLabel:null,tMax:340,unit:"秒",speedUnit:"米/秒",note:"两人同时从起跑线出发（同地同向）。",q:"运动会在学校200米长的环形跑道上进行，田田和丁丁同时从起跑线同向起跑，田田每秒钟跑6米，丁丁每秒钟跑4米。(1) 田田第一次追上丁丁时两人各跑了多少米？(2) 田田第二次追上丁丁时两人各跑了多少圈？（游戏中请点亮第1、2、3次追上三颗星）",ans:"第一次：田田600米、丁丁400米；第二次：田田6圈、丁丁4圈。",sol:"同地出发，每追上一次多跑一圈：200÷(6-4)=100(秒)，田田跑100×6=600(米)，丁丁跑100×4=400(米)；第二次追上共用200秒，田田跑1200米=6(圈)，丁丁跑800米=4(圈)。"},{id:"va1",engine:"A",mode:"chase",C:300,dir:1,v:[7,4],names:["奇奇","乐乐"],startArc:[0,0],arcLabel:null,tMax:340,unit:"秒",speedUnit:"米/秒",note:"两人同时从起跑线出发（同地同向）。",q:"在300米的环形跑道上，奇奇和乐乐同时从起跑线出发，同向（顺时针）跑步。奇奇每秒跑7米，乐乐每秒跑4米。奇奇第1次、第2次、第3次追上乐乐分别用了多少秒？",ans:"100秒；200秒；300秒。",sol:"同地出发，每追上一次多跑一圈：300÷(7-4)=100(秒)；第二次：300×2÷3=200(秒)；第三次：300×3÷3=300(秒)。"},{id:"va2",engine:"A",mode:"chase",C:500,dir:1,v:[6,4],names:["丁丁","牛牛"],startArc:[0,200],arcLabel:"A→B 顺时针200米",tMax:660,unit:"秒",speedUnit:"米/秒",note:"从A沿跑步方向（顺时针）到B是200米。",q:"在500米的环形跑道上，丁丁从A点、牛牛从B点同时出发同向（顺时针）跑步，从A沿跑步方向到B为200米。丁丁每秒跑6米，牛牛每秒跑4米。丁丁第1、2、3次追上牛牛分别用了多少秒？",ans:"100秒；350秒；600秒。",sol:"第一次追及：200÷(6-4)=100(秒)；以后每追上一次多跑一圈500米，多用250秒：第二次100+250=350(秒)，第三次350+250=600(秒)。"}];const B_POOL=[{id:"ex5",engine:"B",C:1600,persons:["选手甲","选手乙"],Tm:4,Tc:20,vRange:[50,400],vStep:2,unit:"分",speedUnit:"米/分",q:'在环形跑道上，两人在一处背靠背站好然后出发，每隔4分钟相遇一次；如果两人从同地同向同时跑，每隔20分钟"相遇"一次（同向的"相遇"就是追上）。已知环形跑道的长度是1600米，那么两人的速度分别是多少？',ans:"快者240米/分，慢者160米/分。",sol:"背向每4分钟合跑一圈：速度和=1600÷4=400(米/分)；同向每20分钟多跑一圈：速度差=1600÷20=80(米/分)；用和差公式：快者=(400+80)÷2=240(米/分)，慢者=400-240=160(米/分)。"},{id:"lx13",engine:"B",C:300,persons:["田田","丁丁"],Tm:30,Tc:150,vRange:[1,10],vStep:.5,unit:"秒",speedUnit:"米/秒",q:"在300米的环形跑道上，田田和丁丁同学同时同地起跑，如果同向而跑2分30秒相遇一次（即150秒），如果背向而跑则半分钟相遇一次（即30秒），求两人的速度各是多少。",ans:"两人分别是6米/秒和4米/秒（快者6，慢者4）。",sol:'同向"相遇"即追及：速度差=300÷150=2(米/秒)；背向相遇：速度和=300÷30=10(米/秒)；慢者=(10-2)÷2=4(米/秒)，快者=10-4=6(米/秒)。'},{id:"lx14",engine:"B",C:400,persons:["丁丁","牛牛"],Tm:40,Tc:200,vRange:[1,10],vStep:.5,unit:"秒",speedUnit:"米/秒",q:"在400米的环形跑道上，丁丁、牛牛两人同时同地起跑，如果同向而行3分20秒相遇一次（即200秒），如果背向而行40秒相遇一次，已知丁丁比牛牛快，求丁丁、牛牛的速度各是多少。",ans:"丁丁6米/秒；牛牛4米/秒。",sol:"速度和=400÷40=10(米/秒)，速度差=400÷200=2(米/秒)，丁丁（快者）=(10+2)÷2=6(米/秒)，牛牛（慢者）=(10-2)÷2=4(米/秒)。"},{id:"vb1",engine:"B",C:500,persons:["果果","淘淘"],Tm:25,Tc:125,vRange:[2,16],vStep:.5,unit:"秒",speedUnit:"米/秒",q:'在500米的环形跑道上，果果和淘淘同时同地起跑。背向而跑每25秒相遇一次；同向而跑每125秒"相遇"（追上）一次。两人的速度各是多少？',ans:"快者12米/秒，慢者8米/秒。",sol:"速度和=500÷25=20(米/秒)，速度差=500÷125=4(米/秒)，快者=(20+4)÷2=12(米/秒)，慢者=(20-4)÷2=8(米/秒)。"}];const E_MID=[{id:"lx15",engine:"E",persons:["田田","牛牛"],v:[4,3],phase1:"meet",T1:45,unit:"秒",speedUnit:"米/秒",t2Max:400,q:"田田与牛牛两人从同一地点出发，牛牛每秒跑3米，田田每秒跑4米，反向而行，45秒后两人相遇。这个环形跑道一圈长多少米？如果同向而行，多少秒后田田第一次追上牛牛？",ans:"一圈长315米；同向而行315秒后田田第一次追上牛牛。",sol:'一圈=(3+4)×45=315(米)；同向而行"相遇"即追及：315÷(4-3)=315(秒)。'},{id:"ve1",engine:"E",persons:["小飞","小乐"],v:[5,4],phase1:"meet",T1:40,unit:"秒",speedUnit:"米/秒",t2Max:450,q:"小飞和小乐从同一地点出发，小飞每秒跑5米，小乐每秒跑4米，反向而行，40秒后两人相遇。这个环形跑道一圈长多少米？如果同向而行，多少秒后小飞第一次追上小乐？",ans:"一圈长360米；同向而行360秒后追上。",sol:"一圈=(5+4)×40=360(米)；追及：360÷(5-4)=360(秒)。"}];const C_POOL=[{id:"
