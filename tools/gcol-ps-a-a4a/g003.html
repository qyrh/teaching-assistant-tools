<style>:root{--c1:#0d47a1;--c2:#42a5f5;--bg:#e8f2fd;--ac:#fb8c00;--ink:#263238}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0}body{font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.6}.app{max-width:1000px;margin:0 auto;padding:10px 12px 40px}.hidden{display:none!important}h1,h2,h3{margin:.2em 0 .4em}button{font-family:inherit}.diff-hero{text-align:center;padding:26px 10px 8px}.diff-hero h1{font-size:34px;color:var(--c1);letter-spacing:2px}.diff-hero p{font-size:19px;color:#546e7a}.diff-cards{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;padding:16px 0}.diff-card{width:270px;border:4px solid var(--c1);border-radius:18px;background:#fff;padding:18px 14px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.12);transition:transform .15s;text-align:center}.diff-card:hover{transform:translateY(-5px)}.diff-card h2{font-size:26px;color:var(--c1)}.diff-card .lv{font-size:16px;color:#fff;background:var(--c2);border-radius:10px;padding:2px 10px;display:inline-block;margin-bottom:6px}.diff-card p{font-size:16px;color:#455a64;margin:6px 0 0;text-align:left}.center-row{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:10px}.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:6px 4px}.bar-title{font-size:24px;font-weight:bold;color:var(--c1)}.bar-title .chip{font-size:16px;background:var(--ac);color:#fff;border-radius:10px;padding:2px 10px;vertical-align:middle;margin-left:6px}.bar-stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:#fff;border:3px solid var(--c2);border-radius:12px;padding:3px 12px;font-size:17px}.stat b{color:var(--c1);font-size:19px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:6px 4px 2px}.btn{border:none;border-radius:12px;padding:9px 18px;font-size:17px;font-weight:bold;background:var(--c1);color:#fff;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.15)}.btn:hover{filter:brightness(1.12)}.btn.warn{background:var(--ac)}.btn.ghost{background:#fff;color:var(--c1);border:3px solid var(--c1)}.btn.big{font-size:20px;padding:12px 30px}.bridge-lamps{margin:2px auto 6px;max-width:820px}.bridge-lamps svg{width:100%;height:auto;display:block}#stage-head{padding:2px 6px}#stage-title{font-size:24px;color:var(--c1)}#stage-story{font-size:17px;color:#546e7a;margin:2px 0 8px}#stage-area{background:#fff;border:4px solid var(--c2);border-radius:18px;padding:14px 14px 20px;box-shadow:0 6px 18px rgba(0,0,0,.08);min-height:420px}.qtext{font-size:19px;font-weight:bold;color:var(--ink);margin:4px 0 10px}.round-tag{font-size:16px;color:#fff;background:var(--c2);border-radius:10px;padding:2px 12px;display:inline-block;margin-bottom:6px}.hint-line{font-size:16px;color:#607d8b;margin:12px 0 4px;text-align:center}canvas.fig{display:block;margin:0 auto;max-width:100%;height:auto;background:#fdfeff;border:3px solid #cfd8dc;border-radius:14px;touch-action:none}.msg{min-height:30px;font-size:18px;text-align:center;margin:10px 0 0}.msg.good{color:#2e7d32;font-weight:bold}.msg.bad{color:#c62828;font-weight:bold}.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:12px}.row.center{justify-content:center}.rack{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;padding:10px 4px;min-height:64px}.stick{height:38px;border-radius:19px;position:relative;cursor:grab;user-select:none;touch-action:none;background:linear-gradient(180deg,#a1887f,#6d4c41);box-shadow:0 3px 8px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center}.stick span{font-size:16px;font-weight:bold;color:#fff;background:rgba(0,0,0,.32);border-radius:9px;padding:0 8px;white-space:nowrap}.drag-ghost{position:fixed;z-index:1000;pointer-events:none;opacity:.92;transform:scale(1.08) rotate(-4deg);box-shadow:0 10px 22px rgba(0,0,0,.3)}.drag-src{opacity:.35}.drop-hover{outline:5px solid var(--ac);outline-offset:3px;border-radius:14px;background:rgba(251,140,0,.08)}@keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}.shake{animation:shakeX .45s}.bins{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:8px 0}.bin{flex:1;min-width:180px;min-height:170px;border:4px dashed var(--c2);border-radius:14px;background:#f4faff;text-align:center;padding:8px 6px}.bin h3{font-size:19px;color:var(--c1);margin:2px 0 6px}.bin .cnt{font-size:16px;color:var(--ac);font-weight:bold}.cards-tray{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:12px;min-height:120px}.card{width:196px;background:#fff;border:3px solid var(--c2);border-radius:12px;padding:6px;cursor:grab;user-select:none;touch-action:none;box-shadow:0 3px 8px rgba(0,0,0,.12)}.card canvas{width:100%;height:auto;display:block}.card .cap{text-align:center;font-size:16px;color:#546e7a}.chips-tray{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:flex-start;margin-top:10px}.chip{width:170px;background:#fff;border:3px solid var(--c2);border-radius:12px;padding:6px;text-align:center;cursor:grab;user-select:none;touch-action:none;box-shadow:0 3px 8px rgba(0,0,0,.12)}.chip canvas{width:100%;height:auto;display:block}.chip .cap{font-size:16px;font-weight:bold;color:var(--c1)}.chip.placed{cursor:pointer;border-style:dashed;background:#f1f8ff}.chip.placed .cap::after{content:"（点击取回）";font-size:16px;color:#90a4ae;font-weight:normal;display:block}.dial-box{background:#fff;border:3px solid var(--ac);border-radius:14px;padding:10px 14px;text-align:center}.dial-box h4{margin:2px 0 6px;font-size:18px;color:var(--ac)}.dial-read{font-size:28px;font-weight:bold;color:var(--c1);margin-top:4px}.fine button{font-size:18px;font-weight:bold;border:none;border-radius:9px;background:var(--c2);color:#fff;padding:5px 16px;margin:0 5px;cursor:pointer}.slots{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:6px 0}.slot{width:190px;min-height:100px;border:4px dashed var(--ac);border-radius:14px;background:#fff8f0;text-align:center;padding:6px}.slot h4{margin:0;font-size:18px;color:var(--ac)}.slot .sbar{height:30px;border-radius:15px;margin-top:10px;background:linear-gradient(180deg,#a1887f,#6d4c41);color:#fff;font-size:16px;font-weight:bold;display:flex;align-items:center;justify-content:center}.slot .sbar.empty{background:#eceff1;color:#90a4ae}.album{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:14px}.album .slotcard{width:240px;border:3px solid var(--c2);border-radius:12px;background:#fff;text-align:center;padding:8px}.album .slotcard h4{margin:0;font-size:17px;color:var(--c1)}.album .slotcard canvas{width:100%;height:auto}#modal-mask{position:fixed;inset:0;background:rgba(38,50,56,.5);display:flex;align-items:center;justify-content:center;z-index:800;padding:14px}#modal-box{background:#fff;border-radius:18px;padding:20px 22px;max-width:680px;width:100%;max-height:84vh;overflow:auto;box-shadow:0 14px 40px rgba(0,0,0,.35);font-size:18px}#modal-box h3{color:var(--c1);font-size:22px}#modal-box .btn-row{display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap}#banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:900;background:#fff;border:5px solid var(--ac);border-radius:20px;padding:20px 34px;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.3);font-size:24px;font-weight:bold;color:var(--c1)}#banner .stars{font-size:34px;color:#f9a825;letter-spacing:8px;display:block;margin-top:4px}@keyframes popIn{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}70%{transform:translate(-50%,-50%) scale(1.12);opacity:1}100%{transform:translate(-50%,-50%) scale(1)}}#banner{animation:popIn .35s}#fx{position:fixed;inset:0;pointer-events:none;z-index:950}@media(max-width:720px){body{font-size:17px}.bar-title{font-size:20px}.diff-card{width:92%}.card,.chip{width:44%}.qtext{font-size:18px}#stage-area{padding:10px 8px 16px}}
</style>

<body>
<canvas id="fx" class="hidden"></canvas>
<div class="app">

  <!-- ============ 难度选择页 ============ -->
  <section id="scr-diff">
    <div class="diff-hero">
      <h1>图图岛 · 三角形工坊</h1>
      <p>丁丁、牛牛、田田和阿普来到了图形王国——图图岛。<br>
      彩虹桥的四盏桥灯熄灭了，完成三角形工坊的挑战，点亮桥灯，开启智慧大门！</p>
    </div>
    <div class="diff-cards">
      <button class="diff-card" data-diff="初级">

      </button>
      <button class="diff-card" data-diff="中级">
        <h2>中级</h2><span class="lv">练习级</span>
        <p>· 大木料挑木条进阶<br>· 直角 / 钝角三角形的高<br>· 拼角验证内角和 180°<br>· 等腰三角形求底角</p>
      </button>
      <button class="diff-card" data-diff="高级">
        <h2>高级</h2><span class="lv">变式综合级</span>
        <p>· 等腰三角形选边求周长<br>· 三明治工坊收集所有搭法<br>· 和倍 / 和差问题求角<br>· 多边形内角和与周角</p>

  <!-- ============ 游戏主界面 ============ -->

      <button id="btn-reveal" class="btn warn">揭示答案</button>
      <button id="btn-restart" class="btn">重新开始</button>

<div id="modal-mask" class="hidden"><div id="modal-box"></div></div>

<script>
'use strict';
/* =====================================================================
   图图岛·三角形工坊 —— 互动教学游戏（重做版）
   知识来源：第2讲 三角形初步（上）
   核心题型：三边关系 / 底与高 / 三角形分类 / 内角和及其应用 / 等腰角度
   操作方式：拖木条搭建、拖卡片分拣、画布上画高、转罗盘设角、收集搭法
   本版针对复核报告的两处硬伤做了规避：
   A. 分拣卡片使用 HTML 流式布局自动换行，绝不越界裁切；
   B. 等腰求周长关：两条固定边与木料架木条是互相独立的实体，
      木料每根只能用一次（用后隐藏），杜绝同一数值复用的错误解。
   ===================================================================== */

/* ---------------- 基础工具 ---------------- */
var $=function(s){return document.querySelector(s);};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s));};
function shuffle(arr){
  var r=arr.slice(),i,j,t;
  for(i=r.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=r[i];r[i]=r[j];r[j]=t;}
  return r;
}
function sample(arr,n){return shuffle(arr).slice(0,n);}
function lerp(a,b,t){return a+(b-a)*t;}
function easeT(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
function fmtTime(sec){
  var m=Math.floor(sec/60),s=sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function inRect(x,y,r){return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;}

/* ---------------- 配色随机化（每局随机一种主题色） ---------------- */
var PALETTES=[
  {name:'海洋蓝',c1:'#0d47a1',c2:'#42a5f5',bg:'#e8f2fd',ac:'#fb8c00'},
  {name:'草地绿',c1:'#1b5e20',c2:'#66bb6a',bg:'#e9f6ea',ac:'#ef6c00'},
  {name:'樱桃红',c1:'#b71c1c',c2:'#ef5350',bg:'#fdecea',ac:'#f9a825'},
  {name:'葡萄紫',c1:'#4a148c',c2:'#7e57c2',bg:'#f1eafb',ac:'#00897b'},
  {name:'蜜橘橙',c1:'#e65100',c2:'#ffa726',bg:'#fdf3e7',ac:'#1565c0'},
  {name:'青松青',c1:'#00695c',c2:'#26a69a',bg:'#e4f4f1',ac:'#c62828'}
];
var P=PALETTES[0];
function applyPalette(){
  P=PALETTES[Math.floor(Math.random()*PALETTES.length)];
  var rs=document.documentElement.style;
  rs.setProperty('--c1',P.c1);rs.setProperty('--c2',P.c2);
  rs.setProperty('--bg',P.bg);rs.setProperty('--ac',P.ac);
}

/* ---------------- 全局状态 ---------------- */
var G={diff:'',stages:[],idx:0,round:0,steps:0,timerId:null,t0:0,busy:false,advancing:false};
function addStep(){G.steps++;$('#hud-steps').textContent=G.steps;}
function startTimer(){
  G.t0=Date.now();
  G.timerId=setInterval(function(){
    $('#hud-time').textContent=fmtTime(Math.floor((Date.now()-G.t0)/1000));
  },500);
}
function stopTimer(){if(G.timerId){clearInterval(G.timerId);G.timerId=null;}}

/* ---------------- 弹窗 / 横幅 / 庆祝 ---------------- */
function showModal(html,buttons){
  var box=$('#modal-box');
  box.innerHTML=html+'<div class="btn-row" id="modal-btns"></div>';
  (buttons||[{t:'我知道了',cls:'btn'}]).forEach(function(b){
    var el=document.createElement('button');
    el.className=b.cls||'btn';el.textContent=b.t;
    el.onclick=function(){$('#modal-mask').classList.add('hidden');if(b.fn)b.fn();};
    box.querySelector('#modal-btns').appendChild(el);
  });
  $('#modal-mask').classList.remove('hidden');
}
function banner(text,ms){
  var b=$('#banner');
  b.innerHTML=text+'<span class="stars">★ ★ ★</span>';
  b.classList.remove('hidden');
  setTimeout(function(){b.classList.add('hidden');},ms||1300);
}
function confetti(){
  var cv=$('#fx');cv.classList.remove('hidden');
  cv.width=window.innerWidth;cv.height=window.innerHeight;
  var ctx=cv.getContext('2d');
  var cols=[P.c1,P.c2,P.ac,'#ffd54f','#ef5350','#66bb6a'];
  var ps=[],i;
  for(i=0;i<180;i++){
    ps.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*0.5,
      vx:(Math.random()-0.5)*2.4,vy:2+Math.random()*3.2,s:7+Math.random()*8,
      c:cols[i%cols.length],rot:Math.random()*6.28,vr:(Math.random()-0.5)*0.25});
  }
  var t0=Date.now();
  (function fr(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(function(p){
      p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*0.66);ctx.restore();
    });
    if(Date.now()-t0<4200){requestAnimationFrame(fr);}
    else{cv.classList.add('hidden');}
  })();
}

/* ---------------- 通用浮层拖拽（指针事件，桌面 + 触屏可用） ---------------- */
function copyCanvases(src,ghost){
  var a=src.querySelectorAll('canvas'),b=ghost.querySelectorAll('canvas');
  for(var i=0;i<a.length&&i<b.length;i++){
    b[i].width=a[i].width;b[i].height=a[i].height;
    b[i].getContext('2d').drawImage(a[i],0,0);
  }
}
function floatDrag(el,opts){
  el.style.touchAction='none';
  el.addEventListener('pointerdown',function(ev){
    if(opts.canDrag&&!opts.canDrag())return;
    if(G.busy)return;
    ev.preventDefault();
    var r=el.getBoundingClientRect();
    var gx=ev.clientX-r.left,gy=ev.clientY-r.top;
    var ghost=el.cloneNode(true);
    ghost.classList.add('drag-ghost');
    ghost.style.width=r.width+'px';ghost.style.height=r.height+'px';
    copyCanvases(el,ghost);
    document.body.appendChild(ghost);
    el.classList.add('drag-src');
    function place(x,y){ghost.style.left=(x-gx)+'px';ghost.style.top=(y-gy)+'px';}
    place(ev.clientX,ev.clientY);
    var targets=opts.targets();
    function findT(x,y){
      for(var i=0;i<targets.length;i++){
        if(inRect(x,y,targets[i].el.getBoundingClientRect()))return targets[i];
      }
      return null;
    }
    function onMove(e){
      place(e.clientX,e.clientY);
      targets.forEach(function(t){t.el.classList.remove('drop-hover');});
      var t=findT(e.clientX,e.clientY);
      if(t)t.el.classList.add('drop-hover');
    }
    function onUp(e){
      window.removeEventListener('pointermove',onMove);
      window.removeEventListener('pointerup',onUp);
      targets.forEach(function(t){t.el.classList.remove('drop-hover');});
      var t=findT(e.clientX,e.clientY);
      var res=opts.onDrop(t,e);
      el.classList.remove('drag-src');
      if(res==='consume'){ghost.remove();}
      else{
        var nr=el.getBoundingClientRect();
        ghost.style.transition='left .25s ease, top .25s ease';
        ghost.style.left=nr.left+'px';ghost.style.top=nr.top+'px';
        setTimeout(function(){ghost.remove();},260);
      }
    }
    window.addEventListener('pointermove',onMove);
    window.addEventListener('pointerup',onUp);
  });
}

/* ---------------- 画图小工具 ---------------- */
function txt(ctx,s,x,y,o){
  o=o||{};
  ctx.save();
  ctx.font='bold '+(o.size||17)+'px "Microsoft YaHei",sans-serif';
  ctx.textAlign=o.align||'center';ctx.textBaseline=o.base||'middle';
  ctx.lineWidth=4;ctx.strokeStyle='rgba(255,255,255,0.92)';
  ctx.strokeText(s,x,y);
  ctx.fillStyle=o.color||'#263238';ctx.fillText(s,x,y);
  ctx.restore();
}
function line(ctx,x1,y1,x2,y2,w,color,dash){
  ctx.save();
  ctx.lineWidth=w;ctx.strokeStyle=color;ctx.lineCap='round';
  if(dash)ctx.setLineDash(dash);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.restore();
}
function dot(ctx,x,y,r,color){
  ctx.save();ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(x,y,r,0,6.29);ctx.fill();ctx.restore();
}
/* 由三个内角构造三角形（底边水平），返回顶点 A/B/C 坐标 */
function triFromAngles(aA,aB,aC,scale){
  var rad=function(d){return d*Math.PI/180;};
  var sA=Math.sin(rad(aA)),sB=Math.sin(rad(aB)),sC=Math.sin(rad(aC));
  var m=Math.max(sA,sB,sC);
  var K=scale/m;
  var a=sA*K,b=sB*K,c=sC*K;      /* a=BC(对A) b=CA(对B) c=AB(对C) */
  var x=(c*c+a*a-b*b)/(2*a);
  var h=Math.sqrt(Math.max(c*c-x*x,1));
  return {A:{x:x,y:h},B:{x:0,y:0},C:{x:a,y:0}};
}
/* 把一组点等比缩放并居中到画布内 */
function fitPts(pts,W,H,pad){
  var i,minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
  for(i=0;i<pts.length;i++){
    minx=Math.min(minx,pts[i].x);maxx=Math.max(maxx,pts[i].x);
    miny=Math.min(miny,pts[i].y);maxy=Math.max(maxy,pts[i].y);
  }
  var s=Math.min((W-2*pad)/Math.max(maxx-minx,1),(H-2*pad-14)/Math.max(maxy-miny,1));
  var cx=(minx+maxx)/2,cy=(miny+maxy)/2;
  return pts.map(function(p){return {x:W/2+(p.x-cx)*s,y:H/2+(p.y-cy)*s};});
}
/* 画一个带标注的三角形：顶点字母 / 角度弧标 / 边记号 */
function drawTriFigure(ctx,pts,o){
  o=o||{};
  var A=pts[0],B=pts[1],C=pts[2];
  if(o.fill){
    ctx.save();ctx.fillStyle=o.fill;
    ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.lineTo(C.x,C.y);
    ctx.closePath();ctx.fill();ctx.restore();
  }
  line(ctx,A.x,A.y,B.x,B.y,o.lw||5,P.c1);
  line(ctx,A.x,A.y,C.x,C.y,o.lw||5,P.c1);
  line(ctx,B.x,B.y,C.x,C.y,o.lw||5,P.c2);
  /* 顶点字母（向重心反方向外移） */
  var cen={x:(A.x+B.x+C.x)/3,y:(A.y+B.y+C.y)/3};
  var names=o.vnames||['A','B','C'];
  [A,B,C].forEach(function(v,i){
    var dx=v.x-cen.x,dy=v.y-cen.y,l=Math.hypot(dx,dy)||1;
    txt(ctx,names[i],v.x+dx/l*26,v.y+dy/l*26,{size:19,color:'#37474f'});
  });
  /* 角度弧标 */
  var adjs=[[1,2],[0,2],[0,1]];
  var angleTexts=o.angleTexts||[];
  [A,B,C].forEach(function(v,i){
    if(angleTexts[i]==null)return;
    var p1=pts[adjs[i][0]],p2=pts[adjs[i][1]];
    var a1=Math.atan2(p1.y-v.y,p1.x-v.x),a2=Math.atan2(p2.y-v.y,p2.x-v.x);
    var d=a2-a1;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
    var accent=o.arcAccent&&o.arcAccent[i];
    ctx.save();
    ctx.strokeStyle=accent?P.ac:'#78909c';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(v.x,v.y,24,a1,a1+d,d<0);ctx.stroke();
    ctx.restore();
    var mid=a1+d/2,lr=(o.longText&&o.longText[i])?58:42;
    txt(ctx,angleTexts[i],v.x+Math.cos(mid)*lr,v.y+Math.sin(mid)*lr,
        {size:17,color:accent?P.ac:'#37474f'});
  });
  /* 边记号（相同数量的短杠 = 相等的边） */
  var ticks=o.ticks||[0,0,0];
  var sides=[[A,B],[B,C],[C,A]];
  sides.forEach(function(sd,si){
    var n=ticks[si];if(!n)return;
    var mx=(sd[0].x+sd[1].x)/2,my=(sd[0].y+sd[1].y)/2;
    var ux=(sd[1].x-sd[0].x),uy=(sd[1].y-sd[0].y),l=Math.hypot(ux,uy)||1;
    ux/=l;uy/=l;var nx=-uy,ny=ux;
    for(var k=0;k<n;k++){
      var off=(k-(n-1)/2)*7;
      line(ctx,mx+nx*9+ux*off,my+ny*9+uy*off,mx-nx*9+ux*off,my-ny*9+uy*off,3,'#455a64');
    }
  });
}
/* 直角小方块记号：在 v 点，沿 u 方向和 w 方向 */
function rightMark(ctx,v,u,w){
  var s=14;
  var p1={x:v.x+u.x*s,y:v.y+u.y*s};
  var p2={x:v.x+u.x*s+w.x*s,y:v.y+u.y*s+w.y*s};
  var p3={x:v.x+w.x*s,y:v.y+w.y*s};
  ctx.save();ctx.strokeStyle='#2e7d32';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.lineTo(p3.x,p3.y);ctx.stroke();
  ctx.restore();
}

  if(v===s)return v+' cm：'+a+'+'+b+'='+v+'，两边之和正好等于第三边，只能排成一条直线；';

  if(v===d)return v+' cm：两边之差是 '+d+'，'+v+' 太短了，两头也碰不上；';
  if(v<d)return v+' cm：比两边之差 '+d+' 还短，围不起来；';
  return v+' cm：不满足三边关系。';
}

/* =====================================================================
   引擎一：木桥工坊（三边关系 · 拖木条搭建，动画演示能否围成）
   ===================================================================== */
/* 计算三边的搭建几何：最长边打底，两侧木条向中间合拢；不合法时显示缺口 */
function bridgeGeom(sides,W,H,bottom){
  bottom=bottom||150;
  var s=sides.slice().sort(function(x,y){return y-x;});
  var L=s[0],o1=s[1],o2=s[2];
  var valid=(o1+o2>L);
  var k=Math.min((W-90)/L,(H-bottom-40)/Math.max(o1,o2,1));
  var bx=(W-L*k)/2,by=H-bottom;
  var Pt={x:bx,y:by},Q={x:bx+L*k,y:by};
  var r1=o1*k,r2=o2*k,apex=null;
  if(valid){
    var D=L*k;
    var x=(r1*r1-r2*r2+D*D)/(2*D);
    var hgt=Math.sqrt(Math.max(r1*r1-x*x,0));
    apex={x:Pt.x+x,y:Pt.y-hgt};
  }
  return {L:L,o1:o1,o2:o2,valid:valid,k:k,P:Pt,Q:Q,r1:r1,r2:r2,apex:apex,
    a1s:-0.9,a2s:-2.2,
    a1e:valid?Math.atan2(apex.y-Pt.y,apex.x-Pt.x):0.32,
    a2e:valid?Math.atan2(apex.y-Q.y,apex.x-Q.x):-(Math.PI+0.32),
    gapCm:L-o1-o2};
}
function drawBridgeFrame(ctx,g,t,done,small){
  var W=ctx.canvas.width,H=ctx.canvas.height;
  /* 最长边作为底部木条 */
  line(ctx,g.P.x,g.P.y,g.Q.x,g.Q.y,small?10:16,'#795548');
  txt(ctx,g.L+' cm',(g.P.x+g.Q.x)/2,g.P.y+(small?18:24),{size:16,color:'#5d4037'});
  /* 两侧木条随动画角度旋转合拢 */
  var a1=lerp(g.a1s,g.a1e,easeT(t)),a2=lerp(g.a2s,g.a2e,easeT(t));
  var e1={x:g.P.x+Math.cos(a1)*g.r1,y:g.P.y+Math.sin(a1)*g.r1};
  var e2={x:g.Q.x+Math.cos(a2)*g.r2,y:g.Q.y+Math.sin(a2)*g.r2};
  line(ctx,g.P.x,g.P.y,e1.x,e1.y,small?8:14,'#a1887f');
  line(ctx,g.Q.x,g.Q.y,e2.x,e2.y,small?8:14,'#8d6e63');
  txt(ctx,g.o1+' cm',(g.P.x+e1.x)/2+(small?8:14),(g.P.y+e1.y)/2-(small?8:14),{size:16,color:'#5d4037'});
  txt(ctx,g.o2+' cm',(g.Q.x+e2.x)/2-(small?8:14),(g.Q.y+e2.y)/2-(small?8:14),{size:16,color:'#5d4037'});
  dot(ctx,g.P.x,g.P.y,small?5:8,'#37474f');dot(ctx,g.Q.x,g.Q.y,small?5:8,'#37474f');
  if(done){
    if(g.valid&&g.apex){
      ctx.save();ctx.globalAlpha=0.18;ctx.fillStyle=P.c2;
      ctx.beginPath();ctx.moveTo(g.P.x,g.P.y);ctx.lineTo(g.Q.x,g.Q.y);ctx.lineTo(g.apex.x,g.apex.y);
      ctx.closePath();ctx.fill();ctx.restore();
      txt(ctx,'围成三角形啦！',W/2,small?26:44,{size:small?16:22,color:'#2e7d32'});
    }else{
      /* 两侧木条够不着：红色虚线标注缺口 */
      line(ctx,e1.x,e1.y,e2.x,e2.y,4,'#e53935',[9,7]);
      dot(ctx,e1.x,e1.y,7,'#e53935');dot(ctx,e2.x,e2.y,7,'#e53935');
      if(small)return;
      if(g.gapCm>0){
        txt(ctx,'还差 '+g.gapCm+' cm 才能碰头',(e1.x+e2.x)/2,(e1.y+e2.y)/2+34,{size:19,color:'#c62828'});
        txt(ctx,'两边之和不够，围不成三角形',W/2,44,{size:20,color:'#c62828'});
      }else{
        txt(ctx,'两边之和正好等于第三边，排成一条直线',W/2,44,{size:20,color:'#c62828'});
        txt(ctx,'围不成三角形',(e1.x+e2.x)/2,(e1.y+e2.y)/2+34,{size:19,color:'#c62828'});
      }
    }
  }
}
function drawBenchIdle(round){

function renderBridge(stage){

function tryBridge(round,v,el){
  if(G.busy)return;
  G.busy=true;
  addStep();
  el.style.visibility='hidden';
  var cv=$('#bench'),ctx=cv.getContext('2d');
  var sides=[round.a,round.b,v];
  var g=bridgeGeom(sides,cv.width,cv.height,150);
  var t0=Date.now(),dur=950;
  (function fr(){
    var t=Math.min(1,(Date.now()-t0)/dur);
    ctx.clearRect(0,0,cv.width,cv.height);
    txt(ctx,'搭建台',cv.width/2,34,{size:22,color:P.c1});
    drawBridgeFrame(ctx,g,t,t>=1,false);
    if(t<1){requestAnimationFrame(fr);return;}
    var msgEl=$('#bmsg');
    if(g.valid&&round.goal==='perimeter'){
      var iso=(round.a===round.b||round.a===v||round.b===v);
      if(!iso){
        msgEl.textContent='能围成三角形，可是大门要的是等腰三角形（要有两条边相等），再换一根试试！';
        msgEl.className='msg bad';
        setTimeout(function(){el.style.visibility='';drawBenchIdle(round);G.busy=false;},1700);
        return;
      }
    }
    if(g.valid){
      var extra=(round.goal==='perimeter')
        ?' 大门周长 = '+round.a+' + '+round.b+' + '+v+' = '+(round.a+round.b+v)+'！'
        :' 任意两边之和大于第三边，桥墩牢固！';
      msgEl.textContent='选对啦！'+v+' cm'+extra;
      msgEl.className='msg good';
      advanceRound();
    }else{
      msgEl.textContent=v+' cm 不行：'+bridgeBadReason(round.a,round.b,v).replace(v+' cm：','');
      msgEl.className='msg bad';
      setTimeout(function(){el.style.visibility='';drawBenchIdle(round);G.busy=false;},1900);
    }
  })();
}

/* =====================================================================
   引擎三：高塔基地（画高 · 画布上拖垂足，90° 时磁吸并钉下）
   ===================================================================== */
function angleAtT(r,t){
  var P1=r[r.base[0]],P2=r[r.base[1]],V=r[r.from];
  var dx=P2.x-P1.x,dy=P2.y-P1.y;
  var len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len;
  var F={x:P1.x+dx*t,y:P1.y+dy*t};
  var vx=V.x-F.x,vy=V.y-F.y,vl=Math.hypot(vx,vy)||1;
  var cosd=(vx*ux+vy*uy)/vl;
  return Math.round(Math.acos(Math.min(1,Math.max(-1,cosd)))*180/Math.PI);
}
function renderHeight(stage){
  var r=stage.rounds[G.round];
  var area=$('#stage-area');
  area.innerHTML=
    roundsTag(stage)+
    '<p class="qtext">'+r.q+'</p>'+
    '<canvas id="hcv" class="fig" width="680" height="440"></canvas>'+
    '<div class="row"><button class="btn big" id="hgo">钉下高线</button></div>'+
    '<p class="msg" id="hmsg">在画布上按住拖动，垂足会沿底边所在直线滑动；显示 90°（绿色）时按【钉下高线】。</p>';
  var V=r[r.from],P1=r[r.base[0]],P2=r[r.base[1]];
  var dx=P2.x-P1.x,dy=P2.y-P1.y;
  var len2=dx*dx+dy*dy;
  var tPerp=((V.x-P1.x)*dx+(V.y-P1.y)*dy)/len2;
  var st={t:r.t0,snapped:false,ang:90};
  function draw(final){
    var cv=$('#hcv'),ctx=cv.getContext('2d');
    ctx.clearRect(0,0,cv.width,cv.height);
    /* 底边所在直线（向两端延长，虚线） */
    var l=Math.sqrt(len2),ux=dx/l,uy=dy/l,ext=115;
    line(ctx,P1.x-ux*ext,P1.y-uy*ext,P2.x+ux*ext,P2.y+uy*ext,3,'#b0bec5',[11,8]);
    /* 三角形（两条侧边 + 加粗底边） */
    line(ctx,V.x,V.y,P1.x,P1.y,5,P.c1);
    line(ctx,V.x,V.y,P2.x,P2.y,5,P.c1);
    line(ctx,P1.x,P1.y,P2.x,P2.y,8,P.c2);
    var F={x:P1.x+dx*st.t,y:P1.y+dy*st.t};
    /* 高线（虚线；钉下后为实线） */
    line(ctx,V.x,V.y,F.x,F.y,final?5:4,final?'#2e7d32':(st.snapped?'#2e7d32':'#fb8c00'),final?null:[13,9]);
    /* 角度读数与垂足 */
    st.ang=angleAtT(r,st.t);
    txt(ctx,st.ang+'°',F.x-ux*52,F.y-uy*52-8,{size:22,color:st.snapped?'#2e7d32':'#e65100'});
    dot(ctx,F.x,F.y,12,'#fb8c00');dot(ctx,F.x,F.y,5,'#fff');
    if(st.snapped||final){
      var vx=V.x-F.x,vy=V.y-F.y,vl=Math.hypot(vx,vy)||1;
      rightMark(ctx,F,{x:ux,y:uy},{x:vx/vl,y:vy/vl});
    }
    /* 三个顶点字母 */
    var cen={x:(r.A.x+r.B.x+r.C.x)/3,y:(r.A.y+r.B.y+r.C.y)/3};
    [{p:r.A,n:'A'},{p:r.B,n:'B'},{p:r.C,n:'C'}].forEach(function(v){
      var ddx=v.p.x-cen.x,ddy=v.p.y-cen.y,dl=Math.hypot(ddx,ddy)||1;
      txt(ctx,v.n,v.p.x+ddx/dl*26,v.p.y+ddy/dl*26,{size:20,color:'#37474f'});
    });
    txt(ctx,'底（'+r.base.join('')+' 所在直线）',(P1.x+P2.x)/2,(P1.y+P2.y)/2+30,{size:17,color:P.c1});
    if(final)txt(ctx,'高',(V.x+F.x)/2+18,(V.y+F.y)/2,{size:20,color:'#2e7d32'});
  }
  draw(false);
  var cv=$('#hcv'),dragging=false;
  function toT(ev){
    var rect=cv.getBoundingClientRect();
    var x=(ev.clientX-rect.left)*(cv.width/rect.width);
    var y=(ev.clientY-rect.top)*(cv.height/rect.height);
    var t=((x-P1.x)*dx+(y-P1.y)*dy)/len2;
    return Math.max(-0.45,Math.min(1.45,t));
  }
  function move(ev){
    st.t=toT(ev);
    st.snapped=Math.abs(angleAtT(r,st.t)-90)<=3;
    if(st.snapped)st.t=tPerp;
    draw(false);
  }
  cv.addEventListener('pointerdown',function(ev){dragging=true;move(ev);ev.preventDefault();});
  cv.addEventListener('pointermove',function(ev){if(dragging)move(ev);});
  window.addEventListener('pointerup',function(){dragging=false;});
  $('#hgo').addEventListener('click',function(){
    if(G.busy)return;
    addStep();
    if(st.snapped){
      draw(true);
      $('#hmsg').textContent='钉好啦！'+r.ok;
      $('#hmsg').className='msg good';
      advanceRound();
    }else{
      $('#hgo').classList.add('shake');setTimeout(function(){$('#hgo').classList.remove('shake');},480);
      $('#hmsg').textContent='现在是 '+st.ang+'°，高线要与底互相垂直（90°）才行，继续拖一拖！';
      $('#hmsg').className='msg bad';
    }
  });
}

/* =====================================================================
   引擎四：拼角大道（内角和 · 拖角块拼 180° 平角尺 + 罗盘设神秘角）
   ===================================================================== */
function sectorPath(ctx,cx,cy,R,phi1,phi2){
  ctx.beginPath();ctx.moveTo(cx,cy);
  ctx.lineTo(cx+Math.cos(phi1)*R,cy-Math.sin(phi1)*R);
  ctx.arc(cx,cy,R,-phi1,-phi2,true);
  ctx.closePath();
}
function renderProof(stage){

  ];
  area.innerHTML=
    '<p class="qtext">拼角大道：把 ∠A（'+pr.A+'°）、∠B（'+pr.B+'°）和<b>神秘角</b>拼到 180° 的平角尺上，正好铺满才能通过。先算一算神秘角是多少度，转动罗盘设定它！</p>'+
    '<canvas id="strip" class="fig" width="680" height="185"></canvas>'+
    '<div class="chips-tray">'+
      '<div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center" id="chips"></div>'+
      '<div class="dial-box"><h4>星光罗盘（设定神秘角）</h4>'+
        '<canvas id="pdial" width="190" height="190" style="touch-action:none"></canvas>'+
        '<div class="fine"><button data-d="-1">－1°</button><button data-d="1">＋1°</button></div>'+
        '<div class="dial-read" id="pread">30°</div></div>'+
    '</div>'+
    '<div class="row"><button class="btn" id="pcheck">检查拼角</button></div>'+
    '<p class="msg" id="pmsg">提示：把角块拖到上面的平角尺上（已拼上的角块可以点击取回）。</p>';
  var mAng=30;
  var placed=[];
  /* 平角尺绘制 */
  function drawStrip(){
    var cv=$('#strip'),ctx=cv.getContext('2d');
    var W=cv.width,H=cv.height;
    ctx.clearRect(0,0,W,H);
    var cx=W/2,cy=130;
    line(ctx,cx-280,cy,cx+280,cy,5,'#546e7a');
    /* 每 10° 一格刻度，位置线性对应角度 */
    for(var a=0;a<=180;a+=10){
      var x=cx+Math.cos(a*Math.PI/180)*260;
      var h=(a%30===0)?16:9;
      line(ctx,x,cy,x,cy-h,2.5,'#78909c');
      if(a%30===0)txt(ctx,a+'°',x,cy+20,{size:16,color:'#607d8b'});
    }
    txt(ctx,'平角 180°',90,24,{size:19,color:P.c1});
    var total=0;
    placed.forEach(function(k){
      var c=chips.find(function(x){return x.key===k;});
      var ang=(k==='M')?mAng:c.ang;
      var phi1=total*Math.PI/180,phi2=(total+ang)*Math.PI/180;
      ctx.save();ctx.globalAlpha=0.5;ctx.fillStyle=c.color;
      sectorPath(ctx,cx,cy,84,phi1,phi2);ctx.fill();
      ctx.globalAlpha=1;ctx.strokeStyle=c.color;ctx.lineWidth=3;
      sectorPath(ctx,cx,cy,84,phi1,phi2);ctx.stroke();ctx.restore();
      var mid=(total+ang/2)*Math.PI/180;
      txt(ctx,ang+'°',cx+Math.cos(mid)*56,cy-Math.sin(mid)*56,{size:17,color:'#37474f'});
      total+=ang;
    });
    txt(ctx,'已拼 '+total+'° / 180°',W-90,24,{size:18,color:total===180?'#2e7d32':'#546e7a'});
    if(placed.length===3&&total===180){
      txt(ctx,'三个角正好拼成平角——内角和是 180°！',cx,H-12,{size:18,color:'#2e7d32'});
    }
  }
  /* 角块绘制（显示当前角度的扇形） */
  function renderChip(key){
    var box=area.querySelector('[data-chip="'+key+'"]');
    if(!box)return;
    var cv=box.querySelector('canvas'),ctx=cv.getContext('2d');
    ctx.clearRect(0,0,cv.width,cv.height);
    var c=chips.find(function(x){return x.key===key;});
    var ang=(key==='M')?mAng:c.ang;
    ctx.save();ctx.globalAlpha=0.5;ctx.fillStyle=c.color;
    sectorPath(ctx,16,cv.height-12,54,0,ang*Math.PI/180);ctx.fill();
    ctx.globalAlpha=1;ctx.strokeStyle=c.color;ctx.lineWidth=3;
    sectorPath(ctx,16,cv.height-12,54,0,ang*Math.PI/180);ctx.stroke();ctx.restore();
    var half=ang*Math.PI/360;
    txt(ctx,ang+'°',16+Math.cos(half)*34+6,cv.height-12-Math.sin(half)*34-4,{size:17,color:'#37474f'});
  }
  /* 汇总当前已拼总度数 */
  function totalPlaced(){
    var total=0;
    placed.forEach(function(k){
      var c=chips.find(function(x){return x.key===k;});
      total+=(k==='M')?mAng:c.ang;
    });
    return total;
  }
  function checkDone(silent){
    var total=totalPlaced();
    if(placed.length===3&&total===180){
      $('#pmsg').textContent='完美！'+pr.A+'°+'+pr.B+'°+'+mAng+'°=180°，三角形内角和就是 180°！';
      $('#pmsg').className='msg good';
      advanceRound();
      return;
    }
    if(total>180&&!silent){
      $('#pmsg').textContent='超过 180° 啦！把神秘角调小一点。';
      $('#pmsg').className='msg bad';
    }
  }
  /* 罗盘（0~180 连续调节，用于设定神秘角） */
  var dial=buildDial($('#pdial'),180,30,function(v){
    mAng=v;$('#pread').textContent=v+'°';
    renderChip('M');drawStrip();checkDone(false);
  });
  area.querySelectorAll('.fine button').forEach(function(b){
    b.addEventListener('click',function(){
      dial.set(Math.max(5,Math.min(175,mAng+parseInt(b.getAttribute('data-d'),10))));
    });
  });
  /* 生成三个角块 */
  chips.forEach(function(c){
    var el=document.createElement('div');
    el.className='chip';el.setAttribute('data-chip',c.key);
    el.innerHTML='<canvas width="150" height="96"></canvas><div class="cap">'+c.name+'</div>';
    $('#chips').appendChild(el);
    renderChip(c.key);
    floatDrag(el,{
      canDrag:function(){return placed.indexOf(c.key)<0;},
      targets:function(){return [{el:$('#strip')}];},
      onDrop:function(t){
        if(!t)return 'back';
        var ang=(c.key==='M')?mAng:c.ang;
        if(totalPlaced()+ang>180){
          $('#pmsg').textContent='超过 180° 啦！平角尺装不下，先取回一些角块或调小神秘角。';
          $('#pmsg').className='msg bad';
          return 'back';
        }
        addStep();
        placed.push(c.key);
        el.classList.add('placed');
        $('#pmsg').textContent=c.name+'（'+ang+'°）拼上去了！';
        $('#pmsg').className='msg good';
        drawStrip();
        checkDone(true);
        return 'back';
      }
    });
    el.addEventListener('click',function(){
      var i=placed.indexOf(c.key);
      if(i<0)return;
      placed.splice(i,1);
      el.classList.remove('placed');
      drawStrip();
      $('#pmsg').textContent=c.name+'已取回，重新拼一拼。';
      $('#pmsg').className='msg';
    });
  });
  $('#pcheck').addEventListener('click',function(){
    addStep();
    var total=totalPlaced();
    if(placed.length<3){
      $('#pmsg').textContent='还有 '+(3-placed.length)+' 块角没拼上去，先把角块都拖上去。';
      $('#pmsg').className='msg bad';
    }else if(total<180){
      $('#pmsg').textContent='现在拼了 '+total+'°，还差 '+(180-total)+'° 没铺满——把神秘角调大一点！';
      $('#pmsg').className='msg bad';
    }else{
      $('#pmsg').textContent='正好 180°！';
      $('#pmsg').className='msg good';
    }
  });
  drawStrip();
}

/* =====================================================================
   引擎五：智慧罗盘（角度计算 · 转罗盘设角，覆盖等腰/和倍/和差/多边形/周角）
   ===================================================================== */
function buildDial(cv,max,init,cb){
  var ctx=cv.getContext('2d');
  var val=init;
  function draw(){
    var W=cv.width,H=cv.height,cx=W/2,cy=H/2;
    ctx.clearRect(0,0,W,H);
    ctx.save();ctx.fillStyle='#fff8ef';
    ctx.beginPath();ctx.arc(cx,cy,84,0,6.29);ctx.fill();
    ctx.strokeStyle=P.ac;ctx.lineWidth=6;
    ctx.beginPath();ctx.arc(cx,cy,84,0,6.29);ctx.stroke();ctx.restore();
    for(var i=0;i<12;i++){
      var a=i*30*Math.PI/180;
      var r1=76,r2=(i%3===0)?60:67;
      line(ctx,cx+Math.cos(a)*r1,cy+Math.sin(a)*r1,cx+Math.cos(a)*r2,cy+Math.sin(a)*r2,3,'#8d6e63');
      if(i%3===0){
        txt(ctx,String(Math.round(i*30/360*max)),cx+Math.cos(a)*48,cy+Math.sin(a)*48,{size:16,color:'#6d4c41'});
      }
    }
    var na=val/max*360*Math.PI/180;
    line(ctx,cx,cy,cx+Math.cos(na)*72,cy+Math.sin(na)*72,6,'#e53935');
    dot(ctx,cx,cy,9,'#37474f');
    txt(ctx,val+'°',cx,cy+34,{size:16,color:P.c1});
  }
  function setFromEvent(ev){
    var rect=cv.getBoundingClientRect();
    var x=(ev.clientX-rect.left)*(cv.width/rect.width)-cv.width/2;
    var y=(ev.clientY-rect.top)*(cv.height/rect.height)-cv.height/2;
    var deg=Math.atan2(y,x)*180/Math.PI;
    if(deg<0)deg+=360;
    val=Math.max(0,Math.min(max,Math.round(deg/360*max)));
    draw();cb(val);
  }
  var drag=false;
  cv.addEventListener('pointerdown',function(ev){drag=true;setFromEvent(ev);ev.preventDefault();});
  cv.addEventListener('pointermove',function(ev){if(drag)setFromEvent(ev);});
  window.addEventListener('pointerup',function(){drag=false;});
  draw();
  return {
    get:function(){return val;},
    set:function(v){val=Math.max(0,Math.min(max,v));draw();cb(val);}
  };
}
function renderDialFigure(cv,r){
  var ctx=cv.getContext('2d');
  var W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);
  if(r.kind==='iso'){
    /* 等腰三角形：顶角80°在两条等腰边之间（记号相同），底角为所求 */
    var t1=triFromAngles(80,50,50,150);
    var pts=fitPts([t1.A,t1.B,t1.C],W,H,70);
    drawTriFigure(ctx,pts,{angleTexts:['80°','?','?'],arcAccent:[false,true,true],ticks:[2,1,2]});
    txt(ctx,'相同记号的边相等（等腰三角形）',W/2,H-20,{size:17,color:'#546e7a'});
  }else if(r.kind==='mul4'){
    var t2=triFromAngles(75,84,21,150);
    var pts2=fitPts([t2.A,t2.B,t2.C],W,H,80);
    drawTriFigure(ctx,pts2,{angleTexts:['75°','∠B=4×∠C','?'],arcAccent:[false,false,true],longText:[false,true,false]});
    txt(ctx,'∠A=75°，∠B 是 ∠C 的 4 倍',W/2,H-20,{size:18,color:'#546e7a'});
  }else if(r.kind==='sumdiff'){
    var t3=triFromAngles(80,45,55,150);
    var pts3=fitPts([t3.A,t3.B,t3.C],W,H,80);
    drawTriFigure(ctx,pts3,{angleTexts:['∠A-∠B=35°','?','55°'],arcAccent:[false,true,false],longText:[true,false,false]});
    txt(ctx,'∠C=55°，∠A 比 ∠B 大 35°',W/2,H-20,{size:18,color:'#546e7a'});
  }else if(r.kind==='quad'){
    /* 四边形：三个角已知，求 ∠A */
    var q=[{x:150,y:140},{x:520,y:105},{x:545,y:320},{x:135,y:345}];
    ctx.save();ctx.globalAlpha=0.15;ctx.fillStyle=P.c2;
    ctx.beginPath();ctx.moveTo(q[0].x,q[0].y);
    for(var i=1;i<4;i++)ctx.lineTo(q[i].x,q[i].y);
    ctx.closePath();ctx.fill();ctx.restore();
    for(var j=0;j<4;j++){
      var a=q[j],b=q[(j+1)%4];
      line(ctx,a.x,a.y,b.x,b.y,5,j===0?P.ac:P.c1);
    }
    var labs=['?','90°','70°','60°'];
    var offs=[[34,38],[-30,34],[-34,-8],[40,-18]];
    for(var m=0;m<4;m++){
      txt(ctx,labs[m],q[m].x+offs[m][0],q[m].y+offs[m][1],
          {size:m===0?24:18,color:m===0?P.ac:'#37474f'});
    }
    var nm=['A','B','C','D'];
    var nout=[[-16,-16],[16,-16],[16,16],[-16,16]];
    for(var n=0;n<4;n++)txt(ctx,nm[n],q[n].x+nout[n][0],q[n].y+nout[n][1],{size:20,color:'#37474f'});
    txt(ctx,'四边形内角和 =(4-2)×180°=360°',W/2,H-20,{size:18,color:'#546e7a'});
  }else if(r.kind==='reflex'){
    /* 周角：绕点 O 一周 360°，三个角合起来是周角 */
    var cx=W/2,cy=250;
    var rays=[0,120,210];
    var names=['A','','B'];
    rays.forEach(function(a,i){
      var rad=a*Math.PI/180;
      var ex=cx+Math.cos(rad)*185,ey=cy-Math.sin(rad)*185;
      line(ctx,cx,cy,ex,ey,5,P.c1);
      if(names[i])txt(ctx,names[i],ex+Math.cos(rad)*24,ey-Math.sin(rad)*24,{size:20,color:'#37474f'});
    });
    dot(ctx,cx,cy,7,'#37474f');
    txt(ctx,'O',cx-16,cy+6,{size:20,color:'#37474f'});
    function arcLabel(a1,a2,label,color,rr){
      var p1=a1*Math.PI/180,p2=a2*Math.PI/180;
      ctx.save();ctx.strokeStyle=color;ctx.lineWidth=3;
      ctx.beginPath();
      var steps=28;
      for(var s2=0;s2<=steps;s2++){
        var p=p1+(p2-p1)*s2/steps;
        var x=cx+Math.cos(p)*rr,y=cy-Math.sin(p)*rr;
        if(s2===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      }
      ctx.stroke();ctx.restore();
      var mid=(p1+p2)/2;
      txt(ctx,label,cx+Math.cos(mid)*(rr+24),cy-Math.sin(mid)*(rr+24),{size:18,color:color});
    }
    arcLabel(4,116,'120°','#37474f',58);
    arcLabel(124,206,'90°','#37474f',78);
    arcLabel(214,356,'?',P.ac,58);
    txt(ctx,'绕点 O 一周是周角 360°',W/2,H-20,{size:18,color:'#546e7a'});
  }
}
function renderDial(stage){
  var r=stage.rounds[G.round];
  var area=$('#stage-area');
  area.innerHTML=
    roundsTag(stage)+
    '<p class="qtext">'+r.q+'</p>'+
    '<canvas id="dfig" class="fig" width="680" height="400"></canvas>'+
    '<div class="row">'+
      '<div class="dial-box"><h4>星光罗盘（0～'+r.max+'°）</h4>'+
      '<canvas id="ddial" width="190" height="190" style="touch-action:none"></canvas>'+
      '<div class="fine"><button data-d="-1">－1°</button><button data-d="1">＋1°</button></div>'+
      '<div class="dial-read" id="dread">10°</div></div>'+
      '<button class="btn big" id="dgo">确认角度</button>'+
    '</div>'+
    '<p class="msg" id="dmsg">转动罗盘（或用 ＋1° / －1° 微调），转到正确度数后按【确认角度】。</p>';
  renderDialFigure($('#dfig'),r);
  var dial=buildDial($('#ddial'),r.max,10,function(v){$('#dread').textContent=v+'°';});
  area.querySelectorAll('.fine button').forEach(function(b){
    b.addEventListener('click',function(){
      dial.set(dial.get()+parseInt(b.getAttribute('data-d'),10));
    });
  });
  $('#dgo').addEventListener('click',function(){
    if(G.busy)return;
    addStep();
    if(dial.get()===r.ans){
      $('#dmsg').textContent='完全正确！答案是 '+r.ans+'°。';
      $('#dmsg').className='msg good';
      advanceRound();
    }else{
      $('#dgo').classList.add('shake');setTimeout(function(){$('#dgo').classList.remove('shake');},480);
      $('#dmsg').textContent='现在转到了 '+dial.get()+'°。提示：'+r.hint;
      $('#dmsg').className='msg bad';
    }
  });
}

/* =====================================================================
   引擎六：三明治工坊（等腰 + 周长 12 + 整数边 · 试搭并收集全部搭法）
   ===================================================================== */
function renderCollect(stage){
  var r=stage.rounds[0];
  var area=$('#stage-area');
  area.innerHTML=
    '<p class="qtext">'+r.q+'</p>'+
    '<div class="slots">'+
      '<div class="slot" data-slot="0"><h4>腰 1</h4><div class="sbar empty">空</div></div>'+
      '<div class="slot" data-slot="1"><h4>腰 2</h4><div class="sbar empty">空</div></div>'+
      '<div class="slot" data-slot="2"><h4>底</h4><div class="sbar empty">空</div></div>'+
    '</div>'+
    '<p class="hint-line">木料架（1～6 cm，可反复取用）</p>'+
    '<div class="rack" id="crack"></div>'+
    '<div class="row"><button class="btn big" id="cgo">试搭一下</button></div>'+
    '<canvas id="ccv" class="fig" width="680" height="330"></canvas>'+
    '<p class="msg" id="cmsg">先把木条拖进三个槽（槽里的木条会被替换），再按【试搭一下】。</p>'+
    '<div class="album" id="album"></div>';
  var vals=[0,0,0];
  var v;
  for(v=1;v<=6;v++){
    (function(val){
      var el=document.createElement('div');
      el.className='stick';
      el.style.width=(44+val*26)+'px';
      el.innerHTML='<span>'+val+' cm</span>';
      $('#crack').appendChild(el);
      floatDrag(el,{
        targets:function(){return $$('.slot').map(function(e){return {el:e};});},
        onDrop:function(t){
          if(!t)return 'back';
          var si=parseInt(t.el.getAttribute('data-slot'),10);
          vals[si]=val;
          var bar=t.el.querySelector('.sbar');
          bar.className='sbar';
          bar.style.width=Math.min(160,44+val*26)+'px';
          bar.style.margin='10px auto 0';
          bar.textContent=val+' cm';
          return 'back';
        }
      });
    })(v);
  }
  function renderAlbum(){
    var al=$('#album');
    al.innerHTML='';
    var labels=['组合 1','组合 2'];
    for(var i=0;i<2;i++){
      var card=document.createElement('div');
      card.className='slotcard';
      if(r.found[i]){
        card.innerHTML='<h4>'+labels[i]+'（已收集）</h4><canvas width="280" height="210"></canvas>'+
          '<div>腰 '+r.found[i][0]+' · 腰 '+r.found[i][0]+' · 底 '+r.found[i][1]+'</div>';
        var sides=[r.found[i][0],r.found[i][0],r.found[i][1]];
        var g=bridgeGeom(sides,280,210,70);
        drawBridgeFrame(card.querySelector('canvas').getContext('2d'),g,1,true,true);
      }else{
        card.innerHTML='<h4>'+labels[i]+'（待收集）</h4><div style="font-size:44px;color:#cfd8dc;padding:18px 0">？</div>';
      }
      al.appendChild(card);
    }
  }
  renderAlbum();
  var cctx=$('#ccv').getContext('2d');
  cctx.clearRect(0,0,680,330);
  txt(cctx,'试搭结果会显示在这里',340,165,{size:19,color:'#90a4ae'});
  $('#cgo').addEventListener('click',function(){
    if(G.busy)return;
    addStep();
    var msg=$('#cmsg');
    if(!vals[0]||!vals[1]||!vals[2]){
      msg.textContent='三个槽都要放木条哦！';msg.className='msg bad';return;
    }
    if(vals[0]!==vals[1]){
      msg.textContent='两根腰要一样长——等腰三角形有两条相等的边。';msg.className='msg bad';return;
    }
    var y=vals[0],bse=vals[2],peri=2*y+bse;
    if(peri!==12){
      msg.textContent='三明治的周长都是 12：现在两腰+底 = '+peri+'，调整一下木条。';msg.className='msg bad';return;
    }
    var sides=[y,y,bse];
    var g=bridgeGeom(sides,680,330,90);
    cctx.clearRect(0,0,680,330);
    drawBridgeFrame(cctx,g,1,true,false);
    if(!g.valid){
      msg.textContent='腰 '+y+'、底 '+bse+'：'+y+'+'+y+'='+(2*y)+' 不大于 '+bse+'，两边之和不大于第三边，钉不成三角形！';
      msg.className='msg bad';return;
    }
    var dup=r.found.some(function(f){return f[0]===y&&f[1]===bse;});
    if(dup){
      msg.textContent='腰 '+y+'、底 '+bse+' 能钉成等腰三角形，不过这个搭法已经收集过啦，再想想别的！';
      msg.className='msg bad';return;
    }
    r.found.push([y,bse]);
    r.found.sort(function(a,b){return b[0]-a[0];});
    renderAlbum();
    msg.textContent='收集成功！腰 '+y+'、腰 '+y+'、底 '+bse+'（周长 '+(2*y+bse)+'）。已收集 '+r.found.length+'/2 种。';
    msg.className='msg good';
    if(r.found.length>=2){
      msg.textContent='全部搭法收集完成！等腰三角形三明治一共有 2 种。';
      setTimeout(advanceRound,900);
    }
  });
}

/* ---------------- 关卡轮次标签 ---------------- */
function roundsTag(stage){
  if(stage.rounds.length>1){
    return '<span class="round-tag">第 '+(G.round+1)+' / '+stage.rounds.length+' 轮</span>';
  }
  return '';
}
