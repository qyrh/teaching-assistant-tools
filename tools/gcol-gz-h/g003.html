<script>"use strict";function $(sel){return document.querySelector(sel)}function $all(sel){return Array.prototype.slice.call(document.querySelectorAll(sel))}function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}function fmtTime(sec){var m=Math.floor(sec/60),s=sec%60;return(m<10?"0"+m:""+m)+":"+(s<10?"0"+s:""+s)}function logb(b,x){return Math.log(x)/Math.log(b)}function fmtVal(v){return Math.abs(v-Math.round(v))<1e-9?String(Math.round(v)):v.toFixed(4)}function fmtX(v){return Math.abs(v-Math.round(v))<1e-9?String(Math.round(v)):v.toFixed(2)}function subHTML(base){return'<sub class="eq-sub">'+base+"</sub>"}var PALETTES=[{name:"活力橙",bg:"#FFF7ED",panel:"#FFEDD5",accent:"#EA580C",accent2:"#0369A1"},{name:"森林绿",bg:"#F0FDF4",panel:"#DCFCE7",accent:"#15803D",accent2:"#B45309"},{name:"海洋蓝",bg:"#EFF6FF",panel:"#DBEAFE",accent:"#1D4ED8",accent2:"#BE185D"},{name:"葡萄紫",bg:"#FAF5FF",panel:"#F3E8FF",accent:"#6D28D9",accent2:"#047857"},{name:"玫瑰红",bg:"#FFF1F2",panel:"#FFE4E6",accent:"#BE123C",accent2:"#0E7490"}];var currentPalette=PALETTES[2];function applyPalette(){currentPalette=PALETTES[Math.floor(Math.random()*PALETTES.length)];var r=document.documentElement.style;r.setProperty("--bg",currentPalette.bg);r.setProperty("--panel",currentPalette.panel);r.setProperty("--accent",currentPalette.accent);r.setProperty("--accent2",currentPalette.accent2);$("#paletteTag").textContent="本局主题色："+currentPalette.name}var S={diff:null,rounds:[],idx:0,steps:0,stars:0,t0:0,timer:null,playing:false,roundLock:false,revealed:false};function cur(){return S.rounds[S.idx]}function bumpSteps(){S.steps++;$("#hudSteps").textContent=S.steps}function updateHud(){$("#hudSteps").textContent=S.steps;$("#hudStars").textContent=S.stars;if(S.playing&&cur()){$("#hudProgress").textContent="第 "+(S.idx+1)+" / "+S.rounds.length+" 关 · "+cur().station}}var drag=null;function enableDrag(el,payload,tryDrop){el.style.touchAction="none";el.addEventListener("pointerdown",function(ev){if(S.roundLock||el.classList.contains("used")||drag)return;ev.preventDefault();var rect=el.getBoundingClientRect();var ghost=el.cloneNode(true);ghost.className=el.className+" ghost-card";ghost.style.width=rect.width+"px";ghost.style.height=rect.height+"px";document.body.appendChild(ghost);drag={el,payload,ghost,tryDrop,dx:ev.clientX-rect.left,dy:ev.clientY-rect.top};el.classList.add("drag-src");try{el.setPointerCapture(ev.pointerId)}catch(e){}moveGhost(ev.clientX,ev.clientY)});el.addEventListener("pointermove",function(ev){if(!drag||drag.el!==el)return;ev.preventDefault();moveGhost(ev.clientX,ev.clientY);hoverSlot(ev.clientX,ev.clientY)});el.addEventListener("pointerup",function(ev){if(!drag||drag.el!==el)return;finishDrag(ev.clientX,ev.clientY)});el.addEventListener("pointercancel",function(){if(!drag||drag.el!==el)return;cancelDrag()})}function moveGhost(x,y){drag.ghost.style.left=x-drag.dx+"px";drag.ghost.style.top=y-drag.dy+"px"}function hoverSlot(x,y){$all(".drop-slot").forEach(function(s){s.classList.remove("hover")});var slot=slotAt(x,y);if(slot)slot.classList.add("hover")}function slotAt(x,y){var el=document.elementFromPoint(x,y);if(!el)return null;var slot=el.closest?el.closest(".drop-slot"):null;if(slot&&!slot.classList.contains("filled")&&slot.classList.contains("ready"))return slot;return null}function finishDrag(x,y){var d=drag;drag=null;d.ghost.remove();d.el.classList.remove("drag-src");$all(".drop-slot").forEach(function(s){s.classList.remove("hover")});if(S.roundLock)return;var slot=slotAt(x,y);bumpSteps();var consumed=false;if(slot)consumed=d.tryDrop(slot,d.payload,d.el);if(!consumed){d.el.classList.add("shake-back");setTimeout(function(){d.el.classList.remove("shake-back")},350)}}function cancelDrag(){if(drag){drag.ghost.remove();drag.el.classList.remove("drag-src")}drag=null;$all(".drop-slot").forEach(function(s){s.classList.remove("hover")})}function fillSlot(slot,html,payload,cardEl,onRemove){slot.classList.add("filled");var chip=document.createElement("div");chip.className="chip";chip.innerHTML=html;slot.appendChild(chip);slot._payload=payload||null;slot._card=cardEl||null;if(cardEl)cardEl.classList.add("used");if(onRemove){chip.addEventListener("click",function(){if(S.roundLock)return;clearSlot(slot);onRemove()})}}function clearSlot(slot){slot.classList.remove("filled");slot.innerHTML="";if(slot._card)slot._card.classList.remove("used");slot._card=null;slot._payload=null}function dotsHTML(){var h='<div class="dots">';S.rounds.forEach(function(r,i){var cls="dot";if(i<S.idx)cls+=" done";if(i===S.idx)cls+=" cur";h+='<span class="'+cls+'"></span>'});return h+"</div>"}function roundHeader(r){return'<div class="round-head"><span class="station-tag">'+r.station+'</span><span class="round-title">'+r.title+"</span></div>"}var POUCH={conv:"互化公式：a<sup>b</sup> = N ⇔ log<sub>a</sub>N = b（a&gt;0 且 a≠1，N&gt;0）。底数仍是底数；幂 N 变成真数；指数 b 变成对数的值。常用结论：log<sub>a</sub>1 = 0，log<sub>a</sub>a = 1，负数和 0 没有对数。",merge:"运算性质：log<sub>a</sub>(MN) = log<sub>a</sub>M + log<sub>a</sub>N；log<sub>a</sub>(M÷N) = log<sub>a</sub>M − log<sub>a</sub>N；log<sub>a</sub>M<sup>n</sup> = n·log<sub>a</sub>M。换底接力：log<sub>a</sub>b × log<sub>b</sub>c = log<sub>a</sub>c（后一块的底数 = 前一块的真数）。",two:"换底小助手：log<sub>4</sub>3 = ½log<sub>2</sub>3，log<sub>8</sub>3 = ⅓log<sub>2</sub>3，log<sub>9</sub>2 = ½log<sub>3</sub>2（底数开平方，对数变一半）。不同底相加，先把它们换到同一个底。",repair:"解对数方程两步走：第一步 化同底，把对数式改写成幂的等式解出 x；第二步 检验每个真数必须大于 0，负数或 0 对应的根是增根，必须舍去。",tower:"香农公式：C = W·log<sub>2</sub>(1 + S/N)。换底：log<sub>2</sub>x = lg x ÷ lg 2。附：lg 2 ≈ 0.3010，lg 5 ≈ 0.699，lg 1000 = 3。"};function pouchHTML(r){var body=POUCH[r.type]||POUCH.conv;return'<div class="pouch"><button class="btn btn-mini" id="btnPouch">打开知识锦囊</button><div class="pouch-body hidden" id="pouchBody">'+body+"</div></div>"}function wirePouch(){var b=$("#btnPouch");if(!b)return;b.addEventListener("click",function(){var p=$("#pouchBody");p.classList.toggle("hidden");b.textContent=p.classList.contains("hidden")?"打开知识锦囊":"收起知识锦囊"})}function setFeedback(t,cls){var el=$("#msg");if(!el){el=document.createElement("div");el.id="msg";var wrap=$("#feedbackWrap");if(wrap)wrap.parentNode.insertBefore(el,wrap);else $("#stage").appendChild(el)}el.innerHTML=t;el.className="msg "+(cls||"")}function starStr(n){var s="";for(var i=0;i<3;i++)s+=i<n?"★":"☆";return s}function finishRound(r,solHTML){S.roundLock=true;var st=S.revealed?0:r.fails===0?3:r.fails<=2?2:1;S.stars+=st;updateHud();var last=S.idx===S.rounds.length-1;$("#feedbackWrap").innerHTML='<div class="banner-ok"><div class="star-row">'+starStr(st)+'</div><div class="banner-msg">'+(S.revealed?"已揭示答案，本关不计星星":"本关通过，干得漂亮！")+'</div><div class="sol-panel"><div class="sol-title">本关详解</div>'+solHTML+'</div><button class="btn btn-primary" id="btnNext">'+(last?"查看战绩":"下一关")+"</button></div>";var nb=$("#btnNext");nb.addEventListener("click",nextRound);nb.scrollIntoView({behavior:"smooth",block:"nearest"})}function nextRound(){S.idx++;if(S.idx>=S.rounds.length){celebrate();return}renderRound()}function convRound(o){return{type:"conv",station:"互化车间",title:"指数式 ⇄ 对数式",a:o.a,b:o.b,N:o.N,dir:o.dir,blanks:o.blanks,extras:o.extras,prompt:o.prompt,sol:o.sol,fails:0}}function mergeRound(o){o.blocks.forEach(function(b){b.num=logb(b.base,b.arg)});o.type="merge";o.fails=0;return o}function mkFn(code){return new Function("x","return "+code+";")}function repairRound(o){o.type="repair";o.fails=0;o.terms.forEach(function(t){t.fn=mkFn(t.code)});return o}function R_c1(){return convRound({a:"2",b:"3",N:"8",dir:"e2l",blanks:["N","b"],extras:["6","5"],prompt:"已知左边的指数式：2 的 3 次幂等于 8。请把它翻译成右边的对数式：从能量珠里选出正确的两颗，拖进对数式的空槽（拖对才会嵌入）。",sol:"互化要点：底数仍是 2；幂 8 在对数式里叫真数；指数 3 就是对数的值，所以 log<sub>2</sub>8 = 3。"})}function R_c2(){return convRound({a:"5",b:"2",N:"25",dir:"e2l",blanks:["N","b"],extras:["10","125"],prompt:"已知指数式：5 的 2 次幂等于 25。请翻译成对数式：把正确的两颗能量珠拖进空槽。",sol:"因为 5<sup>2</sup> = 25，所以 log<sub>5</sub>25 = 2。"})}function R_c3(){return convRound({a:"3",b:"3",N:"27",dir:"l2e",blanks:["b","N"],extras:["2","9"],prompt:"已知对数式 log<sub>3</sub>27 = 3（读作：以 3 为底 27 的对数等于 3）。请把它翻译成指数式：把正确的两颗能量珠拖进指数式的空槽。",sol:"log<sub>3</sub>27 = 3 说明 3 的 3 次幂等于 27，即 3<sup>3</sup> = 27。"})}function R_c4(){return convRound({a:"3",b:"1",N:"3",dir:"e2l",blanks:["N","b"],extras:["0","27"],prompt:"已知指数式：3 的 1 次幂等于 3（教参例1 选项 D 的原型）。请翻译成对数式。",sol:"3<sup>1</sup> = 3 ⇒ log<sub>3</sub>3 = 1（底数的对数等于 1）。"})}function R_c5(){return convRound({a:"2",b:"2",N:"4",dir:"l2e",blanks:["b","N"],extras:["16","8"],prompt:"已知对数式 log<sub>2</sub>4 = 2（教参例1 选项 B 的原型）。请把它翻译成指数式。",sol:"log<sub>2</sub>4 = 2 ⇒ 2<sup>2</sup> = 4。"})}function R_c6(){return convRound({a:"2",b:"−2",N:"1/4",dir:"e2l",blanks:["N","b"],extras:["4","1/2"],prompt:"进阶挑战：已知指数式 2 的 −2 次幂等于 1/4（负指数表示取倒数）。请翻译成对数式。",sol:"2<sup>−2</sup> = 1/4 ⇒ log<sub>2</sub>(1/4) = −2（负指数 = 取倒数）。"})}function R_c7(){return convRound({a:"e",b:"0",N:"1",dir:"e2l",blanks:["N","b"],extras:["e","10"],prompt:"已知指数式 e 的 0 次幂等于 1（教参例1 选项 A 的原型，e ≈ 2.71828 是自然对数的底）。请翻译成自然对数式 ln。",sol:"e<sup>0</sup> = 1 ⇒ ln 1 = 0（1 的对数等于 0；ln 是以 e 为底的自然对数）。"})}function R_c8(){return convRound({a:"10",b:"−1",N:"1/10",dir:"e2l",blanks:["N","b"],extras:["10","1/100"],prompt:"已知指数式 10 的 −1 次幂等于 1/10。请翻译成常用对数式 lg（以 10 为底）。",sol:"10<sup>−1</sup> = 1/10 ⇒ lg(1/10) = −1（lg 是以 10 为底的常用对数）。"})}function R_c9(){return convRound({a:"4",b:"−1/2",N:"1/2",dir:"l2e",blanks:["b","N"],extras:["2","1/4"],prompt:"高难翻译：已知对数式 log<sub>4</sub>(1/2) = −1/2。请把它翻译成指数式（分数指数也是指数！）。",sol:"log<sub>4</sub>(1/2) = −1/2 ⇒ 4<sup>−1/2</sup> = 1/√4 = 1/2。"})}function R_c10(){return convRound({a:"27",b:"1/3",N:"3",dir:"e2l",blanks:["N","b"],extras:["9","1/9"],prompt:"已知指数式 27 的 1/3 次幂等于 3（开立方对应指数 1/3）。请翻译成对数式。",sol:"27<sup>1/3</sup> = 3 ⇒ log<sub>27</sub>3 = 1/3。"})}function R_m1(){return mergeRound({station:"合成台",title:"加法合成器",mode:"add",slots:2,blocks:[{id:"lg2",label:"lg 2",base:10,arg:2},{id:"lg5",label:"lg 5",base:10,arg:5},{id:"lg3",label:"lg 3",base:10,arg:3}],correct:["lg2","lg5"],target:1,targetLabel:"1",prompt:"加法合成器启动！同底对数相加 = 真数相乘：log<sub>a</sub>M + log<sub>a</sub>N = log<sub>a</sub>(MN)。请从积木中选两块放进合成器，让合成值恰好等于目标 1。",sol:"lg 2 + lg 5 = lg(2×5) = lg 10 = 1。这正是常用对数的基本结论 lg 10 = 1 的运用。"})}function R_m2(){return mergeRound({station:"链式合成轨道",title:"链式乘法合成器",mode:"chain",slots:2,blocks:[{id:"l23",label:"log<sub>2</sub>3",base:2,arg:3},{id:"l34",label:"log<sub>3</sub>4",base:3,arg:4},{id:"l35",label:"log<sub>3</sub>5",base:3,arg:5}],correct:["l23","l34"],target:2,targetLabel:"2",prompt:"链式合成轨道开通！换底接力公式：log<sub>a</sub>b × log<sub>b</sub>c = log<sub>a</sub>c（后一块的底数必须等于前一块的真数，链条才能接上）。请选两块积木接成链条，使乘积等于 2（教参例2 同型）。",sol:'log<sub>2</sub>3 × log<sub>3</sub>4 = log<sub>2</sub>4 = 2。前一块的真数 3 恰好是后一块的底数 3，换底"约分"成功。'})}function R_m3(){return mergeRound({station:"链式合成轨道",title:"链式乘法合成器",mode:"chain",slots:2,blocks:[{id:"l48",label:"log<sub>4</sub>8",base:4,arg:8},{id:"l84",label:"log<sub>8</sub>4",base:8,arg:4},{id:"l26",label:"log<sub>2</sub>6",base:2,arg:6}],correct:["l48","l84"],target:1,targetLabel:"1",prompt:"再接一节链条：选出两块积木相乘，让乘积等于目标 1。想一想 log<sub>4</sub>8 与 log<sub>8</sub>4 的数值分别是多少（3/2 和 2/3）？",sol:'log<sub>4</sub>8 × log<sub>8</sub>4 = log<sub>4</sub>4 = 1。数值上正是 3/2 × 2/3 = 1，这就是换底公式的"约分"推论：log<sub>a</sub>b × log<sub>b</sub>a = 1。'})}function R_m4(){return mergeRound({station:"链式合成轨道",title:"三节长链挑战",mode:"chain",slots:3,blocks:[{id:"l23",label:"log<sub>2</sub>3",base:2,arg:3},{id:"l34",label:"log<sub>3</sub>4",base:3,arg:4},{id:"l48",label:"log<sub>4</sub>8",base:4,arg:8},{id:"l35",label:"log<sub>3</sub>5",base:3,arg:5}],correct:["l23","l34","l48"],target:3,targetLabel:"3",prompt:"三节长链来啦！选出三块积木依次接力（前一块的真数 = 后一块的底数），让整条链的乘积等于 3。托盘里有一块积木是接不上的干扰项。",sol:'log<sub>2</sub>3 × log<sub>3</sub>4 × log<sub>4</sub>8 = log<sub>2</sub>8 = 3。三节链条一路"约分"接力到底：2 → 3 → 4 → 8。'})}function R_m5(){return mergeRound({station:"合成台",title:"附加条件 · 整体思想",mode:"add",slots:2,blocks:[{id:"lg2",label:"lg 2",base:10,arg:2},{id:"lg5",label:"lg 5",base:10,arg:5},{id:"lg3",label:"lg 3",base:10,arg:3}],correct:["lg2","lg5"],target:1,targetLabel:"1",prompt:"综合挑战（教参考点4 同型）：已知 2<sup>a</sup> = 5<sup>b</sup> = 10。由 a = log<sub>2</sub>10 换底得 1/a = lg 2；同理 1/b = lg 5。请把正确的两块积木放进加法合成器，合成出 1/a + 1/b 的值（目标 1）。",sol:"a = log<sub>2</sub>10 = lg 10 ÷ lg 2 ⇒ 1/a = lg 2；同理 b = log<sub>5</sub>10 ⇒ 1/b = lg 5。所以 1/a + 1/b = lg 2 + lg 5 = lg 10 = 1（化为同底对数，再用整体思想求值，答案为 1）。"})}function R_m6(){return mergeRound({station:"双层合成塔",title:"双层合成塔 · 换底归一",mode:"two",slots:4,blocks:[{id:"l43",label:"log<sub>4</sub>3",base:4,arg:3},{id:"l83",label:"log<sub>8</sub>3",base:8,arg:3},{id:"l32",label:"log<sub>3</sub>2",base:3,arg:2},{id:"l92",label:"log<sub>9</sub>2",base:9,arg:2},{id:"l34",label:"log<sub>3</sub>4",base:3,arg:4}],correctA:["l43","l83"],correctB:["l32","l92"],target:1.25,targetLabel:"5/4",prompt:'双层合成塔（教参例2 第(4)题原型）：台A 与台B 各放两块积木分别"相加化简"（提示：不同底相加，先用换底公式归到同一个底），再把两台的结果相乘，目标是 5/4。托盘共 5 块积木，其中 1 块是干扰项。',sol:"台A：log<sub>4</sub>3 + log<sub>8</sub>3 = ½log<sub>2</sub>3 + ⅓log<sub>2</sub>3 = 5/6·log<sub>2</sub>3；台B：log<sub>3</sub>2 + log<sub>9</sub>2 = log<sub>3</sub>2 + ½log<sub>3</sub>2 = 3/2·log<sub>3</sub>2 = 3/2 ÷ log<sub>2</sub>3。相乘：5/6 × 3/2 = 5/4（log<sub>2</sub>3 与它的倒数恰好相消）。"})}function R_e1(){return repairRound({station:"方程修复舱",title:"方程检修站",eqHTML:"log<sub>3</sub>(x+2) = 2",rhs:2,rhsLabel:"2",solX:7,terms:[{base:3,code:"x+2",disp:"x+2",sign:1,html:"log<sub>3</sub>(x+2)"}],cards:[{v:"7",x:7},{v:"1",x:1},{v:"−11",x:-11}],prompt:"检修任务：log<sub>3</sub>(x+2) = 2。把候选 x 卡拖到检修口：机器会先检查真数 x+2 是否大于 0，再检查方程两边是否相等。三张卡里只有一张是真正的解！",sol:"第一步：x+2 = 3<sup>2</sup> = 9，得 x = 7。第二步检验：x = 1 时 log<sub>3</sub>3 = 1 ≠ 2；x = −11 时真数 x+2 = −9 &lt; 0，负数没有对数，直接舍去。所以方程的解是 x = 7。"})}function R_e2(){return repairRound({station:"方程修复舱",title:"增根辨析 · 双真数检验",eqHTML:"log<sub>5</sub>(x+1) − log<sub>5</sub>(x−3) = 1",rhs:1,rhsLabel:"1",solX:4,terms:[{base:5,code:"x+1",disp:"x+1",sign:1,html:"log<sub>5</sub>(x+1)"},{base:5,code:"x-3",disp:"x−3",sign:-1,html:"log<sub>5</sub>(x−3)"}],cards:[{v:"4",x:4},{v:"−2",
